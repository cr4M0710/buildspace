<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Budget-Leben · Arbeitslehre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f8;--card:#ffffff;--ink:#12203a;--mut:#56627c;--line:#d5dcea;
  --acc:#2349d6;--acc-ink:#ffffff;--acc-soft:#e1e9ff;
  --tip:#ffe27a;--tip-soft:#fff6d1;--tip-ink:#4a3b00;
  --good:#0f7a43;--good-soft:#d9f4e4;--mid:#8a5a00;--mid-soft:#fff0cc;--bad:#b3261e;--bad-soft:#fde2df;
  --hd:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
  --bd:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c1223;--card:#151e36;--ink:#e8edfb;--mut:#a3aeca;--line:#27324f;--acc:#8fabff;--acc-ink:#0a1126;--acc-soft:#1c2a52;--tip:#ffd84d;--tip-soft:#33290a;--tip-ink:#ffe9a0;--good:#5fd68f;--good-soft:#11301f;--mid:#ffc766;--mid-soft:#352a0d;--bad:#ff8f86;--bad-soft:#381614}
}
:root[data-theme="dark"]{--bg:#0c1223;--card:#151e36;--ink:#e8edfb;--mut:#a3aeca;--line:#27324f;--acc:#8fabff;--acc-ink:#0a1126;--acc-soft:#1c2a52;--tip:#ffd84d;--tip-soft:#33290a;--tip-ink:#ffe9a0;--good:#5fd68f;--good-soft:#11301f;--mid:#ffc766;--mid-soft:#352a0d;--bad:#ff8f86;--bad-soft:#381614}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 var(--bd);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:0 14px 70px}
h1,h2,h3{font-family:var(--hd);line-height:1.12;margin:0 0 .45em;letter-spacing:-.01em}
h1{font-size:clamp(34px,8vw,56px);font-weight:800}
h2{font-size:clamp(24px,5vw,30px);font-weight:800}
h3{font-size:19px;font-weight:700}
p{margin:.5em 0}
.mut{color:var(--mut)}.small{font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;color:var(--ink);background:var(--line);min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--tip);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{background:var(--acc);color:var(--acc-ink)}
.btn.big{display:block;width:100%;padding:15px;font-size:19px;margin-top:14px}
.ghost{background:transparent;border:2px solid var(--line)}
.ib{padding:6px 10px;font-size:20px;min-height:42px;background:var(--card);border:1px solid var(--line)}
/* Kopf: Konto-Leiste wie in einer Banking-App */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin:0 -14px;padding-left:14px;padding-right:14px}
.who{display:flex;gap:10px;align-items:center}.av{font-size:32px;line-height:1}
.who b{font-family:var(--hd);font-size:19px;display:block;line-height:1.1}.who small{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 11px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip.neg{color:var(--bad);border-color:var(--bad)}
.wb{display:flex;gap:8px;align-items:center}.bar{width:70px;height:9px;background:var(--line);border-radius:9px;overflow:hidden;display:inline-block}.bar i{display:block;height:100%;background:var(--good)}
.lv{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.lv i{font-style:normal;color:var(--acc);font-weight:700}
.prog{height:5px;background:var(--line);border-radius:5px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0}
.pill{display:inline-block;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:14px;border-radius:8px;padding:2px 10px;margin-bottom:8px}
.body{font-size:19px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);padding:14px 16px;margin:10px 0;border-radius:14px;font-weight:700;line-height:1.35}
.opt small{display:block;font-weight:400;color:var(--mut);margin-top:3px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}.opt.sel:disabled{opacity:1}
.opt.chk::before{content:'☐ ';font-weight:400}.opt.chk.sel::before{content:'☑ '}
.tipbox{background:var(--tip-soft);border-left:6px solid var(--tip);padding:12px 14px;border-radius:8px;margin:12px 0;color:var(--tip-ink)}
.tipbtn{background:var(--tip);color:#3b2f00}
.calc{background:var(--acc-soft);border-radius:12px;padding:14px;margin:14px 0}
.calc input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);width:150px;background:var(--card);color:var(--ink)}
.fb{border-radius:14px;padding:16px;margin-top:16px;border:2px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}.fb.mid{background:var(--mid-soft);border-color:var(--mid)}.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{margin:0 0 4px}.fb.good h3{color:var(--good)}.fb.mid h3{color:var(--mid)}.fb.bad h3{color:var(--bad)}
.eff{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.eff span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:15px;font-weight:700;color:var(--ink)}
.best{font-style:italic}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1 1 90px;background:var(--card);border:2px solid var(--line);padding:9px 8px}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.ctl{margin:16px 0}.ctl p{margin:2px 0 8px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.avs button{font-size:36px;padding:8px;background:var(--card);border:2px solid var(--line);line-height:1.1}.avs button.on{border-color:var(--acc);background:var(--acc-soft)}
input[type=text],textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc);height:34px}
label.lbl{font-weight:700;display:block;margin:14px 0 4px}
.gl{background:none;border:0;border-bottom:2px dotted var(--acc);border-radius:0;padding:0;min-height:0;font:inherit;font-weight:inherit;color:inherit;cursor:help}
/* Kontoauszug */
.stmt{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 18px 16px;margin:16px 0;position:relative;font-variant-numeric:tabular-nums}
.stmt::before{content:'';position:absolute;left:0;right:0;top:-7px;height:14px;background:radial-gradient(circle at 8px 7px,var(--bg) 5px,transparent 5.5px) 0 0/16px 14px repeat-x}
.stmt table{width:100%;border-collapse:collapse}.stmt td{padding:5px 0;border-bottom:1px dotted var(--line);vertical-align:top}
.stmt td:last-child{text-align:right;white-space:nowrap;font-weight:700;padding-left:12px}
.stmt tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-family:var(--hd);font-size:19px;padding-top:8px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.hero{padding:30px 0 6px}.kicker{color:var(--acc);font-weight:700;font-size:15px;margin-bottom:6px}
.lead{font-size:20px;max-width:34em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}.steps div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.steps b{display:block;font-family:var(--hd);font-size:17px}
.comp{margin:10px 0}.comp .l{display:flex;justify-content:space-between;font-weight:700;font-size:16px}.comp .t{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:3px}.comp .t i{display:block;height:100%;background:var(--acc)}
.badges{display:flex;gap:8px;flex-wrap:wrap}.badges span{background:var(--acc-soft);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);color:var(--ink);max-height:88vh;overflow:auto;width:min(760px,100%);border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.def{margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}.def b{font-family:var(--hd)}
.moments li{margin:8px 0}
ul{padding-left:20px}
@media (prefers-reduced-motion:no-preference){.fb,.stmt{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media print{.top,button,.noprint{display:none!important}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ===== Hilfsfunktionen ===== */
const eur=n=>Math.round(n).toLocaleString('de-DE')+' €';
const L=(a,b,c)=>[a,b,c===undefined?b:c];           // Sprachstufen: einfach / standard / gehoben
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIFFN=['','Leicht','Mittel','Schwer'],CXN=['','Überschaubar','Realistisch','Komplex'],LANGN=['Einfach','Standard','Fachsprache'];
const DM=[0,.75,1,1.3];
const PF={azubi:1,stud:1,dual:1.15,fach:1.6};
const sc=(s,x)=>Math.round(x*DM[s.cur.df]*PF[s.path]/10)*10;   // Beträge je nach Schwierigkeit skalieren
const CATS={vertrag:['📄','Verträge & Kleingedrucktes'],versich:['🛡️','Absicherung & Versicherung'],geld:['🐷','Sparen & Planen'],konsum:['🛒','Konsum & Werbung'],arbeit:['💼','Arbeit & Rechte'],digital:['🔒','Betrug & Sicherheit']};
const PRESET={7:{df:1,lang:0,cx:1},8:{df:2,lang:1,cx:1},9:{df:2,lang:1,cx:2},10:{df:3,lang:2,cx:3}};

const PATHS=[
 {id:'azubi',ic:'🔧',n:'Ausbildung',d:'Du machst eine Ausbildung im Betrieb und gehst in die Berufsschule.',net:920,sub:'Brutto 1.100 € → Netto ca. 920 €',dispo:300,job:true},
 {id:'dual',ic:'🎓',n:'Duales Studium',d:'Praxisphasen im Unternehmen und Studium an der Hochschule.',net:1120,sub:'Brutto 1.350 € → Netto ca. 1.120 €',dispo:500,job:true},
 {id:'fach',ic:'💼',n:'Berufseinstieg',d:'Deine Ausbildung ist fertig. Du arbeitest als Fachkraft.',net:1950,sub:'Brutto 2.700 € → Netto ca. 1.950 €',dispo:1000,job:true},
 {id:'stud',ic:'📚',n:'Studium + Nebenjob',d:'Du studierst und finanzierst dich mit BAföG und einem Nebenjob.',net:950,sub:'BAföG ca. 500 € + Nebenjob ca. 450 €',dispo:300,job:false}
];
const P=id=>PATHS.find(p=>p.id===id);

const HOUSING=[
 {id:'zuhause',l:'Bei den Eltern wohnen',a:150,strom:0,kaut:0,w:0},
 {id:'wg',l:'WG-Zimmer',a:380,strom:25,kaut:450,w:1},
 {id:'klein',l:'Kleine eigene Wohnung',a:620,strom:55,kaut:800,w:2},
 {id:'schick',l:'Moderne 2-Zimmer-Wohnung im Zentrum',a:790,strom:55,kaut:1000,w:3}
];

/* ===== Glossar (Begriffe werden im Text automatisch klickbar) ===== */
const GL=[
['brutto','Brutto','Brutto','Das ganze Geld, das im Vertrag steht – bevor Steuern und Sozialabgaben abgezogen werden.'],
['netto','Netto','Netto(?:einkommens?|gehalts?)?','Das Geld, das wirklich auf deinem Konto ankommt, nachdem Steuern und Sozialabgaben abgezogen wurden.'],
['sozial','Sozialabgaben','Sozialabgaben','Beiträge zur Renten-, Kranken-, Pflege- und Arbeitslosenversicherung. Sie werden direkt vom Brutto abgezogen.'],
['fixkosten','Fixkosten','Fixkosten|feste Kosten','Kosten, die jeden Monat gleich hoch sind, zum Beispiel Miete, Handyvertrag und Versicherungen.'],
['ruecklage','Rücklagen / Notgroschen','Rücklagen|Notgroschen','Geld, das du für Notfälle zur Seite legst (z. B. kaputtes Handy, Reparatur). Faustregel: 2 bis 3 Netto-Monatsgehälter.'],
['dispo','Dispokredit (Dispo)','Dispokredit|Dispozinsen|Dispo','Ein Überziehungskredit auf dem Girokonto. Du darfst bis zu einer Grenze ins Minus – das kostet aber hohe Zinsen (oft 10 bis 15 % pro Jahr).'],
['kaution','Kaution','Kaution','Sicherheit für den Vermieter, meist 2 bis 3 Kaltmieten. Du bekommst sie zurück, wenn beim Auszug alles in Ordnung ist.'],
['nebenkosten','Nebenkosten','Nebenkosten(?:abrechnung)?|Betriebskosten','Kosten für Wasser, Heizung, Müll, Hausmeister usw. Du zahlst jeden Monat eine Vorauszahlung, einmal im Jahr kommt die Abrechnung – mit Nachzahlung oder Guthaben.'],
['warmmiete','Warmmiete','Warmmiete','Kaltmiete plus Nebenkosten (z. B. Heizung und Wasser).'],
['belege','Belegeinsicht','Belegeinsicht','Du darfst die Rechnungen und Belege ansehen, auf denen eine Abrechnung beruht.'],
['haftpflicht','Privathaftpflichtversicherung','Privathaftpflicht(?:versicherung)?|Haftpflicht(?:versicherung)?','Sie zahlt, wenn du aus Versehen bei anderen einen Schaden anrichtest (z. B. fremden Laptop kaputt machen). Sehr wichtig und günstig: etwa 3 bis 7 € im Monat.'],
['hausrat','Hausratversicherung','Hausrat(?:versicherung)?','Sie ersetzt deine Sachen in der Wohnung bei Einbruch, Feuer oder Wasserschaden.'],
['bu','Berufsunfähigkeitsversicherung','Berufsunfähigkeits(?:versicherung)?|BU','Sie zahlt eine Rente, wenn du aus gesundheitlichen Gründen nicht mehr arbeiten kannst. Sinnvoll, aber teuer – je früher du abschließt, desto günstiger.'],
['selbst','Selbstbeteiligung','Selbstbeteiligung|Selbstbehalt','Der Teil eines Schadens, den du bei einer Versicherung selbst bezahlst.'],
['kuendigung','Kündigungsfrist','Kündigungsfristen?','Die Zeit zwischen deiner Kündigung und dem Ende des Vertrags (z. B. 1 Monat). Verpasst du sie, läuft der Vertrag weiter.'],
['laufzeit','Laufzeit','Laufzeiten?|Mindestlaufzeit','So lange läuft ein Vertrag mindestens. In dieser Zeit kommst du meist nicht raus.'],
['widerruf','Widerrufsrecht','Widerrufsrecht|widerrufen|Widerruf','Bei Online-Käufen und Verträgen am Telefon kannst du den Vertrag meist 14 Tage lang ohne Begründung widerrufen. Bei Verträgen im Geschäft (z. B. Fitnessstudio) gilt das normalerweise nicht.'],
['effektiv','Effektiver Jahreszins','Effektivzins|effektive[nr]? Jahreszins','Der echte Preis eines Kredits pro Jahr – inklusive aller Gebühren. Nur damit kannst du Kredite fair vergleichen.'],
['raten','Ratenzahlung','Ratenzahlung|Ratenkauf|Raten','Du zahlst in kleinen Teilbeträgen. Meist kommen Zinsen oder Gebühren dazu – am Ende wird es teurer.'],
['lastschrift','Lastschrift','Lastschriften?','Du erlaubst einer Firma, Geld von deinem Konto abzubuchen. Zu Unrecht abgebuchtes Geld kannst du bis zu 8 Wochen lang zurückholen.'],
['dauerauftrag','Dauerauftrag','Dauerauftrag','Die Bank überweist automatisch jeden Monat einen festen Betrag, z. B. auf dein Sparkonto.'],
['tagesgeld','Tagesgeld','Tagesgeld','Ein Sparkonto mit Zinsen, bei dem du jederzeit an dein Geld kommst.'],
['mindestlohn','Mindestlohn','Mindestlohn','Der gesetzliche Mindestlohn beträgt 2026 in Deutschland 13,90 € pro Stunde.'],
['phishing','Phishing','Phishing','Betrüger schicken gefälschte Nachrichten (SMS, E-Mail), um an deine Passwörter oder Kartendaten zu kommen.'],
['vorkasse','Vorkasse','Vorkasse','Du bezahlst, bevor du die Ware bekommst. Bei fremden Verkäufern riskant: Bei Betrug ist das Geld weg.'],
['kaeufer','Käuferschutz','Käuferschutz','Manche Zahlungsarten (z. B. PayPal, Kreditkarte, Kauf auf Rechnung) helfen dir, dein Geld zurückzubekommen, wenn die Ware nicht ankommt.'],
['mahnung','Mahnung','Mahnung(?:en)?|Mahngebühren?','Erinnerung an eine unbezahlte Rechnung – oft mit zusätzlichen Gebühren.'],
['haushaltsbuch','Haushaltsbuch','Haushaltsbuch','Eine Liste (Heft oder App), in der du alle Einnahmen und Ausgaben aufschreibst. So siehst du, wohin dein Geld geht.'],
['impuls','Impulskauf','Impulskäufe?|Impulskauf','Ein spontaner Kauf, den du vorher nicht geplant hattest.'],
['vz','Verbraucherzentrale','Verbraucherzentrale','Eine Beratungsstelle, die dir bei Verträgen, Abos und Betrug hilft. Oft günstig oder kostenlos.'],
['kv','Kostenvoranschlag','Kostenvoranschl(?:ag|äge)','Eine Preisauskunft vorher. Hol dir mehrere und vergleiche.'],
['schuldner','Schuldnerberatung','Schuldnerberatung','Kostenlose Beratungsstellen, die bei Geldproblemen und Schulden helfen – ohne Vorwürfe.'],
['au','Krankmeldung (AU)','Krankmeldung|Arbeitsunfähigkeitsbescheinigung','Du musst deinem Betrieb sofort Bescheid sagen. Spätestens ab dem 4. Krankheitstag brauchst du eine Bescheinigung vom Arzt (der Betrieb darf sie auch früher verlangen).']
];
function gl(txt){
  let out=esc(txt);const hold=[];
  GL.forEach(([k,n,pat])=>{
    const re=new RegExp('(^|[^\\wÄÖÜäöüß])('+pat+')(?![\\wÄÖÜäöüß])');
    out=out.replace(re,(m,p,w)=>{hold.push([k,w]);return p+'\u0001'+(hold.length-1)+'\u0002'});
  });
  return out.replace(/\u0001(\d+)\u0002/g,(m,i)=>`<button class="gl" data-a="term" data-k="${hold[i][0]}">${hold[i][1]}</button>`);
}

/* ===== Start-Entscheidungen (Wohnen, Konto, Handy, Mobilität, Versicherungen) ===== */
function decWohnen(s){
  const net=s.income;
  return {id:'wohnen',kind:'setup',cat:'geld',t:'Wohnen',icon:'🏠',label:'Dein Start · 1 von 5',kmax:2,
   body:L('Du brauchst ein Zuhause. Die Miete ist die größte Ausgabe im Monat. Schau, wie viel von deinem Geld dafür weggeht.',
    'Wo willst du wohnen? Die Miete ist meistens der größte Kostenblock. Faustregel: Die Warmmiete sollte höchstens etwa ein Drittel deines Nettoeinkommens kosten.',
    'Die Wohnentscheidung bindet den größten Teil deines Budgets. Als Orientierung gilt: Die Warmmiete (Kaltmiete plus Nebenkosten) sollte ungefähr ein Drittel des Nettoeinkommens nicht überschreiten. Zusätzlich fallen eine Kaution und laufende Kosten für Strom und Internet an.'),
   tip:L('Rechne: Miete geteilt durch dein Netto-Geld. Geht mehr als die Hälfte weg? Dann wird es eng.','Teile die Miete durch dein Nettoeinkommen. Wenn mehr als ein Drittel bis die Hälfte draufgeht, bleibt zu wenig für alles andere.'),
   opts:HOUSING.map(h=>{
     const r=h.a/net,pct=Math.round(r*100),k=r<=.35?2:r<=.5?1:0;
     return {l:h.l,tag:`${eur(h.a)} Miete`+(h.strom?` + ${eur(h.strom)} Strom & Internet`:'')+` · Kaution ${eur(h.kaut)}`,k,
      e:{kaution:h.kaut,fix:[{key:'miete',n:'Miete (warm)',a:h.a,w:h.w},{key:'strom',n:'Strom & Internet',a:h.strom}],flag:{housing:h.id,hz:h.id==='zuhause'}},
      f:L(`Die Miete ist ${pct} von 100 Euro deines Einkommens. ${k===2?'Das ist gut.':k===1?'Das ist schon viel.':'Das ist viel zu viel!'}`,
       `Die Warmmiete von ${eur(h.a)} entspricht ${pct} % deines Nettoeinkommens. ${k===2?'Das liegt im gesunden Bereich.':k===1?'Das ist grenzwertig: Für alles andere bleibt weniger.':'Das ist deutlich zu viel – es bleibt kaum Spielraum.'} Dazu kommen die Kaution (${eur(h.kaut)}, du bekommst sie später zurück) und Strom & Internet.`)};
   })};
}
function decKonto(s){
  return {id:'konto',kind:'setup',cat:'vertrag',t:'Girokonto',icon:'🏦',label:'Dein Start · 2 von 5',kmax:2,
   body:L('Du brauchst ein Girokonto. Dort kommt dein Geld an. Von dort bezahlst du Rechnungen. Manche Konten kosten Geld.',

function decIns(s){
  const hz=!!s.f.hz;
  const O=[
   {key:'haft',l:'Privathaftpflicht',a:5,tag:'5 € pro Monat · zahlt, wenn du bei anderen Schäden anrichtest'},
   {key:'hausrat',l:'Hausratversicherung',a:6,tag:'6 € pro Monat · ersetzt deine Sachen bei Einbruch, Feuer, Wasserschaden'},
   {key:'bu',l:'Berufsunfähigkeitsversicherung',a:35,tag:'35 € pro Monat · Rente, wenn du nicht mehr arbeiten kannst'},
   {key:'rechts',l:'Rechtsschutzversicherung',a:22,tag:'22 € pro Monat · zahlt Anwalt und Gericht'},
   {key:'handy',l:'Handyversicherung',a:12,tag:'12 € pro Monat · zahlt bei Display- oder Wasserschaden'}];
  return {id:'ins',kind:'setup',cat:'versich',t:'Versicherungen',icon:'🛡️',label:'Dein Start · 5 von 5',multi:true,kmax:4,
   body:L(`Versicherungen helfen, wenn etwas Schlimmes passiert. Aber sie kosten jeden Monat Geld. Wähle, was du wirklich brauchst. ${hz?'Du wohnst bei deinen Eltern. Oft bist du über ihre Versicherungen mitversichert.':''}`,
    `Versicherungen schützen vor hohen Kosten, die du nie allein bezahlen könntest. Aber nicht jede ist sinnvoll. Wähle aus (mehrere sind möglich). ${hz?'Du wohnst bei deinen Eltern – frage nach, was über ihre Verträge mitversichert ist.':''}`,
    `Versicherungen sichern existenzbedrohende Risiken ab; viele Zusatzpolicen sind dagegen verzichtbar. Wähle aus (Mehrfachauswahl). ${hz?'Da du noch bei deinen Eltern wohnst, bist du häufig über deren Haftpflicht- und Hausratversicherung mitversichert.':''}`),
   tip:L('Am wichtigsten ist die Privathaftpflicht. Sie ist billig und schützt dich vor riesigen Kosten.','Existenzielle Risiken sichern, Kleinkram nicht: Ein großer Schaden bei anderen (Haftpflicht) kann dich ruinieren, ein kaputtes Handy nicht.'),
   opts:O,
   resolve:sel=>{
     const on=k=>sel.includes(k);let k=0;
     k+=hz?(on('haft')?1:2):(on('haft')?2:0);
     k+=hz?(on('hausrat')?0:1):(on('hausrat')?1:0);
     k+=on('handy')?0:1;
     const fix=O.filter(o=>on(o.key)).map(o=>({key:'ins_'+o.key,n:o.l,a:o.a}));
     const e={fix,flag:{coverHaft:on('haft')||hz,coverHaus:on('hausrat')||hz,insBU:on('bu'),insRechts:on('rechts'),insHandy:on('handy')}};
     const sum=fix.reduce((t,x)=>t+x.a,0);
     const pts=[];
     if(!hz&&!on('haft'))pts.push(L('Du hast keine Haftpflicht. Das ist riskant: Ein Schaden bei anderen kann Tausende Euro kosten.','Ohne Privathaftpflicht haftest du für Schäden bei anderen mit deinem ganzen Vermögen. Das ist das größte Risiko.'));
     if(hz&&on('haft'))pts.push(L('Bei deinen Eltern bist du meist schon mitversichert. Du zahlst doppelt.','Du bist als Kind in der Erstausbildung meist über die Eltern mitversichert – eine eigene Haftpflicht ist dann oft doppelt.'));
     if(!hz&&!on('hausrat'))pts.push(L('Ohne Hausrat bekommst du bei Einbruch nichts ersetzt.','Ohne Hausratversicherung bleibst du bei Einbruch oder Wasserschaden auf dem Schaden sitzen.'));
     if(hz&&on('hausrat'))pts.push(L('Hausrat brauchst du zuhause meist nicht extra.','Bei den Eltern sind deine Sachen meist über deren Hausrat mitversichert.'));
     if(on('handy'))pts.push(L('Handyversicherung lohnt sich selten: 12 € × 12 = 144 € im Jahr.','Eine Handyversicherung kostet 144 € pro Jahr – oft mehr als ein typischer Schaden. Sie lohnt sich selten.'));
     if(on('bu'))pts.push(L('Die BU ist wichtig, aber teuer. Für den Anfang ist es okay, sie später zu prüfen.','Die BU ist sinnvoll, aber mit 35 € ein großer Posten. Früh abschließen spart langfristig, kann aber am Anfang das Budget sprengen.'));
     if(on('rechts'))pts.push(L('Rechtsschutz ist nett, aber nicht nötig.','Rechtsschutz ist ein Komfort, kein Muss. Beratung gibt es oft günstiger, z. B. bei der Verbraucherzentrale.'));
     if(!pts.length)pts.push(L('Gut gewählt!','Eine schlanke, sinnvolle Auswahl.'));
     const f=L(`Du zahlst ${eur(sum)} im Monat. `+pts.map(p=>p[0]).join(' '),`Deine Beiträge: ${eur(sum)} pro Monat. `+pts.map(p=>p[1]).join(' '));
     return {k,kmax:4,l:fix.length?fix.map(x=>x.n).join(', '):'Keine Versicherung',e,f,
       best:hz?'Nachfragen, was über die Eltern mitversichert ist – und keine Handyversicherung':'Privathaftpflicht + Hausrat, keine Handyversicherung'};
   }};
}

  'Dein Strom kostet 0,38 € pro kWh. Das ist die teure Grundversorgung. Ein Vergleichsportal zeigt einen Tarif für 0,30 €. Du verbrauchst 1.500 kWh im Jahr.',
  'Du bist automatisch in der teuren Grundversorgung (0,38 € pro kWh). Ein Vergleichsportal zeigt dir einen Tarif für 0,30 € pro kWh. Du verbrauchst etwa 1.500 kWh im Jahr. Außerdem klingelt ein Vertreter an deiner Tür.',
  'Du befindest dich in der Grundversorgung (0,38 € je kWh). Ein Tarifvergleich nennt ein Angebot für 0,30 € je kWh bei ca. 1.500 kWh Jahresverbrauch. Zusätzlich wirbt ein Haustürvertreter mit einem „Sonderangebot“.'),
 tip:()=>L('Vergleichsportale zeigen viele Tarife. Neukunden-Boni gelten oft nur ein Jahr.','Achte beim Wechsel auf Vertragslaufzeit und Preisgarantie. Ein hoher Neukundenbonus verschleiert oft einen teuren Tarif im zweiten Jahr.'),
 calc:()=>({q:'Wie viel sparst du im Jahr, wenn du von 0,38 € auf 0,30 € pro kWh wechselst (1.500 kWh)? Antwort in €.',ans:120,sol:'1.500 × (0,38 − 0,30) = 1.500 × 0,08 = 120 €'}),
 opts:()=>[
  {l:'Per Vergleichsportal in einen guten Tarif wechseln',k:2,e:{rec:[{n:'Ersparnis Stromtarif',a:-10,m:12}]},f:L('Super! Du sparst jeden Monat 10 €.','Du sparst etwa 120 € im Jahr. Wechseln ist einfach – das lohnt sich fast immer.')},
  {l:'Angebot mit riesigem Willkommensbonus nehmen',k:1,e:{rec:[{n:'Ersparnis Bonus-Tarif',a:-12,m:6}]},f:L('Im ersten Jahr ist es günstig. Danach steigt der Preis meistens.','Der Bonus lockt, aber nach dem ersten Jahr kann der Preis deutlich steigen. Besser: jährlich neu vergleichen.')},
  {l:'Nichts tun',k:0,e:{},f:L('Du zahlst weiter zu viel. Jedes Jahr 120 € mehr als nötig.','Wer nichts tut, zahlt dauerhaft zu viel: etwa 120 € pro Jahr.')},
  {l:'Beim Vertreter an der Tür unterschreiben',k:0,e:{rec:[{n:'Haustür-Stromvertrag',a:5,m:12}]},f:L('An der Haustür wird oft Druck gemacht. Der Vertrag war sogar teurer.','Bei Haustürgeschäften wird oft Druck gemacht. Der Vertrag war teurer als dein jetziger Tarif. Du kannst ihn innerhalb von 14 Tagen widerrufen.')}]},

{id:'haft',cat:'versich',d:3,t:'Der Laptop',icon:'💻',
 v:s=>({a:sc(s,650)}),
 body:(s,v)=>L(
  `Du bist bei einer Freundin. Du stößt aus Versehen ihren Laptop vom Tisch. Er ist kaputt. Der Schaden: ${eur(v.a)}. ${s.f.coverHaft?'Du hast eine Haftpflichtversicherung.':'Du hast keine Haftpflichtversicherung.'}`,
  `Bei einer Freundin rutschst du aus und reißt ihren Laptop vom Tisch – Totalschaden, ${eur(v.a)}. ${s.f.coverHaft?'Du hast eine Privathaftpflicht.':'Du hast keine Privathaftpflicht.'}`,
  `Bei einem Besuch beschädigst du fahrlässig den Laptop einer Freundin; der Zeitwert beträgt ${eur(v.a)}. ${s.f.coverHaft?'Du bist haftpflichtversichert.':'Du verfügst über keine Privathaftpflicht und haftest daher persönlich.'}`),
 tip:(s)=>s.f.coverHaft?L('Du hast eine Versicherung. Sag der Versicherung sofort Bescheid.','Melde den Schaden zügig der Versicherung. Gib nichts zu, was du nicht prüfen lassen kannst.'):L('Ohne Haftpflicht zahlst du selbst. Sprich ehrlich mit deiner Freundin.','Du haftest persönlich. Sprich ehrlich, biete eine faire Lösung an und prüfe, ob eine Ratenzahlung möglich ist.'),
 opts:(s,v)=>s.f.coverHaft?[
  {l:'Den Schaden der Haftpflicht melden',k:2,e:{wohl:2},f:L('Sehr gut! Die Versicherung zahlt. Du zahlst nichts.','Genau dafür ist die Haftpflicht da: Sie reguliert den Schaden, du zahlst nichts. Beitrag: nur ca. 5 € im Monat!')},
  {l:'Selbst bezahlen, ist mir peinlich',k:0,e:{konto:-v.a,wohl:-2},f:L('Das war nicht nötig! Die Versicherung hätte gezahlt.','Unnötig teuer: Genau für solche Fälle hast du die Versicherung.')},
  {l:'Nichts sagen',k:0,e:{wohl:-8},f:L('Das belastet die Freundschaft. Und der Schaden bleibt.','Verschweigen belastet die Freundschaft – und ist rechtlich keine Lösung. Der Schaden bleibt ungeklärt.')}
 ]:[
  {l:`Sofort bezahlen (${eur(v.a)})`,k:1,e:{konto:-v.a,wohl:-3},f:L('Das ist fair. Aber es ist ein riesiger Betrag für dich.','Fair gegenüber deiner Freundin, aber teuer. Mit einer Haftpflicht (ca. 5 € im Monat) wäre das gedeckt gewesen.')},
  {l:'Ratenzahlung vereinbaren (5 Monate)',k:1,e:{wohl:-2,rec:[{n:'Laptop-Raten',a:Math.round(v.a/5),m:5,debt:true}]},f:L('Raten helfen dir. Aber das Geld fehlt dir jeden Monat.','Eine Ratenvereinbarung ist ein guter Weg, wenn du nicht alles sofort zahlen kannst. Aber das Budget leidet fünf Monate.')},
  {l:'Verschweigen',k:0,e:{wohl:-15},f:L('Das war keine gute Idee. Die Freundschaft leidet.','Verschweigen zerstört Vertrauen und löst das Problem nicht. Ehrlichkeit ist hier die einzige faire Lösung.')}
 ]},

{id:'einbruch',cat:'versich',d:2,t:'Einbruch',icon:'🚪',when:s=>s.f.housing!=='zuhause',
 v:s=>({a:sc(s,900)}),
 body:(s,v)=>L(
  `Du kommst nach Hause. Die Tür ist aufgebrochen! Dein Laptop und andere Sachen sind weg. Schaden: ${eur(v.a)}. ${s.f.coverHaus?'Du hast eine Hausratversicherung.':'Du hast keine Hausratversicherung.'}`,
  `Bei deiner Rückkehr ist die Wohnung aufgebrochen. Laptop, Kopfhörer und Bargeld fehlen – Schaden etwa ${eur(v.a)}. ${s.f.coverHaus?'Du hast eine Hausratversicherung (150 € Selbstbeteiligung).':'Eine Hausratversicherung hast du nicht.'}`,
  `Es wurde in deine Wohnung eingebrochen. Gestohlen wurden Elektronik und Bargeld im Wert von ${eur(v.a)}. ${s.f.coverHaus?'Deine Hausratversicherung greift abzüglich 150 € Selbstbeteiligung.':'Mangels Hausratversicherung bleibst du auf dem Schaden sitzen.'}`),
 tip:(s)=>s.f.coverHaus?L('Geh zur Polizei. Mach eine Liste der gestohlenen Sachen.','Erstatte Anzeige und erstelle eine Liste mit Belegen. Ohne Anzeige zahlt die Versicherung nicht.'):L('Geh trotzdem zur Polizei. Ersatz kannst du gebraucht kaufen.','Auch ohne Versicherung ist eine Anzeige sinnvoll. Ersatz gibt es gebraucht deutlich günstiger.'),
 opts:(s,v)=>s.f.coverHaus?[
  {l:'Anzeige erstatten und Schaden mit Liste melden',k:2,e:{konto:-150,wohl:-3},f:L('Richtig! Die Versicherung zahlt fast alles. Du zahlst 150 €.','Richtig: Anzeige, Liste, Meldung. Die Versicherung ersetzt den Schaden bis auf 150 € Selbstbeteiligung.')},
  {l:'Nicht melden, aus Angst vor höheren Beiträgen',k:0,e:{konto:-v.a,wohl:-8},f:L('Du zahlst alles selbst. Dafür war die Versicherung da!','Falsche Sparsamkeit: Du bleibst auf dem ganzen Schaden sitzen, obwohl du jeden Monat Beitrag zahlst.')},
  {l:'Mehr angeben, als gestohlen wurde',k:0,e:{konto:-150,wohl:-10},f:L('Das ist Betrug! Das kann sehr teuer werden.','Das ist Versicherungsbetrug und strafbar. Die Folgen können weit über den Schaden hinausgehen.')}
 ]:[
  {l:'Anzeige erstatten und gebrauchten Ersatz kaufen',k:2,e:{konto:-Math.round(v.a*.4),wohl:-4},f:L('Gute Lösung! Gebraucht ist viel günstiger als neu.','Vernünftig: Anzeige erstatten und gebraucht ersetzen, was du wirklich brauchst.')},
  {l:'Neuen Laptop auf Pump kaufen',k:0,e:{wohl:3,rec:[{n:'Laptop auf Pump',a:Math.round(v.a/10),m:10,debt:true}]},f:L('Das ist teuer. Du zahlst 10 Monate lang Raten.','Ein teurer Neukauf auf Raten verschärft das Problem: Du zahlst zehn Monate lang für ein Gerät, das du günstiger hättest ersetzen können.')},
  {l:'Ohne Ersatz weitermachen',k:1,e:{wohl:-10},f:L('Das spart Geld. Aber für Schule, Job oder Uni ist es schwierig.','Das spart Geld, kann dich aber bei Schule, Job oder Studium ausbremsen.')}
 ]},

{id:'gehalt',cat:'arbeit',d:2,t:'Gehaltsgespräch',icon:'📈',paths:['dual','fach'],
 v:()=>({a:110}),
 body:(s,v)=>L(
  'Du arbeitest seit einem Jahr zuverlässig. Du machst mehr als am Anfang. Du hättest gern mehr Geld. Was tust du?',
  `Du arbeitest seit einem Jahr zuverlässig im Betrieb und übernimmst mehr Verantwortung. Kolleginnen mit ähnlicher Aufgabe verdienen laut einer Gehaltsübersicht mehr. Du überlegst, um eine Erhöhung zu bitten.`,
  `Nach einem Jahr hast du dein Aufgabenfeld erweitert. Branchenübliche Gehälter liegen über deinem aktuellen. Du erwägst, ein Gehaltsgespräch zu führen und musst entscheiden, wie du auftrittst.`),
 tip:()=>L('Bereite dich vor: Was hast du geleistet? Was verdienen andere?','Gute Verhandlungen basieren auf Argumenten: Leistungen, Marktvergleich und ein konkreter Wunsch.'),
 opts:(s,v)=>[
  {l:'Nichts sagen und hoffen',k:0,e:{wohl:-2},f:L('Wer nicht fragt, bekommt oft nichts. Nichts ändert sich.','Gehaltserhöhungen kommen selten von allein. Wer nicht fragt, bleibt oft beim alten Gehalt.')},
  {l:'Gespräch mit Argumenten und Marktvergleich',k:2,e:{income:v.a,wohl:5},f:L(`Super vorbereitet! Du bekommst ${eur(v.a)} mehr pro Monat.`,`Gut vorbereitet: Mit Leistungen und Marktvergleich überzeugst du. Dein Nettoeinkommen steigt um ${eur(v.a)} pro Monat.`)},
  {l:'Mehr Geld fordern, ohne Begründung',k:1,e:{wohl:-2},f:L('Der Chef sagt: „Wir schauen mal.“ Ohne Gründe passiert oft nichts.','Ohne Begründung fehlt das Argument. Der Chef vertröstet dich.')},
  {l:'Mit Kündigung drohen',k:0,e:{wohl:-8},f:L('Das ist riskant. Es belastet das Verhältnis zum Chef.','Drohen wirkt selten und belastet das Vertrauen. Sachlich verhandeln ist besser.')}]},

{id:'ueberstunden',cat:'arbeit',d:2,t:'Samstagsschicht',icon:'⏰',paths:WORK,
 body:()=>L(
  'Dein Chef bittet dich: „Kannst du Samstag arbeiten? Das schreiben wir später auf.“',
  'Dein Chef bittet dich, am Samstag zusätzlich zu arbeiten. Er sagt: „Die Stunden schreiben wir später auf.“ Du möchtest einen guten Eindruck machen.',
  'Dein Vorgesetzter bittet dich kurzfristig um Mehrarbeit am Wochenende und vertröstet dich bezüglich der Erfassung der Stunden. Rechte zu Arbeitszeit, Vergütung und Freizeitausgleich sind dir bekannt oder lassen sich klären.'),
 tip:()=>L('Mehr arbeiten ist okay. Aber die Stunden müssen aufgeschrieben und bezahlt oder frei gegeben werden.','Frage nach: Wie werden die Stunden erfasst und ausgeglichen (Bezahlung oder Freizeit)? Bei Azubis sind Überstunden nur ausnahmsweise erlaubt.'),
 opts:()=>[
  {l:'Zusagen, ohne nachzufragen',k:0,e:{wohl:-4},f:L('Du hast gearbeitet. Aber niemand hat es aufgeschrieben. Das ist nicht gut.','Ohne Erfassung gibt es keinen Nachweis. Dein Einsatz verpufft und du verlierst Geld oder Freizeit.')},
  {l:'Zusagen und Stunden mit Ausgleich klären (Zeiterfassung)',k:2,e:{konto:80,wohl:1},f:L('Super! Die Stunden werden aufgeschrieben. Du bekommst 80 € mehr.','Gut geklärt: Die Stunden werden erfasst und ausgeglichen. Du erhältst 80 € zusätzlich.')},
  {l:'Höflich ablehnen, weil du einen Termin hast',k:1,e:{wohl:1},f:L('Das ist okay. Du darfst nein sagen, wenn du Termine hast.','Ein höfliches Nein ist erlaubt, wenn es Gründe gibt. Es kann aber Einfluss auf das Betriebsklima haben.')},
  {l:'Zusagen, aber am Samstag früher gehen',k:0,e:{wohl:-6},f:L('Das ist nicht ehrlich. Es gibt Ärger.','Heimlich weniger arbeiten ist unehrlich und kann zu Ärger bis zur Abmahnung führen.')}]},

{id:'krank',cat:'arbeit',d:1,t:'Fieber',icon:'🤒',paths:WORK,
 body:()=>L('Du wachst mit Fieber auf. In einer Stunde musst du zur Arbeit. Was tust du?','Du wachst mit Fieber und Halsschmerzen auf. In einer Stunde beginnt deine Arbeit. Was ist jetzt richtig?','Du bist akut erkrankt und arbeitsunfähig. Dein Dienst beginnt in einer Stunde. Du musst entscheiden, wie du dich gegenüber dem Betrieb verhältst und welche Pflichten dabei bestehen.'),
 tip:()=>L('Sag dem Betrieb sofort Bescheid. Geh zum Arzt.','Informiere den Betrieb sofort (Anruf oder Nachricht). Ab dem 4. Tag brauchst du eine Krankmeldung vom Arzt.'),
 opts:()=>[
  {l:'Sofort beim Betrieb Bescheid sagen und zum Arzt gehen',k:2,e:{konto:-10,wohl:3},f:L('Richtig! Du hast den Betrieb informiert. Du hast eine Krankmeldung.','Richtig: Sofort melden, zum Arzt gehen, Krankmeldung vorlegen. Du kostest den Betrieb keine Überraschung und erholst dich.')},
  {l:'Nichts sagen und zu Hause bleiben',k:0,e:{wohl:-10},f:L('Der Betrieb weiß nichts! Das gibt Ärger, vielleicht eine Abmahnung.','Unentschuldigtes Fehlen kann zu einer Abmahnung führen. Die Meldung ist Pflicht.')},
  {l:'Krank zur Arbeit gehen',k:0,e:{wohl:-6},f:L('Du steckst andere an. Und du wirst noch kränker.','Krank zu arbeiten schadet dir und steckt Kolleg:innen an. Auskurieren ist besser.')}]},

{id:'kleidung',cat:'arbeit',d:1,t:'Sicherheitsschuhe',icon:'🥾',paths:WORK,
 v:()=>({a:85}),
 body:(s,v)=>L(`Für deine Arbeit brauchst du Sicherheitsschuhe. Der Chef sagt: „Kauf sie selbst.“ Sie kosten ${eur(v.a)}.`,`Für die Arbeit sind Sicherheitsschuhe nötig. Dein Chef sagt beiläufig: „Die kaufst du dir selbst.“ Sie kosten ${eur(v.a)}.`,`Für deine Tätigkeit ist persönliche Schutzausrüstung vorgeschrieben (Sicherheitsschuhe, ${eur(v.a)}). Dein Vorgesetzter erklärt, du müsstest sie selbst beschaffen.`),
 tip:()=>L('Muss der Betrieb Schutzkleidung bezahlen? Frag nach.','Notwendige Schutzausrüstung muss in der Regel der Arbeitgeber stellen und bezahlen. Frage freundlich nach.'),
 opts:(s,v)=>[
  {l:'Selbst kaufen',k:0,e:{konto:-v.a},f:L('Das hättest du nicht zahlen müssen. Der Betrieb muss Schutzkleidung stellen.','Notwendige Schutzausrüstung muss meist der Arbeitgeber bezahlen – hier hast du unnötig gezahlt.')},
  {l:'Freundlich nachfragen: Der Betrieb muss Schutzkleidung stellen',k:2,e:{wohl:2},f:L('Super! Der Betrieb bezahlt die Schuhe.','Richtig: Der Betrieb stellt die Schuhe. Freundliches Nachfragen hat funktioniert.')},
  {l:'Billige Schuhe online kaufen (35 €)',k:0,e:{konto:-35,wohl:-2},f:L('Die Schuhe sind nicht sicher. Das ist gefährlich.','Nicht geprüfte Schuhe schützen nicht und sind im Betrieb oft nicht zulässig. Gefährlich und unnötig.')}]},

{id:'mindestlohn',cat:'arbeit',d:2,t:'Dein Stundenlohn',icon:'🧮',paths:['stud'],
 body:()=>L('Du arbeitest 30 Stunden im Monat im Nebenjob. Dein Chef zahlt dir 10,50 € pro Stunde. Der Mindestlohn ist 13,90 €.','Du arbeitest im Nebenjob 30 Stunden im Monat. In der Abrechnung siehst du: 10,50 € pro Stunde. Der gesetzliche Mindestlohn beträgt 13,90 €.','Deine Lohnabrechnung weist für 30 Monatsstunden einen Stundenlohn von 10,50 € aus. Der gesetzliche Mindestlohn liegt bei 13,90 € brutto je Stunde, womit ein Verstoß vorliegt.'),
 tip:()=>L('Mindestlohn ist ein Recht. Sprich zuerst mit deinem Chef.','Der Mindestlohn gilt auch für Nebenjobs. Sprich zuerst sachlich mit dem Chef; es gibt auch eine Meldestelle beim Zoll.'),
 calc:()=>({q:'Wie viel Euro bekommst du pro Monat zu wenig (30 Stunden, 10,50 € statt 13,90 €)?',ans:102,sol:'30 × (13,90 − 10,50) = 30 × 3,40 = 102 €'}),
 opts:()=>[
  {l:'Höflich ansprechen und den Mindestlohn einfordern',k:2,e:{income:102,wohl:3},f:L('Super! Du bekommst jetzt 102 € mehr im Monat.','Gut: Sachlich auf das Recht hingewiesen. Dein Lohn steigt um 102 € pro Monat.')},
  {l:'Nichts sagen, Hauptsache Job',k:0,e:{wohl:-3},f:L('Du verlierst jeden Monat 102 €. Das ist unfair.','Du verzichtest auf 102 € pro Monat, die dir zustehen. Rechte einfordern ist nicht unhöflich.')},
  {l:'Anonym dem Zoll melden',k:1,e:{wohl:-2},f:L('Das geht auch. Aber es ist besser, erst mit dem Chef zu reden.','Möglich und rechtlich in Ordnung. Zuerst das Gespräch zu suchen löst es oft schneller.')}]},

{id:'semester',cat:'geld',d:1,t:'Semesterbeitrag',icon:'🎓',paths:['stud'],
 body:()=>L('Du musst 250 € Semesterbeitrag zahlen. Bis Freitag. Sonst wirst du nicht zurückgemeldet.','Der Semesterbeitrag über 250 € ist bis Freitag fällig. Wer die Frist verpasst, riskiert die Exmatrikulation.','Die Rückmeldung zum nächsten Semester erfordert die fristgerechte Zahlung des Semesterbeitrags (250 €). Bei Versäumnis drohen Säumniszuschläge und die Exmatrikulation.'),
 tip:()=>L('Trage Fristen im Kalender ein.','Fristen gehören in den Kalender. Zahle früh, dann bist du auf der sicheren Seite.'),
 opts:()=>[
  {l:'Direkt bezahlen',k:2,e:{konto:-250},f:L('Richtig! Du hast die Frist geschafft.','Richtig: pünktlich gezahlt, kein Stress.')},
  {l:'Bis zum letzten Tag warten',k:1,e:{konto:-250,wohl:-2},f:L('Es hat geklappt. Aber es war knapp und stressig.','Es hat geklappt, aber du hast dir unnötig Druck gemacht.')},
  {l:'Vergessen',k:0,e:{konto:-280,wohl:-6},f:L('Du zahlst 30 € Extra und hattest Stress.','Fristversäumnis kostet 30 € Säumniszuschlag und Nerven.')}]},

{id:'kredit',cat:'geld',d:3,t:'Sofortkredit',icon:'💳',
 v:s=>{const a=sc(s,2000);return {a,rate:Math.round(a*1.19/24),rate2:Math.round(a*1.06/24)}},
 body:(s,v)=>L(
  `Du siehst Werbung: „Sofortkredit! ${eur(v.a)} sofort auf dein Konto!“ Du zahlst jeden Monat nur ${eur(v.rate)}. 24 Monate lang.`,
  `Online-Werbung: „Sofortkredit über ${eur(v.a)} – ohne Papierkram!“ Du zahlst 24 Monate lang ${eur(v.rate)}. Du würdest dir gern etwas Größeres leisten.`,
  `Ein Online-Anbieter bewirbt einen Ratenkredit über ${eur(v.a)} mit einer Laufzeit von 24 Monaten und monatlichen Raten von ${eur(v.rate)}. Der effektive Jahreszins wird nur klein gedruckt genannt.`),
 tip:()=>L('Rechne alle Raten zusammen. Wie viel mehr zahlst du?','Rechne: Rate × Monate − geliehener Betrag = Zinsen und Gebühren. Kredite nur vergleichen, wenn du sie wirklich brauchst.'),
 calc:(s,v)=>({q:`${eur(v.rate)} × 24 Monate: Wie viel zahlst du insgesamt MEHR als die geliehenen ${eur(v.a)} (in €)?`,ans:v.rate*24-v.a,sol:`${eur(v.rate)} × 24 = ${eur(v.rate*24)}; ${eur(v.rate*24)} − ${eur(v.a)} = ${eur(v.rate*24-v.a)}`}),
 opts:(s,v)=>[
  {l:'Kredit annehmen',k:0,e:{konto:v.a,wohl:8,rec:[{n:'Sofortkredit',a:v.rate,m:24,debt:true}]},f:L(`Du zahlst ${eur(v.rate*24)} zurück. Das sind ${eur(v.rate*24-v.a)} mehr!`,`Du zahlst insgesamt ${eur(v.rate*24)} zurück – ${eur(v.rate*24-v.a)} mehr als du bekommen hast. Kredite für Wünsche belasten dein Budget zwei Jahre lang.`)},
  {l:'Ablehnen und auf das Ziel sparen',k:2,e:{wohl:1},f:L('Sehr klug! Sparen ist günstiger als ein Kredit.','Sehr klug: Wünsche mit Erspartem erfüllen statt mit teurem Kredit. So zahlst du keine Zinsen.')},
  {l:'Etwas Kleineres gebraucht kaufen, aus den Rücklagen (300 €)',k:1,e:{spar:-300,wohl:4},f:L('Das geht. Aber du hast Rücklagen ausgegeben.','Vernünftig und ohne Kredit – aber Rücklagen sind eigentlich für Notfälle gedacht, nicht für Wünsche.')},
  {l:'Verschiedene Kredite vergleichen (Effektivzins!)',k:1,e:{konto:v.a,wohl:8,rec:[{n:'Kredit (günstig)',a:v.rate2,m:24,debt:true}]},f:L(`Du hast einen günstigeren Kredit gefunden. Aber es bleibt ein Kredit für einen Wunsch.`,`Der Vergleich spart Zinsen (${eur(v.rate2*24-v.a)} statt ${eur(v.rate*24-v.a)}). Dennoch: ein Kredit für einen Wunsch bleibt eine Belastung.`)}]},

{id:'urlaub',cat:'geld',d:1,t:'Festival mit Freunden',icon:'🎪',
 v:s=>({a:sc(s,280)}),
 body:(s,v)=>L(`Deine Freunde planen ein Festival-Wochenende. Es kostet ${eur(v.a)}. Alle gehen mit.`,`Deine Freunde planen ein Festival-Wochenende. Ticket, Anreise und Essen kosten zusammen ${eur(v.a)}. Du möchtest dabei sein.`,`Dein Freundeskreis plant ein gemeinsames Festival-Wochenende; die Kosten für Ticket, Anreise und Verpflegung belaufen sich auf ${eur(v.a)}. Soziale Erwartungen und dein Budget stehen im Spannungsfeld.`),
 tip:()=>L('Spaß ist wichtig! Aber es gibt günstigere Wege.','Spaß und Freunde gehören dazu. Prüfe Sparvarianten: Bahn mit Sparpreis, Zelt statt Hotel, Essen selbst mitbringen.'),
 opts:(s,v)=>[
  {l:`Mitkommen, volle Variante (${eur(v.a)})`,k:1,e:{konto:-v.a,wohl:12},f:L('Das war ein tolles Wochenende! Aber teuer.','Ein schönes Erlebnis, das dein Budget deutlich belastet. Spaß ist erlaubt, wenn er finanziert ist.')},
  {l:`Günstigere Variante (Zelt, Bahn mit Sparpreis): ${eur(v.a*.45)}`,k:2,e:{konto:-Math.round(v.a*.45),wohl:9},f:L('Sehr clever! Fast so viel Spaß, viel weniger Geld.','Clever: fast gleicher Spaß, deutlich weniger Kosten. Mit Planung lässt sich viel sparen.')},
  {l:'Nicht mitfahren, anderes Treffen vorschlagen',k:1,e:{wohl:-3},f:L('Du sparst Geld. Aber du verpasst etwas.','Du sparst, zahlst aber mit dem Gefühl, etwas zu verpassen. Auch das ist eine echte Abwägung.')},
  {l:'Mitkommen und auf Pump zahlen',k:0,e:{wohl:12,rec:[{n:'Festival auf Pump',a:50,m:6,debt:true}]},f:L('Du zahlst 6 Monate lang. Das ist keine gute Idee für ein Wochenende.','Ein Wochenende auf sechs Monate Raten zu zahlen ist teuer und unnötig.')}]},

{id:'windfall',cat:'geld',d:1,t:'Unerwartetes Geld',icon:'🎁',
 v:s=>({a:sc(s,300)}),
 body:(s,v)=>L(`Du bekommst unerwartet ${eur(v.a)} (Geschenk, Bonus oder Steuererstattung). Was machst du damit?`,`Du bekommst unerwartet ${eur(v.a)} – ein Bonus vom Betrieb, ein Geschenk oder eine Steuererstattung. Wie gehst du damit um?`,`Dir fließt einmalig ein Betrag von ${eur(v.a)} zu (Sonderzahlung, Geldgeschenk oder Steuererstattung). Zugleich wirbt ein Influencer mit einem „sicheren Krypto-Tipp“.`),
 tip:()=>L('Ein bisschen Spaß, ein bisschen Sparen – das ist ein guter Plan.','Eine Aufteilung (z. B. Hälfte Spaß, Hälfte Sparen) verbindet Genuss und Vorsorge. „Sichere“ Geldanlagen mit schnellen Gewinnen gibt es nicht.'),
 opts:(s,v)=>[
  {l:'Alles ausgeben – du hast es verdient',k:0,e:{wohl:10},f:L('Das war schön. Aber das Geld ist weg.','Der Moment war schön, aber nichts bleibt übrig. Ohne Rücklagen trifft dich die nächste Überraschung härter.')},
  {l:'Die Hälfte sparen, die Hälfte genießen',k:2,e:{konto:v.a/2,spar:v.a/2,wohl:5},f:L('Super! Du hast Spaß und sparst.','Ausgewogen: Du genießt und baust Rücklagen auf. Einmalige Einnahmen sind eine gute Chance zum Sparen.')},
  {l:'Alles auf das Tagesgeldkonto',k:1,e:{spar:v.a,wohl:1},f:L('Sparen ist gut. Aber auch ein bisschen Spaß ist wichtig.','Sehr vernünftig, aber ohne Genuss wird Sparen zur Last. Ein kleiner Anteil für dich ist okay.')},
  {l:'In den „sicheren Krypto-Tipp“ vom Influencer stecken',k:0,e:{konto:Math.round(v.a*.3),wohl:-6},f:L('Der Kurs ist abgestürzt! Du hast fast alles verloren.','Der Kurs stürzt ab: Du verlierst etwa 70 %. „Sichere“ schnelle Gewinne gibt es nicht – Influencer verdienen oft an Provisionen.')}]},

{id:'telefon',cat:'vertrag',d:2,t:'Der Anruf',icon:'☎️',
 body:()=>L('Dein Handyanbieter ruft an: „Wir haben ein Super-Angebot! Neues Handy für nur 5 € mehr im Monat! Nur heute!“','Dein Anbieter ruft an: „Upgrade auf ein neues Handy für nur 5 € mehr im Monat – das Angebot gilt nur heute!“ Du weißt nicht, was in den Vertragsbedingungen steht.','Ein Telefonvertrieb eines Anbieters bietet dir ein „Upgrade“ an: Neugerät für 5 € Aufpreis monatlich, befristet bis zum Ende des Gesprächs. Die Vertragsdetails (Laufzeit, Gesamtkosten) werden nicht genannt.'),
 tip:()=>L('Am Telefon musst du nichts sofort entscheiden.','Am Telefon musst du nie sofort entscheiden. Bitte um schriftliche Unterlagen und vergleiche. Werbung per Telefon ohne deine Einwilligung ist verboten.'),
 opts:()=>[
  {l:'Zusagen – klingt gut',k:0,e:{wohl:3,rec:[{n:'Handy-Upgrade',a:5,m:12}]},f:L('Du bist 24 Monate gebunden. Und du zahlst mehr, als du dachtest.','Ohne Vertragsunterlagen weißt du nicht, was du zahlst und wie lange du gebunden bist. Du kannst den Vertrag aber widerrufen (14 Tage).')},
  {l:'„Schicken Sie mir die Unterlagen schriftlich. Ich prüfe das.“',k:2,e:{},f:L('Super! Du entscheidest in Ruhe. Das ist der beste Weg.','Genau richtig: Du entscheidest ohne Druck und mit allen Informationen.')},
  {l:'Auflegen',k:1,e:{},f:L('Das geht auch. Aber vielleicht hätte ein besseres Angebot gepasst.','Auflegen ist erlaubt und schützt dich. Du hast so aber nicht erfahren, ob das Angebot gut war.')},
  {l:'Nachfragen, woher die Nummer ist, und der Werbung widersprechen',k:2,e:{wohl:2},f:L('Sehr gut! Du hast deine Rechte genutzt.','Sehr gut: Du kannst der Nutzung deiner Daten widersprechen und unerlaubte Werbeanrufe der Bundesnetzagentur oder Verbraucherzentrale melden.')}]},

{id:'widerruf',cat:'konsum',d:1,t:'Passt nicht',icon:'📦',
 v:s=>({a:sc(s,90)}),
 body:(s,v)=>L(`Du hast online eine Jacke für ${eur(v.a)} bestellt. Sie ist angekommen. Sie passt nicht.`,`Die Jacke, die du online für ${eur(v.a)} bestellt hast, passt nicht. Der Shop schreibt: „Kein Umtausch.“`,`Du hast online eine Jacke für ${eur(v.a)} bestellt, die nicht passt. Der Shop verweist auf „keinen Umtausch“. Als Verbraucher hast du bei Fernabsatzverträgen Rechte.`),
 tip:()=>L('Online kannst du Dinge meist zurückschicken. Wie viele Tage?','Bei Online-Käufen hast du ein 14-tägiges Widerrufsrecht. Die Rücksendekosten trägst du oft selbst.'),
 opts:(s,v)=>[
  {l:'Innerhalb von 14 Tagen widerrufen und zurückschicken',k:2,e:{konto:-7},f:L('Richtig! Du bekommst dein Geld zurück. Das Porto kostet 7 €.','Richtig: Das Widerrufsrecht gilt 14 Tage. Du bekommst den Kaufpreis zurück, nur die Rücksendekosten (7 €) bleiben.')},
  {l:'Weiterverkaufen',k:1,e:{konto:-(v.a-50)},f:L('Du verkaufst sie für 50 €. Du verlierst trotzdem Geld.',`Du verkaufst für 50 € und verlierst ${eur(v.a-50)}. Zurückschicken wäre günstiger gewesen.`)},
  {l:'Im Schrank liegen lassen',k:0,e:{konto:-v.a,wohl:-2},f:L('Die Frist ist vorbei. Das Geld ist weg.','Die 14 Tage sind verstrichen. Das Geld ist verloren – für etwas, das du nicht nutzt.')}]},

{id:'fakeshop',cat:'digital',d:2,t:'Zu gut, um wahr zu sein',icon:'🎮',
 v:s=>({a:sc(s,150),b:sc(s,330)}),
 body:(s,v)=>L(`Du suchst eine Spielekonsole. In einem Shop kostet sie nur ${eur(v.a)}. Überall sonst ${eur(v.b)}. Der Shop will Vorkasse per Überweisung.`,`Eine Spielekonsole kostet überall ${eur(v.b)}. In einem unbekannten Online-Shop gibt es sie für ${eur(v.a)} – aber nur per Vorkasse. Es gibt keine Bewertungen.`,`Ein dir unbekannter Shop bietet eine Konsole zu ${eur(v.a)} statt marktüblichen ${eur(v.b)} an – ausschließlich gegen Vorkasse, ohne nachvollziehbares Impressum oder Bewertungen. Das ist ein klassisches Merkmal betrügerischer Shops.`),
 tip:()=>L('Ein sehr niedriger Preis und nur Vorkasse sind Warnsignale.','Warnsignale: Preis weit unter dem Markt, nur Vorkasse, kein vollständiges Impressum. Seriöse Shops bieten Käuferschutz.'),
 opts:(s,v)=>[
  {l:'Überweisen und hoffen',k:0,e:{konto:-v.a,wohl:-6},f:L('Die Konsole kommt nie an. Das Geld ist weg.','Die Konsole kommt nie an – ein Fake-Shop. Bei Vorkasse an Unbekannte ist das Geld meist verloren.')},
  {l:'Shop prüfen (Impressum, Bewertungen) und ablehnen',k:2,e:{wohl:2},f:L('Sehr gut! Du hast den Betrug erkannt.','Sehr gut: Du erkennst die Warnsignale und sparst dir Geld und Ärger. Verdächtige Shops kannst du der Verbraucherzentrale melden.')},
  {l:`Konsole bei einem Händler vor Ort kaufen (${eur(v.b)})`,k:1,e:{konto:-v.b,wohl:6},f:L('Das ist sicher, aber teuer. Gebraucht wäre günstiger.','Sicher, aber nicht billig. Gebraucht oder im Angebot geht es günstiger.')}]},

{id:'phishing',cat:'digital',d:2,t:'Die SMS',icon:'✉️',
 v:s=>({a:sc(s,350)}),
 body:()=>L('Du bekommst eine SMS: „Dein Paket wartet. Zahle 2,99 € Zollgebühr.“ Es gibt einen Link. Du erwartest tatsächlich ein Paket.','Eine SMS kommt an: „Dein Paket kann nicht zugestellt werden. Zahle 2,99 € Zollgebühr: [Link]“. Du erwartest tatsächlich ein Paket.','Eine SMS fordert dich zur Zahlung einer „Zollgebühr“ (2,99 €) über einen Link auf. Du erwartest eine Lieferung. Absenderkennung und Linkadresse wirken ungewöhnlich.'),
 tip:()=>L('Prüfe Pakete nur in der offiziellen App des Paketdienstes.','Seriöse Paketdienste verlangen selten Gebühren per SMS-Link. Prüfe den Status nur über die offizielle App oder Website.'),
 opts:(s,v)=>[
  {l:'Link öffnen und Kartendaten eingeben',k:0,e:{konto:-v.a,wohl:-8},f:L(`Das war Betrug! ${eur(v.a)} wurden von deiner Karte abgebucht.`,`Phishing: Betrüger haben deine Kartendaten abgegriffen und ${eur(v.a)} abgebucht. Sperre sofort die Karte und melde den Betrug.`)},
  {l:'SMS löschen und den Paketstatus in der offiziellen App prüfen',k:2,e:{wohl:2},f:L('Richtig! Du bist nicht auf den Betrug hereingefallen.','Richtig: Betrugs-SMS erkennst du an Zeitdruck und seltsamen Links. Du prüfst den Status auf offiziellem Weg.')},
  {l:'Auf den Link tippen, aber nichts eingeben',k:1,e:{wohl:-1},f:L('Schon das Öffnen kann gefährlich sein. Besser nicht antippen.','Schon das Öffnen von Betrugsseiten kann riskant sein (z. B. Schadsoftware). Besser gar nicht antippen.')},
  {l:'Die SMS an Freunde weiterleiten: „Passt auf!“',k:1,e:{wohl:1},f:L('Nett von dir! Besser: SMS melden und löschen.','Gut gemeint. Noch besser: Betrugs-SMS melden (z. B. Verbraucherzentrale) und dann löschen.')}]},

{id:'haushaltsbuch',cat:'geld',d:1,t:'Wo ist das Geld hin?',icon:'🔍',
 body:()=>L('Am Monatsende ist dein Konto fast leer. Du weißt nicht, wohin das Geld gegangen ist.','Am Ende des Monats ist dein Konto fast leer, obwohl du nichts Besonderes gekauft hast. Du hast keinen Überblick über deine Ausgaben.','Zum Monatsende ist dein Kontostand unerwartet niedrig. Du hast keine Übersicht über kleinere Ausgaben, die sich summieren. Dir fehlt ein System zur Ausgabenkontrolle.'),
 tip:()=>L('Aufschreiben hilft. Dann siehst du, was du ausgibst.','Ein Haushaltsbuch (Heft oder App) macht sichtbar, wohin das Geld fließt. Oft sind es kleine Beträge, die sich summieren.'),
 opts:()=>[
  {l:'Einen Monat lang ein Haushaltsbuch (App) führen',k:2,e:{wohl:2,flag:{hb:true}},f:L('Super! Jetzt siehst du, was du ausgibst. Du kaufst weniger Kleinkram.','Du erkennst deine „Geldfresser“ (Snacks, Abos, Kleinkram). Dein Haushaltsbuch senkt künftige Spontankäufe.')},
  {l:'Weitermachen wie bisher',k:0,e:{},f:L('Ohne Überblick passiert das wieder.','Ohne Überblick wiederholt sich das – und die Spontankäufe bleiben unsichtbar.')},
  {l:'Zufällig überall kürzen (auch beim Essen)',k:1,e:{wohl:-4},f:L('Du sparst Geld. Aber du weißt nicht, wo es wirklich hilft.','Blindes Kürzen belastet dich, ohne gezielt zu helfen. Erst messen, dann sparen.')}]},

{id:'sparziel',cat:'geld',d:1,t:'Ein Sparziel',icon:'🎯',
 v:s=>{const g={azubi:1200,stud:1200,dual:1500,fach:2400}[s.path];return {g,m:Math.round(g/12)}},
 body:(s,v)=>L(`Du möchtest in 12 Monaten ${eur(v.g)} haben (z. B. für den Führerschein oder eine Reise). Wie sparst du am besten?`,`Du möchtest in einem Jahr ${eur(v.g)} zur Seite gelegt haben – z. B. für den Führerschein oder eine Reise. Wie gehst du das an?`,`Du setzt dir ein Sparziel von ${eur(v.g)} innerhalb von zwölf Monaten. Entscheidend ist, wie du das Sparen organisierst, damit du dein Ziel wirklich erreichst.`),
 tip:()=>L('Zahle zuerst dich selbst: Spare gleich am Monatsanfang.','Pay yourself first: Richte einen Dauerauftrag zum Monatsanfang ein. Was übrig bleibt, gibst du aus – nicht umgekehrt.'),
 calc:(s,v)=>({q:`Du willst ${eur(v.g)} in 12 Monaten sparen. Wie viel musst du jeden Monat zurücklegen (in €)?`,ans:v.m,sol:`${eur(v.g)} : 12 = ${eur(v.m)}`}),
 opts:(s,v)=>[
  {l:`Dauerauftrag: ${eur(v.m)} jeden Monat zum Monatsanfang`,k:2,e:{wohl:2,rec:[{n:'Sparziel (Dauerauftrag)',a:v.m,m:12,type:'spar'}]},f:L('Super! Das Geld wird automatisch gespart.','Sehr gut: Der Dauerauftrag spart automatisch, bevor du das Geld ausgeben kannst.')},
  {l:'Sparen, was am Monatsende übrig bleibt',k:0,e:{},f:L('Meistens bleibt nichts übrig.','Am Monatsende bleibt selten etwas übrig. Wer erst am Ende spart, spart oft gar nicht.')},
  {l:`Länger sparen: nur ${eur(v.m/2)} pro Monat (Ziel in 24 Monaten)`,k:1,e:{rec:[{n:'Sparziel (halber Betrag)',a:Math.round(v.m/2),m:12,type:'spar'}]},f:L('Auch das klappt, aber du brauchst länger.','Machbar, wenn das Budget knapp ist: Du erreichst das Ziel später.')}]},

{id:'geschenk',cat:'konsum',d:1,t:'Gruppengeschenk',icon:'🎂',
 v:s=>({a:sc(s,40)}),
 body:(s,v)=>L(`Ein Freund hat Geburtstag. Die Gruppe schenkt ein teures Geschenk. Jeder zahlt ${eur(v.a)}.`,`Ein Freund aus der Gruppe hat Geburtstag. Alle sollen für ein gemeinsames Geschenk ${eur(v.a)} zahlen. Dein Budget ist knapp.`,`Im Freundeskreis wird für ein Geburtstagsgeschenk gesammelt (${eur(v.a)} pro Person). Du spürst Gruppendruck, möchtest aber dein Budget schützen.`),
 tip:()=>L('Ein gutes Geschenk muss nicht teuer sein.','Wertschätzung zeigt sich nicht am Preis. Persönliche Geschenke kommen oft besser an als teure.'),
 opts:(s,v)=>[
  {l:'Mitzahlen, damit alle zufrieden sind',k:1,e:{konto:-v.a,wohl:3},f:L('Das ist okay. Aber du hast mitgemacht, ohne zu überlegen.','Okay, aber du hast aus Gruppendruck mitgezahlt, ohne dein Budget zu prüfen.')},
  {l:'Selbstgemachtes Geschenk (Gutschein, Foto-Collage)',k:2,e:{konto:-10,wohl:5},f:L('Wunderbar! Persönlich und günstig.','Persönlich, günstig und oft viel wertvoller als ein Geldbetrag.')},
  {l:'Nicht mitmachen, ohne etwas zu sagen',k:0,e:{wohl:-5},f:L('Das führt zu Ärger. Besser: Sag, was du kannst.','Schweigen führt zu Missverständnissen. Ehrlich zu sagen, was du dir leisten kannst, ist besser.')}]},

{id:'vertreter',cat:'versich',d:2,t:'Der Vertreter',icon:'🧑‍💼',
 body:()=>L('Ein Vertreter klingelt. Er verkauft ein „Sicherheits-Paket“ für 38 € im Monat. Er sagt: „Heute unterschreiben, sonst teurer!“','Ein Vertreter klingelt: „Mit dem Sicherheits-Paket (38 € im Monat) bist du für alles abgesichert. Nur heute!“ Du verstehst nicht alles, was er sagt.','Ein Versicherungsvertreter bietet ein Bündelpaket (u. a. Rechtsschutz, Unfall, Handy) für 38 € monatlich an und drängt auf eine sofortige Unterschrift. Die Vertragsbedingungen bleiben unklar.'),
 tip:()=>L('Gute Angebote gelten auch morgen noch.','Seriöse Angebote halten einen Tag Bedenkzeit aus. Vergleiche unabhängig, z. B. bei der Verbraucherzentrale.'),
 opts:()=>[
  {l:'Unterschreiben, er wirkt nett',k:0,e:{wohl:1,rec:[{n:'Sicherheits-Paket',a:38,m:12}]},f:L('Du zahlst jeden Monat 38 €. Das Paket hat Dinge, die du nicht brauchst.','38 € × 12 = 456 € im Jahr für Leistungen, die du größtenteils nicht brauchst.')},
  {l:'„Ich prüfe das in Ruhe und lasse mich unabhängig beraten.“',k:2,e:{wohl:2},f:L('Super! Du lässt dich nicht drängen.','Du entscheidest in Ruhe und holst unabhängigen Rat. Genau so schützt du dich.')},
  {l:'Die Tür höflich schließen: Kein Interesse',k:1,e:{},f:L('Das ist okay. Du bist sicher.','Ein klares Nein ist völlig in Ordnung.')}]},

{id:'ticket',cat:'vertrag',d:1,t:'Kontrolle in der Bahn',icon:'🎫',when:s=>s.f.mobil==='ticket',
 body:()=>L('In der Bahn kommt der Kontrolleur. Du hast dein Ticket-Handy zu Hause vergessen. Er sagt: 60 € Strafe.','Der Kontrolleur will dein Ticket sehen – du hast das Handy vergessen. Er verlangt ein „erhöhtes Beförderungsentgelt“ von 60 €.','Bei einer Fahrscheinkontrolle kannst du dein digitales Ticket nicht vorzeigen. Er verlangt ein erhöhtes Beförderungsentgelt von 60 €.'),
 tip:()=>L('Du hast ein Ticket! Kann man das später zeigen?','Mit einem persönlichen Ticket kannst du den Nachweis oft nachträglich vorlegen – dann fällt nur eine kleine Gebühr an (7 €).'),
 opts:()=>[
  {l:'60 € zahlen',k:0,e:{konto:-60},f:L('Das war zu teuer. Du hättest das Ticket später zeigen können.','Unnötig teuer: Bei einem gültigen persönlichen Ticket reicht ein späterer Nachweis (7 € Gebühr).')},
  {l:'Ticket später vorzeigen (7 € Bearbeitungsgebühr)',k:2,e:{konto:-7},f:L('Richtig! Du zahlst nur 7 €.','Richtig: Mit Nachweis zahlst du nur eine kleine Bearbeitungsgebühr statt 60 €.')},
  {l:'Behaupten, du hättest nie ein Ticket gebraucht',k:0,e:{konto:-60,wohl:-6},f:L('Das ist unehrlich. Es gibt mehr Ärger.','Falsche Angaben machen die Lage schlimmer. Du zahlst trotzdem.')}]},

{id:'auto',cat:'versich',d:2,t:'Auto kaputt',icon:'🚗',when:s=>s.f.mobil==='auto',
 v:s=>({a:sc(s,520)}),
 body:(s,v)=>L(`Dein Auto muss zum TÜV. Es hat Mängel. Die Reparatur kostet ${eur(v.a)}.`,`Beim TÜV wird ein Mangel festgestellt: Die Reparatur kostet in der ersten Werkstatt ${eur(v.a)}. Du musst innerhalb weniger Wochen nachbessern.`,`Bei der Hauptuntersuchung werden erhebliche Mängel festgestellt. Die nächstgelegene Werkstatt nennt ${eur(v.a)}. Du musst fristgerecht nacharbeiten lassen.`),
 tip:()=>L('Frag in 2 Werkstätten nach dem Preis.','Hole mindestens zwei Kostenvoranschläge ein. Die Preise unterscheiden sich oft deutlich.'),
 opts:(s,v)=>[
  {l:'Zwei Kostenvoranschläge einholen und vergleichen',k:2,e:{konto:-Math.round(v.a*.75)},f:L('Gut! Du sparst Geld.','Vergleichen lohnt sich: Die zweite Werkstatt ist günstiger.')},
  {l:'Die erste Werkstatt nehmen',k:1,e:{konto:-v.a},f:L('Das ist okay. Aber vielleicht gab es günstigere Angebote.','Okay, aber ohne Vergleich zahlst du eventuell zu viel.')},
  {l:'Ohne TÜV weiterfahren',k:0,e:{konto:-60,wohl:-4},f:L('Das ist verboten und gefährlich. Du bekommst Strafe.','Fahren mit abgelaufenem TÜV ist eine Ordnungswidrigkeit (hier 60 €) und gefährlich.')}]},
];

/* Sonderereignis bei überzogenem Dispo */
const EV_NOT={id:'notlage',cat:'geld',d:3,t:'Konto weit im Minus',icon:'🚨',
 body:s=>L('Dein Konto ist zu weit im Minus. Die Bank schickt eine Mahnung. Du musst jetzt handeln.','Dein Konto ist über den Dispo hinaus überzogen. Die Bank schickt eine Mahnung. Jetzt musst du eine Lösung finden.','Die Kontoüberziehung übersteigt den eingeräumten Dispositionskredit; die Bank mahnt. Die Lage erfordert ein strukturiertes Vorgehen, um eine Schuldenspirale zu vermeiden.'),
 tip:()=>L('Du bist nicht allein. Es gibt kostenlose Hilfe.','Schulden sind kein Tabu: Schuldnerberatungen helfen kostenlos. Teure Schnellkredite verschärfen das Problem.'),
 opts:()=>[
  {l:'Familie um eine Überbrückung bitten (300 €)',k:1,e:{konto:300,wohl:-4,flag:{notlage:false},rec:[{n:'Rückzahlung an Familie',a:100,m:3,debt:true}]},f:L('Das hilft. Aber du musst das Geld zurückzahlen.','Eine zinslose Überbrückung ist hilfreich. Wichtig: ehrlich besprechen und feste Raten vereinbaren.')},
  {l:'Zur kostenlosen Schuldnerberatung gehen',k:2,e:{konto:30,wohl:4,flag:{notlage:false,hb:true,sb:3}},f:L('Sehr gut! Die Beratung macht einen Plan mit dir. 3 Monate lang gibst du wenig für Freizeit aus und sparst nicht. So kommst du ins Plus.','Sehr gut: Die Beratung ist kostenlos, verhandelt Gebühren und erstellt einen strengen Ausgabenplan: Drei Monate lang wenig Freizeitbudget und kein Sparen, bis das Konto wieder im Plus ist.')},
  {l:'Einen Online-Schnellkredit aufnehmen (300 €)',k:0,e:{konto:300,wohl:2,flag:{notlage:false},rec:[{n:'Schnellkredit',a:60,m:8,debt:true}]},f:L('Das ist ein Schuldenfalle! 60 € × 8 = 480 € für 300 €.','60 € × 8 = 480 € für 300 € geliehenes Geld. Schnellkredite sind oft teuer und lösen das Grundproblem nicht.')},
  {l:'Nichts tun und Briefe ignorieren',k:0,e:{konto:-25,wohl:-10,flag:{notlage:false}},f:L('Es wird nur schlimmer: Gebühren und Stress.','Ignorieren erzeugt Gebühren (hier 25 €) und Stress. Probleme wachsen, wenn man sie nicht ansieht.')}]};
/* ===== Zustand ===== */
const SAVE='budgetleben_v1',AV=['🧑‍🔧','👩‍🔧','🧑‍🍳','👩‍🎓','👨‍💻','🧑‍🎨','👩‍⚕️','🧑‍🌾'];
let G=null,D=null,Q=[],QN=0,QI=0,R=()=>{};
const app=document.getElementById('app'),$=q=>document.querySelector(q);
const sg=n=>(n>0?'+':'−')+Math.abs(Math.round(n)).toLocaleString('de-DE')+' €';
const debt=()=>G.rec.filter(r=>r.debt&&r.a>0).reduce((t,r)=>t+r.a*r.m,0);
const tl=a=>a[G.cur.lang],tx=a=>gl(a[G.cur.lang]);
function newGame(jg=8){return {v:1,name:'',av:AV[0],path:'azubi',months:12,jg,set:{df:'A',lang:'A',cx:'A'},cur:{...PRESET[jg]},started:false,month:0,konto:250,spar:0,wohl:60,income:0,dispo:300,kaution:0,f:{},fix:{},rec:[],used:[],log:[],comp:{},tips:0,tipsMonth:0,gl:0,mScores:[],plan:{fz:80,sp:30},mo:null,refl:[],adaptLog:[],rot:0,dispoMonths:0}}
function draw(html,keep){const y=window.scrollY;app.innerHTML=(G&&G.started?header():'')+html;window.scrollTo(0,keep?y:0)}
function chip(ic,t,c){return `<span class="chip ${c||''}">${ic} ${t}</span>`}
function header(){

function applyEff(e,d){
  const s=G;

  if(e.spar){s.spar+=e.spar;if(s.spar<0){s.konto+=s.spar;s.spar=0}}
  if(e.wohl)s.wohl=clamp(s.wohl+e.wohl,0,100);
  if(e.income)s.income+=e.income;
  if(e.kaution!==undefined){s.kaution=e.kaution;s.spar-=e.kaution;if(s.spar<0){s.konto+=s.spar;s.spar=0}}
  [].concat(e.fix||[]).forEach(f=>{if(f.a>0||f.w)s.fix[f.key]={n:f.n,a:f.a,w:f.w||0};else delete s.fix[f.key]});

function startMonth(){const s=G;s.month++;s.mo={k0:s.konto,ev:[],tip:false};s.mScores=[];s.tipsMonth=0;plan()}
function base(){const s=G;let fixT=0,recC=0,recI=0,recS=0;Object.values(s.fix).forEach(x=>fixT+=x.a);
  s.rec.forEach(r=>{if(r.type==='spar')recS+=r.a;else if(r.a>0)recC+=r.a;else recI+=-r.a});
  return {inc:s.income,fixT,recC,recI,recS,imp:s.cur.cx===1?0:Math.round([0,0,25,45][s.cur.df]*PF[s.path]*(s.f.hb?.4:1))}}
function planLeft(){const b=base(),p=G.plan;return b.inc+b.recI-b.fixT-b.recC-b.imp-b.recS-p.fz-p.sp}
function rowsBase(b,detail){
  const s=G,r=[];r.push([s.cur.cx===3&&P(s.path).sub?`Einkommen (netto) – ${P(s.path).sub}`:'Einkommen (netto)',b.inc]);
  if(detail){s.rec.filter(x=>x.a<0&&x.type!=='spar').forEach(x=>r.push([x.n,-x.a]))}else if(b.recI)r.push(['Rückzahlungen & Ersparnisse',b.recI]);
  if(detail)Object.values(s.fix).forEach(x=>r.push([x.n,-x.a]));else r.push(['Feste Kosten (Miete, Essen, Handy, Versicherungen …)',-b.fixT]);
  if(detail)s.rec.filter(x=>x.a>0&&x.type!=='spar').forEach(x=>r.push([x.n+(x.debt?' (Rate)':''),-x.a]));else if(b.recC)r.push(['Raten & laufende Verträge',-b.recC]);
  if(b.imp)r.push(['Kleinkram & Impulskäufe',-b.imp]);
  s.rec.filter(x=>x.type==='spar').forEach(x=>r.push([x.n+' → Rücklagen',-x.a]));
  return r;
}

function plan(keep){
  R=()=>plan(true);const s=G,b=base(),cx=s.cur.cx,detail=cx>=2;
  let fzM=clamp(Math.round(s.income*.2/10)*10,120,400),spM=Math.round(s.income*.4/10)*10;if(s.f.sb>0){fzM=Math.min(fzM,50);spM=0}
  s.plan.fz=Math.min(s.plan.fz,fzM);s.plan.sp=Math.min(s.plan.sp,spM);
  const left=planLeft(),pl=s.plan;
  draw(`<section class="card"><div class="pill">Monat ${s.month} von ${s.months}</div><h2>Dein Plan für diesen Monat</h2>
  <p>${tx(L('Das ist dein Geld in diesem Monat. Entscheide, wie viel du für Freizeit ausgibst und wie viel du sparst.','Das ist dein Geld in diesem Monat. Plane, wie viel du für Freizeit ausgibst und wie viel du sparst. Danach passieren Dinge, die du nicht planen konntest.','Hier siehst du deine regelmäßigen Einnahmen und Ausgaben. Lege dein Budget für Freizeit und Rücklagen fest; anschließend treten Ereignisse ein, die du nicht vorhersehen konntest.'))}</p>
  ${stmt(rowsBase(b,detail))}
  <label class="lbl" for="fz">🎉 Freizeit & Spaß: <span id="fzv">${eur(pl.fz)}</span></label><input type="range" id="fz" min="0" max="${fzM}" step="10" value="${pl.fz}" data-in="fz">
  <label class="lbl" for="sp">🐷 Sparen (Rücklagen): <span id="spv">${eur(pl.sp)}</span></label><input type="range" id="sp" min="0" max="${spM}" step="10" value="${pl.sp}" data-in="sp">
  ${s.f.sb>0?`<div class="tipbox">🧑‍💼 <b>Ausgabenplan der Schuldnerberatung</b> – noch ${s.f.sb} Monat${s.f.sb>1?'e':''}: wenig Freizeitbudget, kein Sparen, bis dein Konto wieder im Plus ist.</div>`:''}
  <p id="left" class="body"></p>
  <div class="row"><button class="tipbtn" data-a="ptip">💡 Tipp ${s.mo.tip?'ausblenden':'holen'}</button></div>${s.mo.tip?`<div class="tipbox">${tx(L('Spare zuerst, dann gib aus. Lege etwas für Notfälle zur Seite. Wenn der Rest negativ ist, rutscht dein Konto ins Minus.','Faustregel 50/30/20: etwa 50 % für feste Kosten, 30 % für Wünsche, 20 % fürs Sparen. Ein Notgroschen von 2 bis 3 Monatseinkommen schützt dich vor Schulden. Ist der Rest negativ, nutzt du den teuren Dispo.','Orientierung bietet die 50/30/20-Regel: Fixkosten, Wünsche, Sparen. Ein Notgroschen von zwei bis drei Netto-Monatsgehältern vermeidet die Inanspruchnahme des teuren Dispokredits.'))}</div>`:''}
  <button class="btn big" data-a="go">Monat starten</button></section>`,keep);
  updPlan();
}
function updPlan(){const s=G,l=planLeft(),e=$('#left');if(!e)return;$('#fzv').textContent=eur(s.plan.fz);$('#spv').textContent=eur(s.plan.sp);
  e.innerHTML=l>=0?`Nach deinem Plan bleiben voraussichtlich <b class="pos">${eur(l)}</b> übrig – dein Puffer für Überraschungen.`:`Nach deinem Plan fehlen dir <b class="neg">${eur(-l)}</b>. Dein Konto rutscht ins Minus (Dispo kostet Zinsen)!`}
function pickEvents(){
  const s=G,out=[],cx=s.cur.cx,n=cx===1?1:cx===2?(s.month%2===0?2:1):2;
  if(s.f.notlage)out.push(EV_NOT);
  const pool=()=>EVENTS.filter(e=>!s.used.includes(e.id)&&!out.includes(e)&&(!e.paths||e.paths.includes(s.path))&&(!e.when||e.when(s))&&(e.d<3||s.month>=2));
  while(out.length<n){const p=pool();if(!p.length)break;const w=p.map(e=>Math.max(1,3-Math.abs(e.d-s.cur.df)));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(r>=w[i]){r-=w[i];i++}out.push(p[i])}
  return out;
}
function runEvent(){
  if(!Q.length)return closeMonth();
  const e=Q.shift();QI++;if(e!==EV_NOT)G.used.push(e.id);const v=e.v?e.v(G):{};
  runDecision({kind:'event',id:e.id,cat:e.cat,t:e.t,icon:e.icon,label:`Monat ${G.month} · Ereignis ${QI} von ${QN}`,body:e.body(G,v),tip:e.tip(G,v),calc:e.calc?e.calc(G,v):null,opts:e.opts(G,v),kmax:2},runEvent);
}
function adapt(){
  const s=G,sc=s.mScores;if(!sc.length)return null;
  const avg=sc.reduce((a,b)=>a+b,0)/sc.length,dims=['df','cx','lang'].filter(k=>s.set[k]==='A');if(!dims.length)return null;
  let dir=0;if(avg>=.8&&s.tipsMonth===0)dir=1;else if(avg<=.4||(avg<.6&&s.tipsMonth>=3))dir=-1;
  if(!dir)return null;
  const rot=a=>{const r=s.rot%a.length;return a.slice(r).concat(a.slice(0,r))};
  let order=dir>0?rot(['cx','df','lang']):s.tipsMonth>=2?['lang','cx','df']:rot(['df','cx','lang']);
  order=order.filter(k=>dims.includes(k));
  for(const k of order){const nv=s.cur[k]+dir,lo=k==='lang'?0:1,hi=k==='lang'?2:3;
    if(nv>=lo&&nv<=hi){s.cur[k]=nv;s.rot++;
      const nm={df:'Die Geldprobleme',cx:'Die Aufgaben',lang:'Die Sprache'}[k];
      const m=dir>0?`Das läuft richtig gut! ${nm} werden etwas ${k==='df'?'härter':k==='cx'?'komplexer':'anspruchsvoller'} (${k==='df'?DIFFN[nv]:k==='cx'?CXN[nv]:LANGN[nv]}).`:`Kein Problem – das Spiel macht es dir leichter: ${nm} werden ${k==='lang'?'einfacher':k==='df'?'etwas leichter':'etwas überschaubarer'} (${k==='df'?DIFFN[nv]:k==='cx'?CXN[nv]:LANGN[nv]}).`;
      s.adaptLog.push({m:s.month,k,dir});return m}}
  return null;
}
function closeMonth(){
  const s=G,b=base(),pl=s.plan,detail=s.cur.cx>=2,k0=s.mo.k0;
  const rows=[];
  rowsBase(b,detail).forEach(r=>rows.push(r));
  rows.push(['Freizeit & Spaß',-pl.fz]);if(pl.sp)rows.push(['Gespart (Rücklagen)',-pl.sp]);
  s.mo.ev.forEach(x=>rows.push([x.t,x.a]));
  let net=b.inc+b.recI-b.fixT-b.recC-b.imp-pl.fz-pl.sp-b.recS;
  const kBefore=s.konto;let after=kBefore+net;
  const zins=after<0?Math.round(-after*.012):0;if(zins){rows.push(['Dispozinsen (ca. 14 % pro Jahr)',-zins]);after-=zins}
  let mahn=0;
  s.spar+=pl.sp+b.recS;s.konto=after;
  const wOld=s.wohl;
  let w=Math.round(Object.values(s.fix).reduce((t,x)=>t+(x.w||0),0)/3)+Math.round((pl.fz-s.income*.09)/(s.income*.03))+(s.spar>=500?1:0)+Math.round((60-s.wohl)*.15);
  if(s.f.sb>0)s.f.sb--;
  if(s.konto<0){w-=4;s.dispoMonths++}
  if(s.konto<-s.dispo){mahn=15;s.konto-=15;w-=8;s.f.notlage=true;rows.push(['Mahngebühren der Bank',-15])}
  s.wohl=clamp(s.wohl+w,0,100);
  s.rec.forEach(r=>r.m--);s.rec=s.rec.filter(r=>r.m>0);
  const note=adapt();
  const avg=s.mScores.length?s.mScores.reduce((a,b)=>a+b,0)/s.mScores.length:null;
  s.last={rows,k0,end:s.konto,note,avg,wOld,mahn,zins};
  try{localStorage.setItem(SAVE,JSON.stringify(s))}catch(e){}
  result();
}
function result(){
  R=result;const s=G,r=s.last;
  const stars=r.avg===null?'':'⭐'.repeat(Math.round(r.avg*3))+'☆'.repeat(3-Math.round(r.avg*3));
  const coach=s.konto<-s.dispo?L('Dein Konto ist zu weit im Minus. Die Bank hat dich gemahnt. Nächsten Monat musst du das lösen.','Du hast den Dispo überschritten und eine Mahnung bekommen. Im nächsten Monat musst du dringend gegensteuern.','Der Dispositionsrahmen ist überschritten; die Bank mahnt. Im Folgemonat ist ein Gegensteuern dringend nötig.')
   :s.konto<0?L('Dein Konto ist im Minus. Das kostet Zinsen. Versuche, ins Plus zu kommen.','Dein Konto ist im Minus (Dispo). Das kostet Zinsen – plane im nächsten Monat mehr Puffer ein.','Das Konto ist überzogen; Dispozinsen belasten dein Budget. Plane im nächsten Monat einen höheren Puffer ein.')
   :s.konto>=r.k0?L('Gut! Du hast mehr Geld als am Anfang des Monats.','Gut gewirtschaftet: Dein Kontostand ist höher als zu Monatsbeginn.','Positive Monatsbilanz: Der Kontostand liegt über dem Anfangswert.')
   :L('Dein Konto ist im Plus, aber niedriger als vorher.','Dein Konto ist im Plus, aber niedriger als zu Monatsbeginn – ein Puffer schützt dich bei Überraschungen.','Das Konto bleibt im Plus, sinkt jedoch gegenüber dem Vormonat; ein ausreichender Puffer bleibt wichtig.');
  draw(`<section class="card"><div class="pill">Monat ${s.month} geschafft ${stars}</div><h2>Dein Kontoauszug</h2>${stmt(r.rows,r.k0,r.end)}
  <p>${gl(tl(coach))}</p>${s.konto>s.income*1.5?`<p>💡 ${gl(tl(L('Auf dem Girokonto liegt viel Geld. Dort gibt es keine Zinsen. Lege das Geld, das du nicht brauchst, auf ein Tagesgeldkonto.','Auf deinem Girokonto liegt viel Geld ohne Zinsen. Was du nicht braucht, kannst du auf ein Tagesgeldkonto legen – und es jederzeit zurückholen.','Das Guthaben auf dem Girokonto wird nicht verzinst. Überschüssige Mittel lassen sich auf einem Tagesgeldkonto anlegen, ohne die Verfügbarkeit zu verlieren.')))}</p>`:''}<p class="mut">😊 Wohlbefinden: ${r.wOld} → ${s.wohl}${s.spar>0?` · 🐷 Rücklagen: ${eur(s.spar)}`:''}</p>
  ${r.note?`<div class="tipbox">✨ ${r.note}</div>`:''}
  <button class="btn big" data-a="nxt">${s.month>=s.months?'Zur Auswertung':s.month%3===0?'Weiter zur Reflexion':'Nächster Monat'}</button></section>`);
}
const RQ=[
 ['Welche Entscheidung war bisher besonders klug – und warum?','Welche Entscheidung würdest du heute anders treffen? Was hast du daraus gelernt?'],
 ['Wo haben Werbung, Zeitdruck oder Gruppendruck deine Entscheidungen beeinflusst?','Woran erkennst du, ob ein Angebot wirklich gut ist?'],
 ['Was war die größte Überraschung für dich – und wie bist du damit umgegangen?','Welche Regel für den Umgang mit Geld nimmst du für dein echtes Leben mit?'],
 ['Was hat dein Verhalten in diesem Jahr verändert?','Wem würdest du welchen Tipp geben?']];
function reflect(a1,a2){
  const s=G;s._rq=Math.floor(s.month/3-1)%RQ.length;R=()=>reflect($('#r1')?$('#r1').value:'',$('#r2')?$('#r2').value:'');
  const q=RQ[s._rq];
  draw(`<section class="card"><div class="pill">Zwischenreflexion · nach Monat ${s.month}</div><h2>Kurz innehalten</h2>
  <label class="lbl" for="r1">${q[0]}</label><textarea id="r1">${esc(a1||'')}</textarea>
  <label class="lbl" for="r2">${q[1]}</label><textarea id="r2">${esc(a2||'')}</textarea>
  <label class="lbl">Wie sicher fühlst du dich beim Umgang mit Geld? (1 = unsicher, 5 = sehr sicher)</label>
  <div class="seg">${[1,2,3,4,5].map(n=>`<button data-a="sure" data-v="${n}" class="${s._sure===n?'on':''}">${n}</button>`).join('')}</div>
  <button class="btn big" data-a="rf">Weiter zu Monat ${s.month+1}</button></section>`);
}

/* ===== Auswertung ===== */
function stats(){
  const s=G,pc={};let tot=0,cnt=0;
  Object.keys(CATS).forEach(k=>{const c=s.comp[k];if(c&&c.max){pc[k]=Math.round(c.got/c.max*100);tot+=pc[k];cnt++}});
  const avg=cnt?Math.round(tot/cnt):0,d=debt();
  const lvl=avg>=80?'Verbraucher-Profi 🏆':avg>=60?'Gut informiert 👍':avg>=40?'Auf dem Weg 🧭':'Noch viel zu entdecken 🔍';
  const B=[];const g=k=>pc[k];
  if(s.f.coverHaft&&!s.f.insHandy)B.push('🛡️ Absicherungs-Profi');
  if(s.spar>=800)B.push('🐷 Notgroschen aufgebaut');
  if(d===0&&s.dispoMonths===0)B.push('💳 Dispo- und schuldenfrei');
  if(g('vertrag')>=75)B.push('📄 Kleingedrucktes-Leser');
  if(g('digital')>=75)B.push('🔒 Betrugsabwehr');
  if(s.tips<=3)B.push('🧠 Selbstständig entschieden');
  if(s.wohl>=65)B.push('😊 Gut im Gleichgewicht');
  if(s.f.hb)B.push('📒 Haushaltsbuch-Held');
  return {pc,avg,lvl,B,d};
}
function reportText(){
  const s=G,st=stats(),p=P(s.path);
  const refl=s.refl.map(r=>`Monat ${r.m}:\n- ${r.q1}\n  ${r.a1||'(keine Antwort)'}\n- ${r.q2}\n  ${r.a2||'(keine Antwort)'}${r.sure?`\n- Sicherheit im Umgang mit Geld: ${r.sure} von 5`:''}`).join('\n\n');
  const fin=['f1','f2','f3'].map(i=>($('#'+i)||{value:''}).value.trim());
  return `MEIN BUDGET-LEBEN – LERNBERICHT\nFigur: ${s.av} ${s.name} · Lebensweg: ${p.n} · ${s.months} Monate\n\nErgebnis\n- Konto: ${eur(s.konto)}\n- Rücklagen: ${eur(s.spar)}\n- Kaution (kommt zurück): ${eur(s.kaution)}\n- Schulden: ${eur(st.d)}\n- Wohlbefinden: ${s.wohl} von 100\n- Tipps genutzt: ${s.tips}\n\nKompetenzen (${st.lvl.replace(/[^\wäöüÄÖÜß\- ]/g,'').trim()})\n${Object.keys(st.pc).map(k=>`- ${CATS[k][1]}: ${st.pc[k]} %`).join('\n')}\n\nAbzeichen: ${st.B.length?st.B.join(', '):'noch keine'}\n\nWichtige Entscheidungen\n${s.log.filter(x=>x.k<x.kx).slice(0,8).map(x=>`- ${x.t}: Du hast „${x.c}“ gewählt. Besser wäre: ${x.best}`).join('\n')||'- Alle klug entschieden!'}\n\nZwischenreflexionen\n${refl||'(keine)'}\n\nAbschlussreflexion\n1. Was war meine wichtigste Erkenntnis?\n${fin[0]||'(keine Antwort)'}\n2. Welche Entscheidung würde ich im echten Leben anders treffen?\n${fin[1]||'(keine Antwort)'}\n3. Was nehme ich mir für mein echtes Geld vor?\n${fin[2]||'(keine Antwort)'}`;
}
function final(){
  R=()=>final();const s=G,st=stats(),lm=s.log.filter(x=>x.k<x.kx&&x.kx>0).sort((a,b)=>a.k/a.kx-b.k/b.kx).slice(0,5),good=s.log.filter(x=>x.k===x.kx).slice(0,3);
  const keep=[1,2,3].map(i=>($('#f'+i)||{value:''}).value);
  try{localStorage.removeItem(SAVE)}catch(e){}
  draw(`<section class="card"><div class="pill">${s.months} Monate geschafft</div><h1 style="font-size:clamp(30px,7vw,44px)">${s.av} ${esc(s.name)}</h1><p class="lead">Dein Level: <b>${st.lvl}</b></p>
  <div class="chips"><span class="chip">💶 Konto ${eur(s.konto)}</span><span class="chip">🐷 Rücklagen ${eur(s.spar)}</span><span class="chip">🔐 Kaution ${eur(s.kaution)}</span><span class="chip ${st.d>0?'neg':''}">📉 Schulden ${eur(st.d)}</span><span class="chip">😊 ${s.wohl}/100</span><span class="chip">💡 ${s.tips} Tipps</span></div></section>
  <section class="card"><h2>Dein Verbraucher-Check</h2>${Object.keys(CATS).map(k=>{const p=st.pc[k];return p===undefined?'':`<div class="comp"><div class="l"><span>${CATS[k][0]} ${CATS[k][1]}</span><span>${p} %</span></div><div class="t"><i style="width:${p}%"></i></div></div>`}).join('')}
   ${st.B.length?`<h3 style="margin-top:18px">Abzeichen</h3><div class="badges">${st.B.map(b=>`<span>${b}</span>`).join('')}</div>`:''}</section>
  <section class="card"><h2>Daraus kannst du lernen</h2>${lm.length?`<ul class="moments">${lm.map(x=>`<li><b>${esc(x.t)}</b> – du hast: „${esc(x.c)}“. <span class="mut">Besser: ${esc(x.best)}</span></li>`).join('')}</ul>`:'<p>Du hast fast alles klug entschieden. Stark!</p>'}
   ${good.length?`<h3>Das hast du richtig gemacht</h3><ul class="moments">${good.map(x=>`<li>${esc(x.t)}: „${esc(x.c)}“</li>`).join('')}</ul>`:''}</section>
  <section class="card"><h2>Deine Abschlussreflexion</h2>
   <label class="lbl" for="f1">Was war meine wichtigste Erkenntnis?</label><textarea id="f1">${esc(keep[0])}</textarea>
   <label class="lbl" for="f2">Welche Entscheidung würde ich im echten Leben anders treffen?</label><textarea id="f2">${esc(keep[1])}</textarea>
   <label class="lbl" for="f3">Was nehme ich mir für mein echtes Geld vor?</label><textarea id="f3">${esc(keep[2])}</textarea>
   <div class="row" style="margin-top:14px"><button class="btn" data-a="copy">📋 Lernbericht kopieren</button><button class="ghost" data-a="again">Neues Spiel</button></div><div id="cpmsg" class="small" style="margin-top:10px"></div></section>`);
}

/* ===== Ereignisse verdrahten ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close'&&b.id==='sheet'&&e.target!==b)return;const f=ACT[b.dataset.a];if(f)f(b.dataset,b,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.in;if(!k||!G)return;if(k==='name')G.name=t.value;else if(k==='fz'||k==='sp'){G.plan[k]=+t.value;updPlan()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='calcIn'){e.preventDefault();ACT.calc()}if(e.key==='Escape'&&$('#sheet'))closeSheet()});
window.__t={get G(){return G},get D(){return D},EVENTS,SETUP};
home();

</script>
