<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<title>Mindmap-Werkstatt</title>
<meta name="description" content="Mindmaps erstellen, gestalten und präsentieren: vier Anordnungen, Vorlagen, Aufgaben, Querverbindungen, Präsentationsmodus und Export als Bild, PDF oder Gliederung.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="buildspace">
<meta property="og:title" content="Mindmap-Werkstatt – buildspace">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Familjen+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Patrick+Hand&display=swap">
</head>
<body>
<style>
/* Layout: full-bleed canvas workshop — tool band on top, inspector on the right (bottom sheet on phones), zoom dock + minimap floating at the bottom */
:root{
  --bg:#E9EDF4; --canvas:#F5F7FB; --grid:#C7D0DE; --fg:#1A2130; --muted:#5B6579;
  --panel:#FFFFFF; --panel-2:#EEF2F8; --line:#D8DEE8; --accent:#2346C8; --accent-fg:#FFFFFF;
  --accent-soft:#E2E8FB; --node-bg:#FFFFFF; --danger:#C2362B; --ok:#1F8A4C; --hl:#F2B705;
  --shadow:0 1px 2px rgba(20,30,60,.08),0 8px 24px rgba(20,30,60,.10);
  --ui-font:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --node-font:"Atkinson Hyperlegible",system-ui,sans-serif;
  --node-size:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-app]){
    --bg:#10151F; --canvas:#151B27; --grid:#283246; --fg:#E6EBF4; --muted:#97A2B7;
    --panel:#1B2230; --panel-2:#242C3C; --line:#313B4F; --accent:#7D97FF; --accent-fg:#0E1424;
    --accent-soft:#263156; --node-bg:#1E2534; --hl:#FFCF3D; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-app]), :root[data-app="dunkel"]{
  --bg:#10151F; --canvas:#151B27; --grid:#283246; --fg:#E6EBF4; --muted:#97A2B7;
  --panel:#1B2230; --panel-2:#242C3C; --line:#313B4F; --accent:#7D97FF; --accent-fg:#0E1424;
  --accent-soft:#263156; --node-bg:#1E2534; --hl:#FFCF3D; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-app="tafel"]{
  --bg:#17302A; --canvas:#1F3D35; --grid:#2F5348; --fg:#F1F0E6; --muted:#B4C4BA;
  --panel:#16302A; --panel-2:#21423A; --line:#365C50; --accent:#F4D35E; --accent-fg:#17302A;
  --accent-soft:#3A4F2E; --node-bg:#24463D; --hl:#F4D35E; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
:root[data-app="papier"]{
  --bg:#ECE6DA; --canvas:#F8F4EA; --grid:#D9CDB6; --fg:#2B2822; --muted:#6C6455;
  --panel:#FFFDF7; --panel-2:#F2ECDF; --line:#E0D6C3; --accent:#2F4A7A; --accent-fg:#FFFFFF;
  --accent-soft:#E2E6EE; --node-bg:#FFFDF7; --hl:#E0A100;
}
:root[data-app="kontrast"]{
  --bg:#000000; --canvas:#000000; --grid:#3A3A3A; --fg:#FFFFFF; --muted:#E0E0E0;
  --panel:#000000; --panel-2:#1A1A1A; --line:#FFFFFF; --accent:#FFE500; --accent-fg:#000000;
  --accent-soft:#3A3500; --node-bg:#000000; --hl:#00E5FF; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui-font);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Tool band ---------- */
#bar{display:flex;align-items:center;gap:10px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 250px}
.brand svg{width:28px;height:28px;flex:none}
#title{font:600 16px var(--ui-font);background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 7px;min-width:0;width:100%;text-overflow:ellipsis}
#title:hover{border-color:var(--line)}
#title:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.tools{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:500 13.5px var(--ui-font);cursor:pointer;white-space:nowrap;flex:none}
.tb svg,.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb:hover{background:var(--panel-2)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.icon{padding:0;width:36px;justify-content:center}
.tb.pri{background:var(--accent);color:var(--accent-fg)}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.grow{flex:1 0 8px}
.tsel{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 4px 0 9px;border-radius:8px;flex:none}
.tsel:hover{background:var(--panel-2)}
.tsel svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tsel select{border:0;background:transparent;font:500 13.5px var(--ui-font);cursor:pointer;padding:6px 2px;max-width:170px}
.search{display:inline-flex;align-items:center;gap:4px;flex:none}
#q{width:170px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 9px}
#qn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.5em}
.big .tb,.big .tsel{height:46px}
.big .tb.icon{width:46px}
@media (max-width:1180px){.tb.lab span{display:none}.tb.lab{padding:0;width:36px;justify-content:center}.big .tb.lab{width:46px}}
@media (max-width:700px){#bar{flex-wrap:wrap;row-gap:4px}.brand{flex:1 1 100%}#q{width:120px}.tsel select{max-width:110px}}

/* ---------- Stage ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);touch-action:none;outline:none;min-width:0}
#stage.g-dots{background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.7px)}
#stage.g-lines{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
#stage.panning{cursor:grabbing}
.spacepan #stage{cursor:grab}
.connecting #stage,.connecting .node{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.cam{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}
.lvis{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}
.xl.on .lvis{stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
.arrh{fill:var(--muted)} .arrh2{fill:var(--accent)}
.llab{font:600 13px var(--ui-font);fill:var(--fg);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--canvas);stroke-width:6px;stroke-linejoin:round}
.lhit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.lsel{fill:none;stroke:var(--accent);stroke-opacity:.28;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.lhandle{fill:var(--panel);stroke:var(--accent);stroke-width:2.5;pointer-events:all;cursor:grab;vector-effect:non-scaling-stroke}

/* ---------- Nodes ---------- */
.node{position:absolute;left:0;top:0;width:max-content;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:260px;padding:8px 14px;font-family:var(--node-font);line-height:1.3;border:2px solid transparent;border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.node.d0{padding:13px 22px;max-width:320px;box-shadow:var(--shadow)}
.node.d1{padding:9px 16px}
.s-pill{border-radius:999px}
.s-rounded{border-radius:12px}
.s-rect{border-radius:3px}
.s-oval{border-radius:50%;padding:14px 24px;text-align:center}
.s-text{border-width:0 0 3px 0;border-radius:0;padding:4px 4px 5px}
.nrow{display:flex;align-items:center;gap:6px;max-width:100%}
.ntext{flex:0 1 auto;min-width:1ch;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
.ntext:empty::before{content:"Neuer Gedanke";opacity:.45}
.node.editing{cursor:text}
.node.editing .ntext{user-select:text;-webkit-user-select:text;cursor:text;min-width:3ch}
.nemo{font-size:1.15em;line-height:1;flex:none}
.nimg{display:block;max-width:200px;height:auto;border-radius:6px;pointer-events:none}
.ntask{width:1.05em;height:1.05em;border:2px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;font:700 .75em/1 var(--ui-font);cursor:pointer;flex:none;opacity:.8}
.done .ntask{background:var(--ok);border-color:var(--ok);color:#FFFFFF;opacity:1}
.done .ntext{text-decoration:line-through;opacity:.6}
.nprog{font:600 .72em var(--ui-font);padding:1px 7px;border-radius:99px;background:rgba(128,128,128,.2);flex:none;font-variant-numeric:tabular-nums}
.nbadge{display:inline-flex;opacity:.75;color:inherit;flex:none}
.nbadge svg{width:.95em;height:.95em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a.nbadge:hover{opacity:1}
.ncol{position:absolute;width:22px;height:22px;border-radius:50%;border:2px solid var(--bc);background:var(--panel);color:var(--fg);font:700 11px/1 var(--ui-font);display:grid;place-items:center;padding:0;cursor:pointer;opacity:0;transition:opacity .15s;font-variant-numeric:tabular-nums}
.big .ncol{width:30px;height:30px;font-size:13px}
.node[data-dir="r"] .ncol,.node[data-dir="c"] .ncol{right:-14px;top:calc(50% - 11px)}
.node[data-dir="l"] .ncol{left:-14px;top:calc(50% - 11px)}
.node[data-dir="d"] .ncol{left:calc(50% - 11px);bottom:-14px}
.ncol.on,.node:hover .ncol,.node.sel .ncol{opacity:1}
.node.sel{box-shadow:0 0 0 3px var(--canvas),0 0 0 5.5px var(--accent)}
.node.hit{box-shadow:0 0 0 3px var(--canvas),0 0 0 6px var(--hl)}
.node.drop{box-shadow:0 0 0 3px var(--canvas),0 0 0 7px var(--accent)}
.node.cur{box-shadow:0 0 0 3px var(--canvas),0 0 0 6px var(--hl)}
.node.cfrom{outline:2px dashed var(--accent);outline-offset:6px}
.node.dragging{pointer-events:none;opacity:.88}
.fresh{animation:pop .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;scale:.7}}
.noanim .fresh{animation:none}
.noanim #world.cam{transition:none}
.presenting .ncol{display:none}

/* ---------- Floating UI ---------- */
#ctx{position:absolute;z-index:6;display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
#ctx button{width:34px;height:34px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
#ctx button:hover{background:var(--panel-2)}
#ctx button.danger{color:var(--danger)}
.big #ctx button{width:46px;height:46px}
#band{position:absolute;border:1.5px solid var(--accent);background:rgba(35,70,200,.08);border-radius:4px;pointer-events:none;z-index:5}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px);white-space:nowrap}
#banner span{overflow:hidden;text-overflow:ellipsis}
#banner button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600}
#dock{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
#dock .tb{height:32px}
#dock .tb.icon{width:32px}
.big #dock .tb{height:44px}.big #dock .tb.icon{width:44px}
#zl{min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;background:transparent;border:0;cursor:pointer;border-radius:6px;padding:6px 2px}
#zl:hover{background:var(--panel-2)}
#status{font-size:12px;color:var(--muted);padding:0 8px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
#mini{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:6;width:184px;height:122px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);cursor:pointer;touch-action:none}
@media (max-width:760px){#status{display:none}#mini{width:118px;height:80px}}
#pbar{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#pbar .tb{height:42px}
#pcount{min-width:4.5em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.presenting #bar,.presenting #insp,.presenting #dock,.presenting #mini,.presenting #ctx,.presenting #banner{display:none!important}

/* ---------- Inspector ---------- */
#insp{width:304px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.hide-insp #insp{display:none}
.ihead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 2px 16px}
.ihead h2{font:600 11.5px var(--ui-font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
#ibody{overflow:auto;padding:0 16px 28px;flex:1;min-height:0}
#ibody section{padding:13px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
#ibody section:last-child{border-bottom:0}
#ibody h3,#dbody h3{font:600 13px var(--ui-font);margin:0}
.fld{display:grid;gap:4px}
.fld>span{font-size:12px;color:var(--muted)}
.inp,#ibody input[type=text],#ibody input[type=url],#ibody textarea,#dbody textarea,#mbody textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:7px 9px;font:14px/1.4 var(--ui-font);resize:vertical}
#ibody textarea{font-family:var(--node-font)}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2.5px var(--accent)}
.sw.auto{width:auto;padding:0 11px;border-radius:99px;background:var(--panel-2);font:500 12px var(--ui-font)}
.sw.custom{overflow:hidden;background:conic-gradient(#E4572E,#F3A712,#29A35A,#2E86DE,#8E44AD,#E4572E)}
.sw.custom input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer;border:0;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 0 auto;padding:7px 9px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font:500 12.5px var(--ui-font);cursor:pointer}
.seg button:hover{background:var(--panel-2)}
.seg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.big .seg button{padding:11px 12px}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emos button{aspect-ratio:1;font-size:18px;border:0;background:transparent;border-radius:7px;cursor:pointer;padding:0;display:grid;place-items:center}
.emos button:hover{background:var(--panel-2)}
.emos button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font:500 13px var(--ui-font);cursor:pointer;text-align:center}
.btn:hover{background:var(--panel-2)}
.btn.danger{color:var(--danger)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.big .btn{padding:12px 13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.layouts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lay{border:1px solid var(--line);border-radius:9px;padding:8px 6px 7px;background:var(--panel);display:grid;gap:4px;justify-items:center;font:500 12px var(--ui-font);cursor:pointer}
.lay svg{width:70px;height:40px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.lay svg .c{fill:var(--accent);stroke:none}
.lay svg .b{fill:var(--panel-2);stroke:var(--muted);stroke-width:1.5}
.lay.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel-2);border-radius:9px;padding:9px 11px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
kbd{font:600 11px var(--ui-font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel-2);white-space:nowrap}
.xbtn{width:34px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.xbtn:hover{background:var(--panel-2)}
.xbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sheet-only{display:none}
@media (max-width:760px){
  #insp{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:64%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .25s;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
  #insp.open{transform:none}
  .hide-insp #insp{display:flex}
  .sheet-only{display:grid}
}

/* ---------- Drawer, modal, popover, toast ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(10,15,30,.18);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 8px 20px}
.dhead h2{margin:0;font:600 18px var(--ui-font)}
#dbody{overflow:auto;padding-block:0 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));flex:1}
#dbody section{display:grid;gap:9px;padding:14px 0;border-bottom:1px solid var(--line)}
#dbody section:last-child{border-bottom:0}
.opt{display:grid;gap:6px}
.opt>span{font-size:12px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--panel);cursor:pointer;display:grid;gap:5px;font:500 12px var(--ui-font)}
.th i{display:block;height:34px;border-radius:6px;position:relative;border:1px solid rgba(128,128,128,.25)}
.th i::after{content:"";position:absolute;left:30%;top:9px;width:40%;height:14px;border-radius:99px;background:var(--pc)}
.th.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fo{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel);cursor:pointer;text-align:left;display:grid;gap:2px}
.fo b{font-size:18px;font-weight:400}
.fo small{font:12px var(--ui-font);color:var(--muted)}
.fo.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pals{display:grid;gap:6px}
.pal{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel);cursor:pointer;font:500 12.5px var(--ui-font)}
.pal .dots{display:flex;gap:3px;flex:1;justify-content:flex-end}
.pal .dots i{width:14px;height:14px;border-radius:50%}
.pal.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;padding:3px 0}
.tog input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.tog input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{transform:translateX(16px)}
.rng{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.rng input{width:100%;accent-color:var(--accent)}
.rng output{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:3.5em;text-align:right}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);cursor:pointer;text-align:left;display:grid;gap:3px}
.tpl:hover{border-color:var(--accent)}
.tpl b{font-size:13.5px}
.tpl span{font-size:12px;color:var(--muted);line-height:1.35}
.maplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.maplist li{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 0;background:var(--panel)}
.maplist li.cur{border-color:var(--accent);background:var(--accent-soft)}
.mopen{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 10px;cursor:pointer;display:grid;gap:2px}
.mopen b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopen span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mact{display:flex;gap:2px}
.mact button{height:32px;min-width:32px;border:0;border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0 6px}
.mact button:hover{background:var(--panel-2)}
.mact button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mact button.confirm{background:var(--danger);color:#FFFFFF;font:600 12px var(--ui-font)}
#modal{position:fixed;inset:0;background:rgba(8,12,22,.5);z-index:50;display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:16px;width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
#mbody{overflow:auto;padding:4px 20px 20px;display:grid;gap:12px}
.pv{background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:46vh;overflow:auto;text-align:center}
.pv img{max-width:100%;height:auto}
.pvt{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace!important;font-size:12.5px!important}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center;font-size:13.5px}
.tabs{display:flex;gap:4px}
#pop{position:fixed;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:250px;display:grid;gap:1px}
.pi{display:grid;gap:1px;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;font:500 13.5px var(--ui-font)}
.pi:hover{background:var(--panel-2)}
.pi small{color:var(--muted);font-weight:400;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:10px;z-index:60;font-size:13px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const html=document.documentElement;
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const MOD=isMac?'⌘':'Strg';

/* ---------- Icons ---------- */
const ICONS={
  folder:'<path d="M3 6.5h6.5l2 2H21V19H3z"/>',
  child:'<rect x="3" y="5" width="8" height="5" rx="1.5"/><rect x="13" y="14" width="8" height="5" rx="1.5"/><path d="M7 10v6.5h6"/>',
  sibling:'<rect x="3" y="4" width="10" height="5" rx="1.5"/><rect x="3" y="15" width="10" height="5" rx="1.5"/><path d="M18 14.5v5M15.5 17h5"/>',
  link:'<circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M8 15.5C10 10 12 9 15.6 7.8" stroke-dasharray="2.5 2.5"/>',
  select:'<path d="M4 8V4h4M12 4h3M20 8V4h-4M20 12v3M20 16v4h-4M12 20H9M4 16v4h4M4 12V9"/>',
  trash:'<path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13M10 11v5M14 11v5"/>',
  undo:'<path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/>',
  play:'<path d="M7 4.5v15l12-7.5z"/>',
  import:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 15.5V20h15v-4.5"/>',
  export:'<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 15.5V20h15v-4.5"/>',
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .9-1 1.7M12 17h.01"/>',
  minus:'<path d="M6 12h12"/>', plus:'<path d="M12 6v12M6 12h12"/>',
  fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  left:'<path d="m15 5-7 7 7 7"/>', right:'<path d="m9 5 7 7-7 7"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  edit:'<path d="M4 20h4L19.5 8.5l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  more:'<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
  note:'<path d="M5 4h10l4 4v12H5z"/><path d="M8.5 11h7M8.5 15h5"/>',
  extlink:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',
  focus:'<circle cx="12" cy="12" r="3"/><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/>',
  collapse:'<path d="M5 12h14M12 5v3M12 16v3"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>', down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
  dup:'<rect x="4" y="4" width="11" height="11" rx="2"/><path d="M9 20h11V9"/>',
  image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 8"/>',
  rename:'<path d="M4 20h4L19.5 8.5l-4-4L4 16z"/>',
  swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
$$('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic)));
const CTX_IC={child:'child',sib:'sibling',edit:'edit',more:'more',del:'trash'};
$$('#ctx button').forEach(b=>b.innerHTML=ic(CTX_IC[b.dataset.c]));

/* ---------- Settings ---------- */
const PALETTES={
  bunt:{name:'Bunt',c:['#E4572E','#E89A0C','#24A058','#2E7FD8','#8E44AD','#D6336C','#0E9C9C','#6A5ACD']},
  pastell:{name:'Pastell',c:['#EE9A92','#EFC46C','#86CDA0','#86B4EA','#BE9AE2','#EE9CBF','#7FCFC8','#AFA9EE']},
  gedeckt:{name:'Gedeckt',c:['#B5563C','#B98A2B','#5A8A5E','#4B6E91','#7A5C8E','#A44A68','#3E8A87','#7B7F34']},
  kraeftig:{name:'Kräftig',c:['#D00000','#FF8800','#008A3E','#0047FF','#7B00D4','#E0007A','#00A3B4','#4A4A4A']},
  mono:{name:'Einfarbig',c:['#3E4C63','#56657E','#3E4C63','#56657E','#3E4C63','#56657E','#3E4C63','#56657E']}
};
const FONTS={
  atkinson:{name:'Atkinson',d:'gut lesbar',f:'"Atkinson Hyperlegible",system-ui,sans-serif'},
  arial:{name:'Arial',d:'schlicht',f:'Arial,Helvetica,sans-serif'},
  serif:{name:'Lora',d:'mit Serifen',f:'Lora,Georgia,serif'},
  hand:{name:'Handschrift',d:'locker',f:'"Patrick Hand","Comic Sans MS",cursive'}
};
const THEMES=[['auto','Automatisch','linear-gradient(90deg,#F5F7FB 50%,#151B27 50%)','#2346C8'],['hell','Hell','#F5F7FB','#2346C8'],['dunkel','Dunkel','#151B27','#7D97FF'],['tafel','Tafel','#1F3D35','#F4D35E'],['papier','Papier','#F8F4EA','#2F4A7A'],['kontrast','Kontrast','#000000','#FFE500']];
const SHAPES=[['','Standard'],['pill','Pille'],['rounded','Abgerundet'],['rect','Eckig'],['oval','Oval'],['text','Nur Text']];
const SIZES={s:.85,m:1,l:1.2,xl:1.5};
const EMOJIS=['💡','❓','❗','⭐','✅','❌','⚠️','📌','📝','📚','🔎','🎯','🧩','🛠️','🧪','🌍','💶','⏰','📅','👥','🗣️','❤️','👍','👎','⚖️','🚀','🏁','🔑','📊','🎨','🎵','⚽','🏠','🌱','🔥','💧','⚡','🤝','🎓','🏭'];
const DEF={theme:'auto',palette:'bunt',edge:'curve',edgeW:3,taper:true,font:'atkinson',fontSize:15,spacing:1,grid:'dots',anim:true,big:false,minimap:true,shape:'pill',spell:false,wheel:'pan'};
let S=Object.assign({},DEF,LS.get('mmw.settings',{}));
const PAL=()=>(PALETTES[S.palette]||PALETTES.bunt).c;

/* ---------- Colors ---------- */
let T={};
function readTokens(){const cs=getComputedStyle(html);['bg','canvas','grid','fg','muted','panel','line','accent','accent-fg','node-bg','hl'].forEach(k=>T[k]=cs.getPropertyValue('--'+k).trim()||'#888888')}
function hex2rgb(h){h=String(h).trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16)||0;return[n>>16&255,n>>8&255,n&255]}
function rgb2hex(r){return'#'+r.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v*(1-t)+B[i]*t))}
function lum(h){const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b}
function onColor(h){const L=lum(h);return 1.05/(L+.05)>=(L+.05)/0.0621?'#FFFFFF':'#161B24'}

/* ---------- State ---------- */
let D=null, P={}, sel=new Set(), selLink=null, editing=null, newNodeId=null, justAdded=null;
let view={x:0,y:0,z:1}, focusId=null, present=null, connectFrom=null, bandMode=false;
let undo=[], redo=[], hits=new Set(), hitList=[], hitIdx=-1, clip=null, clipText='', savedAt=0;
const nodeEls=new Map();
const stage=$('#stage'), world=$('#world'), nodesL=$('#nodes'), edgesSvg=$('#edges'), ibody=$('#ibody'), mini=$('#mini'), ctxBar=$('#ctx');

function mkNode(id,parent,text){return{id,parent,children:[],text:text||'',emoji:'',color:null,shape:null,bold:false,italic:false,size:'m',note:'',link:'',img:null,task:null,collapsed:false,ox:0,oy:0,eStyle:null,eDash:null,eWidth:null,eColor:null}}
function newDoc(title){const rid='n'+uid();return{id:'m'+uid(),title:title||'Neue Mindmap',rootId:rid,layout:'mindmap',nodes:{[rid]:mkNode(rid,null,title||'Zentrales Thema')},links:[],created:Date.now(),updated:Date.now()}}
function migrate(d){
  if(!d||!d.nodes||!d.rootId||!d.nodes[d.rootId]) throw new Error('Keine gültige Mindmap-Datei');
  const out={id:d.id||'m'+uid(),title:d.title||d.nodes[d.rootId].text||'Mindmap',rootId:d.rootId,layout:d.layout||'mindmap',nodes:{},links:Array.isArray(d.links)?d.links.filter(l=>l&&l.from&&l.to).map(l=>mkLink(l)):[],created:d.created||Date.now(),updated:d.updated||Date.now()};
  for(const[id,n]of Object.entries(d.nodes)) out.nodes[id]=Object.assign(mkNode(id,n.parent??null,''),n,{id});
  for(const n of Object.values(out.nodes)) n.children=(n.children||[]).filter(c=>out.nodes[c]);
  out.links=out.links.filter(l=>out.nodes[l.from]&&out.nodes[l.to]);
  return out;
}
function mkLink(l){return{id:l.id||'l'+uid(),from:l.from,to:l.to,label:l.label||'',style:l.style||'curve',dash:l.dash||'dash',arrow:l.arrow||'end',width:l.width||2,color:l.color||null,bend:l.bend??null}}
const N=id=>D.nodes[id];
function depthOf(id){let d=0,n=N(id);while(n&&n.parent){d++;n=N(n.parent)}return d}
function isAncestor(a,b){let n=N(b);while(n&&n.parent){if(n.parent===a)return true;n=N(n.parent)}return false}

const EMO_RE=/^(\p{Extended_Pictographic}️?)\s*/u;
function parseOutline(txt){
  const lines=String(txt).replace(/\r/g,'').split('\n');
  const raw=[];
  for(const l of lines){
    if(!l.trim())continue;
    const t=l.trim();
    if(t.startsWith('> ')&&raw.length){raw[raw.length-1].note=(raw[raw.length-1].note?raw[raw.length-1].note+'\n':'')+t.slice(2);continue}
    const m=l.match(/^\s*(#{1,6})\s+(.*)$/);
    if(m){raw.push({h:m[1].length,t:m[2]});continue}
    raw.push({ind:l.match(/^[\t ]*/)[0].replace(/\t/g,'    ').length,t});
  }
  const pos=raw.filter(r=>r.ind>0).map(r=>r.ind);const U=pos.length?Math.min(...pos):2;
  let lastH=0;
  const items=raw.map(r=>{
    let lvl;if(r.h){lastH=r.h;lvl=r.h-1}else lvl=lastH+Math.round(r.ind/U);
    let t=r.t.replace(/^([-*+•]|\d+[.)])\s+/,'');const o={lvl,t:'',emoji:'',task:null,link:'',bold:false,note:r.note||'',kids:[]};
    const tm=t.match(/^\[( |x|X)\]\s*/);if(tm){o.task=tm[1]===' '?'open':'done';t=t.slice(tm[0].length)}
    const em=t.match(EMO_RE);if(em&&t.length>em[0].length){o.emoji=em[1];t=t.slice(em[0].length)}
    const lm=t.match(/^\[([^\]]+)\]\((https?:[^)]+)\)$/);if(lm){t=lm[1];o.link=lm[2]}
    const bm=t.match(/^\*\*(.+)\*\*$/);if(bm){t=bm[1];o.bold=true}
    o.t=t;return o;
  });
  const forest=[],stack=[];
  for(const it of items){while(stack.length&&stack[stack.length-1].lvl>=it.lvl)stack.pop();if(stack.length)stack[stack.length-1].kids.push(it);else forest.push(it);stack.push(it)}
  return forest;
}

  const r=N(d.rootId);Object.assign(r,{text:rootObj.t,emoji:rootObj.emoji,link:rootObj.link,note:rootObj.note});d.title=rootObj.t||d.title;
  addForest(rootObj.kids,d.rootId);D=prev;return d;
}

/* ---------- Minimap ---------- */
let mm=null;
function drawMini(){
  if(!S.minimap||present||!D){mini.hidden=true;return}mini.hidden=false;
  const cw=mini.clientWidth,ch=mini.clientHeight;if(!cw)return;const dpr=Math.min(2,devicePixelRatio||1);
  if(mini.width!==cw*dpr){mini.width=cw*dpr;mini.height=ch*dpr}
  const c=mini.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,cw,ch);
  const B=bounds(Object.keys(P));if(!B)return;const r=stage.getBoundingClientRect();
  const vx=-view.x/view.z,vy=-view.y/view.z,vw=r.width/view.z,vh=r.height/view.z;
  const x0=Math.min(B.x,vx),y0=Math.min(B.y,vy),x1=Math.max(B.x+B.w,vx+vw),y1=Math.max(B.y+B.h,vy+vh);
  const s=Math.min((cw-12)/(x1-x0),(ch-12)/(y1-y0));const ox=(cw-(x1-x0)*s)/2-x0*s,oy=(ch-(y1-y0)*s)/2-y0*s;mm={s,ox,oy};
  for(const id in P){const p=P[id],el=nodeEls.get(id);c.fillStyle=(el&&el._c&&el._c.bd)||T.accent;c.globalAlpha=.85;c.fillRect(ox+(p.x-p.w/2)*s,oy+(p.y-p.h/2)*s,Math.max(2,p.w*s),Math.max(2,p.h*s))}
  c.globalAlpha=1;c.strokeStyle=T.fg;c.lineWidth=1.5;c.strokeRect(ox+vx*s,oy+vy*s,vw*s,vh*s);
}
function miniJump(e){if(!mm)return;const r=mini.getBoundingClientRect();const wx=(e.clientX-r.left-mm.ox)/mm.s,wy=(e.clientY-r.top-mm.oy)/mm.s;const sr=stage.getBoundingClientRect();view.x=sr.width/2-wx*view.z;view.y=sr.height/2-wy*view.z;applyView()}
mini.addEventListener('pointerdown',e=>{e.stopPropagation();mini.setPointerCapture(e.pointerId);miniJump(e);mini._d=true});
mini.addEventListener('pointermove',e=>{if(mini._d)miniJump(e)});
mini.addEventListener('pointerup',()=>mini._d=false);

/* ---------- Keyboard ---------- */
const typing=t=>t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
document.addEventListener('keydown',e=>{
  if(!D)return;
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  if(present){
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();presentStep(1)}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();presentStep(-1)}
    else if(e.key==='Escape')endPresent();
    return;
  }
  if(typing(e.target)){if(e.key==='Escape'&&e.target.id==='q'){closeSearch()}return}
  const mod=e.metaKey||e.ctrlKey,k=e.key,id=[...sel][0];
  if(mod){
    const kl=k.toLowerCase();
    if(kl==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
    else if(kl==='y'){e.preventDefault();doRedo()}
    else if(kl==='c'){if(sel.size){e.preventDefault();copySel(false)}}
    else if(kl==='x'){if(sel.size){e.preventDefault();copySel(true)}}
    else if(kl==='d'){e.preventDefault();duplicateSel()}
    else if(kl==='f'){e.preventDefault();openSearch()}
    else if(kl==='a'){e.preventDefault();setSel(Object.keys(P))}
    else if(k==='0'){e.preventDefault();fit(true)}
    else if(k==='+'||k==='='){e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2,true)}
    else if(k==='-'){e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2,true)}
    else if(k==='.'){if(id){e.preventDefault();toggleCollapse(id)}}
    else if(kl==='s'){e.preventDefault();toast('Wird automatisch gespeichert.')}
    return;
  }
  if(k===' '){e.preventDefault();if(!spacePan){spacePan=true;html.classList.add('spacepan')}return}
  if(k==='Escape'){if(connectFrom)cancelConnect();else if(bandMode)toggleBand(false);else if(focusId)setFocus(null);else if(sel.size||selLink)setSel([]);closePop();return}
  if(k==='?'){e.preventDefault();openHelp();return}
  if(k==='Tab'){e.preventDefault();addChild(id||viewRoot());return}
  if(k==='Enter'){e.preventDefault();if(id)addSibling(id);else addChild(viewRoot());return}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();deleteSel();return}
  if(k==='F2'){if(id){e.preventDefault();startEdit(id)}return}
  if(k.startsWith('Arrow')){
    e.preventDefault();
    if(!id){setSel([viewRoot()]);return}
    if(e.altKey&&(k==='ArrowUp'||k==='ArrowDown')){moveOrder(id,k==='ArrowUp'?-1:1);return}
    navigate(id,k);return;
  }
  if(k.length===1&&!e.altKey&&sel.size===1){e.preventDefault();startEdit(id,k)}
});
document.addEventListener('keyup',e=>{if(e.key===' '){spacePan=false;html.classList.remove('spacepan')}});
function navigate(id,k){const a=P[id];if(!a)return;const dir={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[k];let best=null,bs=1e12;
  for(const o in P){if(o===id)continue;const b=P[o],dx=b.x-a.x,dy=b.y-a.y,along=dx*dir[0]+dy*dir[1];if(along<=4)continue;const perp=Math.abs(dx*dir[1]-dy*dir[0]);const sc=along+perp*2.2;if(sc<bs){bs=sc;best=o}}
  if(best){setSel([best]);ensureVisible(best)}}
document.addEventListener('paste',e=>{
  if(!D||typing(e.target)||present)return;const t=(e.clipboardData||window.clipboardData)?.getData('text/plain')||'';
  e.preventDefault();const target=pasteTarget();
  if(clip&&(!t||t===clipText)){pasteClones(clip,target);toast('Eingefügt')}else if(t.trim())pasteText(t,target);
});

/* ---------- Search ---------- */
function openSearch(){const q=$('#q');q.hidden=false;$('#qn').hidden=false;q.focus();q.select()}
function closeSearch(){const q=$('#q');q.value='';q.hidden=true;$('#qn').hidden=true;hits=new Set();hitList=[];render();stage.focus()}
$('#b-search').addEventListener('click',()=>$('#q').hidden?openSearch():closeSearch());
$('#q').addEventListener('input',e=>doSearch(e.target.value));
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nextHit(e.shiftKey?-1:1)}});
function doSearch(q){
  hits=new Set();q=q.trim().toLowerCase();
  if(q){for(const n of Object.values(D.nodes))if((n.text+' '+n.note).toLowerCase().includes(q))hits.add(n.id);
    let ch=false;hits.forEach(id=>{let p=N(id).parent;while(p){if(N(p).collapsed){N(p).collapsed=false;ch=true}p=N(p).parent}});
    if(focusId&&[...hits].some(h=>h!==focusId&&!isAncestor(focusId,h)))setFocus(null,true);if(ch)touch();}
  render();hitList=Object.keys(P).filter(i=>hits.has(i));hitIdx=-1;
  $('#qn').textContent=q?(hitList.length?`${hitList.length}`:'0'):'';
}
function nextHit(d){if(!hitList.length)return;hitIdx=(hitIdx+d+hitList.length)%hitList.length;const id=hitList[hitIdx];$('#qn').textContent=`${hitIdx+1}/${hitList.length}`;sel=new Set([id]);render();renderInspector();centerOn(id,true)}

/* ---------- Presentation ---------- */
function startPresent(){
  if(editing)finishEdit(true);closeDrawer();closePop();
  const order=[];const w=id=>{order.push(id);N(id).children.forEach(w)};w(viewRoot());
  present={order,idx:0,shown:new Set([order[0]])};sel=new Set();selLink=null;html.classList.add('presenting');$('#pbar').hidden=false;
  try{const p=html.requestFullscreen&&html.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}
  render();fit(true);updPresent();
}
function presentStep(d){if(!present)return;if(d>0){if(present.idx>=present.order.length-1){toast('Alle Äste sind aufgedeckt.');return}present.idx++;present.shown.add(present.order[present.idx])}else{if(present.idx<=0)return;present.shown.delete(present.order[present.idx]);present.idx--}render();fit(true);updPresent()}
function updPresent(){$('#pcount').textContent=`${present.idx+1} / ${present.order.length}`;$('#p-prev').disabled=present.idx===0;$('#p-next').disabled=present.idx>=present.order.length-1}
function endPresent(){present=null;html.classList.remove('presenting');$('#pbar').hidden=true;try{document.fullscreenElement&&document.exitFullscreen().catch(()=>{})}catch(e){}nodeEls.forEach(el=>{el._fresh=false});render();fit(true)}
$('#p-next').addEventListener('click',()=>presentStep(1));$('#p-prev').addEventListener('click',()=>presentStep(-1));
$('#p-all').addEventListener('click',()=>{present.order.forEach(i=>present.shown.add(i));present.idx=present.order.length-1;render();fit(true);updPresent()});

    const e=el.querySelector('.nemo');if(e)it.emoji={x:bx+e.offsetLeft,y:by+e.offsetTop+e.offsetHeight/2,s:parseFloat(getComputedStyle(e).fontSize),t:n.emoji};

async function doExport(kind){

    if(kind==='png'){const cv=await toCanvas(2);cv.toBlob(b=>deliver({name:fb+'.png',blob:b,image:true}),'image/png')}
    else if(kind==='svg'){const t=toSVG();deliver({name:fb+'.svg',blob:new Blob([t],{type:'image/svg+xml'}),image:true,text:t})}
    else if(kind==='pdf'){

      pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(120);pdf.text(new Date().toLocaleDateString('de-DE'),pw-m,m+6,{align:'right'});
      const top=m+22,aw=pw-2*m,ah=ph-top-m,s=Math.min(aw/cv.width,ah/cv.height);pdf.addImage(cv.toDataURL('image/png'),'PNG',m+(aw-cv.width*s)/2,top,cv.width*s,cv.height*s);
      deliver({name:fb+'.pdf',blob:pdf.output('blob'),pdf:true});
    }
    else if(kind==='md'){const t=toMarkdown(viewRoot());deliver({name:fb+'.md',blob:new Blob([t],{type:'text/markdown'}),text:t})}
    else if(kind==='txt'){const t=toText(viewRoot());deliver({name:fb+'.txt',blob:new Blob([t],{type:'text/plain'}),text:t})}
    else if(kind==='json'){const t=JSON.stringify(D,null,1);deliver({name:fb+'.mindmap.json',blob:new Blob([t],{type:'application/json'}),text:t})}
  }catch(err){toast('Export fehlgeschlagen: '+err.message)}
}
let dlNs;async function getDownloads(){if(dlNs!==undefined)return dlNs;try{dlNs=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dlNs=null}return dlNs}
function deliver({name,blob,text,image,pdf}){
  const url=URL.createObjectURL(blob);
  let h=image?`<div class="pv"><img src="${url}" alt="Vorschau der Mindmap"></div>`:pdf?`<p class="hint">PDF „${esc(name)}“ ist fertig (${Math.max(1,Math.round(blob.size/1024))} KB).</p>`:`<textarea class="pvt" id="exText" readonly>${esc(text)}</textarea>`;
  h+=`<div class="row"><button class="btn pri" id="exDl">${ic('import')} Herunterladen</button>${text&&!image?'<button class="btn" id="exCp">'+ic('copy')+' Kopieren</button>':''}${image&&!text?'<button class="btn" id="exCi">'+ic('copy')+' Bild kopieren</button>':''}</div>
  <p class="hint">${image?'Alternativ: Bild gedrückt halten (iPad) oder nutze Rechtsklick → „Bild sichern“.':text?'Alternativ: Text kopieren und in eine Datei oder App einfügen.':'Falls kein Download startet, öffne die Mindmap-Werkstatt als eigene Seite (z. B. auf deiner Website).'}</p>`;
  openModal('Export · '+name,h);
  $('#exDl').onclick=async()=>{
    const dl=await getDownloads();
    if(dl){try{await dl.save({filename:name,data:blob});toast('Gespeichert')}catch(err){if(err&&err.code!=='declined')toast('Speichern nicht möglich ('+(err.code||'Fehler')+')')}return}
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
  if($('#exCp'))$('#exCp').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('In die Zwischenablage kopiert')}catch(e){const t=$('#exText');t.focus();t.select();toast('Text ist markiert – jetzt kopieren.')}};
  if($('#exCi'))$('#exCi').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);toast('Bild kopiert')}catch(e){toast('Bild kopieren wird hier nicht unterstützt.')}};
}

/* ---------- Import ---------- */
function openImport(){
  openModal('Importieren',`<div class="tabs seg"><button class="on" data-t="txt">Text einfügen</button><button data-t="file">Datei öffnen</button></div>
  <div id="impTxt" style="display:grid;gap:10px"><p class="hint">Füge eine eingerückte Liste ein – mit Leerzeichen, Tabs, Spiegelstrichen oder Markdown-Überschriften. Die erste Zeile wird zum zentralen Thema.</p>
  <textarea id="impArea" rows="9" placeholder="Wasser&#10;  Aggregatzustände&#10;    fest&#10;    flüssig&#10;    gasförmig&#10;  Wasserkreislauf&#10;  Bedeutung für Lebewesen"></textarea>
  <div class="row"><button class="btn pri" id="impNew">Als neue Mindmap</button><button class="btn" id="impAdd">${sel.size?'Unter ausgewähltem Knoten einfügen':'In aktuelle Mindmap einfügen'}</button></div></div>
  <div id="impFile" hidden style="display:grid;gap:10px"><p class="hint">Unterstützt: Mindmap-Dateien (.json), Sicherungen aller Mindmaps sowie Gliederungen (.txt, .md).</p><button class="btn pri" id="impPick">${ic('import')} Datei auswählen</button></div>`);
  $$('#mbody .tabs button').forEach(b=>b.onclick=()=>{$$('#mbody .tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#impTxt').hidden=b.dataset.t!=='txt';$('#impFile').hidden=b.dataset.t!=='file'});
  $('#impNew').onclick=()=>{const t=$('#impArea').value;if(!t.trim()){toast('Bitte zuerst Text einfügen.');return}loadDoc(docFromOutline(t));closeModal();toast('Neue Mindmap erstellt')};
  $('#impAdd').onclick=()=>{const t=$('#impArea').value;if(!t.trim()){toast('Bitte zuerst Text einfügen.');return}closeModal();pasteText(t,pasteTarget())};
  $('#impPick').onclick=()=>$('#openFile').click();
}
$('#openFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const t=String(fr.result);
    if(/\.json$/i.test(f.name)||t.trim().startsWith('{')){const j=JSON.parse(t);
      if(j.mmwBackup&&Array.isArray(j.maps)){let n=0;j.maps.forEach(m=>{try{const d=migrate(m);LS.set('mmw.map.'+d.id,d);const idx=LS.get('mmw.index',[]).filter(x=>x.id!==d.id);idx.push({id:d.id,title:d.title,updated:d.updated,count:Object.keys(d.nodes).length});LS.set('mmw.index',idx);n++}catch(err){}});closeModal();toast(n+' Mindmaps wiederhergestellt');openMaps();return}
      const d=migrate(j);d.id='m'+uid();loadDoc(d);}
    else loadDoc(docFromOutline(t,f.name.replace(/\.[^.]+$/,'')));
    closeModal();toast('„'+D.title+'“ geöffnet');
  }catch(err){toast('Datei konnte nicht gelesen werden: '+err.message)}};fr.readAsText(f);
});

/* ---------- Maps drawer ---------- */
function loadDoc(d){if(editing)finishEdit(true);if(present)endPresent();D=d;sel=new Set();selLink=null;focusId=null;undo=[];redo=[];hits=new Set();nodeEls.forEach(el=>el.remove());nodeEls.clear();setFocus(null,true);cancelConnectSilent();$('#title').value=D.title;$('#layoutSel').value=D.layout;save();render();renderInspector();updUndo();fit(false)}
function cancelConnectSilent(){connectFrom=null;html.classList.remove('connecting')}
function openMap(id){const m=LS.get('mmw.map.'+id,null);if(!m){toast('Diese Mindmap ist auf diesem Gerät nicht mehr vorhanden.');return}try{loadDoc(migrate(m));closeDrawer()}catch(e){toast(e.message)}}
const fmtDate=t=>new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
function openMaps(){
  const idx=LS.get('mmw.index',[]).sort((a,b)=>b.updated-a.updated);
  openDrawer('Meine Mindmaps',`<section><h3>Neu aus Vorlage</h3><div class="tpls">${TEMPLATES.map((t,i)=>`<button class="tpl" data-t="${i}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}</div></section>
  <section><h3>Auf diesem Gerät</h3>${idx.length?`<ul class="maplist">${idx.map(m=>`<li class="${m.id===D.id?'cur':''}" data-id="${m.id}"><button class="mopen" data-m="open"><b>${esc(m.title)}</b><span>${m.count} Knoten · ${fmtDate(m.updated)}</span></button><div class="mact"><button data-m="ren" title="Umbenennen">${ic('rename')}</button><button data-m="dup" title="Duplizieren">${ic('dup')}</button><button data-m="del" title="Löschen">${ic('trash')}</button></div></li>`).join('')}</ul>`:'<p class="hint">Noch nichts gespeichert.</p>'}
  <p class="hint">Mindmaps werden nur in diesem Browser gespeichert. Für andere Geräte: Export → Mindmap-Datei (JSON) oder Einstellungen → Sicherung.</p></section>`);
  $('#dbody').onclick=e=>{
    const t=e.target.closest('.tpl');if(t){const tp=TEMPLATES[+t.dataset.t];loadDoc(docFromOutline(tp.o));closeDrawer();toast('Vorlage „'+tp.name+'“ geöffnet');return}
    const b=e.target.closest('[data-m]');if(!b)return;const li=b.closest('li'),id=li.dataset.id;
    if(b.dataset.m==='open'){if(id===D.id)closeDrawer();else openMap(id)}
    else if(b.dataset.m==='ren'){if(id!==D.id)openMap(id);else closeDrawer();setTimeout(()=>{$('#title').focus();$('#title').select()},50)}
    else if(b.dataset.m==='dup'){const m=LS.get('mmw.map.'+id,null);if(!m)return;const d=migrate(m);d.id='m'+uid();d.title=d.title+' (Kopie)';d.created=d.updated=Date.now();loadDoc(d);openMaps();toast('Kopie erstellt')}
    else if(b.dataset.m==='del'){
      if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='Löschen?';setTimeout(()=>{if(b.isConnected){b.classList.remove('confirm');b.innerHTML=ic('trash')}},3500);return}
      LS.del('mmw.map.'+id);LS.set('mmw.index',LS.get('mmw.index',[]).filter(x=>x.id!==id));
      if(id===D.id){const rest=LS.get('mmw.index',[]).sort((a,b)=>b.updated-a.updated);const nx=rest[0]&&LS.get('mmw.map.'+rest[0].id,null);loadDoc(nx?migrate(nx):newDoc('Zentrales Thema'))}
      openMaps();toast('Mindmap gelöscht');
    }
  };
}
$('#b-maps').addEventListener('click',openMaps);
function openDrawer(t,h){closePop();$('#dtitle').textContent=t;$('#dbody').innerHTML=h;$('#dbody').onclick=null;$('#dbody').oninput=null;$('#drawer').hidden=false}
function closeDrawer(){$('#drawer').hidden=true}
$('#dclose').addEventListener('click',closeDrawer);
function openModal(t,h){closePop();$('#mtitle').textContent=t;$('#mbody').innerHTML=h;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;$('#mbody').innerHTML=''}
$('#mclose').addEventListener('click',closeModal);
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- Settings ---------- */
function applySettings(){
  if(S.theme==='auto')html.removeAttribute('data-app');else html.setAttribute('data-app',S.theme);
  html.style.setProperty('--node-font',(FONTS[S.font]||FONTS.atkinson).f);html.style.setProperty('--node-size',S.fontSize+'px');
  html.classList.toggle('big',!!S.big);html.classList.toggle('noanim',!S.anim);
  stage.classList.toggle('g-dots',S.grid==='dots');stage.classList.toggle('g-lines',S.grid==='lines');
  readTokens();nodeEls.forEach(el=>el._k=null);render();applyView();
}
function setS(k,v){S[k]=v;LS.set('mmw.settings',S);applySettings()}
function openSettings(){
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S[k]===v?'on':''}" data-s="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const tog=(k,l)=>`<label class="tog"><span>${l}</span><input type="checkbox" data-s="${k}" ${S[k]?'checked':''}></label>`;
  const rng=(k,l,min,max,step,fmt)=>`<div class="opt"><span>${l}</span><div class="rng"><input type="range" data-s="${k}" min="${min}" max="${max}" step="${step}" value="${S[k]}" aria-label="${l}"><output>${fmt(S[k])}</output></div></div>`;
  openDrawer('Einstellungen',`
  <section><h3>Design</h3><div class="themes">${THEMES.map(([k,l,bg,pc])=>`<button class="th${S.theme===k?' on':''}" data-s="theme" data-v="${k}"><i style="background:${bg};--pc:${pc}"></i>${l}</button>`).join('')}</div>
    <div class="opt"><span>Hintergrund</span>${seg('grid',[['none','Leer'],['dots','Punkte'],['lines','Kästchen']])}</div></section>
  <section><h3>Knoten</h3>
    <div class="opt"><span>Schrift</span><div class="fonts">${Object.entries(FONTS).map(([k,f])=>`<button class="fo${S.font===k?' on':''}" data-s="font" data-v="${k}"><b style="font-family:${f.f.replace(/"/g,"'")}">Aa Mindmap</b><small>${f.name} · ${f.d}</small></button>`).join('')}</div></div>
    ${rng('fontSize','Schriftgröße',12,24,1,v=>v+' px')}
    <div class="opt"><span>Standardform für Unteräste</span>${seg('shape',SHAPES.filter(s=>s[0]).map(s=>[s[0],s[1]]))}</div>
    <div class="opt"><span>Farbpalette für Hauptäste</span><div class="pals">${Object.entries(PALETTES).map(([k,p])=>`<button class="pal${S.palette===k?' on':''}" data-s="palette" data-v="${k}">${p.name}<span class="dots">${p.c.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('')}</div></div>
    ${rng('spacing','Abstände',.7,1.6,.05,v=>Math.round(v*100)+' %')}</section>
  <section><h3>Verbindungslinien</h3>${seg('edge',[['curve','Geschwungen'],['straight','Gerade'],['elbow','Eckig']])}
    ${rng('edgeW','Linienstärke',1,6,.5,v=>v+' px')}${tog('taper','Linien nach außen dünner werden lassen')}</section>
  <section><h3>Bedienung</h3>
    <div class="opt"><span>Mausrad / Trackpad</span>${seg('wheel',[['pan','Verschieben'],['zoom','Zoomen']])}</div>
    ${tog('big','Große Bedienelemente (Touch)')}${tog('minimap','Minikarte anzeigen')}${tog('anim','Animationen')}${tog('spell','Rechtschreibprüfung beim Schreiben')}</section>
  <section><h3>Daten</h3><div class="grid2"><button class="btn" data-x="backup">${ic('export')} Alles sichern</button><button class="btn" data-x="restore">${ic('import')} Sicherung laden</button></div>
    <button class="btn" data-x="reset">Einstellungen zurücksetzen</button></section>`);
  const db=$('#dbody');
  db.onclick=e=>{
    const b=e.target.closest('[data-s][data-v]');if(b&&b.tagName==='BUTTON'){const k=b.dataset.s;setS(k,b.dataset.v);if(k==='theme'||k==='palette'||k==='shape'||k==='edge'||k==='grid'||k==='font'||k==='wheel')openSettings();return}
    const x=e.target.closest('[data-x]');if(!x)return;
    if(x.dataset.x==='backup'){const maps=LS.get('mmw.index',[]).map(m=>LS.get('mmw.map.'+m.id,null)).filter(Boolean);const t=JSON.stringify({mmwBackup:1,date:new Date().toISOString(),maps});closeDrawer();deliver({name:'Mindmap-Sicherung-'+new Date().toISOString().slice(0,10)+'.json',blob:new Blob([t],{type:'application/json'}),text:t})}
    if(x.dataset.x==='restore'){$('#openFile').click()}
    if(x.dataset.x==='reset'){if(!x.classList.contains('danger')){x.classList.add('danger');x.textContent='Wirklich zurücksetzen?';return}S=Object.assign({},DEF);LS.set('mmw.settings',S);applySettings();openSettings();toast('Einstellungen zurückgesetzt')}
  };
  db.oninput=e=>{const t=e.target;if(!t.dataset.s)return;if(t.type==='checkbox')setS(t.dataset.s,t.checked);else if(t.type==='range'){setS(t.dataset.s,+t.value);const o=t.parentElement.querySelector('output');const k=t.dataset.s;o.textContent=k==='spacing'?Math.round(t.value*100)+' %':t.value+' px'}};
}
$('#b-settings').addEventListener('click',()=>$('#drawer').hidden||$('#dtitle').textContent!=='Einstellungen'?openSettings():closeDrawer());

  ${k('<kbd>Doppeltipp</kbd>','Text bearbeiten (oder einfach lostippen)')}
  ${k('<kbd>Tab</kbd>','Unterast anlegen')}
  ${k('<kbd>Enter</kbd>','Nachbarast anlegen · beim Schreiben: fertig')}

  ${k('<kbd>Entf</kbd>','Auswahl löschen')}
  ${k('<kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd>','Zwischen Knoten wechseln')}
  ${k('<kbd>Alt</kbd> + <kbd>↑</kbd>/<kbd>↓</kbd>','Reihenfolge ändern')}

  ${k(`<kbd>${MOD}</kbd> + <kbd>D</kbd>`,'Duplizieren')}

  ${k('<kbd>Shift</kbd> + Ziehen','Auswahlrahmen')}

  </div>

}
$('#b-help').addEventListener('click',openHelp);

  openModal('Willkommen in der Mindmap-Werkstatt',`<p class="hint" style="font-size:14px">Hier ist schon eine Beispiel-Mindmap geöffnet. So geht's los:</p>
  <div class="keys"><span><kbd>Doppeltipp</kbd></span><span>Text eines Knotens ändern</span><span><kbd>Tab</kbd> / <kbd>Enter</kbd></span><span>Unterast bzw. Nachbarast anlegen</span><span><b>Ziehen</b></span><span>Knoten verschieben oder auf einen anderen Knoten fallen lassen</span><span><b>Mindmaps</b></span><span>Neue Mindmap aus Vorlagen wie Pro & Contra oder Berufsfeld</span><span><b>Einstellungen</b></span><span>Design, Schrift, Farben und Linien nach deinem Geschmack</span></div>
  <div class="row"><button class="btn pri" id="wGo">Los geht's</button><button class="btn" id="wHelp">Alle Tastenkürzel</button></div>`);
  $('#wGo').onclick=closeModal;$('#wHelp').onclick=openHelp;LS.set('mmw.seen',1);
}

/* ---------- Misc ---------- */
let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function onResize(){updCtx();drawMini()}
addEventListener('resize',()=>{onResize();if(innerWidth>760)closeSheet()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{readTokens();nodeEls.forEach(el=>el._k=null);render()});
new MutationObserver(()=>{readTokens();render()}).observe(html,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts){document.fonts.addEventListener?.('loadingdone',()=>{nodeEls.forEach(el=>el._k=null);render()})}

/* ---------- Boot ---------- */
if(LS.get('mmw.insp',true)===false)html.classList.add('hide-insp');
applySettings();
(function boot(){
  const last=LS.get('mmw.last',null);let d=null;
  if(last){const m=LS.get('mmw.map.'+last,null);if(m)try{d=migrate(m)}catch(e){}}
  if(!d){const idx=LS.get('mmw.index',[]);for(const m of idx){const x=LS.get('mmw.map.'+m.id,null);if(x)try{d=migrate(x);break}catch(e){}}}
  loadDoc(d||sampleDoc());
  requestAnimationFrame(()=>{render();fit(false)});
  if(!LS.get('mmw.seen',0))setTimeout(()=>{if(!window.TOUR)welcome()},400);
})();
})();
