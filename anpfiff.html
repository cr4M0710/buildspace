<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anpfiff – Sport live</title>
<meta name="description" content="Deine eigene Sportzentrale für Fußball und Handball: Liveticker, Ergebnisse, Tabellen, Team- und Spielerstatistiken aus Bundesliga, HBL, Europapokal und Top-Ligen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anpfiff">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1712">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Sportmedien-Liste – Kopfzeile + Inhalt, unten Tab-Leiste (Handy), links Navigation (Desktop). Ergebniszeilen wie im Stadionheft gestapelt. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#E3E9E3; --line:#D3DBD3;
  --fg:#0E1712; --muted:#56665B; --accent:#157A43; --on-accent:#FFFFFF;
  --live:#D61F36; --good:#1C8448; --draw:#8A7A2E; --bad:#C2333B;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
  --shadow:0 1px 0 rgba(14,23,18,.06), 0 8px 24px -16px rgba(14,23,18,.25);
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:14px; --r-sm:10px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B120E; --surface:#131C17; --surface-2:#1B2620; --line:#25332B;
    --fg:#E9F0EB; --muted:#93A499; --on-accent:#08100B;
    --live:#FF4D5E; --good:#43C47A; --draw:#CDB75A; --bad:#FF6B6F;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B120E; --surface:#131C17; --surface-2:#1B2620; --line:#25332B;
  --fg:#E9F0EB; --muted:#93A499; --on-accent:#08100B;
  --live:#FF4D5E; --good:#43C47A; --draw:#CDB75A; --bad:#FF6B6F;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.tab-num{font-variant-numeric:tabular-nums}

/* App-Gerüst */
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);flex:none}
.brand small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem}
.live-count{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--live);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:880px;margin:0 auto;width:100%;min-width:0}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom-in{display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h);max-width:600px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nav-item svg{width:24px;height:24px}
.nav-item.on{color:var(--accent)}
.nav-item.on svg{stroke-width:2.3}

@media (min-width:960px){
  .app{grid-template-columns:232px 1fr}
  .bottom{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:6px 10px 18px}
  .side .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.98rem;padding:11px 12px;border-radius:12px;color:var(--fg)}
  .side .nav-item.on{background:var(--accent-soft);color:var(--accent)}
  .top .brand{display:none}
  main{padding-bottom:48px}
  .side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px 12px}
}

/* Bausteine */
.sec{margin-top:26px}
.sec:first-child{margin-top:4px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-title{font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-transform:uppercase;letter-spacing:.015em;margin:0;line-height:1.1;text-wrap:balance}
.sec-head .more{margin-left:auto;font-size:.88rem;font-weight:600;color:var(--accent)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.note.err{background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--fg)}
.note button{color:var(--accent);font-weight:700;margin-left:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--live)}

.daystrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.day b{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.day span{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on span{color:inherit;opacity:.85}

/* Wettbewerbs-Block */
.lg-block{margin-top:14px;overflow:hidden}
.lg-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.lg-head .lg-name{font-family:var(--f-display);font-weight:700;font-size:1.08rem;text-transform:uppercase;letter-spacing:.02em}
.lg-head .lg-tag{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lg-head a{margin-left:auto;font-size:.82rem;font-weight:600;color:var(--accent)}

/* Ergebniszeile */
.match{display:grid;grid-template-columns:60px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);position:relative}
.lg-head + .match{border-top:0}
.match:hover{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.match.is-fav{background:var(--accent-soft)}
.match.is-fav::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.m-status{font-size:.86rem;font-weight:600;color:var(--muted);text-align:center}
.m-teams{display:flex;flex-direction:column;gap:5px;min-width:0}
.team{display:flex;align-items:center;gap:9px;min-width:0}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.team.lose .nm{color:var(--muted);font-weight:400}
.logo{width:22px;height:22px;object-fit:contain;flex:none}
.logo-ph{width:22px;height:22px;border-radius:50%;background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:.6rem;font-weight:700;color:var(--muted)}
.redcard{width:9px;height:12px;border-radius:2px;background:var(--bad);flex:none}
.m-score{display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:22px;font-variant-numeric:tabular-nums;min-width:28px}
.m-score .lose{color:var(--muted)}
.match.in .m-score{color:var(--live)}
.m-score .dash{color:var(--line);font-weight:600}
.m-events{grid-column:2 / -1;font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:3px 12px}
.m-events span{display:inline-flex;align-items:center;gap:4px}
.m-events svg{width:12px;height:12px}
.live-chip{display:inline-flex;align-items:center;gap:5px;color:var(--live);font-weight:700;font-variant-numeric:tabular-nums}
.live-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.end{color:var(--muted)}
.flash{animation:goal 1.2s ease-in-out 4}
@keyframes goal{50%{background:color-mix(in srgb, var(--live) 18%, transparent)}}
.compact .match{padding:7px 14px}
.compact .logo,.compact .logo-ph{display:none}
.compact .m-teams,.compact .m-score{gap:2px}
.compact .m-score{font-size:1.12rem;line-height:20px}

/* Feed */
.hero-live{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.live-tile{padding:14px;display:grid;gap:10px;border-top:3px solid var(--live)}
.live-tile .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.live-tile .sc{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.live-tile .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.fav-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.fav-card{padding:14px;display:grid;gap:10px}
.fav-card .fh{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-transform:uppercase}
.fav-card .fh .logo{width:30px;height:30px}
.fav-line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.fav-line .lbl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fav-line .op{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:1px 8px;border-radius:6px;color:#fff;font-variant-numeric:tabular-nums}
.res.w{background:var(--good)} .res.d{background:var(--draw)} .res.l{background:var(--bad)} .res.n{background:var(--muted)}
:root[data-theme="dark"] .res, .res{color:#fff}

/* News */
.news-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.news{overflow:hidden;display:flex;flex-direction:column}
.news .img{aspect-ratio:16/9;background:var(--surface-2);overflow:hidden;max-width:100%}
.news img{width:100%;height:100%;object-fit:cover;display:block}
.news .bd{padding:12px 14px 14px;display:grid;gap:6px}
.news h3{margin:0;font-size:1.04rem;line-height:1.25;text-wrap:balance}
.news p{margin:0;font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news .src{font-size:.75rem;color:var(--muted);font-weight:600}
.news-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.news-row:first-child{border-top:0}
.news-row .img{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.news-row img{width:100%;height:100%;object-fit:cover;display:block}
.news-row h3{margin:0 0 4px;font-size:.98rem;line-height:1.25}
.portals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.portal{min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:.92rem}
.portal svg{width:16px;height:16px;color:var(--muted);flex:none}

/* Tabelle */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl th{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl th.tl,.tbl td.tl{text-align:left}
.tbl td{padding:9px 6px;border-top:1px solid var(--line);text-align:center}
.tbl tr:first-child td{border-top:0}
.tbl td.rk{width:40px;font-weight:700;position:relative}
.tbl td.rk::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--zone,transparent)}
.tbl td.pts{font-family:var(--f-display);font-weight:800;font-size:1.08rem}
.tbl .tm{display:flex;align-items:center;gap:9px;min-width:0;max-width:240px}
.tbl .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tbl tr.is-fav td{background:var(--accent-soft)}
.star{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.star svg{width:18px;height:18px}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
@media (max-width:520px){ .tbl .hide-s{display:none} .tbl .tm{max-width:150px} }
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Spieldetail */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);min-height:40px}
.back svg{width:18px;height:18px}
.score-card{padding:18px 14px 16px;text-align:center}
.score-card .comp{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.score-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;margin-top:14px}
.big-team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.big-team img,.big-team .logo-ph{width:56px;height:56px}
.big-team .nm{font-weight:700;font-size:1rem;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.big-score{font-family:var(--f-display);font-weight:800;font-size:3.1rem;line-height:1;font-variant-numeric:tabular-nums;padding-top:6px;white-space:nowrap}
.big-score.in{color:var(--live)}
.big-status{margin-top:6px;font-size:.95rem}
.score-card .sub{margin-top:12px;font-size:.84rem;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto;scrollbar-width:none}
.tab{min-height:44px;padding:0 14px;font-weight:700;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.ticker{list-style:none;margin:0;padding:0}
.tick{display:grid;grid-template-columns:52px 28px minmax(0,1fr);gap:10px;padding:12px 4px;border-top:1px solid var(--line);align-items:start}
.tick:first-child{border-top:0}
.tick .min{font-family:var(--f-display);font-weight:700;font-size:1.08rem;text-align:right;font-variant-numeric:tabular-nums;padding-top:1px}
.tick .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.tick .ic svg{width:16px;height:16px}
.tick.goal .ic{background:var(--accent);color:var(--on-accent)}
.tick.goal .tx b{font-family:var(--f-display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.02em}
.tick.phase .tx{font-weight:700;text-transform:uppercase;font-size:.85rem;letter-spacing:.06em;color:var(--muted)}
.ic .card-y{width:11px;height:15px;border-radius:2px;background:#F2C230}
.ic .card-r{width:11px;height:15px;border-radius:2px;background:var(--bad)}
.tick .tx{min-width:0;overflow-wrap:anywhere}
.tick .tx small{display:block;color:var(--muted);font-size:.84rem}
.stat{display:grid;gap:6px;padding:10px 2px;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}
.stat .sl{display:grid;grid-template-columns:60px 1fr 60px;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat .sl b:last-child{text-align:right}
.stat .sl span{text-align:center;color:var(--muted);font-size:.85rem}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.bar.l{justify-content:flex-end}
.bar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.bar i.lead{background:var(--accent)}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.lineups{grid-template-columns:1fr}}
.lu h4{margin:0 0 6px;font-family:var(--f-display);font-size:1.05rem;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.lu ul{list-style:none;margin:0;padding:0}
.lu li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.lu li .no{font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lu li .pos{font-size:.72rem;font-weight:700;color:var(--muted)}
.lu .bench{margin-top:10px}

/* Einstellungen */
.set-group{padding:6px 0}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:56px}
.set-row:first-child{border-top:0}
.set-row .lbl{flex:1;min-width:0}
.set-row .lbl small{display:block;color:var(--muted);font-size:.82rem}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}

/* ---------- Abruf mit Zwischenspeicher ---------- */
const cache = new Map();
let lastOk = 0;
async function getJSON(url, ttl = 20000) {
  const c = cache.get(url);
  if (c && c.v !== undefined && Date.now() - c.t < ttl) return c.v;
  if (c && c.p) return c.p;
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 15000);
  const p = fetch(url, { signal: ctrl.signal })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .finally(() => clearTimeout(to));
  cache.set(url, { t: c ? c.t : 0, v: c ? c.v : undefined, p });
  try {
    const v = await p; cache.set(url, { t: Date.now(), v }); lastOk = Date.now(); showUpdated(); return v;
  } catch (e) {
    if (c && c.v !== undefined) { cache.set(url, { t: c.t, v: c.v }); return c.v; }
    cache.delete(url); throw e;
  }
}
const liveTTL = () => Math.max(10, S.refresh - 2) * 1000;

/* ---------- Sportradar (Handball-Bundesliga) ---------- */
async function srToken(o) {
  const stream = new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("deflate"));
  const b = new Uint8Array(await new Response(stream).arrayBuffer());
  let s = ""; b.forEach(c => s += String.fromCharCode(c));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function srGet(lg, type, params, ttl) {
  const d = await getJSON(`${SR}/${lg.site}/${type}?${new URLSearchParams(params)}`, ttl);
  return d.data || {};
}
async function srSeason(lg) {
  if (lg._season) return lg._season;
  const d = await srGet(lg, "fixtures", { locale: "de-DE" }, liveTTL());
  lg._season = d.seasonId; return lg._season;
}
async function srState(lg, type, o, ttl) {
  const s = await srSeason(lg);
  return srGet(lg, type, { state: await srToken({ s, l: "de-DE", ...o }) }, ttl);
}
function srTeam(x) {
  return { id: x?.entityId || "", name: x?.name || "?", short: x?.name || "", abbr: x?.code || "", logo: x?.logo || x?.logoURL || "",
    score: x?.score === undefined || x?.score === null || x?.score === "" ? null : String(x.score), winner: x?.resultPlace === 1 && !x?.draw };
}
function normSr(f, lg) {
  const c = Array.isArray(f.competitors) ? f.competitors : Object.values(f.competitors || {});
  const h = c.find(x => x.isHome) || c[0], a = c.find(x => x && !x.isHome) || c[1];
  const home = srTeam(h), away = srTeam(a);
  const t = f.startTimeUTC || f.startDateTime || "";
  const start = new Date(/Z$|[+-]\d\d:?\d\d$/.test(t) ? t : t + "Z");
  const v = (f.status?.value || "").toUpperCase();
  let state = "pre", status = fmtTime.format(start), odd = false;
  if (/CANCEL|POSTPON|ABANDON|FORFEIT/.test(v)) { state = "post"; odd = true; status = f.status?.label || "Abgesagt"; }
  else if (/CONFIRMED|FINISHED|COMPLETE|ENDED|CLOSED|FINAL/.test(v)) { state = "post"; status = "Ende"; }
  else if (home.score != null || /LIVE|PROGRESS|PERIOD|INTERRUPT|HALF|BREAK|RUNNING|STARTED|WARM/.test(v)) { state = "in"; status = f.status?.label || "live"; if (home.score == null) { home.score = "0"; away.score = "0"; } }
  if (state === "pre") { home.score = null; away.score = null; }
  return { key: lg.id + "|" + f.fixtureId, id: f.fixtureId || f.id, lg: lg.id, start, state, status, odd, home, away, events: [], reds: {},
    venue: f.venue?.name || f.venue || "", round: f.round || "", attendance: f.attendance };
}
async function srFixtures(lg) {
  const [up, res] = await Promise.allSettled([
    srGet(lg, "fixtures", { locale: "de-DE" }, liveTTL()),
    srState(lg, "fixtures", { z: "RESULTS" }, 2 * 60000),
  ]);
  if (up.status === "rejected" && res.status === "rejected") throw up.reason;
  const byId = new Map();
  for (const r of [res, up]) if (r.status === "fulfilled") Object.values(r.value.fixtures || {}).forEach(f => byId.set(f.fixtureId, f));
  return [...byId.values()].map(f => normSr(f, lg)).sort((a, b) => a.start - b.start);
}

/* ---------- ESPN normalisieren ---------- */
function espnTeam(x) {
  const t = x?.team || {};
  let sc = x?.score;
  if (sc && typeof sc === "object") sc = sc.displayValue ?? sc.value;
  return {
    id: String(t.id ?? x?.id ?? ""), name: t.displayName || t.name || "?",
    short: t.shortDisplayName || t.name || t.abbreviation || "", abbr: t.abbreviation || "",
    logo: t.logo || t.logos?.[0]?.href || "", score: sc === undefined || sc === null || sc === "" ? null : String(sc),
    winner: x?.winner === true,
  };
}
function evKind(text = "", d = {}) {
  const s = String(text).toLowerCase();
  if (d.redCard || /red card|second yellow/.test(s)) return "red";
  if (d.yellowCard || /yellow/.test(s)) return "yellow";
  if (/own goal/.test(s)) return "og";
  if (/penalty.*(miss|saved)/.test(s)) return "pmiss";
  if (d.scoringPlay || /goal|penalty - scored|scored/.test(s)) return "goal";
  if (/substitut/.test(s)) return "sub";
  if (/delay/.test(s)) return "info";
  if (/second half|2nd half/.test(s)) return "sh";
  if (/kickoff|kick off|^start/.test(s)) return "start";
  if (/halftime|half-time|half time|end of first/.test(s)) return "ht";
  if (/full time|end regular|match ends|end of game|final/.test(s)) return "end";
  if (/var/.test(s)) return "var";
  return "info";
}
function statusInfo(lg, st, startDate) {
  const t = st?.type || {};
  const name = t.name || "";
  let state = t.state || "pre";
  if (/POSTPONED|CANCELED|CANCELLED|SUSPENDED|ABANDONED/.test(name)) return { state: "post", text: /POSTPONED/.test(name) ? "Verlegt" : "Abgesagt", odd: true };
  if (state === "pre") return { state, text: fmtTime.format(startDate) };
  if (state === "in") {
    if (/HALFTIME/.test(name)) return { state, text: "HZ" };
    if (lg.sport === "soccer") return { state, text: st.displayClock && st.displayClock !== "0'" ? st.displayClock : (t.shortDetail || "live") };
    return { state, text: (t.shortDetail || "").replace("End of", "Ende").replace("Half", "HZ") || "live" };
  }
  const sd = (t.shortDetail || t.detail || "").toUpperCase();
  let text = "Ende";
  if (/PEN/.test(sd)) text = "n. E."; else if (/AET|OT|EXTRA/.test(sd)) text = "n. V.";
  return { state: "post", text };
}
function normEspn(ev, lg) {
  const c = ev.competitions?.[0] || {};
  const comps = c.competitors || [];
  const h = comps.find(x => x.homeAway === "home") || comps[0];
  const a = comps.find(x => x.homeAway === "away") || comps[1];
  const home = espnTeam(h), away = espnTeam(a);
  const start = new Date(ev.date || c.date);
  const si = statusInfo(lg, ev.status || c.status, start);
  if (si.state === "pre") { home.score = null; away.score = null; }
  const events = (c.details || []).map(d => ({
    min: d.clock?.displayValue || "", kind: evKind(d.type?.text, d), side: String(d.team?.id) === home.id ? "home" : "away",
    player: (d.athletesInvolved || []).map(p => p.shortName || p.displayName).filter(Boolean).join(", "), pen: !!d.penaltyKick, og: !!d.ownGoal }));
  const reds = { home: events.filter(e => e.kind === "red" && e.side === "home").length, away: events.filter(e => e.kind === "red" && e.side === "away").length };
  return { key: lg.id + "|" + ev.id, id: String(ev.id), lg: lg.id, start, state: si.state, status: si.text, odd: !!si.odd,
    home, away, events, reds, venue: c.venue?.fullName || "", round: c.notes?.[0]?.headline || "" };
}

/* ---------- OpenLigaDB normalisieren ---------- */
function oldbScore(m) {
  const res = m.matchResults || [];
  const end = res.find(r => r.resultTypeID === 2) || res.slice().sort((a, b) => (b.resultOrderID || 0) - (a.resultOrderID || 0))[0];
  const goals = (m.goals || []).slice().sort((a, b) => (a.scoreTeam1 + a.scoreTeam2) - (b.scoreTeam1 + b.scoreTeam2) || (a.matchMinute || 0) - (b.matchMinute || 0));
  let s1 = null, s2 = null;
  const lastG = goals[goals.length - 1];
  if (m.matchIsFinished && end) { s1 = end.pointsTeam1; s2 = end.pointsTeam2; }
  else if (lastG) { s1 = lastG.scoreTeam1; s2 = lastG.scoreTeam2; }
  else if (end) { s1 = end.pointsTeam1; s2 = end.pointsTeam2; }
  return { s1, s2, goals, ht: res.find(r => r.resultTypeID === 1) };
}
function normOldb(m, lg) {
  const start = new Date(m.matchDateTimeUTC || m.matchDateTime);
  const el = (Date.now() - start) / 60000;
  const { s1, s2, goals, ht } = oldbScore(m);
  let state = "pre", status = fmtTime.format(start);
  if (m.matchIsFinished || el >= 135) { state = "post"; status = "Ende"; }
  else if (el >= 0) {
    state = "in";
    if (el <= 47) status = Math.max(1, Math.ceil(el)) + "'";
    else if (el < 62) status = "HZ";
    else { const mm = Math.ceil(el - 17); status = mm > 90 ? "90+'" : mm + "'"; }
  }
  const t = (x) => ({ id: String(x.teamId), name: x.teamName, short: x.shortName || x.teamName, abbr: x.shortName || "", logo: x.teamIconUrl || "", score: null, winner: false });
  const home = t(m.team1), away = t(m.team2);
  if (state !== "pre") { home.score = String(s1 ?? 0); away.score = String(s2 ?? 0); }
  if (state === "post") { home.winner = +home.score > +away.score; away.winner = +away.score > +home.score; }
  let p1 = 0;
  const events = goals.map(g => {
    const side = g.scoreTeam1 > p1 ? "home" : "away"; p1 = g.scoreTeam1;
    return { min: g.matchMinute ? g.matchMinute + "'" : "", kind: g.isOwnGoal ? "og" : "goal", side, player: g.goalGetterName || "", pen: !!g.isPenalty, og: !!g.isOwnGoal, score: `${g.scoreTeam1}:${g.scoreTeam2}`, et: !!g.isOvertime };
  });
  return { key: lg.id + "|" + m.matchID, id: String(m.matchID), lg: lg.id, start, state, status, est: state === "in",
    home, away, events, reds: { home: 0, away: 0 }, venue: m.location?.locationStadium || "", round: m.group?.groupName || "",
    ht: ht ? `${ht.pointsTeam1}:${ht.pointsTeam2}` : "" };
}

/* ---------- Daten laden ---------- */
const oldbSeason = lg => getJSON(`${OLDB}/getmatchdata/${lg.path}/${OLDB_SEASON}`, 10 * 60000);
async function getMatches(lg, key) {
  const isToday = key === today();
  const ttl = isToday ? liveTTL() : 10 * 60000;
  let list;
  if (lg.src === "espn") {
    // ESPN gruppiert nach US-Ostküstenzeit: US-Sport-Abende landen in Berlin am Folgetag
    const keys = lg.sport === "soccer" ? [key] : [addDays(key, -1), key];
    const ds = await Promise.all(keys.map(k => getJSON(`${BASE}/${lg.path}/scoreboard?dates=${compact(k)}`, ttl)));
    const seen = new Set();
    list = ds.flatMap(d => d.events || []).filter(e => !seen.has(e.id) && seen.add(e.id)).map(e => normEspn(e, lg)).filter(m => dayKey(m.start) === key);
  } else if (lg.src === "sr") {
    list = (await srFixtures(lg)).filter(m => dayKey(m.start) === key);
  } else {
    const season = await oldbSeason(lg);
    const byId = new Map((season || []).map(m => [m.matchID, m]));
    if (isToday) { try { (await getJSON(`${OLDB}/getmatchdata/${lg.path}`, ttl) || []).forEach(m => byId.set(m.matchID, m)); } catch (e) {} }
    list = [...byId.values()].filter(m => dayKey(new Date(m.matchDateTimeUTC || m.matchDateTime)) === key).map(m => normOldb(m, lg));
  }
  list.sort((a, b) => a.start - b.start || a.home.name.localeCompare(b.home.name));
  trackScores(list);
  return list;
}
async function getAllMatches(key) {
  const lgs = enabled();
  const res = await Promise.allSettled(lgs.map(l => getMatches(l, key)));
  return lgs.map((l, i) => ({ lg: l, ok: res[i].status === "fulfilled", list: res[i].status === "fulfilled" ? res[i].value : [] }));
}
async function teamMatches(lg, id) {
  let list = [];
  if (lg.src === "espn") {
    const d = await getJSON(`${BASE}/${lg.path}/teams/${id}/schedule`, 5 * 60000);
    list = (d.events || []).map(e => normEspn(e, lg));
    const live = (await getMatches(lg, today()).catch(() => [])).filter(m => m.home.id === id || m.away.id === id);
    live.forEach(m => { const i = list.findIndex(x => x.id === m.id); if (i >= 0) list[i] = m; else list.push(m); });
  } else if (lg.src === "sr") {
    list = (await srFixtures(lg)).filter(m => m.home.id === id || m.away.id === id);
  } else {
    const season = await oldbSeason(lg);
    list = (season || []).filter(m => String(m.team1.teamId) === id || String(m.team2.teamId) === id).map(m => normOldb(m, lg));
    (await getMatches(lg, today()).catch(() => [])).filter(m => m.home.id === id || m.away.id === id)
      .forEach(m => { const i = list.findIndex(x => x.id === m.id); if (i >= 0) list[i] = m; });
  }
  return list.sort((a, b) => a.start - b.start);
}

/* ---------- Favoriten & Torhinweise ---------- */
const favKey = (lg, id) => `${lg.src === "oldb" ? "oldb" : lg.src === "sr" ? "hb" : lg.sport}:${id}`;
const isFav = (lg, team) => !!team && S.favs.some(f => f.k === favKey(lg, team.id));
const isFavMatch = m => isFav(LG[m.lg], m.home) || isFav(LG[m.lg], m.away);
function toggleFav(lgId, team) {
  const lg = LG[lgId]; const k = favKey(lg, team.id);
  const i = S.favs.findIndex(f => f.k === k);
  if (i >= 0) { S.favs.splice(i, 1); toast(`${team.name} entfernt`); }
  else { S.favs.push({ k, lg: lgId, id: team.id, name: team.name, logo: team.logo || "" }); toast(`${team.name} ist jetzt Lieblingsteam`); }
  save();
}
const starBtn = (lg, t) => `<button class="star ${isFav(lg, t) ? "on" : ""}" data-fav='${esc(JSON.stringify({ lg: lg.id, id: t.id, name: t.name, logo: t.logo }))}' aria-label="${esc(t.name)} ${isFav(lg, t) ? "nicht mehr merken" : "merken"}">${IC.star}</button>`;
const lastScore = new Map(), flashUntil = new Map();
function trackScores(list) {
  for (const m of list) {
    if (m.home.score == null) continue;
    const sc = `${m.home.score}:${m.away.score}`;
    const prev = lastScore.get(m.key);
    lastScore.set(m.key, sc);
    if (prev && prev !== sc && m.state !== "pre") { flashUntil.set(m.key, Date.now() + 8000); if (isFavMatch(m)) goalAlert(m, sc); }
  }
}
function goalAlert(m, sc) {
  const body = `${m.home.short || m.home.name} ${sc} ${m.away.short || m.away.name}`;
  toast(`<b>Tor!</b>${esc(body)}`, true, 6000);
  if (S.notify && "Notification" in window && Notification.permission === "granted") {
    try { new Notification("Tor! " + LG[m.lg].name, { body, icon: m.home.logo || undefined, tag: m.key }); } catch (e) {}
  }
}
let toastT;
function toast(msg, html = false, ms = 2600) {
  const t = $("#toast"); if (html) t.innerHTML = msg; else t.textContent = msg;
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- Bausteine ---------- */
const logoHTML = (t, cls = "logo") => t.logo
  ? `<img class="${cls}" src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;logo-ph&quot;>${esc((t.abbr || initials(t.name)).slice(0, 3))}</span>'">`
  : `<span class="logo-ph">${esc((t.abbr || initials(t.name)).slice(0, 3))}</span>`;
const teamHref = (lg, t) => `#team/${enc(lg.id)}/${enc(t.id)}`;
const playerHref = (lg, id) => `#spieler/${enc(lg.id)}/${enc(id)}`;
function teamLine(t, m, side) {
  const lose = m.state === "post" && !m.odd && (m.home.winner || m.away.winner) && !t.winner;
  const reds = m.reds?.[side] || 0;
  return `<div class="team ${lose ? "lose" : ""}">${logoHTML(t)}<span class="nm">${esc(t.name)}</span>${'<i class="redcard" title="Rote Karte"></i>'.repeat(Math.min(reds, 3))}</div>`;
}
function statusHTML(m) {
  if (m.state === "in") return `<span class="live-chip" ${m.est ? 'title="geschätzte Spielminute"' : ""}>${esc(m.status)}</span>`;
  if (m.state === "post") return `<span class="end">${esc(m.status)}</span>`;
  return `<span class="tab-num" style="color:var(--fg)">${esc(m.status)}</span>`;
}
function matchRow(m) {
  const lg = LG[m.lg];
  const fl = (flashUntil.get(m.key) || 0) > Date.now();
  const hl = m.state === "post" && !m.odd && (m.home.winner || m.away.winner);
  const score = m.state === "pre" || m.home.score == null
    ? `<span class="dash">–</span><span class="dash">–</span>`
    : `<b class="${hl && !m.home.winner ? "lose" : ""}">${esc(m.home.score)}</b><b class="${hl && !m.away.winner ? "lose" : ""}">${esc(m.away.score)}</b>`;
  const goals = lg.sport === "soccer" ? m.events.filter(e => e.kind === "goal" || e.kind === "og") : [];
  const evs = S.events && !S.compact && goals.length
    ? `<div class="m-events">${goals.map(g => `<span>${IC.ball}${esc(g.player || "Tor")} ${esc(g.min)}${g.pen ? " (FE)" : ""}${g.og ? " (ET)" : ""}</span>`).join("")}</div>` : "";
  return `<a class="match ${m.state} ${isFavMatch(m) ? "is-fav" : ""} ${fl ? "flash" : ""}" href="#spiel/${enc(lg.id)}/${enc(m.id)}">
    <div class="m-status">${statusHTML(m)}</div>
    <div class="m-teams">${teamLine(m.home, m, "home")}${teamLine(m.away, m, "away")}</div>
    <div class="m-score">${score}</div>${evs}</a>`;
}
const skeleton = (n = 4) => `<div class="card lg-block">${'<div class="sk sk-row"></div>'.repeat(n)}</div>`;
const errNote = (txt) => `<div class="note err">${esc(txt)} <button data-act="retry">Erneut laden</button></div>`;
const backLink = (fallback) => `<a class="back" href="#${fallback}" data-back="1">${IC.back}Zurück</a>`;
const lgChips = (lgs, cur, attr) => `<div class="chips">${lgs.map(l => `<button class="chip ${l.id === cur ? "on" : ""}" data-${attr}="${l.id}">${esc(l.name)}</button>`).join("")}</div>`;
const resChip = (my, ot, live) => { const r = live ? "n" : my > ot ? "w" : my < ot ? "l" : "d"; return `<span class="res ${r}">${my}:${ot}</span>`; };

/* ---------- Ansicht: Mein Feed ---------- */
async function viewFeed(silent) {
  const v = $("#view");
  if (!silent) v.innerHTML = `<section class="sec"><div class="sec-head"><h2 class="sec-title">Live jetzt</h2></div>${skeleton(3)}</section>`;
  const favs = S.favs.filter(f => LG[f.lg] && modeOf(LG[f.lg]) === mode());
  const [all, favData, news] = await Promise.all([
    getAllMatches(today()),
    Promise.all(favs.map(f => favSchedule(f).catch(() => null))),
    mode() === "fussball" ? feedNews().catch(() => []) : Promise.resolve([]),
  ]);
  if (stale()) return;
  const flat = all.flatMap(g => g.list);
  const live = flat.filter(m => m.state === "in").sort((a, b) => isFavMatch(b) - isFavMatch(a));
  const upcoming = flat.filter(m => m.state === "pre").sort((a, b) => a.start - b.start);
  const done = flat.filter(m => m.state === "post");
  let h = `<section class="sec"><div class="sec-head"><h2 class="sec-title">${live.length ? "Live jetzt" : "Heute"}</h2><span class="eyebrow">${fmtDate.format(new Date())}</span><a class="more" href="#spiele">Alle Spiele</a></div>`;
  if (live.length) h += `<div class="hero-live">${live.map(liveTile).join("")}</div>`;
  else if (upcoming.length) h += `<div class="card lg-block" style="margin-top:0"><div class="lg-head"><span class="lg-name">Nächste Anstöße</span><span class="lg-tag">${upcoming.length} heute</span></div>${upcoming.slice(0, 6).map(matchRow).join("")}</div>`;
  else if (done.length) h += `<div class="card lg-block" style="margin-top:0"><div class="lg-head"><span class="lg-name">Heutige Ergebnisse</span><span class="lg-tag">${done.length} Spiele</span></div>${done.slice(-6).map(matchRow).join("")}</div>`;
  else h += `<div class="card empty"><b>Heute keine Spiele</b>In deinen Wettbewerben ist heute spielfrei. <a href="#spiele" style="color:var(--accent);font-weight:700">Spielplan öffnen</a></div>`;
  if (live.length && upcoming.length) h += `<div class="card lg-block"><div class="lg-head"><span class="lg-name">Später heute</span><span class="lg-tag">${upcoming.length} Spiele</span></div>${upcoming.slice(0, 5).map(matchRow).join("")}</div>`;
  const fails = all.filter(g => !g.ok);
  if (fails.length) h += `<div class="note err" style="margin-top:10px">Nicht erreichbar: ${fails.map(f => esc(f.lg.name)).join(", ")}. <button data-act="retry">Erneut laden</button></div>`;
  h += `</section>`;

  if (mode() === "handball") {
    h += `<section class="sec"><a class="card hsg-card" href="#hsg"><span class="hsg-mark">${IC.hsg}</span><span><b>HSG Wettenberg</b><small>Anwurf: alle Mannschaften, Tabellen, Spielverlauf Tor für Tor</small></span>${IC.chev}</a></section>`;
  }
  h += `<section class="sec"><div class="sec-head"><h2 class="sec-title">Meine Teams</h2><a class="more" href="#einstellungen">Bearbeiten</a></div>`;
  h += !favs.length
    ? `<div class="card empty"><b>Noch keine Lieblingsteams</b>Tippe in einer Tabelle, auf einer Teamseite oder im Spiel auf den Stern – oder wähle Teams unter Anpassen.<div style="margin-top:12px"><a class="btn" style="display:inline-flex;align-items:center" href="#einstellungen">Teams wählen</a></div></div>`
    : `<div class="fav-grid">${favs.map((f, i) => favCard(f, favData[i])).join("")}</div>`;
  h += `</section>`;
  if (news.length) h += `<section class="sec"><div class="sec-head"><h2 class="sec-title">Schlagzeilen</h2><a class="more" href="#news">Alle News</a></div><div class="card" style="padding:4px 14px">${news.slice(0, 6).map(newsRow).join("")}</div></section>`;
  v.innerHTML = h;
  setLiveCount(live.length);
}
function liveTile(m) {
  const lg = LG[m.lg];
  return `<a class="card live-tile ${(flashUntil.get(m.key) || 0) > Date.now() ? "flash" : ""}" href="#spiel/${enc(lg.id)}/${enc(m.id)}">
    <div class="meta"><span class="eyebrow">${esc(lg.name)}</span>${statusHTML(m)}</div>
    <div class="row"><div class="team">${logoHTML(m.home)}<span class="nm">${esc(m.home.name)}</span></div><span class="sc">${esc(m.home.score ?? 0)}</span></div>
    <div class="row"><div class="team">${logoHTML(m.away)}<span class="nm">${esc(m.away.name)}</span></div><span class="sc">${esc(m.away.score ?? 0)}</span></div></a>`;
}
function splitSchedule(list) {
  return {
    live: list.find(m => m.state === "in"),
    last: [...list].reverse().find(m => m.state === "post" && !m.odd && m.home.score != null),
    next: list.find(m => m.state === "pre" && m.start > Date.now() - 3600000),
  };
}
async function favSchedule(f) { const lg = LG[f.lg]; return lg ? splitSchedule(await teamMatches(lg, f.id)) : null; }
function fixtureLine(lg, teamId, m, lbl, kind) {
  if (!m) return "";
  const home = m.home.id === teamId, op = home ? m.away : m.home;
  let right;
  if (kind === "next") right = `<span class="muted tab-num" style="font-size:.84rem">${esc(fmtDate.format(m.start))} ${esc(fmtTime.format(m.start))}</span>`;
  else right = resChip(+(home ? m.home.score : m.away.score), +(home ? m.away.score : m.home.score), kind === "live");
  return `<a class="fav-line" href="#spiel/${enc(lg.id)}/${enc(m.id)}"><span class="lbl" ${kind === "live" ? 'style="color:var(--live)"' : ""}>${lbl}</span><span class="op">${home ? "vs." : "@"} ${esc(op.name)}</span>${right}</a>`;
}
function favCard(f, d) {
  const lg = LG[f.lg];
  let body = !d ? `<div class="muted" style="font-size:.88rem">Spielplan gerade nicht abrufbar.</div>`
    : (d.live ? fixtureLine(lg, f.id, d.live, "Live " + esc(d.live.status), "live") : "") + fixtureLine(lg, f.id, d.last, "Zuletzt", "last") + fixtureLine(lg, f.id, d.next, "Nächstes", "next");
  if (!body) body = `<div class="muted" style="font-size:.88rem">Keine Spiele gefunden.</div>`;
  return `<div class="card fav-card"><a class="fh" href="${teamHref(lg, f)}">${logoHTML({ logo: f.logo, name: f.name })}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><span class="eyebrow" style="margin-left:auto;font-family:var(--f-body)">${esc(lg?.name || "")}</span></a>${body}</div>`;
}
async function feedNews() {
  const favLgs = [...new Set(S.favs.map(f => f.lg))].filter(id => LG[id]?.src === "espn");
  const lgs = [...new Set([...favLgs, ...enabled().filter(l => l.src === "espn").map(l => l.id)])].slice(0, 2);
  const res = await Promise.allSettled(lgs.map(id => getNews(LG[id])));
  const seen = new Set();
  return res.flatMap(r => r.status === "fulfilled" ? r.value : []).filter(a => !seen.has(a.url) && seen.add(a.url)).sort((a, b) => b.date - a.date);
}

/* ---------- Ansicht: Spiele ---------- */
let spieleDay = null, spieleFilter = "alle";
async function viewSpiele(silent) {
  const v = $("#view");
  const t = today(), key = spieleDay || t;
  const days = []; for (let i = -3; i <= 7; i++) days.push(addDays(t, i));
  const lbl = k => k === t ? "Heute" : k === addDays(t, 1) ? "Morgen" : k === addDays(t, -1) ? "Gestern" : fmtWd.format(new Date(k + "T12:00:00Z")).replace(".", "");
  const head = `<div class="daystrip" role="tablist" aria-label="Tag wählen">${days.map(k => `<button class="day ${k === key ? "on" : ""}" data-day="${k}" role="tab" aria-selected="${k === key}"><span>${lbl(k)}</span><b class="tab-num">${+k.slice(8)}.</b></button>`).join("")}</div>
    <div class="chips" style="margin-top:10px">${[["alle", "Alle"], ["live", "Live"], ["meine", "Meine Teams"]].map(([id, n]) => `<button class="chip ${spieleFilter === id ? "on" : ""}" data-filter="${id}">${id === "live" ? '<span class="dot"></span>' : ""}${n}</button>`).join("")}</div>`;
  if (!silent) v.innerHTML = head + skeleton(4) + skeleton(3);
  const all = await getAllMatches(key);
  if (stale()) return;
  let liveN = 0, body = "";
  for (const g of all) {
    let list = g.list;
    liveN += list.filter(m => m.state === "in").length;
    if (spieleFilter === "live") list = list.filter(m => m.state === "in");
    if (spieleFilter === "meine") list = list.filter(isFavMatch);
    if (!g.ok) { if (spieleFilter === "alle") body += `<div class="card lg-block"><div class="lg-head"><span class="lg-name">${esc(g.lg.name)}</span></div><div style="padding:12px 14px">${errNote("Daten gerade nicht erreichbar.")}</div></div>`; continue; }
    if (!list.length) continue;
    const lv = list.filter(m => m.state === "in").length;
    list = [...list].sort((a, b) => isFavMatch(b) - isFavMatch(a) || a.start - b.start);
    body += `<div class="card lg-block"><div class="lg-head"><span class="lg-name">${esc(g.lg.name)}</span><span class="lg-tag">${lv ? `<span style="color:var(--live)">${lv} live</span> · ` : ""}${list.length} ${list.length === 1 ? "Spiel" : "Spiele"}</span>${g.lg.cup ? "" : `<a href="#tabellen/${g.lg.id}">Tabelle</a>`}</div>${list.map(matchRow).join("")}</div>`;
  }
  if (!body) body = `<div class="card empty" style="margin-top:14px"><b>${spieleFilter === "live" ? "Kein Spiel live" : spieleFilter === "meine" ? "Deine Teams spielen nicht" : "Keine Spiele"}</b>${spieleFilter === "alle" ? "An diesem Tag gibt es in deinen Wettbewerben keine Partien." : "Wechsle zu „Alle“ oder wähle einen anderen Tag."}</div>`;
  v.innerHTML = head + `<div class="${S.compact ? "compact" : ""}">${body}</div>` + (key === t ? `<p class="muted" style="font-size:.8rem;margin-top:14px">Live-Daten aktualisieren sich alle ${S.refresh} Sekunden.</p>` : "");
  if (key === t) setLiveCount(liveN);
  const on = v.querySelector(".day.on"); if (on && !silent) on.scrollIntoView({ inline: "center", block: "nearest" });
}

const STAT_DE = {
  possessionPct: ["Ballbesitz", "%"], totalShots: ["Torschüsse"], shotsOnTarget: ["Aufs Tor"], wonCorners: ["Ecken"],
  foulsCommitted: ["Fouls"], yellowCards: ["Gelbe Karten"], redCards: ["Rote Karten"], offsides: ["Abseits"],

};
async function viewSpiel(lgId, id, silent) {
  const v = $("#view"); const lg = LG[lgId];

  let D;
  try { D = lg.src === "espn" ? await espnDetail(lg, id) : lg.src === "sr" ? await srDetail(lg, id) : await oldbDetail(lg, id); }
  catch (e) { if (stale()) return; v.innerHTML = `${backLink("spiele")}${errNote("Spieldaten konnten nicht geladen werden.")}`; return; }
  if (stale()) return;
  const m = D.m;
  trackScores([m]);
  const tabs = [["ticker", "Ticker"]];
  if (D.stats.length || D.box) tabs.push(["statistik", "Statistik"]);
  if (D.lineups.some(l => l.start.length)) tabs.push(["aufstellung", "Aufstellung"]);
  if (!tabs.some(t => t[0] === detailTab)) detailTab = "ticker";
  const bigTeam = t => `<div class="big-team"><a href="${teamHref(lg, t)}" class="big-team-link">${logoHTML(t)}<span class="nm">${esc(t.name)}</span></a>${starBtn(lg, t)}</div>`;
  let h = `${backLink("spiele")}
  <div class="card score-card ${(flashUntil.get(m.key) || 0) > Date.now() ? "flash" : ""}" style="margin-top:6px">
    <div class="comp">${esc(lg.name)}${m.round && !/^\d{4}/.test(m.round) ? " · " + esc(m.round) : ""}</div>
    <div class="score-grid">${bigTeam(m.home)}
      <div><div class="big-score ${m.state}">${m.state === "pre" ? "– : –" : `${esc(m.home.score ?? 0)}:${esc(m.away.score ?? 0)}`}</div>
        <div class="big-status">${m.state === "pre" ? `<span class="muted">${esc(fmtLong.format(m.start))}</span>` : statusHTML(m)}</div>
        ${m.ht && m.state !== "pre" ? `<div class="muted" style="font-size:.84rem;margin-top:4px">HZ ${esc(m.ht)}</div>` : ""}</div>
      ${bigTeam(m.away)}</div>
    ${D.extra ? `<div class="sub">${esc(D.extra)}</div>` : ""}
    ${m.est ? `<div class="sub">Spielminute geschätzt (OpenLigaDB liefert Tore, aber keine Uhr).</div>` : ""}
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button class="tab ${detailTab === k ? "on" : ""}" data-tab="${k}" role="tab" aria-selected="${detailTab === k}">${n}</button>`).join("")}</div>
  <div class="card" style="margin-top:12px;padding:6px 14px">`;
  if (detailTab === "ticker") {
    if (D.comm.length) h += `<div class="chips" style="padding-top:10px"><button class="chip ${!detailComm ? "on" : ""}" data-comm="0">Ereignisse</button><button class="chip ${detailComm ? "on" : ""}" data-comm="1">Live-Kommentar (EN)</button></div>`;
    const items = detailComm && D.comm.length ? D.comm : D.ticker;
    h += items.length ? `<ol class="ticker">${items.map(tickHTML).join("")}</ol>`
      : `<div class="empty"><b>${m.state === "pre" ? "Noch kein Anpfiff" : "Noch keine Ereignisse"}</b>${m.state === "pre" ? "Der Ticker startet mit dem Anpfiff und aktualisiert sich automatisch." : "Sobald etwas passiert, steht es hier."}</div>`;
  } else if (detailTab === "statistik") {
    if (D.stats.length) h += `<h3 class="sub-title">Teamvergleich</h3>` + D.stats.map(statBar).join("");
    if (D.box) h += D.box;
  } else {
    h += `<div class="lineups" style="padding:8px 0">${D.lineups.map(l => `<div class="lu"><h4><span>${esc(l.team)}</span><span class="muted">${esc(l.formation || "")}</span></h4>
      <ul>${l.start.map(p => plRow(lg, p)).join("")}</ul>${l.bench.length ? `<div class="bench eyebrow">${lg.sport === "handball" ? "Weitere Spieler" : "Bank"}</div><ul>${l.bench.map(p => plRow(lg, p)).join("")}</ul>` : ""}
      ${l.staff?.length ? `<div class="bench eyebrow">Offizielle</div><ul>${l.staff.map(s => `<li><span class="no"></span><span>${esc(s.name)}</span><span class="pos">${esc(s.role)}</span></li>`).join("")}</ul>` : ""}</div>`).join("")}</div>`;

  h += `</div>`;

  if (lg.src === "sr") h += `<p class="muted" style="font-size:.8rem;margin-top:12px">Daten: offizielle Spielstatistik der Handball-Bundesliga.</p>`;
  v.innerHTML = h;
}
const statBar = s => {
  const a = parseFloat(s.h) || 0, b = parseFloat(s.a) || 0, tot = a + b || 1;
  return `<div class="stat"><div class="sl"><b>${esc(s.h)}${s.u || ""}</b><span>${esc(s.label)}</span><b>${esc(s.a)}${s.u || ""}</b></div>
    <div class="bars"><div class="bar l"><i class="${a >= b ? "lead" : ""}" style="width:${(a / tot * 100).toFixed(1)}%"></i></div><div class="bar"><i class="${b >= a ? "lead" : ""}" style="width:${(b / tot * 100).toFixed(1)}%"></i></div></div></div>`;
};
const plRow = (lg, p) => {
  const nm = p.id && lg.src !== "oldb" ? `<a href="${playerHref(lg, p.id)}">${esc(p.name)}</a>` : esc(p.name);
  return `<li><span class="no">${esc(p.no || "")}</span><span>${nm}${p.out ? ' <span class="muted" title="ausgewechselt">▼</span>' : ""}${p.in ? ' <span style="color:var(--good)" title="eingewechselt">▲</span>' : ""}</span><span class="pos">${esc(p.pos || "")}</span></li>`;
};
function tickHTML(t) {
  const ic = { goal: IC.ball, og: IC.ball, hgoal: IC.hball, yellow: '<i class="card-y"></i>', red: '<i class="card-r"></i>', susp: '<b class="susp">2′</b>', sub: IC.sub, start: IC.whistle, ht: IC.whistle, sh: IC.whistle, end: IC.whistle, var: IC.var, pmiss: IC.ball, timeout: IC.clock }[t.kind] || IC.info;
  const cls = ["goal", "og", "hgoal"].includes(t.kind) ? "goal" : ["start", "ht", "sh", "end"].includes(t.kind) ? "phase" : "";
  return `<li class="tick ${cls}"><span class="min">${esc(t.min)}</span><span class="ic">${ic}</span><div class="tx">${t.html}</div></li>`;
}

async function espnDetail(lg, id) {
  const d = await getJSON(`${BASE}/${lg.path}/summary?event=${id}`, liveTTL());
  const hc = d.header?.competitions?.[0] || {};
  const m = normEspn({ id, date: hc.date, status: hc.status, competitions: [hc] }, lg);
  const { ticker, comm } = espnTicker(d, m, lg);
  m.reds = { home: 0, away: 0 };
  ticker.forEach(t => { if (t.kind === "red") m.reds[t.side] = (m.reds[t.side] || 0) + 1; });
  const lineups = (d.rosters || []).map(r => ({ team: r.team?.displayName || "", formation: r.formation || "", side: r.homeAway,

const HB_SKIP = new Set(["goalKeeperChange", "assist"]);
async function srDetail(lg, id) {
  const [pbp, st, pre] = await Promise.allSettled([
    srState(lg, "fixture_detail", { z: "pbp", f: id }, liveTTL()),
    srState(lg, "fixture_detail", { z: "statistics", f: id }, liveTTL()),
    srState(lg, "fixture_detail", { z: "preview", f: id }, 10 * 60000),
  ]);
  const base = [pbp, st, pre].find(r => r.status === "fulfilled");
  if (!base) throw new Error("keine Daten");
  const fx = base.value.banner?.fixture || base.value.fixture || {};
  const m = normSr({ ...fx, fixtureId: id, startTimeUTC: fx.startTimeUTC || fx.startDateTime }, lg);
  if (!fx.startTimeUTC && !fx.startDateTime) {
    const known = (await srFixtures(lg).catch(() => [])).find(x => x.id === id);
    if (known) m.start = known.start;
  }
  const homeId = m.home.id;
  // Ticker
  const ticker = [];
  if (pbp.status === "fulfilled") {
    const periods = pbp.value.periodData || [];
    let last = "0:0";
    const names = { [m.home.id]: m.home.short || m.home.name, [m.away.id]: m.away.short || m.away.name };
    periods.forEach((p, pi) => {
      const base = (p.elapsedMinutesBeforePeriod || 0) * 60;
      const evs = p.events || [];
      if (evs.length) ticker.push({ min: mmss(base), kind: pi === 0 ? "start" : "sh", html: pi === 0 ? "Anpfiff" : pi === 1 ? "Anpfiff 2. Halbzeit" : "Verlängerung" });
      evs.forEach((e, i) => {
        const sec = base + (isoDur(e.clock) || 0);
        const sc = e.scores ? `${e.scores[m.home.id] ?? 0}:${e.scores[m.away.id] ?? 0}` : last;
        const scored = sc !== last; last = sc;
        if (HB_SKIP.has(e.eventType) || /foul drawn/i.test(e.desc || "")) return;
        const who = e.name ? `${esc(e.name)}${e.bib ? ` (${esc(e.bib)})` : ""}` : "";
        const team = names[e.entityId] || "";
        let kind = "info", html;
        if (scored) {
          kind = "hgoal";
          const assist = evs.slice(i + 1, i + 4).find(x => x.eventType === "assist" && x.entityId === e.entityId && x.clock === e.clock);
          html = `<b>${esc(sc)} ${esc(team)}</b><small>${who}${e.desc ? " · " + esc(e.desc) : ""}${assist ? " · Assist: " + esc(assist.name) : ""}</small>`;
        } else {
          if (e.eventType === "suspension") kind = "susp";
          else if (e.eventType === "yellowCard") kind = "yellow";
          else if (/redCard|blueCard|disqualification/.test(e.eventType)) kind = "red";
          else if (e.eventType === "timeOut") kind = "timeout";
          html = `${esc(e.desc || e.eventType)}<small>${[who, esc(team)].filter(Boolean).join(" · ")}</small>`;
        }
        ticker.push({ min: mmss(sec), kind, side: e.entityId === homeId ? "home" : "away", html });
      });
      if (p.ended) ticker.push({ min: mmss(base + (p.durationMinutes || 30) * 60), kind: pi === periods.length - 1 && m.state === "post" ? "end" : "ht", html: pi === periods.length - 1 && m.state === "post" ? "Abpfiff" : "Halbzeit" });
    });
  }
  // Statistik
  let stats = [], box = "";
  if (st.status === "fulfilled" && st.value.statistics?.data?.base) {
    const b = st.value.statistics.data.base;
    const sum = (side, key, idx) => (b[side]?.persons?.[idx]?.rows || []).reduce((acc, r) => {
      const v = r.statistics?.[key]; if (v == null) return acc;
      if (typeof v === "string" && v.includes("/")) { const [x, y] = v.split("/").map(Number); return [acc[0] + x, acc[1] + y]; }
      return [acc[0] + (+v || 0), acc[1]];
    }, [0, 0]);
    const pair = (label, key, idx = 0, frac = false) => {
      const H = sum("home", key, idx), A = sum("away", key, idx);
      if (!H[0] && !A[0] && !H[1] && !A[1]) return null;
      return frac ? { label, h: `${H[0]}/${H[1]}`, a: `${A[0]}/${A[1]}` } : { label, h: String(H[0]), a: String(A[0]) };
    };
    const shots = ["goalsScored:shots"].map(k => [sum("home", k, 0), sum("away", k, 0)])[0];
    stats = [
      pair("Tore / Würfe", "goalsScored:shots", 0, true),
      shots[0][1] || shots[1][1] ? { label: "Wurfquote", h: String(Math.round(shots[0][0] / (shots[0][1] || 1) * 100)), a: String(Math.round(shots[1][0] / (shots[1][1] || 1) * 100)), u: "%" } : null,
      pair("7-Meter", "sevenMetreGoalsScored:sevenMetreShots", 0, true),
      pair("Feldtore", "fieldGoalsScored:fieldShots", 0, true),
      pair("Assists", "assists"), pair("Paraden", "goalKeeperShotsSaved", 1), pair("Blocks", "blocks"), pair("Steals", "steals"),
      pair("Zeitstrafen", "twoMinuteSuspensions"), pair("Technische Fehler", "technicalFaults"), pair("Rote Karten", "redCards"),
    ].filter(Boolean);
    const tbl = (side, team) => {
      const P = b[side]?.persons || [];
      const cols = [["bib", "#"], ["name", "Name"], ["goalsScored:shots", "T/W"], ["sevenMetreGoalsScored:sevenMetreShots", "7m"], ["assists", "A"], ["twoMinuteSuspensions", "2′"], ["timeOnPlayingField", "Min"], ["handballPerformanceIndex", "HPI"]];
      const gk = [["bib", "#"], ["name", "Name"], ["goalKeeperShotsSaved", "Par."], ["goalKeeperSaveAccuracy", "%"], ["goalKeeperGoalsAgainst", "GT"], ["timeOnPlayingField", "Min"]];
      const render = (grp, cs) => {

        return `<div class="tbl-wrap"><table class="tbl box"><thead><tr>${cs.map(c => `<th class="${c[0] === "name" ? "tl" : ""}">${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cs.map(([k]) => {

    };

  }

    const pers = pre.value.preview?.persons || {};
    lineups = [m.home, m.away].map(t => {
      const p = pers[t.id] || {};
      const mp = x => ({ id: x.id || x.personId, no: x.bib, name: x.name, pos: x.position || "" });
      return { team: t.name, start: (p.starters || []).map(mp), bench: (p.substitutes || []).map(mp), staff: (p.staff || []).map(s => ({ name: s.name, role: s.roleLabel || "" })) };
    });
  }
  const extra = [m.venue, m.round, m.attendance ? `${Number(m.attendance).toLocaleString("de-DE")} Zuschauer` : (fx.attendance ? `${Number(fx.attendance).toLocaleString("de-DE")} Zuschauer` : "")].filter(Boolean).join(" · ");
  return { m, ticker: ticker.reverse(), comm: [], stats, box, lineups, extra };
}

const SOCCER_GRP = { G: "Tor", D: "Abwehr", M: "Mittelfeld", F: "Sturm" };
async function teamInfo(lg, id) {
  if (lg.src === "espn") {
    const d = await getJSON(`${BASE}/${lg.path}/teams/${id}/roster`, 30 * 60000);
    let ath = d.athletes || [];
    if (ath.length && ath[0].items) ath = ath.flatMap(g => g.items.map(x => ({ ...x, _grp: g.position })));
    const stat = (a, cat, name) => a.statistics?.splits?.categories?.find(c => c.name === cat)?.stats?.find(s => s.name === name)?.value;
    const squad = ath.map(a => ({
      id: a.id, no: a.jersey, name: a.displayName, age: a.age, nat: natDe(a.citizenship),
      pos: a.position?.abbreviation || "", height: a.height ? Math.round(a.height * 2.54) + " cm" : ftIn(a.displayHeight),
      grp: lg.sport === "soccer" ? (SOCCER_GRP[a.position?.abbreviation] || "Weitere") : (a.position?.displayName || a._grp || "Kader"),
      apps: stat(a, "general", "appearances"), goals: stat(a, "offensive", "totalGoals"), assists: stat(a, "offensive", "goalAssists"),
    }));
    const order = ["Tor", "Abwehr", "Mittelfeld", "Sturm", "Weitere"];
    squad.sort((a, b) => order.indexOf(a.grp) - order.indexOf(b.grp) || (+a.no || 99) - (+b.no || 99));
    return { name: d.team?.displayName, logo: d.team?.logo, squad };
  }
  if (lg.src === "sr") {
    const [sum, ro] = await Promise.allSettled([srGet(lg, "entity_detail", { locale: "de-DE", entityId: id }, 30 * 60000), srState(lg, "entity_detail", { e: id, z: "roster" }, 30 * 60000)]);
    const s = sum.status === "fulfilled" ? sum.value.team : null;
    const venue = s?.summary?.teamInfoFields?.items?.find(x => /ort|halle|venue/i.test(x.key))?.value || "";
    const rows = ro.status === "fulfilled" ? (ro.value.team?.roster?.players?.rows || []) : [];
    const GRP = { TW: "Tor", G: "Tor", LA: "Außen", RA: "Außen", KM: "Kreis", RL: "Rückraum", RM: "Rückraum", RR: "Rückraum" };
    const squad = rows.map(r => ({ id: r.id, no: r.bib, name: r.name, pos: r.position?.code || "", posName: r.position?.name, age: r.age, nat: r.nationality, height: r.height ? r.height + " cm" : "",
      grp: GRP[r.position?.code] || (/tor/i.test(r.position?.name || "") ? "Tor" : /außen/i.test(r.position?.name || "") ? "Außen" : /kreis/i.test(r.position?.name || "") ? "Kreis" : /rückraum/i.test(r.position?.name || "") ? "Rückraum" : "Kader") }));
    const order = ["Tor", "Außen", "Rückraum", "Kreis", "Kader"];
    squad.sort((a, b) => order.indexOf(a.grp) - order.indexOf(b.grp) || (+a.no || 99) - (+b.no || 99));
    return { name: s?.banner?.name, venue: venue ? "Heimspielstätte: " + venue : "", squad };
  }
  return {};
}

async function espnPlayer(lg, id) {
  const [a, ov] = await Promise.allSettled([
    getJSON(`${WEB}/common/v3/sports/${lg.path}/athletes/${id}`, 30 * 60000),
    getJSON(`${WEB}/common/v3/sports/${lg.sport === "soccer" ? "soccer" : lg.path}/athletes/${id}/overview`, 10 * 60000),
  ]);
  if (a.status === "rejected") throw a.reason;
  const at = a.value.athlete || {};
  const facts = [["Alter", at.age], ["Geboren", at.displayDOB], ["Nation", natDe(at.citizenship)], ["Größe", ftIn(at.displayHeight)], ["Gewicht", lbs(at.displayWeight)]].filter(x => x[1]);
  let table = null;
  const st = ov.status === "fulfilled" ? ov.value.statistics : null;
  if (st?.splits?.length) {
    const names = st.names || [];
    const head = ["Wettbewerb", ...names.map((n, i) => PSTAT_DE[n] || st.labels?.[i] || n)];
    table = { title: "Saisonwerte", head, rows: st.splits.map(s => [esc((s.displayName || "").replace(/^\d{4}-\d{2}\s*/, "")), ...(s.stats || [])]) };
  }
  return { name: at.displayName || "Spieler", pos: at.position?.displayName || "", no: at.displayJersey?.replace("#", "") || at.jersey,
    team: at.team ? { id: String(at.team.id), name: at.team.displayName } : null, facts, table };
}
async function srPlayer(lg, id) {
  const [pd, ld] = await Promise.allSettled([srState(lg, "person_detail", { z: "log", p: id }, 10 * 60000), getLeaders(lg)]);
  if (pd.status === "rejected") throw pd.reason;
  const p = pd.value.person || {};
  const info = Object.fromEntries((p.info || []).map(x => [x.key, x.value]));
  const facts = [["Alter", info.age], ["Geboren", info["Date of birth"] ? new Date(info["Date of birth"]).toLocaleDateString("de-DE") : ""], ["Nation", info.nationality], ["Größe", info.height ? info.height + " cm" : ""], ["Gewicht", info.weight ? info.weight + " kg" : ""]].filter(x => x[1]);
  const ranks = [];
  if (ld.status === "fulfilled") ld.value.forEach(c => { const i = c.rows.findIndex(r => r.id === id); if (i >= 0) ranks.push({ title: c.title, value: c.rows[i].value, rank: i + 1 }); });
  const rows = (pd.value.log?.rows || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const table = rows.length ? { title: "Spiele dieser Saison", head: ["Gegner", "Datum", "Ergebnis"],
    rows: rows.map(r => [`<span class="res ${r.result?.value === "W" ? "w" : r.result?.value === "L" ? "l" : "d"}" style="font-size:.8rem;margin-right:8px">${esc(r.result?.label || "")}</span>${esc(r.name || "")}`, new Date(r.date).toLocaleDateString("de-DE"), (r.score || "").replace(" - ", ":")]) } : null;
  return { name: p.name || "Spieler", no: p.bib, pos: "", team: p.teamName ? { id: p.teamId, name: p.teamName } : null, facts, ranks, table };
}

    <select class="sel" id="pickLg" aria-label="Wettbewerb für Teamauswahl"><option value="">Wettbewerb …</option>${ordered.filter(l => !l.cup).map(l => `<option value="${l.id}" ${pickLg === l.id ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></div>
    <div id="pickList"></div></div></section>`;
  h += `<section class="sec"><div class="sec-head"><h2 class="sec-title">Wettbewerbe</h2><span class="eyebrow" id="onCount">${ordered.filter(l => S.on.includes(l.id)).length} aktiv</span></div><div class="card set-group">
    <p class="src-note" style="padding-bottom:4px">Schalte ein, was du verfolgen willst. Mit den Pfeilen legst du die Reihenfolge fest.</p>`;
  ordered.forEach((l, i) => {
    h += `<div class="set-row"><div class="lbl">${esc(l.name)}<small>${esc(l.grp)}${l.src === "oldb" ? " · OpenLigaDB" : l.src === "sr" ? " · offizielle HBL-Daten" : ""}</small></div>
      <div class="mv"><button data-mv="${l.id}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="${esc(l.name)} nach oben">${IC.up}</button><button data-mv="${l.id}" data-dir="1" ${i === ordered.length - 1 ? "disabled" : ""} aria-label="${esc(l.name)} nach unten">${IC.down}</button></div>
      <label class="switch"><input type="checkbox" id="lg-${l.id.replace(/\./g, "-")}" data-lg="${l.id}" ${S.on.includes(l.id) ? "checked" : ""} aria-label="${esc(l.name)} anzeigen"><span></span></label></div>`;
  });
  h += `</div></section>`;
  const seg = (name, cur, opts) => `<div class="seg" role="group">${opts.map(([val, lbl]) => `<button data-set="${name}" data-val="${val}" class="${String(cur) === String(val) ? "on" : ""}" aria-pressed="${String(cur) === String(val)}">${lbl}</button>`).join("")}</div>`;
  h += `<section class="sec"><div class="sec-head"><h2 class="sec-title">Darstellung</h2></div><div class="card set-group">
    <div class="set-row" style="flex-wrap:wrap"><div class="lbl">Erscheinungsbild</div>${seg("theme", S.theme, [["system", "System"], ["light", "Hell"], ["dark", "Dunkel"]])}</div>
    <div class="set-row" style="flex-wrap:wrap"><div class="lbl">Akzentfarbe<small>${esc(ACCENTS[S.accent]?.name || "")}</small></div><div class="swatches">${Object.entries(ACCENTS).map(([k, a]) => `<button class="sw ${S.accent === k ? "on" : ""}" data-accent="${k}" style="background:${isDark() ? a.d : a.l}" aria-label="Akzent ${a.name}"></button>`).join("")}</div></div>
    <div class="set-row"><div class="lbl">Kompakte Ergebnisliste<small>Ohne Wappen und Torschützen, mehr Spiele pro Bildschirm</small></div><label class="switch"><input type="checkbox" id="setCompact" data-toggle="compact" ${S.compact ? "checked" : ""}><span></span></label></div>
    <div class="set-row"><div class="lbl">Torschützen in der Liste<small>Nur Fußball</small></div><label class="switch"><input type="checkbox" id="setEvents" data-toggle="events" ${S.events ? "checked" : ""}><span></span></label></div>
    <div class="set-row" style="flex-wrap:wrap"><div class="lbl">Startseite</div>${seg("start", S.start, [["feed", "Feed"], ["spiele", "Spiele"], ["tabellen", "Tabellen"], ["statistik", "Statistik"]])}</div>
  </div></section>`;
  const notifState = !("Notification" in window) ? "Dieser Browser unterstützt keine Mitteilungen. Tore deiner Teams erscheinen als Hinweis in der App."
    : Notification.permission === "denied" ? "Mitteilungen sind im Browser blockiert. Erlaube sie in den Website-Einstellungen."
    : "Bei Toren deiner Lieblingsteams, solange Anpfiff geöffnet ist. Auf dem iPhone nur, wenn Anpfiff zum Home-Bildschirm hinzugefügt wurde.";
  h += `<section class="sec"><div class="sec-head"><h2 class="sec-title">Live-Daten</h2></div><div class="card set-group">
    <div class="set-row" style="flex-wrap:wrap"><div class="lbl">Aktualisierung<small>Wie oft laufende Spiele neu geladen werden</small></div>${seg("refresh", S.refresh, [[15, "15 s"], [30, "30 s"], [60, "60 s"]])}</div>
    <div class="set-row"><div class="lbl">Tor-Mitteilungen<small>${esc(notifState)}</small></div><label class="switch"><input type="checkbox" id="setNotify" data-toggle="notify" ${S.notify ? "checked" : ""} ${!("Notification" in window) ? "disabled" : ""}><span></span></label></div>
  </div></section>`;
  h += `<section class="sec"><div class="card"><p class="src-note">Fußball und US-Sport kommen live von <b>ESPN</b>, die 3. Liga von <b>OpenLigaDB</b> (Community-gepflegt). Handball (HBL, 2. HBL, DHB-Pokal) stammt aus der offiziellen Spielstatistik der Liga, die HSG-Daten aus Anwurf. Deine Einstellungen bleiben nur auf diesem Gerät.</p>
    <div class="set-row">${resetAsk ? `<div class="lbl">Wirklich alles zurücksetzen?</div><button class="btn ghost" data-act="reset-no">Abbrechen</button><button class="btn danger" data-act="reset-yes">Zurücksetzen</button>` : `<div class="lbl">Einstellungen und Lieblingsteams zurücksetzen</div><button class="btn ghost" data-act="reset">Zurücksetzen</button>`}</div></div></section>`;
  v.innerHTML = h;
  if (pickLg && LG[pickLg] && modeOf(LG[pickLg]) === mode()) renderPick(); else pickLg = null;
}
async function renderPick() {
  const box = $("#pickList"); if (!box || !pickLg) return;
  const lg = LG[pickLg];
  box.innerHTML = `<div class="team-pick">${'<div class="sk" style="height:48px"></div>'.repeat(6)}</div>`;
  let teams = [];
  try {
    if (lg.src === "oldb") {
      const d = await getJSON(`${OLDB}/getavailableteams/${lg.path}/${OLDB_SEASON}`, 30 * 60000);
      teams = (d || []).map(t => ({ id: String(t.teamId), name: t.teamName, logo: t.teamIconUrl || "" }));
    } else {
      const seen = new Set();
      teams = (await getTable(lg)).flatMap(g => g.rows.map(r => r.team)).filter(t => !seen.has(t.id) && seen.add(t.id)).map(t => ({ id: t.id, name: t.name, logo: t.logo }));
    }
  } catch (e) { box.innerHTML = `<div style="padding:0 14px 14px">${errNote("Teams gerade nicht abrufbar.")}</div>`; return; }
  if (pickLg !== lg.id) return;
  teams.sort((a, b) => a.name.localeCompare(b.name, "de"));
  box.innerHTML = teams.length ? `<div class="team-pick">${teams.map(t => `<button class="${isFav(lg, t) ? "on" : ""}" data-fav='${esc(JSON.stringify({ lg: lg.id, ...t }))}' aria-pressed="${isFav(lg, t)}">${logoHTML(t)}<span>${esc(t.name)}</span>${IC.star}</button>`).join("")}</div>`
    : `<p class="src-note">Keine Teams gefunden.</p>`;
}

/* ---------- Theme ---------- */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => S.theme === "dark" || (S.theme === "system" && mq.matches);
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  const a = ACCENTS[S.accent] || ACCENTS.rasen;
  r.style.setProperty("--accent", isDark() ? a.d : a.l);
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = isDark() ? "#131C17" : "#FFFFFF";
}
mq.addEventListener?.("change", () => { applyTheme(); if (view === "einstellungen") render(); });

/* ---------- Router ---------- */
let view = "feed", params = [], tok = 0;
const stale = (t = tok) => t !== tok;
const VIEWS = ["feed", "spiele", "spiel", "tabellen", "statistik", "news", "hsg", "team", "spieler", "einstellungen"];
const PARENT = { spiel: "spiele", team: "tabellen", spieler: "statistik" };
function navHTML() {
  return NAV().map(([k, n]) => `<a class="nav-item ${view === k || PARENT[view] === k ? "on" : ""}" href="#${k}" ${view === k ? 'aria-current="page"' : ""}>${IC[k]}<span>${n}</span></a>`).join("");
}
function sportSwitch() {
  return [["fussball", "Fußball"], ["handball", "Handball"]].map(([k, n]) => `<button data-sport="${k}" class="${S.sport === k ? "on" : ""}" aria-pressed="${S.sport === k}">${n}</button>`).join("");
}
async function render(silent = false) {
  const my = ++tok;
  const chooser = !S.sport;
  document.body.classList.toggle("choosing", chooser);
  document.body.classList.toggle("hsg-mode", view === "hsg" && !chooser);
  $("#bottomNav").innerHTML = chooser ? "" : navHTML(); $("#sideNav").innerHTML = chooser ? "" : navHTML();
  $("#sportSw").innerHTML = chooser ? "" : sportSwitch();
  $("#topSub").textContent = chooser ? "Deine Sportzentrale" : ({ feed: "Mein Feed", spiele: "Spiele & Ergebnisse", spiel: "Liveticker", tabellen: "Tabellen", statistik: "Statistik", news: "News", hsg: "HSG Wettenberg", team: "Team", spieler: "Spieler", einstellungen: "Anpassen" }[view] || "");
  if (chooser) { viewStart(); return; }
  const btn = $("#refreshBtn"); btn.classList.add("spin");
  try {
    if (view === "feed") await viewFeed(silent);
    else if (view === "spiele") await viewSpiele(silent);
    else if (view === "spiel") await viewSpiel(params[0], params[1], silent);
    else if (view === "tabellen") await viewTabellen(silent);
    else if (view === "statistik") await viewStatistik(silent);
    else if (view === "news") await viewNews(silent);
    else if (view === "hsg") viewHsg();
    else if (view === "team") await viewTeam(params[0], params[1], silent);
    else if (view === "spieler") await viewSpieler(params[0], params[1], silent);
    else if (view === "einstellungen") await viewSettings();
  } catch (e) {
    if (my === tok) $("#view").innerHTML = errNote("Etwas ist schiefgelaufen: " + (e?.message || e));
    console.error(e);
  } finally { if (my === tok) btn.classList.remove("spin"); }
}
let navDepth = 0;
function route() {
  const h = location.hash.slice(1);
  const parts = (h || S.start).split("/").map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
  const prev = view;
  view = VIEWS.includes(parts[0]) ? parts[0] : "feed";
  if (view === "news" && mode() === "handball") view = "feed";
  if (view === "hsg" && mode() !== "handball") view = "feed";
  params = parts.slice(1);
  const lgP = params[0] && LG[params[0]];
  if (lgP && ["spiel", "team", "spieler"].includes(view) && modeOf(lgP) !== mode()) { S.sport = modeOf(lgP); save(); }
  if (view === "tabellen" && lgP) tableLg = params[0];
  if (view === "news" && lgP) newsLg = params[0];
  if (view === "statistik" && lgP) statLg = params[0];
  if (view === "spiel" && prev !== "spiel") { detailTab = "ticker"; detailComm = false; }
  if (view !== "hsg") window.scrollTo(0, 0);
  render();
}
window.addEventListener("hashchange", () => { navDepth++; route(); });

function setLiveCount(n) {
  const el = $("#liveCount");
  el.hidden = !n; el.innerHTML = n ? `<span class="live-chip" style="font-size:.8rem">${n} live</span>` : "";
}
function showUpdated() { $("#updated").textContent = lastOk ? fmtTime.format(new Date(lastOk)) : ""; }

/* ---------- Ereignisse ---------- */
document.addEventListener("click", async (e) => {
  const back = e.target.closest("[data-back]");
  if (back && navDepth > 0) { e.preventDefault(); history.back(); return; }
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "refreshBtn") { cache.clear(); if (view === "hsg") { const f = $("#anwurfFrame"); if (f) f.contentWindow?.location.reload(); } else render(true); return; }
  if (t.dataset.sport) {
    const was = S.sport; S.sport = t.dataset.sport; save();
    tableLg = statLg = newsLg = null; spieleDay = null; pickLg = null;
    if (view === "einstellungen" && was) { render(); return; }
    if (location.hash === "#feed" || (!location.hash && S.start === "feed")) render(); else location.hash = "feed";
    return;
  }
  if (t.dataset.day) { spieleDay = t.dataset.day; render(); return; }
  if (t.dataset.filter) { spieleFilter = t.dataset.filter; render(true); return; }
  if (t.dataset.table) { tableLg = t.dataset.table; history.replaceState(null, "", "#tabellen/" + tableLg); render(); return; }
  if (t.dataset.stat) { statLg = t.dataset.stat; history.replaceState(null, "", "#statistik/" + statLg); render(); return; }
  if (t.dataset.news) { newsLg = t.dataset.news; history.replaceState(null, "", "#news/" + newsLg); render(); return; }
  if (t.dataset.tab) { detailTab = t.dataset.tab; render(true); return; }
  if (t.dataset.comm) { detailComm = t.dataset.comm === "1"; render(true); return; }
  if (t.dataset.fav) {
    e.preventDefault(); e.stopPropagation();
    const f = JSON.parse(t.dataset.fav); toggleFav(f.lg, f);
    if (view === "einstellungen") { const y = scrollY; await viewSettings(); scrollTo(0, y); } else render(true);
    return;
  }
  if (t.dataset.unfav) { S.favs = S.favs.filter(f => f.k !== t.dataset.unfav); save(); viewSettings(); return; }
  if (t.dataset.mv) {
    const ids = S.order.filter(id => modeOf(LG[id]) === mode());
    const i = ids.indexOf(t.dataset.mv), j = i + +t.dataset.dir;
    if (j < 0 || j >= ids.length) return;
    const a = S.order.indexOf(ids[i]), b = S.order.indexOf(ids[j]);
    [S.order[a], S.order[b]] = [S.order[b], S.order[a]]; save();
    const y = scrollY; await viewSettings(); scrollTo(0, y);
    document.querySelector(`[data-mv="${CSS.escape(t.dataset.mv)}"][data-dir="${t.dataset.dir}"]`)?.focus();
    return;
  }
  if (t.dataset.set) {
    const k = t.dataset.set; S[k] = k === "refresh" ? +t.dataset.val : t.dataset.val; save();
    if (k === "theme") applyTheme(); if (k === "refresh") schedule();
    const y = scrollY; await viewSettings(); scrollTo(0, y); return;
  }
  if (t.dataset.accent) { S.accent = t.dataset.accent; save(); applyTheme(); const y = scrollY; await viewSettings(); scrollTo(0, y); return; }
  const act = t.dataset.act;
  if (act === "retry") { cache.clear(); render(); }
  if (act === "reset") { resetAsk = true; viewSettings(); }
  if (act === "reset-no") { resetAsk = false; viewSettings(); }
  if (act === "reset-yes") { resetAsk = false; const sp = S.sport; S = JSON.parse(JSON.stringify(DEFAULTS)); S.sport = sp; save(); applyTheme(); viewSettings(); toast("Zurückgesetzt"); }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.lg) {
    const id = t.dataset.lg;
    S.on = t.checked ? [...new Set([...S.on, id])] : S.on.filter(x => x !== id); save();
    const c = $("#onCount"); if (c) c.textContent = S.order.filter(x => S.on.includes(x) && modeOf(LG[x]) === mode()).length + " aktiv";
  }
  if (t.dataset.toggle) {
    const k = t.dataset.toggle;
    if (k === "notify" && t.checked && "Notification" in window && Notification.permission !== "granted") {
      try { const p = await Notification.requestPermission(); if (p !== "granted") { t.checked = false; toast("Mitteilungen nicht erlaubt"); S.notify = false; save(); viewSettings(); return; } } catch (err) { t.checked = false; return; }
    }
    S[k] = t.checked; save();
    if (k === "notify" && t.checked) toast("Tor-Mitteilungen sind an");
  }
  if (t.id === "pickLg") { pickLg = t.value || null; if (pickLg) renderPick(); else $("#pickList").innerHTML = ""; }
});

/* ---------- Auto-Aktualisierung ---------- */
let timer;
function schedule() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (document.hidden || !S.sport) return;
    if (["einstellungen", "news", "hsg", "spieler", "team", "statistik"].includes(view)) return;
    if (view === "spiele" && spieleDay && spieleDay !== today()) return;
    render(true);
  }, S.refresh * 1000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.sport && !["einstellungen", "hsg"].includes(view)) render(true); });

applyTheme();
schedule();
route();
</script>
<script defer data-category="freizeit" src="protect.js"></script>
</body>
</html>
