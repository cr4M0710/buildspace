<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flächen-Fuchs – Lernspiel Umfang &amp; Fläche</title>
<meta name="description" content="Lernspiel zu Umfang und Fläche von Rechteck, Quadrat, Dreieck und Kreis für 1 bis 4 Spieler.">
<style>
  :root{
    --bg1:#0F3D24; --bg2:#1E6B41; --track:#0A2417;
    --paper:#FFFFFF; --ink:#17301F; --ink-soft:#4C6656;
    --accent:#E8792E; --accent-dark:#C15F1C;
    --good:#1E8E5A; --good-bg:#E3F6EC;
    --bad:#D6403A; --bad-bg:#FDEBEA;
    --radius:20px;
    --p1:#FF6B6B; --p2:#4D96FF; --p3:#FFC93D; --p4:#63D471;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1A2A1F; --ink:#EAF6EC; --ink-soft:#9FBCA9;
      --bad-bg:#3A2323; --good-bg:#1D3327;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    font-family: var(--font);
    min-height:100vh;
    background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 60%);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 60px;
  }
  .wrap { width:100%; max-width:760px; }
  .top-link {
    display:inline-flex; align-items:center; gap:6px;
    color:#D7F0DE; text-decoration:none; font-size:13.5px; font-weight:600;
    margin-bottom:14px; opacity:0.85;
  }
  .top-link:hover { opacity:1; }
  h1 {
    color:#fff; font-size:clamp(1.8rem, 5vw, 2.6rem); margin:0 0 4px; font-weight:800;
    letter-spacing:-0.02em;
  }
  .subtitle { color:#C9E7D2; margin:0 0 22px; font-size:15px; }
  .card {
    background:var(--paper); border-radius:var(--radius); padding:28px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .screen { display:none; }
  .screen.active { display:block; }

  /* ---- Setup ---- */
  .field-label { font-weight:700; font-size:14px; margin:18px 0 8px; color:var(--ink); }
  .field-label:first-child { margin-top:0; }
  .choice-row { display:flex; gap:10px; flex-wrap:wrap; }
  .choice-btn {
    flex:1; min-width:64px; padding:14px 10px; border-radius:14px; border:2px solid transparent;
    background:#EAF3EC; color:var(--ink); font-weight:700; font-size:16px; cursor:pointer;
    transition: all 0.15s ease;
  }
  .choice-btn.selected { background:var(--accent); color:#fff; box-shadow:0 6px 16px -4px rgba(193,95,28,0.5); }
  .diff-btn { flex-direction:column; align-items:flex-start; text-align:left; padding:12px 14px; }
  .diff-btn small { display:block; font-weight:500; font-size:12px; opacity:0.75; margin-top:2px; }
  .name-inputs { display:grid; gap:10px; margin-top:4px; }
  .name-input-row { display:flex; align-items:center; gap:10px; }
  .name-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .name-input-row input {
    flex:1; padding:10px 12px; border-radius:10px; border:1.5px solid #D8E6DB;
    font-size:15px; font-family:inherit;
  }
  .start-btn {
    width:100%; margin-top:26px; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(155deg, var(--accent), var(--accent-dark)); color:#fff;
    font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 10px 24px -6px rgba(193,95,28,0.6);
  }
  .start-btn:active { transform:translateY(1px); }

  /* ---- Game ---- */
  .track-area { margin-bottom:22px; display:grid; gap:10px; }
  .lane { display:flex; align-items:center; gap:10px; }
  .lane-name { width:92px; flex-shrink:0; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lane-track { flex:1; height:26px; background:var(--track); border-radius:999px; position:relative; overflow:hidden; }
  .lane-fill { height:100%; border-radius:999px; transition: width 0.5s cubic-bezier(.2,.9,.3,1); position:relative; }
  .lane-runner {
    position:absolute; top:50%; transform:translate(-50%,-50%); font-size:19px;
    transition: left 0.5s cubic-bezier(.2,.9,.3,1); left:0%;
  }
  .lane.current .lane-name { color:var(--ink); }
  .lane.current .lane-track { box-shadow:0 0 0 3px var(--accent); }

  .turn-banner {
    text-align:center; font-weight:800; font-size:15px; padding:10px 14px; border-radius:12px;
    margin-bottom:18px; color:#fff;
  }
  .question-box { text-align:center; padding:10px 0 4px; }
  .shape-box { display:flex; justify-content:center; margin-bottom:10px; }
  .q-text { font-size:clamp(1.05rem, 3.6vw, 1.3rem); font-weight:700; color:var(--ink); margin:0 0 20px; line-height:1.4; }
  .q-answer-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .q-answer-row input {
    width:150px; padding:14px 16px; font-size:22px; text-align:center; border-radius:14px;
    border:2px solid #D8E6DB; font-family:inherit; font-weight:700;
  }
  .q-answer-row input:focus { outline:none; border-color:var(--accent); }
  .q-unit { font-size:18px; font-weight:700; color:var(--ink-soft); }
  .submit-btn {
    padding:14px 22px; border:none; border-radius:14px; background:var(--accent); color:#fff;
    font-size:16px; font-weight:800; cursor:pointer;
  }
  .feedback {
    text-align:center; margin-top:18px; padding:14px; border-radius:14px; font-weight:700; font-size:15px;
    display:none;
  }
  .feedback.show { display:block; }
  .feedback.good { background:var(--good-bg); color:var(--good); }
  .feedback.bad { background:var(--bad-bg); color:var(--bad); }

  /* ---- End ---- */
  .end-emoji { font-size:56px; text-align:center; margin-bottom:6px; }
  .end-title { text-align:center; font-size:1.6rem; font-weight:800; margin:0 0 22px; }
  table.stats { width:100%; border-collapse:collapse; margin-bottom:24px; }
  table.stats th, table.stats td { padding:10px 8px; text-align:left; font-size:14px; border-bottom:1px solid #EAF3EC; }
  table.stats th { color:var(--ink-soft); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
  .end-actions { display:flex; gap:10px; }
  .end-actions button {
    flex:1; padding:14px; border-radius:14px; border:none; font-weight:800; font-size:15px; cursor:pointer;
  }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-secondary { background:#EAF3EC; color:var(--ink); }

  @media (max-width:480px) {
    .card { padding:20px 16px; }
    .lane-name { width:64px; font-size:11px; }
  }
</style>
<script defer src="qrcode-generator.js"></script>
<script defer data-category="schule" src="protect.js"></script>
<script defer src="cursor.js"></script>
</head>
<body>

  <div class="wrap">
    <a class="top-link" href="index.html#/schule/mathematik">← Zurück zu Mathematik</a>
    <h1>🦊 Flächen-Fuchs</h1>
    <p class="subtitle">Umfang und Fläche von Rechteck, Quadrat, Dreieck &amp; Kreis üben — für 1 bis 4 Spieler am selben Gerät.</p>

    <div class="card">

      <!-- SETUP -->
      <section class="screen active" id="screen-setup">
        <div class="field-label">Anzahl Spieler</div>
        <div class="choice-row" id="player-count-row"></div>

        <div class="field-label">Schwierigkeit</div>
        <div class="choice-row" id="difficulty-row">
          <button class="choice-btn diff-btn" data-diff="A">Leicht<small>Rechteck &amp; Quadrat</small></button>
          <button class="choice-btn diff-btn selected" data-diff="B">Mittel<small>+ Dreieck</small></button>
          <button class="choice-btn diff-btn" data-diff="C">Schwer<small>+ Kreis</small></button>
        </div>

        <div class="field-label">Namen (optional)</div>
        <div class="name-inputs" id="name-inputs"></div>

        <button class="start-btn" id="start-btn">🦊 Los geht's</button>
      </section>

      <!-- GAME -->
      <section class="screen" id="screen-game">
        <div class="track-area" id="track-area"></div>
        <div class="turn-banner" id="turn-banner"></div>
        <div class="question-box">
          <div class="shape-box" id="shape-box"></div>
          <p class="q-text" id="q-text"></p>
          <div class="q-answer-row">
            <input type="number" id="q-input" inputmode="decimal" step="any" autocomplete="off" placeholder="?">
            <span class="q-unit" id="q-unit"></span>
            <button class="submit-btn" id="submit-btn">Antworten</button>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>
      </section>

      <!-- END -->
      <section class="screen" id="screen-end">
        <div class="end-emoji">🏆</div>
        <h2 class="end-title" id="end-title"></h2>
        <table class="stats" id="stats-table"></table>
        <div class="end-actions">
          <button class="btn-secondary" id="restart-setup-btn">Einstellungen ändern</button>
          <button class="btn-primary" id="play-again-btn">Nochmal spielen</button>
        </div>
      </section>

    </div>
  </div>

<script>
(function () {
  "use strict";

  const COLORS = ["#FF6B6B", "#4D96FF", "#FFC93D", "#63D471"];
  const RUNNER = ["🦊", "🐿️", "🦔", "🐇"];
  const TARGET = 8; // richtige Antworten zum Sieg
  const PI = 3.14;

  let players = [];
  let difficulty = "B";
  let numPlayers = 2;
  let currentPlayer = 0;
  let currentQuestion = null;
  let gameOver = false;

  const el = (id) => document.getElementById(id);

  /* ---------- Setup screen ---------- */
  const playerCountRow = el("player-count-row");
  [1, 2, 3, 4].forEach((n) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn" + (n === numPlayers ? " selected" : "");
    btn.textContent = n;
    btn.dataset.count = n;
    btn.addEventListener("click", () => {
      numPlayers = n;
      [...playerCountRow.children].forEach((b) => b.classList.toggle("selected", Number(b.dataset.count) === n));
      renderNameInputs();
    });
    playerCountRow.appendChild(btn);
  });

  el("difficulty-row").addEventListener("click", (e) => {
    const btn = e.target.closest(".diff-btn");
    if (!btn) return;
    difficulty = btn.dataset.diff;
    [...el("difficulty-row").children].forEach((b) => b.classList.toggle("selected", b === btn));
  });

  function renderNameInputs() {
    const wrap = el("name-inputs");
    wrap.innerHTML = "";
    for (let i = 0; i < numPlayers; i++) {
      const row = document.createElement("div");
      row.className = "name-input-row";
      row.innerHTML =
        '<span class="name-dot" style="background:' + COLORS[i] + '"></span>' +
        '<input type="text" maxlength="16" placeholder="Spieler ' + (i + 1) + '" id="name-input-' + i + '">';
      wrap.appendChild(row);
    }
  }
  renderNameInputs();

  el("start-btn").addEventListener("click", startGame);

  /* ---------- Question generator ---------- */
  function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
  function round1(n) { return Math.round(n * 10) / 10; }

  function genQuestion(diff) {
    const pool = diff === "A" ? ["rechteck", "quadrat"]
      : diff === "B" ? ["rechteck", "quadrat", "dreieck"]
      : ["rechteck", "quadrat", "dreieck", "kreis"];
    const shape = pick(pool);
    const askArea = Math.random() < 0.5;

    if (shape === "rechteck") {
      const w = randInt(3, 20), h = randInt(3, 20);
      const ask = askArea ? "area" : "peri";
      const answer = ask === "area" ? w * h : 2 * (w + h);
      return {
        shape: "rechteck", dims: { w, h }, ask, answer, unit: ask === "area" ? "cm²" : "cm",
        prompt: "Rechteck: Breite " + w + " cm, Höhe " + h + " cm. Berechne " + (ask === "area" ? "die Fläche." : "den Umfang.")
      };
    }
    if (shape === "quadrat") {
      const s = randInt(3, 20);
      const ask = askArea ? "area" : "peri";
      const answer = ask === "area" ? s * s : 4 * s;
      return {
        shape: "quadrat", dims: { s }, ask, answer, unit: ask === "area" ? "cm²" : "cm",
        prompt: "Quadrat mit Seitenlänge " + s + " cm. Berechne " + (ask === "area" ? "die Fläche." : "den Umfang.")
      };
    }
    if (shape === "dreieck") {
      const g = randInt(4, 20);
      const h = 2 * randInt(2, 10);
      const answer = (g * h) / 2;
      return {
        shape: "dreieck", dims: { g, h }, ask: "area", answer, unit: "cm²",
        prompt: "Dreieck mit Grundseite " + g + " cm und Höhe " + h + " cm. Berechne die Fläche."
      };
    }
    // kreis
    const r = randInt(2, 12);
    const ask = askArea ? "area" : "peri";
    const answer = ask === "area" ? round1(PI * r * r) : round1(2 * PI * r);
    return {
      shape: "kreis", dims: { r }, ask, answer, unit: ask === "area" ? "cm²" : "cm", tolerance: 0.06,
      prompt: "Kreis mit Radius " + r + " cm (π ≈ 3,14). Berechne " + (ask === "area" ? "die Fläche." : "den Umfang.")
    };
  }

  /* ---------- Shape SVG ---------- */
  function renderShapeSvg(q) {
    const stroke = "#B9701C", fill = "#FFE1BB", labelColor = "#5C4423";
    if (q.shape === "rechteck" || q.shape === "quadrat") {
      const w = q.dims.w || q.dims.s, h = q.dims.h || q.dims.s;
      const maxDim = 150;
      // Ränder lassen genug Platz für die Maßzahlen links/oben, damit sie im
      // SVG-viewBox nie abgeschnitten werden (Breite/Höhe können sehr
      // unterschiedlich groß sein).
      const leftM = 48, rightM = 24, topM = 32, bottomM = 24;
      const availW = 220 - leftM - rightM, availH = 190 - topM - bottomM;
      const scale = Math.min(availW / w, availH / h, 14);
      const rw = w * scale, rh = h * scale;
      const x0 = leftM + (availW - rw) / 2, y0 = topM + (availH - rh) / 2;
      return '<svg viewBox="0 0 220 190" width="220" height="190">' +
        '<rect x="' + x0 + '" y="' + y0 + '" width="' + rw + '" height="' + rh + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="3"/>' +
        '<text x="' + (x0 + rw / 2) + '" y="' + (y0 - 10) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + labelColor + '">' + w + ' cm</text>' +
        '<text x="' + (x0 - 10) + '" y="' + (y0 + rh / 2) + '" text-anchor="end" dominant-baseline="middle" font-size="15" font-weight="700" fill="' + labelColor + '">' + h + ' cm</text>' +
        '</svg>';
    }
    if (q.shape === "dreieck") {
      const g = q.dims.g, h = q.dims.h;
      const leftM = 48, rightM = 24, topM = 32, bottomM = 30;
      const availW = 220 - leftM - rightM, availH = 190 - topM - bottomM;
      const scale = Math.min(availW / g, availH / h, 14);
      const bw = g * scale, bh = h * scale;
      const x0 = leftM + (availW - bw) / 2, y0 = topM + (availH - bh) / 2, yBase = y0 + bh;
      const points = x0 + "," + yBase + " " + (x0 + bw) + "," + yBase + " " + x0 + "," + y0;
      return '<svg viewBox="0 0 220 190" width="220" height="190">' +
        '<polygon points="' + points + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="3"/>' +
        '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + yBase + '" stroke="' + stroke + '" stroke-width="1.5" stroke-dasharray="4,3"/>' +
        '<text x="' + (x0 + bw / 2) + '" y="' + (yBase + 20) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + labelColor + '">' + g + ' cm</text>' +
        '<text x="' + (x0 - 10) + '" y="' + (y0 + bh / 2) + '" text-anchor="end" dominant-baseline="middle" font-size="15" font-weight="700" fill="' + labelColor + '">' + h + ' cm</text>' +
        '</svg>';
    }
    // kreis
    const r = q.dims.r;
    const cx = 110, cy = 100;
    const scale = Math.min(6, 78 / r);
    const rr = r * scale;
    return '<svg viewBox="0 0 220 190" width="220" height="190">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="3"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + rr) + '" y2="' + cy + '" stroke="' + stroke + '" stroke-width="2"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="2.5" fill="' + stroke + '"/>' +
      '<text x="' + (cx + rr / 2) + '" y="' + (cy - 10) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + labelColor + '">r = ' + r + ' cm</text>' +
      '</svg>';
  }

  /* ---------- Game flow ---------- */
  function startGame() {
    players = [];
    for (let i = 0; i < numPlayers; i++) {
      const input = el("name-input-" + i);
      const name = (input && input.value.trim()) || "Spieler " + (i + 1);
      players.push({ name: name, color: COLORS[i], correct: 0, wrong: 0 });
    }
    currentPlayer = 0;
    gameOver = false;
    showScreen("screen-game");
    renderTrack();
    nextQuestion();
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    el(id).classList.add("active");
  }

  function renderTrack() {
    const area = el("track-area");
    area.innerHTML = "";
    players.forEach((pl, i) => {
      const pct = Math.min(100, (pl.correct / TARGET) * 100);
      const lane = document.createElement("div");
      lane.className = "lane" + (i === currentPlayer && !gameOver ? " current" : "");
      lane.innerHTML =
        '<span class="lane-name">' + escapeHtml(pl.name) + '</span>' +
        '<div class="lane-track">' +
          '<div class="lane-fill" style="width:' + pct + '%; background:' + pl.color + '33;"></div>' +
          '<span class="lane-runner" style="left:' + pct + '%;">' + RUNNER[i] + '</span>' +
        '</div>';
      area.appendChild(lane);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function nextQuestion() {
    currentQuestion = genQuestion(difficulty);
    const pl = players[currentPlayer];
    const banner = el("turn-banner");
    banner.textContent = pl.name + " ist dran";
    banner.style.background = pl.color;
    el("shape-box").innerHTML = renderShapeSvg(currentQuestion);
    el("q-text").textContent = currentQuestion.prompt;
    el("q-unit").textContent = currentQuestion.unit;
    const input = el("q-input");
    input.value = "";
    el("feedback").className = "feedback";
    el("feedback").textContent = "";
    renderTrack();
    setTimeout(() => input.focus(), 50);
  }

  function submitAnswer() {
    if (gameOver) return;
    const input = el("q-input");
    const val = parseFloat((input.value || "").replace(",", "."));
    const fb = el("feedback");
    if (isNaN(val)) {
      fb.className = "feedback show bad";
      fb.textContent = "Bitte eine Zahl eingeben.";
      return;
    }
    const pl = players[currentPlayer];
    const tolerance = currentQuestion.tolerance || 0.001;
    const correct = Math.abs(val - currentQuestion.answer) <= tolerance;
    if (correct) {
      pl.correct++;
      fb.className = "feedback show good";
      fb.textContent = "✅ Richtig! " + pl.name + " hat jetzt " + pl.correct + " von " + TARGET + ".";
    } else {
      pl.wrong++;
      fb.className = "feedback show bad";
      fb.textContent = "❌ Leider falsch. Richtig wäre: " + currentQuestion.answer + " " + currentQuestion.unit;
    }
    renderTrack();

    if (pl.correct >= TARGET) {
      gameOver = true;
      setTimeout(showEnd, 1100);
      return;
    }

    currentPlayer = (currentPlayer + 1) % players.length;
    setTimeout(nextQuestion, 1300);
  }

  el("submit-btn").addEventListener("click", submitAnswer);
  el("q-input").addEventListener("keydown", (e) => { if (e.key === "Enter") submitAnswer(); });

  function showEnd() {
    const winner = players.reduce((a, b) => (a.correct > b.correct ? a : b));
    el("end-title").textContent = players.length === 1
      ? "Geschafft, " + winner.name + "! 🎉"
      : winner.name + " gewinnt! 🎉";
    const table = el("stats-table");
    table.innerHTML =
      "<tr><th>Spieler</th><th>Richtig</th><th>Falsch</th></tr>" +
      players.map((pl) => "<tr><td>" + escapeHtml(pl.name) + "</td><td>" + pl.correct + "</td><td>" + pl.wrong + "</td></tr>").join("");
    showScreen("screen-end");
  }

  el("play-again-btn").addEventListener("click", () => {
    players.forEach((pl) => { pl.correct = 0; pl.wrong = 0; });
    currentPlayer = 0;
    gameOver = false;
    showScreen("screen-game");
    nextQuestion();
  });

  el("restart-setup-btn").addEventListener("click", () => showScreen("screen-setup"));
})();
</script>

</body>
</html>
