<script>
/* ===== Hilfsfunktionen für Aufgaben-Generatoren ===== */
var H = (function () {
  function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  /* Zahl im deutschen Format, max. d Nachkommastellen, ohne überflüssige Nullen */
  function fmt(n, d) {
    if (d === undefined) d = 2;
    var v = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
    if (Object.is(v, -0)) v = 0;
    var s = String(v);
    if (s.indexOf('e') >= 0) s = v.toFixed(d);
    var parts = s.split('.');
    var ip = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (parts[1] ? ip + ',' + parts[1] : ip).replace('-', '−');
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
  function isPrime(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
  function digitSum(n) { var s = 0; n = Math.abs(n); while (n) { s += n % 10; n = Math.floor(n / 10); } return s; }
  function uniq(a) { var o = []; a.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  /* Ablenker für Zahlen: nahe Werte, typische Fehler; alle verschieden von richtig und untereinander */
  function numWrong(correct, cands, d, min) {
    d = d === undefined ? 2 : d;
    var seen = {}; seen[fmt(correct, d)] = 1; var out = [];
    function add(v) {
      if (!isFinite(v)) return;
      if (min !== undefined && v < min) return;
      var s = fmt(v, d); if (seen[s]) return; seen[s] = 1; out.push(s);
    }
    shuffle(cands || []).forEach(add);
    var step = Math.max(Math.pow(10, -d), Math.abs(correct) >= 20 ? Math.pow(10, Math.floor(Math.log10(Math.abs(correct))) - 1) : 1);
    var tries = 0;
    while (out.length < 3 && tries++ < 60) { add(correct + pick([-3, -2, -1, 1, 2, 3, 4, -4, 5, -5]) * step * (1 + Math.floor(tries / 12))); }
    return out.slice(0, 3);
  }
  return { rnd: rnd, pick: pick, shuffle: shuffle, fmt: fmt, gcd: gcd, isPrime: isPrime, digitSum: digitSum, uniq: uniq, numWrong: numWrong };
})();

    else if (m.t === 'st') { ctx.role = 'client'; ctx.V = m; onView(m); }
  }, function () { if (ctx.role === 'client') { toast('Verbindung getrennt'); stopAll(); showStart(); } }).then(function (n) {
    ctx.net = n; ctx.role = 'client'; n.send({ t: 'join', name: name });
    setTimeout(function () { if (!ctx.V && $('#joinMsg')) $('#joinMsg').textContent = 'Warte auf Antwort vom Raum …'; }, 3000);
  }).catch(function (e) { var el = $('#joinMsg'); if (el) el.textContent = e.message; });
}
function showJoinError(msg) { set(banner() + '<main class="screen"><section class="card center"><h2 class="h2">Beitritt nicht möglich</h2><p>' + esc(msg) + '</p><button class="btn" data-a="start">Zurück</button></section></main>'); }

/* ---------- Ansicht je Phase ---------- */
function meP(v) { return v.players.filter(function (p) { return p.id === ctx.me; })[0]; }
function canAnswer(v) {
  if (v.phase !== 'q') return false;
  if (ctx.role === 'local') return true;
  var me = meP(v); return !!me && !me.answered;
}
function track(v) {
  var n = Math.max(1, v.n), lanes = v.players.filter(function (p) { return !p.gone; });
  if (lanes.length > 10) lanes = lanes.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, 10);
  var compact = lanes.length > 4;
  return '<div class="track' + (compact ? ' compact' : '') + '" id="track" aria-label="Spielstand auf der Strecke">' + lanes.map(function (p) {
    var pos = Math.min(100, Math.round(p.right / n * 100));
    return '<div class="lane" data-pid="' + p.id + '"><span class="lname">' + esc(p.name) + '</span><div class="road"><span class="mark" style="left:calc(' + pos + '% - ' + Math.round(pos * 0.38) + 'px);color:' + p.color + '">' + G.icon + '</span><span class="goal" aria-hidden="true">' + G.goal + '</span></div><span class="lscore">' + p.score + '</span></div>';
  }).join('') + '</div>';
}
function onView(v) {
  ctx.V = v;
  var key = v.i + ':' + (ctx.role === 'local' ? v.active || '' : '');
  if (v.phase === 'lobby') { ctx.key = ''; showReveal.done = false; clearInterval(ctx.tickT); return renderLobby(v); }
  if (v.phase === 'end') { ctx.key = ''; showReveal.done = false; clearInterval(ctx.tickT); return renderEnd(v); }
  if (key !== ctx.key) { ctx.key = key; ctx.mine = null; ctx.typedVal = ''; renderPlay(v); }
  else updatePlay(v);
}
function renderLobby(v) {
  var isHost = ctx.role === 'host', code = v.code;
  var plist = v.players.map(function (p) { return '<li>' + avatar(p, 34) + '<span>' + esc(p.name) + (p.id === ctx.me ? ' <em>(du)</em>' : '') + '</span></li>'; }).join('') || '<li class="muted">Noch niemand da …</li>';
  var h = banner() + '<main class="screen"><section class="card center lobby"><p class="muted">Raum-Code</p><div class="bigcode" aria-label="Raum-Code ' + esc(code.split('').join(' ')) + '">' + esc(code) + '</div>';
  if (isHost) h += '<div class="qrbox" id="qr" aria-hidden="true"></div><p class="muted small">QR-Code scannen oder <b>' + esc(location.host + location.pathname) + '</b> öffnen und den Code eingeben.</p>';
  else h += '<p class="muted">Du bist drin! Warte, bis der Host startet.</p>';
  h += '<div class="cfg">' + esc(v.cfg.levelLabel) + ' · ' + v.cfg.n + ' Aufgaben · ' + (v.cfg.T ? v.cfg.T + ' s' : 'ohne Zeitlimit') + '<br><span class="muted small">' + v.cfg.topics.map(esc).join(' · ') + '</span></div>' +
    '<h3 class="h3">' + v.players.length + ' im Raum</h3><ul class="plist">' + plist + '</ul>';
  if (isHost) h += '<div class="go"><button class="btn big" data-a="startRoom" ' + ((v.players.length < 1) ? 'disabled' : '') + '>' + (v.players.length < 2 && !v.hostPlays ? 'Starten' : 'Spiel starten') + '</button><button class="link" data-a="start">Raum schließen</button></div>';
  else h += '<div class="go"><button class="link" data-a="start">Verlassen</button></div>';
  set(h + '</section></main>');
  if (isHost) { var el = $('#qr'); if (el && window.qrcode) el.innerHTML = qrSvg(joinUrl(code)); }
}

function choiceHtml(q, v, st) {
  var typed = false;
  return '<div class="choices" id="choices" role="group" aria-label="Antwortmöglichkeiten">' + q.choices.map(function (c, k) {
    var cls = 'choice c' + k;
    return '<button class="' + cls + '" data-a="pick" data-k="' + k + '" ' + (st && st.disabled ? 'disabled' : '') + '><span class="lt">' + LETTERS[k] + '</span><span class="tx">' + c + '</span></button>';
  }).join('') + '</div>';
}
function renderPlay(v) {
  var q = v.q, isScreen = ctx.role === 'host' && !v.hostPlays, me = meP(v);
  var h = '<div class="play ' + (isScreen ? 'screenmode' : '') + '"><div class="topbar"><button class="link" data-a="quit">✕ Beenden</button><span class="prog" id="prog">Aufgabe ' + (v.i + 1) + ' / ' + v.n + '</span>' + (ctx.role === 'host' ? '<button class="link" data-a="reveal" id="revealBtn">Jetzt auswerten</button>' : '') + '<span class="who" id="who"></span></div>';
  h += '<div class="timer" id="timer" ' + (v.T > 0 ? '' : 'hidden') + '><i id="timerbar"></i><span id="timertxt"></span></div>';
  h += track(v);
  h += '<section class="qcard" aria-live="polite">';
  if (v.turns && v.active) { var ap = v.players.filter(function (p) { return p.id === v.active; })[0]; h += '<div class="turn">' + avatar(ap, 30) + '<span>Dran: <b>' + esc(ap.name) + '</b></span></div>'; }
  h += '<div class="qtext">' + q.html + '</div>';
  if (q.svg) h += '<div class="qsvg">' + q.svg + '</div>';
  if (q.clues) h += '<ol class="clues" id="clues">' + q.clues.map(function (c, k) { return '<li class="clue' + (k === 0 ? ' on' : '') + '" data-k="' + k + '"><span class="cn">' + (k + 1) + '</span><span>' + c + '</span></li>'; }).join('') + '</ol>' + (v.T === 0 && !isScreen ? '<button class="btn ghost" data-a="clue" id="clueBtn">Nächsten Hinweis aufdecken</button>' : '');
  h += '</section>';
  var typedMode = v.typed && q.typed && ctx.role === 'local';
  if (typedMode) {
    h += '<div class="typed"><input class="inp num" id="typedIn" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Deine Antwort" aria-label="Antwort">' + (q.unit ? '<span class="unit">' + esc(q.unit) + '</span>' : '') + '<button class="btn" data-a="typedGo">Prüfen</button></div>';
  } else h += choiceHtml(q, v, { disabled: !canAnswer(v) || isScreen });
  h += '<div id="fb" class="fb" role="status" aria-live="assertive"></div><div id="after"></div>';
  if (isScreen) h += '<div class="ansn" id="ansn"></div>';
  h += '</div>';
  set(h);
  ctx.localT0 = Date.now() - (v.ms || 0); ctx.clueShown = 1;
  clearInterval(ctx.tickT); ctx.tickT = setInterval(function () { tick(); }, 120); tick();
  updatePlay(v);
  if (typedMode) { var ti = $('#typedIn'); if (ti) ti.focus(); }
}
function clueCount(v) { return v.q && v.q.clues ? v.q.clues.length : 0; }
function tick() {
  var v = ctx.V; if (!v || v.phase === 'lobby' || v.phase === 'end') return;
  var el = Date.now() - ctx.localT0, T = v.T * 1000, bar = $('#timerbar'), txt = $('#timertxt');
  if (v.phase === 'q' && v.T > 0 && bar) {
    var left = Math.max(0, T - el), pct = left / T * 100;
    bar.style.width = pct + '%'; bar.className = pct < 25 ? 'low' : pct < 55 ? 'mid' : '';
    txt.textContent = Math.ceil(left / 1000) + ' s';
  }
  if (v.phase === 'q' && clueCount(v) && v.T > 0) {
    var n = clueCount(v), step = T * 0.75 / n, shown = Math.min(n, 1 + Math.floor(el / step));
    if (shown !== ctx.clueShown) { ctx.clueShown = shown; showClues(shown); }
  }
}
function showClues(n) { $$('#clues .clue').forEach(function (li, k) { li.classList.toggle('on', k < n); }); }
function updatePlay(v) {
  var me = meP(v), isScreen = ctx.role === 'host' && !v.hostPlays;
  var who = $('#who'); if (who) { who.innerHTML = me ? 'Punkte: <b>' + me.score + '</b>' + (me.streak > 1 ? ' · Serie ' + me.streak : '') : (ctx.role === 'local' && !v.turns ? '' : ''); }
  var tr = $('#track'); if (tr) { var t2 = document.createElement('div'); t2.innerHTML = track(v); tr.replaceWith(t2.firstChild); }
  var an = $('#ansn');
  if (an) { var ans = v.players.filter(function (p) { return p.answered; }).length, tot = v.players.filter(function (p) { return !p.gone; }).length; an.textContent = ans + ' von ' + tot + ' haben geantwortet'; }
  if (v.phase === 'q') {
    var after = $('#after'); if (after && !isScreen && ctx.role !== 'local' && me && me.answered && !after.dataset.done) { after.dataset.done = 1; after.innerHTML = '<p class="wait">Antwort gesendet. Warte auf die anderen …</p>'; $$('#choices .choice').forEach(function (b) { b.disabled = true; }); }
  }
  if (v.phase === 'reveal') showReveal(v);
}
function showReveal(v) {
  var r = v.rev, q = v.q, isScreen = ctx.role === 'host' && !v.hostPlays, me = meP(v);
  var my = r.res && r.res[ctx.role === 'local' ? (v.active || v.players[0].id) : ctx.me];
  if (!showReveal.done || showReveal.key !== ctx.key) {
    showReveal.done = true; showReveal.key = ctx.key; clearInterval(ctx.tickT); var rb = $('#revealBtn'); if (rb) rb.remove();
    $$('#choices .choice').forEach(function (b, k) { b.disabled = true; b.classList.toggle('right', k === r.correct); if (my && my.a === k && k !== r.correct) b.classList.add('wrong'); });
    if (isScreen) { var tot = r.dist.reduce(function (a, b) { return a + b; }, 0) || 1; $$('#choices .choice').forEach(function (b, k) { b.insertAdjacentHTML('beforeend', '<span class="dist"><i style="width:' + Math.round(r.dist[k] / tot * 100) + '%"></i><em>' + r.dist[k] + '</em></span>'); }); }
    var fb = $('#fb'), good = my && my.ok;
    if (ctx.role === 'local' && v.turns) { var ap = v.players.filter(function (p) { return p.id === v.active; })[0]; fb.innerHTML = good ? '<span class="ok">✓ Richtig, ' + esc(ap.name) + '! +' + my.d + '</span>' : '<span class="no">✗ Leider falsch.</span>'; }
    else if (isScreen) fb.innerHTML = '<span class="ok">Richtig: ' + q.choices[r.correct] + '</span>';
    else fb.innerHTML = good ? '<span class="ok">✓ Richtig! +' + my.d + ' Punkte</span>' : (my && !my.none ? '<span class="no">✗ Leider falsch.</span>' : '<span class="no">Zeit abgelaufen.</span>');
    if (my) beep(!!good);
    var ex = '<div class="expl"><b>Richtig: ' + q.choices[r.correct] + (q.unit && q.typed ? '' : '') + '</b>' + (r.expl ? '<div>' + r.expl + '</div>' : '') + '</div>';
    var board = '';
    if (ctx.role !== 'local') board = '<ol class="mini">' + v.players.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, isScreen ? 6 : 3).map(function (p) { return '<li>' + avatar(p, 26) + '<span class="n">' + esc(p.name) + '</span><span class="s">' + p.score + (p.d ? ' <em>+' + p.d + '</em>' : '') + '</span></li>'; }).join('') + '</ol>';
    var btn = '';
    if (ctx.role === 'local' || (ctx.role === 'host')) btn = '<button class="btn big" data-a="next" id="nextBtn">' + (v.i + 1 >= v.n ? 'Ergebnis' : 'Weiter') + '</button>';
    else btn = '<p class="wait">Gleich geht es weiter …</p>';
    $('#after').innerHTML = ex + board + btn;
    var nb = $('#nextBtn'); if (nb) nb.focus();
  }
}

/* ---------- Ende ---------- */
function renderEnd(v) {
  var sorted = v.players.slice().sort(function (a, b) { return b.score - a.score; });
  var isHost = ctx.role === 'host', me = meP(v), medals = ['1.', '2.', '3.'];
  var solo = ctx.role === 'local' && v.players.length === 1;
  var h = banner() + '<main class="screen"><section class="card center end"><h2 class="h2">' + (solo ? 'Geschafft!' : 'Endstand') + '</h2>';
  if (solo) {
    var p = sorted[0], old = bestGet(), rec = p.score > old; if (rec) bestSet(p.score);
    h += '<div class="bignum">' + p.score + '</div><p class="muted">Punkte · ' + p.right + ' von ' + v.n + ' richtig' + (rec ? ' · <b class="ok">neuer Rekord!</b>' : (old ? ' · Rekord ' + old : '')) + '</p>';
  } else {
    h += '<ol class="podium">' + sorted.map(function (p, k) { return '<li class="pl' + (k < 3 ? ' top' + (k + 1) : '') + (p.id === ctx.me ? ' me' : '') + '"><span class="rk">' + (k + 1) + '.</span>' + avatar(p, 36) + '<span class="n">' + esc(p.name) + '</span><span class="s">' + p.score + ' <small>(' + p.right + '/' + v.n + ')</small></span></li>'; }).join('') + '</ol>';
  }
  var pid = ctx.role === 'local' ? null : ctx.me;
  var wrong = v.review.map(function (r, k) { return { r: r, k: k }; }).filter(function (x) { var ids = pid ? [pid] : Object.keys(x.r.res); return ids.some(function (id) { return x.r.res[id] === 0; }); });
  if (wrong.length) h += '<details class="rev"><summary>' + wrong.length + ' Aufgabe' + (wrong.length > 1 ? 'n' : '') + ' zum Nachschauen</summary><ul>' + wrong.map(function (x) { return '<li><div class="qh">' + x.r.html + '</div><div class="ra">Richtig: <b>' + x.r.ans + '</b></div>' + (x.r.expl ? '<div class="re">' + x.r.expl + '</div>' : '') + '</li>'; }).join('') + '</ul></details>';
  h += '<div class="go">';
  if (ctx.role === 'local') h += '<button class="btn big" data-a="again">Nochmal</button>';
  if (isHost) h += '<button class="btn big" data-a="lobbyAgain">Neue Runde im selben Raum</button>';
  h += '<button class="link" data-a="start">Zur Spielauswahl</button></div></section></main>';
  set(h);
}

/* ---------- Aktionen ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b) return;
  var a = b.dataset.a, v = b.dataset.v;
  if (a === 'mode') { var m = b.dataset.m; showSetup(m); }
  else if (a === 'start') showStart();
  else if (a === 'joinNext') { var c = ($('#joinCode').value || '').trim().toUpperCase(); if (c.length !== 4) { toast('Bitte den vierstelligen Code eingeben.'); return; } showJoin(c); }
  else if (a === 'joinGo') joinRoom(b.dataset.code);
  else if (a === 'count') { P.count = +v; savePrefs(); showSetup(P.mode); }
  else if (a === 'topic') { var i = P.topics.indexOf(v); if (i >= 0) P.topics.splice(i, 1); else P.topics.push(v); savePrefs(); b.setAttribute('aria-pressed', i < 0); }
  else if (a === 'allTopics') { P.topics = G.topics.map(function (t) { return t.id; }); savePrefs(); showSetup(P.mode); }
  else if (a === 'noTopics') { P.topics = []; savePrefs(); showSetup(P.mode); }
  else if (a === 'level') { P.level = +v; savePrefs(); showSetup(P.mode); }
  else if (a === 'n') { P.n = +v; savePrefs(); showSetup(P.mode); }
  else if (a === 'time') { P.time = +v; savePrefs(); showSetup(P.mode); }
  else if (a === 'go') { if (P.mode === 'room' || P.mode === 'class') hostRoom(); else startLocal(); }
  else if (a === 'startRoom') { if (ctx.session && ctx.session.phase === 'lobby') ctx.session.start(); }
  else if (a === 'lobbyAgain') { if (ctx.session) { var s = ctx.session; s.phase = 'lobby'; s.i = -1; s.t0 = 0; s.players = s.players.filter(function (p) { return !p.gone; }); s.emit(); } }
  else if (a === 'pick') pickChoice(+b.dataset.k);
  else if (a === 'typedGo') submitTyped();
  else if (a === 'clue') { var n = clueCount(ctx.V); if (ctx.clueShown < n) { ctx.clueShown++; showClues(ctx.clueShown); if (ctx.clueShown >= n && $('#clueBtn')) $('#clueBtn').disabled = true; } }
  else if (a === 'next') { if (ctx.session) ctx.session.next(); }
  else if (a === 'reveal') { if (ctx.session) ctx.session.reveal(); }
  else if (a === 'again') { startLocal(); }
  else if (a === 'quit') { if (confirm('Spiel wirklich beenden?')) showStart(); }
});
document.addEventListener('change', function (e) {
  var c = e.target.dataset && e.target.dataset.chk;
  if (c) { P[c] = e.target.checked; savePrefs(); }
});
document.addEventListener('input', function (e) {
  var k = e.target.dataset && e.target.dataset.name;
  if (k !== undefined) { P.names[+k] = e.target.value; savePrefs(); }
  if (e.target.id === 'joinCode') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    if (e.target.id === 'typedIn') { submitTyped(); return; }
    if (e.target.id === 'joinCode') { var b = $('[data-a=joinNext]'); if (b) b.click(); return; }
    if (e.target.id === 'joinName') { var j = $('[data-a=joinGo]'); if (j) j.click(); return; }
  }
  if (!ctx.V || e.target.tagName === 'INPUT') return;
  var v = ctx.V;
  if (v.phase === 'q') { var k = '1234'.indexOf(e.key); if (k < 0) k = 'abcd'.indexOf(e.key.toLowerCase()); if (k >= 0 && k < v.q.choices.length) pickChoice(k); }
  else if (v.phase === 'reveal' && (e.key === 'Enter' || e.key === ' ')) { var nb = $('#nextBtn'); if (nb && document.activeElement === document.body) { e.preventDefault(); nb.click(); } }
});
function currentCl() { return ctx.clueShown || 1; }
function sendAnswer(a) {
  var v = ctx.V; if (!v || v.phase !== 'q') return;
  if (ctx.role === 'local') ctx.session.answer(v.active || v.players[0].id, a);
  else if (ctx.role === 'host') { if (ctx.me) ctx.session.answer(ctx.me, a); }
  else if (ctx.role === 'client') { var me = meP(v); if (!me || me.answered) return; a.t = 'ans'; a.i = v.i; ctx.net.send(a); me.answered = true; ctx.mine = a.k; updatePlay(v); }
}
function pickChoice(k) {
  var v = ctx.V; if (!v || !canAnswer(v) || ctx.mine !== null && ctx.role === 'client') return;
  ctx.mine = k; $$('#choices .choice').forEach(function (b, i) { b.classList.toggle('sel', i === k); });
  sendAnswer({ k: k, cl: v.q.clues ? currentCl() : undefined });
}
function submitTyped() {
  var v = ctx.V; if (!v || v.phase !== 'q') return;
  var inp = $('#typedIn'); if (!inp) return;
  var val = parseNum(inp.value); if (isNaN(val)) { toast('Bitte eine Zahl eingeben.'); return; }
  inp.disabled = true;
  sendAnswer({ v: val, cl: v.q.clues ? currentCl() : undefined });
}
window.addEventListener('beforeunload', function () { if (ctx.net && ctx.net.close) ctx.net.close(); });

/* ---------- Start ---------- */
(function init() {
  var m = /[?&]room=([A-Za-z0-9]{4})/.exec(location.search);
  if (m) showJoin(m[1].toUpperCase()); else showStart();
  window.__arena = { ctx: ctx, P: P, G: G, makeQuestions: makeQuestions };
})();
})();

</script>
<script defer data-category="schule" src="protect.js"></script>
<script defer src="cursor.js"></script>
</body>
</html>
