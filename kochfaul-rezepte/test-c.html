<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesto-Pasta mit Kirschtomaten</title>
</head>
<body>
<div itemscope itemtype="https://schema.org/Recipe">
<h1 itemprop="name">Pesto-Pasta mit Kirschtomaten</h1>
<span itemprop="author">Kochfaul</span>
<img itemprop="image" src="https://buildspaceos.de/assets/og/kochfaul.jpg" alt="Pesto-Pasta">
<p>Für <span itemprop="recipeYield">2</span> Portionen</p>
<ul><li itemprop="recipeIngredient">250 g Spaghetti</li><li itemprop="recipeIngredient">1 Glas Pesto Genovese</li><li itemprop="recipeIngredient">250 g Kirschtomaten</li><li itemprop="recipeIngredient">40 g Hartkäse</li></ul>
<div itemprop="recipeInstructions">Spaghetti in Salzwasser 8 Minuten kochen. Abgießen, Pesto und Tomaten untermischen. Käse drüber. Fertig.</div>
</div>
</body>
</html>
