<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernährungs-Ampel</title>
<style>
:root{--bg:#0b0c10;--ink:#f4f6fb;--soft:#aeb0b8;--line:rgba(255,255,255,.2);--ok:#7bd8a4;--bad:#ff8a80;--glass:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5;padding:76px 16px 120px;background:radial-gradient(1000px 600px at 12% -10%,#262932,transparent),radial-gradient(900px 600px at 100% 115%,#1c1e26,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 10px}
.lead{color:var(--soft);margin:0 0 20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.4)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));cursor:pointer;font-weight:700;touch-action:manipulation;text-decoration:none;color:var(--ink)}
.btn:hover{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.12))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:rgba(255,255,255,.05);font-weight:600}
.btn.small{min-height:40px;padding:0 16px;font-size:.92rem}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;touch-action:manipulation}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7));color:#111;border-color:#fff}
input,select,textarea{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);width:100%}
textarea{min-height:110px;resize:vertical}
select option{color:#111}
label{display:block;font-size:.88rem;color:var(--soft);margin:0 0 4px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--soft)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c4c6cd,#fff);transition:width .3s}
.q{font-size:1.2rem;margin:0 0 14px}
.svgbox{display:flex;justify-content:center;margin:0 0 14px}
.svgbox svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choices .btn{justify-content:flex-start;text-align:left;padding:10px 18px;min-height:56px}
.choices .btn.right{background:rgba(123,216,164,.28);border-color:var(--ok)}
.choices .btn.wrong{background:rgba(255,138,128,.25);border-color:var(--bad)}
.fb{min-height:1.5em;margin:12px 0 0;font-weight:700}
.explain{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);color:#e4e6ec;font-size:.95rem}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--soft);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.big{font-size:2.4rem;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #999;background:#fff}.soft{color:#444}}

<body>
<div class="wrap">
<h1>Ernährungs-Ampel</h1>
<p class="lead">Lebensmittel nach der Ampel einordnen (reichlich, in Maßen, selten) und Zucker und Brennwert berechnen – mit Begründungen und Tipps.</p>
<div id="app"></div>
</div>
<script>

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){if(d===undefined)d=2;var v=Math.round(n*Math.pow(10,d))/Math.pow(10,d);return String(v).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(/\s/g,'');if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){var p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}s=s.replace(/[^0-9.\-+eE]/g,'');var v=parseFloat(s);return isNaN(v)?NaN:v}
function mc(correct,wrongs){correct=String(correct);var set=[correct];wrongs.forEach(function(w){w=String(w);if(set.indexOf(w)<0)set.push(w)});var arr=shuffle(set.slice(0,4));return {choices:arr,correct:arr.indexOf(correct)}}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

window.QUIZ={slug:"ernaehrung-ampel",levels:["C – Grundlage", "B – mittel", "A – erweitert"],rounds:10,intro:"Level C: typische Lebensmittel mit eindeutiger Einordnung. Level B: alle Lebensmittel. Level A: zusätzlich Zuckerwürfel und Brennwert berechnen.",sheet:"<ul><li><b>Grün</b> (täglich reichlich): Wasser, Gemüse, Obst</li><li><b>Gelb</b> (in Maßen): Vollkorn, Kartoffeln, Milchprodukte, Fleisch, Fisch, Eier, Nüsse</li><li><b>Rot</b> (selten): Süßigkeiten, gesüßte Getränke, Fettiges und Frittiertes</li></ul><p class=\"soft\">Ein Stück Würfelzucker wiegt etwa 3 g. Brennwert: Kohlenhydrate und Eiweiß je 4 kcal/g, Fett 9 kcal/g.</p>",sheetTitle:"Merkzettel Ernährungsampel",gen:function(L){

var F=[
['Apfel',0,'Obst gehört zu den Lebensmitteln, die du täglich reichlich essen sollst (Vitamine, Ballaststoffe).',1],
['Karotten',0,'Gemüse liefert viele Vitamine und Ballaststoffe bei wenig Energie – täglich reichlich.',1],
['Mineralwasser',0,'Wasser ist der beste Durstlöscher – ohne Zucker und ohne Kalorien.',1],
['Brokkoli',0,'Gemüse: täglich reichlich, am besten frisch oder schonend gegart.',1],
['Banane',0,'Obst: täglich reichlich. Etwas mehr Zucker als Beeren, aber trotzdem eine gute Wahl.',1],
['Tomate',0,'Gemüse – täglich reichlich, roh oder gekocht.',1],
['Cola',2,'Eine 0,5-l-Flasche enthält etwa 17 Stück Würfelzucker – nur selten trinken.',1],
['Gummibärchen',2,'Fast nur Zucker – selten und in kleinen Mengen.',1],
['Chips',2,'Viel Fett und Salz bei wenig Nährstoffen – nur selten.',1],
['Schokoriegel',2,'Viel Zucker und Fett – selten.',1],
['Pommes frites',2,'Frittiert, fettreich und oft stark gesalzen – selten.',1],
['Limonade',2,'Gesüßte Getränke enthalten viel Zucker – selten.',1],
['Vollkornbrot',1,'Liefert Energie und Ballaststoffe – regelmäßig, aber in Maßen (Getreideprodukte).',2],
['Haferflocken',1,'Gute Energiequelle mit Ballaststoffen – in Maßen, z. B. im Müsli.',2],
['Milch',1,'Liefert Calcium und Eiweiß – in Maßen (täglich etwa 2 Portionen Milchprodukte).',2],
['Joghurt natur',1,'Milchprodukt: in Maßen. Ungesüßt ist besser als Fruchtjoghurt.',2],
['Käse',1,'Liefert Calcium, aber auch viel Fett und Salz – in Maßen.',2],
['Hähnchenfleisch',1,'Gute Eiweißquelle – in Maßen (Fleisch nur wenige Male pro Woche).',2],
['Fisch',1,'Liefert Eiweiß und Jod – ein- bis zweimal pro Woche.',2],
['Nüsse',1,'Gesunde Fette, aber viele Kalorien – eine kleine Handvoll pro Tag.',2],
['Kartoffeln',1,'Liefern Energie und Vitamin C – in Maßen, gekocht besser als frittiert.',2],
['Nudeln',1,'Liefern Energie – in Maßen, Vollkorn ist günstiger.',2],
['Salami',2,'Verarbeitetes Fleisch mit viel Fett und Salz – selten.',2],
['Currywurst',2,'Fett, Salz und Zucker in der Soße – selten.',2],
['Eiscreme',2,'Enthält viel Zucker und Fett – gelegentlich, nicht täglich.',2],
['Energy-Drink',2,'Viel Zucker und Koffein – für Kinder und Jugendliche nicht geeignet.',2],
['Fertigpizza',2,'Viel Salz und Fett, wenig Gemüse – selten.',2],
['Kuchen',2,'Zucker und Fett – für besondere Anlässe.',2]
];
var labels=['<b>Grün</b> – täglich reichlich','<b>Gelb</b> – in Maßen','<b>Rot</b> – nur selten'];
function food(maxLevel){var pool=F.filter(function(f){return f[3]<=maxLevel});var f=pick(pool);return {html:'Wie oft sollte man <b>'+f[0]+'</b> essen bzw. trinken?',type:'choice',choices:labels,correct:f[1],hints:['Denke an die Ernährungspyramide: Gemüse, Obst und Wasser unten (reichlich), Süßes und Fettiges oben (selten).'],explain:f[2]}}
function n(v,html,unit,hints,expl,tol){return {html:html,type:'num',answer:v,tol:tol,unit:unit,shown:fmt(v,1)+' '+unit,hints:hints,explain:expl}}
if(L===1)return food(1);
if(L===2)return food(2);
var t=rnd(1,3);
if(t===1)return food(2);
if(t===2){var d=pick([['Cola',10.6],['Limonade',9.5],['Orangensaft',9],['Energy-Drink',11],['Eistee',7.5],['Apfelschorle',5]]);var ml=pick([250,330,500]);var g=d[1]*ml/100;var cubes=g/3;return n(cubes,'In 100 ml <b>'+d[0]+'</b> stecken etwa <b>'+fmt(d[1],1)+' g Zucker</b>. Ein Stück Würfelzucker wiegt 3 g. Wie viele Stücke Würfelzucker stecken in einer <b>'+ml+'-ml-Portion</b>? (auf eine Nachkommastelle runden)','Stück',['Erst die Zuckermenge in '+ml+' ml berechnen: '+fmt(d[1],1)+' g · '+(ml/100)+'.','Dann durch 3 g teilen.'],fmt(d[1],1)+' g · '+fmt(ml/100,2)+' = '+fmt(g,1)+' g Zucker → '+fmt(g,1)+' : 3 ≈ <b>'+fmt(cubes,1)+' Stück</b>',0.06)}
var kh=rnd(10,60),ei=rnd(2,25),fe=rnd(1,30);var k=4*kh+4*ei+9*fe;
return n(k,'Ein Lebensmittel enthält pro Portion <b>'+kh+' g Kohlenhydrate</b>, <b>'+ei+' g Eiweiß</b> und <b>'+fe+' g Fett</b>. Berechne den <b>Brennwert</b> (1 g Kohlenhydrate und 1 g Eiweiß ≈ 4 kcal, 1 g Fett ≈ 9 kcal).','kcal',['Rechne jeden Nährstoff einzeln und addiere.'],'4 · '+kh+' + 4 · '+ei+' + 9 · '+fe+' = '+(4*kh)+' + '+(4*ei)+' + '+(9*fe)+' = <b>'+k+' kcal</b>',0.5);

}};

(function(){
var cfg=window.QUIZ, app=document.getElementById('app'), KEY='bs-quiz-'+cfg.slug;
var st={level:store.get(KEY+'-lvl',1),i:0,score:0,task:null,hints:0,tries:0,done:false,total:cfg.rounds||10,wrong:[],streak:0};
function best(l){return store.get(KEY+'-best',{})[l]||0}
function setBest(l,v){var b=store.get(KEY+'-best',{});if(v>(b[l]||0)){b[l]=v;store.set(KEY+'-best',b)}}
function renderStart(){
  var lv=cfg.levels.map(function(n,i){return '<button class="chip" data-lv="'+(i+1)+'" aria-pressed="'+(st.level===i+1)+'">'+esc(n)+(best(i+1)?' · Bestwert '+best(i+1):'')+'</button>'}).join(' ');
  app.innerHTML='<div class="card"><h2>Niveau wählen</h2><div class="row" role="group" aria-label="Niveau">'+lv+'</div>'+(cfg.intro?'<p class="soft" style="margin-top:14px">'+cfg.intro+'</p>':'')+'<p style="margin-top:16px"><button class="btn" id="go">Start ('+st.total+' Aufgaben)</button></p></div>'+(cfg.sheet?'<details class="card"><summary>'+esc(cfg.sheetTitle||'Merkzettel')+'</summary><div style="margin-top:8px">'+cfg.sheet+'</div></details>':'');
}
function nextTask(){
  if(st.i>=st.total){return renderEnd()}
  st.task=cfg.gen(st.level);st.hints=0;st.tries=0;st.done=false;renderQ();
}
function renderQ(){
  var t=st.task,pct=Math.round(st.i/st.total*100);
  var h='<div class="card"><div class="row" style="justify-content:space-between"><span class="soft">Aufgabe '+(st.i+1)+' von '+st.total+'</span><span><b>'+st.score+'</b> Punkte'+(st.streak>1?' · Serie '+st.streak:'')+'</span></div><div class="bar" style="margin:8px 0 16px" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>';
  if(t.svg)h+='<div class="svgbox">'+t.svg+'</div>';
  h+='<p class="q">'+t.html+'</p>';
  if(t.type==='choice'){h+='<div class="choices" id="ch">'+t.choices.map(function(c,i){return '<button class="btn" data-c="'+i+'">'+c+'</button>'}).join('')+'</div>'}
  else{h+='<div class="row"><input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="Deine Antwort" style="max-width:240px" placeholder="Antwort">'+(t.unit?'<span>'+t.unit+'</span>':'')+'<button class="btn" id="chk">Prüfen</button></div>'}
  h+='<p style="margin-top:14px"><button class="btn ghost small" id="hint"'+((t.hints&&t.hints.length)?'':' hidden')+'>Tipp</button></p><div id="hbox" class="soft" aria-live="polite"></div><div class="fb" id="fb" role="status" aria-live="polite"></div><div id="ex"></div><p id="nx" hidden><button class="btn" id="next">Weiter</button></p></div>';
  app.innerHTML=h;
  var a=$('#ans');if(a){a.focus();a.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check()}})}
}
function award(base){var p=Math.max(2,base-st.hints*3);st.score+=p;st.streak++;return p}
function finish(ok){
  st.done=true;if(!ok){st.streak=0;st.wrong.push({q:st.task.html,svg:st.task.svg,a:st.task.shown})}
  $('#nx').hidden=false;$('#next').focus();
  if(st.task.explain)$('#ex').innerHTML='<div class="explain">'+st.task.explain+'</div>';
  var c=$('#chk');if(c)c.disabled=true;var a=$('#ans');if(a)a.disabled=true;$$('#ch .btn').forEach(function(b){b.disabled=true});
}
function check(){
  if(st.done)return;var t=st.task,raw=$('#ans').value;if(!raw.trim()){return}
  var v=parseNum(raw),ok=!isNaN(v)&&Math.abs(v-t.answer)<=Math.max(t.tol===undefined?0.01:t.tol,0);
  if(t.relTol)ok=!isNaN(v)&&Math.abs(v-t.answer)<=Math.abs(t.answer)*t.relTol;
  if(ok){var p=award(st.tries?5:10);$('#fb').innerHTML='<span class="ok">Richtig! +'+p+' Punkte</span>';finish(true)}
  else if(st.tries<1){st.tries++;$('#fb').innerHTML='<span class="bad">Noch nicht ganz. Du hast einen zweiten Versuch'+(isNaN(v)?' – gib eine Zahl ein.':'.')+'</span>';var a=$('#ans');a.select()}
  else{$('#fb').innerHTML='<span class="bad">Leider falsch. Lösung: <b>'+esc(t.shown)+'</b></span>';finish(false)}
}
function chooseC(i){
  if(st.done)return;var t=st.task,ok=(i===t.correct);
  $$('#ch .btn').forEach(function(b,k){if(k===t.correct)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  if(ok){var p=award(10);$('#fb').innerHTML='<span class="ok">Richtig! +'+p+' Punkte</span>'}
  else{$('#fb').innerHTML='<span class="bad">Leider falsch.</span>'}
  finish(ok);
}
function hint(){var t=st.task;if(st.hints<t.hints.length){$('#hbox').innerHTML+='<p>Tipp '+(st.hints+1)+': '+t.hints[st.hints]+'</p>';st.hints++;if(st.hints>=t.hints.length)$('#hint').hidden=true}}
function renderEnd(){
  setBest(st.level,st.score);store.set(KEY+'-lvl',st.level);
  var max=st.total*10,pc=Math.round(st.score/max*100);
  var msg=pc>=90?'Sehr stark!':pc>=70?'Gut gemacht!':pc>=50?'Solide – mit etwas Übung wird es noch besser.':'Bleib dran – nutze die Tipps und versuche es noch einmal.';
  var wr=st.wrong.length?'<h2 style="margin-top:18px">Das üben wir noch</h2>'+st.wrong.map(function(w){return '<div class="explain">'+(w.svg?'<div class="svgbox">'+w.svg+'</div>':'')+w.q+'<br><b>Lösung: '+esc(w.a)+'</b></div>'}).join('<div style="height:8px"></div>'):'';
  app.innerHTML='<div class="card"><h2>Geschafft!</h2><p class="big">'+st.score+' <span class="soft" style="font-size:1rem">von '+max+' Punkten</span></p><p>'+msg+'</p><p class="soft">Bestwert auf diesem Niveau: '+best(st.level)+'</p><div class="row" style="margin-top:12px"><button class="btn" id="again">Nochmal</button><button class="btn ghost" id="menu">Niveau wechseln</button></div>'+wr+'</div>';
}
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.lv){st.level=+b.dataset.lv;renderStart()}
  else if(b.id==='go'||b.id==='again'){st.i=0;st.score=0;st.wrong=[];st.streak=0;nextTask()}
  else if(b.id==='menu'){renderStart()}
  else if(b.id==='chk'){check()}
  else if(b.id==='hint'){hint()}
  else if(b.id==='next'){st.i++;nextTask()}
  else if(b.dataset.c!==undefined){chooseC(+b.dataset.c)}
});
/* Selbsttest: node/Browser — prüft alle Aufgaben-Generatoren */
window.__selftest=function(n){
  var bad=[],cnt=0;
  for(var L=1;L<=cfg.levels.length;L++){for(var k=0;k<(n||500);k++){
    var t;try{t=cfg.gen(L)}catch(e){bad.push('L'+L+' Fehler: '+e.message);continue}
    cnt++;
    var s=JSON.stringify(t);
    if(/undefined|NaN|Infinity|null/.test(s.replace(/"hints":\[\]/,''))&&!/null/.test(cfg.allowNull||'-'))bad.push('L'+L+' ungültiger Wert: '+s.slice(0,160));
    if(!t.html)bad.push('L'+L+' ohne Text');
    if(t.type==='choice'){
      if(t.correct===undefined||!t.choices[t.correct])bad.push('L'+L+' keine richtige Antwort: '+t.html);
      var u={};t.choices.forEach(function(c){u[c]=1});if(Object.keys(u).length!==t.choices.length)bad.push('L'+L+' doppelte Antworten: '+t.html+' -> '+t.choices.join(' | '));
    } else {
      if(typeof t.answer!=='number'||!isFinite(t.answer))bad.push('L'+L+' Antwort keine Zahl: '+t.html);
      if(!t.shown)bad.push('L'+L+' ohne Lösungsanzeige');
      var back=parseNum(String(t.shown).replace(/[^0-9,.\-]/g,''));
      if(t.checkShown!==false&&!isNaN(back)&&Math.abs(back-t.answer)>(t.relTol?Math.abs(t.answer)*t.relTol:Math.max(t.tol===undefined?0.01:t.tol,0))+1e-9)bad.push('L'+L+' Lösungsanzeige passt nicht zur Antwort: '+t.shown+' vs '+t.answer);
    }
  }}
  return {count:cnt,bad:bad.slice(0,12),badCount:bad.length};
};
renderStart();
})();

</script>
