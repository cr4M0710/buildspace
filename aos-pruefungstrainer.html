<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AoS Prüfungstrainer</title>
<style>
  :root{
    --bg:#10231f;
    --bg2:#152e28;
    --panel:#183530;
    --line:#2b5148;
    --text:#eef7f3;
    --muted:#9fc2b8;
    --accent:#7be0a8;
    --accent2:#ffb648;
    --bad:#ff7a6b;
    --good:#7be0a8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 800px at 80% -10%, var(--bg2), var(--bg));
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
  }
  .app{ width:100%; max-width:600px; padding:20px 16px 60px; }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .brand h1{ font-size:1.05rem; letter-spacing:0.02em; margin:0; font-weight:700; }
  .tag{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:14px;
  }
  h2{ font-size:1.15rem; margin:0 0 6px; }
  h3{ font-size:0.95rem; margin:16px 0 8px; color:var(--muted); font-weight:600; }
  p.lead{ color:var(--muted); font-size:0.9rem; line-height:1.5; margin:0 0 14px;}

  .script-block{ border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; background:rgba(255,255,255,0.02); }
  .script-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; }
  .script-head .left{ display:flex; align-items:center; gap:10px; }
  .script-head b{ font-size:0.95rem; }
  .script-head small{ color:var(--muted); display:block; }
  .chev{ color:var(--muted); font-size:0.8rem; transition:transform 0.15s; }
  .chev.open{ transform:rotate(90deg); }
  .chapter-list{ margin-top:10px; display:none; flex-direction:column; gap:6px; padding-left:2px; }
  .chapter-list.open{ display:flex; }
  .chapter-row{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:9px; }
  .chapter-row:active{ background:rgba(255,255,255,0.03); }
  .chapter-row small{ color:var(--muted); }
  .chapter-row label{ flex:1; font-size:0.88rem; }
  input[type=checkbox]{ accent-color: var(--accent); width:17px; height:17px; flex-shrink:0; }

  .quick-actions{ display:flex; gap:8px; margin-top:6px; }
  .chip{
    font-size:0.76rem; padding:6px 11px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .chip:active{ transform:scale(0.97); }

  .row{ display:flex; gap:10px; }
  .row > div{ flex:1; }
  label.small{ font-size:0.78rem; color:var(--muted); display:block; margin-bottom:6px;}
  select{
    width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--text);
    padding:10px; border-radius:10px; font-size:0.95rem;
  }

  button.primary{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--accent); color:#0b1f1a; font-weight:700; font-size:1rem;
    cursor:pointer; margin-top:6px;
  }
  button.secondary{
    width:100%; padding:12px; border:1px solid var(--line); border-radius:12px;
    background:transparent; color:var(--text); font-size:0.92rem; cursor:pointer; margin-top:8px;
  }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:0.45; }

  .selcount{ font-size:0.8rem; color:var(--accent); margin-top:4px; }

  .timerbar-wrap{ height:6px; border-radius:4px; background:var(--bg2); overflow:hidden; margin-bottom:14px;}
  .timerbar{ height:100%; background:var(--accent); width:100%; transition:width 0.2s linear, background 0.3s;}
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:0.85rem; color:var(--muted);}
  .topbar .clock{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--text); font-size:1rem;}
  .topbar .clock.warn{ color:var(--accent2); }
  .topbar .clock.crit{ color:var(--bad); }

  .qtag{ font-size:0.72rem; color:var(--accent); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;}
  .qtext{ font-size:1.03rem; line-height:1.45; margin-bottom:6px; }
  .qhint{ font-size:0.78rem; color:var(--muted); margin-bottom:14px; }
  .opt{
    display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px;
    border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,0.02);
    color:var(--text); font-size:0.92rem; cursor:pointer; line-height:1.4;
  }
  .opt input{ margin-top:2px; }
  .opt:active{ transform:scale(0.99); }
  .opt.correct{ border-color:var(--good); background:rgba(123,224,168,0.14); }
  .opt.wrong{ border-color:var(--bad); background:rgba(255,122,107,0.14); }
  .opt.missed{ border-color:var(--accent2); background:rgba(255,182,72,0.12); }
  .opt.disabled{ pointer-events:none; opacity:0.95; }
  .explain{
    margin-top:6px; padding:12px 14px; border-radius:12px;
    background:var(--bg2); border:1px solid var(--line); font-size:0.87rem; color:var(--muted); line-height:1.5;
  }
  .explain b{ color:var(--text); }
  .points{ font-weight:800; }
  .points.full{ color:var(--good); }
  .points.zero{ color:var(--bad); }

  .scorewrap{ text-align:center; padding:10px 0 4px; }
  .scorewrap .big{ font-size:2.4rem; font-weight:800; color:var(--accent); }
  .scorewrap .of{ color:var(--muted); font-size:1rem; }

  .review{ border-top:1px solid var(--line); margin-top:16px; padding-top:12px; }
  .review-item{ padding:0; border-bottom:1px solid var(--line); font-size:0.86rem; }
  .review-item:last-child{ border-bottom:none; }
  .review-head{ padding:10px 0; cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  .review-head .dot{ width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .review-head .dot.ok{ background:var(--good); }
  .review-head .dot.no{ background:var(--bad); }
  .review-head .body{ flex:1; }
  .review-head .q{ color:var(--text); margin-bottom:3px; }
  .review-head .a{ color:var(--muted); font-size:0.8rem; }
  .review-head .a.ok{ color:var(--good); }
  .review-head .a.no{ color:var(--bad); }
  .review-detail{ display:none; padding:0 0 14px 18px; }
  .review-detail.open{ display:block; }
  .review-opt{ display:flex; gap:8px; align-items:flex-start; padding:8px 10px; margin-bottom:6px; border-radius:9px; border:1px solid var(--line); font-size:0.85rem; }
  .review-opt.correct{ border-color:var(--good); background:rgba(123,224,168,0.14); color:var(--text); }
  .review-opt.wrong{ border-color:var(--bad); background:rgba(255,122,107,0.14); color:var(--text); }
  .review-opt.missed{ border-color:var(--accent2); background:rgba(255,182,72,0.12); color:var(--text); }
  .review-opt.neutral{ border-color:var(--line); color:var(--muted); }
  .review-opt .mark{ font-weight:800; flex-shrink:0; }
  .source-tag{
    display:inline-block; margin-top:10px; padding:7px 11px; border-radius:9px;
    background:var(--bg2); border:1px solid var(--line); font-size:0.78rem; color:var(--accent);
  }

  .history-item{
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    background:rgba(255,255,255,0.02);
  }
  .history-item:active{ transform:scale(0.99); }
  .history-item .left b{ display:block; font-size:0.9rem; }
  .history-item .left small{ color:var(--muted); }
  .history-item .score{ font-weight:800; color:var(--accent); font-size:1.05rem; }
  .history-empty{ color:var(--muted); font-size:0.9rem; text-align:center; padding:20px 0; }
  .backlink{ color:var(--muted); font-size:0.85rem; cursor:pointer; display:inline-block; margin-bottom:12px; }

  footer.note{ text-align:center; color:var(--muted); font-size:0.72rem; margin-top:18px; line-height:1.5;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
function mc(stem, opts, explain) {
  return {
    stem,
    options: opts.map(([text, correct]) => ({ text, correct })),
    explain
  };
}

const QUESTIONS = {};
QUESTIONS.breitensport = { label: "Training im Breitensport", chapters: [] };
QUESTIONS.anatomie = { label: "Anatomische, physiologische und biomechanische Grundlagen", chapters: [] };
QUESTIONS.ernaehrung = { label: "Ernährung im Breitensport", chapters: [] };

/* ================= BREITENSPORT – KAPITEL 1 ================= */
QUESTIONS.breitensport.chapters.push({ id:"b1", label:"Kapitel 1 – Sportliches Training", startPage: 7, items: [

mc("Was ist das zentrale Ziel des Leistungssports?", [
  ["Leistungssteigerung bis hin zu Sieg und Rekord", true],
  ["Reine Freude an der Bewegung ohne Wettkampfbezug", false],
  ["Ausschließlich soziale Kontakte", false],
  ["Rehabilitation nach Verletzungen", false],
  ["Sportliche Früherziehung von Kindern", false]
], "Leistungssport ist auf systematische Leistungssteigerung bis zum Sieg/Rekord ausgerichtet – die anderen Punkte beschreiben eher Motive des Breiten- oder Freizeitsports."),

mc("Ordnen Sie zu: Welche zwei Aussagen beschreiben zutreffend den Unterschied zwischen Freizeit- und Breitensport?", [
  ["Freizeitsport ist wettkampfungebunden.", true],
  ["Breitensport ist wettkampfgebunden.", true],
  ["Freizeitsport ist stets leistungsorientierter als Breitensport.", false],
  ["Beide Begriffe sind identisch definiert.", false],
  ["Nur Breitensport erlaubt Vereinsmitgliedschaft.", false]
], "Der zentrale Unterschied liegt in der Wettkampfbindung: Freizeitsport ungebunden, Breitensport wettkampfgebunden – beide können im Verein stattfinden."),

mc("Welche drei Hauptmotive nennt das Skript für die Teilnahme Erwachsener am Breitensport?", [
  ["Gesundheitliche Aspekte", true],
  ["Soziale Aspekte", true],
  ["Freude an der Bewegung", true],
  ["Vorbereitung auf eine Profikarriere", false],
  ["Verpflichtung durch den Arbeitgeber", false]
], "Erwachsene betreiben Breitensport vor allem aus gesundheitlichen, sozialen und Freude-Motiven – nicht aus beruflichem Zwang oder Profiambitionen."),

mc("Welche vier Aussagen beschreiben zutreffend die Situation des Breitensports in Deutschland?", [
  ["Die Mitgliederzahlen sind tendenziell rückläufig.", true],
  ["Es besteht ein Mangel an ehrenamtlich Aktiven.", true],
  ["Vereine werden häufiger zusammengelegt.", true],
  ["Die Erreichbarkeit von Sportstätten hat sich für viele Kinder eher verschlechtert.", true],
  ["Die Zahl der Sportvereine wächst seit Jahren deutlich.", false]
], "Rückläufige Mitgliederzahlen, Ehrenamtsmangel, Vereinszusammenlegungen und schlechtere Erreichbarkeit prägen die Lage – ein Vereinswachstum wird nicht beschrieben."),

mc("Welche Aussage zu Röthig et al. (2003) und der Definition von Training ist zutreffend?", [
  ["Training wird als komplexer Handlungsprozess zur Leistungsentwicklung beschrieben.", true],
  ["Diese Definition stammt aus rein medizinischer Perspektive.", false],
  ["Sie betont die planmäßige, sachorientierte Einwirkung auf die Leistung.", true],
  ["Sie schließt Zufälligkeit als zentrales Merkmal ein.", false],
  ["Sie gilt ausschließlich für Kindertraining.", false]
], "Röthig et al. definieren Training sportwissenschaftlich als planmäßigen, sachorientierten Prozess zur Leistungsentwicklung – nicht medizinisch, nicht zufällig, nicht kinderspezifisch."),

mc("Was kennzeichnet Weinecks (2004) sportbiologisch-medizinische Definition von Training?", [
  ["Systematische Wiederholung überschwelliger Muskelanspannungen", true],
  ["Morphologische und funktionelle Anpassungserscheinungen als Ergebnis", true],
  ["Zweck ist die Leistungssteigerung", true],
  ["Ein einmaliger Reiz genügt für dauerhafte Anpassung.", false],
  ["Die Definition bezieht sich auf rein psychologische Prozesse.", false]
], "Weineck beschreibt Training als wiederholte, überschwellige Reize mit morphologisch-funktioneller Anpassung zur Leistungssteigerung – nicht als Einmalereignis oder rein psychologischen Vorgang."),

mc("Welches Merkmal sportlichen Trainings ist gemeint: 'Jede Maßnahme ist im Leistungssport auf ein spezifisches Ziel ausgerichtet'?", [
  ["Zielgerichtetheit", true],
  ["Systematik", false],
  ["Planmäßigkeit", false],
  ["Individuelle Ausbildung", false],
  ["Wissenschaftliche Fundierung", false]
], "Diese Beschreibung entspricht dem Merkmal 'Zielgerichtetheit' – die anderen Merkmale betonen andere Aspekte wie Kontrolle, Struktur oder Wissensbasis."),

mc("Welche zwei Merkmale sportlichen Trainings betreffen die Struktur und Kontrolle des Trainingsprozesses?", [
  ["Planmäßigkeit", true],
  ["Systematik", true],
  ["Zielgerichtetheit", false],
  ["Trainingsübungen und Methoden", false],
  ["Wissenschaftliche Fundierung", false]
], "Planmäßigkeit (zeitliche Struktur) und Systematik (regelmäßige Kontrolle/Anpassung) betreffen speziell die Prozessorganisation."),

mc("Welche der folgenden zählen zu den vier Ebenen, auf denen Training laut Skript beschrieben werden kann?", [
  ["Training als zielorientierter Veränderungsprozess", true],
  ["Training als Anpassungsprozess", true],
  ["Training als Steuerungsprozess", true],
  ["Training als Spezialisierungsprozess", true],
  ["Training als reiner Unterhaltungsprozess", false]
], "Die vier Ebenen sind Veränderungs-, Anpassungs-, Steuerungs- und Spezialisierungsprozess – 'Unterhaltungsprozess' ist keine davon."),

mc("Ein Trainer passt sein Training flexibel an unterschiedliche Altersgruppen an und kennt die Trainingsmethodik verschiedener motorischer Fähigkeiten. Welches Merkmal beschreibt dies am ehesten?", [
  ["Wissenschaftliche Fundierung und breites Fachwissen", true],
  ["Zunehmende Spezialisierung", false],
  ["Reizstufenregel", false],
  ["Superkompensation", false],
  ["Periodisierung", false]
], "Breites, angepasstes Fachwissen entspricht der wissenschaftlichen Fundierung des Trainings – die anderen Begriffe betreffen Trainingsprinzipien aus Kapitel 3."),

mc("Welche zwei Aussagen zu Kindern im Breitensport sind zutreffend?", [
  ["Angebote zielen häufig auf sportliche Früherziehung ab.", true],
  ["Motorische Fähigkeiten werden oft spielerisch trainiert.", true],
  ["Kinder-Breitensport verzichtet grundsätzlich auf jede spielerische Komponente.", false],
  ["Ziel ist primär die Vorbereitung auf den Profisport.", false],
  ["Wettkampfergebnisse stehen klar im Vordergrund.", false]
], "Kindertraining im Breitensport ist spielerisch und auf Früherziehung ausgerichtet, nicht auf Profikarrieren oder Wettkampfergebnisse."),

mc("Was versteht man unter 'individueller und kollektiver Ausbildung' als Trainingsmerkmal?", [
  ["Berücksichtigung sowohl persönlicher Voraussetzungen als auch der Mannschaftsdynamik", true],
  ["Ausschließliche Fokussierung auf Einzelsportarten", false],
  ["Verzicht auf jede Differenzierung zwischen Athleten", false],
  ["Ein reiner Verwaltungsbegriff ohne Trainingsbezug", false],
  ["Training nur in großen Gruppen ohne Einzelbetreuung", false]
], "Individuelle und kollektive Ausbildung bedeutet, sowohl persönliche Leistungsvoraussetzungen als auch das Zusammenspiel in der Gruppe/Mannschaft zu berücksichtigen."),

mc("Welche drei Aussagen zur Bedeutung von Zufriedenheit der Teilnehmer sind zutreffend?", [
  ["Zufriedene Teilnehmer empfehlen das Angebot eher weiter.", true],
  ["Dies kann rückläufigen Mitgliederzahlen entgegenwirken.", true],
  ["Ein 'gutes Training' sieht je nach Zielgruppe unterschiedlich aus.", true],
  ["Zufriedenheit ist für die Vereinsentwicklung bedeutungslos.", false],
  ["Es existiert eine einzige, universelle Definition von gutem Training.", false]
], "Zufriedene Teilnehmer wirken als Multiplikatoren gegen sinkende Mitgliederzahlen; 'gutes Training' ist zielgruppenabhängig, nicht universell definiert."),

mc("Welche Aussage zur wissenschaftlichen Fundierung als Trainingsmerkmal ist korrekt?", [
  ["Sie kann sich auch auf Gesundheitsaspekte statt reine Leistungssteigerung beziehen.", true],
  ["Sie ist ausschließlich im Leistungssport relevant.", false],
  ["Verletzungsprophylaxe kann darunterfallen.", true],
  ["Sie bedeutet, jegliches Erfahrungswissen zu ignorieren.", false],
  ["Sie schließt Systematik grundsätzlich aus.", false]
], "Wissenschaftliche Fundierung heißt, Training an Erkenntnisse der Trainingswissenschaft anzupassen – das kann Gesundheit/Prävention einschließen und gilt auch im Breitensport."),

mc("Was unterscheidet laut Hohmann, Lames & Letzelter (2020) sportliches Training grundlegend?", [
  ["Es ist eine planmäßige, systematische Realisation von Maßnahmen im und durch Sport.", true],
  ["Es ist ein zufälliges Zusammentreffen von Übungen ohne Struktur.", false],
  ["Es hat immer denselben Trainingsinhalt unabhängig vom Ziel.", false],
  ["Es dient ausschließlich der Unterhaltung.", false],
  ["Es erfordert keinerlei Methodenwahl.", false]
], "Diese Definition betont Planmäßigkeit und Systematik der Maßnahmen (Inhalte, Methoden) zur nachhaltigen Zielerreichung – kein Zufall, keine Beliebigkeit."),

mc("Welche zwei Aussagen zum Ehrenamt im Breitensport sind zutreffend?", [
  ["Es ist einer der wichtigsten Faktoren für ein breites Sportangebot.", true],
  ["Viele Vereine könnten ohne ehrenamtliches Engagement nicht bestehen.", true],
  ["Das ehrenamtliche Engagement nimmt seit Jahren deutlich zu.", false],
  ["Ehrenamt betrifft ausschließlich bezahlte Trainer.", false],
  ["Es hat keinen Einfluss auf das Vereinsangebot.", false]
], "Ehrenamt trägt den Vereinssport wesentlich, ist aber eher rückläufig – es betrifft unbezahlte, freiwillige Mitwirkende, nicht bezahlte Trainer."),

mc("Ein Verein legt mehrere Trainingsgruppen wegen Trainermangels zusammen, was zu weiteren Anfahrtswegen für Kinder führt. Wie nennt das Skript diesen Effekt?", [
  ["Einen sich selbst verstärkenden Teufelskreis", true],
  ["Superkompensation", false],
  ["Positive Rückkopplung im Sinne von Leistungssteigerung", false],
  ["Reizstufenregel", false],
  ["Periodisierung", false]
], "Das Skript beschreibt genau diesen Mechanismus (weniger Helfer → Zusammenlegung → schlechtere Erreichbarkeit → weniger Teilnehmer) als 'Teufelskreis'."),

mc("Welche drei Aussagen zur Vielfalt der Zielgruppen im Breitensport sind zutreffend?", [
  ["Unterschiedliche Gruppen haben unterschiedliche Erwartungen an das Training.", true],
  ["Viele leistungssportliche Prinzipien lassen sich nur bedingt übertragen.", true],
  ["Ein Trainer sollte sein Wissen flexibel anpassen können.", true],
  ["Alle Zielgruppen erwarten identische Trainingsinhalte.", false],
  ["Zielgruppenvielfalt spielt für die Trainergestaltung keine Rolle.", false]
], "Die Vielfalt der Motive erfordert Anpassungsfähigkeit des Trainers – identische Erwartungen oder Irrelevanz der Zielgruppe widersprechen dem."),

mc("Was bedeutet 'Training als Anpassungsprozess' (eine der vier Trainingsebenen)?", [
  ["Der Organismus reagiert mit strukturellen/funktionellen Veränderungen auf Belastungsreize.", true],
  ["Das Training bleibt über die Zeit völlig unverändert.", false],
  ["Nur psychologische Aspekte werden berücksichtigt.", false],
  ["Es beschreibt ausschließlich die Wettkampfvorbereitung.", false],
  ["Anpassung erfolgt unabhängig von jeglichem Reiz.", false]
], "Anpassungsprozess meint die physiologische Reaktion des Körpers auf Trainingsreize – nicht Stillstand oder rein psychologische Aspekte."),

mc("Welche zwei Aussagen zur Definition von Breitensport (Röthig et al.) sind korrekt?", [
  ["Breitensport ist dem übergeordneten Freizeitsport untergeordnet.", true],
  ["Er soll ein Sport- und Bewegungsangebot für die gesamte Bevölkerung darstellen.", true],
  ["Er ist stets identisch mit Leistungssport.", false],
  ["Er schließt Wettkampfteilnahme grundsätzlich aus.", false],
  ["Er ist nur für Kinder konzipiert.", false]
], "Breitensport ist dem Freizeitsport untergeordnet und für die breite Bevölkerung gedacht – er kann Wettkämpfe einschließen und ist nicht altersbeschränkt."),

mc("Welche Aussage zur Rolle eines Trainers bei heterogenen Trainingsgruppen ist zutreffend?", [
  ["Ein einheitliches Training kann zu Über- oder Unterforderung führen.", true],
  ["Heterogenität spielt im Breitensport praktisch keine Rolle.", false],
  ["Alternative Übungsvarianten können individuelle Anpassung ermöglichen.", true],
  ["Individuelle Unterschiede sind bei Kindern zu vernachlässigen.", false],
  ["Ein Trainer sollte identische Vorgaben für alle machen, unabhängig vom Niveau.", false]
], "Heterogene Gruppen erfordern Übungsvarianten zur individuellen Anpassung – ein starres, einheitliches Training führt sonst zu Über-/Unterforderung."),

mc("Welche Aussage zur Systematik als Trainingsmerkmal ist korrekt?", [
  ["Trainingsabschnitte sollten regelmäßig kontrolliert und angepasst werden.", true],
  ["Systematik ist im Breitensport zwingend im gleichen Maß wie im Leistungssport nötig.", false],
  ["Systematik ist für den Trainingserfolg grundsätzlich förderlich.", true],
  ["Systematik bedeutet vollständigen Verzicht auf Flexibilität.", false],
  ["Systematik betrifft nur die Trainingsdauer.", false]
], "Systematik heißt regelmäßige Kontrolle und Anpassung – im Breitensport weniger streng nötig als im Leistungssport, aber grundsätzlich hilfreich."),

mc("Welche Aussage zur Definition sportlichen Trainings ist über alle drei zitierten Autoren hinweg gemeinsam?", [
  ["Alle betonen einen planmäßigen bzw. systematischen Charakter des Trainings.", true],
  ["Alle definieren Training ausschließlich medizinisch.", false],
  ["Alle schließen eine Zielorientierung aus.", false],
  ["Alle beziehen sich ausschließlich auf den Leistungssport.", false],
  ["Alle verneinen jede Form von Anpassung.", false]
], "Röthig, Weineck sowie Hohmann/Lames/Letzelter betonen trotz unterschiedlicher Perspektiven alle den planmäßig-systematischen Charakter von Training."),

mc("Welche zwei Aussagen zur Trainingsübung als Trainingsmerkmal sind zutreffend?", [
  ["Trainingsübungen sind das Hauptmittel zur Zielerreichung.", true],

QUESTIONS.anatomie.chapters.push({ id:"a8", label:"Kapitel 8 – Biomechanik", startPage: 170, items: [

  ["Dynamik", true],

  ["Thermodynamik", false],

  ["Der Energiebedarf ist bei jedem Trainingsumfang exakt identisch.", false]

  ["Sie baut auf den allgemeinen Ernährungsgrundlagen aus Kapitel 1 auf.", true],
  ["Sie berücksichtigt Trainings- und Wettkampfphasen unterschiedlich.", true],
  ["Kohlenhydrat-, Flüssigkeits- und Elektrolytmanagement sind zentrale Bausteine.", true],
  ["NEM können eine sinnvolle Ergänzung darstellen, sind aber nicht zwingend.", true],

], "Sporternährung baut auf den Grundlagen auf, ist phasenabhängig gestaltet und zentral von Kohlenhydraten/Flüssigkeit/Elektrolyten geprägt – kein starres, unveränderliches Regelwerk."),

  ["Kapitel 1 vermittelt allgemeine Ernährungsprinzipien, Kapitel 2 wendet sie sportspezifisch an.", true],
  ["Beide Kapitel behandeln exakt identische Inhalte ohne jede Weiterentwicklung.", false],
  ["Kapitel 2 ersetzt vollständig die Inhalte aus Kapitel 1.", false],
  ["Kapitel 1 und 2 stehen in keinerlei inhaltlichem Zusammenhang.", false],
  ["Nur Kapitel 1 hat einen praktischen Bezug zum Sport.", false]

]});

</script>
<script>
/* ============ STATE ============ */
let state = {
  screen: "start",
  openScripts: { breitensport:true, anatomie:false, ernaehrung:false },
  selectedChapters: new Set(), // keys like "breitensport::b1"
  numQuestions: 20,
  feedbackMode: "immediate", // "immediate" | "end"
  timerMode: "perQuestion", // "perQuestion" | "total"
  secondsPerQuestion: 60,
  totalMinutes: 20,
  totalSeconds: 1200,
  quiz: [],
  index: 0,
  totalPoints: 0,
  maxPoints: 0,
  answers: [],
  timeLeft: 0,
  timerId: null,
  answered: false,
  currentSelection: new Set(),
  expandedReview: new Set(),
  historyList: [],
  historyDetailIndex: null,
  savedThisSession: false
};

// preselect all chapters by default
Object.keys(QUESTIONS).forEach(sk => {
  QUESTIONS[sk].chapters.forEach(ch => state.selectedChapters.add(sk+"::"+ch.id));
});

/* ============ STORAGE (history persists in this browser via localStorage) ============ */
const HISTORY_KEY = "aos_pruefungstrainer_history_v1";
let memoryHistoryFallback = [];
let storageAvailable = true;
try {
  const testKey = "__aos_test__";
  window.localStorage.setItem(testKey, "1");
  window.localStorage.removeItem(testKey);
} catch(e) {
  storageAvailable = false;
}

function loadHistory(){
  if(!storageAvailable) return memoryHistoryFallback.slice();
  try {
    const raw = window.localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) {
    return [];
  }
}

function saveHistorySession(session){
  const list = loadHistory();
  list.unshift(session);
  if(!storageAvailable){
    memoryHistoryFallback = list;
    return;
  }
  try {
    window.localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch(e) {
    // storage full or unavailable; ignore silently, session still shown for this run
    memoryHistoryFallback = list;
  }
}

/* Question usage tracking: lets repeated tests favor questions not seen recently,
   so the same subset doesn't keep reappearing when a chapter's pool is small. */
const USAGE_KEY = "aos_pruefungstrainer_usage_v1";
let memoryUsageFallback = {};

function loadUsageMap(){
  if(!storageAvailable) return {...memoryUsageFallback};
  try {
    const raw = window.localStorage.getItem(USAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) {
    return {};
  }
}

function saveUsageMap(map){
  if(!storageAvailable){
    memoryUsageFallback = map;
    return;
  }
  try {
    window.localStorage.setItem(USAGE_KEY, JSON.stringify(map));
  } catch(e) {
    memoryUsageFallback = map;
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function allChapterKeys(){
  const keys = [];
  Object.keys(QUESTIONS).forEach(sk=>{
    QUESTIONS[sk].chapters.forEach(ch=>keys.push(sk+"::"+ch.id));
  });
  return keys;
}

function buildQuiz(){
  let pool = [];
  Object.keys(QUESTIONS).forEach(sk=>{
    QUESTIONS[sk].chapters.forEach(ch=>{
      const key = sk+"::"+ch.id;
      if(state.selectedChapters.has(key)){
        ch.items.forEach(item=>pool.push({
          ...item,
          topic:ch.label,
          script:QUESTIONS[sk].label,
          startPage: ch.startPage,
          _key: sk+"::"+ch.id+"::"+item.stem
        }));
      }
    });
  });

  // Shuffle first so items with equal (or no) usage history end up in random order,
  // then stable-sort by last-used timestamp ascending (never-used / longest-ago first).
  pool = shuffle(pool);
  const usageMap = loadUsageMap();
  pool.forEach(item => { item._lastUsed = usageMap[item._key] || 0; });
  pool.sort((a,b) => a._lastUsed - b._lastUsed);

  const n = Math.min(state.numQuestions, pool.length);
  let selected = pool.slice(0, n);
  selected = shuffle(selected); // randomize presentation order after freshness-based selection

  state.quiz = selected.map(item=>{
    const opts = item.options.map(o=>({text:o.text, correct:o.correct}));
    const shuffledOpts = shuffle(opts);
    return {
      topic:item.topic, script:item.script, startPage:item.startPage,
      stem:item.stem, explain:item.explain,
      options: shuffledOpts,
      _key: item._key
    };
  });
  state.index=0; state.totalPoints=0; state.maxPoints=state.quiz.length*10; state.answers=[];
  state.savedThisSession = false;
  state.answered = false;
  state.currentSelection = new Set();
}

function markQuizQuestionsAsUsed(){
  const usageMap = loadUsageMap();
  const now = Date.now();
  state.quiz.forEach(q => { usageMap[q._key] = now; });
  saveUsageMap(usageMap);
}

function startQuiz(){
  if(state.selectedChapters.size===0){ alert("Bitte mindestens ein Kapitel auswählen."); return; }
  buildQuiz();
  if(state.quiz.length===0){ alert("Keine Fragen für diese Auswahl gefunden."); return; }
  state.screen="quiz";
  if(state.timerMode === "total"){
    state.totalSeconds = state.totalMinutes * 60;
    state.timeLeft = state.totalSeconds;
    state.answered = false;
    state.currentSelection = new Set();
    render();
    startGlobalTimer();
  } else {
    render();
    startTimerForCurrent();
  }
}

// Per-question timer: resets fresh for every question.
function startTimerForCurrent(){
  clearInterval(state.timerId);
  state.answered=false;
  state.currentSelection = new Set();
  state.timeLeft = state.secondsPerQuestion;
  render();
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){
      clearInterval(state.timerId);
      if(!state.answered) submitAnswer(true);
    } else {
      updateTimerUI();
    }
  },1000);
}

// Total-quiz timer: runs continuously across all questions, never resets.
function startGlobalTimer(){
  clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){
      clearInterval(state.timerId);
      onGlobalTimeUp();
    } else {
      updateTimerUI();
    }
  },1000);
}

function onGlobalTimeUp(){
  if(!state.answered){
    recordCurrentAnswer(true);
  }
  fillRemainingAsUnanswered();
  finishQuiz();
}

function fillRemainingAsUnanswered(){
  for(let i = state.index+1; i < state.quiz.length; i++){
    const q = state.quiz[i];
    const correctSet = q.options.map((o,idx)=>o.correct?idx:null).filter(v=>v!==null);
    state.answers.push({
      stem:q.stem, options:q.options, chosen:[], correctSet,
      points:0, timedOut:true, script:q.script, topic:q.topic, startPage:q.startPage, explain:q.explain
    });
  }
}

function updateTimerUI(){
  const bar = document.getElementById("timerbar");
  const clock = document.getElementById("clock");
  if(!bar||!clock) return;
  const denom = state.timerMode === "total" ? state.totalSeconds : state.secondsPerQuestion;
  const pct = denom>0 ? Math.max(0,(state.timeLeft/denom)*100) : 0;
  bar.style.width = pct+"%";
  clock.textContent = formatClockTime(state.timeLeft);
  const critThresh = state.timerMode === "total" ? Math.max(15, Math.round(denom*0.05)) : 10;
  const warnThresh = state.timerMode === "total" ? Math.max(45, Math.round(denom*0.15)) : 20;
  clock.className="clock"+(state.timeLeft<=critThresh?" crit":state.timeLeft<=warnThresh?" warn":"");
  if(pct<30) bar.style.background="var(--bad)";
  else if(pct<60) bar.style.background="var(--accent2)";
  else bar.style.background="var(--accent)";
}

function formatClockTime(sec){
  sec = Math.max(0, sec);
  if(sec < 60) return sec+"s";
  const m = Math.floor(sec/60), s = sec%60;
  return m+":"+String(s).padStart(2,"0");
}

function toggleOption(i){
  if(state.answered) return;
  if(state.currentSelection.has(i)) state.currentSelection.delete(i);
  else state.currentSelection.add(i);
  render();
}

// Computes and stores the answer record for the current question; returns the record.
function recordCurrentAnswer(timedOut){
  state.answered = true;
  const cur = state.quiz[state.index];
  const correctSet = new Set(cur.options.map((o,i)=>o.correct?i:null).filter(v=>v!==null));
  const chosenSet = new Set(state.currentSelection);
  let exact = correctSet.size === chosenSet.size && [...correctSet].every(i=>chosenSet.has(i));
  const points = exact ? 10 : 0;
  state.totalPoints += points;
  const record = {
    stem: cur.stem, options: cur.options, chosen: [...chosenSet], correctSet:[...correctSet],
    points, timedOut: !!timedOut,
    script: cur.script, topic: cur.topic, startPage: cur.startPage, explain: cur.explain
  };
  state.answers.push(record);
  return record;
}

function submitAnswer(timedOut){
  if(state.answered) return;
  if(state.timerMode === "perQuestion") clearInterval(state.timerId);
  recordCurrentAnswer(timedOut);
  if(state.feedbackMode === "end"){
    // No reveal step: move straight on (to next question or the final result).
    nextQuestion();
  } else {
    render();
  }
}

function nextQuestion(){
  if(state.index < state.quiz.length-1){
    state.index++;
    if(state.timerMode === "perQuestion"){
      startTimerForCurrent();
    } else {
      state.answered = false;
      state.currentSelection = new Set();
      render();
    }
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  clearInterval(state.timerId);
  state.screen="result";
  state.expandedReview = new Set();
  if(!state.savedThisSession){
    state.savedThisSession = true;
    markQuizQuestionsAsUsed();
    const chapterLabels = [...state.selectedChapters].map(k=>{
      const [sk,chId] = k.split("::");
      const ch = QUESTIONS[sk].chapters.find(c=>c.id===chId);
      return ch ? (QUESTIONS[sk].label + " – " + ch.label) : k;
    });
    saveHistorySession({
      date: new Date().toISOString(),
      totalPoints: state.totalPoints,
      maxPoints: state.maxPoints,
      numQuestions: state.quiz.length,
      chapterCount: state.selectedChapters.size,
      chapterLabels,
      answers: state.answers
    });
  }
  render();
}

function restart(){
  clearInterval(state.timerId);
  state.screen="start";
  render();
}

function goHistory(){
  clearInterval(state.timerId);
  state.historyList = loadHistory();
  state.historyDetailIndex = null;
  state.expandedReview = new Set();
  state.screen = "history";
  render();
}

function openHistoryDetail(idx){
  state.historyDetailIndex = idx;
  state.expandedReview = new Set();
  state.screen = "historyDetail";
  render();
}

function backToHistoryList(){
  state.screen = "history";
  render();
}

function toggleReviewExpand(idx){
  if(state.expandedReview.has(idx)) state.expandedReview.delete(idx);
  else state.expandedReview.add(idx);
  render();
}

/* ============ SELECTION HELPERS ============ */
function toggleScriptOpen(sk){
  state.openScripts[sk] = !state.openScripts[sk];
  render();
}
function toggleChapter(sk, chId){
  const key = sk+"::"+chId;
  if(state.selectedChapters.has(key)) state.selectedChapters.delete(key);
  else state.selectedChapters.add(key);
  render();
}
function toggleWholeScript(sk){
  const chKeys = QUESTIONS[sk].chapters.map(ch=>sk+"::"+ch.id);
  const allSelected = chKeys.every(k=>state.selectedChapters.has(k));
  chKeys.forEach(k=>{
    if(allSelected) state.selectedChapters.delete(k);
    else state.selectedChapters.add(k);
  });
  render();
}
function selectAllThree(){
  allChapterKeys().forEach(k=>state.selectedChapters.add(k));
  render();
}
function selectNone(){
  state.selectedChapters.clear();
  render();
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById("app");
  if(state.screen==="start") app.innerHTML = renderStart();
  else if(state.screen==="quiz") app.innerHTML = renderQuiz();
  else if(state.screen==="result") app.innerHTML = renderResult();
  else if(state.screen==="history") app.innerHTML = renderHistory();
  else if(state.screen==="historyDetail") app.innerHTML = renderHistoryDetail();
  attachHandlers();
  if(state.screen==="quiz") updateTimerUI();
}

function renderStart(){
  const scriptsHtml = Object.keys(QUESTIONS).map(sk=>{
    const s = QUESTIONS[sk];
    const chKeys = s.chapters.map(ch=>sk+"::"+ch.id);
    const selectedCount = chKeys.filter(k=>state.selectedChapters.has(k)).length;
    const allSelected = selectedCount === chKeys.length;
    const isOpen = state.openScripts[sk];
    const chaptersHtml = s.chapters.map(ch=>{
      const key = sk+"::"+ch.id;
      const checked = state.selectedChapters.has(key) ? "checked" : "";
      return `<div class="chapter-row">
        <input type="checkbox" ${checked} data-chapter="${sk}|${ch.id}">
        <label>${ch.label}</label>
        <small>${ch.items.length}</small>
      </div>`;
    }).join("");
    return `<div class="script-block">
      <div class="script-head" data-toggle-script="${sk}">
        <div class="left">
          <input type="checkbox" ${allSelected?"checked":""} data-whole-script="${sk}" onclick="event.stopPropagation()">
          <div><b>${s.label}</b><small>${selectedCount}/${chKeys.length} Kapitel ausgewählt</small></div>
        </div>
        <span class="chev ${isOpen?'open':''}">▶</span>
      </div>
      <div class="chapter-list ${isOpen?'open':''}">${chaptersHtml}</div>
    </div>`;
  }).join("");

  const totalSelected = state.selectedChapters.size;
  const totalAvailable = allChapterKeys().length;

  return `
    <div class="brand"><h1>AoS Prüfungstrainer</h1><span class="tag">Zeit-Modus</span></div>
    <div class="card">
      <h2>Themen wählen</h2>
      <p class="lead">Wähle einzelne Kapitel, ganze Skripte oder alle drei zusammen.</p>
      <div class="quick-actions">
        <button class="chip" id="allBtn">Alle 3 Skripte</button>
        <button class="chip" id="noneBtn">Auswahl leeren</button>
      </div>
      <div style="margin-top:14px;">${scriptsHtml}</div>
      <div class="selcount">${totalSelected}/${totalAvailable} Kapitel ausgewählt</div>
      <div class="row" style="margin-top:14px;">
        <div>
          <label class="small">Anzahl Fragen</label>
          <select id="numQ">
            ${[10,15,20,30,50,100].map(n=>`<option value="${n}" ${n===state.numQuestions?"selected":""}>${n}</option>`).join("")}
          </select>
        </div>
        <div>
          <label class="small">Rückmeldung</label>
          <select id="feedbackMode">
            <option value="immediate" ${state.feedbackMode==="immediate"?"selected":""}>Direkt nach jeder Frage</option>
            <option value="end" ${state.feedbackMode==="end"?"selected":""}>Erst am Ende</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:14px;">
        <div>
          <label class="small">Zeitmodus</label>
          <select id="timerMode">
            <option value="perQuestion" ${state.timerMode==="perQuestion"?"selected":""}>Pro Frage</option>
            <option value="total" ${state.timerMode==="total"?"selected":""}>Für den ganzen Test</option>
          </select>
        </div>
        <div id="timeControlWrap">
          ${state.timerMode==="total" ? `
            <label class="small">Minuten für den Test</label>
            <select id="totalMin">
              ${[5,10,15,20,30,45,60,90].map(n=>`<option value="${n}" ${n===state.totalMinutes?"selected":""}>${n} min</option>`).join("")}
            </select>
          ` : `
            <label class="small">Sekunden pro Frage</label>
            <select id="secQ">
              ${[30,45,60,90,120].map(n=>`<option value="${n}" ${n===state.secondsPerQuestion?"selected":""}>${n}s</option>`).join("")}
            </select>
          `}
        </div>
      </div>
      <button class="primary" id="startBtn">Test starten</button>
      <button class="secondary" id="historyBtn">Verlauf ansehen</button>
    </div>
    <footer class="note">Fragen basieren auf den Selbstüberprüfungsaufgaben, Glossaren und Kerninhalten der drei Lehrskripte (br17, fit28, se83). Jede Frage hat 5 Antwortoptionen (0–5 davon können richtig sein); volle 10 Punkte gibt es nur bei komplett korrekter Auswahl. Kein offizielles Prüfungsmaterial der Academy of Sports. Der Verlauf wird lokal in diesem Browser gespeichert.</footer>
  `;
}

function renderQuiz(){
  const cur = state.quiz[state.index];
  const total = state.quiz.length;
  const answered = state.answered;
  const lastAnswer = answered ? state.answers[state.answers.length-1] : null;

  const optsHtml = cur.options.map((opt,i)=>{
    let cls="opt";
    const isChosen = state.currentSelection.has(i);
    if(answered){
      const wasChosen = lastAnswer.chosen.includes(i);
      const isCorrect = opt.correct;
      if(isCorrect && wasChosen) cls+=" correct";
      else if(isCorrect && !wasChosen) cls+=" missed";
      else if(!isCorrect && wasChosen) cls+=" wrong";
      cls+=" disabled";
    }
    return `<div class="${cls}" data-opt="${i}">
      <input type="checkbox" ${isChosen?"checked":""} ${answered?"disabled":""} data-opt-cb="${i}">
      <span>${opt.text}</span>
    </div>`;
  }).join("");

  let explainHtml = "";
  if(answered){
    const cls = lastAnswer.points===10 ? "full" : "zero";
    const label = lastAnswer.timedOut ? "Zeit abgelaufen" : (lastAnswer.points===10 ? "Volle Punktzahl!" : "Nicht alle Bewertungen korrekt");
    explainHtml = `<div class="explain"><b class="points ${cls}">${label} — ${lastAnswer.points}/10 Punkte</b><br>${cur.explain}
      <div class="source-tag">📖 Nachzulesen: ${cur.script} – ${cur.topic} (ab Seite ${cur.startPage})</div>
    </div>`;
  }

  const submitBtn = !answered ? `<button class="primary" id="submitBtn">Antwort abgeben</button>` : "";
  const nextBtn = answered ? `<button class="primary" id="nextBtn">${state.index<total-1?"Nächste Frage":"Ergebnis anzeigen"}</button>` : "";

  return `
    <div class="topbar">
      <span>Frage ${state.index+1} / ${total} · ${cur.topic}</span>
      <span class="clock" id="clock">${formatClockTime(state.timeLeft)}</span>
    </div>
    <div class="timerbar-wrap"><div class="timerbar" id="timerbar"></div></div>
    <div class="card">
      <div class="qtag">${cur.script}</div>
      <div class="qtext">${cur.stem}</div>
      <div class="qhint">Wähle alle zutreffenden Aussagen aus (0–5 können richtig sein). Volle Punktzahl nur bei komplett korrekter Auswahl.</div>
      ${optsHtml}
      ${explainHtml}
      ${submitBtn}
      ${nextBtn}
    </div>
  `;
}

function renderAnswerReviewItem(a, idx){
  const cls = a.points===10?'ok':'no';
  const dotCls = a.points===10?'ok':'no';
  const label = a.points===10 ? `Richtig · ${a.points}/10 Punkte` : `Falsch · ${a.points}/10 Punkte`;
  const isOpen = state.expandedReview.has(idx);
  const optsHtml = a.options.map((opt,i)=>{
    const isCorrect = a.correctSet.includes(i);
    const wasChosen = a.chosen.includes(i);
    let ocls = "review-opt neutral";
    let mark = "";
    if(isCorrect && wasChosen){ ocls="review-opt correct"; mark="✓"; }
    else if(isCorrect && !wasChosen){ ocls="review-opt missed"; mark="✓"; }
    else if(!isCorrect && wasChosen){ ocls="review-opt wrong"; mark="✗"; }
    return `<div class="${ocls}"><span class="mark">${mark}</span><span>${opt.text}</span></div>`;
  }).join("");
  return `<div class="review-item">
    <div class="review-head" data-review-toggle="${idx}">
      <span class="dot ${dotCls}"></span>
      <div class="body">
        <div class="q">${a.stem}</div>
        <div class="a ${cls}">${label}${a.timedOut?" · Zeit abgelaufen":""}</div>
      </div>
    </div>
    <div class="review-detail ${isOpen?'open':''}">
      ${optsHtml}
      <div class="source-tag">📖 Nachzulesen: ${a.script} – ${a.topic} (ab Seite ${a.startPage})</div>
      <div class="explain" style="margin-top:10px;">${a.explain}</div>
    </div>
  </div>`;
}

function renderResult(){
  const total = state.quiz.length;
  const pct = state.maxPoints>0 ? Math.round((state.totalPoints/state.maxPoints)*100) : 0;
  const reviewHtml = state.answers.map((a,idx)=>renderAnswerReviewItem(a,idx)).join("");

  return `
    <div class="brand"><h1>AoS Prüfungstrainer</h1><span class="tag">Ergebnis</span></div>
    <div class="card scorewrap">
      <div class="big">${state.totalPoints} / ${state.maxPoints}</div>
      <div class="of">${pct}% Punkte · ${total} Fragen</div>
    </div>
    <div class="card">
      <button class="primary" id="restartBtn">Neuer Test</button>
      <button class="secondary" id="historyBtn">Verlauf ansehen</button>
    </div>
    <div class="card review">
      <h2>Auswertung (tippen zum Aufklappen)</h2>
      ${reviewHtml}
    </div>
  `;
}

function renderHistory(){
  const list = state.historyList;
  const itemsHtml = list.length ? list.map((s,idx)=>{
    const pct = s.maxPoints>0 ? Math.round((s.totalPoints/s.maxPoints)*100) : 0;
    const d = new Date(s.date);
    const dateStr = d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"}) + " · " + d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
    return `<div class="history-item" data-history-open="${idx}">
      <div class="left">
        <b>${dateStr}</b>
        <small>${s.numQuestions} Fragen · ${s.chapterCount} Kapitel</small>
      </div>
      <div class="score">${pct}%</div>
    </div>`;
  }).join("") : `<div class="history-empty">Noch keine Tests absolviert.</div>`;

  return `
    <div class="brand"><h1>AoS Prüfungstrainer</h1><span class="tag">Verlauf</span></div>
    <div class="card">
      <span class="backlink" id="backToStartBtn">← Zurück zum Start</span>
      <h2>Bisherige Tests</h2>
      <p class="lead">Alle Ergebnisse werden lokal in diesem Browser gespeichert.</p>
      ${itemsHtml}
    </div>
  `;
}

function renderHistoryDetail(){
  const s = state.historyList[state.historyDetailIndex];
  if(!s) return renderHistory();
  const pct = s.maxPoints>0 ? Math.round((s.totalPoints/s.maxPoints)*100) : 0;
  const d = new Date(s.date);
  const dateStr = d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"}) + " · " + d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
  const reviewHtml = s.answers.map((a,idx)=>renderAnswerReviewItem(a,idx)).join("");

  return `
    <div class="brand"><h1>AoS Prüfungstrainer</h1><span class="tag">Verlauf</span></div>
    <div class="card">
      <span class="backlink" id="backToHistoryBtn">← Zurück zum Verlauf</span>
      <h2>Test vom ${dateStr}</h2>
      <p class="lead">${s.chapterLabels.join(", ")}</p>
      <div class="scorewrap">
        <div class="big">${s.totalPoints} / ${s.maxPoints}</div>
        <div class="of">${pct}% Punkte · ${s.numQuestions} Fragen</div>
      </div>
    </div>
    <div class="card review">
      <h2>Auswertung (tippen zum Aufklappen)</h2>
      ${reviewHtml}
    </div>
  `;
}

/* ============ HANDLERS ============ */
function attachHandlers(){
  const startBtn = document.getElementById("startBtn");
  if(startBtn){
    document.querySelectorAll("[data-toggle-script]").forEach(el=>{
      el.addEventListener("click", ()=>toggleScriptOpen(el.getAttribute("data-toggle-script")));
    });
    document.querySelectorAll("[data-whole-script]").forEach(cb=>{
      cb.addEventListener("change", ()=>toggleWholeScript(cb.getAttribute("data-whole-script")));
    });
    document.querySelectorAll("[data-chapter]").forEach(cb=>{
      cb.addEventListener("click", (e)=>{
        e.stopPropagation();
        const [sk,chId] = cb.getAttribute("data-chapter").split("|");
        toggleChapter(sk, chId);
      });
    });
    document.getElementById("allBtn").addEventListener("click", selectAllThree);
    document.getElementById("noneBtn").addEventListener("click", selectNone);
    document.getElementById("numQ").addEventListener("change",e=>state.numQuestions=parseInt(e.target.value));
    document.getElementById("feedbackMode").addEventListener("change",e=>state.feedbackMode=e.target.value);
    document.getElementById("timerMode").addEventListener("change",e=>{
      state.timerMode = e.target.value;
      render(); // swap between "seconds per question" and "minutes total" control
    });
    const secQEl = document.getElementById("secQ");
    if(secQEl) secQEl.addEventListener("change",e=>state.secondsPerQuestion=parseInt(e.target.value));
    const totalMinEl = document.getElementById("totalMin");
    if(totalMinEl) totalMinEl.addEventListener("change",e=>state.totalMinutes=parseInt(e.target.value));
    startBtn.addEventListener("click", startQuiz);
  }
  document.querySelectorAll("[data-opt-cb]").forEach(cb=>{
    cb.addEventListener("change", e=>toggleOption(parseInt(e.target.getAttribute("data-opt-cb"))));
  });
  document.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.tagName.toLowerCase()==="input") return;
      if(state.answered) return;
      toggleOption(parseInt(el.getAttribute("data-opt")));
    });
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn) submitBtn.addEventListener("click", ()=>submitAnswer(false));
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", nextQuestion);
  const restartBtn = document.getElementById("restartBtn");
  if(restartBtn) restartBtn.addEventListener("click", restart);
  const historyBtn = document.getElementById("historyBtn");
  if(historyBtn) historyBtn.addEventListener("click", goHistory);
  const backToStartBtn = document.getElementById("backToStartBtn");
  if(backToStartBtn) backToStartBtn.addEventListener("click", restart);
  const backToHistoryBtn = document.getElementById("backToHistoryBtn");
  if(backToHistoryBtn) backToHistoryBtn.addEventListener("click", backToHistoryList);
  document.querySelectorAll("[data-history-open]").forEach(el=>{
    el.addEventListener("click", ()=>openHistoryDetail(parseInt(el.getAttribute("data-history-open"))));
  });
  document.querySelectorAll("[data-review-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>toggleReviewExpand(parseInt(el.getAttribute("data-review-toggle"))));
  });
}

render();
</script>
</body>
</html>
