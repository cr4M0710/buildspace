<style>

<body>
<div id="app"></div>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* ============================================================
   Klecks-Wache – Hilfsfunktionen
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const rnd = (x, d = 4) => { const f = Math.pow(10, d); return Math.round(x * f) / f; };
const NNBSP = '\u202f', NBSP = '\u00a0';

/* Zahl im deutschen Format (Komma, schmales Leerzeichen als Tausendertrenner) */
function fmt(x, d = 2, fixed = false) {
  x = rnd(x, d);
  let s = fixed ? x.toFixed(d) : String(x);
  if (/e/i.test(s)) s = x.toFixed(d);
  const neg = s[0] === '-'; if (neg) s = s.slice(1);
  let [i, f] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP);
  return (neg ? '\u2212' : '') + (f ? i + ',' + f : i);
}
const euro = x => (Number.isInteger(rnd(x, 2)) ? fmt(x) : fmt(x, 2, true)) + NBSP + '€';
const pc = p => fmt(p) + NBSP + '%';
function fv(x, u) {
  if (u === '€') return euro(x);
  if (u === '%') return pc(x);
  if (!u) return fmt(x);
  return fmt(x) + NBSP + u;
}
/* Eingabe der Lernenden in eine Zahl umwandeln (Komma oder Punkt) */
function parseNum(s) {
  s = String(s == null ? '' : s).trim().replace(/[\s\u202f\u00a0€%]/g, '').replace(/[A-Za-zäöüÄÖÜß]+$/, '').replace(/\u2212/g, '-');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const isNice = (v, d = 2) => Math.abs(v * Math.pow(10, d) - Math.round(v * Math.pow(10, d))) < 1e-7;
const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

/* ---------- Ton (WebAudio, keine Audiodateien) ---------- */
const Snd = {
  ctx: null, on: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { }
  },
  tone(f, d, type = 'sine', v = 0.12, when = 0, slide = 0) {
    if (!this.on || !this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      if (slide) o.frequency.linearRampToValueAtTime(f + slide, t0 + d);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + 0.05);
    } catch (e) { }
  },
  ok() { this.tone(660, .12, 'triangle'); this.tone(880, .18, 'triangle', .12, .1); },
  no() { this.tone(200, .22, 'sawtooth', .07, 0, -60); },
  shot() { this.tone(900 + Math.random() * 300, .09, 'square', .05, 0, -500); },
  pop() { this.tone(300, .12, 'sine', .14, 0, -150); this.tone(520, .08, 'triangle', .07, .03); },
  hurt() { this.tone(150, .3, 'sawtooth', .1, 0, -70); },
  build() { [392, 523, 659].forEach((f, i) => this.tone(f, .14, 'triangle', .1, i * .09)); },
  tick() { this.tone(1000, .04, 'square', .03); },
  fan() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'triangle', .12, i * .13)); },
  start() { [330, 440, 550].forEach((f, i) => this.tone(f, .12, 'square', .06, i * .08)); }
};

/* ---------- Bildschirm wach halten ---------- */
const Wake = {
  lock: null,
  async on() {
    try { if ('wakeLock' in navigator) { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener && this.lock.addEventListener('release', () => { this.lock = null; }); } } catch (e) { }
  }
};
if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Wake.want) Wake.on(); });

const REDUCED = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Figuren (selbst gezeichnete SVG-Gesichter) ---------- */
const AVS = [
  ['Fuchs', '#f08a24', 'point', 'snout'], ['Katze', '#9aa3ad', 'point', 'whisk'], ['Bär', '#8a5a3c', 'round', 'snout'],
  ['Hase', '#ece6dc', 'long', 'nose'], ['Pinguin', '#34446a', 'none', 'beak'], ['Eule', '#c08f5f', 'tuft', 'beak'],
  ['Frosch', '#62c455', 'eyes', 'none'], ['Roboter', '#a9bdd0', 'antenna', 'grid'], ['Einhorn', '#f7e8f5', 'horn', 'nose'],
  ['Drache', '#4fae73', 'horns2', 'snout'], ['Panda', '#f4f4f4', 'roundb', 'nose'], ['Igel', '#b08a60', 'spikes', 'nose'],
  ['Hai', '#72a3c8', 'fin', 'teeth'], ['Krake', '#d2658f', 'tent', 'none'], ['Hund', '#dcae72', 'flop', 'nose'], ['Astronaut', '#e9eef4', 'helmet', 'none']
];
function avatarSVG(i, size = 56) {
  const [nm, c, ear, ex] = AVS[((i % 16) + 16) % 16], K = '#1b2a6b', sw = 'stroke="' + K + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
  let back = '', front = '';
  if (ear === 'point') back += `<path d="M13 26 L15 7 L28 17Z M51 26 L49 7 L36 17Z" fill="${c}" ${sw}/>`;
  if (ear === 'round') back += `<circle cx="14" cy="16" r="7" fill="${c}" ${sw}/><circle cx="50" cy="16" r="7" fill="${c}" ${sw}/>`;
  if (ear === 'roundb') back += `<circle cx="14" cy="16" r="7.5" fill="#2a2a2a" ${sw}/><circle cx="50" cy="16" r="7.5" fill="#2a2a2a" ${sw}/>`;
  if (ear === 'long') back += `<ellipse cx="22" cy="10" rx="5" ry="11" fill="${c}" ${sw}/><ellipse cx="42" cy="10" rx="5" ry="11" fill="${c}" ${sw}/>`;
  if (ear === 'tuft') back += `<path d="M14 22 L12 8 L25 15Z M50 22 L52 8 L39 15Z" fill="#8f6238" ${sw}/>`;
  if (ear === 'flop') back += `<ellipse cx="11" cy="30" rx="6" ry="12" fill="#a8783f" ${sw}/><ellipse cx="53" cy="30" rx="6" ry="12" fill="#a8783f" ${sw}/>`;
  if (ear === 'antenna') back += `<path d="M32 14 L32 5" ${sw} fill="none"/><circle cx="32" cy="4.5" r="3" fill="#e23b3b" ${sw}/>`;
  if (ear === 'horn') back += `<path d="M28 16 L32 1 L36 16Z" fill="#f4b81d" ${sw}/>`;
  if (ear === 'horns2') back += `<path d="M16 20 L12 6 L24 14Z M48 20 L52 6 L40 14Z" fill="#f4b81d" ${sw}/>`;
  if (ear === 'spikes') back += `<path d="M10 28 L12 12 L19 20 L24 8 L31 17 L38 8 L43 20 L52 12 L54 28Z" fill="#6f5233" ${sw}/>`;
  if (ear === 'fin') back += `<path d="M26 16 L34 2 L40 18Z" fill="#5b87ad" ${sw}/>`;
  if (ear === 'tent') back += `<path d="M14 44 Q8 56 14 60 M24 50 Q20 60 25 62 M40 50 Q44 60 39 62 M50 44 Q56 56 50 60" ${sw} fill="none" stroke="${c}" stroke-width="5"/><path d="M14 44 Q8 56 14 60 M24 50 Q20 60 25 62 M40 50 Q44 60 39 62 M50 44 Q56 56 50 60" ${sw} fill="none"/>`;
  let face = `<circle cx="32" cy="36" r="22" fill="${c}" ${sw}/>`;
  if (ear === 'helmet') face = `<circle cx="32" cy="34" r="26" fill="#cfe3f5" fill-opacity=".55" ${sw}/><circle cx="32" cy="36" r="19" fill="${c}" ${sw}/>`;

const PL_HARD = [2, 3, 4, 6, 7, 8, 12, 15, 16, 18, 24, 35, 45, 65, 85, 90, 12.5, 2.5];
function pickPG(level, maxG) {
  for (let k = 0; k < 400; k++) {
    let p, G;
    if (level === 0) { p = pick(PL_EASY); G = pick(GL_EASY); }
    else if (level === 1) { p = pick(PL_MID); G = pick(GL_MID); }

}

    const why = e && e.message === 'lib' ? 'Die Verbindungsbibliothek (PeerJS) konnte nicht geladen werden. Prüfe die Internetverbindung.' : 'Der Vermittlungsserver antwortet nicht. Prüfe das WLAN. Manche Schul-WLANs blockieren diese Verbindung. Ein Hotspot vom Handy hilft dann oft.';
    app.innerHTML = `<div class="wrap"><div class="err">${why}</div><p><button class="btn" data-act="hostNew">Noch einmal versuchen</button> <button class="btn alt" data-act="home">Zurück</button></p></div>`; return;
  }
  H.url = baseUrl() + '?code=' + H.code;
  Wake.want = true; Wake.on();
  window.onbeforeunload = e => { if (H.game && H.game.phase !== 'lobby') { e.preventDefault(); e.returnValue = ''; return ''; } };
  clearInterval(H.hb); H.hb = setInterval(() => { const t = nowMs(); if (H.game) H.game.players.forEach(p => { if (p.online && t - p.lastSeen > 35000) H.game.setOffline(p.pid); }); }, 5000);
  renderLobby();
};
ACT.home = () => { stopAll(); renderLanding(); };
function stopAll() {
  clearInterval(H.tick); clearInterval(H.hb); if (H.scene) { H.scene.stop(); H.scene = null; }
  if (H.game) H.game.clearTimer(); if (H.net) H.net.destroy(); H.game = null; H.net = null; window.onbeforeunload = null;
  if (typeof P !== 'undefined') { if (P.net) { P.net.destroy(); P.net = null; } clearInterval(P.hb); clearInterval(P.tick); }
}
function hostMsg(pid, m) {
  const g = H.game; if (!g) return;
  if (m.k === 'hello') {
    const r = g.hello(pid, m.name, m.av, m.level);
    if (r.err) { H.net.send(pid, { k: 'err', text: r.err }); setTimeout(() => H.net.close(pid), 300); return; }
    H.net.send(pid, g.snapshot(r.p)); return;
  }
  const p = g.players.get(pid); if (!p) return;
  p.lastSeen = nowMs(); if (!p.online) { p.online = true; g.io.ui('lobby'); }
  switch (m.k) {
    case 'ping': H.net.send(pid, { k: 'pong' }); break;
    case 'ans': g.onAnswer(p, m); break;
    case 'tip': g.onTip(p, m); break;
    case 'vote': g.onVote(p, m); break;
    case 'lvl': g.setLevel(p, m.v); break;
    case 'ren': g.rename(p, m.name, m.av); break;
    case 'refl': g.onRefl(p, m); break;
  }
}
function hostUI(w) {
  const g = H.game; if (!g) return;
  if (w === 'lobby') { if (g.phase === 'lobby') updateLobby(); else updateChips2(); return; }
  if (w === 'answers') { updateAnswers(); return; }
  if (w === 'built') { g.lanes.forEach((L, i) => { if (L.lastBuilt && H.scene) H.scene.popTower(i, L.lastBuilt.idx); }); renderSide(); return; }
  if (w === 'refl') { if (g.phase === 'end') renderEnd(); return; }
  renderHost();
}

/* ---------- Lobby ---------- */
function seg(k, vals, cur, fmtf) { return `<div class="seg" role="group">${vals.map(v => `<button data-act="set" data-k="${k}" data-v="${v}" class="${String(v) === String(cur) ? 'on' : ''}" aria-pressed="${String(v) === String(cur)}">${fmtf ? fmtf(v) : v}</button>`).join('')}</div>`; }
ACT.set = b => { const k = b.dataset.k; let v = b.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (/^\d+$/.test(v)) v = Number(v); H.game.setSettings({ [k]: v }); renderLobby(); };
ACT.topic = b => { const g = H.game, t = b.dataset.t, cur = g.S.topics.slice(), i = cur.indexOf(t); if (i >= 0) cur.splice(i, 1); else cur.push(t); g.setSettings({ topics: TOPICS.map(x => x.id).filter(x => cur.includes(x)) }); renderLobby(); };
ACT.tog = b => { const g = H.game, k = b.dataset.k; g.setSettings({ [k]: !g.S[k] }); renderLobby(); };
function renderLobby() {

  clearInterval(H.tick); if (H.scene) { H.scene.stop(); H.scene = null; }
  app.innerHTML = `<div class="wrap"><div class="row" style="justify-content:space-between"><h1 style="font-size:2.4rem;margin:0">Klecks-Wache</h1><div class="row"><button class="btn alt sm" data-act="poster">Aushang drucken</button><button class="btn alt sm" data-act="soundH">Ton: ${S.sound ? 'an' : 'aus'}</button><button class="btn warn sm" data-act="home">Beenden</button></div></div>
  <div class="lobgrid" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px">
  <div class="card"><h2>Einstellungen</h2>
   <div class="set"><label>Spielart</label>${seg('mode', ['coop', 'duell'], S.mode, v => v === 'coop' ? 'Klasse gemeinsam' : 'Duell 1 gegen 1')}</div>
   <div class="set"><label>Themen</label><div>${TOPICS.map(t => `<label class="chk"><input type="checkbox" data-act="topic" data-t="${t.id}" ${S.topics.includes(t.id) ? 'checked' : ''}>${t.name}</label>`).join('')}</div></div>
   <div class="set"><label>Fragen</label>${seg('rounds', [8, 12, 16, 20], S.rounds)}</div>
   <div class="set"><label>Zeit pro Frage</label>${seg('T', [20, 30, 60, 90], S.T, v => v + ' s')}</div>
   <div class="set"><label>Stufe</label>${seg('levelMode', ['free', 0, 1, 2], S.levelMode, v => v === 'free' ? 'alle wählen' : LEVEL_NAME[v])}</div>
   <div class="set"><label>Kleckse</label>${seg('enemy', [0, 1, 2], S.enemy, v => ['wenige', 'normal', 'viele'][v])}</div>
   <div class="set"><label>Weiteres</label><div><label class="chk"><input type="checkbox" data-act="tog" data-k="hints" ${S.hints ? 'checked' : ''}>Tipps erlaubt</label><label class="chk"><input type="checkbox" data-act="tog" data-k="calc" ${S.calc ? 'checked' : ''}>Taschenrechner erlaubt</label><label class="chk"><input type="checkbox" data-act="tog" data-k="tutorial" ${S.tutorial ? 'checked' : ''}>Mini-Erklärung vor dem Start</label><label class="chk"><input type="checkbox" data-act="tog" data-k="auto" ${S.auto ? 'checked' : ''}>Automatisch weiter</label></div></div>
  </div>
  <div class="col"><div class="card"><h2>Mitspielen</h2><div class="row" style="gap:20px;align-items:center"><div id="qr" style="background:#fff;padding:6px;border:2px solid var(--ink);border-radius:8px;min-width:132px;min-height:132px"></div><div><div class="muted">Spielcode</div><div class="code">${H.code}</div><div class="small muted" style="word-break:break-all;margin-top:6px">${esc(H.url)}</div></div></div></div>
  <div class="card"><h2 style="margin:0 0 8px">Dabei: <span id="pc">${g.players.size}</span></h2><div class="plist" id="chips" style="margin:10px 0;min-height:40px"></div><p class="muted small">Mit ✕ entfernst du eine Person. Wer später dazukommt oder die Verbindung verliert, steigt mit dem Punktestand wieder ein.</p><div id="startmsg" class="err" style="display:none"></div><button class="btn go big" id="startbtn" data-act="start" style="margin-top:8px">Spiel starten</button></div></div></div></div>`;
  const css = document.createElement('style'); css.textContent = '@media(max-width:860px){.lobgrid{grid-template-columns:1fr!important}}'; app.appendChild(css);
  if (typeof QRCode !== 'undefined') { try { new QRCode($('#qr'), { text: H.url, width: 120, height: 120, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { } }

function updateChips() { const el = $('#chips'); if (!el) return; const g = H.game; el.innerHTML = Array.from(g.players.values()).map(p => `<span class="chip ${p.online ? '' : 'off'}">${avatarSVG(p.av, 30)}${esc(p.name)} <small class="muted">${LEVEL_NAME[p.level].charAt(0)}</small>${g.phase === 'lobby' ? `<button class="x" data-act="kick" data-p="${esc(p.pid)}" aria-label="${esc(p.name)} entfernen">✕</button>` : ''}</span>`).join('') || '<span class="muted">Noch niemand. Teile den Code oder den QR-Code.</span>'; }
function updateLobby() {
  const g = H.game; updateChips(); const pc = $('#pc'); if (pc) pc.textContent = g.players.size;
  const m = g.canStart(), sm = $('#startmsg'), sb = $('#startbtn'); if (!sm) return;
  const soft = m && m.startsWith('Noch niemand'); sm.style.display = m && !soft ? 'block' : 'none'; sm.textContent = m; sb.disabled = !!m;

ACT.kick = b => { H.game.kick(b.dataset.p); };
ACT.soundH = () => { H.game.S.sound = !H.game.S.sound; Snd.on = H.game.S.sound; if (H.game.phase === 'lobby') renderLobby(); else renderTop(); };
ACT.start = () => { Snd.init(); Snd.on = H.game.S.sound; H.scene = null; H.sceneRound = -1; H.game.start(); };

  if (typeof QRCode !== 'undefined') { try { new QRCode($('#pqr'), { text: H.url, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { } }

/* ---------- Spielansicht ---------- */
function mountGame() { clearInterval(H.tick); app.innerHTML = `<div class="hg"><div class="htop" id="htop"></div><div class="hmain" id="hmain"></div></div>`; if (H.scene) { H.scene.stop(); H.scene = null; } H.tick = setInterval(ticker, 200); }
function renderHost() {
  const g = H.game, ph = g.phase;
  if (ph === 'lobby') { renderLobby(); return; }
  if (ph === 'end') { renderEnd(); return; }
  if (!$('#hmain')) mountGame();
  renderTop();
  if (ph === 'tutorial') { if (H.scene) { H.scene.stop(); H.scene = null; } $('#hmain').innerHTML = `<div class="card" style="grid-column:1/-1;min-height:320px">${tutSlide(g.tut)}<div class="row" style="margin-top:16px"><button class="btn alt" data-act="tutBack" ${g.tut ? '' : 'disabled'}>Zurück</button><button class="btn go big" data-act="next">${g.tut < 2 ? 'Weiter' : 'Los geht\u2019s'}</button></div></div>`; return; }
  if (!$('#cv')) {
    $('#hmain').innerHTML = `<div class="stage"><canvas id="cv"></canvas><div id="pz"></div></div><aside class="side" id="side"></aside>`;
    const names = Array.from(g.players.values()).sort((a, b) => a.lane - b.lane).map(p => p.name);
    H.scene = new Scene($('#cv'), n => { if (g.S.sound && Snd[n]) Snd[n](); }); H.scene.setup(g, g.lanes.length, names); H.scene.start(); H.sceneRound = -1; H.revealed = false;
  }
  if (ph === 'question' && H.sceneRound !== g.r) { g.lanes.forEach((L, i) => H.scene.resetWave(i, L.wave)); H.sceneRound = g.r; H.revealed = false; }
  if (ph === 'reveal' && !H.revealed) { H.revealed = true; g.lanes.forEach((L, i) => { if (L.tl) H.scene.playReveal(i, L.tl); }); }
  renderSide();
}
ACT.tutBack = () => H.game.tutGo(-1);
ACT.next = () => { const g = H.game; if (g.phase === 'tutorial') g.tutGo(1); else g.next(); };
function renderTop() {
  const g = H.game, el = $('#htop'); if (!el) return;
  el.innerHTML = `<div class="tt">${g.phase === 'tutorial' ? 'Erklärung' : 'Runde ' + g.r + ' von ' + g.S.rounds}</div>${g.topic && g.phase !== 'tutorial' ? `<span class="badge">${esc(TOPIC_NAME[g.topic])}</span>` : ''}<span class="muted">${g.S.mode === 'duell' ? 'Duell' : 'Klasse gemeinsam'}</span><span class="grow"></span>
  <button class="btn alt sm" data-act="pauseH">${g.paused ? 'Weiter spielen' : 'Pause'}</button>${g.phase === 'question' ? '<button class="btn alt sm" data-act="resolve">Jetzt auflösen</button>' : ''}${['reveal', 'build'].includes(g.phase) ? '<button class="btn sm" data-act="next">Weiter</button>' : ''}<button class="btn alt sm" data-act="soundH">Ton: ${g.S.sound ? 'an' : 'aus'}</button><button class="btn warn sm" data-act="endGame">Beenden</button>`;
  const pz = $('#pz'); if (pz) pz.innerHTML = g.paused ? '<div class="pause">Pause</div>' : '';
}
ACT.pauseH = () => { const g = H.game; g.paused ? g.resume() : g.pause(); renderTop(); };
ACT.resolve = () => H.game.resolveNow();
ACT.endGame = () => { if (confirm('Das Spiel jetzt beenden?')) H.game.finish(); };
function ticker() {
  const g = H.game; if (!g) return;
  if (H.scene) H.scene.paused = g.paused;
  if (g.phase === 'question') {
    const rem = g.remaining(), clk = $('#clk'); if (H.scene) H.scene.setProgress(1 - rem / g.T);
    if (clk) { const s = Math.ceil(rem / 1000); if (clk.textContent != s) { clk.textContent = s; clk.classList.toggle('low', s <= 5); if (s <= 5 && s > 0 && g.S.sound && !g.paused) Snd.tick(); } }
  } else if (g.phase === 'build') { const c = $('#bclk'); if (c) c.textContent = Math.ceil(g.remaining() / 1000); }
}
function updateAnswers() {
  const g = H.game, [a, n] = g.answeredCount(), t = $('#ans-txt'), b = $('#ans-bar'); if (t) t.textContent = a + ' von ' + n + ' haben geantwortet'; if (b) b.style.width = (n ? 100 * a / n : 0) + '%'; updateChips2();
}
function updateChips2() { const el = $('#chips2'); if (!el) return; const g = H.game; el.innerHTML = Array.from(g.players.values()).map(p => `<span class="chip ${p.online ? '' : 'off'} ${p.ans ? 'ok' : ''}">${avatarSVG(p.av, 26)}${esc(p.name)}${p.ans ? ' ✓' : ''}</span>`).join(''); }
function renderSide() {
  const g = H.game, el = $('#side'); if (!el) return;
  if (g.phase === 'question') {
    el.innerHTML = `<div class="card"><div class="muted">Noch</div><div class="clock" id="clk">${Math.ceil(g.remaining() / 1000)}</div><div class="bar" style="margin:8px 0"><i id="ans-bar"></i></div><div id="ans-txt" class="small"></div></div><div class="card soft"><div class="plist" id="chips2"></div></div><div class="card soft small">Die Kleckse marschieren los. Nach der Zeit schießen alle richtigen Antworten auf sie.</div>`;
    updateAnswers();
  } else if (g.phase === 'reveal') {
    const solo = g.lanes.length === 1, L = g.lanes[0];
    let top = '';
    if (solo) top = `<ol class="top5" style="padding-left:0">${g.top(5).map((p, i) => `<li>${i + 1}. ${avatarSVG(p.av, 28)}${esc(p.name)}<span class="pt">${fmt(p.pts)}</span></li>`).join('')}</ol>`;
    else top = Array.from(g.players.values()).sort((a, b) => a.lane - b.lane).map(p => `<div class="row">${avatarSVG(p.av, 30)}<b>${esc(p.name)}</b><span class="grow"></span>${p.ans && p.ans.ok ? '✓ +' + fmt(p.ans.pts) : '✗'}<span class="muted">Ranzen ${fmt(g.lanes[p.lane].energy, 1)}</span></div>`).join('');
    const cards = g.resCards.map(c => `<div class="card soft rc"><h3>Stufe ${LEVEL_NAME[c.level]}: ${c.ok} von ${c.n} richtig</h3><div class="small" style="white-space:pre-line">${esc(c.text)}</div><div><b>Lösung:</b> ${esc(c.solution)}</div>${c.dist ? `<div class="dist">${c.dist.map((d, i) => `<i class="${i === c.correct ? 'good' : ''}" style="height:${Math.max(6, 40 * d / Math.max(1, ...c.dist))}px" title="${d}"></i>`).join('')}</div><div class="muted small">${c.options.map((o, i) => (i === c.correct ? '✓ ' : '') + esc(o) + ' (' + c.dist[i] + ')').join(' · ')}</div>` : (c.wrong.length ? `<div class="small"><b>Häufige falsche Eingaben:</b><br>${c.wrong.map(w => esc(w.k) + ' (' + w.c + '×)' + (w.why ? ' – ' + esc(w.why) : '')).join('<br>')}</div>` : '<div class="small muted">Keine falschen Eingaben.</div>')}</div>`).join('');
    const nc = L ? L.lastOk : 0;
    el.innerHTML = `<div class="card"><h2 style="margin-bottom:4px">${Math.round(g.tall * 100)} % richtig</h2><div class="small muted">${solo ? nc + ' Schüsse auf die Kleckse. Tinte: ' + L.ink : 'Jede richtige Antwort trifft den eigenen Klecks.'}</div><div style="margin-top:8px">${top}</div></div>${cards}`;
  } else if (g.phase === 'build') {
    el.innerHTML = g.lanes.map((L, i) => `<div class="card"><h3>${g.lanes.length > 1 ? 'Bauphase ' + (i ? 'unten' : 'oben') : 'Bauphase: Was soll gebaut werden?'}</h3>${L.opts.length > 1 ? `<div class="muted small">Abstimmung läuft … <span id="bclk">${Math.ceil(g.remaining() / 1000)}</span> s</div>` : ''}${L.opts.length ? L.opts.map((o, k) => { const t = g.optLabel(o), v = Array.from(L.votes.values()).filter(x => x === k).length; return `<div class="card soft" style="margin:8px 0;padding:8px 12px"><b>${esc(t.title)}</b><div class="small muted">${esc(t.sub)} · Tinte: ${t.cost}</div>${L.opts.length > 1 ? `<div class="small"><b>${v}</b> Stimmen</div>` : ''}${L.lastBuilt && L.opts.length === 1 ? '✓ wird gebaut' : ''}</div>`; }).join('') : '<div class="muted">Noch nicht genug Tinte. Sammelt weiter richtige Antworten.</div>'}<div class="small muted">Tinte: ${L.ink}</div></div>`).join('');
  }
}

/* ---------- Ende ---------- */
function classTopics(g) { return g.S.topics.map(t => { let c = 0, n = 0; g.players.forEach(p => { const b = p.byTopic[t]; if (b) { c += b.c; n += b.n; } }); return { t, pct: n ? Math.round(100 * c / n) : null, n }; }); }
function renderEnd() {
  const g = H.game, info = g.finalInfo; if (!info) return; clearInterval(H.tick);
  if (H.scene) { H.scene.stop(); H.scene = null; }
  let main = '';
  if (g.lanes.length === 1) {
    const top = g.top(3), ord = [top[1], top[0], top[2]], hs = { 0: 150, 1: 110, 2: 80 };
    main = `<div class="card center"><h1>Geschafft!</h1><div class="stars">${'★'.repeat(info.stars[0])}${'☆'.repeat(3 - info.stars[0])}</div><p class="qtext" style="white-space:normal">${info.stars[0] === 3 ? 'Der Ranzen ist sicher!' : info.stars[0] >= 1 ? 'Der Ranzen hat überlebt.' : 'Die Kleckse waren stark. Beim nächsten Mal klappt es besser.'}</p><p>Ranzen-Energie: <b>${fmt(info.energy[0], 1)} von ${E0}</b> · Gestoppte Kleckse: <b>${info.killed[0]}</b></p><div class="podium">${ord.map((p, i) => { const pos = [1, 0, 2][i]; return p ? `<div class="pl">${avatarSVG(p.av, 64)}<div><b>${esc(p.name)}</b></div><div class="muted">${fmt(p.pts)}</div><div class="blk" style="height:${hs[pos]}px">${pos + 1}</div></div>` : ''; }).join('')}</div></div>`;
  } else {
    const ps = Array.from(g.players.values()).sort((a, b) => a.lane - b.lane), w = info.winner ? g.players.get(info.winner) : null;
    main = `<div class="card center"><h1>${w ? esc(w.name) + ' gewinnt!' : 'Unentschieden!'}</h1><p class="muted">Sieger ist, wessen Ranzen mehr Energie hat. Bei Gleichstand zählen die Punkte.</p><div class="row" style="justify-content:center;gap:40px">${ps.map(p => `<div>${avatarSVG(p.av, 70)}<div><b>${esc(p.name)}</b></div><div>Ranzen ${fmt(info.energy[p.lane], 1)} / ${E0}</div><div class="stars">${'★'.repeat(info.stars[p.lane])}${'☆'.repeat(3 - info.stars[p.lane])}</div><div class="muted">${fmt(p.pts)} Punkte</div></div>`).join('')}</div></div>`;
  }
  const ct = classTopics(g), rf = Object.entries(g.refl).sort((a, b) => b[1] - a[1]);
  app.innerHTML = `<div class="wrap">${main}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px"><div class="card"><h2>Trefferquote nach Thema</h2>${ct.map(c => `<div class="tb"><span class="n">${esc(TOPIC_NAME[c.t])}</span><div class="bar"><i style="width:${c.pct || 0}%"></i></div><b>${c.pct == null ? '–' : c.pct + ' %'}</b></div>`).join('')}</div><div class="card"><h2>Das war schwer</h2>${rf.length ? rf.map(([k, v]) => `<div class="tb"><span class="n">${esc(k)}</span><b>${v}×</b></div>`).join('') : '<p class="muted">Noch keine Rückmeldungen. Die Lernenden antworten auf ihrem Gerät.</p>'}</div></div>
  <div class="row" style="margin-top:18px"><button class="btn" data-act="csv">Ergebnisse für iDoceo (CSV)</button><button class="btn alt" data-act="printRes">Ergebnisse drucken</button><button class="btn go" data-act="again">Neue Runde mit denselben Spielern</button><button class="btn warn" data-act="home">Zum Start</button></div></div>`;
}
ACT.csv = () => dl('klecks-wache-' + ago() + '.csv', H.game.csv());
ACT.again = () => { H.game.newGame(); renderLobby(); };
ACT.printRes = () => {
  const g = H.game, tp = g.S.topics;

   Klecks-Wache – Oberfläche der Lernenden (iPad / iPhone)

const P = { net: null, me: null, screen: 'join', m: null, q: null, tips: [], answered: false, tStart: 0, endAt: 0, pauseAt: 0, pausedRem: 0, paused: false, state: '', wrong: [], end: null, sound: false, hb: null, tick: null, code: '', prac: null, voted: -1, reflDone: false, everIn: false, cfg: {} };
function loadMe() {
  let m = null; try { m = JSON.parse(localStorage.getItem('klecks_me') || 'null'); } catch (e) { }
  if (!m) m = { pid: 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36), name: '', av: ri(0, 15), level: 0 };
  return m;
}
function saveMe() { try { localStorage.setItem('klecks_me', JSON.stringify(P.me)); } catch (e) { } }

ACT.joinForm = () => { stopAll(); P.me = loadMe(); P.code = new URLSearchParams(location.search).get('code') || ''; renderJoin(); };
ACT.rejoin = () => { let s = null; try { s = JSON.parse(localStorage.getItem('klecks_last')); } catch (e) { } if (!s) return; P.me = loadMe(); P.code = s.code; doJoin(); };
function renderJoin(err) {
  const me = P.me;
  app.innerHTML = `<div class="pg"><h2>Mitspielen</h2>${err ? `<div class="err" role="alert">${esc(err)}</div>` : ''}
  <label class="muted" for="jc">Spielcode (6 Ziffern)</label><input id="jc" class="codein" type="tel" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(P.code)}" placeholder="••••••">
  <label class="muted" for="jn" style="margin-top:10px;display:block">Dein Vorname oder Spitzname</label><input id="jn" type="text" maxlength="16" autocomplete="off" value="${esc(me.name)}" placeholder="z. B. Mia">
  <div class="muted" style="margin-top:12px">Deine Figur</div><div class="avgrid" id="avg">${Array.from({ length: 16 }, (_, i) => `<button class="avb ${me.av === i ? 'on' : ''}" data-act="pickAv" data-i="${i}" aria-label="${avName(i)}" aria-pressed="${me.av === i}">${avatarSVG(i, 52)}</button>`).join('')}</div>
  <div class="muted" style="margin-top:12px">Deine Stufe</div><div class="seg" id="lvs">${[0, 1, 2].map(i => `<button data-act="pickLv" data-i="${i}" class="${me.level === i ? 'on' : ''}">${LEVEL_NAME[i]}</button>`).join('')}</div><div class="small muted" style="margin-top:4px">Du kannst die Stufe vor jeder Runde ändern. Schwer gibt mehr Punkte.</div>
  <div class="row" style="margin-top:18px"><button class="btn go big grow" data-act="doJoin">Beitreten</button><button class="btn alt" data-act="home">Zurück</button></div></div>`;
}
ACT.pickAv = b => { P.me.av = Number(b.dataset.i); $$('#avg .avb').forEach((x, i) => { x.classList.toggle('on', i === P.me.av); x.setAttribute('aria-pressed', i === P.me.av); }); saveMe(); if (P.net && P.screen === 'lobby') sendNet({ k: 'ren', name: P.me.name, av: P.me.av }); };
ACT.pickLv = b => { P.me.level = Number(b.dataset.i); $$('#lvs button').forEach((x, i) => x.classList.toggle('on', i === P.me.level)); saveMe(); if (P.net && P.screen !== 'join') sendNet({ k: 'lvl', v: P.me.level }); };
ACT.doJoin = () => {
  const c = ($('#jc').value || '').replace(/\D/g, ''), n = ($('#jn').value || '').trim();
  if (c.length !== 6) { renderJoinKeep('Der Spielcode hat 6 Ziffern.'); return; }
  if (!n) { renderJoinKeep('Bitte gib deinen Namen ein.'); return; }
  P.code = c; P.me.name = n; saveMe(); doJoin();
};
function renderJoinKeep(err) { P.code = $('#jc').value; P.me.name = $('#jn').value; renderJoin(err); }
function sendNet(m) { return P.net ? P.net.send(m) : false; }
function doJoin() {
  stopAll(); P.screen = 'connect'; P.everIn = false; P.wrong = []; P.end = null; P.reflDone = false;
  Wake.want = true; Wake.on();
  app.innerHTML = `<div class="pg"><div class="card center"><h2>Verbinde …</h2><p class="muted">Einen Moment bitte.</p></div></div>`;
  P.net = new ClientNet(P.code, {
    open: () => { sendNet({ k: 'hello', pid: P.me.pid, name: P.me.name, av: P.me.av, level: P.me.level }); },
    msg: onMsg,
    state: (s, info) => {
      P.state = s; showBanner();
      if (s === 'failed') {
        const t = info === 'nocode' ? 'Diesen Spielcode gibt es nicht (mehr). Prüfe die Ziffern.' : info === 'lib' ? 'Die Verbindungsbibliothek konnte nicht geladen werden. Prüfe das Internet.' : 'Keine Verbindung zur Spielleitung. Vielleicht blockiert das Schul-WLAN diese Verbindung. Sag es deiner Lehrkraft.';
        stopAll(); P.screen = 'join'; renderJoin(t);
      }
    }
  });
  P.net.start();
  clearInterval(P.hb); P.hb = setInterval(() => { if (!P.net) return; sendNet({ k: 'ping' }); if (P.everIn && nowMs() - P.net.lastRx > 22000 && P.state === 'online') P.net.force(); }, 6000);
}
function showBanner() {
  let b = $('#nb'); const txt = P.state === 'lost' ? 'Verbindung unterbrochen. Ich versuche es erneut …' : (P.state === 'connecting' && P.everIn) ? 'Verbinde neu …' : '';
  if (!txt) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'nb'; b.className = 'banner'; b.setAttribute('role', 'status'); document.body.appendChild(b); } b.textContent = txt;
}
function onMsg(m) {
  if (!m || !m.k) return;
  switch (m.k) {
    case 'snap': P.everIn = true; try { localStorage.setItem('klecks_last', JSON.stringify({ code: P.code, t: Date.now() })); } catch (e) { } P.cfg = { calc: m.calc, hints: m.hints, mode: m.mode, fixed: m.fixed }; if (m.fixed != null) P.me.level = m.fixed; if (m.me) P.me.name = m.me.name; P.paused = !!m.paused; if (m.msg) onMsg(m.msg); break;
    case 'pong': break;
    case 'lobby': P.m = m; P.screen = 'lobby'; if (m.fixed != null) P.me.level = m.fixed; else if (m.level != null) P.me.level = m.level; P.me.name = m.name; renderLobbyP(); break;
    case 'tut': P.screen = 'tut'; P.m = m; renderTutP(); break;
    case 'q': startQuestion(m); break;
    case 'tip': P.tips[m.n - 1] = m.text; updateTips(); break;
    case 'ack': P.answered = true; P.screen = 'wait'; P.m = { text: 'Antwort gespeichert ✓', sub: 'Warte, bis alle fertig sind oder die Zeit abläuft.' }; renderWait(); break;
    case 'res': showResult(m); break;
    case 'b': P.screen = 'build'; P.m = m; P.voted = m.voted; P.endAt = nowMs() + m.rem; renderBuild(); break;
    case 'vack': P.voted = m.o; renderBuild(); break;
    case 'wait': P.screen = 'wait'; P.m = { text: m.text, sub: '' }; renderWait(); break;
    case 'end': showEnd(m); break;
    case 'pause': P.paused = !!m.on; if (m.on) { P.pauseAt = nowMs(); } else { if (P.screen === 'q') P.tStart += nowMs() - P.pauseAt; P.endAt = nowMs() + m.rem; } showPause(); break;
    case 'kick': stopAll(); P.screen = 'join'; renderJoin('Die Spielleitung hat dich entfernt.'); break;
    case 'err': stopAll(); P.screen = 'join'; renderJoin(m.text); break;
  }
}
function showPause() { let o = $('#pz2'); if (P.paused) { if (!o) { o = document.createElement('div'); o.id = 'pz2'; o.className = 'pause'; o.style.position = 'fixed'; o.textContent = 'Pause'; document.body.appendChild(o); } } else if (o) o.remove(); }
function shell(inner, extra = '') {
  const head = `<div class="pbar"><span>${avatarSVG(P.me.av, 34)}</span><span>${esc(P.me.name)}</span><span class="sp">${extra}</span><button class="btn alt sm" data-act="soundP" aria-label="Ton">${P.sound ? 'Ton an' : 'Ton aus'}</button></div>`;
  app.innerHTML = `<div class="pg">${head}${inner}</div>`;
}
ACT.soundP = b => { P.sound = !P.sound; Snd.on = P.sound; Snd.init(); b.textContent = P.sound ? 'Ton an' : 'Ton aus'; if (P.sound) Snd.ok(); };
function renderLobbyP() {

  shell(`<div class="card center"><h2>Du bist dabei!</h2><p class="muted">Warte, bis die Spielleitung startet. ${P.m.n} ${P.m.n === 1 ? 'Person ist' : 'Personen sind'} da.</p>${P.m.mode === 'duell' ? '<p><b>Duell:</b> Du spielst gegen eine andere Person.</p>' : ''}</div>
  <div class="muted" style="margin-top:12px">Deine Stufe ${fixed ? '(von der Spielleitung festgelegt)' : ''}</div><div class="seg" id="lvs">${[0, 1, 2].map(i => `<button ${fixed ? 'disabled' : ''} data-act="pickLv" data-i="${i}" class="${P.me.level === i ? 'on' : ''}">${LEVEL_NAME[i]}</button>`).join('')}</div>
  <div class="muted" style="margin-top:12px">Deine Figur</div><div class="avgrid" id="avg">${Array.from({ length: 16 }, (_, i) => `<button class="avb ${P.me.av === i ? 'on' : ''}" data-act="pickAv" data-i="${i}" aria-label="${avName(i)}">${avatarSVG(i, 44)}</button>`).join('')}</div>`);

function renderTutP() { shell(`<div class="card">${tutSlide(P.m.i)}</div><p class="muted center" style="margin-top:10px">Die Spielleitung blättert weiter.</p>`); }
function renderWait() { shell(`<div class="card center" style="margin-top:20px"><h2>${esc(P.m.text)}</h2><p class="muted">${esc(P.m.sub || '')}</p></div>`); }

/* ---------- Frage ---------- */
function startQuestion(m) {
  P.q = m; P.screen = 'q'; P.tips = (m.tips || []).slice(); P.answered = !!m.answered; P.paused = !!m.paused;
  P.tStart = nowMs() - (m.T - m.rem); P.endAt = nowMs() + m.rem;
  if (P.answered) { P.screen = 'wait'; P.m = { text: 'Antwort gespeichert ✓', sub: 'Warte, bis alle fertig sind.' }; renderWait(); return; }
  renderQ(); clearInterval(P.tick); P.tick = setInterval(tickQ, 200);
}
function tiles(t) {
  const sy = ['▲', '◆', '●', '■'];
  if (t.type === 'tf') return `<div class="tiles two">${t.options.map((o, i) => `<button class="tile ${i ? 'k0' : 'k3'}" data-act="pick" data-i="${i}"><span class="sy">${i ? '✗' : '✓'}</span>${esc(o)}</button>`).join('')}</div>`;
  return `<div class="tiles">${t.options.map((o, i) => `<button class="tile k${i}" data-act="pick" data-i="${i}"><span class="sy">${sy[i]}</span>${esc(o)}</button>`).join('')}</div>`;
}
function renderQ() {
  const q = P.q, t = q.task;
  const input = t.type === 'number' ? `<div class="row" style="margin-top:8px"><div class="grow"><input id="nv" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" placeholder="Antwort" aria-label="Deine Antwort"></div>${t.unit ? `<b style="font-size:1.3rem">${esc(t.unit)}</b>` : ''}</div><div class="row" style="margin-top:10px">${q.calc ? '<button class="btn alt" data-act="calc">Taschenrechner</button>' : ''}<button class="btn go grow" data-act="sendNum">Antwort abgeben</button></div><div class="small muted" style="margin-top:4px">Komma oder Punkt sind beide okay.</div>` : tiles(t);
  shell(`<div class="tbar" aria-hidden="true"><i id="tb"></i></div><div class="muted small">Runde ${q.r} von ${q.total} · ${esc(q.tname)} · Stufe ${LEVEL_NAME[q.level]}<span id="tn" style="float:right;font-family:var(--h);font-weight:700;font-size:1.3rem">${Math.ceil(q.rem / 1000)}</span></div>
  <div class="qtext">${esc(t.text)}</div>${t.svg ? `<div class="center">${t.svg}</div>` : ''}${input}<div id="tips"></div>${q.hints ? `<div class="row" style="margin-top:12px" id="tipbtn"></div>` : ''}`);
  updateTips(); const nv = $('#nv'); if (nv) nv.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.sendNum(); });
}
function updateTips() {
  if (P.screen !== 'q') return; const el = $('#tips'), bt = $('#tipbtn'); if (!el) return;
  el.innerHTML = P.tips.map((t, i) => `<div class="tip"><b>Tipp ${i + 1}:</b> ${esc(t)}</div>`).join('');
  if (bt) { const n = P.tips.length; bt.innerHTML = n >= 2 ? '' : `<button class="btn alt sm" data-act="tip">Tipp ${n + 1} zeigen (${n ? 'nur noch ein Viertel der Punkte' : 'halbe Punkte'})</button>`; }
}
ACT.tip = () => { if (P.screen === 'q') sendNet({ k: 'tip', r: P.q.r, n: P.tips.length + 1 }); };
function elapsedS() { return Math.max(0.3, (nowMs() - P.tStart) / 1000); }
ACT.pick = b => {
  if (P.prac) { if (!$('.tile[disabled]')) { $$('.tile').forEach(t => t.setAttribute('disabled', '')); pracEval(b.dataset.i); } return; }
  if (P.screen !== 'q' || P.answered) return; const i = Number(b.dataset.i); P.answered = true; $$('.tile').forEach(t => t.setAttribute('disabled', '')); b.classList.add('sel');
  if (!sendNet({ k: 'ans', r: P.q.r, v: i, t: elapsedS() })) { P.answered = false; $$('.tile').forEach(t => t.removeAttribute('disabled')); toast('Keine Verbindung. Tippe noch einmal.'); }
};
ACT.sendNum = () => { if (P.screen !== 'q' || P.answered) return; const v = ($('#nv').value || '').trim(); if (!isFinite(parseNum(v))) { toast('Bitte gib eine Zahl ein.'); return; } P.answered = true; if (!sendNet({ k: 'ans', r: P.q.r, v, t: elapsedS() })) { P.answered = false; toast('Keine Verbindung. Tippe noch einmal.'); } };
function tickQ() {
  if (P.screen !== 'q') { clearInterval(P.tick); return; }
  if (P.paused) return;
  const rem = Math.max(0, P.endAt - nowMs()), tb = $('#tb'), tn = $('#tn'); if (tb) tb.style.width = (100 * rem / P.q.T) + '%'; if (tn) { tn.textContent = Math.ceil(rem / 1000); tn.style.color = rem < 6000 ? 'var(--red)' : ''; }
  if (rem <= 0 && !P.answered) { $$('.tile').forEach(t => t.setAttribute('disabled', '')); const nv = $('#nv'); if (nv) nv.disabled = true; }
}
/* Taschenrechner */
const CALC = { acc: null, op: null, cur: '0', fresh: true };
function calcRender() { const d = $('#cd'); if (d) d.textContent = CALC.cur.replace('.', ','); }
ACT.calc = () => { if ($('#calc')) return; Object.assign(CALC, { acc: null, op: null, cur: '0', fresh: true }); const d = document.createElement('div'); d.id = 'calc'; d.className = 'calc'; d.innerHTML = `<div class="disp" id="cd" aria-live="polite">0</div><div class="keys">${['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', ',', '=', '+', 'C', '⌫', '', ''].map(k => k ? `<button class="${'÷×−+'.includes(k) ? 'op' : k === '=' ? 'eq' : ''}" data-act="ck" data-k="${k}">${k}</button>` : '<span></span>').join('')}</div><div class="row" style="margin-top:8px"><button class="btn go grow" data-act="cuse">In die Antwort übernehmen</button><button class="btn alt" data-act="cx">Schließen</button></div>`; document.body.appendChild(d); };
ACT.cx = () => { const c = $('#calc'); if (c) c.remove(); };
ACT.cuse = () => { const nv = $('#nv'); if (nv) nv.value = CALC.cur.replace('.', ','); ACT.cx(); };
function calcDo() { const a = parseFloat(CALC.acc), b = parseFloat(CALC.cur); let r = b; if (CALC.op === '+') r = a + b; if (CALC.op === '−') r = a - b; if (CALC.op === '×') r = a * b; if (CALC.op === '÷') r = b === 0 ? NaN : a / b; return isFinite(r) ? String(rnd(r, 8)) : '0'; }
ACT.ck = b => {
  const k = b.dataset.k;
  if (/\d/.test(k)) { CALC.cur = CALC.fresh ? k : (CALC.cur === '0' ? k : CALC.cur + k); CALC.fresh = false; }
  else if (k === ',') { if (CALC.fresh) { CALC.cur = '0.'; CALC.fresh = false; } else if (!CALC.cur.includes('.')) CALC.cur += '.'; }
  else if (k === 'C') Object.assign(CALC, { acc: null, op: null, cur: '0', fresh: true });

  else if (k === '=') { if (CALC.op && CALC.acc != null) { CALC.cur = calcDo(); CALC.acc = null; CALC.op = null; CALC.fresh = true; } }

/* ---------- Ergebnis ---------- */
function showResult(m) {
  clearInterval(P.tick); ACT.cx(); P.screen = 'res'; P.m = m;
  if (m.absent) { shell(`<div class="fb neu"><div class="big">Runde verpasst</div><p>Du bist in der nächsten Runde wieder dabei.</p><p>Punkte: <b>${fmt(m.total)}</b></p></div>`); return; }
  if (m.full) P.wrong.push(m.full);
  if (P.sound) m.ok ? Snd.ok() : Snd.no();
  const fb = m.ok ? `<div class="fb ok"><div class="big">Richtig! +${fmt(m.pts)}</div><div>Dein Schuss trifft!${m.streak >= 2 ? ' Serie: ' + m.streak : ''}</div></div>` : `<div class="fb no"><div class="big">${m.none ? 'Keine Antwort' : 'Nicht ganz'}</div><div>${m.none ? 'Die Zeit war um.' : 'Deine Antwort: <b>' + esc(m.mine) + '</b>'}</div></div>`;
  const why = !m.ok && m.why ? `<div class="tip">Wahrscheinlicher Denkfehler: ${esc(m.why)}</div>` : '';
  const duel = m.mode === 'duell' ? `<p>Dein Ranzen: <b>${fmt(m.energy, 1)}</b> · Gegner:in: <b>${fmt(m.opp, 1)}</b></p>` : `<p>${m.pct} % der Klasse waren richtig. Ranzen-Energie: <b>${fmt(m.energy, 1)}</b></p>`;
  shell(`${fb}${why}<div class="card soft"><b>Lösung: ${esc(m.sol)}</b><div class="expl">${esc(m.expl)}</div></div><p style="margin-top:10px">Punkte gesamt: <b>${fmt(m.total)}</b>${m.showRank ? ' · Platz ' + m.rank + ' von ' + m.n : ''}</p>${duel}<p class="muted">Gleich geht es weiter. Schau auf den Beamer.</p>`, m.streak >= 3 ? 'Serie ' + m.streak : '');
}
/* ---------- Bauphase ---------- */
function renderBuild() {
  const m = P.m, locked = P.voted >= 0;
  shell(`<div class="card"><h2>Was soll gebaut werden?</h2><p class="muted">Tinte: ${m.ink}. Stimmt ab. Die meisten Stimmen gewinnen.</p>${m.opts.map((o, i) => `<button class="btn vote ${P.voted === i ? 'go' : 'alt'}" data-act="vote" data-i="${i}" ${locked && P.voted !== i ? 'disabled' : ''}><b>${esc(o.title)}</b><br><span class="small" style="font-family:var(--b);font-weight:600">${esc(o.sub)} · Kosten ${o.cost}</span></button>`).join('')}${locked ? '<p class="muted center">Deine Stimme ist abgegeben ✓</p>' : ''}</div>`);
}
ACT.vote = b => { if (P.voted >= 0) return; sendNet({ k: 'vote', o: Number(b.dataset.i) }); };
/* ---------- Ende, Nachdenken, Wiederholen ---------- */
function showEnd(m) { clearInterval(P.tick); ACT.cx(); P.screen = 'end'; P.end = m; if (P.sound) Snd.fan(); renderEnd2(); }
function renderEnd2() {
  const m = P.end, pct = m.nIn ? Math.round(100 * m.nOk / m.nIn) : 0, n = P.wrong.length;
  const head = m.mode === 'duell' ? `<h2>${m.won ? 'Du hast gewonnen!' : m.draw ? 'Unentschieden!' : 'Gut gekämpft!'}</h2><p>Dein Ranzen: <b>${fmt(m.energy, 1)}</b> · Gegner:in: <b>${fmt(m.opp, 1)}</b></p>` : `<h2>Geschafft!</h2><div class="stars">${'★'.repeat(m.stars)}${'☆'.repeat(3 - m.stars)}</div><p>Ranzen-Energie: <b>${fmt(m.energy, 1)}</b> · Gestoppte Kleckse: <b>${m.killed}</b></p>`;
  const refl = P.reflDone ? '<p class="muted">Danke für deine Rückmeldung ✓</p>' : `<h3>Was war diesmal am schwierigsten?</h3><div class="row">${m.topics.map(t => `<button class="btn alt sm" data-act="refl" data-t="${esc(TOPIC_NAME[t])}">${esc(TOPIC_NAME[t])}</button>`).join('')}<button class="btn alt sm" data-act="refl" data-t="Nichts, alles gut">Nichts, alles gut</button></div>`;
  shell(`<div class="card center">${head}<p>Punkte: <b>${fmt(m.pts)}</b>${m.showRank ? ' · Platz ' + m.rank + ' von ' + m.n : ''}</p><p>Richtig: <b>${m.nOk} von ${m.nIn}</b> (${pct} %) · Beste Serie: <b>${m.best}</b></p><div>${m.badges.map(b => `<span class="badge">${esc(b)}</span>`).join('') || '<span class="muted">Sammle in der nächsten Runde Abzeichen.</span>'}</div></div>
  <div class="card" style="margin-top:12px"><h3>Deine Treffer nach Thema</h3>${m.topics.map(t => { const b = m.byTopic[t]; const p = b && b.n ? Math.round(100 * b.c / b.n) : null; return `<div class="tb"><span class="n">${esc(TOPIC_NAME[t])}</span><div class="bar"><i style="width:${p || 0}%"></i></div><b>${p == null ? '–' : p + ' %'}</b></div>`; }).join('')}</div>
  <div class="card soft" style="margin-top:12px">${refl}</div>${n ? `<button class="btn go big" style="margin-top:12px" data-act="prac">${n} ${n === 1 ? 'Aufgabe' : 'Aufgaben'} noch einmal üben</button>` : '<p class="center muted">Keine Fehler zum Üben. Stark!</p>'}`);
}
ACT.refl = b => { sendNet({ k: 'refl', t: b.dataset.t }); P.reflDone = true; renderEnd2(); };
ACT.prac = () => { P.prac = { i: 0, list: shuffle(P.wrong), ok: 0, tries: 0 }; renderPrac(); };
function renderPrac(fb) {
  const pr = P.prac; if (pr.i >= pr.list.length) { shell(`<div class="card center"><h2>Geübt!</h2><p>${pr.ok} von ${pr.list.length} beim ersten Versuch richtig.</p><button class="btn big" data-act="pracEnd">Zurück</button></div>`); return; }
  const t = pr.list[pr.i], done = !!fb;
  const inp = t.type === 'number' ? `<div class="row" style="margin-top:8px"><div class="grow"><input id="nv" type="text" inputmode="decimal" autocomplete="off" placeholder="Antwort" ${done ? 'disabled' : ''}></div>${t.unit ? `<b>${esc(t.unit)}</b>` : ''}</div>${done ? '' : '<div class="row" style="margin-top:10px"><button class="btn alt" data-act="calc">Taschenrechner</button><button class="btn go grow" data-act="pracNum">Prüfen</button></div>'}` : tiles(t);
  shell(`<div class="muted small">Üben ${pr.i + 1} von ${pr.list.length} · ohne Punkte</div><div class="qtext">${esc(t.text)}</div>${t.svg ? `<div class="center">${t.svg}</div>` : ''}${inp}${fb ? `<div class="fb ${fb.ok ? 'ok' : 'no'}"><div class="big">${fb.ok ? 'Richtig!' : 'Noch nicht'}</div>${fb.ok ? '' : '<div>Lösung: <b>' + esc(t.solution) + '</b></div>'}</div><div class="expl">${esc(t.explain)}</div>${fb.why ? `<div class="tip">${esc(fb.why)}</div>` : ''}<button class="btn big" style="margin-top:10px" data-act="pracNext">Weiter</button>` : ''}`);
}
function pracEval(v) { const pr = P.prac, t = pr.list[pr.i]; let ok, why = ''; if (t.type === 'number') { const x = parseNum(v); ok = isFinite(x) && Math.abs(x - t.ans) <= 0.005 + 1e-9; if (!ok) { const e = (t.errs || []).find(e => Math.abs(e.v - x) < 0.006); why = e ? e.why : ''; } } else { ok = Number(v) === t.correct; if (!ok) why = (t.whys && t.whys[Number(v)]) || ''; } if (ok && pr.tries === 0) pr.ok++; pr.tries++; renderPrac({ ok, why }); }
ACT.pracNum = () => { const v = $('#nv').value; if (!isFinite(parseNum(v))) { toast('Bitte gib eine Zahl ein.'); return; } pracEval(v); };
ACT.pracNext = () => { P.prac.i++; P.prac.tries = 0; renderPrac(); };
ACT.pracEnd = () => { P.prac = null; ACT.cx(); renderEnd2(); };

/* ============================================================
   Klecks-Wache – Start
   ============================================================ */
(function boot() {
  const code = new URLSearchParams(location.search).get('code');
  if (code && /^\d{6}$/.test(code)) { P.me = loadMe(); P.code = code; renderJoin(); }
  else renderLanding();
})();
</script>
