<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stunden-Timer</title>
<style>
:root{--bg:#0b0c10;--ink:#f4f6fb;--soft:#aeb0b8;--line:rgba(255,255,255,.2);--ok:#7bd8a4;--bad:#ff8a80;--glass:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5;padding:76px 16px 120px;background:radial-gradient(1000px 600px at 12% -10%,#262932,transparent),radial-gradient(900px 600px at 100% 115%,#1c1e26,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 10px}
.lead{color:var(--soft);margin:0 0 20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.4)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));cursor:pointer;font-weight:700;touch-action:manipulation;text-decoration:none;color:var(--ink)}
.btn:hover{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.12))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:rgba(255,255,255,.05);font-weight:600}
.btn.small{min-height:40px;padding:0 16px;font-size:.92rem}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;touch-action:manipulation}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7));color:#111;border-color:#fff}
input,select,textarea{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);width:100%}
textarea{min-height:110px;resize:vertical}
select option{color:#111}
label{display:block;font-size:.88rem;color:var(--soft);margin:0 0 4px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--soft)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c4c6cd,#fff);transition:width .3s}
.q{font-size:1.2rem;margin:0 0 14px}
.svgbox{display:flex;justify-content:center;margin:0 0 14px}
.svgbox svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choices .btn{justify-content:flex-start;text-align:left;padding:10px 18px;min-height:56px}
.choices .btn.right{background:rgba(123,216,164,.28);border-color:var(--ok)}
.choices .btn.wrong{background:rgba(255,138,128,.25);border-color:var(--bad)}
.fb{min-height:1.5em;margin:12px 0 0;font-weight:700}
.explain{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);color:#e4e6ec;font-size:.95rem}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--soft);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.big{font-size:2.4rem;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #999;background:#fff}.soft{color:#444}}
body{--w:0}.card:first-of-type{transition:box-shadow .3s}</style>
<meta property="og:type" content="website">

</head>
<body>
<div class="wrap">
<h1>Stunden-Timer</h1>
<p class="lead">Unterrichtsphasen planen und als großen Countdown für die Klasse anzeigen – mit optionalem Signalton.</p>

<div class="card" style="text-align:center"><div id="phase" class="soft" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Bereit</div>
<div class="big" id="clock" role="timer" aria-live="off" style="font-size:clamp(4rem,22vw,9rem);font-variant-numeric:tabular-nums">00:00</div>
<div class="bar" style="margin:10px auto;max-width:520px" aria-hidden="true"><i id="prog" style="width:0"></i></div>
<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="start">Start</button><button class="btn ghost" id="pause">Pause</button><button class="btn ghost" id="next">Weiter ▸</button><button class="btn ghost" id="reset">Zurück</button><button class="btn ghost" id="full">Vollbild</button></div></div>
<div class="card noprint"><h2>Phasen</h2>
<div id="list"></div>
<div class="row" style="margin-top:10px"><button class="btn small" id="add">Phase hinzufügen</button>
<button class="btn ghost small" data-p="u">Vorlage: Unterrichtsstunde</button><button class="btn ghost small" data-p="s">Vorlage: Stationenlernen</button></div>
<label style="margin-top:14px;display:flex;gap:10px;align-items:center;font-size:1rem"><input type="checkbox" id="snd" style="width:24px;min-height:24px"> Signalton am Ende jeder Phase</label></div>

</div>
<script>

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){if(d===undefined)d=2;var v=Math.round(n*Math.pow(10,d))/Math.pow(10,d);return String(v).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(/\s/g,'');if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){var p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}s=s.replace(/[^0-9.\-+eE]/g,'');var v=parseFloat(s);return isNaN(v)?NaN:v}
function mc(correct,wrongs){correct=String(correct);var set=[correct];wrongs.forEach(function(w){w=String(w);if(set.indexOf(w)<0)set.push(w)});var arr=shuffle(set.slice(0,4));return {choices:arr,correct:arr.indexOf(correct)}}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var P=store.get('st_phases',null)||[['Einstieg',5],['Erarbeitung',20],['Sicherung',10]];
var idx=0,left=0,run=false,tm=null;
function save(){store.set('st_phases',P)}
function mmss(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderList(){$('#list').innerHTML=P.map(function(p,i){return '<div class="row" style="margin-bottom:8px"><input aria-label="Name der Phase '+(i+1)+'" data-i="'+i+'" data-k="0" value="'+esc(p[0])+'" style="flex:1;min-width:140px"><input aria-label="Minuten" inputmode="decimal" data-i="'+i+'" data-k="1" value="'+String(p[1]).replace('.',',')+'" style="width:90px"><span class="soft">Min.</span><button class="btn ghost small" aria-label="Phase entfernen" data-del="'+i+'">✕</button></div>'}).join('');reset()}
function show(){$('#clock').textContent=mmss(left);var tot=(P[idx]?P[idx][1]:0)*60;$('#prog').style.width=tot?Math.min(100,100*(1-left/tot))+'%':'0';$('#phase').textContent=P[idx]?(idx+1)+'/'+P.length+' · '+P[idx][0]:'Fertig';document.body.style.setProperty('--w',left<=30&&run?'1':'0')}
function beep(){if(!$('#snd').checked)return;try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.5)}catch(e){}}
function load(i){idx=i;left=P[i]?P[i][1]*60:0;show()}
function reset(){run=false;clearInterval(tm);$('#start').textContent='Start';load(0)}
function tick(){left-=1;if(left<=0){beep();if(idx+1<P.length){load(idx+1)}else{run=false;clearInterval(tm);idx=P.length;left=0;$('#start').textContent='Start';show();return}}show()}
$('#start').onclick=function(){if(idx>=P.length)load(0);if(run){return}run=true;$('#start').textContent='Läuft';clearInterval(tm);tm=setInterval(tick,1000)};
$('#pause').onclick=function(){run=false;clearInterval(tm);$('#start').textContent='Weiter'};
$('#next').onclick=function(){if(idx+1<P.length)load(idx+1);else{idx=P.length;left=0;show()}};
$('#reset').onclick=reset;
$('#full').onclick=function(){var e=document.documentElement;try{(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}};
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.i!==undefined){var k=+t.dataset.k;P[+t.dataset.i][k]=k?Math.max(0.1,parseNum(t.value)||1):t.value;save();if(!run)load(Math.min(idx,P.length-1))}});
document.addEventListener('click',function(e){var d=e.target.getAttribute&&e.target.getAttribute('data-del');if(d!==null&&d!==undefined&&P.length>1){P.splice(+d,1);save();renderList()}var p=e.target.getAttribute&&e.target.getAttribute('data-p');if(p){P=p==='u'?[['Einstieg',5],['Erarbeitung',20],['Sicherung',10],['Abschluss',5]]:[['Station 1',8],['Wechsel',1],['Station 2',8],['Wechsel',1],['Station 3',8]];save();renderList()}});
$('#add').onclick=function(){P.push(['Neue Phase',5]);save();renderList()};
renderList();

</script>
<script defer data-category="schule" src="protect.js"></script>
</body>
</html>
