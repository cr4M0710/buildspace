<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e2571c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Anwurf">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Anwurf – HSG Wettenberg</title>
<style><style>
/* Layout: phone-app shell, sticky header, scrolling content, fixed tab bar at the bottom. Palette from a sports hall: resin-orange accent on court-blue ink. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e8edf1; --fg:#14212b; --muted:#5b6b78; --line:#d6dee5;
  --accent:#e2571c; --accent-ink:#ffffff; --court:#1d4e6e;
  --win:#1f8a4c; --draw:#7b8794; --loss:#c8352d; --live:#d92b2b;
  --f-display:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --f-body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#16222c; --surface-2:#1f2e3a; --fg:#e8eef3; --muted:#93a4b2; --line:#2a3b48;
  --accent:#f0743c; --accent-ink:#1a0e07; --court:#7fb6d8;
  --win:#43b874; --draw:#8d9aa6; --loss:#ee6a5f; --live:#ff5a4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#16222c; --surface-2:#1f2e3a; --fg:#e8eef3; --muted:#93a4b2; --line:#2a3b48;
  --accent:#f0743c; --accent-ink:#1a0e07; --court:#7fb6d8;
  --win:#43b874; --draw:#8d9aa6; --loss:#ee6a5f; --live:#ff5a4f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
.app{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.top .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-weight:600;cursor:pointer}
.iconbtn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:22px 0 10px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* team card */
.cards{display:grid;gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tcard:hover{border-color:var(--court)}
.thead{display:flex;align-items:center;gap:12px}
.badge{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff}
.badge.sm{width:28px;height:28px;font-size:12px}
.tname{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.tleague{font-size:13px;color:var(--muted)}
.rank{margin-left:auto;text-align:right}
.rank b{font-family:var(--f-display);font-size:26px;line-height:1;font-weight:700}
.rank span{display:block;font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--surface-2);border-radius:9px;padding:10px 12px;min-width:0}
.cell .v{font-weight:600;font-size:14px}
.cell .s{font-size:12px;color:var(--muted)}
.form{display:flex;gap:5px;align-items:center}
.fdot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.fdot.S{background:var(--win)}.fdot.U{background:var(--draw)}.fdot.N{background:var(--loss)}.fdot.x{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* game rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grow{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.grow:first-child{border-top:0}
.grow.tap{cursor:pointer}.grow.tap:hover{background:var(--surface-2)}
.gdate{font-size:12px;color:var(--muted);line-height:1.25}
.gdate b{display:block;color:var(--fg);font-size:14px;font-weight:600}
.gopp{min-width:0}
.gopp .o{font-weight:600;overflow-wrap:anywhere}
.gopp .m{font-size:12px;color:var(--muted)}
.ha{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-right:6px;vertical-align:1px}
.score{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:66px;text-align:center;border-radius:8px;padding:3px 8px}
.score.S{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.score.N{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.score.U{background:color-mix(in srgb,var(--draw) 18%,transparent);color:var(--draw)}
.score.open{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--accent);border:1px dashed var(--accent)}
.score.time{font-size:17px;color:var(--fg)}
.manual{font-size:10px;color:var(--muted);display:block;font-family:var(--f-body);font-weight:500}

.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 6px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pl{font-weight:700;width:30px;color:var(--muted)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr.me td.l{font-weight:700}
tr.me td.pl{color:var(--accent)}
td.pts{font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:560px;margin:0 auto}
.back{display:flex;align-items:center;gap:8px;padding-block:14px 4px}

/* live */
.scoreboard{background:var(--court);color:#fff;border-radius:16px;padding:18px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
:root[data-theme="dark"] .scoreboard{background:#123247}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scoreboard{background:#123247}}
.sb-team{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.sb-score{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sb-clock{font-size:13px;opacity:.85;margin-top:4px;display:flex;align-items:center;gap:6px;justify-content:center}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.ticker{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev{display:grid;grid-template-columns:48px 1fr 64px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.ev .st{font-family:var(--f-display);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ev.away .txt{text-align:right}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.goal{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.tag.sev{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.miss{background:var(--surface-2);color:var(--muted)}
.tag.pen{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.tag.to{background:var(--surface-2);color:var(--court)}
.tag.info{background:var(--surface-2);color:var(--fg)}
.demo{font-size:12px;color:var(--muted);margin-top:6px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:9px 2px 10px;display:grid;justify-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.livedot{position:relative}
.livedot::after{content:"";position:absolute;top:-1px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--live)}

/* dialog */
.modal{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .45);display:grid;place-items:end center;padding:16px}
.modal .box{background:var(--surface);color:var(--fg);border-radius:16px;padding:18px;width:100%;max-width:420px;margin-bottom:env(safe-area-inset-bottom,0px)}
.modal h3{font-family:var(--f-display);font-size:21px;margin:0 0 4px}
.scorein{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin:14px 0}
.scorein label{font-size:12px;color:var(--muted);display:grid;gap:4px;min-width:0}
.scorein input{font:inherit;font-family:var(--f-display);font-size:30px;font-weight:700;text-align:center;width:100%;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.scorein .c{font-family:var(--f-display);font-size:30px;padding-bottom:8px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--loss);font-size:13px;min-height:18px}
.prose p{margin:0 0 10px;max-width:65ch}
.setlist{display:grid;gap:0}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .k{font-weight:600}
.set .d{font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:2px 0 4px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--win);flex:none}
.status.stale .dot{background:var(--draw)}
.status.err .dot{background:var(--loss)}
.status button{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;font:inherit;font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--live);background:color-mix(in srgb,var(--live) 12%,transparent);border-radius:999px;padding:3px 9px}
.tcard.is-live{border-color:var(--live)}
.score.live{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--live);border:1px solid var(--live)}
.topic{display:flex;gap:8px;align-items:center;margin:10px 0}
.topic code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface-2);border-radius:8px;padding:9px 10px;font-size:14px;user-select:all}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;max-width:65ch}
.sortbtn{border:0;background:none;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;cursor:pointer}
.sortbtn[aria-pressed="true"]{color:var(--accent)}


/* --- v3 additions: favourites, search, league + player views --- */
.star{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font:inherit}
.star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.star.sm{width:34px;height:34px;border-radius:10px}
.star.sm svg{width:17px;height:17px}
.hdr{display:flex;align-items:center;gap:12px;margin-top:8px}
.hdr .grow1{flex:1;min-width:0}
.searchbox{position:relative;margin:4px 0 14px}
.searchbox input{width:100%;font:inherit;font-size:17px;padding:12px 14px 12px 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:2}
.rowlink{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rowlink:first-child{border-top:0}
.rowlink:hover{background:var(--surface-2)}
.rowlink .main{flex:1;min-width:0}
.rowlink .main .k{font-weight:600;overflow-wrap:anywhere}
.rowlink .main .d{font-size:12px;color:var(--muted)}
.rowlink .val{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.rowlink .val small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.match2{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.match2:first-child{border-top:0}
.match2.tap{cursor:pointer}.match2.tap:hover{background:var(--surface-2)}
.match2 .teams{min-width:0;display:grid;gap:2px}
.match2 .teams div{overflow-wrap:anywhere;line-height:1.25}
.match2 .teams .fav{font-weight:700}
.match2 .teams .win{font-weight:700}
.match2 .sc{display:grid;gap:2px;text-align:right;font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;min-width:28px}
.match2 .tm{font-size:12px;color:var(--muted);line-height:1.25}
.match2 .tm b{display:block;color:var(--fg);font-size:14px}
.dayhead{margin:16px 2px 6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 10px 0}
.bars .b{flex:1;min-width:6px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.bars .b.zero{background:var(--line);height:2px!important}
.barlabels{display:flex;gap:4px;padding:4px 10px 8px;font-size:9px;color:var(--muted)}
.barlabels span{flex:1;min-width:6px;text-align:center;overflow:hidden}
.matrix td,.matrix th{padding:6px 5px;text-align:center}
.matrix td.l,.matrix th.l{text-align:left;position:sticky;left:0;background:var(--surface)}
.matrix td.z{color:var(--line)}
.matrix td.hi{font-weight:700;color:var(--accent)}
.tablewrap .me td.l{font-weight:700}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.kv{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
.badgecat{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--court)}
.linkbtn{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.skeleton{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skeleton{animation:none}}
.inline-note{font-size:12px;color:var(--muted);padding:10px 14px}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true">A</div>
    <div class="brand">Anwurf<small>Handball rund um die HSG Wettenberg</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Farbschema wechseln">Auto</button>
  </header>
  <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Lade Daten …</span><button type="button" id="refreshBtn">Aktualisieren</button></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Hauptnavigation"><div class="in">
  <button type="button" data-tab="start" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Favoriten</button>

<script>
// ===================== Anwurf – Handball-App der HSG Wettenberg =====================
// Daten: anwurf/data.json (Ligen, Tabellen, Spielpläne, Spieler-Index), anwurf/live.json (laufende HSG-Spiele),
// anwurf/leagues/<id>.json (Spielberichte + Spielerwerte). Alles erzeugt per GitHub Action aus nuLiga (HHV).
const RAW = "https://raw.githubusercontent.com/cr4M0710/buildspace/main/anwurf/";
const API = "https://api.github.com/repos/cr4M0710/buildspace/contents/anwurf/";
const PUSH_BASE = "hsg-wettenberg-anwurf-79866c71";
const CAT_ORDER = ["Männer","Frauen","Jugend männlich","Jugend weiblich"];

// ---------- storage ----------
const store = {
  get(k,d){ try{ const v=localStorage.getItem("anwurf:"+k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem("anwurf:"+k,JSON.stringify(v)) }catch(e){} },
  has(k){ try{ return localStorage.getItem("anwurf:"+k)!==null }catch(e){ return false } }
};
let DATA = store.get("data3", null);
let LIVE = { games: [] };
const LEAGUES = {};          // id -> league file (reports + players)
const leagueLoading = {};
let favTeams = store.get("favTeams", null);     // ["<lid>|<Team>"]
let favPlayers = store.get("favPlayers", []);   // ["<lid>|<Team>|<Name>"]
let loadState = { ok:null, busy:false };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const attrEsc = esc;
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function parseDate(s){ const [d,t]=s.split("T"); const [y,m,dd]=d.split("-").map(Number); const [h,mi]=(t||"00:00").split(":").map(Number); return new Date(y,m-1,dd,h,mi) }
const pad = n => String(n).padStart(2,"0");
const fmtDay = d => `${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function dayTitle(d){
  const t=new Date(); t.setHours(0,0,0,0); const x=new Date(d); x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/864e5);
  const base=`${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}${d.getFullYear()!==t.getFullYear()?" "+d.getFullYear():""}`;
  return diff===0?`Heute · ${base}`:diff===1?`Morgen · ${base}`:diff===-1?`Gestern · ${base}`:base;
}
const norm = s => String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const slug = s => String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function hue(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%360; return h }
const isHSG = name => /Wettenberg/.test(name||"");
function initials(name){
  const clean=name.replace(/^(HSG|TSG|TSV|TUS|TuS|TV|TG|MSG|SG|JSG|TSF|HC|SV|TSG \d+)\s+/i,"").replace(/\s+(II|III|IV|2|3)$/,"").replace(/\d{4}\s*/,"");
  const parts=clean.split(/[\s/\-.]+/).filter(Boolean);
  const base=parts.length>1?parts[0][0]+parts[1][0]:clean.slice(0,2);
  const suffix=/\sIV$/.test(name)?"4":/\sIII$/.test(name)?"3":/\sII$/.test(name)?"2":"";
  return (base+suffix).toUpperCase().slice(0,3);
}
function badge(name,cls=""){
  const us=isHSG(name);
  const bg=us?"var(--accent)":`hsl(${hue(name)} 40% 42%)`;
  const txt=us?"W"+((/\s(II|III|IV)$/.exec(name)||[])[1]?{II:"2",III:"3",IV:"4"}[(/\s(II|III|IV)$/.exec(name))[1]]:""):initials(name);
  return `<span class="badge ${cls}" style="background:${bg}" aria-hidden="true">${esc(txt)}</span>`;
}
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z"/></svg>';
function starBtn(kind,key,label,sm){
  const on = kind==="team" ? isFavTeam(key) : isFavPlayer(key);
  return `<button type="button" class="star${sm?" sm":""}" data-fav="${kind}" data-key="${attrEsc(key)}" aria-pressed="${on}" aria-label="${on?"Aus Favoriten entfernen":"Als Favorit merken"}: ${attrEsc(label)}">${STAR}</button>`;
}
function ago(d){
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return "gerade eben"; if(m<60) return `vor ${m} Min.`;
  const h=Math.round(m/60); if(h<24) return `vor ${h} Std.`;
  return `am ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
}

// ---------- data access ----------
const leagues = () => (DATA && DATA.leagues) || [];
const leagueById = id => leagues().find(l=>l.id===+id);
const teamKey = (lid,name) => `${lid}|${name}`;
const playerKey = (lid,team,name) => `${lid}|${team}|${name}`;
function shortLeague(l){ return l.name.replace(/^Männer |^Frauen /,"").replace(/ - /g," ").replace(/Bezirksoberliga/,"BOL").replace(/Bezirksklasse/,"BKL").replace(/Bezirksliga/,"BZL") }
function leagueLabel(l){ return `${l.cat==="Männer"||l.cat==="Frauen"?l.cat+" ":""}${l.name.replace(/^(Männer|Frauen)\s+/,"")}` }
function liveFor(lid,n){ return (LIVE.games||[]).find(x=>x.lid===lid && x.n===n) }
function normGames(l){
  const t=Date.now();
  return l.games.map(g=>{
    const date=parseDate(g.d);
    const has=g.gh!=null;
    const past=date.getTime()+100*60000<t;
    const lv=liveFor(l.id,g.n);
    const live=!has && !g.note && ((!!lv && !lv.ended) || (!lv && t>=date.getTime() && !past));
    const prelim=!has && !!lv && !!lv.ended;
    return {...g, lid:l.id, league:l, date, has, past, live, prelim, lv, from:g.fr?parseDate(g.fr):null};
  });
}
function teamGames(lid,name){
  const l=leagueById(lid); if(!l) return [];
  return normGames(l).filter(g=>g.h===name||g.a===name).map(g=>{
    const home=g.h===name;
    const own=home?g.gh:g.ga, opp=home?g.ga:g.gh;
    return {...g, home, opp:home?g.a:g.h, own, oppG:opp, res:g.has?(own>opp?"S":own<opp?"N":"U"):null, team:name};
  });
}
function tableRow(lid,name){ const l=leagueById(lid); if(!l) return null; const i=l.table.findIndex(r=>r[0]===name); return i<0?null:{rank:i+1,row:l.table[i]} }
function allTeams(){
  const out=[];
  leagues().forEach(l=>{
    const names=new Set(l.table.map(r=>r[0])); l.games.forEach(g=>{ names.add(g.h); names.add(g.a) });
    names.forEach(n=>out.push({lid:l.id,name:n,league:l}));
  });
  return out;
}
function hsgTeams(){ return leagues().flatMap(l=>l.hsg.map(h=>({lid:l.id,name:h.team,label:h.label,league:l}))) }
function hsgLabel(lid,name){ const l=leagueById(lid); const h=l&&l.hsg.find(x=>x.team===name); return h?h.label:null }
function teamDisplay(lid,name){ const lab=hsgLabel(lid,name); return lab?`${name}`:name }

// favourites
const isFavTeam = k => (favTeams||[]).includes(k);
const isFavPlayer = k => favPlayers.includes(k);
function toggleFav(kind,key){
  if(kind==="team"){ favTeams=favTeams||[]; favTeams=isFavTeam(key)?favTeams.filter(x=>x!==key):[...favTeams,key]; store.set("favTeams",favTeams) }
  else { favPlayers=isFavPlayer(key)?favPlayers.filter(x=>x!==key):[...favPlayers,key]; store.set("favPlayers",favPlayers) }
}
function ensureDefaultFavs(){
  if(favTeams!==null || !DATA) return;
  favTeams=hsgTeams().filter(h=>/^Männer( II)?$/.test(h.label)).map(h=>teamKey(h.lid,h.name));
  store.set("favTeams",favTeams);
}
const favTeamList = () => (favTeams||[]).map(k=>{ const i=k.indexOf("|"); return {lid:+k.slice(0,i), name:k.slice(i+1)} }).filter(t=>leagueById(t.lid));

// league files
async function loadLeague(lid){
  if(LEAGUES[lid]) return LEAGUES[lid];
  if(leagueLoading[lid]) return leagueLoading[lid];
  leagueLoading[lid]=(async()=>{
    for(const u of [RAW+`leagues/${lid}.json`, `leagues/${lid}.json`]){
      try{ const r=await fetch(u+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"}); if(!r.ok) throw 0; LEAGUES[lid]=await r.json(); break }catch(e){}
    }
    LEAGUES[lid]=LEAGUES[lid]||{reports:{},players:{},missing:true};
    delete leagueLoading[lid];
    refresh();
    return LEAGUES[lid];
  })();
  return leagueLoading[lid];
}
function playerStats(lid,team,name){
  const lf=LEAGUES[lid]; if(!lf||!lf.players) return null;
  const p=lf.players[`${team}|${name}`]; if(!p) return null;
  const l=leagueById(lid); const gm=new Map(normGames(l).map(g=>[g.mid,g]));
  const games=p.g.map(x=>({mid:x[0],goals:x[1],sg:x[2],sa:x[3],y:x[4],two:x[5],dq:x[6],game:gm.get(x[0])})).filter(x=>x.game).sort((a,b)=>a.game.date-b.game.date);
  const sum=k=>games.reduce((s,x)=>s+x[k],0);
  const goals=sum("goals"), sg=sum("sg"), sa=sum("sa");
  return {name, team, no:p.no, lid, games, n:games.length, goals, sg, sa, field:goals-sg, y:sum("y"), two:sum("two"), dq:sum("dq")};
}
function leaguePlayers(lid){
  const lf=LEAGUES[lid]; if(!lf||!lf.players) return [];
  return Object.values(lf.players).map(p=>playerStats(lid,p.t,p.n)).filter(Boolean);
}
function computeTable(lid, mode){
  const l=leagueById(lid); const rows={};
  l.table.forEach(r=>rows[r[0]]={team:r[0],sp:0,s:0,u:0,n:0,gf:0,ga:0,p:0,m:0});
  const done=normGames(l).filter(g=>g.has).sort((a,b)=>a.date-b.date);
  const last={};
  done.forEach(g=>{
    [[g.h,g.gh,g.ga,true],[g.a,g.ga,g.gh,false]].forEach(([t,f,a,home])=>{
      (last[t]=last[t]||[]).push([f,a,home]);
    });
  });
  Object.entries(last).forEach(([t,list])=>{
    let use=list;
    if(mode==="heim") use=list.filter(x=>x[2]);
    if(mode==="auswaerts") use=list.filter(x=>!x[2]);
    if(mode==="form") use=list.slice(-5);
    const r=rows[t]||(rows[t]={team:t,sp:0,s:0,u:0,n:0,gf:0,ga:0,p:0,m:0});
    use.forEach(([f,a])=>{ r.sp++; r.gf+=f; r.ga+=a; if(f>a){r.s++;r.p+=2} else if(f<a){r.n++;r.m+=2} else {r.u++;r.p++;r.m++} });
  });
  return Object.values(rows).sort((a,b)=>b.p-a.p||a.m-b.m||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

// ---------- loading ----------
function anyLiveSoon(){
  const t=Date.now();
  const keys=new Set([...hsgTeams().map(h=>teamKey(h.lid,h.name)), ...(favTeams||[])]);
  return leagues().some(l=>l.games.some(g=>{
    if(g.gh!=null||g.note) return false;
    if(!keys.has(teamKey(l.id,g.h)) && !keys.has(teamKey(l.id,g.a))) return false;
    const s=parseDate(g.d).getTime(); return t>s-30*60000 && t<s+150*60000;
  }));
}
async function fetchJSON(file, preferApi){
  const urls = preferApi ? [API+file+"?ref=main", RAW+file, file] : [RAW+file, file];
  let err;
  for(const u of urls){
    try{
      const api=u.startsWith(API);
      const r=await fetch(api?u:u+"?t="+Date.now(), api?{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"}:{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ err=e }
  }
  throw err||new Error("nicht erreichbar");
}
async function loadData(){
  if(loadState.busy) return; loadState.busy=true; setStatus();
  try{
    const live=anyLiveSoon();
    const d=await fetchJSON("data.json", live);
    if(!d.leagues||!d.leagues.length) throw new Error("leer");
    const changed=!DATA || JSON.stringify(d.leagues)!==JSON.stringify(DATA.leagues) || JSON.stringify(d.players)!==JSON.stringify(DATA.players);
    if(changed){ DATA=d; store.set("data3",d); Object.keys(LEAGUES).forEach(k=>delete LEAGUES[k]) } else DATA.updatedAt=d.updatedAt;
    ensureDefaultFavs();
    if(live || (LIVE.games||[]).length) await loadLive(true);
    loadState={ok:true,busy:false}; setStatus(); if(changed) refresh();
  }catch(e){ loadState={ok:false,busy:false}; setStatus(); if(!DATA) render() }
}
async function loadLive(preferApi){
  try{
    const l=await fetchJSON("live.json", preferApi);
    // keep socket-received events if the file is older than what we already have
    (l.games||[]).forEach(n=>{ const o=(LIVE.games||[]).find(x=>x.lid===n.lid&&x.n===n.n); if(o && (o.lastIdx||0)>(n.lastIdx||0)) Object.assign(n,{events:o.events,score:o.score,lastIdx:o.lastIdx,second:o.second,clock:o.clock,clockAt:o.clockAt,ended:o.ended||n.ended}) });
    const changed=JSON.stringify(l.games)!==JSON.stringify(LIVE.games); LIVE=l||{games:[]}; syncSocket(); if(changed) refresh()
  }catch(e){}
}
// ---------- nuScoreLive: Live-Kanal direkt vom Kampfgericht ----------
const NSL_WS = "wss://hbde-live-websocket.liga.nu/nuScoreLive/socket/1";
const NSL_TYPES = { 2:"Auszeit Heim", 3:"Auszeit Gast", 4:"Tor", 5:"7m mit Tor", 6:"7m ohne Tor", 7:"Eigentor", 8:"2 Minuten", 9:"Verwarnung",
  10:"Disqualifikation mit Bericht", 11:"Disqualifikation", 12:"2 Minuten (Team)", 13:"2 Minuten (Team)", 14:"Halbzeit", 15:"Anpfiff", 16:"Spielende", 17:"Spielbeginn" };
const mmss = sec => `${pad(Math.floor(sec/60))}:${pad(Math.floor(sec%60))}`;
function nslEvent(e, youth){
  const type=NSL_TYPES[e.event]; if(!type) return null;
  const side = e.event===2||e.event===12?"H":e.event===3||e.event===13?"A":e.teamHome===true?"H":e.teamHome===false?"A":"";
  const name = youth?"":[e.personFirstname,e.personLastname].filter(Boolean).join(" ");
  return [side, mmss(e.second||0), `${e.pointsHome??0}:${e.pointsGuest??0}`, type, name, "", e.idx];
}
const sock = { ws:null, uuids:[], state:"aus", retry:null, hb:null, lastMsg:0 };
function liveEntries(){ return (LIVE.games||[]).filter(x=>x.uuid && !x.ended) }
function syncSocket(){
  const uuids=liveEntries().map(x=>x.uuid);
  if(!uuids.length){ if(sock.ws){ try{ sock.ws.onclose=null; sock.ws.close() }catch(e){} } sock.ws=null; sock.state="aus"; sock.uuids=[]; return }
  const send=()=>{ try{ sock.ws.send(JSON.stringify({meetingUuids:uuids})); sock.uuids=uuids }catch(e){} };
  if(sock.ws && sock.ws.readyState===1){ if(uuids.join()!==sock.uuids.join()) send(); return }
  if(sock.ws && sock.ws.readyState===0) return;
  try{
    const ws=new WebSocket(NSL_WS); sock.ws=ws; sock.state="verbinde";
    ws.onopen=()=>{ sock.state="verbunden"; send(); refreshLiveBits() };
    ws.onmessage=m=>{ sock.lastMsg=Date.now(); try{ onLiveMessage(JSON.parse(m.data)) }catch(e){} };
    ws.onerror=()=>{ sock.state="getrennt" };
    ws.onclose=()=>{ sock.state="getrennt"; sock.ws=null; clearTimeout(sock.retry); sock.retry=setTimeout(syncSocket,10000); refreshLiveBits() };
    clearInterval(sock.hb); sock.hb=setInterval(()=>{ if(sock.ws&&sock.ws.readyState===1){ try{ sock.ws.send(JSON.stringify({heartbeat:new Date()})) }catch(e){} } },120000);
  }catch(e){ sock.state="nicht verfügbar" }
}
let liveRenderTimer=null;
function onLiveMessage(c){
  const entry=(LIVE.games||[]).find(x=>String(x.mid)===String(c.meetingID));
  if(!entry) return;
  if(c.type===1 || !c.event){ loadLive(true); return }
  const e=c.event;
  if(e.idx!=null && entry.lastIdx!=null && e.idx<=entry.lastIdx) return;
  if(e.idx!=null && entry.lastIdx!=null && e.idx>entry.lastIdx+1) setTimeout(()=>loadLive(true),3000); // Lücke: Verlauf nachladen
  entry.lastIdx=e.idx!=null?e.idx:entry.lastIdx;
  const l=leagueById(entry.lid);
  const ev=nslEvent(e, l&&l.youth);
  if(e.event===0){ entry.clock="running"; entry.clockAt=Date.now(); entry.second=e.second||entry.second }
  else if(e.event===1){ entry.clock="stopped"; entry.second=e.second||entry.second; entry.clockAt=null }
  else if(e.second!=null){ entry.second=e.second; if(entry.clock==="running") entry.clockAt=Date.now() }
  if(e.pointsHome!=null) entry.score=`${e.pointsHome}:${e.pointsGuest}`;
  if(e.event===14 && !entry.ht) entry.ht=entry.score;
  if(e.event===16){ entry.ended=true; entry.clock="stopped" }
  entry.live=!entry.ended;
  if(ev){ entry.events=(entry.events||[]).concat([ev]); entry.fresh=ev }
  clearTimeout(liveRenderTimer); liveRenderTimer=setTimeout(refresh,250);
}
function liveClock(entry){
  if(!entry) return "";
  let sec=entry.second||0;
  if(entry.clock==="running" && entry.clockAt) sec+= (Date.now()-entry.clockAt)/1000;
  return mmss(Math.min(sec, 3600+600));
}
function refreshLiveBits(){
  document.querySelectorAll("[data-clock]").forEach(el=>{ const [lid,n]=el.dataset.clock.split(":"); const en=liveFor(+lid,+n); if(en) el.textContent=liveClock(en) });
  document.querySelectorAll("[data-sockstate]").forEach(el=>{ el.textContent=sock.state==="verbunden"?"Live-Verbindung zu nuScore aktiv":sock.state==="verbinde"?"Verbinde mit nuScore …":"Live-Verbindung getrennt, Stand alle 90 Sekunden" });
}
setInterval(refreshLiveBits,1000);

function setStatus(){
  const el=$("#status"); if(!el) return;
  const upd=DATA&&DATA.updatedAt?new Date(DATA.updatedAt):null;
  el.className="status"+(loadState.ok===false?" err":(upd&&Date.now()-upd>6*3600e3?" stale":""));
  $("#statusText").textContent = loadState.busy ? "Aktualisiere …" : loadState.ok===false ? `Offline – gespeicherte Daten${upd?" ("+ago(upd)+")":""}` : upd ? `Datenabgleich ${ago(upd)} · nuLiga` : "Lade Daten aus nuLiga …";
}
let pollTimer=null;
function schedulePoll(){
  clearTimeout(pollTimer);
  const live=anyLiveSoon();
  pollTimer=setTimeout(async()=>{ if(document.visibilityState==="visible"){ if(live){ await loadLive(true); if(Date.now()-(new Date(DATA&&DATA.updatedAt||0))>4*60000) await loadData() } else await loadData() } schedulePoll() }, live?90000:10*60000);
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ loadData(); schedulePoll() } });

// ---------- shared rendering ----------
function formDots(lid,name){
  const done=teamGames(lid,name).filter(g=>g.has).slice(-5);
  const dots=done.map(g=>`<span class="fdot ${g.res}" title="${attrEsc(g.opp)} ${g.gh}:${g.ga}">${g.res}</span>`);
  while(dots.length<5) dots.unshift(`<span class="fdot x">–</span>`);
  return `<div class="form" aria-label="Form der letzten fünf Spiele">${dots.join("")}</div>`;
}
function matchRow(g, opts={}){
  const favH=isFavTeam(teamKey(g.lid,g.h))||isHSG(g.h), favA=isFavTeam(teamKey(g.lid,g.a))||isHSG(g.a);
  let sc;
  if(g.has) sc=`<div class="${g.gh>g.ga?"win":""}">${g.gh}</div><div class="${g.ga>g.gh?"win":""}">${g.ga}</div>`;
  else if(g.live) sc=`<span class="score live" style="min-width:0;font-size:13px">${g.lv&&g.lv.score?esc(g.lv.score):"läuft"}</span>${g.lv&&g.lv.src==="nuScore"?`<span class="note" style="margin:0;font-family:var(--f-body);font-weight:600;color:var(--live)" data-clock="${g.lid}:${g.n}">${liveClock(g.lv)}</span>`:""}`;
  else if(g.prelim) sc=`<div>${esc(g.lv.score.split(":")[0])}</div><div>${esc(g.lv.score.split(":")[1])}</div>`;

function groupedByDay(list, opts={}){

function bigrams(s){ const b=new Set(); for(let i=0;i<s.length-1;i++) b.add(s.slice(i,i+2)); return b }
function sim(a,b){ const A=bigrams(a), B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{ if(B.has(x)) n++ }); return 2*n/(A.size+B.size) }
function score(q, hay){
  const toks=q.split(" ").filter(Boolean);
  if(toks.every(t=>hay.includes(t))) return 2 + (hay.startsWith(toks[0])?0.5:0);
  const words=hay.split(" ");
  const s=toks.map(t=>Math.max(...words.map(w=>sim(t,w)))).reduce((a,b)=>a+b,0)/toks.length;
  return s>=0.62?s:0;
}
function searchResults(raw){
  const q=norm(raw);
  if(q.length<2){
    const sug=hsgTeams();
    return `<div class="eyebrow dayhead">Mannschaften der HSG</div><div class="list">${sug.map(t=>teamResult(t.lid,t.name,t.label)).join("")}</div><p class="note">Tipp: Umlaute und Tippfehler sind egal, zum Beispiel „lumdatal“ oder „Drommershausn“.</p>`;
  }
  const teams=allTeams().map(t=>({t,s:score(q,norm(t.name+" "+(hsgLabel(t.lid,t.name)||"")+" "+t.league.cat))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.t.name.localeCompare(b.t.name)).slice(0,25);
  const ls=leagues().map(l=>({l,s:score(q,norm(l.name+" "+l.cat+" "+l.title))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
  const ps=((DATA&&DATA.players)||[]).map(p=>({p,s:score(q,norm(p[0]+" "+p[1]))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||b.p[4]-a.p[4]).slice(0,30);
  if(!teams.length&&!ls.length&&!ps.length) return `<div class="list"><div class="empty">Nichts gefunden für „${esc(raw)}“. Anwurf kennt die Ligen, in denen die HSG Wettenberg spielt.</div></div>`;
  let html="";
  if(teams.length) html+=`<div class="eyebrow dayhead">Mannschaften</div><div class="list">${teams.map(x=>teamResult(x.t.lid,x.t.name)).join("")}</div>`;
  if(ps.length) html+=`<div class="eyebrow dayhead">Spieler</div><div class="list">${ps.map(x=>playerRowLink(x.p)).join("")}</div>`;
  if(ls.length) html+=`<div class="eyebrow dayhead">Ligen</div><div class="list">${ls.map(x=>`<button type="button" class="rowlink" data-open="league" data-lid="${x.l.id}"><div class="main"><div class="k">${esc(x.l.name)}</div><div class="d">${esc(x.l.cat)} · ${x.l.table.length} Teams</div></div><span class="chev">›</span></button>`).join("")}</div>`;
  return html;
}

// team
function teamStats(gs){
  const d=gs.filter(g=>g.has);
  const s={n:d.length,w:0,dr:0,l:0,gf:0,ga:0,hw:0,hn:0,aw:0,an:0,close:0,best:null,worst:null,hgf:0,hga:0,agf:0,aga:0};
  d.forEach(g=>{
    s.gf+=g.own; s.ga+=g.oppG;
    if(g.res==="S")s.w++; else if(g.res==="N")s.l++; else s.dr++;
    if(g.home){s.hn++; s.hgf+=g.own; s.hga+=g.oppG; if(g.res==="S")s.hw++} else {s.an++; s.agf+=g.own; s.aga+=g.oppG; if(g.res==="S")s.aw++}
    if(Math.abs(g.own-g.oppG)<=2)s.close++;
    if(!s.best||g.own-g.oppG>s.best.own-s.best.oppG) s.best=g;
    if(!s.worst||g.own-g.oppG<s.worst.own-s.worst.oppG) s.worst=g;
  });
  s.games=d; return s;
}
function goalsChart(gs){
  if(!gs.length) return `<div class="empty">Noch keine Ergebnisse.</div>`;
  const W=340,H=170,pl=26,pr=8,pt=12,pb=28;
  const max=Math.max(30,...gs.map(g=>Math.max(g.own,g.oppG)));
  const top=Math.ceil(max/10)*10;
  const cw=(W-pl-pr)/gs.length, bw=Math.min(14,cw/2.6);
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let grid="";
  for(let v=0;v<=top;v+=10) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="var(--muted)">${v}</text>`;
  const bars=gs.map((g,i)=>{ const cx=pl+cw*i+cw/2;
    return `<rect x="${cx-bw-1}" y="${y(g.own)}" width="${bw}" height="${y(0)-y(g.own)}" rx="2" fill="var(--accent)"><title>${esc(g.opp)}: ${g.own}</title></rect>
      <rect x="${cx+1}" y="${y(g.oppG)}" width="${bw}" height="${y(0)-y(g.oppG)}" rx="2" fill="var(--muted)" opacity=".55"><title>${esc(g.opp)}: ${g.oppG}</title></rect>
      <circle cx="${cx}" cy="${H-pb+10}" r="2.8" fill="var(--${g.res==="S"?"win":g.res==="N"?"loss":"draw"})"/>
      <text x="${cx}" y="${H-pb+23}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${esc(initials(g.opp))}</text>`; }).join("");
  return `<div class="chart"><div class="legend"><span><i style="background:var(--accent)"></i>Eigene Tore</span><span><i style="background:var(--muted);opacity:.55"></i>Gegentore</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tore pro Spiel">${grid}${bars}</svg></div>`;
}

// match
function evTag(type){
  if(/^7m.*Tor/i.test(type) && !/ohne|kein|verworfen|gehalten/i.test(type)) return ["sev","7m"];
  if(/^7m/i.test(type)) return ["miss","7m"];
  if(/^Tor/i.test(type)) return ["goal","Tor"];
  if(/Eigentor/i.test(type)) return ["goal","Eigentor"];
  if(/Halbzeit|Spielende|Spielbeginn|Anpfiff/i.test(type)) return ["info",type];
  if(/2 ?Min/i.test(type)) return ["pen","2 Min"];
  if(/Disq|Rot|Blau/i.test(type)) return ["pen","Disq."];
  if(/Verwarn|Gelb/i.test(type)) return ["sev","Gelb"];
  if(/Auszeit|Timeout/i.test(type)) return ["to","Auszeit"];
  return ["info","Info"];
}
function eventRows(events, g, newestFirst){
  const list=newestFirst?[...events].reverse():events;
  return list.map(e=>{
    const [cls,lbl]=evTag(e[3]);
    const team=e[0]==="H"?g.h:e[0]==="A"?g.a:"";
    const who=e[4]?`<button type="button" class="linkbtn" data-open="player" data-lid="${g.lid}" data-team="${attrEsc(team)}" data-name="${attrEsc(e[4])}">${esc(e[4])}</button>`:esc(e[3]);
    return `<div class="ev ${e[0]==="A"?"away":""}"><span class="t">${esc(e[1])}</span><span class="txt"><span class="tag ${cls}">${lbl}</span>${who}${team?`<span class="note" style="display:block;margin:0">${esc(team)}</span>`:""}</span><span class="st">${esc(e[2]||"")}</span></div>`;
  }).join("");
}
function leadChart(events, g){
  const pts=[[0,0]];
  events.forEach(e=>{ const m=/(\d+):(\d+)/.exec(e[2]||""), t=/(\d+):(\d+)/.exec(e[1]||""); if(m&&t) pts.push([+t[1]+(+t[2])/60,(+m[1])-(+m[2])]) });
  if(pts.length<3) return "";
  const W=340,H=130,pl=24,pr=8,pt=10,pb=20;
  const tmax=Math.max(60,...pts.map(p=>p[0])), top=Math.ceil(Math.max(4,...pts.map(p=>Math.abs(p[1])))/2)*2;
  const x=t=>pl+(W-pl-pr)*t/tmax, y=v=>pt+(H-pt-pb)*(1-(v+top)/(2*top));
  let path=`M${x(0)},${y(0)}`; pts.forEach(p=>{ path+=`H${x(p[0]).toFixed(1)}V${y(p[1]).toFixed(1)}` }); path+=`H${x(tmax)}`;
  const area=path+`V${y(0)}H${x(0)}Z`;
  let grid=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  [top,-top].forEach(v=>grid+=`<text x="${pl-5}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v>0?"+":""}${v}</text>`);
  [0,30,60].forEach(t=>grid+=`<line x1="${x(t)}" x2="${x(t)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(t)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${t}'</text>`);
  const id="c"+g.lid+"-"+g.n;
  return `<div class="chart"><div class="legend"><span><i style="background:var(--court);opacity:.5"></i>${esc(g.h)} führt</span><span><i style="background:var(--accent);opacity:.5"></i>${esc(g.a)} führt</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spielverlauf, Tordifferenz über die Spielzeit">${grid}
    <clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath>
    <path d="${area}" fill="var(--court)" opacity=".22" clip-path="url(#${id}a)"/><path d="${area}" fill="var(--accent)" opacity=".22" clip-path="url(#${id}b)"/>
    <path d="${path}" fill="none" stroke="var(--fg)" stroke-width="1.6"/></svg></div>`;
}
function liveScorers(ev){
  const acc={home:{},away:{}};
  ev.forEach(e=>{ if(!e[4]||!e[0]) return; const side=e[0]==="H"?"home":"away"; const p=acc[side][e[4]]||(acc[side][e[4]]=["",e[4],0,0,0,0,0,0]);
    if(/^Tor$|^7m mit Tor/.test(e[3])) p[2]++; if(/^7m/.test(e[3])){ p[4]++; if(/mit Tor/.test(e[3])) p[3]++ } if(/^2 Minuten$/.test(e[3])) p[6]++; if(/Verwarnung/.test(e[3])) p[5]=1; if(/Disq/.test(e[3])) p[7]=1 });
  return {home:Object.values(acc.home), away:Object.values(acc.away)};
}
function scorerList(players, team, lid, hl){
  const ps=players.filter(p=>p[2]>0||p[6]>0||p[5]>0||p[7]>0).sort((a,b)=>b[2]-a[2]);
  if(!ps.length) return "";
  return `<div class="list" style="${hl?"border-color:var(--accent)":""}"><div class="set"><div class="k">${esc(team)}</div></div>${ps.map(p=>`<button type="button" class="rowlink" data-open="player" data-lid="${lid}" data-team="${attrEsc(team)}" data-name="${attrEsc(p[1])}"><div class="main"><div class="k">${esc(p[1])}${p[0]?` <span class="note" style="margin:0">#${esc(p[0])}</span>`:""}</div><div class="d">${[p[4]?`7m ${p[3]}/${p[4]}`:"",p[6]?`${p[6]}× 2 Min`:"",p[5]?"Gelb":"",p[7]?"Disq.":""].filter(Boolean).join(" · ")||"&nbsp;"}</div></div><div class="val num">${p[2]}</div></button>`).join("")}</div>`;
}
function sheetMatch(st){
  const l=leagueById(st.lid); if(!l) return `<div class="empty">Spiel nicht gefunden.</div>`;
  const g=normGames(l).find(x=>x.n===st.n); if(!g) return `<div class="empty">Spiel nicht gefunden.</div>`;
  if(!l.youth && !LEAGUES[l.id] && g.mid) loadLeague(l.id);
  const rep=LEAGUES[l.id]&&LEAGUES[l.id].reports?LEAGUES[l.id].reports[g.mid]:null;
  const lv=g.lv;
  const ev = lv&&lv.events&&lv.events.length&&(!rep||!rep.final) ? lv.events : (rep?rep.events:[]);
  if(g.live && lv && lv.uuid) syncSocket();
  const score = g.has?`${g.gh}:${g.ga}`:(lv&&lv.score)||g.note||"–:–";
  const status = g.has?`Endstand${g.ht?" · Halbzeit "+g.ht:""}`
    : g.prelim?`Spielende laut nuScore${lv.ht?" · Halbzeit "+esc(lv.ht):""} · offizielles Ergebnis folgt`
    : g.live?(lv&&lv.src==="nuScore"?`LIVE · <span data-clock="${g.lid}:${g.n}">${liveClock(lv)}</span>${lv.ht?" · HZ "+esc(lv.ht):""}`:"läuft")
    : g.note?"Sonderwertung laut Verband":`${fmtDay(g.date)} · ${fmtTime(g.date)} Uhr`;
  const hl=t=>isFavTeam(teamKey(l.id,t))||isHSG(t);
  let body="";
  if(l.youth) body=`<p class="note">Jugendspiel: Anwurf zeigt hier bewusst nur Ergebnis und Halbzeitstand.</p>`;
  else if(g.mid && !LEAGUES[l.id]) body=`<div class="skeleton" style="margin-top:12px"></div>`;
  else {
    if(ev.length) body+=`<h2>Spielverlauf</h2>${leadChart(ev,g)}`;
    if(rep&&rep.final) body+=`<h2>Torschützen</h2><div style="display:grid;gap:10px">${scorerList(rep.players.home||[],g.h,l.id,hl(g.h))}${scorerList(rep.players.away||[],g.a,l.id,hl(g.a))}</div>`;
    else if(ev.length){ const ls=liveScorers(ev); if(ls.home.length||ls.away.length) body+=`<h2>Torschützen bisher</h2><div style="display:grid;gap:10px">${scorerList(ls.home,g.h,l.id,hl(g.h))}${scorerList(ls.away,g.a,l.id,hl(g.a))}</div>` }
    if(ev.length) body+=`<h2>${g.live?"Liveticker":"Ticker"}</h2>${g.live&&lv&&lv.src==="nuScore"?`<p class="note" data-sockstate>${sock.state==="verbunden"?"Live-Verbindung zu nuScore aktiv":"Verbinde mit nuScore …"}</p>`:""}<div class="ticker">${eventRows(ev,g,g.live||g.prelim)}</div>`;
    else if(g.has||g.live) body+=`<div class="empty" style="margin-top:12px">Für dieses Spiel gibt es noch keinen Spielverlauf. Er erscheint, sobald das Kampfgericht den Spielbericht über nuScore an nuLiga überträgt.</div>`;
  }
  // head-to-head and table context for upcoming games
  let context="";
  if(!g.has && !g.live && !g.prelim){
    const th=tableRow(l.id,g.h), ta=tableRow(l.id,g.a);
    context=`<h2>Vergleich</h2><div class="trow">
      <button type="button" class="cell linkbtn" style="text-decoration:none" data-open="team" data-lid="${l.id}" data-name="${attrEsc(g.h)}"><div class="eyebrow">${esc(g.h)}</div><div class="v">${th?th.rank+". Platz · "+th.row[7]+":"+th.row[8]:"–"}</div>${miniForm(l.id,g.h)}</button>
      <button type="button" class="cell linkbtn" style="text-decoration:none" data-open="team" data-lid="${l.id}" data-name="${attrEsc(g.a)}"><div class="eyebrow">${esc(g.a)}</div><div class="v">${ta?ta.rank+". Platz · "+ta.row[7]+":"+ta.row[8]:"–"}</div>${miniForm(l.id,g.a)}</button></div>`;
    const prevMeet=normGames(l).find(x=>x.has&&((x.h===g.a&&x.a===g.h)||(x.h===g.h&&x.a===g.a)));
    if(prevMeet) context+=`<p class="note">Hinspiel: ${esc(prevMeet.h)} – ${esc(prevMeet.a)} ${prevMeet.gh}:${prevMeet.ga}</p>`;
  }
  return `<div class="scoreboard" style="margin-top:8px">
      <button type="button" class="sb-team linkbtn" style="color:inherit;text-align:center;text-decoration:none" data-open="team" data-lid="${l.id}" data-name="${attrEsc(g.h)}">${esc(g.h)}</button>
      <div><div class="sb-score">${esc(score)}</div><div class="sb-clock">${g.live?'<span class="pulse" aria-hidden="true"></span>':""}${status}</div></div>
      <button type="button" class="sb-team linkbtn" style="color:inherit;text-align:center;text-decoration:none" data-open="team" data-lid="${l.id}" data-name="${attrEsc(g.a)}">${esc(g.a)}</button>
    </div>
    <p class="note"><button type="button" class="linkbtn" data-open="league" data-lid="${l.id}">${esc(l.name)}</button> · Spiel ${g.n} · ${fmtDay(g.date)}${g.date.getFullYear()} ${fmtTime(g.date)} Uhr${g.v?" · "+esc(g.v):""}${g.mv&&g.from?` · verlegt, ursprünglich ${fmtDay(g.from)} ${fmtTime(g.from)} Uhr`:""}</p>
    ${context}${body}
    <p class="note">Quelle: nuLiga, Hessischer Handball-Verband. Alle Angaben ohne Gewähr.</p>`;
}

// ---------- router ----------
let currentTab="start";
const VIEWS={start:viewStart,spiele:viewSpiele,ligen:viewLigen,suche:viewSuche,mehr:viewMehr};
function render(){ $("#view").innerHTML=VIEWS[currentTab](); if(currentTab==="suche") bindSearch() }
function refresh(){ if(currentTab!=="suche") render(); else { const r=$("#results"); if(r) r.innerHTML=searchResults(searchQ) } if(stack.length) renderSheet(false) }
function go(tab){
  currentTab=tab; stack=[]; $("#sheet").hidden=true;
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") });
  render(); try{ window.scrollTo(0,0) }catch(e){}
  if(tab==="suche") setTimeout(()=>{ const q=$("#q"); if(q && !searchQ) q.focus() },50);
}
let searchTimer=null;
function bindSearch(){
  const q=$("#q"); if(!q) return;
  q.addEventListener("input",()=>{ searchQ=q.value; clearTimeout(searchTimer); searchTimer=setTimeout(()=>{ $("#results").innerHTML=searchResults(searchQ) },120) });
}

document.addEventListener("click",e=>{
  const el=e.target.closest("button,a"); if(!el||el.tagName==="A") return;
  const d=el.dataset;
  if(d.tab){ return go(d.tab) }
  if(d.fav){ toggleFav(d.fav,d.key); const on=d.fav==="team"?isFavTeam(d.key):isFavPlayer(d.key); el.setAttribute("aria-pressed",on); if(!stack.length && currentTab!=="suche") render(); return }
  if(d.open){
    if(d.open==="league") return openSheet({type:"league",lid:+d.lid});
    if(d.open==="team") return openSheet({type:"team",lid:+d.lid,name:d.name});
    if(d.open==="player") return openSheet({type:"player",lid:+d.lid,team:d.team,name:d.name});
    if(d.open==="match") return openSheet({type:"match",lid:+d.lid,n:+d.n});
  }
  const top=stack[stack.length-1];
  if(d.ltab&&top){ top.tab=d.ltab; top.team=""; return renderSheet(false) }
  if(d.lmode&&top){ top.mode=d.lmode; return renderSheet(false) }
  if(d.lwhen&&top){ top.when=d.lwhen; return renderSheet(false) }
  if(d.lsort&&top){ top.sort=d.lsort; return renderSheet(false) }
  if(d.kader&&top){ top.kader=d.kader; return renderSheet(false) }
  if(d.ksort&&top){ top.ksort=d.ksort; return renderSheet(false) }
  if(d.spf){ spFilter=d.spf; store.set("spFilter",spFilter); return render() }
  if(d.spw){ spWhen=d.spw; store.set("spWhen",spWhen); return render() }
  if(el.id==="backBtn") return backSheet();
  if(el.id==="closeAll") return closeSheets();
  if(el.id==="refreshBtn"||el.id==="refreshBtn2") return loadData();
  if(d.copy){
    const done=()=>{ el.textContent="Kopiert"; setTimeout(()=>{ el.textContent="Kopieren" },1800) };
    try{ navigator.clipboard.writeText(d.copy).then(done,()=>{}) }catch(err){}
  }
});
document.addEventListener("change",e=>{ if(e.target.id==="teamFilter"){ const top=stack[stack.length-1]; if(top){ top.team=e.target.value; renderSheet(false) } } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && stack.length) backSheet() });

// ---------- theme ----------
const themes=["auto","light","dark"], tLabel={auto:"Auto",light:"Hell",dark:"Dunkel"};
let theme=store.get("theme","auto");
function applyTheme(){ if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",theme); $("#themeBtn").textContent=tLabel[theme] }
$("#themeBtn").onclick=()=>{ theme=themes[(themes.indexOf(theme)+1)%3]; store.set("theme",theme); applyTheme() };
applyTheme();

// ---------- start ----------
ensureDefaultFavs();
render(); setStatus();
loadData().then(()=>{ if(anyLiveSoon()) loadLive(true) });
schedulePoll();
setInterval(()=>{ if(document.visibilityState==="visible"){ setStatus(); if(!stack.length && currentTab!=="suche") render() } }, 60000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
