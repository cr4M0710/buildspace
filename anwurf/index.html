<style>
/* Layout: phone-app shell, sticky header, scrolling content, fixed tab bar at the bottom. Palette from a sports hall: resin-orange accent on court-blue ink. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e8edf1; --fg:#14212b; --muted:#5b6b78; --line:#d6dee5;
  --accent:#e2571c; --accent-ink:#ffffff; --court:#1d4e6e;
  --win:#1f8a4c; --draw:#7b8794; --loss:#c8352d; --live:#d92b2b;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#16222c; --surface-2:#1f2e3a; --fg:#e8eef3; --muted:#93a4b2; --line:#2a3b48;
  --accent:#f0743c; --accent-ink:#1a0e07; --court:#7fb6d8;
  --win:#43b874; --draw:#8d9aa6; --loss:#ee6a5f; --live:#ff5a4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#16222c; --surface-2:#1f2e3a; --fg:#e8eef3; --muted:#93a4b2; --line:#2a3b48;
  --accent:#f0743c; --accent-ink:#1a0e07; --court:#7fb6d8;
  --win:#43b874; --draw:#8d9aa6; --loss:#ee6a5f; --live:#ff5a4f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
.app{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.top .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-weight:600;cursor:pointer}
.iconbtn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:22px 0 10px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* team card */
.cards{display:grid;gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tcard:hover{border-color:var(--court)}
.thead{display:flex;align-items:center;gap:12px}
.badge{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff}
.badge.sm{width:28px;height:28px;font-size:12px}
.tname{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.tleague{font-size:13px;color:var(--muted)}
.rank{margin-left:auto;text-align:right}
.rank b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:800}
.rank span{display:block;font-size:12px;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--surface-2);border-radius:9px;padding:10px 12px;min-width:0}
.cell .v{font-weight:600;font-size:14px}
.cell .s{font-size:12px;color:var(--muted)}
.form{display:flex;gap:5px;align-items:center}
.fdot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.fdot.S{background:var(--win)}.fdot.U{background:var(--draw)}.fdot.N{background:var(--loss)}.fdot.x{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* game rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grow{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.grow:first-child{border-top:0}
.grow.tap{cursor:pointer}.grow.tap:hover{background:var(--surface-2)}
.gdate{font-size:12px;color:var(--muted);line-height:1.25}
.gdate b{display:block;color:var(--fg);font-size:14px;font-weight:600}
.gopp{min-width:0}
.gopp .o{font-weight:600;overflow-wrap:anywhere}
.gopp .m{font-size:12px;color:var(--muted)}
.ha{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-right:6px;vertical-align:1px}
.score{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:66px;text-align:center;border-radius:8px;padding:3px 8px}
.score.S{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.score.N{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.score.U{background:color-mix(in srgb,var(--draw) 18%,transparent);color:var(--draw)}
.score.open{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--accent);border:1px dashed var(--accent)}
.score.time{font-size:17px;color:var(--fg)}
.manual{font-size:10px;color:var(--muted);display:block;font-family:var(--f-body);font-weight:500}

.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 6px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pl{font-weight:700;width:30px;color:var(--muted)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr.me td.l{font-weight:700}
tr.me td.pl{color:var(--accent)}
td.pts{font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:700;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:560px;margin:0 auto}
.back{display:flex;align-items:center;gap:8px;padding-block:14px 4px}

/* live */
.scoreboard{background:var(--court);color:#fff;border-radius:16px;padding:18px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
:root[data-theme="dark"] .scoreboard{background:#123247}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scoreboard{background:#123247}}
.sb-team{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.sb-score{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sb-clock{font-size:13px;opacity:.85;margin-top:4px;display:flex;align-items:center;gap:6px;justify-content:center}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.ticker{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev{display:grid;grid-template-columns:48px 1fr 64px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.ev .st{font-family:var(--f-display);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ev.away .txt{text-align:right}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.goal{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.tag.sev{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.miss{background:var(--surface-2);color:var(--muted)}
.tag.pen{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.tag.to{background:var(--surface-2);color:var(--court)}
.tag.info{background:var(--surface-2);color:var(--fg)}
.demo{font-size:12px;color:var(--muted);margin-top:6px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}

.livedot{position:relative}
.livedot::after{content:"";position:absolute;top:-1px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--live)}

.scorein .c{font-family:var(--f-display);font-size:30px;padding-bottom:8px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--loss);font-size:13px;min-height:18px}
.prose p{margin:0 0 10px;max-width:65ch}
.setlist{display:grid;gap:0}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}

.set .d{font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:2px 0 4px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--win);flex:none}
.status.stale .dot{background:var(--draw)}
.status.err .dot{background:var(--loss)}
.status button{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;font:inherit;font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--live);background:color-mix(in srgb,var(--live) 12%,transparent);border-radius:999px;padding:3px 9px}
.tcard.is-live{border-color:var(--live)}
.score.live{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--live);border:1px solid var(--live)}
.topic{display:flex;gap:8px;align-items:center;margin:10px 0}
.topic code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface-2);border-radius:8px;padding:9px 10px;font-size:14px;user-select:all}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;max-width:65ch}
.sortbtn{border:0;background:none;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;cursor:pointer}
.sortbtn[aria-pressed="true"]{color:var(--accent)}
</style>

const store = {
  get(k,d){ try{ const v=localStorage.getItem("anwurf:"+k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem("anwurf:"+k,JSON.stringify(v)) }catch(e){} }
};
let manual = store.get("manual",{}); // { "m1-5": [own, opp] }
const cached = store.get("data",null);
if(cached && cached.teams && cached.teams.length && new Date(cached.updatedAt) >= new Date(DATA.updatedAt)) DATA = cached;
let loadState = { ok:null, at:null, error:null, busy:false };

async function loadData(){
  if(loadState.busy) return; loadState.busy=true; setStatus();
  let lastErr=null;
  for(const u of dataUrls("data.json")){
    try{
      const isApi=u.startsWith(API);
      const res = await fetch(isApi?u:u + (u.includes("?")?"&":"?") + "t=" + Date.now(), isApi?{ headers:{ Accept:"application/vnd.github.raw+json" }, cache:"no-store" }:{ cache:"no-store" });
      if(!res.ok) throw new Error("HTTP "+res.status);
      const d = await res.json();
      if(!d.teams || !d.teams.length) throw new Error("leere Daten");
      const changed = JSON.stringify(d.teams)!==JSON.stringify(DATA.teams);
      DATA = d; store.set("data", d);
      loadState = { ok:true, at:new Date(), error:null, busy:false };
      setStatus();
      if(REPORTS && changed) loadReports(true); else if(changed) refresh();
      return;
    }catch(e){ lastErr=e }
  }
  loadState = { ok:false, at:new Date(), error:lastErr?lastErr.message:"unbekannt", busy:false };
  setStatus();
}
async function loadReports(force){
  if(REPORTS && !force && Date.now()-reportsAt<5*60000) return REPORTS;
  for(const u of [RAW+"reports.json","reports.json"]){
    try{
      const res=await fetch(u+"?t="+Date.now(),{cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      REPORTS=await res.json(); reportsAt=Date.now(); refresh(); return REPORTS;
    }catch(e){}
  }
  REPORTS=REPORTS||{}; return REPORTS;
}
function fmtAsOf(a){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(a||""); return m?`${m[3]}.${m[2]}.${m[1]}`:(a||"–") }
function ago(d){
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return "gerade eben"; if(m<60) return `vor ${m} Min.`;
  const h=Math.round(m/60); if(h<24) return `vor ${h} Std.`;
  return `am ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`;
}
function setStatus(){
  const el=document.getElementById("status"); if(!el) return;
  const upd = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
  el.className = "status" + (loadState.ok===false?" err":(upd && Date.now()-upd>6*3600e3?" stale":""));
  let t;
  if(loadState.busy) t="Aktualisiere …";
  else if(loadState.ok===false) t=`Offline – zeige gespeicherte Daten${upd?" ("+ago(upd)+")":""}`;
  else t = upd ? `Datenabgleich ${ago(upd)} · nuLiga` : "Daten aus nuLiga";
  document.getElementById("statusText").textContent=t;
}
function anyLiveSoon(){
  const t=Date.now();
  return DATA.teams.some(team=>rawGames(team).some(g=>{ const s=parseDate(g.d).getTime(); return g.gf==null && t>s-30*60000 && t<s+150*60000 }));
}
let pollTimer=null;
function schedulePoll(){
  clearTimeout(pollTimer);
  pollTimer=setTimeout(async()=>{ if(document.visibilityState==="visible") await loadData(); schedulePoll() }, anyLiveSoon()?90000:10*60000);
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ loadData(); schedulePoll() } });

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function parseDate(s){ const [d,t]=s.split("T"); const [y,m,dd]=d.split("-").map(Number); const [h,mi]=t.split(":").map(Number); return new Date(y,m-1,dd,h,mi) }
const fmtDay = d => `${WD[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`;
const fmtTime = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
function hue(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%360; return h }
function initials(name){
  const clean=name.replace(/^(HSG|TSG|TSV|TuS|TV|TG|MSG|SG)\s+/,"").replace(/\s+(II|III)$/,"");
  const parts=clean.split(/[\s/\-.]+/).filter(Boolean);
  const base=parts.length>1?parts[0][0]+parts[1][0]:clean.slice(0,2);
  const suffix=/\sIII$/.test(name)?"3":/\sII$/.test(name)?"2":"";
  return (base+suffix).toUpperCase().slice(0,3);
}
function badge(name,cls=""){
  const isUs=/^Wettenberg|HSG Wettenberg/.test(name);
  const bg=isUs?"var(--accent)":`hsl(${hue(name)} 42% 42%)`;
  return `<span class="badge ${cls}" style="background:${bg}" aria-hidden="true">${esc(isUs?"W"+(/II/.test(name)?"2":""):initials(name))}</span>`;
}

const now = () => new Date();
function rawGames(team){
  return team.games.map(g=>Array.isArray(g)?{r:g[0],d:g[1],ha:g[2],opp:g[3],gf:g[4],ga:g[5]}:g);
}
function liveOf(mid){ return (DATA.live||[]).find(l=>l.mid===mid) }
function games(team){
  return rawGames(team).map(g=>{
    const key=team.id+"-"+(g.mid||g.nr||g.r);
    const d=parseDate(g.d);
    let own=g.gf, opp=g.ga, src="data";
    if(own==null && manual[key]){ [own,opp]=manual[key]; src="manual" }
    const has=own!=null;
    const res=has?(own>opp?"S":own<opp?"N":"U"):null;
    const t=now().getTime();
    const past=d.getTime()+100*60000 < t;
    const live=!has && t>=d.getTime() && !past;
    const lv=g.mid?liveOf(g.mid):null;
    return {key,round:g.r,date:d,home:g.ha==="H",opp:g.opp,own,opp_:opp,has,res,src,past,live:live||(!!lv&&!has),lv,team,
      mid:g.mid||null,ht:g.ht||null,moved:!!g.moved,from:g.from?parseDate(g.from):null,venue:g.venue||null,note:g.note||null};
  });
}
function scoreText(g){ return g.home?`${g.own}:${g.opp_}`:`${g.opp_}:${g.own}` }
function rankOf(team){ const i=team.table.findIndex(r=>r[0]===team.tableName); return i+1 }
function rowOf(team){ return team.table.find(r=>r[0]===team.tableName) }

function teamStats(team){
  const gs=games(team).filter(g=>g.has);
  const s={n:gs.length,w:0,d:0,l:0,gf:0,ga:0,hw:0,hn:0,aw:0,an:0,close:0,best:null};
  gs.forEach(g=>{
    s.gf+=g.own; s.ga+=g.opp_;
    if(g.res==="S")s.w++; else if(g.res==="N")s.l++; else s.d++;
    if(g.home){s.hn++; if(g.res==="S")s.hw++} else {s.an++; if(g.res==="S")s.aw++}
    if(Math.abs(g.own-g.opp_)<=2)s.close++;
    if(!s.best || g.own-g.opp_ > s.best.own-s.best.opp_) s.best=g;
  });
  return {...s,games:gs};
}

// ---------- rendering: rows ----------
function gameRow(g,opts={}){
  let right;
  if(g.has){
    right=`<span class="score ${g.res} num">${scoreText(g)}${g.src==="manual"?'<span class="manual">eigene Eingabe</span>':""}</span>`;
  } else if(g.live){
    right=`<span class="score live">${g.lv&&g.lv.score?esc(g.lv.score):"läuft"}</span>`;
  } else if(g.note){
    right=`<span class="score open" title="Sonderwertung laut Verband">${esc(g.note)}</span>`;
  } else if(g.past){
    right=`<span class="score open">Ergebnis<br>eintragen</span>`;
  } else {
    right=`<span class="score time num">${fmtTime(g.date)}</span>`;
  }
  const enter = !g.has && g.past && !g.note && !g.live;
  const open = !!g.mid && (g.has || g.live || g.note);
  const tap = enter || open;
  const tag = tap ? "button" : "div";
  const moved = g.moved?` · <span title="${g.from?"ursprünglich "+fmtDay(g.from)+" "+fmtTime(g.from):""}">verlegt</span>`:"";
  const who = opts.showTeam?`<span class="m">${esc(g.team.label)} · ${esc(g.team.league)}${moved}</span>`:`<span class="m">${g.round}. Spieltag · ${g.home?"Heim":"Auswärts"}${g.ht?" · HZ "+(g.home?g.ht:g.ht.split(":").reverse().join(":")):""}${moved}</span>`;
  const act = enter?`data-enter="${g.key}" aria-label="Ergebnis gegen ${esc(g.opp)} eintragen"`:open?`data-match="${g.team.id}:${g.mid}" aria-label="Spiel gegen ${esc(g.opp)} öffnen"`:"";
  return `<${tag} class="grow${tap?" tap":""}" ${tap?`type="button" ${act}`:""}>
    <div class="gdate"><b>${fmtDay(g.date)}</b>${g.date.getFullYear()}</div>
    <div class="gopp"><div class="o"><span class="ha">${g.home?"H":"A"}</span>${esc(g.opp)}</div>${who}</div>
    ${right}</${tag}>`;
}
function formDots(team){
  const done=games(team).filter(g=>g.has).slice(-5);
  const dots=done.map(g=>`<span class="fdot ${g.res}" title="${esc(g.opp)} ${scoreText(g)}">${g.res}</span>`);
  while(dots.length<5) dots.unshift(`<span class="fdot x">–</span>`);
  return `<div class="form" aria-label="Form der letzten Spiele">${dots.join("")}</div>`;
}

const live = { running:false, timer:null, t:0, h:0, a:0, events:[], game:null, speed:1 };
function liveGame(){
  const t=DATA.teams[0]; const g=games(t).find(x=>!x.past);
  return { home: g.home?"HSG Wettenberg":g.opp, away: g.home?g.opp:"HSG Wettenberg", usHome:g.home, date:g.date, league:t.league };
}
const SHOOTERS_US=["Becker","Wagner","Schmidt","Hofmann","Klein","Weber"];
const SHOOTERS_THEM=["Neumann","Krause","Braun","Zimmermann","Lang","Fuchs"];
function liveTick(){
  live.t+=15; // 15 seconds of game time per tick
  const m=Math.floor(live.t/60), s=live.t%60;
  const clock=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  if(live.t===30*60){ live.events.unshift({t:clock,type:"info",txt:`Halbzeit ${live.h}:${live.a}`}); }
  else if(live.t>=60*60){ live.events.unshift({t:"60:00",type:"info",txt:`Abpfiff · Endstand ${live.h}:${live.a}`}); stopLive(true); return renderLive(); }
  else {
    const r=Math.random();
    const usHome=live.game.usHome;
    const usSide=Math.random()<0.54; // slight home bias for us
    const homeSide = usHome?usSide:!usSide;
    const names = usSide?SHOOTERS_US:SHOOTERS_THEM;
    const who=names[Math.floor(Math.random()*names.length)];
    const side=homeSide?"home":"away";
    if(r<0.24){ homeSide?live.h++:live.a++; live.events.unshift({t:clock,side,type:"goal",txt:`Tor ${who}`}); }
    else if(r<0.28){ homeSide?live.h++:live.a++; live.events.unshift({t:clock,side,type:"sev",txt:`7m verwandelt · ${who}`}); }
    else if(r<0.295){ live.events.unshift({t:clock,side,type:"miss",txt:`7m gehalten · ${who}`}); }
    else if(r<0.32){ live.events.unshift({t:clock,side,type:"pen",txt:`2 Minuten · ${who}`}); }
    else if(r<0.327){ live.events.unshift({t:clock,side,type:"to",txt:`Team-Auszeit`}); }
  }
  renderLive();
}
function startLive(){
  if(live.running) return;
  if(live.t>=3600 || !live.game){ resetLive(false) }
  live.running=true;
  if(live.t===0) live.events.unshift({t:"00:00",type:"info",txt:"Anwurf"});
  live.timer=setInterval(liveTick, 1000/live.speed);
  renderLive();
}
function stopLive(){ live.running=false; clearInterval(live.timer); live.timer=null }
function resetLive(render=true){ stopLive(); Object.assign(live,{t:0,h:0,a:0,events:[],game:liveGame()}); if(render) renderLive() }
function setSpeed(x){ live.speed=x; if(live.running){ clearInterval(live.timer); live.timer=setInterval(liveTick,1000/x) } renderLive() }

  const evs = live.events.map(e=>{

    return `<div class="ev ${e.side==="away"?"away":""}"><span class="t">${e.t}</span><span class="txt"><span class="tag ${cls}">${lbl}</span>${esc(e.txt)}</span><span class="st">${score}</span></div>`;
  }).join("");
  const all=DATA.teams.flatMap(games);
  const lives=all.filter(x=>x.live);
  const upcoming=all.filter(x=>!x.past&&!x.live).sort((a,b)=>a.date-b.date).slice(0,2);
  const liveBoard = x => {
    const homeName=x.home?x.team.name:x.opp, awayName=x.home?x.opp:x.team.name;
    const ev=(x.lv&&x.lv.events)||[];

// ---------- match reports (nuLiga Spielbericht: Spielverlauf + Torschützen) ----------
function evTag(type){
  if(/^7m.*Tor/i.test(type) && !/ohne|kein|verworfen|gehalten/i.test(type)) return ["sev","7m"];
  if(/^7m/i.test(type)) return ["miss","7m"];
  if(/^Tor/i.test(type)) return ["goal","Tor"];
  if(/2 ?Min/i.test(type)) return ["pen","2 Min"];
  if(/Disq|Rot|Blau/i.test(type)) return ["pen","Disq."];
  if(/Verwarn|Gelb/i.test(type)) return ["sev","Gelb"];
  if(/Auszeit|Timeout/i.test(type)) return ["to","Auszeit"];
  return ["info","Info"];
}
function eventRows(events, homeName, awayName, newestFirst){
  const list = newestFirst ? [...events].reverse() : events;
  return list.map(e=>{
    const [cls,lbl]=evTag(e[3]);
    const side = e[0]==="A"?"away":"";
    const who = e[4] ? esc(e[4]) + (e[5]?` <span class="note" style="margin:0">#${esc(e[5])}</span>`:"") : esc(e[3]);
    const team = e[0]==="H"?homeName:e[0]==="A"?awayName:"";
    return `<div class="ev ${side}"><span class="t">${esc(e[1])}</span><span class="txt"><span class="tag ${cls}">${lbl}</span>${who}${team?`<span class="note" style="display:block;margin:0">${esc(team)}</span>`:""}</span><span class="st">${esc(e[2]||"")}</span></div>`;
  }).join("");
}
function leadChart(events, usHome){
  const pts=[[0,0]];
  events.forEach(e=>{ const m=/(\d+):(\d+)/.exec(e[2]||""); const t=/(\d+):(\d+)/.exec(e[1]||""); if(m&&t){ const d=(+m[1])-(+m[2]); pts.push([+t[1]+(+t[2])/60, usHome?d:-d]) } });
  if(pts.length<3) return "";
  const W=340,H=130,pl=24,pr=8,pt=10,pb=20;
  const tmax=Math.max(60,...pts.map(p=>p[0]));
  const amp=Math.max(4,...pts.map(p=>Math.abs(p[1])));
  const top=Math.ceil(amp/2)*2;
  const x=t=>pl+(W-pl-pr)*t/tmax, y=v=>pt+(H-pt-pb)*(1-(v+top)/(2*top));
  let path=`M${x(0)},${y(0)}`; pts.forEach(p=>{ path+=`H${x(p[0]).toFixed(1)}V${y(p[1]).toFixed(1)}` }); path+=`H${x(tmax)}`;
  const area=path+`V${y(0)}H${x(0)}Z`;
  let grid=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  [top,-top].forEach(v=>grid+=`<text x="${pl-5}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v>0?"+":""}${v}</text>`);
  [0,30,60].forEach(t=>grid+=`<line x1="${x(t)}" x2="${x(t)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(t)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${t}'</text>`);
  return `<div class="chart"><div class="legend"><span><i style="background:var(--win);opacity:.5"></i>Wettenberg führt</span><span><i style="background:var(--loss);opacity:.5"></i>Gegner führt</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spielverlauf, Tordifferenz über die Spielzeit">${grid}
    <clipPath id="above"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="below"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath>
    <path d="${area}" fill="var(--win)" opacity=".18" clip-path="url(#above)"/><path d="${area}" fill="var(--loss)" opacity=".18" clip-path="url(#below)"/>
    <path d="${path}" fill="none" stroke="var(--fg)" stroke-width="1.6"/></svg></div>`;
}
function scorerList(players, title, highlight){
  const ps=players.filter(p=>p[2]>0||p[6]>0||p[5]>0).sort((a,b)=>b[2]-a[2]);
  if(!ps.length) return "";
  return `<div class="list" style="${highlight?"border-color:var(--accent)":""}"><div class="set"><div class="k">${esc(title)}</div></div>${ps.map(p=>`<div class="set"><div><div class="k">${esc(p[1])} <span class="note" style="margin:0">#${esc(p[0])}</span></div><div class="d">${p[4]?`7m ${p[3]}/${p[4]}`:""}${p[6]?`${p[4]?" · ":""}${p[6]}× 2 Min`:""}${p[5]?" · Gelb":""}${p[7]?" · Disq.":""}</div></div><b class="num" style="font-family:var(--f-display);font-size:22px">${p[2]}</b></div>`).join("")}</div>`;
}
function openMatch(teamId, mid){
  const t=DATA.teams.find(x=>x.id===teamId); if(!t) return;

  const status = g.has ? `Endstand${g.ht?" · Halbzeit "+(g.home?g.ht:g.ht.split(":").reverse().join(":")):""}` : g.live ? (lv&&lv.time?`läuft · ${esc(lv.time)}`:"läuft") : g.note ? "Sonderwertung laut Verband" : `${fmtDay(g.date)} · ${fmtTime(g.date)} Uhr`;
  const sh=$("#sheet"), same=!sh.hidden && sh.dataset.match===teamId+":"+mid, keep=same?sh.scrollTop:0;
  $("#sheetInner").innerHTML=`
    <div class="back"><button class="iconbtn" type="button" id="closeSheet" aria-label="Zurück">‹ Zurück</button></div>
    <div class="scoreboard" style="margin-top:8px">
      <div class="sb-team">${esc(homeName)}</div>
      <div><div class="sb-score">${esc(score)}</div><div class="sb-clock">${g.live?'<span class="pulse" aria-hidden="true"></span>':""}${status}</div></div>
      <div class="sb-team">${esc(awayName)}</div>
    </div>
    <p class="note">${esc(t.label)} · ${esc(t.league)} · ${g.round}. Spieltag · ${fmtDay(g.date)}${g.date.getFullYear()} ${fmtTime(g.date)} Uhr${g.venue?" · "+esc(g.venue):""}${g.moved&&g.from?` · verlegt, ursprünglich ${fmtDay(g.from)} ${fmtTime(g.from)} Uhr`:""}</p>
    ${!REPORTS?'<div class="empty">Lade Spielbericht …</div>':""}
    ${ev.length?`<h2>Spielverlauf</h2>${leadChart(ev, g.home)}`:""}
    ${rep?`<h2>Torschützen</h2><div style="display:grid;gap:10px">${scorerList(rep.players[rep.us]||[], t.name, true)}${scorerList(rep.players[rep.us==="home"?"away":"home"]||[], g.opp, false)}</div>`:""}
    ${ev.length?`<h2>Ticker</h2><div class="ticker">${eventRows(ev, homeName, awayName, g.live)}</div>`:(REPORTS&&!g.note?'<div class="empty">Für dieses Spiel gibt es noch keinen Spielverlauf. Er erscheint, sobald das Kampfgericht den Spielbericht in nuLiga überträgt.</div>':"")}
    <p class="note">Quelle: nuLiga, Hessischer Handball-Verband. Alle Angaben ohne Gewähr.</p>`;
  sh.hidden=false; sh.scrollTop=keep; delete sh.dataset.team; sh.dataset.match=teamId+":"+mid;
  if(!same) $("#closeSheet").focus();
  if(!REPORTS) loadReports();
}
function squadStats(team){
  const rows={};
  let n=0;
  games(team).forEach(g=>{
    const rep=g.mid&&REPORTS?REPORTS[String(g.mid)]:null; if(!rep||!rep.final) return; n++;
    (rep.players[rep.us]||[]).forEach(p=>{
      const r=rows[p[1]]||(rows[p[1]]={name:p[1],no:p[0],sp:0,goals:0,sg:0,sa:0,two:0,y:0,dq:0,best:0});
      r.sp++; r.goals+=p[2]; r.sg+=p[3]; r.sa+=p[4]; r.two+=p[6]; r.y+=p[5]; r.dq+=p[7]; r.best=Math.max(r.best,p[2]); r.no=p[0];
    });
  });
  return {n, rows:Object.values(rows).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name))};
}
let squadSort = "goals";
function squadHTML(team){
  if(!REPORTS) return `<div class="empty">Lade Spielberichte …</div>`;
  const sq=squadStats(team);
  if(!sq.rows.length) return `<div class="empty">Noch keine Spielberichte mit Aufstellung.</div>`;
  const key={goals:r=>-r.goals,sp:r=>-r.sp,avg:r=>-(r.goals/r.sp),two:r=>-r.two,name:r=>0}[squadSort]||(r=>-r.goals);
  const rows=[...sq.rows].sort((a,b)=>key(a)-key(b)||a.name.localeCompare(b.name));
  const th=(k,l)=>`<th><button type="button" class="sortbtn" data-sq="${k}" aria-pressed="${squadSort===k}">${l}</button></th>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th class="l">#</th><th class="l">Spieler</th>${th("sp","Sp")}${th("goals","Tore")}${th("avg","Ø")}<th>7m</th>${th("two","2'")}<th>Gelb</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="pl">${esc(r.no)}</td><td class="l">${esc(r.name)}</td><td>${r.sp}</td><td class="pts">${r.goals}</td><td>${(r.goals/r.sp).toFixed(1)}</td><td>${r.sa?`${r.sg}/${r.sa}`:"–"}</td><td>${r.two||"–"}</td><td>${r.y||"–"}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">${sq.n} Spielberichte ausgewertet · Quelle: nuLiga. Spalten antippen zum Sortieren.</p>`;
}
function leagueScorersHTML(team){
  const list=(team.scorers||[]).slice(0,15);
  if(!list.length) return "";
  const us=team.tableName;
  return `<h2>Torschützen der Liga</h2><div class="tablewrap"><table>
    <thead><tr><th class="l">#</th><th class="l">Spieler</th><th class="l">Verein</th><th>Tore</th><th>Sp</th></tr></thead>
    <tbody>${list.map((r,i)=>`<tr class="${r[1]===us?"me":""}"><td class="pl">${i+1}</td><td class="l">${esc(r[0])}</td><td class="l">${esc(r[1])}</td><td class="pts">${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------- team sheet ----------
function chartSVG(st){
  const gs=st.games; if(!gs.length) return `<div class="empty">Noch keine Ergebnisse.</div>`;
  const W=340,H=170,pl=26,pr=8,pt=12,pb=28;
  const max=Math.max(40,...gs.map(g=>Math.max(g.own,g.opp_)));
  const top=Math.ceil(max/10)*10;
  const cw=(W-pl-pr)/gs.length, bw=Math.min(14,cw/2.6);
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let grid="";
  for(let v=0;v<=top;v+=10){ grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="var(--muted)">${v}</text>` }
  const bars=gs.map((g,i)=>{
    const cx=pl+cw*i+cw/2;
    return `<rect x="${cx-bw-1}" y="${y(g.own)}" width="${bw}" height="${y(0)-y(g.own)}" rx="2" fill="var(--accent)"><title>${esc(g.opp)}: ${g.own}</title></rect>
      <rect x="${cx+1}" y="${y(g.opp_)}" width="${bw}" height="${y(0)-y(g.opp_)}" rx="2" fill="var(--muted)" opacity=".55"><title>${esc(g.opp)}: ${g.opp_}</title></rect>
      <text x="${cx}" y="${H-pb+13}" text-anchor="middle" font-size="9" fill="var(--muted)">${g.round}.</text>
      <circle cx="${cx}" cy="${H-pb+22}" r="2.6" fill="var(--${g.res==="S"?"win":g.res==="N"?"loss":"draw"})"/>`;
  }).join("");
  return `<div class="legend"><span><i style="background:var(--accent)"></i>Eigene Tore</span><span><i style="background:var(--muted);opacity:.55"></i>Gegentore</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tore pro Spieltag">${grid}${bars}</svg>`;
}

// ---------- router ----------
let currentTab = "start";
const VIEWS={start:viewStart,spiele:viewSpiele,tabellen:viewTabellen,live:viewLive,mehr:viewMehr};
function render(){ $("#view").innerHTML=VIEWS[currentTab]() }
function refresh(){
  render();
  const sh=$("#sheet"); if(sh.hidden) return;
  if(sh.dataset.team) openTeam(sh.dataset.team);
  else if(sh.dataset.match){ const [tid,mid]=sh.dataset.match.split(":"); openMatch(tid,+mid) }
}
function go(tab){
  currentTab=tab;
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") });
  render(); window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-team]"); if(!el) return;
  if(el.dataset.tab){ closeTeam(); return go(el.dataset.tab) }
  if(el.dataset.team) return openTeam(el.dataset.team);
  if(el.dataset.enter) return openEntry(el.dataset.enter);
  if(el.dataset.match){ const [tid,mid]=el.dataset.match.split(":"); return openMatch(tid,+mid) }
  if(el.dataset.sq){ squadSort=el.dataset.sq; const id=$("#sheet").dataset.team; if(id) openTeam(id); return }
  if(el.dataset.sf){ spieleFilter=el.dataset.sf; store.set("spieleFilter",spieleFilter); return render() }
  if(el.dataset.sw){ spieleWhen=el.dataset.sw; store.set("spieleWhen",spieleWhen); return render() }
  if(el.dataset.tt){ tabTeam=el.dataset.tt; store.set("tabTeam",tabTeam); return render() }
  if(el.id==="closeSheet") return closeTeam();
  if(el.id==="lvStart"){ live.running?stopLive():startLive(); return render() }
  if(el.id==="lvReset") return resetLive();
  if(el.id==="lvSpeed") return setSpeed(live.speed===1?2:live.speed===2?4:1);
  if(el.id==="clearManual"){ manual={}; store.set("manual",manual); return render() }
  if(el.id==="refreshBtn") return loadData();
  if(el.id==="copyTopic"){
    const done=()=>{ el.textContent="Kopiert"; setTimeout(()=>{ el.textContent="Kopieren" },1800) };
    const sel=()=>{ const r=document.createRange(); r.selectNodeContents($("#topicCode")); const s=getSelection(); s.removeAllRanges(); s.addRange(r) };
    try{ navigator.clipboard.writeText(PUSH_TOPIC).then(done,sel) }catch(e){ sel() }
    return;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(!$("#modal").hidden) $("#modal").hidden=true; else if(!$("#sheet").hidden) closeTeam() }
});
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("#modal").hidden=true });

// ---------- theme ----------
const themes=["auto","light","dark"], tLabel={auto:"Auto",light:"Hell",dark:"Dunkel"};
let theme=store.get("theme","auto");
function applyTheme(){ if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",theme); $("#themeBtn").textContent=tLabel[theme] }
$("#themeBtn").onclick=()=>{ theme=themes[(themes.indexOf(theme)+1)%3]; store.set("theme",theme); applyTheme() };
applyTheme();
render();
setStatus();
loadData();
schedulePoll();
setInterval(()=>{ if(document.visibilityState==="visible"){ setStatus(); if(currentTab!=="live"||!live.running) render() } }, 60000);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<script defer data-category="handball" src="../protect.js"></script>
</body>
