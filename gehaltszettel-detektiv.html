<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">

<title>Gehaltszettel-Detektiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#c7d5e6;--panel:#fbfcfe;--text:#17212f;--muted:#4d5b72;--line:#9fb2c9;
  --accent:#2a62c4;--accent-ink:#fff;--mark:#ffe14a;--stamp:#c0352b;
  --ok:#1f7a49;--okbg:#d5eedf;--bad:#b3261e;--badbg:#f9dcd8;--warnbg:#fff1c2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#0e1927;--panel:#16263a;--text:#e7eef8;--muted:#a3b5cc;--line:#34506f;
    --accent:#7db0ff;--accent-ink:#0b1626;--stamp:#ff7a6c;
    --ok:#6fd49b;--okbg:#17402b;--bad:#ff8f84;--badbg:#4a2220;--warnbg:#4a3d12;
  }
}
:root[data-theme="dark"]{
  --desk:#0e1927;--panel:#16263a;--text:#e7eef8;--muted:#a3b5cc;--line:#34506f;
  --accent:#7db0ff;--accent-ink:#0b1626;--stamp:#ff7a6c;
  --ok:#6fd49b;--okbg:#17402b;--bad:#ff8f84;--badbg:#4a2220;--warnbg:#4a3d12;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--desk);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--text);font:17px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;font-weight:800;margin-bottom:14px}
h3{font-size:21px;font-weight:600}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{font-size:15px;color:var(--muted)}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--desk);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 4px;font:800 18px 'Bricolage Grotesque',sans-serif;min-height:44px}
.tr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.lvchip{font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px solid var(--text)}
.score{font-size:15px}
.score b{font-family:'IBM Plex Mono',monospace;font-size:17px}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:2px solid var(--text);background:transparent;font-weight:700}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}

/* Startseite */
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.home section{margin-bottom:38px}
.hero{display:grid;gap:30px;align-items:center;grid-template-columns:1fr;padding-top:10px}
.hero-t .lead{font-size:20px;max-width:34em;margin-top:16px}
.hero-s{position:relative;max-width:340px;justify-self:center;width:100%}
.lupe{position:absolute;right:-14px;bottom:-26px;width:120px;height:120px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.levels{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.lv{text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel);min-height:92px;display:flex;flex-direction:column;gap:4px}
.lv strong{font:800 20px 'Bricolage Grotesque',sans-serif}
.lv span{font-size:15px;color:var(--muted)}
.lv[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent)}
.cases{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.case{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.case .teaser{font-size:17px;color:var(--text);flex:1;margin:0}
.case .st{font-size:20px;letter-spacing:2px;color:var(--text)}
.case .st small{font-size:14px;letter-spacing:0;color:var(--muted);margin-left:8px}
.teach{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.teach summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.teach ul{margin:6px 0 12px;padding-left:20px}
.teach li{margin-bottom:6px}

/* Spielansicht */
.play{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:start}
.desk{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));max-width:100%}
.desk.one{max-width:440px;margin:0 auto;width:100%}
@media (min-width:920px){
  .play{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .play.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .desk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 100px);overflow:auto;padding:6px 6px 24px}
  .desk.one{margin:0;max-width:none}
}

/* Gehaltszettel auf Endlospapier */
.slip{position:relative;background:#eef5e4;color:#18212f;padding:0 32px 18px;border-radius:2px;font-size:14.5px;box-shadow:0 10px 26px rgba(0,0,0,.28);align-self:start}
.slip::before,.slip::after{content:"";position:absolute;top:0;bottom:0;width:22px;background:radial-gradient(circle at 11px 13px,var(--desk) 5px,transparent 5.5px) 0 0/22px 26px repeat-y}
.slip::before{left:0;border-right:1px dashed #a9bf94}
.slip::after{right:0;border-left:1px dashed #a9bf94}
.s-head{padding:16px 6px 10px}
.s-sub{font-size:13px;color:#4a6339}
.s-head h3{font-size:22px;font-weight:800;margin-top:2px}
.s-job{font-size:13.5px;color:#3a4a30}
.rows{display:block}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;width:100%;padding:7px 8px;border:0;background:transparent;text-align:left;color:inherit;font:inherit;margin:0}
.row.z{background:#dcebcd}
.row .l{min-width:0}
.row .n{font-size:12.5px;color:#4a6339}
.row .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right;min-width:7ch}
.row.hdr .v{font-family:inherit;font-weight:700;text-align:right}
.row.strong{font-weight:700}
.row.sub{font-weight:700;border-top:1px solid #8fa87a}
.row.tot{font-weight:700;margin-top:6px;border-top:2px solid #18212f}
.row.tot .v{font-weight:600;border-bottom:4px double #18212f}
.hd{padding:12px 8px 2px;font-weight:700;font-size:14px;color:#3d5a2e}
.q{display:inline-block;min-width:6.5ch;text-align:center;border-bottom:2px dashed #6b8057;color:#51663f;font-weight:700}
button.row.sel{cursor:pointer;border-radius:4px;min-height:44px}
button.row.sel:hover{outline:2px dashed #18212f;outline-offset:-2px}
.row.on{background:var(--mark)!important;box-shadow:inset 0 0 0 2px #18212f;border-radius:4px}
.row.hit{background:#a9e0bd!important;box-shadow:inset 0 0 0 2px #1f7a49;border-radius:4px}
.row.miss{background:#f4b8b1!important;box-shadow:inset 0 0 0 2px #b3261e;border-radius:4px}
.row.focus{outline:3px solid #2a62c4;outline-offset:-3px;border-radius:4px}

/* Aktenvermerk */
.file{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.f-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.f-head h2{font-size:22px;margin:0}
.steps{display:flex;gap:6px}
.steps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text);display:block}
.steps i.d{background:var(--text)}
.steps i.c{background:var(--mark);box-shadow:0 0 0 2px var(--text)}
.f-q .n{font-size:14px;color:var(--muted);margin-bottom:4px}
.f-q h3{font-size:22px;margin-bottom:14px}
.opts{margin:6px 0}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:transparent;margin:8px 0;min-height:52px}
.opt:disabled{opacity:1;cursor:default}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:none}
.opt.bad{border-color:var(--bad);background:var(--badbg);box-shadow:none}
.bx{flex:none;width:22px;height:22px;border:2px solid var(--text);border-radius:5px;margin-top:2px;display:grid;place-items:center;font-size:15px;line-height:1}
.opt.on .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.numrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.numrow input{width:100%;max-width:260px;min-height:52px;padding:0 14px;font:600 22px 'IBM Plex Mono',monospace;border:2px solid var(--text);border-radius:10px;background:transparent;color:var(--text);text-align:right}
.unit{font-size:22px;font-weight:700}
.sl{display:flex;align-items:center;gap:16px;margin:14px 0}
.sl input{flex:1;min-height:44px;accent-color:var(--accent)}
.sl output{font:700 24px 'IBM Plex Mono',monospace;min-width:5ch;text-align:right}
.bank{display:flex;flex-wrap:wrap;gap:2px;min-height:56px;padding:6px;border-radius:10px;background:rgba(127,150,180,.14);margin:8px 0 14px}
.chip{display:inline-block;margin:4px;padding:8px 14px;border-radius:999px;border:2px solid var(--text);background:var(--panel);min-height:44px;font-size:16px}
.chip.pick{background:var(--mark);color:#18212f;box-shadow:0 0 0 3px var(--text)}
.chip.lock{border-color:var(--ok);background:var(--okbg);cursor:default}
.zones{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.zone{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:4px}
.zone.ready{border-color:var(--accent);background:rgba(42,98,196,.08)}
.zhead{background:none;border:0;text-align:left;padding:2px 0;min-height:44px}
.zhead strong{display:block;font:800 18px 'Bricolage Grotesque',sans-serif}
.zhead span{font-size:14px;color:var(--muted)}
.zin{display:flex;flex-wrap:wrap}
.zin .chip{font-size:14.5px;padding:6px 10px;min-height:40px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:700}
.fb:empty{display:none}
.fb.good{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.warn{background:var(--warnbg);color:var(--text)}
.hintbox{margin-top:12px;padding:10px 14px;border-left:6px solid var(--mark);background:rgba(255,225,74,.18);border-radius:6px}
.expl{margin-top:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.f-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.f-act .grow{flex:1}

/* Abschluss */
.end{max-width:760px;margin:0 auto;text-align:center}
.stamp{display:inline-block;margin:26px 0 10px;padding:8px 26px;border:5px double var(--stamp);color:var(--stamp);border-radius:6px;font:800 clamp(34px,8vw,56px) 'Bricolage Grotesque',sans-serif;transform:rotate(-5deg);animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.bigstars{font-size:40px;letter-spacing:6px;margin:6px 0}
.res{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
.res ul{list-style:none;padding:0;margin:8px 0 0}
.res li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.res li:last-child{border-bottom:0}
.res li b{font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.end .f-act{justify-content:center}

/* Spickzettel */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,16,28,.62);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel);color:var(--text);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.ov{align-items:center;padding:20px}.sheet{border-radius:16px}}
.sheet h2{font-size:24px}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:16px}
.sheet th,.sheet td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td.r,.sheet th.r{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.sheet .tt{font-weight:700}

@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
</style>

<script>
(function(){
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const fmtN=(n,d)=>n.toLocaleString('de-DE',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});
const eur=n=>fmtN(n)+' €';
const pctS=n=>n.toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:2})+' %';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Beitragssätze (Arbeitnehmeranteil, vereinfacht, Stand 2026) ---------- */
function calc(p){
  const b=p.brutto;
  const rv=p.rvx!=null?p.rvx:r2(b*.093), kv=r2(b*.0875), pv=r2(b*(p.pvz?.024:.018)), av=r2(b*.013);
  const lst=p.lst, kist=p.kistx!=null?p.kistx:(p.kirche?r2(lst*.09):0);
  const sv=r2(rv+kv+pv+av), st=r2(lst+kist), abz=r2(st+sv), netto=r2(b-abz);
  return {b,rv,kv,pv,av,lst,kist,sv,st,abz,netto,ag:r2(b*.2115),
    rate:{rv:rv/b*100,kv:kv/b*100,pv:pv/b*100,av:av/b*100}};
}
const base={fam:'ledig',konf:'keine',kinder:'keine',klasse:'I'};
const P={
  tom:{...base,name:'Tom Berger',job:'Elektroniker',fam:'verheiratet',alter:34,kinder:'1 Kind',brutto:3000,klasse:'III',lst:52},
  lena:{...base,name:'Lena Berger',job:'Verwaltungsfachangestellte',fam:'verheiratet',alter:33,kinder:'1 Kind',brutto:3000,klasse:'V',lst:640},
  mia:{...base,name:'Mia Yilmaz',job:'Auszubildende, 2. Lehrjahr',alter:19,brutto:1100,lst:0},
  jonas:{...base,name:'Jonas Weber',job:'Mechatroniker',alter:22,brutto:2500,lst:195,showKist:1},
  sven:{...base,name:'Sven Köhler',job:'Mechatroniker',alter:35,konf:'evangelisch',brutto:2500,lst:195,pvz:1,kirche:1,showKist:1},
  nina1:{...base,name:'Nina Paulus',tag:'vorher',job:'Mediengestalterin, bisheriges Gehalt',alter:30,brutto:3000,lst:290,pvz:1},
  nina2:{...base,name:'Nina Paulus',tag:'nachher',job:'Mediengestalterin, mit Gehaltserhöhung',alter:30,brutto:3200,lst:345,pvz:1},
  kraftOK:{...base,name:'Dieter Kraft',job:'Lagerleiter',alter:40,brutto:3500,lst:430,pvz:1},
  kraft1:{...base,name:'Dieter Kraft',job:'Lagerleiter',alter:40,brutto:3500,lst:430,pvz:1,rvx:651},
  kraft2:{...base,name:'Dieter Kraft',job:'Lagerleiter',alter:40,brutto:3500,klasse:'III',lst:52,pvz:1,rvx:651},
  kraft3:{...base,name:'Dieter Kraft',job:'Lagerleiter',alter:40,brutto:3500,klasse:'III',lst:52,pvz:1,rvx:651,showKist:1,kistx:4.68}
};
const C=k=>calc(P[k]);

/* ---------- Begriffe zum Sortieren ---------- */
const CAT={
  brutto:{n:'Brutto',d:'Lohn vor allen Abzügen'},
  steuer:{n:'Steuern',d:'geht an den Staat'},
  sv:{n:'Sozialabgaben',d:'geht an die Versicherungen'},
  netto:{n:'Netto',d:'kommt aufs Konto'},
  ag:{n:'Nur Arbeitgeber',d:'zahlt die Firma zusätzlich'}
};
const BANK={
  1:[['Bruttolohn','brutto'],['Lohnsteuer','steuer'],['Rentenversicherung','sv'],['Krankenversicherung','sv'],['Auszahlungsbetrag','netto'],['Arbeitslosenversicherung','sv'],['Pflegeversicherung','sv'],['Nettolohn','netto']],
  2:[['Lohnsteuer','steuer'],['Kirchensteuer','steuer'],['Pflegeversicherung','sv'],['Krankenversicherung','sv'],['Unfallversicherung','ag'],['Bruttolohn','brutto'],['Auszahlungsbetrag','netto'],['Rentenversicherung','sv'],['Solidaritätszuschlag','steuer'],['Arbeitgeberanteil Krankenversicherung','ag']]
};
const CATSBY={1:['brutto','steuer','sv','netto'],2:['brutto','steuer','sv','netto','ag']};
const ROWLABEL={klasse:'Steuerklasse',konf:'Konfession',lst:'Lohnsteuer',kist:'Kirchensteuer',rv:'Rentenversicherung',kv:'Krankenversicherung',pv:'Pflegeversicherung',av:'Arbeitslosenversicherung',netto:'Auszahlungsbetrag'};

/* ---------- Aufgaben-Bausteine ---------- */
const O=(ok,...bad)=>[{t:ok,ok:true},...bad.map(t=>({t,ok:false}))];
const MC=(q,opts,expl,hint)=>({type:'mc',q,opts,expl,hint});
const MULTI=(q,opts,expl,hint)=>({type:'multi',q,opts:opts.map(a=>({t:a[0],ok:!!a[1]})),expl,hint});
const NUM=(q,ans,o)=>Object.assign({type:'num',q,ans,tol:.01,unit:'€'},o||{});
const SPOT=(q,ok,rows,o)=>Object.assign({type:'spot',q,ok,rows},o||{});
const SLIDE=(q,ans,tol,o)=>Object.assign({type:'slider',q,ans,tol,min:0,max:100,unit:'%'},o||{});
const HID=(pk,keys)=>(keys||['rv','kv','pv','av','svsum','abz','netto']).map(k=>pk+':'+k);
const SORT=(l,i)=>{
  const b=BANK[l],n=b.length,need=CATSBY[l].length;
  let items=b.filter((_,k)=>k!==(i*3)%n&&k!==(i*3+4)%n);
  if(new Set(items.map(x=>x[1])).size<need)items=b.slice();
  return {type:'sort',q:'Ordne die Begriffe vom Gehaltszettel zu.',items,cats:CATSBY[l],

function startCase(id){
  const cs=CASES.find(c=>c.id===id);
  S.cs=cs;S.tasks=cs.build(S.level,CASES.indexOf(cs));S.i=0;S.pts=0;S.log=[];
  S.hidden=new Set(cs.hide(S.level));
  initTask();S.view='play';render();window.scrollTo(0,0);
}
function initTask(){
  const t=cur();
  S.t={wrong:0,hintShown:false,status:'open',msg:'',cls:'',sel:new Set(),res:{},pick:null,place:{},lock:{},val:'',mc:null,multi:new Set(),opts:null,items:null,pts:0};
  if(t.type==='mc'||t.type==='multi')S.t.opts=shuffle(t.opts);
  if(t.type==='sort')S.t.items=shuffle(t.items.map((x,k)=>({id:k,t:x[0],c:x[1]})));
  if(t.type==='slider')S.t.val=Math.round((t.min+t.max)/2);
}

  R.push({k:'klasse',l:'Steuerklasse',v:p.klasse,hdr:1});
  R.push({k:'fam',l:'Familienstand',v:p.fam,hdr:1});
  R.push({k:'konf',l:'Konfession',v:p.konf,hdr:1});
  R.push({k:'alter',l:'Alter, Kinder',v:p.alter+' Jahre, '+p.kinder,hdr:1});
  R.push({k:'brutto',l:'Bruttolohn',v:c.b,strong:1});
  R.push({h:'Steuern'});
  R.push({k:'lst',l:'Lohnsteuer',v:c.lst});
  if(p.showKist)R.push({k:'kist',l:'Kirchensteuer',v:c.kist});
  R.push({h:'Sozialabgaben'});
  R.push({k:'rv',l:'Rentenversicherung',v:c.rv,rate:c.rate.rv});
  R.push({k:'kv',l:'Krankenversicherung',v:c.kv,rate:c.rate.kv});
  R.push({k:'pv',l:'Pflegeversicherung',v:c.pv,rate:c.rate.pv});
  R.push({k:'av',l:'Arbeitslosenversicherung',v:c.av,rate:c.rate.av});
  R.push({k:'svsum',l:'Summe Sozialabgaben',v:c.sv,sub:1});

  R.push({k:'netto',l:'Auszahlungsbetrag (Netto)',v:c.netto,tot:1});
  return R;
}
function slipHTML(pk,o){
  o=o||{};

  let z=0,out='';
  for(const r of rowsFor(pk)){
    if(r.h){out+=`<div class="hd">${r.h}</div>`;continue}

    const val=typeof r.v==='string'?r.v:(hidden?'<span class="q" aria-label="verdeckt">?</span>':fmtN(r.v));
    const note=(o.rates&&r.rate!=null&&!hidden)?`<span class="n">${pctS(r.rate)}</span>`:'<span class="n"></span>';
    const can=selectable.includes(r.k);
    let cls='row'+(z%2?'':' z')+(r.tot?' tot':'')+(r.strong?' strong':'')+(r.sub?' sub':'')+(r.hdr?' hdr':'')+(can?' sel':'')+(sel.has(r.k)?' on':'')+(res[r.k]?' '+res[r.k]:'')+(focus.includes(pk+':'+r.k)?' focus':'');
    const inner=`<span class="l">${r.l}</span>${note}<span class="v">${val}</span>`;

}

/* ---------- Prüfen ---------- */
function parseNum(v){
  let s=String(v).trim().replace(/[€%\s]/g,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function fb(msg,cls){S.t.msg=msg;S.t.cls=cls||'';upd()}
function unitFmt(t,v){return t.unit==='%'?fmtN(v,Math.abs(v*10-Math.round(v*10))<1e-6?1:2)+' %':eur(v)}
function wrong(msg){S.t.wrong++;fb(msg+(S.t.wrong>=2?' Du kannst dir auch die Lösung zeigen lassen.':''),'bad')}
function finish(status,msg){
  const t=cur(),s=S.t;
  s.status=status;
  const pts=status==='shown'?0:Math.max(1,3-s.wrong-(s.hintShown?1:0));
  s.pts=pts;S.pts+=pts;S.log.push({q:t.q.replace(/<[^>]+>/g,''),pts,status});
  (t.rev||[]).forEach(k=>S.hidden.delete(k));
  if(t.type==='spot'){s.sel=new Set(t.ok);s.res={};t.ok.forEach(k=>{s.res[k]='hit'})}
  if(t.type==='sort'){s.items.forEach(x=>{s.place[x.id]=x.c;s.lock[x.id]=true});s.pick=null}
  if(t.type==='slider')s.val=Math.round(t.ans);
  s.msg=msg||(status==='shown'?'Hier ist die Lösung. Lies die Erklärung, dann geht es weiter.':`Richtig! ${pts} von 3 Punkten.`);
  s.cls=status==='shown'?'warn':'good';
  upd();
}
function check(){
  const t=cur(),s=S.t;if(s.status!=='open')return;
  if(t.type==='mc'){
    if(s.mc==null)return fb('Wähle zuerst eine Antwort.','warn');
    return s.opts[s.mc].ok?finish('done'):wrong('Das stimmt leider nicht.');
  }
  if(t.type==='multi'){
    if(!s.multi.size)return fb('Kreuze mindestens eine Aussage an.','warn');
    let bad=0;s.opts.forEach((o,k)=>{if(o.ok!==s.multi.has(k))bad++});
    return bad===0?finish('done'):wrong(bad===1?'Eine Antwort ist noch nicht richtig.':bad+' Antworten sind noch nicht richtig.');
  }
  if(t.type==='num'){
    const v=parseNum(s.val);
    if(isNaN(v))return fb('Bitte gib eine Zahl ein, zum Beispiel 1.234,56.','warn');
    if(Math.abs(v-t.ans)<=t.tol+1e-9)return finish('done');
    const d=(t.diag||[]).find(x=>Math.abs(x.v-v)<=.011);
    if(d)return wrong(d.msg);
    return wrong(v>t.ans?'Noch nicht ganz. Deine Zahl ist zu groß.':'Noch nicht ganz. Deine Zahl ist zu klein.');
  }
  if(t.type==='slider'){
    return Math.abs(s.val-t.ans)<=t.tol?finish('done'):wrong(s.val>t.ans?'Das ist zu viel. Schätze noch einmal.':'Das ist zu wenig. Schätze noch einmal.');
  }
  if(t.type==='spot'){
    const need=t.ok.length;
    if(s.sel.size!==need)return fb(need===1?'Markiere genau eine Zeile.':'Markiere genau '+need+' Stellen.','warn');
    const good=[...s.sel].every(k=>t.ok.includes(k));
    if(good)return finish('done');
    s.res={};[...s.sel].forEach(k=>{if(!t.ok.includes(k))s.res[k]='miss'});
    return wrong('Mindestens eine Markierung stimmt nicht (rot).');
  }
  if(t.type==='sort'){
    const open=s.items.filter(x=>s.place[x.id]==null);
    if(open.length)return fb('Ordne zuerst alle Begriffe zu.','warn');
    let w=0;
    s.items.forEach(x=>{if(s.place[x.id]===x.c)s.lock[x.id]=true;else{delete s.place[x.id];w++}});
    if(!w)return finish('done');
    return wrong((w===1?'Ein Begriff lag':w+' Begriffe lagen')+' falsch und '+(w===1?'ist':'sind')+' zurück auf dem Stapel.');
  }
}
function solve(){
  const t=cur(),s=S.t;if(s.status!=='open')return;
  let m='';
  if(t.type==='num')m='Die Lösung ist '+unitFmt(t,t.ans)+'.';
  else if(t.type==='slider')m='Die Lösung liegt bei etwa '+fmtN(t.ans,0)+' %.';
  else if(t.type==='mc')m='Die richtige Antwort ist grün markiert.';
  else if(t.type==='multi')m='Die richtigen Aussagen sind grün markiert.';
  else if(t.type==='spot')m='Richtig wäre: '+t.ok.map(k=>ROWLABEL[k]).join(', ')+'.';
  else if(t.type==='sort')m='Alle Begriffe liegen jetzt am richtigen Platz.';
  finish('shown',m);
}
function next(){
  if(S.i<S.tasks.length-1){S.i++;initTask();upd();scrollToFile()}
  else{
    const max=S.tasks.length*3,pct=S.pts/max;
    saveBest(S.cs.id+':'+S.level,{pct,pts:S.pts,max,stars:starsOf(pct)});
    S.view='end';render();window.scrollTo(0,0);
  }
}
function scrollToFile(){
  const el=$('#file');if(!el)return;
  if(window.innerWidth<920)el.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'start'});
}

/* ---------- Ansichten ---------- */
const MAG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>';
function topHTML(){
  return `<header class="top"><button type="button" class="brand" data-act="home" aria-label="Zur Übersicht">${MAG}<span>Gehaltszettel-Detektiv</span></button><div class="tr">${S.view==='play'?`<span class="lvchip">${LV[S.level].n}</span><span class="score">Punkte <b id="score">${S.pts}</b></span>`:''}<button type="button" class="btn sm" data-act="spick">Spickzettel</button></div></header>`;
}
function homeHTML(){
  const best=loadBest();
  const lupe='<svg class="lupe" viewBox="0 0 120 120" aria-hidden="true"><circle cx="48" cy="48" r="34" fill="rgba(255,225,74,.28)" stroke="#18212f" stroke-width="7"/><path d="M73 73l36 36" stroke="#18212f" stroke-width="12" stroke-linecap="round"/></svg>';
  return `${topHTML()}<main class="home">
  <section class="hero"><div class="hero-t"><h1>Gehaltszettel-Detektiv</h1><p class="lead">Wo bleibt das Geld zwischen Brutto und Netto? Löse fünf Fälle, indem du die Abzüge auf echten Gehaltszetteln aufspürst: ordnen, rechnen, vergleichen und Fehler finden.</p></div>
  <div class="hero-s" aria-hidden="true">${slipHTML('mia',{hidden:new Set(['mia:netto','mia:abz']),focus:['mia:netto']})}${lupe}</div></section>
  <section><h2>Stufe wählen</h2><div class="levels" role="radiogroup" aria-label="Stufe">${[1,2,3].map(l=>`<button type="button" class="lv" role="radio" aria-checked="${S.level===l}" data-act="lv" data-l="${l}"><strong>${LV[l].n}</strong><span>${LV[l].d}</span></button>`).join('')}</div></section>
  <section><h2>Die Fälle</h2><div class="cases">${CASES.map(c=>{
    const b=best[c.id+':'+S.level];
    return `<button type="button" class="case" data-act="case" data-id="${c.id}"><h3>${c.title}</h3><p class="teaser">„${c.teaser}“</p><span class="st" aria-label="${b?b.stars+' von 3 Sternen':'noch nicht gespielt'}">${b?starStr(b.stars)+'<small>'+b.pts+' von '+b.max+' Punkten</small>':'☆☆☆<small>noch offen</small>'}</span></button>`}).join('')}</div></section>
  <details class="teach"><summary>Hinweise für Lehrkräfte</summary>
   <ul>
    <li>Jeder Fall hat auf jeder Stufe 5 bis 7 Aufgaben (ca. 10 Minuten). Aufgabentypen: Begriffe zuordnen, Zahlen berechnen, Zeilen auf dem Zettel markieren, Schätzen, Einfach- und Mehrfachauswahl.</li>
    <li>Punkte: höchstens 3 pro Aufgabe. Jeder Fehlversuch und der Tipp kosten je einen Punkt, mindestens 1 Punkt bei richtiger Lösung. Nach zwei Fehlversuchen kann die Lösung gezeigt werden.</li>
    <li>Alle Beträge sind vereinfachte Beispielwerte für den Unterricht (Stand 2026, gerundet). Die Lohnsteuer ist aus Tabellenwerten gerundet, der Solidaritätszuschlag entfällt, Beitragsbemessungsgrenzen bleiben unberücksichtigt. Das ist keine Steuerberatung.</li>
    <li>Arbeitnehmeranteile: Rentenversicherung 9,3 %, Krankenversicherung 8,75 % (inkl. durchschnittlichem Zusatzbeitrag), Pflegeversicherung 1,8 % (Kinderlose ab 23: 2,4 %), Arbeitslosenversicherung 1,3 %. Kirchensteuer in Hessen: 9 % der Lohnsteuer.</li>
    <li>Der Spielstand wird nur lokal im Browser gespeichert. <button type="button" class="btn sm" data-act="reset">Spielstände löschen</button></li>
   </ul></details></main>`;
}
function playHTML(){
  const two=slipsOf(S.cs).length>1;
  return `${topHTML()}<main class="play${two?' two':''}"><div class="desk${two?'':' one'}" id="desk">${slipsHTML()}</div><section class="file" id="file" aria-label="Aufgabe">${fileHTML()}</section></main>`;
}
function endHTML(){
  const max=S.tasks.length*3,pct=S.pts/max,st=starsOf(pct),solved=pct>=.55;
  const idx=CASES.indexOf(S.cs),nx=CASES[(idx+1)%CASES.length];
  return `${topHTML()}<main><div class="end"><div class="stamp" role="img" aria-label="${solved?'Fall gelöst':'Fall noch offen'}">${solved?'Fall gelöst':'Fall offen'}</div>
  <div class="bigstars" aria-label="${st} von 3 Sternen">${starStr(st)}</div>
  <p><b>${S.pts} von ${max} Punkten</b> · Stufe ${LV[S.level].n}</p>
  <div class="res"><h3>Ermittlungsergebnis</h3><p style="margin-top:8px">${S.cs.outro}</p></div>
  <div class="res"><h3>Deine Aufgaben</h3><ul>${S.log.map(x=>`<li><span>${x.q.length>90?x.q.slice(0,88)+'…':x.q}</span><b>${x.status==='shown'?'Lösung':x.pts+' P.'}</b></li>`).join('')}</ul></div>
  <div class="f-act"><button type="button" class="btn" data-act="retry">Fall nochmal</button><button type="button" class="btn pri" data-act="nextcase" data-id="${nx.id}">Nächster Fall: ${nx.title}</button><button type="button" class="btn" data-act="home">Zur Übersicht</button></div></div></main>`;
}
function spickHTML(){
  return `<div class="ov" data-act="closesp"><div class="sheet" role="dialog" aria-modal="true" aria-label="Spickzettel" data-stop="1">
  <h2>Spickzettel</h2><p class="small">Vereinfachte Werte für den Unterricht, Stand 2026.</p>
  <table><thead><tr><th>Das zahlt der Arbeitnehmer</th><th class="r">vom Brutto</th></tr></thead><tbody>
   <tr><td>Rentenversicherung</td><td class="r">9,3 %</td></tr>
   <tr><td>Krankenversicherung<br><span class="small">7,3 % plus Hälfte des Zusatzbeitrags</span></td><td class="r">8,75 %</td></tr>
   <tr><td>Pflegeversicherung<br><span class="small">Kinderlose ab 23 Jahren: 2,4 %</span></td><td class="r">1,8 %</td></tr>
   <tr><td>Arbeitslosenversicherung</td><td class="r">1,3 %</td></tr>
   <tr><td class="tt">Summe Sozialabgaben</td><td class="r tt">21,15 %<br><span class="small">kinderlos ab 23: 21,75 %</span></td></tr></tbody></table>
  <table><tbody>
   <tr><td>Kirchensteuer (Hessen)</td><td class="r">9 % der Lohnsteuer</td></tr>
   <tr><td>Solidaritätszuschlag</td><td class="r">bei diesen Gehältern 0 €</td></tr>
   <tr><td>Arbeitgeber zahlt zusätzlich</td><td class="r">21,15 % vom Brutto</td></tr>
   <tr><td>Unfallversicherung</td><td class="r">zahlt nur der Arbeitgeber</td></tr></tbody></table>
  <p><b>Merksatz:</b> Netto = Brutto − Steuern − Sozialabgaben</p>
  <p class="small"><b>Steuerklassen:</b> I ledig · II alleinerziehend · III und V Ehepaare (III: höherer Verdiener, V: der andere) · IV Ehepaare mit ähnlichem Einkommen · VI zweiter Job</p>
  <div class="f-act"><button type="button" class="btn pri" data-act="closesp">Schließen</button></div></div></div>`;
}
function render(){
  $('#app').innerHTML=S.view==='home'?homeHTML():S.view==='play'?playHTML():endHTML();
}
function upd(){
  if(S.view!=='play')return;
  const d=$('#desk'),f=$('#file'),sc=$('#score');
  if(d)d.innerHTML=slipsHTML();
  if(f)f.innerHTML=fileHTML();
  if(sc)sc.textContent=S.pts;
}
function renderSpick(){$('#ov').innerHTML=S.spick?spickHTML():''}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,t=S.view==='play'?cur():null,s=S.t;
  if(a==='closesp'){
    if(el.classList.contains('ov')&&e.target!==el)return;
    S.spick=false;renderSpick();return;
  }
  switch(a){
    case 'spick':S.spick=true;renderSpick();break;
    case 'home':S.view='home';render();window.scrollTo(0,0);break;
    case 'lv':S.level=+el.dataset.l;render();break;
    case 'case':startCase(el.dataset.id);break;
    case 'nextcase':startCase(el.dataset.id);break;
    case 'retry':startCase(S.cs.id);break;
    case 'reset':clearBest();render();break;
    case 'mc':if(s.status==='open'){s.mc=+el.dataset.k;s.msg='';s.cls='';upd()}break;
    case 'mm':if(s.status==='open'){const k=+el.dataset.k;s.multi.has(k)?s.multi.delete(k):s.multi.add(k);s.msg='';s.cls='';upd()}break;
    case 'chip':if(s.status==='open'){const id=+el.dataset.id;s.pick=s.pick===id?null:id;upd()}break;
    case 'zone':if(s.status==='open'&&s.pick!=null){s.place[s.pick]=el.dataset.c;s.pick=null;s.msg='';s.cls='';upd()}break;
    case 'unplace':if(s.status==='open'){delete s.place[+el.dataset.id];upd()}break;
    case 'row':if(t&&s.status==='open'){
      const k=el.dataset.k;
      if(t.ok.length===1){s.sel=s.sel.has(k)?new Set():new Set([k])}
      else{s.sel.has(k)?s.sel.delete(k):s.sel.add(k)}
      s.res={};s.msg='';s.cls='';upd();
    }break;
    case 'hint':if(s.status==='open'){s.hintShown=true;upd()}break;
    case 'check':check();break;
    case 'solve':solve();break;
    case 'next':next();break;
  }
});
document.addEventListener('input',e=>{
  if(S.view!=='play')return;
  if(e.target.id==='ans'){S.t.val=e.target.value;if(S.t.msg){S.t.msg='';S.t.cls='';const f=$('.fb');if(f){f.textContent='';f.className='fb'}}}
  if(e.target.id==='sld'){S.t.val=+e.target.value;const o=$('#sldo');if(o)o.textContent=S.t.val+' %'}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();check()}
  if(e.key==='Escape'&&S.spick){S.spick=false;renderSpick()}
});

render();
if(window.__GZD_TEST)window.__gzd={S,CASES,P,calc,startCase,check,solve,next,render,parseNum};
})();
</script>
<script defer data-category="schule" src="protect.js"></script>
</body>
</html>
