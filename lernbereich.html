<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernbereich</title>
<style>
  :root{
    --bg:#f6f4ef;
    --panel:#ffffff;
    --ink:#211f2c;
    --ink-soft:#6b6878;
    --border:#e6e2d8;
    --primary:#4a3fe0;
    --primary-soft:#eeecfd;
    --accent:#0e9488;
    --accent-soft:#e2f5f2;
    --warn:#c8890a;
    --warn-soft:#fbf0dc;
    --danger:#c9382e;
    --danger-soft:#fbe9e7;
    --radius:14px;
    --shadow:0 1px 2px rgba(30,25,60,.05), 0 8px 24px -12px rgba(30,25,60,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    line-height:1.45;
  }
  h1,h2,h3{margin:0 0 .3em; letter-spacing:-.01em;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  .shell{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;margin-bottom:16px;}
  .brand .dot{width:11px;height:11px;border-radius:4px;background:linear-gradient(135deg,var(--primary),var(--accent));display:inline-block;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
  .muted{color:var(--ink-soft);}
  .small{font-size:.85rem;}

  .btn{appearance:none;border:1px solid transparent;border-radius:10px;padding:11px 16px;font-size:.95rem;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .05s ease, opacity .15s;background:var(--primary-soft);color:var(--primary);}
  .btn:hover{opacity:.85;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:.78rem;border-radius:8px;}

  input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;text-align:center;font-family:inherit;background:#fffefc;color:var(--ink);}
  input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  label{display:block;font-weight:650;font-size:.85rem;margin:0 0 8px;color:var(--ink-soft);}

  .msg{padding:10px 13px;border-radius:10px;font-size:.86rem;margin-top:12px;}
  .msg-error{background:var(--danger-soft);color:var(--danger);}

  .who-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .who-bar button{background:none;border:none;color:var(--primary);text-decoration:underline;cursor:pointer;font:inherit;padding:0;font-size:.85rem;}
  .pseudonym-pill{font-weight:800;font-size:1.05rem;background:var(--primary-soft);color:var(--primary);padding:5px 14px;border-radius:999px;}

  .project-card{margin-bottom:16px;}
  .project-card h3{margin-bottom:4px;}
  .project-desc{color:var(--ink-soft);font-size:.9rem;margin-bottom:14px;}

  .task-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .task-item:last-child{border-bottom:none;}
  .task-title{flex:1;}
  .status-select{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.85rem;font-family:inherit;background:#fffefc;text-transform:none;letter-spacing:normal;}
  .status-select.status-offen{color:#777;}
  .status-select.status-in_arbeit{color:var(--warn);border-color:var(--warn);}
  .status-select.status-fertig{color:var(--accent);border-color:var(--accent);}

  .empty-hint{color:var(--ink-soft);font-size:.92rem;padding:10px 4px;}

  .richtext-content{line-height:1.5;font-size:.92rem;}
  .richtext-content h3{font-size:1rem;margin:.5em 0 .2em;}
  .richtext-content ul,.richtext-content ol{margin:.3em 0;padding-left:1.3em;}
  .richtext-content p{margin:.4em 0;}

  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:5px 12px;font-size:.8rem;text-decoration:none;}
  a.chip{cursor:pointer;}
  .chip button{border:none;background:none;color:inherit;cursor:pointer;font-size:.9em;padding:0;line-height:1;}

  .task-submission{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .task-submission label{margin-top:0;}
  .task-submission textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.88rem;font-family:inherit;min-height:70px;background:#fffefc;color:var(--ink);}
  .task-item{display:block;padding:14px 0;border-bottom:1px solid var(--border);}
  .task-item:last-child{border-bottom:none;}
  .task-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
</style>
<script defer src="richtext.js"></script>
</head>
<body>

<div class="shell">
  <div class="brand"><span class="dot"></span> Lernbereich</div>

  <div id="view-code" class="card">
    <h2>Zugang mit Code</h2>
    <p class="muted small">Gib deinen persönlichen Zugangscode ein, den du von deiner Lehrkraft bekommen hast.</p>
    <label for="codeInput" style="margin-top:14px">Zugangscode</label>
    <input type="text" id="codeInput" maxlength="6" placeholder="Z. B. AB3XQ9" autocomplete="off" autocapitalize="characters">
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="submitCode()">Weiter</button>
    <div id="codeMsg"></div>
  </div>

  <div id="view-loading" class="card hidden">
    <p class="muted">Lädt…</p>
  </div>

  <div id="view-tasks" class="hidden">
    <div class="who-bar">
      <span class="pseudonym-pill" id="pseudonymPill"></span>
      <button type="button" onclick="logoutLearner()">Anderer Zugangscode</button>
    </div>
    <div id="projectsWrap"></div>
  </div>
</div>

<script>
/* =========================================================================
   LERNBEREICH (für Schüler:innen)
   -------------------------------------------------------------------------
   Kein eigenes Konto nötig: Der individuelle Zugangscode (von der Lehrkraft
   in kurse-projekte.html vergeben) IST der Schlüssel -- er entspricht
   direkt der Firestore-Dokument-ID in der Sammlung "students" (dasselbe
   "Sicherheit durch Unerratbarkeit"-Modell wie beim bestehenden
   Team-Kanban-Tool, siehe dortiger Code-Mechanismus). Es werden nur
   Kürzel/Pseudonyme angezeigt, niemals Klarnamen.

   Der Code kann entweder eingetippt werden oder über einen Link mit
   ?code=XXXXXX direkt übernommen werden (siehe "Link kopieren" in
   kurse-projekte.html).

   BEWUSST OHNE protect.js/data-category: Andere Werkzeug-Seiten dieser
   Website verlangen zusätzlich das allgemeine Seiten-Kennwort (Voll-/
   Kolleg:innen-/Gast-Zugang), bevor überhaupt etwas sichtbar wird (siehe
   guard() in protect.js). Für den Lernbereich soll ausdrücklich NUR der
   individuelle Zugangscode die Hürde sein -- ein zusätzliches, Schüler:
   innen unbekanntes Seiten-Kennwort würde genau das verhindern, wofür
   dieses Tool gedacht ist. Feedback-/Bestenlisten-Widget und
   Installations-Banner (die protect.js sonst mitbringt) fehlen hier
   deshalb bewusst. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAt35KpU63iGk8UAX5X4T5Vj18zPf_JUus",
  authDomain: "kanban-board-281da.firebaseapp.com",
  projectId: "kanban-board-281da",
  storageBucket: "kanban-board-281da.firebasestorage.app",
  messagingSenderId: "210909884248",
  appId: "1:210909884248:web:10ffacb3a74f7b3c887f2d"
};
const CODE_KEY = "lernbereich_code";
/* E-Mail-Adresse für Datei-Abgaben (siehe submissionMailtoLink()) --
   Cloud Storage würde in diesem Firebase-Projekt ein kostenpflichtiges
   Upgrade (Blaze-Tarif) voraussetzen, das Marc nicht möchte. Stattdessen
   öffnet der "Datei abgeben"-Knopf unten einen mailto:-Link, der auf
   Schulgeräten automatisch im IServ-Mailprogramm landet (dort als
   Standard-Mailprogramm hinterlegt). Aktuell nur für eine einzelne
   Lehrkraft gedacht -- bei mehreren Lehrkräften müsste die Empfänger-
   Adresse pro Klasse/Projekt konfigurierbar werden (ähnlich ADMIN_EMAILS
   in cm-auth.js). */
const TEACHER_EMAIL = "marc.stroh@ggl-wettenberg.de";

let db = null;
let studentDoc = null; // { code, pseudonym, classId, ownerUid }
let projects = [];

function esc(s) {
  return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function ensureFirebase() {
  if (window.firebase && (firebase.apps || []).length) return Promise.resolve();
  return loadScript("https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js")
    .then(() =>
      loadScript("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js")
    )
    .then(() => {
      firebase.initializeApp(FIREBASE_CONFIG);
    });
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function boot() {
  const params = new URLSearchParams(location.search);
  const codeFromLink = (params.get("code") || "").trim().toUpperCase();
  let storedCode = "";
  try { storedCode = localStorage.getItem(CODE_KEY) || ""; } catch (e) {}
  const code = codeFromLink || storedCode;
  if (code) {
    document.getElementById("codeInput").value = code;
    tryCode(code);
  }
}
function submitCode() {
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  if (!code) return;
  tryCode(code);
}
function tryCode(code) {
  const msg = document.getElementById("codeMsg");
  msg.innerHTML = "";
  document.getElementById("view-code").classList.add("hidden");
  document.getElementById("view-loading").classList.remove("hidden");
  ensureFirebase()
    .then(() => {
      db = firebase.firestore();
      return db.collection("students").doc(code).get();
    })
    .then((snap) => {
      if (!snap.exists) {
        document.getElementById("view-loading").classList.add("hidden");
        document.getElementById("view-code").classList.remove("hidden");
        msg.innerHTML = '<div class="msg msg-error">Diesen Zugangscode gibt es nicht. Bitte prüfen und erneut versuchen.</div>';
        return;
      }
      studentDoc = { code, ...snap.data() };
      try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
      document.getElementById("pseudonymPill").textContent = studentDoc.pseudonym;
      loadProjects();
    })
    .catch((err) => {
      document.getElementById("view-loading").classList.add("hidden");
      document.getElementById("view-code").classList.remove("hidden");
      msg.innerHTML = `<div class="msg msg-error">Fehler beim Laden (${esc(err.message)}). Bitte erneut versuchen.</div>`;
    });
}
function logoutLearner() {
  try { localStorage.removeItem(CODE_KEY); } catch (e) {}
  studentDoc = null;
  document.getElementById("codeInput").value = "";
  document.getElementById("view-tasks").classList.add("hidden");
  document.getElementById("view-loading").classList.add("hidden");
  document.getElementById("view-code").classList.remove("hidden");
}

function loadProjects() {
  /* WICHTIG: nach "published" filtern, NICHT nach "classId" -- die
     Firestore-Regel für "projects" erlaubt Lesezugriff ohne Anmeldung nur
     für resource.data.published == true. Firestore muss bei einer Liste-
     Abfrage beweisen können, dass ALLE potenziell passenden Dokumente die
     Regel erfüllen; bei "classId == X" allein wären auch unveröffentlichte
     Entwürfe derselben Klasse im potenziellen Ergebnis, die die Regel NICHT
     erfüllen -- die gesamte Abfrage würde dann mit "Missing or insufficient
     permissions" abgelehnt, obwohl passende veröffentlichte Projekte
     existieren (das war genau der hier aufgetretene Fehler). Mit
     "published == true" als Server-Filter kann Firestore das dagegen für
     jedes Dokument im Ergebnis beweisen. classId wird stattdessen im
     Browser gefiltert -- weiterhin nur EIN Gleichheits-where auf
     Server-Seite, wie an anderer Stelle in diesem Projekt etabliert. */
  db.collection("projects").where("published", "==", true).get()
    .then((snap) => {
      /* Ein Projekt bleibt nur bis zum optionalen "sichtbar bis"-Zeitpunkt
         sichtbar (siehe kurse-projekte.html isProjectVisibleNow()) -- danach
         verschwindet es hier automatisch, auch wenn "published" in der
         Datenbank weiterhin true ist. */
      projects = snap.docs
        .map((d) => ({ id: d.id, ...d.data() }))
        .filter((p) => p.classId === studentDoc.classId && (!p.visibleUntil || Date.now() < p.visibleUntil))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      return loadProgress();
    })
    .then((progressByTaskId) => {
      document.getElementById("view-loading").classList.add("hidden");
      document.getElementById("view-tasks").classList.remove("hidden");
      renderProjects(progressByTaskId);
    })
    .catch((err) => {
      document.getElementById("view-loading").classList.add("hidden");
      document.getElementById("view-tasks").classList.remove("hidden");
      document.getElementById("projectsWrap").innerHTML =
        `<div class="msg msg-error">Aufgaben konnten nicht geladen werden (${esc(err.message)}).</div>`;
    });
}
/* WICHTIG: bewusst OHNE where("code", "==", ...)-Listenabfrage. Die
   Firestore-Regel für "taskProgress" erlaubt ohne Anmeldung nur einzelne
   Dokument-Abrufe über die (aus Code + Aufgaben-ID zusammengesetzte,
   schwer erratbare) Dokument-ID -- "list" bleibt dort bewusst der
   Lehrkraft vorbehalten (siehe Regeln), sonst könnte man durch eine leere
   oder beliebig gefilterte Listenabfrage den gesamten Fortschritt aller
   Klassen/Schulen abgreifen und darüber sogar an fremde Zugangscodes
   gelangen. Stattdessen wird pro sichtbarer Aufgabe gezielt genau das eine
   erwartete Dokument (Code_AufgabenID) einzeln abgerufen -- das ist ein
   "get", kein "list", und dafür ist der Zugriff ausdrücklich offen. */
function loadProgress() {
  const taskIds = [];
  projects.forEach((p) => (p.tasks || []).forEach((t) => taskIds.push(t.id)));
  return Promise.all(
    taskIds.map((taskId) =>
      db.collection("taskProgress").doc(studentDoc.code + "_" + taskId).get()
        .then((snap) => ({ taskId, data: snap.exists ? snap.data() : null }))
    )
  ).then((results) => {
    const map = {};
    results.forEach((r) => { if (r.data) map[r.taskId] = r.data; });
    return map;
  });
}
function renderProjects(progressByTaskId) {
  const wrap = document.getElementById("projectsWrap");
  if (!projects.length) {
    wrap.innerHTML = '<p class="empty-hint">Für dich sind aktuell keine Projekte freigegeben. Frag gerne deine Lehrkraft.</p>';
    return;
  }
  wrap.innerHTML = projects.map((p) => `
    <div class="card project-card">
      <h3>${esc(p.title)}</h3>
      ${p.description ? `<div class="richtext-content project-desc">${RichText.sanitize(p.description)}</div>` : ""}
      ${(p.tasks || []).length ? (p.tasks || []).map((t) => renderTaskItem(t, progressByTaskId[t.id])).join("") : '<p class="empty-hint">Noch keine Aufgaben in diesem Projekt.</p>'}
    </div>
  `).join("");
}
/* Eine einzelne Aufgabe: Status, ausführliche (formatierte) Beschreibung,
   Links der Lehrkraft zum Anklicken/Herunterladen, sowie die eigene
   Abgabe (Text + optional eine Datei per E-Mail) der/des Lernenden.
   BEWUSST OHNE Datei-Upload zur Website: siehe Kommentar bei
   TEACHER_EMAIL/submissionMailtoLink() weiter oben. */
function renderTaskItem(t, entry) {
  const statusLabel = { offen: "Offen", in_arbeit: "In Arbeit", fertig: "Fertig" };
  const status = (entry && entry.status) || "offen";
  const links = t.links || [];
  const subText = (entry && entry.submissionText) || "";
  return `
    <div class="task-item">
      <div class="task-head">
        <span class="task-title">${esc(t.title)}</span>
        <select class="status-select status-${status}" onchange="updateStatus('${t.id}', this)">
          ${Object.keys(statusLabel).map((s) => `<option value="${s}" ${s === status ? "selected" : ""}>${statusLabel[s]}</option>`).join("")}
        </select>
      </div>
      ${t.description ? `<div class="richtext-content">${RichText.sanitize(t.description)}</div>` : ""}
      ${links.length ? `<div class="chip-list">${links.map((l) => `<a class="chip" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(l.label)}</a>`).join("")}</div>` : ""}
      <div class="task-submission">
        <label>Deine Abgabe</label>
        <textarea id="subText-${t.id}" placeholder="Text zur Bearbeitung dieser Aufgabe…">${esc(subText)}</textarea>
        <div class="row" style="margin-top:8px;gap:8px">
          <a class="btn btn-sm" href="${esc(submissionMailtoLink(t))}">✉️ Datei per Mail abgeben</a>
          <button class="btn btn-primary btn-sm" type="button" onclick="saveSubmissionText('${t.id}')">Text speichern</button>
        </div>
        <p class="muted small" style="margin:6px 0 0">Öffnet dein Mailprogramm (z. B. IServ) mit ${esc(TEACHER_EMAIL)} als Empfänger. Bitte deine Datei dort noch selbst anhängen, bevor du die Mail abschickst.</p>
        <div id="subMsg-${t.id}"></div>
      </div>
    </div>
  `;
}
/* Baut einen mailto:-Link für die Datei-Abgabe zu einer Aufgabe. mailto:
   kann aus Sicherheitsgründen nie selbst eine Datei anhängen -- das muss
   die/der Lernende im geöffneten Mailprogramm noch von Hand tun. Betreff
   und Text enthalten Pseudonym und Zugangscode, damit die Lehrkraft die
   Abgabe zuordnen kann. */
function submissionMailtoLink(t) {
  const subject = `Abgabe: ${t.title} (${studentDoc.pseudonym})`;
  const body = `Hallo,\n\nanbei meine Abgabe zur Aufgabe "${t.title}".\n\nBitte hier noch die Datei anhängen, bevor die Mail abgeschickt wird.\n\nPseudonym: ${studentDoc.pseudonym}\nZugangscode: ${studentDoc.code}`;
  return `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function updateStatus(taskId, selectEl) {
  const status = selectEl.value;
  selectEl.className = "status-select status-" + status;
  const docId = studentDoc.code + "_" + taskId;
  db.collection("taskProgress").doc(docId).set({
    code: studentDoc.code,
    ownerUid: studentDoc.ownerUid,
    taskId,
    status,
    updatedAt: Date.now()
  }, { merge: true }).catch((err) => {
    alert("Speichern fehlgeschlagen: " + (err && err.message));
  });
}
function saveSubmissionText(taskId) {
  const textarea = document.getElementById("subText-" + taskId);
  const msg = document.getElementById("subMsg-" + taskId);
  const docId = studentDoc.code + "_" + taskId;
  db.collection("taskProgress").doc(docId).set({
    code: studentDoc.code,
    ownerUid: studentDoc.ownerUid,
    taskId,
    submissionText: textarea.value,
    updatedAt: Date.now()
  }, { merge: true })
    .then(() => { if (msg) { msg.innerHTML = '<div class="msg" style="background:var(--accent-soft);color:var(--accent)">Gespeichert.</div>'; setTimeout(() => { if (msg) msg.innerHTML = ""; }, 2000); } })
    .catch((err) => { if (msg) msg.innerHTML = `<div class="msg msg-error">Speichern fehlgeschlagen (${esc(err.message)}).</div>`; });
}
boot();
</script>
</body>
</html>
