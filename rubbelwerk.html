<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<title>Rubbelwerk</title>
<meta name="description" content="Digitale Rubbelkarten bauen: Lösungswörter, gestufte Tipps, Quiz, Auswahlkarten, Rubbellose und Zufallsaufgaben – als Link, QR-Code oder Druckbogen.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="buildspace">
<meta property="og:title" content="Rubbelwerk – buildspace">
<meta property="og:description" content="Digitale Rubbelkarten für den Unterricht – teilen per Link, QR-Code oder Druckbogen.">
<meta property="og:url" content="https://buildspaceos.de/rubbelwerk.html">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("myhome_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<link rel="stylesheet" href="assets/fonts/atkinson-hyperlegible.css"><link rel="stylesheet" href="assets/fonts/dela-gothic-one.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: Werkbank links (Karten + Formular), Vorschau-Los rechts; Spieler-Ansicht = ein Los mittig */
:root{
  --bg:#E8ECF2; --bg2:#DCE2EB; --panel:#FFFFFF; --panel2:#F3F5F9; --ink:#141B2B; --soft:#55617A; --line:#D2D9E4;
  --acc:#C9450C; --acc-ink:#FFFFFF; --acc-soft:#FDE9DD;
  --ok:#1C7A4B; --ok-soft:#DFF3E8; --bad:#BF2536; --bad-soft:#FBE5E8;
  --ticket:#FFFFFF; --ticket-edge:#E8ECF2; --perf:#C5CDD9;
  --shadow:0 1px 2px rgba(20,27,43,.07),0 12px 32px -14px rgba(20,27,43,.30);
  --f-d:"Dela Gothic One","Arial Black",Impact,system-ui,sans-serif;
  --f-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; --r-sm:11px;
}
:root[data-theme="dark"]{
  --bg:#0E1219; --bg2:#141A24; --panel:#191F2C; --panel2:#202839; --ink:#E9EDF5; --soft:#9AA5BB; --line:#2B3548;
  --acc:#FF7D3F; --acc-ink:#1B0D05; --acc-soft:#3A2015;
  --ok:#4CC98A; --ok-soft:#163427; --bad:#FF7482; --bad-soft:#3A1B21;
  --ticket:#1E2533; --ticket-edge:#0E1219; --perf:#3A4559;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme]){
  --bg:#0E1219; --bg2:#141A24; --panel:#191F2C; --panel2:#202839; --ink:#E9EDF5; --soft:#9AA5BB; --line:#2B3548;
  --acc:#FF7D3F; --acc-ink:#1B0D05; --acc-soft:#3A2015; --ok:#4CC98A; --ok-soft:#163427; --bad:#FF7482; --bad-soft:#3A1B21;
  --ticket:#1E2533; --ticket-edge:#0E1219; --perf:#3A4559; color-scheme:dark; } }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-b);-webkit-text-size-adjust:100%;
  padding:max(76px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 96px max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(circle at 1px 1px,var(--bg2) 1px,transparent 1.5px);background-size:22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);transition:transform .15s cubic-bezier(.3,1.4,.5,1),background .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Kopf */
.top{max-width:1320px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{width:52px;height:52px;border-radius:14px;flex:none;position:relative;overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(135deg,#c9ced6,#f4f6f9 35%,#a9b0bb 55%,#e6e9ee 75%,#b8bec8)}
.brand-mark::after{content:"";position:absolute;inset:0;background:var(--acc);clip-path:polygon(0 100%,0 62%,22% 52%,40% 66%,62% 44%,100% 30%,100% 100%)}
.brand h1{font:400 30px/1 var(--f-d);letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--soft);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Studio */
.studio{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.studio{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.setbar{padding:16px 18px 6px;display:grid;gap:12px}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setrow input[type=text]{flex:1 1 220px}

/* Kartenleiste */
.cards{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 14px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:46px;max-width:220px;padding:6px 14px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left}
.chip .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:400 14px var(--f-d);background:var(--panel);border:1px solid var(--line);flex:none}
.chip .l{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.chip .l b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .l span{font-size:12px;color:var(--soft)}
.chip.on{border-color:var(--acc);background:var(--acc-soft)}
.chip.on .n{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.add{padding:6px 16px;font-weight:700;color:var(--acc);border-style:dashed;background:transparent}
.cardtools{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px;border-bottom:1px solid var(--line)}

/* Formular */
.editor{padding:16px 18px 20px;display:grid;gap:16px}
.typebadge{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.typebadge .tb{font:400 13px var(--f-d);letter-spacing:.02em;padding:5px 12px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.f{display:grid;gap:6px;min-width:0}
.f > label,.f > .lab{font-weight:700;font-size:15px}
.f .help{font-size:13.5px;color:var(--soft);margin:0}
.inp,textarea.inp,select.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel2)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rows{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row .inp{flex:1 1 auto;min-width:0}
.row .num{flex:0 0 84px;width:84px}
.row .lv{flex:0 0 74px;width:74px}
.tog{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-size:15px}
.tog input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog input:checked{background:var(--acc)}
.tog input:checked::after{transform:translateX(18px)}
.mark{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);white-space:nowrap;min-height:44px;cursor:pointer}
.mark input{width:20px;height:20px;accent-color:var(--ok)}
details.opts{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2)}
details.opts > summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px}
details.opts > summary::-webkit-details-marker{display:none}
details.opts > summary::after{content:"+";font:400 20px var(--f-d);color:var(--soft)}
details.opts[open] > summary::after{content:"–"}
details.opts .in{padding:4px 16px 16px;display:grid;gap:16px}
.foils{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:56px;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.sw span{position:absolute;left:0;right:0;bottom:-20px;font-size:11px;color:var(--soft);text-align:center}
.foilwrap{padding-bottom:18px}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
.imgprev{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--line);display:block}

/* Vorschau */
.preview-pane{position:sticky;top:16px}
@media (max-width:940px){.preview-pane{position:static}}
.pv{padding:22px 18px 26px;background:var(--bg);border-radius:0 0 var(--r) var(--r);background-image:radial-gradient(circle at 1px 1px,var(--bg2) 1px,transparent 1.5px);background-size:22px 22px}

/* Los (Karte) */
.player{max-width:620px;margin:0 auto;display:grid;gap:14px}
.set-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.set-h h1{font:400 clamp(20px,4vw,26px)/1.15 var(--f-d)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:400 15px var(--f-d);cursor:pointer;position:relative}
.nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav button.ok::after{content:"";position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.nav button[disabled]{opacity:.4;cursor:not-allowed}
.ticket{position:relative;background:var(--ticket);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px 24px;display:grid;gap:14px;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px dashed var(--perf)}
.t-type{font:400 13px var(--f-d);letter-spacing:.04em;color:var(--acc);text-transform:uppercase}
.t-no{font:600 12.5px var(--f-m);color:var(--soft);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.t-title{font:400 clamp(22px,4.6vw,30px)/1.12 var(--f-d);letter-spacing:-.01em}
.t-text{margin:0;font-size:18px;line-height:1.5;color:var(--ink)}
.t-msg{min-height:0;font-weight:700;font-size:16px}
.t-msg:empty{display:none}
.t-msg.ok{color:var(--ok)} .t-msg.bad{color:var(--bad)} .t-msg.info{color:var(--soft)}
.t-note{background:var(--acc-soft);border-radius:14px;padding:14px 16px;font-size:17px;animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
.t-note b{display:block;font:400 13px var(--f-d);letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.t-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.counter{font:700 14px var(--f-b);color:var(--soft);font-variant-numeric:tabular-nums}
.counter b{color:var(--ink)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .38s}

/* Codesperre */
.lockbox{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.lockbox .lt{display:flex;align-items:center;gap:10px;font-weight:700}
.lockbox .lt svg{width:22px;height:22px;color:var(--acc);flex:none}
.lockbox form{display:flex;gap:8px;flex-wrap:wrap}
.lockbox input{flex:1 1 160px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-m);letter-spacing:.08em;text-transform:uppercase}
.lockbox .h{font-size:14px;color:var(--soft);margin:0}

/* Rubbelfeld */
.rub{position:relative;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);isolation:isolate;outline-offset:3px}
.rub-c{position:relative;z-index:0;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 14px}
.rub-cv{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none;cursor:crosshair;transition:opacity .5s ease}
.rub-cv.gone{opacity:0;pointer-events:none}
.rub.nope{animation:shake .35s}
.rub.done{border-color:transparent}

.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letter{width:54px;height:66px}
.letter .rub-c{font:400 30px var(--f-d);padding:0}
.letters .gap{width:20px}
.wordfield{height:96px}
.wordfield .rub-c{font:400 clamp(26px,6vw,40px) var(--f-d);letter-spacing:.06em}
.guess{display:flex;gap:8px;flex-wrap:wrap}
.guess input{flex:1 1 180px;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}

.tips{display:grid;gap:10px}
.tip{min-height:70px}
.tip .rub-c{justify-content:flex-start;text-align:left;font-size:17px;padding:14px 16px}
.tip .rub-c b{font:400 12px var(--f-d);letter-spacing:.05em;color:var(--soft);text-transform:uppercase;display:block;margin-bottom:2px}
.tip.sol .rub-c{background:var(--ok-soft)}

.answer{min-height:96px}
.answer .rub-c{font-size:22px;font-weight:700}
.myans{font-size:15px;color:var(--soft);margin:0}
.selfcheck{display:flex;gap:8px;flex-wrap:wrap}

.opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{display:grid;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);align-content:start}
.opt p{margin:0;font-weight:700;font-size:16px;line-height:1.35}
.opt .rub{height:58px;background:var(--panel)}
.opt .rub-c{font:400 16px var(--f-d);gap:6px}
.opt .rub-c.r{color:var(--ok)} .opt .rub-c.f{color:var(--bad)}
.opt.picked{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}

.losfield{height:clamp(150px,32vw,220px)}
.losfield .rub-c{flex-direction:column;gap:4px;font:400 clamp(22px,5vw,32px)/1.15 var(--f-d)}
.losfield .rub-c small{font:700 14px var(--f-b);color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.losfield.win .rub-c{background:radial-gradient(circle at 50% 40%,var(--acc-soft),var(--panel2) 70%);color:var(--acc)}
.prizes{margin:0;padding-left:20px;font-size:15px;color:var(--soft)}

.levels{display:flex;gap:8px;flex-wrap:wrap}
.levels button{min-width:64px;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font:400 22px var(--f-d);cursor:pointer}
.levels button.on{background:var(--ink);color:var(--bg)}
.taskfield{min-height:120px}
.taskfield .rub-c{font-size:19px;line-height:1.45;padding:18px}

.imgfield .rub-c{padding:0}
.imgfield img{display:block;width:100%;height:auto}
.empty-hint{padding:18px;border:2px dashed var(--line);border-radius:14px;color:var(--soft);text-align:center;font-size:15px}

.pnav{display:flex;justify-content:space-between;gap:8px}
.made{text-align:center;font-size:13px;color:var(--soft)}

/* Overlay */
.ov{position:fixed;inset:0;z-index:9995;background:rgba(8,11,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.sheet{width:min(860px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin:auto 0;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{font:400 22px/1.2 var(--f-d)}
.sheet-b{padding:18px 20px 22px;display:grid;gap:16px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.typecard{display:grid;gap:8px;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;align-content:start}
.typecard:active{transform:scale(.98)}
.typecard .tf{height:46px;border-radius:10px;position:relative;overflow:hidden}
.typecard b{font:400 17px var(--f-d)}
.typecard span{font-size:14.5px;color:var(--soft);line-height:1.4}
.liblist{display:grid;gap:8px}
.libitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.libitem .li{flex:1 1 200px;min-width:0}
.libitem .li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libitem .li span{font-size:13.5px;color:var(--soft)}
.libitem.cur{border-color:var(--acc)}
.sharegrid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start}
@media (max-width:680px){.sharegrid{grid-template-columns:minmax(0,1fr)}}
.qrbox{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line);display:grid;gap:8px;justify-items:center;text-align:center;color:#141B2B}
.qrbox svg{width:100%;height:auto;display:block}
.qrbox p{margin:0;font-size:13px;color:#55617A}
.linkout{font-family:var(--f-m);font-size:13px;word-break:break-all;min-height:96px}
.note{font-size:14px;color:var(--soft);background:var(--panel2);border-radius:12px;padding:12px 14px;margin:0;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14.5px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:var(--shadow);animation:pop .3s}

/* Spieler-Modus */
body.play .top,body.play .studio{display:none}
body.play{padding-top:max(76px,env(safe-area-inset-top))}
html.share-mode body{padding-top:104px}
#playRoot{display:none}
body.play #playRoot{display:block}
.fail{max-width:520px;margin:40px auto;text-align:center;display:grid;gap:10px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:9997}

/* Druck */
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff!important;padding:0!important;color:#000}
  body > *:not(#printSheet){display:none!important}
  body > div#printSheet{display:grid!important;grid-template-columns:1fr 1fr;gap:8mm}

function mountCard(stage, card, ctx) {

  const isLocked = () => st.locked;
  const base = (extra) => Object.assign({ foil: card.fo, ap: card.ap, sound: card.sd, isLocked, onRefuse() { if (st.locked) msg("Diese Karte ist noch gesperrt – gib zuerst den Code ein.", "bad"); } }, extra);
  const add = (host, o) => { const r = makeRub(host, base(o)); rubs.push(r); return r; };

    const lb = el(`<div class="lockbox"><div class="lt">${LOCK_SVG}<span>Diese Karte ist gesperrt.</span></div>
      ${card.lk.h ? `<p class="h">${linkify(card.lk.h)}</p>` : ""}
      <form><label class="vh" for="code-${ctx.index}">Code</label><input id="code-${ctx.index}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code eingeben"><button class="btn pri" type="submit">Öffnen</button></form></div>`);

      } else { lb.classList.remove("shake"); void lb.offsetWidth; lb.classList.add("shake"); msg("Der Code stimmt nicht. Prüfe deine Lösung noch einmal.", "bad"); }
    });

  const unlockHooks = [];

  const R = {
    wort() {

      if (!word) { body.innerHTML = `<div class="empty-hint">Trage im Formular ein Lösungswort ein.</div>`; return; }
      const chars = [...word];
      const total = chars.filter((c) => c !== " ").length;
      let solved = false;
      const cnt = el(`<span class="counter"><b>0</b> / ${total} Buchstaben aufgedeckt</span>`);
      const upd = () => {
        const n = rubs.filter((r) => r.revealed).length;
        $("b", cnt).textContent = card.ein === false ? (rubs[0] && rubs[0].revealed ? total : 0) : n;
        if (!solved && rubs.length && rubs.every((r) => r.revealed)) { solved = true; msg(card.gs ? "Alles aufgedeckt." : "Alles aufgedeckt – das Wort steht da!", "info"); finish(true, body); }
      };
      if (card.ein === false) {

        add(f, { label: "RUBBELN", aria: "Lösungswort", onReveal: upd });
      } else {
        const row = el(`<div class="letters"></div>`); body.appendChild(row);
        chars.forEach((c, i) => {

      if (card.gs) {
        const g = el(`<form class="guess"><label class="vh" for="gs-${ctx.index}">Lösungswort</label><input id="gs-${ctx.index}" autocomplete="off" spellcheck="false" placeholder="Lösungswort eintippen"><button class="btn pri" type="submit">Prüfen</button></form>`);
        body.appendChild(g);
        g.addEventListener("submit", (e) => {
          e.preventDefault(); if (solved) return;
          if (st.locked) { msg("Diese Karte ist noch gesperrt – gib zuerst den Code ein.", "bad"); return; }
          const used = rubs.filter((r) => r.revealed).length;
          if (norm($("input", g).value).replace(/\s/g, "") === norm(word).replace(/\s/g, "")) {
            solved = true; rubs.forEach((r) => r.reveal(true)); upd();
            msg(used === 0 ? "Richtig – ganz ohne Hilfe!" : `Richtig! Du hast ${used} von ${total} Buchstaben gebraucht.`, "ok"); finish(true, g);
          } else { g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); msg("Noch nicht – rubbel einen weiteren Buchstaben frei.", "bad"); }
        });

    },
    tipp() {

      if (String(card.lo || "").trim()) items.push({ t: card.lo, label: "Lösung", sol: true });

      const opened = [], t0 = { v: null };

      if (!st.locked) startClock(); else unlockHooks.push(startClock);

          onRefuse() { msg(st.locked ? "Diese Karte ist noch gesperrt – gib zuerst den Code ein." : (card.sq && i > 0 && !rubs[i - 1].revealed) ? `Rubbel zuerst ${items[i - 1].label} frei.` : "Denk noch einen Moment selbst nach – der Tipp öffnet gleich.", "bad"); },
          onReveal() {

    },
    quiz() {
      const box = el(`<div style="display:grid;gap:10px"></div>`); body.appendChild(box);
      const f = el(`<div class="answer"><div class="rub-c">${linkify(card.a || "–")}</div></div>`);
      let given = !card.gs;
      if (card.gs) {
        const g = el(`<form class="guess"><label class="vh" for="qa-${ctx.index}">Deine Antwort</label><input id="qa-${ctx.index}" autocomplete="off" placeholder="Deine Antwort zuerst"><button class="btn pri" type="submit">Festhalten</button></form>`);
        box.appendChild(g);
        g.addEventListener("submit", (e) => {
          e.preventDefault(); const v = $("input", g).value.trim();
          if (!v) { msg("Schreib erst deine eigene Antwort auf.", "bad"); return; }
          given = true; g.replaceWith(el(`<p class="myans">Deine Antwort: <b>${esc(v)}</b></p>`)); msg("Jetzt darfst du rubbeln.", "info"); rubs[0].refresh();

      add(f, {
        label: "ANTWORT", aria: "Antwort",

        onRefuse() { msg(st.locked ? "Diese Karte ist noch gesperrt – gib zuerst den Code ein." : "Schreib erst deine eigene Antwort auf.", "bad"); },
        onReveal() {
          finish(true, f);
          const sc = el(`<div class="selfcheck"><button class="btn sm" type="button" data-v="1">Hatte ich richtig</button><button class="btn sm" type="button" data-v="0">Lag daneben</button></div>`);
          box.appendChild(sc);
          sc.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sc.remove(); msg(b.dataset.v === "1" ? "Stark – weiter so!" : "Kein Problem. Schau dir den Lösungsweg noch einmal an.", b.dataset.v === "1" ? "ok" : "info"); });
        }

    },
    wahl() {
      let ops = (card.op || []).filter((x) => String(x.t || "").trim());

      if (card.sh) ops = shuffle(ops);

      const grid = el(`<div class="opts-grid"></div>`); body.appendChild(grid);

        grid.appendChild(o); const host = $("div", o); let mine = false;
        add(host, {

          lockLabel: () => st.locked ? "gesperrt" : "nicht gewählt",
          onRefuse() { msg(st.locked ? "Diese Karte ist noch gesperrt – gib zuerst den Code ein." : "Deine Wahl ist schon gefallen.", "bad"); },
          onStart() { if (!ended) { mine = true; picked++; o.classList.add("picked"); rubs.forEach((r) => r.refresh()); } },
          onReveal(silent) {

    },

      const lv = [...new Set(pool.map((p) => p.n || ""))].filter(Boolean).sort();

        const sub = pool.filter((p) => !lv.length || lv.length === 1 || (p.n || "") === level);
        const cands = sub.length ? sub : pool;
        const task = fixedIdx != null && pool[fixedIdx] ? pool[fixedIdx] : cands[Math.floor(Math.random() * cands.length)];
        const f = el(`<div class="taskfield"><div class="rub-c"><div>${linkify(task.t)}</div></div></div>`); area.appendChild(f);

        });

    },
    bild() {

      const f = el(`<div class="imgfield"><div class="rub-c"><img alt="${esc(card.a || "Verdecktes Bild")}"></div></div>`);

    }
  };

  return () => { rubs.forEach((r) => r.destroy()); timers.forEach(clearInterval); };
}

function sheet(title, build) {
  const ov = el(`<div class="ov" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet"><div class="sheet-h"><h2>${esc(title)}</h2><button class="btn icon" type="button" aria-label="Schließen">✕</button></div><div class="sheet-b"></div></div></div>`);
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  $(".sheet-h .btn", ov).onclick = close;
  ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
  document.addEventListener("keydown", onKey);
  build($(".sheet-b", ov), close);
  document.body.appendChild(ov);
  setTimeout(() => { const f = $(".sheet-b button, .sheet-b input", ov); f && f.focus(); }, 30);
  return close;
}

}

      <div class="qrbox" id="shQr"></div>

    <div class="f"><span class="lab">Druckbogen für Stationen</span><p class="help">Jede Karte bekommt einen eigenen QR-Code mit Stationsnummer – zum Auslegen oder Aufhängen. Code-Sperren bleiben erhalten.</p><div><button class="btn" type="button" id="shPrint">Druckbogen öffnen</button></div></div>
    <p class="note">Datenschutz: Der Karteninhalt steckt komplett im Link – nichts wird auf einem Server gespeichert. Lösungen stehen nicht im Klartext darin, lassen sich mit Technikwissen aber auslesen. Für Prüfungen ist das daher nicht gedacht.</p>`;
  const subset = () => st.scope === "card" ? { t: cur.cards[sel].ti || cur.t, sq: false, cards: [cur.cards[sel]] } : cur;
  const exp = () => st.days === "sj" ? schoolYearEnd() : Date.now() + Number(st.days) * 864e5;
  function upd() {
    const link = buildLink(subset(), { exp: exp(), embed: st.embed });
    $("#shLink", b).value = link; $("#shOpen", b).href = link;
    $("#shLen", b).textContent = `${link.length.toLocaleString("de-DE")} Zeichen · gültig bis ${new Date(exp()).toLocaleDateString("de-DE")}`;
    $("#shQr", b).innerHTML = qrSvg(link) || (!window.qrcode ? `<p style="padding:20px 6px">Der QR-Baustein konnte nicht geladen werden. Lade die Seite mit Internetverbindung neu.</p>` : `<p style="padding:20px 6px">Für einen QR-Code ist der Link zu lang (über 2.300 Zeichen). Teile einzelne Karten, kürze Texte oder nutze eine Bildadresse statt eines hochgeladenen Bildes.</p>`);
    if ($("#shQr svg", b)) $("#shQr", b).appendChild(el(`<p>QR-Code am Beamer zeigen oder per Screenshot weitergeben</p>`));
  }
  $("#shScope", b).onclick = (e) => { const x = e.target.closest("button"); if (!x) return; st.scope = x.dataset.v; $$("#shScope button", b).forEach((y) => y.classList.toggle("on", y === x)); upd(); };
  $("#shDays", b).onclick = (e) => { const x = e.target.closest("button"); if (!x) return; st.days = x.dataset.v; $$("#shDays button", b).forEach((y) => y.classList.toggle("on", y === x)); upd(); };
  $("#shEmbed", b).onchange = (e) => { st.embed = e.target.checked; upd(); };
  const copy = (txt, ok) => { const done = () => toast(ok); try { navigator.clipboard.writeText(txt).then(done, () => { $("#shLink", b).select(); toast("Bitte markierten Link selbst kopieren"); }); } catch (e) { $("#shLink", b).select(); } };
  $("#shCopy", b).onclick = () => copy($("#shLink", b).value, "Link kopiert");
  $("#shFrame", b).onclick = () => { const l = buildLink(subset(), { exp: exp(), embed: true }); copy(`<iframe src="${l}" title="${esc(subset().t || "Rubbelkarte")}" width="100%" height="680" style="border:0;border-radius:16px" loading="lazy"></iframe>`, "iFrame-Code kopiert"); };
  $("#shPrint", b).onclick = () => printSheet(exp(), st.embed);
  upd();
});
function qrSvg(text) {
  if (!window.qrcode) return "";
  try { const q = qrcode(0, "L"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { return ""; }
}
function printSheet(exp, embed) {
  const P = $("#printSheet"); P.innerHTML = "";
  let tooLong = 0;
  cur.cards.forEach((c, i) => {
    const link = buildLink({ t: c.ti || cur.t, sq: false, cards: [c] }, { exp, embed });
    const svg = qrSvg(link); if (!svg) tooLong++;
    P.appendChild(el(`<div class="pcard"><div class="st">Station ${i + 1}${cur.t ? " · " + esc(cur.t) : ""}</div><h3>${esc(c.ti || TYPES[c.ty].name)}</h3>${svg || "<p>Link zu lang für einen QR-Code</p>"}<p>Scanne den Code mit dem iPad und rubbel los.</p></div>`));
  });
  if (tooLong) toast(`${tooLong} Karte(n) zu lang für einen QR-Code`);
  setTimeout(() => window.print(), 60);
}

/* ======================= Start ======================= */
function ensureSet() {
  const id = store.get(CUR, null);
  if (id) load(id);
  if (!cur && lib.length) cur = lib[0].set;
  if (!cur) { cur = setFrom(TEMPLATES[0].make()); cur.t = "Beispiel: " + cur.t; save(); }
}
function startPlayer(ref) {
  document.body.classList.add("play");
  const s = unpackSet(ref);
  const root = $("#player");
  if (!s) { root.innerHTML = `<div class="fail"><h1 style="font:400 26px var(--f-d)">Karte nicht gefunden</h1><p>${ref.kind === "k" && !window.LZString ? "Ein benötigter Baustein konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu." : "Der Link ist unvollständig. Bitte deine Lehrkraft um einen neuen Link oder QR-Code."}</p></div>`; return; }
  document.title = (s.t || s.cards[0].ti || "Rubbelkarte") + " – Rubbelwerk";
  mountSet(root, s, { preview: false });
}
const hashRef = readHash(location.hash);
window.RUBBEL_PLAYER = !!hashRef;
if (hashRef) startPlayer(hashRef);
else { ensureSet(); renderAll(); }
window.addEventListener("hashchange", () => { if (readHash(location.hash)) location.reload(); });
</script>

if (!window.RUBBEL_PLAYER) window.TOUR = { steps: [
  { title: "Willkommen im Rubbelwerk", text: "<p>Hier baust du digitale Rubbelkarten: Lösungswörter, gestufte Tipps, Quizfragen, Auswahlkarten, Rubbellose und Zufallsaufgaben.</p><p>Zum Start ist ein Beispiel-Escape geöffnet.</p>" },
  { sel: "#cardList", title: "Karten im Set", text: "<p>Ein Set fasst mehrere Karten zusammen – z. B. alle Stationen eines Escape-Rooms. Tippe eine Karte an, um sie zu bearbeiten, oder lege mit „+ Neue Karte“ eine weitere an.</p>" },
  { sel: "#editor", title: "Inhalt und Optionen", text: "<p>Hier trägst du Texte, Tipps oder Antworten ein. Unter „Folie, Effekte & Code-Sperre“ wählst du die Rubbelfolie und sperrst Karten mit einem Code.</p>" },
  { sel: "#preview", title: "Vorschau", text: "<p>Probier deine Karte direkt aus – mit Finger, Stift oder Maus. „Zurücksetzen“ legt eine neue Folie darüber.</p>" },
  { sel: "#btnShare", title: "Teilen", text: "<p>Erzeugt einen Link und QR-Code für Lernende – ohne Anmeldung, zeitlich begrenzt. Dazu gibt es einen Druckbogen mit QR-Codes für Stationen und einen iFrame-Code.</p>" },
  { sel: "#btnLibrary", title: "Meine Sets", text: "<p>Alles wird automatisch in diesem Browser gespeichert. Hier öffnest du frühere Sets, exportierst sie als Datei oder übernimmst ein Set aus einem Link.</p>" }
]};
</script>
