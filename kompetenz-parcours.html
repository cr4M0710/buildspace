<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kompetenz-Parcours</title>
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<meta name="description" content="Kompetenzen für Berufsorientierung und Praktikum spielerisch erleben: 20 Stationen, Selbst- und Fremdeinschätzung, Kompetenztest und Berufsempfehlungen.">
<meta property="og:title" content="Kompetenz-Parcours">
<meta property="og:description" content="20 Stationen zu den KomPo7-Schlüsselkompetenzen und beruflichen Kompetenzen, mit Selbst- und Fremdeinschätzung, Kompetenztest und Berufsempfehlungen.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://buildspaceos.de/kompetenz-parcours.html">
<meta property="og:image" content="https://buildspaceos.de/assets/og/kompetenz-parcours.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://buildspaceos.de/assets/og/kompetenz-parcours.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff0; --surface:#ffffff; --surface2:#f4f6f7; --ink:#1b232a; --muted:#4d5b66; --line:#c9d1d6;
  --ok:#0e7d44; --ok-bg:#dcf2e4; --bad:#b3261e; --bad-bg:#fbe3e0; --info:#0b5cab; --info-bg:#e6eff8;
  --warn:#8a5a00; --warn-bg:#fff1cc;
  --yellow:#ffc20e; --dark:#1b232a; --focus:#0b5cab;
  --s-self:#0b5cab; --s-fremd:#d6281f; --s-game:#0f8a4b; --s-test:#c98a00;
  --head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181d; --surface:#1d272e; --surface2:#253139; --ink:#eef2f4; --muted:#a9b6bf; --line:#3a4955;
    --ok:#6fd99b; --ok-bg:#15382a; --bad:#ff9087; --bad-bg:#45221f; --info:#8cc3f5; --info-bg:#182b3b;
    --warn:#ffd36b; --warn-bg:#3d3113; --focus:#8cc3f5;
    --s-self:#6fb0ff; --s-fremd:#ff7a70; --s-game:#5fd28f; --s-test:#ffc94a;
  }
}
:root[data-theme="dark"]{
  --bg:#12181d; --surface:#1d272e; --surface2:#253139; --ink:#eef2f4; --muted:#a9b6bf; --line:#3a4955;
  --ok:#6fd99b; --ok-bg:#15382a; --bad:#ff9087; --bad-bg:#45221f; --info:#8cc3f5; --info-bg:#182b3b;
  --warn:#ffd36b; --warn-bg:#3d3113; --focus:#8cc3f5;
  --s-self:#6fb0ff; --s-fremd:#ff7a70; --s-game:#5fd28f; --s-test:#ffc94a;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.05;margin:0;letter-spacing:.01em;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
h1{font-size:clamp(40px,7vw,72px)}
h2{font-size:clamp(28px,4.6vw,40px)}
h3{font-size:26px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 18px,#1b232a 18px 36px);margin-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:12px 16px 0}
.top .brand{font-family:var(--head);font-weight:700;font-size:26px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:15px;color:var(--muted);text-align:right}
.app{max-width:1120px;margin:0 auto;padding:16px 16px 64px}
.muted{color:var(--muted)}
.small{font-size:15px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.mt{margin-top:18px}.mt2{margin-top:30px}
.lede{font-size:20px;color:var(--muted);max-width:36em;margin-top:10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;
  border:3px solid var(--dark);background:var(--yellow);color:#1b232a;font-weight:700;cursor:pointer;text-decoration:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(2px)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border-color:transparent;text-decoration:underline;padding:10px 12px}
.btn.small{min-height:44px;padding:6px 14px;font-size:16px;border-radius:12px}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.iconbtn{min-width:52px;min-height:52px;border-radius:14px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-size:22px;
  display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}

/* Cards */
.card{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:20px}
.card.hl{border-color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.big4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.big4 .bigcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:18px;border-radius:18px;border:3px solid var(--line);
  background:var(--surface);cursor:pointer;min-height:150px;touch-action:manipulation}
.bigcard .bt{font-family:var(--head);font-size:30px;font-weight:700;line-height:1;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.bigcard .bi{font-size:34px;line-height:1}
.bigcard .bs{font-size:15px;color:var(--muted)}
.bigcard.done{border-color:var(--ok)}

/* Area / map */
.area{margin-top:28px;border-radius:22px;padding:18px;background:var(--surface2);border:3px dashed var(--line)}
.area h2{display:flex;align-items:center;gap:10px}
.area .asub{color:var(--muted);margin:6px 0 14px;font-size:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px 14px 12px;border-radius:16px;
  background:var(--surface);border:3px solid var(--line);cursor:pointer;min-height:150px;touch-action:manipulation;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:var(--cc)}
.tile .ti{font-size:32px;line-height:1;margin-top:6px}
.tile .tn{font-family:var(--head);font-weight:700;font-size:22px;line-height:1.05;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.tile .tg{font-size:14px;color:var(--muted);line-height:1.25}
.tile .tstat{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:14px;width:100%}
.tile.done{border-color:var(--cc)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);border:2px solid var(--line)}
.badge.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.badge.d3{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.mini-bar{flex:1;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
.mini-bar>i{display:block;height:100%;background:var(--cc)}

/* Progress */
.prog{height:14px;border-radius:10px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--yellow);transition:width .3s}

/* Station header */
.sthead{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--cc);color:var(--fg)}
.sthead .si{font-size:44px;line-height:1}
.sthead .sk{font-size:15px;opacity:.9}
.sthead h2{color:inherit}

/* Game area */
.gamebox{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;overflow:hidden}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700;margin-bottom:10px}
.hud .pill{padding:4px 12px;border-radius:999px;background:var(--surface2);border:2px solid var(--line)}
.canvaswrap{position:relative;width:100%;touch-action:none;border-radius:14px;overflow:hidden;background:var(--surface2)}
.canvaswrap canvas{display:block;width:100%;height:100%}
.three{width:100%;height:min(62vh,520px);border-radius:14px;overflow:hidden;background:linear-gradient(#dfe7ec,#b9c6cf);touch-action:none;position:relative}
.three .hint3{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:4px 10px;border-radius:8px;pointer-events:none}

/* Multiple choice */
.q{font-size:21px;font-weight:700;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;border:3px solid var(--line);
  background:var(--surface);cursor:pointer;touch-action:manipulation;font-size:18px}
.opt .ol{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);font-weight:700}
.opt.sel{border-color:var(--info);background:var(--info-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.meh{border-color:var(--warn);background:var(--warn-bg)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface2)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.meh{border-color:var(--warn);background:var(--warn-bg)}
.illu{display:flex;justify-content:center;margin:8px 0 14px}
.illu svg{max-width:100%;height:auto}
.scene{padding:14px 16px;border-left:6px solid var(--cc,var(--yellow));background:var(--surface2);border-radius:10px;margin-bottom:12px}

/* Rating scale */
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.rate button{min-height:58px;border-radius:12px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;line-height:1.15;padding:6px 4px;touch-action:manipulation}
.rate button b{display:block;font-size:20px}
.rate button.on{border-color:var(--dark);background:var(--yellow);color:#1b232a}
.stmt{padding:14px 0;border-bottom:2px solid var(--line)}
.stmt:last-child{border-bottom:0}
.emo{display:flex;gap:10px;flex-wrap:wrap}
.emo button{min-height:56px;min-width:56px;padding:8px 16px;border-radius:14px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px}
.emo button.on{border-color:var(--dark);background:var(--yellow);color:#1b232a}

/* Result */
.score{font-family:var(--head);font-size:76px;font-weight:700;line-height:1}
.stars{font-size:34px;letter-spacing:4px}

/* Inputs */
.inp{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:3px solid var(--line);background:var(--surface);font-size:18px}
.inp:focus{border-color:var(--info);outline:none}
label.lb{display:block;font-weight:700;margin-bottom:6px}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{min-height:48px;padding:6px 18px;border:0;background:var(--surface);cursor:pointer}
.seg button.on{background:var(--yellow);color:#1b232a;font-weight:700}

/* Evaluation */
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px;border-radius:999px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.legend button i{width:22px;height:5px;border-radius:3px;background:var(--c)}
.legend button.off{opacity:.4}
.radars{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.radar svg{width:100%;height:auto;display:block}
.ctable{width:100%;border-collapse:collapse;font-size:16px}
.ctable th,.ctable td{padding:8px 6px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
.ctable th{font-size:14px;color:var(--muted);font-weight:700}
.ctable td.n{text-align:center;font-weight:700;width:58px}
.ctable .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gbar{height:12px;border-radius:7px;background:var(--surface2);min-width:80px;overflow:hidden}
.gbar>i{display:block;height:100%;background:var(--cc)}
.field{border-radius:18px;border:3px solid var(--line);background:var(--surface);padding:18px}
.field .fh{display:flex;gap:12px;align-items:center}
.field .fi{font-size:40px;line-height:1}
.field .fm{font-family:var(--head);font-size:44px;font-weight:700;line-height:1;margin-left:auto}
.jobs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.job{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;font-size:16px}
.note{padding:12px 14px;border-radius:12px;background:var(--info-bg);border:2px solid var(--info);font-size:16px}
.warnbox{padding:12px 14px;border-radius:12px;background:var(--warn-bg);border:2px solid var(--warn);font-size:16px}
.flag{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.flag.up{background:var(--warn-bg);color:var(--warn)}
.flag.down{background:var(--info-bg);color:var(--info)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button{min-height:48px;padding:6px 16px;border-radius:12px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}

/* Overlay modal */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;border:3px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--dark);color:#fff;
  padding:12px 20px;border-radius:14px;font-weight:700;transition:transform .25s;z-index:60;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* Game specific */
.symgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sym{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:clamp(20px,4.6vw,34px);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0;font-family:var(--head);font-weight:700}
.sym.hit{background:var(--ok-bg);border-color:var(--ok)}
.sym.miss{background:var(--bad-bg);border-color:var(--bad)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.bin{min-height:86px;border-radius:14px;border:3px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation}
.bin .be{font-size:30px}
.item-show{font-size:64px;text-align:center;min-height:96px;line-height:96px}
.pipes{display:grid;gap:4px;margin:0 auto;max-width:420px}
.pipe{aspect-ratio:1;border-radius:8px;background:var(--surface2);border:2px solid var(--line);cursor:pointer;padding:0;touch-action:manipulation}
.pipe svg{width:100%;height:100%;display:block;transition:transform .15s}
.order-list{display:flex;flex-direction:column;gap:8px}
.order-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:3px solid var(--line);background:var(--surface);min-height:56px}
.order-item .on{flex:0 0 36px;height:36px;border-radius:50%;background:var(--yellow);color:#1b232a;display:flex;align-items:center;justify-content:center;font-weight:700}
.order-item .tx{flex:1}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.shelf button{min-height:72px;border-radius:12px;border:3px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;gap:2px;touch-action:manipulation}
.shelf button .e{font-size:28px}
.shelf button.on{border-color:var(--ok);background:var(--ok-bg)}
.wordtext{font-size:20px;line-height:2.1}
.wordtext .w{display:inline-block;padding:0 4px;border-radius:6px;cursor:pointer;border-bottom:2px dotted var(--line)}
.wordtext .w.on{background:var(--warn-bg);border-bottom-color:var(--warn)}
.wordtext .w.right{background:var(--ok-bg)}
.wordtext .w.wrong{background:var(--bad-bg)}
.wordtext .w.missed{outline:3px solid var(--bad);outline-offset:1px}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ideas span{padding:6px 12px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);font-size:16px}
.swipe{position:relative;max-width:440px;margin:0 auto;min-height:250px}
.scard{border-radius:20px;border:3px solid var(--line);background:var(--surface);padding:22px;text-align:center;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .25s,opacity .25s}
.scard .se{font-size:64px;line-height:1}
.scard .st{font-size:22px;font-weight:700}
.clock{font-family:var(--head);font-size:64px;font-weight:700;text-align:center;line-height:1}
.tasks-z{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px}
.cmp-row div{padding:10px;border-radius:10px;background:var(--surface2);text-align:center;letter-spacing:.06em}
.ls-table{width:100%;border-collapse:collapse;font-size:16px}
.ls-table td,.ls-table th{border:2px solid var(--line);padding:8px}
.ls-table td.tap{cursor:pointer}
.ls-table td.on{background:var(--warn-bg)}
.ls-table td.right{background:var(--ok-bg)}
.ls-table td.missed{outline:3px solid var(--bad);outline-offset:-3px}
.ls-table td.wrong{background:var(--bad-bg)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;letter-spacing:.12em;text-align:center;padding:14px;border-radius:14px;background:var(--surface2);border:3px dashed var(--line);word-break:break-all}

@media (max-width:560px){
  body{font-size:17px}
  .rate button{font-size:12px}
  .symgrid{grid-template-columns:repeat(6,1fr)}
  .field .fm{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .stripe,.top,.noprint,#toast,.tabs,.legend{display:none!important}
  .card,.field,.area{border:1px solid #999;break-inside:avoid}
  .app{padding:0;max-width:none}
  .radars{grid-template-columns:1fr 1fr}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<header class="top">
  <button class="iconbtn" id="homeBtn" aria-label="Zur Übersicht" title="Zur Übersicht">🏠</button>
  <div class="brand" id="brand">Kompetenz-Parcours</div>
  <div class="who" id="who"></div>
</header>
<main id="main" class="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   Kompetenz-Parcours – Daten
   ========================================================= */
const COMPS = [
 // ---------- KomPo7: 9 Schlüsselkompetenzen (Farben wie KomPo7) ----------
 {id:'D',grp:'k7',name:'Durchhaltevermögen',icon:'⏳',c:'#951B81',fg:'#fff',
  def:'Ich arbeite lange konzentriert an einer Aufgabe und mache auch weiter, wenn es schwierig wird.',

/* =========================================================
   Werte & Berechnungen
   ========================================================= */
const W = {self:.3, fremd:.25, game:.2, test:.25};
function selfVal(p, id){ const s = p.self[id]; return s ? s.v : null; }
function fremdVal(p, id){
  const v = p.fremd.map(f => f.r[id]).filter(x => x > 0);
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null;
}
function gameVal(p, id){ const g = p.games[id]; return g ? 1 + 3 * g.score : null; }
function testScore(p, id){
  let sum = 0, n = 0;
  Object.values(p.test || {}).forEach(sec => { if(sec && sec.comp && sec.comp[id]){ sum += sec.comp[id].s; n += sec.comp[id].n; } });
  return n ? sum / n : null;
}
function testVal(p, id){ const s = testScore(p, id); return s == null ? null : 1 + 3 * s; }
function totalVal(p, id, srcs = ['self','fremd','game','test']){
  const vals = {self:selfVal(p,id), fremd:fremdVal(p,id), game:gameVal(p,id), test:testVal(p,id)};
  let s = 0, w = 0;
  srcs.forEach(k => { if(vals[k] != null){ s += vals[k] * W[k]; w += W[k]; } });
  return w ? s / w : null;
}
function interestScore(p, fid){
  if(!p.interests) return null;
  const v = []; INTERESTS.forEach((it, i) => { if(it.f.includes(fid) && p.interests[i] != null) v.push(p.interests[i]); });
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null; // -1..1
}
function funScore(p, fid){
  const v = []; Object.entries(GAME_FIELD).forEach(([cid, fs]) => { if(fs.includes(fid) && p.games[cid] && p.games[cid].fun != null) v.push(p.games[cid].fun); });
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null;
}
/* Passung eines Berufsfelds: gewichtetes Mittel der Kompetenzwerte (0..1) */
function fieldFit(p, f, valFn){
  let s = 0, w = 0; const contrib = [];
  Object.entries(f.w).forEach(([cid, wt]) => {
    const v = valFn(cid); if(v == null) return;
    const n = (v - 1) / 3; s += n * wt; w += wt; contrib.push({cid, n, wt});
  });
  if(!w) return null;
  return {fit: s / w, cover: w / Object.values(f.w).reduce((a,b)=>a+b,0), contrib: contrib.sort((a,b)=>b.n*b.wt - a.n*a.wt)};
}
function rankFields(p, mode){
  const valFn = mode === 'test' ? (cid => testVal(p,cid))
              : mode === 'parcours' ? (cid => totalVal(p,cid,['self','fremd','game']))
              : (cid => totalVal(p,cid));
  return FIELDS.map(f => {
    const ff = fieldFit(p, f, valFn); if(!ff || ff.cover < .4) return null;
    let score = ff.fit;
    const ints = interestScore(p, f.id), fun = funScore(p, f.id);
    let interest = null;
    if(mode !== 'test'){
      if(ints != null){ interest = ints; score = ff.fit * .65 + ((ints + 1) / 2) * .35; }
      if(fun != null) score += fun * .03;
    }
    return {f, score: clamp(score,0,1), fit: ff.fit, cover: ff.cover, contrib: ff.contrib, interest};
  }).filter(Boolean).sort((a,b) => b.score - a.score);
}
function stationsDone(p){ return COMPS.filter(c => p.games[c.id] && p.self[c.id]).length; }
function testSectionsDone(p){ return TEST_SECTIONS.filter(s => p.test[s.id] && p.test[s.id].done).length; }

function exportFile(){
  const p = P(); if(!p) return;
  const blob = new Blob([JSON.stringify({app:'kompetenz-parcours', v:1, profile:p}, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `kompetenz-parcours-${p.name.replace(/[^\wäöüÄÖÜß-]+/g,'_')}-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Datei gespeichert – leg sie z. B. in deinen Schulordner.');
}
function importFile(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(d.app !== 'kompetenz-parcours' || !d.profile || !d.profile.id) throw 0;
        const p = Object.assign({games:{}, self:{}, fremd:[], test:{}, interests:null}, d.profile);
        DB.profiles[p.id] = p; DB.cur = p.id; saveDB(); toast('Fortschritt geladen.'); renderHub();
      }catch(e){ toast('Diese Datei passt nicht zum Kompetenz-Parcours.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* =========================================================
   Multiple-Choice-Runner (Spiele & Test)
   items: {q, pre?, illu?, opts:[{t,s}], fb?, cid?}
   ========================================================= */
function runQuiz(box, items, o = {}){
  return new Promise(resolve => {
    let i = 0; const answers = [];
    const total = items.length;
    function draw(){
      const it = items[i];
      const order = o.noShuffle || it.keep ? it.opts.map((_,k)=>k) : shuffle(it.opts.map((_,k)=>k));
      box.innerHTML = `
        <div class="hud"><span class="pill">${o.label || 'Aufgabe'} ${i+1}/${total}</span>${o.hud ? o.hud() : ''}<span class="spacer"></span>${it.timer || o.timer ? '<span class="pill" id="qt"></span>' : ''}</div>
        ${it.pre ? `<div class="scene" style="--cc:${o.color || 'var(--yellow)'}">${it.pre}</div>` : ''}
        ${it.illu ? `<div class="illu">${it.illu}</div>` : ''}
        <div class="q">${it.q}</div>
        <div class="opts ${it.opts.length > 3 && !it.long ? 'two' : ''}">${order.map((k,n) => `<button class="opt" data-k="${k}"><span class="ol">${'ABCDEF'[n]}</span><span>${it.opts[k].t}</span></button>`).join('')}</div>
        <div id="fbx"></div>`;
      let answered = false, tLeft = it.timer || o.timer || 0, tmr = null;
      if(tLeft){
        const qt = $('#qt', box); qt.textContent = '⏱ ' + tLeft;
        tmr = every(() => { tLeft--; qt.textContent = '⏱ ' + Math.max(0,tLeft); if(tLeft <= 0){ clearInterval(tmr); if(!answered) choose(-1); } }, 1000);
      }
      function choose(k){
        if(answered) return; answered = true; if(tmr) clearInterval(tmr);
        const s = k >= 0 ? (it.opts[k].s ?? 0) : 0;
        answers.push({k, s, cid: it.cid, item: it});
        if(o.onAnswer) o.onAnswer(s, it, k);
        if(o.feedback === false){
          $$('.opt', box).forEach(b => { b.disabled = true; if(+b.dataset.k === k) b.classList.add('sel'); });
          later(next, 260); return;
        }
        $$('.opt', box).forEach(b => {
          b.disabled = true; const kk = +b.dataset.k, ss = it.opts[kk].s ?? 0;
          if(ss >= 1) b.classList.add('right'); else if(kk === k) b.classList.add(ss > 0 ? 'meh' : 'wrong');
        });
        const cls = s >= 1 ? 'ok' : s > 0 ? 'meh' : 'bad';
        const head = k < 0 ? '⏱ Zeit abgelaufen.' : s >= 1 ? '✅ Richtig!' : s > 0 ? '🟡 Teilweise gut.' : '❌ Nicht ganz.';
        $('#fbx', box).innerHTML = `<div class="fb ${cls}"><b>${head}</b>${it.fb ? ' ' + it.fb : ''}</div>
          <div class="row mt"><button class="btn" id="nq">${i+1 < total ? 'Weiter' : 'Fertig'}</button></div>`;
        $('#nq', box).onclick = next; $('#nq', box).focus({preventScroll:true});
      }
      $$('.opt', box).forEach(b => b.onclick = () => choose(+b.dataset.k));
      if(o.afterDraw) o.afterDraw(it, box);
    }
    function next(){
      i++;
      if(i < total) draw();
      else resolve({score: answers.reduce((a,x)=>a+x.s,0) / total, answers});
    }
    draw();
  });
}

      }

    }

    let hits = 0, falses = 0, tLeft = R.t, done = false;

      });
      $('#dnext', box).onclick = fin;
    });
    stats.push({hits, falses, targets, acc: clamp((hits - falses) / targets, 0, 1)});

  }
  const score = stats.reduce((a,s)=>a+s.acc,0) / 3;

};

/* ---------- P: Rohr-Rätsel ---------- */
const rot = m => ((m << 1) | (m >> 3)) & 15;
const DIRS = [[-1,0,1,4],[0,1,2,8],[1,0,4,1],[0,-1,8,2]]; // dr, dc, bit, Gegen-Bit
function makePipePuzzle(N){
  const r0 = rnd(0, N-1), r1 = rnd(0, N-1);
  let path = null, steps = 0;
  const seen = new Set();
  function dfs(r, c, acc){
    if(path || ++steps > 40000) return;
    if(r === r1 && c === N-1 && acc.length >= N + 1){ path = acc.slice(); return; }
    for(const [dr,dc] of shuffle(DIRS)){
      const nr = r + dr, nc = c + dc;
      if(nr < 0 || nc < 0 || nr >= N || nc >= N || seen.has(nr*N+nc)) continue;
      if(acc.length > N*N*.6) continue;
      seen.add(nr*N+nc); acc.push([nr,nc]); dfs(nr, nc, acc); acc.pop(); seen.delete(nr*N+nc);
      if(path) return;
    }
  }
  seen.add(r0*N); dfs(r0, 0, [[r0,0]]);
  if(!path){ path = []; for(let c = 0; c < N; c++) path.push([r0, c]); const d = r1 > r0 ? 1 : -1; for(let r = r0 + d; r1 !== r0 && r !== r1 + d; r += d) path.push([r, N-1]); }
  const grid = Array.from({length:N}, () => Array(N).fill(0));
  const onPath = new Set(path.map(([r,c]) => r*N+c));
  path.forEach(([r,c], i) => {
    let m = 0;
    const link = (p) => { const [pr,pc] = p; DIRS.forEach(([dr,dc,bit]) => { if(r+dr === pr && c+dc === pc) m |= bit; }); };
    if(i === 0) m |= 8; else link(path[i-1]);
    if(i === path.length-1) m |= 2; else link(path[i+1]);
    grid[r][c] = m;
  });
  for(let r = 0; r < N; r++) for(let c = 0; c < N; c++) if(!onPath.has(r*N+c)) grid[r][c] = pick([5,3,3,7,5,6]);
  // Mindestzüge & Verdrehen
  let minMoves = 0; const sol = grid.map(row => row.slice());
  for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
    const k = rnd(0,3); for(let t = 0; t < k; t++) grid[r][c] = rot(grid[r][c]);
    if(onPath.has(r*N+c)){
      let m = grid[r][c], need = 0; while(m !== sol[r][c] && need < 4){ m = rot(m); need++; }
      if(sol[r][c] === 5 || sol[r][c] === 10) need = need % 2;
      minMoves += need;
    }
  }
  if(minMoves === 0){ const [r,c] = path[1]; grid[r][c] = rot(grid[r][c]); minMoves = 1; }
  return {N, r0, r1, grid, pathLen: path.length, minMoves};
}
function pipeFlow(P){
  const {N, grid, r0, r1} = P, wet = new Set();
  if(!(grid[r0][0] & 8)) return {wet, solved:false};
  const q = [[r0,0]]; wet.add(r0*N);
  while(q.length){
    const [r,c] = q.shift();
    DIRS.forEach(([dr,dc,bit,opp]) => {
      const nr = r+dr, nc = c+dc;
      if(nr<0||nc<0||nr>=N||nc>=N) return;
      if((grid[r][c] & bit) && (grid[nr][nc] & opp) && !wet.has(nr*N+nc)){ wet.add(nr*N+nc); q.push([nr,nc]); }
    });
  }
  return {wet, solved: wet.has(r1*N+N-1) && !!(grid[r1][N-1] & 2)};
}
function pipeSVG(m, wet){
  const col = wet ? '#1e88e5' : '#8a979f', w = 26;
  let s = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="none"/>`;
  const seg = {1:'M50 50V0',2:'M50 50H100',4:'M50 50V100',8:'M50 50H0'};
  [1,2,4,8].forEach(b => { if(m & b) s += `<path d="${seg[b]}" stroke="${col}" stroke-width="${w}" stroke-linecap="butt"/>`; });
  s += `<circle cx="50" cy="50" r="${w/2}" fill="${col}"/></svg>`;
  return s;
}

  await gamePage(box, `<h3>🚰 Das Wasser muss fließen</h3><p class="mt">Tippe auf ein Rohrstück, um es zu drehen. Verbinde die <b>Quelle 💧</b> (links) mit dem <b>Ziel 🏁</b> (rechts). Es gibt drei Rätsel, jedes mit 90 Sekunden Zeit.</p><p class="mt muted">Tipp: Schau erst, wo das Wasser hin muss – und probier dann aus.</p>`, 'Los');
  const sizes = [4,5,5], res = [];
  for(let k = 0; k < sizes.length; k++){
    const PZ = makePipePuzzle(sizes[k]);
    const r = await new Promise(done => {

        box.innerHTML = `<div class="hud"><span class="pill">Rätsel ${k+1}/3</span><span class="pill">Züge: ${moves}</span><span class="spacer"></span><span class="pill">⏱ <span id="pt">${t}</span> s</span></div>

            <div style="display:grid;grid-template-rows:repeat(${N},1fr);gap:4px;height:100%">${Array.from({length:N},(_,r)=>`<div style="display:flex;align-items:center;justify-content:center;font-size:24px">${r===PZ.r1?'🏁':''}</div>`).join('')}</div>

        done({ok, s, moves});

/* ---------- T: Team-Labyrinth (zu zweit) + Teamsituationen ---------- */
function makeMaze(W, H){
  const cells = Array.from({length:H}, () => Array.from({length:W}, () => ({n:1,e:1,s:1,w:1,v:0})));
  const st = [[0,0]]; cells[0][0].v = 1;
  while(st.length){
    const [r,c] = st[st.length-1];
    const nb = [[r-1,c,'n','s'],[r,c+1,'e','w'],[r+1,c,'s','n'],[r,c-1,'w','e']].filter(([nr,nc]) => nr>=0&&nc>=0&&nr<H&&nc<W&&!cells[nr][nc].v);
    if(!nb.length){ st.pop(); continue; }
    const [nr,nc,a,b] = pick(nb); cells[r][c][a] = 0; cells[nr][nc][b] = 0; cells[nr][nc].v = 1; st.push([nr,nc]);
  }
  // ein paar Zusatzöffnungen für mehrere Wege
  for(let k = 0; k < Math.floor(W*H/8); k++){ const r = rnd(0,H-1), c = rnd(0,W-2); cells[r][c].e = 0; cells[r][c+1].w = 0; }
  return cells;
}

/* ---------- HW: Laubsäge-Parcours (Nachfahren) ---------- */
const SAW_SHAPES = [
  {n:'Welle', pts: Array.from({length:61}, (_,i) => { const x = 30 + i * 340/60; return [x, 150 + 70 * Math.sin((i/60) * Math.PI * 3)]; })},
  {n:'Zickzack', pts: [[30,90],[90,210],[150,90],[210,210],[270,90],[330,210],[370,150]]},
  {n:'Bogen', pts: Array.from({length:61}, (_,i) => { const a = Math.PI * .95 - i * (Math.PI * 1.9 / 60); return [200 + 120 * Math.cos(a), 160 - 110 * Math.sin(a)]; })}
];
function densify(pts, step = 4){
  const out = [[...pts[0], 0]]; let L = 0;
  for(let i = 1; i < pts.length; i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i], d = Math.hypot(x1-x0, y1-y0), n = Math.max(1, Math.round(d/step));
    for(let k = 1; k <= n; k++){ L += d/n; out.push([x0 + (x1-x0)*k/n, y0 + (y1-y0)*k/n, L]); }
  }
  return out;
}
GAMES.HW = async (box, c) => {
  await gamePage(box, `<h3>🪚 Laubsäge-Parcours</h3><p class="mt">Setz den Finger auf den <b>grünen Punkt</b> und fahre die Sägelinie bis zur <b>Fahne</b> nach, ohne abzusetzen. Bleib möglichst genau in der Mitte der Spur.</p><p class="mt muted">Drei Formen, jeweils 25 Sekunden. Genauigkeit ist wichtiger als Tempo.</p>`, 'Säge ansetzen');
  const res = [];
  for(let k = 0; k < SAW_SHAPES.length; k++){
    const sh = SAW_SHAPES[k], line = densify(sh.pts), total = line[line.length-1][2];
    const r = await new Promise(done => {
      box.innerHTML = `<div class="hud"><span class="pill">Form ${k+1}/3: ${sh.n}</span><span class="pill">Genau: <span id="ha">–</span></span><span class="spacer"></span><span class="pill">⏱ <span id="ht">25</span> s</span></div>
        <div class="canvaswrap" style="aspect-ratio:4/3;max-width:720px;margin:0 auto;background:#f3e3c8"><canvas id="hc"></canvas></div>
        <div class="row mt"><button class="btn sec small" id="hre">↺ Neu ansetzen</button><span class="small muted">Du kannst einmal neu ansetzen.</span></div>`;
      const cv = $('#hc', box), ctx = cv.getContext('2d');
      let S = 1, ox = 0, oy = 0, drawing = false, maxL = 0, inN = 0, allN = 0, devSum = 0, trail = [], t = 25, fin = false, resets = 0;
      const TOL = 11;
      const fit = () => {
        const dpr = window.devicePixelRatio || 1, w = cv.parentElement.clientWidth, h = cv.parentElement.clientHeight;
        cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
        S = Math.min(w/400, h/300); ox = (w - 400*S)/2; oy = (h - 300*S)/2; paint();
      };
      const P2 = ([x,y]) => [ox + x*S, oy + y*S];
      function paint(){
        const w = cv.width, h = cv.height; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h); ctx.restore();
        // Maserung
        ctx.strokeStyle = 'rgba(150,100,50,.18)'; ctx.lineWidth = 2;
        for(let y = 20; y < 300; y += 22){ ctx.beginPath(); ctx.moveTo(...P2([0,y])); ctx.bezierCurveTo(...P2([130,y+8]),...P2([270,y-8]),...P2([400,y])); ctx.stroke(); }
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(30,40,50,.12)'; ctx.lineWidth = TOL*2*S; ctx.beginPath(); sh.pts.forEach((p,i) => i ? ctx.lineTo(...P2(p)) : ctx.moveTo(...P2(p))); ctx.stroke();
        ctx.setLineDash([8*S,6*S]); ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 2.2*S; ctx.beginPath(); sh.pts.forEach((p,i) => i ? ctx.lineTo(...P2(p)) : ctx.moveTo(...P2(p))); ctx.stroke(); ctx.setLineDash([]);
        for(let i = 1; i < trail.length; i++){
          ctx.strokeStyle = trail[i][2] ? '#0f8a4b' : '#d6281f'; ctx.lineWidth = 4*S;
          ctx.beginPath(); ctx.moveTo(...P2(trail[i-1])); ctx.lineTo(...P2(trail[i])); ctx.stroke();
        }
        ctx.fillStyle = '#0f8a4b'; ctx.beginPath(); ctx.arc(...P2(sh.pts[0]), 12*S, 0, Math.PI*2); ctx.fill();
        ctx.font = `${26*S}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🚩', ...P2(sh.pts[sh.pts.length-1]));
      }
      const toV = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - ox)/S, (e.clientY - r.top - oy)/S]; };
      const nearest = ([x,y]) => { let best = 1e9, L = 0; for(const p of line){ const d = Math.hypot(p[0]-x, p[1]-y); if(d < best){ best = d; L = p[2]; } } return [best, L]; };
      cv.addEventListener('pointerdown', e => {
        if(fin) return; const v = toV(e);

        if(trail.length){ const last = trail[trail.length-1]; if(Math.hypot(v[0]-last[0], v[1]-last[1]) > 26){ toast('Setz dort an, wo du aufgehört hast.'); return; } }
        drawing = true; cv.setPointerCapture(e.pointerId);
      });
      cv.addEventListener('pointermove', e => {
        if(!drawing || fin) return; const v = toV(e), [d, L] = nearest(v);

        paint();
        if(maxL >= total - 8){ end(); }

      cv.addEventListener('pointerup', () => { drawing = false; });
      cv.addEventListener('pointercancel', () => { drawing = false; });
      $('#hre', box).onclick = () => { if(resets || fin) return; resets++; trail = []; maxL = 0; inN = 0; allN = 0; devSum = 0; paint(); $('#hre', box).disabled = true; };
      const end = () => {
        if(fin) return; fin = true; drawing = false; clearInterval(iv);
        const cover = clamp(maxL / total, 0, 1), acc = allN ? inN/allN : 0;
        later(() => done({cover, acc, s: cover * (acc * .8 + .2 * clamp(1 - (devSum/Math.max(1,allN))/TOL, 0, 1))}), 300);
      };
      const iv = every(() => { t--; const e = $('#ht', box); if(e) e.textContent = t; if(t <= 0) end(); }, 1000);
      const onR = () => fit(); window.addEventListener('resize', onR); onClean(() => window.removeEventListener('resize', onR));
      requestAnimationFrame(fit);
    });
    res.push(r);
    if(k < 2) await gamePage(box, `<h3>${sh.n}: ${Math.round(r.acc*100)} % in der Spur</h3><p class="mt">${r.cover < .95 ? 'Du bist nicht ganz bis zum Ende gekommen.' : 'Bis zum Ende gesägt!'}</p>`, 'Nächste Form');
  }
  const score = res.reduce((a,r)=>a+r.s,0) / res.length;
  return {score, detail: `Genauigkeit in der Spur: ${res.map(r => Math.round(r.acc*100) + ' %').join(' · ')}.`};
};

/* ---------- TE: Getriebe & Strom ---------- */
function gearSVG(n, sizes){
  let x = 20, out = '', cx = [];
  sizes = sizes || Array(n).fill(32);
  sizes.forEach((r, i) => { if(i) x += sizes[i-1] + r + 2; else x += r; cx.push(x); });
  const W = x + sizes[n-1] + 20;
  sizes.forEach((r, i) => {
    const teeth = Math.round(r / 3.2);
    let d = '';
    for(let t = 0; t < teeth * 2; t++){ const a = t * Math.PI / teeth, rr = t % 2 ? r - 5 : r + 3; d += (t ? 'L' : 'M') + (cx[i] + rr*Math.cos(a)).toFixed(1) + ' ' + (60 + rr*Math.sin(a)).toFixed(1); }
    out += `<path d="${d}Z" fill="${i===0?'#ffc20e':'#b0bec5'}" stroke="#37474f" stroke-width="2"/><circle cx="${cx[i]}" cy="60" r="5" fill="#37474f"/>`;
    out += `<text x="${cx[i]}" y="${60 + r + 22}" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${String.fromCharCode(65+i)}</text>`;
  });
  out += `<path d="M ${cx[0]-sizes[0]*.55} ${60-sizes[0]*.95} A ${sizes[0]*1.1} ${sizes[0]*1.1} 0 0 1 ${cx[0]+sizes[0]*.55} ${60-sizes[0]*.95}" fill="none" stroke="#d6281f" stroke-width="4" marker-end="url(#ar)"/>`;
  return `<svg viewBox="0 0 ${W} 135" width="${Math.min(W*1.4, 560)}" style="color:inherit"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d6281f"/></marker></defs>${out}</svg>`;
}

function rulerSVG(v){ // v in mm
  let s = `<svg viewBox="0 0 460 110" width="520"><rect x="10" y="30" width="440" height="56" rx="4" fill="#f6d36b" stroke="#8a6d00" stroke-width="2"/>`;
  for(let mm = 0; mm <= 140; mm++){
    const x = 20 + mm * 3, h = mm % 10 === 0 ? 24 : mm % 5 === 0 ? 16 : 9;
    s += `<line x1="${x}" y1="30" x2="${x}" y2="${30+h}" stroke="#3b2a00" stroke-width="${mm%10===0?1.6:1}"/>`;
    if(mm % 10 === 0) s += `<text x="${x}" y="72" text-anchor="middle" font-size="13" fill="#3b2a00">${mm/10}</text>`;
  }
  const x = 20 + v * 3;
  s += `<path d="M${x} 28L${x-8} 8H${x+8}Z" fill="#d6281f"/><line x1="${x}" y1="28" x2="${x}" y2="88" stroke="#d6281f" stroke-width="2"/><text x="440" y="100" text-anchor="end" font-size="12" fill="currentColor">cm</text></svg>`;
  return s;
}

];
GAMES.SP = async (box, c) => {
  await gamePage(box, `<h3>✍️ Fehlerjagd</h3><p class="mt">Hier ist eine Bewerbung mit Rechtschreibfehlern. <b>Tippe jedes falsch geschriebene Wort an</b>. Tippe nochmal, um die Markierung zu entfernen.</p><p class="mt muted">Achtung: Nicht jedes Wort mit Unterstrich ist falsch! Wenn du fertig bist: „Prüfen“.</p>`, 'Text lesen');
  const src = pick(SP_TEXTS);
  const words = []; let html = '', k = 0;
  src.split(/(\{[^}]+\})/).forEach(part => {
    const m = part.match(/^\{([^|]+)\|([^}]+)\}$/);
    if(m){ words.push({shown:m[1], right:m[2], err: m[1] !== m[2]}); html += `<span class="w" data-w="${k++}">${esc(m[1])}</span>`; }
    else html += esc(part);
  });
  const errs = words.filter(w => w.err).length;
  const r = await new Promise(done => {
    const sel = new Set();
    box.innerHTML = `<div class="hud"><span class="pill">Fehler im Text: ${errs}</span><span class="pill">markiert: <span id="sm">0</span></span></div>
      <div class="wordtext card">${html}</div><div class="row mt"><button class="btn" id="spok">Prüfen</button></div>`;
    $$('.w', box).forEach(el => el.onclick = () => { const i = +el.dataset.w; sel.has(i) ? sel.delete(i) : sel.add(i); el.classList.toggle('on'); $('#sm', box).textContent = sel.size; });
    $('#spok', box).onclick = () => {
      let tp = 0, fp = 0;
      $$('.w', box).forEach(el => {
        const i = +el.dataset.w, w = words[i]; el.onclick = null; el.classList.remove('on');
        if(sel.has(i) && w.err){ tp++; el.classList.add('right'); el.textContent = w.right; }
        else if(sel.has(i)){ fp++; el.classList.add('wrong'); }
        else if(w.err){ el.classList.add('missed'); el.textContent = w.shown + ' → ' + w.right; }
      });
      const s = clamp((tp - fp*.5) / errs, 0, 1);
      $('#spok', box).outerHTML = `<div class="fb ${s>=.8?'ok':s>=.5?'meh':'bad'}" style="flex:1"><b>${tp} von ${errs} Fehlern gefunden</b>${fp ? `, ${fp}× ein richtiges Wort markiert` : ''}. Grün = gefunden und korrigiert, rot umrandet = übersehen.</div><button class="btn" id="spn">Weiter</button>`;
      $('#spn', box).onclick = () => done({s, tp, fp});
    };
  });
  const form = await runQuiz(box, shuffle([
   {q:'Wie beginnst du eine Bewerbung an Herrn Weber?', opts:[{t:'Sehr geehrter Herr Weber,', s:1},{t:'Hallo Herr Weber!', s:.25},{t:'Hi Weber,', s:0},{t:'Sehr geehrte Herr Weber,', s:0}], fb:'„Sehr geehrter Herr …“ mit Komma – danach geht es klein weiter.'},

  ]), {label:'Formulierung', color:c.c});
  return {score: r.s * .7 + form.score * .3, detail: `${r.tp} von ${errs} Fehlern gefunden · Formulierungen: ${pct(form.score)}.`};
};

GAMES.KR = async (box, c) => {
  const objs = shuffle([['🪣','Eimer'],['🧱','Ziegelstein'],['📰','alte Zeitung'],['📦','Pappkarton'],['🧦','einzelne Socke'],['🍾','leere Glasflasche']]).slice(0,2);

  const counts = [];
  for(let k = 0; k < objs.length; k++){
    const [e, n] = objs[k];
    const ideas = await new Promise(done => {
      const list = []; let t = 60;
      box.innerHTML = `<div class="hud"><span class="pill">Runde ${k+1}/2</span><span class="pill">💡 <span id="kc">0</span> Ideen</span><span class="spacer"></span><span class="pill">⏱ <span id="kt">${t}</span> s</span></div>
        <div class="center"><div style="font-size:80px;line-height:1">${e}</div><h3>Was kann man mit einer ${esc(n)} alles machen?</h3></div>
        <div class="row mt"><input class="inp" id="ki" style="flex:1" maxlength="60" autocomplete="off" placeholder="Idee eintippen …"><button class="btn" id="ka">+</button></div>
        <div class="ideas" id="kl"></div>`;
      const inp = $('#ki', box);
      const add = () => {
        const v = inp.value.trim(); if(v.length < 3){ inp.focus(); return; }
        const norm = v.toLowerCase().replace(/[^a-zäöüß ]/g,'').replace(/\s+/g,' ');
        if(list.some(x => x.n === norm)){ toast('Die Idee hast du schon.'); inp.value = ''; return; }
        list.push({v, n:norm}); inp.value = ''; inp.focus();
        $('#kl', box).innerHTML = list.map(x => `<span>${esc(x.v)}</span>`).join(''); $('#kc', box).textContent = list.length;
      };
      $('#ka', box).onclick = add; inp.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); add(); } });
      inp.focus();
      const iv = every(() => { t--; $('#kt', box).textContent = t; if(t <= 0){ clearInterval(iv); add(); done(list); } }, 1000);
    });
    counts.push(ideas.length);
    if(k === 0) await gamePage(box, `<h3>${ideas.length} Ideen!</h3><p class="mt">Tipp für Runde 2: Denk an ganz andere Bereiche – Sport, Kunst, Küche, Garten, Musik, Tiere …</p>`, 'Runde 2');
  }
  const score = (Math.min(1, counts[0]/8) + Math.min(1, counts[1]/8)) / 2;
  return {score, detail: `Ideen: ${counts[0]} und ${counts[1]}.`};
};

   3D-Stationen (three.js, wird erst bei Bedarf geladen)
   ========================================================= */
let THREE_P = null;
function loadThree(){
  if(window.THREE) return Promise.resolve(true);
  if(THREE_P) return THREE_P;
  THREE_P = new Promise(res => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = () => res(!!window.THREE);
    s.onerror = () => { THREE_P = null; res(false); };
    document.head.appendChild(s);
    setTimeout(() => res(!!window.THREE), 15000);
  });
  return THREE_P;
}
function webglOK(){ try{ const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }catch(e){ return false; } }

function make3D(host, opt = {}){
  const T = THREE;
  const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const size = () => { const w = host.clientWidth || 600, h = host.clientHeight || 400; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(opt.fov || 38, 1.5, .1, 100);
  camera.position.set(0, opt.camY ?? 3.4, opt.camZ ?? 8); camera.lookAt(0, opt.lookY ?? .2, 0);
  scene.add(new T.HemisphereLight(0xffffff, 0x6b7785, .9));
  const dl = new T.DirectionalLight(0xffffff, .7); dl.position.set(4, 9, 6); scene.add(dl);
  const dl2 = new T.DirectionalLight(0xffffff, .25); dl2.position.set(-5, 2, -4); scene.add(dl2);
  const tilt = new T.Group(), content = new T.Group(); tilt.add(content); scene.add(tilt);
  let rx = opt.rx ?? .3, ry = opt.ry ?? -.6, tapCb = null;
  const render = () => renderer.render(scene, camera);
  const apply = () => { tilt.rotation.x = rx; content.rotation.y = ry; render(); };
  host.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction = 'none';
  size(); apply();
  let down = null;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now(), lx:e.clientX, ly:e.clientY, moved:0}; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if(!down) return; const dx = e.clientX - down.lx, dy = e.clientY - down.ly; down.lx = e.clientX; down.ly = e.clientY;
    down.moved += Math.abs(dx) + Math.abs(dy);
    if(down.moved > 6){ ry += dx * .011; rx = clamp(rx + dy * .009, -1.35, 1.35); apply(); }
  });
  el.addEventListener('pointerup', e => {
    if(down && down.moved <= 8 && performance.now() - down.t < 600 && tapCb){
      const r = el.getBoundingClientRect();
      const v = new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      const rc = new T.Raycaster(); rc.setFromCamera(v, camera);
      const hits = rc.intersectObjects(content.children, true).filter(h => !h.object.userData.noHit);
      tapCb(hits[0] ? {point: content.worldToLocal(hits[0].point.clone()), obj: hits[0].object} : null);
    }
    down = null;
  });
  el.addEventListener('pointercancel', () => { down = null; });
  const onR = () => { size(); render(); };
  window.addEventListener('resize', onR);
  const api = {
    T, scene, camera, renderer, content, render,
    rotate: (dx, dy) => { ry += dx; rx = clamp(rx + dy, -1.35, 1.35); apply(); },
    setRot: (x, y) => { rx = x; ry = y; apply(); },
    onTap: cb => { tapCb = cb; },
    clear: () => { while(content.children.length){ const o = content.children[0]; content.remove(o); o.traverse(n => { if(n.geometry) n.geometry.dispose(); if(n.material){ (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => { if(m.map) m.map.dispose(); m.dispose(); }); } }); } },
    dispose: () => { window.removeEventListener('resize', onR); api.clear(); renderer.dispose(); try{ renderer.forceContextLoss(); }catch(e){} el.remove(); }
  };
  onClean(api.dispose);
  return api;
}

function buildWorkpiece(v, defects){
  const T = v.T, g = new T.Group();
  const wood = new T.MeshStandardMaterial({color:0xd9b27c, roughness:.85});
  const body = new T.Mesh(new T.BoxGeometry(3.2, 1.2, 2), wood); g.add(body);
  const edges = new T.LineSegments(new T.EdgesGeometry(body.geometry), new T.LineBasicMaterial({color:0x8a6a3a})); edges.userData.noHit = true; g.add(edges);
  const dark = new T.MeshStandardMaterial({color:0x2b2118, roughness:1});
  const hole = (x, y, z, axis, r = .14) => {
    const m = new T.Mesh(new T.CylinderGeometry(r, r, .03, 24), dark);
    m.position.set(x, y, z); if(axis === 'z') m.rotation.x = Math.PI/2; if(axis === 'x') m.rotation.z = Math.PI/2; g.add(m);
  };
  const ks = defects.map(d => d.k);
  // Soll: 4 Bohrungen oben in den Ecken, 1 Bohrung vorne mittig
  [[1.15,.7],[1.15,-.7],[-1.15,.7],[-1.15,-.7]].forEach(([x,z]) => {
    if(x === 1.15 && z === .7 && ks.includes('hole-missing')) return;
    hole(x, .611, z, 'y', (x === -1.15 && z === -.7 && ks.includes('hole-big')) ? .27 : .14);
  });
  hole(0, 0, 1.011, 'z');
  defects.forEach(d => {
    const [x,y,z] = d.pos;
    if(d.k === 'hole-extra') hole(x, y, z, 'z');
    if(d.k === 'crack'){ const m = new T.Mesh(new T.BoxGeometry(1.1, .02, .035), dark); m.position.set(x, y + .005, z); m.rotation.y = .5; g.add(m); }
    if(d.k === 'crack-bottom'){ const m = new T.Mesh(new T.BoxGeometry(.9, .02, .035), dark); m.position.set(x, y - .005, z); m.rotation.y = -.7; g.add(m); }
    if(d.k === 'stain'){ const m = new T.Mesh(new T.CircleGeometry(.24, 20), new T.MeshStandardMaterial({color:0x6e4a2a, roughness:1})); m.position.set(x - .005, y, z); m.rotation.y = -Math.PI/2; g.add(m); }
    if(d.k === 'stain-front'){ const m = new T.Mesh(new T.CircleGeometry(.17, 16), new T.MeshStandardMaterial({color:0xf3f0e6, roughness:.4})); m.position.set(x, y, z + .005); g.add(m); }
    if(d.k === 'chip'){ const m = new T.Mesh(new T.BoxGeometry(.32, .32, .32), new T.MeshStandardMaterial({color:0x9b7448, roughness:1})); m.position.set(1.52, -.52, .92); m.rotation.set(.6,.7,0); g.add(m); }
  });
  v.content.add(g);
  return g;
}

      const v = make3D($('#q3', box), {camZ:7.5, camY:3, ry: k % 2 ? .7 : -.6});
      buildWorkpiece(v, defs);
      const marks = [];
      bindRot(box, v);
      v.onTap(hit => {
        if(!hit) return;
        const m = new v.T.Mesh(new v.T.SphereGeometry(.09, 12, 12), new v.T.MeshBasicMaterial({color:0xff2d2d}));
        m.position.copy(hit.point); m.userData.noHit = true; v.content.add(m);
        marks.push({p: hit.point, m}); $('#qm', box).textContent = marks.length; v.render();
      });
      $('#qu', box).onclick = () => { const l = marks.pop(); if(l){ v.content.remove(l.m); l.m.geometry.dispose(); $('#qm', box).textContent = marks.length; v.render(); } };
      $('#qok', box).onclick = () => {
        const found = new Set(); let falses = 0;
        marks.forEach(mk => {
          let best = -1, bd = .5;
          defs.forEach((d, i) => { const dd = Math.hypot(mk.p.x - d.pos[0], mk.p.y - d.pos[1], mk.p.z - d.pos[2]); if(dd < bd){ bd = dd; best = i; } });
          if(best >= 0) found.add(best); else falses++;
        });
        let s;
        if(!defs.length) s = falses ? Math.max(0, 1 - .35 * falses) : 1;
        else s = clamp(found.size / defs.length - .2 * falses, 0, 1);
        done({s, found: found.size, n: defs.length, falses, missed: defs.filter((_,i) => !found.has(i)).map(d => d.txt)});
      };
    });
    res.push(r);
    await gamePage(box, `<h3>Werkstück ${k+1}: ${r.n ? `${r.found} von ${r.n} Fehlern gefunden` : (r.falses ? 'Dieses Werkstück war fehlerfrei!' : '✔ Richtig erkannt: fehlerfrei!')}</h3>
      ${r.missed.length ? `<p class="mt">Übersehen: ${r.missed.join(', ')}.</p>` : ''}${r.falses ? `<p class="mt">${r.falses}× wurde etwas markiert, das in Ordnung war.</p>` : ''}`, k < 2 ? 'Nächstes Werkstück' : 'Auswertung');
  }
  const score = res.reduce((a,r)=>a+r.s,0) / 3;
  return {score, detail: `Gefundene Fehler: ${res.reduce((a,r)=>a+r.found,0)} von ${res.reduce((a,r)=>a+r.n,0)} · Fehlalarme: ${res.reduce((a,r)=>a+r.falses,0)}.`};
};

/* ---------- RA: Würfelbau 3D ---------- */
function makeHeights(){
  for(let tries = 0; tries < 200; tries++){
    const h = Array.from({length:3}, () => Array.from({length:3}, () => pick([0,1,1,2,2,3])));
    const n = h.flat().reduce((a,b)=>a+b,0);
    const front = [0,1,2].map(x => Math.max(h[0][x], h[1][x], h[2][x]));
    const side = [0,1,2].map(z => Math.max(...h[z]));
    if(n < 7 || n > 15) continue;
    if(front[0] === front[2] || front.join() === side.join() || front.join() === side.slice().reverse().join()) continue;
    if(h.flat().filter(v => v === 0).length > 3) continue;
    return h;
  }
  return [[1,2,0],[3,1,2],[2,0,1]];
}
function buildCubes(v, h){
  const T = v.T, cols = [0x6c8cff, 0x48c78e, 0xffb347, 0xff6b6b];
  const geo = new T.BoxGeometry(.96,.96,.96);
  const ground = new T.Mesh(new T.BoxGeometry(3.4,.08,3.4), new T.MeshStandardMaterial({color:0xcfd8dc})); ground.position.y = -.04; v.content.add(ground);
  // „vorne“-Markierung
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const cx = cv.getContext('2d');
  cx.fillStyle = '#d6281f'; cx.fillRect(0,0,256,64); cx.fillStyle = '#fff'; cx.font = 'bold 40px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('VORNE', 128, 34);
  const tag = new T.Mesh(new T.PlaneGeometry(1.6,.4), new T.MeshBasicMaterial({map:new T.CanvasTexture(cv)}));
  tag.rotation.x = -Math.PI/2; tag.position.set(0, .01, 2.05); v.content.add(tag);
  for(let z = 0; z < 3; z++) for(let x = 0; x < 3; x++) for(let y = 0; y < h[z][x]; y++){
    const m = new T.Mesh(geo, new T.MeshStandardMaterial({color: cols[y], roughness:.6}));
    m.position.set(x - 1, y + .5, z - 1); v.content.add(m);
    const e = new T.LineSegments(new T.EdgesGeometry(geo), new T.LineBasicMaterial({color:0x1b232a})); e.position.copy(m.position); v.content.add(e);
  }
}
function topSVG(h){
  let s = `<svg viewBox="0 0 96 112" width="110"><text x="48" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#d6281f">VORNE</text>`;
  for(let z = 0; z < 3; z++) for(let x = 0; x < 3; x++){
    const v = h[z][x];
    s += `<rect x="${4+x*30}" y="${4+z*30}" width="28" height="28" rx="3" fill="${v ? '#dfe7ff' : 'none'}" stroke="currentColor" stroke-width="1.5"/>`;
    if(v) s += `<text x="${18+x*30}" y="${24+z*30}" text-anchor="middle" font-size="16" font-weight="700" fill="#1b232a">${v}</text>`;
  }
  return s + '</svg>';
}
function viewSVG(cols){
  let s = `<svg viewBox="0 0 96 96" width="100">`;
  cols.forEach((n, x) => { for(let y = 0; y < n; y++) s += `<rect x="${4+x*30}" y="${92-(y+1)*29}" width="28" height="28" fill="#dfe7ff" stroke="currentColor" stroke-width="1.5"/>`; });

}

const ROLES = ['Mitschüler:in','Lehrkraft','Andere Person'];
const CODE_ALPH = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function encodeFremd(r, role){
  let n = BigInt(role);
  for(let i = COMPS.length - 1; i >= 0; i--) n = n * 5n + BigInt(r[COMPS[i].id] || 0);
  let s = ''; for(let k = 0; k < 10; k++){ s = CODE_ALPH[Number(n % 32n)] + s; n /= 32n; }
  let ck = 0; for(let k = 0; k < s.length; k++) ck += CODE_ALPH.indexOf(s[k]) * (k + 3);
  s += CODE_ALPH[ck % 32];
  return s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8);
}
function decodeFremd(code){
  const s = String(code).toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/I/g,'1');
  if(s.length !== 11) return null;
  const body = s.slice(0,10); let ck = 0;
  for(let k = 0; k < 10; k++){ const v = CODE_ALPH.indexOf(body[k]); if(v < 0) return null; ck += v * (k + 3); }
  if(CODE_ALPH[ck % 32] !== s[10]) return null;
  let n = 0n; for(const ch of body) n = n * 32n + BigInt(CODE_ALPH.indexOf(ch));
  const r = {}; COMPS.forEach(c => { const v = Number(n % 5n); n /= 5n; if(v) r[c.id] = v; });
  const role = Number(n); if(role > 2) return null;
  return {r, role};
}

function netSVG(cells){
  const mx = Math.max(...cells.map(c=>c[0])), my = Math.max(...cells.map(c=>c[1])), s = 22;
  return `<svg viewBox="-2 -2 ${(mx+1)*s+4} ${(my+1)*s+4}" width="${(mx+1)*s*1.35}">${cells.map(([x,y]) => `<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#dfe7ff" stroke="#1b232a" stroke-width="1.6"/>`).join('')}</svg>`;
}
function polyNorm(cells){ const mx = Math.min(...cells.map(c=>c[0])), my = Math.min(...cells.map(c=>c[1])); return cells.map(([x,y]) => [x-mx, y-my]).sort((a,b) => a[0]-b[0] || a[1]-b[1]); }

const polyRot = c => c.map(([x,y]) => [-y, x]);
const polyMir = c => c.map(([x,y]) => [-x, y]);
function makePoly(n){
  const cells = [[0,0]];

}
function polySVG(cells, col = '#ffd27a'){
  const c = polyNorm(cells), s = 20, mx = Math.max(...c.map(v=>v[0])), my = Math.max(...c.map(v=>v[1]));
  return `<svg viewBox="-2 -2 ${(mx+1)*s+4} ${(my+1)*s+4}" width="${Math.max(60,(mx+1)*s*1.3)}">${c.map(([x,y]) => `<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="${col}" stroke="#1b232a" stroke-width="1.6"/>`).join('')}</svg>`;
}

  });
  for(let k = 0; k < 2; k++){

    for(let t = 0; t < 50; t++){

      const rk = new Set(rots.map(polyKey));
      mirs = rots.map(polyMir);

function cmpPairs(n){
  const out = [];

    let b = a; const same = Math.random() < .5;
    if(!same){
      const chars = a.split(''); const idx = chars.map((ch,k)=>k).filter(k => /\d/.test(chars[k]));
      const k = pick(idx);
      if(Math.random() < .5 && k + 1 < chars.length && /\d/.test(chars[k+1]) && chars[k] !== chars[k+1]){ [chars[k], chars[k+1]] = [chars[k+1], chars[k]]; }
      else { chars[k] = String((+chars[k] + rnd(1,8)) % 10); }
      b = chars.join('');
    }
    out.push({q:'Sind beide Angaben <b>genau gleich</b>?', pre:`<div class="cmp-row"><div>${a}</div><div>${b}</div></div>`, cid:['So','D'], timer:7, keep:true,

}

  p.test[id] = {done:true, date:today(), score:r.score, comp}; saveDB();
  show(`<h2>${s.icon} ${esc(s.name)}</h2>
    <div class="card mt center stack"><div class="score">${pct(r.score)}</div><p>${r.answers.filter(a=>a.s>=1).length} von ${items.length} Aufgaben richtig gelöst.</p>
      <div class="jobs" style="justify-content:center">${Object.entries(comp).map(([cid,v]) => `<span class="job" style="cursor:default">${CBY[cid].icon} ${esc(CBY[cid].name)}: ${pct(v.s/v.n)}</span>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="tback">Zurück zum Test</button><button class="btn sec" id="tsol">Lösungen ansehen</button></div></div>
    <div id="sol"></div>`);
  $('#tback').onclick = renderTestHub;
  $('#tsol').onclick = () => {
    $('#sol').innerHTML = `<div class="card mt"><h3>Lösungen</h3>${r.answers.map((a,i) => { const it = a.item, best = it.opts.reduce((m,o,k) => (o.s > it.opts[m].s ? k : m), 0); return `
      <div class="stmt"><div class="small muted">Aufgabe ${i+1} ${a.s >= 1 ? '✅' : a.s > 0 ? '🟡' : '❌'}</div>${it.pre ? `<div class="small">${it.pre}</div>` : ''}${it.illu ? `<div class="illu">${it.illu}</div>` : ''}<div><b>${it.q}</b></div>
      <div class="row mt" style="align-items:flex-start"><div><span class="small muted">Richtig:</span><div>${it.opts[best].t}</div></div>${a.k !== best ? `<div><span class="small muted">Deine Antwort:</span><div>${a.k >= 0 ? it.opts[a.k].t : '– (Zeit abgelaufen)'}</div></div>` : ''}</div></div>`; }).join('')}</div>`;
    $('#tsol').disabled = true;
  };
}

/* =========================================================
   Auswertung
   ========================================================= */
const SHORT = {D:'Durchhalten',K:'Kommunikation',L:'Leistung',P:'Problemlösen',R:'Respekt',S:'Selbstständig',So:'Sorgfalt',T:'Team',Z:'Zuverlässig',
  HW:'Handwerk',TE:'Technik',RA:'Raum',MA:'Rechnen',SP:'Sprache',KR:'Kreativität',KA:'Organisation',SO:'Soziales',DI:'Digital',KB:'Belastbar',KU:'Kunden'};
const SERIES = [
  {k:'self', n:'Selbst', c:'var(--s-self)', dash:''},
  {k:'fremd', n:'Fremd', c:'var(--s-fremd)', dash:'7 5'},
  {k:'game', n:'Stationen', c:'var(--s-game)', dash:'2 4'},
  {k:'test', n:'Test', c:'var(--s-test)', dash:'10 3 2 3'}
];
let EVAL_ON = {self:true, fremd:true, game:true, test:true};
function valOf(p, k, id){ return k === 'self' ? selfVal(p,id) : k === 'fremd' ? fremdVal(p,id) : k === 'game' ? gameVal(p,id) : testVal(p,id); }
function radarSVG(p, comps, title){
  const N = comps.length, cx = 210, cy = 200, R = 140;
  const pt = (i, v) => { const a = -Math.PI/2 + i * 2*Math.PI/N, r = R * (v - 0) / 4; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  let s = `<svg viewBox="-80 0 580 410" role="img" aria-label="${esc(title)}">`;
  for(let l = 1; l <= 4; l++){ s += `<polygon points="${comps.map((_,i) => pt(i,l).join(',')).join(' ')}" fill="${l===4?'var(--surface2)':'none'}" stroke="var(--line)" stroke-width="${l===4?2:1}"/>`; }
  comps.forEach((c,i) => {
    const [x,y] = pt(i,4), [lx,ly] = pt(i,4.75);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const anchor = Math.abs(lx - cx) < 8 ? 'middle' : lx > cx ? 'start' : 'end';
    s += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="14" font-weight="700" fill="currentColor">${c.icon} ${SHORT[c.id]}</text>`;
  });
  SERIES.forEach(se => {
    if(!EVAL_ON[se.k]) return;
    const vals = comps.map(c => valOf(p, se.k, c.id));
    if(vals.every(v => v == null)) return;
    const pts = comps.map((c,i) => pt(i, vals[i] == null ? 0 : vals[i]));
    s += `<polygon points="${pts.map(q=>q.join(',')).join(' ')}" fill="${se.c}" fill-opacity=".08" stroke="${se.c}" stroke-width="3" stroke-dasharray="${se.dash}" stroke-linejoin="round"/>`;
    pts.forEach((q,i) => { if(vals[i] != null) s += `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${se.c}"/>`; });
  });
  return s + `<text x="210" y="402" text-anchor="middle" font-size="12" fill="var(--muted)">Mitte = 0 · äußerer Ring = 4 (Stärke)</text></svg>`;
}
const f1 = v => v == null ? '–' : v.toFixed(1).replace('.', ',');
function flagFor(p, id){
  const s = selfVal(p,id), f = fremdVal(p,id);
  if(s == null || f == null) return '';
  if(f - s >= 1) return `<span class="flag down">👀 andere sehen mehr</span>`;
  if(s - f >= 1) return `<span class="flag up">🤔 du schätzt dich höher ein</span>`;
  return '';
}
function renderEval(tab = 'profil'){
  cleanup(); IN_GAME = false; const p = P(); if(!p) return renderStart();
  const done = stationsDone(p), any = done || p.fremd.length || testSectionsDone(p);
  if(!any){
    show(`<h2>🧭 Auswertung</h2><div class="card mt center stack"><div style="font-size:54px">🚧</div><p>Für eine Auswertung brauchst du erst ein paar Ergebnisse. Spiel ein paar Stationen oder mach einen Teil des Kompetenztests.</p><button class="btn" id="eh">Zur Übersicht</button></div>`);
    $('#eh').onclick = renderHub; return;
  }
  const ranked = COMPS.map(c => ({c, v: totalVal(p, c.id)})).filter(x => x.v != null).sort((a,b) => b.v - a.v);
  const strengths = ranked.slice(0, 4), weak = ranked.length > 5 ? ranked.slice(-3).reverse() : [];
  const recA = rankFields(p, 'parcours'), recB = rankFields(p, 'test'), recAll = rankFields(p, 'all');
  const topA = recA.slice(0,3), topB = recB.slice(0,3), bothIds = topA.map(x => x.f.id).filter(id => topB.some(y => y.f.id === id));
  p.goals = p.goals || [];
  show(`
  <div class="row"><h2 style="flex:1">🧭 Auswertung für ${esc(p.name)}</h2><button class="btn sec small noprint" id="pr">🖨️ Drucken / PDF</button></div>
  <p class="muted">Stand ${fmtDate(today())} · ${done}/20 Stationen · ${p.fremd.length} Fremdeinschätzung${p.fremd.length===1?'':'en'} · Test ${testSectionsDone(p)}/${TEST_SECTIONS.length}${p.interests ? ' · Interessen-Check ✓' : ''}</p>
  ${done < 20 || !p.fremd.length || testSectionsDone(p) < TEST_SECTIONS.length ? `<div class="warnbox mt noprint">Die Auswertung wird genauer, je mehr du machst: ${[done < 20 ? `${20-done} Stationen offen` : '', !p.fremd.length ? 'noch keine Fremdeinschätzung' : '', testSectionsDone(p) < TEST_SECTIONS.length ? `${TEST_SECTIONS.length - testSectionsDone(p)} Testteile offen` : '', !p.interests ? 'Interessen-Check fehlt' : ''].filter(Boolean).join(' · ')}.</div>` : ''}
  <div class="tabs noprint" role="tablist">${[['profil','📊 Mein Profil'],['berufe','🧭 Berufsfelder'],['praktikum','🏁 Praktikum & Ziele']].map(([k,t]) => `<button data-tab="${k}" class="${tab===k?'on':''}" role="tab">${t}</button>`).join('')}</div>

  <section class="tabpane" data-pane="profil">
    <div class="legend noprint">${SERIES.map(se => `<button data-se="${se.k}" class="${EVAL_ON[se.k]?'':'off'}" style="--c:${se.c}"><i></i>${se.n}</button>`).join('')}</div>
    <div class="radars mt">
      <div class="card radar"><h3>🏛️ Schlüsselkompetenzen (KomPo7)</h3>${radarSVG(p, K7, 'Schlüsselkompetenzen')}</div>
      <div class="card radar"><h3>🏭 Berufliche Kompetenzen</h3>${radarSVG(p, BERUF, 'Berufliche Kompetenzen')}</div>
    </div>
    <div class="grid mt">
      <div class="card"><h3>💪 Deine Stärken</h3><div class="stack mt">${strengths.map(x => `<div><b>${x.c.icon} ${esc(x.c.name)}</b> <span class="muted">(${f1(x.v)})</span><div class="small muted">${esc(x.c.def)}</div></div>`).join('') || '<p class="muted">Noch zu wenige Daten.</p>'}</div></div>
      <div class="card"><h3>🌱 Hier kannst du wachsen</h3><div class="stack mt">${weak.map(x => `<div><b>${x.c.icon} ${esc(x.c.name)}</b> <span class="muted">(${f1(x.v)})</span><div class="small">💡 ${esc(x.c.tip)}</div></div>`).join('') || '<p class="muted">Mach noch ein paar Stationen, dann siehst du hier Entwicklungsfelder.</p>'}</div></div>
    </div>
    <div class="card mt"><h3>Alle Kompetenzen im Vergleich</h3>
      <p class="small muted">Skala 1–4. Gesamt = gewichteter Mittelwert aller vorhandenen Werte (Selbst 30 %, Fremd 25 %, Stationen 20 %, Test 25 %). Tippe auf 🔁, um eine Station nochmal zu testen.</p>
      <div class="tbl-wrap mt"><table class="ctable"><thead><tr><th>Kompetenz</th><th class="center">Selbst</th><th class="center">Fremd</th><th class="center">Station</th><th class="center">Test</th><th>Gesamt</th><th class="noprint"></th></tr></thead><tbody>
      ${COMPS.map(c => { const t = totalVal(p, c.id); return `<tr style="--cc:${c.c}">
        <td><span class="dot"></span>${c.icon} ${esc(c.name)}<br>${flagFor(p, c.id)}</td>
        <td class="n">${f1(selfVal(p,c.id))}</td><td class="n">${f1(fremdVal(p,c.id))}</td><td class="n">${f1(gameVal(p,c.id))}</td><td class="n">${f1(testVal(p,c.id))}</td>
        <td style="min-width:110px">${t == null ? '–' : `<div class="gbar"><i style="width:${Math.round((t-1)/3*100)}%"></i></div><span class="small">${f1(t)} · ${LEVEL_TXT[clamp(Math.round(t),1,4)]}</span>`}</td>
        <td class="noprint"><button class="iconbtn" data-re="${c.id}" aria-label="${esc(c.name)} nochmal testen" style="min-width:44px;min-height:44px">🔁</button></td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="small muted mt">👀 = andere schätzen dich mindestens eine Stufe höher ein als du selbst (verborgene Stärke?) · 🤔 = du schätzt dich mindestens eine Stufe höher ein als andere – sprich darüber!</p>
    </div>
  </section>

  <section class="tabpane" data-pane="berufe">
    <div class="note">Die Empfehlungen sind eine <b>Orientierung</b>, keine Festlegung. Sie verbinden deine Kompetenzen${p.interests ? ' und Interessen' : ''} mit dem, was in Berufsfeldern besonders gebraucht wird. Schau dir die Berufe bei BERUFE.TV und BERUFENET an!</div>
    <h3 class="mt2">🎮 Empfehlung aus dem Parcours <span class="small muted">(Stationen, Selbst- & Fremdeinschätzung${p.interests ? ', Interessen' : ''})</span></h3>
    <div class="stack mt">${topA.length ? topA.map((x,i) => fieldCard(p, x, i, bothIds.includes(x.f.id))).join('') : '<p class="muted">Noch zu wenige Stationen – spiel mindestens 6.</p>'}</div>
    <h3 class="mt2">📝 Empfehlung aus dem Kompetenztest</h3>
    <div class="stack mt">${topB.length ? topB.map((x,i) => fieldCard(p, x, i, bothIds.includes(x.f.id))).join('') : '<p class="muted">Mach mindestens drei Teile des Kompetenztests, dann bekommst du hier eine zweite Empfehlung.</p>'}</div>
    ${bothIds.length ? `<div class="warnbox mt">⭐ <b>Doppelt empfohlen:</b> ${bothIds.map(id => FBY[id].icon + ' ' + esc(FBY[id].name)).join(', ')} – hier passen Parcours und Test zusammen.</div>` : ''}
    <details class="card mt"><summary><b>Alle Berufsfelder im Überblick (Gesamtwertung)</b></summary>
      <div class="stack mt">${recAll.map(x => `<div class="row" style="gap:10px"><span style="width:34px;font-size:24px">${x.f.icon}</span><span style="flex:1;min-width:150px">${esc(x.f.name)}</span><div class="gbar" style="flex:2;--cc:var(--s-self)"><i style="width:${Math.round(x.score*100)}%"></i></div><b style="width:52px;text-align:right">${pct(x.score)}</b></div>`).join('')}</div>
    </details>
  </section>

  <section class="tabpane" data-pane="praktikum">
    <div class="card"><h3>🏢 Passende Praktikumsplätze</h3>
      <p class="small muted">Aus deinen Top-Berufsfeldern – frag in deiner Umgebung nach, ob dort Praktika möglich sind.</p>
      <div class="stack mt">${(recAll.slice(0,3)).map(x => `<div><b>${x.f.icon} ${esc(x.f.name)}</b><div>${esc(x.f.prak)}</div></div>`).join('') || '<p class="muted">Noch keine Empfehlung möglich.</p>'}</div>
    </div>
    <div class="card mt"><h3>🎯 Meine Ziele fürs Praktikum</h3>
      <p class="small muted">Wähle bis zu drei Ziele aus – sie passen zu deinen Entwicklungsfeldern. Du kannst auch andere Kompetenzen auswählen.</p>
      <div class="stack mt" id="goals">${(weak.length ? weak.map(x => x.c) : []).concat(COMPS.filter(c => !weak.some(w => w.c.id === c.id))).map((c,i) => `
        <label class="row ${i >= 3 ? 'more-goal' : ''}" style="gap:10px;align-items:flex-start;${i >= 3 && !p.goals.includes(c.id) ? 'display:none' : ''}">
          <input type="checkbox" data-goal="${c.id}" ${p.goals.includes(c.id) ? 'checked' : ''} style="width:26px;height:26px;margin-top:2px">
          <span><b>${c.icon} ${esc(c.name)}:</b> ${esc(c.goal)}</span></label>`).join('')}</div>
      <button class="btn ghost small noprint" id="moreGoals">Weitere Ziele anzeigen</button>
    </div>
    <div class="card mt"><h3>🗣️ Gesprächsimpulse</h3>
      <ul style="margin:8px 0 0;padding-left:22px">
        <li>Welches Ergebnis hat dich überrascht – und warum?</li>
        <li>Wo unterscheiden sich Selbst- und Fremdeinschätzung? Woran könnte das liegen?</li>
        <li>Welches empfohlene Berufsfeld möchtest du dir genauer ansehen? Welcher Beruf daraus klingt spannend?</li>
        <li>Welche Station hat dir am meisten Spaß gemacht – passt das zu den Empfehlungen?</li>
      </ul>
    </div>
  </section>
  <div class="row mt2 noprint"><button class="btn sec" id="eh">Zur Übersicht</button></div>`);
  const setTab = k => { $$('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k)); $$('.tabpane').forEach(s => s.style.display = s.dataset.pane === k ? '' : 'none'); };
  setTab(tab);
  $$('[data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $$('[data-se]').forEach(b => b.onclick = () => { EVAL_ON[b.dataset.se] = !EVAL_ON[b.dataset.se]; renderEval('profil'); });
  $$('[data-re]').forEach(b => b.onclick = () => openStation(b.dataset.re));
  $$('[data-job]').forEach(b => b.onclick = () => jobModal(b.dataset.job));
  $$('[data-goal]').forEach(cb => cb.onchange = () => {
    const sel = $$('[data-goal]').filter(x => x.checked).map(x => x.dataset.goal);
    if(sel.length > 3){ cb.checked = false; toast('Höchstens drei Ziele – konzentrier dich aufs Wichtigste.'); return; }
    p.goals = sel; saveDB();
  });
  $('#moreGoals').onclick = () => { $$('.more-goal').forEach(l => l.style.display = ''); $('#moreGoals').remove(); };
  $('#pr').onclick = () => { $$('.tabpane').forEach(s => s.style.display = ''); $$('details').forEach(d => d.open = true); window.print(); setTimeout(() => setTab($('[data-tab].on') ? $('[data-tab].on').dataset.tab : 'profil'), 400); };
  $('#eh').onclick = renderHub;
}
function fieldCard(p, x, i, both){
  const why = x.contrib.slice(0,3).map(c => `${CBY[c.cid].icon} ${esc(CBY[c.cid].name)}`).join(', ');
  return `<div class="field" ${both ? 'style="border-color:var(--yellow)"' : ''}>
    <div class="fh"><span class="fi">${x.f.icon}</span><div><div class="small muted">Platz ${i+1}${both ? ' · ⭐ doppelt empfohlen' : ''}</div><h3>${esc(x.f.name)}</h3></div><span class="fm">${pct(x.score)}</span></div>
    <p class="small mt"><b>Warum?</b> Besonders passend: ${why}.${x.interest != null ? (x.interest > .3 ? ' Außerdem interessierst du dich für diesen Bereich.' : x.interest < -.3 ? ' Im Interessen-Check fandest du diesen Bereich aber eher weniger spannend.' : '') : ''}</p>
    <div class="jobs">${x.f.jobs.map(j => `<button class="job" data-job="${esc(x.f.id + '|' + j[0])}">${esc(j[0])}</button>`).join('')}</div>
    <p class="small muted mt">🏢 Praktikum z. B. in: ${esc(x.f.prak)}</p>
  </div>`;
}
function jobModal(key){
  const [fid, name] = key.split('|'); const f = FBY[fid], j = f.jobs.find(x => x[0] === name);
  modal(`<div class="small muted">${f.icon} ${esc(f.name)}</div><h3>${esc(j[0])}</h3><p class="mt">${esc(j[1])}.</p>
    <p class="mt small">Mehr erfahren – such dort nach <b>„${esc(j[0])}“</b>:</p>
    <div class="stack mt">
      <a class="btn" href="https://www.berufe.tv/" target="_blank" rel="noopener">🎬 BERUFE.TV (Filme)</a>
      <a class="btn sec" href="https://web.arbeitsagentur.de/berufenet/" target="_blank" rel="noopener">📚 BERUFENET</a>
      <a class="btn sec" href="https://planet-beruf.de/" target="_blank" rel="noopener">🪐 planet-beruf.de</a>
      <button class="btn sec" id="cp">📋 Berufsnamen kopieren</button>
      <button class="btn ghost" data-close>Schließen</button></div>`, (box) => {
    $('#cp', box).onclick = async () => { try{ await navigator.clipboard.writeText(j[0]); toast('Kopiert – jetzt dort ins Suchfeld einfügen.'); }catch(e){ toast(j[0]); } };
  });
}

/* =========================================================
   Start
