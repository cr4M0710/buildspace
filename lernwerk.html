/* ---------- Paar oder kein Paar ---------- */
function renderPairOrNot(api, a) {
  const p = Conv.pairs(a), items = api.rnd(p);
  api.setMax(items.length);
  const dur = spd(api, [10000, 7000, 4500]);
  let i = 0, done = false, t0 = 0;
  const T = timers(api);
  const answer = (v) => {
    if (done || api.ended) return; done = true;
    const it = items[i], ok = v === it.truth;
    $(`.pn-btns [data-v="${it.truth ? 1 : 0}"]`, api.el).classList.add("pop");
    if (ok) api.right(); else { api.wrong({ prompt: `${it.term} ↔ ${it.shown}`, given: v == null ? "keine Antwort" : v ? "Paar" : "kein Paar", correct: it.truth ? "Paar" : `kein Paar – richtig: ${it.term} = ${it.definition}` }); $(".pn-cards", api.el).classList.add("shake"); }
    i++; T(show, ok ? 600 : 1500);
  };
  items.forEach((it) => {
    const others = p.filter((x) => x.definition !== it.definition);
    it.truth = !others.length || Math.random() < 0.5;
    it.shown = it.truth ? it.definition : others[Math.floor(Math.random() * others.length)].definition;
  });
  const show = () => {
    if (i >= items.length) return api.finish();
    const it = items[i]; done = false;
    api.el.innerHTML = `<div class="prog">${i + 1} von ${items.length}</div><div class="pn-cards"><div class="s-card pn-card">${esc(it.term)}</div><div class="pn-mid">?</div><div class="s-card pn-card">${esc(it.shown)}</div></div><div class="tf-bar"><i></i></div>
      <div class="tf-btns pn-btns"><button class="s-btn t" data-v="1">✓ Paar</button><button class="s-btn f" data-v="0">✗ Kein Paar</button></div>`;
    $$(".pn-btns button", api.el).forEach((b) => (b.onclick = () => answer(b.dataset.v === "1")));
    t0 = performance.now();
  };
  rafLoop(api, (now) => { const bar = $(".tf-bar i", api.el); if (!bar || done) return; const pr = 1 - (now - t0) / dur; bar.style.width = Math.max(0, pr * 100) + "%"; if (pr <= 0) answer(null); });
  keys(api, (e) => { if (e.key === "ArrowLeft") answer(true); if (e.key === "ArrowRight") answer(false); });
  show();
}

/* ---------- Geschwindigkeitssortierung ---------- */
function renderSpeedSort(api, a) {
  const g = Conv.cats(a);
  const items = api.rnd(g.flatMap((grp, gi) => grp.items.map((t) => ({ t, gi }))));
  api.setMax(items.length);
  const dur = spd(api, [8000, 5500, 3500]);
  let i = 0, done = true, t0 = 0;
  const T = timers(api);
  api.el.innerHTML = `<div class="prog" id="ssProg"></div><div class="ss-item s-card"></div><div class="tf-bar"><i></i></div><div class="ss-groups">${g.map((x, k) => `<button class="s-btn ss-g" data-g="${k}"><small>${k + 1}</small> ${esc(x.name)}</button>`).join("")}</div>`;
  const show = () => {
    if (i >= items.length) return api.finish();
    done = false; t0 = performance.now();
    const el = $(".ss-item", api.el); el.textContent = items[i].t; el.className = "ss-item s-card pop";
    $("#ssProg", api.el).textContent = `${i + 1} von ${items.length}`;
  };
  const answer = (gi) => {
    if (done || api.ended) return; done = true;
    const it = items[i], ok = gi === it.gi, el = $(".ss-item", api.el);
    el.classList.add(ok ? "ok" : "bad");
    if (ok) api.right(); else api.wrong({ prompt: it.t, given: gi == null ? "zu langsam" : g[gi].name, correct: g[it.gi].name });
    i++; T(show, ok ? 450 : 1200);
  };
  $(".ss-groups", api.el).onclick = (e) => { const b = e.target.closest(".ss-g"); if (b) answer(+b.dataset.g); };
  keys(api, (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= g.length) answer(n - 1); });
  rafLoop(api, (now) => { if (done) return; const pr = 1 - (now - t0) / dur; $(".tf-bar i", api.el).style.width = Math.max(0, pr * 100) + "%"; if (pr <= 0) answer(null); });
  show();
}

/* ---------- Schreibe das Wort ---------- */
function renderSpell(api, a) {
  const items = api.rnd(Conv.hint(a).filter((x) => isPlainWord(x.term)));
  orderGame(api, items.map((it) => {
    const units = Array.from(it.term), lower = it.term === it.term.toLowerCase();
    const extra = shuffle(Array.from("eanrstildugmh").filter((ch) => !units.map((u) => u.toLowerCase()).includes(ch))).slice(0, Math.min(4, Math.max(2, Math.round(units.length / 3)))).map((ch) => (lower ? ch : ch));
    return { units, extra, hint: it.hint || "Schreibe das Wort", label: "Wort", joiner: "", solution: it.term };
  }), { keyboard: true });
}

/* ---------- Wortmagnete ---------- */

/* ---------- Anschauen und Auswendiglernen ---------- */
function renderWatch(api, a) {
  const all = [...new Set(Conv.cards(a).map((c) => c.title))];
  const N = Math.min(6, Math.max(3, Math.floor(all.length / 2)));
  const rounds = Math.max(1, Math.min(3, Math.floor(all.length / (N + 2))));
  api.setMax(N * rounds);
  const T = timers(api);
  let r = 0;
  const round = () => {
    if (r >= rounds) return api.finish();
    const mix = shuffle(all), shown = mix.slice(0, N), dis = mix.slice(N, N + Math.min(N + 2, mix.length - N));
    const ms = spd(api, [9000, 6500, 4000]) + N * 500;
    api.el.innerHTML = `<div class="prog">Runde ${r + 1} von ${rounds}</div><div class="hint-box s-card">👀 Merke dir diese ${N} Begriffe!</div><div class="tf-bar"><i></i></div><div class="wa-grid">${shown.map((t) => `<div class="wa-card s-card">${esc(t)}</div>`).join("")}</div>`;
    const t0 = performance.now(), bar = $(".tf-bar i", api.el);
    const tick = () => { if (api.ended || !document.body.contains(bar)) return; const p = 1 - (performance.now() - t0) / ms; bar.style.width = Math.max(0, p * 100) + "%"; if (p > 0) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    T(() => {
      const test = shuffle(shown.concat(dis));
      api.el.innerHTML = `<div class="prog">Runde ${r + 1} von ${rounds}</div><div class="hint-box s-card">🤔 Welche Begriffe hast du gesehen? Tippe sie an.</div><div class="wa-grid">${test.map((t, k) => `<button class="wa-card s-card wa-pick" data-k="${k}">${esc(t)}</button>`).join("")}</div><div class="row-flex"><button class="s-btn" id="waDone">Fertig</button></div>`;
      $(".wa-grid", api.el).onclick = (e) => { const b = e.target.closest(".wa-pick"); if (b && !b.disabled) { b.classList.toggle("on"); Sfx.flip(); } };
      $("#waDone", api.el).onclick = (e) => {
        e.target.disabled = true;
        $$(".wa-pick", api.el).forEach((b) => {
          const t = test[+b.dataset.k], was = shown.includes(t), on = b.classList.contains("on"); b.disabled = true;
          if (on && was) { b.classList.add("ok"); api.right(); }
          else if (on && !was) { b.classList.add("bad"); api.wrong({ prompt: "Nicht gezeigt", given: t, correct: "nicht antippen" }); }
          else if (!on && was) { b.classList.add("missed"); api.note({ prompt: "Übersehen", correct: t }); }
        });
        if (api.ended) return;
        const bar2 = $(".row-flex", api.el); bar2.innerHTML = ""; bar2.appendChild(nextBtn(r + 1 < rounds ? "Nächste Runde" : "Fertig", () => { r++; round(); }));
      };
    }, ms);
  };
  round();
}

/* ---------- Fliegende Früchte ---------- */
function renderFruit(api, a) {
  const qs = mc4(api, a, 5);
  api.setMax(qs.length);
  const dur = spd(api, [8000, 5800, 4000]), every = spd(api, [1500, 1100, 780]);
  const FR = ["🍎", "🍊", "🍋", "🍉", "🍇", "🍓", "🍐", "🍑", "🥝", "🍒"];
  api.el.innerHTML = `<div class="ff-q s-card"></div><div class="ff-field"></div><div class="prog">Tippe auf die Frucht mit der richtigen Antwort!</div>`;
  const field = $(".ff-field", api.el);
  let i = 0, tried = false, last = 0, since = 9, fruits = [], k = 0;
  const ask = () => {
    if (api.ended) return;
    if (i >= qs.length) return api.finish();
    tried = false; since = 9;
    fruits.forEach((f) => f.el.remove()); fruits = [];
    const q = qs[i];
    $(".ff-q", api.el).innerHTML = (q.img ? `<img class="q-img" style="max-height:80px" src="${esc(q.img)}" alt=""> ` : "") + esc(q.q);
  };
  const hit = (f) => {
    if (f.gone || api.ended) return;
    const q = qs[i];
    f.gone = true;
    if (f.ans.correct) { f.el.classList.add("pop-ok"); if (!tried) api.right(); else Sfx.ok(); i++; setTimeout(ask, 500); }
    else {
      f.el.classList.add("pop-bad");
      if (!tried) { tried = true; api.wrong({ prompt: q.q, given: f.ans.text, correct: q.right }); }
      if (!api.opts.retry && !api.ended) { i++; setTimeout(ask, 700); }
    }
    setTimeout(() => f.el.remove(), 350);
  };
  const spawn = (now) => {
    const q = qs[i]; if (!q) return;
    const right = q.answers.find((x) => x.correct), wr = q.answers.filter((x) => !x.correct);
    const ans = since >= 2 || !wr.length || Math.random() < 0.3 ? right : wr[Math.floor(Math.random() * wr.length)];
    since = ans === right ? 0 : since + 1;
    const el = document.createElement("button"); el.className = "fruit";
    el.innerHTML = `<i>${FR[k++ % FR.length]}</i><span>${esc(ans.text)}</span>`;
    const ltr = Math.random() < 0.5, H = field.clientHeight;
    el.style.top = Math.max(0, Math.random() * (H - 90)) + "px";
    field.appendChild(el);
    const f = { el, ans, t0: now, ltr, gone: false, wob: Math.random() * 6 };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); hit(f); });
    fruits.push(f);
  };
  ask();
  rafLoop(api, (now) => {
    if (now - last > every) { last = now; spawn(now); }
    const W = field.clientWidth + 180;
    fruits = fruits.filter((f) => {
      if (f.gone) return false;
      const p = (now - f.t0) / dur;
      if (p >= 1) { f.el.remove(); return false; }
      const x = (f.ltr ? p : 1 - p) * W - 160;
      f.el.style.transform = `translate(${x}px, ${Math.sin(p * 6 + f.wob) * 14}px)`;
      return true;
    });
  });
}

/* =========================================================
   7. SPIELMODUS, OPTIONEN, THEMES
   ========================================================= */
const Boards = {}; /* Bestenliste nur im Arbeitsspeicher (wird nie gespeichert) */

function startGame(host, act, ctx) {
  ctx = ctx || {};
  const opts = Object.assign({}, DEFAULT_OPTS, act.options || {});
  Sfx.on = !!opts.sound;
  const tpl = tplById(act.template);
  host.innerHTML = `<div class="stage" data-theme="${esc(act.theme || "klassisch")}"><div class="hud"><div class="hud-title">${tpl.icon} ${esc(act.title || "Ohne Titel")}</div><span class="hud-chip" data-h="extra" hidden></span><span class="hud-chip" data-h="lives" hidden></span><span class="hud-chip" data-h="timer" hidden></span><span class="hud-chip" data-h="score" hidden></span></div><div class="arena"></div></div>`;
  const stage = $(".stage", host);
  const why = tpl.check(act);
  if (why) { $(".arena", stage).innerHTML = `<div class="s-card" style="padding:24px;max-width:520px;text-align:center"><div style="font-size:42px">🧩</div><p><b>Diese Vorlage passt nicht zum Inhalt.</b></p><p>${esc(why)}</p></div>`; return { stop() {} }; }
  const st = { score: 0, max: 0, lives: +opts.lives || 0, mistakes: [], t0: Date.now(), timer: null, ends: [] };
  const api = {
    el: $(".arena", stage), stage, opts, ended: false, extraStat: null,
    rnd: (arr) => (opts.shuffle ? shuffle(arr) : arr.slice()),
    setMax(n) { st.max = n; this.refresh(); },
    right() { st.score++; Sfx.ok(); this.refresh(); },
    wrong(m) { st.mistakes.push(m); Sfx.bad(); if (st.lives > 0) { st.lives--; this.refresh(); if (st.lives === 0) { setTimeout(() => this.finish({ reason: "lives" }), 700); this.ended = true; } } else this.refresh(); return !this.ended; },
    note(m) { st.mistakes.push(m); },
    onEnd(f) { st.ends.push(f); },
    refresh() {
      const h = (k) => $(`[data-h="${k}"]`, stage);
      if (tpl.scored && st.max) { h("score").hidden = false; h("score").textContent = `⭐ ${st.score} / ${st.max}`; }
      if (+opts.lives > 0 && tpl.scored) { h("lives").hidden = false; h("lives").textContent = "❤️".repeat(st.lives) + "🤍".repeat(Math.max(0, +opts.lives - st.lives)); }
      if (this.extraStat) { h("extra").hidden = false; h("extra").textContent = this.extraStat(); }
    },
    finish(info) {
      if (this._fin) return; this._fin = true; this.ended = true;
      clearInterval(st.timer); st.ends.forEach((f) => { try { f(); } catch (e) {} });
      showEnd(stage, act, tpl, st, opts, info || {}, ctx, this);
    }
  };
  if (opts.timer !== "off") {
    const th = $('[data-h="timer"]', stage); th.hidden = false;
    const secs = Math.max(10, +opts.seconds || 120);
    const upd = () => {
      const el = (Date.now() - st.t0) / 1000;
      if (opts.timer === "down") { const left = secs - el; th.textContent = "⏱ " + fmtTime(left); th.classList.toggle("low", left <= 10); if (left <= 0 && tpl.scored) api.finish({ reason: "time" }); }
      else th.textContent = "⏱ " + fmtTime(el);
    };
    upd(); st.timer = setInterval(upd, 250);
  }
  try { tpl.render(api, act); } catch (e) { console.error(e); api.el.innerHTML = `<div class="s-card" style="padding:20px">Fehler beim Starten: ${esc(e.message)}</div>`; }
  api.refresh();
  return { stop() { api.ended = true; clearInterval(st.timer); st.ends.forEach((f) => { try { f(); } catch (e) {} }); } };
}

function showEnd(stage, act, tpl, st, opts, info, ctx, api) {
  const secs = (Date.now() - st.t0) / 1000;
  const key = act.id + ":" + tpl.id;
  const pct = st.max ? Math.round((st.score / st.max) * 100) : 0;
  if (pct >= 60) Sfx.win();
  const title = info.reason === "time" ? "⏰ Zeit abgelaufen!" : info.reason === "lives" ? "💔 Keine Leben mehr" : pct === 100 ? "🏆 Perfekt!" : pct >= 70 ? "🎉 Super gemacht!" : "👍 Geschafft!";
  const end = document.createElement("div"); end.className = "end";
  end.innerHTML = `<div class="s-card">
    <h2 style="margin:0 0 10px">${title}</h2>
    ${tpl.scored ? `<div class="score">${st.score} / ${st.max}</div>` : ""}
    <div class="stats"><span class="hud-chip">⏱ ${fmtTime(secs)}</span>${tpl.scored ? `<span class="hud-chip">${pct} %</span>` : ""}${api.extraStat ? `<span class="hud-chip">${esc(api.extraStat())}</span>` : ""}</div>
    ${opts.showAnswers && st.mistakes.length ? `<h3 style="margin:14px 0 4px;text-align:left">Zum Wiederholen</h3><ul class="mistakes">${st.mistakes.map((m) => `<li>${esc(m.prompt)}<br>${m.given ? `<s>${esc(m.given)}</s> → ` : ""}<b>${esc(m.correct)}</b></li>`).join("")}</ul>` : ""}
    ${tpl.scored ? `<div class="board"><b>🏅 Bestenliste (nur in dieser Sitzung)</b><div class="row-flex" style="margin-top:8px"><input type="text" id="bName" maxlength="20" placeholder="Name oder Kürzel" class="grow" style="flex:1 1 140px;width:auto"><button class="s-btn alt" id="bAdd">Eintragen</button></div><ol id="bList"></ol></div>` : ""}
    <div class="row-flex" style="justify-content:center;margin-top:16px"><button class="s-btn" id="againBtn">↻ Nochmal</button>${ctx.onSwitch ? `<button class="s-btn alt" id="swBtn">🔁 Andere Vorlage</button>` : ""}</div></div>`;
  stage.appendChild(end);
  const drawBoard = () => { const l = $("#bList", end); if (!l) return; const b = (Boards[key] || []).slice().sort((x, y) => y.score - x.score || x.time - y.time).slice(0, 10); l.innerHTML = b.map((e) => `<li><b>${esc(e.name)}</b> – ${e.score}/${st.max} · ${fmtTime(e.time)}</li>`).join(""); };

function setupFullscreen() {

function renderEditor(id) {
  stopGame();

  if (!act) return notFound();

      </aside>
    </div></div>`;
  wireTopbar();
  const body = $("#edBody");
  const setState = (s, txt) => { const el = $("#saveState"); if (!el) return; el.className = "save-state " + s; el.textContent = txt; };
  let warned = false;
  const schedule = () => {
    if (!warned && JSON.stringify(act.content).length > 850000) { warned = true; toast("⚠️ Sehr viele/große Bilder – die Aktivität wird zu groß für den Cloud-Speicher (max. ca. 1 MB).", 6000); }
    setState("", "Speichert …");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const ok = await Store.save(act);
      setState(ok ? "ok" : "err", ok ? "Gespeichert ✓" : (Store.mode === "cloud" ? "⚠️ Nur auf diesem Gerät – Cloud folgt" : "Gespeichert ✓"));
      if (!ok && Store.mode === "cloud") setState("err", "⚠️ " + (Cloud.msg || "Offline – wird später gespeichert"));
      validate();
    }, 1000);
  };
  const validate = () => {
    const t = tplById(act.template), why = t.check(act);
    const errs = [];
    if (!act.title.trim()) errs.push("Gib der Aktivität einen Titel.");
    if (why) errs.push(why);
    $("#edErr").innerHTML = errs.length ? errs.map(esc).join("<br>") : "";
    return !errs.length;
  };
  $("#edTitle").oninput = (e) => { act.title = e.target.value; schedule(); };
  $("#edFolder").oninput = (e) => { act.folder = e.target.value.trim(); schedule(); };
  $("#edTpl").onchange = (e) => { act.template = e.target.value; schedule(); validate(); };
  const go = () => { clearTimeout(saveTimer); Store.save(act); if (!validate()) { toast("Bitte die Hinweise unten beachten."); return; } location.hash = "#/play/" + act.id; };
  $("#edDone").onclick = go; $("#edPlay").onclick = go;
  $("#edBack").onclick = () => { clearTimeout(saveTimer); Store.save(act); location.hash = "#/"; };
  const draw = () => { body.innerHTML = editorHtml(act); wireEditor(body, act, schedule, draw); };
  draw();
  const imp = (replace) => {
    const lines = $("#impText").value.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const cells = (l) => l.split(/\t|;/).map((s) => s.trim());
    const c = act.content;
    if (act.dataType === "pairs") { const rows = lines.map(cells).filter((x) => x[0]).map((x) => ({ term: x[0], definition: x.slice(1).join("; "), defImage: "" })); c.items = replace ? rows : c.items.filter((i) => i.term || i.definition).concat(rows); }
    if (act.dataType === "mc") { const qs = lines.map(cells).filter((x) => x[0] && x.length >= 3).map((x) => ({ question: x[0], image: "", answers: x.slice(1).filter(Boolean).map((t, k) => ({ text: t, correct: k === 0 })) })); c.questions = replace ? qs : c.questions.filter((q) => q.question).concat(qs); }
    if (act.dataType === "categories") { const gs = lines.map(cells).filter((x) => x[0]).map((x) => ({ name: x[0], items: x.slice(1).filter(Boolean) })); if (replace) c.groups = gs; else gs.forEach((g) => { const ex = c.groups.find((y) => norm(y.name) === norm(g.name)); if (ex) ex.items = ex.items.concat(g.items); else c.groups.push(g); }); c.groups = c.groups.filter((g) => g.name || g.items.length); }
    if (act.dataType === "list") { c.items = (replace ? [] : c.items).concat(lines); }
    $("#impText").value = ""; draw(); schedule(); toast(`${lines.length} Zeile${lines.length === 1 ? "" : "n"} übernommen`);
  };
  $("#impAdd").onclick = () => imp(false);
  $("#impRep").onclick = () => imp(true);
  validate();
  if (!act.title) setTimeout(() => $("#edTitle") && $("#edTitle").focus(), 50);
}

function imgField(path, val) {

/* Bild verkleinern (max. 1000 px, JPEG) – passt so in Cloud und Gerätespeicher */
function readImage(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, (max || 1000) / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Bild nicht lesbar")); };
    img.src = url;
  });
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[isNaN(ks[i]) ? ks[i] : +ks[i]]; o[ks[ks.length - 1]] = val; }
function getPath(obj, path) { return path.split(".").reduce((o, k) => o[isNaN(k) ? k : +k], obj); }
function wireEditor(body, act, schedule, redraw) {
  const c = act.content;
  body.oninput = (e) => {
    const t = e.target;
    if (t.dataset.p) setPath(c, t.dataset.p, t.value);
    else if (t.dataset.lines) setPath(c, t.dataset.lines, t.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean));
    else if (t.dataset.csv) setPath(c, t.dataset.csv, t.value.split(",").map((s) => s.trim()).filter(Boolean));
    else if (t.dataset.seq != null) { const s = c.sequences[+t.dataset.seq]; s.text = t.value; s.items = splitSeq(t.value, c.mode); }
    else return;
    if (act.dataType === "cloze") { const n = parseCloze(c.text || "").gaps.length; const g = $("#gapCount"); if (g) g.textContent = `${n} Lücke${n === 1 ? "" : "n"} erkannt. Setze die gesuchten Wörter in [eckige Klammern].`; }
    schedule();
  };
  body.onchange = async (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.upload && t.files && t.files[0]) {
      try { setPath(c, t.dataset.upload, await readImage(t.files[0], act.dataType === "diagram" ? 1200 : 900)); redraw(); schedule(); }
      catch (err) { toast(err.message); }
    }
    if (t.dataset && t.dataset.p && act.dataType === "math") redraw();
  };
  body.onclick = (e) => {
    const dg = e.target.closest("#dgEd");
    if (dg && !e.target.closest(".dg-pin")) {
      const r = $(".dg-img", dg).getBoundingClientRect();
      const x = Math.round(((e.clientX - r.left) / r.width) * 1000) / 10, y = Math.round(((e.clientY - r.top) / r.height) * 1000) / 10;
      if (x < 0 || x > 100 || y < 0 || y > 100) return;
      c.pins.push({ x, y, label: "" }); redraw(); schedule();
      const ins = $$('input[data-p$=".label"]', body); if (ins.length) ins[ins.length - 1].focus();
      return;
    }
    const lv = e.target.closest("[data-lv]");
    if (lv) { c.level = lv.dataset.lv; redraw(); schedule(); return; }
    const b = e.target.closest("[data-act],[data-m]"); if (!b) return;
    if (b.dataset.act === "imgdel") { setPath(c, b.dataset.path, ""); if (act.dataType === "diagram" && b.dataset.path === "image") c.pins = []; redraw(); schedule(); return; }
    if (b.dataset.act === "pindel") { c.pins.splice(+b.dataset.i, 1); redraw(); schedule(); return; }
    if (b.dataset.act === "mathnew") { redraw(); return; }
    if (b.dataset.m) { c.mode = b.dataset.m; c.sequences.forEach((s) => (s.items = splitSeq(s.text || "", c.mode))); redraw(); schedule(); return; }
    const i = +b.dataset.i, k = +b.dataset.k;
    const arr = act.dataType === "pairs" ? c.items : act.dataType === "mc" ? c.questions : act.dataType === "categories" ? c.groups : act.dataType === "sequence" ? c.sequences : null;
    const a = b.dataset.act;
    if (a === "add") {
      if (act.dataType === "pairs") c.items.push({ term: "", definition: "", defImage: "" });
      if (act.dataType === "mc") c.questions.push({ question: "", image: "", answers: [{ text: "", correct: true }, { text: "", correct: false }, { text: "", correct: false }, { text: "", correct: false }] });
      if (act.dataType === "categories") c.groups.push({ name: "", items: [] });
      if (act.dataType === "sequence") c.sequences.push({ text: "", items: [] });
      redraw(); const ins = $$("input[type=text]", body); if (ins.length) ins[act.dataType === "pairs" ? ins.length - 2 : ins.length - 1].focus();
    } else if (a === "del" && arr) { arr.splice(i, 1); if (!arr.length) arr.push(emptyContent(act.dataType)[Object.keys(emptyContent(act.dataType)).find((x) => Array.isArray(emptyContent(act.dataType)[x]))][0]); redraw(); }
    else if (a === "up" && arr && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; redraw(); }
    else if (a === "down" && arr && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; redraw(); }
    else if (a === "toggle") { const q = c.questions[i]; q.answers[k].correct = !q.answers[k].correct; redraw(); }
    else if (a === "addans") { c.questions[i].answers.push({ text: "", correct: false }); redraw(); }
    else if (a === "delans") { c.questions[i].answers.splice(k, 1); redraw(); }
    else if (a === "imgs") { const show = !c.items.some((x) => x._img || x.defImage); c.items.forEach((x) => { if (show) x._img = true; else delete x._img; }); redraw(); return; }
    else return;
    schedule();
  };
}

async function qrInto(el, text) {
  if (text.length > 2300) { el.innerHTML = `<p class="hint">Der Link ist zu lang für einen QR-Code. Melde dich an, dann wird der Link kurz.</p>`; return; }
  try { if (!window.QRCode) await loadScript(QR_LIB); el.innerHTML = ""; new QRCode(el, { text, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L }); }
  catch (e) { el.innerHTML = `<p class="hint">QR-Code konnte nicht geladen werden (offline?).</p>`; }
}

function buildPrint(a, withSol, withName) {
  const head = (sol) => `<div class="pa-head"><h1>${esc(a.title || "Arbeitsblatt")}</h1>${withName && !sol ? `<div class="pa-name">Name: ________________ Datum: __________</div>` : ""}</div>`;
  const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let task = "", sol = "";
  if (a.dataType === "pairs") {
    const p = Conv.pairs(a); const defs = shuffle(p.map((x, i) => ({ x, i })));
    task = `<p class="pa-task">Ordne zu: Schreibe den passenden Buchstaben in das Kästchen.</p><div class="pa-cols"><div>${p.map((x, i) => `<div class="pa-item"><span class="pa-box"></span>${i + 1}. ${esc(x.term)}</div>`).join("")}</div><div>${defs.map((d, k) => `<div class="pa-item"><b>${L[k]}</b> ${esc(d.x.definition)}</div>`).join("")}</div></div>`;
    sol = `<div class="pa-cols"><div>${p.map((x, i) => `<div class="pa-item">${i + 1}. ${esc(x.term)} → <b>${L[defs.findIndex((d) => d.i === i)]}</b></div>`).join("")}</div></div>`;
  } else if (a.dataType === "mc") {
    const q = Conv.mc(a).map((x) => Object.assign({}, x, { answers: shuffle(x.answers) }));
    task = `<p class="pa-task">Kreuze die richtige Antwort an.</p>${q.map((x, i) => `<div class="pa-q"><b>${i + 1}. ${esc(x.question)}</b><ol>${x.answers.map((y, k) => `<li>☐ ${L[k]}) ${esc(y.text)}</li>`).join("")}</ol></div>`).join("")}`;
    sol = q.map((x, i) => `<div class="pa-item">${i + 1}. ${x.answers.map((y, k) => (y.correct ? `<b>${L[k]}) ${esc(y.text)}</b>` : "")).filter(Boolean).join(", ")}</div>`).join("");
  } else if (a.dataType === "categories") {
    const g = Conv.cats(a); const all = shuffle(g.flatMap((x) => x.items)); const rows = Math.max(...g.map((x) => x.items.length));
    task = `<p class="pa-task">Sortiere die Wörter aus dem Kasten in die richtige Spalte.</p><div class="pa-bank">${all.map((w) => `<span>${esc(w)}</span>`).join("")}</div><table class="pa-table"><tr>${g.map((x) => `<th>${esc(x.name)}</th>`).join("")}</tr>${Array.from({ length: rows }, () => `<tr>${g.map(() => "<td></td>").join("")}</tr>`).join("")}</table>`;
    sol = `<table class="pa-table"><tr>${g.map((x) => `<th>${esc(x.name)}</th>`).join("")}</tr>${Array.from({ length: rows }, (_, r) => `<tr>${g.map((x) => `<td>${esc(x.items[r] || "")}</td>`).join("")}</tr>`).join("")}</table>`;
  } else if (a.dataType === "list") {
    const c = Conv.cards(a); task = `<ol>${c.map((x) => `<li class="pa-item">${esc(x.title)}</li>`).join("")}</ol>`; withSol = false;
  } else if (a.dataType === "sequence") {
    const s = Conv.seq(a), bar = a.content.mode === "bar";
    task = `<p class="pa-task">${bar ? "Bringe die Schritte in die richtige Reihenfolge." : "Bilde aus den Wörtern einen richtigen Satz."}</p>${s.map((x, i) => `<div class="pa-q"><b>${i + 1}.</b> ${shuffle(x).map(esc).join(" &nbsp;/&nbsp; ")}<br><br>${"_".repeat(70)}</div>`).join("")}`;
    sol = s.map((x, i) => `<div class="pa-item">${i + 1}. ${x.map(esc).join(bar ? " → " : " ")}</div>`).join("");
  } else if (a.dataType === "cloze") {
    const { parts, gaps } = Conv.cloze(a); const bank = shuffle(gaps.concat(a.content.distractors || []));
    task = `<p class="pa-task">Setze die Wörter aus dem Kasten in die Lücken ein.</p><div class="pa-bank">${bank.map((w) => `<span>${esc(w)}</span>`).join("")}</div><div class="pa-cloze">${parts.map((p) => (p.t != null ? esc(p.t).replace(/\n/g, "<br>") : `<span class="pa-line">&nbsp;</span>`)).join("")}</div>`;
    sol = `<div class="pa-cloze">${parts.map((p) => (p.t != null ? esc(p.t).replace(/\n/g, "<br>") : `<b><u>${esc(p.a)}</u></b>`)).join("")}</div>`;
  }
  else if (a.dataType === "math") {
    const t = mathTasks(a.content);
    task = `<p class="pa-task">Berechne.</p><div class="pa-cols">${t.map((x, i) => `<div class="pa-item">${i + 1}) ${esc(x.q.replace(/ = \?$/, " ="))} <span class="pa-line">&nbsp;</span></div>`).join("")}</div>`;
    sol = `<div class="pa-cols">${t.map((x, i) => `<div class="pa-item">${i + 1}) ${esc(x.q.replace(/ = \?$/, " ="))} <b>${esc(x.a)}</b></div>`).join("")}</div>`;
  } else if (a.dataType === "diagram") {
    const d = Conv.diagram(a);
    if (d) {
      const fig = `<div class="pa-fig"><img src="${esc(d.image)}" alt="">${d.pins.map((pn, k) => `<span class="pa-pin" style="left:${pn.x}%;top:${pn.y}%">${k + 1}</span>`).join("")}</div>`;
      task = `<p class="pa-task">Beschrifte das Bild mit den Wörtern aus dem Kasten.</p><div class="pa-bank">${shuffle(d.pins.map((x) => x.label)).map((w) => `<span>${esc(w)}</span>`).join("")}</div>${fig}<div class="pa-cols">${d.pins.map((_, k) => `<div class="pa-item">${k + 1}. <span class="pa-line" style="min-width:12em">&nbsp;</span></div>`).join("")}</div>`;
      sol = `${fig}<div class="pa-cols">${d.pins.map((x, k) => `<div class="pa-item">${k + 1}. <b>${esc(x.label)}</b></div>`).join("")}</div>`;
    }
  }
  return `<div class="pa-sheet">${head(false)}${task}</div>${withSol && sol ? `<div class="pa-sheet pa-sol">${head(true)}${sol}</div>` : ""}`;
}

let studentLoaded = false;
async function studentEntry(params) {
  if (studentLoaded) return true;
  const id = params.get("play"), data = params.get("data");
  if (!id && !data) return false;
  studentLoaded = true;
  $("#app").innerHTML = `<div class="loading"><div><div class="spin"></div>Aktivität wird geladen …</div></div>`;
  try {
    let act;
    if (data) {
      const o = await unpackData(data);
      act = { id: "link", title: o.t, dataType: o.d, template: o.m, content: o.c, options: o.o, theme: o.th };
    } else {
      await Fb.load();
      const snap = await Fb.shared(id).get();
      if (!snap.exists) throw new Error("gone");
      const o = snap.data();
      act = { id: "s_" + id, title: o.title, dataType: o.dataType, template: o.template, content: o.content, options: o.options, theme: o.theme };
    }
    if (!TYPES[act.dataType]) throw new Error("format");
    document.title = (act.title || "LernWerk") + " – LernWerk";
    renderStudent(act);
  } catch (e) {
    $("#app").innerHTML = `<div class="loading"><div><div style="font-size:52px">🔒</div>${e.message === "gone" ? "Diese Aktivität ist nicht (mehr) freigegeben." : "Die Aktivität konnte nicht geladen werden." + (navigator.onLine ? "" : " Bist du offline?")}<p class="muted" style="font-size:15px">Frag deine Lehrkraft nach einem neuen Link.</p></div></div>`;
  }
  return true;
}

function route() {
  const params = new URLSearchParams(location.search);
  if (params.get("play") || params.get("data")) { studentEntry(params); return; }
  const [view, id] = location.hash.replace(/^#\/?/, "").split("/");
  currentView = view === "edit" || view === "play" ? (Store.get(id) ? view : "missing") : view === "neu" ? "neu" : "dash";

  else if (view === "edit" && id) renderEditor(id);
  else if (view === "play" && id) renderPlay(id);

}
