/* Mathe-Zeichen so umschreiben, dass die Sprachausgabe sie richtig liest */
function speakable(t) {
  return String(t)
    .replace(/(\d)\s*·\s*(\d|\()/g, "$1 mal $2").replace(/·/g, " mal ")
    .replace(/(\d)\s+:\s+(\d)/g, "$1 geteilt durch $2")
    .replace(/(\d)\/(\d)/g, "$1 durch $2")
    .replace(/√/g, "Wurzel aus ").replace(/²/g, " hoch zwei").replace(/³/g, " hoch drei")
    .replace(/−/g, " minus ").replace(/=\s*\?/g, " gleich wie viel?").replace(/\s=\s/g, " gleich ")
    .replace(/\s*(→|↔)\s*/g, " – ").replace(/_{2,}/g, " Lücke ").replace(/\s+/g, " ").trim();
}
const PROMPT_SEL = [".result-pop .big", ".gs-bonus", ".q-text", ".tf-stmt", "#blDef", ".ap-q", ".mz-q", ".ff-q", ".wm-prompt", ".ss-item", ".hint-box", ".lv-q"];

/* Was gerade zu lesen ist: Frage/Aufgabe + ggf. Antwortmöglichkeiten */
function stageSpeech(root) {
  if (!root) return "";
  const parts = [];
  const cz = root.querySelector(".cloze-text");
  if (cz && cz.offsetParent !== null) {
    const c = cz.cloneNode(true);
    c.querySelectorAll(".slot").forEach((s) => { s.textContent = s.querySelector(".chip") ? " " + s.textContent + " " : " Lücke "; });
    parts.push(c.textContent);
  }
  const pn = root.querySelectorAll(".pn-card");
  if (pn.length === 2 && pn[0].offsetParent !== null) parts.push(`${pn[0].textContent} – passt das zu – ${pn[1].textContent}?`);
  const fl = root.querySelector(".result-pop .flash, .flash");
  if (fl && fl.offsetParent !== null) parts.push(visibleText(fl.classList.contains("open") ? fl.querySelector(".mem-b") : fl.querySelector(".mem-f")).replace(/Tippen (zum Umdrehen|für die Rückseite)/, ""));

  if (ans.length && ans.length <= 6) parts.push(ans.map((b) => { const l = b.querySelector(".l"); const txt = (b.querySelector("span:last-child") || b).textContent.trim(); return (l ? l.textContent + ": " : "") + txt; }).join(". "));
  const lg = Array.from(root.querySelectorAll(".mz-l, .ss-g")).filter((b) => b.offsetParent !== null);

  const ap = Array.from(root.querySelectorAll(".ap-cloud")).filter((b) => b.offsetParent !== null);
  if (ap.length) parts.push("Antworten: " + ap.map((b) => b.textContent.trim()).join(", "));

/* Automatisch vorlesen, sobald sich die Aufgabe ändert */
function autoSpeak(root, stopList) {
  if (!Speech.ok) return;
  let last = "", t = null;
  const mo = new MutationObserver(() => {
    clearTimeout(t);

      if (!document.body.contains(root) || root.querySelector(".end")) return;

   Tafel zeigt die Frage, alle antworten per iPad, danach Verteilung

const Live = {
  app: null,
  async fb() {
    if (this.app) return this.app;
    if (!window.firebase) await loadScript(FB_BASE + "firebase-app-compat.js");
    if (!firebase.firestore) await loadScript(FB_BASE + "firebase-firestore-compat.js");
    if (!firebase.auth) await loadScript(FB_BASE + "firebase-auth-compat.js");
    this.app = firebase.apps.find((a) => a.name === "lernwerklive") || firebase.initializeApp(FIREBASE_CONFIG, "lernwerklive");
    const auth = this.app.auth();
    try { await auth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) {}
    if (!auth.currentUser) await auth.signInAnonymously();
    return this.app;
  },
  code(p2p) { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = p2p ? "P" : ""; while (s.length < 5) s += c[Math.floor(Math.random() * c.length)]; if (!p2p && s[0] === "P") s = "Q" + s.slice(1); return s; },
  pid() { let p = null; try { p = sessionStorage.getItem("lw_live_pid"); } catch (e) {} if (!p) { p = newId(); try { sessionStorage.setItem("lw_live_pid", p); } catch (e) {} } return p; },
  async fsHost(onMsg) {
    const code = this.code(false);
    const app = await withTimeout(this.fb(), 9000, "Firebase lädt nicht");
    const ref = app.firestore().collection(COL_LIVE).doc(code);
    await withTimeout(ref.set({ host: app.auth().currentUser.uid, created: Date.now(), state: "", v: 0 }), 8000, "Raum anlegen fehlgeschlagen");
    await withTimeout(ref.collection("m").add({ from: "host", type: "ping", ts: Date.now() }), 8000, "Nachrichtenkanal fehlt");
    const seen = new Set();
    const unsub = ref.collection("m").onSnapshot((snap) => snap.docChanges().forEach((ch) => {
      if (ch.type !== "added" || seen.has(ch.doc.id)) return; seen.add(ch.doc.id);
      const d = ch.doc.data(); if (d.type !== "ping") onMsg(d);
    }), (e) => console.warn("live", e));
    let pending = null, timer = null, v = 0, last = 0;
    const flush = () => { timer = null; v++; last = Date.now(); ref.update({ state: pending, v }).catch((e) => console.warn(e)); };
    return { mode: "fs", code, setState(st) { pending = JSON.stringify(st); if (!timer) timer = setTimeout(flush, Math.max(0, 160 - (Date.now() - last))); }, close() { try { unsub(); } catch (e) {} clearTimeout(timer); ref.delete().catch(() => {}); } };
  },
  async fsJoin(code, onState, onClose) {
    const app = await withTimeout(this.fb(), 9000, "Firebase lädt nicht");
    const ref = app.firestore().collection(COL_LIVE).doc(code);
    const snap = await withTimeout(ref.get(), 9000, "Raum nicht erreichbar");
    if (!snap.exists) throw new Error("Diesen Raum gibt es nicht (mehr).");
    const unsub = ref.onSnapshot((s) => { if (!s.exists) { onClose && onClose(); return; } const d = s.data(); if (d.state) try { onState(JSON.parse(d.state)); } catch (e) {} }, () => onClose && onClose());
    return { mode: "fs", send: (m) => ref.collection("m").add(Object.assign({ ts: Date.now(), from: this.pid() }, m)).catch((e) => console.warn(e)), close() { try { unsub(); } catch (e) {} } };
  },
  async p2pHost(onMsg) {
    if (!window.Peer) await loadScript(PEERJS_SRC);
    const code = this.code(true);
    return withTimeout(new Promise((res, rej) => {
      const peer = new Peer("lernwerk-live-" + code.toLowerCase());
      const conns = new Set(); let state = null, timer = null;
      const flush = () => { timer = null; conns.forEach((c) => { if (c.open) try { c.send(state); } catch (e) {} }); };
      peer.on("open", () => res({ mode: "p2p", code, setState(st) { state = JSON.stringify(st); if (!timer) timer = setTimeout(flush, 60); }, close() { try { peer.destroy(); } catch (e) {} } }));
      peer.on("connection", (c) => { conns.add(c); c.on("open", () => { if (state) c.send(state); }); c.on("data", (d) => { try { onMsg(typeof d === "string" ? JSON.parse(d) : d); } catch (e) {} }); c.on("close", () => conns.delete(c)); });
      peer.on("error", (e) => rej(e));
    }), 12000, "PeerJS-Server nicht erreichbar");
  },
  async p2pJoin(code, onState, onClose) {
    if (!window.Peer) await loadScript(PEERJS_SRC);
    return withTimeout(new Promise((res, rej) => {
      const peer = new Peer();
      peer.on("open", () => {
        const c = peer.connect("lernwerk-live-" + code.toLowerCase(), { reliable: true });
        c.on("open", () => res({ mode: "p2p", send: (m) => { try { c.send(JSON.stringify(Object.assign({ ts: Date.now(), from: this.pid() }, m))); } catch (e) {} }, close() { try { peer.destroy(); } catch (e) {} } }));
        c.on("data", (d) => { try { onState(typeof d === "string" ? JSON.parse(d) : d); } catch (e) {} });
        c.on("close", () => onClose && onClose());
      });
      peer.on("error", (e) => rej(e.type === "peer-unavailable" ? new Error("Diesen Raum gibt es nicht (mehr).") : e));
    }), 12000, "Raum nicht erreichbar");
  },
  async host(onMsg) {
    if (!new URLSearchParams(location.search).has("p2p")) {
      try { return await this.fsHost(onMsg); } catch (e) { console.warn("Live: Firestore nicht nutzbar, wechsle zu PeerJS", e); }
    }
    return this.p2pHost(onMsg);
  },
  join(code, onState, onClose) {
    code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

  }
};
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg || "Zeitüberschreitung")), ms))]); }

  const close = () => { if (closed) return; closed = true; clearInterval(S.timer); Speech.stop(); try { net && net.close(); } catch (e) {} view.remove(); document.documentElement.classList.remove("live-open"); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };
  $("#lvClose", view).onclick = async () => { if (S.ph === "lobby" || S.ph === "end" || (await confirmBox("Live-Spiel beenden? Die Geräte der Lernenden werden getrennt.", "Beenden", true))) close(); };
  $("#lvFull", view).onclick = () => { const el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); };
  const sp = $("#lvSpeak", view); if (sp) sp.onclick = () => Speech.speak(stageSpeech(arena));

  const ranking = () => [...S.players.values()].sort((a, b) => b.s - a.s || a.n.localeCompare(b.n, "de"));
  const push = () => {
    if (!net) return;
    const q = S.i >= 0 && S.i < qs.length ? qs[S.i] : null, rk = ranking();
    const st = { ph: S.ph, title: act.title || "LernWerk", theme: act.theme || "klassisch", n: qs.length, i: S.i, dur: S.dur,
      left: S.ph === "q" ? Math.max(0, S.dur - (Date.now() - S.t0) / 1000) : 0,
      players: rk.map((p) => ({ p: p.id, n: p.n, s: p.s })), kicked: [...S.kicked], ans: S.answers.size, tts: !!(act.options || {}).ttsAuto };
    if (q && (S.ph === "q" || S.ph === "reveal")) st.q = { t: q.t, a: q.a };
    if (S.ph === "reveal" && q) { st.c = q.c; st.res = {}; S.answers.forEach((v, id) => { st.res[id] = [v.a === q.c ? 1 : 0, v.pts || 0]; }); }
    net.setState(st);
  };
  const onMsg = (m) => {
    if (closed || !m || !m.from || S.kicked.has(m.from)) return;
    if (m.type === "join") {
      const name = String(m.name || "").trim().slice(0, 18) || "Gast";
      const p = S.players.get(m.from);
      if (p) p.n = name; else S.players.set(m.from, { id: m.from, n: name, s: 0, streak: 0 });
      if (S.ph === "lobby") drawLobby(); else $("#lvCount", view).textContent = "👥 " + S.players.size;
      push();
    } else if (m.type === "ans" && S.ph === "q" && +m.i === S.i && !S.answers.has(m.from) && S.players.has(m.from)) {
      const a = +m.a, q = qs[S.i], el = (Date.now() - S.t0) / 1000;
      if (!(a >= 0 && a < q.a.length)) return;
      const ok = a === q.c, pl = S.players.get(m.from);
      const pts = ok ? Math.round(1000 * (1 - Math.min(1, el / S.dur) / 2)) : 0;
      S.answers.set(m.from, { a, pts });
      if (ok) pl.s += pts;
      const c = $("#lvAnsCount", view); if (c) c.textContent = `${S.answers.size} / ${S.players.size}`;
      Sfx.tick();
      if (S.answers.size >= S.players.size) setTimeout(() => S.ph === "q" && reveal(), 700); else push();
    }
  };
  try { net = await Live.host(onMsg); }
  catch (e) { arena.innerHTML = `<div class="s-card" style="padding:24px;max-width:520px;text-align:center"><div style="font-size:42px">📡</div><p><b>Live-Raum konnte nicht geöffnet werden.</b></p><p>${esc(e.message || e)}</p><p class="prog">Prüfe die Internetverbindung. Manche Schulnetze blockieren Direktverbindungen.</p><button class="s-btn" id="lvRetry">Nochmal versuchen</button></div>`; $("#lvRetry", view).onclick = () => { close(); startLiveHost(act); }; return; }
  if (closed) { net.close(); return; }
  const url = location.origin + location.pathname + "?live=" + net.code;
  $("#lvCode", view).textContent = "🔑 " + net.code;

  const drawLobby = () => {
    $("#lvCount", view).textContent = "👥 " + S.players.size;
    arena.innerHTML = `<div class="lv-lobby"><div class="lv-join s-card"><div class="qr-box" id="lvQr"></div><div><div class="prog">QR-Code scannen oder auf</div><div class="lv-url">${esc(location.host + location.pathname)}</div><div class="prog">mit diesem Code beitreten:</div><div class="lv-code">${esc(net.code)}</div><div class="prog">${net.mode === "p2p" ? "Direktverbindung (PeerJS)" : "Verbindung über buildspace-Server"}</div></div></div>
      <div class="lv-side"><div class="s-card lv-set"><b>Zeit pro Frage</b><div class="seg" id="lvDur">${[10, 20, 30, 45, 60].map((d) => `<button data-d="${d}" class="${S.dur === d ? "on" : ""}">${d} s</button>`).join("")}</div><div class="prog">${qs.length} Frage${qs.length === 1 ? "" : "n"} · Punkte für richtig + schnell</div></div>
      <div class="s-card lv-players"><b>Dabei: ${S.players.size}</b><div class="lv-chips">${ranking().map((p) => `<button class="lv-chip" data-p="${esc(p.id)}" title="Antippen zum Entfernen">${esc(p.n)}</button>`).join("") || `<span class="prog">Warte auf Mitspielende …</span>`}</div></div>
      <button class="s-btn lv-start" id="lvStart" ${S.players.size ? "" : "disabled"}>▶ Starten</button></div></div>`;
    qrInto($("#lvQr", view), url);
    $("#lvDur", view).onclick = (e) => { const b = e.target.closest("[data-d]"); if (!b) return; S.dur = +b.dataset.d; $$("#lvDur button", view).forEach((x) => x.classList.toggle("on", x === b)); };
    $(".lv-chips", view).onclick = async (e) => { const b = e.target.closest(".lv-chip"); if (!b) return; const p = S.players.get(b.dataset.p); if (p && (await confirmBox(`„${p.n}“ aus dem Spiel entfernen?`, "Entfernen", true))) { S.kicked.add(p.id); S.players.delete(p.id); drawLobby(); push(); } };
    $("#lvStart", view).onclick = () => next();
  };
  const next = () => {
    S.i++; S.answers = new Map();
    if (S.i >= qs.length) return finish();
    S.ph = "q"; S.t0 = Date.now();
    const q = qs[S.i];
    arena.innerHTML = `<div class="prog">Frage ${S.i + 1} von ${qs.length}</div>${q.img ? `<img class="q-img" src="${esc(q.img)}" alt="">` : ""}<div class="q-text s-card lv-q">${esc(q.t)}</div>
      <div class="lv-grid">${q.a.map((t, k) => `<div class="lv-tile" style="--lc:${LV_COLS[k]}"><span class="lv-sh">${LV_SHAPES[k]}</span><span>${esc(t)}</span></div>`).join("")}</div>
      <div class="lv-bar"><div class="lv-time"><i></i></div><span class="hud-chip">✋ <b id="lvAnsCount">0 / ${S.players.size}</b></span><button class="s-btn alt" id="lvReveal">Auflösen</button></div>`;
    $("#lvReveal", view).onclick = () => reveal();
    clearInterval(S.timer);
    const bar = $(".lv-time i", view);
    S.timer = setInterval(() => { const left = S.dur - (Date.now() - S.t0) / 1000; if (bar) bar.style.width = Math.max(0, (left / S.dur) * 100) + "%"; if (left <= 0) reveal(); }, 200);
    push();
    if ((act.options || {}).ttsAuto) setTimeout(() => Speech.speak(stageSpeech(arena)), 300);
  };
  const reveal = () => {
    if (S.ph !== "q") return;
    clearInterval(S.timer); S.ph = "reveal";
    const q = qs[S.i], cnt = q.a.map(() => 0);
    S.answers.forEach((v) => cnt[v.a]++);
    const max = Math.max(1, ...cnt), right = cnt[q.c], total = S.players.size;
    arena.innerHTML = `<div class="prog">Frage ${S.i + 1} von ${qs.length} · ${right} von ${total} richtig</div><div class="q-text s-card lv-q">${esc(q.t)}</div>
      <div class="lv-chart">${q.a.map((t, k) => `<div class="lv-col ${k === q.c ? "right" : ""}" style="--lc:${LV_COLS[k]}"><b>${cnt[k]}</b><div class="lv-b" style="height:${Math.max(4, (cnt[k] / max) * 100)}%"></div><div class="lv-lab"><span class="lv-sh">${LV_SHAPES[k]}</span> ${esc(t)} ${k === q.c ? "✓" : ""}</div></div>`).join("")}</div>
      <div class="lv-bar"><div class="lv-top s-card"><b>🏅 Top 5</b><ol>${ranking().slice(0, 5).map((p) => `<li><span>${esc(p.n)}</span><b>${p.s}</b></li>`).join("")}</ol></div><button class="s-btn" id="lvNext">${S.i + 1 < qs.length ? "Nächste Frage ▶" : "Zum Ergebnis 🏆"}</button></div>`;
    $("#lvNext", view).onclick = () => next();
    Sfx.flip(); push();
  };
  const finish = () => {
    S.ph = "end"; clearInterval(S.timer);
    const rk = ranking();
    const pod = [rk[1], rk[0], rk[2]];
    arena.innerHTML = `<h2 class="lv-h">🏆 Ergebnis</h2><div class="lv-podium">${pod.map((p, k) => p ? `<div class="lv-pod p${[2, 1, 3][k]}"><div class="lv-pn">${esc(p.n)}</div><div class="lv-ps">${p.s} P.</div><div class="lv-pb">${[2, 1, 3][k]}</div></div>` : `<div></div>`).join("")}</div>
      <div class="s-card lv-all"><ol>${rk.map((p) => `<li><span>${esc(p.n)}</span><b>${p.s}</b></li>`).join("")}</ol></div>
      <div class="row-flex" style="justify-content:center"><button class="s-btn" id="lvAgain">↻ Nochmal (gleiche Gruppe)</button><button class="s-btn alt" id="lvEnd">Beenden</button></div>`;
    Sfx.win(); push();
    $("#lvEnd", view).onclick = close;
    $("#lvAgain", view).onclick = () => { qs.splice(0, qs.length, ...liveQuestions(act)); S.players.forEach((p) => (p.s = 0)); S.i = -1; S.ph = "lobby"; drawLobby(); push(); };
  };
  drawLobby(); push();
}

/* ---------- Schüleransicht Live ---------- */
async function liveStudent(code) {
  stopGame();
  const pid = Live.pid();
  let name = ""; try { name = sessionStorage.getItem("lw_live_name") || ""; } catch (e) {}
  let net = null, st = null, answered = -1, myAns = -1, lastI = -2, deadline = 0, tick = null;
  const app = $("#app");
  app.innerHTML = `<div class="lv-student"><div class="stage" data-theme="klassisch"><div class="hud"><div class="hud-title">📡 LernWerk Live</div><span class="hud-chip" id="lsMe" hidden></span>${Speech.ok ? `<button class="hud-chip hud-btn" id="lsSpeak" aria-label="Vorlesen">🔊</button>` : ""}</div><div class="arena" id="lsArena"></div></div></div>`;
  const arena = $("#lsArena"), stage = $(".lv-student .stage");
  const sp = $("#lsSpeak"); if (sp) sp.onclick = () => Speech.speak(stageSpeech(arena));
  const nameForm = (err) => {
    arena.innerHTML = `<div class="s-card ls-card"><h2 style="margin:0 0 6px">Mitspielen</h2><p class="prog" style="margin:0 0 12px">Raum <b>${esc(code)}</b> · Bitte einen Spitznamen, keinen echten Namen.</p>
      <form id="lsForm" class="ls-form"><input type="text" id="lsName" maxlength="18" placeholder="Spitzname" value="${esc(name)}" autocomplete="off" autocapitalize="words"><button type="button" class="s-btn alt" id="lsDice" aria-label="Zufallsname">🎲</button></form>
      <button class="s-btn" id="lsGo" style="width:100%;margin-top:12px">Los geht's</button>${err ? `<p class="ls-err">${esc(err)}</p>` : ""}</div>`;
    $("#lsDice").onclick = () => { $("#lsName").value = LV_NAMES[Math.floor(Math.random() * LV_NAMES.length)] + " " + Math.floor(Math.random() * 90 + 10); };
    const go = async () => {
      name = $("#lsName").value.trim().slice(0, 18);
      if (!name) { $("#lsName").focus(); return; }
      try { sessionStorage.setItem("lw_live_name", name); } catch (e) {}
      arena.innerHTML = `<div class="loading"><div><div class="spin"></div>Verbinde …</div></div>`;
      try {
        net = await Live.join(code, onState, () => { clearInterval(tick); arena.innerHTML = `<div class="s-card ls-card"><div style="font-size:48px">👋</div><h2>Das Live-Spiel ist beendet.</h2><p class="prog">Danke fürs Mitspielen!</p></div>`; });
        net.send({ type: "join", name });
        $("#lsMe").hidden = false; $("#lsMe").textContent = "🙂 " + name;
        if (!st) arena.innerHTML = `<div class="s-card ls-card"><div style="font-size:48px">⏳</div><h2>Du bist dabei, ${esc(name)}!</h2><p class="prog">Warte, bis die Lehrkraft startet.</p></div>`;
      } catch (e) { nameForm(e.message || "Verbindung fehlgeschlagen"); }
    };
    $("#lsGo").onclick = go;
    $("#lsForm").onsubmit = (e) => { e.preventDefault(); go(); };
  };
  const onState = (s) => {
    st = s; stage.dataset.theme = s.theme || "klassisch";
    if (s.kicked && s.kicked.includes(pid)) { clearInterval(tick); try { net.close(); } catch (e) {} arena.innerHTML = `<div class="s-card ls-card"><h2>Du wurdest aus dem Spiel entfernt.</h2></div>`; return; }
    const me = (s.players || []).find((p) => p.p === pid);
    if (!me && net && s.ph !== "end") net.send({ type: "join", name });
    const rank = me ? (s.players || []).indexOf(me) + 1 : 0;
    if (me) $("#lsMe").textContent = `🙂 ${me.n} · ${me.s} P.`;
    clearInterval(tick);
    if (s.ph === "lobby") {
      arena.innerHTML = `<div class="s-card ls-card"><div style="font-size:48px">⏳</div><h2>Du bist dabei${me ? ", " + esc(me.n) : ""}!</h2><p class="prog">${(s.players || []).length} Mitspielende · Warte auf den Start …</p></div>`;
    } else if (s.ph === "q" && s.q) {
      let fresh = false;
      if (s.i !== lastI) { lastI = s.i; myAns = -1; deadline = Date.now() + s.left * 1000; fresh = true; }
      if (answered === s.i) { arena.innerHTML = `<div class="s-card ls-card"><div class="lv-sh big" style="color:${LV_COLS[myAns]}">${LV_SHAPES[myAns]}</div><h2>Antwort gesendet ✓</h2><p class="prog">Warte auf die Auflösung … (${s.ans} haben geantwortet)</p></div>`; return; }
      arena.innerHTML = `<div class="prog">Frage ${s.i + 1} von ${s.n}</div><div class="q-text s-card lv-q">${esc(s.q.t)}</div><div class="lv-time"><i></i></div>
        <div class="lv-grid ls-grid">${s.q.a.map((t, k) => `<button class="lv-tile lv-btn" data-k="${k}" style="--lc:${LV_COLS[k]}"><span class="lv-sh">${LV_SHAPES[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>`;
      const bar = $(".lv-time i", arena);
      tick = setInterval(() => { const left = (deadline - Date.now()) / 1000; bar.style.width = Math.max(0, (left / s.dur) * 100) + "%"; if (left <= 0) { clearInterval(tick); $$(".lv-btn", arena).forEach((b) => (b.disabled = true)); } }, 200);
      $(".ls-grid", arena).onclick = (e) => {
        const b = e.target.closest(".lv-btn"); if (!b || b.disabled) return;
        myAns = +b.dataset.k; answered = s.i; Sfx.flip();
        net.send({ type: "ans", i: s.i, a: myAns });
        onState(st);
      };
      if (fresh && s.tts) Speech.speak(stageSpeech(arena));
    } else if (s.ph === "reveal" && s.q) {
      const r = (s.res || {})[pid], ok = r && r[0] === 1;
      arena.innerHTML = `<div class="s-card ls-card ls-res ${r ? (ok ? "ok" : "bad") : ""}"><div style="font-size:56px">${r ? (ok ? "✅" : "❌") : "⏱"}</div><h2>${r ? (ok ? "Richtig! +" + r[1] : "Leider falsch") : "Keine Antwort"}</h2>
        <p>Richtig war: <b>${LV_SHAPES[s.c]} ${esc(s.q.a[s.c])}</b></p><p class="prog">${me ? `Du hast ${me.s} Punkte · Platz ${rank} von ${s.players.length}` : ""}</p></div>`;
      if (ok) Sfx.ok(); else if (r) Sfx.bad();
    } else if (s.ph === "end") {
      arena.innerHTML = `<div class="s-card ls-card"><div style="font-size:56px">${rank === 1 ? "🏆" : rank && rank <= 3 ? "🥈" : "🎉"}</div><h2>${rank ? `Platz ${rank} von ${s.players.length}` : "Spiel beendet"}</h2><p>${me ? `${me.s} Punkte` : ""}</p><p class="prog">Danke fürs Mitspielen!</p></div>`;
      if (rank === 1) Sfx.win();
    }
  };
  nameForm();
}

function notFound() {
  $("#app").innerHTML = `${topbar("", true)}<div class="wrap"><div class="card empty"><div class="big">🔍</div><h2>Aktivität nicht gefunden</h2><p class="muted">${Store.mode === "cloud" ? "Vielleicht wurde sie gelöscht." : "Sie liegt evtl. in deinem Konto – melde dich an."}</p><a class="btn pri" href="#/">Zur Übersicht</a></div></div>`;
  wireTopbar();
}
function renderStudent(act) {
  stopGame();
  $("#app").innerHTML = `<div class="play-view"><header class="topbar"><span class="brand"><span class="logo">🧩</span><span>${esc(act.title || "LernWerk")}<small>LernWerk</small></span></span><button class="btn small" id="pFull" aria-label="Vollbild">⛶ <span>Vollbild</span></button></header>

  const restart = () => { stopGame(); currentGame = startGame($("#stageHost"), act, { restart }); };
  restart(); setupFullscreen();
}
let studentLoaded = false;
async function studentEntry(params) {
  if (studentLoaded) return true;
  const id = params.get("play"), data = params.get("data");
  if (!id && !data) return false;
  studentLoaded = true;
  $("#app").innerHTML = `<div class="loading"><div><div class="spin"></div>Aktivität wird geladen …</div></div>`;
  try {
    let act;
    if (data) {
      const o = await unpackData(data);
      act = { id: "link", title: o.t, dataType: o.d, template: o.m, content: o.c, options: o.o, theme: o.th };
    } else {
      await Fb.load();
      const snap = await Fb.shared(id).get();
      if (!snap.exists) throw new Error("gone");
      const o = snap.data();
      act = { id: "s_" + id, title: o.title, dataType: o.dataType, template: o.template, content: o.content, options: o.options, theme: o.theme };
    }
    if (!TYPES[act.dataType]) throw new Error("format");
    document.title = (act.title || "LernWerk") + " – LernWerk";
    renderStudent(act);
  } catch (e) {
    $("#app").innerHTML = `<div class="loading"><div><div style="font-size:52px">🔒</div>${e.message === "gone" ? "Diese Aktivität ist nicht (mehr) freigegeben." : "Die Aktivität konnte nicht geladen werden." + (navigator.onLine ? "" : " Bist du offline?")}<p class="muted" style="font-size:15px">Frag deine Lehrkraft nach einem neuen Link.</p></div></div>`;
  }
  return true;
}
let currentView = "";
/* Nach Login/Sync nur neu zeichnen, wenn dabei nichts verloren geht */
function rerouteSoft() { if (currentView === "dash" || currentView === "missing" || currentView === "copy") route(); else renderAuthBox(); }
function route() {
  const params = new URLSearchParams(location.search);
  if (params.get("play") || params.get("data")) { studentEntry(params); return; }
  if (params.get("live")) { if (currentView !== "live") { currentView = "live"; liveStudent(params.get("live").toUpperCase()); } return; }
  if (params.get("copy") || params.get("copyd")) { copyEntry(params); return; }
  const [view, id] = location.hash.replace(/^#\/?/, "").split("/");
  currentView = view === "edit" || view === "play" ? (Store.get(id) ? view : "missing") : view === "neu" ? "neu" : "dash";
  if (view === "neu") renderPicker();
  else if (view === "edit" && id) renderEditor(id);
  else if (view === "play" && id) renderPlay(id);
  else renderDashboard();
}
window.addEventListener("hashchange", route);

/* ---------- Start ---------- */
Store.useLocal();
route();
const p0 = new URLSearchParams(location.search);
if (!p0.get("play") && !p0.get("data") && !p0.get("live") && lsGet(LS_CLOUD_FLAG, 0)) {
  /* War zuletzt angemeldet → Firebase im Hintergrund laden, Sitzung wird übernommen */
  Fb.load().catch(() => Cloud.set("err", "Offline – lokale Kopie wird angezeigt."));
}
window.LernWerk = { Store, TEMPLATES, Conv, Fb, Live, Speech }; /* für Fehlersuche in der Konsole */
})();
