<style>
/* =========================================================
   LernWerk – Lernspiele-Baukasten (Wordwall-Prinzip)
   Inhalte einmal eingeben → in 12 Vorlagen spielen.
   Speicher: lokal (localStorage) oder per Google-Anmeldung in
   Firestore (gleiches Firebase-Projekt wie Strafenkasse/Kanban).
   ========================================================= */
:root{
  --bg:#f2f7fc; --panel:#ffffff; --tile:#e8f4fd; --tile-2:#d9ecfb;
  --blue:#5aaef0; --blue-d:#2f86cf; --blue-dd:#1f6aa8;
  --coral:#f2a0a8; --coral-d:#e0707c;
  --ink:#1f3048; --muted:#62738a; --line:#d4e3f1;
  --ok:#2fae6e; --ok-bg:#e3f6ec; --bad:#df4f5d; --bad-bg:#fde7e9; --warn:#c98a12; --warn-bg:#fff4dc;
  --radius:16px; --shadow:0 6px 22px rgba(35,85,135,.10); --shadow-s:0 2px 8px rgba(35,85,135,.10);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--blue-d)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Grundbausteine ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:15px;color:var(--ink);transition:transform .12s,box-shadow .12s,background .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.icon-btn:focus-visible,.tile:focus-visible{outline:3px solid #9fd0f7;outline-offset:2px}
.btn.pri{background:var(--blue-d);border-color:var(--blue-d);color:#fff;box-shadow:0 3px 0 var(--blue-dd)}
.btn.pri:active{box-shadow:0 1px 0 var(--blue-dd);transform:translateY(2px)}
.btn.coral{background:var(--coral-d);border-color:var(--coral-d);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:#f3c3c8}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:18px;flex:none}
.icon-btn.small{width:36px;height:36px;font-size:15px}
input[type=text],input[type=search],input[type=url],input[type=number],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(90,174,240,.22)}
label.fld{display:block;font-weight:700;font-size:14px;color:var(--muted);margin:0 0 6px}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #e3edf7}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--tile);color:var(--blue-dd);font-size:13px;font-weight:700}
.pill.coral{background:#fde6e9;color:#b8434f}
.pill.ok{background:var(--ok-bg);color:#1d7a4b}
.pill.warn{background:var(--warn-bg);color:#8a5d00}
.muted{color:var(--muted)}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}

/* ---------- Kopfzeile ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;margin-right:auto;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-d));display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:var(--shadow-s);flex:none}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1}
.auth-box{display:flex;align-items:center;gap:8px;min-width:0}
.auth-mail{font-size:13px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloud-dot{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;border:0;background:var(--ok-bg);color:#1d7a4b;min-height:36px}
.cloud-dot.err{background:var(--warn-bg);color:#8a5d00}
.cloud-dot.busy{background:var(--tile);color:var(--blue-dd)}
/* Platz für den „buildspace“-Zurück-Knopf von protect.js oben links */
body:has(#protect-back-link) .topbar{padding-left:142px}
@media (max-width:480px){body:has(#protect-back-link) .topbar{padding-left:66px}}
@media (max-width:1280px){.auth-mail{display:none}}
@media (max-width:1100px){.play-bar .btn span{display:none}}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;row-gap:8px}
  .brand small,.auth-mail{display:none}
  .brand{font-size:18px}
  .play-bar{order:3;width:100%;justify-content:space-between;flex-wrap:nowrap}
  .play-bar .btn span{display:none}
  .play-bar .btn{flex:1;padding:6px 8px}
  .auth-box .btn span{display:none}
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:14px;margin-bottom:16px;font-size:15px}
.banner.info{background:var(--tile);border:1px solid #c8e2f7}
.banner.warn{background:var(--warn-bg);border:1px solid #f1d9a2}
.banner p{margin:0;flex:1 1 260px}

/* ---------- Dashboard ---------- */
.dash-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.dash-head h1{margin:0;font-size:26px;flex:1 1 auto}
.toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:18px}
@media (max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act{display:flex;flex-direction:column;overflow:hidden}
.act-top{display:flex;gap:12px;align-items:center;padding:14px 14px 8px;cursor:pointer}
.act-icon{width:54px;height:54px;border-radius:14px;background:var(--tile);display:grid;place-items:center;font-size:28px;flex:none}
.act-title{font-weight:800;font-size:17px;line-height:1.25;word-break:break-word}
.act-meta{font-size:13px;color:var(--muted);margin-top:3px}
.act-tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.act-actions{display:flex;gap:8px;padding:10px 14px 14px;margin-top:auto}
.act-actions .btn{flex:1}
.empty{padding:40px 20px;text-align:center}
.empty .big{font-size:56px}
.login-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px;margin-bottom:18px;background:linear-gradient(120deg,#ffffff,#eaf5fe)}
.login-card .big{font-size:40px}
.login-card h2{margin:0 0 4px;font-size:19px}
.login-card p{margin:0;color:var(--muted);font-size:14.5px}
@media (max-width:640px){.login-card{grid-template-columns:1fr}.login-card .big{display:none}}
.gbtn{background:#fff;border:1.5px solid #c9d7e6}
.gbtn svg{width:20px;height:20px}

/* ---------- Vorlagen-Raster (Wordwall-Stil) ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;text-align:left;padding:0;border-radius:14px;border:1.5px solid #cfe2f3;background:#fff;overflow:hidden;box-shadow:var(--shadow-s);transition:transform .15s,box-shadow .15s}
.tile:active{transform:scale(.98)}
.tile .pic{height:104px;background:var(--tile);display:grid;place-items:center;font-size:46px;border-bottom:1.5px solid #cfe2f3}
.tile .txt{padding:12px 14px 14px}
.tile .nm{font-weight:800;font-size:17px;color:var(--ink)}
.tile .ds{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.tile.soon{opacity:.55;cursor:default}
.tile.soon .pic{filter:grayscale(.6)}
.tile.sel{border-color:var(--blue-d);box-shadow:0 0 0 3px rgba(47,134,207,.25)}
h2.sec{font-size:18px;margin:26px 0 12px;color:var(--muted)}

/* ---------- Editor ---------- */
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.ed-grid{grid-template-columns:1fr}}
.ed-main{padding:18px}
.ed-side{padding:16px;position:sticky;top:76px}
@media (max-width:900px){.ed-side{position:static}}
.ed-title{font-size:22px;font-weight:800;border-width:2px}
.ed-rows{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.ed-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:start;padding:8px;border-radius:12px;background:#f7fbff;border:1px solid #e1edf8}
.ed-row .num{width:34px;height:44px;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.ed-row .ctl{display:flex;gap:4px}
.ed-row .extra{grid-column:2/4}
@media (max-width:640px){.ed-row{grid-template-columns:28px 1fr auto}.ed-row .num{width:28px}.ed-row .c2{grid-column:2/3}.ed-row .ctl{grid-row:1/3;grid-column:3;flex-direction:column}.ed-row .extra{grid-column:2/3}}
.blk{padding:12px;border-radius:14px;background:#f7fbff;border:1px solid #e1edf8;display:flex;flex-direction:column;gap:8px}
.blk-head{display:flex;gap:8px;align-items:center}
.ans-row{display:flex;gap:8px;align-items:center}
.chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;font-size:20px;flex:none;color:#b7c4d3}
.chk.on{background:var(--ok-bg);border-color:#9fdcbc;color:var(--ok)}
.save-state{font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-state.ok{color:var(--ok)}
.save-state.err{color:var(--warn)}
.hint{font-size:13.5px;color:var(--muted);line-height:1.45;margin:6px 0 0}
.errlist{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--bad-bg);color:#9b2633;font-size:14px}
.errlist:empty{display:none}
details.imp{margin-top:14px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;background:#fbfdff}
details.imp summary{font-weight:800;cursor:pointer;min-height:32px;display:flex;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:40px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--blue-d);color:#fff}

/* ---------- Spielansicht ---------- */
.play-view{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.play-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.play-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;padding:16px;max-width:1500px;width:100%;margin:0 auto}
.play-main.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.play-main{grid-template-columns:minmax(0,1fr)}.switcher{display:none}}
.switcher{padding:14px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.switcher h3{margin:0 0 10px;font-size:15px;color:var(--muted)}
.sw-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;border:1.5px solid transparent;background:transparent;min-height:48px;margin-bottom:4px}
.sw-item .ic{width:34px;height:34px;border-radius:9px;background:var(--tile);display:grid;place-items:center;font-size:18px;flex:none}
.sw-item b{font-size:14.5px;display:block}
.sw-item small{font-size:12px;color:var(--muted);display:block;line-height:1.25}
.sw-item.cur{border-color:var(--blue-d);background:#f2f9ff}
.sw-item.off{opacity:.5;cursor:default}
.play-view.focus .topbar{display:none}
.play-view.focus .play-main{grid-template-columns:minmax(0,1fr);padding:8px}
.play-view.focus .switcher{display:none}
.focus-exit{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:60;display:none}
.play-view.focus .focus-exit{display:inline-grid}

/* ---------- Bühne / Themes ---------- */
.stage{--s-bg:#e8f4fd;--s-card:#fff;--s-ink:#1f3048;--s-muted:#62738a;--s-acc:#5aaef0;--s-acc-d:#2f86cf;--s-acc2:#f2a0a8;--s-acc2-d:#e0707c;--s-line:#cfe2f3;--s-font:var(--font);--s-scale:1;
  --w1:#5aaef0;--w2:#f2a0a8;--w3:#8fd1a8;--w4:#ffd37a;--w5:#b9a6f2;--w6:#7fd3e0;
  position:relative;border-radius:22px;background:var(--s-bg);color:var(--s-ink);font-family:var(--s-font);min-height:min(78vh,760px);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);font-size:calc(17px * var(--s-scale))}
.stage[data-theme=tafel]{--s-bg:#2d4a3c;--s-card:rgba(255,255,255,.07);--s-ink:#f5f2e6;--s-muted:#c9d3c4;--s-acc:#f6d776;--s-acc-d:#e8c24f;--s-acc2:#f4a7b0;--s-acc2-d:#e98692;--s-line:rgba(245,242,230,.35);--s-font:"Chalkboard SE","Comic Sans MS","Segoe Print",cursive;
  --w1:#f6d776;--w2:#f4a7b0;--w3:#a8dcc0;--w4:#9fd0f7;--w5:#e9e4d4;--w6:#f7b979;
  background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 80% 85%,rgba(255,255,255,.05),transparent 45%);background-color:#2d4a3c;border:10px solid #7a5434}
.stage[data-theme=primary]{--s-bg:#fff7e3;--s-card:#fff;--s-ink:#1d2b44;--s-muted:#6b6f80;--s-acc:#ff9f1c;--s-acc-d:#e98500;--s-acc2:#2ec4b6;--s-acc2-d:#1aa396;--s-line:#f2dfb3;--s-font:"Andika",var(--font);--s-scale:1.15;
  --w1:#ff9f1c;--w2:#2ec4b6;--w3:#ff6b6b;--w4:#ffd23f;--w5:#5aaef0;--w6:#9b5de5}
.stage[data-theme=nacht]{--s-bg:#101828;--s-card:#1b2741;--s-ink:#eef2fb;--s-muted:#a8b3c9;--s-acc:#7cc4ff;--s-acc-d:#4aa8f2;--s-acc2:#ff8fa0;--s-acc2-d:#f06a7f;--s-line:#2c3b5c;
  --w1:#4aa8f2;--w2:#f06a7f;--w3:#3fbf8a;--w4:#f2b544;--w5:#9b87f5;--w6:#38c3d6}
.hud{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.hud-title{font-weight:800;font-size:1.05em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--s-card);border:1.5px solid var(--s-line);font-weight:800;font-variant-numeric:tabular-nums;font-size:.95em}
.hud-chip[hidden]{display:none}
.hud-chip.low{color:#fff;background:var(--s-acc2-d);border-color:var(--s-acc2-d)}
.arena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 22px;gap:16px;position:relative}
.s-card{background:var(--s-card);border:1.5px solid var(--s-line);border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.s-btn{min-height:52px;padding:10px 20px;border-radius:14px;border:0;background:var(--s-acc-d);color:#fff;font-weight:800;font-size:1em;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.stage[data-theme=tafel] .s-btn{color:#2d3a2f}
.s-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.s-btn.alt{background:var(--s-card);color:var(--s-ink);border:1.5px solid var(--s-line)}
.s-btn:disabled{opacity:.4}
.prog{font-size:.85em;color:var(--s-muted);font-weight:700}
.q-text{font-size:1.6em;font-weight:800;text-align:center;line-height:1.25;max-width:900px;padding:18px 24px;word-break:break-word}
.q-img{max-width:min(100%,420px);max-height:240px;border-radius:14px;object-fit:contain}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:900px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 16px;border-radius:16px;border:2px solid var(--s-line);background:var(--s-card);color:var(--s-ink);font-weight:700;font-size:1.05em;text-align:left;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.07);transition:transform .1s}
.ans:active{transform:scale(.98)}
.ans .l{width:36px;height:36px;border-radius:10px;background:var(--s-acc);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.stage[data-theme=tafel] .ans .l{color:#2d3a2f}
.ans.ok{border-color:var(--ok);background:#dff5e9;color:#145c37}
.ans.bad{border-color:var(--bad);background:#fde4e7;color:#8f1f2b}
.ans.ok .l{background:var(--ok)}.ans.bad .l{background:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.08)}}

/* Chips & Zonen (Drag & Drop) */
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:50px;min-width:50px;padding:8px 16px;border-radius:12px;background:var(--s-acc-d);color:#fff;font-weight:800;font-size:1em;font-family:inherit;border:0;box-shadow:0 4px 0 rgba(0,0,0,.18);user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;line-height:1.2;text-align:center}
.stage[data-theme=tafel] .chip{color:#2d3a2f}
.chip.sel{outline:4px solid var(--s-acc2);outline-offset:2px}
.chip.dragging{opacity:.3}
.chip.ok{background:var(--ok)!important;color:#fff!important}
.chip.bad{background:var(--bad)!important;color:#fff!important}
.chip.fix{background:transparent!important;color:var(--ok)!important;border:2px dashed var(--ok);box-shadow:none}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 12px 26px rgba(0,0,0,.25)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;width:100%;max-width:1000px;padding:12px;border-radius:16px;border:2px dashed var(--s-line)}

.match-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:900px}

.group{min-height:200px;display:flex;flex-direction:column;border:2.5px dashed var(--s-line);border-radius:18px;padding:10px;background:var(--s-card)}

.order-slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:1000px}

.cloze-text .slot .chip{width:auto}
.mem-grid{display:grid;gap:10px;width:100%;max-width:960px}
.mem{perspective:800px;aspect-ratio:4/3;border:0;background:transparent;padding:0}
.mem-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mem.open .mem-in{transform:rotateY(180deg)}
.mem-f,.mem-b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;line-height:1.2;overflow:hidden;word-break:break-word}

.mem-b img{max-width:100%;max-height:100%;object-fit:contain}
.mem.done{visibility:hidden}
.mem.done-show .mem-b{border-color:var(--ok);background:#dff5e9;color:#145c37}
.find-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1000px}
.find-grid .ans{min-height:64px;justify-content:center;text-align:center;min-width:150px}
.find-grid .ans.gone{visibility:hidden}
.flash{width:min(92%,620px);aspect-ratio:3/2;perspective:1200px;border:0;background:transparent;padding:0}
.flash .mem-f,.flash .mem-b{font-size:1.45em;padding:24px}
.flash .mem-f{background:var(--s-card);color:var(--s-ink);border:2px solid var(--s-line)}
.flash .mem-b{background:var(--s-acc);color:#fff;border:0}
.stage[data-theme=tafel] .flash .mem-b{color:#2d3a2f}
.flash .tapnote{position:absolute;bottom:10px;left:0;right:0;font-size:.6em;font-weight:700;opacity:.6}
.tf-stmt{font-size:1.5em;font-weight:800;text-align:center;padding:26px 28px;max-width:860px;width:100%;line-height:1.3}
.tf-bar{width:100%;max-width:860px;height:10px;border-radius:99px;background:var(--s-line);overflow:hidden}

.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:560px}
.tf-btns button{min-height:84px;font-size:1.25em}

.wheel-box{position:relative;width:min(92vw,62vh,560px);aspect-ratio:1}
.wheel-box canvas{width:100%;height:100%;display:block}
.wheel-ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--s-acc2-d);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));z-index:2}

.result-pop .s-card{padding:24px 26px;text-align:center;max-width:620px;width:100%;color:var(--s-ink)}

.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;width:100%;max-width:960px}
.box{aspect-ratio:1;border-radius:16px;border:0;background:var(--s-acc);color:#fff;font-size:2em;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);position:relative;font-family:inherit}

.box.opened{opacity:.35;box-shadow:none}
.end{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:var(--s-bg);overflow:auto}
.end .s-card{padding:24px;max-width:640px;width:100%;text-align:center;margin:auto}
.end .score{font-size:3.2em;font-weight:800;color:var(--s-acc-d);line-height:1}
.end .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.mistakes{text-align:left;margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

.mistakes b{color:var(--ok)}

.board{margin-top:16px;text-align:left}
.board ol{margin:8px 0 0;padding-left:24px}
.end input{background:var(--s-card);color:var(--s-ink);border-color:var(--s-line)}

<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>

<script>
/* =========================================================
   1. KONFIGURATION
   ========================================================= */
(function () {
"use strict";

/* Dasselbe Firebase-Projekt wie protect.js / cm-auth.js / Strafenkasse.
   Zugriff regeln die Firestore-Regeln (siehe FIRESTORE_REGELN). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAt35KpU63iGk8UAX5X4T5Vj18zPf_JUus",
  authDomain: "kanban-board-281da.firebaseapp.com",
  projectId: "kanban-board-281da",
  storageBucket: "kanban-board-281da.firebasestorage.app",
  messagingSenderId: "210909884248",
  appId: "1:210909884248:web:10ffacb3a74f7b3c887f2d"
};
const FB_BASE = "https://www.gstatic.com/firebasejs/10.13.2/";
const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
const COL_USERS = "lernwerk";          // lernwerk/{uid}/activities/{id}
const COL_SHARED = "lernwerk_shared";  // lernwerk_shared/{shareId}  (öffentlich lesbar)
const FIRESTORE_REGELN = `match /lernwerk/{uid}/activities/{id} {
  allow read, write: if request.auth != null
    && request.auth.token.firebase.sign_in_provider != 'anonymous'
    && request.auth.uid == uid;
}
match /lernwerk_shared/{shareId} {
  allow get: if true;
  allow list: if false;
  allow create: if request.auth != null && request.resource.data.owner == request.auth.uid;
  allow update, delete: if request.auth != null && resource.data.owner == request.auth.uid;
}`;
const LS_LOCAL = "lernwerk_v1_local";
const LS_USER = (uid) => "lernwerk_v1_u_" + uid;
const LS_CLOUD_FLAG = "lernwerk_v1_cloud";
const DEFAULT_OPTS = { timer: "off", seconds: 120, shuffle: true, lives: 0, retry: true, showAnswers: true, sound: true, speed: "mittel", removeAfter: false, front: "term", mathMode: "input" };
const THEMES = [
  { id: "klassisch", name: "Klassisch", sw: "linear-gradient(90deg,#e8f4fd 50%,#5aaef0 50% 75%,#f2a0a8 75%)" },
  { id: "tafel", name: "Tafel", sw: "linear-gradient(90deg,#2d4a3c 60%,#f6d776 60% 80%,#7a5434 80%)" },
  { id: "primary", name: "Primary", sw: "linear-gradient(90deg,#fff7e3 50%,#ff9f1c 50% 75%,#2ec4b6 75%)" },
  { id: "nacht", name: "Nacht", sw: "linear-gradient(90deg,#101828 50%,#4aa8f2 50% 75%,#f06a7f 75%)" }
];

/* ---------- kleine Helfer ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function chunk(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function fmtDate(ts) { if (!ts) return ""; const d = new Date(ts); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) + ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
const reducedMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastT = null;
function toast(msg, ms) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms || 2600); }
function modal(html, opts) {
  opts = opts || {};
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); if (opts.onClose) opts.onClose(); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); if (e.target.closest("[data-close]")) close(); });
  const m = bg.firstElementChild;
  const f = m.querySelector("input,select,textarea,button:not([data-close])");
  if (f && opts.focus !== false) setTimeout(() => f.focus(), 30);
  return { el: m, close };
}
function confirmBox(text, okLabel, danger) {
  return new Promise((res) => {
    const m = modal(`<h2>Bitte bestätigen</h2><p>${esc(text)}</p><div class="foot"><button class="btn" data-close>Abbrechen</button><button class="btn ${danger ? "coral" : "pri"}" id="cbOk">${esc(okLabel || "OK")}</button></div>`, { onClose: () => res(false) });
    $("#cbOk", m.el).onclick = () => { res(true); m.close(); };
  });
}
function promptBox(title, value, label) {
  return new Promise((res) => {
    const m = modal(`<h2>${esc(title)}</h2><label class="fld">${esc(label || "")}</label><input type="text" id="pbIn" value="${esc(value || "")}"><div class="foot"><button class="btn" data-close>Abbrechen</button><button class="btn pri" id="pbOk">Übernehmen</button></div>`, { onClose: () => res(null) });
    const inp = $("#pbIn", m.el);
    const ok = () => { const v = inp.value; res(v); m.close(); };
    $("#pbOk", m.el).onclick = ok;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); });
  });
}

/* ---------- Töne (Web Audio, keine Dateien) ---------- */
const Sfx = {
  ctx: null, on: true,
  tone(freqs, dur, type, vol) {
    if (!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
      const t0 = this.ctx.currentTime;
      freqs.forEach((f, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type || "sine"; o.frequency.value = f;
        const st = t0 + i * dur * 0.85;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(vol || 0.18, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
        o.connect(g); g.connect(this.ctx.destination); o.start(st); o.stop(st + dur + 0.02);
      });
    } catch (e) {}
  },
  ok() { this.tone([660, 990], 0.13, "triangle"); },
  bad() { this.tone([220, 170], 0.16, "sawtooth", 0.08); },
  flip() { this.tone([520], 0.06, "triangle", 0.08); },
  tick() { this.tone([900], 0.03, "square", 0.03); },
  win() { this.tone([523, 659, 784, 1047], 0.14, "triangle"); }
};

/* =========================================================
   2. STORAGE-SCHICHT (lokal / Firebase)
   ========================================================= */
const Fb = {
  user: null, db: null, auth: null, ready: false, _p: null, listeners: [],
  load() {
    if (this._p) return this._p;
    this._p = (window.firebase ? Promise.resolve() : loadScript(FB_BASE + "firebase-app-compat.js"))
      .then(() => Promise.all([
        firebase.firestore ? null : loadScript(FB_BASE + "firebase-firestore-compat.js"),
        firebase.auth ? null : loadScript(FB_BASE + "firebase-auth-compat.js")
      ]))
      .then(() => {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.firestore();
        this.auth = firebase.auth();
        this.auth.getRedirectResult().catch((e) => toast("Google-Anmeldung fehlgeschlagen" + (e && e.code ? " (" + e.code + ")" : "")));
        this.auth.onAuthStateChanged((u) => {
          /* Anonyme Sitzungen (Feedback-Widget von protect.js) zählen nicht */
          this.user = u && !u.isAnonymous && u.email ? u : null;
          this.ready = true;
          this.listeners.forEach((f) => f(this.user));
        });
        return this;
      });
    this._p.catch(() => { this._p = null; });
    return this._p;
  },
  onUser(f) { this.listeners.push(f); },
  standalone() { return !!(navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)); },
  async signIn() {
    try { await this.load(); } catch (e) { toast("Anmeldedienst nicht erreichbar (offline?)"); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    if (this.standalone()) { await this.auth.signInWithRedirect(provider); return; }
    try { await this.auth.signInWithPopup(provider); }
    catch (err) {
      const c = err && err.code;
      if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") { await this.auth.signInWithRedirect(provider); return; }
      toast("Google-Anmeldung fehlgeschlagen" + (c ? " (" + c + ")" : ""), 5000);
    }
  },
  async signOut() { if (this.auth) await this.auth.signOut(); },
  col(uid) { return this.db.collection(COL_USERS).doc(uid).collection("activities"); },
  shared(id) { return this.db.collection(COL_SHARED).doc(id); }
};

const Cloud = {
  state: "off", msg: "",
  set(state, msg) { this.state = state; this.msg = msg || ""; renderAuthBox(); },
  fail(e) {
    const code = e && (e.code || e.name);
    if (code === "permission-denied") this.set("err", "Keine Schreibrechte – Firestore-Regeln fehlen noch.");
    else if (code === "unavailable" || !navigator.onLine) this.set("err", "Offline – wird beim nächsten Speichern nachgeholt.");
    else this.set("err", "Cloud-Fehler" + (code ? " (" + code + ")" : ""));
  }
};

const Store = {
  mode: "local", uid: null, acts: [],
  key() { return this.mode === "cloud" ? LS_USER(this.uid) : LS_LOCAL; },
  readCache() { const v = lsGet(this.key(), []); return Array.isArray(v) ? v : []; },
  writeCache() { if (!lsSet(this.key(), this.acts)) toast("Gerätespeicher voll – bitte exportieren."); },
  useLocal() { this.mode = "local"; this.uid = null; this.acts = this.readCache(); Cloud.set("off"); },
  async useCloud(uid) {
    this.mode = "cloud"; this.uid = uid; this.acts = this.readCache();
    rerouteSoft();
    await this.pull();
    rerouteSoft();
  },
  async pull() {
    if (this.mode !== "cloud") return;
    Cloud.set("busy", "Synchronisiere …");
    try {
      const snap = await Fb.col(this.uid).get();
      const remote = snap.docs.map((d) => d.data());
      const byId = new Map(remote.map((r) => [r.id, r]));
      const merged = remote.slice();
      this.acts.filter((l) => l._dirty).forEach((l) => {
        const r = byId.get(l.id);
        if (!r) merged.push(l);
        else if ((l.updatedAt || 0) >= (r.updatedAt || 0)) merged[merged.indexOf(r)] = l;
      });
      this.acts = merged;
      this.writeCache();
      const dirty = this.acts.filter((a) => a._dirty);
      let ok = true;
      for (const a of dirty) ok = (await this.push(a)) && ok;
      if (ok) Cloud.set("ok");
    } catch (e) { Cloud.fail(e); }
  },
  clean(a) { const c = clone(a); delete c._dirty; return c; },
  async push(a) {
    if (this.mode !== "cloud") return true;
    try {
      await Fb.col(this.uid).doc(a.id).set(this.clean(a));
      a._dirty = false; this.writeCache();
      if (a.shareId) await Fb.shared(a.shareId).set(sharedPayload(a, this.uid)).catch(() => {});
      Cloud.set("ok");
      return true;
    } catch (e) { a._dirty = true; this.writeCache(); Cloud.fail(e); return false; }
  },
  get(id) { return this.acts.find((a) => a.id === id) || null; },
  async save(a) {
    a.updatedAt = Date.now();
    const i = this.acts.findIndex((x) => x.id === a.id);
    if (i === -1) this.acts.unshift(a); else this.acts[i] = a;
    a._dirty = this.mode === "cloud";
    this.writeCache();
    return this.push(a);
  },
  async remove(id) {
    const a = this.get(id);
    this.acts = this.acts.filter((x) => x.id !== id);
    this.writeCache();
    if (this.mode === "cloud" && a) {
      try { await Fb.col(this.uid).doc(id).delete(); if (a.shareId) await Fb.shared(a.shareId).delete(); }
      catch (e) { Cloud.fail(e); }
    }
  }
};

function sharedPayload(a, owner) {
  return { owner: owner, title: a.title, dataType: a.dataType, template: a.template, content: clone(a.content), options: clone(a.options || {}), theme: a.theme || "klassisch", updatedAt: Date.now() };
}

/* Inhalt in den Link packen (lokaler Modus): JSON → deflate → Base64url */
function b64u(bytes) { let s = ""; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64u(str) { str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "="; const bin = atob(str); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function packData(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ("CompressionStream" in window) {
    try {
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
      return "z" + b64u(new Uint8Array(buf));
    } catch (e) {}
  }
  return "j" + b64u(bytes);
}
async function unpackData(s) {
  const bytes = unb64u(s.slice(1));
  if (s[0] === "z") {
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function makeShareId() { const al = "abcdefghijkmnpqrstuvwxyz23456789"; let s = ""; const r = crypto.getRandomValues(new Uint8Array(8)); for (const b of r) s += al[b % al.length]; return s; }

/* =========================================================

/* ---------- Mathe-Generator: Aufgaben nach Thema & Kursniveau ---------- */
const MATH_TOPICS = [

const MATH_LEVELS = [["C", "C-Kurs (grundlegend)"], ["B", "B-Kurs (mittel)"], ["A", "A-Kurs (erweitert)"]];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

const par = (n) => (n < 0 ? "(" + deNum(n) + ")" : deNum(n));
function mathTask(topic, lv) {
  const L = { C: 0, B: 1, A: 2 }[lv] ?? 1;
  const t = topic === "mix" ? pick(["add", "sub", "mul", "div"]) : topic;
  let q, n, s = null, eq = true;
  if (t === "add") { const m = [20, 100, 1000][L]; const x = rint(1, m - 1), y = rint(1, m - x); q = `${x} + ${y}`; n = x + y; }
  else if (t === "sub") { const m = [20, 100, 1000][L]; const x = rint(2, m), y = rint(1, x - 1); q = `${x} − ${y}`; n = x - y; }
  else if (t === "mul") { const [a1, a2, b1, b2] = [[2, 10, 2, 5], [2, 10, 2, 10], [11, 25, 3, 12]][L]; const x = rint(a1, a2), y = rint(b1, b2); q = `${x} · ${y}`; n = x * y; }
  else if (t === "div") { const [a1, a2, b1, b2] = [[2, 5, 2, 10], [2, 10, 2, 10], [3, 12, 11, 25]][L]; const y = rint(a1, a2), z = rint(b1, b2); q = `${y * z} : ${y}`; n = z; }
  else if (t === "einmaleins") { const x = rint(1, [5, 10, 20][L]), y = rint(1, 10); q = `${x} · ${y}`; n = x * y; }
  else if (t === "neg") { const m = [10, 20, 50][L]; const x = rint(-m, m), y = rint(-m, m) || -1; const op = L === 2 ? pick(["+", "−", "·"]) : L === 1 ? pick(["+", "−"]) : "+"; q = `${deNum(x)} ${op} ${par(y)}`; n = op === "+" ? x + y : op === "−" ? x - y : x * y; }
  else if (t === "dezimal") {
    if (L < 2) { const d = L ? 100 : 10, x = rint(1, L ? 999 : 99) / d, y = rint(1, L ? 999 : 99) / d, op = pick(["+", "−"]); const [u, v] = op === "−" && y > x ? [y, x] : [x, y]; q = `${deNum(u)} ${op} ${deNum(v)}`; n = op === "+" ? u + v : u - v; }

  else if (t === "quadrat") { const x = rint(1, [10, 15, 25][L]); if (L && Math.random() < 0.5) { q = `√${x * x}`; n = x; } else { q = `${x}²`; n = x * x; } }
  else if (t === "bruch") { const d = rint(2, [6, 9, 12][L]); let z = rint(1, d - 1); while (gcd(z, d) !== 1) z = rint(1, d - 1); const f = rint(2, [3, 6, 12][L]); q = `Kürze vollständig: ${z * f}/${d * f}`; s = `${z}/${d}`; n = null; eq = false; }
  else if (t === "runden") { eq = false; if (L === 0) { const x = rint(11, 999); q = `Runde ${x} auf Zehner`; n = Math.round(x / 10) * 10; } else if (L === 1) { const x = rint(101, 9999); q = `Runde ${x} auf Hunderter`; n = Math.round(x / 100) * 100; } else { const x = rint(1001, 99999) / 1000; q = `Runde ${deNum(x)} auf Zehntel`; n = Math.round(x * 10) / 10; } }
  else if (t === "gleichung") { eq = false; const xv = rint(L === 2 ? -10 : 1, [10, 20, 15][L]); if (L === 0) { const b = rint(1, 20); q = `x + ${b} = ${xv + b}`; } else { const k = rint(2, L === 2 ? 9 : 6), b = rint(L === 2 ? -15 : 1, 15) || 3; q = `${k}x ${b < 0 ? "−" : "+"} ${Math.abs(b)} = ${deNum(k * xv + b)}`; } q += ", x = ?"; n = xv; }

function mathWrong(task, k) {
  const out = new Set();
  if (task.n == null) {
    const [z, d] = task.a.split("/").map(Number);
    [[z + 1, d], [z, d + 1], [z * 2, d * 2], [Math.max(1, z - 1), d], [z, d + 2], [d, z]].forEach(([x, y]) => { const t = `${x}/${y}`; if (t !== task.a) out.add(t); });

const Conv = {
  pairs(a) {
    const c = a.content;
    if (a.dataType === "pairs") return (c.items || []).filter((i) => i.term && i.term.trim() && ((i.definition && i.definition.trim()) || i.defImage)).map((i) => ({ term: i.term.trim(), definition: (i.definition || "").trim(), defImage: i.defImage || "" }));
    if (a.dataType === "mc") return Conv.mc(a).map((q) => ({ term: q.answers.find((x) => x.correct).text, definition: q.question, defImage: q.image || "" }));
    if (a.dataType === "math") return mathTasks(a.content).map((t) => ({ term: t.a, definition: t.q, defImage: "" }));
    return null;
  },
  mc(a) {
    const c = a.content;
    if (a.dataType === "mc") return (c.questions || []).map((q) => ({ question: (q.question || "").trim(), image: q.image || "", answers: (q.answers || []).filter((x) => x.text && x.text.trim()).map((x) => ({ text: x.text.trim(), correct: !!x.correct })) })).filter((q) => (q.question || q.image) && q.answers.length >= 2 && q.answers.some((x) => x.correct));
    if (a.dataType === "pairs") {
      const p = Conv.pairs(a);
      const terms = [...new Set(p.map((i) => i.term))];
      if (terms.length < 2) return [];
      return p.map((i) => ({ question: i.definition, image: i.defImage, answers: [{ text: i.term, correct: true }].concat(shuffle(terms.filter((t) => t !== i.term)).slice(0, 3).map((t) => ({ text: t, correct: false }))) }));
    }
    if (a.dataType === "categories") {
      const g = Conv.cats(a); if (!g || g.length < 2) return [];
      return g.flatMap((grp) => grp.items.map((it) => ({ question: `Wohin gehört „${it}“?`, image: "", answers: g.map((x) => ({ text: x.name, correct: x === grp })) })));
    }
    if (a.dataType === "math") return mathTasks(a.content).map((t) => ({ question: t.q, image: "", answers: [{ text: t.a, correct: true }].concat(mathWrong(t, 3).map((w) => ({ text: w, correct: false }))) }));
    return [];
  },
  cats(a) {
    if (a.dataType !== "categories") return null;
    return (a.content.groups || []).map((g) => ({ name: (g.name || "").trim(), items: (g.items || []).map((s) => String(s).trim()).filter(Boolean) })).filter((g) => g.name && g.items.length);
  },
  cards(a) { /* {title, sub} für Glücksrad, Boxen */
    const c = a.content;
    if (a.dataType === "list") return (c.items || []).map((s) => String(s).trim()).filter(Boolean).map((t) => ({ title: t }));
    if (a.dataType === "pairs") return Conv.pairs(a).map((i) => ({ title: i.term, sub: i.definition }));
    if (a.dataType === "mc") return Conv.mc(a).map((q) => ({ title: q.question, sub: q.answers.find((x) => x.correct).text, img: q.image }));
    if (a.dataType === "categories") return (Conv.cats(a) || []).flatMap((g) => g.items.map((it) => ({ title: it, sub: g.name })));
    if (a.dataType === "sequence") return Conv.seq(a).map((s) => ({ title: s.join(a.content.mode === "bar" ? " → " : " ") }));
    if (a.dataType === "math") return mathTasks(a.content).map((t) => ({ title: t.q, sub: t.a }));

    return null;
  },
  tf(a) { /* Aussagen {text, truth} */
    const out = [];
    if (a.dataType === "categories") {
      const g = Conv.cats(a) || [];
      const tIdx = g.findIndex((x) => /^(wahr|richtig|stimmt|ja|true)\b/i.test(x.name));
      const fIdx = g.findIndex((x) => /^(falsch|stimmt nicht|nein|false)\b/i.test(x.name));
      if (g.length === 2 && tIdx !== -1 && fIdx !== -1) { g[tIdx].items.forEach((t) => out.push({ text: t, truth: true })); g[fIdx].items.forEach((t) => out.push({ text: t, truth: false })); return out; }
      if (g.length < 2) return out;
      g.forEach((grp) => grp.items.forEach((it) => {
        const truth = Math.random() < 0.5;
        const other = shuffle(g.filter((x) => x !== grp))[0];

    }
    if (a.dataType === "mc") {
      Conv.mc(a).forEach((q) => {

  },
  hint(a) { /* {term, hint} für Galgenmännchen, Schreibe das Wort, Kreuzworträtsel */
    if (a.dataType === "pairs") return Conv.pairs(a).map((x) => ({ term: x.term, hint: x.definition }));
    if (a.dataType === "mc") return Conv.mc(a).map((q) => ({ term: q.answers.find((x) => x.correct).text, hint: q.question }));
    if (a.dataType === "categories") return (Conv.cats(a) || []).flatMap((g) => g.items.map((t) => ({ term: t, hint: g.name })));
    if (a.dataType === "list") return (a.content.items || []).map((t) => ({ term: String(t).trim(), hint: "" })).filter((x) => x.term);

    if (a.dataType === "pairs") return Conv.pairs(a).filter((x) => x.definition || x.defImage).map((x) => ({ prompt: x.definition, answer: x.term, image: x.defImage }));

  }
};

/* ---------- Drag & Drop mit Pointer Events + Tippen ----------
   Chips (.chip) lassen sich ziehen ODER antippen (auswählen) und dann
   eine Zone (.zone) antippen. onTap(chip) behandelt Einzel-Tipp. */
function dnd(root, h) {
  let st = null, selected = null;
  const select = (c) => { if (selected) selected.classList.remove("sel"); selected = c; if (c) c.classList.add("sel"); };
  root.addEventListener("pointerdown", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip || !root.contains(chip) || chip.dataset.lock) return;
    e.preventDefault();
    st = { chip, x: e.clientX, y: e.clientY, drag: false, ghost: null, id: e.pointerId, hot: null };
    try { chip.setPointerCapture(e.pointerId); } catch (_) {}
  });
  root.addEventListener("pointermove", (e) => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.drag && Math.hypot(dx, dy) > 8) {
      st.drag = true; select(null);
      const g = st.chip.cloneNode(true); g.classList.add("drag-ghost"); g.classList.remove("sel"); g.style.width = st.chip.offsetWidth + "px";
      document.body.appendChild(g); st.ghost = g; st.chip.classList.add("dragging");
    }
    if (st.drag) {
      st.ghost.style.left = e.clientX + "px"; st.ghost.style.top = e.clientY + "px";
      const z = zoneAt(e.clientX, e.clientY);
      if (z !== st.hot) { if (st.hot) st.hot.classList.remove("hot"); st.hot = z; if (z) z.classList.add("hot"); }
    }
  });
  const end = (e) => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (s.hot) s.hot.classList.remove("hot");
    if (s.drag) {
      s.ghost.remove(); s.chip.classList.remove("dragging");
      const z = e.type === "pointercancel" ? null : zoneAt(e.clientX, e.clientY);
      if (z) h.onPlace(s.chip, z);
    } else if (e.type !== "pointercancel") {
      if (h.onTap && h.onTap(s.chip, selected) === true) { select(null); return; }
      select(selected === s.chip ? null : s.chip);
    }
  };
  root.addEventListener("pointerup", end);
  root.addEventListener("pointercancel", end);
  root.addEventListener("click", (e) => {
    if (e.target.closest(".chip")) return;
    const z = e.target.closest(".zone");
    if (z && selected && root.contains(z)) { const c = selected; select(null); h.onPlace(c, z); }
  });
  function zoneAt(x, y) { const el = document.elementFromPoint(x, y); const z = el && el.closest(".zone"); return z && root.contains(z) ? z : null; }
  return { select, get selected() { return selected; } };
}
function chipEl(text, key, extra) { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = text; b.dataset.key = key; if (extra) Object.assign(b.dataset, extra); return b; }

/* Prüfen einer Runde mit Zonen: chip.dataset.key === zone.dataset.key */
function checkZones(api, root, pool, h) {
  const chips = $$(".zone .chip", root).filter((c) => !c.closest(".pool"));
  let allOk = true;
  chips.forEach((c) => {
    const z = c.closest(".zone");
    const ok = h.isOk ? h.isOk(c, z) : c.dataset.key === z.dataset.key;
    c.classList.remove("sel");
    c.classList.add(ok ? "ok" : "bad");
    if (!ok) allOk = false;
    if (!c.dataset.scored) { c.dataset.scored = "1"; if (ok) api.right(); else api.wrong(h.mistake(c, z)); }
  });
  if (api.ended) return;
  if (allOk) { chips.forEach((c) => (c.dataset.lock = "1")); setTimeout(() => !api.ended && h.done(), 900); return; }
  if (api.opts.retry) {
    setTimeout(() => { chips.forEach((c) => { if (c.classList.contains("bad")) { c.classList.remove("bad"); pool.appendChild(c); } else c.dataset.lock = "1"; }); h.changed && h.changed(); }, 1100);
  } else {
    setTimeout(() => { chips.forEach((c) => { if (c.classList.contains("bad")) h.fix(c, c.closest(".zone")); c.dataset.lock = "1"; }); h.showNext(); }, 1100);
  }
}
function nextBtn(label, fn) { const b = document.createElement("button"); b.className = "s-btn"; b.textContent = label || "Weiter"; b.onclick = fn; return b; }

/* ---------- Vorlage: Quiz ---------- */
function renderQuiz(api, a) {
  const qs = api.rnd(Conv.mc(a)).map((q) => Object.assign({}, q, { answers: api.opts.shuffle ? shuffle(q.answers) : q.answers }));
  api.setMax(qs.length);
  let i = 0;
  const show = () => {
    if (api.ended) return;
    if (i >= qs.length) return api.finish();
    const q = qs[i], right = q.answers.find((x) => x.correct);
    api.el.innerHTML = `<div class="prog">Frage ${i + 1} von ${qs.length}</div>${q.image ? `<img class="q-img" src="${esc(q.image)}" alt="">` : ""}<div class="q-text s-card">${esc(q.question)}</div>
      <div class="answers">${q.answers.map((x, k) => `<button class="ans" data-k="${k}"><span class="l">${"ABCDEF"[k]}</span><span>${esc(x.text)}</span></button>`).join("")}</div>`;
    let tried = false, locked = false;
    $$(".ans", api.el).forEach((b) => b.onclick = () => {
      if (locked || api.ended) return;
      const x = q.answers[+b.dataset.k];
      if (x.correct) { b.classList.add("ok", "pop"); if (!tried) api.right(); else Sfx.ok(); locked = true; i++; setTimeout(show, 850); }
      else {
        b.classList.add("bad", "shake"); b.disabled = true;
        if (!tried) { tried = true; api.wrong({ prompt: q.question, given: x.text, correct: right.text }); }
        if (api.ended) return;
        if (!api.opts.retry) { locked = true; $$(".ans", api.el).find((y) => q.answers[+y.dataset.k].correct).classList.add("ok"); i++; setTimeout(show, 1500); }
      }
    });
  };
  show();
}

/* ---------- Vorlage: It's a Match ---------- */
function renderMatch(api, a) {
  const all = api.rnd(Conv.pairs(a));
  api.setMax(all.length);
  const rounds = chunk(all, 6); let r = 0;
  const show = () => {
    if (api.ended) return;
    if (r >= rounds.length) return api.finish();
    const items = rounds[r];
    api.el.innerHTML = `${rounds.length > 1 ? `<div class="prog">Runde ${r + 1} von ${rounds.length}</div>` : ""}<div class="match-list"></div><div class="pool zone" data-pool="1"></div><div class="row-flex"></div>`;
    const list = $(".match-list", api.el), pool = $(".pool", api.el), bar = $(".row-flex", api.el);
    items.forEach((it, k) => {
      const row = document.createElement("div"); row.className = "match-row";
      row.innerHTML = `<div class="slot zone" data-key="${k}"></div><div class="match-def s-card">${it.defImage ? `<img src="${esc(it.defImage)}" alt="">` : ""}<span>${esc(it.definition)}</span></div>`;
      list.appendChild(row);
    });
    shuffle(items.map((it, k) => ({ it, k }))).forEach(({ it, k }) => pool.appendChild(chipEl(it.term, k)));
    const check = nextBtn("Prüfen", () => doCheck()); check.disabled = true; bar.appendChild(check);
    const changed = () => { check.disabled = $$(".slot", api.el).some((s) => !s.querySelector(".chip")); };
    const place = (chip, zone) => {
      if (zone.dataset.pool) { pool.appendChild(chip); }
      else { const old = zone.querySelector(".chip"); if (old && old !== chip) (chip.parentElement.classList.contains("slot") ? chip.parentElement : pool).appendChild(old); zone.appendChild(chip); }
      Sfx.flip(); changed();
    };
    dnd(api.el, {
      onPlace: place,
      onTap: (chip) => { if (chip.parentElement.classList.contains("slot")) { pool.appendChild(chip); changed(); return true; } return false; }
    });
    const doCheck = () => {
      check.disabled = true;
      checkZones(api, api.el, pool, {
        mistake: (c, z) => ({ prompt: items[+z.dataset.key].definition, given: c.textContent, correct: items[+z.dataset.key].term }),
        fix: (c, z) => { c.textContent = items[+z.dataset.key].term; c.classList.remove("bad"); c.classList.add("fix"); },
        done: () => { r++; show(); },
        showNext: () => { bar.innerHTML = ""; bar.appendChild(nextBtn(r + 1 < rounds.length ? "Nächste Runde" : "Fertig", () => { r++; show(); })); },
        changed
      });
    };
  };
  show();
}

/* ---------- Vorlage: Passende Paare (Memory) ---------- */
function renderMemory(api, a) {
  const all = api.rnd(Conv.pairs(a));
  api.setMax(all.length);
  const rounds = chunk(all, 8); let r = 0, tries = 0;
  api.extraStat = () => `🔁 ${tries} ${tries === 1 ? "Versuch" : "Versuche"}`;
  const show = () => {
    if (api.ended) return;
    if (r >= rounds.length) return api.finish();
    const items = rounds[r];
    const tiles = shuffle(items.flatMap((it, k) => [{ k, txt: it.term }, { k, txt: it.definition, img: it.defImage }]));
    const cols = tiles.length <= 6 ? 3 : tiles.length <= 12 ? 4 : tiles.length <= 16 ? 4 : 5;
    api.el.innerHTML = `${rounds.length > 1 ? `<div class="prog">Runde ${r + 1} von ${rounds.length}</div>` : ""}<div class="mem-grid" style="grid-template-columns:repeat(${window.innerWidth < 560 ? Math.min(cols, 3) : cols},1fr)"></div>`;
    const grid = $(".mem-grid", api.el);
    tiles.forEach((t, n) => {
      const b = document.createElement("button"); b.className = "mem"; b.dataset.k = t.k; b.setAttribute("aria-label", "Karte " + (n + 1));
      b.innerHTML = `<div class="mem-in"><div class="mem-f">${n + 1}</div><div class="mem-b">${t.img && !t.txt ? `<img src="${esc(t.img)}" alt="">` : esc(t.txt)}</div></div>`;
      grid.appendChild(b);
    });
    let open = [], busy = false, found = 0;
    grid.onclick = (e) => {
      const b = e.target.closest(".mem"); if (!b || busy || b.classList.contains("open") || api.ended) return;
      b.classList.add("open"); Sfx.flip(); open.push(b);
      if (open.length < 2) return;
      tries++; api.refresh();
      const [x, y] = open; open = [];
      if (x.dataset.k === y.dataset.k) {
        api.right(); found++;

/* ---------- Vorlage: Glücksrad ---------- */
function renderWheel(api, a) {
  let items = api.opts.shuffle ? shuffle(Conv.cards(a)) : Conv.cards(a);
  api.el.innerHTML = `<div class="wheel-box"><div class="wheel-ptr"></div><canvas aria-label="Glücksrad"></canvas></div><div class="row-flex" style="justify-content:center"><button class="s-btn" id="spinBtn">🎡 Drehen</button><button class="s-btn alt" id="resetBtn" title="Alle Einträge zurückholen">↺</button></div>`;
  const canvas = $("canvas", api.el), box = $(".wheel-box", api.el);
  let rot = 0, spinning = false, raf = 0;
  api.onEnd(() => cancelAnimationFrame(raf));
  const all = items.slice();
  const colors = () => { const cs = getComputedStyle(api.stage); return [1, 2, 3, 4, 5, 6].map((n) => cs.getPropertyValue("--w" + n).trim() || "#5aaef0"); };
  const draw = () => {
    const dpr = window.devicePixelRatio || 1, w = box.clientWidth;
    canvas.width = w * dpr; canvas.height = w * dpr;
    const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = w / 2 - 6, cx = w / 2, cy = w / 2, n = items.length, seg = (Math.PI * 2) / n, cols = colors();
    const ink = getComputedStyle(api.stage).getPropertyValue("--s-ink").trim();
    c.clearRect(0, 0, w, w);
    if (!n) { c.fillStyle = "#ccc"; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); return; }
    for (let i = 0; i < n; i++) {
      const s = rot + i * seg - Math.PI / 2;
      c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, s, s + seg); c.closePath();
      c.fillStyle = cols[(n % 6 === 1 && i === n - 1) ? 2 : i % 6]; c.fill();
      c.strokeStyle = "rgba(255,255,255,.85)"; c.lineWidth = 2; c.stroke();
      c.save(); c.translate(cx, cy); c.rotate(s + seg / 2); c.textAlign = "right"; c.textBaseline = "middle";
      const fs = Math.max(11, Math.min(26, w / 18, (seg * r) / 2.4));
      c.font = `800 ${fs}px ${getComputedStyle(api.stage).fontFamily}`; c.fillStyle = "#1d2433";
      let t = items[i].title; const maxW = r * 0.78;
      while (c.measureText(t).width > maxW && t.length > 2) t = t.slice(0, -2) + "…";
      c.fillText(t, r - 14, 0); c.restore();
    }
    c.beginPath(); c.arc(cx, cy, Math.max(18, w * 0.06), 0, 7); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 4; c.strokeStyle = ink || "#333"; c.stroke();
  };
  const ro = new ResizeObserver(() => draw()); ro.observe(box); api.onEnd(() => ro.disconnect());
  draw();
  const spin = () => {
    if (spinning || !items.length || api.ended) return;
    spinning = true; Sfx.flip();
    const start = rot, total = Math.PI * 2 * (5 + Math.random() * 3) + Math.random() * Math.PI * 2, d = reducedMotion() ? 600 : 4200, t0 = performance.now();
    let lastSeg = -1;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 4);
      rot = start + total * e; draw();
      const segN = Math.floor(rot / ((Math.PI * 2) / items.length)); if (segN !== lastSeg) { lastSeg = segN; if (p < .97) Sfx.tick(); }
      if (p < 1) raf = requestAnimationFrame(step); else { spinning = false; result(); }
    };
    raf = requestAnimationFrame(step);
  };
  const result = () => {
    const n = items.length, seg = (Math.PI * 2) / n;
    const idx = Math.floor((((-rot) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / seg) % n;
    const it = items[idx]; Sfx.win();
    const pop = document.createElement("div"); pop.className = "result-pop";
    pop.innerHTML = `<div class="s-card"><div class="prog">Das Rad hat entschieden:</div>${it.img ? `<img class="q-img" src="${esc(it.img)}" alt="">` : ""}<div class="big">${esc(it.title)}</div>${it.sub ? `<div id="subBox" class="hidden" style="font-size:1.2em;font-weight:700;margin-bottom:12px">${esc(it.sub)}</div><button class="s-btn alt" id="subBtn" style="margin:0 6px 10px">Lösung zeigen</button>` : ""}<div class="row-flex" style="justify-content:center">${api.opts.removeAfter ? "" : `<button class="s-btn alt" id="rmBtn">Entfernen</button>`}<button class="s-btn" id="okBtn">Weiter</button></div></div>`;
    api.stage.appendChild(pop);
    const closeP = (remove) => { pop.remove(); if (remove) { items.splice(idx, 1); draw(); if (!items.length) { toast("Alle Einträge sind dran gewesen 🎉"); } } };
    if (it.sub) $("#subBtn", pop).onclick = (e) => { $("#subBox", pop).classList.remove("hidden"); e.target.remove(); };
    $("#okBtn", pop).onclick = () => closeP(api.opts.removeAfter);
    const rm = $("#rmBtn", pop); if (rm) rm.onclick = () => closeP(true);
  };
  $("#spinBtn", api.el).onclick = spin;
  $("#resetBtn", api.el).onclick = () => { items = all.slice(); draw(); toast("Alle Einträge wieder im Rad"); };
  canvas.onclick = spin;
}

/* ---------- Reihenfolge-Spiel (Anagramm & Die richtige Reihenfolge) ---------- */
function orderGame(api, tasks, opt) {
  /* tasks: [{units:[...], hint, label, solution, extra?:[Ablenker]}]
     opt: true/false (senkrecht) oder { vertical, magnets, keyboard } */
  const o = typeof opt === "object" && opt ? opt : { vertical: !!opt };
  const vertical = !!o.vertical;
  api.setMax(tasks.length);
  let i = 0, cur = null;
  if (o.keyboard) keys(api, (e) => {
    if (!cur) return;
    if (e.key === "Backspace") { const f = cur.slots.filter((s) => s.querySelector(".chip:not([data-lock])")).pop(); if (f) cur.pool.appendChild(f.querySelector(".chip")); return; }
    if (e.key.length !== 1) return;
    const c = $$(".chip", cur.pool).find((x) => x.textContent.toLowerCase() === e.key.toLowerCase());
    if (c) cur.tap(c);
  });
  const show = () => {
    if (api.ended) return;
    if (i >= tasks.length) return api.finish();
    const t = tasks[i];
    let mix = shuffle(t.units.map((u, k) => ({ u, k })));
    if (t.units.length > 1 && mix.every((m, k) => m.u === t.units[k])) mix = mix.slice(1).concat(mix[0]);
    api.el.innerHTML = `<div class="prog">${esc(t.label)} ${i + 1} von ${tasks.length}</div>${t.hint ? `<div class="hint-box s-card">💡 ${esc(t.hint)}</div>` : ""}
      <div class="order-slots ${vertical ? "vert" : ""}">${t.units.map((_, k) => `<div class="slot zone" data-n="${k + 1}." data-key="${k}"></div>`).join("")}</div>
      <div class="pool zone" data-pool="1"></div><div class="row-flex"></div>`;
    const pool = $(".pool", api.el), bar = $(".row-flex", api.el);
    const chips = mix.map((m) => chipEl(m.u, m.k)).concat((t.extra || []).map((x) => chipEl(x, "x")));
    (t.extra && t.extra.length ? shuffle(chips) : chips).forEach((c) => pool.appendChild(c));
    if (o.magnets) { pool.classList.add("magnets"); chips.forEach((c) => { c.style.transform = `rotate(${(Math.random() * 12 - 6).toFixed(1)}deg)`; c.style.margin = `${Math.floor(Math.random() * 14)}px ${Math.floor(Math.random() * 10)}px`; }); }
    let tried = false;
    const slots = $$(".order-slots .slot", api.el);
    const evaluate = () => {
      if (slots.some((s) => !s.querySelector(".chip"))) return;
      const given = slots.map((s) => s.querySelector(".chip").textContent);
      const ok = given.every((g, k) => g === t.units[k]);
      if (ok) { slots.forEach((s) => s.querySelector(".chip").classList.add("ok")); if (!tried) api.right(); else Sfx.ok(); $$(".chip", api.el).forEach((c) => c.dataset.lock = "1"); i++; setTimeout(show, 1000); return; }
      slots.forEach((s, k) => { const c = s.querySelector(".chip"); c.classList.add(c.textContent === t.units[k] ? "ok" : "bad"); });
      const wrap = $(".order-slots", api.el); wrap.classList.add("shake"); setTimeout(() => wrap.classList.remove("shake"), 400);
      if (!tried) { tried = true; api.wrong({ prompt: t.hint || t.label, given: given.join(vertical ? " → " : t.joiner), correct: t.solution }); }
      if (api.ended) return;
      if (api.opts.retry) setTimeout(() => { slots.forEach((s, k) => { const c = s.querySelector(".chip"); if (c && c.textContent !== t.units[k]) { c.classList.remove("bad"); pool.appendChild(c); } else if (c) { c.dataset.lock = "1"; } }); }, 1000);
      else setTimeout(() => { slots.forEach((s, k) => { s.innerHTML = ""; const c = chipEl(t.units[k], k); c.classList.add("fix"); c.dataset.lock = "1"; s.appendChild(c); }); bar.innerHTML = ""; bar.appendChild(nextBtn("Weiter", () => { i++; show(); })); }, 1000);
    };
    dnd(api.el, {
      onPlace: (chip, zone) => {
        if (zone.dataset.pool) pool.appendChild(chip);
        else { const old = zone.querySelector(".chip"); if (old && old !== chip) (chip.parentElement.classList.contains("slot") ? chip.parentElement : pool).appendChild(old); zone.appendChild(chip); }
        Sfx.flip(); evaluate();
      },
      onTap: (chip) => tap(chip)
    });
    const tap = (chip) => {
      if (chip.dataset.lock) return true;
      if (chip.parentElement.classList.contains("slot")) { pool.appendChild(chip); return true; }
      const empty = slots.find((s) => !s.querySelector(".chip"));
      if (empty) { empty.appendChild(chip); Sfx.flip(); evaluate(); }
      return true;
    };
    cur = { pool, slots, tap };
  };
  show();
}

/* =========================================================
   5b. WEITERE VORLAGEN (Wörter, Arcade, Quiz-Varianten, Klasse)
   ========================================================= */
const spd = (api, vals) => vals[{ langsam: 0, mittel: 1, schnell: 2 }[api.opts.speed] ?? 1];
const isLetter = (ch) => /[A-Za-zÄÖÜäöüß]/.test(ch);
const upKey = (ch) => (ch === "ß" || ch === "ẞ" ? "ß" : ch.toLocaleUpperCase("de-DE"));
function normAns(s) { return String(s == null ? "" : s).trim().toLowerCase().replace(/−/g, "-").replace(/\s+/g, "").replace(/,/g, "."); }
function answerOk(given, expected) {
  const g = normAns(given), e = normAns(expected);
  if (!g) return false;
  if (g === e) return true;
  const num = /^-?\d+(\.\d+)?$/;
  return num.test(g) && num.test(e) && Math.abs(parseFloat(g) - parseFloat(e)) < 1e-9;
}
function timers(api) {

      e.L.forEach((ch, k) => { const key = (r + dr * k) + "," + (c + dc * k); const cl = cells.get(key) || { ch }; cl[dir] = true; cells.set(key, cl); });

          if (p.L[i] !== e.L[j]) continue;

          const pr = p.r + (p.dir === "d" ? i : 0), pc = p.c + (p.dir === "a" ? i : 0);

  best.placed.forEach((p) => { p.n = starts.indexOf(p.r * 1000 + p.c) + 1; });

}

    api.el.innerHTML = `<div class="wm-prompt s-card">🔨 Triff: <b>${esc(r.prompt)}</b></div><div class="wm-grid">${Array.from({ length: 9 }, (_, n) => `<div class="wm-hole"><button class="wm-mole" tabindex="-1"></button></div>`).join("")}</div><div class="prog">Runde ${k + 1} von ${rounds.length} · nur die passenden treffen!</div>`;

  const sky = $(".bl-sky", api.el);
  let i = 0, tried = false, since = 9, last = 0, balloons = [];
  const setTarget = () => {
    if (i >= items.length) return api.finish();
    tried = false; since = 9;
    $("#blDef", api.el).innerHTML = (items[i].defImage ? `<img class="q-img" style="max-height:90px" src="${esc(items[i].defImage)}" alt=""><br>` : "") + esc(items[i].definition);
  };
  const hit = (b) => {
    if (b.popped || api.ended || i >= items.length) return;
    b.popped = true; b.el.classList.add(b.term === items[i].term ? "pop-ok" : "pop-bad"); setTimeout(() => b.el.remove(), 320);
    if (b.term === items[i].term) { if (!tried) api.right(); else Sfx.ok(); i++; setTarget(); }
    else {
      if (!tried) { tried = true; api.wrong({ prompt: items[i].definition, given: b.term, correct: items[i].term }); }
      if (!api.opts.retry && !api.ended) { i++; setTarget(); }
    }
  };
  const spawn = (now) => {
    if (i >= items.length) return;
    const cur = items[i].term, others = terms.filter((t) => t !== cur);
    const term = since >= 2 || !others.length || Math.random() < 0.3 ? cur : others[Math.floor(Math.random() * others.length)];
    since = term === cur ? 0 : since + 1;
    const el = document.createElement("button"); el.className = "balloon"; el.style.setProperty("--h", Math.floor(Math.random() * 360));
    el.innerHTML = `<span>${esc(term)}</span>`;
    el.style.left = Math.max(4, Math.random() * (sky.clientWidth - 150)) + "px";
    sky.appendChild(el);
    const b = { el, term, t0: now, popped: false };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); hit(b); });
    balloons.push(b);
  };
  setTarget();
  rafLoop(api, (now) => {
    const H = sky.clientHeight + 140;
    if (now - last > rise / 4.5) { last = now; spawn(now); }
    balloons = balloons.filter((b) => { if (b.popped) return false; const p = (now - b.t0) / rise; if (p >= 1) { b.el.remove(); return false; } b.el.style.transform = `translateY(${-p * H}px)`; return true; });
  });
}

/* ---------- Flugzeug ---------- */
function renderAirplane(api, a) {
  const qs = mc4(api, a, 4);
  api.setMax(qs.length);
  const cross = spd(api, [10000, 7500, 5000]);
  api.el.innerHTML = `<div class="ap-q s-card"></div><div class="ap-sky"><div class="ap-plane">✈️</div></div><div class="prog">Tippe auf eine Bahn oder nutze ↑ ↓, um ins richtige Wölkchen zu fliegen.</div>`;
  const sky = $(".ap-sky", api.el), plane = $(".ap-plane", api.el);
  let i = 0, lane = 0, lanes = 4, col = null, t0 = 0, busy = true;
  const setLane = (l) => { lane = Math.max(0, Math.min(lanes - 1, l)); plane.style.top = ((lane + 0.5) / lanes) * 100 + "%"; };
  const next = () => {
    if (api.ended) return;
    if (i >= qs.length) return api.finish();
    const q = qs[i]; lanes = q.answers.length;
    $(".ap-q", api.el).innerHTML = (q.img ? `<img class="q-img" style="max-height:80px" src="${esc(q.img)}" alt=""> ` : "") + esc(q.q);
    if (col) col.remove();
    col = document.createElement("div"); col.className = "ap-col";
    col.innerHTML = q.answers.map((x, k) => `<div class="ap-cloud" style="top:${(k / lanes) * 100}%;height:${100 / lanes}%"><span>${esc(x.text)}</span></div>`).join("");
    sky.appendChild(col); setLane(Math.min(lane, lanes - 1)); t0 = performance.now(); busy = false;
  };
  const judge = () => {
    const q = qs[i], ans = q.answers[lane];
    if (ans.correct) { col.children[lane].classList.add("ok"); api.right(); }
    else { col.children[lane].classList.add("bad"); col.children[q.answers.indexOf(q.answers.find((x) => x.correct))].classList.add("ok"); api.wrong({ prompt: q.q, given: ans.text, correct: q.right }); }
    i++; setTimeout(next, 1100);
  };
  rafLoop(api, (now) => {
    if (!col || busy) return;
    const W = sky.clientWidth, p = (now - t0) / cross, x = W - p * (W + 20);
    col.style.transform = `translateX(${x}px)`;
    if (x <= plane.offsetLeft + plane.offsetWidth * 0.6) { busy = true; judge(); }
  });
  sky.addEventListener("pointerdown", (e) => { const r = sky.getBoundingClientRect(); setLane(Math.floor(((e.clientY - r.top) / r.height) * lanes)); });
  keys(api, (e) => { if (e.key === "ArrowUp" || e.key === "w") { e.preventDefault(); setLane(lane - 1); } if (e.key === "ArrowDown" || e.key === "s") { e.preventDefault(); setLane(lane + 1); } });
  setLane(1); next();
}

/* ---------- Jagd durchs Labyrinth ---------- */
function renderMaze(api, a) {
  const qs = mc4(api, a, 4);
  api.setMax(qs.length);
  const W = 13, H = 9, start = [4, 6], corners = [[0, 0], [0, W - 1], [H - 1, 0], [H - 1, W - 1]], LET = "ABCD";
  const key = (r, c) => r * W + c;
  const free = (walls, r, c) => r >= 0 && r < H && c >= 0 && c < W && !walls.has(key(r, c));
  const reach = (walls, from) => { const seen = new Set([key(...from)]), q = [from]; while (q.length) { const [r, c] = q.shift(); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => { const nr = r + dr, nc = c + dc; if (free(walls, nr, nc) && !seen.has(key(nr, nc))) { seen.add(key(nr, nc)); q.push([nr, nc]); } }); } return seen; };
  let walls;
  for (let t = 0; t < 200; t++) {
    walls = new Set();
    for (let r = 1; r < H - 1; r++) for (let c = 1; c < W - 1; c++) if (r % 2 === 0 && c % 2 === 0 && Math.random() < 0.85) walls.add(key(r, c)); else if (Math.random() < 0.12) walls.add(key(r, c));
    walls.delete(key(...start)); [[0, 6], [8, 6]].forEach((p) => walls.delete(key(...p)));
    const s = reach(walls, start);
    if (corners.every((p) => s.has(key(...p))) && s.has(key(0, 6)) && s.has(key(8, 6))) break;
  }
  const tick = spd(api, [720, 500, 340]);
  api.el.innerHTML = `<div class="mz-q s-card"></div><div class="mz-legend"></div><div class="mz-board" style="grid-template-columns:repeat(${W},1fr)">${Array.from({ length: W * H }, (_, n) => `<div class="mz-c ${walls.has(n) ? "wall" : ""}"></div>`).join("")}</div>
    <div class="mz-pad"><button data-d="up" aria-label="Hoch">▲</button><button data-d="left" aria-label="Links">◀</button><button data-d="down" aria-label="Runter">▼</button><button data-d="right" aria-label="Rechts">▶</button></div>`;
  const board = $(".mz-board", api.el), cells = Array.from(board.children);
  let i = 0, p, en, tried = false, grace = 0, timer = null, lock = false;
  api.onEnd(() => clearInterval(timer));
  const draw = () => {
    cells.forEach((c) => { c.classList.remove("pl", "en"); c.textContent = ""; });
    const q = qs[i];
    corners.forEach(([r, c], k) => { const cl = cells[key(r, c)]; cl.className = "mz-c" + (k < q.answers.length ? " zone z" + k : ""); if (k < q.answers.length) cl.textContent = LET[k]; });
    cells[key(...p)].classList.add("pl"); cells[key(...p)].textContent = "😀";
    en.forEach((e) => { cells[key(...e)].classList.add("en"); cells[key(...e)].textContent = "👾"; });
  };
  const reset = () => { p = start.slice(); en = [[0, 6], [8, 6]]; grace = Date.now() + 1500; draw(); };
  const ask = () => {
    if (api.ended) return;
    if (i >= qs.length) return api.finish();
    const q = qs[i]; tried = false; lock = false;
    $(".mz-q", api.el).innerHTML = (q.img ? `<img class="q-img" style="max-height:70px" src="${esc(q.img)}" alt=""> ` : "") + esc(q.q);
    $(".mz-legend", api.el).innerHTML = q.answers.map((x, k) => `<span class="mz-l z${k}"><b>${LET[k]}</b> ${esc(x.text)}</span>`).join("");
    reset();
  };
  const caught = () => {
    if (!en.some((e) => e[0] === p[0] && e[1] === p[1])) return false;
    const q = qs[i];
    if (!tried) { tried = true; api.wrong({ prompt: q.q, given: "vom Monster erwischt", correct: q.right }); }
    if (!api.ended) { board.classList.add("shake"); setTimeout(() => board.classList.remove("shake"), 400); reset(); }
    return true;
  };
  const step = (dr, dc) => {
    if (lock || api.ended) return;
    const nr = p[0] + dr, nc = p[1] + dc;
    if (!free(walls, nr, nc)) return;
    p = [nr, nc]; draw();
    if (caught()) return;
    const z = corners.findIndex(([r, c]) => r === nr && c === nc);
    const q = qs[i];
    if (z !== -1 && z < q.answers.length) {
      lock = true;
      const ok = q.answers[z].correct;
      cells[key(nr, nc)].classList.add(ok ? "ok" : "bad");
      if (ok) { if (!tried) api.right(); else Sfx.ok(); }
      else if (!tried) { tried = true; api.wrong({ prompt: q.q, given: q.answers[z].text, correct: q.right }); }
      if (api.ended) return;
      if (ok || !api.opts.retry) { i++; setTimeout(ask, 900); } else setTimeout(() => { lock = false; reset(); }, 900);
    }
  };
  const enemyMove = () => {
    if (lock || api.ended || Date.now() < grace) return;
    en = en.map((e) => {
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dr, dc]) => [e[0] + dr, e[1] + dc]).filter(([r, c]) => free(walls, r, c) && !corners.some(([zr, zc]) => zr === r && zc === c));
      if (!opts.length) return e;
      if (Math.random() < 0.6) { opts.sort((x, y) => Math.abs(x[0] - p[0]) + Math.abs(x[1] - p[1]) - (Math.abs(y[0] - p[0]) + Math.abs(y[1] - p[1]))); return opts[0]; }
      return opts[Math.floor(Math.random() * opts.length)];
    });
    draw(); caught();
  };
  timer = setInterval(enemyMove, tick);
  const D = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  keys(api, (e) => { const m = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" }[e.key]; if (m) { e.preventDefault(); step(...D[m]); } });
  let hold = null;
  $(".mz-pad", api.el).addEventListener("pointerdown", (e) => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); step(...D[b.dataset.d]); clearInterval(hold); hold = setInterval(() => step(...D[b.dataset.d]), 190); });
  const stopHold = () => clearInterval(hold);
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => $(".mz-pad", api.el).addEventListener(ev, stopHold));
  api.onEnd(stopHold);
  let sw = null;
  board.addEventListener("pointerdown", (e) => { sw = [e.clientX, e.clientY]; });
  board.addEventListener("pointerup", (e) => { if (!sw) return; const dx = e.clientX - sw[0], dy = e.clientY - sw[1]; sw = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return; if (Math.abs(dx) > Math.abs(dy)) step(0, dx > 0 ? 1 : -1); else step(dy > 0 ? 1 : -1, 0); });
  ask();
}

/* ---------- Spielshow-Quiz ---------- */

  api.onEnd(() => clearInterval(iv));

    const q = qs[i], right = q.answers.find((x) => x.correct), bonus = i >= bonusFrom;
    let left = LIM, dbl = false, done = false;
    api.el.innerHTML = `<div class="prog">${bonus ? "⭐ Bonusfrage · " : ""}Frage ${i + 1} von ${qs.length}</div><div class="tf-bar gs-bar"><i></i></div>
      ${q.image ? `<img class="q-img" src="${esc(q.image)}" alt="">` : ""}<div class="q-text s-card">${esc(q.question)}</div>
      <div class="answers">${q.answers.map((x, k) => `<button class="ans" data-k="${k}"><span class="l">${"ABCDEF"[k]}</span><span>${esc(x.text)}</span></button>`).join("")}</div>
      <div class="row-flex gs-jokers"><button class="s-btn alt" data-j="half" ${jok.half && q.answers.length >= 3 ? "" : "disabled"}>✂️ 50:50</button><button class="s-btn alt" data-j="time" ${jok.time ? "" : "disabled"}>⏱ +10 s</button><button class="s-btn alt" data-j="dbl" ${jok.dbl ? "" : "disabled"}>✖️2 Doppelt</button></div>`;
    const bar = $(".gs-bar i", api.el);
    const end = (btn) => {
      if (done) return; done = true; clearInterval(iv);
      const x = btn ? q.answers[+btn.dataset.k] : null;
      $$(".ans", api.el).forEach((b) => { if (q.answers[+b.dataset.k].correct) b.classList.add("ok"); });
      if (x && x.correct) {
        const g = Math.round((100 + (100 * left) / LIM) * (dbl ? 2 : 1) * (bonus ? 2 : 1)); pts += g; api.right();
        const f = document.createElement("div"); f.className = "gs-pts"; f.textContent = "+" + g; api.el.appendChild(f);
      } else { if (btn) btn.classList.add("bad"); api.wrong({ prompt: q.question, given: x ? x.text : "Zeit abgelaufen", correct: right.text }); }
      i++; setTimeout(show, 1500);
    };
    iv = setInterval(() => { left -= 0.1; bar.style.width = Math.max(0, (left / LIM) * 100) + "%"; if (left <= 0) end(null); }, 100);
    $(".answers", api.el).onclick = (e) => { const b = e.target.closest(".ans"); if (b && !api.ended) end(b); };
    $(".gs-jokers", api.el).onclick = (e) => {
      const b = e.target.closest("[data-j]"); if (!b || b.disabled || done) return;
      const j = b.dataset.j; jok[j] = false; b.disabled = true; Sfx.flip();
      if (j === "half") shuffle($$(".ans", api.el).filter((x) => !q.answers[+x.dataset.k].correct)).slice(0, Math.max(1, q.answers.length - 2)).forEach((x) => { x.style.visibility = "hidden"; });
      if (j === "time") left = Math.min(LIM + 10, left + 10);
      if (j === "dbl") { dbl = true; b.textContent = "✖️2 aktiv"; }
    };
  };
  show();
}

/* ---------- Eingabe-Aufgaben (Geben Sie die Antwort ein, Mathe-Generator) ---------- */
function renderTyped(api, a, pad) {
  const items = api.rnd(Conv.typed(a));
  api.setMax(items.length);
  let i = 0;
  const show = () => {
    if (api.ended) return;
    if (i >= items.length) return api.finish();
    const it = items[i]; let tried = false, locked = false;
    api.el.innerHTML = `<div class="prog">Aufgabe ${i + 1} von ${items.length}</div>${it.image ? `<img class="q-img" src="${esc(it.image)}" alt="">` : ""}<div class="q-text s-card">${esc(it.prompt)}</div>
      <form class="ta-form" autocomplete="off"><input type="text" id="taIn" class="ta-in" placeholder="Deine Antwort" ${pad ? 'inputmode="none"' : ""} autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort"><button class="s-btn" type="submit">Prüfen</button></form>
      ${pad ? `<div class="ta-pad">${["7", "8", "9", "⌫", "4", "5", "6", "−", "1", "2", "3", "/", "0", ",", "±", "✓"].map((k) => `<button type="button" data-k="${k}">${k}</button>`).join("")}</div>` : ""}
      <div class="ta-sol"></div><div class="row-flex"><button class="s-btn alt" id="taSkip">Weiß nicht</button></div>`;
    const inp = $("#taIn", api.el);
    if (!pad || window.matchMedia("(pointer:fine)").matches) setTimeout(() => inp.focus(), 50);
    const reveal = () => { $(".ta-sol", api.el).innerHTML = `Richtig wäre: <b>${esc(it.answer)}</b>`; const bar = $(".row-flex", api.el); bar.innerHTML = ""; bar.appendChild(nextBtn("Weiter", () => { i++; show(); })); };
    const submit = () => {
      if (locked || api.ended) return;
      const v = inp.value;
      if (!v.trim()) { inp.focus(); return; }
      if (answerOk(v, it.answer)) { locked = true; inp.classList.add("ok"); if (!tried) api.right(); else Sfx.ok(); i++; setTimeout(show, 800); return; }
      inp.classList.add("bad", "shake"); setTimeout(() => inp.classList.remove("shake"), 400);
      if (!tried) { tried = true; api.wrong({ prompt: it.prompt, given: v, correct: it.answer }); }
      if (api.ended) return;
      if (!api.opts.retry) { locked = true; inp.readOnly = true; reveal(); }
      else setTimeout(() => { inp.classList.remove("bad"); inp.select(); }, 600);
    };
    $(".ta-form", api.el).onsubmit = (e) => { e.preventDefault(); submit(); };
    $("#taSkip", api.el).onclick = () => { if (locked) return; locked = true; if (!tried) { tried = true; api.wrong({ prompt: it.prompt, given: "–", correct: it.answer }); } if (!api.ended) { inp.readOnly = true; reveal(); } };
    const p = $(".ta-pad", api.el);
    if (p) p.onclick = (e) => {
      const b = e.target.closest("button"); if (!b || locked) return;
      const k = b.dataset.k; inp.classList.remove("bad");
      if (k === "⌫") inp.value = inp.value.slice(0, -1);
      else if (k === "✓") submit();
      else if (k === "±") inp.value = inp.value.startsWith("−") || inp.value.startsWith("-") ? inp.value.slice(1) : "−" + inp.value;
      else inp.value += k;
    };
  };
  show();
}
