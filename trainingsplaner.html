<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainingsplaner</title>
<style>
:root{--bg:#0b0c10;--ink:#f4f6fb;--soft:#aeb0b8;--line:rgba(255,255,255,.2);--ok:#7bd8a4;--bad:#ff8a80;--glass:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5;padding:76px 16px 120px;background:radial-gradient(1000px 600px at 12% -10%,#262932,transparent),radial-gradient(900px 600px at 100% 115%,#1c1e26,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 10px}
.lead{color:var(--soft);margin:0 0 20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.4)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));cursor:pointer;font-weight:700;touch-action:manipulation;text-decoration:none;color:var(--ink)}
.btn:hover{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.12))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:rgba(255,255,255,.05);font-weight:600}
.btn.small{min-height:40px;padding:0 16px;font-size:.92rem}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;touch-action:manipulation}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7));color:#111;border-color:#fff}
input,select,textarea{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);width:100%}
textarea{min-height:110px;resize:vertical}
select option{color:#111}
label{display:block;font-size:.88rem;color:var(--soft);margin:0 0 4px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--soft)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c4c6cd,#fff);transition:width .3s}
.q{font-size:1.2rem;margin:0 0 14px}
.svgbox{display:flex;justify-content:center;margin:0 0 14px}
.svgbox svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choices .btn{justify-content:flex-start;text-align:left;padding:10px 18px;min-height:56px}
.choices .btn.right{background:rgba(123,216,164,.28);border-color:var(--ok)}
.choices .btn.wrong{background:rgba(255,138,128,.25);border-color:var(--bad)}
.fb{min-height:1.5em;margin:12px 0 0;font-weight:700}
.explain{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);color:#e4e6ec;font-size:.95rem}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--soft);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.big{font-size:2.4rem;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #999;background:#fff}.soft{color:#444}}
@media print{input,textarea,select{border:0!important;background:none!important;color:#000!important;padding:0!important}.card .row+textarea{min-height:0}}</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="buildspace">
<meta property="og:title" content="Trainingsplaner – buildspace">
<meta property="og:description" content="Eine Trainingseinheit aus Übungen zusammenstellen, Zeiten summieren und ausdrucken.">
<meta property="og:url" content="https://buildspaceos.de/trainingsplaner.html">
<meta property="og:image" content="https://buildspaceos.de/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Trainingsplaner – buildspace">
<meta name="twitter:description" content="Eine Trainingseinheit aus Übungen zusammenstellen, Zeiten summieren und ausdrucken.">
<meta name="twitter:image" content="https://buildspaceos.de/assets/og-image.jpg">
</head>
<body>
<div class="wrap">
<h1>Trainingsplaner</h1>
<p class="lead">Eine Trainingseinheit aus Übungen zusammenstellen, Zeiten summieren und ausdrucken.</p>

<div class="card"><div class="grid">
<div><label for="tn">Titel der Einheit</label><input id="tn" value="Training Dienstag"></div>
<div><label for="td">Datum</label><input id="td" type="date"></div>
<div><label for="tt">Schwerpunkt</label><input id="tt" value="Tempogegenstoß"></div></div></div>
<div class="card"><h2>Ablauf</h2><div id="list"></div>
<div class="row noprint" style="margin-top:10px"><button class="btn small" id="add">Übung hinzufügen</button>
<select id="tpl" aria-label="Übung aus Vorlage" style="width:auto;min-width:200px"><option value="">Aus Vorlage …</option></select>
<button class="btn ghost small" onclick="window.print()">Drucken</button></div>
<p class="big" id="sum" aria-live="polite" style="font-size:1.4rem;margin-top:12px"></p></div>

</div>
<script>

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){if(d===undefined)d=2;var v=Math.round(n*Math.pow(10,d))/Math.pow(10,d);return String(v).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(/\s/g,'');if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){var p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}s=s.replace(/[^0-9.\-+eE]/g,'');var v=parseFloat(s);return isNaN(v)?NaN:v}
function mc(correct,wrongs){correct=String(correct);var set=[correct];wrongs.forEach(function(w){w=String(w);if(set.indexOf(w)<0)set.push(w)});var arr=shuffle(set.slice(0,4));return {choices:arr,correct:arr.indexOf(correct)}}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var TPL=[['Aufwärmen mit Ball (Laufen, Passen)',10,'Im Kreis laufen, Pässe in Bewegung, dann Dehnen.'],['Passen und Fangen in Dreiergruppen',8,'Mit Lauf nach dem Pass, links und rechts.'],['Wurfserie von Außen',10,'Anlauf, Sprungwurf, Torwart wechselt.'],['Tempogegenstoß 3 gegen 2',12,'Schnelles Umschalten nach Ballgewinn.'],['Abwehr 6:0 Verschieben',12,'Mit Stockschlag, Hände aktiv.'],['Spielform 7 gegen 7',15,'Mit besonderer Regel (z. B. Kreis zählt doppelt).'],['Ausklang und Dehnen',5,'Locker auslaufen, Besprechung.']];
var D=store.get('tp',null)||{n:'Training Dienstag',d:'',t:'Tempogegenstoß',l:[TPL[0].slice(),TPL[3].slice(),TPL[5].slice(),TPL[6].slice()]};
$('#tn').value=D.n;$('#td').value=D.d;$('#tt').value=D.t;
TPL.forEach(function(t,i){var o=document.createElement('option');o.value=i;o.textContent=t[0]+' ('+t[1]+' Min.)';$('#tpl').appendChild(o)});
function save(){D.n=$('#tn').value;D.d=$('#td').value;D.t=$('#tt').value;store.set('tp',D)}
function draw(){$('#list').innerHTML=D.l.map(function(x,i){return '<div class="card" style="margin-bottom:10px;padding:14px"><div class="row"><input aria-label="Übung" data-i="'+i+'" data-k="0" value="'+esc(x[0])+'" style="flex:1;min-width:180px"><input aria-label="Minuten" inputmode="decimal" data-i="'+i+'" data-k="1" value="'+x[1]+'" style="width:80px"><span class="soft">Min.</span></div><textarea aria-label="Beschreibung" data-i="'+i+'" data-k="2" style="min-height:60px;margin-top:8px" placeholder="Organisation, Coachingpunkte">'+esc(x[2])+'</textarea><div class="row noprint" style="margin-top:8px"><button class="btn ghost small" data-up="'+i+'" aria-label="Nach oben">▲</button><button class="btn ghost small" data-dn="'+i+'" aria-label="Nach unten">▼</button><button class="btn ghost small" data-del="'+i+'">Entfernen</button></div></div>'}).join('');sum()}
function sum(){var t=0,s='';D.l.forEach(function(x){s+='';t+=+x[1]||0});var cl=0,ends=[];D.l.forEach(function(x){cl+=+x[1]||0;ends.push(cl)});$('#sum').textContent='Gesamtdauer: '+fmt(t,1)+' Min. ('+Math.floor(t/60)+' h '+Math.round(t%60)+' min)';store.set('tp',D)}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.i!==undefined){var k=+t.dataset.k;D.l[+t.dataset.i][k]=k===1?(parseNum(t.value)||0):t.value;sum()}else if(['tn','td','tt'].indexOf(t.id)>=0)save()});
document.addEventListener('click',function(e){var a=e.target.dataset;if(!a)return;var i;
if(a.del!==undefined){D.l.splice(+a.del,1);draw()}else if(a.up!==undefined){i=+a.up;if(i>0){var t=D.l[i];D.l[i]=D.l[i-1];D.l[i-1]=t;draw()}}else if(a.dn!==undefined){i=+a.dn;if(i<D.l.length-1){var u=D.l[i];D.l[i]=D.l[i+1];D.l[i+1]=u;draw()}}});
$('#add').onclick=function(){D.l.push(['Neue Übung',10,'']);draw()};
$('#tpl').onchange=function(){if(this.value!==''){D.l.push(TPL[+this.value].slice());this.value='';draw()}};
draw();

</script>
<script defer data-category="handball" src="protect.js"></script>
</body>
</html>
