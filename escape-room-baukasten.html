<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape-Room-Baukasten</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4efe6; --bg2:#ebe4d6; --card:#fffdf8; --ink:#2a2433; --muted:#6b6478; --line:#d9d0c0;
  --accent:#7b4fd1; --accent-ink:#ffffff; --ok:#1f7a4a; --okbg:#e3f4ea; --bad:#b83232; --badbg:#fbe6e6;
  --warn:#9a6208; --warnbg:#fdf1d8; --shadow:0 2px 10px rgba(40,30,60,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15131c; --bg2:#1d1a27; --card:#211e2b; --ink:#efeaf7; --muted:#a79fb8; --line:#3a3548;
    --ok:#5fd08e; --okbg:#173325; --bad:#ff8b8b; --badbg:#3a1b1b; --warn:#f0b64d; --warnbg:#3a2d12; --shadow:0 2px 12px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#15131c; --bg2:#1d1a27; --card:#211e2b; --ink:#efeaf7; --muted:#a79fb8; --line:#3a3548;
  --ok:#5fd08e; --okbg:#173325; --bad:#ff8b8b; --badbg:#3a1b1b; --warn:#f0b64d; --warnbg:#3a2d12; --shadow:0 2px 12px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h1{font-size:1.8rem} h2{font-size:1.3rem;margin-top:1.2em} h3{font-size:1.1rem}
p{margin:.4em 0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;margin:2px 4px 2px 0}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:4px 10px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.hero{display:flex;gap:14px;align-items:center;padding:8px 0}
.logo{font-size:3rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap}
.room{display:flex;flex-direction:column;gap:6px;border-left:8px solid var(--rc,var(--accent));margin:0}
.room .em{font-size:2.2rem}
.room .row{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:8px}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.hud-title{font-weight:800;font-size:1.1rem;flex:1;min-width:140px}
.hud-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.slot{width:54px;height:66px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;background:var(--bg2)}
.slot small{font-size:.9rem;font-weight:400}
.slot.on{border-style:solid;border-color:var(--accent);background:var(--card)}
.objs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.obj{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;min-height:140px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:center;box-shadow:var(--shadow)}
.obj:hover{border-color:var(--accent)}
.obj .ico{font-size:2.5rem;line-height:1.1}
.obj .tt{font-weight:700;font-size:.95rem}
.obj .st{font-size:.8rem;color:var(--muted)}
.obj.done{border-color:var(--ok);background:var(--okbg)}
.obj.done .st{color:var(--ok);font-weight:700}
.door{display:flex;justify-content:center;margin:18px 0 8px}
.door .btn{font-size:1.15rem;min-height:56px;padding:10px 26px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(123,79,209,.5)}50%{box-shadow:0 0 0 12px rgba(123,79,209,0)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.pulse,.shake{animation:none}}
.backdrop{position:fixed;inset:0;background:rgba(10,8,18,.6);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow-y:auto;z-index:50}
.modal{background:var(--card);border-radius:18px;max-width:640px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4);outline:none;margin:auto}
.modal.wide{max-width:820px}
.mh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.mh .ico{font-size:2.2rem}
.story{background:var(--bg2);border-radius:12px;padding:10px 14px;margin:8px 0}
.fb{min-height:1.4em;margin:8px 0;font-weight:600}
.fb.bad{color:var(--bad)} .fb.warn{color:var(--warn)} .fb.ok{color:var(--ok)}
.hintsbox .hint{background:var(--warnbg);color:var(--ink);border-left:5px solid var(--warn);border-radius:8px;padding:6px 10px;margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%}
.opt.multi .mark{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--bg2)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);min-height:44px}
input:focus,textarea:focus,select:focus{outline:3px solid var(--accent);outline-offset:1px}
.ans{font-size:1.2rem;font-weight:700}
ol.ord{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.ordrow{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--card)}
.ordrow .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.ordrow .txt{flex:1}
.ordrow .mv{display:flex;gap:4px;flex:none}
.ordrow .mv .btn{margin:0;min-width:40px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:8px 0}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{min-height:48px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);text-align:left;position:relative}
.mbtn.selL{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.mbtn.paired{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.mbtn .pn{display:inline-flex;width:22px;height:22px;margin-right:6px;border-radius:50%;background:var(--c);color:#fff;font-size:.8rem;font-weight:800;align-items:center;justify-content:center}
.wheels{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel .btn{margin:0;min-width:48px}
.wheel .d{width:48px;height:56px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:800;border:2px solid var(--line);border-radius:10px;background:var(--bg2);font-variant-numeric:tabular-nums}
.cipher{font:700 1.5rem/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;word-break:break-all;background:var(--bg2);border-radius:12px;padding:8px 12px;margin:6px 0}
.cipher.out{color:var(--accent)}
.abc{overflow-x:auto;margin:6px 0}
.abc table{border-collapse:collapse;font:600 .85rem ui-monospace,Menlo,Consolas,monospace}
.abc td{border:1px solid var(--line);padding:2px 5px;text-align:center}
.abc tr:last-child td{background:var(--bg2);color:var(--accent);font-weight:800}
.reward{font-size:2.6rem;font-weight:900;text-align:center;color:var(--ok);background:var(--okbg);border-radius:14px;padding:6px;margin:8px 0}
.stars{font-size:2.4rem;letter-spacing:.1em}
.center{text-align:center}
.pickrow{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.lvbtn{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.lvbtn.sel{border-color:var(--accent);background:var(--bg2)}
.lvbtn .li{font-size:1.4rem}
details{margin:6px 0} summary{cursor:pointer;font-weight:700;min-height:32px}
.field{display:block;margin:10px 0}
.field .lbl{display:block;font-weight:700;margin-bottom:3px}
.field .hint{display:block;font-size:.82rem;color:var(--muted);margin-top:3px}
.cols{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
@media (max-width:780px){.cols{grid-template-columns:1fr}.match{gap:8px}}
.tli{display:flex;gap:4px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:4px;margin:6px 0;background:var(--card)}
.tli.sel{border-color:var(--accent);background:var(--bg2)}
.tli .pick{flex:1;text-align:left;background:none;border:0;padding:6px;min-height:40px;font-weight:600}
.tli .btn{margin:0}
.typebtns{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:var(--ink)}
.emo{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.emo button{border:0;background:none;font-size:1.4rem;min-width:40px;min-height:40px;border-radius:8px}
.emo button:hover{background:var(--bg2)}
.errbox{border-radius:12px;padding:8px 12px;margin:8px 0}
.errbox.e{background:var(--badbg);border-left:5px solid var(--bad)}
.errbox.w{background:var(--warnbg);border-left:5px solid var(--warn)}
.errbox.s{background:var(--okbg);border-left:5px solid var(--ok)}
.errbox ul{margin:4px 0;padding-left:20px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:8px 0;border-top:1px solid var(--line);margin-top:12px}
.sol{border-top:1px solid var(--line);padding:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips .btn{margin:0}
.chips .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
/* =====================================================================
   ESCAPE-ROOM-BAUKASTEN
   ---------------------------------------------------------------------
   Grundgerüst: Räume bestehen aus Aufgaben (Rätseln). Jede gelöste
   Aufgabe liefert einen Code-Teil (eine Ziffer). Alle Code-Teile
   zusammen öffnen die Tür.

   Eigenen Raum bauen:  Startseite -> "Neuen Raum bauen" (kein Code nötig)
   oder direkt unten im Array BUILTIN eintragen.

   Aufgabentypen: code | choice | multi | order | match | lock | caesar
   ===================================================================== */
(function(){
'use strict';

var TEACHER_PIN = 'lehrkraft';          // Passwort für "Lösungen" und "Als Vorlage kopieren"
var STORE_KEY   = 'ebk_custom_rooms_v1';

var LEVELS = [
  {id:1, name:'Einsteiger',      icon:'🟢', maxLv:2, hintBudget:Infinity, timer:false, hintCost:0,   wrongCost:0,
   desc:'Leichte & mittlere Rätsel · beliebig viele Hinweise · keine Zeitvorgabe · Tür-Code einfach der Reihe nach'},
  {id:2, name:'Fortgeschritten', icon:'🟡', maxLv:3, hintBudget:5,        timer:false, hintCost:0,   wrongCost:0,
   desc:'Alle Rätsel (auch die schweren) · 5 Hinweise · die Tür hat eine Code-Regel'},
  {id:3, name:'Profi',           icon:'🔴', maxLv:3, hintBudget:3,        timer:true,  hintCost:120, wrongCost:30,
   desc:'Alle Rätsel · Zeitlimit · nur 3 Hinweise (je −2 Min.) · jeder Fehlversuch −30 s'}
];
var LV_LABEL = {1:'leicht', 2:'mittel', 3:'schwer'};
var TYPES = {
  code:   {icon:'🔢', name:'Antwort eintippen'},
  choice: {icon:'☑️', name:'Auswahl (eine richtig)'},
  multi:  {icon:'✅', name:'Mehrfachauswahl'},
  order:  {icon:'↕️', name:'Reihenfolge'},
  match:  {icon:'🔗', name:'Zuordnen'},
  lock:   {icon:'🔐', name:'Zahlenschloss'},
  caesar: {icon:'🕵️', name:'Geheimschrift'}
};
var GENERIC_HINT = {
  code:'Lies die Aufgabe noch einmal. Unterstreiche, was gegeben ist und was gesucht wird. Schreibe dir eine Rechnung auf.',
  choice:'Streiche zuerst die Antworten durch, die sicher falsch sind. Prüfe dann die übrigen mit einem Beispiel.',
  multi:'Prüfe jede Möglichkeit einzeln: Passt sie – ja oder nein?',
  order:'Überlege: Was muss zuerst passieren? Was kommt ganz zum Schluss? Ordne von außen nach innen.',
  match:'Beginne mit den Paaren, die du sicher weißt. Was übrig bleibt, passt zusammen.',
  lock:'Löse jede Ziffer einzeln. Schreibe die Ziffern nebeneinander auf.',
  caesar:'Probiere am Regler verschiedene Verschiebungen aus, bis ein sinnvolles Wort entsteht.'
};
var RULES = {
  order:  'Gib die Code-Teile in der Reihenfolge der Gegenstände ein (von links nach rechts, von oben nach unten).',
  asc:    'Ordne die Code-Teile der Größe nach – die kleinste Ziffer kommt zuerst.',
  desc:   'Ordne die Code-Teile der Größe nach – die größte Ziffer kommt zuerst.',
  reverse:'Gib die Code-Teile rückwärts ein – vom letzten Gegenstand bis zum ersten.'
};
var RULE_NAMES = {order:'der Reihe nach', asc:'aufsteigend sortiert', desc:'absteigend sortiert', reverse:'rückwärts'};
var PALETTE = ['#7b4fd1','#0e8a7d','#c4571e','#2f6fd0','#2b8a3e','#c2255c'];
var MATCHPAL = ['#e03131','#1c7ed6','#2f9e44','#e67700','#9c36b5','#0c8599'];
var EMOJIS = ['📦','🔑','🧩','📜','🧪','🔬','💡','🎮','🏀','⚽','🎒','📚','🧮','📐','🛠️','🧾','🏷️','🕹️','🔍','📱','🍕','🚲'];
var STRATEGIES = ['✍️ Aufschreiben / Skizzieren','🧩 In Teilschritte zerlegen','🔁 Rückwärts denken','🧪 Ausprobieren & prüfen','🗣️ Im Team besprechen','💡 Hinweise nutzen'];

/* ===================== Eingebaute Räume ===================== */
var BUILTIN = [
{ id:'b-mall', builtin:true, title:'Black-Friday-Falle', emoji:'🛍️', color:'#c2255c', minutes:25, finalRule:'asc',
  topic:'Mathematik · Prozentrechnung · ab Jg. 7',
  intro:'Du hast dich nach Ladenschluss im Einkaufszentrum „CityMall“ versteckt – und jetzt ist die Ausgangstür verriegelt! Der Sicherheitsdienst hat den Türcode auf Preisschilder, Kassenbons und Rabattaktionen verteilt. Löse die Rätsel, sammle die Code-Teile und komm raus, bevor die Alarmanlage wieder anspringt.',
  tasks:[
  {id:'m1',type:'code',icon:'👟',title:'Das Sneaker-Regal',lv:1,reward:'4',
   story:'Die Sneaker kosten **80 €**. Auf dem roten Schild steht: **−25 %**.\nWie viel Euro sparst du?',
   answers:['20'],
   hints:['Gesucht ist der Prozentwert: 25 % von 80 €.','25 % sind ein Viertel. Teile 80 € durch 4.','80 € : 4 = ?'],
   explain:'25 % sind ein Viertel. 80 € : 4 = 20 €. Du sparst 20 €.'},
  {id:'m2',type:'choice',icon:'🧥',title:'Der Hoodie-Ständer',lv:1,reward:'7',
   story:'Ein Hoodie kostete **40 €** und kostet jetzt **30 €**.\nWie viel Prozent Rabatt sind das?',
   options:['10 %','20 %','25 %','30 %'],correct:2,
   hints:['Wie viel Euro wurden gespart? Vergleiche die Ersparnis mit dem alten Preis (100 % = 40 €).','Die Ersparnis beträgt 10 €. Teile 10 € durch 40 €.','10 : 40 = 0,25'],
   explain:'Ersparnis: 40 € − 30 € = 10 €. Anteil: 10 € : 40 € = 0,25 = 25 %.'},
  {id:'m3',type:'match',icon:'🏷️',title:'Die Preisschilder-Wand',lv:2,reward:'1',
   story:'Die Schilder sind durcheinandergeraten. Verbinde jede **Prozentzahl** mit dem passenden **Bruch** bzw. der passenden **Dezimalzahl**.',
   pairs:[['50 %','½'],['25 %','¼'],['10 %','0,1'],['75 %','¾'],['20 %','⅕']],
   hints:['Fange mit den einfachen an: 50 % ist die Hälfte.','25 % ist ein Viertel, 75 % sind drei Viertel.','10 % = 10 : 100 = 0,1 und 20 % = 20 : 100 = 1 : 5.'],
   explain:'50 % = ½ · 25 % = ¼ · 75 % = ¾ · 10 % = 0,1 · 20 % = ⅕.'},
  {id:'m4',type:'order',icon:'🧾',title:'Der Kassenbon',lv:2,reward:'9',
   story:'Auf dem Kassenbon steht die Rechnung für eine Jacke (60 €, −15 %). Die Zeilen sind verrutscht.\nBringe die Rechenschritte in die richtige Reihenfolge.',
   items:['Gegeben: Preis 60 €, Rabatt 15 %','Rabatt in Euro: 15 % von 60 € = 0,15 · 60 € = 9 €','Neuer Preis: 60 € − 9 €','Ergebnis: Die Jacke kostet 51 €'],
   hints:['Was ist am Anfang bekannt? Das steht ganz oben.','Erst muss der Rabatt in Euro ausgerechnet werden, dann wird er abgezogen.'],
   explain:'Erst steht fest, was gegeben ist, dann wird der Rabatt in Euro berechnet, vom Preis abgezogen und zum Schluss das Ergebnis notiert.'},
  {id:'m5',type:'code',icon:'📺',title:'Das Streaming-Terminal',lv:2,reward:'2',
   story:'Ein Streaming-Abo kostet **12 € pro Monat**. Bei Jahreszahlung gibt es **10 % Rabatt** auf den Jahrespreis.\nWie viel Euro zahlst du im Jahr? (Schreibe mit Komma, z. B. 12,5)',
   answers:['129,6'],
   hints:['Berechne erst den Preis für 12 Monate ohne Rabatt.','12 € · 12 = 144 €. Davon sind 10 % der Rabatt.','10 % von 144 € = 14,40 €. Was musst du jetzt tun?'],
   explain:'12 € · 12 = 144 € (Jahrespreis). 10 % von 144 € = 14,40 €. 144 € − 14,40 € = 129,60 €.'},
  {id:'m6',type:'code',icon:'🎮',title:'Das Spieleregal',lv:3,reward:'6',
   story:'Ein Spiel wurde um **20 %** teurer und kostet jetzt **60 €**.\nWie viel Euro hat es vorher gekostet?',
   answers:['50'],
   hints:['Gesucht ist der alte Preis (Grundwert = 100 %). Der neue Preis entspricht 120 %.','Rechne erst auf 1 % herunter: 60 € : 120.','1 % sind 0,50 €. Wie viel sind dann 100 %?'],
   explain:'120 % ≙ 60 €  →  1 % ≙ 0,50 €  →  100 % ≙ 50 €.'},
  {id:'m7',type:'choice',icon:'🛒',title:'Die Doppel-Rabatt-Aktion',lv:3,reward:'3',
   story:'Ein Schild verspricht: „Erst **−20 %**, an der Kasse nochmal **−10 %** auf den reduzierten Preis!“\nDeine Freundin sagt: „Das sind doch zusammen −30 %!“\nWas stimmt?',
   options:['Ja, 20 % + 10 % = 30 % Rabatt','Nein, es sind insgesamt nur 28 % Rabatt','Nein, es sind insgesamt 32 % Rabatt','Nein, es sind insgesamt 25 % Rabatt'],correct:1,
   hints:['Probiere es mit einem Beispielpreis, z. B. 100 €.','Nach −20 % bleiben 80 €. Nun −10 % von 80 €.','80 € − 8 € = 72 €. Vergleiche mit den ursprünglichen 100 €.'],
   explain:'Beispiel 100 €: −20 % → 80 €; −10 % von 80 € = 8 € → 72 €. Insgesamt wurden 28 € gespart = 28 %. Die zweite Prozentzahl bezieht sich auf einen kleineren Grundwert.'}
  ]},

/* ===================== Hilfsfunktionen ===================== */
function h(tag, props){
  var e = document.createElement(tag);
  if(props){ Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v==null || v===false) return;
    if(k==='class') e.className = v;
    else if(k==='style') e.style.cssText = v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2), v);
    else if(k in e && typeof v!=='object') e[k] = v;
    else e.setAttribute(k, v===true ? '' : v);
  });}
  for(var i=2;i<arguments.length;i++) add(e, arguments[i]);
  return e;
}
function add(parent, c){
  if(c==null || c===false) return;
  if(Array.isArray(c)){ c.forEach(function(x){ add(parent,x); }); return; }
  parent.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
function fmt(text){
  var frag = document.createDocumentFragment();
  String(text||'').split('\n').forEach(function(line,i){
    if(i) frag.appendChild(document.createElement('br'));
    line.split(/(\*\*[^*]+\*\*)/).forEach(function(p){
      if(/^\*\*[^*]+\*\*$/.test(p)) frag.appendChild(h('strong',null,p.slice(2,-2)));
      else if(p) frag.appendChild(document.createTextNode(p));
    });
  });
  return frag;
}
function shuffle(a){ var r=a.slice(); for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function shuffleNotIdentity(n){
  var idx=[]; for(var i=0;i<n;i++) idx.push(i);
  if(n<2) return idx;
  var r, tries=0;
  do{ r=shuffle(idx); tries++; } while(r.every(function(v,i){return v===i;}) && tries<60);
  return r;
}
function uid(){ return 't'+Math.random().toString(36).slice(2,9); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtTime(sec){ sec=Math.max(0,Math.floor(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* ===== Antworten prüfen ===== */
function normText(s){
  return String(s==null?'':s).toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[^a-z0-9]+/g,'');
}
function parseNum(s){
  var t = String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'');
  t = t.replace(/[a-zäöüß€$%²³°]+$/g,'');
  if(/^[-+]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,'').replace(',','.');
  else t = t.replace(',','.');
  if(!/^[-+]?\d+(\.\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
}
function checkCode(task, input){
  return (task.answers||[]).some(function(a){
    var n = parseNum(a);
    if(!isNaN(n)){ var m=parseNum(input); return !isNaN(m) && Math.abs(m-n)<1e-9; }
    return normText(a)!=='' && normText(a)===normText(input);
  });
}
function caesar(text, shift){
  var s=((shift%26)+26)%26;
  return String(text).replace(/[A-Za-z]/g,function(c){
    var base = c<='Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0)-base+s)%26+base);
  });
}

/* ===== Lösungen & Code ===== */
function solutionOf(t){
  switch(t.type){
    case 'code':   return (t.answers||[]).join('  oder  ');
    case 'choice': return t.options[t.correct];
    case 'multi':  return (t.correct||[]).map(function(i){return t.options[i];}).join(' · ');
    case 'order':  return t.items.join('  →  ');
    case 'match':  return t.pairs.map(function(p){return p[0]+' ↔ '+p[1];}).join(' · ');
    case 'lock':   return t.combo;
    case 'caesar': return t.plain;
  }
  return '';
}
function computeCode(tasks, rule){
  var d = tasks.map(function(t){return String(t.reward);});
  if(rule==='asc') d.sort();
  else if(rule==='desc'){ d.sort(); d.reverse(); }
  else if(rule==='reverse') d.reverse();
  return d.join('');
}

/* ===== Prüfen & Bereinigen von Räumen ===== */
function sanitizeTask(t){
  if(!t || !TYPES[t.type]) return null;
  var s=function(x){return typeof x==='string'?x:'';};
  var arr=function(a){return Array.isArray(a)?a.map(String):[];};
  var o={id:s(t.id)||uid(), type:t.type, title:s(t.title), icon:s(t.icon)||'📦', story:s(t.story),
    lv:[1,2,3].indexOf(+t.lv)>=0?+t.lv:1, reward:/^\d$/.test(String(t.reward))?String(t.reward):'0',
    hints:arr(t.hints).filter(Boolean), explain:s(t.explain)};
  switch(t.type){
    case 'code': o.answers=arr(t.answers).filter(Boolean); break;
    case 'choice': o.options=arr(t.options); o.correct=Math.max(0,parseInt(t.correct,10)||0); break;
    case 'multi': o.options=arr(t.options); o.correct=Array.isArray(t.correct)?t.correct.map(Number).filter(function(n){return isFinite(n);}):[]; break;
    case 'order': o.items=arr(t.items); break;
    case 'match': o.pairs=Array.isArray(t.pairs)?t.pairs.filter(function(p){return Array.isArray(p)&&p.length>=2;}).map(function(p){return [String(p[0]),String(p[1])];}):[]; break;
    case 'lock': o.combo=String(t.combo==null?'':t.combo).replace(/\D/g,''); break;
    case 'caesar': o.plain=s(t.plain).toUpperCase().replace(/[^A-Z ]/g,''); o.shift=Math.min(25,Math.max(1,parseInt(t.shift,10)||3)); break;
  }
  return o;
}
function sanitizeRoom(r){
  var s=function(x){return typeof x==='string'?x:'';};
  r = r||{};
  return {id:s(r.id)||uid(), title:s(r.title)||'Escape Room', topic:s(r.topic), emoji:s(r.emoji)||'🚪',
    color:PALETTE.indexOf(r.color)>=0?r.color:PALETTE[0], intro:s(r.intro),
    minutes:Math.min(90,Math.max(5,parseInt(r.minutes,10)||20)),
    finalRule:RULES[r.finalRule]?r.finalRule:'order',
    tasks:(Array.isArray(r.tasks)?r.tasks:[]).map(sanitizeTask).filter(Boolean).slice(0,10)};
}
function validateRoom(room){
  var errors=[], warns=[];
  if(!room.title.trim()) errors.push('Der Raum braucht einen Titel.');
  if(!room.intro.trim()) warns.push('Die Rahmengeschichte (Einleitung) ist leer.');
  if(room.tasks.length<3) errors.push('Ein Raum braucht mindestens 3 Aufgaben (aktuell '+room.tasks.length+').');
  if(room.tasks.length>10) errors.push('Mehr als 10 Aufgaben gehen nicht (pro Aufgabe gibt es eine Ziffer).');
  var easy = room.tasks.filter(function(t){return t.lv<=2;}).length;
  if(room.tasks.length>=3 && easy<3) warns.push('Für „Einsteiger“ gibt es nur '+easy+' Aufgabe(n) mit Stufe leicht/mittel (mindestens 3 empfohlen).');
  var seen={};
  room.tasks.forEach(function(t,i){
    var p='Aufgabe '+(i+1)+(t.title?' („'+t.title+'“)':'')+': ';
    if(!t.title.trim()) errors.push(p+'Titel fehlt.');
    if(!t.story.trim()) errors.push(p+'Aufgabentext fehlt.');
    if(!/^\d$/.test(String(t.reward))) errors.push(p+'Der Code-Teil muss eine Ziffer 0–9 sein.');
    if(seen[t.reward]) warns.push(p+'Die Ziffer '+t.reward+' kommt mehrfach vor (Sortier-Regeln sind dann weniger eindeutig).');
    seen[t.reward]=true;
    switch(t.type){
      case 'code': if(!t.answers.length) errors.push(p+'Keine richtige Antwort eingetragen.'); break;
      case 'choice':
        if(t.options.length<2) errors.push(p+'Mindestens 2 Antwortmöglichkeiten nötig.');
        else if(t.correct>=t.options.length || t._stars===0) errors.push(p+'Markiere die richtige Antwort mit * am Zeilenanfang.');
        else if(t._stars>1) errors.push(p+'Bei „Auswahl“ darf nur eine Antwort mit * markiert sein (für mehrere: Mehrfachauswahl).');
        break;
      case 'multi':
        if(t.options.length<3) errors.push(p+'Mindestens 3 Antwortmöglichkeiten nötig.');
        if(!t.correct.length || t.correct.some(function(i){return i>=t.options.length;})) errors.push(p+'Markiere die richtigen Antworten mit * am Zeilenanfang.');
        break;
      case 'order':
        if(t.items.length<3||t.items.length>7) errors.push(p+'Reihenfolge braucht 3 bis 7 Einträge.');
        if(new Set(t.items).size!==t.items.length) errors.push(p+'Die Einträge müssen sich unterscheiden.');
        break;
      case 'match':
        if(t.pairs.length<3||t.pairs.length>6) errors.push(p+'Zuordnen braucht 3 bis 6 Paare (Format: links | rechts).');
        if(new Set(t.pairs.map(function(x){return x[1];})).size!==t.pairs.length || new Set(t.pairs.map(function(x){return x[0];})).size!==t.pairs.length) errors.push(p+'Alle linken und alle rechten Einträge müssen verschieden sein.');
        break;
      case 'lock': if(t.combo.length<2||t.combo.length>6) errors.push(p+'Das Zahlenschloss braucht 2 bis 6 Ziffern.'); break;
      case 'caesar':
        if(t.plain.replace(/ /g,'').length<3) errors.push(p+'Das Lösungswort braucht mindestens 3 Buchstaben (A–Z, ohne Umlaute).');
        break;
    }
    if(!t.hints.length) warns.push(p+'Keine Hinweise eingetragen (es wird ein allgemeiner Hinweis angezeigt).');
    if(!t.explain.trim()) warns.push(p+'Der Lösungsweg fehlt (wird am Ende zur Besprechung angezeigt).');
  });
  return {errors:errors, warns:warns};
}

/* ===================== Aufgaben-Widgets ===================== */
function makeWheels(n){
  var vals=[], digs=[];
  var node = h('div',{class:'wheels'});
  function bump(i,dx){ vals[i]=(vals[i]+dx+10)%10; digs[i].textContent=String(vals[i]); }
  for(var i=0;i<n;i++){ (function(i){
    vals[i]=0; digs[i]=h('div',{class:'d','aria-live':'polite'},'0');
    node.appendChild(h('div',{class:'wheel'},
      h('button',{type:'button',class:'btn small up','aria-label':'Ziffer '+(i+1)+' erhöhen',onclick:function(){bump(i,1);}},'▲'),
      digs[i],
      h('button',{type:'button',class:'btn small down','aria-label':'Ziffer '+(i+1)+' verringern',onclick:function(){bump(i,-1);}},'▼')));
  })(i); }
  return {node:node, value:function(){return vals.join('');}};
}

function wCode(t){
  var numeric = (t.answers||[]).every(function(a){return !isNaN(parseNum(a));});
  var w = {};
  var inp = h('input',{type:'text',class:'ans',placeholder:'Deine Antwort',autocomplete:'off',autocapitalize:'off',inputmode:numeric?'decimal':'text',
    onkeydown:function(e){ if(e.key==='Enter' && w.onSubmit) w.onSubmit(); }});
  w.node = h('div',null,inp);
  w.check = function(){ return checkCode(t, inp.value); };
  w.empty = function(){ return inp.value.trim()===''; };
  return w;
}

function wChoice(t, multi){
  var w={}, sel=new Set(), btns=[];
  var order = shuffle(t.options.map(function(_,i){return i;}));
  var list = h('div',{class:'opts',role:multi?'group':'radiogroup'});
  function paint(){ btns.forEach(function(o){ var on=sel.has(o.i); o.b.classList.toggle('sel',on); o.b.setAttribute('aria-pressed',on?'true':'false'); }); }
  order.forEach(function(i){
    var b = h('button',{type:'button',class:'opt'+(multi?' multi':''),'aria-pressed':'false',onclick:function(){
      if(multi){ if(sel.has(i)) sel.delete(i); else sel.add(i); } else { sel.clear(); sel.add(i); }
      paint();
    }}, h('span',{class:'mark'}), h('span',null,t.options[i]));
    btns.push({i:i,b:b}); list.appendChild(b);
  });
  w.node = h('div',null, multi?h('div',{class:'small muted'},'Mehrere Antworten können richtig sein.'):null, list);
  w.check = function(){
    if(multi){ var c=t.correct||[]; return sel.size===c.length && c.every(function(i){return sel.has(i);}); }
    return sel.size===1 && sel.has(t.correct);
  };
  w.empty = function(){ return sel.size===0; };
  return w;
}

function wOrder(t){
  var w={}, n=t.items.length, idx=shuffleNotIdentity(n);
  var list = h('ol',{class:'ord'});
  function move(pos,d){ var q=pos+d; if(q<0||q>=n) return; var tmp=idx[pos]; idx[pos]=idx[q]; idx[q]=tmp; paint(); }
  function paint(){
    list.replaceChildren();
    idx.forEach(function(v,pos){
      list.appendChild(h('li',{class:'ordrow'},
        h('span',{class:'num'},pos+1), h('span',{class:'txt'},t.items[v]),
        h('span',{class:'mv'},
          h('button',{type:'button',class:'btn small up','aria-label':'nach oben',disabled:pos===0,onclick:function(){move(pos,-1);}},'▲'),
          h('button',{type:'button',class:'btn small down','aria-label':'nach unten',disabled:pos===n-1,onclick:function(){move(pos,1);}},'▼'))));
    });
  }
  paint();
  w.node = h('div',null,h('div',{class:'small muted'},'Verschiebe die Einträge mit ▲ und ▼.'),list);
  w.check = function(){ return idx.every(function(v,i){return t.items[v]===t.items[i];}); };
  w.empty = function(){ return false; };
  return w;
}

function wMatch(t){
  var w={}, n=t.pairs.length, assign={}, selL=null;
  var rightOrder = shuffleNotIdentity(n);
  var left=h('div',{class:'mcol'}), right=h('div',{class:'mcol'});
  var info=h('div',{class:'small muted'},'Tippe links einen Eintrag an, dann rechts den passenden.');
  function leftOf(j){ for(var i=0;i<n;i++) if(assign[i]===j) return i; return -1; }
  function paint(){
    left.replaceChildren(); right.replaceChildren();
    for(var i=0;i<n;i++){ (function(i){
      var a=assign[i];
      var b=h('button',{type:'button',class:'mbtn mleft'+(selL===i?' selL':'')+(a!==undefined?' paired':''),style:a!==undefined?'--c:'+MATCHPAL[i%MATCHPAL.length]:null,onclick:function(){
        if(assign[i]!==undefined){ delete assign[i]; selL=null; }
        else selL = (selL===i ? null : i);
        paint();
      }}, a!==undefined?h('span',{class:'pn'},i+1):null, t.pairs[i][0]);
      left.appendChild(b);
    })(i); }
    rightOrder.forEach(function(j){
      var li=leftOf(j);
      var b=h('button',{type:'button',class:'mbtn mright'+(li>=0?' paired':''),style:li>=0?'--c:'+MATCHPAL[li%MATCHPAL.length]:null,onclick:function(){
        var cur=leftOf(j);
        if(cur>=0){ delete assign[cur]; }
        else if(selL!==null){ assign[selL]=j; selL=null; }
        paint();
      }}, li>=0?h('span',{class:'pn'},li+1):null, t.pairs[j][1]);
      right.appendChild(b);
    });
  }
  paint();
  w.node = h('div',null,info,h('div',{class:'match'},left,right));
  w.check = function(){ for(var i=0;i<n;i++) if(assign[i]!==i) return false; return true; };
  w.empty = function(){ return Object.keys(assign).length===0; };
  return w;
}

function wLock(t){
  var w={}, wh=makeWheels(t.combo.length);
  w.node = h('div',null,h('div',{class:'small muted center'},'Stelle die Ziffern mit ▲ und ▼ ein.'),wh.node);
  w.check = function(){ return wh.value()===t.combo; };
  w.empty = function(){ return false; };
  return w;
}

function wCaesar(t){
  var w={}, plain=t.plain.toUpperCase();
  var ct = caesar(plain, t.shift);
  var out = h('div',{class:'cipher out'});
  var lab = h('div',{class:'small'});
  var slider = h('input',{type:'range',min:0,max:25,value:0,'aria-label':'Verschiebung zurück'});
  var abc = h('div',{class:'abc'});
  var inp = h('input',{type:'text',class:'ans',placeholder:'Gesuchtes Wort',autocomplete:'off',autocapitalize:'characters',
    onkeydown:function(e){ if(e.key==='Enter' && w.onSubmit) w.onSubmit(); }});
  function paint(){
    var k=parseInt(slider.value,10)||0;
    out.textContent = caesar(ct, 26-k);
    lab.textContent = 'Schlüsselscheibe: Jeder Buchstabe wird um '+k+' Stelle'+(k===1?'':'n')+' zurückgeschoben.';
    var A='ABCDEFGHIJKLMNOPQRSTUVWXYZ', r1=h('tr'), r2=h('tr');
    for(var i=0;i<26;i++){ r1.appendChild(h('td',null,A[i])); r2.appendChild(h('td',null,caesar(A[i],26-k))); }
    abc.replaceChildren(h('table',null,r1,r2));
  }
  slider.addEventListener('input',paint);
  paint();
  w.node = h('div',null,
    h('div',{class:'small muted'},'Geheimtext:'), h('div',{class:'cipher'},ct),
    lab, slider, h('div',{class:'small muted'},'Entschlüsselt (Vorschau):'), out, abc, inp);
  w.check = function(){ return normText(inp.value)===normText(plain); };
  w.empty = function(){ return inp.value.trim()===''; };
  return w;
}

function makeWidget(t){
  switch(t.type){
    case 'code': return wCode(t);
    case 'choice': return wChoice(t,false);
    case 'multi': return wChoice(t,true);
    case 'order': return wOrder(t);
    case 'match': return wMatch(t);
    case 'lock': return wLock(t);
    case 'caesar': return wCaesar(t);
  }
}

/* ===================== Spiel ===================== */
var timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){ stopTimer(); timerId=setInterval(tick,500); }
function elapsed(){ return Math.floor((Date.now()-S.start)/1000); }
function remaining(){ return S.room.minutes*60 - elapsed() - S.penalty; }
function timeText(){ return S.level.timer ? '⏳ '+fmtTime(remaining()) : '⏱️ '+fmtTime(elapsed()); }
function hintsText(){ return S.level.hintBudget===Infinity ? '💡 Hinweise: frei' : '💡 '+Math.max(0,S.level.hintBudget-S.hintsUsed)+' übrig'; }
function updateHud(){
  var a=document.getElementById('hud-time'); if(a) a.textContent=timeText();
  var b=document.getElementById('hud-hints'); if(b) b.textContent=hintsText();
}
function tick(){
  if(S.screen!=='play') return;
  updateHud();
  if(S.level.timer && remaining()<=0) lose();
}

function startGame(room, levelId, team, fromEditor){
  var L = LEVELS.filter(function(l){return l.id===levelId;})[0];
  var tasks = room.tasks.filter(function(t){return t.lv<=L.maxLv;});
  var st = {room:room, level:L, team:team||'', tasks:tasks, solved:{}, hints:{}, widgets:{}, hintsUsed:0, wrong:0, penalty:0,
    start:Date.now(), notes:'', rule:(L.id===1?'order':room.finalRule), reflect:{}, fromEditor:!!fromEditor, open:null};
  setScreen('play', st);
  startTimer();
}
function solvedCount(){ return S.tasks.filter(function(t){return S.solved[t.id];}).length; }
function allSolved(){ return solvedCount()===S.tasks.length; }

function leaveGame(){
  confirmBox('Escape Room wirklich verlassen? Der Spielstand geht verloren.','Ja, verlassen',function(){ backToStart(); });
}
function backToStart(){
  if(S.fromEditor && E) setScreen('editor'); else setScreen('home');
}

function renderPlay(){
  var strip = h('div',{class:'strip','aria-label':'Code-Teile'});
  S.tasks.forEach(function(t){
    var on = !!S.solved[t.id];

  });

  });
  var left = S.tasks.length-solvedCount();

    ? h('button',{type:'button',class:'btn primary pulse',id:'door-btn',onclick:openDoor},'🚪 Zur Ausgangstür')
    : h('button',{type:'button',class:'btn',id:'door-btn',disabled:true},'🔒 Tür verschlossen – noch '+left+' Code-Teil'+(left===1?'':'e')+' fehlen');
  app.replaceChildren(h('div',{class:'wrap'},

function openNotes(){

function hintList(t){ return (t.hints&&t.hints.length) ? t.hints : [GENERIC_HINT[t.type]]; }

function openTask(task){
  S.open = task.id;
  var done = !!S.solved[task.id];
  var w = S.widgets[task.id] || (S.widgets[task.id] = makeWidget(task));
  var fb = h('div',{class:'fb',role:'status','aria-live':'polite'});
  var hintsBox = h('div',{class:'hintsbox'});
  var hintBtn = h('button',{type:'button',class:'btn',onclick:reveal});
  var box;
  function setFb(msg,cls){ fb.textContent=msg||''; fb.className='fb'+(cls?' '+cls:''); }
  function paintHints(){
    var list = hintList(task), used = S.hints[task.id]||0;
    hintsBox.replaceChildren();
    for(var i=0;i<used;i++) hintsBox.appendChild(h('div',{class:'hint'},'💡 Hinweis '+(i+1)+': '+list[i]));
    var budgetLeft = S.level.hintBudget===Infinity ? Infinity : S.level.hintBudget-S.hintsUsed;
    var label = '💡 Hinweis'+(budgetLeft===Infinity?'':' ('+Math.max(0,budgetLeft)+' übrig)')+(S.level.hintCost?' · −'+(S.level.hintCost/60)+' Min.':'');
    hintBtn.textContent = label;
    hintBtn.disabled = used>=list.length || budgetLeft<=0;
  }
  function reveal(){
    var list=hintList(task), used=S.hints[task.id]||0;
    var budgetLeft = S.level.hintBudget===Infinity ? Infinity : S.level.hintBudget-S.hintsUsed;
    if(used>=list.length){ setFb('Für diese Aufgabe gibt es keine weiteren Hinweise.','warn'); return; }
    if(budgetLeft<=0){ setFb('Ihr habt keine Hinweise mehr übrig.','warn'); return; }
    S.hints[task.id]=used+1; S.hintsUsed++;
    if(S.level.hintCost) S.penalty += S.level.hintCost;
    updateHud(); paintHints(); setFb('');
  }
  function submit(){
    if(w.empty && w.empty()){ setFb('Gib zuerst eine Antwort ein.','warn'); return; }
    if(w.check()){
      S.solved[task.id]=true;
      renderPlay();
      openTask(task);
    } else {
      S.wrong++;
      var msg='Das stimmt noch nicht. Prüft euren Lösungsweg und versucht es nochmal.';
      if(S.level.wrongCost){ S.penalty+=S.level.wrongCost; msg+=' (−'+S.level.wrongCost+' s)'; }
      updateHud(); setFb(msg,'bad');
      if(box){ box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    }
  }
  w.onSubmit = submit;

  var head = h('div',{class:'mh'},h('span',{class:'ico'},task.icon),
    h('div',null,h('h3',{style:'margin:0'},task.title),h('div',{class:'small muted'},'★'.repeat(task.lv)+' '+LV_LABEL[task.lv]+' · '+TYPES[task.type].name)));
  var content;
  if(done){
    content = h('div',null,head,h('div',{class:'story'},fmt(task.story)),
      h('div',{class:'reward','aria-label':'Code-Teil'},'🔓 Code-Teil: '+task.reward),
      h('div',{class:'story'},h('strong',null,'Lösung: '),solutionOf(task),task.explain?h('div',{style:'margin-top:4px'},fmt(task.explain)):null),
      allSolved()?h('p',{class:'fb ok'},'🎉 Alle Code-Teile gefunden! Geht zur Ausgangstür.'):null,
      h('div',{class:'actions'},h('button',{type:'button',class:'btn primary',onclick:closeModal},'Weiter')));
  } else {
    content = h('div',null,head,h('div',{class:'story'},fmt(task.story)),w.node,fb,hintsBox,
      h('div',{class:'actions'},
        h('button',{type:'button',class:'btn primary',id:'check-btn',onclick:submit},'✔ Prüfen'),
        hintBtn,
        h('button',{type:'button',class:'btn',onclick:closeModal},'Schließen')));
    paintHints();
  }
  box = showModal(content,{label:task.title});
  S.open = task.id;
}

function openDoor(){
  var wh = makeWheels(S.tasks.length);
  var fb = h('div',{class:'fb',role:'status','aria-live':'polite'});
  var box;
  function tryOpen(){
    if(wh.value()===computeCode(S.tasks,S.rule)){ win(); return; }
    S.wrong++;
    var msg='Die Tür bleibt zu. Prüft die Tür-Regel: '+RULE_NAMES[S.rule]+'.';
    if(S.level.wrongCost){ S.penalty+=S.level.wrongCost; msg+=' (−'+S.level.wrongCost+' s)'; }
    updateHud(); fb.textContent=msg; fb.className='fb bad';
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }
  var strip = h('div',{class:'strip',style:'justify-content:center'});

/* ===================== Baukasten (Editor) ===================== */
function newTask(type){
  var used = {}; (E?E.room.tasks:[]).forEach(function(t){used[t.reward]=true;});
  var reward='0'; for(var d=0;d<10;d++){ if(!used[String(d)]){ reward=String(d); break; } }
  var t = {id:uid(), type:type, title:'', icon:'📦', story:'', lv:1, reward:reward, hints:[], explain:''};
  if(type==='code') t.answers=[];
  if(type==='choice'){ t.options=['Antwort A','Antwort B','Antwort C']; t.correct=0; t._stars=1; }
  if(type==='multi'){ t.options=['Antwort A','Antwort B','Antwort C','Antwort D']; t.correct=[0]; }
  if(type==='order') t.items=['Erster Schritt','Zweiter Schritt','Dritter Schritt'];
  if(type==='match') t.pairs=[['Links 1','Rechts 1'],['Links 2','Rechts 2'],['Links 3','Rechts 3']];
  if(type==='lock') t.combo='123';
  if(type==='caesar'){ t.plain='WORT'; t.shift=3; }
  return t;
}
function openEditor(room, isTemplate){
  var r = room ? sanitizeRoom(clone(room)) : {id:uid(), title:'Mein Escape Room', topic:'', emoji:'🚪', color:PALETTE[0], intro:'', minutes:20, finalRule:'order', tasks:[]};
  if(isTemplate) r.id = uid();
  E = {room:r, sel:0, msg:null};
  if(!r.tasks.length){ r.tasks.push(newTask('code')); }
  setScreen('editor');
}
function cleanRoom(r){
  var c = clone(r);
  c.tasks.forEach(function(t){ Object.keys(t).forEach(function(k){ if(k.charAt(0)==='_') delete t[k]; }); });
  delete c.builtin;
  return c;
}
function field(label, input, hint){
  return h('label',{class:'field'},h('span',{class:'lbl'},label),input,hint?h('span',{class:'hint'},hint):null);
}
function optionsRaw(t){
  return t.options.map(function(o,i){
    var ok = t.type==='choice' ? i===t.correct : (t.correct||[]).indexOf(i)>=0;
    return (ok?'* ':'')+o;
  }).join('\n');
}
function parseOptions(t, raw){
  var opts=[], ok=[];
  raw.split('\n').map(function(s){return s.trim();}).filter(Boolean).forEach(function(l){
    var m=l.match(/^\*\s*(.*)$/);
    if(m){ ok.push(opts.length); opts.push(m[1]); } else opts.push(l);
  });
  t.options=opts; t._stars=ok.length;
  if(t.type==='choice') t.correct = ok.length ? ok[0] : 0; else t.correct = ok;
}
function typeFields(t){
  var f=[];
  if(t.type==='code'){
    f.push(field('Richtige Antwort(en)',h('input',{type:'text',value:(t.answers||[]).join('; '),oninput:function(e){t.answers=e.target.value.split(';').map(function(s){return s.trim();}).filter(Boolean);}}),'Mehrere erlaubte Schreibweisen mit Semikolon trennen. Zahlen werden tolerant geprüft (Komma/Punkt, „€“, „cm“ …).'));
  } else if(t.type==='choice' || t.type==='multi'){
    f.push(field('Antwortmöglichkeiten',h('textarea',{rows:5,value:optionsRaw(t),oninput:function(e){parseOptions(t,e.target.value);}}),'Eine Antwort pro Zeile. Richtige Antwort mit * am Zeilenanfang markieren'+(t.type==='choice'?' (genau eine).':' (mindestens eine).')));
  } else if(t.type==='order'){
    f.push(field('Einträge in der RICHTIGEN Reihenfolge',h('textarea',{rows:5,value:t.items.join('\n'),oninput:function(e){t.items=e.target.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);}}),'Eine Zeile pro Eintrag (3 bis 7). Beim Spielen werden sie automatisch gemischt.'));
  } else if(t.type==='match'){
    f.push(field('Paare (links | rechts)',h('textarea',{rows:5,value:t.pairs.map(function(p){return p[0]+' | '+p[1];}).join('\n'),oninput:function(e){
      t.pairs=e.target.value.split('\n').map(function(l){var i=l.indexOf('|'); return i<0?null:[l.slice(0,i).trim(),l.slice(i+1).trim()];}).filter(function(p){return p&&p[0]&&p[1];});
    }}),'Eine Zeile pro Paar, getrennt mit | (senkrechter Strich). 3 bis 6 Paare.'));
  } else if(t.type==='lock'){
    f.push(field('Zahlencode',h('input',{type:'text',inputmode:'numeric',value:t.combo,oninput:function(e){t.combo=e.target.value.replace(/\D/g,'').slice(0,6); e.target.value=t.combo;}}),'2 bis 6 Ziffern. Schreibe im Aufgabentext Hinweise, wie man jede Ziffer findet.'));
  } else if(t.type==='caesar'){
    var prev = h('div',{class:'cipher'},caesar(t.plain,t.shift));
    var plainIn = h('input',{type:'text',value:t.plain,oninput:function(e){t.plain=e.target.value.toUpperCase().replace(/[^A-Z ]/g,''); prev.textContent=caesar(t.plain,t.shift);}});
    var shiftSel = h('select',{onchange:function(e){t.shift=parseInt(e.target.value,10); prev.textContent=caesar(t.plain,t.shift);}});
    for(var s=1;s<=25;s++) shiftSel.appendChild(h('option',{value:String(s),selected:s===t.shift},String(s)));
    f.push(field('Lösungswort (A–Z, ohne Umlaute)',plainIn));
    f.push(field('Verschiebung (so viele Stellen wird verschlüsselt)',shiftSel,'Erwähne im Aufgabentext, um wie viele Stellen verschoben wurde – oder lass die Klasse es herausfinden.'));
    f.push(h('div',{class:'small muted'},'Geheimtext, den die Spielenden sehen:'),prev);
  }
  return f;
}

    msgBox.replaceChildren();
    if(v&&v.errors&&v.errors.length) msgBox.appendChild(h('div',{class:'errbox e',role:'alert'},h('strong',null,'Bitte korrigieren:'),h('ul',null,v.errors.map(function(e){return h('li',null,e);}))));
    if(v&&v.warns&&v.warns.length) msgBox.appendChild(h('div',{class:'errbox w'},h('strong',null,'Tipps:'),h('ul',null,v.warns.map(function(e){return h('li',null,e);}))));
    if(okText) msgBox.appendChild(h('div',{class:'errbox s',role:'status'},okText));
  }
  function check(){ var v=validateRoom(r); showMsg(v); return v; }

  var bar = h('div',{class:'sticky'},
    h('button',{type:'button',class:'btn primary',id:'ed-test',onclick:function(){
      var v=check(); if(v.errors.length) return;
      openStart(sanitizeRoom(cleanRoom(r)),true);
    }},'▶ Testspielen'),
    h('button',{type:'button',class:'btn',id:'ed-save',onclick:function(){
      var v=check(); if(v.errors.length) return;
      var c=sanitizeRoom(cleanRoom(r)); var i=customRooms.map(function(x){return x.id;}).indexOf(c.id);
      if(i>=0) customRooms[i]=c; else customRooms.push(c);
      saveCustom(); showMsg(v,'✔ Gespeichert. Du findest den Raum jetzt auf der Startseite.');
    }},'💾 Speichern'),
    h('button',{type:'button',class:'btn',id:'ed-export',onclick:function(){
      var v=check(); if(v.errors.length) return;
      openExport(sanitizeRoom(cleanRoom(r)));
    }},'📤 Exportieren'),
    h('button',{type:'button',class:'btn',id:'ed-back',onclick:function(){ setScreen('home'); }},'← Zur Startseite'));

  app.replaceChildren(h('div',{class:'wrap'},
    h('div',{class:'hud'},h('h1',{style:'margin:0'},'🛠️ Baukasten')),
    h('p',{class:'muted'},'Raum festlegen, Aufgaben hinzufügen, Code-Teile vergeben – fertig. Speichern legt den Raum auf der Startseite ab (in diesem Browser). Mit „Exportieren“ kannst du ihn weitergeben.'),
    meta,
    h('div',{class:'cols'},
      h('div',{class:'card'},h('h3',null,'Aufgaben ('+r.tasks.length+' / 10)'),list,h('div',{class:'small muted'},'Neue Aufgabe:'),typeBtns),
      form),
    msgBox, bar));
}

function openExport(room){
  var json = JSON.stringify(room,null,1);
  var ta = h('textarea',{rows:12,readOnly:true,'aria-label':'Raum als JSON',style:'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem'});
  ta.value = json;
  var fb = h('div',{class:'fb ok',role:'status'});
  showModal(h('div',null,h('h3',null,'📤 Raum exportieren'),
    h('p',{class:'muted'},'Kopiere den Text und schicke ihn weiter (E-Mail, Messenger, Notiz). Andere fügen ihn über „Raum importieren“ ein.'),ta,fb,
    h('div',{class:'actions'},
      h('button',{type:'button',class:'btn primary',onclick:function(){
        ta.focus(); ta.select();
        var done=function(){ fb.textContent='✔ In die Zwischenablage kopiert.'; };
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(json).then(done,function(){ try{document.execCommand('copy');done();}catch(e){fb.textContent='Bitte den markierten Text manuell kopieren.';} }); }
        else { try{document.execCommand('copy');done();}catch(e){fb.textContent='Bitte den markierten Text manuell kopieren.';} }
      }},'📋 Kopieren'),
      h('button',{type:'button',class:'btn',onclick:closeModal},'Schließen'))),{wide:true,label:'Exportieren'});
}
function openImport(){
  var ta = h('textarea',{rows:10,id:'import-text',placeholder:'Exportierten Raum hier einfügen …',style:'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem'});
  var fb = h('div',{class:'fb bad',role:'status'});
  showModal(h('div',null,h('h3',null,'📥 Raum importieren'),ta,fb,
    h('div',{class:'actions'},
      h('button',{type:'button',class:'btn primary',id:'import-go',onclick:function(){
        try{
          var o=JSON.parse(ta.value);
          if(!o || !Array.isArray(o.tasks)) throw new Error('Kein gültiger Raum.');
          var r=sanitizeRoom(o); r.id=uid();
          if(!r.tasks.length) throw new Error('Der Raum enthält keine gültigen Aufgaben.');
          closeModal(); openEditor(r);
        }catch(e){ fb.textContent='Das konnte nicht gelesen werden: '+e.message; }
      }},'Importieren'),
      h('button',{type:'button',class:'btn',onclick:closeModal},'Abbrechen'))),{wide:true,label:'Importieren'});
}

/* Test-Hook (harmlos) */
window.__EBK = {BUILTIN:BUILTIN, validateRoom:validateRoom, computeCode:computeCode, solutionOf:solutionOf, sanitizeRoom:sanitizeRoom,
  state:function(){return S;}, editor:function(){return E;}, customRooms:function(){return customRooms;}, caesar:caesar, checkCode:checkCode, parseNum:parseNum};

render();
})();
</script>
