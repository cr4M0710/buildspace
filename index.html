<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyHome</title>
<meta name="description" content="Marc Strohs persönliche Sammlung aus Materialien, Tools und Notizen aus Schule, Handball und Freizeit.">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="site-nav">
    <div class="wrap">
      <a class="site-logo" href="#/">MyHome</a>
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
  </nav>

  <header class="hero">
    <span class="hero-kicker">Schule · Handball · Werkstatt</span>
    <h1>MyHome</h1>
    <p>Notizen, Tools und Projekte aus Schule, Halle und Werkstatt</p>
    <div class="hero-profile">
      <img src="assets/marc-avatar.png" alt="Marc Stroh" class="hero-avatar">
      <div class="hero-profile-text">
        <strong>Marc Stroh</strong>
        <span class="hero-school">
          <img src="assets/ggl-logo.png" alt="" class="hero-school-logo">
          Gesamtschule Gleiberger Land
        </span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="content"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>MyHome — gebaut mit HTML, CSS &amp; JavaScript, gehostet auf GitHub Pages.</p>
    </div>
  </footer>

  <script src="posts-data.js"></script>
  <script defer src="protect.js"></script>
  <script defer src="cursor.js"></script>
  <script src="app.js"></script>
</body>
</html>
