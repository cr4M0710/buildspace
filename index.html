<style>
  /* ---------- Animierter Hero-Hintergrund (reines CSS, kein Video) ----------
     Statt eines eingebetteten Videos (Autoplay-Probleme auf manchen Handys,
     aufwändiges Nachbauen der Größenanpassung an den echten Titel) laufen
     hier dieselben vier Aurora-Farbflecken wie im ruhenden Seitenhintergrund
     (body::before), nur etwas lebendiger animiert und dichter um die Mitte
     des Hero-Bereichs verteilt -- so bleibt es "clean und dynamisch", ganz
     ohne Datei-Ladezeit, Autoplay-Handling oder Skalierungs-Rechnerei. */
  .hero {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: min(560px, 88vh);
    max-height: 720px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-bg {
    position: absolute; inset: 0; z-index: 0;
    overflow: hidden;
    /* Weiche runde Kante statt sichtbarer rechteckiger Box -- darunter
       scheint der echte Seitenhintergrund weich durch. */
    -webkit-mask-image: radial-gradient(58% 62% at 50% 51%, #000 0%, #000 48%, transparent 88%);
    mask-image: radial-gradient(58% 62% at 50% 51%, #000 0%, #000 48%, transparent 88%);
  }
  .hero-bg::before {
    content: '';
    position: absolute;
    inset: -25%;
    background-image:
      radial-gradient(26% 28% at 26% 68%, color-mix(in srgb, var(--aurora-1) 70%, transparent), transparent 70%),
      radial-gradient(24% 26% at 74% 28%, color-mix(in srgb, var(--aurora-2) 65%, transparent), transparent 70%),
      radial-gradient(22% 24% at 40% 24%, color-mix(in srgb, var(--aurora-3) 60%, transparent), transparent 70%),
      radial-gradient(24% 26% at 64% 74%, color-mix(in srgb, var(--aurora-4) 60%, transparent), transparent 70%);
    filter: blur(46px) saturate(150%);
    opacity: var(--aurora-opacity);
    animation: heroAuroraDrift 16s ease-in-out infinite alternate;
  }
  @keyframes heroAuroraDrift {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
    50%  { transform: translate3d(3%, -3.5%, 0) rotate(7deg) scale(1.1); }
    100% { transform: translate3d(-3.5%, 3%, 0) rotate(-6deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-bg::before { animation: none; }
  }
  /* Zusätzlicher dezenter Kontrast unter dem Text, damit er über den
     Farbflecken lesbar bleibt. */
  .hero-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(46% 50% at 50% 51%, color-mix(in srgb, var(--bg) 42%, transparent) 0%, transparent 72%);
  }
  .hero-bg[hidden] { display: none; }
  .hero-inner { position: relative; text-align: center; z-index: 1; }
  @media (max-width: 560px) {
    .hero { min-height: min(560px, 94vh); }
  }
  @media (max-width: 340px) {
    .hero { min-height: min(610px, 96vh); }
  }
  @media print { .hero-bg { display: none !important; } }
</style>
