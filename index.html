<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>buildspace</title>
<meta name="description" content="Marc Strohs persönliche Sammlung aus Materialien, Tools und Notizen aus Schule, Handball und Freizeit.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B10" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta property="og:site_name" content="buildspace">
<meta property="og:title" content="buildspace — Marc Stroh">
<meta property="og:description" content="Materialien, Lernspiele und Tools von Marc Stroh — Mathematik, Arbeitslehre, Handball & Freizeit, gesammelt an einem Ort.">
<meta property="og:url" content="https://buildspaceos.de/">
<meta property="og:image" content="https://buildspaceos.de/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="buildspace — Marc Stroh">
<meta name="twitter:description" content="Materialien, Lernspiele und Tools von Marc Stroh — Mathematik, Arbeitslehre, Handball & Freizeit.">
<meta name="twitter:image" content="https://buildspaceos.de/assets/og-image.png">

<link rel="stylesheet" href="style.css">
<style>
  /* ---------- Showreel im Hero (nur auf der Startseite) ---------- */
  .hero-reel {
    max-width: var(--max-width);
    margin: 44px auto 0;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #F5F5F7;
    box-shadow: 0 20px 50px rgba(var(--glass-shadow), 0.14), 0 0 0 1px var(--divider);
  }
  .hero-reel video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hero-reel[hidden] { display: none; }
  @media (max-width: 560px) {
    .hero-reel { margin-top: 28px; border-radius: var(--radius-sm); }
  }
  @media print { .hero-reel { display: none !important; } }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="wrap">
      <a class="nav-brand" href="#/">
        <img src="assets/marc-avatar.png" alt="Marc Stroh" class="nav-avatar">
        <span class="nav-brand-text">
          <span class="nav-brand-title">buildspace</span>
          <span class="nav-brand-sub">Marc Stroh</span>
        </span>
      </a>
      <div class="nav-right">
        <div class="breadcrumb" id="breadcrumb"></div>
        <a href="#/kollegen" id="kollegen-nav-link" class="nav-icon-btn nav-emoji-btn" style="display:none;" title="Kolleg:innen-Bereich" aria-label="Kolleg:innen-Bereich">🤝</a>
        <a href="#/kursmappe-erstellen" id="kursmappe-nav-link" class="nav-icon-btn nav-emoji-btn" style="display:none;" title="Kursmappe erstellen" aria-label="Kursmappe erstellen">🧩</a>
        <button type="button" id="theme-toggle" class="nav-icon-btn" aria-label="Dunkelmodus aktivieren" title="Dunkelmodus aktivieren"></button>
        <button type="button" id="lang-toggle" class="nav-icon-btn nav-lang-btn" aria-label="Switch to English" title="Switch to English">
          <span id="lang-toggle-label">EN</span>
        </button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <p class="hero-eyebrow" id="hero-greeting">Willkommen</p>
    <h1>buildspace</h1>
    <p class="hero-sub" id="hero-sub">Materialien, Lernspiele und Tools von Marc Stroh — Mathematik, Arbeitslehre, Handball &amp; Freizeit, gesammelt an einem Ort.</p>
    <div class="hero-stats" id="hero-stats"></div>
    <div class="hero-reel" id="hero-reel">
      <video src="assets/buildspace-showreel.mp4" poster="assets/buildspace-showreel-poster.jpg"
             autoplay muted loop playsinline preload="metadata"
             aria-label="Showreel: verspielte Formen und Farben von buildspace"></video>
    </div>
  </header>

  <main class="wrap">
    <div id="content"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="site-footer-text">buildspace — gebaut mit HTML, CSS &amp; JavaScript, gehostet auf GitHub Pages.</p>
    </div>
  </footer>

  <script src="posts-data.js"></script>
  <script defer src="qrcode-generator.js"></script>
  <script defer src="protect.js"></script>
  <script defer src="cursor.js"></script>
  <script src="app.js"></script>
  <script>
    // Showreel nur auf der Startseite zeigen; bei "Bewegung reduzieren" angehalten lassen.
    (function () {
      var box = document.getElementById("hero-reel");
      if (!box) return;
      var video = box.querySelector("video");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      function update() {
        var home = location.hash === "" || location.hash === "#" || location.hash === "#/";
        box.hidden = !home;
        if (!home || reduce.matches) { video.pause(); }
        else { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
      }
      window.addEventListener("hashchange", update);
      update();
    })();
  </script>
</body>
</html>
