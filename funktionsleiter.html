/* ================= Bausteine für Aufgaben ================= */
function uniqBy(list,key){const s=new Set(),o=[];for(const x of list){const k=key(x);if(!s.has(k)){s.add(k);o.push(x);}}return o;}
const okey=o=>o.t+'#'+(o.g?JSON.stringify(o.g.fns):'');
function choice(correct,dist,max){max=max||4;const all=uniqBy([correct,...shuffle(dist)],okey).slice(0,max);const sh=shuffle(all);return {opts:sh,correct:sh.indexOf(all[0])};}
function multi(items){const sh=shuffle(uniqBy(items,okey));return {opts:sh.map(x=>x.g?{t:x.t,g:x.g}:{t:x.t}),correct:sh.map((x,i)=>x.ok?i:-1).filter(i=>i>=0)};}
function match(pairs){const left=pairs.map(p=>p[0]);const idx=shuffle(pairs.map((_,i)=>i));const right=idx.map(i=>pairs[i][1]);return {left,right,correct:pairs.map((_,i)=>idx.indexOf(i))};}
const pairList=pairs=>pairs.map(p=>p[0].t+'  →  '+p[1].t).join('\n');
function vzHint(d){return d===0?'Steht nur x² ohne Klammer, ist d = 0.':`Achtung Vorzeichen: In der Klammer steht ${d>0?'−':'+'} ${num(Math.abs(d))}, also ist d = ${num(d)}.`;}

  if(k==='handy'){const G=pick([5,8,10,12]),p=D===0?pick([2,3,4]):pick([2,3,1.5,2.5]);

      fw:n=>`Wie viel kostet der Tarif in einem Monat mit ${n} GB (in €)?`,bw:z=>`Diesen Monat hat der Tarif ${num(z)} € gekostet. Wie viele GB wurden genutzt?`};}
  if(k==='taxi'){const G=pick([3,4,5]),p=D===0?pick([2,3]):pick([1.5,2,2.5]);
    return {k,m:p,b:G,xn:'Kilometer',yn:'Preis in €',per:'Kilometer',unit:'€',xr:[2,12],text:`Eine Taxifahrt kostet ${num(G)} € Grundpreis und ${num(p)} € pro gefahrenem Kilometer.`,short:`Taxi: ${num(G)} € Grundpreis + ${num(p)} € pro km`,

  if(k==='kerze'){let Lg,r;do{Lg=pick([20,24,30,36]);r=pick([2,3,4,5,6]);}while(Lg%r);
    return {k,m:-r,b:Lg,xn:'Stunden',yn:'Länge in cm',per:'Stunde',unit:'cm',xr:[1,Lg/r-1],text:`Eine neue Kerze ist ${Lg} cm lang. Beim Brennen wird sie pro Stunde ${r} cm kürzer.`,short:`Kerze: ${Lg} cm lang, wird pro Stunde ${r} cm kürzer`,

      fw:n=>`Wie viel Geld hat Lina nach ${n} Wochen (in €)?`,bw:z=>`Lina hat jetzt ${num(z)} €. Wie viele Wochen hat sie gespart?`};}
  const G=pick([20,25,30,40]),p=pick([15,20,25]);
  return {k:'fitness',m:p,b:G,xn:'Monate',yn:'Kosten in €',per:'Monat',unit:'€',xr:[2,12],text:`Ein Fitnessstudio verlangt einmalig ${G} € Anmeldegebühr und dann ${p} € pro Monat.`,short:`Fitnessstudio: ${G} € Anmeldung + ${p} € pro Monat`,

}

{id:'q_shift',grp:'quad',name:'Verschiebung',min:0,types:['single','multi','match'],gen(D,type){

}},
{id:'q_stretch',grp:'quad',name:'Streckung & Öffnung',min:0,types:['single','multi','match'],gen(D,type){

const TW=[{single:40,number:25,match:20,multi:15},{single:30,number:30,match:20,multi:20},{single:25,number:35,match:15,multi:25}];
function chooseType(t,D,prev){let types=t.types.slice();const last2=prev.slice(-2);
  if(last2.length===2&&last2[0]===last2[1]&&types.length>1)types=types.filter(x=>x!==last2[0]);
  const w=TW[D];let sum=types.reduce((s,x)=>s+w[x],0),r=Math.random()*sum;for(const x of types){r-=w[x];if(r<=0)return x;}return types[0];}
function buildQuiz(D,topicIds,n){
  const topics=TOPICS.filter(t=>topicIds.includes(t.id)&&t.min<=D);if(!topics.length)return [];
  let order=[];while(order.length<n){let blk=shuffle(topics);if(order.length&&blk[0]===order[order.length-1]&&blk.length>1)blk.push(blk.shift());order.push(...blk);}order=order.slice(0,n);
  const qs=[],seen=new Set(),types=[];
  order.forEach((t,i)=>{let q,key,type;for(let k=0;k<30;k++){type=chooseType(t,D,types);q=t.gen(D,type);key=q.text+'|'+JSON.stringify(q.opts||q.left||'')+'|'+JSON.stringify(q.g?q.g.fns:'');if(!seen.has(key))break;}
    seen.add(key);types.push(type);q.type=type;q.topic=t.id;q.id=i;if(q.g===undefined)delete q.g;qs.push(q);});
  return qs;
}
function pubQ(q){const r=Object.assign({},q);delete r.correct;delete r.expl;return r;}

/* ================= Auswertung ================= */
function evaluate(q,a,D){
  if(a===null||a===undefined)return 0;
  if(q.type==='single')return a===q.correct?1:0;
  if(q.type==='multi'){if(!Array.isArray(a))return 0;const cs=new Set(q.correct);let hit=0,wrong=0;new Set(a).forEach(i=>cs.has(i)?hit++:wrong++);
    if(hit===cs.size&&wrong===0)return 1;return D===0?Math.max(0,(hit-wrong)/cs.size):0;}
  if(q.type==='number'){const v=Number(a);if(!isFinite(v))return 0;return Math.abs(v-q.correct)<=0.011?1:0;}
  if(q.type==='match'){if(!Array.isArray(a))return 0;let ok=0;q.correct.forEach((r,i)=>{if(a[i]===r)ok++;});if(ok===q.correct.length)return 1;return D===0?ok/q.correct.length:0;}
  return 0;
}

/* ================= Taschenrechner-Parser ================= */
function calc(expr){
  const s=String(expr).replace(/,/g,'.').replace(/[×·*]/g,'*').replace(/[÷:\/]/g,'/').replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(!s)return NaN;let i=0;
  const E=()=>{let v=T();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const w=T();v=o==='+'?v+w:v-w;}return v;};
  const T=()=>{let v=F();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const w=F();v=o==='*'?v*w:v/w;}return v;};
  const F=()=>{if(s[i]==='-'){i++;return -F();}if(s[i]==='+'){i++;return F();}return Pw();};
  const Pw=()=>{let v=A();while(s[i]==='²'){i++;v=v*v;}if(s[i]==='^'){i++;v=Math.pow(v,F());}return v;};
  const A=()=>{if(s[i]==='('){i++;const v=E();if(s[i]===')')i++;return v;}if(s[i]==='√'){i++;return Math.sqrt(Pw());}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw new Error('x');i+=m[0].length;return parseFloat(m[0]);};
  try{const v=E();if(i!==s.length)return NaN;return v;}catch(e){return NaN;}
}

  tone(f,d,type,v,delay){if(!this.on||!this.ctx)return;const t=this.ctx.currentTime+(delay||0),o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d+0.05);},
  join(){this.tone(660,.15,'triangle',.2);this.tone(990,.2,'triangle',.18,.08);},
  tick(){this.tone(880,.07,'square',.05);},
  go(){this.tone(523,.12,'triangle',.2);this.tone(784,.25,'triangle',.2,.12);},
  end(){this.tone(392,.25,'triangle',.25);this.tone(294,.45,'triangle',.25,.18);},
  climb(){for(let i=0;i<10;i++)this.tone(380+i*45,.07,'square',.04,i*.24);},
  fanfare(){[523,523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,.3,'triangle',.2,i*.17));}};
const PEER_CFG={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const PREFIX='fkleiter-q10-';
function sendTo(conn,msg){try{if(conn&&conn.open)conn.send(msg);}catch(e){}}
let _wake=null;async function keepAwake(){try{if('wakeLock' in navigator){_wake=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&_wake)keepAwake();});
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
/* ================= LEHRKRAFT (HOST) ================= */
const H={peer:null,code:'',players:[],phase:'setup',qs:[],qi:-1,ans:new Map(),qStart:0,timer:null,kicked:new Set(),endLock:false,lastTick:-1,
  set:{D:0,topics:TOPICS.filter(t=>t.min===0).map(t=>t.id),n:10,time:30,hints:true,sound:true,late:true}};
const STUFE=['leicht','mittel','schwer'];
const online=()=>H.players.filter(p=>p.online);
const played=()=>Math.min(H.qi+1,H.qs.length);
const joinURL=()=>location.href.split('#')[0].split('?')[0]+'?code='+H.code;

function hostStart(){SND.init();keepAwake();render(`<div class="center"><div class="spinner"></div><p class="fd">Spiel wird erstellt …</p></div>`);openHostPeer(0);
  window.addEventListener('beforeunload',e=>{if(H.players.length){e.preventDefault();e.returnValue='';}});}
function openHostPeer(tries){
  if(typeof Peer==='undefined'){render(`<div class="center"><h2>PeerJS konnte nicht geladen werden</h2><p class="muted">Prüfe die Internetverbindung und lade die Seite neu.</p></div>`);return;}
  H.code=String(ri(100000,999999));const peer=new Peer(PREFIX+H.code,PEER_CFG);H.peer=peer;let opened=false;
  const to=setTimeout(()=>{if(!opened)render(`<div class="center"><h2>Keine Verbindung zum Vermittlungsserver</h2><p class="muted" style="max-width:48ch">Das Spiel nutzt den kostenlosen PeerJS-Server. Prüfe das Internet bzw. ob das Schul-WLAN WebRTC blockiert, und lade die Seite neu.</p><button class="btn" onclick="location.reload()">Neu laden</button></div>`);},12000);
  peer.on('open',()=>{opened=true;clearTimeout(to);if(H.phase==='setup'){H.phase='lobby';hLobby();}});
  peer.on('connection',conn=>{conn.on('data',d=>hData(conn,d));conn.on('close',()=>hClose(conn));conn.on('error',()=>hClose(conn));});
  peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}},1000);});
  peer.on('error',err=>{if(err.type==='unavailable-id'&&!opened&&tries<5){clearTimeout(to);peer.destroy();openHostPeer(tries+1);}
    else if(['network','server-error','socket-error','socket-closed'].includes(err.type))toast('Verbindung zum Server gestört, versuche erneut …');});
}
/* ---------- Nachrichten ---------- */
function hData(conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='hello'||d.t==='join'){
    if(H.kicked.has(d.pid)){sendTo(conn,{t:'kicked'});setTimeout(()=>conn.close(),300);return;}
    let p=H.players.find(x=>x.pid===d.pid);
    if(p){if(p.conn&&p.conn!==conn){try{p.conn.close();}catch(e){}}p.conn=conn;p.online=true;welcome(p);refreshPlayers();return;}
    if(H.phase!=='lobby'&&!H.set.late){sendTo(conn,{t:'reject',msg:'Das Spiel läuft schon. Späteres Beitreten ist ausgeschaltet.'});return;}
    if(d.t==='hello'){sendTo(conn,{t:'needjoin'});return;}
    if(H.players.length>=40){sendTo(conn,{t:'reject',msg:'Das Spiel ist voll (40 Plätze).'});return;}
    let name=String(d.name||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16)||'Gast';const base=name;let k=2;
    while(H.players.some(x=>x.name.toLowerCase()===name.toLowerCase()))name=base.slice(0,13)+' '+(k++);
    p={pid:d.pid,name,ch:Math.abs(d.ch|0)%CHARS.length,conn,online:true,score:0,prev:0,hist:[]};H.players.push(p);SND.join();
    welcome(p);refreshPlayers();return;}
  const p=H.players.find(x=>x.conn===conn);if(!p)return;
  if(d.t==='ans'){if(H.phase!=='question'||d.i!==H.qi||H.ans.has(p.pid))return;
    H.ans.set(p.pid,{a:d.a,h:Math.max(0,Math.min(2,d.h|0)),t:performance.now()-H.qStart});sendTo(conn,{t:'got'});updAnswered();
    if(online().every(x=>H.ans.has(x.pid))){const qi=H.qi;setTimeout(()=>{if(H.qi===qi)endQuestion();},700);}}
}
function hClose(conn){const p=H.players.find(x=>x.conn===conn);if(p){p.online=false;refreshPlayers();}}
function rankOf(p){const s=[...H.players].sort((a,b)=>b.score-a.score);return 1+s.filter(x=>x.score>p.score).length;}
function welcome(p){const c=p.conn;sendTo(c,{t:'welcome',pid:p.pid,name:p.name,ch:p.ch,score:p.score});
  if(H.phase==='lobby')sendTo(c,{t:'lobby'});
  else if(H.phase==='intro')sendTo(c,{t:'intro',i:H.qi,n:H.qs.length});
  else if(H.phase==='question'){if(H.ans.has(p.pid))sendTo(c,{t:'got'});else sendTo(c,qMsg());}
  else if(H.phase==='reveal'||H.phase==='ladder'){const r=p.hist[H.qi];if(r)sendTo(c,revMsg(p));else sendTo(c,{t:'wait'});}
  else if(H.phase==='final')sendTo(c,finMsg(p));}
function qMsg(){const q=H.qs[H.qi],el=(performance.now()-H.qStart)/1000;return {t:'q',i:H.qi,n:H.qs.length,q:pubQ(q),dur:H.set.time,left:H.set.time?Math.max(0,H.set.time-el):0,hints:H.set.hints};}
function revMsg(p){const r=p.hist[H.qi]||{frac:0,pts:0,answered:false};return {t:'reveal',i:H.qi,q:H.qs[H.qi],r:{frac:r.frac,pts:r.pts,answered:r.answered,h:r.h,total:p.score,rank:rankOf(p),of:H.players.length}};}
function finMsg(p){return {t:'final',rank:rankOf(p),of:H.players.length,total:p.score,correct:p.hist.filter(h=>h&&h.frac===1).length,n:played()};}
function bcast(fn){H.players.forEach(p=>{if(p.online)sendTo(p.conn,typeof fn==='function'?fn(p):fn);});}

/* ---------- Kopfzeile ---------- */
function barHTML(mid){return `<header class="bar"><span class="brand">Funktionsleiter</span>${mid||''}<span class="sp"></span>
  <span class="chip">Code ${H.code}</span><span class="chip" id="pcount">👥 ${online().length}</span>
  <span class="chip"><button id="sndbtn" aria-label="Ton an oder aus">${SND.on?'🔊':'🔇'}</button></span></header>`;}
document.addEventListener('click',e=>{if(e.target.closest('#sndbtn')){SND.on=!SND.on;H.set.sound=SND.on;e.target.closest('#sndbtn').textContent=SND.on?'🔊':'🔇';}});

/* ---------- Lobby mit Einstellungen ---------- */
function hLobby(){
  const s=H.set;const seg=(key,vals,labels)=>`<div class="seg" data-k="${key}">${vals.map((v,i)=>`<button data-v="${v}" class="${String(s[key])===String(v)?'on':''}">${labels[i]}</button>`).join('')}</div>`;
  const groups=Object.keys(GROUPS).map(g=>{const ts=TOPICS.filter(t=>t.grp===g),off=ts.every(t=>t.min>s.D);
    return `<div class="tgroup${off?' off':''}"><div class="gh"><span>${GROUPS[g]}</span>${off?'':`<button data-grp="${g}">alle / keine</button>`}</div>
    ${ts.map(t=>`<label class="chk"><input type="checkbox" data-t="${t.id}" ${s.topics.includes(t.id)&&t.min<=s.D?'checked':''} ${t.min>s.D?'disabled':''}>${esc(t.name)}</label>`).join('')}
    ${off?'<p class="small muted" style="margin:4px 0 0">Wird ab Stufe „mittel“ freigeschaltet.</p>':''}</div>`;}).join('');
  render(barHTML()+`<main class="lobby">
   <section class="card joinbox">
     <h2>Mitspielen</h2><p class="muted" style="margin:0">Seite öffnen und Code eingeben</p>
     <div class="url">${esc(location.host+location.pathname)}</div>
     <div class="code">${H.code}</div><div id="qr"></div><p class="small muted" style="margin:0">oder QR-Code scannen</p>
   </section>
   <section style="display:flex;flex-direction:column;gap:22px">
     <div class="card settings">
       <h3>Stufe</h3>${seg('D',[0,1,2],['leicht','mittel','schwer'])}
       <h3>Themen</h3><div class="tgrid">${groups}</div>
       <h3>Anzahl Fragen</h3>${seg('n',[10,15,20],['10','15','20'])}
       <h3>Zeit pro Frage</h3>${seg('time',[20,30,60,90,0],['20 s','30 s','60 s','90 s','ohne Limit'])}
       <h3>Optionen</h3><div class="toggles">
         <label class="chk"><input type="checkbox" data-o="hints" ${s.hints?'checked':''}>Tipps erlauben (Punkte ×½ bzw. ×¼)</label>
         <label class="chk"><input type="checkbox" data-o="late" ${s.late?'checked':''}>Späteres Beitreten erlauben</label>
         <label class="chk"><input type="checkbox" data-o="sound" ${s.sound?'checked':''}>Ton</label></div>
     </div>
     <div class="card"><h3 class="fd">Im Spiel: <span id="pnum">0</span></h3><p class="small muted" style="margin:4px 0 0">Tippe auf einen Namen, um die Person aus dem Spiel zu entfernen.</p>
       <div class="players" id="plist"></div>
       <div class="startrow"><button class="btn green big" id="startbtn">Spiel starten</button><span class="err" id="starterr"></span></div></div>
   </section></main>`);
  if(typeof QRCode!=='undefined'){try{new QRCode($('#qr'),{text:joinURL(),width:170,height:170,colorDark:'#1B2A4A',colorLight:'#ffffff'});}catch(e){$('#qr').remove();}}else $('#qr').remove();
  $('.lobby').addEventListener('click',lobbyClick);$('.lobby').addEventListener('change',lobbyChange);refreshPlayers();
}
function lobbyClick(e){
  const sb=e.target.closest('.seg button');if(sb){const k=sb.parentElement.dataset.k,v=sb.dataset.v;H.set[k]=Number(v);
    if(k==='D'){TOPICS.forEach(t=>{if(t.min>H.set.D)H.set.topics=H.set.topics.filter(x=>x!==t.id);});
      if(H.set.D>0)TOPICS.filter(t=>t.grp==='extra').forEach(t=>{if(!H.set.topics.includes(t.id))H.set.topics.push(t.id);});hLobby();return;}
    sb.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sb));return;}
  const gb=e.target.closest('[data-grp]');if(gb){const ids=TOPICS.filter(t=>t.grp===gb.dataset.grp&&t.min<=H.set.D).map(t=>t.id);const all=ids.every(id=>H.set.topics.includes(id));
    H.set.topics=H.set.topics.filter(id=>!ids.includes(id));if(!all)H.set.topics.push(...ids);hLobby();return;}
  const pl=e.target.closest('.pl');if(pl){const p=H.players.find(x=>x.pid===pl.dataset.pid);if(p&&confirm(`${p.name} aus dem Spiel entfernen?`))kick(p);return;}
  if(e.target.closest('#startbtn'))startGame();
}
function lobbyChange(e){const t=e.target;if(t.dataset.t){const id=t.dataset.t;H.set.topics=H.set.topics.filter(x=>x!==id);if(t.checked)H.set.topics.push(id);}
  if(t.dataset.o){H.set[t.dataset.o]=t.checked;if(t.dataset.o==='sound'){SND.on=t.checked;const b=$('#sndbtn');if(b)b.textContent=SND.on?'🔊':'🔇';}}}
function kick(p){H.kicked.add(p.pid);sendTo(p.conn,{t:'kicked'});setTimeout(()=>{try{p.conn.close();}catch(e){}},300);H.players=H.players.filter(x=>x!==p);refreshPlayers();}
function refreshPlayers(){const c=$('#pcount');if(c)c.textContent='👥 '+online().length;const n=$('#pnum');if(n)n.textContent=H.players.length;
  const l=$('#plist');if(l)l.innerHTML=H.players.length?H.players.map(p=>`<button class="pl${p.online?'':' off'}" data-pid="${p.pid}" title="${p.online?'':'Verbindung getrennt'}">${charSVG(p.ch)}${esc(p.name)}</button>`).join(''):'<p class="muted">Noch niemand da. Die Namen erscheinen hier, sobald jemand beitritt.</p>';
  updAnswered();}
function updAnswered(){const a=$('#answered');if(a)a.textContent=`${H.ans.size} / ${online().length}`;}

/* ---------- Spielablauf ---------- */
function startGame(){const topics=H.set.topics.filter(id=>{const t=TOPICS.find(x=>x.id===id);return t&&t.min<=H.set.D;});
  if(!topics.length){$('#starterr').textContent='Wähle mindestens ein Thema aus.';return;}
  if(!H.players.length){$('#starterr').textContent='Es ist noch niemand beigetreten.';return;}
  SND.init();H.qs=buildQuiz(H.set.D,topics,H.set.n);H.players.forEach(p=>{p.score=0;p.prev=0;p.hist=[];});H.qi=-1;nextQuestion();}
function nextQuestion(){H.qi++;if(H.qi>=H.qs.length){hFinal();return;}
  H.phase='intro';bcast({t:'intro',i:H.qi,n:H.qs.length});const q=H.qs[H.qi];
  render(barHTML()+`<div class="center intro"><p class="fd muted" style="font-size:1.5rem">${esc(topicName(q.topic))}</p><div class="num">Frage ${H.qi+1} von ${H.qs.length}</div><span class="tag">${TYPELABEL[q.type]}</span><div class="count321" id="c321">3</div></div>`);
  let c=3;SND.tick();const iv=setInterval(()=>{c--;if(c>0){const el=$('#c321');if(el)el.textContent=c;SND.tick();}else{clearInterval(iv);startQuestion();}},1000);}
function startQuestion(){H.phase='question';H.ans.clear();H.endLock=false;H.lastTick=-1;H.qStart=performance.now();SND.go();
  bcast(()=>qMsg());const q=H.qs[H.qi];let body;
  if(q.type==='single'||q.type==='multi')body=tilesHTML(q);
  else if(q.type==='number')body=`<div class="card" style="text-align:center"><p class="fd" style="font-size:1.6rem;margin:0">🧮 Zahl eingeben</p><p class="muted">Auf dem Gerät gibt es einen Taschenrechner. Kommazahlen mit Komma eingeben.</p></div>`;
  else body=matchStatic(q);
  render(barHTML(`<span class="chip">Frage ${H.qi+1}/${H.qs.length}</span>`)+`<main class="hq">
    <div style="display:flex;gap:18px;align-items:center"><div class="qtext" style="flex:1">${esc(q.text)}<div style="margin-top:8px"><span class="tag">${TYPELABEL[q.type]}</span></div></div>
     <div class="hstat">${H.set.time?`<div class="timer" id="timer"><span id="tleft">${H.set.time}</span></div>`:''}<div style="text-align:center"><div class="bignum" id="answered">0 / ${online().length}</div><div class="small muted">Antworten</div></div></div></div>
    <div class="body${q.g?'':' nog'}">${q.g?graphSVG(q.g):''}<div>${body}</div></div>
    <div class="foot" style="padding:0"><button class="btn" id="endq">Auflösen</button></div></main>`);
  $('#endq').onclick=endQuestion;clearInterval(H.timer);H.timer=setInterval(tickQ,200);}
function tickQ(){if(H.phase!=='question')return;if(!H.set.time)return;const el=(performance.now()-H.qStart)/1000,left=Math.max(0,H.set.time-el),t=$('#timer');
  if(t){t.style.setProperty('--p',(left/H.set.time*100)+'%');t.classList.toggle('low',left<=5);$('#tleft').textContent=Math.ceil(left);}
  const s=Math.ceil(left);if(s<=5&&s>0&&s!==H.lastTick){H.lastTick=s;SND.tick();}if(left<=0)endQuestion();}
function endQuestion(){if(H.phase!=='question'||H.endLock)return;H.endLock=true;clearInterval(H.timer);H.phase='reveal';SND.end();
  const q=H.qs[H.qi],D=H.set.D,T=H.set.time||60;
  H.players.forEach(p=>{const a=H.ans.get(p.pid);let frac=0,pts=0;
    if(a){frac=evaluate(q,a.a,D);if(frac>0){const speed=1-0.5*Math.min(a.t/1000/T,1),hf=[1,0.5,0.25][a.h];pts=Math.round(1000*frac*speed*hf);}}
    p.prev=p.score;p.score+=pts;p.hist[H.qi]={topic:q.topic,frac,pts,h:a?a.h:0,answered:!!a,a:a?a.a:null};});
  bcast(p=>revMsg(p));hReveal();}
function hReveal(){const q=H.qs[H.qi];const res=H.players.map(p=>p.hist[H.qi]);
  const nOk=res.filter(r=>r.frac===1).length,nPart=res.filter(r=>r.frac>0&&r.frac<1).length,nNone=res.filter(r=>!r.answered).length,nBad=res.length-nOk-nPart-nNone;
  let body;
  if(q.type==='single'||q.type==='multi'){const counts={};res.forEach(r=>{if(!r.answered)return;(Array.isArray(r.a)?r.a:[r.a]).forEach(i=>counts[i]=(counts[i]||0)+1);});body=tilesHTML(q,{correct:q.correct,counts});}
  else if(q.type==='number'){const m={};res.forEach(r=>{if(r.answered){const k=num(Number(r.a));m[k]=(m[k]||0)+1;}});
    const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
    body=`<div class="card"><p class="muted" style="margin:0">Richtige Antwort</p><div class="bignum" style="font-size:3rem">${num(q.correct)}</div>
     ${top.length?`<p class="muted" style="margin:10px 0 4px">Häufigste Eingaben</p>${top.map(([k,v])=>`<div class="brow"><span class="nm">${k}</span><span>${v}×</span>${Math.abs(calc(k)-q.correct)<=0.011?'✅':''}</div>`).join('')}`:''}</div>`;}
  else body=solutionHTML(q);
  render(barHTML(`<span class="chip">Frage ${H.qi+1}/${H.qs.length}</span>`)+`<main class="hq">
    <div class="qtext">${esc(q.text)}</div>
    <div class="body${q.g?'':' nog'}">${q.g?graphSVG(q.g):''}<div style="display:flex;flex-direction:column;gap:14px">${body}
      <div class="expl"><b>So geht's:</b>\n${esc(q.expl)}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><span class="tag" style="background:#E3F6EE">✅ ${nOk} richtig</span>${nPart?`<span class="tag" style="background:#FFF4CC">◐ ${nPart} teilweise</span>`:''}<span class="tag" style="background:#FDE7EA">✗ ${nBad} falsch</span>${nNone?`<span class="tag">– ${nNone} ohne Antwort</span>`:''}</div></div></div>
    <div class="foot" style="padding:0"><button class="btn green big" id="toladder">Zur Kletterwand</button></div></main>`);
  $('#toladder').onclick=hLadder;}
function hLadder(){H.phase='ladder';const max=H.qs.length*1000*0.8,last=H.qi>=H.qs.length-1;
  const ranked=[...H.players].sort((a,b)=>b.score-a.score);
  render(barHTML(`<span class="chip">Nach Frage ${H.qi+1}/${H.qs.length}</span>`)+`<div class="ladderwrap"><div class="wall" id="wall"><div class="summit">Gipfel 🏁</div>
    ${H.players.map(p=>{const d=p.score-p.prev;return `<div class="lane"><div class="rails"><div class="climber" data-pid="${p.pid}" style="--p:${Math.min(1,p.prev/max)}"><span class="plus${d?'':' zero'}">${d?'+'+d:'+0'}</span>${charSVG(p.ch)}</div></div><div class="lname" title="${esc(p.name)}">${esc(p.name)}</div></div>`;}).join('')}
    </div><aside class="card board" id="board"><h3>Punktestand</h3>${ranked.slice(0,5).map(p=>`<div class="brow"><span class="rk">${rankOf(p)}.</span>${charSVG(p.ch)}<span class="nm">${esc(p.name)}</span><span>${p.score}</span><span class="dl">${p.score-p.prev?'+'+(p.score-p.prev):''}</span></div>`).join('')}
    ${ranked.length>5?`<p class="small muted" style="margin:8px 0 0">… und ${ranked.length-5} weitere. Alle sehen ihren Platz auf dem eigenen Gerät.</p>`:''}</aside></div>
    <div class="foot"><button class="btn light" id="stopbtn">Spiel beenden</button><button class="btn green big" id="nextbtn">${last?'Zum Endergebnis':'Nächste Frage'}</button></div>`);
  $('#nextbtn').onclick=nextQuestion;$('#stopbtn').onclick=()=>{if(confirm('Spiel jetzt beenden und Endergebnis zeigen?'))hFinal();};
  const wall=$('#wall');void wall.offsetHeight;
  requestAnimationFrame(()=>{wall.classList.add('show');document.querySelectorAll('.climber').forEach(el=>{const p=H.players.find(x=>x.pid===el.dataset.pid);if(p.score>p.prev)el.classList.add('moving');el.style.setProperty('--p',Math.min(1,p.score/max));});SND.climb();});
  setTimeout(()=>{document.querySelectorAll('.climber').forEach(el=>el.classList.remove('moving'));const b=$('#board');if(b)b.classList.add('show');},2700);}
function hFinal(){H.phase='final';clearInterval(H.timer);SND.fanfare();bcast(p=>finMsg(p));
  const ranked=[...H.players].sort((a,b)=>b.score-a.score),top=ranked.slice(0,3),order=[1,0,2].filter(i=>top[i]),hts={0:200,1:150,2:110};
  render(barHTML()+`<main class="center" style="justify-content:flex-start;padding-top:30px">
    <h1 style="font-size:2.6rem">Endergebnis</h1>
    <div class="podium">${order.map(i=>`<div class="pod">${charSVG(top[i].ch)}<div class="nm">${esc(top[i].name)}</div><div class="blk" style="height:${hts[i]}px">${rankOf(top[i])}<span style="font-size:1rem">${top[i].score} P.</span></div></div>`).join('')}</div>
    <div class="card rank">${ranked.map(p=>`<div class="brow"><span class="rk">${rankOf(p)}.</span>${charSVG(p.ch)}<span class="nm">${esc(p.name)}</span><span class="small muted">${p.hist.filter(h=>h&&h.frac===1).length}/${played()} richtig</span><span>${p.score}</span></div>`).join('')}</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center"><button class="btn light" id="csvbtn">Ergebnisse als CSV</button><button class="btn green big" id="againbtn">Neue Runde mit neuen Fragen</button></div></main>`);
  $('#csvbtn').onclick=exportCSV;$('#againbtn').onclick=()=>{H.phase='lobby';bcast({t:'lobby'});hLobby();};}
function exportCSV(){const n=played(),QS=H.qs.slice(0,n),topics=[...new Set(QS.map(q=>q.topic))];
  const head=['Platz','Name','Figur','Punkte','Richtig','Teilweise','Falsch oder keine Antwort','Trefferquote %','Tipps genutzt',...topics.map(t=>topicName(t)+' %')];
  const rows=[...H.players].sort((a,b)=>b.score-a.score).map(p=>{const hs=QS.map((q,i)=>p.hist[i]||{frac:0,h:0});const ok=hs.filter(h=>h.frac===1).length,part=hs.filter(h=>h.frac>0&&h.frac<1).length;
    return [rankOf(p),p.name,CHARS[p.ch].n,p.score,ok,part,n-ok-part,Math.round(hs.reduce((s,h)=>s+h.frac,0)/n*100),hs.reduce((s,h)=>s+(h.h||0),0),
      ...topics.map(t=>{const idx=QS.map((q,i)=>q.topic===t?i:-1).filter(i=>i>=0);return Math.round(idx.reduce((s,i)=>s+hs[i].frac,0)/idx.length*100);})];});
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Funktionsleiter_'+new Date().toISOString().slice(0,10)+'_'+STUFE[H.set.D]+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
/* ================= SCHÜLER:INNEN ================= */
const PL={peer:null,conn:null,code:'',pid:null,name:'',ch:0,q:null,i:-1,n:0,sel:null,act:null,h:0,expr:'',endAt:0,dur:0,timer:null,answered:false,hintsOn:true,joined:false,kicked:false,retry:null,connecting:false};
function myPid(){let id=store('fkq-pid');if(!id){id='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);store('fkq-pid',id);}return id;}
function pCode(pref,err){
  render(`<main class="center"><div class="me"><div class="logo-ladder"></div>${charSVG(+(store('fkq-ch')||0))}</div><h1 class="fd" style="font-size:2.2rem">Mitspielen</h1>
   <p class="muted" style="margin:0">Gib den Code von der Tafel ein.</p>
   <input class="inp code" id="codein" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000" value="${esc(pref||'')}" aria-label="Spiel-Code">
   <div class="err" id="cerr">${esc(err||'')}</div><button class="btn big" id="codebtn">Weiter</button></main>`);
  const inp=$('#codein');inp.focus();inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,6);});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')$('#codebtn').click();});
  $('#codebtn').onclick=()=>{const c=inp.value.trim();if(c.length!==6){$('#cerr').textContent='Der Code hat 6 Ziffern.';inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);return;}pConnect(c);};
}
function pConnect(code){PL.code=code;PL.pid=myPid();PL.connecting=true;
  render(`<main class="center"><div class="spinner"></div><p class="fd">Verbinde mit Spiel ${esc(code)} …</p></main>`);
  if(typeof Peer==='undefined'){pCode(code,'PeerJS konnte nicht geladen werden. Internet prüfen.');return;}
  if(!PL.peer||PL.peer.destroyed){PL.peer=new Peer(PEER_CFG);
    PL.peer.on('open',()=>doConnect());
    PL.peer.on('error',err=>{if(err.type==='peer-unavailable'){if(PL.connecting&&!PL.joined){PL.connecting=false;pCode(PL.code,'Kein Spiel mit diesem Code gefunden. Stimmt der Code?');}}
      else if(PL.connecting&&!PL.joined&&['network','server-error','socket-error','browser-incompatible'].includes(err.type)){PL.connecting=false;pCode(PL.code,'Keine Verbindung zum Server. WLAN prüfen und nochmal versuchen.');}});
    PL.peer.on('disconnected',()=>{setTimeout(()=>{try{if(!PL.peer.destroyed)PL.peer.reconnect();}catch(e){}},1000);});}
  else doConnect();
  setTimeout(()=>{if(PL.connecting&&!PL.joined&&!(PL.conn&&PL.conn.open)){PL.connecting=false;pCode(PL.code,'Das Spiel antwortet nicht. Code prüfen und erneut versuchen.');}},12000);}
function doConnect(){if(PL.kicked)return;try{if(PL.conn)PL.conn.close();}catch(e){}
  const c=PL.peer.connect(PREFIX+PL.code,{reliable:true});PL.conn=c;
  c.on('open',()=>{PL.connecting=false;hideLost();sendTo(c,{t:'hello',pid:PL.pid});});
  c.on('data',d=>{if(c===PL.conn)pData(d);});
  c.on('close',()=>{if(c===PL.conn)onLost();});c.on('error',()=>{if(c===PL.conn)onLost();});}
function onLost(){if(PL.kicked||!PL.joined)return;showLost();clearTimeout(PL.retry);
  PL.retry=setTimeout(function again(){if(PL.conn&&PL.conn.open)return;if(!PL.peer||PL.peer.destroyed){PL.peer=null;pConnect(PL.code);return;}
    if(PL.peer.disconnected){try{PL.peer.reconnect();}catch(e){}}else doConnect();PL.retry=setTimeout(again,3000);},1500);}
function showLost(){if($('#lost'))return;const d=document.createElement('div');d.id='lost';d.className='overlay';d.innerHTML='<div class="card center" style="flex:none"><div class="spinner"></div><p class="fd" style="margin:0">Verbindung unterbrochen</p><p class="muted" style="margin:0">Verbinde neu … Deine Punkte bleiben erhalten.</p></div>';document.body.appendChild(d);}
function hideLost(){const d=$('#lost');if(d)d.remove();}
function pSend(m){sendTo(PL.conn,m);}
function pData(d){
  switch(d.t){
    case 'needjoin':pProfile();break;
    case 'welcome':PL.joined=true;PL.name=d.name;PL.ch=d.ch;store('fkq-name',d.name);store('fkq-ch',String(d.ch));break;
    case 'lobby':pWait('Du bist dabei!','Schau nach vorne. Gleich geht es los.');break;
    case 'wait':pWait('Gleich geht es weiter','Warte auf die nächste Frage.');break;
    case 'intro':clearInterval(PL.timer);render(`<main class="center intro"><div class="me">${charSVG(PL.ch)}</div><div class="num" style="font-size:3.2rem">Frage ${d.i+1} von ${d.n}</div><p class="fd muted" style="font-size:1.3rem">Mach dich bereit!</p></main>`);break;
    case 'q':pQuestion(d);break;
    case 'got':pSent();break;
    case 'reveal':pResult(d);break;
    case 'final':pFinal(d);break;
    case 'kicked':PL.kicked=true;clearInterval(PL.timer);hideLost();render(`<main class="center"><h2>Du wurdest aus dem Spiel entfernt.</h2><p class="muted">Frag deine Lehrkraft, wenn das ein Versehen war.</p></main>`);break;
    case 'reject':PL.connecting=false;pCode(PL.code,d.msg);break;
  }
}
function pProfile(){let ch=+(store('fkq-ch')||Math.floor(Math.random()*CHARS.length));
  render(`<main class="center" style="justify-content:flex-start;padding-top:28px"><h1 class="fd" style="font-size:2rem">Wer klettert mit?</h1>
   <input class="inp" id="namein" maxlength="16" placeholder="Dein Name" value="${esc(store('fkq-name')||'')}" autocomplete="off" aria-label="Dein Name">
   <p class="muted" style="margin:0">Such dir deine Figur aus:</p>
   <div class="chars" id="chars">${CHARS.map((c,i)=>`<button data-c="${i}" class="${i===ch?'on':''}" aria-label="${c.n}">${charSVG(i)}${c.n}</button>`).join('')}</div>
   <div class="err" id="perr"></div><button class="btn green big" id="joinbtn">Los geht's</button></main>`);
  $('#chars').onclick=e=>{const b=e.target.closest('button');if(!b)return;ch=+b.dataset.c;document.querySelectorAll('#chars button').forEach(x=>x.classList.toggle('on',x===b));};
  $('#joinbtn').onclick=()=>{const name=$('#namein').value.trim();if(!name){$('#perr').textContent='Bitte gib einen Namen ein.';return;}
    pSend({t:'join',pid:PL.pid,name,ch});$('#joinbtn').disabled=true;$('#perr').textContent='';};}
function pWait(title,sub){clearInterval(PL.timer);render(`<main class="center"><div class="me">${charSVG(PL.ch)}</div><h1 class="fd" style="font-size:2.2rem">${esc(title)}</h1><p class="fd" style="font-size:1.3rem;margin:0">${esc(PL.name)}</p><p class="muted">${esc(sub)}</p></main>`);}

/* ---------- Frage ---------- */
function pQuestion(d){const q=d.q;PL.q=q;PL.i=d.i;PL.n=d.n;PL.h=0;PL.expr='';PL.answered=false;PL.act=null;PL.hintsOn=d.hints;PL.dur=d.dur;
  PL.sel=q.type==='multi'?[]:q.type==='match'?q.left.map(()=>null):null;PL.endAt=d.dur?Date.now()+d.left*1000:0;
  render(`<main class="play">
   <div class="qtop"><span>Frage ${d.i+1}/${d.n}</span>${d.dur?'<div class="tbar" id="tbar"><i></i></div><span id="tl"></span>':'<span class="sp" style="flex:1"></span><span class="muted">ohne Zeitlimit</span>'}</div>
   <div class="qtext">${esc(q.text)}<div style="margin-top:8px"><span class="tag">${TYPELABEL[q.type]}</span></div></div>
   ${q.g?graphSVG(q.g):''}<div class="hintbox" id="hintbox"></div><div id="ans"></div>
   <div class="qact">${d.hints?'<button class="btn hint" id="hintbtn"></button>':'<span></span>'}${q.type==='single'?'':'<button class="btn green big" id="sub">Antwort abgeben</button>'}</div></main>`);
  drawAns();updHint();if(d.hints)$('#hintbtn').onclick=()=>{if(PL.answered||PL.h>=2)return;PL.h++;updHint();};
  const sb=$('#sub');if(sb)sb.onclick=submit;
  clearInterval(PL.timer);if(d.dur){PL.timer=setInterval(pTick,200);pTick();}}
function pTick(){const left=Math.max(0,(PL.endAt-Date.now())/1000),tb=$('#tbar');if(!tb){clearInterval(PL.timer);return;}
  tb.firstElementChild.style.width=(left/PL.dur*100)+'%';tb.classList.toggle('low',left<=5);$('#tl').textContent=Math.ceil(left)+' s';
  if(left<=0){clearInterval(PL.timer);if(!PL.answered){PL.answered=true;render(`<main class="center"><h1 class="fd">Zeit ist um!</h1><p class="muted">Gleich siehst du die Lösung.</p></main>`);}}}
function updHint(){const q=PL.q,hb=$('#hintbox');hb.innerHTML=q.hints.slice(0,PL.h).map((h,i)=>`<div>💡 ${i+1}. Tipp: ${esc(h)}</div>`).join('');
  const b=$('#hintbtn');if(!b)return;if(PL.h>=2){b.style.visibility='hidden';return;}b.textContent=PL.h===0?'💡 Tipp (Punkte ×½)':'💡 2. Tipp (Punkte ×¼)';}
function drawAns(){const q=PL.q,a=$('#ans');
  if(q.type==='single'){a.innerHTML=tilesHTML(q,{btn:true});a.onclick=e=>{const t=e.target.closest('.tile');if(t){PL.sel=+t.dataset.i;submit();}};}
  else if(q.type==='multi'){a.innerHTML=tilesHTML(q,{btn:true,sel:PL.sel});$('#sub')&&($('#sub').disabled=!PL.sel.length);
    a.onclick=e=>{const t=e.target.closest('.tile');if(!t)return;const i=+t.dataset.i;PL.sel=PL.sel.includes(i)?PL.sel.filter(x=>x!==i):[...PL.sel,i];drawAns();};}
  else if(q.type==='number'){const keys=['7','8','9','÷','←','4','5','6','×','(','1','2','3','−',')','0',',','x²','+','√','C'];
    a.innerHTML=`<div class="calc"><div class="cdisp"><div class="ex" id="ex">${esc(PL.expr)||'&nbsp;'}</div><div class="pv" id="pv"></div></div>
     <div class="keys">${keys.map(k=>`<button data-k="${k}" class="${'÷×−+()x²√'.includes(k)&&k.length<=2&&k!==','?'op':''}${k==='C'||k==='←'?' cl':''}">${k}</button>`).join('')}</div>
     <p class="small muted" style="margin:0;text-align:center">Tippe dein Ergebnis oder eine Rechnung ein. Abgegeben wird das Ergebnis.</p></div>`;
    a.onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k;
      if(k==='C')PL.expr='';else if(k==='←')PL.expr=PL.expr.slice(0,-1);else if(k==='x²')PL.expr+='²';else if(k==='√')PL.expr+='√(';else PL.expr+=k;
      if(PL.expr.length>40)PL.expr=PL.expr.slice(0,40);updCalc();};updCalc();}
  else drawMatch();}
function updCalc(){$('#ex').innerHTML=esc(PL.expr)||'&nbsp;';const v=calc(PL.expr),pv=$('#pv');
  const isPlain=/^[−-]?\d+(,\d+)?$/.test(PL.expr);pv.textContent=PL.expr&&!isPlain?(isFinite(v)?'= '+num(v):'…'):'';$('#sub').disabled=!PL.expr||!isFinite(v);}
document.addEventListener('keydown',e=>{if(!PL.q||PL.q.type!=='number'||PL.answered||!$('#ex'))return;const m={'*':'×','/':'÷','-':'−','.':',',':':'÷'};
  if(e.key==='Enter'){if(!$('#sub').disabled)submit();return;}if(e.key==='Backspace'){PL.expr=PL.expr.slice(0,-1);updCalc();return;}
  const k=m[e.key]||e.key;if(/^[0-9+×÷−(),]$/.test(k)){PL.expr+=k;updCalc();}});
function drawMatch(){const q=PL.q,a=$('#ans');
  const colOf=r=>{const li=PL.sel.indexOf(r);return li>=0?li:null;};
  a.innerHTML=`<p class="small muted" style="margin:0 0 8px">Tippe links auf ein Feld und dann rechts auf das passende Gegenstück.</p><div class="match">
   <div class="col">${q.left.map((o,i)=>`<button class="mi${PL.act===i?' act':''}" data-l="${i}"><span class="badge" style="background:${PAIRC[i]};border:0">${i+1}</span>${miInner(o)}</button>`).join('')}</div>
   <div class="col">${q.right.map((o,r)=>{const li=colOf(r);return `<button class="mi" data-r="${r}"><span class="badge" ${li!==null?`style="background:${PAIRC[li]};border:0"`:''}>${li!==null?li+1:''}</span>${miInner(o)}</button>`;}).join('')}</div></div>`;
  $('#sub').disabled=PL.sel.some(x=>x===null);
  a.onclick=e=>{const l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]');
    if(l){const i=+l.dataset.l;if(PL.sel[i]!==null&&PL.act!==i){PL.sel[i]=null;}PL.act=PL.act===i?null:i;drawMatch();return;}
    if(r){const ri_=+r.dataset.r;if(PL.act===null){const li=PL.sel.indexOf(ri_);if(li>=0){PL.sel[li]=null;drawMatch();}else toast('Tippe zuerst links auf ein Feld.');return;}
      const prev=PL.sel.indexOf(ri_);if(prev>=0)PL.sel[prev]=null;PL.sel[PL.act]=ri_;PL.act=null;drawMatch();}};}
function submit(){if(PL.answered)return;const q=PL.q;let a;
  if(q.type==='number'){a=calc(PL.expr);if(!isFinite(a)){toast('Das kann ich nicht ausrechnen. Prüfe deine Eingabe.');return;}}
  else if(q.type==='single')a=PL.sel;else if(q.type==='multi'){if(!PL.sel.length)return;a=PL.sel.slice();}else{if(PL.sel.some(x=>x===null))return;a=PL.sel.slice();}
  PL.answered=true;clearInterval(PL.timer);pSend({t:'ans',i:PL.i,a,h:PL.h});pSent();}
function pSent(){PL.answered=true;clearInterval(PL.timer);render(`<main class="center"><div class="me">${charSVG(PL.ch)}</div><h1 class="fd" style="font-size:2rem">Antwort ist abgegeben</h1><p class="muted">Warte, bis alle fertig sind.</p>${PL.h?`<span class="tag" style="background:#FFF4CC">💡 ${PL.h} Tipp${PL.h>1?'s':''} genutzt</span>`:''}</main>`);}
function pResult(d){clearInterval(PL.timer);const r=d.r,q=d.q;
  const cls=!r.answered?'none':r.frac===1?'ok':r.frac>0?'part':'bad';
  const title={ok:pick(['Richtig!','Super!','Stark!','Genau!']),part:'Teilweise richtig',bad:'Leider falsch',none:'Keine Antwort'}[cls];
  render(`<main class="center" style="justify-content:flex-start;padding-top:20px">
   <div class="res ${cls}"><h2>${title}</h2><div class="pts">${r.pts?'+'+r.pts+' Punkte':'0 Punkte'}${r.h&&r.pts?` <span class="small">(mit ${r.h} Tipp${r.h>1?'s':''})</span>`:''}</div></div>
   <div class="me">${charSVG(PL.ch)}<div style="text-align:left"><div class="bignum">${r.total} Punkte</div><div class="fd" style="font-size:1.2rem">Platz ${r.rank} von ${r.of}</div></div></div>
   <div class="sol"><p class="fd" style="margin:0 0 8px;font-size:1.15rem">Richtige Antwort</p>${solutionHTML(q)}<div class="expl" style="margin-top:12px"><b>So geht's:</b>\n${esc(q.expl)}</div></div></main>`);}
function pFinal(d){clearInterval(PL.timer);const medal=['🥇','🥈','🥉'][d.rank-1]||'';
  render(`<main class="center"><div class="me">${charSVG(PL.ch)}</div><h1 class="fd" style="font-size:2.6rem">${medal} Platz ${d.rank} von ${d.of}</h1>
   <div class="bignum">${d.total} Punkte</div><p class="fd" style="font-size:1.2rem;margin:0">${d.correct} von ${d.n} Aufgaben ganz richtig</p><p class="muted">Danke fürs Mitspielen, ${esc(PL.name)}!</p></main>`);}
/* ================= Start ================= */
function startScreen(){render(`<main class="center start">
  <div class="start-art">${charSVG(0)}<div class="logo-ladder"></div>${charSVG(5)}<div class="logo-ladder" style="height:90px"></div>${charSVG(10)}</div>
  <h1>Funktionsleiter</h1><p class="lead">Lineare und quadratische Funktionen üben. Jede richtige Antwort bringt deine Figur ein Stück die Leiter hoch.</p>
  <div class="choices"><button class="btn big green" id="joinB">Mitspielen</button><button class="btn big light" id="hostB">Spiel hosten (Lehrkraft)</button></div>
  <p class="small muted">Jahrgang 10 · Stufen leicht, mittel, schwer · Fragen werden jedes Mal neu erzeugt</p></main>`);
  $('#joinB').onclick=()=>pCode();$('#hostB').onclick=hostStart;}
(function(){const c=new URLSearchParams(location.search).get('code');if(c&&/^\d{6}$/.test(c))pConnect(c);else startScreen();})();
</script><script defer data-category="schule" src="protect.js"></script>
</body></html>
