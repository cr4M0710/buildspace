<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181C"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24262B"/>
      <stop offset="1" stop-color="#1E2025"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Hintergrund (iOS rundet die Ecken selbst ab) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Blatt, leicht gegen den Uhrzeigersinn gedreht -->
  <g transform="rotate(-4 512 512)" filter="url(#shadow)">
    <rect x="276" y="186" width="472" height="652" rx="28" fill="url(#sheet)"/>
  </g>
  <!-- Textzeilen -->
  <g transform="rotate(-4 512 512)" stroke="#3B3E45" stroke-width="24" stroke-linecap="round" fill="none">
    <line x1="340" y1="282" x2="508" y2="282"/>
    <line x1="340" y1="360" x2="686" y2="360"/>
    <line x1="340" y1="418" x2="686" y2="418"/>
    <line x1="340" y1="476" x2="686" y2="476"/>
    <line x1="340" y1="534" x2="596" y2="534"/>
    <line x1="340" y1="640" x2="686" y2="640"/>
    <line x1="340" y1="700" x2="566" y2="700"/>
  </g>

  <!-- Scan-Ecken, etwas stärker gedreht als das Blatt -->
  <g transform="rotate(-5 512 512)" stroke="#6E8CFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M214 330 V176 Q214 146 244 146 H404"/>
    <path d="M620 146 H780 Q810 146 810 176 V330"/>
    <path d="M810 694 V848 Q810 878 780 878 H620"/>
    <path d="M404 878 H244 Q214 878 214 848 V694"/>
  </g>
</svg>
