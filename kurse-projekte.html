<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">

<meta property="og:url" content="https://buildspaceos.de/kurse-projekte.html">

<meta name="twitter:title" content="Kurse &amp; Projekte – buildspace">
<meta name="twitter:description" content="Eigene Klassen/Kurse anlegen, Lernende per Kürzel/Pseudonym und individuellem Zugangscode verwalten (keine Klarnamen), Projekte mit Aufgaben zusammenstellen und veröffentlichen, und den Fortschritt aller Lernenden in einer Übersicht verfolgen.">
<meta name="twitter:image" content="https://buildspaceos.de/assets/og/kurse-projekte.jpg">
<link rel="stylesheet" href="assets/fonts/inter.css">
<style>
  :root{
    --bg:#f3f5f9;
    --panel:#ffffff;
    --panel-2:#f8fafc;
    --ink:#1b2433;
    --ink-soft:#64708a;
    --border:#e2e7ef;
    --primary:#2e6099;
    --primary-dark:#1e4472;
    --primary-ink:#ffffff;
    --primary-soft:#e6eef8;
    --accent:#0e8a7e;
    --accent-soft:#e0f4f1;
    --warn:#a8650a;
    --warn-soft:#fdf1dc;
    --danger:#c0392b;
    --danger-soft:#fbe9e7;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,35,60,.05), 0 10px 28px -16px rgba(20,35,60,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;line-height:1.45;-webkit-text-size-adjust:100%;
  }
  h1,h2,h3,h4{margin:0 0 .3em;letter-spacing:-.015em;line-height:1.2;}
  button{font-family:inherit;}
  .hidden{display:none !important;}
  a{color:var(--primary);}
  .muted{color:var(--ink-soft);}
  .small{font-size:.84rem;}

  /* ---------- Kopfzeile ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar-in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .back{color:var(--ink-soft);text-decoration:none;font-size:.85rem;font-weight:600;white-space:nowrap;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem;margin-right:auto;}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;font-size:.95rem;}
  .account-bar{font-size:.8rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .account-bar button{background:none;border:none;color:var(--primary);text-decoration:underline;cursor:pointer;font:inherit;padding:0;}

  /* ---------- Grundlayout ---------- */
  .app{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start;}
  .sidebar{position:sticky;top:72px;display:flex;flex-direction:column;gap:12px;}
  .main{min-width:0;}
  @media(max-width:860px){
    .app{grid-template-columns:1fr;padding:12px;}
    .sidebar{position:static;}
    .class-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
    .class-nav .nav-item{flex:0 0 auto;min-width:150px;margin:0;}
  }

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
  .card + .card{margin-top:14px;}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .card-title h3{margin:0;font-size:1.02rem;}

  /* ---------- Seitenleiste ---------- */
  .side-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:2px 4px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 10px;cursor:pointer;color:var(--ink);margin-bottom:3px;font-size:.92rem;}
  .nav-item:hover{background:var(--panel-2);}
  .nav-item.active{background:var(--primary-soft);border-color:#c9d9ee;}
  .nav-item .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);font-size:.95rem;flex:0 0 auto;font-weight:800;color:var(--primary);}
  .nav-item.active .ico{background:var(--primary);color:#fff;}
  .nav-item .t{min-width:0;flex:1;}
  .nav-item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;}
  .nav-item .t span{font-size:.74rem;color:var(--ink-soft);}
  .new-class{display:flex;gap:6px;margin-top:8px;}
  .new-class input{flex:1;min-width:0;}

  /* ---------- Bedienelemente ---------- */
  .btn{appearance:none;border:1px solid transparent;border-radius:10px;padding:9px 14px;min-height:40px;font-size:.88rem;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .05s ease,background .15s,opacity .15s;background:var(--primary-soft);color:var(--primary-dark);white-space:nowrap;text-decoration:none;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{background:var(--panel-2);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-sm{padding:6px 10px;min-height:34px;font-size:.8rem;border-radius:9px;}
  .btn-icon{width:36px;min-height:36px;padding:0;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  input[type=text],input[type=number],input[type=datetime-local],textarea,select{width:100%;padding:9px 11px;min-height:40px;border:1.5px solid var(--border);border-radius:10px;font-size:.92rem;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  label{display:block;font-weight:650;font-size:.8rem;margin:12px 0 5px;color:var(--ink-soft);}
  .field-hint{font-size:.76rem;color:var(--ink-soft);margin-top:4px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row > .grow{flex:1;min-width:180px;}

  .msg{padding:9px 12px;border-radius:10px;font-size:.83rem;margin-top:10px;}
  .msg-error{background:var(--danger-soft);color:var(--danger);}
  .msg-ok{background:var(--accent-soft);color:var(--accent);}
  .empty-hint{color:var(--ink-soft);font-size:.88rem;padding:12px 4px;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .pill-live{background:var(--accent-soft);color:var(--accent);}
  .pill-draft{background:var(--warn-soft);color:var(--warn);}
  .pill-expired{background:var(--danger-soft);color:var(--danger);}
  .pill-neutral{background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--border);}

  .bar{height:7px;border-radius:999px;background:#e9eef5;overflow:hidden;}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;}

  /* ---------- Klassenkopf & Reiter ---------- */
  .class-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  input.class-name-input{font-size:1.55rem !important;font-weight:800;letter-spacing:-.02em;border:none !important;background:transparent !important;padding:0 !important;min-height:0 !important;width:100%;color:var(--ink);}
  input.class-name-input:focus{outline:2px solid var(--primary) !important;border-radius:6px;}
  .subtabs{display:flex;gap:4px;background:#e8edf4;padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto;}
  .subtab{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 12px;font-weight:650;font-size:.88rem;color:var(--ink-soft);cursor:pointer;white-space:nowrap;min-height:40px;}
  .subtab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,35,60,.12);}
  .subtab .count{font-size:.72rem;background:var(--panel-2);border-radius:999px;padding:1px 7px;margin-left:4px;color:var(--ink-soft);}

  /* ---------- Übersicht ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .stat b{display:block;font-size:1.45rem;letter-spacing:-.02em;}
  .stat span{font-size:.78rem;color:var(--ink-soft);}
  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  .quick button{flex-direction:column;align-items:flex-start;text-align:left;padding:14px;min-height:84px;white-space:normal;border-radius:12px;}
  .quick button .q-ico{font-size:1.25rem;}
  .quick button small{font-weight:500;color:var(--ink-soft);font-size:.76rem;}
  .proj-line{display:grid;grid-template-columns:1fr 150px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .proj-line:last-child{border-bottom:none;}
  .proj-line .t{min-width:0;}
  .proj-line .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:600px){.proj-line{grid-template-columns:1fr;}}
  .access-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .access-box .qr-mini{width:96px;height:96px;flex:0 0 auto;cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:4px;background:#fff;}
  .access-box .qr-mini svg{width:100%;height:100%;display:block;}
  .url-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;word-break:break-all;}

  /* Klassen-Kacheln (Startansicht) */
  .class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .class-tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:10px;}
  .class-tile:hover{border-color:#c9d9ee;}
  .class-tile h3{margin:0;font-size:1.08rem;}
  .steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px;}
  .steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.9rem;}
  .steps li:before{content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;}

  /* ---------- Lernende ---------- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .seg{display:inline-flex;background:#e8edf4;border-radius:10px;padding:3px;}
  .seg button{border:none;background:transparent;border-radius:8px;padding:6px 12px;font-weight:650;font-size:.82rem;color:var(--ink-soft);cursor:pointer;min-height:34px;}
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,35,60,.12);}
  .stu-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .stu-row:last-child{border-bottom:none;}
  .stu-row .num{font-size:.76rem;color:var(--ink-soft);text-align:right;}
  .stu-name{border:1px solid transparent !important;background:transparent !important;font-weight:650;padding:5px 7px !important;min-height:34px !important;}
  .stu-name:hover{border-color:var(--border) !important;}
  .stu-name:focus{background:#fff !important;}
  .code-chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.14em;background:var(--primary-soft);color:var(--primary-dark);padding:4px 9px;border-radius:8px;font-size:.84rem;}
  .stu-actions{display:flex;gap:5px;}
  @media(max-width:560px){
    .stu-row{grid-template-columns:minmax(0,1fr) auto;}
    .stu-row .num{display:none;}
    .stu-actions{grid-column:1 / -1;}
  }
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .qr-card{border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;background:#fff;cursor:pointer;font:inherit;color:inherit;}
  .qr-card:hover{border-color:var(--primary);}
  .qr-card .qn{font-weight:700;font-size:.88rem;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qr-card svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto;}
  .qr-card .qc{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.16em;margin-top:6px;}
  details.gen{background:var(--panel-2);border:1.5px dashed var(--border);border-radius:12px;padding:10px 12px;margin-top:12px;}
  details.gen summary{cursor:pointer;font-weight:650;font-size:.9rem;}

  /* ---------- Projekte ---------- */
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-btn{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:650;cursor:pointer;color:var(--ink-soft);min-height:34px;}
  .chip-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .proj{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .proj.open{border-color:#c9d9ee;}
  .proj-head{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 16px;cursor:pointer;}
  .proj-head .chev{transition:transform .2s;color:var(--ink-soft);}
  .proj.open .proj-head .chev{transform:rotate(90deg);}
  .proj-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem;}
  .proj-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:.78rem;color:var(--ink-soft);}
  .proj-head .side{display:flex;align-items:center;gap:10px;}
  .proj-head .side .bar{width:90px;}
  @media(max-width:560px){.proj-head .side .bar{display:none;}}
  .proj-body{border-top:1px solid var(--border);padding:16px;background:var(--panel-2);}
  .proj-section{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .proj-section h4{font-size:.86rem;margin:0 0 10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .project-title-input{font-weight:800;font-size:1.05rem;}
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}

  .task-card{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fff;}
  .task-card-head{display:flex;align-items:center;gap:6px;}
  .task-no{flex:0 0 26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary-dark);font-weight:800;font-size:.8rem;display:grid;place-items:center;}
  .task-title-input{flex:1;border:1px solid transparent !important;background:transparent !important;font-weight:650;padding:5px 7px !important;min-height:34px !important;}
  .task-title-input:hover{border-color:var(--border) !important;}
  .task-title-input:focus{background:#fff !important;}
  .task-preview{margin:4px 0 2px 32px;}
  .task-editor{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}

  /* Rich-Text-Editor (siehe richtext.js) */
  .richtext-wrap{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
  .richtext-toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--border);background:var(--panel-2);}
  .richtext-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:6px 10px;font-size:.8rem;cursor:pointer;color:var(--ink);min-height:32px;}
  .richtext-btn:hover{background:var(--primary-soft);}
  .richtext-editable{min-height:90px;padding:10px 12px;font-size:.9rem;outline:none;}
  .richtext-editable:empty:before{content:attr(data-placeholder);color:var(--ink-soft);}
  .richtext-content{line-height:1.5;}
  .richtext-content h3{font-size:1rem;margin:.4em 0 .2em;}
  .richtext-content ul,.richtext-content ol{margin:.3em 0;padding-left:1.4em;}
  .richtext-content p{margin:.3em 0;}

  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-dark);border-radius:999px;padding:5px 11px;font-size:.8rem;text-decoration:none;}
  .chip button{border:none;background:none;color:inherit;cursor:pointer;font-size:.95em;padding:0 2px;line-height:1;}

  /* ---------- Fortschritt ---------- */
  .progress-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;align-items:center;}
  table.progress-table{width:100%;border-collapse:collapse;font-size:.85rem;}
  table.progress-table th,table.progress-table td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:middle;}
  table.progress-table th{background:var(--panel-2);font-weight:700;font-size:.8rem;max-width:180px;}
  table.progress-table td.name-cell,table.progress-table th.name-cell{position:sticky;left:0;background:#fff;z-index:1;min-width:150px;}
  table.progress-table th.name-cell{background:var(--panel-2);}
  table.progress-table td.sum-cell{min-width:110px;}
  table.progress-table tfoot td{background:var(--panel-2);font-weight:700;font-size:.8rem;}
  .cell{display:inline-flex;align-items:center;gap:4px;}
  .status-badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;}
  .status-offen{background:#eef0f3;color:#6c7383;}
  .status-in_arbeit{background:var(--warn-soft);color:var(--warn);}
  .status-fertig{background:var(--accent-soft);color:var(--accent);}
  .submission-text{white-space:pre-wrap;background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:6px;}

  /* ---------- Dialoge ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,22,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;}
  .modal-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .qr-modal .modal-box{max-width:520px;text-align:center;}
  .qr-big-name{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 10px;}
  .qr-big svg{width:min(70vw,48vh,360px);height:auto;display:block;margin:0 auto;}
  .qr-big-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2rem;font-weight:800;letter-spacing:.25em;margin-top:10px;}
  .qr-big-url{font-size:.8rem;color:var(--ink-soft);word-break:break-all;margin-top:4px;}
  .qr-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .qr-modal.presenting{padding:0;background:#fff;}
  .qr-modal.presenting .modal-box{max-width:none;max-height:none;height:100%;border-radius:0;box-shadow:none;display:flex;flex-direction:column;justify-content:center;}
  .qr-modal.presenting .qr-big svg{width:min(80vw,62vh);}
  .qr-modal.presenting .qr-big-name{font-size:2.6rem;}
  .qr-modal.presenting .qr-big-code{font-size:3rem;}
  .modal-close-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}

  /* ---------- Druck: QR-Karten (feste A4-Seiten, nie zerschnitten) ---------- */
  #printArea{display:none;}
  @media print{
    @page{size:A4 portrait;margin:10mm;}
    html,body{background:#fff !important;}
    body.printing > *:not(#printArea){display:none !important;}
    body.printing #printArea{display:block !important;}

<script>
/* =========================================================================
   KURSE & PROJEKTE
   -------------------------------------------------------------------------
   Lehrkraft-Tool ("digitaler Klassenraum") zum Anlegen von Klassen/Kursen,
   Schüler:innen (nur Kürzel/Pseudonym -- bewusst datensparsam) und
   Projekten mit Aufgaben, die für Lernende freigegeben werden können.
   Lernende erreichen ihre Aufgaben über lernbereich.html mit ihrem
   persönlichen Zugangscode (kein eigenes Konto nötig).

   SICHERHEITSMODELL (siehe auch cm-auth.js/protect.js):
   Der Lehrkraft-Bereich ist durch eine echte, individuelle Google-Anmeldung
   UND durch Firestore-Regeln geschützt, die jede Klasse, jede/n Schüler:in
   und jedes Projekt an die anlegende Lehrkraft (ownerUid) binden.
   Der Lernenden-Zugang bleibt bewusst ohne Konto: Sicherheit entsteht dort
   durch einen individuellen, schwer erratbaren Zugangscode. GENAU DESHALB
   werden hier nur Pseudonyme gespeichert, niemals Klarnamen.

   WICHTIG für Marc: Ob ein privates Firebase-Projekt für Schüler:innendaten
   an einer hessischen Schule zulässig ist, bitte mit der/dem schulischen
   Datenschutzbeauftragten klären.

   Datenmodell unverändert (classes, students, projects, taskProgress) --
   lernbereich.html und firestore.rules müssen dafür nicht angepasst werden. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAt35KpU63iGk8UAX5X4T5Vj18zPf_JUus",
  authDomain: "kanban-board-281da.firebaseapp.com",
  projectId: "kanban-board-281da",
  storageBucket: "kanban-board-281da.firebasestorage.app",
  messagingSenderId: "210909884248",
  appId: "1:210909884248:web:10ffacb3a74f7b3c887f2d"
};
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // ohne 0/O/1/I/L

let db = null;
let currentTeacher = null;
let myClasses = [];
let myStudentsByClass = {}; // classId -> [ {code, pseudonym, createdAt} ]
let myProjects = [];
let progressEntries = {};   // "code_taskId" -> taskProgress-Datensatz
let progressLoaded = false;

/* UI-Zustand (pro Gerät gemerkt) */
const UI_KEY = "kp_ui_v2";
const ui = { classId: null, sub: "overview", studentsView: "list", projectFilter: "all", progressProjectId: null };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || "{}")); } catch (e) {}
function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} }

/* Auf-/zugeklappte Bereiche bleiben über Neu-Rendern hinweg erhalten */
const openProjects = new Set();
const openProjectDescEditors = new Set();
const openTaskEditors = new Set();
let projectDescEditors = {};
let taskDescEditors = {};

/* ---------- Hilfsfunktionen ---------- */
function esc(s) {
  return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function genCode() {
  let s = "";
  const max = 256 - (256 % CODE_CHARS.length);
  while (s.length < 6) {
    const buf = crypto.getRandomValues(new Uint8Array(16));
    for (const b of buf) if (b < max && s.length < 6) s += CODE_CHARS[b % CODE_CHARS.length];
  }
  return s;
}
function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random())).slice(0, 24);
}
function taskEditorKey(projectId, taskId) { return JSON.stringify([projectId, taskId]); }
const NAME_ADJECTIVES = ["Blaue", "Rote", "Grüne", "Gelbe", "Lila", "Orange", "Silberne", "Goldene", "Mutige", "Schnelle", "Kluge", "Wilde", "Stille", "Freche", "Coole", "Helle", "Dunkle", "Bunte", "Flinke", "Ruhige"];
const NAME_ANIMALS = ["Eule", "Fuchs", "Delfin", "Panda", "Tiger", "Adler", "Wolf", "Hase", "Biene", "Qualle", "Krake", "Falke", "Luchs", "Otter", "Waschbär", "Igel", "Pinguin", "Koala", "Löwe", "Reh"];
function randomPseudonym(usedSet) {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  for (let i = 0; i < 200; i++) {
    const combo = pick(NAME_ADJECTIVES) + " " + pick(NAME_ANIMALS);
    if (!usedSet.has(combo)) { usedSet.add(combo); return combo; }
  }
  const base = pick(NAME_ADJECTIVES) + " " + pick(NAME_ANIMALS);
  let n = 2;
  while (usedSet.has(base + " " + n)) n++;
  usedSet.add(base + " " + n);
  return base + " " + n;
}
function toDatetimeLocalValue(ms) {
  const d = new Date(ms), pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatDateTime(ms) {
  const d = new Date(ms), pad = n => String(n).padStart(2, "0");
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function lernbereichBase() {
  return location.origin + location.pathname.replace(/kurse-projekte\.html$/, "lernbereich.html");
}
function studentUrl(code) { return `${lernbereichBase()}?code=${code}`; }
function qrSvg(text, cellSize) {
  if (!window.qrcode) return '<div class="small muted" style="padding:20px">QR lädt…</div>';
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize: cellSize || 4, margin: 2, scalable: true });
}
function studentsOf(classId) { return myStudentsByClass[classId] || []; }
function projectsOf(classId) { return myProjects.filter(p => p.classId === classId); }
function currentClass() { return myClasses.find(c => c.id === ui.classId) || null; }
function isProjectVisibleNow(p) {
  return !!p.published && (!p.visibleUntil || Date.now() < p.visibleUntil);
}
function projectState(p) {
  if (isProjectVisibleNow(p)) return "live";
  if (p.published && p.visibleUntil && Date.now() >= p.visibleUntil) return "expired";
  return "draft";
}
function statusPill(p) {
  const s = projectState(p);
  if (s === "live") return `<span class="pill pill-live">● sichtbar${p.visibleUntil ? " bis " + esc(formatDateTime(p.visibleUntil)) : ""}</span>`;
  if (s === "expired") return `<span class="pill pill-expired">abgelaufen ${esc(formatDateTime(p.visibleUntil))}</span>`;
  return '<span class="pill pill-draft">Entwurf</span>';
}
function projectStats(p) {
  const st = studentsOf(p.classId), tasks = p.tasks || [];
  const total = st.length * tasks.length;
  let done = 0, subs = 0;
  st.forEach(s => tasks.forEach(t => {
    const e = progressEntries[s.code + "_" + t.id];
    if (e && e.status === "fertig") done++;
    if (e && e.submissionText) subs++;
  }));
  return { total, done, subs, pct: total ? Math.round(done / total * 100) : 0 };
}
function flash(el, text, ok) {
  if (!el) return;
  el.innerHTML = `<div class="msg ${ok ? "msg-ok" : "msg-error"}">${esc(text)}</div>`;
  if (ok) setTimeout(() => { if (el) el.innerHTML = ""; }, 2200);
}
function copyText(text, btn) {
  const done = ok => {
    if (!btn) return;
    const old = btn.innerHTML;
    btn.innerHTML = ok ? "✓ Kopiert" : "Nicht möglich";
    setTimeout(() => { btn.innerHTML = old; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => { prompt("Zum Kopieren:", text); done(false); });
  } else { prompt("Zum Kopieren:", text); }
}

/* ---------- Start: dieselbe Anmeldung wie Classroom Management ----------
   boot() erst, wenn protect.js die Seite freigegeben hat (Klasse
   "protect-ready" am <html>), dann das tiefere Google-Anmelde-Gate. */
let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  if (!window.Protect || !window.Protect.guardClassroomManagement) {
    document.getElementById("mainArea").innerHTML = '<div class="card"><p class="msg msg-error">Anmeldung konnte nicht geladen werden. Bitte Seite neu laden.</p></div>';
    return;
  }
  window.Protect.guardClassroomManagement((cmAuthInfo) => {
    currentTeacher = cmAuthInfo;
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    renderAccountBar();
    loadAll();
  });
}
function renderAccountBar() {
  document.getElementById("accountBar").innerHTML =
    `<span>${esc(currentTeacher.user.email)}</span> · <button type="button" onclick="signOutAndLeave()">Abmelden</button>`;
}
function signOutAndLeave() {
  if (window.CmAuth) window.CmAuth.signOut();
  location.href = "index.html#/schule/faecheruebergreifend";
}
window.render = boot;
(function waitForProtectReady() {
  const root = document.documentElement;
  if (root.classList.contains("protect-ready")) { boot(); return; }
  const obs = new MutationObserver(() => {
    if (root.classList.contains("protect-ready")) { obs.disconnect(); boot(); }
  });
  obs.observe(root, { attributes: true, attributeFilter: ["class"] });
})();

/* ---------- Daten laden ---------- */
function loadClasses() {
  return db.collection("classes").where("ownerUid", "==", currentTeacher.user.uid).get().then(snap => {
    myClasses = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  });
}
function loadStudents() {
  return db.collection("students").where("ownerUid", "==", currentTeacher.user.uid).get().then(snap => {
    const by = {};
    snap.docs.forEach(d => {
      const s = { code: d.id, ...d.data() };
      (by[s.classId] = by[s.classId] || []).push(s);
    });
    Object.values(by).forEach(list => list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
    myStudentsByClass = by;
  });
}
function loadProjects() {
  return db.collection("projects").where("ownerUid", "==", currentTeacher.user.uid).get().then(snap => {
    myProjects = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  });
}
function loadProgress() {
  return db.collection("taskProgress").where("ownerUid", "==", currentTeacher.user.uid).get().then(snap => {
    progressEntries = {};
    snap.docs.forEach(d => { progressEntries[d.id] = d.data(); });
    progressLoaded = true;
  });
}
function loadAll() {
  Promise.all([loadClasses(), loadStudents(), loadProjects()])
    .then(() => {
      if (ui.classId && !currentClass()) ui.classId = null;
      draw();
      return loadProgress().then(() => {
        /* Nur Ansichten neu zeichnen, die Fortschritt zeigen -- offene
           Editoren im Projekte-Reiter bleiben unangetastet. */
        if (!ui.classId || ui.sub === "overview" || ui.sub === "progress") draw();
      });
    })
    .catch(err => {
      document.getElementById("mainArea").innerHTML = `<div class="card"><div class="msg msg-error">Daten konnten nicht geladen werden (${esc(err.message)}).</div></div>`;
    });
}

/* ---------- Navigation ---------- */
function goHome() { ui.classId = null; saveUi(); draw(); window.scrollTo(0, 0); }
function openClass(id, sub) {
  ui.classId = id;
  if (sub) ui.sub = sub;
  saveUi(); draw(); window.scrollTo(0, 0);
}
function setSub(sub) {
  ui.sub = sub; saveUi(); draw();
  if (sub === "progress") refreshProgress();
}
function goProject(projectId) {
  openProjects.add(projectId);
  ui.sub = "projects"; ui.projectFilter = "all"; saveUi(); draw();
  const el = document.getElementById("proj-" + projectId);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function goProgress(projectId) {
  ui.progressProjectId = projectId; setSub("progress");
}

/* ---------- Zeichnen ---------- */
function draw() {
  renderSidebar();
  const main = document.getElementById("mainArea");
  const cls = currentClass();
  main.innerHTML = cls ? viewClass(cls) : viewHome();
  if (cls && ui.sub === "projects") mountOpenEditors();
}
function renderSidebar() {
  document.getElementById("navHome").classList.toggle("active", !ui.classId);
  const nav = document.getElementById("classNav");
  if (!myClasses.length) { nav.innerHTML = '<p class="empty-hint" style="padding:4px">Noch keine Klasse.</p>'; return; }
  nav.innerHTML = myClasses.map(c => {
    const n = studentsOf(c.id).length, live = projectsOf(c.id).filter(isProjectVisibleNow).length;
    const initials = esc((c.name || "?").replace(/\s+/g, "").slice(0, 2));
    return `<button class="nav-item ${c.id === ui.classId ? "active" : ""}" onclick="openClass('${c.id}')">
      <span class="ico">${initials}</span>
      <span class="t"><b>${esc(c.name)}</b><span>${n} Lernende · ${live} sichtbar</span></span>
    </button>`;
  }).join("");
}

/* Startansicht: alle Klassen als Kacheln */
function viewHome() {
  if (!myClasses.length) {
    return `<div class="card">
      <h2>Willkommen in deinem Klassenraum</h2>
      <p class="muted" style="margin:0">Aufgaben, Projekte und Abgaben für deine Lerngruppen – ohne Schülerkonten, nur mit Pseudonym und Zugangscode.</p>
      <ol class="steps">
        <li><span><b>Klasse anlegen</b> – links unter „Neue Klasse“.</span></li>
        <li><span><b>Lernende erzeugen</b> – zufällige Pseudonyme mit persönlichem Zugangscode.</span></li>
        <li><span><b>QR-Codes zeigen oder drucken</b> – einzeln am Beamer oder als Karten zum Austeilen.</span></li>
        <li><span><b>Projekt mit Aufgaben</b> anlegen und veröffentlichen.</span></li>
        <li><span><b>Fortschritt &amp; Abgaben</b> live verfolgen.</span></li>
      </ol>
    </div>`;
  }
  return `
    <div class="class-head"><div><div class="eyebrow">Überblick</div><h1 style="margin:0">Deine Klassen &amp; Kurse</h1></div></div>
    <div class="class-grid">
      ${myClasses.map(c => {
        const st = studentsOf(c.id), ps = projectsOf(c.id), live = ps.filter(isProjectVisibleNow);
        const agg = live.reduce((a, p) => { const s = projectStats(p); a.t += s.total; a.d += s.done; return a; }, { t: 0, d: 0 });
        const pct = agg.t ? Math.round(agg.d / agg.t * 100) : 0;
        return `<button class="class-tile" onclick="openClass('${c.id}','overview')">
          <h3>${esc(c.name)}</h3>
          <div class="small muted">👤 ${st.length} Lernende · 📁 ${ps.length} Projekte (${live.length} sichtbar)</div>
          <div>
            <div class="bar"><span style="width:${pct}%"></span></div>
            <div class="small muted" style="margin-top:4px">${live.length ? (progressLoaded ? pct + " % der sichtbaren Aufgaben erledigt" : "Fortschritt lädt…") : "Kein Projekt sichtbar"}</div>
          </div>
        </button>`;
      }).join("")}
    </div>`;
}

/* Klassenraum mit Reitern */
function viewClass(cls) {
  const st = studentsOf(cls.id), ps = projectsOf(cls.id);
  const tabs = [
    ["overview", "Übersicht", ""],
    ["students", "Lernende", st.length],
    ["projects", "Projekte", ps.length],
    ["progress", "Fortschritt", ""]
  ];
  let body = "";
  if (ui.sub === "students") body = viewStudents(cls);
  else if (ui.sub === "projects") body = viewProjects(cls);
  else if (ui.sub === "progress") body = viewProgress(cls);
  else body = viewOverview(cls);
  return `
    <div class="class-head">
      <div style="flex:1;min-width:0">
        <div class="eyebrow">Klasse / Kurs</div>
        <input type="text" class="class-name-input" value="${esc(cls.name)}" aria-label="Name der Klasse" onchange="renameClass('${cls.id}', this.value)">
      </div>
    </div>
    <nav class="subtabs" role="tablist">
      ${tabs.map(([id, label, count]) => `<button class="subtab ${ui.sub === id ? "active" : ""}" onclick="setSub('${id}')">${label}${count !== "" ? `<span class="count">${count}</span>` : ""}</button>`).join("")}
    </nav>
    ${body}`;
}

function viewOverview(cls) {
  const st = studentsOf(cls.id), ps = projectsOf(cls.id);
  const live = ps.filter(isProjectVisibleNow), drafts = ps.filter(p => projectState(p) === "draft");
  const agg = live.reduce((a, p) => { const s = projectStats(p); a.t += s.total; a.d += s.done; a.s += s.subs; return a; }, { t: 0, d: 0, s: 0 });
  const base = lernbereichBase();
  return `
    <div class="stats">
      <div class="stat"><b>${st.length}</b><span>Lernende</span></div>
      <div class="stat"><b>${live.length}</b><span>Projekte sichtbar</span></div>
      <div class="stat"><b>${drafts.length}</b><span>Entwürfe</span></div>
      <div class="stat"><b>${progressLoaded ? (agg.t ? Math.round(agg.d / agg.t * 100) : 0) + " %" : "…"}</b><span>erledigt (sichtbare Projekte)</span></div>
    </div>

    <div class="card">
      <div class="card-title"><h3>Schnellzugriff</h3></div>
      <div class="quick">
        <button class="btn btn-ghost" onclick="setSub('students')"><span class="q-ico">🎲</span>Lernende anlegen<small>Pseudonyme &amp; Zugangscodes</small></button>
        <button class="btn btn-ghost" onclick="openQr(0)" ${st.length ? "" : "disabled"}><span class="q-ico">▦</span>QR-Codes zeigen<small>einzeln durchblättern, Beamer</small></button>
        <button class="btn btn-ghost" onclick="printCards()" ${st.length ? "" : "disabled"}><span class="q-ico">🖨️</span>QR-Karten drucken<small>9 pro A4-Seite</small></button>

/* ---------- Klassen ---------- */
function createClass() {
  const input = document.getElementById("newClassName");
  const name = input.value.trim();
  const msg = document.getElementById("classMsg");
  if (!name) { flash(msg, "Bitte einen Namen eingeben."); input.focus(); return; }
  db.collection("classes").add({ ownerUid: currentTeacher.user.uid, name, createdAt: Date.now() })
    .then(ref => { input.value = ""; msg.innerHTML = ""; return loadClasses().then(() => openClass(ref.id, "students")); })
    .catch(err => flash(msg, "Fehler: " + err.message));
}
function renameClass(classId, value) {
  const name = value.trim();
  const c = myClasses.find(x => x.id === classId);
  if (!name || !c) { draw(); return; }
  c.name = name;
  db.collection("classes").doc(classId).update({ name }).then(renderSidebar)
    .catch(err => alert("Speichern fehlgeschlagen: " + err.message));
}
function deleteClass(classId) {
  const c = myClasses.find(x => x.id === classId);
  const ns = studentsOf(classId).length, np = projectsOf(classId).length;
  if (!confirm(`„${c ? c.name : ""}“ löschen?\n\n${ns} Lernenden-Codes und ${np} Projekte werden ebenfalls gelöscht. Das lässt sich nicht rückgängig machen.`)) return;
  const deletes = studentsOf(classId).map(s => db.collection("students").doc(s.code).delete())
    .concat(projectsOf(classId).map(p => db.collection("projects").doc(p.id).delete()));
  Promise.all(deletes)
    .then(() => db.collection("classes").doc(classId).delete())
    .then(() => { ui.classId = null; saveUi(); return Promise.all([loadClasses(), loadStudents(), loadProjects()]); })
    .then(draw)
    .catch(err => alert("Löschen fehlgeschlagen: " + err.message));
}

/* ---------- Lernende ---------- */

        <button class="btn btn-sm" title="QR-Code anzeigen" onclick="openQr(${i})">▦ QR</button>

        <summary>🎲 Mehrere Lernende mit zufälligen Pseudonymen anlegen</summary>
        <div class="row" style="margin-top:10px">
          <div style="width:110px"><label for="randomStudentCount" style="margin-top:0">Anzahl</label><input type="number" id="randomStudentCount" min="1" max="60" value="25"></div>
          <label style="display:flex;align-items:center;gap:6px;margin:0 0 10px;font-weight:600;color:var(--ink)"><input type="checkbox" id="randomPrint" checked style="width:18px;height:18px"> danach QR-Karten drucken</label>

      <div class="toolbar">
        <div class="btn-row">

            <button class="${ui.studentsView !== "qr" ? "active" : ""}" onclick="ui.studentsView='list';saveUi();draw()">☰ Liste</button>

          <button class="btn btn-sm" onclick="openQr(0)" ${students.length ? "" : "disabled"}>⛶ Einzeln zeigen</button>

        : '<p class="empty-hint">Noch keine Lernenden in dieser Klasse.</p>'}

}
async function newUniqueCode() {
  let code, exists = true;
  while (exists) {
    code = genCode();
    exists = (await db.collection("students").doc(code).get()).exists;
  }
  return code;
}
async function addStudent() {
  const input = document.getElementById("newStudentName");
  const pseudonym = input.value.trim();
  const msg = document.getElementById("studentMsg");
  if (!pseudonym) { flash(msg, "Bitte ein Kürzel/Pseudonym eingeben."); input.focus(); return; }
  const btn = document.getElementById("addStudentBtn");
  btn.disabled = true;
  try {
    const code = await newUniqueCode();
    await db.collection("students").doc(code).set({ ownerUid: currentTeacher.user.uid, classId: ui.classId, pseudonym, createdAt: Date.now() });
    await loadStudents();
    draw();
    const again = document.getElementById("newStudentName");
    if (again) again.focus();
  } catch (err) {
    flash(msg, "Fehler: " + err.message);
    btn.disabled = false;
  }
}
async function generateRandomStudents() {
  const count = Math.max(1, Math.min(60, parseInt(document.getElementById("randomStudentCount").value) || 0));
  const doPrint = document.getElementById("randomPrint").checked;
  const msg = document.getElementById("randomGenMsg");
  const btn = document.getElementById("generateRandomBtn");
  btn.disabled = true;
  btn.textContent = "Wird erzeugt …";
  try {
    const used = new Set(studentsOf(ui.classId).map(s => s.pseudonym));
    for (let i = 0; i < count; i++) {
      btn.textContent = `Erzeuge ${i + 1} / ${count} …`;
      const code = await newUniqueCode();
      await db.collection("students").doc(code).set({ ownerUid: currentTeacher.user.uid, classId: ui.classId, pseudonym: randomPseudonym(used), createdAt: Date.now() });
    }
    await loadStudents();
    draw();
    if (doPrint) printCards();
  } catch (err) {
    flash(msg, "Fehler: " + err.message);
    btn.disabled = false;
    btn.textContent = "Erzeugen";
  }
}
function renameStudent(code, value) {
  const pseudonym = value.trim();
  const s = studentsOf(ui.classId).find(x => x.code === code);
  if (!pseudonym || !s) { draw(); return; }
  s.pseudonym = pseudonym;
  db.collection("students").doc(code).update({ pseudonym }).catch(err => alert("Speichern fehlgeschlagen: " + err.message));
}
function deleteStudent(code) {
  if (!confirm("Diese/n Lernende/n entfernen? Der Zugangscode funktioniert danach nicht mehr.")) return;
  db.collection("students").doc(code).delete().then(loadStudents).then(draw);
}

/* ---------- QR-Code groß anzeigen ----------
   Einzelansicht für eine Person (z. B. am Beamer oder auf dem iPad zum
   Scannen hinhalten), mit Vor/Zurück durch die ganze Klasse. */
let qrIndex = null; // null = allgemeiner Lernbereich-Link
function openQr(index) {
  const students = studentsOf(ui.classId);
  if (!students.length) return;
  qrIndex = Math.max(0, Math.min(students.length - 1, index));
  renderQrModal();
}
function openQrGeneral() { qrIndex = null; renderQrModal(); }
function qrStep(d) {
  const n = studentsOf(ui.classId).length;
  if (qrIndex == null || !n) return;
  qrIndex = (qrIndex + d + n) % n;
  renderQrModal();
}
function renderQrModal() {
  const modal = document.getElementById("qrModal");
  const box = document.getElementById("qrModalBox");
  const students = studentsOf(ui.classId);
  const cls = currentClass();
  let inner;
  if (qrIndex == null) {
    const base = lernbereichBase();
    inner = `
      <div class="eyebrow">${esc(cls ? cls.name : "")}</div>
      <div class="qr-big-name">Lernbereich</div>
      <div class="qr-big">${qrSvg(base, 8)}</div>
      <div class="qr-big-url" style="font-size:1rem;margin-top:12px">${esc(base)}</div>
      <p class="small muted">Scannen und den eigenen Zugangscode eingeben.</p>`;
  } else {
    const s = students[qrIndex];
    inner = `
      <div class="eyebrow">${esc(cls ? cls.name : "")} · ${qrIndex + 1} von ${students.length}</div>
      <div class="qr-big-name">${esc(s.pseudonym)}</div>
      <div class="qr-big">${qrSvg(studentUrl(s.code), 8)}</div>
      <div class="qr-big-code">${s.code}</div>
      <div class="qr-big-url">${esc(lernbereichBase())}</div>`;
  }
  box.innerHTML = `
    <div class="modal-close-row">
      <button class="btn btn-sm btn-ghost" onclick="toggleQrPresent()">${modal.classList.contains("presenting") ? "↙ Verkleinern" : "⛶ Vollbild"}</button>
      <button class="btn btn-sm btn-ghost" onclick="closeQr()">✕ Schließen</button>
    </div>
    ${inner}
    ${qrIndex != null ? `<div class="qr-nav">
      <button class="btn btn-ghost" onclick="qrStep(-1)">‹ Zurück</button>
      <button class="btn btn-sm" onclick="printCards(['${students[qrIndex].code}'])">🖨️ Diese Karte drucken</button>
      <button class="btn btn-ghost" onclick="qrStep(1)">Weiter ›</button>
    </div>` : ""}`;
  modal.classList.remove("hidden");
}
function toggleQrPresent() {
  const modal = document.getElementById("qrModal");
  const on = !modal.classList.contains("presenting");
  modal.classList.toggle("presenting", on);
  try {
    if (on && modal.requestFullscreen) modal.requestFullscreen().catch(() => {});
    else if (on && modal.webkitRequestFullscreen) modal.webkitRequestFullscreen();
    else if (!on && document.fullscreenElement) document.exitFullscreen();
    else if (!on && document.webkitFullscreenElement) document.webkitExitFullscreen();
  } catch (e) {}
  renderQrModal();
}
function closeQr() {
  const modal = document.getElementById("qrModal");
  modal.classList.add("hidden");
  modal.classList.remove("presenting");
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}
document.addEventListener("keydown", e => {
  if (document.getElementById("qrModal").classList.contains("hidden")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); qrStep(1); }
  else if (e.key === "ArrowLeft") qrStep(-1);
  else if (e.key === "Escape") closeQr();
});
document.addEventListener("fullscreenchange", () => {
  const modal = document.getElementById("qrModal");
  if (!document.fullscreenElement && modal.classList.contains("presenting")) { modal.classList.remove("presenting"); if (!modal.classList.contains("hidden")) renderQrModal(); }
});

/* ---------- QR-Karten drucken ----------
   Feste A4-Seiten mit je 3 × 3 Karten in Millimeter-Maßen. Jede Seite ist
   ein eigener Block mit Seitenumbruch danach -- dadurch kann keine Karte
   mehr über den Seitenrand laufen und "zerschnitten" werden. Gedruckt
   wird direkt aus dieser Seite (kein Pop-up, funktioniert auch auf dem
   iPad); alles außer #printArea wird beim Druck ausgeblendet. */
const CARDS_PER_PAGE = 9;
function printCards(codes) {
  const cls = currentClass();
  let students = studentsOf(ui.classId);
  if (codes) students = students.filter(s => codes.includes(s.code));
  if (!students.length) { alert("Diese Klasse hat noch keine Lernenden."); return; }
  if (!window.qrcode) { alert("Die QR-Code-Bibliothek lädt noch. Bitte kurz warten und erneut versuchen."); return; }
  const host = lernbereichBase().replace(/^https?:\/\//, "");
  const pages = [];
  for (let i = 0; i < students.length; i += CARDS_PER_PAGE) pages.push(students.slice(i, i + CARDS_PER_PAGE));
  document.getElementById("printArea").innerHTML = pages.map((chunk, pi) => `
    <section class="pp">
      <div class="pp-head">
        <div><b>${esc(cls ? cls.name : "")} – Zugangscodes</b><br>Ausschneiden und austeilen. Echten Namen nur von Hand eintragen.</div>
        <div>Seite ${pi + 1} / ${pages.length}</div>
      </div>
      <div class="pp-grid">
        ${chunk.map(s => `
          <div class="pc">
            <div class="pc-name">${esc(s.pseudonym)}</div>
            ${qrSvg(studentUrl(s.code), 4)}
            <div class="pc-code">${s.code}</div>
            <div class="pc-hint">QR scannen oder Code eingeben auf<br>${esc(host)}</div>
            <div class="pc-line">Name:<span></span></div>
          </div>`).join("")}
      </div>
    </section>`).join("");
  document.body.classList.add("printing");
  window.print();
}
window.addEventListener("afterprint", () => document.body.classList.remove("printing"));

/* ---------- Projekte ---------- */
function viewProjects(cls) {
  const all = projectsOf(cls.id);
  const counts = { all: all.length, live: 0, draft: 0, expired: 0 };

function toggleProject(projectId) {

          <div class="btn-row" style="margin-top:14px;justify-content:space-between">
            <button class="btn btn-sm" onclick="goProgress('${p.id}')">📊 Fortschritt ansehen</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProject('${p.id}')">Projekt löschen</button>
          </div>
        </div>
      </div>` : ""}
    </div>`;
}
/* Aufgabe: Titel direkt editierbar, Reihenfolge per ↑/↓, Details mit
   formatierter Beschreibung (richtext.js) und Links. Bewusst ohne
   Datei-Upload (Cloud Storage bräuchte den kostenpflichtigen Blaze-Tarif);
   Material wird per Link (z. B. Google Drive) eingebunden. */
function renderTaskCard(p, t, i, n) {
  const key = taskEditorKey(p.id, t.id);
  const open = openTaskEditors.has(key);
  const links = t.links || [];
  return `
    <div class="task-card">
      <div class="task-card-head">
        <span class="task-no">${i + 1}</span>
        <input type="text" class="task-title-input" value="${esc(t.title)}" aria-label="Titel der Aufgabe" onchange="updateTaskTitle('${p.id}', '${t.id}', this.value)">
        <button class="btn btn-sm btn-ghost btn-icon" title="Nach oben" ${i === 0 ? "disabled" : ""} onclick="moveTask('${p.id}','${t.id}',-1)">↑</button>
        <button class="btn btn-sm btn-ghost btn-icon" title="Nach unten" ${i === n - 1 ? "disabled" : ""} onclick="moveTask('${p.id}','${t.id}',1)">↓</button>
        <button class="btn btn-sm ${open ? "btn-primary" : "btn-ghost"}" onclick="toggleTaskEditor('${p.id}', '${t.id}')">${open ? "Schließen" : "✎ Details"}</button>
        <button class="btn btn-sm btn-ghost btn-icon" title="Aufgabe löschen" onclick="removeTask('${p.id}', '${t.id}')">✕</button>
      </div>
      ${!open && (t.description || links.length) ? `
        <div class="task-preview">
          ${t.description ? `<div class="richtext-content small muted">${RichText.sanitize(t.description)}</div>` : ""}
          ${links.length ? `<div class="small muted" style="margin-top:3px">🔗 ${links.map(l => esc(l.label)).join(" · ")}</div>` : ""}
        </div>` : ""}
      ${open ? `
        <div class="task-editor">
          <label style="margin-top:0">Ausführliche Beschreibung</label>
          <div id="taskDescEditor-${p.id}-${t.id}"></div>
          <button class="btn btn-sm btn-primary" style="margin-top:6px" onclick="saveTaskDescription('${p.id}', '${t.id}')">Beschreibung speichern</button>
          <div id="taskDescMsg-${p.id}-${t.id}"></div>
          <label style="margin-top:16px">Links für Lernende (z. B. Material bei Google Drive, Erklärvideo, buildspace-Tool)</label>
          ${links.length ? `<div class="chip-list">${links.map(l => `
            <span class="chip"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">🔗 ${esc(l.label)}</a><button type="button" title="Entfernen" onclick="removeTaskLink('${p.id}','${t.id}','${l.id}')">✕</button></span>`).join("")}</div>` : '<p class="empty-hint" style="padding:2px 0">Noch keine Links.</p>'}
          <div class="row">
            <div class="grow"><input type="text" id="newLinkLabel-${p.id}-${t.id}" placeholder="Bezeichnung (z. B. Erklärvideo)"></div>
            <div class="grow"><input type="text" id="newLinkUrl-${p.id}-${t.id}" placeholder="https://…" onkeydown="if(event.key==='Enter')addTaskLink('${p.id}','${t.id}')"></div>
            <button class="btn btn-sm" onclick="addTaskLink('${p.id}','${t.id}')">+ Link</button>
          </div>
        </div>` : ""}
    </div>`;
}
/* Nach jedem Neu-Rendern die offenen Rich-Text-Editoren neu einhängen
   (Startwert = zuletzt gespeicherter Inhalt). */
function mountOpenEditors() {
  projectDescEditors = {};
  taskDescEditors = {};
  openProjectDescEditors.forEach(projectId => {
    const container = document.getElementById("projectDescEditor-" + projectId);
    const p = myProjects.find(x => x.id === projectId);
    if (container && p) projectDescEditors[projectId] = RichText.mount(container, { initialHtml: p.description || "", placeholder: "Worum geht es im Projekt? Ziele, Ablauf, Abgabetermin…" });
  });
  openTaskEditors.forEach(key => {
    const [projectId, taskId] = JSON.parse(key);
    const p = myProjects.find(x => x.id === projectId);
    const t = p && (p.tasks || []).find(x => x.id === taskId);
    const container = document.getElementById(`taskDescEditor-${projectId}-${taskId}`);
    if (container && t) taskDescEditors[key] = RichText.mount(container, { initialHtml: t.description || "", placeholder: "Aufgabenstellung, Arbeitsschritte, Hinweise…" });
  });
}
function reloadProjects() { return loadProjects().then(draw); }
function updateProject(projectId, data) {
  return db.collection("projects").doc(projectId).update(data).catch(err => { alert("Speichern fehlgeschlagen: " + err.message); throw err; });
}
function createProject() {
  const titleInput = document.getElementById("newProjectTitle");
  const title = titleInput.value.trim();
  const raw = document.getElementById("newProjectVisibleUntil").value;
  const msg = document.getElementById("projectMsg");
  if (!title) { flash(msg, "Bitte einen Titel eingeben."); titleInput.focus(); return; }
  db.collection("projects").add({
    ownerUid: currentTeacher.user.uid, classId: ui.classId, title, description: "", tasks: [],
    published: false, visibleUntil: raw ? new Date(raw).getTime() : null, createdAt: Date.now()
  }).then(ref => {
    openProjects.add(ref.id);
    ui.projectFilter = "all";
    return reloadProjects().then(() => { const i = document.getElementById("newTaskTitle-" + ref.id); if (i) i.focus(); });
  }).catch(err => flash(msg, "Fehler: " + err.message));
}
function duplicateProject(projectId) {
  const p = myProjects.find(x => x.id === projectId);
  const target = document.getElementById("dupTarget-" + projectId).value;
  if (!p || !target) return;
  const tasks = (p.tasks || []).map(t => ({ id: uid(), title: t.title, description: t.description || "", links: (t.links || []).map(l => ({ id: uid(), label: l.label, url: l.url })) }));
  db.collection("projects").add({
    ownerUid: currentTeacher.user.uid, classId: target,
    title: target === p.classId ? p.title + " (Kopie)" : p.title,
    description: p.description || "", tasks, published: false, visibleUntil: null, createdAt: Date.now()
  }).then(ref => {
    openProjects.add(ref.id);
    if (target !== ui.classId) {
      const c = myClasses.find(x => x.id === target);
      alert(`Kopie als Entwurf in „${c ? c.name : ""}“ angelegt.`);
    }
    return reloadProjects();
  }).catch(err => alert("Kopieren fehlgeschlagen: " + err.message));
}
function deleteProject(projectId) {
  if (!confirm("Dieses Projekt inkl. aller Aufgaben löschen?")) return;
  openProjects.delete(projectId);
  openProjectDescEditors.delete(projectId);
  db.collection("projects").doc(projectId).delete().then(reloadProjects);
}
function toggleProjectPublished(projectId, published) {
  const p = myProjects.find(x => x.id === projectId);
  if (published && p && p.visibleUntil && Date.now() >= p.visibleUntil) {
    if (!confirm("Das „Sichtbar bis“-Datum liegt in der Vergangenheit. Limit entfernen und veröffentlichen?")) return;
    updateProject(projectId, { published: true, visibleUntil: null }).then(reloadProjects);
    return;
  }
  updateProject(projectId, { published }).then(reloadProjects);
}
function saveVisibleUntil(projectId) {
  const val = document.getElementById("visibleUntil-" + projectId).value;
  if (!val) { alert("Bitte Datum und Uhrzeit wählen – oder „Kein Limit“ nutzen."); return; }
  const ms = new Date(val).getTime();
  if (isNaN(ms)) { alert("Ungültiges Datum."); return; }
  updateProject(projectId, { visibleUntil: ms }).then(reloadProjects);
}
function clearVisibleUntil(projectId) { updateProject(projectId, { visibleUntil: null }).then(reloadProjects); }
function saveProjectTitle(projectId, value) {
  const title = value.trim();
  const p = myProjects.find(x => x.id === projectId);
  if (!title || !p) { draw(); return; }
  p.title = title;
  updateProject(projectId, { title }).then(draw);
}
function toggleProjectDescEditor(projectId) {
  if (openProjectDescEditors.has(projectId)) openProjectDescEditors.delete(projectId); else openProjectDescEditors.add(projectId);
  draw();
}
function saveProjectDescription(projectId) {
  const editor = projectDescEditors[projectId];
  if (!editor) return;
  const html = editor.getHtml();
  myProjects.find(x => x.id === projectId).description = html;
  const msg = document.getElementById("projectDescMsg-" + projectId);
  updateProject(projectId, { description: html }).then(() => flash(msg, "Gespeichert.", true)).catch(() => {});
}
function addTask(projectId) {
  const input = document.getElementById("newTaskTitle-" + projectId);
  const title = input.value.trim();
  if (!title) { input.focus(); return; }
  const p = myProjects.find(x => x.id === projectId);
  const tasks = (p.tasks || []).concat([{ id: uid(), title, description: "", links: [] }]);
  updateProject(projectId, { tasks }).then(reloadProjects).then(() => { const i = document.getElementById("newTaskTitle-" + projectId); if (i) i.focus(); });
}
function removeTask(projectId, taskId) {
  if (!confirm("Diese Aufgabe (inkl. Beschreibung und Links) löschen?")) return;
  const p = myProjects.find(x => x.id === projectId);
  openTaskEditors.delete(taskEditorKey(projectId, taskId));
  updateProject(projectId, { tasks: (p.tasks || []).filter(x => x.id !== taskId) }).then(reloadProjects);
}
function moveTask(projectId, taskId, dir) {
  const p = myProjects.find(x => x.id === projectId);
  const tasks = (p.tasks || []).slice();
  const i = tasks.findIndex(t => t.id === taskId), j = i + dir;
  if (i < 0 || j < 0 || j >= tasks.length) return;
  [tasks[i], tasks[j]] = [tasks[j], tasks[i]];
  p.tasks = tasks;
  draw();
  updateProject(projectId, { tasks }).catch(reloadProjects);
}
function updateTaskTitle(projectId, taskId, value) {
  const title = value.trim();
  const p = myProjects.find(x => x.id === projectId);
  const t = p && (p.tasks || []).find(x => x.id === taskId);
  if (!title || !t) { draw(); return; }
  t.title = title;
  updateProject(projectId, { tasks: p.tasks }).catch(() => {});
}
function toggleTaskEditor(projectId, taskId) {
  const key = taskEditorKey(projectId, taskId);
  if (openTaskEditors.has(key)) openTaskEditors.delete(key); else openTaskEditors.add(key);
  draw();
}
function saveTaskDescription(projectId, taskId) {
  const key = taskEditorKey(projectId, taskId);
  const editor = taskDescEditors[key];
  if (!editor) return;
  const p = myProjects.find(x => x.id === projectId);
  p.tasks.find(x => x.id === taskId).description = editor.getHtml();
  const msg = document.getElementById(`taskDescMsg-${projectId}-${taskId}`);
  updateProject(projectId, { tasks: p.tasks }).then(() => flash(msg, "Gespeichert.", true)).catch(() => {});
}
function addTaskLink(projectId, taskId) {
  const labelInput = document.getElementById(`newLinkLabel-${projectId}-${taskId}`);
  const urlInput = document.getElementById(`newLinkUrl-${projectId}-${taskId}`);
  let url = urlInput.value.trim();
  if (!url) { urlInput.focus(); return; }
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  const label = labelInput.value.trim() || url;
  const p = myProjects.find(x => x.id === projectId);
  const t = p.tasks.find(x => x.id === taskId);
  t.links = (t.links || []).concat([{ id: uid(), label, url }]);
  updateProject(projectId, { tasks: p.tasks }).then(draw);
}
function removeTaskLink(projectId, taskId, linkId) {
  const p = myProjects.find(x => x.id === projectId);
  const t = p.tasks.find(x => x.id === taskId);
  t.links = (t.links || []).filter(l => l.id !== linkId);
  updateProject(projectId, { tasks: p.tasks }).then(draw);
}

/* ---------- Fortschritt ---------- */
function refreshProgress() {
  return loadProgress().then(() => { if (ui.sub === "progress" || ui.sub === "overview" || !ui.classId) draw(); })
    .catch(err => {
      const w = document.getElementById("progressWrap");
      if (w) w.innerHTML = `<div class="msg msg-error">Fortschritt konnte nicht geladen werden (${esc(err.message)}).</div>`;
    });
}
function viewProgress(cls) {
  const ps = projectsOf(cls.id);
  if (!ps.length) return '<div class="card"><p class="empty-hint">Noch keine Projekte in dieser Klasse.</p></div>';
  if (!ps.find(p => p.id === ui.progressProjectId)) ui.progressProjectId = (ps.find(isProjectVisibleNow) || ps[0]).id;
  const project = ps.find(p => p.id === ui.progressProjectId);
  const students = studentsOf(cls.id);
  const tasks = project.tasks || [];
  const chips = ps.map(p => `<button class="chip-btn ${p.id === project.id ? "active" : ""}" onclick="ui.progressProjectId='${p.id}';saveUi();draw()">${esc(p.title)}${isProjectVisibleNow(p) ? "" : " · " + (projectState(p) === "draft" ? "Entwurf" : "abgelaufen")}</button>`).join("");
  let content;
  if (!progressLoaded) content = '<p class="muted small">Lädt Fortschritt…</p>';
  else if (!students.length) content = '<p class="empty-hint">Keine Lernenden in dieser Klasse.</p>';
  else if (!tasks.length) content = '<p class="empty-hint">Dieses Projekt hat noch keine Aufgaben.</p>';
  else {
    const statusLabel = { offen: "Offen", in_arbeit: "In Arbeit", fertig: "Fertig" };
    const statusIco = { offen: "⭕", in_arbeit: "✏️", fertig: "✅" };
    const st = (code, taskId) => { const e = progressEntries[code + "_" + taskId]; return (e && e.status) || "offen"; };
    const doneOf = s => tasks.filter(t => st(s.code, t.id) === "fertig").length;
    const totalCells = students.length * tasks.length;
    const allDone = students.reduce((n, s) => n + doneOf(s), 0);
    const finished = students.filter(s => doneOf(s) === tasks.length).length;
    const notStarted = students.filter(s => tasks.every(t => st(s.code, t.id) === "offen")).length;
    const subs = projectStats(project).subs;
    content = `
      <div class="stats">
        <div class="stat"><b>${totalCells ? Math.round(allDone / totalCells * 100) : 0} %</b><span>aller Aufgaben erledigt</span></div>
        <div class="stat"><b>${finished} / ${students.length}</b><span>mit allem fertig</span></div>
        <div class="stat"><b>${notStarted}</b><span>noch nicht angefangen</span></div>
        <div class="stat"><b>${subs}</b><span>Text-Abgaben</span></div>
      </div>
      <div class="progress-tools">
        <div class="legend">
          <span class="status-badge status-offen">⭕ Offen</span>
          <span class="status-badge status-in_arbeit">✏️ In Arbeit</span>
          <span class="status-badge status-fertig">✅ Fertig</span>
          <span class="muted">📄 = Abgabe ansehen</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-sm btn-ghost" onclick="exportProgressCsv()">⬇ CSV</button>
          <button class="btn btn-sm btn-ghost" onclick="refreshProgress()">↻ Aktualisieren</button>
        </div>
      </div>
      <div style="overflow-x:auto">
      <table class="progress-table">
        <thead><tr><th class="name-cell">Lernende</th><th>Gesamt</th>${tasks.map((t, i) => `<th title="${esc(t.title)}">${i + 1}. ${esc(t.title)}</th>`).join("")}</tr></thead>
        <tbody>
        ${students.map(s => {
          const d = doneOf(s);
          return `<tr>
            <td class="name-cell"><strong>${esc(s.pseudonym)}</strong><br><span class="small muted">${s.code}</span></td>
            <td class="sum-cell"><strong>${d} / ${tasks.length}</strong><div class="bar" style="margin-top:4px"><span style="width:${Math.round(d / tasks.length * 100)}%"></span></div></td>
            ${tasks.map(t => {
              const e = progressEntries[s.code + "_" + t.id];
              const status = st(s.code, t.id);
              return `<td><span class="cell"><span class="status-badge status-${status}">${statusIco[status] || ""} ${statusLabel[status] || esc(status)}</span>${e && e.submissionText ? `<button class="btn btn-sm btn-ghost btn-icon" title="Abgabe ansehen" onclick="showSubmission('${s.code}','${t.id}')">📄</button>` : ""}</span></td>`;
            }).join("")}
          </tr>`;
        }).join("")}
        </tbody>
        <tfoot><tr><td class="name-cell">Fertig</td><td>${allDone} / ${totalCells}</td>${tasks.map(t => `<td>${students.filter(s => st(s.code, t.id) === "fertig").length} / ${students.length}</td>`).join("")}</tr></tfoot>
      </table>
      </div>`;
  }
  return `
    <div class="card">
      <div class="card-title"><h3>Projekt wählen</h3>${statusPill(project)}</div>
      <div class="filters">${chips}</div>
    </div>
    <div class="card" id="progressWrap">${content}</div>`;
}
function exportProgressCsv() {
  const cls = currentClass();
  const project = myProjects.find(p => p.id === ui.progressProjectId);
  if (!cls || !project) return;
  const tasks = project.tasks || [];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const label = { offen: "offen", in_arbeit: "in Arbeit", fertig: "fertig" };
  const rows = [["Pseudonym", "Code", "Erledigt"].concat(tasks.map((t, i) => (i + 1) + ". " + t.title))];
  studentsOf(cls.id).forEach(s => {
    const sts = tasks.map(t => { const e = progressEntries[s.code + "_" + t.id]; return (e && e.status) || "offen"; });
    rows.push([s.pseudonym, s.code, sts.filter(x => x === "fertig").length + "/" + tasks.length].concat(sts.map(x => label[x] || x)));
  });
  const csv = "﻿" + rows.map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `Fortschritt ${cls.name} - ${project.title}.csv`.replace(/[\\/:*?"<>|]/g, "-");
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/* Text-Abgabe ansehen. Datei-Abgaben kommen per Mail (IServ), siehe
   submissionMailtoLink() in lernbereich.html. */
function showSubmission(code, taskId) {
  const entry = progressEntries[code + "_" + taskId];
  const project = myProjects.find(p => (p.tasks || []).some(t => t.id === taskId));
  const task = project && project.tasks.find(t => t.id === taskId);
  const student = Object.values(myStudentsByClass).reduce((a, b) => a.concat(b), []).find(s => s.code === code);
  document.getElementById("submissionModalBody").innerHTML = `
    <h3>${esc(task ? task.title : "Aufgabe")}</h3>
    <p class="small muted">${esc(student ? student.pseudonym : code)} (${esc(code)})${entry && entry.updatedAt ? " · zuletzt " + esc(formatDateTime(entry.updatedAt)) : ""}</p>
    ${entry && entry.submissionText ? `<div class="submission-text">${esc(entry.submissionText)}</div>` : '<p class="empty-hint">Kein Text abgegeben.</p>'}
    <p class="small muted" style="margin-top:14px">Falls eine Datei abgegeben wurde, kommt diese per E-Mail bei dir an.</p>`;
  document.getElementById("submissionModal").classList.remove("hidden");
}
function closeSubmissionModal() { document.getElementById("submissionModal").classList.add("hidden"); }
</script>
