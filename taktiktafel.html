<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taktiktafel</title>
<style>
:root{--bg:#0b0c10;--ink:#f4f6fb;--soft:#aeb0b8;--line:rgba(255,255,255,.2);--ok:#7bd8a4;--bad:#ff8a80;--glass:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5;padding:76px 16px 120px;background:radial-gradient(1000px 600px at 12% -10%,#262932,transparent),radial-gradient(900px 600px at 100% 115%,#1c1e26,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 10px}
.lead{color:var(--soft);margin:0 0 20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.4)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));cursor:pointer;font-weight:700;touch-action:manipulation;text-decoration:none;color:var(--ink)}
.btn:hover{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.12))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:rgba(255,255,255,.05);font-weight:600}
.btn.small{min-height:40px;padding:0 16px;font-size:.92rem}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;touch-action:manipulation}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7));color:#111;border-color:#fff}
input,select,textarea{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);width:100%}
textarea{min-height:110px;resize:vertical}
select option{color:#111}
label{display:block;font-size:.88rem;color:var(--soft);margin:0 0 4px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--soft)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c4c6cd,#fff);transition:width .3s}
.q{font-size:1.2rem;margin:0 0 14px}
.svgbox{display:flex;justify-content:center;margin:0 0 14px}
.svgbox svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choices .btn{justify-content:flex-start;text-align:left;padding:10px 18px;min-height:56px}
.choices .btn.right{background:rgba(123,216,164,.28);border-color:var(--ok)}
.choices .btn.wrong{background:rgba(255,138,128,.25);border-color:var(--bad)}
.fb{min-height:1.5em;margin:12px 0 0;font-weight:700}
.explain{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);color:#e4e6ec;font-size:.95rem}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--soft);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.big{font-size:2.4rem;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #999;background:#fff}.soft{color:#444}}
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="buildspace">
<meta property="og:title" content="Taktiktafel – buildspace">
<meta property="og:description" content="Aufstellung, Laufwege und Pässe auf dem Handball-Halbfeld per Finger planen und als Bild speichern.">
<meta property="og:url" content="https://buildspaceos.de/taktiktafel.html">
<meta property="og:image" content="https://buildspaceos.de/assets/og-image.jpg">
<meta property="og:image:width" content="1200">

<meta name="twitter:title" content="Taktiktafel – buildspace">
<meta name="twitter:description" content="Aufstellung, Laufwege und Pässe auf dem Handball-Halbfeld per Finger planen und als Bild speichern.">

</head>
<body>
<div class="wrap">
<h1>Taktiktafel</h1>
<p class="lead">Aufstellung, Laufwege und Pässe auf dem Handballfeld planen – per Finger, speicherbar als Bild.</p>

<div class="card noprint"><div class="row">
<button class="chip" id="m-move" aria-pressed="true">Verschieben</button>
<button class="chip" id="m-draw" aria-pressed="false">Zeichnen</button>
<button class="btn ghost small" id="undo">Strich zurück</button>
<button class="btn ghost small" id="clr">Striche löschen</button>
<button class="btn ghost small" id="rst">Aufstellung</button>
<button class="btn ghost small" id="png">Als Bild speichern</button></div>
<p class="soft">Spieler mit dem Finger ziehen; im Modus „Zeichnen“ Laufwege und Pässe zeichnen. Alles bleibt auf diesem Gerät gespeichert.</p></div>
<div class="card" style="padding:10px"><canvas id="cv" width="800" height="560" style="width:100%;height:auto;touch-action:none;border-radius:16px;display:block" aria-label="Taktikfeld, Handball-Halbfeld"></canvas></div>

</div>
<script>

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){if(d===undefined)d=2;var v=Math.round(n*Math.pow(10,d))/Math.pow(10,d);return String(v).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(/\s/g,'');if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){var p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}s=s.replace(/[^0-9.\-+eE]/g,'');var v=parseFloat(s);return isNaN(v)?NaN:v}
function mc(correct,wrongs){correct=String(correct);var set=[correct];wrongs.forEach(function(w){w=String(w);if(set.indexOf(w)<0)set.push(w)});var arr=shuffle(set.slice(0,4));return {choices:arr,correct:arr.indexOf(correct)}}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var cv=$('#cv'),g=cv.getContext('2d'),W=800,H=560;
function start(){var a=[],i;
var att=[[400,400],[230,330],[570,330],[120,200],[680,200],[400,300],[400,230]];
att.forEach(function(p,j){a.push({x:p[0],y:p[1],c:'#ff6b6b',l:String(j+1)})});
var def=[[400,95],[260,170],[340,150],[460,150],[540,170],[300,200]];
def.forEach(function(p,j){a.push({x:p[0],y:p[1],c:'#6bb8ff',l:'A'+(j+1)})});return a}
var D=store.get('tt',null)||{pl:start(),ln:[]};
var mode='move',cur=null,drag=-1;
function save(){store.set('tt',D)}
function court(){g.fillStyle='#0f2a44';g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=3;g.strokeRect(20,20,W-40,H-40);
// Tor
g.fillStyle='#fff';g.fillRect(W/2-30,14,60,10);
// 6m-Torraum
g.beginPath();g.arc(W/2-30,24,150,0,Math.PI/2);g.lineTo(W/2+30,174);g.arc(W/2+30,24,150,Math.PI/2,Math.PI);g.stroke();
g.beginPath();g.moveTo(W/2-30,174);g.lineTo(W/2+30,174);g.stroke();
// 9m gestrichelt
g.setLineDash([12,10]);g.beginPath();g.arc(W/2-30,24,240,0,Math.PI/2);g.lineTo(W/2+30,264);g.arc(W/2+30,24,240,Math.PI/2,Math.PI);g.stroke();g.setLineDash([]);
// 7m
g.beginPath();g.moveTo(W/2-20,24+210);g.lineTo(W/2+20,24+210);g.stroke();
g.fillStyle='rgba(255,255,255,.5)';g.font='14px Arial';g.fillText('6 m',W/2+170,120);g.fillText('9 m',W/2+250,180)}
function draw(){court();g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#ffd166';
D.ln.concat(cur?[cur]:[]).forEach(function(l){if(l.length<2)return;g.beginPath();g.moveTo(l[0][0],l[0][1]);for(var i=1;i<l.length;i++)g.lineTo(l[i][0],l[i][1]);g.stroke();
var a=l[l.length-1],b=l[Math.max(0,l.length-6)],an=Math.atan2(a[1]-b[1],a[0]-b[0]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(a[0]-16*Math.cos(an-.45),a[1]-16*Math.sin(an-.45));g.moveTo(a[0],a[1]);g.lineTo(a[0]-16*Math.cos(an+.45),a[1]-16*Math.sin(an+.45));g.stroke()});
D.pl.forEach(function(p){g.beginPath();g.arc(p.x,p.y,22,0,7);g.fillStyle=p.c;g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();g.fillStyle='#10131a';g.font='bold 16px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(p.l,p.x,p.y+1)})}
function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',function(e){var q=pos(e);cv.setPointerCapture(e.pointerId);
if(mode==='move'){drag=-1;for(var i=D.pl.length-1;i>=0;i--){var p=D.pl[i];if(Math.hypot(p.x-q[0],p.y-q[1])<32){drag=i;break}}}
else{cur=[q]}draw()});
cv.addEventListener('pointermove',function(e){var q=pos(e);if(mode==='move'&&drag>=0){D.pl[drag].x=Math.max(22,Math.min(W-22,q[0]));D.pl[drag].y=Math.max(22,Math.min(H-22,q[1]));draw()}else if(mode==='draw'&&cur){cur.push(q);draw()}});
function up(){if(cur){if(cur.length>2)D.ln.push(cur);cur=null}drag=-1;save();draw()}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function setMode(m){mode=m;$('#m-move').setAttribute('aria-pressed',m==='move');$('#m-draw').setAttribute('aria-pressed',m==='draw')}
$('#m-move').onclick=function(){setMode('move')};$('#m-draw').onclick=function(){setMode('draw')};
$('#undo').onclick=function(){D.ln.pop();save();draw()};$('#clr').onclick=function(){D.ln=[];save();draw()};
$('#rst').onclick=function(){D.pl=start();save();draw()};
$('#png').onclick=function(){try{var a=document.createElement('a');a.download='taktik.png';a.href=cv.toDataURL('image/png');a.click()}catch(e){alert('Speichern wird hier nicht unterstützt – bitte Screenshot machen.')}};
draw();

</script>
<script defer data-category="handball" src="protect.js"></script>
