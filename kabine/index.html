<script>
// ---------------- App: Start, Navigation, Live-Daten ----------------
const App = {
  _nachAnmeldung: null,

  async start() {

  authGeaendert() {

  // ---------- Navigation ----------

    try { await navigator.clipboard.writeText(text); toast(ok || 'Kopiert.'); }
    catch (e) {
      const m = oeffneModal('<h3>Zum Kopieren</h3><textarea class="ein" style="min-height:160px" readonly>' + esc(text) + '</textarea><div class="knoepfe"><button class="btn" data-zu>Fertig</button></div>');
      const ta = m.querySelector('textarea'); ta.focus(); ta.select();
    }
  },
  vergangeneUmschalten() { S.vergangene = !S.vergangene; this.renderTermine(); },
  fabKlick() { if (S.tab === 'termine' && S.istAdmin) Editor.oeffnen(); },
};
</script>
<script>
// ---------------- Zu-/Absagen ----------------
const Antwort = {
  // Kann ich (oder die Verwaltung) für diesen Termin antworten?
  offen(t) { return S.istAdmin || (!t.abgesagt && fristVon(t) > new Date() && !(S.team && S.team.gesperrt)); },
  async setzen(tid, mid, status, extra = {}) {
    const t = terminById(tid); if (!t) return;
    if (!mid) { App.ichWaehlen(); return; }
    if (!this.offen(t)) { toast('Die Antwortfrist ist abgelaufen – sag bitte direkt beim Trainerteam Bescheid.'); return; }
    if (!t.start || !t.start.toDate) { toast('Noch keine Verbindung – gleich nochmal versuchen.'); return; }
    const alt = S.antworten.get(tid + '_' + mid);
    let grund = extra.grund != null ? extra.grund : (alt && alt.status === status ? alt.grund || '' : '');
    if (status === 'nein' && extra.grund == null && !extra.still) {
      const g = await this.grundFragen(t, mid, alt && alt.status === 'nein' ? alt.grund : '');
      if (g === null) return;
      grund = g;
    }
    if (navigator.vibrate) navigator.vibrate(10);
    const id = tid + '_' + mid;
    const doc = {
      termin: tid, spieler: mid, status, grund: String(grund || '').slice(0, 140),
      auto: Math.max(0, Math.min(8, extra.auto != null ? extra.auto : (alt && alt.auto) || 0)),
      mitfahrt: extra.mitfahrt != null ? !!extra.mitfahrt : !!(alt && alt.mitfahrt),
      start: t.start, uid: null, at: null, von: mid === ichId() ? '' : (S.istAdmin ? 'Verwaltung' : (ich() ? ich().name : '')),
    };
    // Sofort anzeigen (optimistisch), dann speichern
    S.antworten.set(id, { id, ...doc, at: { toMillis: () => Date.now() } }); App.renderAlles();
    try {
      await Fb.sicherAngemeldet();
      doc.uid = Fb.uid(); doc.at = Fb.jetzt();
      await Fb.col('antworten').doc(id).set(doc);
      if (status === 'ja' && t.max > 0) { const z = zaehlen(t); if (z.warte.some(x => x.m.id === mid)) toast('Du stehst auf der Warteliste (max. ' + t.max + ').', 4500); }
    } catch (e) { if (alt) S.antworten.set(id, alt); else S.antworten.delete(id); App.renderAlles(); toast(fehlerText(e), 6000); }
  },
  async loeschen(tid, mid) {
    const id = tid + '_' + mid; const alt = S.antworten.get(id); if (!alt) return;
    S.antworten.delete(id); App.renderAlles();
    try { await Fb.sicherAngemeldet(); await Fb.col('antworten').doc(id).delete(); }
    catch (e) { S.antworten.set(id, alt); App.renderAlles(); toast(fehlerText(e), 6000); }
  },
  grundFragen(t, mid, vorher) {
    return new Promise(res => {
      const pflicht = einst().grundPflicht;
      const vorschl = ['Arbeit', 'Krank', 'Verletzt', 'Urlaub', 'Familie', 'Schule/Uni'];
      const m = oeffneModal('<h3>Absage' + (mid !== ichId() ? ' für ' + esc(mName(mid)) : '') + '</h3><div class="unter">' + esc(t.titel || TYPEN[t.typ].name) + ' · ' + esc(tagKurz(startVon(t))) + '</div>'
        + '<label class="feld">Grund ' + (pflicht ? '(Pflicht)' : '(optional, sieht die Mannschaft)') + '</label><input class="ein" id="g-text" maxlength="140" value="' + esc(vorher || '') + '" placeholder="z. B. Arbeit">'
        + '<div class="chips-wahl">' + vorschl.map(v => '<button data-v="' + esc(v) + '">' + esc(v) + '</button>').join('') + '</div>'
        + '<div class="knoepfe"><button class="btn sekundaer" id="g-ab">Abbrechen</button><button class="btn" id="g-ok">Absagen</button></div>');
      const inp = m.querySelector('#g-text');
      m.querySelectorAll('.chips-wahl button').forEach(b => b.onclick = () => { inp.value = b.dataset.v; });
      const bg = m.parentNode; let fertig = false;
      const ende = v => { if (fertig) return; fertig = true; Modal.schliessen(bg); res(v); };
      m.querySelector('#g-ab').onclick = () => ende(null);
      m.querySelector('#g-ok').onclick = () => { const v = inp.value.trim(); if (pflicht && !v) { toast('Bitte einen Grund angeben.'); inp.focus(); return; } ende(v); };
      inp.onkeydown = e => { if (e.key === 'Enter') m.querySelector('#g-ok').click(); };
      Modal.beimSchliessen(() => ende(null));
      setTimeout(() => inp.focus(), 80);
    });
  },
};

// Termin-Karte (Liste und Start)
function terminKarte(t, opt = {}) {
  const st = startVon(t), typ = TYPEN[t.typ] || TYPEN.event;
  const z = zaehlen(t), id = ichId(), vorbei = istVorbei(t);
  const ichEingeladen = id && eingeladen(t).some(m => m.id === id);
  const meine = id ? antwortVon(t, id) : null;
  const erg = t.typ === 'spiel' ? ergebnis(t) : null;
  const titel = t.typ === 'spiel' && t.gegner ? (t.heim !== false ? 'vs. ' : '@ ') + t.gegner : (t.titel || typ.name);
  let meta = '<b>' + esc(t.von || hhmm(st)) + (t.bis ? '–' + esc(t.bis) : '') + ' Uhr</b>';
  if (t.treff) meta += ' · Treff ' + esc(t.treff);
  if (t.ort) meta += '<br>📍 ' + esc(t.ort);
  const pills = [];
  if (t.abgesagt) pills.push('<span class="pill rot">Abgesagt</span>');
  if (t.typ === 'spiel') pills.push('<span class="pill">' + (t.heim !== false ? 'Heim' : 'Auswärts') + '</span>');
  if (t.pflicht) pills.push('<span class="pill gelb">Pflicht</span>');
  if (t.kader && t.kader.length) pills.push('<span class="pill blau">Kader ' + t.kader.length + '</span>');
  if (Hd.amTag(t.datum).length && !opt.kompakt) pills.push('<span class="pill">🧹 HD</span>');
  let html = '<div class="termin ' + esc(t.typ) + (t.abgesagt ? ' abgesagt' : '') + (vorbei ? ' vorbei' : '') + '">'
    + '<div class="t-haupt" onclick="Detail.oeffnen(\'' + t.id + '\')">'
    + '<div class="t-datum"><div class="wt">' + st.toLocaleDateString('de-DE', { weekday: 'short' }) + '</div><div class="tg">' + st.getDate() + '</div><div class="mo">' + st.toLocaleDateString('de-DE', { month: 'short' }) + '</div></div>'
    + '<div class="t-info"><div class="t-titel">' + typ.ico + ' ' + esc(titel) + ' ' + pills.join(' ') + '</div>'
    + '<div class="t-meta">' + meta + '</div>'
    + (t.abgesagt ? (t.absageGrund ? '<div class="t-meta">Grund: ' + esc(t.absageGrund) + '</div>' : '')
      : '<div class="t-zahlen"><span class="ja">✓ ' + z.ja.length + (t.max > 0 ? '/' + t.max : '') + '</span><span class="nein">✗ ' + z.nein.length + '</span>' + (z.vielleicht.length ? '<span class="vl">? ' + z.vielleicht.length + '</span>' : '') + (z.offen.length ? '<span class="of">○ ' + z.offen.length + ' offen</span>' : '') + (z.warte.length ? '<span class="vl">⏳ ' + z.warte.length + ' Warteliste</span>' : '') + '</div>')
    + '</div>' + (erg ? '<div class="t-ergebnis ' + erg.art + '">' + esc(erg.text) + '</div>' : '') + '</div>';
  if (!t.abgesagt && !vorbei && ichEingeladen) {
    if (Antwort.offen(t)) {
      const s = meine && meine.status;
      const auto = meine && meine.auto && typeof meine.auto === 'string';
      html += '<div class="t-antwort">'
        + '<button class="ant ja' + (s === 'ja' ? ' an' : '') + '" onclick="Antwort.setzen(\'' + t.id + '\',ichId(),\'ja\')">✓ <span class="lang">Zusage</span><span class="kurz">Ja</span></button>'
        + '<button class="ant vl' + (s === 'vielleicht' ? ' an' : '') + '" onclick="Antwort.setzen(\'' + t.id + '\',ichId(),\'vielleicht\')">? <span class="lang">Vielleicht</span></button>'
        + '<button class="ant nein' + (s === 'nein' ? ' an' : '') + '" onclick="Antwort.setzen(\'' + t.id + '\',ichId(),\'nein\')">✗ <span class="lang">Absage</span><span class="kurz">Nein</span></button>'
        + '</div>';
      if (auto) html += '<div class="t-gesperrt">' + (meine.auto === 'standard' ? 'Automatisch zugesagt – sag ab, falls du nicht kannst.' : esc(meine.grund) + ' – automatisch abgesagt.') + '</div>';
      else if (!s && fristVon(t).getTime() !== st.getTime()) html += '<div class="t-gesperrt">Antwort bis <b>' + esc(tagKurz(fristVon(t)) + ', ' + hhmm(fristVon(t))) + ' Uhr</b></div>';
    } else {
      html += '<div class="t-gesperrt">Antwortfrist vorbei · deine Antwort: <b>' + (meine ? esc(STATUS[meine.status]) : 'keine') + '</b></div>';
    }
  }
  return html + '</div>';
}

Object.assign(App, {
  // ---------- Tab: Start (Dashboard) ----------
  renderHome() {
    const el = $('#home-inhalt');
    if (!S.team) { el.innerHTML = S.fehler ? '<div class="warnbox">' + esc(S.fehler) + '</div><button class="btn sekundaer" onclick="App.startZeigen()">Andere Mannschaft öffnen</button>' : '<div class="leer">Lade …</div>'; return; }
    const i = ich(), jetzt = new Date();
    let h = '';
    const stunde = jetzt.getHours();
    h += '<div class="gruss">' + (stunde < 11 ? 'Guten Morgen' : stunde < 18 ? 'Hallo' : 'Guten Abend') + (i ? ', ' + esc(vorname(i.name)) : '') + '!</div>';
    h += '<div class="gruss-sub">' + esc(tagLang(jetzt)) + '</div>';
    if (S.team.hinweis) h += '<div class="infobox">📌 ' + verlinken(esc(S.team.hinweis)) + '</div>';
    if (!i && mitglieder().length) h += '<div class="warnbox">Wähle deinen Namen, damit du zu- und absagen kannst. <button class="btn klein" style="margin-top:8px" onclick="App.ichWaehlen()">Wer bist du?</button></div>';
    if (S.istAdmin && !mitglieder().length) h += '<div class="warnbox"><b>Los geht’s:</b> Leg unter <b>Team</b> deine Mitglieder an (oder übernimm sie aus Hallendienst/Strafenkasse) und dann unter <b>Termine</b> das Training. <div class="btn-reihe" style="margin-top:9px"><button class="btn klein" onclick="App.tabZeigen(\'team\')">Mitglieder anlegen</button><button class="btn klein sekundaer" onclick="App.tabZeigen(\'mehr\')">Verknüpfen</button></div></div>';
    // Offene Antworten
    const off = meineOffenen();
    if (off.length) {
      h += '<h2>Deine Antwort fehlt <span class="pill rot">' + off.length + '</span></h2>';
      h += off.slice(0, 3).map(t => terminKarte(t)).join('');
      if (off.length > 3) h += '<button class="btn sekundaer" style="margin-bottom:10px" onclick="S.filter=\'offen\';App.tabZeigen(\'termine\')">Alle ' + off.length + ' offenen Termine</button>';
    }
    // Nächste Termine
    const kommend = S.termine.filter(t => !istVorbei(t) && !off.includes(t)).slice(0, off.length ? 2 : 3);
    h += '<h2>Als Nächstes<span class="rechts"><button class="btn mini sekundaer" onclick="App.tabZeigen(\'termine\')">Alle</button></span></h2>';
    h += kommend.length ? kommend.map(t => terminKarte(t)).join('') : '<div class="card leer">' + (off.length ? 'Sonst nichts geplant.' : 'Keine Termine geplant.') + (S.istAdmin ? '<br><button class="btn klein" style="margin-top:9px" onclick="Editor.oeffnen()">＋ Termin anlegen</button>' : '') + '</div>';
    // Hallendienst & Strafenkasse
    const hd = Hd.ichHtml(i), sk = Sk.ichHtml(i);
    if (hd || sk) h += '<h2>Verein</h2>' + hd + sk;
    // Pinnwand: wichtig + neueste
    const wichtig = S.posts.filter(p => p.wichtig).slice(0, 2);
    const umfragen = S.posts.filter(p => p.umfrage && !p.umfrage.zu && !(p.umfrage.ende && p.umfrage.ende < isoDatum(jetzt)) && i && !S.stimmen.some(s => s.post === p.id && s.spieler === i.id));
    if (wichtig.length || umfragen.length) {
      h += '<h2>Pinnwand</h2>';
      wichtig.forEach(p => { h += Pinnwand.postHtml(p, true); });
      umfragen.filter(p => !wichtig.includes(p)).slice(0, 2).forEach(p => { h += Pinnwand.postHtml(p, true); });
    }
    // Geburtstage
    const geb = this.geburtstage(14);
    if (geb.length) h += '<h2>Geburtstage</h2><div class="card flach">' + geb.map(g => '<div class="zeile"><div class="t">🎂 <b>' + esc(g.m.name) + '</b><small>' + (g.tage === 0 ? 'Heute! Glückwunsch 🎉' : g.tage === 1 ? 'Morgen' : 'in ' + g.tage + ' Tagen') + ' · ' + esc(g.m.geb) + '</small></div></div>').join('') + '</div>';
    el.innerHTML = h;
    Hd.knoepfe(el); Sk.knoepfe(el); Pinnwand.knoepfe(el);
  },
  geburtstage(tage) {
    const heute = new Date(); heute.setHours(0, 0, 0, 0);
    return mitglieder().filter(m => /^\d{1,2}\.\d{1,2}\.?$/.test(m.geb || '')).map(m => {
      const [d, mo] = m.geb.split('.').map(Number);
      let g = new Date(heute.getFullYear(), mo - 1, d); if (g < heute) g = new Date(heute.getFullYear() + 1, mo - 1, d);
      return { m, tage: Math.round((g - heute) / 864e5) };
    }).filter(x => x.tage <= tage).sort((a, b) => a.tage - b.tage);
  },

  // ---------- Tab: Termine ----------
  renderTermine() {
    const jetzt = new Date();
    const off = meineOffenen();
    const basis = S.termine.filter(t => S.vergangene ? true : !istVorbei(t));
    const filter = { alle: () => true, training: t => t.typ === 'training', spiel: t => t.typ === 'spiel', event: t => t.typ === 'event', offen: t => off.includes(t) };
    if (!filter[S.filter]) S.filter = 'alle';
    const anz = k => basis.filter(filter[k]).length;
    $('#termin-filter').innerHTML = [['alle', 'Alle'], ['training', '🏃 Training'], ['spiel', '🤾 Spiele'], ['event', '🎉 Termine'], ['offen', 'Antwort fehlt']]
      .filter(([k]) => k === 'alle' || k === S.filter || anz(k))
      .map(([k, n]) => '<button class="' + (S.filter === k ? 'aktiv' : '') + '" data-f="' + k + '">' + n + '<span class="n">' + anz(k) + '</span></button>').join('');
    $('#termin-filter').querySelectorAll('button').forEach(b => b.onclick = () => { S.filter = b.dataset.f; LS.set(K.filter, S.filter); this.renderTermine(); });
    let liste = basis.filter(filter[S.filter]);
    if (S.vergangene) liste = liste.slice().sort((a, b) => startVon(b) - startVon(a));
    let h = '', monat = '';
    if (!S.team) h = '<div class="leer">' + (S.fehler ? esc(S.fehler) : 'Lade …') + '</div>';
    else if (!liste.length) h = '<div class="card leer">' + (S.filter === 'offen' ? 'Du hast überall geantwortet. 👍' : 'Keine ' + (S.vergangene ? '' : 'kommenden ') + 'Termine.') + (S.istAdmin ? '<br><button class="btn klein" style="margin-top:10px" onclick="Editor.oeffnen()">＋ Termin anlegen</button>' : '') + '</div>';
    else liste.forEach(t => {
      const st = startVon(t), mo = st.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
      if (mo !== monat) { monat = mo; h += '<div class="monat">' + esc(mo) + '</div>'; }
      h += terminKarte(t);
    });
    $('#termin-liste').innerHTML = h;
    $('#vergangen-btn').textContent = S.vergangene ? 'Nur kommende Termine zeigen' : 'Vergangene Termine zeigen';
    $('#abgleich-box').innerHTML = S.istAdmin ? Anwurf.abgleichHtml() : '';
    this.renderKopf();
  },

  // ---------- Tab: Pinnwand ----------
  renderPinnwand() { Pinnwand.render(); },

  // ---------- Tab: Team ----------
  renderTeam() {
    const el = $('#team-inhalt');
    if (!S.team) { el.innerHTML = '<div class="leer">Lade …</div>'; return; }
    let h = '<div class="segment">' + [['mitglieder', 'Mitglieder'], ['statistik', 'Statistik'], ['abwesend', 'Abwesenheiten']].map(([k, n]) => '<button data-s="' + k + '" class="' + (S.teamTab === k ? 'aktiv' : '') + '">' + n + '</button>').join('') + '</div>';
    if (S.teamTab === 'statistik') h += Statistik.html();
    else if (S.teamTab === 'abwesend') h += this.abwesenheitenHtml();
    else {
      const alle = mitglieder(true);
      const gruppen = [['trainer', 'Trainerteam'], ['betreuer', 'Betreuung'], ['spieler', 'Spieler:innen']];
      if (S.istAdmin) h += '<div class="btn-reihe" style="margin-bottom:6px"><button class="btn klein" onclick="Verwaltung.mitgliedModal()">＋ Mitglied</button><button class="btn klein sekundaer" onclick="Verwaltung.importModal()">Übernehmen …</button></div>';
      if (!alle.length) h += '<div class="card leer">Noch keine Mitglieder.' + (S.istAdmin ? '' : ' Die Verwaltung legt die Mannschaft an.') + '</div>';
      const quote = Statistik.quoten();
      gruppen.forEach(([r, n]) => {
        const l = alle.filter(m => (m.rolle || 'spieler') === r && m.aktiv !== false);
        if (!l.length) return;
        h += '<h2>' + n + ' <span class="pill">' + l.length + '</span></h2><div class="card flach">' + l.sort((a, b) => (r === 'spieler' ? (Number(a.nr) || 999) - (Number(b.nr) || 999) : 0) || a.name.localeCompare(b.name, 'de')).map(m => this.mitgliedZeile(m, quote[m.id])).join('') + '</div>';
      });

      if (inaktiv.length && S.istAdmin) h += '<h2>Inaktiv</h2><div class="card flach">' + inaktiv.map(m => this.mitgliedZeile(m)).join('') + '</div>';

    el.innerHTML = h;
    el.querySelectorAll('.segment button').forEach(b => b.onclick = () => { S.teamTab = b.dataset.s; LS.set(K.teamTab, S.teamTab); this.renderTeam(); });
    el.querySelectorAll('[data-mid]').forEach(z => z.onclick = () => Profil.oeffnen(z.dataset.mid));
    el.querySelectorAll('[data-abw-weg]').forEach(b => b.onclick = e => { e.stopPropagation(); Abwesenheit.loeschen(b.dataset.abwWeg); });
    Statistik.knoepfe(el);
  },
  mitgliedZeile(m, q) {
    const r = m.rolle || 'spieler';
    const unter = [ROLLEN[r] !== ROLLEN.spieler ? ROLLEN[r] : '', m.pos || '', m.id === ichId() ? 'das bist du' : ''].filter(Boolean).join(' · ');
    const abw = abwesenheitAm(m.id, isoDatum(new Date()));
    return '<div class="mitglied" data-mid="' + m.id + '"><div class="nr ' + r + '">' + esc(m.nr || initialen(m.name)) + '</div><div class="t"><b>' + esc(m.name) + '</b>' + (unter || abw ? '<small>' + esc(unter) + (abw ? (unter ? ' · ' : '') + '🏖️ abwesend bis ' + esc(abw.bis.split('-').reverse().slice(0, 2).join('.')) + '.' : '') + '</small>' : '') + '</div>'
      + (q && q.n ? '<div class="q" style="color:' + (q.q >= 75 ? 'var(--gruen)' : q.q >= 50 ? 'var(--gelb)' : 'var(--rot)') + '">' + q.q + ' %</div>' : '') + '<span class="pfeil" style="color:var(--muted)">›</span></div>';
  },
  abwesenheitenHtml() {
    const heute = isoDatum(new Date());
    const l = S.abw.filter(a => a.bis >= heute && mitglied(a.spieler));
    let h = '<div class="hinweis" style="margin:0 2px 10px">Urlaub, Verletzung, Klassenfahrt … Für diese Zeit wirst du bei allen Terminen automatisch abgemeldet.</div>';
    h += '<button class="btn" style="margin-bottom:12px" onclick="Abwesenheit.modal()">＋ Abwesenheit eintragen</button>';
    h += l.length ? '<div class="card flach">' + l.map(a => '<div class="zeile"><div class="t"><b>' + esc(mName(a.spieler)) + '</b><small>' + esc(Abwesenheit.zeitraum(a)) + (a.grund ? ' · ' + esc(a.grund) : '') + '</small></div>'
      + (S.istAdmin || a.spieler === ichId() ? '<button class="x-btn" data-abw-weg="' + a.id + '" title="Löschen">✕</button>' : '') + '</div>').join('') + '</div>' : '<div class="card leer">Niemand hat sich abgemeldet.</div>';
    return h;
  },

  // ---------- Tab: Mehr ----------
  renderMehr() {
    const el = $('#mehr-inhalt'); const i = ich();
    let h = '<h2>Ich</h2><div class="card flach">'
      + '<div class="zeile klick" onclick="App.ichWaehlen()"><div class="t"><b>' + (i ? esc(i.name) : 'Wer bist du?') + '</b><small>' + (i ? 'Auf diesem Gerät · tippen zum Wechseln' : 'Namen wählen, um zu antworten') + '</small></div><span class="pfeil">›</span></div>'
      + (i ? '<div class="zeile klick" onclick="Profil.oeffnen(\'' + i.id + '\')"><div class="t"><b>Meine Statistik</b><small>Trainingsbeteiligung, Antworten</small></div><span class="pfeil">›</span></div>' : '')
      + '<div class="zeile klick" onclick="Abwesenheit.modal()"><div class="t"><b>🏖️ Abwesenheit eintragen</b><small>Urlaub, Verletzung … automatisch absagen</small></div><span class="pfeil">›</span></div>'
      + '</div>';
    h += '<h2>Kalender</h2><div class="card flach">'
      + '<div class="zeile klick" onclick="Kalender.export(false)"><div class="t"><b>📆 Alle Termine in den Kalender</b><small>.ics-Datei für iPhone, Google, Outlook</small></div><span class="pfeil">›</span></div>'
      + (i ? '<div class="zeile klick" onclick="Kalender.export(true)"><div class="t"><b>📆 Nur meine Zusagen</b><small>Termine, bei denen du zugesagt hast</small></div><span class="pfeil">›</span></div>' : '')
      + '</div>';
    h += '<h2>Verein</h2>' + Hd.mehrHtml() + Sk.mehrHtml();
    h += '<div class="card flach"><div class="zeile klick" onclick="App.linkTeilen()"><div class="t"><b>🔗 Mannschafts-Link teilen</b><small>Wer den Link hat, sieht alles und kann antworten</small></div><span class="pfeil">›</span></div></div>';
    h += '<h2>Darstellung</h2><div class="card"><div class="segment" style="margin:0">' + [['auto', 'Automatisch'], ['hell', 'Hell'], ['dunkel', 'Dunkel']].map(([k, n]) => '<button data-theme="' + k + '" class="' + ((LS.get(K.theme, 'auto') || 'auto') === k ? 'aktiv' : '') + '">' + n + '</button>').join('') + '</div></div>';
    h += '<h2>Verwaltung</h2>' + Verwaltung.html();
    h += '<div class="card flach"><div class="zeile klick" onclick="App.startZeigen()"><div class="t"><b>Andere Mannschaft öffnen</b></div><span class="pfeil">›</span></div></div>';
    h += this.fussHtml();
    el.innerHTML = h;
    el.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { const v = b.dataset.theme; LS.set(K.theme, v); if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; this.renderMehr(); });
    Verwaltung.knoepfe(el); Hd.knoepfe(el); Sk.knoepfe(el);
  },
});
</script>
<script>
// ---------------- Modals (stapelbar) ----------------
const Modal = {
  stapel: [],
  oeffnen(html, opt = {}) {
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.style.zIndex = 50 + this.stapel.length * 2;
    bg.innerHTML = '<div class="modal" role="dialog">' + (opt.zu ? '<button class="zu-x" data-zu aria-label="Schließen">✕</button>' : '') + html + '</div>';
    const eintrag = { bg, zu: [] };
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-zu]')) this.schliessen(bg); });
    document.body.appendChild(bg); this.stapel.push(eintrag);
    document.body.style.overflow = 'hidden';
    return bg.querySelector('.modal');
  },
  // Schließt das oberste Fenster – oder genau dieses (samt allen darüber)
  schliessen(bg) {
    if (!this.stapel.length) return;
    let i = bg ? this.stapel.findIndex(x => x.bg === bg) : this.stapel.length - 1;
    if (i < 0) return;
    const weg = this.stapel.splice(i);
    weg.reverse().forEach(x => { x.bg.remove(); x.zu.forEach(f => { try { f(); } catch (e) {} }); });
    if (!this.stapel.length) document.body.style.overflow = '';
  },
  beimSchliessen(fn) { const o = this.stapel[this.stapel.length - 1]; if (o) o.zu.push(fn); },
  oben() { const o = this.stapel[this.stapel.length - 1]; return o ? o.bg : null; },
};
function oeffneModal(html, opt) { return Modal.oeffnen(html, opt); }
function schliesseModal() { Modal.schliessen(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') schliesseModal(); });
function fragen(titel, text, ja = 'OK', gefahr = false) {
  return new Promise(res => {
    const m = oeffneModal('<h3>' + esc(titel) + '</h3>' + (text ? '<div class="unter">' + text + '</div>' : '') + '<div class="knoepfe"><button class="btn sekundaer" data-nein>Abbrechen</button><button class="btn' + (gefahr ? ' gefahr' : '') + '" data-ja>' + esc(ja) + '</button></div>');
    const bg = m.parentNode; let fertig = false;
    const ende = v => { if (fertig) return; fertig = true; Modal.schliessen(bg); res(v); };
    m.querySelector('[data-ja]').onclick = () => ende(true);
    m.querySelector('[data-nein]').onclick = () => ende(false);
    Modal.beimSchliessen(() => ende(false));
  });
}
function auswahl(titel, text, optionen) {
  return new Promise(res => {
    const m = oeffneModal('<h3>' + esc(titel) + '</h3>' + (text ? '<div class="unter">' + text + '</div>' : '') + '<div class="stapel" style="margin-top:14px">' + optionen.map((o, i) => '<button class="btn ' + (o.stil || 'sekundaer') + '" data-i="' + i + '">' + esc(o.text) + '</button>').join('') + '<button class="btn sekundaer" data-i="-1">Abbrechen</button></div>');
    const bg = m.parentNode; let fertig = false;
    const ende = v => { if (fertig) return; fertig = true; Modal.schliessen(bg); res(v); };
    m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const i = Number(b.dataset.i); ende(i < 0 ? null : optionen[i].wert); });
    Modal.beimSchliessen(() => ende(null));
  });
}

// ---------------- Termin-Detail ----------------
const Detail = {
  offen: null, bg: null,
  oeffnen(id) {
    if (!terminById(id)) return;
    this.offen = id;
    const m = oeffneModal('<div id="detail-inhalt"></div>', { zu: true });
    this.bg = m.parentNode;
    Modal.beimSchliessen(() => { this.offen = null; this.bg = null; });
    this.render(true);
  },
  render(erstes) {
    if (!this.offen || !this.bg) return;
    const el = this.bg.querySelector('#detail-inhalt'); if (!el) return;
    const a = document.activeElement;
    if (!erstes && a && this.bg.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // nicht beim Tippen neu zeichnen
    const t = terminById(this.offen);
    if (!t) { Modal.schliessen(this.bg); toast('Der Termin wurde gelöscht.'); return; }
    const modal = this.bg.querySelector('.modal'); const y = modal.scrollTop;
    el.innerHTML = this.html(t);
    modal.scrollTop = y;
    this.knoepfe(el, t);
  },
  html(t) {
    const st = startVon(t), typ = TYPEN[t.typ] || TYPEN.event, id = ichId();
    const z = zaehlen(t), vorbei = istVorbei(t);
    const titel = t.typ === 'spiel' && t.gegner ? (t.heim !== false ? 'HSG vs. ' : '@ ') + t.gegner : (t.titel || typ.name);
    let h = '<div class="d-kopf"><div class="d-ico">' + typ.ico + '</div><div style="flex:1;min-width:0"><h3 style="padding-right:30px">' + esc(titel) + '</h3><div class="unter">' + esc(tagLang(st)) + ' · ' + esc(relativ(st)) + '</div>'
      + '<div style="margin-top:5px">' + (t.abgesagt ? '<span class="pill rot">Abgesagt</span> ' : '') + '<span class="pill">' + esc(typ.name) + '</span> ' + (t.typ === 'spiel' ? '<span class="pill">' + (t.heim !== false ? 'Heimspiel' : 'Auswärtsspiel') + '</span> ' : '') + (t.pflicht ? '<span class="pill gelb">Pflichttermin</span>' : '') + '</div></div></div>';
    if (t.abgesagt) h += '<div class="warnbox">❌ <b>Dieser Termin fällt aus.</b>' + (t.absageGrund ? ' ' + esc(t.absageGrund) : '') + '</div>';
    // Verwaltung
    if (S.istAdmin) {
      h += '<div class="btn-reihe" style="margin-bottom:10px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))">'
        + '<button class="btn klein" data-a="bearbeiten">✏️ Ändern</button>'
        + (hatBegonnen(t) && !t.abgesagt ? '<button class="btn klein sekundaer" data-a="anwesenheit">✅ Anwesenheit</button>' : '<button class="btn klein sekundaer" data-a="erinnern">⏰ Erinnern</button>')
        + '<button class="btn klein sekundaer" data-a="mehr">⋯ Mehr</button></div>';
    }
    if (Sk.istKassenwart() && hatBegonnen(t) && !t.abgesagt) h += '<button class="btn klein sekundaer" style="width:100%;margin-bottom:10px" data-a="strafen">💰 Strafen aus diesem Termin buchen</button>';
    // Infos
    h += '<div class="card flach" style="box-shadow:none;background:var(--zebra)">';
    h += '<div class="d-zeile"><span class="i">🕐</span><div><b>' + esc(t.von || hhmm(st)) + (t.bis ? '–' + esc(t.bis) : '') + ' Uhr</b>' + (t.treff ? '<small>Treffpunkt ' + esc(t.treff) + ' Uhr</small>' : '') + '</div></div>';
    if (t.ort || t.adresse) {
      const q = encodeURIComponent([t.ort, t.adresse].filter(Boolean).join(', '));
      h += '<div class="d-zeile"><span class="i">📍</span><div style="flex:1"><b>' + esc(t.ort || t.adresse) + '</b>' + (t.adresse && t.ort ? '<small>' + esc(t.adresse) + '</small>' : '') + '</div><a class="btn mini sekundaer" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + q + '">Karte</a></div>';
    }
    const erg = t.typ === 'spiel' ? ergebnis(t) : null;
    if (erg) h += '<div class="d-zeile"><span class="i">🏁</span><div><b style="color:var(--' + (erg.art === 's' ? 'gruen' : erg.art === 'n' ? 'rot' : 'gelb') + ')">' + esc(erg.text) + ' – ' + (erg.art === 's' ? 'Sieg' : erg.art === 'n' ? 'Niederlage' : 'Unentschieden') + '</b>' + (t.quelle ? '<small>laut Spielplan (nuLiga)</small>' : '') + '</div></div>';
    if (t.notiz) h += '<div class="d-zeile"><span class="i">📝</span><div class="d-notiz">' + verlinken(esc(t.notiz)) + '</div></div>';
    if (!t.abgesagt && !vorbei) h += '<div class="d-zeile"><span class="i">⏳</span><div>Antworten bis <b>' + esc(tagKurz(fristVon(t)) + ', ' + hhmm(fristVon(t))) + ' Uhr</b>' + (t.standard === 'ja' ? '<small>Alle sind automatisch zugesagt – wer nicht kann, sagt ab.</small>' : '') + (t.max > 0 ? '<small>Höchstens ' + t.max + ' Teilnehmende, danach Warteliste.</small>' : '') + '</div></div>';
    h += '</div>';
    // Meine Antwort
    const ichDabei = id && eingeladen(t).some(m => m.id === id);
    if (!t.abgesagt && !vorbei) {
      if (!id) h += '<div class="warnbox" style="margin-top:10px">Wähle deinen Namen, um zu antworten. <button class="btn klein" style="margin-top:7px" data-a="ich">Wer bist du?</button></div>';
      else if (!ichDabei) h += '<div class="infobox" style="margin-top:10px">Du bist für diesen Termin nicht nominiert.</div>';
      else {
        const meine = antwortVon(t, id), s = meine && meine.status;
        h += '<div class="gruppe-kopf" style="margin-top:14px">Deine Antwort</div>';
        if (Antwort.offen(t)) {
          h += '<div class="t-antwort" style="padding:0">'
            + '<button class="ant ja' + (s === 'ja' ? ' an' : '') + '" data-st="ja">✓ Zusage</button><button class="ant vl' + (s === 'vielleicht' ? ' an' : '') + '" data-st="vielleicht">? Vielleicht</button><button class="ant nein' + (s === 'nein' ? ' an' : '') + '" data-st="nein">✗ Absage</button></div>';
          if (meine && !meine.auto && meine.status === 'nein') h += '<div class="hinweis">Grund: ' + (meine.grund ? esc(meine.grund) : '–') + ' · <a href="#" data-a="grund">ändern</a></div>';
          if (meine && typeof meine.auto === 'string') h += '<div class="hinweis">' + (meine.auto === 'standard' ? 'Automatisch zugesagt.' : esc(meine.grund) + ' – automatisch abgesagt. Du kannst trotzdem zusagen.') + '</div>';
          if (z.warte.some(x => x.m.id === id)) h += '<div class="warnbox" style="margin-top:8px">⏳ Du stehst auf der Warteliste (Platz ' + (z.warte.findIndex(x => x.m.id === id) + 1) + ').</div>';
        } else h += '<div class="hinweis" style="margin-top:0">Antwortfrist vorbei · deine Antwort: <b>' + (s ? esc(STATUS[s]) : 'keine') + '</b>. Änderungen bitte direkt ans Trainerteam.</div>';
      }
    }
    // Fahrgemeinschaften
    if (this.mitFahrten(t) && !t.abgesagt) h += this.fahrtenHtml(t, ichDabei && !vorbei && Antwort.offen(t));
    // Aufgaben
    const aufg = Object.entries(t.aufgaben || {}).sort((a, b) => (a[1].nr || 0) - (b[1].nr || 0));
    if (aufg.length && !t.abgesagt) {
      h += '<div class="gruppe-kopf">🧺 Aufgaben</div><div class="card flach" style="box-shadow:none;background:var(--zebra)">';
      aufg.forEach(([aid, a]) => {
        const belegt = S.aufgaben.filter(u => u.termin === t.id && u.aufgabe === aid);
        h += '<div class="aufgabe"><b>' + esc(a.titel) + '</b> <span class="pill">' + belegt.length + '/' + a.plaetze + '</span><div class="slots">';
        for (let p = 0; p < a.plaetze; p++) {
          const u = belegt.find(x => x.platz === p);
          if (u) h += '<button class="slot' + (u.spieler === id ? ' mein' : '') + '" data-auf="' + esc(aid) + '" data-platz="' + p + '">' + esc(mName(u.spieler)) + (u.spieler === id ? ' ✕' : '') + '</button>';
          else h += '<button class="slot frei" data-auf="' + esc(aid) + '" data-platz="' + p + '">＋ frei</button>';
        }
        h += '</div></div>';
      });
      h += '</div>';
    }
    // Hallendienst am selben Tag
    const hd = Hd.amTag(t.datum);
    if (hd.length) h += Hd.tagHtml(t.datum, hd);
    // Teilnehmende
    const anw = t.anwesenheit || {};
    const person = (x, extra) => {
      const a = x.a, m = x.m, st = a ? a.status : '';
      const cls = st === 'ja' ? 'ja' : st === 'nein' ? 'nein' : st === 'vielleicht' ? 'vl' : '';
      let unter = [];
      if (a && a.grund) unter.push(esc(a.grund));
      if (a && a.auto === 'standard') unter.push('automatisch');
      if (a && a.von) unter.push('eingetragen von ' + esc(a.von));
      if (a && a.at && a.at.toMillis && !a.auto) unter.push(seitText(a.at.toMillis()));
      return '<div class="person' + (S.istAdmin ? ' klick' : '') + '" data-pers="' + m.id + '"><div class="av ' + cls + '">' + esc(m.nr || initialen(m.name)) + '</div><div class="t">' + esc(m.name) + (m.id === id ? ' <span class="pill">du</span>' : '') + (unter.length ? '<small>' + unter.join(' · ') + '</small>' : '') + '</div>'
        + (anw[m.id] ? '<span class="pill ' + (anw[m.id] === 'da' ? 'gruen' : anw[m.id] === 'spaet' ? 'gelb' : anw[m.id] === 'ent' ? 'blau' : 'rot') + '">' + esc(ANW_NAME[anw[m.id]]) + '</span>' : '') + (extra || '') + '</div>';
    };
    const gruppe = (titel, l, farbe, extra) => l.length ? '<div class="gruppe-kopf"><span style="color:var(--' + farbe + ')">' + titel + '</span><span class="z">' + l.length + '</span></div><div class="card flach" style="box-shadow:none;background:var(--zebra)">' + l.map(x => person(x, extra)).join('') + '</div>' : '';
    if (!t.abgesagt) {
      h += '<div class="modal-abschnitt"></div>';
      if (t.kader && t.kader.length) h += '<div class="hinweis">Nominiert: ' + t.kader.length + ' von ' + mitglieder().length + '</div>';
      h += gruppe('✓ Zugesagt', z.ja, 'gruen');
      h += gruppe('⏳ Warteliste', z.warte, 'gelb');
      h += gruppe('? Vielleicht', z.vielleicht, 'gelb');
      h += gruppe('✗ Abgesagt', z.nein, 'rot');
      h += gruppe('○ Keine Antwort', z.offen, 'muted');
      // Nicht eingeladene, aber mit Anwesenheit (z. B. Gastspieler aus dem Kader)
      const extraAnw = Object.keys(anw).filter(mid => !eingeladen(t).some(m => m.id === mid) && mitglied(mid));
      if (extraAnw.length) h += gruppe('Zusätzlich dabei', extraAnw.map(mid => ({ m: mitglied(mid), a: null })), 'blau');
    }
    h += '<div class="btn-reihe" style="margin-top:14px"><button class="btn klein sekundaer" data-a="teilen">📤 Teilen</button><button class="btn klein sekundaer" data-a="ics">📆 In Kalender</button></div>';
    return h;
  },
  mitFahrten(t) { return t.fahrten === true || (t.fahrten !== false && t.typ === 'spiel' && t.heim === false); },
  fahrtenHtml(t, darf) {
    const id = ichId();
    const alle = [...S.antworten.values()].filter(a => a.termin === t.id && a.status !== 'nein');
    const fahrer = alle.filter(a => a.auto > 0), suchen = alle.filter(a => a.mitfahrt);
    const plaetze = fahrer.reduce((s, a) => s + a.auto, 0);
    const meine = id ? S.antworten.get(t.id + '_' + id) : null;
    let h = '<div class="gruppe-kopf">🚗 Fahrgemeinschaften<span class="z">' + plaetze + ' freie Plätze · ' + suchen.length + ' suchen</span></div><div class="card" style="box-shadow:none;background:var(--zebra);padding:10px 12px">';
    if (fahrer.length) h += fahrer.map(a => '<div style="font-size:.88rem;padding:3px 0">🚗 <b>' + esc(mName(a.spieler)) + '</b> – ' + a.auto + ' freie' + (a.auto === 1 ? 'r Platz' : ' Plätze') + '</div>').join('');
    if (suchen.length) h += '<div style="font-size:.88rem;padding:3px 0">🙋 Suchen Mitfahrt: <b>' + suchen.map(a => esc(mName(a.spieler))).join(', ') + '</b></div>';
    if (!fahrer.length && !suchen.length) h += '<div style="font-size:.86rem;color:var(--muted)">Noch keine Angebote.</div>';
    if (darf) {
      if (meine && meine.status !== 'nein') {
        h += '<div class="zwei" style="margin-top:9px"><select class="ein" id="f-auto"><option value="0">Ich fahre nicht</option>' + [1, 2, 3, 4, 5, 6, 7, 8].map(n => '<option value="' + n + '"' + (meine.auto === n ? ' selected' : '') + '>Ich fahre · ' + n + ' frei</option>').join('') + '</select>'
          + '<label class="check" style="padding:0"><input type="checkbox" id="f-mit"' + (meine.mitfahrt ? ' checked' : '') + '>Ich suche eine Mitfahrt</label></div>';
      } else h += '<div class="hinweis">Sag zuerst zu, dann kannst du Plätze anbieten oder eine Mitfahrt suchen.</div>';
    }
    return h + '</div>';
  },
  knoepfe(el, t) {
    el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => Antwort.setzen(t.id, ichId(), b.dataset.st));
    el.querySelectorAll('[data-a]').forEach(b => b.onclick = e => { e.preventDefault(); this.aktion(b.dataset.a, t); });
    const fa = el.querySelector('#f-auto'), fm = el.querySelector('#f-mit');
    const fahrt = () => { const a = S.antworten.get(t.id + '_' + ichId()); if (!a) return; Antwort.setzen(t.id, ichId(), a.status, { auto: Number(fa.value), mitfahrt: fm.checked, grund: a.grund || '' }).then(() => fa.blur()); };
    if (fa) fa.onchange = fahrt;
    if (fm) fm.onchange = fahrt;
    el.querySelectorAll('[data-auf]').forEach(b => b.onclick = () => Aufgaben.klick(t, b.dataset.auf, Number(b.dataset.platz)));
    if (S.istAdmin) el.querySelectorAll('[data-pers]').forEach(p => p.onclick = () => this.fuerAndere(t, p.dataset.pers));
    Hd.knoepfe(el);
  },
  async aktion(a, t) {
    if (a === 'ich') { App.ichWaehlen(); return; }
    if (a === 'grund') { const alt = S.antworten.get(t.id + '_' + ichId()); const g = await Antwort.grundFragen(t, ichId(), alt && alt.grund); if (g !== null) Antwort.setzen(t.id, ichId(), 'nein', { grund: g }); return; }
    if (a === 'bearbeiten') { Editor.oeffnen(t); return; }
    if (a === 'anwesenheit') { Anwesenheit.oeffnen(t); return; }
    if (a === 'erinnern') { this.erinnern(t); return; }
    if (a === 'strafen') { Sk.strafenModal(t); return; }
    if (a === 'teilen') { this.teilen(t); return; }
    if (a === 'ics') { Kalender.export(false, [t]); return; }
    if (a === 'mehr') {
      const w = await auswahl('Termin', esc(t.titel || TYPEN[t.typ].name) + ' · ' + esc(tagKurz(startVon(t))), [
        { text: '⏰ Erinnerung an fehlende Antworten', wert: 'erinnern' },
        ...(hatBegonnen(t) && !t.abgesagt ? [] : []),
        { text: '✅ Anwesenheit erfassen', wert: 'anwesenheit' },
        { text: '⧉ Duplizieren', wert: 'dup' },
        { text: t.abgesagt ? '↩︎ Wieder stattfinden lassen' : '❌ Absagen (bleibt sichtbar)', wert: 'absagen' },
        { text: '🗑 Löschen', wert: 'loeschen', stil: 'gefahr' },
      ]);
      if (w === 'erinnern') this.erinnern(t);
      if (w === 'anwesenheit') Anwesenheit.oeffnen(t);
      if (w === 'dup') Editor.oeffnen(t, true);
      if (w === 'absagen') Editor.absagen(t);
      if (w === 'loeschen') Editor.loeschen(t);
    }
  },
  async fuerAndere(t, mid) {
    const a = S.antworten.get(t.id + '_' + mid);
    const w = await auswahl(mName(mid), 'Antwort für ' + esc(vorname(mName(mid))) + ' eintragen (Verwaltung).', [
      { text: '✓ Zusage', wert: 'ja', stil: 'gruen' }, { text: '? Vielleicht', wert: 'vielleicht' }, { text: '✗ Absage', wert: 'nein', stil: 'gefahr' },
      ...(a ? [{ text: 'Antwort löschen', wert: 'weg' }] : []), { text: '👤 Profil ansehen', wert: 'profil' },
    ]);
    if (!w) return;
    if (w === 'weg') Antwort.loeschen(t.id, mid);
    else if (w === 'profil') Profil.oeffnen(mid);
    else Antwort.setzen(t.id, mid, w);
  },
  titelText(t) { return t.typ === 'spiel' && t.gegner ? (t.heim !== false ? 'Heimspiel gegen ' : 'Auswärtsspiel bei ') + t.gegner : (t.titel || TYPEN[t.typ].name); },
  erinnern(t) {
    const z = zaehlen(t);
    const fehlt = [...z.offen, ...z.vielleicht].map(x => x.m);
    if (!fehlt.length) { toast('Alle haben geantwortet. 👍'); return; }
    const st = startVon(t);
    const text = '⏰ Bitte noch in der Kabine antworten:\n' + this.titelText(t) + ' – ' + tagKurz(st) + ', ' + (t.von || hhmm(st)) + ' Uhr\n\n'
      + fehlt.map(m => '• ' + m.name + (z.vielleicht.some(x => x.m.id === m.id) ? ' (vielleicht)' : '')).join('\n') + '\n\nAntwort bis ' + tagKurz(fristVon(t)) + ', ' + hhmm(fristVon(t)) + ' Uhr: ' + teamLink();
    this.teilenText(text);
  },
  teilen(t) {
    const z = zaehlen(t), st = startVon(t);
    let text = (TYPEN[t.typ] || TYPEN.event).ico + ' ' + this.titelText(t) + '\n📅 ' + tagLang(st) + ', ' + (t.von || hhmm(st)) + (t.bis ? '–' + t.bis : '') + ' Uhr' + (t.treff ? '\n⏱ Treffpunkt ' + t.treff + ' Uhr' : '') + (t.ort ? '\n📍 ' + t.ort : '');
    if (t.abgesagt) text += '\n❌ FÄLLT AUS' + (t.absageGrund ? ': ' + t.absageGrund : '');
    else text += '\n\n✓ Zugesagt (' + z.ja.length + '): ' + (z.ja.map(x => x.m.name).join(', ') || '–') + (z.nein.length ? '\n✗ Abgesagt (' + z.nein.length + '): ' + z.nein.map(x => x.m.name).join(', ') : '') + (z.offen.length ? '\n○ Offen (' + z.offen.length + '): ' + z.offen.map(x => x.m.name).join(', ') : '');
    this.teilenText(text + '\n\n' + teamLink());
  },
  async teilenText(text) {
    if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    App.kopieren(text, 'Text kopiert – in die Gruppe einfügen.');
  },
};

// ---------------- Aufgaben (Fahrdienst, Trikots …) ----------------
const Aufgaben = {
  async klick(t, aid, platz) {
    const id = ichId(); if (!id) { App.ichWaehlen(); return; }
    const docId = t.id + '_' + aid + '_' + platz;
    const u = S.aufgaben.find(x => x.id === docId);
    const a = (t.aufgaben || {})[aid]; if (!a) return;
    try {
      await Fb.sicherAngemeldet();
      if (u) {
        if (u.spieler !== id && !S.istAdmin) { toast(mName(u.spieler) + ' hat das übernommen.'); return; }
        if (!(await fragen('Austragen?', esc(mName(u.spieler)) + ' aus „' + esc(a.titel) + '“ austragen?', 'Austragen'))) return;
        await Fb.col('aufgaben').doc(docId).delete(); toast('Ausgetragen.');
      } else {
        let wer = id;
        if (S.istAdmin) {
          const w = await auswahl(a.titel, 'Wer übernimmt?', [{ text: 'Ich (' + vorname(mName(id)) + ')', wert: id, stil: '' }, { text: 'Jemand anderes …', wert: '_' }]);
          if (!w) return;
          if (w === '_') { wer = await this.personWaehlen(t); if (!wer) return; }
        }
        if (S.aufgaben.some(x => x.termin === t.id && x.aufgabe === aid && x.spieler === wer)) { toast('Ist schon eingetragen.'); return; }
        await Fb.col('aufgaben').doc(docId).set({ termin: t.id, aufgabe: aid, platz, spieler: wer, name: mName(wer).slice(0, 40), start: t.start, uid: Fb.uid(), at: Fb.jetzt() });
        toast('Eingetragen: ' + a.titel + ' 👍');
      }
    } catch (e) { toast(fehlerText(e), 6000); }
  },
  personWaehlen(t) {
    return new Promise(res => {
      const l = eingeladen(t);
      const m = oeffneModal('<h3>Wer übernimmt?</h3><div class="wahl-liste">' + l.map(x => '<button data-id="' + x.id + '">' + esc(x.name) + '</button>').join('') + '</div><div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button></div>');
      const bg = m.parentNode; let fertig = false;
      const ende = v => { if (fertig) return; fertig = true; Modal.schliessen(bg); res(v); };
      m.querySelectorAll('[data-id]').forEach(b => b.onclick = () => ende(b.dataset.id));
      Modal.beimSchliessen(() => ende(null));
    });
  },
};

// ---------------- Anwesenheit erfassen ----------------
const Anwesenheit = {
  oeffnen(t) {
    const alt = t.anwesenheit || {};
    const stand = {};
    const liste = mitglieder().slice().sort((a, b) => (eingeladen(t).includes(b) ? 1 : 0) - (eingeladen(t).includes(a) ? 1 : 0));
    const vorgabe = !Object.keys(alt).length;
    liste.forEach(m => {
      if (alt[m.id]) stand[m.id] = alt[m.id];
      else if (vorgabe) { const a = antwortVon(t, m.id); if (a && a.status === 'ja' && eingeladen(t).some(x => x.id === m.id)) stand[m.id] = 'da'; else if (a && a.status === 'nein') stand[m.id] = 'ent'; }
    });
    const m = oeffneModal('<h3>✅ Anwesenheit</h3><div class="unter">' + esc(Detail.titelText(t)) + ' · ' + esc(tagKurz(startVon(t))) + (vorgabe ? '<br>Vorausgefüllt aus den Antworten – bitte prüfen.' : '') + '</div>'
      + '<div class="legende" style="margin-top:10px"><span>✓ da</span><span>⏰ zu spät</span><span>✗ unentschuldigt</span><span>E entschuldigt</span></div>'
      + '<div id="anw-liste"></div><div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="anw-ok">Speichern</button></div>', { zu: true });
    const zeichnen = () => {
      m.querySelector('#anw-liste').innerHTML = liste.map(x => {
        const a = antwortVon(t, x.id), dabei = eingeladen(t).some(y => y.id === x.id);
        return '<div class="anw-reihe"><div class="t">' + esc(x.name) + '<small>' + (dabei ? (a ? esc(STATUS[a.status]) + (a.grund ? ' – ' + esc(a.grund) : '') : 'keine Antwort') : 'nicht nominiert') + '</small></div><div class="anw-knoepfe">'
          + ['da', 'spaet', 'fehlt', 'ent'].map(k => '<button data-m="' + x.id + '" data-k="' + k + '" class="' + k + (stand[x.id] === k ? ' an' : '') + '">' + ANW[k] + '</button>').join('') + '</div></div>';
      }).join('');
      m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const id = b.dataset.m; stand[id] = stand[id] === b.dataset.k ? undefined : b.dataset.k; if (!stand[id]) delete stand[id]; zeichnen(); });
    };
    zeichnen();
    m.querySelector('#anw-ok').onclick = async () => {
      try { await Fb.col('termine').doc(t.id).update({ anwesenheit: stand, aktualisiert: Fb.jetzt() }); Modal.schliessen(m.parentNode); toast('Anwesenheit gespeichert.');
        if (Sk.istKassenwart() && Sk.vorschlaege({ ...t, anwesenheit: stand }).length) { if (await fragen('Strafen buchen?', 'Für diesen Termin gibt es Strafen-Vorschläge (z. B. unentschuldigt gefehlt).', 'Ansehen')) Sk.strafenModal({ ...t, anwesenheit: stand }); }
      } catch (e) { toast(fehlerText(e), 6000); }
    };
  },
};
</script>
<script>
// ---------------- Termin anlegen / bearbeiten ----------------
const Editor = {
  oeffnen(t, duplikat) {
    if (!S.istAdmin) return;
    const neu = !t || duplikat, e = einst();
    const morgen = new Date(Date.now() + 864e5);
    const v = t ? { ...t } : { typ: 'training', datum: isoDatum(morgen), von: '19:00', bis: '20:30', treff: '', ort: '', adresse: '', titel: '', notiz: '', frist: e.frist, standard: e.stdTraining, max: 0, kader: [], pflicht: false, aufgaben: {}, heim: true, gegner: '' };
    if (duplikat) { v.datum = isoDatum(new Date(startVon(t).getTime() + 7 * 864e5)); delete v.serie; delete v.quelle; delete v.anwesenheit; delete v.ergebnis; v.abgesagt = false; }
    let kader = new Set(v.kader || []);
    let aufg = Object.entries(v.aufgaben || {}).sort((a, b) => (a[1].nr || 0) - (b[1].nr || 0)).map(([id, a]) => ({ id, titel: a.titel, plaetze: a.plaetze }));
    const orte = [...new Set(S.termine.map(x => x.ort).filter(Boolean))].slice(-12);
    const m = oeffneModal('<h3>' + (t && !duplikat ? 'Termin bearbeiten' : 'Neuer Termin') + '</h3>'
      + '<div class="segment" id="e-typ" style="margin-top:10px">' + Object.entries(TYPEN).map(([k, x]) => '<button data-typ="' + k + '" class="' + (v.typ === k ? 'aktiv' : '') + '">' + x.ico + ' ' + x.name + '</button>').join('') + '</div>'
      + '<div id="e-spiel"><div class="zwei"><div><label class="feld">Gegner</label><input class="ein" id="e-gegner" maxlength="60" value="' + esc(v.gegner || '') + '"></div><div><label class="feld">Spielort</label><select class="ein" id="e-heim"><option value="1"' + (v.heim !== false ? ' selected' : '') + '>Heimspiel</option><option value="0"' + (v.heim === false ? ' selected' : '') + '>Auswärts</option></select></div></div></div>'
      + '<label class="feld">Titel <span style="font-weight:500" id="e-titel-hint"></span></label><input class="ein" id="e-titel" maxlength="80" value="' + esc(v.titel || '') + '" placeholder="z. B. Training, Mannschaftsabend">'
      + '<label class="feld">Datum</label><input class="ein" type="date" id="e-datum" value="' + esc(v.datum) + '">'
      + '<div class="drei"><div><label class="feld">Beginn</label><input class="ein" type="time" id="e-von" value="' + esc(v.von || '') + '"></div><div><label class="feld">Ende</label><input class="ein" type="time" id="e-bis" value="' + esc(v.bis || '') + '"></div><div><label class="feld">Treffpunkt</label><input class="ein" type="time" id="e-treff" value="' + esc(v.treff || '') + '"></div></div>'
      + '<label class="feld">Ort</label><input class="ein" id="e-ort" maxlength="80" list="e-orte" value="' + esc(v.ort || '') + '" placeholder="z. B. Sporthalle Krofdorf"><datalist id="e-orte">' + orte.map(o => '<option value="' + esc(o) + '">').join('') + '</datalist>'
      + '<label class="feld">Adresse (für die Karte, optional)</label><input class="ein" id="e-adresse" maxlength="120" value="' + esc(v.adresse || '') + '">'
      + '<label class="feld">Notiz</label><textarea class="ein" id="e-notiz" maxlength="2000" placeholder="Infos, Trikotfarbe, mitbringen …">' + esc(v.notiz || '') + '</textarea>'
      + '<div class="modal-abschnitt"><label class="feld">Antworten bis</label><select class="ein" id="e-frist">' + FRISTEN.map(([h, n]) => '<option value="' + h + '"' + ((v.frist || 0) === h ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>'
      + '<label class="check"><input type="checkbox" id="e-standard"' + (v.standard === 'ja' ? ' checked' : '') + '><span>Automatisch zusagen<small>Alle gelten als zugesagt – wer nicht kann, sagt ab (praktisch fürs Training)</small></span></label>'
      + '<label class="check"><input type="checkbox" id="e-pflicht"' + (v.pflicht ? ' checked' : '') + '><span>Pflichttermin<small>Für Strafen-Vorschläge bei unentschuldigtem Fehlen</small></span></label>'
      + '<label class="check"><input type="checkbox" id="e-fahrten"' + (Detail.mitFahrten(v) ? ' checked' : '') + '><span>Fahrgemeinschaften<small>Plätze anbieten / Mitfahrt suchen</small></span></label>'
      + '<div class="zwei"><div><label class="feld">Max. Teilnehmende</label><input class="ein" type="number" min="0" max="80" id="e-max" value="' + (v.max || 0) + '" inputmode="numeric"></div><div><label class="feld">&nbsp;</label><div class="hinweis" style="margin:0">0 = unbegrenzt, sonst Warteliste</div></div></div></div>'
      + '<div class="modal-abschnitt"><label class="feld">Wer ist eingeladen? <span id="e-kader-z" style="font-weight:500"></span></label><div class="chips-wahl" id="e-kader"></div><div class="hinweis">Nichts gewählt = ganze Mannschaft. Für Spiele: Kader nominieren.</div></div>'
      + '<div class="modal-abschnitt"><label class="feld">Aufgaben (Fahrdienst, Trikots waschen …)</label><div id="e-aufg"></div><div class="chips-wahl" id="e-aufg-vorschlag">' + AUFGABEN_VORSCHLAEGE.map(a => '<button data-v="' + esc(a) + '">＋ ' + esc(a) + '</button>').join('') + '</div></div>'
      + (neu ? '<div class="modal-abschnitt"><label class="feld">Wiederholen</label><select class="ein" id="e-wdh"><option value="0">Einmalig</option><option value="7">Jede Woche</option><option value="14">Alle 2 Wochen</option></select><div id="e-wdh-bis" style="display:none"><label class="feld">Bis einschließlich</label><input class="ein" type="date" id="e-bisdatum"><div class="hinweis" id="e-wdh-info"></div></div></div>' : (t.serie ? '<div class="hinweis">Gehört zu einer Terminserie.</div>' : ''))
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="e-ok">Speichern</button></div>', { zu: true });
    const bg = m.parentNode;
    let typ = v.typ;
    const q = s => m.querySelector(s);
    const typZeigen = () => {
      m.querySelectorAll('[data-typ]').forEach(b => b.classList.toggle('aktiv', b.dataset.typ === typ));
      q('#e-spiel').style.display = typ === 'spiel' ? '' : 'none';
      q('#e-titel-hint').textContent = typ === 'spiel' ? '(optional, z. B. Pokal)' : '';
      q('#e-titel').placeholder = typ === 'training' ? 'Training' : typ === 'spiel' ? 'Punktspiel' : 'z. B. Mannschaftsabend';
    };
    m.querySelectorAll('[data-typ]').forEach(b => b.onclick = () => {
      typ = b.dataset.typ; typZeigen();
      if (neu) { q('#e-standard').checked = typ === 'training' && e.stdTraining === 'ja'; q('#e-fahrten').checked = typ === 'spiel' && q('#e-heim').value === '0'; }
    });
    q('#e-heim').onchange = () => { q('#e-fahrten').checked = q('#e-heim').value === '0'; };
    typZeigen();
    const kaderZeichnen = () => {
      const l = mitglieder();
      q('#e-kader').innerHTML = '<button data-k="_alle" class="' + (!kader.size ? 'an' : '') + '">Alle</button>' + l.map(x => '<button data-k="' + x.id + '" class="' + (kader.has(x.id) ? 'an' : '') + '">' + esc(x.nr ? x.nr + ' ' : '') + esc(x.name) + '</button>').join('');
      q('#e-kader-z').textContent = kader.size ? '(' + kader.size + ' nominiert)' : '(alle ' + l.length + ')';
      q('#e-kader').querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.k === '_alle') kader.clear(); else if (kader.has(b.dataset.k)) kader.delete(b.dataset.k); else kader.add(b.dataset.k); kaderZeichnen(); });
    };
    kaderZeichnen();
    const aufgLesen = () => { m.querySelectorAll('.aufgabe-zeile').forEach((z, i) => { aufg[i].titel = z.querySelector('[data-t]').value; aufg[i].plaetze = Number(z.querySelector('[data-p]').value) || 1; }); };
    const aufgZeichnen = () => {
      q('#e-aufg').innerHTML = aufg.map((a, i) => '<div class="aufgabe-zeile"><input class="ein" data-t maxlength="40" value="' + esc(a.titel) + '" placeholder="Aufgabe"><input class="ein" data-p type="number" min="1" max="20" value="' + a.plaetze + '" inputmode="numeric"><button class="x-btn" data-weg="' + i + '">✕</button></div>').join('');
      q('#e-aufg').querySelectorAll('[data-weg]').forEach(b => b.onclick = () => { aufgLesen(); aufg.splice(Number(b.dataset.weg), 1); aufgZeichnen(); });
    };
    aufgZeichnen();
    q('#e-aufg-vorschlag').querySelectorAll('button').forEach(b => b.onclick = () => { aufgLesen(); if (aufg.length >= 10) { toast('Höchstens 10 Aufgaben.'); return; } aufg.push({ id: 'a' + zufallsId(6), titel: b.dataset.v, plaetze: b.dataset.v === 'Fahrdienst' ? 3 : 1 }); aufgZeichnen(); });
    const wdhInfo = () => {
      const w = Number(q('#e-wdh').value); q('#e-wdh-bis').style.display = w ? '' : 'none';
      if (!w) return;
      if (!q('#e-bisdatum').value) { const d = ausDatum(q('#e-datum').value); d.setDate(d.getDate() + 7 * 12); q('#e-bisdatum').value = isoDatum(d); }
      const n = this.serienDaten(q('#e-datum').value, q('#e-bisdatum').value, w).length;
      q('#e-wdh-info').textContent = n + ' Termine' + (n >= 60 ? ' (Höchstzahl)' : '');
    };
    if (neu) { q('#e-wdh').onchange = wdhInfo; q('#e-bisdatum').onchange = wdhInfo; q('#e-datum').addEventListener('change', wdhInfo); }
    q('#e-ok').onclick = async () => {
      aufgLesen();
      const datum = q('#e-datum').value, von = q('#e-von').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(datum)) { toast('Bitte ein Datum wählen.'); return; }
      if (!/^\d{2}:\d{2}$/.test(von)) { toast('Bitte eine Uhrzeit für den Beginn wählen.'); return; }
      const gegner = q('#e-gegner').value.trim();
      if (typ === 'spiel' && !gegner && !q('#e-titel').value.trim()) { toast('Bitte den Gegner eintragen.'); return; }
      const aufgaben = {};
      aufg.filter(a => a.titel.trim()).forEach((a, i) => { aufgaben[a.id] = { titel: a.titel.trim().slice(0, 40), plaetze: Math.max(1, Math.min(20, a.plaetze)), nr: i }; });
      const daten = {
        typ, titel: q('#e-titel').value.trim(), von, bis: q('#e-bis').value || '', treff: q('#e-treff').value || '',
        ort: q('#e-ort').value.trim(), adresse: q('#e-adresse').value.trim(), notiz: q('#e-notiz').value.trim(),
        gegner: typ === 'spiel' ? gegner : '', heim: typ === 'spiel' ? q('#e-heim').value === '1' : true,
        frist: Number(q('#e-frist').value) || 0, standard: q('#e-standard').checked ? 'ja' : 'offen', pflicht: q('#e-pflicht').checked,
        fahrten: q('#e-fahrten').checked, max: Math.max(0, Math.min(80, Number(q('#e-max').value) || 0)), kader: [...kader], aufgaben,
      };
      q('#e-ok').disabled = true;
      try {
        if (neu) {
          const w = Number(q('#e-wdh').value);
          const tage = w ? this.serienDaten(datum, q('#e-bisdatum').value, w) : [datum];
          const serie = tage.length > 1 ? 's' + zufallsId(10) : '';
          const batch = Fb.db.batch();
          tage.forEach(d => batch.set(Fb.col('termine').doc(), this.dokument({ ...daten, datum: d, serie, abgesagt: false, absageGrund: '', anwesenheit: {}, quelle: '', erstellt: Fb.jetzt() })));
          await batch.commit();
          Modal.schliessen(bg); toast(tage.length > 1 ? tage.length + ' Termine angelegt.' : 'Termin angelegt.');
        } else {
          let alle = [t];
          if (t.serie) {
            const folgende = S.termine.filter(x => x.serie === t.serie && startVon(x) >= startVon(t));
            if (folgende.length > 1) {
              const w = await auswahl('Terminserie', 'Änderungen nur für diesen Termin oder auch für alle folgenden (' + folgende.length + ')?', [{ text: 'Nur diesen Termin', wert: 'einer' }, { text: 'Diesen und alle folgenden', wert: 'alle', stil: '' }]);
              if (!w) { q('#e-ok').disabled = false; return; }
              if (w === 'alle') alle = folgende;
            }
          }
          const batch = Fb.db.batch();
          alle.forEach(x => {
            const d = x.id === t.id ? datum : x.datum; // Folgetermine behalten ihr Datum
            batch.update(Fb.col('termine').doc(x.id), this.dokument({ ...daten, datum: d }, true));
          });
          await batch.commit();
          // Neue Startzeit in den Antworten nachziehen (sie hängen am Beginn)
          await this.antwortenNachziehen(alle.map(x => x.id));
          Modal.schliessen(bg); toast(alle.length > 1 ? alle.length + ' Termine geändert.' : 'Gespeichert.');
        }
      } catch (err) { q('#e-ok').disabled = false; toast(fehlerText(err), 6000); }
    };
  },
  serienDaten(von, bis, abstand) {
    const l = []; const d = ausDatum(von); const ende = ausDatum(bis || von);
    while (d <= ende && l.length < 60) { l.push(isoDatum(d)); d.setDate(d.getDate() + abstand); }
    return l;
  },
  dokument(x, update) {
    const start = ausDatum(x.datum, x.von);
    const doc = { ...x, start: Fb.ts(start), fristBis: Fb.ts(new Date(start.getTime() - (x.frist || 0) * 3600e3)), aktualisiert: Fb.jetzt() };
    if (update) delete doc.erstellt;
    return doc;
  },
  async antwortenNachziehen(ids) {
    for (const tid of ids) {
      const t = await Fb.col('termine').doc(tid).get(); if (!t.exists) continue;
      const start = t.data().start;
      const a = [...S.antworten.values()].filter(x => x.termin === tid && (!x.start || !x.start.isEqual || !x.start.isEqual(start)));
      const u = S.aufgaben.filter(x => x.termin === tid && (!x.start || !x.start.isEqual || !x.start.isEqual(start)));
      if (!a.length && !u.length) continue;
      const batch = Fb.db.batch();
      // Verwaltung schreibt die Antwort mit dem neuen Beginn neu (uid/at werden aktualisiert)
      a.forEach(x => { const { id, ...r } = x; batch.set(Fb.col('antworten').doc(id), { ...r, start, uid: Fb.uid(), at: Fb.jetzt() }); });
      u.forEach(x => { const { id, ...r } = x; batch.set(Fb.col('aufgaben').doc(id), { ...r, start, uid: Fb.uid(), at: Fb.jetzt() }); });
      try { await batch.commit(); } catch (e) { /* nicht kritisch */ }
    }
  },
  async absagen(t) {
    if (t.abgesagt) { try { await Fb.col('termine').doc(t.id).update({ abgesagt: false, absageGrund: '', aktualisiert: Fb.jetzt() }); toast('Termin findet wieder statt.'); } catch (e) { toast(fehlerText(e), 6000); } return; }
    const m = oeffneModal('<h3>Termin absagen</h3><div class="unter">Der Termin bleibt in der Liste und ist als „fällt aus“ markiert.</div><label class="feld">Grund (optional)</label><input class="ein" id="ab-grund" maxlength="120" placeholder="z. B. Halle gesperrt">'
      + (t.serie ? '<label class="check"><input type="checkbox" id="ab-alle"><span>Auch alle folgenden Termine der Serie</span></label>' : '')
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Zurück</button><button class="btn" id="ab-ok">Absagen</button></div>');
    m.querySelector('#ab-ok').onclick = async () => {
      const alle = t.serie && m.querySelector('#ab-alle') && m.querySelector('#ab-alle').checked ? S.termine.filter(x => x.serie === t.serie && startVon(x) >= startVon(t)) : [t];
      const batch = Fb.db.batch();
      alle.forEach(x => batch.update(Fb.col('termine').doc(x.id), { abgesagt: true, absageGrund: m.querySelector('#ab-grund').value.trim().slice(0, 120), aktualisiert: Fb.jetzt() }));
      try { await batch.commit(); Modal.schliessen(m.parentNode); toast(alle.length > 1 ? alle.length + ' Termine abgesagt.' : 'Abgesagt.'); } catch (e) { toast(fehlerText(e), 6000); }
    };
  },
  async loeschen(t) {
    let alle = [t];
    if (t.serie) {
      const folgende = S.termine.filter(x => x.serie === t.serie && startVon(x) >= startVon(t));
      if (folgende.length > 1) {
        const w = await auswahl('Löschen', 'Nur diesen Termin oder auch alle folgenden der Serie (' + folgende.length + ')?', [{ text: 'Nur diesen', wert: 'einer', stil: 'gefahr' }, { text: 'Diesen und alle folgenden', wert: 'alle', stil: 'gefahr' }]);
        if (!w) return; if (w === 'alle') alle = folgende;
      } else if (!(await fragen('Termin löschen?', 'Antworten und Aufgaben dazu werden mitgelöscht.', 'Löschen', true))) return;
    } else if (!(await fragen('Termin löschen?', 'Antworten und Aufgaben dazu werden mitgelöscht. Tipp: „Absagen“ lässt ihn sichtbar.', 'Löschen', true))) return;
    try {
      const ids = new Set(alle.map(x => x.id));
      const docs = [...alle.map(x => Fb.col('termine').doc(x.id)),
        ...[...S.antworten.values()].filter(a => ids.has(a.termin)).map(a => Fb.col('antworten').doc(a.id)),
        ...S.aufgaben.filter(a => ids.has(a.termin)).map(a => Fb.col('aufgaben').doc(a.id))];
      for (let i = 0; i < docs.length; i += 400) { const b = Fb.db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d)); await b.commit(); }
      if (Detail.bg) Modal.schliessen(Detail.bg);
      toast(alle.length > 1 ? alle.length + ' Termine gelöscht.' : 'Gelöscht.');
    } catch (e) { toast(fehlerText(e), 6000); }
  },
};

// ---------------- Pinnwand & Umfragen ----------------
const Pinnwand = {
  offeneKommentare: new Set(),
  render() {
    const el = $('#pinnwand-inhalt'); if (!S.team) { el.innerHTML = '<div class="leer">Lade …</div>'; return; }
    const darf = S.istAdmin || !einst().postsNur;
    let h = '';
    if (darf) h += '<div class="card"><textarea class="ein" id="p-text" maxlength="2000" placeholder="Nachricht an die Mannschaft …" style="min-height:70px"></textarea>'
      + '<div id="p-umfrage" style="display:none"><label class="feld">Antwortmöglichkeiten</label><div id="p-optionen"></div><button class="btn mini sekundaer" id="p-opt-plus" style="margin-top:7px">＋ Möglichkeit</button><label class="check"><input type="checkbox" id="p-mehrfach">Mehrfachauswahl erlauben</label><label class="feld">Abstimmen bis (optional)</label><input class="ein" type="date" id="p-ende"></div>'
      + '<div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center"><button class="btn klein sekundaer" id="p-u-btn">📊 Umfrage</button>' + (S.istAdmin ? '<label class="check" style="padding:0;font-size:.84rem"><input type="checkbox" id="p-wichtig">📌 Anheften</label>' : '') + '<button class="btn klein" id="p-senden" style="margin-left:auto">Posten</button></div></div>';
    else h += '<div class="hinweis" style="margin:0 2px 10px">Hier schreibt nur das Trainerteam. Kommentieren und abstimmen kann jede:r.</div>';
    const liste = S.posts.slice().sort((a, b) => (b.wichtig ? 1 : 0) - (a.wichtig ? 1 : 0));
    h += liste.length ? liste.map(p => this.postHtml(p)).join('') : '<div class="card leer">Noch nichts los hier. 💬</div>';
    el.innerHTML = h;
    this.knoepfe(el);
    if (darf) this.editorKnoepfe(el);
  },
  postHtml(p, kurz) {

        + (i ? '<div class="komm-eingabe"><input class="ein" maxlength="500" placeholder="Kommentieren …" data-k-in="' + p.id + '"><button class="btn mini" data-k-send="' + p.id + '">➤</button></div>' : '') + '</div>';

  editorKnoepfe(el) {
    const opt = [];

      el.querySelector('#p-optionen').innerHTML = opt.map((o, k) => '<div class="aufgabe-zeile" style="grid-template-columns:1fr 34px"><input class="ein" maxlength="80" data-o="' + k + '" value="' + esc(o) + '" placeholder="Möglichkeit ' + (k + 1) + '"><button class="x-btn" data-ow="' + k + '">✕</button></div>').join('');
      el.querySelectorAll('[data-o]').forEach(x => x.oninput = () => { opt[Number(x.dataset.o)] = x.value; });
      el.querySelectorAll('[data-ow]').forEach(x => x.onclick = () => { opt.splice(Number(x.dataset.ow), 1); zeichnen(); });
    };
    el.querySelector('#p-u-btn').onclick = () => {
      const box = el.querySelector('#p-umfrage'); const an = box.style.display === 'none';
      box.style.display = an ? '' : 'none'; el.querySelector('#p-u-btn').classList.toggle('an', an);
      el.querySelector('#p-text').placeholder = an ? 'Frage, z. B. Wann Weihnachtsfeier?' : 'Nachricht an die Mannschaft …';
      if (an && !opt.length) { opt.push('', ''); zeichnen(); }
    };
    el.querySelector('#p-opt-plus').onclick = () => { if (opt.length >= 10) return; opt.push(''); zeichnen(); };
    el.querySelector('#p-senden').onclick = async () => {
      const i = ich(); if (!i && !S.istAdmin) { App.ichWaehlen(); return; }
      const text = el.querySelector('#p-text').value.trim();
      const istU = el.querySelector('#p-umfrage').style.display !== 'none';
      const optionen = opt.map(o => o.trim()).filter(Boolean);
      if (istU && optionen.length < 2) { toast('Eine Umfrage braucht mindestens zwei Möglichkeiten.'); return; }
      if (!text) { toast(istU ? 'Bitte eine Frage eingeben.' : 'Bitte etwas schreiben.'); return; }
      const autor = i ? i.name : (Fb.user && Fb.user.displayName) || 'Trainerteam';
      const doc = { text: istU ? '' : text, autor: autor.slice(0, 40), spieler: i ? i.id : '', uid: null, at: null, wichtig: !!(el.querySelector('#p-wichtig') && el.querySelector('#p-wichtig').checked),
        umfrage: istU ? { frage: text.slice(0, 200), optionen: optionen.map(o => o.slice(0, 80)), mehrfach: el.querySelector('#p-mehrfach').checked, ende: el.querySelector('#p-ende').value || '', zu: false } : null };
      el.querySelector('#p-senden').disabled = true;
      try { await Fb.sicherAngemeldet(); doc.uid = Fb.uid(); doc.at = Fb.jetzt(); await Fb.col('posts').add(doc); App.pinnwandGelesen(); toast('Gepostet.'); this.render(); }
      catch (e) { el.querySelector('#p-senden').disabled = false; toast(fehlerText(e), 6000); }
