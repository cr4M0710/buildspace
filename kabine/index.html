  },
  knoepfe(el) {
    el.querySelectorAll('[data-u]').forEach(b => b.onclick = () => this.stimmen(b.dataset.u, Number(b.dataset.k)));
    el.querySelectorAll('[data-u-wer]').forEach(a => a.onclick = e => { e.preventDefault(); this.werHatGestimmt(a.dataset.uWer); });
    el.querySelectorAll('[data-k-alle]').forEach(b => b.onclick = () => { this.offeneKommentare.add(b.dataset.kAlle); this.render(); });
    el.querySelectorAll('[data-k-send]').forEach(b => b.onclick = () => this.kommentieren(b.dataset.kSend, el.querySelector('[data-k-in="' + b.dataset.kSend + '"]')));
    el.querySelectorAll('[data-k-in]').forEach(x => x.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); this.kommentieren(x.dataset.kIn, x); } });
    el.querySelectorAll('[data-k-weg]').forEach(b => b.onclick = async () => { if (!(await fragen('Kommentar löschen?', '', 'Löschen', true))) return; try { await Fb.sicherAngemeldet(); await Fb.col('kommentare').doc(b.dataset.kWeg).delete(); } catch (e) { toast(fehlerText(e), 6000); } });
    el.querySelectorAll('[data-p-mehr]').forEach(b => b.onclick = () => this.postMenue(b.dataset.pMehr));
  },
  async kommentieren(pid, inp) {
    const i = ich(); if (!i) { App.ichWaehlen(); return; }
    const text = (inp.value || '').trim(); if (!text) return;
    inp.disabled = true;
    try { await Fb.sicherAngemeldet(); await Fb.col('kommentare').add({ post: pid, text: text.slice(0, 500), autor: i.name.slice(0, 40), spieler: i.id, uid: Fb.uid(), at: Fb.jetzt() }); inp.value = ''; this.offeneKommentare.add(pid); }
    catch (e) { toast(fehlerText(e), 6000); }
    inp.disabled = false;
  },
  async stimmen(pid, k) {
    const i = ich(); if (!i) { App.ichWaehlen(); return; }
    const p = S.posts.find(x => x.id === pid); if (!p || !p.umfrage) return;
    const id = pid + '_' + i.id; const alt = S.stimmen.find(s => s.id === id);
    let wahl = alt ? (alt.wahl || []).slice() : [];
    if (p.umfrage.mehrfach) wahl = wahl.includes(k) ? wahl.filter(x => x !== k) : [...wahl, k];
    else wahl = wahl.includes(k) ? [] : [k];
    try {
      await Fb.sicherAngemeldet();
      if (!wahl.length) await Fb.col('stimmen').doc(id).delete();
      else await Fb.col('stimmen').doc(id).set({ post: pid, spieler: i.id, wahl, uid: Fb.uid(), at: Fb.jetzt() });
    } catch (e) { toast(fehlerText(e), 6000); }
  },
  werHatGestimmt(pid) {
    const p = S.posts.find(x => x.id === pid); if (!p) return;
    const st = S.stimmen.filter(s => s.post === pid && mitglied(s.spieler));
    const fehlt = mitglieder().filter(m => !st.some(s => s.spieler === m.id));
    oeffneModal('<h3>📊 ' + esc(p.umfrage.frage) + '</h3>' + p.umfrage.optionen.map((o, k) => { const w = st.filter(s => (s.wahl || []).includes(k)); return '<div class="gruppe-kopf">' + esc(o) + '<span class="z">' + w.length + '</span></div><div class="hinweis" style="margin-top:0">' + (w.map(s => esc(mName(s.spieler))).join(', ') || '–') + '</div>'; }).join('')
      + '<div class="gruppe-kopf" style="color:var(--muted)">Noch nicht abgestimmt<span class="z">' + fehlt.length + '</span></div><div class="hinweis" style="margin-top:0">' + (fehlt.map(m => esc(m.name)).join(', ') || '–') + '</div>', { zu: true });
  },
  async postMenue(pid) {
    const p = S.posts.find(x => x.id === pid); if (!p) return;
    const opt = [];
    if (S.istAdmin) opt.push({ text: p.wichtig ? 'Nicht mehr anheften' : '📌 Oben anheften', wert: 'pin' });
    if (S.istAdmin && p.umfrage && !p.umfrage.zu) opt.push({ text: 'Umfrage beenden', wert: 'zu' });
    if (p.text && p.uid === Fb.uid()) opt.push({ text: '✏️ Bearbeiten', wert: 'edit' });
    opt.push({ text: '🗑 Löschen', wert: 'weg', stil: 'gefahr' });
    const w = await auswahl('Beitrag', '', opt); if (!w) return;
    const ref = Fb.col('posts').doc(pid);
    try {
      await Fb.sicherAngemeldet();
      if (w === 'pin') await ref.update({ wichtig: !p.wichtig });
      if (w === 'zu') await ref.update({ umfrage: { ...p.umfrage, zu: true } });
      if (w === 'weg' && await fragen('Beitrag löschen?', 'Kommentare und Stimmen verschwinden mit.', 'Löschen', true)) {
        await ref.delete();
        const b = Fb.db.batch(); let n = 0;
        S.kommentare.filter(k => k.post === pid).forEach(k => { b.delete(Fb.col('kommentare').doc(k.id)); n++; });
        if (S.istAdmin) S.stimmen.filter(s => s.post === pid).forEach(s => { b.delete(Fb.col('stimmen').doc(s.id)); n++; });
        if (n) await b.commit().catch(() => {});
      }
      if (w === 'edit') {
        const m = oeffneModal('<h3>Beitrag bearbeiten</h3><textarea class="ein" id="pe-text" maxlength="2000" style="min-height:140px">' + esc(p.text) + '</textarea><div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="pe-ok">Speichern</button></div>');
        m.querySelector('#pe-ok').onclick = async () => { const t = m.querySelector('#pe-text').value.trim(); if (!t) return; try { await ref.update({ text: t }); Modal.schliessen(m.parentNode); } catch (e) { toast(fehlerText(e), 6000); } };
      }
    } catch (e) { toast(fehlerText(e), 6000); }
  },
};

// ---------------- Statistik ----------------
const Statistik = {
  zeitraum() {
    const jetzt = new Date();
    if (S.statZeitraum === '30') return [new Date(jetzt.getTime() - 30 * 864e5), jetzt];
    if (S.statZeitraum === '90') return [new Date(jetzt.getTime() - 90 * 864e5), jetzt];
    return [saisonStart(), jetzt];
  },
  termineIm(typ) { const [a, b] = this.zeitraum(); return S.termine.filter(t => !t.abgesagt && (!typ || t.typ === typ) && startVon(t) >= a && startVon(t) <= b); },
  // Beteiligung je Mitglied: erfasste Anwesenheit (wenn vorhanden), sonst Zusage
  werte(typ) {
    const ts = this.termineIm(typ);
    const r = {};
    mitglieder().forEach(m => { r[m.id] = { m, n: 0, da: 0, spaet: 0, fehlt: 0, ent: 0, ja: 0, nein: 0, keine: 0, puenktlich: 0 }; });
    ts.forEach(t => {
      const anw = t.anwesenheit || {}; const erfasst = Object.keys(anw).length > 0;
      eingeladen(t).forEach(m => {
        const x = r[m.id]; if (!x) return; x.n++;
        const a = antwortVon(t, m.id);
        if (a && a.status === 'ja') x.ja++; else if (a && a.status === 'nein') x.nein++; else x.keine++;
        const echte = S.antworten.get(t.id + '_' + m.id);
        if (echte || (a && a.auto)) x.puenktlich++;
        if (erfasst) { const k = anw[m.id]; if (k === 'da') x.da++; else if (k === 'spaet') { x.spaet++; } else if (k === 'fehlt') x.fehlt++; else x.ent++; }
        else if (a && a.status === 'ja') x.da++;
      });
    });
    return { ts, liste: Object.values(r).filter(x => x.n) };
  },
  quoten() {
    const { liste } = this.werte('training'); const q = {};
    liste.forEach(x => { q[x.m.id] = { n: x.n, q: pz(x.da + x.spaet, x.n) }; });
    return q;
  },
  html() {
    let h = '<div class="segment">' + [['saison', 'Saison'], ['90', '90 Tage'], ['30', '30 Tage']].map(([k, n]) => '<button data-z="' + k + '" class="' + (S.statZeitraum === k ? 'aktiv' : '') + '">' + n + '</button>').join('') + '</div>';
    const tr = this.werte('training'), sp = this.werte('spiel');
    const spieler = l => l.filter(x => (x.m.rolle || 'spieler') === 'spieler');
    const trS = spieler(tr.liste);
    const schnitt = trS.length ? Math.round(trS.reduce((s, x) => s + pz(x.da + x.spaet, x.n), 0) / trS.length) : 0;
    const bil = { s: 0, u: 0, n: 0, tore: 0, gegen: 0 };
    sp.ts.forEach(t => { const e = ergebnis(t); if (e) { bil[e.art]++; bil.tore += e.wir; bil.gegen += e.die; } });
    const gespielt = bil.s + bil.u + bil.n;
    h += '<div class="kennzahlen"><div class="kennzahl ' + (!tr.ts.length ? '' : schnitt >= 70 ? 'gruen' : schnitt >= 50 ? 'gelb' : 'rot') + '"><div class="wert">' + (tr.ts.length ? schnitt + ' %' : '–') + '</div><div class="label">Ø Training</div></div>'
      + '<div class="kennzahl"><div class="wert">' + tr.ts.length + '</div><div class="label">Trainings</div></div>'
      + '<div class="kennzahl"><div class="wert">' + (gespielt ? bil.s + '-' + bil.u + '-' + bil.n : sp.ts.length) + '</div><div class="label">' + (gespielt ? 'Siege-Remis-Nied.' : 'Spiele') + '</div></div></div>';
    if (gespielt) h += '<div class="hinweis" style="margin:0 2px 6px">Tore: ' + bil.tore + ':' + bil.gegen + ' (' + (bil.tore - bil.gegen >= 0 ? '+' : '') + (bil.tore - bil.gegen) + ') · ' + pz(bil.s * 2 + bil.u, gespielt * 2) + ' % der Punkte</div>';
    const rangliste = (titel, l, wert, unter) => {
      if (!l.length) return '';
      const sortiert = l.slice().sort((a, b) => wert(b).q - wert(a).q || b.n - a.n);
      return '<h2>' + titel + '</h2><div class="card flach">' + sortiert.map((x, i) => { const w = wert(x); return '<div class="rang klick" data-mid="' + x.m.id + '"><div class="pl">' + (i + 1) + '</div><div class="nm">' + esc(x.m.name) + '</div><div class="bar"><i style="width:' + pz(w.a, x.n) + '%"></i>' + (w.b ? '<i class="spaet" style="width:' + pz(w.b, x.n) + '%"></i>' : '') + '</div><div class="z">' + w.q + ' %</div></div>'; }).join('') + '</div>' + (unter || '');
    };
    if (!tr.ts.length && !sp.ts.length) return h + '<div class="card leer">Im Zeitraum gab es noch keine Trainings oder Spiele.</div>';
    h += rangliste('🏃 Trainingsbeteiligung', trS, x => ({ a: x.da, b: x.spaet, q: pz(x.da + x.spaet, x.n) }), '<div class="legende"><span><i style="background:var(--gruen)"></i>anwesend/zugesagt</span><span><i style="background:var(--gelb)"></i>zu spät</span></div>');
    h += rangliste('🤾 Spiele dabei', spieler(sp.liste), x => ({ a: x.da + x.spaet, b: 0, q: pz(x.da + x.spaet, x.n) }));
    h += rangliste('⏱ Antwortverhalten', spieler(this.werte().liste), x => ({ a: x.puenktlich, b: 0, q: pz(x.puenktlich, x.n) }), '<div class="hinweis" style="margin:0 2px">Anteil der Termine, bei denen rechtzeitig geantwortet wurde.</div>');
    return h;
  },
  knoepfe(el) {
    el.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { S.statZeitraum = b.dataset.z; App.renderTeam(); });
    el.querySelectorAll('.rang[data-mid]').forEach(z => z.onclick = () => Profil.oeffnen(z.dataset.mid));
  },
};

// ---------------- Profil eines Mitglieds ----------------
const Profil = {
  oeffnen(mid) {
    const m = mitglied(mid); if (!m) return;
    const tr = Statistik.werte('training').liste.find(x => x.m.id === mid);
    const sp = Statistik.werte('spiel').liste.find(x => x.m.id === mid);
    const absagen = S.termine.filter(t => startVon(t) <= new Date(Date.now() + 60 * 864e5) && !t.abgesagt).map(t => ({ t, a: S.antworten.get(t.id + '_' + mid) })).filter(x => x.a && x.a.status === 'nein').slice(-6).reverse();
    let h = '<div class="d-kopf"><div class="nr ' + (m.rolle || 'spieler') + '" style="width:52px;height:52px;font-size:1.2rem;border-radius:14px">' + esc(m.nr || initialen(m.name)) + '</div><div><h3>' + esc(m.name) + '</h3><div class="unter">' + [ROLLEN[m.rolle || 'spieler'], m.pos, m.geb ? '🎂 ' + m.geb : ''].filter(Boolean).map(esc).join(' · ') + (m.aktiv === false ? ' · inaktiv' : '') + '</div></div></div>';
    h += '<div class="kennzahlen"><div class="kennzahl"><div class="wert">' + (tr ? pz(tr.da + tr.spaet, tr.n) + ' %' : '–') + '</div><div class="label">Training' + (tr ? ' (' + (tr.da + tr.spaet) + '/' + tr.n + ')' : '') + '</div></div>'
      + '<div class="kennzahl"><div class="wert">' + (sp ? sp.da + sp.spaet : 0) + '</div><div class="label">Spiele</div></div>'
      + '<div class="kennzahl"><div class="wert">' + (tr ? tr.spaet : 0) + '</div><div class="label">mal zu spät</div></div></div>';
    const abw = S.abw.filter(a => a.spieler === mid && a.bis >= isoDatum(new Date()));
    if (abw.length) h += '<div class="infobox">🏖️ ' + abw.map(a => esc(Abwesenheit.zeitraum(a)) + (a.grund ? ' (' + esc(a.grund) + ')' : '')).join('<br>') + '</div>';
    h += Hd.personHtml(m) + Sk.personHtml(m);
    if (absagen.length) h += '<div class="gruppe-kopf">Letzte Absagen</div><div class="card flach" style="box-shadow:none;background:var(--zebra)">' + absagen.map(x => '<div class="zeile"><div class="t">' + esc(tagKurz(startVon(x.t))) + ' · ' + esc(Detail.titelText(x.t)) + '<small>' + esc(x.a.grund || 'ohne Grund') + '</small></div></div>').join('') + '</div>';
    if (S.istAdmin) h += '<div class="knoepfe"><button class="btn sekundaer" id="pr-edit">✏️ Bearbeiten</button></div>';
    const mo = oeffneModal(h, { zu: true });
    const b = mo.querySelector('#pr-edit'); if (b) b.onclick = () => { Modal.schliessen(mo.parentNode); Verwaltung.mitgliedModal(mid); };
    Hd.knoepfe(mo); Sk.knoepfe(mo);
  },
};

// ---------------- Abwesenheiten ----------------
const Abwesenheit = {
  zeitraum(a) { const f = d => d.split('-').reverse().join('.'); return a.von === a.bis ? f(a.von) : f(a.von) + ' – ' + f(a.bis); },
  modal() {
    const i = ich();
    if (!i && !S.istAdmin) { App.ichWaehlen(); return; }
    const heute = isoDatum(new Date());
    const m = oeffneModal('<h3>🏖️ Abwesenheit</h3><div class="unter">Für diese Zeit wirst du bei allen Terminen automatisch abgemeldet (eine eigene Zusage gilt trotzdem).</div>'
      + (S.istAdmin ? '<label class="feld">Wer?</label><select class="ein" id="ab-wer">' + mitglieder().map(x => '<option value="' + x.id + '"' + (i && x.id === i.id ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>' : '<div class="hinweis">für <b>' + esc(i.name) + '</b></div>')
      + '<div class="zwei"><div><label class="feld">Von</label><input class="ein" type="date" id="ab-von" value="' + heute + '"></div><div><label class="feld">Bis</label><input class="ein" type="date" id="ab-bis" value="' + heute + '"></div></div>'
      + '<label class="feld">Grund (optional)</label><input class="ein" id="ab-grund" maxlength="80" placeholder="z. B. Urlaub, verletzt">'
      + '<div class="chips-wahl">' + ['Urlaub', 'Verletzt', 'Krank', 'Klassenfahrt', 'Arbeit'].map(v => '<button data-v="' + v + '">' + v + '</button>').join('') + '</div>'
      + '<div class="hinweis" id="ab-info"></div>'
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="ab-ok">Eintragen</button></div>');
    const q = s => m.querySelector(s);
    m.querySelectorAll('.chips-wahl button').forEach(b => b.onclick = () => { q('#ab-grund').value = b.dataset.v; });
    const info = () => {
      const von = q('#ab-von').value, bis = q('#ab-bis').value;
      if (von && bis && bis < von) q('#ab-bis').value = von;
      const n = S.termine.filter(t => !t.abgesagt && t.datum >= q('#ab-von').value && t.datum <= q('#ab-bis').value).length;
      q('#ab-info').textContent = n ? n + (n === 1 ? ' Termin liegt' : ' Termine liegen') + ' in diesem Zeitraum.' : '';
    };
    q('#ab-von').onchange = info; q('#ab-bis').onchange = info; info();
    q('#ab-ok').onclick = async () => {
      const wer = S.istAdmin ? q('#ab-wer').value : i.id;
      const von = q('#ab-von').value, bis = q('#ab-bis').value;
      if (!von || !bis) { toast('Bitte Zeitraum wählen.'); return; }
      try { await Fb.sicherAngemeldet(); await Fb.col('abwesenheiten').add({ spieler: wer, von, bis: bis < von ? von : bis, grund: q('#ab-grund').value.trim().slice(0, 80), uid: Fb.uid(), at: Fb.jetzt() }); Modal.schliessen(m.parentNode); toast('Abwesenheit eingetragen.'); }
      catch (e) { toast(fehlerText(e), 6000); }
    };
  },
  async loeschen(id) {
    if (!(await fragen('Abwesenheit löschen?', '', 'Löschen', true))) return;
    try { await Fb.sicherAngemeldet(); await Fb.col('abwesenheiten').doc(id).delete(); toast('Gelöscht.'); } catch (e) { toast(fehlerText(e), 6000); }
  },
};

// ---------------- Kalender (.ics) ----------------
const Kalender = {
  export(nurZusagen, liste) {
    const id = ichId();
    let ts = liste || S.termine.filter(t => endeVon(t) > new Date(Date.now() - 864e5));
    if (nurZusagen) ts = ts.filter(t => { const a = antwortVon(t, id); return a && a.status === 'ja'; });
    if (!ts.length) { toast('Keine Termine zum Exportieren.'); return; }
    const z = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
    const e = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
    const falten = l => { const r = []; while (l.length > 74) { r.push(l.slice(0, 74)); l = ' ' + l.slice(74); } r.push(l); return r.join('\r\n'); };
    const zeilen = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//buildspace//Kabine//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + e((S.team && S.team.titel) || 'Kabine')];
    ts.forEach(t => {
      const titel = (t.abgesagt ? 'ABGESAGT: ' : '') + (TYPEN[t.typ] || TYPEN.event).ico + ' ' + Detail.titelText(t);
      const besch = [t.treff ? 'Treffpunkt: ' + t.treff + ' Uhr' : '', t.notiz || '', teamLink()].filter(Boolean).join('\n');
      zeilen.push('BEGIN:VEVENT', 'UID:' + t.id + '@kabine.buildspaceos.de', 'DTSTAMP:' + z(new Date()), 'DTSTART:' + z(startVon(t)), 'DTEND:' + z(endeVon(t)),
        falten('SUMMARY:' + e(titel)), falten('LOCATION:' + e([t.ort, t.adresse].filter(Boolean).join(', '))), falten('DESCRIPTION:' + e(besch)), 'STATUS:' + (t.abgesagt ? 'CANCELLED' : 'CONFIRMED'), 'END:VEVENT');
    });
    zeilen.push('END:VCALENDAR');
    const blob = new Blob([zeilen.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (liste && liste.length === 1 ? 'termin' : 'kabine-termine') + '.ics';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(ts.length === 1 ? 'Kalenderdatei erstellt.' : ts.length + ' Termine als Kalenderdatei.');
  },
};
</script>
<script>
// ---------------- Verwaltung ----------------
const Verwaltung = {
  html() {
    if (!Fb.google()) return '<div class="card"><div class="hinweis" style="margin-top:0">Trainer:innen melden sich mit Google an, um Termine, Mitglieder und Einstellungen zu verwalten.</div><button class="btn" style="margin-top:10px" onclick="Fb.anmelden()">Mit Google anmelden</button></div>';

    return '<div class="card flach">'
      + z('termin', '＋', 'Neuer Termin', 'Training, Spiel oder Event – auch als Serie')

      + z('mannschaft', '🏷', 'Mannschaft', esc((S.team && S.team.titel) || '') + ' · Hinweis, Saisonbeginn')
      + z('einst', '⚙️', 'Einstellungen', 'Antwortfrist ' + esc((FRISTEN.find(f => f[0] === e.frist) || FRISTEN[0])[1]) + (e.grundPflicht ? ' · Grund bei Absage Pflicht' : '') + (e.postsNur ? ' · Pinnwand nur Verwaltung' : ''))
      + z('admins', '👥', 'Verwaltung (Trainer:innen)', (S.admin && S.admin.members ? S.admin.members.length : 1) + ' Google-Konto' + ((S.admin && S.admin.members || []).length === 1 ? '' : 'en'))
      + z('hd', '🧹', 'Hallendienst verknüpfen', S.team && S.team.hallendienst ? 'verknüpft' + (Hd.plan ? ': ' + esc(Hd.plan.titel || '') : '') : 'Dienste der Spieler:innen anzeigen')
      + z('sk', '💰', 'Strafenkasse verknüpfen', Sk.cfg() ? 'verknüpft' + (Sk.daten ? ': ' + esc(Sk.daten.titel) : '') + (Sk.vonHd() ? ' (über den Hallendienst)' : '') : 'Stand anzeigen, Strafen aus Terminen buchen')
      + (Sk.cfg() ? z('regeln', '⚖️', 'Strafen-Regeln', 'Welche Strafe bei Fehlen, Verspätung …') : '')
      + z('export', '📄', 'Anwesenheitsliste exportieren', 'CSV für Excel/Numbers (Saison)')
      + (S.istBesitzer ? z('loeschen', '🗑', 'Mannschaft löschen', 'Nur Besitzer:in') : '')
      + '<div class="zeile"><div class="t"><small>Angemeldet als ' + esc(Fb.email()) + '</small></div><button class="btn mini sekundaer" onclick="Fb.abmelden()">Abmelden</button></div>'
      + '</div>';
  },
  knoepfe(el) {
    el.querySelectorAll('[data-v]').forEach(z => z.onclick = () => {
      const a = z.dataset.v;
      if (a === 'termin') Editor.oeffnen();
      if (a === 'anwurf') Anwurf.importModal();
      if (a === 'mannschaft') this.mannschaftModal();
      if (a === 'einst') this.einstModal();
      if (a === 'admins') this.adminsModal();
      if (a === 'hd') Hd.verknuepfenModal();
      if (a === 'sk') Sk.verknuepfenModal();
      if (a === 'regeln') Sk.regelnModal();
      if (a === 'export') this.exportCsv();
      if (a === 'loeschen') this.teamLoeschen();
    });
  },
  mannschaftModal() {
    const t = S.team;
    const m = oeffneModal('<h3>Mannschaft</h3><label class="feld">Name</label><input class="ein" id="m-titel" maxlength="60" value="' + esc(t.titel) + '">'
      + '<label class="feld">Verein</label><input class="ein" id="m-verein" maxlength="60" value="' + esc(t.verein || '') + '">'
      + '<label class="feld">Hinweis oben auf der Startseite (optional)</label><textarea class="ein" id="m-hinweis" maxlength="500" placeholder="z. B. Trainingszeiten, WhatsApp-Gruppe …">' + esc(t.hinweis || '') + '</textarea>'
      + '<label class="feld">Saisonbeginn (für Statistik)</label><input class="ein" type="date" id="m-saison" value="' + esc(t.saisonStart || isoDatum(saisonStart())) + '">'
      + '<label class="check"><input type="checkbox" id="m-gesperrt"' + (t.gesperrt ? ' checked' : '') + '><span>Antworten sperren<small>Nur die Verwaltung kann noch zu-/absagen (z. B. Sommerpause)</small></span></label>'
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="m-ok">Speichern</button></div>');
    m.querySelector('#m-ok').onclick = async () => {
      const titel = m.querySelector('#m-titel').value.trim(); if (!titel) { toast('Bitte einen Namen eingeben.'); return; }
      try {
        await App.teamSpeichern({ titel, verein: m.querySelector('#m-verein').value.trim(), hinweis: m.querySelector('#m-hinweis').value.trim(), saisonStart: m.querySelector('#m-saison').value || '', gesperrt: m.querySelector('#m-gesperrt').checked });
        if (S.admin && S.admin.titel !== titel) Fb.adminRef().update({ titel }).catch(() => {});
        Modal.schliessen(m.parentNode); toast('Gespeichert.');
      } catch (e) { toast(fehlerText(e), 6000); }
    };
  },
  einstModal() {
    const e = einst();
    const m = oeffneModal('<h3>Einstellungen</h3>'
      + '<label class="feld">Antwortfrist für neue Termine</label><select class="ein" id="s-frist">' + FRISTEN.map(([h, n]) => '<option value="' + h + '"' + (e.frist === h ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>'
      + '<label class="check"><input type="checkbox" id="s-std"' + (e.stdTraining === 'ja' ? ' checked' : '') + '><span>Training: automatisch zusagen<small>Neue Trainings gelten für alle als zugesagt – nur Absagen nötig</small></span></label>'
      + '<label class="check"><input type="checkbox" id="s-grund"' + (e.grundPflicht ? ' checked' : '') + '><span>Grund bei Absage ist Pflicht</span></label>'
      + '<label class="check"><input type="checkbox" id="s-posts"' + (e.postsNur ? ' checked' : '') + '><span>Pinnwand: nur Verwaltung postet<small>Kommentieren und abstimmen können alle</small></span></label>'
      + '<div class="zwei"><div><label class="feld">Treffen vor Heimspiel (Min.)</label><input class="ein" type="number" id="s-th" min="0" max="240" value="' + e.treffHeim + '" inputmode="numeric"></div><div><label class="feld">… vor Auswärtsspiel (Min.)</label><input class="ein" type="number" id="s-ta" min="0" max="300" value="' + e.treffAusw + '" inputmode="numeric"></div></div>'
      + '<div class="hinweis">Treffzeiten gelten für Spiele aus dem Spielplan.</div>'
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="s-ok">Speichern</button></div>');
    m.querySelector('#s-ok').onclick = async () => {
      const neu = { ...((S.team && S.team.einst) || {}), frist: Number(m.querySelector('#s-frist').value) || 0, stdTraining: m.querySelector('#s-std').checked ? 'ja' : 'offen', grundPflicht: m.querySelector('#s-grund').checked, postsNur: m.querySelector('#s-posts').checked,
        treffHeim: Math.max(0, Math.min(240, Number(m.querySelector('#s-th').value) || 0)), treffAusw: Math.max(0, Math.min(300, Number(m.querySelector('#s-ta').value) || 0)) };
      try { await App.teamSpeichern({ einst: neu }); Modal.schliessen(m.parentNode); toast('Gespeichert.'); } catch (err) { toast(fehlerText(err), 6000); }
    };
  },
  mitgliedModal(mid) {
    const x = mid ? mitglied(mid) : { name: '', nr: '', pos: '', rolle: 'spieler', geb: '', aktiv: true };
    const m = oeffneModal('<h3>' + (mid ? 'Mitglied bearbeiten' : 'Neues Mitglied') + '</h3>'
      + '<label class="feld">Name</label><input class="ein" id="mg-name" maxlength="40" value="' + esc(x.name) + '" placeholder="Vor- und Nachname">'
      + '<div class="drei"><div><label class="feld">Nummer</label><input class="ein" id="mg-nr" maxlength="3" inputmode="numeric" value="' + esc(x.nr || '') + '"></div>'
      + '<div><label class="feld">Position</label><select class="ein" id="mg-pos">' + POSITIONEN.map(p => '<option' + (p === (x.pos || '') ? ' selected' : '') + ' value="' + p + '">' + (p || '–') + '</option>').join('') + '</select></div>'
      + '<div><label class="feld">Rolle</label><select class="ein" id="mg-rolle">' + Object.entries(ROLLEN).map(([k, n]) => '<option value="' + k + '"' + ((x.rolle || 'spieler') === k ? ' selected' : '') + '>' + n.replace(':in', '') + '</option>').join('') + '</select></div></div>'
      + '<label class="feld">Geburtstag (TT.MM., optional – nur für den Glückwunsch)</label><input class="ein" id="mg-geb" maxlength="6" placeholder="z. B. 24.12." value="' + esc(x.geb || '') + '" inputmode="decimal">'
      + (mid ? '<label class="check"><input type="checkbox" id="mg-aktiv"' + (x.aktiv !== false ? ' checked' : '') + '><span>Aktiv<small>Inaktive werden nicht mehr eingeladen, ihre Statistik bleibt</small></span></label>' : '<div class="hinweis">Tipp: Mehrere auf einmal? „Übernehmen …“ → Namensliste einfügen.</div>')
      + '<div class="knoepfe">' + (mid ? '<button class="btn gefahr" id="mg-weg">Entfernen</button>' : '<button class="btn sekundaer" data-zu>Abbrechen</button>') + '<button class="btn" id="mg-ok">Speichern</button></div>');
    const q = s => m.querySelector(s);
    q('#mg-ok').onclick = async () => {
      const name = q('#mg-name').value.trim().replace(/\s+/g, ' ');
      if (!name) { toast('Bitte einen Namen eingeben.'); return; }

  },

      if (namen.length > frei) { toast('Höchstens 80 Mitglieder – noch ' + frei + ' frei.'); return; }

  exportCsv() {

  async teamLoeschen() {
    if (!(await fragen('Mannschaft löschen?', 'Die Mannschaft verschwindet für alle. Termine und Antworten sind danach nicht mehr erreichbar. Das lässt sich nicht rückgängig machen.', 'Endgültig löschen', true))) return;
    try {

      const hd = S.team && S.team.hallendienst;

      toast('Mannschaft gelöscht.'); App.startZeigen();
    } catch (e) { toast(fehlerText(e), 6000); }
  },
};

// ---------------- Hallendienst (../hallendienst/) ----------------
const Hd = {
  planId: null, plan: null, dienste: [], eintraege: [], abos: [],
  pruefen() {
    const id = (S.team && S.team.hallendienst) || null;
    if (id === this.planId) return;
    this.abos.splice(0).forEach(u => { try { u(); } catch (e) {} });
    this.planId = id; this.plan = null; this.dienste = []; this.eintraege = [];
    if (!id) return;
    const c = LS.get('kb-hd-' + id, null); if (c) { this.plan = c.plan; this.dienste = c.dienste; this.eintraege = c.eintraege; }
    const sp = () => { LS.set('kb-hd-' + id, { plan: this.plan && { titel: this.plan.titel, spieler: this.plan.spieler, rollen: this.plan.rollen || {}, strafenkasse: this.plan.strafenkasse || '' }, dienste: this.dienste, eintraege: this.eintraege }); Sk.pruefen(); App.renderAlles(); };
    const ref = Fb.db.collection('hallendienst').doc(id);
    this.abos.push(ref.onSnapshot(s => { if (this.planId !== id) return; this.plan = s.exists ? s.data() : null; sp(); }, () => {}));
    this.abos.push(ref.collection('dienste').onSnapshot(s => { if (this.planId !== id) return; this.dienste = s.docs.map(d => { const x = d.data(); return { id: d.id, titel: x.titel, datum: x.datum, von: x.von, bis: x.bis || '', plaetze: x.plaetze, gruppe: x.gruppe || '' }; }); sp(); }, () => {}));
    this.abos.push(ref.collection('eintraege').onSnapshot(s => { if (this.planId !== id) return; this.eintraege = s.docs.map(d => { const x = d.data(); return { dienst: x.dienst, platz: x.platz, name: x.name, tausch: !!x.tausch }; }); sp(); }, () => {}));
  },
  link(name) { return this.planId ? new URL('../hallendienst/index.html?plan=' + this.planId, location.href).href : ''; },
  amTag(datum) { return this.planId ? this.dienste.filter(d => d.datum === datum) : []; },
  // Gleicher Name – oder im Hallendienst nur der Vorname, der in der Mannschaft eindeutig ist
  istMeiner(e, m) {
    if (!m) return false; const a = norm(e.name), b = norm(m.name);
    if (a === b) return true;
    return !a.includes(' ') && a === norm(vorname(m.name)) && mitglieder().filter(x => norm(vorname(x.name)) === a).length === 1;
  },
  meine(m, nurKommend = true) {
    const heute = isoDatum(new Date());
    return this.eintraege.filter(e => this.istMeiner(e, m)).map(e => ({ e, d: this.dienste.find(d => d.id === e.dienst) }))
      .filter(x => x.d && x.e.platz < x.d.plaetze && (!nurKommend || x.d.datum >= heute)).sort((a, b) => (a.d.datum + a.d.von).localeCompare(b.d.datum + b.d.von));
  },
  freiKommend() {
    const heute = isoDatum(new Date());
    return this.dienste.filter(d => d.datum >= heute).reduce((s, d) => s + Math.max(0, d.plaetze - this.eintraege.filter(e => e.dienst === d.id && e.platz < d.plaetze).length), 0);
  },
  ichHtml(m) {
    if (!this.planId || !this.plan) return '';
    const l = m ? this.meine(m) : [];
    const frei = this.freiKommend();
    const n = l[0];
    return '<div class="kachel" data-hd-auf><div class="ico">🧹</div><div class="t"><b>Hallendienst</b><small>'
      + (n ? 'Dein nächster Dienst: <b style="color:var(--text)">' + esc(tagKurz(ausDatum(n.d.datum)) + ' ' + n.d.von + ' · ' + n.d.titel) + '</b>' + (l.length > 1 ? ' (+' + (l.length - 1) + ' weitere)' : '') : (m ? 'Du hast keinen kommenden Dienst.' : 'Dienste der Mannschaft'))
      + (frei ? ' · ' + frei + ' Plätze frei' : '') + '</small></div><span class="pfeil">›</span></div>';
  },
  mehrHtml() { return this.planId ? '<div class="kachel" data-hd-auf><div class="ico">🧹</div><div class="t"><b>Hallendienst öffnen</b><small>' + esc((this.plan && this.plan.titel) || 'Dienste eintragen') + '</small></div><span class="pfeil">›</span></div>' : ''; },
  tagHtml(datum, dienste) {
    let h = '<div class="gruppe-kopf">🧹 Hallendienst an diesem Tag</div><div class="card flach" style="box-shadow:none;background:var(--zebra)">';
    dienste.slice().sort((a, b) => (a.von || '').localeCompare(b.von || '')).forEach(d => {
      const e = this.eintraege.filter(x => x.dienst === d.id && x.platz < d.plaetze);
      h += '<div class="zeile"><div class="t"><b>' + esc(d.von) + (d.bis ? '–' + esc(d.bis) : '') + ' ' + esc(d.titel) + '</b><small>' + (e.length ? e.map(x => esc(x.name)).join(', ') : '–') + '</small></div>' + (e.length < d.plaetze ? '<span class="pill rot">' + (d.plaetze - e.length) + ' frei</span>' : '<span class="pill gruen">voll</span>') + '</div>';
    });
    return h + '</div><button class="btn klein sekundaer" style="margin-top:6px" data-hd-auf>Zum Hallendienst</button>';
  },
  personHtml(m) {
    if (!this.planId) return '';
    const l = this.meine(m, false); if (!l.length) return '';
    const heute = isoDatum(new Date()); const kommend = l.filter(x => x.d.datum >= heute);
    return '<div class="gruppe-kopf">🧹 Hallendienst<span class="z">' + l.length + ' Dienste</span></div><div class="hinweis" style="margin-top:0">' + (kommend.length ? 'Nächster: ' + esc(tagKurz(ausDatum(kommend[0].d.datum)) + ' ' + kommend[0].d.von + ' · ' + kommend[0].d.titel) : 'Kein kommender Dienst.') + '</div>';
  },
  knoepfe(el) { el.querySelectorAll('[data-hd-auf]').forEach(b => b.onclick = () => { const i = ich(); location.href = this.link() + (i ? '&ich=' + encodeURIComponent(i.name) : ''); }); },
  verknuepfenModal() {
    const akt = S.team.hallendienst;
    const m = oeffneModal('<h3>🧹 Hallendienst verknüpfen</h3><div class="unter">Füge den Mannschafts-Link aus dem Hallendienst ein (dort oben rechts „Teilen“). Spieler:innen sehen dann ihre Dienste hier, und im Hallendienst erscheint die Kabine auf der Startseite.</div>'
      + '<label class="feld">Link oder Plan-Code</label><input class="ein" id="hd-link" autocapitalize="off" value="' + esc(akt ? this.link() : '') + '" placeholder="https://buildspaceos.de/hallendienst/index.html?plan=…">'
      + '<div class="knoepfe">' + (akt ? '<button class="btn gefahr" id="hd-weg">Trennen</button>' : '<button class="btn sekundaer" data-zu>Abbrechen</button>') + '<button class="btn" id="hd-ok">Verknüpfen</button></div>');
    m.querySelector('#hd-ok').onclick = async () => {
      const v = m.querySelector('#hd-link').value.trim();
      const id = (/[?&]plan=([A-Za-z0-9]{16,40})/.exec(v) || /^([A-Za-z0-9]{16,40})$/.exec(v) || [])[1];
      if (!id) { toast('Das ist kein Hallendienst-Link (er enthält „?plan=“).'); return; }
      try {
        const s = await Fb.db.collection('hallendienst').doc(id).get();
        if (!s.exists) { toast('Diesen Hallendienst-Plan gibt es nicht (mehr).'); return; }
        const alt = S.team.hallendienst;

        S.team.hallendienst = id; await this.verweisSetzen(alt);
        Modal.schliessen(m.parentNode); toast('Hallendienst verknüpft: ' + (s.data().titel || ''));
      } catch (e) { toast(fehlerText(e), 6000); }

      if (!(await fragen('Verknüpfung lösen?', 'Der Hallendienst selbst bleibt unverändert.', 'Trennen'))) return;
      const alt = S.team.hallendienst;
      try { await App.teamSpeichern({ hallendienst: '' }); S.team.hallendienst = ''; await this.verweisSetzen(alt); Modal.schliessen(m.parentNode); toast('Getrennt.'); } catch (e) { toast(fehlerText(e), 6000); }
    };
  },
  // Rückverweis kabine_hd/{plan} = { team }, damit der Hallendienst die Kabine auf seiner Startseite anbietet
  async verweisSetzen(alt) {
    if (!S.istAdmin || !S.team) return;
    const id = S.team.hallendienst || '', team = S.teamId;
    const ref = p => Fb.db.collection('kabine_hd').doc(p);
    try {
      if (alt && alt !== id) { const s = await ref(alt).get(); if (s.exists && s.data().team === team) await ref(alt).delete(); }
      if (!id || LS.get('kb-hdv-' + team, '') === id) return;
      const s = await ref(id).get();
      if (!s.exists || s.data().team !== team || s.data().titel !== S.team.titel) await ref(id).set({ team, titel: String(S.team.titel || '').slice(0, 60), at: Fb.jetzt() });
      LS.set('kb-hdv-' + team, id);
    } catch (e) { /* Regeln evtl. noch nicht eingespielt */ }
  },
};

// ---------------- Strafenkasse (../strafenkasse/) ----------------
const Sk = {
  token: null, daten: null, team: null, _abo: null, kw: null, stand: null,
  // Eigene Verknüpfung oder die des verknüpften Hallendienstes
  cfg() {
    const v = (S.team && S.team.strafenkasse) || (Hd.plan && Hd.plan.strafenkasse) || '';
    if (!v || v.indexOf('|') < 0) return null; const [team, token] = v.split('|'); return token ? { team, token } : null;
  },
  vonHd() { return !(S.team && S.team.strafenkasse) && !!(Hd.plan && Hd.plan.strafenkasse); },
  parse(text) { const t = /#s=([a-z0-9]{8,})/.exec(String(text || '')); if (!t) return null; const team = /[?&]team=([A-Za-z0-9_-]+)/.exec(text); return (team ? team[1] : '') + '|' + t[1]; },
  link() { const c = this.cfg(); if (!c) return ''; const u = new URL('../strafenkasse/index.html', location.href); if (c.team) u.search = '?team=' + c.team; u.hash = 's=' + c.token; return u.href; },
  pruefen() {
    const c = this.cfg();
    if (!c) { if (this._abo) { this._abo(); this._abo = null; } this.daten = null; this.token = null; return; }
    if (this.token === c.token) return;
    if (this._abo) this._abo();
    this.token = c.token; this.daten = LS.get('kb-sk-' + c.token, null);
    Fb.laden().then(() => {
      if (this.token !== c.token) return;
      this._abo = Fb.db.collection('strafenkasse_ansicht').doc(c.token).onSnapshot(snap => {
        if (!snap.exists) { this.daten = null; App.renderAlles(); return; }
        this.team = snap.data().team || c.team || null;
        try {
          const d = JSON.parse(snap.data().json);
          this.daten = { titel: d.titel || 'Strafenkasse', paypal: d.paypal || '', spieler: (d.spieler || []).map(x => ({ id: x.id, name: x.name, aktiv: x.aktiv })),
            buchungen: (d.buchungen || []).filter(b => b.art === 'strafe' || b.art === 'zahlung').map(b => ({ s: b.spielerId, a: b.art, b: Number(b.betrag) || 0, t: b.text || '', d: b.datum || '' })) };
          LS.set('kb-sk-' + c.token, this.daten);
        } catch (e) {}
        this.kassenwartPruefen(); App.renderAlles();
      }, () => {});
    }).catch(() => {});
  },
  spielerZu(m) {
    if (!this.daten || !m) return null;
    const sp = this.daten.spieler, n = norm(m.name);
    return sp.find(s => norm(s.name) === n) || (() => { const k = sp.filter(s => norm(vorname(s.name)) === norm(vorname(m.name))); return k.length === 1 ? k[0] : null; })();
  },
  saldo(id) { let s = 0; (this.daten ? this.daten.buchungen : []).forEach(b => { if (b.s === id) s += b.a === 'strafe' ? b.b : -b.b; }); return Math.round(s * 100) / 100; },
  ichHtml(m) {
    if (!this.daten) return '';
    const sp = this.spielerZu(m);
    if (!sp) return '<div class="kachel" data-sk-auf><div class="ico">💰</div><div class="t"><b>Strafenkasse</b><small>' + (m ? 'Dein Name steht nicht in der Strafenkasse.' : 'Stand der Mannschaft') + '</small></div><span class="pfeil">›</span></div>';
    const sd = this.saldo(sp.id);
    return '<div class="kachel" data-sk-auf><div class="ico">💰</div><div class="t"><b>Strafenkasse</b><small>' + (sd > 0 ? '<b style="color:var(--rot)">' + eur(sd) + ' offen</b>' : '<b style="color:var(--gruen)">alles bezahlt</b>' + (sd < 0 ? ' (Guthaben ' + eur(-sd) + ')' : '')) + '</small></div><span class="pfeil">›</span></div>';
  },
  mehrHtml() { return this.cfg() ? '<div class="kachel" data-sk-auf><div class="ico">💰</div><div class="t"><b>Strafenkasse öffnen</b><small>' + esc((this.daten && this.daten.titel) || 'Strafen & Zahlungen') + '</small></div><span class="pfeil">›</span></div>' : ''; },
  personHtml(m) {
    const sp = this.spielerZu(m); if (!sp) return '';
    const sd = this.saldo(sp.id);
    const l = this.daten.buchungen.filter(b => b.s === sp.id && b.a === 'strafe').sort((a, b) => b.d.localeCompare(a.d)).slice(0, 4);
    return '<div class="gruppe-kopf">💰 Strafenkasse<span class="z" style="color:var(--' + (sd > 0 ? 'rot' : 'gruen') + ')">' + (sd > 0 ? eur(sd) + ' offen' : 'alles bezahlt') + '</span></div>'
      + (l.length ? '<div class="hinweis" style="margin-top:0">' + l.map(b => esc(b.d.split('-').reverse().join('.')) + ' · ' + esc(b.t) + ' (' + eur(b.b) + ')').join('<br>') + '</div>' : '')
      + '<button class="btn mini sekundaer" style="margin-top:7px" data-sk-auf>Zur Strafenkasse</button>';
  },
  knoepfe(el) { el.querySelectorAll('[data-sk-auf]').forEach(b => b.onclick = () => { location.href = this.link(); }); },
  verknuepfenModal() {
    const eigen = S.team.strafenkasse;
    const m = oeffneModal('<h3>💰 Strafenkasse verknüpfen</h3><div class="unter">In der Strafenkasse unter Verwalten › Cloud-Sync auf „Spieler-Ansicht teilen (nur Lesen)“ tippen und den Link hier einfügen.'
      + (this.vonHd() ? '<br><br>Aktuell kommt die Strafenkasse über den verknüpften Hallendienst – das reicht meistens schon.' : '') + '</div>'
      + '<label class="feld">Link der Spieler-Ansicht</label><input class="ein" id="sk-link" autocapitalize="off" value="' + esc(eigen ? this.link() : '') + '" placeholder="https://buildspaceos.de/strafenkasse/index.html?team=…#s=…">'
      + '<div class="knoepfe">' + (eigen ? '<button class="btn gefahr" id="sk-weg">Trennen</button>' : '<button class="btn sekundaer" data-zu>Abbrechen</button>') + '<button class="btn" id="sk-ok">Verknüpfen</button></div>');
    m.querySelector('#sk-ok').onclick = async () => {
      const v = this.parse(m.querySelector('#sk-link').value);
      if (!v) { toast('Das ist kein Link einer Spieler-Ansicht (er enthält „#s=“).'); return; }
      try {
        const s = await Fb.db.collection('strafenkasse_ansicht').doc(v.split('|')[1]).get();
        if (!s.exists) { toast('Diese Spieler-Ansicht gibt es nicht (mehr).'); return; }
        await App.teamSpeichern({ strafenkasse: v }); Modal.schliessen(m.parentNode); toast('Strafenkasse verknüpft.');
      } catch (e) { toast(fehlerText(e), 6000); }
    };
    const weg = m.querySelector('#sk-weg');
    if (weg) weg.onclick = async () => { try { await App.teamSpeichern({ strafenkasse: '' }); Modal.schliessen(m.parentNode); toast('Getrennt.'); } catch (e) { toast(fehlerText(e), 6000); } };
  },
  // Kassenwart:in = Google-Adresse steht in strafenkasse/{team}.members (nur dann erlauben die Regeln das Lesen)
  async kassenwartPruefen() {
    const team = this.team || (this.cfg() && this.cfg().team), mail = Fb.email();
    if (!team || !mail) { if (this.kw) { this.kw = null; this.stand = null; App.renderAlles(); } return; }
    if (this.kw && this.kw.team === team && this.kw.mail === mail && Date.now() - this.kw.t < 120000) return;
    let ja = false, stand = null;
    try { const s = await Fb.db.collection('strafenkasse').doc(team).get(); ja = s.exists && (s.data().members || []).includes(mail); if (ja) stand = JSON.parse(s.data().json); } catch (e) { ja = false; }
    this.kw = { team, mail, ja, t: Date.now() }; this.stand = stand; App.renderAlles();
  },
  istKassenwart() { return !!(this.kw && this.kw.ja && this.kw.mail === Fb.email() && this.stand); },
  regeln() {
    const r = Object.assign({}, (S.team && S.team.einst && S.team.einst.strafen) || {});
    const kat = (this.stand && this.stand.katalog) || [];
    const finde = re => { const k = kat.find(x => re.test(x.name)); return k ? k.name : ''; };
    if (r.fehlt == null) r.fehlt = finde(/app nicht abgemeldet|nicht abgemeldet/i);
    if (r.fehltPflicht == null) r.fehltPflicht = finde(/unentschuldigt/i);
    if (r.spaet == null) r.spaet = finde(/zu sp[äa]t|versp[äa]t|unp[üu]nktlich/i);
    if (r.keineAntwort == null) r.keineAntwort = '';
    return r;
  },
  regelnModal() {
    if (!this.istKassenwart()) { toast(Fb.google() ? 'Nur Kassenwart:innen der Strafenkasse können Strafen-Regeln festlegen.' : 'Bitte zuerst mit Google anmelden.', 5000); if (!Fb.google()) Fb.anmelden(); return; }
    const r = this.regeln(), kat = this.stand.katalog || [];
    const sel = (id, wert) => '<select class="ein" id="' + id + '"><option value="">– keine Strafe –</option>' + kat.map(k => '<option value="' + esc(k.name) + '"' + (k.name === wert ? ' selected' : '') + '>' + esc(k.name) + ' (' + eur(k.betrag) + ')</option>').join('') + '</select>';
    const m = oeffneModal('<h3>⚖️ Strafen-Regeln</h3><div class="unter">Diese Strafen schlägt die Kabine nach der Anwesenheit vor. Gebucht wird erst, wenn du bestätigst.</div>'
      + '<label class="feld">Gefehlt, ohne in der App abzusagen</label>' + sel('r-fehlt', r.fehlt)
      + '<label class="feld">… bei einem Pflichttermin</label>' + sel('r-pflicht', r.fehltPflicht)
      + '<label class="feld">Zu spät</label>' + sel('r-spaet', r.spaet)
      + '<label class="feld">Bis zur Frist nicht geantwortet</label>' + sel('r-keine', r.keineAntwort)
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="r-ok">Speichern</button></div>');
    m.querySelector('#r-ok').onclick = async () => {
      if (!S.istAdmin) { toast('Speichern kann nur die Verwaltung der Mannschaft.'); return; }
      const strafen = { fehlt: m.querySelector('#r-fehlt').value, fehltPflicht: m.querySelector('#r-pflicht').value, spaet: m.querySelector('#r-spaet').value, keineAntwort: m.querySelector('#r-keine').value };
      try { await App.teamSpeichern({ einst: { ...((S.team && S.team.einst) || {}), strafen } }); Modal.schliessen(m.parentNode); toast('Gespeichert.'); } catch (e) { toast(fehlerText(e), 6000); }
    };
  },
  vorschlaege(t) {
    if (!this.stand) return [];
    const r = this.regeln(), kat = this.stand.katalog || [], anw = t.anwesenheit || {};
    const k = name => kat.find(x => x.name === name);
    const l = [];
    const gebucht = new Set([...(t.strafen || []), ...LS.get('kb-sk-gebucht-' + t.id, [])]);
    eingeladen(t).concat(Object.keys(anw).filter(id => !eingeladen(t).some(m => m.id === id)).map(mitglied).filter(Boolean)).forEach(m => {
      const a = S.antworten.get(t.id + '_' + m.id), auto = antwortVon(t, m.id);
      const add = (regel, name, warum) => { const x = k(name); if (x) l.push({ key: m.id + ':' + regel, m, regel, kat: x, warum, gebucht: gebucht.has(m.id + ':' + regel) }); };
      if (anw[m.id] === 'fehlt') {
        const abgesagt = auto && auto.status === 'nein';
        if (t.pflicht && r.fehltPflicht) add('fehltPflicht', r.fehltPflicht, 'unentschuldigt gefehlt (Pflichttermin)');
        else if (!abgesagt && r.fehlt) add('fehlt', r.fehlt, 'gefehlt ohne Absage');
      }
      if (anw[m.id] === 'spaet' && r.spaet) add('spaet', r.spaet, 'zu spät');
      if (r.keineAntwort && !a && !(auto && auto.auto) && eingeladen(t).some(x => x.id === m.id)) add('keine', r.keineAntwort, 'keine Antwort bis zur Frist');
    });
    return l;
  },
  async strafenModal(t) {
    await this.kassenwartPruefen();
    if (!this.istKassenwart()) { toast('Nur Kassenwart:innen der verknüpften Strafenkasse können buchen.', 5000); return; }
    const l = this.vorschlaege(t);
    const ksp = this.stand.spieler || [];
    const wahl = new Map(l.filter(x => !x.gebucht).map(x => [x.key, true]));
    const ziel = new Map(l.map(x => { const n = norm(x.m.name); const s = ksp.find(y => norm(y.name) === n) || ksp.filter(y => norm(vorname(y.name)) === norm(vorname(x.m.name))).length === 1 && ksp.find(y => norm(vorname(y.name)) === norm(vorname(x.m.name))); return [x.key, s ? s.id : '']; }));
    const m = oeffneModal('<h3>💰 Strafen buchen</h3><div class="unter">' + esc(Detail.titelText(t)) + ' · ' + esc(tagKurz(startVon(t))) + '<br>Vorschläge aus Anwesenheit und Antworten. Regeln: Mehr › Verwaltung › Strafen-Regeln.</div><div id="st-liste" style="margin-top:10px"></div>'
      + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Abbrechen</button><button class="btn" id="st-ok">Buchen</button></div>', { zu: true });
    const zeichnen = () => {
      m.querySelector('#st-liste').innerHTML = l.length ? l.map(x => '<div class="anw-reihe" style="align-items:flex-start"><input type="checkbox" data-w="' + esc(x.key) + '" style="width:22px;height:22px;accent-color:var(--rot);margin-top:3px"' + (wahl.get(x.key) ? ' checked' : '') + (x.gebucht ? ' disabled' : '') + '>'
        + '<div class="t" style="white-space:normal"><b>' + esc(x.m.name) + '</b> – ' + esc(x.kat.name) + ' <b>' + eur(x.kat.betrag) + '</b><small>' + esc(x.warum) + (x.gebucht ? ' · <b>schon gebucht</b>' : '') + '</small>'
        + (!ziel.get(x.key) && !x.gebucht ? '<select class="ein" data-z="' + esc(x.key) + '" style="margin-top:6px;padding:7px 30px 7px 9px;font-size:.86rem"><option value="">In der Strafenkasse ist das …</option>' + ksp.filter(s => s.aktiv !== false).map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('') + '</select>' : '') + '</div></div>').join('')
        : '<div class="leer">Keine Vorschläge. Erfasse zuerst die Anwesenheit (✗ = unentschuldigt, ⏰ = zu spät) oder lege unter Strafen-Regeln fest, welche Strafe wann gilt.</div>';
      m.querySelectorAll('[data-w]').forEach(c => c.onchange = () => wahl.set(c.dataset.w, c.checked));
      m.querySelectorAll('[data-z]').forEach(s => s.onchange = () => ziel.set(s.dataset.z, s.value));
    };
    zeichnen();
    m.querySelector('#st-ok').onclick = async () => {
      const auswahl = l.filter(x => !x.gebucht && wahl.get(x.key));
      if (!auswahl.length) { toast('Nichts ausgewählt.'); return; }
      if (auswahl.some(x => !ziel.get(x.key))) { toast('Bitte bei allen Namen wählen, wer das in der Strafenkasse ist.'); return; }
      m.querySelector('#st-ok').disabled = true;
      try {
        await this.buchen(auswahl.map(x => ({ s: ziel.get(x.key), text: x.kat.name, betrag: x.kat.betrag, notiz: 'Kabine: ' + Detail.titelText(t) + ' (' + startVon(t).toLocaleDateString('de-DE') + ')' })), isoDatum(startVon(t)));
        const keys = auswahl.map(x => x.key);
        LS.set('kb-sk-gebucht-' + t.id, [...LS.get('kb-sk-gebucht-' + t.id, []), ...keys]);
        if (S.istAdmin) await Fb.col('termine').doc(t.id).update({ strafen: firebase.firestore.FieldValue.arrayUnion(...keys) }).catch(() => {});
        Modal.schliessen(m.parentNode); toast(auswahl.length + (auswahl.length === 1 ? ' Strafe' : ' Strafen') + ' gebucht. 💰');
      } catch (e) { m.querySelector('#st-ok').disabled = false; toast(fehlerText(e), 6000); }
    };
  },
  // Bucht direkt in strafenkasse/{team} (gleiches Format wie die Strafenkasse) und aktualisiert die Spieler-Ansicht
  async buchen(liste, datum) {
    const team = this.kw.team, ref = Fb.db.collection('strafenkasse').doc(team);
    const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const erg = await Fb.db.runTransaction(async tx => {
      const s = await tx.get(ref); if (!s.exists) throw new Error('Strafenkasse nicht gefunden');
      const d = s.data(); const stand = JSON.parse(d.json); stand.buchungen = stand.buchungen || [];
      const ts = Date.now();
      liste.forEach(x => stand.buchungen.push({ id: neueId(), art: 'strafe', spielerId: x.s, text: x.text, betrag: x.betrag, datum, notiz: x.notiz.slice(0, 200), ts }));
      stand.buchungen.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      tx.update(ref, { json: JSON.stringify(stand), rev: (d.rev || 0) + 1, updated_at: new Date().toISOString() });
      return { stand, ansicht: d.ansicht || '' };
    });
    this.stand = erg.stand;
    if (erg.ansicht) { const { geloescht, archiv, ...rest } = erg.stand; try { await Fb.db.collection('strafenkasse_ansicht').doc(erg.ansicht).set({ team, json: JSON.stringify(rest), updated_at: new Date().toISOString() }); } catch (e) {} }
  },
};

// ---------------- Spielplan aus Anwurf (nuLiga) ----------------
const Anwurf = {
  data: null, _laden: null, _zeit: 0, verlegt: [],
  async laden(neu) {
    if (this.data && !neu && Date.now() - this._zeit < 15 * 60e3) return this.data;
    if (this._laden) return this._laden;
    this._laden = fetch('../anwurf/data.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { this.data = d; this._zeit = Date.now(); this._laden = null; return d; }).catch(e => { this._laden = null; throw e; });
    return this._laden;
  },
  pruefen() { if (S.team && S.team.anwurf && !this.data && !this._laden) this.laden().then(() => { this.abgleich(); App.renderAlles(); }).catch(() => {}); },
  quelle(g, lid) { return 'anwurf:' + (g.mid || (lid + '|nr' + g.n)); },
  spiele() {
    const aw = S.team && S.team.anwurf; if (!aw || !this.data) return [];
    const l = (this.data.leagues || []).find(x => x.id === aw.lid); if (!l) return [];
    return (l.games || []).filter(g => g.d && (g.h === aw.team || g.a === aw.team)).map(g => ({ ...g, q: this.quelle(g, l.id), heim: g.h === aw.team, gegner: g.h === aw.team ? g.a : g.h }));
  },
  ergebnis(t) { if (!this.data || !t.quelle) return null; const g = this.spiele().find(x => x.q === t.quelle); return g && g.gh != null && g.ga != null ? { h: g.gh, a: g.ga } : null; },
  abgleich() {
    if (!S.istAdmin || !this.data) { this.verlegt = []; return; }
    const sp = new Map(this.spiele().map(g => [g.q, g]));
    this.verlegt = S.termine.filter(t => t.quelle && !istVorbei(t) && sp.has(t.quelle)).map(t => ({ t, g: sp.get(t.quelle) })).filter(x => x.g.d !== x.t.datum + 'T' + x.t.von);
  },
  abgleichHtml() {
    if (!this.verlegt.length) return '';
    return '<div class="warnbox"><b>📅 Spielplan geändert:</b><br>' + this.verlegt.map(x => esc(Detail.titelText(x.t)) + ': ' + esc(tagKurz(startVon(x.t)) + ' ' + x.t.von) + ' → <b>' + esc(tagKurz(new Date(x.g.d)) + ' ' + x.g.d.slice(11)) + '</b>').join('<br>')
      + '<button class="btn klein" style="margin-top:8px" onclick="Anwurf.verlegtUebernehmen()">Übernehmen</button></div>';
  },
  async verlegtUebernehmen() {
    const e = einst();
    try {
      const b = Fb.db.batch();
      this.verlegt.forEach(({ t, g }) => {
        const datum = g.d.slice(0, 10), von = g.d.slice(11, 16);
        const treff = this.treff(von, g.heim ? e.treffHeim : e.treffAusw);
        b.update(Fb.col('termine').doc(t.id), Editor.dokument({ datum, von, bis: '', treff: t.treff ? treff : '', frist: t.frist || 0, ort: g.v || t.ort, quelleZeit: g.d }, true));
      });
      await b.commit();
      await Editor.antwortenNachziehen(this.verlegt.map(x => x.t.id));
      toast('Spielzeiten aktualisiert.');
    } catch (err) { toast(fehlerText(err), 6000); }
  },
  treff(von, min) { if (!min) return ''; const d = ausDatum('2000-01-01', von); d.setMinutes(d.getMinutes() - min); return hhmm(d); },
  async importModal() {
    const m = oeffneModal('<h3>🤾 Spielplan übernehmen</h3><div class="unter" id="aw-status">Lade Spielplan …</div><div id="aw-inhalt"></div>', { zu: true });
    let data; try { data = await this.laden(true); } catch (e) { m.querySelector('#aw-status').textContent = 'Spielplan nicht erreichbar (offline?).'; return; }
    const teams = []; (data.leagues || []).forEach(l => (l.hsg || []).forEach(h => teams.push({ lid: l.id, team: h.team, label: h.label, liga: l.name })));
    const aw = S.team.anwurf;
    m.querySelector('#aw-status').innerHTML = 'Daten aus nuLiga (über Anwurf), Stand ' + esc(new Date(data.updatedAt).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })) + '. Ergebnisse erscheinen automatisch, Verlegungen werden gemeldet.';
    const inhalt = m.querySelector('#aw-inhalt');
    inhalt.innerHTML = '<label class="feld">Unsere Mannschaft im Spielplan</label><select class="ein" id="aw-team"><option value="">Bitte wählen …</option>' + teams.map((x, i) => '<option value="' + i + '"' + (aw && aw.lid === x.lid && aw.team === x.team ? ' selected' : '') + '>' + esc(x.label + ' – ' + x.liga) + '</option>').join('') + '</select><div id="aw-spiele"></div>';
    const zeigen = () => {
      const i = m.querySelector('#aw-team').value; const box = m.querySelector('#aw-spiele');
      if (i === '') { box.innerHTML = ''; return; }
      const x = teams[Number(i)];
      const l = data.leagues.find(y => y.id === x.lid);
      const jetzt = new Date();
      const vorhanden = new Set(S.termine.map(t => t.quelle).filter(Boolean));
      const spiele = (l.games || []).filter(g => g.d && (g.h === x.team || g.a === x.team) && new Date(g.d) > jetzt).map(g => ({ ...g, q: this.quelle(g, l.id), heim: g.h === x.team }));
      box.innerHTML = '<div class="gruppe-kopf">Kommende Spiele<span class="z">' + spiele.length + '</span></div>'
        + (spiele.length ? '<div class="card flach" style="box-shadow:none;background:var(--zebra)">' + spiele.map(g => '<label class="check" style="border-top:1px solid var(--rand)"><input type="checkbox" data-q="' + esc(g.q) + '"' + (vorhanden.has(g.q) ? ' disabled' : ' checked') + '><span>' + esc(tagKurz(new Date(g.d)) + ' ' + g.d.slice(11)) + ' · ' + (g.heim ? '🏠 vs. ' + esc(g.a) : '🚌 @ ' + esc(g.h)) + '<small>' + esc(g.v || '') + (vorhanden.has(g.q) ? ' · schon übernommen' : '') + '</small></span></label>').join('') + '</div>' : '<div class="hinweis">Keine kommenden Spiele.</div>')
        + '<div class="knoepfe"><button class="btn sekundaer" data-zu>Schließen</button><button class="btn" id="aw-ok">Übernehmen</button></div>';
      box.querySelector('#aw-ok').onclick = async () => {
        const qs = new Set([...box.querySelectorAll('[data-q]:checked:not(:disabled)')].map(c => c.dataset.q));
        const e = einst();
        try {
          const b = Fb.db.batch(); let n = 0;
          spiele.filter(g => qs.has(g.q)).forEach(g => {
            const datum = g.d.slice(0, 10), von = g.d.slice(11, 16);
            b.set(Fb.col('termine').doc(), Editor.dokument({ typ: 'spiel', titel: '', datum, von, bis: '', treff: this.treff(von, g.heim ? e.treffHeim : e.treffAusw), ort: g.v || '', adresse: '', notiz: '', gegner: g.heim ? g.a : g.h, heim: g.heim, frist: e.frist, standard: 'offen', pflicht: false, fahrten: !g.heim, max: 0, kader: [], aufgaben: {}, serie: '', abgesagt: false, absageGrund: '', anwesenheit: {}, quelle: g.q, quelleZeit: g.d, erstellt: Fb.jetzt() }));
            n++;
          });
          if (!aw || aw.lid !== x.lid || aw.team !== x.team) await App.teamSpeichern({ anwurf: { lid: x.lid, team: x.team, label: x.label, liga: x.liga } });
          if (n) await b.commit();
          Modal.schliessen(m.parentNode); toast(n ? n + ' Spiele übernommen.' : 'Mannschaft gespeichert – Ergebnisse erscheinen automatisch.');
        } catch (err) { toast(fehlerText(err), 6000); }
      };
    };
    m.querySelector('#aw-team').onchange = zeigen; zeigen();
  },
};

App.start();
</script>
