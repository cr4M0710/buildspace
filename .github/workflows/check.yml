name: Seite prüfen
on:
  push:
    branches: [main]
    paths-ignore:
      - "anwurf/data.json"
      - "anwurf/state.json"
      - "anwurf/live.json"
      - "anwurf/leagues/**"
      - "anwurf/logos/**"
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-site.js
