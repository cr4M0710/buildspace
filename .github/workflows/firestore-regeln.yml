name: Firestore-Regeln einspielen
# Spielt firebase/firestore.rules automatisch in Firebase ein, sobald die Datei auf main
# geändert wird. Einrichtung (einmalig): firebase/ANLEITUNG.md, Abschnitt „Automatisch einspielen“.
on:
  push:
    branches: [main]
    paths: ["firebase/firestore.rules"]
  workflow_dispatch:
    inputs:
      nur_vergleichen:
        description: "Nur vergleichen, nichts einspielen"
        type: boolean
        default: false
      trotzdem:
        description: "Auch einspielen, wenn live Bereiche geregelt sind, die in der Datei fehlen"
        type: boolean
        default: false
concurrency: firestore-regeln
jobs:
  einspielen:
    runs-on: ubuntu-latest
    steps:
      - name: Geheimnis vorhanden?
        id: geheim
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "Das Geheimnis FIREBASE_SERVICE_ACCOUNT fehlt noch – Regeln bitte einmalig einrichten (firebase/ANLEITUNG.md)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "da=false" >> "$GITHUB_OUTPUT"
          else
            echo "da=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.geheim.outputs.da == 'true'
      - uses: actions/setup-node@v4
        if: steps.geheim.outputs.da == 'true'
        with:
          node-version: 20
      - uses: google-github-actions/auth@v2
        if: steps.geheim.outputs.da == 'true'
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Regeln einspielen
        if: steps.geheim.outputs.da == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          NUR_VERGLEICHEN: ${{ inputs.nur_vergleichen }}
          TROTZDEM: ${{ inputs.trotzdem }}
        run: node tools/firestore-regeln.mjs
      - name: Sicherung der vorherigen Regeln
        if: always() && steps.geheim.outputs.da == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vorherige-regeln
          path: vorherige-regeln.rules
          if-no-files-found: ignore
          retention-days: 90
