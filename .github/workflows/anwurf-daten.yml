name: Anwurf – Spieldaten holen
# Holt für jede Liga, in der eine Mannschaft der HSG Wettenberg spielt, Tabelle,
# Spielplan und Spielberichte (Tor für Tor, Torschützen) aus nuLiga (HHV),
# schreibt anwurf/data.json, anwurf/live.json und anwurf/leagues/*.json und
# schickt Push-Nachrichten über ntfy.sh (ein Kanal je HSG-Mannschaft).
# Läuft gerade ein Spiel, bleibt der Job bis zu 25 Minuten aktiv und gleicht alle 90 Sekunden ab.
# Zeiten in UTC (deutsche Zeit = UTC+1 im Winter, UTC+2 im Sommer).
on:
  schedule:
    - cron: "*/5 16-22 * * 5"    # Freitag Abend: alle 5 Minuten
    - cron: "*/5 11-22 * * 6"    # Samstag: alle 5 Minuten
    - cron: "*/5 10-20 * * 0"    # Sonntag: alle 5 Minuten
    - cron: "17 */3 * * *"       # sonst alle 3 Stunden
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/anwurf-update.mjs"
      - ".github/workflows/anwurf-daten.yml"

permissions:
  contents: write

concurrency:
  group: anwurf-daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NTFY_TOPIC: hsg-wettenberg-anwurf-79866c71
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git einrichten
        run: |
          git config user.name "anwurf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Daten holen
        run: node tools/anwurf-update.mjs --watch
      - name: Änderungen speichern
        run: |
          git add anwurf/data.json anwurf/live.json anwurf/state.json anwurf/leagues
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -m "Anwurf: Spieldaten aktualisiert"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
