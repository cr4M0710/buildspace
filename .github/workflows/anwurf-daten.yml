name: Anwurf – Spieldaten holen
# Holt Spielplan und Tabelle für HSG Wettenberg Männer 1 + 2 von hessenschau.de,
# schreibt anwurf/data.json und schickt Push-Nachrichten über ntfy.sh.
# Zeiten in UTC (deutsche Zeit = UTC+1 im Winter, UTC+2 im Sommer).
on:
  schedule:
    - cron: "*/10 16-22 * * 5"   # Freitag Abend: alle 10 Minuten
    - cron: "*/10 11-22 * * 6"   # Samstag: alle 10 Minuten
    - cron: "*/10 10-20 * * 0"   # Sonntag: alle 10 Minuten
    - cron: "17 */3 * * *"       # sonst alle 3 Stunden
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/anwurf-update.mjs"
      - ".github/workflows/anwurf-daten.yml"

permissions:
  contents: write

concurrency:
  group: anwurf-daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: hsg-wettenberg-anwurf-79866c71
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten holen
        run: node tools/anwurf-update.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "anwurf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anwurf/data.json anwurf/state.json
          if git diff --cached --quiet; then echo "Nichts zu speichern"; exit 0; fi
          git commit -m "Anwurf: Spieldaten aktualisiert"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
