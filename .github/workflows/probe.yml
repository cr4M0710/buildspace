name: Anwurf – Probe
on:
  push:
    branches: [anwurf-probe]
    paths: ["probe/probe.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd probe && npm i ws@8 --silent && node probe.mjs
      - run: |
          git config user.name anwurf-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/out
          git commit -qm "probe results" && git push -q
