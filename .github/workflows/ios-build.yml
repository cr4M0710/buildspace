name: iOS-Build (Flimmer)
on:
  push:
    branches: [flimmer-ios-ci]
    paths-ignore: ['ci/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Flimmer.xcodeproj -target Flimmer -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=CI build 2>&1 | tee build.log || echo "BUILD_FAILED" >> build.log
      - name: Bildschirmfotos im Simulator
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: |
          mkdir -p ci
          APP=build/Debug-iphonesimulator/Flimmer.app
          [ -d "$APP" ] || exit 0
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 Pro \(|iPhone 16 \(" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl status_bar "$DEV" override --time 20:15 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch "$DEV" "$BID"; sleep 6; xcrun simctl io "$DEV" screenshot ci/0-profile.png
          xcrun simctl terminate "$DEV" "$BID"
          for t in 0 1 2 3; do
            xcrun simctl launch "$DEV" "$BID" -demo -tab $t; sleep 9
            xcrun simctl io "$DEV" screenshot ci/tab$t.png
            xcrun simctl terminate "$DEV" "$BID"
          done
          xcrun simctl launch "$DEV" "$BID" -demo -tab 1 -play; sleep 18
          xcrun simctl io "$DEV" screenshot ci/player.png
      - name: Log zurückschreiben
        if: always()
        run: |
          mkdir -p ci
          grep -E "error:|warning:|BUILD SUCCEEDED|BUILD FAILED|BUILD_FAILED" build.log | grep -v "appintentsmetadataprocessor" | sort -u | head -300 > ci/summary.txt || true
          tail -40 build.log > ci/tail.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add ci && git commit -m "CI-Log [skip ci]" && git push || true
