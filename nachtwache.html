<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nachtwache</title>
<style>
  :root{
    --ink:#d9d2c0; --amber:#e0a23a; --red:#c9372c; --dim:rgba(217,210,192,.55); --cross:#d9d2c0; --bs:1;
    --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
    --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#06080b;color:var(--ink);
    font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:calc(12px + var(--sa-t)) calc(14px + var(--sa-r)) calc(12px + var(--sa-b)) calc(14px + var(--sa-l));
    opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  .cross{position:absolute;left:50%;top:50%;width:2px;height:9px;background:var(--cross);opacity:.9;box-shadow:0 0 2px #000}
  .cross.n{transform:translate(-50%,calc(-50% - var(--gap)))}
  .cross.s{transform:translate(-50%,calc(-50% + var(--gap)))}
  .cross.e{transform:translate(calc(-50% + var(--gap)),-50%) rotate(90deg)}
  .cross.w{transform:translate(calc(-50% - var(--gap)),-50%) rotate(90deg)}
  #hud.ads .cross{opacity:0}
  #dot{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#ff2a2a;transform:translate(-50%,-50%);display:none;
    box-shadow:0 0 6px 2px rgba(255,40,40,.8),0 0 14px 4px rgba(255,40,40,.35)}
  #dot.holo{width:26px;height:26px;background:none;border:2px solid rgba(255,40,40,.9);box-shadow:0 0 6px rgba(255,40,40,.7),inset 0 0 6px rgba(255,40,40,.5)}
  #dot.holo:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#ff2a2a;transform:translate(-50%,-50%)}
  #hit{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%) rotate(45deg);
    border:2px solid var(--amber);opacity:0;transition:opacity .25s}
  #hit.on{opacity:1;transition:none}
  #tl{position:absolute;left:inherit;top:inherit;line-height:1.05}
  #tl .big{font-size:34px;font-weight:700}
  #tl .sub{font-size:14px;color:var(--dim)}
  #tc{position:absolute;left:50%;top:inherit;transform:translateX(-50%);text-align:center;line-height:1}
  #tc .w{font-size:14px;color:var(--dim)}
  #tc .n{font-size:30px;font-weight:700;color:var(--amber)}
  #bossbar{width:220px;height:5px;background:rgba(255,255,255,.12);margin:8px auto 0;display:none}
  #bossfill{height:100%;background:var(--red);width:100%}
  #bl{position:absolute;left:inherit;bottom:inherit;width:180px}
  #bl .lbl{font-size:13px;color:var(--dim);margin-bottom:3px}
  .bar{height:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:6px}
  .bar div{height:100%;width:100%;background:var(--ink);transition:width .12s}
  #hpfill.low{background:var(--red)} #stfill{background:var(--amber)}
  #br{position:absolute;right:inherit;bottom:inherit;text-align:right;line-height:1}
  #br .wn{font-size:15px;color:var(--dim)}
  #br .mag{font-size:44px;font-weight:700}
  #br .mag.low{color:var(--red)}
  #br .res{font-size:18px;color:var(--dim)}
  #br .state{font-size:14px;color:var(--amber);height:16px;margin-bottom:4px}
  #br .gren{font-size:15px;color:var(--dim);margin-top:6px}
  #mini{position:absolute;right:inherit;top:calc(var(--sa-t) + 56px);width:118px;height:118px;border-radius:50%;
    border:2px solid rgba(217,210,192,.3);background:rgba(6,8,11,.5)}
  #pauseBtn{position:absolute;right:inherit;top:inherit;width:38px;height:38px;pointer-events:auto;
    border:2px solid rgba(217,210,192,.5);background:rgba(20,22,26,.5);font-size:16px;font-weight:700;color:var(--ink)}
  #prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:17px;color:var(--amber);
    background:rgba(6,8,11,.6);padding:6px 14px;display:none}
  #gen{position:absolute;left:50%;top:calc(var(--sa-t) + 72px);transform:translateX(-50%);font-size:13px;color:var(--dim);display:none;text-align:center}
  #gen .bar{width:160px;margin:3px auto 0}
  #scope{position:fixed;inset:0;pointer-events:none;display:none;
    background:radial-gradient(circle at center,transparent 0,transparent 36vmin,rgba(0,0,0,.55) 37.5vmin,#000 39.5vmin)}
  #scope:before,#scope:after{content:"";position:absolute;left:50%;top:50%;background:rgba(0,0,0,.9)}
  #scope:before{width:1.5px;height:74vmin;transform:translate(-50%,-50%)}
  #scope:after{width:74vmin;height:1.5px;transform:translate(-50%,-50%)}
  #scope i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#ff2a2a;transform:translate(-50%,-50%);box-shadow:0 0 6px 2px rgba(255,40,40,.7)}
  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(201,55,44,0) 40%,rgba(201,55,44,.75) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;background:#cfd8ff;opacity:0}
  #banner{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0;
    font-size:52px;font-weight:700;letter-spacing:2px;text-shadow:0 2px 12px #000;transition:opacity .5s}
  #banner small{display:block;font-size:18px;font-weight:400;color:var(--dim);letter-spacing:0}
  #banner.on{opacity:1}

  /* ---------- Touch ---------- */
  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  body.touch.playing #touch,body.touch.editing #touch{display:block}
  body.editing .btn{border-color:var(--amber);border-style:dashed}
  #editBar{display:none;position:fixed;left:50%;top:calc(10px + var(--sa-t));transform:translateX(-50%);z-index:12;gap:8px;align-items:center;
    background:rgba(6,8,11,.85);padding:8px 12px;font-size:15px;color:var(--dim)}
  body.editing #editBar{display:flex}
  #editBar button{padding:6px 12px;font-weight:700;color:var(--ink);background:rgba(217,210,192,.12)} #editBar button.ok{color:#06080b;background:var(--amber)}
  #joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(217,210,192,.35);transform:translate(-50%,-50%);display:none}
  #knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(217,210,192,.45);transform:translate(-50%,-50%);display:none}
  #tb{position:absolute;inset:0}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(217,210,192,.5);
    background:rgba(20,22,26,.45);display:flex;align-items:center;justify-content:center;
    font-size:calc(14px*var(--bs));font-weight:700;color:var(--ink);transform:translate(-50%,-50%)}
  .btn:active,.btn.on{background:rgba(224,162,58,.35)}
  .btn.big{width:calc(96px*var(--bs));height:calc(96px*var(--bs));font-size:calc(17px*var(--bs))}
  .btn.sm{width:calc(60px*var(--bs));height:calc(60px*var(--bs))}


  /* ---------- Menüs ---------- */
  #ui{position:fixed;inset:0;z-index:10;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,rgba(6,8,11,.6),rgba(6,8,11,.94));
    padding:calc(20px + var(--sa-t)) calc(20px + var(--sa-r)) calc(24px + var(--sa-b)) calc(20px + var(--sa-l))}
  #ui.hidden{display:none}
  .panel{display:none;max-width:760px;margin:0 auto}
  .panel.on{display:block}
  .panel.center{text-align:center;min-height:100%;display:none;flex-direction:column;justify-content:flex-start;align-items:center}
  .panel.center>:first-child{margin-top:auto} .panel.center>:last-child{margin-bottom:auto}
  @media (max-height:520px){ h1{font-size:clamp(44px,10vh,80px)} h2{font-size:clamp(28px,7vh,48px)} .menu{margin-top:14px;gap:6px} .go{padding:11px 22px;font-size:18px} .tag{font-size:15px;margin-top:6px} #ui{padding-top:calc(10px + var(--sa-t))} .card{padding:10px 14px} }
  @media (max-width:420px){ .row{flex-wrap:wrap} .row input[type=range]{width:120px} #prev{height:150px} }
  .panel.center.on{display:flex}
  h1{font-size:clamp(56px,13vw,116px);font-weight:700;letter-spacing:4px;line-height:.9}
  h2{font-size:clamp(34px,8vw,64px);font-weight:700;letter-spacing:2px;line-height:1;margin-bottom:6px}
  h3{font-size:20px;font-weight:600;margin:18px 0 8px;color:var(--amber)}
  .tag{font-size:17px;color:var(--dim);margin-top:10px;max-width:34em}
  .menu{display:flex;flex-direction:column;gap:10px;margin-top:28px;width:min(360px,100%)}
  .go{padding:15px 30px;font-size:21px;font-weight:700;letter-spacing:1px;color:#06080b;background:var(--amber)}
  .go:active{background:#c88c2e}
  .go.sec{background:rgba(217,210,192,.12);color:var(--ink)}
  .go.sec:active{background:rgba(217,210,192,.25)}
  .go:disabled{opacity:.4}
  .back{display:inline-block;margin-bottom:10px;font-size:16px;color:var(--dim);padding:6px 0}
  .card{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;background:rgba(217,210,192,.07);border-left:3px solid transparent}
  .card:active,.card.on{border-left-color:var(--amber);background:rgba(224,162,58,.14)}
  .card b{display:block;font-size:20px;font-weight:600}
  .card span{font-size:14px;color:var(--dim)}
  .card.locked{opacity:.4}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(217,210,192,.1);font-size:17px}
  .row small{display:block;font-size:13px;color:var(--dim)}
  .row input[type=range]{width:150px;accent-color:var(--amber)}
  .row select,.row input[type=text]{font:inherit;font-size:16px;background:rgba(0,0,0,.4);color:var(--ink);border:1px solid rgba(217,210,192,.3);padding:6px 8px}
  .row .val{min-width:44px;text-align:right;color:var(--dim);font-size:15px}
  .tog{width:52px;height:28px;border-radius:14px;background:rgba(217,210,192,.2);position:relative;flex:none}
  .tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .15s}
  .tog.on{background:var(--amber)} .tog.on:after{left:27px;background:#06080b}
  .sw{display:flex;gap:6px;flex-wrap:wrap}
  .sw button{padding:6px 12px;font-size:15px;background:rgba(217,210,192,.1)}
  .sw button.on{background:var(--amber);color:#06080b}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chips button{padding:7px 12px;font-size:15px;background:rgba(217,210,192,.1)}
  .chips button.on{background:var(--amber);color:#06080b}
  .chips .cam{width:34px;height:34px;padding:0;border:2px solid transparent}
  .chips .cam.on{border-color:var(--amber)}
  #prev{width:100%;height:190px;background:rgba(0,0,0,.35);display:block}
  .stats{display:grid;grid-template-columns:110px 1fr 44px;gap:4px 10px;align-items:center;font-size:14px;margin-top:10px}
  .stats .b{height:6px;background:rgba(255,255,255,.12)} .stats .b div{height:100%;background:var(--ink)}
  .stats .v{text-align:right;color:var(--dim)}
  .code{font-size:56px;font-weight:700;letter-spacing:8px;color:var(--amber);margin:14px 0}
  .res{display:flex;gap:36px;margin-top:20px;justify-content:center}
  .res div{font-size:15px;color:var(--dim)}
  .res span{display:block;font-size:40px;font-weight:700;color:var(--amber)}
  .perks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .perk{width:200px;padding:16px;background:rgba(217,210,192,.07);text-align:left}
  .perk b{display:block;font-size:20px;color:var(--amber)} .perk span{font-size:14px;color:var(--dim)}
  .perk:active{background:rgba(224,162,58,.2)}
  table.lb{width:100%;border-collapse:collapse;font-size:16px}
  table.lb td{padding:8px 4px;border-bottom:1px solid rgba(217,210,192,.1)} table.lb td:last-child{text-align:right;color:var(--amber)}
  .msg{font-size:15px;color:var(--dim);margin-top:8px;min-height:20px}
  .weap{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;margin-bottom:6px;background:rgba(217,210,192,.07)}
  .weap:active{background:rgba(224,162,58,.2)} .weap b{font-size:19px} .weap span{color:var(--amber)}
  #rotate{display:none;position:fixed;left:50%;top:calc(50% + 40px);transform:translateX(-50%);z-index:20;background:rgba(6,8,11,.85);
    font-size:16px;color:var(--ink);padding:10px 16px;text-align:center;pointer-events:none;white-space:nowrap}
  @media (orientation:portrait){body.touch.playing #rotate{display:block}}
  body.touch #pauseBtn{right:auto;left:inherit}
  body.touch #tl{left:calc(14px + var(--sa-l) + 50px)}
  body.touch #mini{right:auto;left:inherit;top:calc(var(--sa-t) + 86px);width:96px;height:96px}
  body.touch #br{right:auto;left:calc(14px + var(--sa-l) + 196px);text-align:left}
  body.touch #br .mag{font-size:36px} body.touch #tl .big{font-size:28px}
  body.lefty #br{left:auto;right:calc(14px + var(--sa-r) + 196px);text-align:right}
  body.lefty #bl{left:auto;right:inherit}
  body.touch #bl{bottom:calc(12px + var(--sa-b) + 6px)}
  body.lefty #mini{left:auto;right:inherit}
  body.lefty #pauseBtn{left:auto;right:inherit}
  body.lefty #tl{left:inherit}
</style>
<script defer data-category="freizeit" src="protect.js"></script>
<script defer src="cursor.js"></script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" style="--gap:7px">
  <div class="cross n"></div><div class="cross s"></div><div class="cross e"></div><div class="cross w"></div>
  <div id="hit"></div><div id="dot"></div>
  <div id="tl"><div class="big" id="hScore">0</div><div class="sub" id="hKills"></div><div class="sub" id="hCoop"></div></div>
  <div id="tc"><div class="w" id="hWaveL"></div><div class="n" id="hWave">1</div><div class="w" id="hLeft"></div><div id="bossbar"><div id="bossfill"></div></div></div>
  <div id="gen"><span id="genL"></span><div class="bar"><div id="genfill"></div></div></div>
  <button id="pauseBtn">II</button>
  <canvas id="mini" width="236" height="236"></canvas>
  <div id="bl"><div class="lbl" id="hpL"></div><div class="bar"><div id="hpfill"></div></div><div class="bar" style="height:4px"><div id="stfill"></div></div></div>
  <div id="br"><div class="state" id="hState"></div><div class="wn" id="hWName"></div><div class="mag" id="hMag">30</div><div class="res" id="hRes">120</div><div class="gren" id="hGren"></div></div>
  <div id="prompt"></div>
</div>
<div id="scope"><i></i></div>
<div id="dmg"></div>
<div id="flash"></div>
<div id="banner"></div>

<div id="touch">
  <div id="joy"></div><div id="knob"></div>
  <div id="tb">
    <div class="btn big" id="bFire"></div>
    <div class="btn sm" id="bAim"></div>
    <div class="btn sm" id="bReload"></div>
    <div class="btn sm" id="bRun"></div>
    <div class="btn sm" id="bGren"></div>
    <div class="btn sm" id="bMelee"></div>
    <div class="btn sm" id="bAct"></div>
    <div class="btn sm" id="bSwap"></div>
    <div class="btn sm" id="bJump"></div>
  </div>
</div>

<div id="ui">
  <div class="panel center on" id="pMain">
    <h1>NACHTWACHE</h1>
    <p class="tag" id="tagline"></p>
    <div class="menu">
      <button class="go" data-go="pModes" data-t="play"></button>
      <button class="go sec" data-go="pShop" data-t="workshop"></button>
      <button class="go sec" data-go="pSet" data-t="settings"></button>
      <button class="go sec" data-go="pBoard" data-t="board"></button>
    </div>
    <p class="tag" id="ctlHint" style="font-size:14px"></p>
  </div>

  <div class="panel" id="pModes">
    <button class="back" data-go="pMain" data-t="back"></button>
    <h2 data-t="modes"></h2>
    <div id="modeList"></div>
  </div>

  <div class="panel" id="pMaps">
    <button class="back" data-go="pModes" data-t="back"></button>
    <h2 data-t="campaign"></h2>
    <p class="tag" data-t="campaignHint"></p>
    <div id="mapList" style="margin-top:12px"></div>
  </div>

  <div class="panel" id="pCoop">
    <button class="back" data-go="pModes" data-t="back"></button>
    <h2 data-t="coop"></h2>
    <p class="tag" data-t="coopHint"></p>
    <h3 data-t="hostGame"></h3>
    <div class="row"><span data-t="coopMode"></span><div class="sw" id="coopModes"></div></div>
    <div class="row"><span data-t="map"></span><div class="sw" id="coopMaps"></div></div>
    <button class="go" id="bHost" style="margin-top:12px" data-t="createCode"></button>
    <h3 data-t="joinGame"></h3>
    <div class="row"><input type="text" id="joinCode" maxlength="5" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px;width:140px"><button class="go sec" id="bJoin" data-t="join"></button></div>
    <p class="msg" id="coopMsg"></p>
  </div>

  <div class="panel center" id="pLobby">
    <h2 data-t="lobby"></h2>
    <p class="tag" data-t="shareCode"></p>
    <div class="code" id="lobbyCode"></div>
    <p class="msg" id="lobbyMsg"></p>
    <div class="menu">
      <button class="go" id="bLobbyStart" disabled data-t="startNow"></button>
      <button class="go sec" id="bLobbyLeave" data-t="cancel"></button>
    </div>
  </div>

  <div class="panel" id="pShop">
    <button class="back" data-go="pMain" data-t="back"></button>
    <h2 data-t="workshop"></h2>
    <div class="row"><span data-t="slot"></span><div class="sw" id="slotSw"></div></div>
    <div class="row"><span data-t="weapon"></span><div class="sw" id="baseSw"></div></div>
    <canvas id="prev"></canvas>
    <div id="attRows"></div>
    <h3 data-t="camo"></h3><div class="chips" id="camoRow"></div>
    <div class="stats" id="statRows"></div>
  </div>

  <div class="panel" id="pSet">
    <button class="back" id="setBack" data-t="back"></button>
    <h2 data-t="settings"></h2>
    <div id="setRows"></div>
  </div>

  <div class="panel" id="pBoard">
    <button class="back" data-go="pMain" data-t="back"></button>
    <h2 data-t="board"></h2>
    <table class="lb" id="lbTable"></table>
    <button class="go sec" id="bLbClear" style="margin-top:16px" data-t="clearBoard"></button>
  </div>

  <div class="panel center" id="pPause">
    <h2 data-t="pause"></h2>
    <div class="menu">
      <button class="go" id="bResume" data-t="resume"></button>
      <button class="go sec" id="bPauseSet" data-t="settings"></button>
      <button class="go sec" id="bQuit" data-t="toMenu"></button>
    </div>
  </div>

  <div class="panel center" id="pOver">
    <h2 id="overTitle"></h2>
    <p class="tag" id="overText"></p>
    <div class="res"><div><span id="oWave">0</span><em id="oWaveL"></em></div><div><span id="oKills">0</span><em data-t="kills"></em></div><div><span id="oScore">0</span><em data-t="points"></em></div></div>
    <p class="msg" id="oBest"></p>
    <div class="menu">
      <button class="go" id="bAgain" data-t="again"></button>
      <button class="go sec" id="bOverMenu" data-t="toMenu"></button>
    </div>
  </div>

  <div class="panel center" id="pPerk">
    <h2 data-t="choosePerk"></h2>
    <p class="tag" data-t="perkHint"></p>
    <div class="perks" id="perkList"></div>
  </div>

  <div class="panel center" id="pLocker">
    <h2 data-t="locker"></h2>
    <p class="tag" id="lockerPts"></p>
    <div style="width:min(420px,100%);margin-top:14px" id="lockerList"></div>
    <button class="go sec" id="bLockerClose" style="margin-top:10px" data-t="close"></button>
  </div>
</div>
<div id="rotate"></div>
<div id="editBar"><span id="editHint"></span><button id="bEditReset"></button><button class="ok" id="bEditDone"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js" crossorigin="anonymous"></script>

/* ---------- Audio ---------- */
let AC=null,master=null,ambGain=null,windSrc=null;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=SET.volFx; master.connect(AC.destination);
  ambGain=AC.createGain(); ambGain.gain.value=SET.volAmb; ambGain.connect(AC.destination);
  // Wind
  windSrc=AC.createBufferSource(); windSrc.buffer=noiseBuf(4); windSrc.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
  const lfo=AC.createOscillator(); lfo.frequency.value=.13; const lg=AC.createGain(); lg.gain.value=180; lfo.connect(lg).connect(f.frequency); lfo.start();
  const wg=AC.createGain(); wg.gain.value=.16; windSrc.connect(f).connect(wg).connect(ambGain); windSrc.start();
}
function noiseBuf(len){ const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function sfxShot(kind,quiet){
  if(!AC) return; const t=AC.currentTime, big=kind==='sniper'||kind==='shotgun';
  const n=AC.createBufferSource(); n.buffer=noiseBuf(.3);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(quiet?900:(big?2200:3200),t); f.frequency.exponentialRampToValueAtTime(quiet?200:300,t+(big?.32:.2));
  const g=AC.createGain(); g.gain.setValueAtTime(quiet?.35:(big?1.1:.9),t); g.gain.exponentialRampToValueAtTime(.001,t+(big?.36:.22));
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t+.4);
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(big?110:140,t); o.frequency.exponentialRampToValueAtTime(35,t+.14);
  const og=AC.createGain(); og.gain.setValueAtTime(quiet?.25:.7,t); og.gain.exponentialRampToValueAtTime(.001,t+.16); o.connect(og).connect(master); o.start(t); o.stop(t+.17);
}
function sfxGrowl(vol,deep){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime((deep?40:70)+Math.random()*30,t); o.frequency.linearRampToValueAtTime(deep?28:45,t+.6);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=deep?250:400;
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(vol,t+.1); g.gain.exponentialRampToValueAtTime(.001,t+(deep?1.2:.7));
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+1.3);
}
function sfxHurt(){ if(!AC) return; const t=AC.currentTime; const o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(50,t+.25);
  const g=AC.createGain(); g.gain.setValueAtTime(.6,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g).connect(master); o.start(t); o.stop(t+.3); }
function sfxClick(hz,vol){ if(!AC) return; const t=AC.currentTime; const n=AC.createBufferSource(); n.buffer=noiseBuf(.05);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=hz; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
  n.connect(f).connect(g).connect(master); n.start(t); }
function sfxReload(len){ if(!AC) return; [0,len*.35,len*.7].forEach((d,i)=>setTimeout(()=>sfxClick(1800+i*400,.4),d*1000)); }
function sfxBoom(){ if(!AC) return; const t=AC.currentTime; const n=AC.createBufferSource(); n.buffer=noiseBuf(1.2);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(60,t+1);
  const g=AC.createGain(); g.gain.setValueAtTime(1.4,t); g.gain.exponentialRampToValueAtTime(.001,t+1.1); n.connect(f).connect(g).connect(master); n.start(t);
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(25,t+.6);
  const og=AC.createGain(); og.gain.setValueAtTime(1,t); og.gain.exponentialRampToValueAtTime(.001,t+.7); o.connect(og).connect(master); o.start(t); o.stop(t+.7); }
function sfxThunder(){ if(!AC) return; const t=AC.currentTime+.4+Math.random(); const n=AC.createBufferSource(); n.buffer=noiseBuf(3);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(50,t+2.5);
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.9,t+.15); g.gain.exponentialRampToValueAtTime(.001,t+2.8); n.connect(f).connect(g).connect(ambGain); n.start(t); }
function sfxSiren(){ if(!AC) return; const t=AC.currentTime; const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(420,t);
  for(let i=0;i<4;i++){ o.frequency.linearRampToValueAtTime(680,t+i*2+1); o.frequency.linearRampToValueAtTime(420,t+i*2+2); }
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700; const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.06,t+1); g.gain.linearRampToValueAtTime(.001,t+8);
  o.connect(f).connect(g).connect(ambGain); o.start(t); o.stop(t+8.2); }
function sfxPulse(){ if(!AC) return; const t=AC.currentTime; for(let i=0;i<4;i++){ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=55;
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t+i*.5); g.gain.linearRampToValueAtTime(.7,t+i*.5+.05); g.gain.exponentialRampToValueAtTime(.001,t+i*.5+.45);
  o.connect(g).connect(ambGain); o.start(t+i*.5); o.stop(t+i*.5+.5); } }
function sfxMelee(){ if(!AC) return; const t=AC.currentTime; const n=AC.createBufferSource(); n.buffer=noiseBuf(.15); const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  const g=AC.createGain(); g.gain.setValueAtTime(.8,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); n.connect(f).connect(g).connect(master); n.start(t); }
function vibrate(ms){ if(SET.vib && navigator.vibrate) navigator.vibrate(ms); }

/* ---------- Texturen ---------- */
function makeTex(base,amp,draw,rx=1,ry=1){
  const s=256,c=document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,s,s);
  const id=x.getImageData(0,0,s,s),d=id.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*amp; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  x.putImageData(id,0,0); if(draw) draw(x,s);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=4; return t;
}
const DRAW={

      for(let j=0;j<8;j++){ px+=Math.random()*40-20; py+=Math.random()*40-20; x.lineTo(px,py);} x.stroke(); }
    x.fillStyle='rgba(120,110,90,.08)'; for(let k=0;k<30;k++){ x.beginPath(); x.arc(Math.random()*s,Math.random()*s,Math.random()*18,0,7); x.fill(); } },

  wood:(x,s)=>{ x.fillStyle='rgba(0,0,0,.45)'; for(let i=0;i<s;i+=32) x.fillRect(i,0,2,s); x.strokeStyle='rgba(0,0,0,.35)'; x.lineWidth=10; x.beginPath(); x.moveTo(0,0); x.lineTo(s,s); x.moveTo(s,0); x.lineTo(0,s); x.stroke(); x.strokeStyle='rgba(0,0,0,.6)'; x.lineWidth=6; x.strokeRect(3,3,s-6,s-6); },
  container:(x,s)=>{ for(let i=0;i<s;i+=16){ x.fillStyle='rgba(255,255,255,.07)'; x.fillRect(i,0,6,s); x.fillStyle='rgba(0,0,0,.28)'; x.fillRect(i+10,0,6,s);} x.fillStyle='rgba(60,30,15,.5)'; for(let k=0;k<10;k++){ x.beginPath(); x.arc(Math.random()*s,Math.random()*s,4+Math.random()*14,0,7); x.fill(); } },
  rust:(x,s)=>{ x.fillStyle='rgba(150,80,30,.35)'; for(let k=0;k<20;k++){ x.beginPath(); x.arc(Math.random()*s,Math.random()*s,4+Math.random()*20,0,7); x.fill(); } },
  metal:(x,s)=>{ x.fillStyle='rgba(255,255,255,.05)'; for(let i=0;i<s;i+=4) x.fillRect(0,i,s,1); },
  plank:(x,s)=>{ x.fillStyle='rgba(0,0,0,.3)'; for(let i=0;i<s;i+=6) x.fillRect(0,i,s,1); }
};

  wood:makeTex('#7a5a35',44,DRAW.wood), plank:makeTex('#6b4e2c',50,DRAW.plank,3,1), contRed:makeTex('#6b3a2c',34,DRAW.container,3,1), contBlue:makeTex('#3b4652',34,DRAW.container,3,1),

function updateZombiesHost(dt){

function updateMode(dt){
