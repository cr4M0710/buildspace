<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pfotenglück</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#d9ebf6;--surface:#ffffff;--surface2:#eef5fb;--ink:#1d2a44;--muted:#5a6b82;--line:#c9d8e8;
  --primary:#2f7de1;--primary-ink:#ffffff;--accent:#ffc94d;--good:#3fae6a;--warn:#f0a020;--bad:#e5484d;--love:#ec4f7c;
  --edge:#1d2a44;--shadow:rgba(29,42,68,.16);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1829;--surface:#1a2946;--surface2:#223355;--ink:#eaf1ff;--muted:#9db0d0;--line:#2f4266;
    --primary:#5b9bff;--primary-ink:#0b1730;--edge:#0a1224;--shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1829;--surface:#1a2946;--surface2:#223355;--ink:#eaf1ff;--muted:#9db0d0;--line:#2f4266;
  --primary:#5b9bff;--primary-ink:#0b1730;--edge:#0a1224;--shadow:rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Segoe UI Rounded','Nunito',system-ui,sans-serif;font-size:16px;line-height:1.35;background-color:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.1}
p{margin:.3em 0}

.btn{appearance:none;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-bottom-width:5px;border-radius:16px;padding:9px 14px;font-weight:600;font-size:15px;transition:transform .08s,border-bottom-width .08s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--primary);color:var(--primary-ink)}
.btn.gold{background:var(--accent);color:#3a2a00}
.btn.ghost{background:transparent;border-color:var(--line);border-bottom-width:2px}
.btn.big{padding:13px 18px;font-size:17px;width:100%}
.btn.sm{padding:6px 10px;font-size:14px;border-bottom-width:4px;border-radius:12px}

#app{max-width:560px;margin:0 auto;padding:10px 12px 28px;display:flex;flex-direction:column;gap:10px}
#top{display:flex;align-items:center;gap:8px}
#top .who{flex:1;min-width:0}
#top .who b{font-size:22px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .who span{font-size:13px;color:var(--muted);font-weight:500}
.pill{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:4px 11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.iconbtn{width:42px;height:42px;padding:0;border-radius:14px;font-size:20px}
#bondbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:-4px}
#bondbar i{display:block;height:100%;width:0;background:var(--love);border-radius:99px;transition:width .5s}

.remind{display:flex;align-items:center;gap:10px;background:var(--accent);color:#3a2a00;border:2px solid var(--edge);border-bottom-width:4px;border-radius:14px;padding:8px 12px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.remind .ri{font-size:22px}.remind .rt{flex:1;line-height:1.2}.remind .rg{font-size:20px;opacity:.6}

#scene{position:relative;height:clamp(250px,43vh,370px);border-radius:22px;overflow:hidden;border:2px solid var(--edge);box-shadow:0 6px 0 var(--shadow);background:#9bd3f0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#scene.busy-touch{touch-action:none}
#bg,#fg{position:absolute;inset:0;pointer-events:none}
#bg svg,#fg svg{width:100%;height:100%;display:block}
.walkbg{position:absolute;inset:0;overflow:hidden}
.wl{position:absolute;left:0;right:0;background-repeat:repeat-x;animation:scroll linear infinite;--tw:600px}
.w1{bottom:26%;height:40%;background-size:600px 100%;animation-duration:46s}
.w2{bottom:12%;height:38%;background-size:600px 100%;animation-duration:22s}
.w3{bottom:0;height:24%;background-size:80px 100%;--tw:80px;animation-duration:1.6s}
@keyframes scroll{to{background-position-x:calc(var(--tw)*-1)}}
.dogwrap{position:absolute;bottom:3%;height:68%;aspect-ratio:340/250;left:var(--x,50%);transform:translateX(-50%);transition:left .8s ease-in-out;touch-action:none;cursor:pointer}
#scene[data-loc="bath"] .dogwrap{bottom:-3%}
.dogflip{width:100%;height:100%;transform:scaleX(var(--dir,1));transition:transform .2s}
.dogscale{width:100%;height:100%;transform:scale(var(--s,1));transform-origin:50% 100%}
.dogfx{width:100%;height:100%;position:relative;transform-origin:50% 100%}
#doghold{width:100%;height:100%}
.dog{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
.dog .tail{animation:wag 1.7s ease-in-out infinite}
.dog.mood-happy .tail,.dog.mood-love .tail{animation-duration:.45s}
.dog.mood-sad .tail{animation:none;transform:rotate(36deg)}
.dog .tailsit{animation-name:wag2}
.dog.mood-sad .tailsit{transform:none}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}
@keyframes wag2{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.dog .ear{animation:earflop 5s ease-in-out infinite}
@keyframes earflop{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-5deg)}97%{transform:rotate(3deg)}}
.dog .eye{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.dog .pawup{animation:pawwave 1s ease-in-out infinite}
@keyframes pawwave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
.dogwrap.walking .lg.lgA{animation:stepA .55s linear infinite}
.dogwrap.walking .lg.lgB{animation:stepB .55s linear infinite}
@keyframes stepA{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes stepB{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
.dogwrap.walking .dogfx{animation:bob .55s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.dogfx.jump{animation:jump .7s ease-out}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-22%)}60%{transform:translateY(0)}78%{transform:translateY(-8%)}100%{transform:translateY(0)}}
.dogfx.roll{animation:roll 1.3s ease-in-out}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.dogfx.dance{animation:dance .5s ease-in-out 6}
@keyframes dance{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-8%)}}
.dogfx.bark{animation:bark .35s ease-out 3}
@keyframes bark{0%,100%{transform:scale(1)}40%{transform:scale(1.06) translateY(-3%)}}
.dogfx.come{animation:come 1.6s ease-in-out}
@keyframes come{0%{transform:scale(1)}45%{transform:scale(1.28) translateY(6%)}100%{transform:scale(1)}}
.dogfx.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.dirt{position:absolute;width:15%;height:15%;border-radius:50%;background:radial-gradient(circle,#6b4a2b 0,#7a5734 55%,transparent 72%);transform:translate(-50%,-50%);pointer-events:none;transition:opacity .15s}
.mess{position:absolute;left:66%;bottom:8%;font-size:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}

#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.p{position:absolute;font-size:22px;animation:rise 1.4s ease-out forwards;will-change:transform,opacity}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-90px) scale(1.15)}}
.p.fall{animation-name:fall}
@keyframes fall{0%{opacity:0;transform:translate(0,-30px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),160px) rotate(360deg)}}
.ball{position:absolute;font-size:24px;z-index:3;pointer-events:none}

#bubble{position:absolute;left:58%;top:8%;background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:5px 11px;font-size:18px;font-weight:600;max-width:60%;box-shadow:0 3px 0 var(--shadow);animation:pop .3s ease-out;z-index:4}
#bubble::after{content:"";position:absolute;left:14px;bottom:-9px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--edge);border-bottom:2px solid var(--edge);transform:rotate(45deg)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#hint{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(20,30,55,.78);color:#fff;border-radius:14px;padding:7px 12px;font-size:14px;font-weight:500;text-align:center;z-index:4;pointer-events:none}
#dim{position:absolute;inset:0;background:rgba(10,18,50,.5);opacity:0;pointer-events:none;transition:opacity 1s;z-index:2}
#scene.sleeping #dim{opacity:1}
#zzz{position:absolute;left:44%;top:26%;font-size:26px;font-weight:700;color:#fff;z-index:3;pointer-events:none}
#zzz span{display:inline-block;animation:zz 2.4s ease-in-out infinite;opacity:0}
#zzz span:nth-child(2){animation-delay:.6s;font-size:20px}#zzz span:nth-child(3){animation-delay:1.2s;font-size:15px}
@keyframes zz{0%{opacity:0;transform:translate(0,8px)}40%{opacity:1}100%{opacity:0;transform:translate(12px,-14px)}}
.locs{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:5}
.locs button{padding:4px 10px;border-radius:99px;border:2px solid var(--edge);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;opacity:.92}
.locs button[aria-pressed="true"]{background:var(--accent);color:#3a2a00}
#hot{position:absolute;inset:0;z-index:3;pointer-events:none}
.pot{position:absolute;bottom:8%;transform:translateX(-50%);font-size:44px;background:none;border:0;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));padding:0;line-height:1}
.pot:active{transform:translateX(-50%) scale(.92)}
.pot .rev{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:26px}

#needs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.need{background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:5px 4px 7px;text-align:center;position:relative}
.need .ni{font-size:19px;line-height:1}
.need .nn{font-size:11px;color:var(--muted);font-weight:500;line-height:1.1}
.need .nb{height:7px;border-radius:99px;background:var(--line);margin:4px 6px 0;overflow:hidden}
.need .nb i{display:block;height:100%;border-radius:99px;transition:width .6s,background .6s}
.need.low{animation:needpulse 1.2s ease-in-out infinite}
@keyframes needpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.0)}50%{box-shadow:0 0 0 4px rgba(229,72,77,.35)}}

#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface2);padding:5px;border-radius:18px;border:2px solid var(--line)}
#tabs button{border:0;background:transparent;border-radius:13px;padding:7px 2px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button span{font-size:19px;line-height:1.1}
#tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--edge);border:2px solid var(--edge);padding:5px 0}
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{flex-direction:column;padding:10px 4px 8px;gap:2px;line-height:1.15;position:relative}
.tile .ti{font-size:27px;line-height:1.1}
.tile small{font-size:11px;font-weight:500;color:var(--muted);display:block}
.tile.alert::after{content:"!";position:absolute;top:-7px;right:-5px;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--edge)}
.panel{grid-column:1/-1;background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:9px}
.panel h3{font-size:19px}.panel .row{display:flex;gap:8px;flex-wrap:wrap}.panel .row .btn{flex:1;min-width:120px}
.panel .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border:2px solid var(--line);border-radius:99px;padding:2px 9px;font-size:13px;font-weight:600}
.chip.up{color:var(--good);border-color:var(--good)}.chip.down{color:var(--bad);border-color:var(--bad)}
.trickgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.trick{flex-direction:column;align-items:flex-start;text-align:left;gap:0;padding:9px 12px 8px}
.trick b{font-size:16px}.trick .st{color:#e3a008;letter-spacing:1px;font-size:14px}
.trick.locked{opacity:.55}
.bars{display:grid;gap:8px;grid-column:1/-1;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.bar{display:grid;grid-template-columns:110px 1fr 38px;gap:8px;align-items:center;font-size:14px;font-weight:500}
.bar .track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}.bar .track i{display:block;height:100%;background:var(--primary);border-radius:99px}

#overlay{position:fixed;inset:0;background:rgba(10,18,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;border:2px solid var(--edge);border-bottom:0;padding:16px 14px calc(22px + env(safe-area-inset-bottom,0px));animation:slideup .25s ease-out}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#sheet header h2{flex:1;font-size:23px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.card .ci{font-size:28px;width:38px;text-align:center}.card .cb{flex:1;min-width:0}.card .cb b{display:block}.card .cb small{color:var(--muted);font-size:13px;display:block;line-height:1.25}
.card.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.card.locked{opacity:.55}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}.prog i{display:block;height:100%;background:var(--good);border-radius:99px}
.h3{font-size:16px;font-weight:700;margin:14px 0 6px;color:var(--muted)}
.days{display:flex;gap:6px}.days div{flex:1;text-align:center;font-size:12px;color:var(--muted)}.days i{display:block;width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);margin-bottom:2px;font-style:normal;line-height:1.9;font-size:14px}
.days i.p{background:var(--good);border-color:var(--edge);color:#fff}.days i.o{background:var(--accent);border-color:var(--edge)}.days i.today{border-color:var(--primary);border-width:3px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.find{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;font-size:12px;line-height:1.15}
.find span{font-size:28px;display:block}.find.no{opacity:.4;filter:grayscale(1)}
.find em{font-style:normal;display:block;color:var(--muted);font-size:11px}
.diary p{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 8px}.diary p small{display:block;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.field label{font-weight:600;font-size:14px;color:var(--muted)}
input[type=text],textarea,select{background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:90px;font-size:12px;resize:vertical;word-break:break-all}
.seg{display:flex;gap:6px}.seg .btn{flex:1;padding:8px 4px;font-size:14px}.seg .btn[aria-pressed="true"]{background:var(--accent);color:#3a2a00}

#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:14px;font-weight:600;font-size:14px;max-width:420px;text-align:center;animation:toastin .25s ease-out,toastout .4s ease-in 3.2s forwards;box-shadow:0 4px 0 var(--shadow)}
.toast.good{background:var(--good);color:#fff}.toast.gold{background:var(--accent);color:#3a2a00}
@keyframes toastin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px)}}

#adopt{max-width:560px;margin:0 auto;padding:22px 14px 40px;display:flex;flex-direction:column;gap:16px}
#adopt .brand{font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
#adopt h1{font-size:clamp(34px,9vw,46px);letter-spacing:-.5px}
#adopt .lead{font-size:17px;color:var(--muted);max-width:32ch}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{appearance:none;cursor:pointer;background:var(--surface);border:2px solid var(--edge);border-bottom-width:6px;border-radius:20px;padding:6px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .1s}
.dcard .dv{height:96px;display:flex;justify-content:center}.dcard .dv svg{height:100%;width:auto;animation:none}
.dcard b{font-size:18px}.dcard .tr{font-size:13px;font-weight:600;color:var(--primary)}.dcard small{font-size:12px;color:var(--muted);line-height:1.25}
.dcard[aria-pressed="true"]{background:var(--accent);color:#3a2a00;transform:translateY(-3px)}
.dcard[aria-pressed="true"] small,.dcard[aria-pressed="true"] .tr{color:#3a2a00}
.namerow{display:flex;gap:8px}

@media (prefers-reduced-motion:reduce){
  .dog,.dog *,.wl,#zzz span,.need.low{animation:none!important}
  .dogfx.jump,.dogfx.roll,.dogfx.dance,.dogfx.bark,.dogfx.come,.dogfx.shake{animation-duration:.01s!important}
}
@media (min-width:600px){#actions{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<main id="adopt" hidden>
  <div class="brand">🐾 Pfotenglück</div>
  <div>
    <h1>Wer zieht bei dir ein?</h1>
    <p class="lead">Vier Welpen warten im Tierheim. Such dir einen aus, gib ihm einen Namen und werde sein bester Freund.</p>
  </div>
  <div id="cards" role="group" aria-label="Welpen zur Auswahl"></div>
  <div class="field">
    <label for="nameIn">Wie soll dein Hund heißen?</label>
    <div class="namerow">
      <input id="nameIn" type="text" maxlength="14" autocomplete="off" placeholder="Name eingeben">
      <button class="btn iconbtn" id="diceBtn" type="button" aria-label="Namen vorschlagen">🎲</button>
    </div>
  </div>
  <button class="btn pri big" id="adoptBtn" type="button" disabled>Adoptieren</button>
</main>

<div id="app" hidden>
  <header id="top">
    <div class="who"><b id="dogName"></b><span id="dogSub"></span></div>
    <div class="pill" title="Münzen">🪙 <b id="coins">0</b></div>
    <button class="btn iconbtn" id="menuBtn" data-act="menu" aria-label="Menü">☰</button>
  </header>
  <div id="bondbar" aria-hidden="true"><i></i></div>
  <button class="remind" id="remind" data-act="rem" hidden></button>

  <section id="scene" data-loc="home" aria-label="Spielszene">
    <div id="bg"></div>
    <div class="walkbg" id="walkbg" hidden><div class="wl w1"></div><div class="wl w2"></div><div class="wl w3"></div></div>
    <div class="dogwrap" id="dogwrap"><div class="dogflip" id="dogflip"><div class="dogscale" id="dogscale"><div class="dogfx" id="dogfx"><div id="doghold"></div><div id="dirts"></div></div></div></div></div>
    <div id="mess" class="mess" hidden>💦</div>
    <div id="fg"></div>
    <div id="hot"></div>
    <div id="fx"></div>
    <div id="bubble" hidden></div>
    <div id="hint" hidden></div>
    <div id="dim"></div>
    <div id="zzz" hidden><span>Z</span><span>z</span><span>z</span></div>
    <div class="locs" id="locs">
      <button type="button" data-act="loc" data-l="home" aria-pressed="true">🏠 Drinnen</button>
      <button type="button" data-act="loc" data-l="garden" aria-pressed="false">🌿 Garten</button>

<script>
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=p<0?0:255,t=Math.abs(p);
  r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function dogSVG(o){
  const uid=o.uid||'x',pose=o.pose||'stand',mood=o.mood||'ok';
  const coat=o.coat,far=shade(coat,-.22),belly=o.belly,paw=o.paw||belly;

  let torso,backFar='',backNear='',frontFar='',frontNear='',tail,headT,under='',over='';
  const clipId='cl'+uid;
  if(pose==='stand'||pose==='eat'||pose==='walk'){
    torso='M86 132C84 108 108 98 148 98C186 98 210 108 214 130C217 158 204 178 172 180L118 180C94 180 87 158 86 132Z';
    backFar=`<g class="lg lgA" style="transform-origin:120px 150px"><rect x="108" y="150" width="20" height="78" rx="10" fill="${far}"/>${P([118,222,14,6.5,shade(paw,-.18)])}</g>`;
    frontFar=`<g class="lg lgB" style="transform-origin:178px 150px"><rect x="166" y="150" width="20" height="78" rx="10" fill="${far}"/>${P([176,222,14,6.5,shade(paw,-.18)])}</g>`;
    backNear=`<g class="lg lgB" style="transform-origin:112px 152px"><ellipse cx="112" cy="158" rx="30" ry="32" fill="${coat}"/><rect x="99" y="172" width="22" height="56" rx="11" fill="${coat}"/>${P([110,222,16,7,paw])}</g>`;
    frontNear=`<g class="lg lgA" style="transform-origin:203px 150px"><rect x="192" y="150" width="22" height="78" rx="11" fill="${coat}"/>${P([204,222,15,7,paw])}</g>`;
    tail=`<g class="tail" style="transform-origin:90px 128px"><path d="M90 132C66 130 50 108 54 82C56 70 70 72 69 86C68 102 78 114 96 118Z" fill="${coat}"/><path d="M54 82C56 70 70 72 69 86C66 80 60 78 54 82Z" fill="${o.tip||belly}"/></g>`;
    const bx=pose==='eat'?'translate(16,60) rotate(34 204 116)':'';
    headT=bx;
  } else if(pose==='sit'||pose==='beg'||pose==='paw'){
    torso='M90 206C82 164 118 112 164 104C198 98 214 118 210 146C208 176 200 202 190 216L122 218C102 220 92 214 90 206Z';
    under=`<ellipse cx="120" cy="204" rx="40" ry="30" fill="${coat}" transform="rotate(-8 120 204)"/><rect x="118" y="212" width="50" height="16" rx="8" fill="${paw}"/>`;
    frontFar=`<rect x="172" y="150" width="20" height="78" rx="10" fill="${far}"/>${P([182,222,14,6.5,shade(paw,-.18)])}`;
    if(pose==='beg'){
      frontNear=`<path d="M198 152L238 126" stroke="${coat}" stroke-width="22" stroke-linecap="round"/><circle cx="240" cy="124" r="11" fill="${paw}"/>`;
      frontFar=`<path d="M184 154L222 134" stroke="${far}" stroke-width="20" stroke-linecap="round"/><circle cx="224" cy="132" r="10" fill="${shade(paw,-.15)}"/>`;
    } else if(pose==='paw'){
      frontNear=`<g class="pawup" style="transform-origin:200px 152px"><path d="M200 154L252 150" stroke="${coat}" stroke-width="21" stroke-linecap="round"/><circle cx="254" cy="150" r="11" fill="${paw}"/></g>`;
    } else {
      frontNear=`<rect x="192" y="150" width="22" height="78" rx="11" fill="${coat}"/>${P([204,222,15,7,paw])}`;
    }
    tail=`<g class="tail tailsit" style="transform-origin:96px 214px"><path d="M96 216C72 228 48 224 32 210C46 204 58 214 78 208Z" fill="${coat}"/></g>`;
    headT='translate(-6,-22) rotate(-4 204 116)';
  } else { // lie, sleep
    torso='M80 192C78 164 110 154 150 154C190 154 226 164 228 192C228 214 210 228 180 228L120 228C92 228 82 212 80 192Z';
    backNear=`<ellipse cx="114" cy="202" rx="36" ry="27" fill="${coat}"/><ellipse cx="146" cy="222" rx="20" ry="8" fill="${paw}"/>`;
    frontFar=`<rect x="176" y="206" width="84" height="22" rx="11" fill="${far}"/>${P([256,217,13,10,shade(paw,-.15)])}`;
    frontNear=`<rect x="170" y="212" width="84" height="22" rx="11" fill="${coat}" transform="translate(0,-4)"/>${P([252,219,14,10.5,paw])}`;
    tail=`<g class="tail tailsit" style="transform-origin:84px 214px"><path d="M84 216C62 228 42 226 28 214C42 208 56 216 74 208Z" fill="${coat}"/></g>`;
    headT=sleeping?'translate(6,80) rotate(26 204 116)':'translate(14,72) rotate(6 204 116)';
  }
  // patches
  let patch='';
  if(o.patchShape==='spots')patch=`<ellipse cx="128" cy="118" rx="34" ry="26" fill="${o.patch}"/><ellipse cx="184" cy="150" rx="16" ry="14" fill="${o.patch}"/>`;
  if(o.patchShape==='saddle')patch=`<path d="M100 96C130 84 190 86 214 110L214 146C190 132 150 130 96 150Z" fill="${o.patch}"/>`;
  const pcl=pose==='stand'||pose==='eat'||pose==='walk';
  const bellyShape=pcl?`<ellipse cx="150" cy="178" rx="52" ry="16" fill="${belly}"/>`:pose==='lie'||pose==='sleep'?`<ellipse cx="150" cy="222" rx="60" ry="10" fill="${belly}"/>`:`<ellipse cx="196" cy="196" rx="14" ry="34" fill="${belly}"/>`;
  const torsoSvg=`<clipPath id="${clipId}"><path d="${torso}"/></clipPath><path d="${torso}" fill="${coat}"/><g clip-path="url(#${clipId})">${patch}${bellyShape}</g>`;
  // eyes
  let eye;
  const ex=254,ey=86;
  if(sleeping||mood==='sleepy'&&false)eye=`<path d="M246 88Q254 94 262 88" stroke="${dark}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else if(mood==='happy'||mood==='love')eye=`<path d="M246 90Q254 79 262 90" stroke="${dark}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  else eye=`<g class="eye" style="transform-origin:${ex}px ${ey}px"><circle cx="${ex}" cy="${ey}" r="7.2" fill="${o.eyeCol||dark}"/><circle cx="${ex}" cy="${ey}" r="4.4" fill="#15121a"/><circle cx="${ex-2}" cy="${ey-2.5}" r="2.2" fill="#fff"/></g>`;
  const brow=mood==='sad'?`<path d="M245 76Q253 78 262 71" stroke="${dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`:mood==='alert'?`<path d="M246 73Q254 68 262 73" stroke="${dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`:'';
  const tongue=(mood==='happy'||mood==='love'||o.tongue)&&pose!=='eat'?`<path d="M282 121Q281 137 290 132Q292 124 288 118Z" fill="#f27b93"/>`:'';
  const ears=o.pointy
    ?`<g class="ear" style="transform-origin:232px 66px"><path d="M220 72L224 30L252 62Z" fill="${earC}"/><path d="M226 62L228 42L242 60Z" fill="#f3b7c0"/></g>`
    :`<g class="ear" style="transform-origin:226px 68px"><path d="M226 66C204 62 192 92 202 120C216 128 232 102 238 80Z" fill="${earC}"/></g>`;
  const mask=o.mask?`<path d="M240 100C250 84 262 84 268 92C276 96 296 100 296 108C296 122 276 126 262 124C246 122 240 112 240 100Z" fill="${o.mask}"/>`:'';
  const collar=o.collar?`<path d="M188 122Q214 142 242 128L240 140Q214 154 186 136Z" fill="${o.collar}"/><circle cx="215" cy="150" r="5.2" fill="#f4c542" stroke="#c99a1a" stroke-width="1"/>`:'';
  const headSvg=`<g transform="${headT}"><g transform="translate(232 100) scale(${hs}) translate(-232 -100)">
    <path d="M186 112C196 92 214 84 232 86L240 134C226 148 200 148 190 134Z" fill="${headC}"/>${collar}
    <circle cx="240" cy="92" r="33" fill="${headC}"/>
    ${mask}
    <ellipse cx="272" cy="106" rx="26" ry="17" fill="${snout}"/>
    <ellipse cx="295" cy="99" rx="8.6" ry="6.6" fill="#1d1a22"/><ellipse cx="292" cy="96.6" rx="2.6" ry="1.6" fill="#fff" opacity=".55"/>
    <path d="M272 117Q283 124 293 114" stroke="${dark}" stroke-width="2.6" fill="none" stroke-linecap="round"/>${tongue}
    ${ears}${eye}${brow}
  </g></g>`;
  const bowl=o.bowl?`<g><ellipse cx="300" cy="226" rx="26" ry="6" fill="rgba(0,0,0,.18)"/><path d="M276 208H324L318 226H282Z" fill="${o.bowl==='water'?'#5b8fd6':'#d9534f'}"/><ellipse cx="300" cy="208" rx="24" ry="5" fill="${o.bowl==='water'?'#9fd0ff':'#7a4a2a'}"/></g>`:'';
  const sh=`<ellipse cx="${pose==='lie'||pose==='sleep'?150:155}" cy="230" rx="${pose==='lie'||pose==='sleep'?122:104}" ry="8" fill="rgba(20,20,40,.2)"/>`;

/* ---------- Zustand ---------- */
let S=null;
const V={tab:'care',loc:'home',mode:null,pose:null,bowl:null,mood:null,panel:null,idle:'stand',busy:false,dogKey:'',remAct:null,stroke:null,lastBubble:0};

function newDaily(){
  return {date:dayKey(),cnt:{feed:0,water:0,walk:0,pet:0,play:0,train:0,bath:0,vet:0,treatN:0,petBond:0},paid:{},wish:null,wishDone:false,perfect:false,seen:false};
}
function newGame(type,name){
  const now=Date.now();
  const s={v:1,dog:{type,name,born:now,bornKey:dayKey()},
    needs:{hunger:70,thirst:70,energy:85,clean:85,fun:60,love:40,bladder:65},health:100,bond:0,growth:0,coins:30,
    inv:{wet:0,treats:5},owned:{ball:true},collar:'#e4572e',skills:{},leash:5,house:5,finds:{},diary:[],ach:{},
    daily:newDaily(),streak:0,best:0,hist:{},lastTick:now,sleeping:false,mess:false,
    lastBath:dayKey(),lastVet:dayKey(),stats:{pet:0,walks:0,baths:0,catches:0,tricks:0,meals:0,sniff:0,days:1},
    settings:{sound:false,speed:1,theme:'auto'},away:null};
  s.daily.wish=pickWish(s);
  return s;
}
function pickWish(s){
  const lv=bondLevelOf(s.bond);
  const list=WISHES.filter(w=>!w.lv||w.lv<=lv);
  return pick(list).id;
}
function deepFill(t,d){
  for(const k in d){
    if(t[k]===undefined)t[k]=JSON.parse(JSON.stringify(d[k]));
    else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))deepFill(t[k],d[k]);
  }
  return t;
}
function save(){
  if(!S)return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}
}
function loadSave(){
  try{
    const r=localStorage.getItem(SAVE_KEY);
    if(!r)return null;
    const o=JSON.parse(r);
    if(!o||!o.dog||!o.needs)return null;
    return deepFill(o,newGame(o.dog.type||0,o.dog.name||'Hund'));
  }catch(e){return null;}
}

/* ---------- Hilfsfunktionen zum Spielstand ---------- */
const N=()=>esc(S.dog.name);
const mod=()=>BREEDS[S.dog.type].mod||{};
const perk=id=>!!S.owned[id];
const speed=()=>S.settings.speed||1;
function bondLevelOf(b){let l=1;for(let i=0;i<BOND.length;i++)if(b>=BOND[i])l=i+1;return l;}
const bondLevel=()=>bondLevelOf(S.bond);
function stageIdx(){let k=0;for(let i=0;i<STAGES.length;i++)if(S.growth>=STAGES[i].min)k=i;return k;}
const growthFrac=()=>Math.min(1,S.growth/STAGES[2].min);
const TR=id=>TRICKS.find(t=>t.id===id);
function stars(id){const xp=S.skills[id]||0;return XPSTEPS.filter(x=>xp>=x).length;}
function daysTogether(){return Math.max(1,daysBetween(S.dog.bornKey,dayKey())+1);}
function tod(){
  const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  if(h<5.5||h>=21)return 'night';if(h<8)return 'dawn';if(h<17.5)return 'day';return 'dusk';
}
function moodScore(){
  const n=S.needs;let sc=(n.hunger+n.thirst+n.energy+n.clean+n.fun+n.love+n.bladder)/7;
  if(S.mess)sc-=8;if(S.health<30)sc-=15;return sc;
}
function moodName(){const m=moodScore();return m>=80?'Überglücklich':m>=62?'Glücklich':m>=42?'Zufrieden':m>=28?'Bedrückt':'Traurig';}
function moodKey(){
  if(V.mood)return V.mood;
  const m=moodScore();return m>=76?'happy':m<38?'sad':'ok';
}
const wishObj=()=>WISHES.find(w=>w.id===S.daily.wish)||WISHES[0];

/* ---------- Ton ---------- */
let AC=null;
function tone(f,d,type,v,when){
  if(!S||!S.settings.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);
  }catch(e){}
}
function sfx(k){
  if(k==='bark'){tone(320,.09,'square',.04);tone(230,.13,'square',.04,.11);}
  else if(k==='chime'){[660,880,1180].forEach((f,i)=>tone(f,.22,'sine',.05,i*.1));}
  else if(k==='coin'){tone(988,.08,'triangle',.05);tone(1319,.14,'triangle',.05,.07);}
  else if(k==='pop'){tone(520,.06,'sine',.05);}
}

/* ---------- Rückmeldung ---------- */
function toast(msg,kind){
  const box=$('#toasts');if(!box)return;
  while(box.children.length>=3)box.removeChild(box.firstChild);
  const d=document.createElement('div');d.className='toast'+(kind?' '+kind:'');d.textContent=msg;box.appendChild(d);
  setTimeout(()=>d.remove(),3700*(window.__ts||1)+50);
}
function fx(emoji,n,opts){
  const layer=$('#fx');if(!layer)return;opts=opts||{};
  const r=layer.getBoundingClientRect();
  for(let i=0;i<(n||5);i++){
    const s=document.createElement('span');s.className='p'+(opts.fall?' fall':'');s.textContent=Array.isArray(emoji)?pick(emoji):emoji;
    const cx=opts.x!=null?opts.x:50,cy=opts.y!=null?opts.y:50,sp=opts.spread!=null?opts.spread:14;
    s.style.left=(cx+rnd(-sp,sp))+'%';s.style.top=(cy+rnd(-sp/2,sp/2))+'%';
    s.style.setProperty('--dx',rnd(-30,30)+'px');s.style.animationDelay=(i*.07)+'s';
    layer.appendChild(s);setTimeout(()=>s.remove(),1900*(window.__ts||1)+100);
  }
}
function celebrate(){fx(['🎉','✨','⭐','💖'],22,{x:50,y:35,spread:42});sfx('chime');}
function say(txt,ms){
  const b=$('#bubble');if(!b)return;b.hidden=false;b.innerHTML=txt;V.lastBubble=Date.now();
  clearTimeout(say.t);say.t=setTimeout(()=>{b.hidden=true;},(ms||2600)*(window.__ts||1));
}
function dogAnim(cls,ms){
  const f=$('#dogfx');if(!f)return;f.classList.remove('jump','roll','dance','bark','come','shake');void f.offsetWidth;f.classList.add(cls);
  setTimeout(()=>f.classList.remove(cls),(ms||1400)*(window.__ts||1));
}
function diary(txt){
  S.diary.unshift({k:dayKey(),d:daysTogether(),t:txt});if(S.diary.length>70)S.diary.length=70;
}
function addCoins(n){S.coins=Math.max(0,S.coins+n);if(n>0)sfx('coin');}

/* ---------- Kern: Bindung, Wachstum, Aufgaben ---------- */
function addBond(x){
  if(!x)return;const old=bondLevel();S.bond=Math.max(0,S.bond+x);const nl=bondLevel();
  if(nl>old){
    const unl=TRICKS.filter(t=>t.lv===nl).map(t=>t.n).concat(PLACES.filter(p=>p.lv===nl).map(p=>p.n));
    toast(`💞 Bindung: ${BONDN[nl-1]}!${unl.length?' Neu: '+unl.join(', '):''}`,'gold');
    diary(`Unsere Bindung ist jetzt „${BONDN[nl-1]}“.`);addCoins(15*nl);celebrate();dogAnim('jump',800);
  }
}
function addGrowth(x){
  const old=stageIdx();S.growth+=x;const n=stageIdx();
  if(n>old){
    toast(`🐕 ${S.dog.name} ist jetzt: ${STAGES[n].n}!`,'gold');diary(`${S.dog.name} ist gewachsen: ${STAGES[n].n}.`);celebrate();
  }
}
function tasks(){
  const c=S.daily.cnt,w=wishObj();const T=[
    {id:'feed',core:1,i:'🍖',t:'Füttern',need:2,have:c.feed,act:'food'},
    {id:'water',core:1,i:'💧',t:'Frisches Wasser',need:1,have:c.water,act:'water'},
    {id:'walk',core:1,i:'🌳',t:'Gassi gehen',need:1,have:c.walk,act:'walk'},
    {id:'pet',core:1,i:'💗',t:'Kuscheln (streicheln)',need:8,have:c.pet,act:'cuddle'},
    {id:'play',i:'🎾',t:'Zusammen spielen',need:2,have:c.play,act:'ball'},
    {id:'train',i:'🎓',t:'Ein Kommando üben',need:2,have:c.train,act:'learn'}
  ];
  if(daysSince(S.lastBath)>=3)T.push({id:'bath',i:'🛁',t:'Waschen',need:1,have:c.bath,act:'wash'});
  if(daysSince(S.lastVet)>=7)T.push({id:'vet',i:'🩺',t:'Tierarzt-Check',need:1,have:c.vet,act:'vet'});
  T.push({id:'wish',i:w.i,t:w.t(S.dog.name),need:1,have:S.daily.wishDone?1:0,wish:1,act:'none'});
  return T;
}
function checkTasks(){
  const T=tasks();
  T.forEach(t=>{
    if(t.have>=t.need&&!S.daily.paid[t.id]){
      S.daily.paid[t.id]=1;const c=t.core?5:t.wish?8:4;addCoins(c);
      toast(`${t.i} ${t.wish?'Wunsch erfüllt':t.t+' erledigt'}  +${c} 🪙`,'good');
    }
  });
  const core=T.filter(t=>t.core);
  if(core.every(t=>t.have>=t.need)&&!S.daily.perfect){
    S.daily.perfect=true;S.streak++;S.best=Math.max(S.best,S.streak);addCoins(20);addBond(5);
    toast(`🌟 Perfekter Tag! Serie: ${S.streak} · +20 🪙`,'gold');diary(`Perfekter Tag mit ${S.dog.name}! Serie: ${S.streak}.`);celebrate();
  }
}
function track(type,data){
  data=data||{};const c=S.daily.cnt;
  if(type==='feed'){c.feed++;S.stats.meals++;}
  else if(type==='water')c.water++;
  else if(type==='walk'){c.walk++;S.stats.walks++;}
  else if(type==='pet'){c.pet++;S.stats.pet++;}
  else if(type==='play')c.play++;
  else if(type==='train'){c.train++;S.stats.tricks++;}
  else if(type==='bath'){c.bath++;S.stats.baths++;S.lastBath=dayKey();}
  else if(type==='vet'){c.vet++;S.lastVet=dayKey();}
  const w=wishObj();
  if(!S.daily.wishDone&&w.test(type,data)){
    S.daily.wishDone=true;addBond(2);fx('💖',7,{x:55,y:30});diary(`${S.dog.name}s Wunsch ging in Erfüllung.`);
  }
  checkTasks();checkAch();
}
function checkAch(){
  ACH.forEach(a=>{
    if(!S.ach[a.id]&&a.t(S)){
      S.ach[a.id]=dayKey();if(a.id!=='home'){addCoins(10);toast(`${a.i} Erfolg: ${a.n}  +10 🪙`,'gold');diary(`Erfolg freigeschaltet: ${a.n}.`);sfx('chime');}
    }
  });
}

/* ---------- Zeit, Bedürfnisse ---------- */
function decay(dm){
  const n=S.needs,m=mod(),sl=S.sleeping,f=sl?.35:1;
  n.hunger-=NEEDS.hunger.r*dm*f*(m.hunger||1);
  n.thirst-=NEEDS.thirst.r*dm*f;
  if(sl)n.energy+=.62*dm*(perk('house')?1.15:1);else n.energy-=NEEDS.energy.r*dm;
  n.clean-=NEEDS.clean.r*dm*(sl?.2:1)*(S.mess?2:1);
  n.fun-=NEEDS.fun.r*dm*f*(m.fun||1)*(perk('chew')?.8:1);
  n.love-=NEEDS.love.r*dm*f*(m.love||1);
  n.bladder-=NEEDS.bladder.r*dm*f;
  for(const k in n)n[k]=clamp(n[k]);
  const low=n.hunger<8||n.thirst<8||n.energy<6||n.clean<6;
  const avg=(n.hunger+n.thirst+n.energy+n.clean+n.fun+n.love+n.bladder)/7;
  if(low)S.health=clamp(S.health-.25*dm,5,100);else if(avg>45)S.health=clamp(S.health+.12*dm,5,100);
  if(avg>50)S.growth+=.05*dm;else S.growth+=.015*dm;
  if(S.sleeping&&n.energy>=99){wake(true);}
  if(n.bladder<=0&&!S.sleeping){
    const p=Math.max(.1,.9-S.house/100);
    if(Math.random()<p){S.mess=true;n.bladder=68;toast('Ups! Ein Malheur auf dem Boden. Wisch es auf und geh öfter Gassi.');say('😳');}
    else{n.bladder=5;n.love=clamp(n.love-3);say('🚪 Ich muss dringend!');}
  }
}
function offline(dtMin){
  const capped=Math.min(dtMin,600),before=Object.assign({},S.needs);
  const wasSleep=S.sleeping;decay(capped*.6*speed());
  for(const k in before)if(k!=='energy'||!wasSleep)S.needs[k]=Math.max(S.needs[k],Math.min(before[k],18));
  S.health=Math.max(S.health,Math.min(70,S.health));
}
function dayCheck(){
  const k=dayKey();if(S.daily.date===k)return false;
  const prev=S.daily,gap=daysBetween(prev.date,k);
  S.hist[prev.date]=prev.perfect?'p':'o';
  const keys=Object.keys(S.hist).sort();while(keys.length>30)delete S.hist[keys.shift()];
  if(!(gap===1&&prev.perfect))S.streak=0;
  if(gap>=2){
    const loss=Math.min(10,gap*2);S.bond=Math.max(0,S.bond-loss);
    S.away={days:gap};
  }
  S.daily=newDaily();S.daily.wish=pickWish(S);S.stats.days=daysTogether();
  [3,7,14,30,50,100,200,365].forEach(d=>{if(S.stats.days===d){addCoins(d>=30?50:20);diary(`Wir sind schon ${d} Tage zusammen!`);toast(`🎂 ${d} Tage zusammen! Geschenk: ${d>=30?50:20} 🪙`,'gold');}});
  return true;
}

/* ---------- Hund zeichnen ---------- */
function poseNow(){
  if(S.sleeping)return 'sleep';
  if(V.pose)return V.pose;
  if(V.mode==='walk')return 'walk';
  if(V.mode==='bath')return 'sit';
  if(S.needs.energy<20)return 'lie';
  return V.idle;
}
function renderDogNow(force){
  const b=BREEDS[S.dog.type],pose=poseNow();
  const frac=growthFrac(),pup=1-frac,mood=S.sleeping?'ok':moodKey();
  const bucket=Math.round(frac*40);
  const key=[pose,mood,V.bowl,S.collar,bucket,S.dog.type,V.mode==='walk'?'L':''].join('|');
  if(key===V.dogKey&&!force)return;V.dogKey=key;
  const look=Object.assign({},b.look,{collar:S.collar,pose:pose,mood:mood,pup:pup,uid:'g',bowl:V.bowl,leash:V.mode==='walk'});
  $('#doghold').innerHTML=dogSVG(look);

async function withPose(pose,ms,opt){
  opt=opt||{};V.pose=pose;V.bowl=opt.bowl||null;V.mood=opt.mood||null;renderDogNow();
  await sleep(ms);
  if(V.pose===pose){V.pose=null;V.bowl=null;V.mood=null;renderDogNow();}

/* ---------- Erinnerungen ---------- */
function nextReminder(){
  if(S.sleeping||V.mode)return null;
  const n=S.needs,c=S.daily.cnt,h=new Date().getHours(),name=S.dog.name;
  if(S.mess)return {i:'💦',t:'Ups! Da war ein Malheur – wisch es auf.',a:'mop'};
  if(S.health<30)return {i:'🤒',t:`${name} fühlt sich krank. Ab zum Tierarzt!`,a:'vet'};
  if(n.hunger<28)return {i:'🍖',t:`${name} hat Hunger!`,a:'food'};
  if(n.thirst<28)return {i:'💧',t:`${name} hat Durst.`,a:'water'};
  if(n.bladder<22)return {i:'🌳',t:`${name} muss dringend raus!`,a:'walk'};
  if(n.energy<18)return {i:'💤',t:`${name} ist todmüde.`,a:'sleep'};
  if(n.clean<22)return {i:'🫧',t:`${name} riecht streng. Zeit fürs Bad!`,a:'wash'};
  if(c.feed===0&&h>=6&&h<12)return {i:'🍖',t:'Zeit fürs Frühstück!',a:'food'};
  if(c.feed===0&&h>=12)return {i:'🍖',t:`${name} wartet noch auf sein erstes Essen.`,a:'food'};
  if(c.walk===0&&h>=15)return {i:'🌳',t:'Zeit für den Spaziergang!',a:'walk'};
  if(c.feed<2&&h>=17)return {i:'🍖',t:'Abendessen ist fällig.',a:'food'};
  if(c.water===0&&h>=9)return {i:'💧',t:'Frisches Wasser hinstellen.',a:'water'};
  if(n.fun<25)return {i:'🎾',t:`${name} langweilt sich. Spielt was zusammen!`,a:'ball'};
  if(n.love<25)return {i:'💗',t:`${name} braucht Streicheleinheiten.`,a:'cuddle'};
  if(c.pet<8&&h>=19)return {i:'💗',t:'Noch ein bisschen Kuscheln vor dem Schlafen?',a:'cuddle'};

}

/* ---------- Aktionen ---------- */
function guardSleep(){if(S.sleeping){toast(`Psst … ${S.dog.name} schläft.`);return true;}return false;}
function guardBusy(){if(V.mode){toast('Erst die aktuelle Aktivität beenden.');return true;}return false;}
function goHome(){
  V.mode=null;V.panel=null;V.pose=null;V.walking=false;V.bowl=null;V.mood=null;W=null;T=null;SN=null;
  $('#hot').innerHTML='';$('#dirts').innerHTML='';$('#hint').hidden=true;
  setLoc(V.loc==='walk'||V.loc==='bath'?'home':V.loc);renderActions();
}

async function doFeed(kind){
  closeSheet();if(guardSleep()||guardBusy())return;
  const n=S.needs,m=mod();
  if(kind==='treat'){
    if(S.inv.treats<1){toast('Keine Leckerli mehr. Im Laden gibt es Nachschub.');return;}
    S.inv.treats--;S.daily.cnt.treatN++;
    n.hunger=clamp(n.hunger+7);n.fun=clamp(n.fun+8*(m.treat||1));n.love=clamp(n.love+4);addBond(.4*(m.treat||1));
    if(S.daily.cnt.treatN>6){S.health=clamp(S.health-8,5,100);n.fun=clamp(n.fun-5);toast('Zu viele Leckerli … ihr Bauch zwickt.');}
    fx('🦴',4,{x:52,y:40});track('treat');
    await withPose('sit',1400,{mood:'happy'});renderActions();return;
  }
  if(n.hunger>=88){toast(`${S.dog.name} ist noch satt.`);say('😋 Bin satt');return;}
  if(kind==='wet'){
    if(S.inv.wet<1){toast('Keine Dosen mehr. Im Laden gibt es Nachschub.');return;}
    S.inv.wet--;n.hunger=clamp(n.hunger+58);n.fun=clamp(n.fun+8);addBond(.5);
  }else{n.hunger=clamp(n.hunger+42);n.thirst=clamp(n.thirst-4);addBond(.3);}
  n.bladder=clamp(n.bladder-6);
  fx('🍗',5,{x:70,y:70,fall:true});addGrowth(1);track('feed');
  await withPose('eat',2400,{bowl:'food'});renderActions();
}
async function doWater(){
  if(guardSleep()||guardBusy())return;
  const n=S.needs;
  if(n.thirst>=88){toast(`${S.dog.name} hat gerade keinen Durst.`);return;}
  n.thirst=clamp(n.thirst+70);n.bladder=clamp(n.bladder-8);addBond(.2);
  fx('💧',5,{x:72,y:68});track('water');
  await withPose('eat',2200,{bowl:'water'});renderActions();
}
function doMop(){
  if(!S.mess)return;S.mess=false;S.needs.clean=clamp(S.needs.clean+5);
  toast('Sauber! Ohne Schimpfen – so lernt '+S.dog.name+' schneller.');fx('🫧',6,{x:70,y:78});renderActions();
}
async function doSleep(){
  if(guardBusy())return;
  if(S.needs.energy>88){toast(`${S.dog.name} ist gar nicht müde.`);return;}
  if(V.loc==='garden')setLoc('home');
  S.sleeping=true;V.pose=null;setDogX(26,1);renderDogNow(true);track('sleep');
  toast('Schlaf gut! 💤');renderActions();
}
function wake(auto){
  if(!S.sleeping)return;S.sleeping=false;setDogX(50,1);renderDogNow(true);
  if(auto)toast(`${S.dog.name} ist ausgeschlafen!`,'good');
  renderActions();
}
async function doVet(){
  if(guardSleep()||guardBusy())return;
  const cost=S.coins>=10?10:0;
  addCoins(-cost);const sick=S.health<60;
  S.health=100;track('vet');addBond(sick?1:.5);
  toast(cost?`Check-up erledigt (−10 🪙). ${S.dog.name} ist gesund!`:'Die Tierärztin verzichtet auf die Gebühr. Alles gut!','good');
  fx('💊',4,{x:55,y:40});dogAnim('shake',1000);renderActions();
}
async function doGarden(){
  if(guardSleep()||guardBusy())return;
  setLoc('garden');
  if(S.needs.bladder>72){toast(`${S.dog.name} muss gerade nicht.`);return;}
  S.needs.bladder=100;S.house=clamp(S.house+2.5);addBond(.2);
  setDogX(28,-1);V.walking=true;renderDogNow(true);await sleep(900);V.walking=false;renderDogNow(true);
  fx('🌿',4,{x:30,y:70});toast('Brav! Das Geschäft ist draußen erledigt.','good');
}
function doCuddle(){
  if(guardSleep()||guardBusy())return;setLoc('home');
  V.pose=null;V.cuddle=Date.now();say('💗',1800);
  showHint(`Streichle ${esc(S.dog.name)} mit dem Finger über den Körper.`,5200);
  renderDogNow();
}
function showHint(t,ms){
  const h=$('#hint');h.innerHTML=t;h.hidden=false;clearTimeout(showHint.t);
  if(ms)showHint.t=setTimeout(()=>{h.hidden=true;},ms*(window.__ts||1));
}
function petChunk(){
  if(!S||S.sleeping)return;
  const n=S.needs,lv=bondLevel(),m=mod(),c=S.daily.cnt;
  let gain=1.6*(perk('cushion')?1.25:1)*(m.cuddle||1)*(lv<2?.6:1);
  if(n.love>=99){gain=0;if(Math.random()<.15)say('😌 Genug … oder doch nicht?');}
  n.love=clamp(n.love+gain);
  if(c.petBond<8){const b=.12*(m.cuddle||1);c.petBond+=b;addBond(b);}
  fx(['💗','💕'],1,{x:52+rnd(-10,10),y:32,spread:10});
  V.mood='love';renderDogNow();clearTimeout(petChunk.t);petChunk.t=setTimeout(()=>{V.mood=null;renderDogNow();},900*(window.__ts||1));
  if(lv===1&&Math.random()<.12)say('😳 …');
  track('pet');
}
/* Streicheln per Zeigerbewegung */
function initPet(){
  const w=$('#dogwrap');
  w.addEventListener('pointerdown',e=>{
    if(V.mode&&V.mode!=='pet'&&V.mode!=='train')return;
    V.stroke={x:e.clientX,y:e.clientY,acc:0};
    if(!V.mode){petChunk();}
    try{w.setPointerCapture(e.pointerId);}catch(_){}
  });
  w.addEventListener('pointermove',e=>{
    const s=V.stroke;if(!s)return;
    s.acc+=Math.hypot(e.clientX-s.x,e.clientY-s.y);s.x=e.clientX;s.y=e.clientY;
    if(V.mode==='bath'){scrub(e);return;}
    if(s.acc>55&&!V.mode){s.acc=0;petChunk();}
  });
  const end=()=>{V.stroke=null;};
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
}

/* ---------- Waschen ---------- */
function doWash(){
  if(guardSleep()||guardBusy())return;
  if(S.needs.clean>85){toast(`${S.dog.name} ist schon blitzsauber.`);return;}
  V.mode='bath';setLoc('bath');V.pose='sit';renderDogNow(true);
  const cnt=clamp(Math.round((100-S.needs.clean)/12)+3,4,9),box=$('#dirts');box.innerHTML='';
  for(let i=0;i<cnt;i++){
    const d=document.createElement('span');d.className='dirt';
    d.style.left=(30+Math.random()*32)+'%';d.style.top=(46+Math.random()*32)+'%';d.dataset.hp='3';
    box.appendChild(d);
  }
  showHint('Rubbel mit dem Finger über die Schmutzflecken.');
  V.panel=()=>`<div class="panel"><h3>🛁 Badezeit</h3><p>Schrubbe alle Flecken weg. Noch <b id="dirtLeft">${$('#dirts').children.length}</b> übrig.</p><button class="btn ghost" data-act="cancelmode">Abbrechen</button></div>`;
  renderActions();
}
let scrubT=0;
function scrub(e){
  if(V.mode!=='bath')return;
  const now=Date.now();if(now-scrubT<70)return;scrubT=now;
  document.querySelectorAll('#dirts .dirt').forEach(d=>{
    const r=d.getBoundingClientRect(),pad=14;
    if(e.clientX>r.left-pad&&e.clientX<r.right+pad&&e.clientY>r.top-pad&&e.clientY<r.bottom+pad){
      const hp=Number(d.dataset.hp)-1;d.dataset.hp=hp;d.style.opacity=hp/3;
      fx('🫧',1,{x:((r.left+r.width/2)-$('#fx').getBoundingClientRect().left)/$('#fx').clientWidth*100,y:45,spread:3});
      if(hp<=0)d.remove();

  });

}
function closeSheet(){$('#overlay').hidden=true;}
function cardBtn(act,data,i,title,sub,extra){
  return `<button class="card btn" data-act="${act}" ${data||''} ${extra||''} style="text-align:left;border-bottom-width:4px;border-radius:16px;font-weight:500"><div class="ci">${i}</div><div class="cb"><b>${title}</b><small>${sub}</small></div></button>`;
}
function openMenu(){
  const items=[['today','📋','Heute','Aufgaben, Serie und Wunsch'],['shop','🛍️','Laden','Futter, Spielzeug, Deko'],['album','🔎','Album','Gesammelte Fundstücke'],['diary','📖','Tagebuch',`Erinnerungen an ${esc(S.dog.name)}`],['ach','🏆','Erfolge','Abzeichen sammeln'],['profile','🐶','Steckbrief','Alter, Bindung, Wachstum'],['settings','⚙️','Einstellungen','Ton, Tempo, Speichern'],['help','❓','Hilfe','So geht’s']];
  openSheet('Menü','<div class="list">'+items.map(x=>cardBtn(x[0],'',x[1],x[2],x[3])).join('')+'</div>');
}
function openFood(){
  if(guardSleep())return;
  const inv=S.inv;
  const h='<div class="list">'+
    cardBtn('feed','data-k="dry"','🥣','Trockenfutter','Immer da. Macht satt, aber durstig.')+
    cardBtn('feed','data-k="wet"','🥫',`Nassfutter (${inv.wet})`,'Sehr lecker: macht satter und froher.',inv.wet<1?'disabled':'')+
    cardBtn('feed','data-k="treat"','🦴',`Leckerli (${inv.treats})`,'Nur ein kleiner Snack. Nicht zu viele am Tag!',inv.treats<1?'disabled':'')+'</div>';
  openSheet('Was gibt es zu fressen?',h);
}
function todayHtml(){
  const T=tasks(),core=T.filter(t=>t.core),bonus=T.filter(t=>!t.core&&!t.wish),wish=T.find(t=>t.wish);
  const row=t=>{
    const pct=clamp(t.have/t.need*100),done=t.have>=t.need;
    return `<div class="card${done?' done':''}"><div class="ci">${done?'✅':t.i}</div><div class="cb"><b>${esc(t.t)}</b><small>${Math.min(t.have,t.need)} / ${t.need}${done?' · erledigt':''}</small><div class="prog"><i style="width:${pct}%"></i></div></div></div>`;
  };
  const today=dayKey();let days='';
  for(let i=6;i>=0;i--){
    const k=addDays(today,-i),st=k===today?(S.daily.perfect?'p':''):(S.hist[k]||'');
    days+=`<div><i class="${st}${k===today?' today':''}">${st==='p'?'✓':''}</i>${['So','Mo','Di','Mi','Do','Fr','Sa'][dateOf(k).getDay()]}</div>`;
  }
  return `<p><b>🔥 Serie: ${S.streak} ${S.streak===1?'Tag':'Tage'}</b> · Rekord: ${S.best}</p><div class="days">${days}</div>
  <div class="h3">Das Wichtigste heute</div><div class="list">${core.map(row).join('')}</div>
  <div class="h3">Extras</div><div class="list">${bonus.map(row).join('')}</div>
  <div class="h3">Wunsch des Tages</div><div class="list">${row(wish)}</div>
  <p style="color:var(--muted);font-size:13px;margin-top:12px">Schaffst du die vier wichtigen Aufgaben, wird der Tag perfekt: Serie +1, 20 🪙 und ein Bindungs-Bonus.</p>`;
}
function showMorning(first){
  const t=tod(),g=t==='night'?'Gute Nacht':t==='dawn'?'Guten Morgen':t==='day'?'Guten Tag':'Guten Abend';
  let pre='';
  if(S.away){pre=`<p>😢 ${N()} hat dich ${S.away.days} Tage vermisst. Die Bindung ist etwas gesunken – zeig, dass du wieder da bist!</p>`;S.away=null;}
  S.daily.seen=true;
  const intro=first?`<p>${N()} ist eingezogen! Damit es ${N()} gut geht, gibt es jeden Tag ein paar wichtige Aufgaben:</p>`:`<p>${g}! Das braucht ${N()} heute von dir:</p>`;
  openSheet(first?'Willkommen zuhause!':`${g}!`,pre+intro+todayHtml()+`<button class="btn pri big" data-act="close" style="margin-top:12px">Los geht’s</button>`);
  if(bondLevel()>=3){dogAnim('jump',800);fx('💗',5,{x:52,y:30});sfx('bark');}
}
function showToday(){openSheet('Heute',todayHtml());}
function openShop(keep){
  const sc=keep?$('#sheet').scrollTop:0;
  const cats={};SHOP.forEach(i=>{(cats[i.c]=cats[i.c]||[]).push(i);});
  let h=`<p><b>🪙 ${S.coins} Münzen</b></p>`;
  for(const c in cats){
    h+=`<div class="h3">${c}</div><div class="list">`;
    if(c==='Halsbänder')h+=`<div class="card"><div class="ci">🔴</div><div class="cb"><b>Halsband Rot</b><small>Gehört schon dazu</small></div><button class="btn sm" data-act="equip" data-c="#e4572e" ${S.collar==='#e4572e'?'disabled':''}>${S.collar==='#e4572e'?'Getragen':'Anlegen'}</button></div>`;
    cats[c].forEach(it=>{
      const own=S.owned[it.id]&&!it.give,afford=S.coins>=it.p;let btn;
      if(it.collar)btn=own?`<button class="btn sm" data-act="equip" data-c="${it.collar}" ${S.collar===it.collar?'disabled':''}>${S.collar===it.collar?'Getragen':'Anlegen'}</button>`:`<button class="btn sm gold" data-act="buy" data-id="${it.id}" ${afford?'':'disabled'}>${it.p} 🪙</button>`;
      else btn=own?`<span class="chip up">Gekauft</span>`:`<button class="btn sm gold" data-act="buy" data-id="${it.id}" ${afford?'':'disabled'}>${it.p} 🪙</button>`;
      h+=`<div class="card"><div class="ci">${it.i}</div><div class="cb"><b>${it.n}</b><small>${it.d||'Ein neues Halsband für '+esc(S.dog.name)}</small></div>${btn}</div>`;
    });
    h+='</div>';
  }
  openSheet('Laden',h);if(keep)$('#sheet').scrollTop=sc;
}
function buy(id){
  const it=SHOP.find(x=>x.id===id);if(!it||S.coins<it.p)return;
  if(!it.give&&S.owned[id])return;
  addCoins(-it.p);
  if(it.give)for(const k in it.give)S.inv[k]+=it.give[k];
  else{S.owned[id]=true;if(it.collar)S.collar=it.collar;}
  toast(`${it.i} ${it.n} gekauft!`,'good');
  if(!it.give&&!it.collar)diary(`Neu im Haus: ${it.n}.`);
  bgKey='';renderBG(true);renderDogNow(true);renderActions();openShop(true);
}
function openAlbum(){
  let h=`<p>${Object.keys(S.finds).length} von ${FINDS.length} Fundstücken entdeckt. Auf Spaziergängen findest du mehr.</p><div class="grid4">`;
  FINDS.forEach(f=>{
    const c=S.finds[f.id];
    h+=`<div class="find${c?'':' no'}"><span>${c?f.i:'❔'}</span>${c?f.n:'???'}<em>${c?(c>1?'×'+c+' · ':'')+'★'.repeat(f.r):''}</em></div>`;
  });
  openSheet('Album',h+'</div>');
}
function openDiary(){
  const h=S.diary.length?'<div class="diary">'+S.diary.map(d=>`<p><small>Tag ${d.d}</small>${esc(d.t)}</p>`).join('')+'</div>':'<p>Noch keine Einträge. Sie kommen von allein.</p>';
  openSheet('Tagebuch',h);
}
function openAch(){
  const h='<div class="list">'+ACH.map(a=>{const ok=S.ach[a.id];return `<div class="card${ok?' done':' locked'}"><div class="ci">${ok?a.i:'🔒'}</div><div class="cb"><b>${a.n}</b><small>${a.d}</small></div></div>`;}).join('')+'</div>';
  openSheet(`Erfolge (${Object.keys(S.ach).length}/${ACH.length})`,h);
}
function openProfile(){
  const b=BREEDS[S.dog.type],lv=bondLevel(),si=stageIdx(),nx=STAGES[si+1];
  const lo=BOND[lv-1],hi=BOND[lv];
  const bar=(l,v,t)=>`<div class="bar"><span>${l}</span><div class="track"><i style="width:${clamp(v)}%"></i></div><span>${t}</span></div>`;
  const h=`<p>${b.name} · ${b.trait}</p><p style="color:var(--muted)">${b.desc}</p>
  <div class="bars" style="margin-top:10px">
   ${bar('Wachstum',nx?(S.growth-STAGES[si].min)/(nx.min-STAGES[si].min)*100:100,nx?`→ ${nx.n}`:'✓')}
   ${bar('Bindung',hi?(S.bond-lo)/(hi-lo)*100:100,BONDN[lv-1])}
   ${bar('Leine',S.leash,Math.round(S.leash)+'%')}
   ${bar('Stubenrein',S.house,Math.round(S.house)+'%')}
  </div>
  <div class="h3">Statistik</div>
  <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px"><span class="chip">${daysTogether()} Tage</span><span class="chip">${S.stats.walks} Spaziergänge</span><span class="chip">${S.stats.pet} Streicheleinheiten</span><span class="chip">${S.stats.baths} Bäder</span><span class="chip">${S.stats.catches} Bälle geholt</span><span class="chip">Stimmung: ${moodName()}</span></div>
  <div class="field"><label for="renameIn">Name ändern</label><div class="namerow"><input id="renameIn" type="text" maxlength="14" value="${esc(S.dog.name)}"><button class="btn pri" data-act="rename">Speichern</button></div></div>`;
  openSheet(esc(S.dog.name),h);
}
function openSettings(){
  const s=S.settings;
  const seg=(k,vals)=>`<div class="seg">${vals.map(v=>`<button class="btn" data-act="set" data-k="${k}" data-v="${v[0]}" aria-pressed="${String(s[k])===String(v[0])}">${v[1]}</button>`).join('')}</div>`;
  const h=`<div class="field"><label>Ton</label>${seg('sound',[[false,'Aus'],[true,'An']])}</div>
  <div class="field"><label>Spieltempo (Hunger, Müdigkeit …)</label>${seg('speed',[[.5,'Gemütlich'],[1,'Normal'],[3,'Schnell']])}</div>
  <div class="field"><label>Erscheinungsbild</label>${seg('theme',[['auto','Auto'],['light','Hell'],['dark','Dunkel']])}</div>
  <p style="color:var(--muted);font-size:13px">${storageOK?'Dein Spielstand wird automatisch in diesem Browser gespeichert.':'⚠️ Speichern ist in diesem Browser gerade nicht möglich. Nutze den Spielstand-Code unten.'}</p>
  <div class="field"><label for="codeBox">Spielstand-Code (zum Sichern oder Übertragen)</label><textarea id="codeBox" spellcheck="false"></textarea>
   <div class="row" style="display:flex;gap:8px"><button class="btn" data-act="export" style="flex:1">Code erzeugen</button><button class="btn" data-act="import" style="flex:1">Code laden</button></div></div>
  <button class="btn ghost" data-act="askreset" style="width:100%;margin-top:6px;color:var(--bad)">Neues Spiel starten</button>`;
  openSheet('Einstellungen',h);
}
function openHelp(){
  openSheet('So geht’s',`<div class="list">
   <div class="card"><div class="ci">💗</div><div class="cb"><b>Streicheln</b><small>Fahre mit dem Finger über deinen Hund. Das schafft Vertrauen.</small></div></div>
   <div class="card"><div class="ci">📋</div><div class="cb"><b>Jeden Tag</b><small>Füttern, Wasser, Gassi und Kuscheln sind das Wichtigste. Oben erinnert dich ein gelber Streifen.</small></div></div>
   <div class="card"><div class="ci">🌱</div><div class="cb"><b>Wachsen</b><small>Mit guter Pflege wächst dein Hund vom Welpen zum erwachsenen Hund. Das dauert mehrere Tage.</small></div></div>
   <div class="card"><div class="ci">🎓</div><div class="cb"><b>Lernen</b><small>Je stärker die Bindung, desto mehr Kommandos und Orte schaltest du frei.</small></div></div>
   <div class="card"><div class="ci">🚽</div><div class="cb"><b>Gassi</b><small>Geh rechtzeitig raus. Mit der Zeit wird dein Hund stubenrein.</small></div></div>
   <div class="card"><div class="ci">😴</div><div class="cb"><b>Wenn du weg bist</b><small>Dein Hund wartet. Nach langer Pause vermisst er dich, aber es passiert ihm nichts.</small></div></div></div>`);
}
function askReset(){
  openSheet('Neues Spiel?',`<p>Dein Hund und alle Fortschritte werden gelöscht. Das lässt sich nicht rückgängig machen.</p><div class="row" style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-act="close" style="flex:1">Abbrechen</button><button class="btn pri" data-act="doreset" style="flex:1">Ja, löschen</button></div>`);
}
function doReset(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  S=null;closeSheet();goHomeSafe();showAdopt();
}
function goHomeSafe(){V.mode=null;V.panel=null;V.pose=null;V.walking=false;V.dogKey='';W=null;T=null;SN=null;clearInterval(tick.h);tick.h=null;}

/* ---------- Router ---------- */
function act(a,d){
  switch(a){
    case 'close':closeSheet();break;
    case 'menu':openMenu();break;
    case 'tab':if(V.mode)break;V.tab=d.t;renderActions();break;
    case 'loc':if(V.mode||S.sleeping)break;setLoc(d.l);break;
    case 'rem':if(V.remAct)act(V.remAct,{});break;
    case 'food':openFood();break;
    case 'feed':doFeed(d.k);break;
    case 'water':doWater();break;
    case 'wash':doWash();break;
    case 'sleep':doSleep();break;
    case 'wake':wake(false);break;
    case 'vet':doVet();break;
    case 'garden':doGarden();break;
    case 'mop':doMop();break;
    case 'cuddle':doCuddle();break;
    case 'ball':doBall();break;
    case 'sniff':doSniff();break;
    case 'pot':pickPot(Number(d.i));break;
    case 'walk':doWalkMenu();break;
    case 'startwalk':startWalk(d.id);break;
    case 'wchoice':wChoice(Number(d.i));break;
    case 'wnext':if(W){W.i++;nextEvent();}break;
    case 'home':goHome();break;
    case 'cancelmode':goHome();break;
    case 'learn':V.tab='learn';renderActions();break;
    case 'train':doTrain(d.id);break;
    case 'cmd':doCmd();break;
    case 'reward':doReward(d.k);break;
    case 'today':showToday();break;
    case 'shop':openShop();break;
    case 'buy':buy(d.id);break;
    case 'equip':S.collar=d.c;V.dogKey='';renderDogNow(true);openShop(true);break;
    case 'album':openAlbum();break;
    case 'diary':openDiary();break;
    case 'ach':openAch();break;
    case 'profile':openProfile();break;
    case 'settings':openSettings();break;
    case 'help':openHelp();break;
    case 'rename':{const v=($('#renameIn').value||'').trim().slice(0,14);if(v){S.dog.name=v;toast('Neuer Name: '+v,'good');closeSheet();hud();renderActions();}break;}
    case 'set':{
      const k=d.k;let v=d.v;
      if(k==='sound')v=v==='true';else if(k==='speed')v=Number(v);
      S.settings[k]=v;if(k==='theme')applyTheme();if(k==='sound'&&v)sfx('pop');openSettings();break;}
    case 'export':{try{$('#codeBox').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#codeBox').select();}catch(e){toast('Code konnte nicht erzeugt werden.');}break;}
    case 'import':{
      try{
        const o=JSON.parse(decodeURIComponent(escape(atob($('#codeBox').value.trim()))));
        if(!o||!o.dog||!o.needs)throw 0;
        S=deepFill(o,newGame(o.dog.type||0,o.dog.name||'Hund'));save();closeSheet();startGame(false);toast('Spielstand geladen.','good');
      }catch(e){toast('Dieser Code passt leider nicht.');}
      break;}
    case 'askreset':askReset();break;
    case 'doreset':doReset();break;
    case 'pickbreed':pickBreed(Number(d.i));break;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t&&!t.disabled){act(t.dataset.act,t.dataset);return;}
  if(e.target.id==='overlay')closeSheet();
});

/* ---------- Takt ---------- */
function bubbleTick(){
  if(V.mode||S.sleeping||Date.now()-V.lastBubble<9000)return;
  const n=S.needs;let low=null,lv=100;
  for(const k in n){if(n[k]<lv){lv=n[k];low=k;}}
  if(S.mess){say('💦 Ups …');return;}
  if(lv<32){say(NEEDS[low].i+' '+({hunger:'Hunger!',thirst:'Durst!',energy:'Müde …',clean:'Bäh, schmutzig',fun:'Langweilig …',love:'Kuscheln?',bladder:'Ich muss mal!'})[low]);return;}
  if(Math.random()<.2&&moodScore()>72){say(pick(['💗','🎾','🐾','😊']));return;}
  if(!S.daily.wishDone&&Math.random()<.18)say(wishObj().i+' Wunsch!');
}
function idleTick(){
  if(V.mode||S.sleeping||V.pose||V.cuddle&&Date.now()-V.cuddle<6000)return;
  if(Math.random()<.5){V.idle=V.idle==='stand'?'sit':'stand';renderDogNow();}
}
function tick(){
  if(!S)return;
  const now=Date.now(),dtMin=(now-S.lastTick)/60000;S.lastTick=now;
  if(dtMin>2)offline(dtMin);else decay(dtMin*speed());
  tickN++;
  if(dayCheck())showMorning();
  if(tickN%3===0)bubbleTick();
  if(tickN%7===0)idleTick();
  if(tickN%10===0)save();
  if(tickN%30===0)checkAch();
  hud();
}
document.addEventListener('visibilitychange',()=>{if(S&&!document.hidden){tick();}else if(S)save();});
window.addEventListener('pagehide',()=>{if(S)save();});

/* ---------- Start & Adoption ---------- */
let pickedBreed=null;
function applyTheme(){
  const t=S?S.settings.theme:'auto',r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
}
function showAdopt(){
  $('#app').hidden=true;$('#adopt').hidden=false;pickedBreed=null;
  $('#cards').innerHTML=BREEDS.map((b,i)=>`<button class="dcard" data-act="pickbreed" data-i="${i}" aria-pressed="false"><div class="dv">${dogSVG(Object.assign({},b.look,{pose:'sit',mood:'happy',pup:1,uid:'a'+i,collar:'#e4572e'}))}</div><b>${b.name}</b><span class="tr">${b.trait}</span><small>${b.desc}</small></button>`).join('');
  $('#nameIn').value='';updateAdopt();
}
function pickBreed(i){
  pickedBreed=i;document.querySelectorAll('.dcard').forEach((c,k)=>c.setAttribute('aria-pressed',k===i?'true':'false'));updateAdopt();
}
function updateAdopt(){$('#adoptBtn').disabled=!(pickedBreed!=null&&$('#nameIn').value.trim().length>0);}
$('#nameIn').addEventListener('input',updateAdopt);
$('#diceBtn').addEventListener('click',()=>{
  const pool=pickedBreed!=null?BREEDS[pickedBreed].names.concat(NAMES):NAMES;$('#nameIn').value=pick(pool);updateAdopt();
});
$('#adoptBtn').addEventListener('click',()=>{
  const name=$('#nameIn').value.trim().slice(0,14);if(pickedBreed==null||!name)return;
  S=newGame(pickedBreed,name);diary(`${name} ist bei mir eingezogen.`);save();startGame(true);
});
function startGame(fresh){
  $('#adopt').hidden=true;$('#app').hidden=false;applyTheme();buildNeeds();
  const now=Date.now(),dtMin=(now-S.lastTick)/60000;S.lastTick=now;
  const nd=dayCheck();
  if(!fresh&&dtMin>2)offline(dtMin);
  S.sleeping=S.sleeping&&S.needs.energy<98;
  V.mode=null;V.panel=null;V.pose=null;V.dogKey='';V.tab='care';bgKey='';
  checkAch();setLoc('home');
  if(S.sleeping)setDogX(26,1);
  renderActions();hud();
  if(!tick.h)tick.h=setInterval(tick,1000);
  if(fresh)setTimeout(()=>showMorning(true),350*(window.__ts||1));
  else if(nd||!S.daily.seen)setTimeout(()=>showMorning(),350*(window.__ts||1));
  else if(bondLevel()>=3&&!S.sleeping){setTimeout(()=>{dogAnim('jump',800);fx('💗',4,{x:52,y:30});},500*(window.__ts||1));}
  save();
}
$('#scene').addEventListener('click',e=>{if(V.mode==='ball')throwBall(e);});
initPet();
(function boot(){
  S=loadSave();
  if(S)startGame(false);else showAdopt();
})();

</script><script defer data-category="freizeit" src="protect.js"></script>
</body></html>
