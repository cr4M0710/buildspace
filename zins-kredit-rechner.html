<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zins- & Kreditrechner</title>
<style>
:root{--bg:#0b0c10;--ink:#f4f6fb;--soft:#aeb0b8;--line:rgba(255,255,255,.2);--ok:#7bd8a4;--bad:#ff8a80;--glass:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5;padding:76px 16px 120px;background:radial-gradient(1000px 600px at 12% -10%,#262932,transparent),radial-gradient(900px 600px at 100% 115%,#1c1e26,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 10px}
.lead{color:var(--soft);margin:0 0 20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.4)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));cursor:pointer;font-weight:700;touch-action:manipulation;text-decoration:none;color:var(--ink)}
.btn:hover{background:linear-gradient(160deg,rgba(255,255,255,.36),rgba(255,255,255,.12))}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:rgba(255,255,255,.05);font-weight:600}
.btn.small{min-height:40px;padding:0 16px;font-size:.92rem}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:600;touch-action:manipulation}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7));color:#111;border-color:#fff}
input,select,textarea{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);width:100%}
textarea{min-height:110px;resize:vertical}
select option{color:#111}
label{display:block;font-size:.88rem;color:var(--soft);margin:0 0 4px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--soft)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c4c6cd,#fff);transition:width .3s}
.q{font-size:1.2rem;margin:0 0 14px}
.svgbox{display:flex;justify-content:center;margin:0 0 14px}
.svgbox svg{max-width:100%;height:auto}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choices .btn{justify-content:flex-start;text-align:left;padding:10px 18px;min-height:56px}
.choices .btn.right{background:rgba(123,216,164,.28);border-color:var(--ok)}
.choices .btn.wrong{background:rgba(255,138,128,.25);border-color:var(--bad)}
.fb{min-height:1.5em;margin:12px 0 0;font-weight:700}
.explain{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);color:#e4e6ec;font-size:.95rem}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--soft);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.big{font-size:2.4rem;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{box-shadow:none;border:1px solid #999;background:#fff}.soft{color:#444}}
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="buildspace">
<meta property="og:title" content="Zins- &amp; Kreditrechner – buildspace">
<meta property="og:description" content="Zinseszins beim Sparen und die Rate bei einem Kredit berechnen, mit Diagramm und Tabelle Jahr für Jahr.">

<meta name="twitter:title" content="Zins- &amp; Kreditrechner – buildspace">
<meta name="twitter:description" content="Zinseszins beim Sparen und die Rate bei einem Kredit berechnen, mit Diagramm und Tabelle Jahr für Jahr.">

</head>
<body>
<div class="wrap">
<h1>Zins- & Kreditrechner</h1>
<p class="lead">Wie wächst Erspartes mit Zinseszins? Wie teuer ist ein Kredit? Ausprobieren und im Diagramm sehen.</p>

<div class="card"><h2>Eingaben</h2>
<div class="row" role="group" aria-label="Rechenart">
<button class="chip" id="m-z" aria-pressed="true">Sparen (Zinseszins)</button>
<button class="chip" id="m-k" aria-pressed="false">Kredit (Rate)</button></div>
<div class="grid" style="margin-top:14px">
<div><label for="a">Betrag in €</label><input id="a" inputmode="decimal" value="1000"></div>
<div><label for="p">Zinssatz in % pro Jahr</label><input id="p" inputmode="decimal" value="3"></div>
<div><label for="n">Laufzeit in Jahren</label><input id="n" inputmode="numeric" value="10"></div>
<div id="wr"><label for="r">Sparrate pro Jahr in € (optional)</label><input id="r" inputmode="decimal" value="0"></div></div>
</div>
<div class="card" aria-live="polite"><h2>Ergebnis</h2><div id="res"></div>
<div class="svgbox" style="margin-top:14px"><svg id="chart" viewBox="0 0 600 260" role="img" aria-label="Diagramm der Entwicklung"></svg></div>
<details><summary>Jahr für Jahr (Tabelle)</summary><div style="overflow-x:auto"><table id="tab"></table></div></details>
<p class="soft">Hinweis: Vereinfachte Modellrechnung ohne Steuern und Gebühren.</p></div>

</div>
<script>

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){if(d===undefined)d=2;var v=Math.round(n*Math.pow(10,d))/Math.pow(10,d);return String(v).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(/\s/g,'');if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){var p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}s=s.replace(/[^0-9.\-+eE]/g,'');var v=parseFloat(s);return isNaN(v)?NaN:v}
function mc(correct,wrongs){correct=String(correct);var set=[correct];wrongs.forEach(function(w){w=String(w);if(set.indexOf(w)<0)set.push(w)});var arr=shuffle(set.slice(0,4));return {choices:arr,correct:arr.indexOf(correct)}}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

var mode='z';
function eur(v){return v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function setMode(m){mode=m;$('#m-z').setAttribute('aria-pressed',m==='z');$('#m-k').setAttribute('aria-pressed',m==='k');
$('#wr').style.display=m==='z'?'':'none';$('label[for=a]').textContent=m==='z'?'Startkapital in €':'Kreditbetrag in €';calc()}
function calc(){
var A=parseNum($('#a').value),p=parseNum($('#p').value)/100,n=Math.round(parseNum($('#n').value)),r=parseNum($('#r').value)||0;
var res=$('#res'),tab=$('#tab');
if(!(A>=0)||!(p>=0)||!(n>=1)||n>60){res.innerHTML='<p class="bad">Bitte gültige Zahlen eingeben (Laufzeit 1 bis 60 Jahre).</p>';tab.innerHTML='';$('#chart').innerHTML='';return}
var pts=[],rows=[],k=A,paid=A,i;
if(mode==='z'){
 pts.push(k);rows.push(['0',eur(k),'–']);
 for(i=1;i<=n;i++){var z=k*p;k=k+z+r;paid+=r;pts.push(k);rows.push([i,eur(k),eur(z)])}
 res.innerHTML='<div class="big">'+eur(k)+'</div><p>Eingezahlt: '+eur(paid)+'<br>Zinsen insgesamt: <b>'+eur(k-paid)+'</b></p><p class="soft">Ohne Zinseszins (einfache Zinsen) wären es '+eur(A+A*p*n+r*n)+' (ohne Zinsen auf die Raten).</p>';
 tab.innerHTML='<tr><th>Jahr</th><th>Kapital</th><th>Zinsen im Jahr</th></tr>'+rows.map(function(x){return '<tr><td>'+x.join('</td><td>')+'</td></tr>'}).join('');
}else{
 var rate=p===0?A/n:A*p*Math.pow(1+p,n)/(Math.pow(1+p,n)-1);var rest=A;pts.push(rest);
 for(i=1;i<=n;i++){var z2=rest*p;rest=rest+z2-rate;if(rest<0)rest=0;pts.push(rest);rows.push([i,eur(z2),eur(rest)])}
 var tot=rate*n;
 res.innerHTML='<div class="big">'+eur(rate)+' <span style="font-size:1rem">pro Jahr</span></div><p>Das sind <b>'+eur(rate/12)+'</b> pro Monat (vereinfacht).<br>Insgesamt zurückzuzahlen: '+eur(tot)+'<br>Davon Zinsen: <b>'+eur(tot-A)+'</b></p>';
 tab.innerHTML='<tr><th>Jahr</th><th>Zinsen im Jahr</th><th>Restschuld</th></tr>'+rows.map(function(x){return '<tr><td>'+x.join('</td><td>')+'</td></tr>'}).join('');
}
var max=Math.max.apply(null,pts)||1,W=600,H=260,pl=10,pb=24,s='';
var path=pts.map(function(v,j){var x=pl+(W-2*pl)*j/n,y=H-pb-(H-pb-14)*v/max;return (j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
s+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pl)+'" y2="'+(H-pb)+'" stroke="#888"/>';
s+='<path d="'+path+' L'+(W-pl)+' '+(H-pb)+' L'+pl+' '+(H-pb)+'Z" fill="rgba(255,255,255,.12)"/><path d="'+path+'" fill="none" stroke="#fff" stroke-width="3"/>';
s+='<text x="'+pl+'" y="'+(H-6)+'" fill="#aaa" font-size="13">Jahr 0</text><text x="'+(W-pl)+'" y="'+(H-6)+'" fill="#aaa" font-size="13" text-anchor="end">Jahr '+n+'</text>';
$('#chart').innerHTML=s}
$('#m-z').onclick=function(){setMode('z')};$('#m-k').onclick=function(){setMode('k')};
['a','p','n','r'].forEach(function(id){$('#'+id).addEventListener('input',calc)});
setMode('z');

</script>
