<style>
:root{
  --bg:#EEF2F7;--grid:#DCE4EE;--panel:#FFFFFF;--panel2:#F6F8FB;--ink:#16223A;--soft:#5B6880;--line:#CFD8E4;--line2:#E3E9F1;
  --acc:#2E5BD8;--acc-soft:#E5ECFF;--onacc:#FFFFFF;--warn:#C2353F;--warn-soft:#FDE8EA;--ok:#17805A;
  --floor:#FCFDFE;--floorline:#E7EDF4;--wall:#5B6880;--wood:#EADBC1;--woodline:#C4AB82;--card:#FFFFFF;--seat:#F7F2E8;
  --sel:#F5A524;--shadow:0 1px 2px rgba(22,34,58,.08),0 6px 20px -8px rgba(22,34,58,.22);
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1522;--grid:#172234;--panel:#152033;--panel2:#1A273C;--ink:#E7EDF6;--soft:#9DABC0;--line:#2B3B54;--line2:#223047;
    --acc:#7E9DFF;--acc-soft:#1E2C4D;--onacc:#0B1220;--warn:#FF8A93;--warn-soft:#3B1C22;--ok:#4AD39C;
    --floor:#111B2A;--floorline:#1A2638;--wall:#7F8DA5;--wood:#4E4030;--woodline:#73603F;--card:#1B2940;--seat:#2A2A26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1522;--grid:#172234;--panel:#152033;--panel2:#1A273C;--ink:#E7EDF6;--soft:#9DABC0;--line:#2B3B54;--line2:#223047;
  --acc:#7E9DFF;--acc-soft:#1E2C4D;--onacc:#0B1220;--warn:#FF8A93;--warn-soft:#3B1C22;--ok:#4AD39C;
  --floor:#111B2A;--floorline:#1A2638;--wall:#7F8DA5;--wood:#4E4030;--woodline:#73603F;--card:#1B2940;--seat:#2A2A26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--soft)}
.small{font-size:13px}

/* ---------- Kopfleiste ---------- */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) 8px max(132px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;z-index:30}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand h1{font:800 21px/1 var(--f-head);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-size:18px;flex:none}
.bt{display:flex;flex-direction:column;gap:3px;min-width:0}
#saveState{font-size:12px;color:var(--soft);white-space:nowrap;line-height:1}
@media (max-width:1500px){.sel-wrap label{display:none}select{max-width:170px}}
.sel-wrap{display:flex;align-items:center;gap:6px}
.sel-wrap label{font-size:12px;color:var(--soft);font-weight:700}
select,input[type=text],input[type=number],input[type=search],textarea{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:40px;padding:6px 10px}
select{padding-right:28px;max-width:200px}
textarea{width:100%;resize:vertical;min-height:80px;line-height:1.4}
input[type=text],input[type=search],input[type=number]{width:100%}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:40px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2);border-color:var(--line)}
.btn.icon{width:40px;padding:0;font-size:17px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13.5px}
.btn.danger{color:var(--warn)}
.btn.danger:hover{border-color:var(--warn);background:var(--warn-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vsep{width:1px;height:26px;background:var(--line);margin:0 2px}

/* ---------- App-Layout ---------- */
.app{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
aside#side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
.side-sec{padding:12px 14px;border-bottom:1px solid var(--line2)}
.side-sec h3{margin:0 0 8px;font:700 13px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--soft);display:flex;align-items:center;gap:6px}
.side-sec h3 .sp{flex:1}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pal button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:62px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.pal button:hover{border-color:var(--acc)}
.pal .ico{font-size:20px;line-height:1}
.pal svg{width:34px;height:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.switch{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-weight:700;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--panel2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;min-height:36px;padding:4px 12px;font-weight:700;color:var(--soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(22,34,58,.18)}
.seg.lv button{min-width:44px;justify-content:center}

/* Lernenden-Liste */
.stu-head{display:flex;gap:6px}
#stuList{display:flex;flex-direction:column;gap:4px;min-height:60px;border-radius:10px;padding:2px;transition:background .15s}
#stuList.drop{background:var(--acc-soft);outline:2px dashed var(--acc)}
.lst-h{font-size:12px;font-weight:700;color:var(--soft);margin:8px 2px 2px;text-transform:uppercase;letter-spacing:.05em}
.srow{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;min-height:44px;padding:2px 4px 2px 2px}
.srow.armed{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc) inset}
.srow.abs{opacity:.55}
.srow .hdl{touch-action:none;width:34px;height:40px;display:grid;place-items:center;color:var(--soft);font-size:18px;cursor:grab;border-radius:8px;flex:none;user-select:none;-webkit-user-select:none}
.srow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;background:none;border:0;text-align:left;min-height:40px;padding:0 2px}
.srow .seated{font-size:11px;color:var(--soft);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;padding:0 5px;flex:none}
.badge.none{background:var(--line);color:var(--soft)}
.edit-b{border:0;background:none;width:36px;height:40px;border-radius:8px;color:var(--soft);font-size:16px;flex:none}
.edit-b:hover{background:var(--panel)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.stat b{display:block;font:800 22px/1.1 var(--f-head)}
.stat span{font-size:12px;color:var(--soft)}
.hint{font-size:13px;color:var(--soft);line-height:1.45}
.hint b{color:var(--ink)}

/* Haupt-Bereich */
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolbar .sp{flex:1}
.zoom{display:inline-flex;align-items:center;gap:2px}
.zoom span{min-width:46px;text-align:center;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
#vp{flex:1;overflow:auto;position:relative;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:18px 18px;-webkit-overflow-scrolling:touch}
#world{position:relative;margin:24px auto}
#room{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--floor);border:3px solid var(--wall);border-radius:6px;box-shadow:var(--shadow)}
#room.gridon{background-image:linear-gradient(var(--floorline) 1px,transparent 1px),linear-gradient(90deg,var(--floorline) 1px,transparent 1px)}
.front-lbl{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;pointer-events:none}

/* Elemente im Raum */
.it{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mode-lesson .it{touch-action:manipulation}
.it.sel{outline:3px solid var(--sel);outline-offset:3px;border-radius:12px;z-index:5}
.it.locked::after{content:"🔒";position:absolute;right:-8px;top:-10px;font-size:14px}
.mode-room .it{cursor:move}
.mode-room .it.locked{cursor:default}
.obj{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;overflow:hidden;text-align:center;line-height:1.1;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15)}
.obj.round{border-radius:50%}
.obj .ol{padding:2px 4px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.obj .ol.vert{writing-mode:vertical-rl}
.obj.t-text{box-shadow:none;border:1.5px dashed transparent}
.mode-room .obj.t-text{border-color:var(--line)}
.surf{position:absolute;inset:0;background:var(--wood);border:2px solid var(--woodline);border-radius:10px}
.surf.round{inset:auto;border-radius:50%}
.rs-h{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--sel);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);touch-action:none;cursor:nwse-resize;z-index:3}
.rot-h{position:absolute;left:50%;top:-34px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--sel);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);touch-action:none;cursor:grab;z-index:3;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.rot-h::after{content:"";position:absolute;left:50%;top:24px;width:2px;height:10px;background:var(--sel);margin-left:-1px}
.seat{position:absolute;border-radius:8px;background:var(--seat);border:1.5px dashed var(--woodline);display:flex;align-items:center;justify-content:center}
.seat .sn{font-size:calc(var(--sh)*.22);color:var(--woodline);font-weight:800}
.seat.occ{border:0;background:transparent}
.seat.target{box-shadow:0 0 0 3px var(--acc);background:var(--acc-soft)}
.seat.hl .card{box-shadow:0 0 0 4px #FFC93C,0 0 22px 6px rgba(255,201,60,.85);transform:scale(1.07);z-index:4}
.seat.picked .card{box-shadow:0 0 0 5px #FF8A1F,0 0 30px 10px rgba(255,138,31,.85);animation:pulse 1s ease-in-out infinite;z-index:4}
@keyframes pulse{50%{transform:scale(1.1)}}
.mode-seat .seat.occ{cursor:grab}
.mode-seat .seat:not(.occ){cursor:pointer}
.armed-on .seat:not(.occ){border-color:var(--acc);background:var(--acc-soft)}

/* Schülerkarte */
.card{position:absolute;inset:0;border-radius:8px;background:linear-gradient(var(--cbg,transparent),var(--cbg,transparent)),var(--card);border:1.5px solid var(--line);border-left:calc(var(--sh)*.08) solid var(--cc,var(--line));padding:calc(var(--sh)*.06) calc(var(--sh)*.08);display:flex;flex-direction:column;gap:calc(var(--sh)*.03);overflow:hidden;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card.only{justify-content:center;align-items:center;text-align:center}
.c-top{display:flex;align-items:flex-start;gap:4px;min-width:0}
.c-name{font-weight:800;font-size:var(--fs);line-height:1.12;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.only .c-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;flex:none;max-width:100%}
.card.only .c-top{justify-content:center;max-width:100%}
.c-sm{font-size:calc(var(--fs)*1.05);line-height:1;flex:none}
.c-meta{display:flex;gap:3px;flex-wrap:wrap;align-items:center;font-size:calc(var(--fs)*.7);line-height:1.1;overflow:hidden;max-height:calc(var(--fs)*1.9)}
.c-meta>span{border-radius:5px;padding:1px 4px;font-weight:800;white-space:nowrap}
.c-lv{color:#fff}
.c-pt{background:var(--acc-soft);color:var(--acc)}
.c-pt.neg{background:var(--warn-soft);color:var(--warn)}
.c-tag{background:var(--panel2);border:1px solid var(--line2);color:var(--soft);font-weight:700!important}
.c-grp{color:#fff}
.c-note{font-size:calc(var(--fs)*.72);line-height:1.2;color:var(--soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.card.abs{opacity:.5;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.12) 6px 12px),var(--card)}
.card.abs .c-name{text-decoration:line-through}
.card .c-mark{position:absolute;right:3px;bottom:2px;width:calc(var(--sh)*.16);height:calc(var(--sh)*.16);border-radius:50%}

/* Eigenschaften */
#propbar{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100% - 24px);z-index:20}
#propbar .lbl{font-weight:800;font-size:13px;padding:0 6px}
#propbar input[type=text]{width:150px;min-height:36px}
#propbar input[type=number]{width:74px;min-height:36px}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;padding:2px}
.stepper button{border:0;background:var(--panel2);border-radius:7px;width:30px;height:30px;font-weight:800}
.stepper span{min-width:26px;text-align:center;font-weight:800;font-size:13px}

/* Popover, Dialoge */
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 80px);overflow:auto}
.pop h4{margin:4px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.chk{display:flex;align-items:center;gap:10px;min-height:36px;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.ovl{position:fixed;inset:0;z-index:70;background:rgba(10,16,28,.48);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.dlg{background:var(--panel);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(900px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.dlg-h h2{margin:0;font:800 19px/1.2 var(--f-head);flex:1}
.dlg-b{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line2);background:var(--panel2)}
.dlg-f .sp{flex:1}
.fld>label{display:block;font-weight:700;font-size:13px;margin-bottom:4px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;min-height:34px;padding:2px 12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip .x{font-weight:800;opacity:.7}
.smgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.smgrid button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:48px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.smgrid button small{font-size:9.5px;color:var(--soft);margin-top:2px}
.smgrid button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;background:var(--acc-soft)}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tpl-grid button{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.tpl-grid button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc) inset}
.tpl-grid svg{width:100%;height:64px}
.list-plain{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:6px 8px;background:var(--panel2)}
.lrow .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* Gruppen */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.gbox{border:2px solid var(--gc);border-radius:14px;overflow:hidden;background:var(--panel)}
.gbox .gh{background:var(--gc);color:#fff;font-weight:800;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;min-height:38px;width:100%;border:0;text-align:left}
.gbox .gm{display:flex;flex-wrap:wrap;gap:5px;padding:8px}
.gchip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13.5px;display:inline-flex;gap:5px;align-items:center;min-height:32px}
.gchip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}

/* Zufall */
#pickPanel{position:absolute;right:12px;top:12px;width:min(320px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:25;display:flex;flex-direction:column;max-height:calc(100% - 24px)}
#pickPanel .ph{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line2)}
#pickPanel .ph b{flex:1;font:800 16px/1 var(--f-head)}
#pickPanel .pb{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
#pickName{font:800 30px/1.15 var(--f-head);text-align:center;min-height:42px;padding:10px 6px;border-radius:12px;background:var(--panel2);word-break:break-word}
#pickName.done{background:linear-gradient(135deg,#FFE7A3,#FFC2A1);color:#3A1F00;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.06)}}
#pickGo{min-height:54px;font-size:18px}
.hist{display:flex;flex-wrap:wrap;gap:4px}
.hist span{font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
#bigPick{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;pointer-events:none}
#bigPick div{font:800 clamp(40px,9vw,120px)/1.05 var(--f-head);background:rgba(255,255,255,.94);color:#16223A;padding:.25em .6em;border-radius:.35em;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:big .5s cubic-bezier(.2,1.4,.4,1);text-align:center;max-width:92vw;word-break:break-word}
@keyframes big{from{transform:scale(.4);opacity:0}}

/* Mobile */
#sideToggle{display:none}
@media (max-width:860px){
  .top{padding-left:max(64px,env(safe-area-inset-left))}
  .app{grid-template-columns:1fr}
  aside#side{position:fixed;left:0;right:0;bottom:0;max-height:62vh;z-index:45;border-right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
  aside#side.open{transform:none}
  #sideToggle{display:inline-flex}
  .brand h1{font-size:18px}
  #saveState{display:none}
  .hide-m{display:none!important}
  #propbar{bottom:max(10px,env(safe-area-inset-bottom))}
}
@media (max-width:1200px){.brand h1{font-size:18px}}
@media (max-width:640px){
  .top{gap:6px}
  .brand{margin-right:0}.brand .bt{display:none}.brand .logo{width:30px;height:30px;font-size:16px}
  .sel-wrap{gap:0}
  select{max-width:112px;min-height:36px;font-size:14px}
  .actions{gap:2px}
  .actions .btn.icon{width:34px;min-height:36px}
  #bExport{min-height:36px;padding:4px 10px}#bExport span{display:none}
  .vsep{display:none}
}
@media (max-width:520px){
  .sel-wrap label{display:none}
  .grid2{grid-template-columns:1fr}
  .seg button{padding:4px 9px}
  .seg button .tx{display:none}
}

/* Druck */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;display:block!important}
  body > *:not(#printArea){display:none!important}
  /* höhere Spezifität als die allgemeine Druckregel aus protect.js */
  body > div#printArea{display:block!important;visibility:visible!important}
  #printArea img{display:block;width:100%;height:auto;break-after:page;page-break-after:always}
  #printArea img:last-child{break-after:auto;page-break-after:auto}
}
</style>

<body>

<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">🪑</div><div class="bt"><h1>Sitzplan-Studio</h1><span id="saveState">Gespeichert</span></div></div>
  <div class="sel-wrap"><label for="clsSel">Klasse</label><select id="clsSel" aria-label="Klasse wählen"></select><button class="btn icon ghost" id="bClasses" title="Klassen verwalten" aria-label="Klassen verwalten">⋯</button></div>
  <div class="sel-wrap"><label for="planSel">Plan</label><select id="planSel" aria-label="Sitzplan wählen"></select><button class="btn icon ghost" id="bPlans" title="Sitzpläne verwalten" aria-label="Sitzpläne verwalten">⋯</button></div>
  <div class="actions">
    <button class="btn icon ghost" id="bUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
    <button class="btn icon ghost" id="bRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
    <span class="vsep hide-m"></span>
    <button class="btn pri" id="bExport" title="Als Bild, PDF oder Ausdruck sichern" aria-label="Sichern">⬇︎ <span>Sichern</span></button>
    <button class="btn icon ghost" id="bData" title="Daten exportieren/importieren" aria-label="Daten exportieren oder importieren">💾</button>

</header>

<div class="app">
  <aside id="side" aria-label="Seitenleiste"></aside>
  <main>
    <div class="toolbar">
      <button class="btn sm" id="sideToggle" aria-label="Seitenleiste öffnen">☰ <span id="sideToggleTx">Liste</span></button>
      <div class="seg" id="modeSeg" role="group" aria-label="Modus">
        <button data-mode="room" aria-pressed="false" title="Tische und Raum einrichten">🏗️ <span class="tx">Raum</span></button>
        <button data-mode="seat" aria-pressed="true" title="Lernende auf Plätze setzen">👥 <span class="tx">Sitzplan</span></button>
        <button data-mode="lesson" aria-pressed="false" title="Im Unterricht: Abwesenheit, Smileys, Punkte">🎓 <span class="tx">Unterricht</span></button>
      </div>
      <div class="seg hide" id="toolSeg" role="group" aria-label="Werkzeug beim Antippen">
        <button data-tool="info" aria-pressed="true" title="Antippen öffnet Infos">✏️ <span class="tx">Infos</span></button>
        <button data-tool="absent" aria-pressed="false" title="Antippen: abwesend an/aus">🚫 <span class="tx">Fehlt</span></button>
        <button data-tool="smiley" aria-pressed="false" title="Antippen: Smiley wechseln">😀</button>

        <button class="btn sm ghost" id="zFit" title="Einpassen"><span id="zVal">100 %</span></button>
        <button class="btn icon ghost" id="zIn" aria-label="Vergrößern">+</button>

    </div>
    <div id="vp"><div id="world"><div id="room"></div></div></div>
    <div id="propbar" class="hide"></div>
    <div id="pickPanel" class="hide"></div>
  </main>
</div>

<div id="printArea"></div>
<script>
(function(){
'use strict';
/* =========================================================
   Sitzplan-Studio – Kern: Daten, Geometrie, Darstellung
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const LS='sitzplan-studio:v1', LS_UI='sitzplan-studio:ui';
const PAD=8, GAP=4;
const SIZES={s:[96,52],m:[120,66],l:[150,86],xl:[184,112]};
const SIZE_LABEL={s:'Klein',m:'Mittel',l:'Groß',xl:'Sehr groß'};
const LEVEL_COLORS=['#1F9D6B','#2F6BFF','#E08A00','#D9434A','#8A4FD6','#0E94A3'];
const GROUP_COLORS=['#E5484D','#2F6BFF','#D99A00','#1B9E6B','#8A4FD6','#F07F1B','#0E94A3','#D6409F','#6E8B3D','#5B6B8C','#B8860B','#00A3D9'];
const MARK_COLORS=['#E5484D','#F07F1B','#E2B100','#1B9E6B','#2F6BFF','#8A4FD6','#D6409F','#5B6B8C'];
const SMILEYS=[['😀','super'],['🙂','gut'],['😐','neutral'],['🙁','schwierig'],['😢','traurig'],['⭐','Stern'],['👍','Lob'],['🗣️','unruhig'],['💤','müde'],['📵','Handy'],['🤝','hilft'],['❓','Frage'],['📝','HA fehlt'],['⏰','zu spät']];
const CYCLE=['','😀','🙂','😐','🙁'];
const GROUP_NAMES={num:i=>'Gruppe '+(i+1),color:i=>['Rot','Blau','Gelb','Grün','Lila','Orange','Türkis','Pink','Oliv','Grau','Gold','Hellblau'][i%12]+(i>=12?' '+(Math.floor(i/12)+1):''),animal:i=>['Füchse','Bären','Eulen','Delfine','Adler','Wölfe','Pandas','Luchse','Otter','Falken','Igel','Biber'][i%12]+(i>=12?' '+(Math.floor(i/12)+1):'')};
const TABLE_TYPES=[
  {type:'t1',label:'Einzeltisch',cols:1,rows:1},
  {type:'t2',label:'Zweiertisch',cols:2,rows:1},
  {type:'t3',label:'Dreiertisch',cols:3,rows:1},
  {type:'t4',label:'Vierer-Reihe',cols:4,rows:1},
  {type:'g4',label:'4er-Gruppe',cols:2,rows:2},
  {type:'g6',label:'6er-Gruppe',cols:3,rows:2},
  {type:'g8',label:'8er-Gruppe',cols:4,rows:2},
  {type:'r4',label:'Rund (4)',round:4},
  {type:'r6',label:'Rund (6)',round:6}
];
const OBJ_TYPES={
  board:{label:'Tafel',icon:'🟩',w:360,h:30,fill:'#2F5D4A',fg:'#FFFFFF'},
  whiteboard:{label:'Whiteboard',icon:'⬜',w:300,h:26,fill:'#F4F6F8',fg:'#333A44'},
  screen:{label:'Leinwand',icon:'📽️',w:260,h:20,fill:'#DCE2EA',fg:'#333A44'},
  desk:{label:'Lehrerpult',icon:'🧑‍🏫',w:180,h:80,fill:'#C9A877',fg:'#3A2A12'},
  door:{label:'Tür',icon:'🚪',w:100,h:22,fill:'#B5835A',fg:'#FFFFFF'},
  window:{label:'Fenster',icon:'🪟',w:220,h:18,fill:'#BFE3F5',fg:'#1D4E66'},
  cabinet:{label:'Schrank',icon:'🗄️',w:170,h:50,fill:'#A9B2C0',fg:'#1E2633'},
  shelf:{label:'Regal',icon:'📚',w:150,h:40,fill:'#C9B49A',fg:'#3A2A12'},
  sink:{label:'Waschbecken',icon:'🚰',w:80,h:60,fill:'#D5E8F2',fg:'#1D4E66'},
  pc:{label:'PC-Platz',icon:'💻',w:120,h:70,fill:'#CFD6E2',fg:'#1E2633'},
  plant:{label:'Pflanze',icon:'🪴',w:60,h:60,fill:'#CDEBC9',fg:'#245A1E',round:true},
  bin:{label:'Mülleimer',icon:'🗑️',w:46,h:46,fill:'#D9DDE3',fg:'#333A44',round:true},
  carpet:{label:'Sitzkreis',icon:'🟤',w:280,h:200,fill:'#EED9C4',fg:'#6B4A2B',round:true},
  text:{label:'Beschriftung',icon:'🔤',w:200,h:40,fill:'transparent',fg:''}
};
const DISPLAY={
  name:{label:'Nur Name',f:{}},
  level:{label:'Name + Niveau',f:{level:1}},
  compact:{label:'Kompakt',f:{level:1,smiley:1,points:1,mark:1}},
  full:{label:'Alle Infos',f:{level:1,smiley:1,points:1,tags:1,note:1,mark:1,group:1}},
  custom:{label:'Eigene Auswahl',f:null}
};
const FIELD_LABELS={level:'Niveau',smiley:'Smiley',points:'Punkte',tags:'Merkmale',note:'Bemerkung',mark:'Markierung',group:'Gruppe'};

/* ---------- Zustand ---------- */
let S=null;              // gespeicherte Daten
const U={mode:'seat',tool:'info',zoom:1,fit:true,sel:null,armed:null,sideOpen:false,picking:false,pickOpen:false,search:''};
let undo=[], redo=[], lastKey=null, lastT=0;

function defaultSettings(){return {snap:true,grid:20,display:'compact',fields:{level:1,smiley:1,points:1,tags:0,note:0,mark:1,group:1},nameFmt:'full',colorBy:'level',persp:'teacher',beamer:false,levels:['A','B','C'],sound:true,noRepeat:true,excludeAbsent:true,pickCount:1,pickLevel:'',showSeatNo:false,theme:'auto',groupNames:'num'}}
function newStudent(name,level){return {id:uid(),name:String(name||'').trim()||'Neu',level:level||'',smiley:'',note:'',tags:[],color:'',points:0,absent:false,front:false,avoid:[],picked:0}}
function newPlan(name){return {id:uid(),name:name||'Sitzplan',W:1200,H:900,size:'m',items:[],seating:{},groups:null}}
function newClass(name){return {id:uid(),name:name||'Neue Klasse',students:[],plans:[],activePlan:null,pool:null,history:[]}}

const EXAMPLE=[['Ali','B'],['Ben','A'],['Clara','C'],['Deniz','B'],['Ela','A'],['Finn','C'],['Greta','B'],['Hamza','A'],['Ida','B'],['Jonas','C'],['Kaja','A'],['Luca','B'],['Mia','C'],['Noah','A'],['Olivia','B'],['Paul','B'],['Rana','A'],['Sami','C'],['Tara','B'],['Umut','A'],['Vera','C'],['Yusuf','B'],['Zoe','A'],['Emil','B']];
function exampleClass(){
  const c=newClass('7b (Beispiel)');
  c.students=EXAMPLE.map(([n,l])=>newStudent(n,l));
  const s=c.students;
  s[0].smiley='😀';s[0].note='Arbeitet sehr selbstständig, hilft gern anderen.';s[0].tags=['Klassensprecher'];
  s[3].front=true;s[3].tags=['Brille'];s[3].note='Sitzt vorne (Sehschwäche).';
  s[5].avoid=[s[9].id];s[9].avoid=[s[5].id];s[5].note='Nicht neben Jonas setzen.';
  s[7].points=2;s[12].smiley='💤';s[15].tags=['DaZ'];s[15].note='Wortspeicher bereitlegen.';
  s[20].color='#E5484D';
  const p=newPlan('Normal');c.plans.push(p);c.activePlan=p.id;
  applyTemplateTo(p,'rows',c.students.length,true);
  autoSeat(c,p,{mode:'mixed',onlyEmpty:false});
  return c;
}
function defaultState(){S={v:1,classes:[],activeClass:null,settings:defaultSettings()};const c=exampleClass();S.classes.push(c);S.activeClass=c.id;return S}
function migrate(d){
  if(!d||!Array.isArray(d.classes)) return defaultState();
  d.v=1; d.settings=Object.assign(defaultSettings(),d.settings||{});
  d.settings.fields=Object.assign(defaultSettings().fields,d.settings.fields||{});
  if(!Array.isArray(d.settings.levels)||!d.settings.levels.length) d.settings.levels=['A','B','C'];
  d.classes.forEach(c=>{
    c.id=c.id||uid(); c.name=c.name||'Klasse'; c.students=Array.isArray(c.students)?c.students:[]; c.plans=Array.isArray(c.plans)?c.plans:[];
    c.history=Array.isArray(c.history)?c.history:[];
    c.students.forEach(s=>{Object.assign(s,Object.assign(newStudent(s.name),s)); if(!Array.isArray(s.tags)) s.tags=[]; if(!Array.isArray(s.avoid)) s.avoid=[]; s.points=+s.points||0});
    if(!c.plans.length){const p=newPlan('Sitzplan');c.plans.push(p)}
    c.plans.forEach(p=>{p.id=p.id||uid();p.items=Array.isArray(p.items)?p.items:[];p.seating=p.seating||{};p.W=+p.W||1200;p.H=+p.H||900;if(!SIZES[p.size])p.size='m';
      p.items.forEach(it=>{it.id=it.id||uid();it.x=+it.x||0;it.y=+it.y||0;it.rot=+it.rot||0;});});
    if(!c.plans.some(p=>p.id===c.activePlan)) c.activePlan=c.plans[0].id;
  });
  if(!d.classes.length){const c=newClass('Meine Klasse');const p=newPlan('Sitzplan');c.plans.push(p);c.activePlan=p.id;d.classes.push(c)}
  if(!d.classes.some(c=>c.id===d.activeClass)) d.activeClass=d.classes[0].id;
  return d;
}
function load(){
  try{const raw=localStorage.getItem(LS); if(raw){S=migrate(JSON.parse(raw));}}catch(e){S=null}
  if(!S) S=defaultState();
  try{const ui=JSON.parse(localStorage.getItem(LS_UI)||'{}'); if(ui.mode) U.mode=ui.mode; if(ui.tool) U.tool=ui.tool;}catch(e){}
}
let saveT=null;
function save(){
  try{localStorage.setItem(LS,JSON.stringify(S));setSaved('Gespeichert ✓')}catch(e){setSaved('⚠︎ Nicht gespeichert (Speicher voll/gesperrt)')}
}
function saveUI(){try{localStorage.setItem(LS_UI,JSON.stringify({mode:U.mode,tool:U.tool}))}catch(e){}}
function setSaved(t){const el=$('#saveState'); if(el) el.textContent=t}
function persist(){setSaved('Speichert …');clearTimeout(saveT);saveT=setTimeout(save,300)}

/* Änderungen mit Rückgängig-Verlauf */
function change(fn,key){
  const before=JSON.stringify(S);
  fn();
  const after=JSON.stringify(S);
  if(before===after) return;
  const now=Date.now();
  if(!(key&&key===lastKey&&now-lastT<1500)){undo.push(before); if(undo.length>80) undo.shift();}
  lastKey=key||null; lastT=now; redo=[];
  persist(); render();
}
function pushUndo(before){undo.push(before);if(undo.length>80)undo.shift();redo=[];lastKey=null;persist();}
function doUndo(){if(!undo.length)return;redo.push(JSON.stringify(S));S=migrate(JSON.parse(undo.pop()));lastKey=null;persist();render();toast('Rückgängig')}
function doRedo(){if(!redo.length)return;undo.push(JSON.stringify(S));S=migrate(JSON.parse(redo.pop()));lastKey=null;persist();render();toast('Wiederholt')}

const cls=()=>S.classes.find(c=>c.id===S.activeClass)||S.classes[0];
const plan=()=>{const c=cls();return c.plans.find(p=>p.id===c.activePlan)||c.plans[0]};
const stuById=(c,id)=>c.students.find(s=>s.id===id);
const SZ=p=>SIZES[p.size]||SIZES.m;
const levelIdx=l=>S.settings.levels.indexOf(l);
const levelColor=l=>{const i=levelIdx(l);return i<0?null:LEVEL_COLORS[i%LEVEL_COLORS.length]};
function hexRgba(hex,a){const n=parseInt(String(hex).replace('#',''),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}

/* ---------- Geometrie ---------- */
function normRot(r){r=r%360;if(r<0)r+=360;return r}
function quad(rot){const r=normRot(rot);const k=Math.round(r/90);return {q:((k%4)+4)%4,resid:r-90*k}}
function vi(it,p){ // Ansicht: Lehrkraft (Tafel oben) oder Klasse (Tafel unten)
  if(S.settings.persp!=='class') return it;
  return Object.assign({},it,{x:p.W-it.x,y:p.H-it.y,rot:normRot(it.rot+180)});
}
function geom(it,p){
  const [sw,sh]=SZ(p);
  if(it.kind!=='table'){
    const {q,resid}=quad(it.rot);
    const w=q%2?it.h:it.w, h=q%2?it.w:it.h;
    return {w,h,rot:resid,seats:[],q};
  }
  if(it.round){
    const n=it.round, D=Math.max(sw,sh)*(n<=4?1.1:1.35);
    const Rs=Math.max(D/2+Math.min(sw,sh)/2+6,(Math.max(sw,sh)+8)/(2*Math.sin(Math.PI/n)))*1.1;
    const w=2*(Rs+sw/2)+4, h=2*(Rs+sh/2)+4, seats=[];
    for(let i=0;i<n;i++){const a=(it.rot-90+i*360/n)*Math.PI/180;seats.push({i,x:w/2+Rs*Math.cos(a)-sw/2,y:h/2+Rs*Math.sin(a)-sh/2,w:sw,h:sh})}
    return {w,h,rot:0,seats,round:true,D};
  }
  const {q,resid}=quad(it.rot);
  const cols=it.cols||1, rows=it.rows||1;
  const C=q%2?rows:cols, R=q%2?cols:rows;
  const w=C*sw+(C-1)*GAP+2*PAD, h=R*sh+(R-1)*GAP+2*PAD, seats=[];
  for(let i=0;i<cols*rows;i++){

function seatCount(it){return it.kind!=='table'?0:(it.round||(it.cols||1)*(it.rows||1))}
/* alle Plätze mit Mittelpunkt in Modell-Koordinaten (Lehrkraft-Sicht) */
function allSeats(p){
  const out=[];
  p.items.forEach((it,ti)=>{
    if(it.kind!=='table') return;
    const g=geom(it,p), a=g.rot*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
    g.seats.forEach(s=>{
      const lx=s.x+s.w/2-g.w/2, ly=s.y+s.h/2-g.h/2;
      out.push({key:it.id+':'+s.i,item:it,ti,i:s.i,x:it.x+lx*ca-ly*sa,y:it.y+lx*sa+ly*ca});
    });
  });
  return out;
}
function frontPoint(p){
  const b=p.items.find(it=>it.kind==='obj'&&(it.type==='board'||it.type==='whiteboard'||it.type==='screen'));
  return b?{x:b.x,y:b.y}:{x:p.W/2,y:0};
}
/* Lesereihenfolge: Tische zeilenweise (von der Tafel aus), innerhalb des Tisches nach Platznummer */
function readingOrder(p){
  const seats=allSeats(p), f=frontPoint(p), flip=f.y>p.H/2;
  const band=it=>Math.round((flip?p.H-it.y:it.y)/70);
  return seats.sort((a,b)=>{
    if(a.item!==b.item){const ba=band(a.item),bb=band(b.item);if(ba!==bb)return ba-bb;return flip?b.item.x-a.item.x:a.item.x-b.item.x}
    return a.i-b.i;

}
function seatNumbers(p){const m={};readingOrder(p).forEach((s,i)=>m[s.key]=i+1);return m}
function cleanSeating(p,c){
  const valid=new Set(allSeats(p).map(s=>s.key)), ids=new Set(c.students.map(s=>s.id)), seen=new Set();
  Object.keys(p.seating).forEach(k=>{const v=p.seating[k];if(!valid.has(k)||!ids.has(v)||seen.has(v))delete p.seating[k];else seen.add(v)});
}
function keyOf(p,stuId){for(const k in p.seating) if(p.seating[k]===stuId) return k;return null}
function placeStudent(p,stuId,key){
  const old=keyOf(p,stuId), occ=p.seating[key];
  if(old===key) return;
  if(old) delete p.seating[old];
  p.seating[key]=stuId;
  if(occ&&occ!==stuId&&old) p.seating[old]=occ;
}
function setPlanSize(p,size){
  if(!SIZES[size]||p.size===size) return;
  const [ow,oh]=SZ(p),[nw,nh]=SIZES[size], fx=nw/ow, fy=nh/oh, oW=p.W, oH=p.H;
  const W=Math.round(p.W*fx/20)*20, H=Math.round(p.H*fy/20)*20;
  p.items.forEach(it=>{
    const wall=it.kind==='obj'&&(it.type==='door'||it.type==='window');
    it.x=wall&&it.x<40?it.x:wall&&it.x>oW-40?W-(oW-it.x):Math.round(it.x*fx);
    it.y=wall&&it.y<40?it.y:wall&&it.y>oH-40?H-(oH-it.y):Math.round(it.y*fy);
    if(it.kind==='obj'&&it.type==='carpet'){it.w=Math.round(it.w*fx);it.h=Math.round(it.h*fy)}

function fitRoom(p){
  let maxX=0,maxY=0;
  p.items.forEach(it=>{const g=geom(it,p);const r=Math.hypot(g.w,g.h)/2;maxX=Math.max(maxX,it.x+(g.rot?r:g.w/2));maxY=Math.max(maxY,it.y+(g.rot?r:g.h/2))});
  p.W=Math.max(600,Math.ceil((maxX+40)/20)*20); p.H=Math.max(400,Math.ceil((maxY+40)/20)*20);
}

/* ---------- Anordnungs-Vorlagen ---------- */
function mkTable(t,x,y,rot){const d=TABLE_TYPES.find(a=>a.type===t);return {id:uid(),kind:'table',type:t,cols:d.cols||0,rows:d.rows||0,round:d.round||0,x,y,rot:rot||0,locked:false,label:''}}
function mkObj(t,x,y,rot,w,h){const d=OBJ_TYPES[t];return {id:uid(),kind:'obj',type:t,x,y,rot:rot||0,w:w||d.w,h:h||d.h,label:'',locked:false}}
const TEMPLATES=[
  {k:'rows',label:'Reihen (Zweiertische)'},
  {k:'exam',label:'Prüfung (Einzeltische)'},
  {k:'u',label:'U-Form'},
  {k:'uu',label:'Doppel-U'},
  {k:'g4',label:'4er-Gruppentische'},
  {k:'g6',label:'6er-Gruppentische'},
  {k:'fish',label:'Fischgräte'},
  {k:'circle',label:'Stuhlkreis'},
  {k:'empty',label:'Leerer Raum'}
];
function buildTemplate(kind,n,p){
  const [sw,sh]=SZ(p), tw=c=>c*sw+(c-1)*GAP+2*PAD, th=r=>r*sh+(r-1)*GAP+2*PAD;
  n=Math.max(1,n|0); const items=[]; let W=0,H=0; // Inhalt bei (0,0)
  const grid=(type,cnt,per,w,h,gx,gy,rotFn)=>{for(let i=0;i<cnt;i++){const r=Math.floor(i/per),c=i%per;items.push(mkTable(type,c*(w+gx)+w/2,r*(h+gy)+h/2,rotFn?rotFn(c,r):0))}const rowsN=Math.ceil(cnt/per),pc=Math.min(per,cnt);W=pc*w+(pc-1)*gx;H=rowsN*h+(rowsN-1)*gy;};
  const uShape=(s,b,ox,oy)=>{
    const vw=tw(1),vh=th(2),hw=tw(2),hh=th(1),g=8; // senkrechte Zweiertische: Karten bleiben aufrecht
    for(let i=0;i<s;i++){items.push(mkTable('t2',ox+vw/2,oy+vh/2+i*(vh+g),90))}
    const by=oy+s*(vh+g)+hh/2;
    for(let j=0;j<b;j++){items.push(mkTable('t2',ox+vw+g+hw/2+j*(hw+g),by,0))}
    const rx=ox+vw+g+b*(hw+g)+vw/2;
    for(let i=0;i<s;i++){items.push(mkTable('t2',rx,oy+vh/2+i*(vh+g),270))}
    return {w:2*vw+2*g+b*hw+(b-1)*g,h:s*(vh+g)+hh};
  };
  if(kind==='rows'){const t=Math.ceil(n/2),per=t<=4?2:t<=12?3:4;grid('t2',t,per,tw(2),th(1),Math.round(sw*.6),Math.round(sh*.75))}
  else if(kind==='exam'){const per=clamp(Math.ceil(Math.sqrt(n*1.5)),2,8);grid('t1',n,per,tw(1),th(1),Math.round(sw*.55),Math.round(sh*.65))}
  else if(kind==='g4'){const t=Math.ceil(n/4),per=t<=4?2:3;grid('g4',t,per,tw(2),th(2),Math.round(sw*.8),Math.round(sh*1.1))}
  else if(kind==='g6'){const t=Math.ceil(n/6),per=t<=2?2:3;grid('g6',t,per,tw(3),th(2),Math.round(sw*.75),Math.round(sh*1.1))}
  else if(kind==='fish'){const t=Math.ceil(n/2);grid('t2',t,2,tw(2),th(1),Math.round(sw*1.3),Math.round(sh*1.05),c=>c===0?340:20)}
  else if(kind==='u'){const t=Math.max(3,Math.ceil(n/2));const b=Math.max(1,Math.round(t*.34));const s=Math.max(1,Math.ceil((t-b)/2));const r=uShape(s,b,0,0);W=r.w;H=r.h}
  else if(kind==='uu'){
    const T=Math.max(6,Math.ceil(n/2));let best=null;
    for(let b1=3;b1<=9;b1++)for(let s1=2;s1<=9;s1++){const s2=Math.max(1,s1-1),b2=b1-2;const tot=2*s1+b1+2*s2+b2;if(tot<T)continue;const sc=(tot-T)*10+Math.abs(b1-s1-1);if(!best||sc<best.sc)best={s1,b1,s2,b2,sc}}
    if(!best) best={s1:5,b1:6,s2:4,b2:4};
    const o=uShape(best.s1,best.b1,0,0);
    const vw=tw(1),g=8,hw=tw(2), interior=best.b1*hw+(best.b1-1)*g, innerW=2*vw+2*g+best.b2*hw+(best.b2-1)*g;
    uShape(best.s2,best.b2,vw+g+(interior-innerW)/2,0); W=o.w;H=o.h;
  }
  else if(kind==='circle'){
    const R=Math.max(200,n*(Math.max(sw,sh)+30)/(2*Math.PI));
    for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;items.push(mkTable('t1',R+tw(1)/2+R*Math.cos(a),R+th(1)/2+R*Math.sin(a),0))}
    W=2*R+tw(1);H=2*R+th(1);
    items.unshift(mkObj('carpet',W/2,H/2,0,Math.round(R*1.25),Math.round(R*1.25)));
  }
  return {items,W,H};
}
function applyTemplateTo(p,kind,n,withRoom){
  const t=buildTemplate(kind,n,p), M=80, top=withRoom?170:70;
  const W=Math.max(Math.ceil((t.W+2*M)/20)*20,kind==='empty'?1100:820);
  const ox=(W-t.W)/2;
  t.items.forEach(it=>{it.x=Math.round(it.x+ox);it.y=Math.round(it.y+top)});
  let H=Math.max(Math.ceil((top+t.H+M+20)/20)*20,kind==='empty'?800:560);
  const room=[];
  if(withRoom){
    room.push(mkObj('board',W/2,36));
    room.push(mkObj('desk',Math.min(W-130,W/2+330),110));
    room.push(mkObj('door',13,H-110,90));
    room.push(mkObj('window',W-11,Math.round(H*.32),90));
    room.push(mkObj('window',W-11,Math.round(H*.7),90));
  }
  const carpets=t.items.filter(i=>i.kind==='obj'), tables=t.items.filter(i=>i.kind!=='obj');

/* ---------- Automatisch setzen ---------- */
function neighborsMap(p){
  const seats=allSeats(p), [sw,sh]=SZ(p), th=Math.max(sw,sh)*1.25, nb={};
  seats.forEach(a=>{nb[a.key]=[];seats.forEach(b=>{if(a!==b&&Math.hypot(a.x-b.x,a.y-b.y)<=th)nb[a.key].push(b.key)})});
  return nb;
}
function avoids(c,a,b){if(!a||!b)return false;const A=stuById(c,a),B=stuById(c,b);return !!((A&&A.avoid.includes(b))||(B&&B.avoid.includes(a)))}
function conflictCount(c,p,nb){let n=0;for(const k in p.seating){const a=p.seating[k];(nb[k]||[]).forEach(k2=>{if(k<k2&&avoids(c,a,p.seating[k2]))n++})}return n}
function byLevelBuckets(list){
  const L=S.settings.levels, buckets=L.map(()=>[]), rest=[];
  list.forEach(s=>{const i=L.indexOf(s.level);(i<0?rest:buckets[i]).push(s)});
  buckets.forEach(shuffle);shuffle(rest);
  return buckets.concat([rest]);
}
function autoSeat(c,p,opt){
  cleanSeating(p,c);
  if(!opt.onlyEmpty) p.seating={};
  const order=readingOrder(p), f=frontPoint(p);
  let free=order.filter(s=>!p.seating[s.key]);
  const seated=new Set(Object.values(p.seating));
  let todo=c.students.filter(s=>!seated.has(s.id));
  if(opt.skipAbsent) todo=todo.filter(s=>!s.absent);
  if(!free.length||!todo.length) return {placed:0,left:todo.length};
  // Vorne-Wünsche zuerst an die vordersten freien Plätze
  const fronts=shuffle(todo.filter(s=>s.front));
  if(fronts.length){
    const byDist=free.slice().sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y));
    fronts.forEach(s=>{const seat=byDist.shift();if(seat){p.seating[seat.key]=s.id;free=free.filter(x=>x!==seat)}});
    todo=todo.filter(s=>!s.front);
  }
  let seq;
  if(opt.mode==='alpha') seq=todo.slice().sort((a,b)=>a.name.localeCompare(b.name,'de'));
  else if(opt.mode==='mixed'){const bk=byLevelBuckets(todo);seq=[];let any=true;while(any){any=false;bk.forEach(b=>{if(b.length){seq.push(b.shift());any=true}})}}
  else if(opt.mode==='same'){seq=[].concat.apply([],byLevelBuckets(todo))}
  else seq=shuffle(todo.slice());
  seq.forEach((s,i)=>{if(free[i]) p.seating[free[i].key]=s.id});
  // Konflikte („nicht neben“) durch Tauschen auflösen
  const nb=neighborsMap(p); let cc=conflictCount(c,p,nb);
  const movable=()=>Object.keys(p.seating).filter(k=>{const s=stuById(c,p.seating[k]);return s&&!s.front});
  for(let it=0;it<400&&cc>0;it++){
    const keys=movable(); if(keys.length<2) break;
    const bad=keys.filter(k=>(nb[k]||[]).some(k2=>avoids(c,p.seating[k],p.seating[k2])));
    if(!bad.length) break;
    const k1=bad[Math.floor(Math.random()*bad.length)], k2=keys[Math.floor(Math.random()*keys.length)];
    if(k1===k2) continue;
    const a=p.seating[k1];p.seating[k1]=p.seating[k2];p.seating[k2]=a;
    const n2=conflictCount(c,p,nb);
    if(n2<=cc&&(opt.mode==='random'||n2<cc)) cc=n2; else {const b=p.seating[k1];p.seating[k1]=p.seating[k2];p.seating[k2]=b}
  }
  return {placed:Math.min(seq.length,free.length)+fronts.length,left:Math.max(0,seq.length-free.length),conflicts:cc};
}

/* ---------- Karten-Inhalt (gemeinsam für Bildschirm und Export) ---------- */
function fieldsOn(){
  const st=S.settings;
  if(st.beamer) return {};
  const d=DISPLAY[st.display]||DISPLAY.compact;
  return d.f||st.fields;
}
function fmtName(n){
  n=String(n||'').trim(); const f=S.settings.nameFmt, parts=n.split(/\s+/);
  if(f==='first') return parts[0];
  if(f==='firstInit') return parts.length>1?parts[0]+' '+parts[parts.length-1][0]+'.':parts[0];
  if(f==='init') return parts.map(x=>x[0]||'').join('').toUpperCase();
  return n;
}
function groupMap(p){const m={};if(p.groups&&p.groups.list)p.groups.list.forEach((g,i)=>g.ids.forEach(id=>m[id]=i));return m}
function cardInfo(s,p,gm){
  const F=fieldsOn(), st=S.settings, gi=gm?gm[s.id]:undefined;
  let color=null;
  if(!st.beamer||st.colorBy==='group'){
    if(st.colorBy==='level') color=levelColor(s.level);
    else if(st.colorBy==='group'&&gi!=null&&p.groups&&p.groups.show) color=GROUP_COLORS[gi%GROUP_COLORS.length];

  }
  return {
    name:fmtName(s.name), color, absent:s.absent,
    level:F.level&&s.level?s.level:'', levelColor:levelColor(s.level)||'#7A8699',
    smiley:F.smiley?s.smiley:'', points:F.points&&s.points?s.points:0,
    tags:F.tags?s.tags:[], note:F.note?s.note:'', mark:F.mark&&s.color&&st.colorBy!=='mark'?s.color:'',
    group:F.group&&gi!=null&&p.groups&&p.groups.show?{i:gi,name:p.groups.list[gi].name}:null,
    only:!(F.level&&s.level)&&!(F.points&&s.points)&&!(F.tags&&s.tags.length)&&!(F.note&&s.note)&&!(F.group&&gi!=null&&p.groups&&p.groups.show)
  };
}
function cardHTML(s,p,gm){
  const ci=cardInfo(s,p,gm);

  if(ci.level) meta+=`<span class="c-lv" style="background:${ci.levelColor}">${esc(ci.level)}</span>`;
  if(ci.group) meta+=`<span class="c-grp" style="background:${GROUP_COLORS[ci.group.i%GROUP_COLORS.length]}">G${ci.group.i+1}</span>`;
  if(ci.points) meta+=`<span class="c-pt${ci.points<0?' neg':''}">${ci.points>0?'+':'−'}${Math.abs(ci.points)}</span>`;
  ci.tags.forEach(t=>meta+=`<span class="c-tag">${esc(t)}</span>`);
  return `<div class="card${ci.only?' only':''}${ci.absent?' abs':''}" style="${style}">`+
    `<div class="c-top"><span class="c-name">${esc(ci.name)}</span>${ci.smiley?`<span class="c-sm">${esc(ci.smiley)}</span>`:''}</div>`+

function tableIcon(t){
  const d=TABLE_TYPES.find(a=>a.type===t);
  if(d.round){let s='<svg viewBox="0 0 34 22"><circle cx="17" cy="11" r="6" fill="var(--wood)" stroke="var(--woodline)"/>';for(let i=0;i<d.round;i++){const a=(-90+i*360/d.round)*Math.PI/180;s+=`<rect x="${17+9.5*Math.cos(a)-2.5}" y="${11+9.5*Math.sin(a)-2}" width="5" height="4" rx="1" fill="var(--acc)"/>`}return s+'</svg>'}
  const cw=Math.min(7,30/d.cols), ch=Math.min(7,18/d.rows), w=d.cols*cw+2, h=d.rows*ch+2, x0=(34-w)/2, y0=(22-h)/2;
  let s=`<svg viewBox="0 0 34 22"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="2" fill="var(--wood)" stroke="var(--woodline)"/>`;
  for(let r=0;r<d.rows;r++)for(let c=0;c<d.cols;c++)s+=`<rect x="${x0+1+c*cw+.8}" y="${y0+1+r*ch+.8}" width="${cw-1.6}" height="${ch-1.6}" rx="1" fill="var(--acc)" opacity=".75"/>`;
  return s+'</svg>';
}

/* ---------- Popover & Dialoge ---------- */
let popEl=null,popAnchor=null;
function closePop(){if(popEl){popEl.remove();popEl=null;popAnchor=null;document.removeEventListener('pointerdown',popOutside,true)}}
function popOutside(e){if(popEl&&!popEl.contains(e.target)&&!(popAnchor&&popAnchor.contains(e.target)))closePop()}
function openPop(anchor,html,mount){
  if(popEl&&popAnchor===anchor){closePop();return}
  closePop();const el=document.createElement('div');el.className='pop';el.innerHTML=html;document.body.appendChild(el);
  const r=anchor.getBoundingClientRect();let left=clamp(r.left,10,innerWidth-el.offsetWidth-10),top=r.bottom+6;
  if(top+el.offsetHeight>innerHeight-10)top=Math.max(10,r.top-el.offsetHeight-6);
  el.style.left=left+'px';el.style.top=top+'px';popEl=el;popAnchor=anchor;
  mount&&mount(el);setTimeout(()=>document.addEventListener('pointerdown',popOutside,true),0);
}
function modal(o){
  const ov=document.createElement('div');ov.className='ovl';
  ov.innerHTML=`<div class="dlg${o.wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="dlg-h"><h2>${esc(o.title)}</h2><button class="btn icon ghost" data-x aria-label="Schließen">✕</button></div><div class="dlg-b">${o.body||''}</div>${o.foot!==false?`<div class="dlg-f">${o.foot||'<button class="btn pri" data-x>Fertig</button>'}</div>`:''}</div>`;
  document.body.appendChild(ov);closePop();
  const kd=e=>{if(e.key==='Escape'&&$$('.ovl').pop()===ov){e.stopPropagation();close()}};
  const close=()=>{if(!ov.isConnected)return;ov.remove();document.removeEventListener('keydown',kd,true);o.onClose&&o.onClose()};
  let down=false;ov.addEventListener('pointerdown',e=>{down=e.target===ov});ov.addEventListener('click',e=>{if(e.target===ov&&down)close();down=false});
  $$('[data-x]',ov).forEach(b=>b.addEventListener('click',close));document.addEventListener('keydown',kd,true);
  const dlg=$('.dlg',ov);o.mount&&o.mount(dlg,close);
  const f=$('[autofocus]',dlg);if(f)setTimeout(()=>f.focus(),30);
  return {el:dlg,close};
}
function confirmDlg(title,text,ok,danger){return new Promise(res=>{let r=false;modal({title,body:`<p style="margin:0">${text}</p>`,foot:`<button class="btn" data-x>Abbrechen</button><button class="btn ${danger?'danger':'pri'}" id="cOk">${esc(ok||'OK')}</button>`,mount:(d,close)=>{$('#cOk',d).onclick=()=>{r=true;close()};setTimeout(()=>$('#cOk',d).focus(),30)},onClose:()=>res(r)})})}
function promptDlg(title,label,value){return new Promise(res=>{let r=null;modal({title,body:`<div class="fld"><label for="pIn">${esc(label)}</label><input type="text" id="pIn" value="${esc(value||'')}" autofocus></div>`,foot:`<button class="btn" data-x>Abbrechen</button><button class="btn pri" id="pOk">OK</button>`,mount:(d,close)=>{const go=()=>{r=$('#pIn',d).value.trim();close()};$('#pOk',d).onclick=go;$('#pIn',d).addEventListener('keydown',e=>{if(e.key==='Enter')go()})},onClose:()=>res(r)})})}

function viewCenter(){
  const vp=$('#vp'),p=plan(),room=$('#room').getBoundingClientRect(),r=vp.getBoundingClientRect();
  let x=(r.left+r.width/2-room.left)/U.zoom, y=(r.top+r.height/2-room.top)/U.zoom;
  x=clamp(x,60,p.W-60);y=clamp(y,60,p.H-60);
  if(S.settings.persp==='class'){x=p.W-x;y=p.H-y}
  return {x,y};
}
function snapItem(it,p){
  if(!S.settings.snap) return;
  const g=geom(it,p), G=S.settings.grid;
  it.x=Math.round((it.x-g.w/2)/G)*G+g.w/2; it.y=Math.round((it.y-g.h/2)/G)*G+g.h/2;
}
function addItem(it){
  const p=plan(), c=viewCenter(); it.x=c.x; it.y=c.y;
  for(let k=0;k<12&&p.items.some(o=>Math.abs(o.x-it.x)<20&&Math.abs(o.y-it.y)<20);k++){it.x+=30;it.y+=30}
  snapItem(it,p);

  if(U.sideOpen&&innerWidth<=860){U.sideOpen=false;$('#side').classList.remove('open')}

function propAction(a,val){

  if(a==='dup'){const n=JSON.parse(JSON.stringify(it));n.id=uid();n.x+=40;n.y+=40;n.locked=false;snapItem(n,p);change(()=>{p.items.push(n);U.sel=n.id});return}
  change(()=>{
    if(a==='lock') it.locked=!it.locked;

    else if(a==='cols-'||a==='cols+'){it.cols=clamp(it.cols+(a.endsWith('+')?1:-1),1,8);it.type='custom'}

function onMove(e){

  if(D.type==='move'){

    const el=$(`#room .it[data-id="${it.id}"]`); if(el){const v=vi(it,p),g=geom(v,p);el.style.left=(v.x-g.w/2)+'px';el.style.top=(v.y-g.h/2)+'px'}
  } else if(D.type==='resize'){

}

/* =========================================================
   Gruppen
   ========================================================= */
function makeGroups(c,o){
  let list=c.students.filter(s=>!o.excludeAbsent||!s.absent);
  const N=list.length; if(!N) return [];
  let k=o.by==='count'?clamp(o.n|0,1,N):clamp(Math.round(N/Math.max(1,o.n|0)),1,N);
  const groups=Array.from({length:k},()=>[]);
  if(o.dist==='mixed'){
    const seq=[].concat.apply([],byLevelBuckets(list));
    seq.forEach((s,i)=>{const r=Math.floor(i/k),j=i%k;groups[r%2?k-1-j:j].push(s)});
  } else if(o.dist==='same'){
    const seq=[].concat.apply([],byLevelBuckets(list)), base=Math.floor(N/k), extra=N%k; let pos=0;
    for(let g=0;g<k;g++){const n=base+(g<extra?1:0);groups[g]=seq.slice(pos,pos+n);pos+=n}
  } else { shuffle(list).forEach((s,i)=>groups[i%k].push(s)); }
  // „nicht zusammen“ beachten
  if(o.avoid){
    const cnt=()=>groups.reduce((a,g)=>{let n=0;for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)if(avoids(c,g[i].id,g[j].id))n++;return a+n},0);
    let cc=cnt();
    for(let it=0;it<600&&cc>0;it++){
      const a=Math.floor(Math.random()*k), b=Math.floor(Math.random()*k); if(a===b||!groups[a].length||!groups[b].length) continue;
      const i=Math.floor(Math.random()*groups[a].length), j=Math.floor(Math.random()*groups[b].length);
      if(o.dist!=='random'&&groups[a][i].level!==groups[b][j].level&&it<400) continue;
      const t=groups[a][i];groups[a][i]=groups[b][j];groups[b][j]=t;
      const n=cnt(); if(n<=cc) cc=n; else {const t2=groups[a][i];groups[a][i]=groups[b][j];groups[b][j]=t2}
    }
  }
  const nm=GROUP_NAMES[o.names]||GROUP_NAMES.num;
  return groups.map((g,i)=>({name:nm(i),ids:g.map(s=>s.id)}));
}

function groupsToPlan(){
  const c=cls(), src=plan(), gl=JSON.parse(JSON.stringify(src.groups.list));
  const p=newPlan('Gruppenarbeit '+new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}));p.size=src.size;
  const [sw,sh]=SZ(p), tw=cc=>cc*sw+(cc-1)*GAP+2*PAD, th=r=>r*sh+(r-1)*GAP+2*PAD;
  const types=gl.map(g=>g.ids.length<=2?'t2':g.ids.length<=4?'g4':g.ids.length<=6?'g6':'g8');
  const maxC=Math.max.apply(null,types.map(t=>TABLE_TYPES.find(a=>a.type===t).cols)),per=gl.length<=4?2:3, cw=tw(maxC), ch=th(2), gx=Math.round(sw*.7), gy=Math.round(sh*1.1);
  const W=Math.max(820,per*cw+(per-1)*gx+160), rowsN=Math.ceil(gl.length/per), H=Math.max(560,170+rowsN*ch+(rowsN-1)*gy+100);
  p.W=Math.ceil(W/20)*20;p.H=Math.ceil(H/20)*20;
  p.items.push(mkObj('board',p.W/2,36),mkObj('desk',Math.min(p.W-130,p.W/2+330),110),mkObj('door',13,p.H-110,90));
  let over=0;
  gl.forEach((g,i)=>{const r=Math.floor(i/per),col=i%per, pc=Math.min(per,gl.length-r*per), rowW=pc*cw+(pc-1)*gx, x0=(p.W-rowW)/2;
    const t=mkTable(types[i],Math.round(x0+col*(cw+gx)+cw/2),Math.round(170+r*(ch+gy)+ch/2));p.items.push(t);
    g.ids.forEach((id,j)=>{if(j<seatCount(t))p.seating[t.id+':'+j]=id;else over++});});
  p.groups={list:gl,show:true};
  change(()=>{c.plans.push(p);c.activePlan=p.id;if(S.settings.colorBy!=='group')S.settings.colorBy='group'});
  $$('.ovl').forEach(o=>o.remove());
  U.fit=true;fitZoom();renderRoom();
  toast(over?`Neuer Plan angelegt – ${over} Personen passten nicht an die Tische`:'Neuer Sitzplan „'+p.name+'“ angelegt');
}
function copyText(t){
  const done=()=>toast('In die Zwischenablage kopiert');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Kopieren nicht möglich')}ta.remove()}
}

  let s=`<svg viewBox="${-pad} ${-pad} ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  t.items.forEach(it=>{const g=geom(it,p);
    if(it.kind==='obj'){s+=`<ellipse cx="${it.x}" cy="${it.y}" rx="${it.w/2}" ry="${it.h/2}" fill="var(--panel)" stroke="var(--line)"/>`;return}

}

function parseNames(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/^﻿/,'').trim()).filter(Boolean); if(!lines.length) return [];
  const L=S.settings.levels.map(x=>x.toUpperCase()), lv=v=>{const i=L.indexOf(String(v||'').trim().toUpperCase());return i<0?'':S.settings.levels[i]};
  const f=lines[0]; const sep=f.includes('\t')?'\t':f.includes(';')?';':(f.includes(',')&&lines.every(l=>l.split(',').length===f.split(',').length)?',':null);
  const perLine=l=>{const m=l.match(/^(.*?)\s*[\t;,]\s*([^\t;,]+)$/);if(m&&lv(m[2]))return {name:m[1].trim(),level:lv(m[2])};return {name:l.replace(/[\t;]+/g,' ').replace(/\s+/g,' ').trim(),level:''}};
  if(!sep) return lines.map(perLine).filter(x=>x.name);
  const rows=lines.map(l=>l.split(sep).map(x=>x.trim().replace(/^"(.*)"$/,'$1')));
  const h=rows[0].map(x=>x.toLowerCase()), fi=h.findIndex(x=>/^vorname|first/.test(x)), li=h.findIndex(x=>/^nachname|^familienname|last|surname/.test(x)), ni=h.findIndex(x=>/^name$|^schüler|^lernende|^pseudonym/.test(x)), vi2=h.findIndex(x=>/niveau|kurs|level|stufe/.test(x));
  if(fi>=0||li>=0||ni>=0||vi2>=0){
    return rows.slice(1).map(r=>({name:(fi>=0?[r[fi],li>=0?r[li]:''].join(' ').trim():ni>=0?r[ni]:r[0])||'',level:vi2>=0?lv(r[vi2]):''})).filter(x=>x.name);
  }
  return lines.map(l=>{const m=l.match(/^(.*?)\s*[\t;,]\s*([^\t;,]+)$/);if(m&&lv(m[2]))return {name:m[1].trim(),level:lv(m[2])};return {name:l.replace(/[\t;]+/g,' ').replace(/\s+/g,' ').trim(),level:''}}).filter(x=>x.name);
}

const CW=2480, CH=1712; // A4 quer (Seitenverhältnis passend zu 281×194 mm)
const FONT='"Atkinson Hyperlegible",Arial,sans-serif', HFONT='"Bricolage Grotesque","Atkinson Hyperlegible",Arial,sans-serif';
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

}
function drawCard(ctx,x,y,w,h,s,p,gm){

    const lines=wrapLines(ctx,ci.name,pw-smW,2), lh=fs*1.12, ty=y+(h-lines.length*lh)/2;
    ctx.textAlign='center';lines.forEach((l,i)=>ctx.fillText(l,x+stripe/2+(w-smW)/2,ty+i*lh));ctx.textAlign='left';
    if(ci.smiley){ctx.font=`${fs}px ${FONT}`;ctx.fillText(ci.smiley,x+w-smW-h*.03,y+(h-fs)/2)}

    if(ci.smiley){ctx.font=`${fs}px ${FONT}`;ctx.fillText(ci.smiley,x+w-smW-h*.02,cy)}
    cy+=fs*1.18;

    if(ci.points) chips.push({t:(ci.points>0?'+':'−')+Math.abs(ci.points),bg:ci.points>0?'#E5ECFF':'#FDE8EA',fg:ci.points>0?'#2E5BD8':'#C2353F'});

function drawItemCanvas(ctx,it,p,c,nums,gm){

    const d=OBJ_TYPES[it.type]||OBJ_TYPES.text;

      if(d.round){ctx.beginPath();ctx.ellipse(g.w/2,g.h/2,g.w/2,g.h/2,0,0,Math.PI*2)}else rr(ctx,0,0,g.w,g.h,6);

        if(S.settings.showSeatNo&&nums[key]){ctx.font=`800 ${se.h*.22}px ${FONT}`;ctx.fillStyle='#C4AB82';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nums[key],se.x+se.w/2,se.y+se.h/2);ctx.textAlign='left'}}

function pageCanvas(){const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;const ctx=cv.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,CW,CH);return {cv,ctx}}

  ctx.textAlign='right';ctx.font=`700 34px ${FONT}`;ctx.fillStyle='#16223A';ctx.fillText(new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}),CW-70,112);ctx.textAlign='left';

function pageFooter(ctx,txt){ctx.font=`400 24px ${FONT}`;ctx.fillStyle='#8A95A8';ctx.textAlign='right';ctx.fillText(txt||'Sitzplan-Studio · buildspaceos.de',CW-70,CH-36);ctx.textAlign='left'}
function renderPlanCanvas(o){

function drawLegend(ctx,c,p,y){

function renderNotesPages(){

function renderGroupsCanvas(){

function isStandaloneIOS(){try{return navigator.standalone===true}catch(e){return false}}

        downloadBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),('Schuelerliste_'+c.name+'_'+stamp).replace(/[^\wäöüÄÖÜß\-]+/g,'_')+'.csv')};
      $('#dNames',d).onclick=()=>{close();openImportNames()};

async function importJSON(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Datei ist keine gültige Sicherung');return false}
  const fresh=c=>{c.id=uid();const idm={};c.students.forEach(s=>{const n=uid();idm[s.id]=n;s.id=n});c.students.forEach(s=>s.avoid=(s.avoid||[]).map(a=>idm[a]).filter(Boolean));c.plans.forEach(p=>{p.id=uid();const im={};(p.items||[]).forEach(it=>{const n=uid();im[it.id]=n;it.id=n});const ns={};for(const k in (p.seating||{})){const [a,b]=k.split(':');if(im[a]&&idm[p.seating[k]])ns[im[a]+':'+b]=idm[p.seating[k]]}p.seating=ns;if(p.groups)p.groups.list.forEach(g=>g.ids=g.ids.map(i=>idm[i]).filter(Boolean))});c.activePlan=c.plans[0]&&c.plans[0].id;c.pool=null;return c};
  if(o&&o.type==='class'&&o.cls){
    const tmp=migrate({classes:[o.cls],settings:S.settings});const c=fresh(tmp.classes[0]);
    (o.levels||[]).forEach(l=>{if(!S.settings.levels.includes(l))S.settings.levels.push(l)});
    change(()=>{S.classes.push(c);S.activeClass=c.id});U.fit=true;fitZoom();renderRoom();toast('Klasse „'+c.name+'“ importiert');return true;
  }
  const data=o&&o.data&&o.data.classes?o.data:(o&&o.classes?o:null);
  if(!data){toast('Unbekanntes Dateiformat');return false}
  const replace=await confirmDlg('Sicherung laden','Die Datei enthält '+data.classes.length+' Klasse(n). <b>Ersetzen</b> löscht die Daten in diesem Browser und lädt die Sicherung. Mit <b>Abbrechen</b> werden die Klassen stattdessen <b>hinzugefügt</b>.','Ersetzen',true);
  const m=migrate(JSON.parse(JSON.stringify(data)));
  change(()=>{if(replace){S=m}else{m.classes.forEach(c=>S.classes.push(fresh(c)));m.settings.levels.forEach(l=>{if(!S.settings.levels.includes(l))S.settings.levels.push(l)})}});
  U.fit=true;fitZoom();renderRoom();toast(replace?'Sicherung geladen':'Klassen hinzugefügt');return true;
}

  $('#bPick').onclick=()=>{U.pickOpen=!U.pickOpen;if(!U.pickOpen)clearPicked();renderPick();renderToolbar()};
  $('#bGroups').onclick=openGroups;
  $('#bClasses').onclick=openClasses;$('#bPlans').onclick=e=>openPlansPop(e.currentTarget);
  $('#zIn').onclick=()=>setZoom(U.zoom*1.2);$('#zOut').onclick=()=>setZoom(U.zoom/1.2);$('#zFit').onclick=()=>{fitZoom();renderRoom()};
  $('#vp').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(U.zoom*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
  $('#clsSel').onchange=e=>{if(e.target.value==='__new'){renderToolbar();openNewClass();return}change(()=>S.activeClass=e.target.value);U.sel=null;U.armed=null;U.lastPick='';U.fit=true;fitZoom();render()};
  $('#planSel').onchange=e=>{if(e.target.value==='__new'){renderToolbar();openPlansPop($('#bPlans'));return}change(()=>cls().activePlan=e.target.value);U.sel=null;U.fit=true;fitZoom();render()};
  $('#sideToggle').onclick=()=>{U.sideOpen=!U.sideOpen;$('#side').classList.toggle('open',U.sideOpen)};
  $('#pickPanel').addEventListener('click',e=>{if(e.target.closest('#pkReset')){cls().pool=null;persist();renderPick(false);toast('Topf wieder voll')}});
  $('#propbar').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b&&b.tagName==='BUTTON')propAction(b.dataset.p)});
  $('#propbar').addEventListener('input',e=>{if(e.target.dataset.p==='label')propAction('label',e.target.value)});
  // Seitenleiste (Delegation)
  const side=$('#side');
  side.addEventListener('click',e=>{
    const t=e.target, c=cls(), p=plan();
    const add=t.closest('[data-add]');
    if(add&&U.mode==='room'){const [k,v]=add.dataset.add.split(':');
      if(k==='table') addItem(mkTable(v,0,0,0));
      else if(k==='obj') addItem(mkObj(v,0,0,0));
      else if(k==='custom'){const it=mkTable('t2',0,0,0);it.type='custom';it.cols=3;it.rows=1;addItem(it);toast('Spalten und Reihen unten einstellen')}
      return}
    const row=t.closest('.srow');
    if(row){const sid=row.dataset.sid; if(t.closest('[data-edit]')){openEditor(sid);return} if(t.closest('[data-arm]')){toggleArm(sid);return}}
    if(t.closest('[data-unabs]')){change(()=>{const s=stuById(c,t.closest('[data-unabs]').dataset.unabs);if(s)s.absent=false});return}
    const id=(t.closest('button')||{}).id;
    if(id==='bTpl') openTemplates();
    else if(id==='bFitRoom'){change(()=>fitRoom(p));fitZoom();renderRoom()}
    else if(id==='bClearRoom'){confirmDlg('Raum leeren?','Alle Tische und Raum-Elemente dieses Plans entfernen? (Rückgängig möglich)','Leeren',true).then(ok=>{if(ok)change(()=>{p.items=[];p.seating={};U.sel=null})})}
    else if(id==='bImport') openImportNames();
    else if(id==='bAuto') openAutoSeat();
    else if(id==='bRotate'){if(!Object.keys(p.seating).length){toast('Noch niemand gesetzt');return}change(()=>{const o=readingOrder(p),vals=o.map(s=>p.seating[s.key]||null);vals.unshift(vals.pop());p.seating={};o.forEach((s,i)=>{if(vals[i])p.seating[s.key]=vals[i]})});toast('Alle sind einen Platz weitergerückt')}
    else if(id==='bUnseat'){confirmDlg('Alle vom Platz nehmen?','Die Platzbelegung dieses Plans wird geleert.','Leeren',true).then(ok=>{if(ok)change(()=>{p.seating={}})})}
    else if(id==='bDisarm'){U.armed=null;renderSide();document.body.classList.remove('armed-on')}
    else if(id==='bPick2'){U.pickOpen=true;renderPick();renderToolbar()}

  side.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();const inp=$('#addName');const v=inp.value.trim();if(!v)return;const m=v.match(/^(.*?)[;,\t]\s*(\S{1,3})$/);const L=S.settings.levels;let name=v,lv='';if(m&&L.map(x=>x.toUpperCase()).includes(m[2].toUpperCase())){name=m[1].trim();lv=L[L.map(x=>x.toUpperCase()).indexOf(m[2].toUpperCase())]}
    change(()=>cls().students.push(newStudent(name,lv)));setTimeout(()=>{const i=$('#addName');if(i)i.focus()},10)}});
  side.addEventListener('change',e=>{const t=e.target,p=plan();
    if(t.id==='swSnap'){S.settings.snap=t.checked;persist();renderRoom()}
    else if(t.id==='gridSel'){S.settings.grid=+t.value;persist();renderRoom()}
    else if(t.id==='sizeSel'){change(()=>setPlanSize(p,t.value));fitZoom();renderRoom()}
    else if(t.id==='roomW'||t.id==='roomH'){const v=clamp(parseInt(t.value,10)||0,300,4000);change(()=>{if(t.id==='roomW')p.W=v;else p.H=v});if(U.fit){fitZoom();renderRoom()}}
  });
  side.addEventListener('input',e=>{if(e.target.id==='stuSearch'){U.search=e.target.value;const pos=e.target.selectionStart;renderSide();const i=$('#stuSearch');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});
  // Tastatur
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select'||$('.ovl')) return;
    const mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo();return}
    if(e.key==='Escape'){closePop();if(U.armed){U.armed=null;renderSide();document.body.classList.remove('armed-on')}else if(U.sel){U.sel=null;renderRoom();renderProp()}return}
    if(U.mode==='room'&&U.sel){
      if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();propAction('del');return}
      if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();propAction('dup');return}
      if(e.key.toLowerCase()==='r'&&!mod){propAction('rot+15');return}
      const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
      if(dirs[e.key]){e.preventDefault();const p=plan(),it=p.items.find(i=>i.id===U.sel);if(!it||it.locked)return;const st=e.shiftKey?1:(S.settings.snap?S.settings.grid:5),fl=S.settings.persp==='class'?-1:1;change(()=>{it.x+=dirs[e.key][0]*st*fl;it.y+=dirs[e.key][1]*st*fl},'nudge'+it.id)}
    }
    if(e.key===' '&&U.pickOpen&&!e.repeat){e.preventDefault();drawPick()}
  });
  let rt=null;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(U.fit){fitZoom();renderRoom()}},120)});
  render(); requestAnimationFrame(()=>{fitZoom();renderRoom()});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderRoom());
  window.addEventListener('beforeunload',()=>{clearTimeout(saveT);save()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveT);save()}});
  window.__sitzplan={get S(){return S},U,render,autoSeat,makeGroups,renderPlanCanvas,renderNotesPages,renderGroupsCanvas,parseNames,importJSON,drawPick,allSeats,applyTemplateTo,fitZoom}; // für Tests
}
init();
})();
