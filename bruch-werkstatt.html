<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruch-Werkstatt</title>
<meta name="description" content="Bruchrechnung ikonisch und symbolisch: Brüche & Größen, Erweitern, Kürzen und alle vier Grundrechenarten mit gleichnamigen und ungleichnamigen Brüchen – mit Beispielen, Übungsaufgaben und Bild-Hilfe.">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<link rel="stylesheet" href="assets/fonts/nunito.css">
<style>
:root{
  --bg:#f4f1ea;--ink:#1f2a3a;--soft:#5d6878;--line:rgba(31,42,58,.16);--card:#fffdf8;--card2:#f1ede3;
  --acc:#2E6099;--accdark:#1f4670;--accink:#fff;--accsoft:rgba(46,96,153,.12);
  --A:#3b7fd9;--Asoft:#cfe1fa;--B:#ef8a1f;--Bsoft:#fde1c2;--R:#2f9e5d;--Rsoft:#cdeeda;--K:#8b4fd1;--C:#0f9aa8;--X:#d6453d;
  --cellline:#1f2a3a;--empty:#ffffff;
  --ok:#2f9e5d;--okbg:#dcf5e5;--bad:#d6453d;--badbg:#fde2df;--warn:#b7791f;--warnbg:#fdf0d5;
  --shadow:0 6px 20px rgba(31,42,58,.10);
  --font:'Nunito',ui-rounded,'SF Pro Rounded','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a24;--ink:#e8edf5;--soft:#9aa6b8;--line:rgba(232,237,245,.16);--card:#1d2532;--card2:#252f3f;
  --acc:#6fa3e6;--accdark:#3f6fae;--accink:#0d1520;--accsoft:rgba(111,163,230,.16);
  --A:#5b9bf0;--Asoft:#24456f;--B:#f5a04a;--Bsoft:#5e3b16;--R:#45c07a;--Rsoft:#1d4b31;--K:#b38af0;--C:#3cc9d6;--X:#ff6b62;
  --cellline:#c9d3e2;--empty:#10161f;
  --okbg:#183c28;--badbg:#4a1d1a;--warnbg:#4a3a14;--warn:#f0c060;
  --shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
.muted{color:var(--soft)}.small{font-size:.88rem}

header.top{display:flex;align-items:center;gap:14px;padding:46px 4px 6px}
.logo{width:58px;height:58px;flex:none}
header h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:900;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--soft);font-size:.98rem}

/* Themen */
.topics{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.topics::-webkit-scrollbar{display:none}
.topic{flex:none;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1rem;white-space:nowrap}
.topic .ti{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--card2);font-weight:900}
.topic[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.topic[aria-pressed=true] .ti{background:rgba(255,255,255,.25)}

.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 12px}
.tabs{display:inline-flex;background:var(--card2);border-radius:999px;padding:4px;gap:4px}
.tabs button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;font-weight:800;color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:800}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.merke{display:flex;gap:12px;align-items:flex-start;background:var(--accsoft);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.merke b.tag{flex:none;background:var(--acc);color:var(--accink);border-radius:10px;padding:2px 10px;font-size:.85rem;margin-top:3px}
.merke>div{flex:1;min-width:0}
.mkintro{margin-bottom:8px}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.mk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.95rem;line-height:1.35}
.mk b{display:block;color:var(--acc);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}

/* Stepper */
.exbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.exrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exchip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:4px 16px 4px 6px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.95rem}
.exchip .exn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--card2);font-size:.85rem;flex:none}
.exchip[aria-pressed=true]{border-color:var(--acc);background:var(--accsoft)}
.exchip[aria-pressed=true] .exn{background:var(--acc);color:var(--accink)}
.exchip .fr{font-size:.92rem}
.tabs .tlab{align-self:center;padding:0 4px 0 12px;font-size:.75rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.viewtabs button{display:inline-flex;align-items:center;gap:7px;padding:0 14px}
.viewtabs svg{flex:none}
.tabs button{white-space:nowrap}
@media (max-width:600px){
  .bar2>.tabs{width:100%;display:flex}
  .bar2>.tabs button{flex:1 1 auto;padding:0 8px;font-size:.92rem}
  .viewtabs .tlab{padding:0 2px 0 8px;font-size:.68rem}
  .viewtabs button{gap:5px}
  .merke{flex-direction:column;gap:8px}
}
.tabs.small{padding:3px}
.tabs.small button{min-height:40px;padding:0 16px;font-size:.95rem}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.split{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.ph .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.stage svg{width:100%;height:auto;display:block}
.say{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--card2);font-weight:600;min-height:52px}
.sym{display:flex;flex-direction:column;gap:12px;font-size:1.35rem;font-weight:700}
.sym .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;border-radius:12px}
.sym .ln.new{background:var(--accsoft);animation:fadeIn .45s ease}
.sym .note{font-size:.85rem;color:var(--soft);font-weight:700;width:100%}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--acc);color:var(--accink);font-weight:900;font-size:1.02rem;box-shadow:0 4px 0 var(--accdark)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accdark)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.warm{background:var(--B);color:#2b1600;box-shadow:0 4px 0 #b4600d}
.btn.green{background:var(--R);color:#fff;box-shadow:0 4px 0 #1e6e3f}

/* Bruch (symbolisch) */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}
.fr>span{padding:0 4px;min-width:1ch;text-align:center}
.fr>span:first-child{border-bottom:3px solid currentColor;padding-bottom:2px}
.fr>span:last-child{padding-top:2px}
.cc{color:var(--C)}.ca{color:var(--A)}.cb{color:var(--B)}.cr{color:var(--R)}.ck{color:var(--K)}.cx{color:var(--X)}
.op{font-weight:900;padding:0 2px}
.mix{display:inline-flex;align-items:center;gap:2px}

/* Üben */
.lvls{display:flex;flex-wrap:wrap;gap:8px}
.lvl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:56px;padding:6px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800}
.lvl span{font-weight:600;font-size:.8rem;color:var(--soft)}
.lvl[aria-pressed=true]{border-color:var(--acc);background:var(--accsoft)}
.score{font-weight:800;color:var(--soft)}
.task{font-size:1.6rem;font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px}
.instr{color:var(--soft);font-weight:700;margin-bottom:6px}
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0;font-size:1.5rem;font-weight:800}
.ansrow .lab{font-size:.95rem;color:var(--soft);font-weight:800;min-width:150px}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin input{width:72px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--empty);text-align:center;font-size:1.4rem;font-weight:800}
.fin .fl{width:84px;height:4px;border-radius:2px;background:var(--ink)}
.numin{width:110px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--empty);text-align:center;font-size:1.4rem;font-weight:800}
input.good{border-color:var(--ok);background:var(--okbg)}
input.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;padding:12px 16px;border-radius:14px;font-weight:700;display:none}
.fb.show{display:block;animation:fadeIn .3s}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb.half{background:var(--warnbg);color:var(--warn)}
.help{margin-top:16px;display:none}
.help.show{display:block;animation:fadeIn .3s}

/* Labor */
.form{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:1.5rem;font-weight:800;margin-bottom:6px}
.form select,.form .sel{height:52px;border-radius:12px;border:2px solid var(--line);background:var(--empty);font-size:1.1rem;font-weight:800;padding:0 10px}
.err{color:var(--bad);font-weight:700;margin-top:8px;min-height:1.4em}

/* SVG */
.cell{stroke:var(--cellline);stroke-width:1}
.thick{stroke:var(--cellline);stroke-width:3;fill:none}
.thin{stroke:var(--cellline);stroke-width:1.2;fill:none;opacity:.75}
.dash{stroke:var(--cellline);stroke-width:1.2;fill:none;opacity:.45;stroke-dasharray:4 4}
.fK{fill:var(--K)}.fC{fill:var(--C)}.txC{fill:var(--C)}.fA{fill:var(--A)}.fB{fill:var(--B)}.fR{fill:var(--R)}.fE{fill:var(--empty)}.fAs{fill:var(--Asoft)}.fBs{fill:var(--Bsoft)}
.tx{fill:var(--ink);font-family:var(--font);font-weight:800}
.txs{fill:var(--soft);font-family:var(--font);font-weight:700}
.txA{fill:var(--A)}.txB{fill:var(--B)}.txR{fill:var(--R)}.txK{fill:var(--K)}.txX{fill:var(--X)}
.stA{stroke:var(--A)}.stB{stroke:var(--B)}.stR{stroke:var(--R)}.stK{stroke:var(--K)}.stX{stroke:var(--X)}
.br{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cross{stroke:var(--X);stroke-width:3;stroke-linecap:round}
.pop{animation:pop .5s ease both}
.grow{animation:grow .7s ease both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dual{display:grid;gap:10px}
.dual>div{min-width:0}
.dual>div+div{border-top:2px dashed var(--line);padding-top:10px}
.vlab{font-weight:800;color:var(--soft);font-size:.85rem;margin-right:2px}
.slidecard{margin-top:16px;padding:14px}
.slrow{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.slrow .slplay{min-width:58px;padding:0 14px}
.slr{flex:1;min-width:180px;-webkit-appearance:none;appearance:none;height:14px;margin:14px 0;border-radius:999px;background:linear-gradient(90deg,var(--B) var(--v,0%),var(--card2) var(--v,0%));border:1px solid var(--line);touch-action:pan-y}
.slr::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:40px;height:40px;border-radius:50%;background:var(--card);border:5px solid var(--B);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:grab}
.slr::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--card);border:5px solid var(--B);cursor:grab}
.sll{font-size:1.25rem;font-weight:800}
.slstage svg{width:100%;height:auto;display:block}
.unitpick{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px}
.unitrow{display:inline-flex;align-items:center;gap:8px}
.cmpbox{display:inline-grid;place-items:center;width:66px;height:60px;border-radius:14px;border:3px dashed var(--line);font-size:1.9rem;font-weight:900;color:var(--acc);margin:0 6px}
.cmpbox.good{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cmpbox.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.cmpbtns{gap:12px}.cmpbtns .btn{min-width:80px;font-size:1.7rem}
.cmpb[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.ordpool,.ordans{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:70px}
.ordans{flex:1;padding:6px 10px;border:2px dashed var(--line);border-radius:14px;font-size:1.3rem}
.ordans.good{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.ordans.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.chip{min-height:66px;min-width:56px;padding:4px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.3rem;font-weight:800;box-shadow:0 2px 0 var(--line)}
.chip.in{border-color:var(--acc);background:var(--accsoft)}
.vglforms{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px}
.rectnote{display:block;font-size:.85rem;color:var(--K);font-weight:800;margin-bottom:4px}
.gin{width:58px!important;margin-right:4px}
.mixin{display:inline-flex;align-items:center;gap:4px}
.zsbox{width:100%;max-width:660px}
.zsbox svg{width:100%;height:auto;display:block}
.zsplace{cursor:pointer;border:2px dashed var(--line);border-radius:14px;padding:4px;touch-action:manipulation}
.bar2>.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.bar2>.tabs::-webkit-scrollbar{display:none}
.abctl{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.abrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ablab{min-width:150px;font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.abchips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.abchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.9rem}
.abchip .ti{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card2);font-weight:900}
.abchip[aria-pressed=true]{border-color:var(--acc);background:var(--accsoft)}
.abchip[aria-pressed=true] .ti{background:var(--acc);color:var(--accink)}
.abopt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);font-weight:700;cursor:pointer}
.abopt input{width:22px;height:22px;accent-color:var(--acc)}
.abtitle{height:46px;border-radius:12px;border:2px solid var(--line);background:var(--empty);padding:0 12px;font-weight:800;font-size:1.05rem;width:min(360px,100%)}
.abhint{margin:0}
.ws-wrap{overflow-x:auto;padding:4px 0 10px}
.ws-prevlab{max-width:820px;margin:8px auto;font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.ws-page{--ink:#1a1a1a;--cellline:#1a1a1a;--empty:#fff;--soft:#555;--card:#fff;--R:#1a1a1a;--A:#1a1a1a;--B:#1a1a1a;--K:#1a1a1a;color:#1a1a1a;background:#fff;max-width:820px;min-width:560px;margin:0 auto 18px;padding:30px 34px 22px;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-family:var(--font);font-size:15px;line-height:1.4;color-scheme:light}
.ws-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;border-bottom:3px solid #2E6099;padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.ws-title{font-size:1.6em;font-weight:900;color:#1B2F4A;line-height:1.1}
.ws-sub{font-size:.85em;color:#555;margin-top:4px}
.ws-meta{display:flex;gap:14px;font-size:.9em;flex-wrap:wrap}
.ws-meta i{display:inline-block;width:150px;border-bottom:1.5px solid #333;margin-left:4px}
.ws-meta i.s{width:80px}
.ws-sec{margin:14px 0 6px}
.ws-sec h3{display:flex;align-items:center;gap:10px;font-size:1.15em;color:#1B2F4A;margin:0 0 4px}
.ws-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#2E6099;color:#fff;font-size:.9em;flex:none}
.ws-instr{margin:0 0 8px;color:#333;font-size:.92em}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.ws-task{position:relative;display:flex;gap:8px;align-items:flex-start;padding:10px 30px 12px 8px;border-radius:10px;border:1.5px solid #dfe6ef;min-height:64px;break-inside:avoid;page-break-inside:avoid;min-width:0}
.ws-task[data-tid]{cursor:pointer}
.ws-task[data-tid]:hover,.ws-task[data-tid]:focus-visible{background:#f3f7fc;border-color:#2E6099;outline:none}
.ws-task.ws-new{animation:wsflash 1.1s ease}
@keyframes wsflash{from{background:#E6EEF8;border-color:#2E6099}to{background:transparent}}
.ws-wide{grid-column:1/-1}
.ws-l{font-weight:900;color:#2E6099;min-width:20px}
.ws-q{flex:1;min-width:0;font-size:1.15em;font-weight:700}
.ws-swap{position:absolute;top:6px;right:8px;font-size:15px;color:#2E6099;opacity:.75}
.ws-box{display:inline-block;width:30px;height:24px;border:1.6px solid #333;border-radius:4px;vertical-align:middle}
.ws-blank{display:inline-block;border-bottom:1.6px solid #333;height:1.3em;vertical-align:bottom}
.ws-circ{display:inline-block;width:30px;height:30px;border:1.6px solid #333;border-radius:50%;vertical-align:middle;margin:0 6px}
.ws-ordline{margin-top:12px}
.ws-svg{margin:6px 0}
.ws-svg svg,.ws-draw svg{width:100%;height:auto;display:block;max-width:560px}
.ws-draw{margin-top:8px}
.ws-note{font-size:.8em;color:#555;font-weight:600}
.ws-sol .ws-task{min-height:0;border-color:#eef2f7;padding-right:8px}
.ws-foot{margin-top:14px;font-size:.75em;color:#888;text-align:right}
.ws-page .fr>span:first-child{border-bottom-width:2px}
@media (max-width:620px){.ws-page{min-width:0;padding:18px 14px;font-size:13px}.ws-grid{grid-template-columns:1fr}.ablab{min-width:0;flex-basis:100%}}
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}

<body>
<div id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 60 60" aria-hidden="true"><rect x="4" y="10" width="52" height="40" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><rect x="10" y="16" width="13" height="28" rx="3" fill="var(--A)"/><rect x="24" y="16" width="13" height="28" rx="3" fill="var(--B)"/><rect x="38" y="16" width="12" height="28" rx="3" fill="var(--empty)" stroke="var(--cellline)" stroke-width="1.5"/></svg>
    <div><h1>Bruch-Werkstatt</h1><p>Brüche sehen, verstehen, rechnen – Bild und Rechnung Hand in Hand.</p></div>
  </header>

  <nav class="topics" id="topics" aria-label="Themen"></nav>

  <div class="bar2">
    <div class="tabs" id="modeTabs" role="group" aria-label="Bereich">
      <button data-mode="bsp" aria-pressed="true">Beispiele</button>
      <button data-mode="ueben" aria-pressed="false">Üben</button>
      <button data-mode="labor" aria-pressed="false">Eigene Brüche</button>
      <button data-mode="ab" aria-pressed="false">Arbeitsblatt</button>
    </div>
    <div class="tabs viewtabs" id="viewSeg" role="group" aria-label="Darstellung"></div>
  </div>

  <div id="main"></div>
  <p class="foot">Farben: <b class="ca">1. Bruch</b> · <b class="cb">2. Bruch</b> · <b class="cr">Ergebnis</b> · <b class="ck">Faktor</b></p>
</div>

<script>
(function(){
"use strict";
/* ============ Mathe-Helfer ============ */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=x=>(Math.round(x*1000)/1000).toLocaleString('de-DE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('bruchwerkstatt:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('bruchwerkstatt:'+k,JSON.stringify(v))}catch(e){}}};

/* ============ Symbolische Bausteine ============ */
const F=(z,n,c)=>`<span class="fr ${c||''}"><span>${z}</span><span>${n}</span></span>`;
const K=s=>`<span class="ck">${s}</span>`;
const O=s=>`<span class="op">${s}</span>`;
function mixed(z,n,c){ // gemischte Zahl, falls sinnvoll
  if(n===1) return `<span class="${c||''}">${z}</span>`;
  if(z<n) return F(z,n,c);
  const g=Math.floor(z/n),r=z%n;
  return r?`<span class="mix ${c||''}">${g}${F(r,n,c)}</span>`:`<span class="${c||''}">${g}</span>`;
}
// Ergebnis z/n: kürzen + ggf. gemischte Zahl als weitere Zeilen
function finishLines(z,n){
  const out=[];const g=gcd(z,n);
  if(g>1){
    const zz=z/g,nn=n/g;
    out.push({h:`${O('=')} ${F(`${z}${K(':'+g)}`,`${n}${K(':'+g)}`)} ${O('=')} ${nn===1?`<span class="cr">${zz}</span>`:F(zz,nn,'cr')}`,note:`kürzen mit ${g}`});
    if(nn>1&&zz>nn) out.push({h:`${O('=')} ${mixed(zz,nn,'cr')}`,note:'als gemischte Zahl'});
  }else if(z>n&&n>1){out.push({h:`${O('=')} ${mixed(z,n,'cr')}`,note:'als gemischte Zahl'})}
  return out;
}

/* ============ SVG-Bausteine ============ */
let pid=0;
function svgWrap(w,h,body){pid++;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Bild-Darstellung"><defs><pattern id="hb${pid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="var(--Bsoft)"/><line x1="0" y1="0" x2="0" y2="9" stroke="var(--B)" stroke-width="4"/></pattern><pattern id="hx${pid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="9" height="9" fill="var(--empty)"/><line x1="0" y1="0" x2="0" y2="9" stroke="var(--X)" stroke-width="3"/></pattern><pattern id="ht${pid}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--B)" stroke-width="5"/></pattern></defs>${body.replace(/__HT__/g,`url(#ht${pid})`).replace(/__HB__/g,`url(#hb${pid})`).replace(/__HX__/g,`url(#hx${pid})`)}</svg>`}
const T=(x,y,s,cls,size,anchor)=>`<text x="${x}" y="${y}" class="${cls||'tx'}" font-size="${size||18}" text-anchor="${anchor||'middle'}" dominant-baseline="middle">${s}</text>`;
// Bruch als SVG-Text
function TF(x,y,z,n,cls,size){size=size||20;const w=Math.max(String(z).length,String(n).length)*size*.62+8;
  const col=cls&&/^tx[ABRKXC]$/.test(cls)?`var(--${cls.slice(2)})`:'var(--ink)';
  return `<g>${T(x,y-size*.62,z,'tx '+(cls||''),size)}<line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="${col}" stroke-width="2.5"/>${T(x,y+size*.68,n,'tx '+(cls||''),size)}</g>`}
/* Streifen (ein Ganzes): parts = Grobteilung, sub = Feinteilung je Teil,
   fills: Array der Länge parts*sub mit Klassen ('fA','fB','fR','fE','X'),
   subStyle: 'thin'|'dash'|'new' */
const runs=(arr,N)=>{const r=[];let i=0;while(i<N){const f=arr[i]||'fE';let j=i+1;while(j<N&&(arr[j]||'fE')===f)j++;r.push([i,j,f]);i=j}return r};
const fillAttr=f=>f==='X'?'fill="__HX__"':f==='HB'?'fill="__HB__"':`class="${f}"`;
function stripe(x,y,w,h,o){
  const N=o.parts*o.sub, cw=w/N; let s='';
  runs(o.fills,N).forEach(([i,j,f])=>{s+=`<rect x="${x+i*cw}" y="${y}" width="${(j-i)*cw}" height="${h}" ${fillAttr(f)}/>`});
  if(o.sub>1){const cls=o.subStyle==='dash'?'dash':'thin';const anim=o.subStyle==='new'?' grow':'';
    for(let i=1;i<N;i++){if(i%o.sub===0)continue;s+=`<line x1="${x+i*cw}" y1="${y}" x2="${x+i*cw}" y2="${y+h}" class="${cls}${anim}"/>`}}
  for(let i=1;i<o.parts;i++){s+=`<line x1="${x+i*o.sub*cw}" y1="${y}" x2="${x+i*o.sub*cw}" y2="${y+h}" class="thick"/>`}
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="thick"/>`;
  return s;
}
// Mehrere Ganze untereinander: total Teile pro Ganzes, fills länger als ein Ganzes möglich
function stripes(x,y,w,h,gap,o){
  const N=o.parts*o.sub;const wholes=Math.max(1,Math.ceil(o.fills.length/N));let s='';
  for(let k=0;k<wholes;k++){s+=stripe(x,y+k*(h+gap),w,h,{...o,fills:o.fills.slice(k*N,(k+1)*N)});
    if(wholes>1)s+=T(x-14,y+k*(h+gap)+h/2,(k+1)+'.','txs',14,'end');}
  return {svg:s,height:wholes*h+(wholes-1)*gap};
}
function brace(x1,x2,y,label,col,down){ // geschweifte Klammer unter (down=true) / über
  const d=down?1:-1,m=(x1+x2)/2,h=10*d,r=Math.min(8,(x2-x1)/4);
  // links: Ecke nach innen, Mitte: Spitze nach außen, rechts: spiegelbildlich zurück zum Rand x2
  return `<path class="br st${col}" d="M${x1},${y} q0,${h} ${r},${h} L${m-r},${y+h} q${r},0 ${r},${h} q0,${-h} ${r},${-h} L${x2-r},${y+h} q${r},0 ${r},${-h}"/>`+T(m,y+h*2+12*d,label,'tx tx'+col,17);
}
const fillArr=(len,spec)=>{const a=new Array(len).fill('fE');let i=0;spec.forEach(([cnt,cls])=>{for(let k=0;k<cnt;k++)a[i++]=cls});return a};

/* ============ Szenen-Generatoren ============
   Jede Szene: {g: SVG, t: Erklärtext, s: [{h, note}] (neue Symbolzeilen dieses Schritts)} */
const W=600,X0=30;

/* --- Kreis-Bausteine (gleiche Optionen wie stripe) --- */
let SHAPE='rect';
const PI2=Math.PI*2;
const ang=(i,N)=>-Math.PI/2+i*PI2/N;
function sectorPath(cx,cy,r,a0,a1){if(a1-a0>=PI2-1e-9)return null;const lg=(a1-a0)>Math.PI?1:0;
  return `M${cx},${cy} L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 ${lg} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} Z`}
function pie(cx,cy,r,o){
  const N=o.parts*o.sub;let s='';
  runs(o.fills,N).forEach(([i,j,f])=>{const d=sectorPath(cx,cy,r,ang(i,N),ang(j,N));
    s+=d?`<path d="${d}" ${fillAttr(f)}/>`:`<circle cx="${cx}" cy="${cy}" r="${r}" ${fillAttr(f)}/>`});
  const ray=(i,cls)=>{const a=ang(i,N);return `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" class="${cls}"/>`};
  if(o.sub>1){const cls=o.subStyle==='dash'?'dash':'thin';const an=o.subStyle==='new'?' grow':'';for(let i=0;i<N;i++){if(i%o.sub)s+=ray(i,cls+an)}}
  if(o.parts>1)for(let i=0;i<o.parts;i++)s+=ray(i*o.sub,'thick');
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" class="thick"/>`;
  return s;
}
// mehrere Ganze als Kreise: höchstens 4 pro Reihe, sonst neue Reihe
function pies(x,y,w,r,o){
  const N=o.parts*o.sub,n=Math.max(1,Math.ceil(o.fills.length/N)),gap=18,per=Math.min(n,4),rows=Math.ceil(n/per);
  const rr=Math.min(r,(w-(per-1)*gap)/(2*per));let s='';const cs=[],cys=[];
  for(let k=0;k<n;k++){const row=Math.floor(k/per),inRow=Math.min(per,n-row*per),col=k%per,tot=inRow*2*rr+(inRow-1)*gap;
    const cx=x+(w-tot)/2+rr+col*(2*rr+gap),cy=y+rr+row*(2*rr+gap);cs.push(cx);cys.push(cy);s+=pie(cx,cy,rr,{...o,fills:o.fills.slice(k*N,(k+1)*N)})}
  return {svg:s,height:rows*2*rr+(rows-1)*gap,r:rr,cs,cys,cy:y+rr};
}
// Ganze: Rechteck-Streifen untereinander oder Kreise nebeneinander
function wholes(x,y,w,h,gap,o){return SHAPE==='circle'?pies(x,y,w,o.r||58,o):stripes(x,y,w,h,gap,o)}

/* --- Brüche & Größen --- */
// Größenarten mit Einheiten [Schlüssel, Name, Faktor zur kleinsten Einheit, Standardwert, Einzahl]
const CATS={
  laenge:{name:'Längen',def:'cm',units:[['mm','mm',1,100],['cm','cm',10,100],['dm','dm',100,10],['m','m',1000,1],['km','km',1e6,1]]},
  geld:{name:'Geld',def:'eur',units:[['ct','ct',1,100],['eur','€',100,20]]},
  gewicht:{name:'Gewicht',def:'g',units:[['mg','mg',1,1000],['g','g',1e3,1000],['kg','kg',1e6,1],['t','t',1e9,1]]},
  zeit:{name:'Zeit',def:'min',units:[['s','s',1,60],['min','min',60,60],['h','h',3600,24],['d','Tage',86400,7,'Tag'],['wo','Wochen',604800,4,'Woche']]},
  hohl:{name:'Hohlmaße',def:'ml',units:[['ml','ml',1,1000],['cl','cl',10,100],['dl','dl',100,10],['l','l',1000,1],['hl','hl',1e5,1]]},
  raum:{name:'Rauminhalt',def:'cm3',units:[['mm3','mm³',1,1000],['cm3','cm³',1e3,1000],['dm3','dm³',1e6,1000],['m3','m³',1e9,1]]},
  flaeche:{name:'Flächen',def:'cm2',units:[['mm2','mm²',1,100],['cm2','cm²',100,100],['dm2','dm²',1e4,100],['m2','m²',1e6,100],['a','a',1e8,100],['ha','ha',1e10,100],['km2','km²',1e12,1]]},
};
const UNITS={};
for(const [ck,c] of Object.entries(CATS))c.units.forEach(([k,name,f,T,sing],i)=>{UNITS[k]={name,f,T,sing:sing||name,cat:ck,i}});
const isExact=x=>Math.abs(x*1000-Math.round(x*1000))<1e-9;
const EQ=x=>isExact(x)?'=':'≈';
// „1 kg = 1.000 g“: größte größere Einheit, in der T eine ganze Zahl ist
function wholeLabel(uk,T){
  const u=UNITS[uk],us=CATS[u.cat].units;
  for(let i=us.length-1;i>u.i;i--){const v=T*u.f/us[i][2];if(v>=1&&Math.abs(v-Math.round(v))<1e-9){const r=Math.round(v),L=UNITS[us[i][0]];return `${fmt(r)} ${r===1?L.sing:L.name} = ${fmt(T)} ${u.name}`}}
  return `${fmt(T)} ${u.name}`;
}
// Ergebnis in einer kleineren Einheit, falls es dort ganzzahlig wird
function convLower(uk,x){
  if(Number.isInteger(Math.round(x*1e9)/1e9))return null;
  const u=UNITS[uk],us=CATS[u.cat].units;
  for(let i=u.i-1;i>=0;i--){if(['dm','cl','dl','dm2'].includes(us[i][0]))continue;const v=x*u.f/us[i][2];if(Math.abs(v-Math.round(v))<1e-6){const r=Math.round(v);return `${fmt(r)} ${r===1?UNITS[us[i][0]].sing:us[i][1]}`}}
  return null;
}
function scGroessen(p){
  const u=UNITS[p.unit],Tt=p.T,part=Tt/p.n,res=part*p.z;
  const wh=Math.max(1,Math.ceil(p.z/p.n));
  const wl=wholeLabel(p.unit,Tt);
  function draw(st){
    const fills=fillArr(wh*p.n,st>=2?[[p.z,'fA']]:[]);
    const o=st>=1?{parts:p.n,sub:1,fills}:{parts:1,sub:1,fills:fillArr(wh,[])};
    if(SHAPE==='circle'){
      let s=T(300,18,wl+(wh>1?' (je Kreis)':''),'tx',17);
      const r=pies(20,38,W-40,115,o);s+=r.svg;
      const clock=p.unit==='min'&&Tt===60;
      r.cs.forEach((cx,k)=>{const cy=r.cys[k];
        if(clock)for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=`<line x1="${cx+(r.r-8)*Math.cos(a)}" y1="${cy+(r.r-8)*Math.sin(a)}" x2="${cx+r.r*Math.cos(a)}" y2="${cy+r.r*Math.sin(a)}" stroke="var(--cellline)" stroke-width="2"/>`}
        if(st>=1&&p.n<=12)for(let i=0;i<p.n;i++){const am=(ang(i,p.n)+ang(i+1,p.n))/2;s+=T(cx+r.r*.62*Math.cos(am),cy+r.r*.62*Math.sin(am),fmt(part),k*p.n+i<p.z&&st>=2?'tx':'txs',r.r<60?10:r.r<80||p.n>8?12:15)}
      });
      const H=38+r.height+44;
      s+=T(300,H-16,st>=2?`${p.z} Teile = ${fmt(res)} ${u.name}`:st===1?`${p.n} gleich große Teile zu je ${fmt(part)} ${u.name}`:wl,st>=2?'tx txA':'tx',18);
      return svgWrap(W,H,s);
    }
    let s=T(300,22,wl+(wh>1?' (je Streifen)':''),'tx',17);
    const r=stripes(X0+10,44,W-2*X0-20,60,26,o);s+=r.svg;
    if(st>=1&&p.n<=12){const cw=(W-2*X0-20)/p.n;for(let k=0;k<wh;k++)for(let i=0;i<p.n;i++)s+=T(X0+10+cw*(i+.5),44+k*86+30,fmt(part),k*p.n+i<p.z&&st>=2?'tx':'txs',p.n>8?12:15)}
    if(st>=2&&wh===1){const cw=(W-2*X0-20)/p.n;s+=brace(X0+10,X0+10+cw*p.z,44+64,`${fmt(res)} ${u.name}`,'A',true)}
    const H=44+r.height+(st>=2&&wh===1?60:34);
    if(st>=2&&wh>1)s+=T(300,H-10,`${p.z} Teile = ${fmt(res)} ${u.name}`,'tx txA',18);
    if(st===1&&wh===1)s+=T(300,H-10,`${p.n} gleich große Teile`,'txs',15);
    return svgWrap(W,H,s);
  }
  const of=`${F(p.z,p.n,'ca')} von ${fmt(Tt)} ${u.name}`;
  return [
    {g:draw(0),t:`Das Ganze: ${wl}. Gesucht sind ${p.z}/${p.n} davon.`,s:[{h:of}]},
    {g:draw(1),t:`Teile das Ganze in ${p.n} gleich große Teile: ${fmt(Tt)} ${u.name} : ${p.n} ${EQ(part)} ${fmt(part)} ${u.name}. Das ist ${F(1,p.n)}.`+(isExact(part)?'':` <i>(Tipp: In einer kleineren Einheit geht die Division vielleicht auf.)</i>`),s:[{h:`${fmt(Tt)} ${u.name} ${O(':')} <span class="ca">${p.n}</span> ${O(EQ(part))} ${fmt(part)} ${u.name}`,note:'durch den Nenner teilen → ein Teil'}]},
    {g:draw(2),t:`Nimm ${p.z} dieser Teile: ${fmt(part)} ${u.name} · ${p.z} ${EQ(res)} ${fmt(res)} ${u.name}.`,s:[{h:`${fmt(part)} ${u.name} ${O('·')} <span class="ca">${p.z}</span> ${O(EQ(res))} <b class="cr">${fmt(res)} ${u.name}</b>`,note:'mal den Zähler → so viele Teile'},{h:`${of} ${O(EQ(res))} <b class="cr">${fmt(res)} ${u.name}</b>`}].concat(convLower(p.unit,res)?[{h:`${O('=')} <b class="cr">${convLower(p.unit,res)}</b>`,note:'in eine kleinere Einheit umgerechnet'}]:[])}
  ];
}

/* --- Gitter (Erweitern/Kürzen): cols Spalten, rows Zeilen, zCols gefärbte Spalten --- */
function grid(x,y,w,h,cols,rows,zCols,rowStyle,fillCls){
  let s='';const cw=w/cols,rh=h/rows;
  for(let c=0;c<cols;c++)s+=`<rect x="${x+c*cw}" y="${y}" width="${cw}" height="${h}" class="${c<zCols?fillCls:'fE'}"/>`;
  if(rows>1&&rowStyle!=='none'){const cls=rowStyle==='dash'?'dash':'thin';const an=rowStyle==='new'?' grow':'';
    for(let r=1;r<rows;r++)s+=`<line x1="${x}" y1="${y+r*rh}" x2="${x+w}" y2="${y+r*rh}" class="${cls}${an}" style="stroke-width:${rowStyle==='dash'?1.2:2}"/>`}
  for(let c=1;c<cols;c++)s+=`<line x1="${x+c*cw}" y1="${y}" x2="${x+c*cw}" y2="${y+h}" class="thick"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="thick"/>`;
  return s;
}
// Ganze (Rechteck-Gitter oder Kreise): bei einem Ganzen groß, sonst nebeneinander
function figBoxes(wh){
  if(SHAPE==='circle'){if(wh===1)return [{cx:270,cy:130,r:110}];const r=Math.min(110,(390-(wh-1)*16)/(2*wh)),tot=wh*2*r+(wh-1)*16;return Array.from({length:wh},(_,k)=>({cx:95+(390-tot)/2+r+k*(2*r+16),cy:130,r}))}
  if(wh===1)return [{x:150,y:30,w:300,h:200}];const w=(390-(wh-1)*16)/wh;return Array.from({length:wh},(_,k)=>({x:95+k*(w+16),y:30,w,h:200}));
}
// parts große Teile je Ganzes, je sub feine Teile, zParts große Teile gefärbt (auch mehr als ein Ganzes)
function partFig(parts,sub,zParts,style){
  const wh=Math.max(1,Math.ceil(zParts/parts));
  return figBoxes(wh).map((b,k)=>{const zz=Math.max(0,Math.min(parts,zParts-k*parts));
    return SHAPE==='circle'?pie(b.cx,b.cy,b.r,{parts,sub,subStyle:style,fills:fillArr(parts*sub,[[zz*sub,'fA']])}):grid(b.x,b.y,b.w,b.h,parts,sub,zz,style,'fA')}).join('');
}
const figLabX=wh=>wh>1?540:SHAPE==='circle'?475:520;
const figLeftX=wh=>wh>1?86:SHAPE==='circle'?144:134;
function scErweitern(p){
  const {z,n,k}=p,wh=Math.max(1,Math.ceil(z/n));
  const lab=(a,b,c)=>TF(figLabX(wh),130,a,b,c,wh>1?20:24);
  const g0=svgWrap(W,260,partFig(n,1,z,'none')+lab(z,n,'txA'));
  const g1=svgWrap(W,260,partFig(n,k,z,'new')+T(figLeftX(wh),130,`je ${k}`,'tx txK',wh>1?15:18,'end')+lab(z+'·'+k,n+'·'+k,'txK'));
  const g2=svgWrap(W,260,partFig(n,k,z,'thin')+lab(z*k,n*k,'txR'));
  return [
    {g:g0,t:`${z} von ${n} gleich großen Teilen sind gefärbt: ${z}/${n}.`,s:[{h:F(z,n,'ca')}]},

/* --- Addition / Subtraktion --- */
const SW=W-2*X0-20, SX=X0+20;

  const same=n===m;const R=op==='+'?A+B:A-B;
  const bh=56,gap=22,sign=op==='+'?'+':'−';
  const sc=[];
  function twoBars(refined,style){

    s+=ra.svg+TF(SX-8,y+ra.height/2,a,n,'txA',17);y+=ra.height+gap+6;

  const resPic=(fills,parts,sub,style,label,cls)=>{const r=wholes(SX+20,16,SW-20,bh,gap,{parts,sub,subStyle:style,fills,r:70});return svgWrap(W,r.height+60,r.svg+T(300,r.height+38,label,cls,18))};
  sc.push({g:twoBars(false,'thin'),t:(op==='+'?`Wir addieren ${a}/${n} und ${b}/${m}.`:`Von ${a}/${n} sollen ${b}/${m} weggenommen werden.`)+(same?' Die Teile sind gleich groß (gleichnamig).':' Die Teile sind verschieden groß (ungleichnamig) – so kann man sie nicht einfach '+(op==='+'?'zusammenzählen.':'abziehen.')),
    s:[{h:`${F(a,n,'ca')} ${O(sign)} ${F(b,m,'cb')}`}]});
  if(!same){
    sc.push({g:twoBars(true,'new'),t:`Gleichnamig machen: Hauptnenner ist ${N} (kleinstes gemeinsames Vielfaches von ${n} und ${m}). Das erste Ganze wird mit ${fa}, das zweite mit ${fb} erweitert – jetzt sind alle Teile gleich groß.`,
      s:[{h:`${O('=')} ${F(`${a}${K('·'+fa)}`,`${n}${K('·'+fa)}`)} ${O(sign)} ${F(`${b}${K('·'+fb)}`,`${m}${K('·'+fb)}`)}`,note:`erweitern auf den Hauptnenner ${N}`},{h:`${O('=')} ${F(A,N,'ca')} ${O(sign)} ${F(B,N,'cb')}`}]});

      s:[{h:`${O('=')} ${F(`${A} − ${B}`,N)}`,note:'Zähler subtrahieren, Nenner bleibt'}]});
    const wr=Math.max(1,Math.ceil(R/N));

/* --- Division: Messmodell „Wie oft passt …?“ --- */
function scDiv(p){

  return sc;

/* --- Darstellung wählen: Rechteck, Kreis oder beides --- */

function needsRect(tid,p){if(!p)return false;const big=(z,n)=>z>n;

  if(tid==='vergleich')return p.fr?p.fr.some(([z,n])=>z>n):(big(p.a,p.n)||big(p.b,p.m));

const RECT_NOTE='<span class="rectnote">Bei Brüchen größer als 1 zeigt das Rechteck-Modell den Weg.</span> ';

/* ============ Schieberegler (Addition/Subtraktion) ============ */
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clamp01=x=>Math.max(0,Math.min(1,x));
// Ablauf: Bruch zeigen → Unterteilung verfeinern (Linien wachsen) → neue Beschriftung → schieben
function phase(same,t){
  if(same)return {p1:1,p2:ease(clamp01(t/.88))};
  return {p1:clamp01((t-.06)/.24),p2:ease(clamp01((t-.34)/.56))};
}
function slideSVG(p,op,t,shape){
  const {a,n,b,m}=p,N=lcm(n,m),fa=N/n,fb=N/m,A=a*fa,B=b*fb,R=op==='+'?A+B:A-B,same=n===m;

  const tgt=i=>op==='+'?A+i:A-B+i;
  const X=70,Wd=500,lbA=p1>=1?[A,N]:[a,n],lbB=p1>=1?[B,N]:[b,m];
  const fadeTop=j=>j>=aW?` opacity="${(.3+.7*p2).toFixed(3)}"`:'';
  const moved=p2>0;
  let fills='',lines='',mov='',outl='',hat='',lab='',H;
  if(shape==='rect'){
    const h=54,gap=16,cw=Wd/N,yT=16,yB=yT+topW*(h+gap)+30;
    const pos=(k,top)=>({x:X+(k%N)*cw,y:(top?yT:yB)+Math.floor(k/N)*(h+gap)});
    const grp=(y0,wh,parts,f,cnt,cls,top,keep)=>{for(let j=0;j<wh;j++){const y=y0+j*(h+gap),fo=top?fadeTop(j):'';
      const arr=[];for(let c=0;c<N;c++){const k=j*N+c;arr.push(k<cnt?cls:'fE')}
      runs(arr,N).forEach(([i,e,cl])=>{fills+=`<rect x="${X+i*cw}" y="${y}" width="${(e-i)*cw}" height="${h}" class="${cl}"${fo}/>`});

function cmpText(p,op,t,hide){

  <div class="panel"><div class="ph"><span class="dot" style="background:var(--K)"></span>Symbolisch – Rechnung</div><div class="sym"></div></div></div>
  <div class="ctrl"><button class="btn ghost prev">◀ Zurück</button><div class="dots"></div><button class="btn next">Weiter ▶</button><button class="btn ghost all">Alle Schritte</button></div>`;
  const stage=host.querySelector('.stage'),say=host.querySelector('.say'),sym=host.querySelector('.sym'),dots=host.querySelector('.dots');
  const prev=host.querySelector('.prev'),next=host.querySelector('.next'),all=host.querySelector('.all');
  function render(){
    const sc=scenes[i];stage.innerHTML=sc.g;say.innerHTML=sc.t;
    let h='';for(let k=0;k<=i;k++)scenes[k].s.forEach(l=>{h+=`<div class="ln ${k===i?'new':''}">${l.h}${l.note?`<span class="note">${l.note}</span>`:''}</div>`});
    sym.innerHTML=h;
    dots.innerHTML=scenes.map((_,k)=>`<i class="${k<=i?'on':''}" style="${k>max()?'opacity:.25':''}"></i>`).join('');
    prev.disabled=i===0;next.disabled=i>=max();all.style.display=i>=max()?'none':'';
    next.textContent=i>=max()?(opts.limit!=null&&max()<scenes.length-1?'Mehr: Bild-Hilfe':'Fertig ✓'):'Weiter ▶';
    if(opts.onStep)opts.onStep(i);
  }
  prev.onclick=()=>{if(i>0){i--;render()}};
  next.onclick=()=>{if(i<max()){i++;render()}};
  all.onclick=()=>{i=max();render()};
  render();
  return {setLimit(l){opts.limit=l;render()},go(k){i=Math.min(k,max());render()},get i(){return i}};
}

/* ============ Üben ============ */
const LV=[{n:'Basis',d:'gleichnamig, kleine Zahlen'},{n:'Profi',d:'ungleichnamig, einfacher Hauptnenner'},{n:'Experte',d:'Hauptnenner & vollständig kürzen'}];
const LVT={zahlenstrahl:['ablesen bis 1','ablesen bis 3','eintragen (auch gemischt)'],vergleich:['gleicher Nenner oder Zähler','ungleichnamig','Ordnen (3–4 Brüche)'],groessen:['einfache Anteile','andere Größen','auch mehr als ein Ganzes'],erweitern:['mit Zahl erweitern','auf Nenner erweitern','Lücke finden'],kuerzen:['mit Zahl kürzen','vollständig kürzen','große Zahlen'],mult:['gleichnamig','ungleichnamig','mit Kürzen'],div:['gleichnamig, ganze Ergebnisse','ungleichnamig','mit Rest']};
function properPair(maxN){const n=ri(2,maxN);return [ri(1,n-1),n]}
function gen(tid,lvl){
  for(let tries=0;tries<200;tries++){
    if(tid==='zahlenstrahl'){
      if(lvl===0){const n=ri(2,10),z=ri(1,n-1);return {p:{z,n,M:1},type:'zread'}}
      const n=ri(2,8),M=ri(2,3),z=ri(1,M*n-1);
      if(lvl===1){if(z%n===0&&Math.random()<.7)continue;return {p:{z,n,M},type:'zread'}}
      if(z%n===0)continue;return {p:{z,n,M},type:'zplace'};
    }
    if(tid==='vergleich'){
      if(lvl===0){if(Math.random()<.5){const n=ri(3,12),a=ri(1,n-1),b=ri(1,n-1);if(a===b)continue;return {p:{a,n,b,m:n},type:'cmp'}}
        const a=ri(1,5),n=ri(a+1,10),m=ri(a+1,10);if(n===m)continue;return {p:{a,n,b:a,m},type:'cmp'}}
      if(lvl===1){const n=ri(2,8),m=ri(2,8);if(n===m)continue;const a=ri(1,n-1),b=ri(1,m-1);if(a===b||lcm(n,m)>24)continue;if(a*m===b*n&&Math.random()<.8)continue;return {p:{a,n,b,m},type:'cmp'}}
      const k=ri(3,4),fr=[];let N=1;
      for(let i=0;i<k;i++){const n=pick([2,3,4,5,6,8,10,12]);fr.push([ri(1,n-1),n]);N=lcm(N,n)}
      if(N>24||new Set(fr.map(([z,n])=>(z/n).toFixed(6))).size<k)continue;
      return {p:{fr},type:'ord'};
    }
    if(tid==='groessen'){
      if(lvl===0){const o=pick([{unit:'min',T:60,ns:[2,3,4,6]},{unit:'eur',T:pick([10,12,20,30]),ns:null},{unit:'cm',T:100,ns:[2,4,5,10]}]);
        const ns=o.ns||[2,3,4,5,6,10].filter(x=>o.T%x===0);const n=pick(ns);const z=ri(1,n-1);return {p:{unit:o.unit,T:o.T,z,n},type:'num'}}
      if(lvl===1){const o=pick([{unit:'g',T:1000,ns:[2,4,5,8,10]},{unit:'ml',T:1000,ns:[2,4,5,8,10]},{unit:'min',T:60,ns:[5,10,12]},{unit:'eur',T:pick([24,30,36]),ns:[3,4,6]},{unit:'cm',T:100,ns:[4,5,10,20]}]);
        const n=pick(o.ns.filter(x=>o.T%x===0));const z=ri(1,n-1);if(gcd(z,n)>1&&Math.random()<.5)continue;return {p:{unit:o.unit,T:o.T,z,n},type:'num'}}
      const o=pick([{unit:'min',T:pick([60,120]),ns:[3,4,6]},{unit:'g',T:1000,ns:[4,5,8]},{unit:'cm',T:100,ns:[4,5]},{unit:'ml',T:pick([1000,500]),ns:[4,5]}]);
      const n=pick(o.ns);const z=ri(n+1,2*n-1);return {p:{unit:o.unit,T:o.T,z,n},type:'num'};
    }
    if(tid==='erweitern'){
      const [z,n]=properPair(lvl===0?5:7);if(gcd(z,n)>1)continue;const k=ri(2,lvl===0?3:5);if(n*k>48||k>8)continue;
      if(lvl===0)return {p:{z,n,k},type:'frac',ask:'erw'};
      if(lvl===1)return {p:{z,n,k},type:'num',ask:'erwN'};
      return {p:{z,n,k},type:'num',ask:pick(['erwZ','erwD'])};
    }
    if(tid==='kuerzen'){
      const [a,b]=properPair(lvl===2?9:6);if(gcd(a,b)>1)continue;const k=lvl===0?ri(2,3):lvl===1?ri(2,4):ri(4,8);
      if(b*k>(lvl===2?72:36)||b>12)continue;
      return {p:{z:a*k,n:b*k,k},type:'frac',ask:lvl===0?'kurzK':'kurzV'};
    }
    // Rechenarten
    let a,n,b,m;
    if(tid==='mult'){
      if(lvl===0){n=ri(2,5);m=n;a=ri(1,n-1);b=ri(1,m-1)}
      else{n=ri(2,6);m=ri(2,6);if(n===m)continue;a=ri(1,n-1);b=ri(1,m-1);if(lvl===2&&gcd(a*b,n*m)===1)continue;if(lvl===1&&gcd(a*b,n*m)>1&&Math.random()<.5)continue}
      if(gcd(a,n)>1||gcd(b,m)>1)continue;
      return {p:{a,n,b,m},type:'frac'};
    }
    if(tid==='div'){
      if(lvl===0){n=ri(3,10);m=n;b=ri(1,4);const q=ri(2,5);a=b*q;if(a>=n+1)continue}
      else if(lvl===1){n=pick([2,3,4,5,6]);m=n*pick([2,3]);if(m>12)continue;[a,b]=[ri(1,n-1),ri(1,m-1)];if(a*m/n%b!==0&&Math.random()<.6)continue}
      else{n=ri(2,6);m=ri(2,6);if(n===m)continue;a=ri(1,n-1);b=ri(1,m-1)}
      if(gcd(a,n)>1&&lvl>0)continue;if(gcd(b,m)>1&&lvl>0)continue;
      if(lcm(n,m)>24)continue;if(a/n<b/m&&lvl<2)continue;
      return {p:{a,n,b,m},type:'frac'};
    }
    // add/sub
    if(lvl===0){n=ri(3,10);m=n;a=ri(1,n-1);b=ri(1,n-1)}
    else if(lvl===1){n=pick([2,3,4,5,6]);m=n*pick([2,3]);if(m>12)continue;if(Math.random()<.5)[n,m]=[m,n];a=ri(1,n-1);b=ri(1,m-1)}
    else{n=ri(2,8);m=ri(2,8);if(n===m||n%m===0||m%n===0)continue;a=ri(1,n-1);b=ri(1,m-1)}
    if(lvl>0&&(gcd(a,n)>1||gcd(b,m)>1))continue;
    if(lcm(n,m)>24)continue;
    if(tid==='sub'&&a/n<=b/m)continue;
    if(tid==='add'&&lvl<2&&a/n+b/m>1)continue;
    const P={a,n,b,m};
    if(lvl===2&&Math.random()<.45){P.a+=ri(1,2)*n;if(tid==='add'&&Math.random()<.5)P.b+=m;P.mix=true;
      P.conv=[[P.a,n,'ca'],[P.b,m,'cb']].filter(([z,q])=>z>q&&z%q).map(([z,q,c])=>`${mixed(z,q,c)} ${O('=')} ${F(z,q,c)}`)}
    return {p:P,type:'frac'};
  }
}
function exact(z,n){const g=gcd(z,n);return [z/g,n/g]}
function solution(tid,task){
  const p=task.p;
  if(tid==='groessen')return p.T/p.n*p.z;
  if(tid==='erweitern')return task.ask==='erw'?[p.z*p.k,p.n*p.k]:task.ask==='erwD'?p.n*p.k:p.z*p.k;
  if(tid==='kuerzen')return task.ask==='kurzK'?[p.z/p.k,p.n/p.k]:exact(p.z,p.n);
  const {a,n,b,m}=p;
  if(tid==='add')return exact(a*m+b*n,n*m);
  if(tid==='sub')return exact(a*m-b*n,n*m);
  if(tid==='mult')return exact(a*b,n*m);
  return exact(a*m,n*b);
}
function fin(id,ph){return `<span class="fin"><input id="${id}z" inputmode="numeric" pattern="[0-9]*" aria-label="Zähler" placeholder="${ph?'':''}"><span class="fl"></span><input id="${id}n" inputmode="numeric" pattern="[0-9]*" aria-label="Nenner"></span>`}

function newTask(){
  const t=topic();cur=gen(t.id,S.lvl);cur.tries=0;cur.done=false;helpUsed=0;helpCtl=null;
  const p=cur.p;let task='',instr='',ans='';

    else{instr='Ordne die Brüche der Größe nach: Tippe sie vom kleinsten zum größten an.';task=`<div class="ordpool" id="ordPool"></div>`;ans=`<div class="ansrow"><span class="lab">kleinster → größter</span><div class="ordans" id="ordAns"></div><button class="btn ghost" id="ordReset" aria-label="Zurücksetzen">↺</button></div>`;cur.order=[]}
  }
  else if(t.id==='zahlenstrahl'){
    if(cur.type==='zread'){instr='Welcher Bruch ist markiert? Tipp: Zähle die Teile einer Einheit (Nenner) und die Sprünge von 0 aus (Zähler).';task=`<div class="zsbox">${zsLineSVG(p,{at:p.z,letter:'?',col:'var(--B)'})}</div>`;
      ans=`<div class="ansrow"><span class="lab">${p.M>1?'Bruch oder gemischte Zahl':'Bruch'}</span>${p.M>1?'<input class="numin gin" id="rg" inputmode="numeric" aria-label="Ganze" placeholder="0">':''}${fin('r')}</div>`}
    else{instr=`Tippe auf den Zahlenstrahl, um ${dispZ(p.z,p.n)} zu markieren.`;task=`<div class="zsbox zsplace">${zsLineSVG(p)}</div>`;ans='<div class="ansrow"><span class="lab">Markiert:</span><span id="zsSel" class="muted">noch nichts</span></div>';cur.place=null}
  }
  else if(t.id==='groessen'){const u=UNITS[p.unit];instr='Berechne den Bruchteil der Größe.';task=`${F(p.z,p.n,'ca')} von ${fmt(p.T)} ${u.name} ${O('=')}`;ans=`<input class="numin" id="an" inputmode="decimal" aria-label="Ergebnis"> <span>${u.name}</span>`}
  else if(t.id==='erweitern'){
    if(cur.ask==='erw'){instr=`Erweitere mit ${p.k}.`;task=`${F(p.z,p.n,'ca')} ${O('=')}`;ans=fin('r')}
    else if(cur.ask==='erwN'){instr=`Erweitere auf den Nenner ${p.n*p.k}.`;task=`${F(p.z,p.n,'ca')} ${O('=')} ${F('<input class="numin" id="an" inputmode="numeric" aria-label="Zähler" style="width:80px;height:46px">',p.n*p.k,'cr')}`}
    else if(cur.ask==='erwZ'){instr='Fülle die Lücke.';task=`${F(p.z,p.n,'ca')} ${O('=')} ${F('<input class="numin" id="an" inputmode="numeric" aria-label="Zähler" style="width:80px;height:46px">',p.n*p.k,'cr')}`}
    else {instr='Fülle die Lücke.';task=`${F(p.z,p.n,'ca')} ${O('=')} ${F(p.z*p.k,'<input class="numin" id="an" inputmode="numeric" aria-label="Nenner" style="width:80px;height:46px">','cr')}`}
  }
  else if(t.id==='kuerzen'){instr=cur.ask==='kurzK'?`Kürze mit ${p.k}.`:'Kürze vollständig (mit dem ggT).';task=`${F(p.z,p.n,'ca')} ${O('=')}`;ans=fin('r')}
  else{
    const same=p.n===p.m;const sym=OPSYM[t.id];
    instr=(p.mix?'Wandle die gemischte Zahl zuerst in einen unechten Bruch um. ':'')+(same?'Gleichnamige Brüche. ':'Ungleichnamige Brüche. ')+'Gib das Ergebnis vollständig gekürzt an (unechte Brüche sind erlaubt).';

    ans+=`<div class="ansrow"><span class="lab">Ergebnis</span>${O('=')} ${fin('r')}</div>`;
  }
  const inline=!/ansrow/.test(ans);
  $('#taskcard').innerHTML=`<div class="instr">${instr}</div>
   ${inline?`<div class="task">${task} ${ans}</div>`:`<div class="task">${task}</div>${ans}`}
   <div class="row ctrl" style="justify-content:flex-start"><button class="btn green" id="chk">Prüfen</button><button class="btn warm" id="hlp">Bild-Hilfe</button><button class="btn ghost" id="sol">Lösung zeigen</button><button class="btn ghost" id="nxt">Neue Aufgabe ↻</button></div>
   <div class="fb" id="fb"></div>`;
  $('#help').className='help';$('#help').innerHTML='';
  $('#chk').onclick=check;$('#hlp').onclick=showHelp;$('#sol').onclick=showSolution;$('#nxt').onclick=newTask;

}

function check(){
  if(cur.done){newTask();return}
  if(topic().id==='vergleich'){checkVgl();return}
  if(topic().id==='zahlenstrahl'){checkZS();return}
  const t=topic(),sol=solution(t.id,cur),fb=$('#fb');let ok=false,msg='',half=false;
  cur.tries++;
  if(cur.type==='num'){
    const v=num('an');if(v==null){fb.className='fb show no';fb.textContent='Trag zuerst eine Zahl ein.';cur.tries--;return}
    ok=Math.abs(v-sol)<1e-9;mark('an',ok);
    msg=ok?'Richtig! 🎉':(t.id==='groessen'?'Noch nicht. Tipp: erst durch den Nenner teilen, dann mal den Zähler.':'Noch nicht. Tipp: Womit wurde der Nenner (bzw. Zähler) multipliziert? Mit derselben Zahl musst du auch den anderen multiplizieren.');
  }else{
    const z=num('rz');let n=num('rn');
    if(z==null){fb.className='fb show no';fb.textContent='Trag zuerst das Ergebnis ein.';cur.tries--;return}
    if(n==null)n=1;
    // Zwischenschritt prüfen (optional)
    let midMsg='';
    if(document.getElementById('g1z')){
      const v=['g1z','g1n','g2z','g2n'].map(num);
      if(v.some(x=>x!=null)){
        const p=cur.p;const ok1=v[0]!=null&&v[1]&&v[0]*p.n===p.a*v[1];const ok2=v[2]!=null&&v[3]&&v[2]*p.m===p.b*v[3];const same=v[1]&&v[1]===v[3];
        mark('g1z',ok1);mark('g1n',ok1&&same);mark('g2z',ok2);mark('g2n',ok2&&same);
        if(!(ok1&&ok2&&same))midMsg=' Beim Gleichnamig-Machen stimmt etwas nicht: Beide Brüche brauchen denselben Nenner, und Zähler und Nenner werden mit derselben Zahl erweitert.';
      }
    }
    const val=z/n,target=sol[0]/sol[1];const eq=n!==0&&Math.abs(val-target)<1e-9;
    const reduced=gcd(z,n)===1;
    if(eq&&(cur.ask==='erw'||cur.ask==='kurzK')){ok=z===sol[0]&&n===sol[1];msg=ok?'Richtig! 🎉':`Gleicher Wert – aber ${cur.ask==='erw'?'erweitere':'kürze'} genau mit ${cur.p.k}.`;half=!ok}
    else if(eq&&reduced){ok=true;msg='Richtig! 🎉'+(midMsg?' (Der Zwischenschritt hatte aber einen Fehler.)':'')}
    else if(eq){msg=`Der Wert stimmt – aber du kannst noch kürzen (ggT von ${z} und ${n} ist ${gcd(z,n)}).`;half=true}
    else msg=wrongHint(t.id,z,n)+midMsg;
    mark('rz',ok?true:(half?null:false));mark('rn',ok?true:(half?null:false));
  }
  if(ok){fb.className='fb show ok';fb.innerHTML=msg+(helpUsed?` <span class="small">(mit ${Math.min(helpUsed,9)}× Bild-Hilfe)</span>`:'')+' – Tippe auf „Prüfen“ oder „Neue Aufgabe“ für die nächste.';cur.done=true;bump(true);$('#chk').textContent='Weiter ▶';}
  else{fb.className='fb show '+(half?'half':'no');fb.innerHTML=msg+(cur.tries>=2&&!helpCtl?' Probier die <b>Bild-Hilfe</b>!':'');}
}
function wrongHint(tid,z,n){
  const p=cur.p;
  if(tid==='add'||tid==='sub'){
    if(p.n!==p.m&&n===p.n+p.m)return 'Achtung: Nenner werden nicht addiert! Erst auf einen gemeinsamen Nenner (Hauptnenner) erweitern.';
    if(p.n===p.m&&n===2*p.n)return 'Achtung: Der Nenner bleibt gleich – nur die Zähler werden '+(tid==='add'?'addiert':'subtrahiert')+'.';
    return 'Noch nicht richtig. Prüfe den Hauptnenner und das Erweitern.';
  }
  if(tid==='mult'){if(p.n===p.m&&n===p.n)return 'Achtung: Beim Multiplizieren bleibt der Nenner nicht gleich – Nenner mal Nenner!';return 'Noch nicht richtig. Zähler mal Zähler, Nenner mal Nenner.'}
  if(tid==='div'){if(Math.abs(z/n-(p.a*p.b)/(p.n*p.m))<1e-9)return 'Du hast multipliziert. Beim Dividieren: mit dem Kehrwert des zweiten Bruchs malnehmen!';return 'Noch nicht richtig. Wie oft passt der zweite Bruch in den ersten?'}
  if(tid==='kuerzen')return 'Noch nicht. Teile Zähler und Nenner durch dieselbe Zahl.';
  return 'Noch nicht richtig.';
}

function rdFr(id){const g=num(id+'g'),z=num(id+'z'),n=num(id+'n');
  if(z==null&&n==null)return g==null?null:{z:g,n:1,g:0,zr:g};
  return {z:(g||0)*(n||0)+(z==null?0:z),n,g:g||0,zr:z==null?0:z};}
function runLab(){
  const t=topic(),err=$('#lerr');err.textContent='';
  const saved={};$('#main').querySelectorAll('.form input,.form select').forEach(el=>{if(el.id)saved[el.id]=el.value});store.set('labin:'+t.id,saved);
  const ok=f=>f&&[f.z,f.n,f.g,f.zr].every(x=>x!=null&&Number.isInteger(x)&&x>=0)&&f.n>=1;
  let p=null,e='';const conv=[];
  const need=(f,lab)=>{if(!f){e=`Bitte ${lab} eintragen.`;return false}if(!ok(f)){e='Bitte nur ganze Zahlen eintragen (Nenner mindestens 1).';return false}return true};
  const cv=(f,c)=>{if(f.g>0&&f.n>1&&f.zr>0)conv.push(`<span class="mix ${c}">${f.g}${F(f.zr,f.n,c)}</span> ${O('=')} ${F(f.z,f.n,c)}`)};
  if(t.id==='vergleich'){const list=[1,2,3,4].map(i=>rdFr('l'+i)).filter(Boolean);
    if(list.length<2)e='Bitte mindestens zwei Brüche eintragen.';
    else if(!list.every(ok))e='Bitte nur ganze Zahlen eintragen (Nenner mindestens 1).';
    else if(list.some(f=>f.z/f.n>3))e='Bitte Brüche bis höchstens 3 Ganze.';
    else if(list.some(f=>f.n>24))e='Nenner bitte höchstens 24.';
    else{const N=list.reduce((L,f)=>lcm(L,f.n),1);if(N>72)e=`Der gemeinsame Nenner wäre ${N} – zu fein zum Zeichnen. Bitte andere Nenner wählen.`}
    if(!e){list.forEach((f,i)=>cv(f,hcl(i)));p=list.length===2?{a:list[0].z,n:list[0].n,b:list[1].z,m:list[1].n}:{fr:list.map(f=>[f.z,f.n])}}}
  else if(t.id==='groessen'){const f=rdFr('l1'),T=num('lT');
    if(need(f,'einen Bruch')){if(f.z<1)e='Der Zähler muss mindestens 1 sein.';else if(f.n>24)e='Nenner bitte höchstens 24.';else if(f.z/f.n>6)e='Höchstens 6 Ganze, bitte.';else if(!(T>0))e='Bitte eine Größe eintragen.';else if(T>1e7)e='Die Größe ist zu groß – nimm eine größere Einheit.';else{cv(f,'ca');p={z:f.z,n:f.n,T,unit:$('#lU').value}}}}
  else if(t.id==='zahlenstrahl'){const f=rdFr('l1');
    if(need(f,'einen Bruch')){if(f.n>24)e='Nenner bitte höchstens 24.';else if(f.z/f.n>5)e='Bitte höchstens bis 5.';else{cv(f,'ca');p={z:f.z,n:f.n}}}}
  else if(t.id==='erweitern'){const f=rdFr('l1'),k=num('lk');
    if(need(f,'einen Bruch')){if(!(Number.isInteger(k)&&k>=1))e='Bitte eine ganze Zahl als Faktor eintragen.';else if(f.n>20||k>10)e='Nenner höchstens 20 und Faktor höchstens 10, damit man es noch gut sieht.';else if(f.z/f.n>3)e='Bitte Brüche bis höchstens 3 Ganze.';else{cv(f,'ca');p={z:f.z,n:f.n,k}}}}
  else if(t.id==='kuerzen'){const f=rdFr('l1');let k=num('lk');
    if(need(f,'einen Bruch')){if(k==null)k=gcd(f.z,f.n);
      if(!Number.isInteger(k)||k<2)e=`${f.z}/${f.n} lässt sich nicht kürzen (ggT ist 1).`;else if(f.z%k||f.n%k)e=`${k} ist kein gemeinsamer Teiler von ${f.z} und ${f.n}.`;else if(f.z/f.n>3)e='Bitte Brüche bis höchstens 3 Ganze.';else if(f.n>400||f.n/k>20)e='Zahlen bitte etwas kleiner wählen.';else p={z:f.z,n:f.n,k}}}
  else{const f1=rdFr('l1'),f2=rdFr('l2');
    if(need(f1,'den ersten Bruch')&&need(f2,'den zweiten Bruch')){const a=f1.z,n=f1.n,b=f2.z,m=f2.n,N=lcm(n,m);
      if(n>24||m>24)e='Nenner bitte höchstens 24.';
      else if(t.id==='mult'&&(n>12||m>12))e='Für das Flächenmodell bitte Nenner bis 12.';
      else if(t.id==='mult'&&(a<1||b<1))e='Bitte Faktoren größer als 0.';

      else if(t.id==='sub'&&a/n<b/m)e='Der zweite Bruch ist größer als der erste – das Ergebnis wäre negativ.';
      else if(t.id==='add'&&a/n+b/m>6)e='Das Ergebnis bitte höchstens 6 Ganze.';

  p.conv=conv;

const dispFr=(z,n,c,mix)=>mix&&z>n&&z%n?mixed(z,n,c):F(z,n,c);
// Kurzlösung: kürzen und ggf. gemischte Zahl
function wsFinal(z,n){const g=gcd(z,n),zz=z/g,nn=n/g;let s='';
  if(g>1)s+=` = ${nn===1?zz:F(zz,nn)}`;
  if(nn>1&&zz>nn)s+=` = ${mixed(zz,nn)}`;
  return s}
// leere Streifen zum Einzeichnen
function wsBars(list){const w=560,h=22,gap=8;let s='',y=2;
  list.forEach(([n,lab,wh])=>{wh=wh||1;const uw=(w-70)/Math.max(...list.map(l=>l[2]||1));
    s+=T(0,y+h/2,lab||'','txs',12,'start');
    for(let j=0;j<wh;j++){const x0=70+j*uw;for(let c=1;c<n;c++)s+=`<line x1="${x0+c*uw/n}" y1="${y}" x2="${x0+c*uw/n}" y2="${y+h}" stroke="var(--ink)" stroke-width="1"/>`;
      s+=`<rect x="${x0}" y="${y}" width="${uw}" height="${h}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`;}
    y+=h+gap});
  return `<div class="ws-draw">${svgWrap(600,y,s)}</div>`}
function wsQA(tid,T0){
  const p=T0.p;let q='',a='',wide=false,draw=null;
  if(tid==='groessen'){const u=UNITS[p.unit],res=p.T/p.n*p.z,cv=convLower(p.unit,res);
    q=`${F(p.z,p.n)} von ${fmt(p.T)} ${u.name} = ${BL(60)} ${u.name}`;a=`${fmt(res)} ${u.name}${cv?' = '+cv:''}`;draw=[[p.n,'',Math.ceil(p.z/p.n)]];}
  else if(tid==='zahlenstrahl'){wide=true;
    if(T0.type==='zread'){q=`Welcher Bruch ist markiert?<div class="ws-svg">${zsLineSVG(p,{at:p.z,letter:'?',col:'var(--ink)'})}</div>? = ${BF()}`;a=`${F(p.z,p.n)}${p.z>p.n&&p.z%p.n?' = '+mixed(p.z,p.n):''}`}
    else{q=`Markiere ${dispZ(p.z,p.n)} am Zahlenstrahl.<div class="ws-svg">${zsLineSVG(p)}</div>`;a=`<div class="ws-svg">${zsLineSVG(p,{at:p.z,label:[p.z,p.n],col:'var(--ink)'})}</div>`}}
  else if(tid==='erweitern'){const zk=p.z*p.k,nk=p.n*p.k;
    if(T0.ask==='erw')q=`Erweitere mit ${p.k}: ${F(p.z,p.n)} = ${BF()}`;
    else if(T0.ask==='erwN')q=`Erweitere auf den Nenner ${nk}: ${F(p.z,p.n)} = ${F(BOX(),nk)}`;
    else if(T0.ask==='erwZ')q=`${F(p.z,p.n)} = ${F(BOX(),nk)}`;
    else q=`${F(p.z,p.n)} = ${F(zk,BOX())}`;
    a=`${F(p.z,p.n)} = ${F(zk,nk)} <span class="ws-note">(mit ${p.k} erweitert)</span>`;draw=[[p.n,`${p.z}/${p.n}`],[nk,'']];}
  else if(tid==='kuerzen'){const r=T0.ask==='kurzK'?[p.z/p.k,p.n/p.k]:exact(p.z,p.n);
    q=(T0.ask==='kurzK'?`Kürze mit ${p.k}: `:'Kürze vollständig: ')+`${F(p.z,p.n)} = ${BF()}`;a=`${F(p.z,p.n)} = ${F(r[0],r[1])}`;if(p.n<=36)draw=[[p.n,''],[r[1],'']];}
  else if(tid==='vergleich'){
    if(T0.type==='cmp'){q=`${F(p.a,p.n)} <span class="ws-circ"></span> ${F(p.b,p.m)}`;a=`${F(p.a,p.n)} <b>${REL[relOf(p.a/p.n,p.b/p.m)]}</b> ${F(p.b,p.m)}`;draw=[[p.n,`${p.a}/${p.n}`],[p.m,`${p.b}/${p.m}`]];}
    else{wide=true;const D=ordData(p);q=`Ordne vom kleinsten zum größten Bruch: ${p.fr.map(([z,n])=>F(z,n)).join(', ')}<div class="ws-ordline">${p.fr.map(()=>BL(56)).join(' &lt; ')}</div>`;
      a=D.order.map((i,j)=>(j?' &lt; ':'')+F(D.fr[i][0],D.fr[i][1])).join('');}}
  else{const {a:A0,n,b:B0,m}=p,sym=OPSYM[tid];
    q=`${dispFr(A0,n,'',p.mix)} ${sym} ${dispFr(B0,m,'',p.mix)} = ${BL(90)}`;
    if(tid==='add'||tid==='sub'){const N=lcm(n,m),A=A0*N/n,B=B0*N/m,R=tid==='add'?A+B:A-B;
      a=(n!==m?`${F(A,N)} ${sym} ${F(B,N)} = `:'= ')+F(R,N)+wsFinal(R,N);draw=[[n,`${A0}/${n}`,Math.ceil(A0/n)],[m,`${B0}/${m}`,Math.ceil(B0/m)],[N,'Ergebnis',Math.max(1,Math.ceil((tid==='add'?A+B:A)/N))]];}
    else if(tid==='mult')a=`= ${F(`${A0}·${B0}`,`${n}·${m}`)} = ${F(A0*B0,n*m)}`+wsFinal(A0*B0,n*m);
    else a=`= ${F(A0,n)} · ${F(m,B0)} = ${F(A0*m,n*B0)}`+wsFinal(A0*m,n*B0);}
  return {q,a,wide,draw};
}
function abEnsure(){
  AB.topics=AB.topics.filter(id=>TOPICS.some(t=>t.id===id));if(!AB.topics.length)AB.topics=[S.topic];
  AB.topics.forEach(id=>{const arr=(AB.tasks[id]||[]).slice(0,AB.count);
    for(let i=0;i<AB.count;i++){const L=abLvl(i);if(!arr[i]||arr[i].lvl!==L)arr[i]={lvl:L,t:gen(id,L)}}
    AB.tasks[id]=arr});
  saveAB();
}
function abSheet(sol){
  const ordered=TOPICS.filter(t=>AB.topics.includes(t.id));
  const lv=AB.lvl==='mix'?'gemischt':LVN[+AB.lvl];
  let h=`<div class="ws-page${sol?' ws-sol':''}"><div class="ws-head"><div><div class="ws-title">${esc(AB.title||'Bruchrechnung')}${sol?' – Lösungen':''}</div><div class="ws-sub">${ordered.map(t=>t.name).join(' · ')} · Niveau: ${lv}</div></div>
    ${sol?'':'<div class="ws-meta"><span>Name: <i></i></span><span>Klasse: <i class="s"></i></span><span>Datum: <i class="s"></i></span></div>'}</div>`;
  ordered.forEach((t,si)=>{h+=`<section class="ws-sec"><h3><span class="ws-num">${si+1}</span>${t.name}</h3>${sol?'':`<p class="ws-instr">${WS_INSTR[t.id]||''}</p>`}<div class="ws-grid">`;
    AB.tasks[t.id].forEach((e,i)=>{const r=wsQA(t.id,e.t);
      h+=`<div class="ws-task${r.wide?' ws-wide':''}"${sol?'':` data-tid="${t.id}" data-i="${i}" role="button" tabindex="0" aria-label="Aufgabe ${'abcdefgh'[i]} austauschen"`}><span class="ws-l">${'abcdefgh'[i]})</span><div class="ws-q">${sol?r.a:r.q}${!sol&&AB.draw&&r.draw?wsBars(r.draw):''}</div>${sol?'':'<span class="ws-swap" aria-hidden="true">↻</span>'}</div>`});
    h+='</div></section>'});
  return h+`<div class="ws-foot">Bruch-Werkstatt · buildspaceos.de</div></div>`;
}
function renderAB(){
  abEnsure();
  $('#main').innerHTML=`<div class="card abctl">
    <div class="abrow"><span class="ablab">Themen</span><div class="abchips" id="abTop">${TOPICS.map(t=>`<button class="abchip" data-t="${t.id}" aria-pressed="${AB.topics.includes(t.id)}"><span class="ti">${t.ic}</span>${t.name}</button>`).join('')}</div></div>
    <div class="abrow"><span class="ablab">Niveau</span><div class="tabs small" id="abLvl">${[['0','Basis'],['1','Profi'],['2','Experte'],['mix','gemischt']].map(([k,l])=>`<button data-v="${k}" aria-pressed="${String(AB.lvl)===k}">${l}</button>`).join('')}</div></div>
    <div class="abrow"><span class="ablab">Aufgaben je Thema</span><div class="tabs small" id="abCnt">${[2,3,4,6,8].map(k=>`<button data-v="${k}" aria-pressed="${AB.count===k}">${k}</button>`).join('')}</div></div>
    <div class="abrow"><span class="ablab">Optionen</span><label class="abopt"><input type="checkbox" id="abSol" ${AB.sol?'checked':''}> Lösungsblatt mitdrucken</label><label class="abopt"><input type="checkbox" id="abDraw" ${AB.draw?'checked':''}> Zeichenhilfe (leere Streifen)</label></div>
    <div class="abrow"><span class="ablab">Überschrift</span><input id="abTitle" class="abtitle" value="${esc(AB.title)}" maxlength="60" aria-label="Überschrift des Arbeitsblatts"></div>
    <div class="abrow abbtns"><button class="btn" id="abPrint">🖨 Drucken</button><button class="btn ghost" id="abNew">↻ Alle Aufgaben neu</button></div>
    <p class="small muted abhint">Tippe im Blatt auf eine Aufgabe, um sie gegen eine neue auszutauschen. Am Handy öffnet „Drucken“ das Druckmenü – dort geht auch „Als PDF sichern“.</p>
  </div>
  <div class="ws-wrap" id="wsWrap"></div>`;
  const redraw=()=>{abEnsure();$('#wsWrap').innerHTML=abSheet(false)+(AB.sol?`<div class="ws-prevlab">Vorschau Lösungsblatt</div>`+abSheet(true):'');
    $('#wsWrap').querySelectorAll('.ws-task[data-tid]').forEach(el=>{const go=()=>{const id=el.dataset.tid,i=+el.dataset.i,L=abLvl(i);AB.tasks[id][i]={lvl:L,t:gen(id,L)};saveAB();redraw();
        const n=$(`#wsWrap .ws-task[data-tid="${id}"][data-i="${i}"]`);if(n){n.classList.add('ws-new');n.focus({preventScroll:true})}};
      el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});};
  $('#abTop').querySelectorAll('.abchip').forEach(b=>b.onclick=()=>{const id=b.dataset.t;
    if(AB.topics.includes(id)){if(AB.topics.length>1)AB.topics=AB.topics.filter(x=>x!==id)}else AB.topics.push(id);
    $('#abTop').querySelectorAll('.abchip').forEach(x=>x.setAttribute('aria-pressed',AB.topics.includes(x.dataset.t)));redraw()});
  $('#abLvl').querySelectorAll('button').forEach(b=>b.onclick=()=>{AB.lvl=b.dataset.v==='mix'?'mix':+b.dataset.v;$('#abLvl').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));redraw()});
  $('#abCnt').querySelectorAll('button').forEach(b=>b.onclick=()=>{AB.count=+b.dataset.v;$('#abCnt').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));redraw()});
  $('#abSol').onchange=e=>{AB.sol=e.target.checked;saveAB();redraw()};
  $('#abDraw').onchange=e=>{AB.draw=e.target.checked;saveAB();redraw()};
  $('#abTitle').oninput=e=>{AB.title=e.target.value;saveAB();$('#wsWrap').querySelectorAll('.ws-title').forEach((x,i)=>{x.textContent=(AB.title||'Bruchrechnung')+(i?' – Lösungen':'')})};
  $('#abNew').onclick=()=>{AB.tasks={};redraw()};
  $('#abPrint').onclick=abPrint;
  redraw();
}
function abPrint(){
  let pa=document.getElementById('printArea');if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa)}
  pa.innerHTML=abSheet(false)+(AB.sol?abSheet(true):'');
  setTimeout(()=>{try{window.print()}catch(e){alert('Drucken wird von diesem Browser nicht unterstützt. Öffne die Seite bitte in Safari oder Chrome.')}},60);
}

/* ============ Start ============ */
function renderAll(){renderTopics();renderModes();renderKind();renderView();
  const ab=S.mode==='ab';$('#viewSeg').style.display=ab?'none':'';$('#topics').style.display=ab?'none':'';$('.foot').style.display=ab?'none':'';
  if(S.mode==='bsp')renderBsp();else if(S.mode==='ueben')renderUeben();else if(ab)renderAB();else renderLabor();
  const a=$('#topics [aria-pressed=true]');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'});
}
renderAll();
})();
