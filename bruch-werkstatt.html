<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruch-Werkstatt</title>
<meta name="description" content="Bruchrechnung ikonisch und symbolisch: Brüche & Größen, Erweitern, Kürzen und alle vier Grundrechenarten mit gleichnamigen und ungleichnamigen Brüchen – mit Beispielen, Übungsaufgaben und Bild-Hilfe.">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="assets/icon-v3-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<link rel="stylesheet" href="assets/fonts/nunito.css">
<style>
:root{
  --bg:#f4f1ea;--ink:#1f2a3a;--soft:#5d6878;--line:rgba(31,42,58,.16);--card:#fffdf8;--card2:#f1ede3;
  --acc:#2E6099;--accdark:#1f4670;--accink:#fff;--accsoft:rgba(46,96,153,.12);
  --A:#3b7fd9;--Asoft:#cfe1fa;--B:#ef8a1f;--Bsoft:#fde1c2;--R:#2f9e5d;--Rsoft:#cdeeda;--K:#8b4fd1;--X:#d6453d;
  --cellline:#1f2a3a;--empty:#ffffff;
  --ok:#2f9e5d;--okbg:#dcf5e5;--bad:#d6453d;--badbg:#fde2df;--warn:#b7791f;--warnbg:#fdf0d5;
  --shadow:0 6px 20px rgba(31,42,58,.10);
  --font:'Nunito',ui-rounded,'SF Pro Rounded','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a24;--ink:#e8edf5;--soft:#9aa6b8;--line:rgba(232,237,245,.16);--card:#1d2532;--card2:#252f3f;
  --acc:#6fa3e6;--accdark:#3f6fae;--accink:#0d1520;--accsoft:rgba(111,163,230,.16);
  --A:#5b9bf0;--Asoft:#24456f;--B:#f5a04a;--Bsoft:#5e3b16;--R:#45c07a;--Rsoft:#1d4b31;--K:#b38af0;--X:#ff6b62;
  --cellline:#c9d3e2;--empty:#10161f;
  --okbg:#183c28;--badbg:#4a1d1a;--warnbg:#4a3a14;--warn:#f0c060;
  --shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
.muted{color:var(--soft)}.small{font-size:.88rem}

header.top{display:flex;align-items:center;gap:14px;padding:46px 4px 6px}
.logo{width:58px;height:58px;flex:none}
header h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:900;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--soft);font-size:.98rem}

/* Themen */
.topics{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.topics::-webkit-scrollbar{display:none}
.topic{flex:none;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1rem;white-space:nowrap}
.topic .ti{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--card2);font-weight:900}
.topic[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.topic[aria-pressed=true] .ti{background:rgba(255,255,255,.25)}

.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 12px}
.tabs{display:inline-flex;background:var(--card2);border-radius:999px;padding:4px;gap:4px}
.tabs button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;font-weight:800;color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:800}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.merke{display:flex;gap:12px;align-items:flex-start;background:var(--accsoft);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.merke b.tag{flex:none;background:var(--acc);color:var(--accink);border-radius:10px;padding:2px 10px;font-size:.85rem;margin-top:3px}
.merke div{flex:1}

/* Stepper */
.exrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.split{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.ph .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.stage svg{width:100%;height:auto;display:block}
.say{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--card2);font-weight:600;min-height:52px}
.sym{display:flex;flex-direction:column;gap:12px;font-size:1.35rem;font-weight:700}
.sym .ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;border-radius:12px}
.sym .ln.new{background:var(--accsoft);animation:fadeIn .45s ease}
.sym .note{font-size:.85rem;color:var(--soft);font-weight:700;width:100%}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--acc);color:var(--accink);font-weight:900;font-size:1.02rem;box-shadow:0 4px 0 var(--accdark)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accdark)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.warm{background:var(--B);color:#2b1600;box-shadow:0 4px 0 #b4600d}
.btn.green{background:var(--R);color:#fff;box-shadow:0 4px 0 #1e6e3f}

/* Bruch (symbolisch) */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}
.fr>span{padding:0 4px;min-width:1ch;text-align:center}
.fr>span:first-child{border-bottom:3px solid currentColor;padding-bottom:2px}
.fr>span:last-child{padding-top:2px}
.ca{color:var(--A)}.cb{color:var(--B)}.cr{color:var(--R)}.ck{color:var(--K)}.cx{color:var(--X)}
.op{font-weight:900;padding:0 2px}
.mix{display:inline-flex;align-items:center;gap:2px}

/* Üben */
.lvls{display:flex;flex-wrap:wrap;gap:8px}
.lvl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:56px;padding:6px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800}
.lvl span{font-weight:600;font-size:.8rem;color:var(--soft)}
.lvl[aria-pressed=true]{border-color:var(--acc);background:var(--accsoft)}
.score{font-weight:800;color:var(--soft)}
.task{font-size:1.6rem;font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px}
.instr{color:var(--soft);font-weight:700;margin-bottom:6px}
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0;font-size:1.5rem;font-weight:800}
.ansrow .lab{font-size:.95rem;color:var(--soft);font-weight:800;min-width:150px}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin input{width:72px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--empty);text-align:center;font-size:1.4rem;font-weight:800}
.fin .fl{width:84px;height:4px;border-radius:2px;background:var(--ink)}
.numin{width:110px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--empty);text-align:center;font-size:1.4rem;font-weight:800}
input.good{border-color:var(--ok);background:var(--okbg)}
input.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;padding:12px 16px;border-radius:14px;font-weight:700;display:none}
.fb.show{display:block;animation:fadeIn .3s}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb.half{background:var(--warnbg);color:var(--warn)}
.help{margin-top:16px;display:none}
.help.show{display:block;animation:fadeIn .3s}

/* Labor */
.form{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:1.5rem;font-weight:800;margin-bottom:6px}
.form select,.form .sel{height:52px;border-radius:12px;border:2px solid var(--line);background:var(--empty);font-size:1.1rem;font-weight:800;padding:0 10px}
.err{color:var(--bad);font-weight:700;margin-top:8px;min-height:1.4em}

/* SVG */
.cell{stroke:var(--cellline);stroke-width:1}
.thick{stroke:var(--cellline);stroke-width:3;fill:none}
.thin{stroke:var(--cellline);stroke-width:1.2;fill:none;opacity:.75}
.dash{stroke:var(--cellline);stroke-width:1.2;fill:none;opacity:.45;stroke-dasharray:4 4}
.fA{fill:var(--A)}.fB{fill:var(--B)}.fR{fill:var(--R)}.fE{fill:var(--empty)}.fAs{fill:var(--Asoft)}.fBs{fill:var(--Bsoft)}
.tx{fill:var(--ink);font-family:var(--font);font-weight:800}
.txs{fill:var(--soft);font-family:var(--font);font-weight:700}
.txA{fill:var(--A)}.txB{fill:var(--B)}.txR{fill:var(--R)}.txK{fill:var(--K)}.txX{fill:var(--X)}
.stA{stroke:var(--A)}.stB{stroke:var(--B)}.stR{stroke:var(--R)}.stK{stroke:var(--K)}.stX{stroke:var(--X)}
.br{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cross{stroke:var(--X);stroke-width:3;stroke-linecap:round}
.pop{animation:pop .5s ease both}
.grow{animation:grow .7s ease both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dual{display:grid;gap:10px}
.dual>div{min-width:0}
.dual>div+div{border-top:2px dashed var(--line);padding-top:10px}
.vlab{font-weight:800;color:var(--soft);font-size:.85rem;margin-right:2px}
.foot{margin-top:24px;text-align:center;font-size:.85rem;color:var(--soft)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 60 60" aria-hidden="true"><rect x="4" y="10" width="52" height="40" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><rect x="10" y="16" width="13" height="28" rx="3" fill="var(--A)"/><rect x="24" y="16" width="13" height="28" rx="3" fill="var(--B)"/><rect x="38" y="16" width="12" height="28" rx="3" fill="var(--empty)" stroke="var(--cellline)" stroke-width="1.5"/></svg>
    <div><h1>Bruch-Werkstatt</h1><p>Brüche sehen, verstehen, rechnen – Bild und Rechnung Hand in Hand.</p></div>
  </header>

  <nav class="topics" id="topics" aria-label="Themen"></nav>

  <div class="bar2">
    <div class="tabs" id="modeTabs" role="group" aria-label="Bereich">
      <button data-mode="bsp" aria-pressed="true">Beispiele</button>
      <button data-mode="ueben" aria-pressed="false">Üben</button>
      <button data-mode="labor" aria-pressed="false">Eigene Brüche</button>
    </div>
    <div class="row" style="gap:10px;align-items:center"><div class="seg" id="kindSeg"></div><div class="seg" id="viewSeg" role="group" aria-label="Darstellung"></div></div>
  </div>

  <div id="main"></div>
  <p class="foot">Farben: <b class="ca">1. Bruch</b> · <b class="cb">2. Bruch</b> · <b class="cr">Ergebnis</b> · <b class="ck">Faktor</b></p>
</div>

<script>
(function(){
"use strict";
/* ============ Mathe-Helfer ============ */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=x=>(Math.round(x*1000)/1000).toLocaleString('de-DE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('bruchwerkstatt:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('bruchwerkstatt:'+k,JSON.stringify(v))}catch(e){}}};

/* ============ Symbolische Bausteine ============ */
const F=(z,n,c)=>`<span class="fr ${c||''}"><span>${z}</span><span>${n}</span></span>`;
const K=s=>`<span class="ck">${s}</span>`;
const O=s=>`<span class="op">${s}</span>`;
function mixed(z,n,c){ // gemischte Zahl, falls sinnvoll
  if(n===1) return `<span class="${c||''}">${z}</span>`;
  if(z<n) return F(z,n,c);
  const g=Math.floor(z/n),r=z%n;
  return r?`<span class="mix ${c||''}">${g}${F(r,n,c)}</span>`:`<span class="${c||''}">${g}</span>`;
}
// Ergebnis z/n: kürzen + ggf. gemischte Zahl als weitere Zeilen
function finishLines(z,n){
  const out=[];const g=gcd(z,n);
  if(g>1){
    const zz=z/g,nn=n/g;
    out.push({h:`${O('=')} ${F(`${z}${K(':'+g)}`,`${n}${K(':'+g)}`)} ${O('=')} ${nn===1?`<span class="cr">${zz}</span>`:F(zz,nn,'cr')}`,note:`kürzen mit ${g}`});
    if(nn>1&&zz>nn) out.push({h:`${O('=')} ${mixed(zz,nn,'cr')}`,note:'als gemischte Zahl'});
  }else if(z>n&&n>1){out.push({h:`${O('=')} ${mixed(z,n,'cr')}`,note:'als gemischte Zahl'})}
  return out;
}

/* ============ SVG-Bausteine ============ */
let pid=0;
function svgWrap(w,h,body){pid++;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Bild-Darstellung"><defs><pattern id="hb${pid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="var(--Bsoft)"/><line x1="0" y1="0" x2="0" y2="9" stroke="var(--B)" stroke-width="4"/></pattern><pattern id="hx${pid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="9" height="9" fill="var(--empty)"/><line x1="0" y1="0" x2="0" y2="9" stroke="var(--X)" stroke-width="3"/></pattern></defs>${body.replace(/__HB__/g,`url(#hb${pid})`).replace(/__HX__/g,`url(#hx${pid})`)}</svg>`}
const T=(x,y,s,cls,size,anchor)=>`<text x="${x}" y="${y}" class="${cls||'tx'}" font-size="${size||18}" text-anchor="${anchor||'middle'}" dominant-baseline="middle">${s}</text>`;
// Bruch als SVG-Text
function TF(x,y,z,n,cls,size){size=size||20;const w=Math.max(String(z).length,String(n).length)*size*.62+8;
  const col=cls&&/^tx[ABRKX]$/.test(cls)?`var(--${cls.slice(2)})`:'var(--ink)';
  return `<g>${T(x,y-size*.62,z,'tx '+(cls||''),size)}<line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="${col}" stroke-width="2.5"/>${T(x,y+size*.68,n,'tx '+(cls||''),size)}</g>`}
/* Streifen (ein Ganzes): parts = Grobteilung, sub = Feinteilung je Teil,
   fills: Array der Länge parts*sub mit Klassen ('fA','fB','fR','fE','X'),
   subStyle: 'thin'|'dash'|'new' */
function stripe(x,y,w,h,o){
  const N=o.parts*o.sub, cw=w/N; let s='';
  for(let i=0;i<N;i++){const f=o.fills[i]||'fE';
    if(f==='X') s+=`<rect x="${x+i*cw}" y="${y}" width="${cw}" height="${h}" fill="__HX__"/>`;
    else if(f==='HB') s+=`<rect x="${x+i*cw}" y="${y}" width="${cw}" height="${h}" fill="__HB__"/>`;
    else s+=`<rect x="${x+i*cw}" y="${y}" width="${cw}" height="${h}" class="${f}"/>`;}
  if(o.sub>1){const cls=o.subStyle==='dash'?'dash':'thin';const anim=o.subStyle==='new'?' grow':'';
    for(let i=1;i<N;i++){if(i%o.sub===0)continue;s+=`<line x1="${x+i*cw}" y1="${y}" x2="${x+i*cw}" y2="${y+h}" class="${cls}${anim}"/>`}}
  for(let i=1;i<o.parts;i++){s+=`<line x1="${x+i*o.sub*cw}" y1="${y}" x2="${x+i*o.sub*cw}" y2="${y+h}" class="thick"/>`}
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="thick"/>`;
  return s;
}
// Mehrere Ganze untereinander: total Teile pro Ganzes, fills länger als ein Ganzes möglich
function stripes(x,y,w,h,gap,o){
  const N=o.parts*o.sub;const wholes=Math.max(1,Math.ceil(o.fills.length/N));let s='';
  for(let k=0;k<wholes;k++){s+=stripe(x,y+k*(h+gap),w,h,{...o,fills:o.fills.slice(k*N,(k+1)*N)});
    if(wholes>1)s+=T(x-14,y+k*(h+gap)+h/2,(k+1)+'.','txs',14,'end');}
  return {svg:s,height:wholes*h+(wholes-1)*gap};
}
function brace(x1,x2,y,label,col,down){ // geschweifte Klammer unter (down=true) / über
  const d=down?1:-1,m=(x1+x2)/2,h=10*d;
  return `<path class="br st${col}" d="M${x1},${y} q0,${h} 8,${h} L${m-8},${y+h} q8,0 8,${h} q0,${-h} 8,${-h} L${x2-8},${y+h} q-8,0 -8,${-h}"/>`+T(m,y+h*2+12*d,label,'tx tx'+col,17);
}
const fillArr=(len,spec)=>{const a=new Array(len).fill('fE');let i=0;spec.forEach(([cnt,cls])=>{for(let k=0;k<cnt;k++)a[i++]=cls});return a};

/* ============ Szenen-Generatoren ============
   Jede Szene: {g: SVG, t: Erklärtext, s: [{h, note}] (neue Symbolzeilen dieses Schritts)} */
const W=600,X0=30;

/* --- Kreis-Bausteine (gleiche Optionen wie stripe) --- */
let SHAPE='rect';
const PI2=Math.PI*2;
const ang=(i,N)=>-Math.PI/2+i*PI2/N;
function sectorPath(cx,cy,r,a0,a1){if(a1-a0>=PI2-1e-9)return null;const lg=(a1-a0)>Math.PI?1:0;
  return `M${cx},${cy} L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 ${lg} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} Z`}
function pie(cx,cy,r,o){
  const N=o.parts*o.sub;let s='';
  for(let i=0;i<N;i++){const f=o.fills[i]||'fE';const d=sectorPath(cx,cy,r,ang(i,N),ang(i+1,N));
    const fa=f==='X'?'fill="__HX__"':f==='HB'?'fill="__HB__"':`class="${f}"`;
    s+=d?`<path d="${d}" ${fa}/>`:`<circle cx="${cx}" cy="${cy}" r="${r}" ${fa}/>`;}
  const ray=(i,cls)=>{const a=ang(i,N);return `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" class="${cls}"/>`};
  if(o.sub>1){const cls=o.subStyle==='dash'?'dash':'thin';const an=o.subStyle==='new'?' grow':'';for(let i=0;i<N;i++){if(i%o.sub)s+=ray(i,cls+an)}}
  if(o.parts>1)for(let i=0;i<o.parts;i++)s+=ray(i*o.sub,'thick');
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" class="thick"/>`;
  return s;
}
// mehrere Ganze als Kreise nebeneinander
function pies(x,y,w,r,o){
  const N=o.parts*o.sub,n=Math.max(1,Math.ceil(o.fills.length/N)),gap=18;
  const rr=Math.min(r,(w-(n-1)*gap)/(2*n)),tot=n*2*rr+(n-1)*gap;let s='';const cs=[];
  for(let k=0;k<n;k++){const cx=x+(w-tot)/2+rr+k*(2*rr+gap);cs.push(cx);s+=pie(cx,y+rr,rr,{...o,fills:o.fills.slice(k*N,(k+1)*N)})}

// Ganze: Rechteck-Streifen untereinander oder Kreise nebeneinander

/* --- Brüche & Größen --- */
const UNITS={

function scGroessen(p){
  const u=UNITS[p.unit],Tt=p.T,part=Tt/p.n,res=part*p.z;

  function draw(st){

        if(st>=1&&p.n<=12)for(let i=0;i<p.n;i++){const am=(ang(i,p.n)+ang(i+1,p.n))/2;s+=T(cx+r.r*.62*Math.cos(am),r.cy+r.r*.62*Math.sin(am),fmt(part),k*p.n+i<p.z&&st>=2?'tx':'txs',r.r<80||p.n>8?12:15)}
      });
      const H=38+r.height+44;
      s+=T(300,H-16,st>=2?`${p.z} Teile = ${fmt(res)} ${u.name}`:st===1?`${p.n} gleich große Teile zu je ${fmt(part)} ${u.name}`:wl,st>=2?'tx txA':'tx',18);
      return svgWrap(W,H,s);
    }
    let s=T(300,22,wl+(wh>1?' (je Streifen)':''),'tx',17);

    if(st>=1&&p.n<=12){const cw=(W-2*X0-20)/p.n;for(let k=0;k<wh;k++)for(let i=0;i<p.n;i++)s+=T(X0+10+cw*(i+.5),44+k*86+30,fmt(part),k*p.n+i<p.z&&st>=2?'tx':'txs',p.n>8?12:15)}
    if(st>=2&&wh===1){const cw=(W-2*X0-20)/p.n;s+=brace(X0+10,X0+10+cw*p.z,44+64,`${fmt(res)} ${u.name}`,'A',true)}
    const H=44+r.height+(st>=2&&wh===1?60:34);
    if(st>=2&&wh>1)s+=T(300,H-10,`${p.z} Teile = ${fmt(res)} ${u.name}`,'tx txA',18);
    if(st===1&&wh===1)s+=T(300,H-10,`${p.n} gleich große Teile`,'txs',15);

  }
  const of=`${F(p.z,p.n,'ca')} von ${fmt(Tt)} ${u.name}`;
  return [

    {g:draw(2),t:`Nimm ${p.z} dieser Teile: ${fmt(part)} ${u.name} · ${p.z} = ${fmt(res)} ${u.name}.`,s:[{h:`${fmt(part)} ${u.name} ${O('·')} <span class="ca">${p.z}</span> ${O('=')} <b class="cr">${fmt(res)} ${u.name}</b>`,note:'mal den Zähler → so viele Teile'},{h:`${of} ${O('=')} <b class="cr">${fmt(res)} ${u.name}</b>`}]}

/* --- Gitter (Erweitern/Kürzen): cols Spalten, rows Zeilen, zCols gefärbte Spalten --- */
function grid(x,y,w,h,cols,rows,zCols,rowStyle,fillCls){
  let s='';const cw=w/cols,rh=h/rows;
  for(let c=0;c<cols;c++)s+=`<rect x="${x+c*cw}" y="${y}" width="${cw}" height="${h}" class="${c<zCols?fillCls:'fE'}"/>`;
  if(rows>1&&rowStyle!=='none'){const cls=rowStyle==='dash'?'dash':'thin';const an=rowStyle==='new'?' grow':'';
    for(let r=1;r<rows;r++)s+=`<line x1="${x}" y1="${y+r*rh}" x2="${x+w}" y2="${y+r*rh}" class="${cls}${an}" style="stroke-width:${rowStyle==='dash'?1.2:2}"/>`}
  for(let c=1;c<cols;c++)s+=`<line x1="${x+c*cw}" y1="${y}" x2="${x+c*cw}" y2="${y+h}" class="thick"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="thick"/>`;
  return s;
}
// Ein Ganzes: parts große Teile, je sub feine Teile, zParts große Teile gefärbt

const figLabX=()=>SHAPE==='circle'?PC.cx+PC.r+95:520;

function scKuerzen(p){

/* --- Addition / Subtraktion --- */
const SW=W-2*X0-20, SX=X0+20;
function scAddSub(p,op){
  const {a,n,b,m}=p,N=lcm(n,m),fa=N/n,fb=N/m,A=a*fa,B=b*fb;
  const same=n===m;const R=op==='+'?A+B:A-B;
  const bh=56,gap=22,sign=op==='+'?'+':'−';
  const sc=[];
  function twoBars(refined,style){
    let s='',y=16;
    const ra=wholes(SX+20,y,SW-20,bh,gap,{parts:n,sub:refined?fa:1,subStyle:style,fills:fillArr(Math.max(1,Math.ceil(a/n))*n*(refined?fa:1),[[refined?A:a,'fA']])});
    s+=ra.svg+TF(SX-8,y+ra.height/2,a,n,'txA',17);y+=ra.height+gap+6;
    s+=T(SX-8,y-(gap+6)/2,sign,'tx '+(op==='+'?'':'txX'),24);
    const rb=wholes(SX+20,y,SW-20,bh,gap,{parts:m,sub:refined?fb:1,subStyle:style,fills:fillArr(Math.max(1,Math.ceil(b/m))*m*(refined?fb:1),[[refined?B:b,'fB']])});
    s+=rb.svg+TF(SX-8,y+rb.height/2,b,m,'txB',17);
    return svgWrap(W,y+rb.height+16,s);
  }
  const resPic=(fills,parts,sub,style,label,cls)=>{const r=wholes(SX+20,16,SW-20,bh,gap,{parts,sub,subStyle:style,fills,r:70});return svgWrap(W,r.height+60,r.svg+T(300,r.height+38,label,cls,18))};
  sc.push({g:twoBars(false,'thin'),t:(op==='+'?`Wir addieren ${a}/${n} und ${b}/${m}.`:`Von ${a}/${n} sollen ${b}/${m} weggenommen werden.`)+(same?' Die Teile sind gleich groß (gleichnamig).':' Die Teile sind verschieden groß (ungleichnamig) – so kann man sie nicht einfach '+(op==='+'?'zusammenzählen.':'abziehen.')),
    s:[{h:`${F(a,n,'ca')} ${O(sign)} ${F(b,m,'cb')}`}]});
  if(!same){
    sc.push({g:twoBars(true,'new'),t:`Gleichnamig machen: Hauptnenner ist ${N} (kleinstes gemeinsames Vielfaches von ${n} und ${m}). Das erste Ganze wird mit ${fa}, das zweite mit ${fb} erweitert – jetzt sind alle Teile gleich groß.`,
      s:[{h:`${O('=')} ${F(`${a}${K('·'+fa)}`,`${n}${K('·'+fa)}`)} ${O(sign)} ${F(`${b}${K('·'+fb)}`,`${m}${K('·'+fb)}`)}`,note:`erweitern auf den Hauptnenner ${N}`},{h:`${O('=')} ${F(A,N,'ca')} ${O(sign)} ${F(B,N,'cb')}`}]});
  }
  if(op==='+'){
    const wh=Math.max(1,Math.ceil(R/N));
    sc.push({g:resPic(fillArr(wh*N,[[A,'fA'],[B,'fB']]),N,1,'thin',`${A} + ${B} = ${R} Teile von je 1/${N}`,'tx'),t:`Jetzt die gleich großen Teile zusammenlegen: ${A} + ${B} = ${R} Teile. Der Nenner (die Teilgröße) bleibt ${N}.`,
      s:[{h:`${O('=')} ${F(`${A} + ${B}`,N)} ${O('=')} ${F(R,N,'cr')}`,note:'Zähler addieren, Nenner bleibt'}]});
  }else{
    const wh=Math.max(1,Math.ceil(A/N));
    sc.push({g:resPic(fillArr(wh*N,[[A-B,'fA'],[B,'X']]),N,1,'thin',`${B} von ${A} Teilen werden weggestrichen`,'tx txX'),t:`Von den ${A} gefärbten Teilen werden ${B} weggenommen (rot schraffiert).`,
      s:[{h:`${O('=')} ${F(`${A} − ${B}`,N)}`,note:'Zähler subtrahieren, Nenner bleibt'}]});
    const wr=Math.max(1,Math.ceil(R/N));
    sc.push({g:resPic(fillArr(wr*N,[[R,'fR']]),N,1,'thin',`Es bleiben ${R} Teile übrig`,'tx txR'),t:`Es bleiben ${R} von ${N} Teilen übrig: ${R}/${N}.`,s:[{h:`${O('=')} ${F(R,N,'cr')}`}]});
  }
  const fl=finishLines(R,N);
  if(fl.length){
    const g=gcd(R,N),d=N/g,wh=Math.max(1,Math.ceil(R/N));
    sc.push({g:resPic(fillArr(wh*N,[[R,'fR']]),d,g,g>1?'dash':'thin',g>1?`Je ${g} kleine Teile = 1 großes Teil`:`${Math.floor(R/N)} Ganzes und ${R%N}/${N}`,'tx txR'),
      t:g>1?`Das Ergebnis lässt sich kürzen: Je ${g} kleine Teile ergeben ein größeres Teil.`:`Mehr als ein Ganzes: ${R}/${N} ist eine gemischte Zahl.`,s:fl});
  }
  return sc;
}

/* --- Multiplikation: Flächenmodell (Rechteck) bzw. „Anteil vom Anteil“ (Kreis) --- */
function scMult(p){
  const {a,n,b,m}=p,circ=SHAPE==='circle';
  function drawRect(st){
    const gx=170,gy=24,S=260,cw=S/n,rh=S/m;let s='';
    for(let c=0;c<n;c++)for(let r=0;r<m;r++){
      const inA=c<a,inB=r<b;const f=st<2?(inA?'fA':'fE'):(inA&&inB?'fR':(inA?'fAs':'fE'));
      s+=`<rect x="${gx+c*cw}" y="${gy+r*rh}" width="${cw}" height="${rh}" class="${f} ${st===2&&inA&&inB?'pop':''}"/>`;
    }
    if(st===1)s+=`<rect x="${gx}" y="${gy}" width="${S}" height="${b*rh}" fill="__HB__" opacity=".72" class="grow"/>`;
    if(st>=1)for(let r=1;r<m;r++)s+=`<line x1="${gx}" y1="${gy+r*rh}" x2="${gx+S}" y2="${gy+r*rh}" class="thick ${st===1?'grow':''}" style="stroke-width:2"/>`;
    for(let c=1;c<n;c++)s+=`<line x1="${gx+c*cw}" y1="${gy}" x2="${gx+c*cw}" y2="${gy+S}" class="thick"/>`;
    s+=`<rect x="${gx}" y="${gy}" width="${S}" height="${S}" class="thick"/>`;
    s+=`<path class="br stA" d="M${gx},${gy+S+10} L${gx},${gy+S+18} L${gx+a*cw},${gy+S+18} L${gx+a*cw},${gy+S+10}"/>`+TF(gx+a*cw/2,gy+S+46,a,n,'txA',17);
    if(st>=1)s+=`<path class="br stB" d="M${gx-10},${gy} L${gx-18},${gy} L${gx-18},${gy+b*rh} L${gx-10},${gy+b*rh}"/>`+TF(gx-46,gy+b*rh/2,b,m,'txB',17);
    if(st>=2)s+=TF(gx+S+70,gy+S/2,a*b,n*m,'txR',24)+T(gx+S+70,gy+S/2+52,`${a*b} von ${n*m}`,'txs',14);
    return svgWrap(W,gy+S+80,s);
  }
  function drawCirc(st){
    const cx=260,cy=150,R=125;
    const fills=[];for(let c=0;c<n;c++)for(let j=0;j<(st>=1?m:1);j++){
      if(c>=a)fills.push('fE');else if(st===0)fills.push('fA');else if(st===1)fills.push(j<b?'HB':'fA');else fills.push(j<b?'fR':'fAs');}
    let s=pie(cx,cy,R,{parts:n,sub:st>=1?m:1,subStyle:st===1?'new':'thin',fills});
    s+=TF(cx-R-55,cy,a,n,'txA',20)+T(cx-R-55,cy+48,'blau','txs',13);
    if(st>=1)s+=T(cx,cy+R+26,`von jedem blauen Teil ${b}/${m} schraffiert`,'tx txB',16);
    if(st>=2)s+=TF(cx+R+80,cy,a*b,n*m,'txR',24)+T(cx+R+80,cy+52,`${a*b} von ${n*m}`,'txs',14);
    return svgWrap(W,cy+R+44,s);
  }
  const draw=circ?drawCirc:drawRect,piece=circ?'Stücke':'Kästchen';
  const sc=[
    {g:draw(0),t:`${circ?'Der Kreis':'Das Quadrat'} ist ein Ganzes. ${a}/${n} davon sind blau gefärbt.`,s:[{h:`${F(a,n,'ca')} ${O('·')} ${F(b,m,'cb')}`,note:`„mal“ bedeutet hier: ${b}/${m} von ${a}/${n}`}]},
    {g:draw(1),t:circ?`Jedes Teil wird in ${m} Stücke geteilt, und von jedem blauen Teil werden ${b}/${m} schraffiert. Gesucht ist der Teil, der blau UND schraffiert ist.`:`Jetzt wird waagerecht in ${m} Streifen geteilt und ${b}/${m} davon schraffiert. Gesucht ist der Teil, der blau UND schraffiert ist.`,s:[]},
    {g:draw(2),t:`Das Ganze hat jetzt ${n} · ${m} = ${n*m} ${piece}. Blau und schraffiert sind ${a} · ${b} = ${a*b} ${piece}. Also: Zähler mal Zähler, Nenner mal Nenner.`,s:[{h:`${O('=')} ${F(`${a} · ${b}`,`${n} · ${m}`)} ${O('=')} ${F(a*b,n*m,'cr')}`,note:'Zähler · Zähler, Nenner · Nenner'}]},
  ];
  const fl=finishLines(a*b,n*m);
  if(fl.length){const g=gcd(a*b,n*m);sc.push({g:draw(2),t:`Das Ergebnis lässt sich noch kürzen (mit ${g}). Tipp: Man kann auch schon vor dem Ausmultiplizieren kürzen.`,s:fl})}
  return sc;
}

/* --- Division: Messmodell „Wie oft passt …?“ --- */
function scDiv(p){
  const {a,n,b,m}=p,N=lcm(n,m),fa=N/n,fb=N/m,A=a*fa,B=b*fb,same=n===m,circ=SHAPE==='circle';
  function drawRect(refined,measure,anim){
    const bh=60,y1=40,y2=150,sa=refined?fa:1,sb=refined?fb:1;
    let s=stripe(SX+20,y1,SW-20,bh,{parts:n,sub:sa,subStyle:anim?'new':'thin',fills:fillArr(n*sa,[[refined?A:a,'fA']])})+TF(SX-8,y1+bh/2,a,n,'txA',17);
    s+=stripe(SX+20,y2,SW-20,bh,{parts:m,sub:sb,subStyle:anim?'new':'thin',fills:fillArr(m*sb,[[refined?B:b,'fB']])})+TF(SX-8,y2+bh/2,b,m,'txB',17);
    if(measure){const cw=(SW-20)/N;let pos=0,i=1;
      while(pos<A){const len=Math.min(B,A-pos);const x1=SX+20+pos*cw,x2=x1+len*cw,full=len===B;
        s+=`<rect x="${x1+2}" y="${y1-30}" width="${x2-x1-4}" height="22" rx="8" class="pop" fill="${full?'var(--Bsoft)':'none'}" stroke="var(--B)" stroke-width="2.5" ${full?'':'stroke-dasharray="5 4"'} style="animation-delay:${i*.18}s"/>`;
        s+=T((x1+x2)/2,y1-19,full?i:`${len}/${B}`,'tx txB',full?15:13);pos+=len;i++;}}
    s+=T(300,y2+bh+30,measure?'Wie oft passt der orange Teil in den blauen?':refined?'Jetzt sind alle Teile gleich groß.':'Wie oft passt der orange Teil in den blauen?','txs',15);
    return svgWrap(W,y2+bh+50,s);
  }
  function drawCirc(refined,measure,anim){
    const R=100,cy=150,c1=170,c2=450,sa=refined?fa:1,sb=refined?fb:1;
    let s=pie(c1,cy,R,{parts:n,sub:sa,subStyle:anim?'new':'thin',fills:fillArr(n*sa,[[refined?A:a,'fA']])})+TF(c1,cy+R+34,a,n,'txA',18);
    s+=pie(c2,cy,R*.8,{parts:m,sub:sb,subStyle:anim?'new':'thin',fills:fillArr(m*sb,[[refined?B:b,'fB']])})+TF(c2,cy+R+34,b,m,'txB',18);
    s+=T(310,cy,'?','tx',30);
    if(measure){let pos=0,i=1;
      while(pos<A){const len=Math.min(B,A-pos),full=len===B,a0=ang(pos,N)+.06,a1=ang(pos+len,N)-.06,rr=R+12;
        s+=`<path d="M${c1+rr*Math.cos(a0)},${cy+rr*Math.sin(a0)} A${rr},${rr} 0 ${a1-a0>Math.PI?1:0} 1 ${c1+rr*Math.cos(a1)},${cy+rr*Math.sin(a1)}" fill="none" stroke="var(--B)" stroke-width="6" stroke-linecap="round" ${full?'':'stroke-dasharray="4 7"'} class="pop" style="animation-delay:${i*.18}s"/>`;
        const am=(a0+a1)/2;s+=T(c1+(R+30)*Math.cos(am),cy+(R+30)*Math.sin(am),full?i:`${len}/${B}`,'tx txB',full?16:13);pos+=len;i++;}}
    s+=T(300,cy+R+78,measure?'Wie oft passt das orange Stück in das blaue?':refined?'Jetzt sind alle Teile gleich groß.':'Wie oft passt das orange Stück in das blaue?','txs',15);
    return svgWrap(W,cy+R+96,s);
  }
  const draw=circ?drawCirc:drawRect;
  const q=Math.floor(A/B),r=A%B;
  const sc=[{g:draw(false,false,false),t:`Dividieren heißt hier messen: Wie oft passt ${b}/${m} in ${a}/${n}?`,s:[{h:`${F(a,n,'ca')} ${O(':')} ${F(b,m,'cb')}`}]}];
  if(!same)sc.push({g:draw(true,false,true),t:`Zum Messen müssen die Teile gleich groß sein: beide auf den Hauptnenner ${N} bringen.`,s:[{h:`${O('=')} ${F(A,N,'ca')} ${O(':')} ${F(B,N,'cb')}`,note:`erweitern auf ${N}`}]});
  sc.push({g:draw(!same,true,false),t:`Jetzt zählen: ${B} kleine Teile passen ${q}-mal in ${A} kleine Teile`+(r?`, dann bleibt ein Rest von ${r} Teilen – das ist ${r}/${B} von einem orangen Stück.`:'.'),
    s:[{h:`${O('=')} <span class="ca">${A}</span> ${O(':')} <span class="cb">${B}</span> ${O('=')} ${B===1?`<span class="cr">${A}</span>`:F(A,B,'cr')}`,note:'bei gleichen Nennern: nur die Zähler teilen'}]});
  const fl=finishLines(A,B);
  if(fl.length&&B>1)sc.push({g:draw(!same,true,false),t:r?`Ergebnis: ${q} ganze Male und ${r}/${B}.`:'Ergebnis vereinfachen.',s:fl});
  const kz=a*m,kn=n*b,g=gcd(kz,kn);
  sc.push({g:draw(!same,true,false),t:`Kontrolle mit der Kehrwert-Regel: Durch einen Bruch teilen = mit seinem Kehrwert malnehmen.`,
    s:[{h:`${F(a,n,'ca')} ${O(':')} ${F(b,m,'cb')} ${O('=')} ${F(a,n,'ca')} ${O('·')} ${F(m,b,'ck')} ${O('=')} ${F(kz,kn)}${g>1?` ${O('=')} ${kn/g===1?`<span class="cr">${kz/g}</span>`:F(kz/g,kn/g,'cr')}`:''}`,note:'Kehrwert-Regel (gleiches Ergebnis)'}]});
  return sc;
}

/* ============ Stepper (wird in Beispielen, Hilfe und Labor genutzt) ============ */
function stepper(host,scenes,opts){
  opts=opts||{};let i=opts.start||0;const max=()=>opts.limit!=null?Math.min(opts.limit,scenes.length-1):scenes.length-1;
  host.innerHTML=`<div class="split"><div class="panel"><div class="ph"><span class="dot"></span>Ikonisch – Bild</div><div class="stage"></div><div class="say"></div></div>
  <div class="panel"><div class="ph"><span class="dot" style="background:var(--K)"></span>Symbolisch – Rechnung</div><div class="sym"></div></div></div>
  <div class="ctrl"><button class="btn ghost prev">◀ Zurück</button><div class="dots"></div><button class="btn next">Weiter ▶</button><button class="btn ghost all">Alle Schritte</button></div>`;
  const stage=host.querySelector('.stage'),say=host.querySelector('.say'),sym=host.querySelector('.sym'),dots=host.querySelector('.dots');
  const prev=host.querySelector('.prev'),next=host.querySelector('.next'),all=host.querySelector('.all');
  function render(){
    const sc=scenes[i];stage.innerHTML=sc.g;say.innerHTML=sc.t;
    let h='';for(let k=0;k<=i;k++)scenes[k].s.forEach(l=>{h+=`<div class="ln ${k===i?'new':''}">${l.h}${l.note?`<span class="note">${l.note}</span>`:''}</div>`});
    sym.innerHTML=h;
    dots.innerHTML=scenes.map((_,k)=>`<i class="${k<=i?'on':''}" style="${k>max()?'opacity:.25':''}"></i>`).join('');
    prev.disabled=i===0;next.disabled=i>=max();all.style.display=i>=max()?'none':'';
    next.textContent=i>=max()?(opts.limit!=null&&max()<scenes.length-1?'Mehr: 🖼 Bild-Hilfe':'Fertig ✓'):'Weiter ▶';
    if(opts.onStep)opts.onStep(i);
  }
  prev.onclick=()=>{if(i>0){i--;render()}};
  next.onclick=()=>{if(i<max()){i++;render()}};
  all.onclick=()=>{i=max();render()};
  render();
  return {setLimit(l){opts.limit=l;render()},go(k){i=Math.min(k,max());render()},get i(){return i}};
}

const LV=[{n:'Basis',d:'gleichnamig, kleine Zahlen'},{n:'Profi',d:'ungleichnamig, einfacher Hauptnenner'},{n:'Experte',d:'Hauptnenner & vollständig kürzen'}];
const LVT={groessen:['einfache Anteile','andere Größen','auch mehr als ein Ganzes'],erweitern:['mit Zahl erweitern','auf Nenner erweitern','Lücke finden'],kuerzen:['mit Zahl kürzen','vollständig kürzen','große Zahlen'],mult:['gleichnamig','ungleichnamig','mit Kürzen'],div:['gleichnamig, ganze Ergebnisse','ungleichnamig','mit Rest']};
function properPair(maxN){const n=ri(2,maxN);return [ri(1,n-1),n]}
function gen(tid,lvl){
  for(let tries=0;tries<200;tries++){
    if(tid==='groessen'){
      if(lvl===0){const o=pick([{unit:'min',T:60,ns:[2,3,4,6]},{unit:'eur',T:pick([10,12,20,30]),ns:null},{unit:'cm',T:100,ns:[2,4,5,10]}]);
        const ns=o.ns||[2,3,4,5,6,10].filter(x=>o.T%x===0);const n=pick(ns);const z=ri(1,n-1);return {p:{unit:o.unit,T:o.T,z,n},type:'num'}}
      if(lvl===1){const o=pick([{unit:'g',T:1000,ns:[2,4,5,8,10]},{unit:'ml',T:1000,ns:[2,4,5,8,10]},{unit:'min',T:60,ns:[5,10,12]},{unit:'eur',T:pick([24,30,36]),ns:[3,4,6]},{unit:'cm',T:100,ns:[4,5,10,20]}]);
        const n=pick(o.ns.filter(x=>o.T%x===0));const z=ri(1,n-1);if(gcd(z,n)>1&&Math.random()<.5)continue;return {p:{unit:o.unit,T:o.T,z,n},type:'num'}}
      const o=pick([{unit:'min',T:pick([60,120]),ns:[3,4,6]},{unit:'g',T:1000,ns:[4,5,8]},{unit:'cm',T:100,ns:[4,5]},{unit:'ml',T:pick([1000,500]),ns:[4,5]}]);
      const n=pick(o.ns);const z=ri(n+1,2*n-1);return {p:{unit:o.unit,T:o.T,z,n},type:'num'};
    }
    if(tid==='erweitern'){
      const [z,n]=properPair(lvl===0?5:7);if(gcd(z,n)>1)continue;const k=ri(2,lvl===0?3:5);if(n*k>48||k>8)continue;
      if(lvl===0)return {p:{z,n,k},type:'frac',ask:'erw'};
      if(lvl===1)return {p:{z,n,k},type:'num',ask:'erwN'};
      return {p:{z,n,k},type:'num',ask:pick(['erwZ','erwD'])};
    }
    if(tid==='kuerzen'){
      const [a,b]=properPair(lvl===2?9:6);if(gcd(a,b)>1)continue;const k=lvl===0?ri(2,3):lvl===1?ri(2,4):ri(4,8);
      if(b*k>(lvl===2?72:36)||b>12)continue;
      return {p:{z:a*k,n:b*k,k},type:'frac',ask:lvl===0?'kurzK':'kurzV'};
    }
    // Rechenarten
    let a,n,b,m;
    if(tid==='mult'){
      if(lvl===0){n=ri(2,5);m=n;a=ri(1,n-1);b=ri(1,m-1)}
      else{n=ri(2,6);m=ri(2,6);if(n===m)continue;a=ri(1,n-1);b=ri(1,m-1);if(lvl===2&&gcd(a*b,n*m)===1)continue;if(lvl===1&&gcd(a*b,n*m)>1&&Math.random()<.5)continue}
      if(gcd(a,n)>1||gcd(b,m)>1)continue;
      return {p:{a,n,b,m},type:'frac'};
    }
    if(tid==='div'){
      if(lvl===0){n=ri(3,10);m=n;b=ri(1,4);const q=ri(2,5);a=b*q;if(a>=n+1)continue}
      else if(lvl===1){n=pick([2,3,4,5,6]);m=n*pick([2,3]);if(m>12)continue;[a,b]=[ri(1,n-1),ri(1,m-1)];if(a*m/n%b!==0&&Math.random()<.6)continue}
      else{n=ri(2,6);m=ri(2,6);if(n===m)continue;a=ri(1,n-1);b=ri(1,m-1)}
      if(gcd(a,n)>1&&lvl>0)continue;if(gcd(b,m)>1&&lvl>0)continue;
      if(lcm(n,m)>24)continue;if(a/n<b/m&&lvl<2)continue;
      return {p:{a,n,b,m},type:'frac'};
    }
    // add/sub
    if(lvl===0){n=ri(3,10);m=n;a=ri(1,n-1);b=ri(1,n-1)}
    else if(lvl===1){n=pick([2,3,4,5,6]);m=n*pick([2,3]);if(m>12)continue;if(Math.random()<.5)[n,m]=[m,n];a=ri(1,n-1);b=ri(1,m-1)}
    else{n=ri(2,8);m=ri(2,8);if(n===m||n%m===0||m%n===0)continue;a=ri(1,n-1);b=ri(1,m-1)}
    if(lvl>0&&(gcd(a,n)>1||gcd(b,m)>1))continue;
    if(lcm(n,m)>24)continue;
    if(tid==='sub'&&a/n<=b/m)continue;
    if(tid==='add'&&lvl<2&&a/n+b/m>1)continue;
    return {p:{a,n,b,m},type:'frac'};
  }
}
function exact(z,n){const g=gcd(z,n);return [z/g,n/g]}
function solution(tid,task){
  const p=task.p;
  if(tid==='groessen')return p.T/p.n*p.z;
  if(tid==='erweitern')return task.ask==='erw'?[p.z*p.k,p.n*p.k]:task.ask==='erwD'?p.n*p.k:p.z*p.k;
  if(tid==='kuerzen')return task.ask==='kurzK'?[p.z/p.k,p.n/p.k]:exact(p.z,p.n);
  const {a,n,b,m}=p;
  if(tid==='add')return exact(a*m+b*n,n*m);
  if(tid==='sub')return exact(a*m-b*n,n*m);
  if(tid==='mult')return exact(a*b,n*m);
  return exact(a*m,n*b);
}

    else if(cur.ask==='erwZ'){instr='Fülle die Lücke.';task=`${F(p.z,p.n,'ca')} ${O('=')} ${F('<input class="numin" id="an" inputmode="numeric" aria-label="Zähler" style="width:80px;height:46px">',p.n*p.k,'cr')}`}
    else {instr='Fülle die Lücke.';task=`${F(p.z,p.n,'ca')} ${O('=')} ${F(p.z*p.k,'<input class="numin" id="an" inputmode="numeric" aria-label="Nenner" style="width:80px;height:46px">','cr')}`}
  }
  else if(t.id==='kuerzen'){instr=cur.ask==='kurzK'?`Kürze mit ${p.k}.`:'Kürze vollständig (mit dem ggT).';task=`${F(p.z,p.n,'ca')} ${O('=')}`;ans=fin('r')}

  const inline=!/ansrow/.test(ans);
  $('#taskcard').innerHTML=`<div class="instr">${instr}</div>
   ${inline?`<div class="task">${task} ${ans}</div>`:`<div class="task">${task}</div>${ans}`}
   <div class="row ctrl" style="justify-content:flex-start"><button class="btn green" id="chk">Prüfen</button><button class="btn warm" id="hlp">🖼 Bild-Hilfe</button><button class="btn ghost" id="sol">Lösung zeigen</button><button class="btn ghost" id="nxt">Neue Aufgabe ↻</button></div>
   <div class="fb" id="fb"></div>`;
  $('#help').className='help';$('#help').innerHTML='';
  $('#chk').onclick=check;$('#hlp').onclick=showHelp;$('#sol').onclick=showSolution;$('#nxt').onclick=newTask;
  $('#taskcard').querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));
  const f=$('#taskcard').querySelector('input');if(f&&window.matchMedia('(pointer:fine)').matches)f.focus();

function showHelp(){
  const t=topic();const sc=scenesFor(t.id,cur);
  const limit=Math.max(0,sc.length-2);
  const h=$('#help');
  if(!helpCtl){h.className='help show';h.innerHTML='<div class="card" style="padding:12px"><div class="ph"><span class="dot" style="background:var(--B)"></span>Bild-Hilfe – Schritt für Schritt zur Lösung</div><div id="hs"></div></div>';
    helpCtl=stepper($('#hs'),sc,{limit:Math.min(helpUsed,limit)});helpUsed=1;helpCtl.kind='help';}
  else{helpUsed++;helpCtl.setLimit(Math.min(helpUsed,limit));helpCtl.go(helpUsed)}
  h.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showSolution(){
  const t=topic();const sc=scenesFor(t.id,cur);const h=$('#help');h.className='help show';
  h.innerHTML='<div class="card" style="padding:12px"><div class="ph"><span class="dot" style="background:var(--R)"></span>Lösungsweg</div><div id="hs"></div></div>';
  helpCtl=stepper($('#hs'),sc,{start:sc.length-1});helpCtl.kind='sol';helpUsed=99;
  if(!cur.done){cur.done=true;bump(false)}
  const fb=$('#fb');fb.className='fb show half';fb.innerHTML='Schau dir den Lösungsweg an – dann probier eine neue Aufgabe.';
  h.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function bump(ok){const k='score:'+S.topic;const s=store.get(k,{r:0,v:0});s.v++;if(ok)s.r++;store.set(k,s);const el=$('#score');if(el)el.textContent=`✔ ${s.r} von ${s.v} richtig`}
const num=id=>{const el=document.getElementById(id);if(!el)return null;const v=el.value.trim().replace(',','.');return v===''?null:Number(v)};
function mark(id,ok){const el=document.getElementById(id);if(el){el.classList.remove('good','wrong');if(ok!=null)el.classList.add(ok?'good':'wrong')}}
function check(){
  if(cur.done){newTask();return}
  const t=topic(),sol=solution(t.id,cur),fb=$('#fb');let ok=false,msg='',half=false;
  cur.tries++;
  if(cur.type==='num'){
    const v=num('an');if(v==null){fb.className='fb show no';fb.textContent='Trag zuerst eine Zahl ein.';cur.tries--;return}
    ok=Math.abs(v-sol)<1e-9;mark('an',ok);
    msg=ok?'Richtig! 🎉':(t.id==='groessen'?'Noch nicht. Tipp: erst durch den Nenner teilen, dann mal den Zähler.':'Noch nicht. Tipp: Womit wurde der Nenner (bzw. Zähler) multipliziert? Mit derselben Zahl musst du auch den anderen multiplizieren.');
  }else{
    const z=num('rz');let n=num('rn');
    if(z==null){fb.className='fb show no';fb.textContent='Trag zuerst das Ergebnis ein.';cur.tries--;return}
    if(n==null)n=1;
    // Zwischenschritt prüfen (optional)
    let midMsg='';
    if(document.getElementById('g1z')){
      const v=['g1z','g1n','g2z','g2n'].map(num);
      if(v.some(x=>x!=null)){
        const p=cur.p;const ok1=v[0]!=null&&v[1]&&v[0]*p.n===p.a*v[1];const ok2=v[2]!=null&&v[3]&&v[2]*p.m===p.b*v[3];const same=v[1]&&v[1]===v[3];
        mark('g1z',ok1);mark('g1n',ok1&&same);mark('g2z',ok2);mark('g2n',ok2&&same);
        if(!(ok1&&ok2&&same))midMsg=' Beim Gleichnamig-Machen stimmt etwas nicht: Beide Brüche brauchen denselben Nenner, und Zähler und Nenner werden mit derselben Zahl erweitert.';
      }
    }
    const val=z/n,target=sol[0]/sol[1];const eq=n!==0&&Math.abs(val-target)<1e-9;
    const reduced=gcd(z,n)===1;
    if(eq&&(cur.ask==='erw'||cur.ask==='kurzK')){ok=z===sol[0]&&n===sol[1];msg=ok?'Richtig! 🎉':`Gleicher Wert – aber ${cur.ask==='erw'?'erweitere':'kürze'} genau mit ${cur.p.k}.`;half=!ok}
    else if(eq&&reduced){ok=true;msg='Richtig! 🎉'+(midMsg?' (Der Zwischenschritt hatte aber einen Fehler.)':'')}
    else if(eq){msg=`Der Wert stimmt – aber du kannst noch kürzen (ggT von ${z} und ${n} ist ${gcd(z,n)}).`;half=true}
    else msg=wrongHint(t.id,z,n)+midMsg;
    mark('rz',ok?true:(half?null:false));mark('rn',ok?true:(half?null:false));
  }
  if(ok){fb.className='fb show ok';fb.innerHTML=msg+(helpUsed?` <span class="small">(mit ${Math.min(helpUsed,9)}× Bild-Hilfe)</span>`:'')+' – Tippe auf „Prüfen“ oder „Neue Aufgabe“ für die nächste.';cur.done=true;bump(true);$('#chk').textContent='Weiter ▶';}
  else{fb.className='fb show '+(half?'half':'no');fb.innerHTML=msg+(cur.tries>=2&&!helpCtl?' Probier die <b>Bild-Hilfe</b>!':'');}
}
function wrongHint(tid,z,n){
  const p=cur.p;
  if(tid==='add'||tid==='sub'){
    if(p.n!==p.m&&n===p.n+p.m)return 'Achtung: Nenner werden nicht addiert! Erst auf einen gemeinsamen Nenner (Hauptnenner) erweitern.';
    if(p.n===p.m&&n===2*p.n)return 'Achtung: Der Nenner bleibt gleich – nur die Zähler werden '+(tid==='add'?'addiert':'subtrahiert')+'.';
    return 'Noch nicht richtig. Prüfe den Hauptnenner und das Erweitern.';
  }
  if(tid==='mult'){if(p.n===p.m&&n===p.n)return 'Achtung: Beim Multiplizieren bleibt der Nenner nicht gleich – Nenner mal Nenner!';return 'Noch nicht richtig. Zähler mal Zähler, Nenner mal Nenner.'}
  if(tid==='div'){if(Math.abs(z/n-(p.a*p.b)/(p.n*p.m))<1e-9)return 'Du hast multipliziert. Beim Dividieren: mit dem Kehrwert des zweiten Bruchs malnehmen!';return 'Noch nicht richtig. Wie oft passt der zweite Bruch in den ersten?'}
  if(tid==='kuerzen')return 'Noch nicht. Teile Zähler und Nenner durch dieselbe Zahl.';
  return 'Noch nicht richtig.';
}

/* ============ Eigene Brüche (Labor) ============ */
const LAB={groessen:{z:3,n:4,T:60,unit:'min'},erweitern:{z:2,n:3,k:4},kuerzen:{z:6,n:9,k:''},add:{a:1,n:3,b:1,m:4},sub:{a:3,n:4,b:1,m:3},mult:{a:2,n:3,b:3,m:5},div:{a:5,n:6,b:1,m:3}};
const inp=(id,v,w)=>`<input class="numin" id="${id}" value="${esc(v)}" inputmode="numeric" style="width:${w||76}px">`;
const finV=(id,z,n)=>`<span class="fin"><input id="${id}z" inputmode="numeric" value="${esc(z)}" aria-label="Zähler"><span class="fl"></span><input id="${id}n" inputmode="numeric" value="${esc(n)}" aria-label="Nenner"></span>`;
function renderLabor(){
  const t=topic(),d=store.get('lab:'+t.id,LAB[t.id]);let form='';
  if(t.id==='groessen')form=`${finV('l1',d.z,d.n)} von ${inp('lT',d.T,110)} <select id="lU" class="sel">${Object.entries(UNITS).map(([k,u])=>`<option value="${k}" ${k===d.unit?'selected':''}>${u.name}</option>`).join('')}</select>`;
  else if(t.id==='erweitern')form=`${finV('l1',d.z,d.n)} erweitern mit ${inp('lk',d.k)}`;
  else if(t.id==='kuerzen')form=`${finV('l1',d.z,d.n)} kürzen mit ${inp('lk',d.k)} <span class="small muted">(leer = ggT)</span>`;
  else form=`${finV('l1',d.a,d.n)} ${O(OPSYM[t.id])} ${finV('l2',d.b,d.m)}`;
  $('#main').innerHTML=`<div class="card"><div class="instr">Trag deine eigenen Brüche ein – das Tool zeichnet und rechnet Schritt für Schritt.</div><div class="form">${form}<button class="btn" id="lgo">Darstellen ▶</button></div><div class="err" id="lerr"></div></div><div id="lstp" style="margin-top:14px"></div>`;
  $('#lgo').onclick=runLab;$('#main').querySelectorAll('input,select').forEach(e=>e.addEventListener('keydown',ev=>{if(ev.key==='Enter')runLab()}));
  runLab();
}
function runLab(){
  const t=topic(),err=$('#lerr');err.textContent='';const I=id=>{const v=num(id);return v==null?null:v};
  const isInt=(...xs)=>xs.every(x=>x!=null&&Number.isInteger(x)&&x>=0);
  let p,e='';
  if(t.id==='groessen'){p={z:I('l1z'),n:I('l1n'),T:I('lT'),unit:$('#lU').value};
    if(!isInt(p.z,p.n)||p.n<1||p.z<1)e='Bitte ganze Zahlen für Zähler und Nenner (mind. 1) eintragen.';else if(p.n>20)e='Nenner bitte höchstens 20.';else if(p.z>3*p.n)e='Höchstens 3 Ganze, bitte.';else if(!(p.T>0))e='Bitte eine Größe eintragen.';}
  else if(t.id==='erweitern'){p={z:I('l1z'),n:I('l1n'),k:I('lk')};
    if(!isInt(p.z,p.n,p.k)||p.n<1||p.k<1)e='Bitte ganze Zahlen eintragen.';else if(p.z>p.n)e='Für die Darstellung bitte einen echten Bruch (Zähler ≤ Nenner).';else if(p.n>12||p.k>8)e='Nenner höchstens 12 und Faktor höchstens 8, damit man es noch gut sieht.';}
  else if(t.id==='kuerzen'){const z=I('l1z'),n=I('l1n');let k=I('lk');
    if(!isInt(z,n)||n<1)e='Bitte ganze Zahlen eintragen.';else{if(k==null)k=gcd(z,n);p={z,n,k};
      if(k<2)e=`${z}/${n} lässt sich nicht kürzen (ggT ist 1).`;else if(z%k||n%k)e=`${k} ist kein gemeinsamer Teiler von ${z} und ${n}.`;else if(z>n)e='Bitte einen echten Bruch (Zähler ≤ Nenner).';else if(n>96||n/k>12)e='Zahlen bitte etwas kleiner wählen.';}}
  else{p={a:I('l1z'),n:I('l1n'),b:I('l2z'),m:I('l2n')};
    if(!isInt(p.a,p.n,p.b,p.m)||p.n<1||p.m<1)e='Bitte ganze Zahlen eintragen (Nenner mind. 1).';
    else if(p.n>12||p.m>12)e='Nenner bitte höchstens 12.';
    else if(t.id==='mult'&&(p.a>p.n||p.b>p.m||p.a<1||p.b<1))e='Für das Flächenmodell bitte echte Brüche zwischen 0 und 1.';
    else if(t.id!=='mult'&&lcm(p.n,p.m)>24)e=`Der Hauptnenner wäre ${lcm(p.n,p.m)} – das wird zu klein zum Zeichnen. Bitte andere Nenner (Hauptnenner ≤ 24).`;
    else if(t.id==='sub'&&p.a/p.n<p.b/p.m)e='Der zweite Bruch ist größer als der erste – das Ergebnis wäre negativ.';
    else if(t.id==='div'&&(p.b<1))e='Durch 0 kann man nicht teilen.';
    else if(t.id==='div'&&(p.a>p.n||p.b>p.m))e='Bitte für beide Brüche höchstens 1 Ganzes.';
    else if(t.id==='add'&&p.a/p.n+p.b/p.m>3)e='Das Ergebnis bitte höchstens 3 Ganze.';
    else if(t.id==='sub'&&p.a/p.n>3)e='Erster Bruch bitte höchstens 3 Ganze.';
    else if(t.id==='div'&&p.a<1)e='Der erste Bruch ist 0 – da gibt es nichts zu messen.';}
  if(e){err.textContent=e;$('#lstp').innerHTML='';return}
  store.set('lab:'+t.id,p);
  stepper($('#lstp'),buildScenes(t,p));
}

  if(S.mode==='bsp')renderBsp();else if(S.mode==='ueben')renderUeben();else renderLabor();
  const a=$('#topics [aria-pressed=true]');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'});
}
renderAll();
