        <div class="podium">${podOrder.map(i => `<div class="pod"><div class="av">${r[i][1].av}</div><div class="nm">${esc(r[i][1].name)}</div><div class="small">${r[i][1].score} Punkte</div><div class="blk" style="height:${[170, 120, 90][i]}px">${i + 1}</div></div>`).join("")}</div>
        <div class="card" style="max-width:820px;margin:16px auto;overflow:auto"><table class="wtable"><thead><tr><th>Platz</th><th>Name</th><th>Richtig</th><th>Punkte</th></tr></thead><tbody>
          ${r.map(([id, p], i) => `<tr><td>${i + 1}</td><td>${p.av} ${esc(p.name)}</td><td>${p.right}/${qs.length}</td><td><b>${p.score}</b></td></tr>`).join("")}</tbody></table>
          <div class="row" style="margin-top:12px"><button class="btn teal" id="lhCsv">⬇︎ Ergebnisse (CSV)</button><button class="btn primary" id="lhNew">Neues Quiz</button></div></div>`;
      $("#lhCsv", host).onclick = () => {
        const rows = [["Platz", "Name", "Richtig", "Punkte"].concat(qs.map((q, i) => "F" + (i + 1) + " " + q.prompt))];
        r.forEach(([id, p], i) => rows.push([i + 1, p.name, p.right, p.score].concat(qs.map((q, qi) => { const l = p.log.find(x => x.qi === qi); return l ? (l.ok ? "richtig" : "falsch") : "–"; }))));
        download("klassen-quiz-" + new Date().toISOString().slice(0, 10) + ".csv", "﻿" + toCSV(rows), "text/csv;charset=utf-8");
      };
      $("#lhNew", host).onclick = () => { close(); renderLive(); };
    }
  }
  pub(); draw();
}

/* =====================================================================
   Mitspieler-Ansicht (Quiz, Wettrennen online, Fußball online)
   ===================================================================== */
function startClient(code){
  code = String(code).toUpperCase().replace(/[^A-Z0-9]/g, "");
  const me = { name: store.get("myname", ""), av: store.get("myav", pick(AVATARS)) };
  const el = document.createElement("div"); el.className = "live-pl";
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  let lastJoin = Date.now(), net = null, st = null, joined = false, lastKey = "", answered = {}, frozenUntil = 0, myQ = null, closed = false, timerIv = null, qSeen = {};
  const pid = myPid();
  const close = () => { closed = true; clearInterval(timerIv); if (net) net.close(); el.remove(); document.body.style.overflow = ""; window.__cleanup = null; };
  window.__cleanup = close;
  const shell = (inner, bar) => { el.innerHTML = `<div class="stat"><span style="font-size:28px">${me.av}</span><span>${esc(me.name || "")}</span><span class="spacer"></span>${bar || ""}<button class="btn" style="min-height:40px;padding:4px 12px" data-a="leave">Verlassen</button></div>${inner}`;
    $("[data-a=leave]", el).onclick = () => { close(); history.replaceState(null, "", location.pathname); go("live"); }; };
  function joinForm(err){
    shell(`<div class="center"><div class="disp" style="font-size:30px">Code ${esc(code)}</div>
      ${err ? `<p style="background:#fff;color:#d64045;border-radius:10px;padding:8px 14px;font-weight:700">${esc(err)}</p>` : ""}
      <button class="avbtn" id="cAv" style="font-size:64px;min-width:110px;min-height:110px;background:rgba(255,255,255,.15);border:0">${me.av}</button><div class="small">Tippe, um deine Figur zu wählen</div>
      <input type="text" id="cName" maxlength="16" placeholder="Dein Spitzname" value="${esc(me.name)}" style="max-width:320px;text-align:center" autocomplete="off">
      <p class="small" style="opacity:.8;max-width:320px">Bitte einen Spitznamen oder dein Kürzel verwenden – keinen vollen Namen.</p>
      <button class="btn primary big" id="cGo">Los geht's!</button></div>`);
    $("#cAv", el).onclick = () => avatarPicker(me.av, a => { me.av = a; store.set("myav", a); $("#cAv", el).textContent = a; });
    $("#cGo", el).onclick = doJoin;
    $("#cName", el).onkeydown = e => { if (e.key === "Enter") doJoin(); };
  }
  async function doJoin(){
    const n = $("#cName", el).value.trim();
    if (!n) return toast("Bitte einen Namen eingeben.");
    me.name = n; store.set("myname", n);
    shell(`<div class="center"><div class="bigic">⏳</div><div class="disp" style="font-size:26px">Verbinde …</div></div>`);
    try {
      if (!net) net = await netJoin(code, onState, () => { if (!closed) shell(`<div class="center"><div class="bigic">👋</div><div class="disp" style="font-size:26px">Das Spiel wurde beendet.</div></div>`); });
      net.send({ type:"join", name:me.name, av:me.av });
      joined = true;
      shell(`<div class="center"><div class="bigic">${me.av}</div><div class="disp" style="font-size:28px">Du bist dabei!</div><p>Warte, bis es losgeht …</p></div>`);
      setTimeout(() => { if (!st && net) net.send({ type:"join", name:me.name, av:me.av }); }, 3000);
    } catch(e){ net = null; joinForm(e.message || "Verbindung fehlgeschlagen."); }
  }
  function onState(s){
    st = s; if (!joined || closed) return;
    if (s.kicked && s.kicked.includes(pid)) { shell(`<div class="center"><div class="bigic">🚪</div><div class="disp" style="font-size:26px">Du wurdest aus dem Spiel entfernt.</div></div>`); closed = true; if (net) net.close(); return; }
    if (s.game === "quiz") return quizView(s);
    return raceView(s);
  }
  /* --- Quiz --- */
  function quizView(s){
    const mine = s.players && s.players[pid];
    if (!mine && net && Date.now() - lastJoin > 3000) { lastJoin = Date.now(); net.send({ type:"join", name:me.name, av:me.av }); }
    if (s.phase !== "reveal") el.style.background = "";
    const key = s.phase + ":" + s.qi + ":" + (s.q && answered[s.q.id] ? 1 : 0);
    const sc = mine ? `<b>${mine.s} P</b>` : "";
    if (s.phase === "lobby") { if (lastKey !== key) shell(`<div class="center"><div class="bigic">${me.av}</div><div class="disp" style="font-size:28px">Du bist dabei!</div><p>Siehst du deinen Namen an der Tafel? Gleich geht's los …</p></div>`); lastKey = key; return; }
    if (s.phase === "intro") { if (lastKey !== key) shell(`<div class="center"><div style="opacity:.85">Frage ${s.qi + 1} von ${s.total}</div><div class="disp" style="font-size:34px">${esc(QTYPES[s.q.type])}</div><div class="bigic">🤔</div></div>`, sc); lastKey = key; return; }
    if (s.phase === "question") {
      if (lastKey === key) return; lastKey = key;
      const q = s.q;
      if (answered[q.id]) { shell(`<div class="center"><div class="bigic">📨</div><div class="disp" style="font-size:28px">Antwort gesendet!</div><p>Mal sehen, ob sie stimmt …</p></div>`, sc); return; }
      if (!qSeen[q.id]) qSeen[q.id] = Date.now() - (q.dur - (q.left ?? q.dur)) * 1000;
      const send = v => { if (answered[q.id]) return; answered[q.id] = true; net.send({ type:"answer", qid:q.id, v }); quizView(st); };
      const head = `<div class="pq">${wordHTML(q.prompt, q.ask, q.promptPy)}</div><div style="text-align:center;opacity:.85;margin-bottom:6px">→ ${lname(q.ans)} · <span id="cT"></span></div>`;
      if (q.type === "choice") {
        shell(`${head}<div class="ktiles">${q.options.map((o, i) => `<button class="kt k${i + 1}" data-i="${i}"><span class="sh">${SHAPES[i]}</span><span class="${q.ans === "zh" ? "zh" : ""}">${esc(o.text)}${o.py && S.showPinyin ? `<br><small style="font-weight:400">${esc(o.py)}</small>` : ""}</span></button>`).join("")}</div>`, sc);
        $(".ktiles", el).onclick = e => { const b = e.target.closest("[data-i]"); if (b) send(+b.dataset.i); };
      } else if (q.type === "tf") {
        shell(`${head}<div class="pq" style="background:#fff;color:#1d2230;border-radius:14px;padding:12px">${wordHTML(q.shown, q.ans, q.shownPy)}</div><div class="ktiles" style="grid-template-columns:1fr 1fr"><button class="kt k2" data-i="0"><span class="sh">✓</span>Richtig</button><button class="kt k1" data-i="1"><span class="sh">✗</span>Falsch</button></div>`, sc);
        $(".ktiles", el).onclick = e => { const b = e.target.closest("[data-i]"); if (b) send(+b.dataset.i); };
      } else if (q.type === "scramble") {
        let built = []; const letters = q.letters.slice();
        shell(`${head}<div class="built" id="cBuilt" style="background:#fff;color:#1d2230"></div><div class="letters" id="cLet" style="justify-content:center">${letters.map((c, i) => `<button data-i="${i}" style="background:#fff;color:#1d2230">${esc(c === " " ? "␣" : c)}</button>`).join("")}</div>
          <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="cUndo">↶ Zurück</button><button class="btn primary big" id="cSend">Senden</button></div>`, sc);
        const drawB = () => $("#cBuilt", el).textContent = built.map(i => letters[i]).join("");
        $("#cLet", el).onclick = e => { const b = e.target.closest("[data-i]"); if (!b || b.disabled) return; built.push(+b.dataset.i); b.disabled = true; drawB(); };
        $("#cUndo", el).onclick = () => { const i = built.pop(); if (i != null) $(`#cLet [data-i="${i}"]`, el).disabled = false; drawB(); };
        $("#cSend", el).onclick = () => send(built.map(i => letters[i]).join(""));
      } else {
        shell(`${head}${q.type === "gap" ? `<div class="pat" style="text-align:center;margin:6px 0">${esc(q.pattern)}</div>` : ""}
          <form id="cF" autocomplete="off" style="display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:10px"><input type="text" id="cIn" lang="${q.ans}" autocapitalize="off" autocorrect="off" spellcheck="false" style="max-width:480px"><button class="btn primary big" type="submit">Senden</button></form>${charBar(q.ans, "#cIn")}`, sc);
        const inp = $("#cIn", el); setTimeout(() => inp.focus(), 60);
        $("#cF", el).onsubmit = e => { e.preventDefault(); if (inp.value.trim()) send(inp.value.trim()); };
      }
      clearInterval(timerIv);
      timerIv = setInterval(() => { const t = $("#cT", el); if (!t) return clearInterval(timerIv); t.textContent = Math.max(0, Math.ceil(q.dur - (Date.now() - qSeen[q.id]) / 1000)) + " s"; }, 300);
      return;
    }
    if (s.phase === "reveal" || s.phase === "board") {
      if (lastKey === key) return; lastKey = key;
      const l = mine && mine.l;
      const rank = Object.entries(s.players).sort((a, b) => b[1].s - a[1].s).findIndex(([id]) => id === pid) + 1;
      const ok = l && l.ok;
      el.style.background = s.phase === "reveal" ? (ok ? "#1f9d55" : "#c8323a") : "#46178f";
      shell(`<div class="center">${s.phase === "reveal" ? `<div class="bigic">${ok ? "✅" : "❌"}</div><div class="disp" style="font-size:34px">${ok ? "Richtig!" : l && l.q === "none" ? "Zu spät!" : "Leider falsch"}</div>
        ${ok ? `<div class="disp" style="font-size:30px">+${l.pts}</div>${mine.k > 1 ? `<div>🔥 Serie: ${mine.k}</div>` : ""}` : `<div>Richtig wäre:</div><div class="disp" style="font-size:30px;background:#fff;color:#1d2230;border-radius:12px;padding:8px 16px">${wordHTML(s.reveal.sol, s.q.ans, s.reveal.solPy)}</div>`}`
        : `<div class="bigic">${me.av}</div>`}
        <div style="font-size:20px">Du bist auf Platz <b>${rank || "–"}</b> · ${mine ? mine.s : 0} Punkte</div></div>`, sc);
      return;
    }
    if (s.phase === "final") {
      if (lastKey === key) return; lastKey = key; el.style.background = "#46178f";
      const r = Object.entries(s.players).sort((a, b) => b[1].s - a[1].s); const rank = r.findIndex(([id]) => id === pid) + 1;
      shell(`<div class="center"><div class="bigic">${rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : "🎉"}</div><div class="disp" style="font-size:34px">Platz ${rank} von ${r.length}</div><div style="font-size:22px">${mine ? mine.s : 0} Punkte</div><p>Danke fürs Mitspielen!</p></div>`, sc);
    }
  }
  /* --- Wettrennen / Fußball online --- */
  function raceView(s){
    const mine = s.players && s.players[pid];
    if (!mine) { if (net && Date.now() - lastJoin > 3000) { lastJoin = Date.now(); net.send({ type:"join", name:me.name, av:me.av }); } return; }
    const bar = s.game === "race" || s.kind === "race" ? `<b>${mine.pos}/${s.goal}</b>` : `<b>${mine.team === 0 ? "🔵 Team Blau" : "🟠 Team Orange"}</b>`;
    if (s.phase === "lobby") { if (lastKey !== "lobby") shell(`<div class="center"><div class="bigic">${me.av}</div><div class="disp" style="font-size:28px">Du bist dabei!</div>${s.kind === "soccer" ? `<p style="font-size:22px">${mine.team === 0 ? "🔵 Team Blau" : "🟠 Team Orange"}</p>` : ""}<p>Warte auf den Start …</p></div>`); lastKey = "lobby"; return; }
    if (s.phase === "end") {
      if (lastKey === "end") return; lastKey = "end";
      const win = s.kind === "race" ? s.winner === pid : s.winner === mine.team;
      shell(`<div class="center"><div class="bigic">${win ? "🏆" : "👏"}</div><div class="disp" style="font-size:32px">${win ? "Gewonnen!" : "Gut gespielt!"}</div><div>${mine.right} richtige Antworten</div></div>`, bar);
      return;
    }
    if (lastKey !== "play") { lastKey = "play"; nextRaceQ(s); }
    else { const b = $("#cBar", el); if (b) b.innerHTML = bar; }
  }
  function nextRaceQ(s){
    s = s || st; if (!s || s.phase !== "play" || closed) return;
    const pool = s.pool.map(x => Object.assign({}, x));
    const it = pick(pool); const [a, b] = pick(s.pairs);
    myQ = makeQuestion(it, a, b, "choice", s.diff, pool);
    const mine = s.players[pid];
    const bar = s.kind === "race" ? `<b id="cBar">${mine.pos}/${s.goal}</b>` : `<b id="cBar">${mine.team === 0 ? "🔵 Team Blau" : "🟠 Team Orange"}</b>`;
    shell(`<div class="pq">${wordHTML(myQ.prompt, a, myQ.promptPy)}</div><div style="text-align:center;opacity:.85;margin-bottom:6px">→ ${lname(b)}</div>
      <div class="ktiles">${myQ.options.map((o, i) => `<button class="kt k${i + 1}" data-i="${i}"><span class="sh">${SHAPES[i]}</span><span class="${b === "zh" ? "zh" : ""}">${esc(o.text)}</span></button>`).join("")}</div>`, bar);
    $(".ktiles", el).onclick = e => {
      const btn = e.target.closest("[data-i]"); if (!btn || Date.now() < frozenUntil) return;
      const i = +btn.dataset.i, ok = i === myQ.correct;
      $$(".kt", el).forEach((x, j) => { if (j !== myQ.correct) x.classList.add("dim"); });
      net.send({ type: ok ? "hit" : "miss" });
      if (ok) setTimeout(() => nextRaceQ(), 300);
      else { frozenUntil = Date.now() + 1300; el.style.background = "#c8323a"; setTimeout(() => { el.style.background = ""; nextRaceQ(); }, 1300); }
    };
  }
  joinForm();
}

renderPairBtn();
(function boot(){
  const params = new URLSearchParams(location.search);
  const j = params.get("join");
  if (j) { go("live"); startClient(j); return; }
  go(store.get("lastview", "learn"));
})();
$("#tabs").addEventListener("click", () => store.set("lastview", curView));
</script>
