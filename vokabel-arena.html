<title>Vokabel-Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ede2; --paper-2:#e9e1d2; --card:#fffdf8; --ink:#1d2230; --ink-2:#4a5162; --muted:#7a7f8c;
  --line:#d9cfbd; --rule:#c9dcef; --margin:#e8838b;
  --accent:#ff6a3d; --accent-ink:#fff; --teal:#1f8a7f; --ok:#1f9d55; --bad:#d64045; --warn:#e3a008;
  --k1:#e2364b; --k2:#1e6fd9; --k3:#e9a800; --k4:#21a05a;
  --shadow:0 1px 0 rgba(29,34,48,.06),0 8px 24px -12px rgba(29,34,48,.25);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14171e; --paper-2:#1b1f28; --card:#212632; --ink:#eef0f4; --ink-2:#c3c8d3; --muted:#8d94a3;
    --line:#333a49; --rule:#2a3b52; --margin:#7d3a40; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171e; --paper-2:#1b1f28; --card:#212632; --ink:#eef0f4; --ink-2:#c3c8d3; --muted:#8d94a3;
  --line:#333a49; --rule:#2a3b52; --margin:#7d3a40; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Noto Sans SC',sans-serif;
  font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.1}
h2{font-size:clamp(24px,4vw,32px);margin:0 0 6px}
h3{font-size:20px;margin:0 0 8px}
.zh{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif}

/* ---------- Kopf & Navigation ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--ink)}
.logo b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.pairbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:999px;
  padding:6px 14px;min-height:44px;font-weight:700}
.pairbtn .sw{color:var(--accent)}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px}
.tabs{max-width:1100px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;padding:10px 14px 12px;font-weight:700;color:var(--ink-2);
  border-bottom:4px solid transparent;min-height:48px;display:flex;align-items:center;gap:6px;justify-content:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}

/* ---------- Bausteine ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 18px;min-height:48px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #b8431f}
.btn.primary:active{box-shadow:0 1px 0 #b8431f}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.big{min-height:60px;font-size:20px;padding:12px 26px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 14px;min-height:44px;font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;min-height:40px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:15px}
input[type=text],input[type=number],select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:120px;resize:vertical}
.lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;max-width:90vw;box-shadow:var(--shadow)}

/* ---------- Wortauswahl ---------- */
.selsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selsum .what{font-weight:700}
.selpanel{margin-top:12px;border-top:1px dashed var(--line);padding-top:4px}
.langsel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.swapbtn{min-width:48px;min-height:46px;border-radius:10px;border:2px solid var(--ink);background:var(--card);font-size:20px;font-weight:800}

/* ---------- Karteikasten ---------- */
.box5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:120px;margin-top:10px}
.slot{position:relative;border:2px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;height:60px;background:var(--paper-2);display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.slot .stack{position:absolute;bottom:58px;left:10%;right:10%;background:repeating-linear-gradient(0deg,var(--card) 0 4px,var(--line) 4px 5px);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0}
.slot b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.slot small{font-size:11px;color:var(--muted);font-weight:700}
.lvlbar{display:grid;grid-template-columns:44px 1fr 70px;gap:10px;align-items:center;margin:6px 0}
.bar{height:12px;border-radius:999px;background:var(--paper-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- Abfrage ---------- */
.session{max-width:720px;margin:0 auto}
.sprog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sprog .bar{flex:1}
.qcard{position:relative;background:var(--card);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);
  padding:30px 22px 26px 46px;min-height:210px;display:flex;flex-direction:column;justify-content:center;
  background-image:linear-gradient(var(--card) 54px,transparent 54px),repeating-linear-gradient(180deg,transparent 0 33px,var(--rule) 33px 34px);
  overflow:hidden}
.qcard::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--margin)}
.qcard::after{content:"";position:absolute;left:0;right:0;top:54px;height:2px;background:var(--margin);opacity:.7}
.qmeta{position:absolute;top:16px;left:46px;right:16px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.qword{font-family:'Bricolage Grotesque','PingFang SC',sans-serif;font-weight:800;font-size:clamp(30px,6vw,48px);line-height:1.1;margin-top:26px;word-break:break-word}
.qsub{color:var(--ink-2);font-size:18px;margin-top:4px}
.qhint{color:var(--muted);font-size:15px;margin-top:8px}
.say{border:0;background:transparent;font-size:22px;min-width:44px;min-height:44px;border-radius:10px}
.flip{perspective:1200px;cursor:pointer}
.flip-in{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:260px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:14px;min-height:64px;font-size:19px;font-weight:700;text-align:left;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.opt small{font-weight:400;color:var(--muted);font-size:14px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 #11673a}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 3px 0 #8c2226}
.opt.ok small,.opt.bad small{color:rgba(255,255,255,.85)}
.ansrow{display:flex;gap:10px;margin-top:16px}
.ansrow input{font-size:22px;min-height:58px;font-weight:700}
.charbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.charbar button{min-width:40px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;font-weight:700;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));border:2px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,var(--card));border:2px solid var(--bad)}
.fb.mid{background:color-mix(in srgb,var(--warn) 15%,var(--card));border:2px solid var(--warn)}
.fb .ic{font-size:26px;line-height:1}
.fb .sol{font-size:22px;font-family:'Bricolage Grotesque','PingFang SC',sans-serif}
.letters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.letters button{min-width:48px;min-height:52px;border-radius:10px;border:2px solid var(--ink);background:var(--card);font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.letters button:disabled{opacity:.25;box-shadow:none}
.built{min-height:58px;border:2px dashed var(--line);border-radius:12px;margin-top:12px;padding:10px 14px;font-size:24px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center}

/* ---------- Wortliste ---------- */
.wtable{width:100%;border-collapse:collapse}
.wtable th,.wtable td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wtable th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line)}
.dots i.on{background:var(--teal);border-color:var(--teal)}

/* ---------- Spiele ---------- */
.tile{position:relative;border:2px solid var(--ink);border-radius:18px;padding:18px;background:var(--card);text-align:left;min-height:170px;
  display:flex;flex-direction:column;gap:6px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tile .em{font-size:44px;line-height:1}
.tile h3{margin:4px 0 0}
.tile p{margin:0;color:var(--ink-2);font-size:15px}
.pl-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.pl{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center}
.avbtn{font-size:30px;min-width:52px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.avgrid button{font-size:28px;min-height:52px;border-radius:10px;border:2px solid transparent;background:var(--paper-2)}
.avgrid button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--card))}

/* Spielarena (ein Gerät) */
.arena{position:fixed;inset:0;z-index:60;background:#0f2a1d;color:#fff;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.arena.race{background:#2b2f3a}
.arena .pans{display:grid;gap:6px;padding:6px;flex:0 0 auto}
.arena .pans.top{transform:rotate(180deg)}
.pan{background:rgba(255,255,255,.08);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;border:3px solid transparent;transition:border-color .2s,opacity .2s}
.pan.frozen{opacity:.45}
.pan .who{display:flex;align-items:center;gap:8px;font-weight:800}
.pan .who .sc{margin-left:auto;font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.pan .pq{font-family:'Bricolage Grotesque','PingFang SC',sans-serif;font-weight:800;font-size:clamp(20px,3.4vw,30px);text-align:center;line-height:1.1}
.pan .pq small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:400;font-size:14px;opacity:.75}
.pan .po{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pan .po button{min-height:54px;border-radius:12px;border:0;font-weight:800;font-size:clamp(15px,2.4vw,19px);color:#fff;padding:6px;line-height:1.15}
.pan .po button:nth-child(1){background:var(--k1)}.pan .po button:nth-child(2){background:var(--k2)}
.pan .po button:nth-child(3){background:var(--k3);color:#1d2230}.pan .po button:nth-child(4){background:var(--k4)}
.pan .po button.dim{opacity:.3}
.pan .po button.right{outline:4px solid #fff}
.field-wrap{flex:1;min-height:120px;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
.arena-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.25)}
.arena-bar button{min-height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:4px 12px;font-weight:700}
.arena-bar .ttl{font-weight:800;margin-right:auto}
.scoreboard{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,5vw,44px);display:flex;gap:16px;align-items:center}
.over{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.over .card{color:var(--ink);max-width:460px;width:100%;text-align:center}

/* Memory */
.mem{display:grid;gap:8px;width:100%;max-width:900px}
.mcard{aspect-ratio:4/3;border-radius:12px;border:0;font-weight:800;font-size:clamp(13px,2.2vw,20px);padding:6px;line-height:1.15;
  background:repeating-linear-gradient(45deg,#ff6a3d 0 10px,#f25a2c 10px 20px);color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.mcard.open{background:#fffdf8;color:#1d2230}
.mcard.done{background:#cdebd9;color:#1d2230;opacity:.75}

/* ---------- Live ---------- */
.live-host{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#3a1c71 0%,#5b2a86 45%,#1e6fd9 130%);color:#fff;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.live-host .card{color:var(--ink)}
.lh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lh-top button{min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;padding:6px 14px;font-weight:700}
.joinbox{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:#fff;color:#1d2230;border-radius:20px;padding:18px;max-width:900px;margin:16px auto}
@media (max-width:640px){.joinbox{grid-template-columns:1fr;text-align:center}}
.joinbox .qr svg{width:220px;height:220px;display:block;margin:auto}
.bigcode{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(48px,9vw,96px);letter-spacing:.08em;line-height:1}
.lobby{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1000px;margin:10px auto}
.lp{background:rgba(255,255,255,.14);border-radius:999px;padding:8px 16px 8px 10px;font-weight:800;display:flex;gap:8px;align-items:center;font-size:20px;animation:pop .35s}
.lp span{font-size:28px}
.lp button{border:0;background:transparent;color:#fff;opacity:.6;font-size:16px;min-width:30px;min-height:30px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.lq{max-width:1100px;margin:10px auto;text-align:center}
.lq .prompt{background:#fff;color:#1d2230;border-radius:18px;padding:22px;font-family:'Bricolage Grotesque','PingFang SC',sans-serif;font-weight:800;font-size:clamp(30px,5.5vw,64px);line-height:1.1}
.lq .prompt small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:18px;color:#7a7f8c;margin-bottom:6px}
.lq .mid{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
.timer{width:92px;height:92px;border-radius:50%;background:#fff;color:#5b2a86;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px}
.anscount{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kt{border-radius:14px;padding:16px 18px;min-height:86px;font-weight:800;font-size:clamp(18px,2.8vw,30px);display:flex;align-items:center;gap:14px;color:#fff;text-align:left;border:0;width:100%}
.kt .sh{font-size:30px;opacity:.95}
.kt.k1{background:var(--k1)}.kt.k2{background:var(--k2)}.kt.k3{background:var(--k3);color:#1d2230}.kt.k4{background:var(--k4)}
.kt.dim{opacity:.28}
.kt .cnt{margin-left:auto;font-size:.8em}
.lboard{max-width:720px;margin:10px auto;display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;background:#fff;color:#1d2230;border-radius:12px;padding:10px 16px;font-weight:800;font-size:22px;transition:transform .4s}
.lrow .av{font-size:30px}.lrow .pts{margin-left:auto;font-family:'Bricolage Grotesque',sans-serif}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:30px auto 10px;max-width:700px}
.pod{flex:1;text-align:center}
.pod .blk{background:#fff;color:#5b2a86;border-radius:12px 12px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:48px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px}
.pod .nm{font-weight:800;font-size:20px;margin:6px 0}
.pod .av{font-size:52px}
/* Mitspieler-Ansicht */
.live-pl{position:fixed;inset:0;z-index:60;background:#46178f;color:#fff;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.live-pl .stat{display:flex;align-items:center;gap:10px;font-weight:800}
.live-pl .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.live-pl .ktiles{flex:1;grid-auto-rows:1fr}
.live-pl .kt{min-height:0;height:100%;font-size:clamp(18px,5vw,30px)}
.live-pl .pq{font-family:'Bricolage Grotesque','PingFang SC',sans-serif;font-weight:800;font-size:clamp(24px,7vw,40px);text-align:center;margin:8px 0}
.live-pl input[type=text]{font-size:24px;min-height:60px;font-weight:800;color:#1d2230;background:#fff}
.live-pl .btn{border-color:#fff;color:#fff;background:transparent}
.live-pl .btn.primary{background:#fff;color:#46178f;border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.bigic{font-size:84px;line-height:1}
.pat{font-family:'Bricolage Grotesque',sans-serif;font-size:34px;letter-spacing:.18em;font-weight:800}

/* ---------- Test ---------- */
.titem{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.titem .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;color:var(--muted)}
.titem .tw{font-weight:700;font-size:19px}
.titem .topts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.titem .topts label{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;min-height:44px}
.titem.r-ok{background:color-mix(in srgb,var(--ok) 8%,transparent)}
.titem.r-bad{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.titem.r-mid{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.gradebig{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:96px;line-height:1;color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale label{font-size:13px}
#print{display:none}

@media print{
  @page{size:A4;margin:16mm 14mm}
  body{background:#fff;color:#000;font-size:12pt}
  html.va-printing body > *:not(#print){display:none!important}
  html.va-printing body > #print{display:block!important}
  .pp{page-break-after:always}
  .pp:last-child{page-break-after:auto}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
  .ph h1{font-size:20pt;margin:0}
  .pfields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:8px 0 14px;font-size:11pt}
  .pfields div{border-bottom:1px solid #000;padding-top:14px}
  .pi{display:grid;grid-template-columns:8mm 1fr 14mm;gap:6px;padding:3px 0;break-inside:avoid;border-bottom:1px dotted #999}
  .pi .pw{font-weight:700}
  .pi .line{border-bottom:1px solid #000;height:7mm}
  .pi .pts{text-align:right;font-size:10pt}
  .pi .ch{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:3px;font-size:11pt}
  .ptab{border-collapse:collapse;margin-top:12px;font-size:10pt}
  .ptab td,.ptab th{border:1px solid #000;padding:3px 8px;text-align:center}
  .psol{color:#000;font-weight:700}
}
/* Platz für den buildspace-Zurück-Knopf oben links */
body:has(#protect-back-link) .logo{padding-left:122px;transition:padding .3s}
body:has(#protect-back-link) .lh-top,body:has(#protect-back-link) .arena-bar,body:has(#protect-back-link) .live-pl .stat{padding-left:56px;transition:padding .3s}
html.protect-ui-hidden body .logo,html.share-mode body .logo,html.protect-ui-hidden body .lh-top,html.protect-ui-hidden body .arena-bar,html.protect-ui-hidden body .live-pl .stat{padding-left:0}
@media (max-width:480px){body:has(#protect-back-link) .logo{padding-left:52px}}
/* ---------- Dialoge ---------- */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(15,18,25,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
.modal{width:100%;margin:auto 0;color:var(--ink)}
.modal h2{margin-bottom:10px}
#tForm .charbar{position:sticky;bottom:0;background:var(--card);padding:8px 0;border-top:1px solid var(--line);z-index:2}
.live-pl .charbar{justify-content:center}
.live-pl .charbar button{background:#fff;color:#1d2230}
.live-pl .charbar .muted{color:rgba(255,255,255,.8)}
.arena .over .card h2{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    ops.push(() => { const i = 1 + Math.floor(Math.random() * (core.length - 2)); const a = core.split(""); [a[i], a[i + 1]] = [a[i + 1], a[i]]; return art + a.join(""); });

/* level: 'easy' | 'medium' | 'hard' */
function distractors(item, lang, n, level, poolItems){

  const cands = (poolItems && poolItems.length > 12 ? poolItems : allItems()).filter(x => x.id !== item.id && txt(x, lang));
  if (level === "hard") {
    for (let k = 0; k < 4 && out.length < Math.min(2, n - 1); k++) addText(misspell(sol, lang));
  }
  let ranked;
  if (level === "easy") ranked = shuffle(cands.filter(x => x.topic !== item.topic)).concat(shuffle(cands));
  else {
    const base = deaccent(stripArticle(basicNorm(sol), lang));
    ranked = cands.map(x => {

/* ---------- Pools & Aufgaben ---------- */
function sourceItems(){
  if (S.source === "base") return BASE;
  const L = LISTS.find(l => l.id === S.source);
  return L ? L.entries : BASE;
}
function itemHas(it, a, b){ return !!(txt(it, a) && txt(it, b)); }
function levelsActive(){
  if (S.source !== "base") return null;

}

  opts = opts || {};

}
function dirPairs(){
  if (S.dir === "ab") return [[S.from, S.to]];

function pkey(ask, ans, id){ return ask + ">" + ans + "|" + id; }

  else { p.w++; p.b = 1; }

/* Automatische Niveau-Freischaltung: nächste Stufe, sobald 60 % der vorigen sicher (Fach ≥ 3) */
function levelStats(levelsFilter){
  const res = {};

  LEVELS.forEach(L => {
    const items = BASE.filter(it => it.lvl === L && itemHas(it, S.from, S.to) && (!S.topics.length || S.topics.includes(it.topic)));
    let tot = 0, mastered = 0, seen = 0;
    items.forEach(it => pairs.forEach(([a, b]) => { tot++; const p = prog(a, b, it.id); if (p) { seen++; if (p.b >= 3) mastered++; } }));
    res[L] = { tot, mastered, seen, share: tot ? mastered / tot : 0 };

  const si = LEVELS.indexOf(start);

/* Lernsitzung zusammenstellen (fällige zuerst, dann neue Wörter) */
function buildSession(size){
  const pool = getPool();
  const now = Date.now();
  const tasks = [];
  pool.forEach(it => dirPairs().forEach(([a, b]) => tasks.push({ item:it, ask:a, ans:b, p:prog(a, b, it.id) })));
  const due = tasks.filter(t => t.p && t.p.d <= now).sort((x, y) => (x.p.b - y.p.b) || (x.p.d - y.p.d));
  const lvOrder = l => LEVELS.indexOf(l);
  const fresh = shuffle(tasks.filter(t => !t.p)).sort((x, y) => lvOrder(x.item.lvl) - lvOrder(y.item.lvl));
  const maxNew = due.length >= size * .5 ? Math.max(3, Math.round(size * .3)) : size;
  const sel = due.slice(0, size);
  const nNew = Math.min(maxNew, size - sel.length);
  sel.push(...fresh.slice(0, Math.max(0, nNew)));
  if (sel.length < size) {
    const rest = tasks.filter(t => t.p && !sel.includes(t)).sort((x, y) => (x.p.b - y.p.b) || ((y.p.w / (y.p.r + 1)) - (x.p.w / (x.p.r + 1))));

  return n;

/* Aufgabe für Spiele/Quiz/Test erzeugen.
   type: choice | input | tf | scramble | gap | card ; diff: easy|medium|hard */
function makeQuestion(item, ask, ans, type, diff, pool){
  const q = { id: uid(6), itemId:item.id, ask, ans, type, prompt: txt(item, ask), promptPy: ask === "zh" ? pinyin(item) : "",
    sol: txt(item, ans), solPy: ans === "zh" ? pinyin(item) : "" };
  if (type === "choice") {
    const ds = distractors(item, ans, diff === "hard" ? 3 : 3, diff || "medium", pool);
    const opts = shuffle([{ text:q.sol, py:q.solPy, ok:true }].concat(ds.map(d => ({ text:d.text, py: ans === "zh" && d.item ? pinyin(d.item) : "", ok:false }))));
    q.options = opts.map(o => ({ text:o.text, py:o.py })); q.correct = opts.findIndex(o => o.ok);
  } else if (type === "tf") {
    const right = Math.random() < .5;
    if (right) { q.shown = q.sol; q.shownPy = q.solPy; q.correct = 0; }
    else { const d = distractors(item, ans, 1, diff === "hard" ? "hard" : "medium", pool)[0]; q.shown = d ? d.text : q.sol; q.shownPy = d && d.item && ans === "zh" ? pinyin(d.item) : ""; q.correct = d ? 1 : 0; }
  } else if (type === "scramble") {

    const letters = Array.from(base);
    let sh = shuffle(letters); for (let k = 0; k < 5 && sh.join("") === base && letters.length > 1; k++) sh = shuffle(letters);
    q.letters = sh; q.target = base;
  } else if (type === "gap") {
    const base = stripParens(q.sol.split("/")[0]).replace(/,.*$/, "");
    const chars = Array.from(base);
    const show = new Set([0]);
    const letterIdx = chars.map((c, i) => /\p{L}/u.test(c) ? i : -1).filter(i => i > 0);
    const reveal = diff === "easy" ? .5 : diff === "hard" ? .15 : .3;
    shuffle(letterIdx).slice(0, Math.floor(letterIdx.length * reveal)).forEach(i => show.add(i));
    q.pattern = chars.map((c, i) => (!/\p{L}/u.test(c) || show.has(i)) ? c : "_").join("");
    q.target = base;
  }

}
/* Antwort auf eine erzeugte Frage bewerten → {ok, q, sol} */
function judge(q, value, opts){
  const item = findItem(q.itemId) || { t:{ [q.ans]: q.sol }, py:q.solPy };
  if (q.type === "choice") { const ok = Number(value) === q.correct; return { ok, q: ok ? "exact" : "wrong", sol:q.sol }; }
  if (q.type === "tf") { const ok = Number(value) === q.correct; return { ok, q: ok ? "exact" : "wrong", sol:q.sol }; }
  if (q.type === "scramble") { const ok = basicNorm(value) === basicNorm(q.target); return { ok, q: ok ? "exact" : "wrong", sol:q.sol }; }
  return checkAnswer(item, q.ans, value, opts);
}

function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const delim = ["\t",";",","].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

/* ---------- Lernsitzung ---------- */
function typeFor(task, mode){
  const p = prog(task.ask, task.ans, task.item.id); const b = p ? p.b : 0;
  if (task.force) return task.force;
  if (mode === "adaptive") return b <= 1 ? { t:"choice", d: b === 0 ? "easy" : "medium" } : b === 2 ? { t:"choice", d:"hard" } : { t:"input" };
  if (mode === "choice") return { t:"choice", d: b >= 2 ? "hard" : "medium" };
  if (mode === "card") return { t:"card" };
  return { t:"input" };
}
function runSession(tasks, mode, opts){
  opts = opts || {};
  const queue = tasks.map(t => Object.assign({}, t));
  const total = tasks.length;
  const failed = new Set(), done = new Set(), firstOk = new Set();
  let cur = null, locked = false;
  const poolItems = getPool({ ignoreLevels:true });
  const key = t => t.ask + ">" + t.ans + "|" + t.item.id;

  function finish(){
    const wrong = tasks.filter(t => failed.has(key(t)));
    view.innerHTML = `<div class="session"><section class="card" style="text-align:center">
      <div style="font-size:64px">${wrong.length === 0 ? "🏆" : wrong.length <= total / 4 ? "🎉" : "💪"}</div>
      <h2>${opts.title || "Runde geschafft!"}</h2>
      <p style="font-size:20px"><b>${firstOk.size}</b> von ${total} beim ersten Versuch richtig.</p>
      ${wrong.length ? `<div class="lbl">Diese Wörter hast du nachgeübt</div><div style="text-align:left">${wrong.map(t => `<div class="row" style="border-bottom:1px solid var(--line);padding:6px 0"><span>${esc(txt(t.item, t.ask))}</span><span class="spacer"></span><b>${esc(txt(t.item, t.ans))}</b></div>`).join("")}</div>` : ""}
      ${opts.after ? opts.after() : ""}
      <div class="row" style="justify-content:center;margin-top:18px">
        <button class="btn primary big" id="again">Nächste Runde</button><button class="btn ghost" id="back">Übersicht</button></div>
    </section></div>`;
    $("#again").onclick = () => { const t = buildSession(S.size); t.length ? runSession(t, mode) : renderLearn(); };
    $("#back").onclick = renderLearn;
    if (opts.onDone) opts.onDone(firstOk, failed);
  }
  function next(){
    locked = false;
    if (!queue.length) return finish();
    cur = queue.shift();
    draw();
  }
  function answered(ok, res){
    if (locked) return; locked = true;
    const k = key(cur);
    const first = !failed.has(k);
    if (!opts.noRecord) record(cur.ask, cur.ans, cur.item.id, ok, first);
    if (ok) { if (first) firstOk.add(k); done.add(k); }
    else {
      failed.add(k);
      const again = Object.assign({}, cur, { retry:true });
      if (mode === "card") again.force = { t:"card" };
      else if (mode === "choice") again.force = { t:"choice", d:"medium" };
      else again.force = { t:"input" };
      queue.splice(Math.min(queue.length, 2 + Math.floor(Math.random() * 2)), 0, again);
    }
    showFeedback(ok, res);
  }
  function header(){
    const pct = Math.round(100 * done.size / total);
    return `<div class="sprog"><button class="btn ghost" id="quit" aria-label="Beenden">✕</button><div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div><b>${done.size}/${total}</b></div>`;
  }
  function meta(type){
    const p = prog(cur.ask, cur.ans, cur.item.id);
    return `<div class="qmeta"><span>${lflag(cur.ask)} → ${lflag(cur.ans)}</span>${cur.item.lvl ? `<span class="badge">${cur.item.lvl}</span>` : ""}<span class="badge">Fach ${p ? p.b : "neu"}</span>${cur.retry ? `<span class="badge" style="background:var(--bad);color:#fff">nochmal</span>` : ""}<span class="spacer"></span>${sayBtn(txt(cur.item, cur.ask), cur.ask)}</div>`;
  }
  function draw(){
    const ty = typeFor(cur, mode);
    const prompt = wordHTML(txt(cur.item, cur.ask), cur.ask, cur.ask === "zh" ? pinyin(cur.item) : "");
    if (ty.t === "card") {
      view.innerHTML = `<div class="session">${header()}
        <div class="flip" id="flip" tabindex="0" role="button" aria-label="Karte umdrehen"><div class="flip-in">
          <div class="face qcard">${meta()}<div class="qword">${prompt}</div><div class="qhint">Tippe zum Umdrehen</div></div>
          <div class="face back qcard"><div class="qmeta"><span>Lösung</span><span class="spacer"></span>${sayBtn(txt(cur.item, cur.ans), cur.ans)}</div><div class="qword">${wordHTML(txt(cur.item, cur.ans), cur.ans, cur.ans === "zh" ? pinyin(cur.item) : "")}</div><div class="qsub">${esc(txt(cur.item, cur.ask))}</div></div>
        </div></div>
        <div class="row hidden" id="selfrate" style="margin-top:16px;justify-content:center">
          <button class="btn big" id="no" style="border-color:var(--bad);color:var(--bad)">✗ Nicht gewusst</button>
          <button class="btn big" id="yes" style="background:var(--ok);border-color:var(--ok);color:#fff">✓ Gewusst</button></div>
        <div id="fbArea"></div></div>`;
      const flip = $("#flip");
      const turn = () => { flip.classList.add("on"); $("#selfrate").classList.remove("hidden"); };
      flip.onclick = turn; flip.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); turn(); } };
      $("#yes").onclick = () => { locked = false; answered(true, { q:"exact" }); };
      $("#no").onclick = () => { locked = false; answered(false, { q:"wrong", sol:txt(cur.item, cur.ans) }); };
    } else if (ty.t === "choice") {
      const q = makeQuestion(cur.item, cur.ask, cur.ans, "choice", ty.d, poolItems);
      view.innerHTML = `<div class="session">${header()}<div class="qcard">${meta()}<div class="qword">${prompt}</div></div>
        <div class="opts" id="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="${cur.ans === "zh" ? "zh" : ""}">${esc(o.text)}</span>${o.py && S.showPinyin ? `<small>${esc(o.py)}</small>` : ""}</button>`).join("")}</div>
        <div id="fbArea"></div></div>`;
      $("#opts").onclick = e => {
        const b = e.target.closest(".opt"); if (!b || locked) return;
        const i = +b.dataset.i, ok = i === q.correct;
        $$("#opts .opt").forEach((x, j) => { if (j === q.correct) x.classList.add("ok"); else if (j === i) x.classList.add("bad"); x.disabled = true; });
        answered(ok, { q: ok ? "exact" : "wrong", sol:q.sol });
      };
    } else {
      view.innerHTML = `<div class="session">${header()}<div class="qcard">${meta()}<div class="qword">${prompt}</div><div class="qhint">Auf ${lname(cur.ans)}:</div></div>
        <form class="ansrow" id="ansForm" autocomplete="off"><input type="text" id="ans" aria-label="Deine Antwort" autocapitalize="off" autocorrect="off" spellcheck="false" lang="${cur.ans}" enterkeyhint="done"><button class="btn primary" type="submit">Prüfen</button></form>
        ${charBar(cur.ans, "#ans")}
        <div class="row" style="margin-top:8px"><button class="btn ghost small" id="dunno" type="button">Weiß ich nicht</button></div>
        <div id="fbArea"></div></div>`;
      const inp = $("#ans"); setTimeout(() => inp.focus(), 50);
      $("#ansForm").onsubmit = e => { e.preventDefault(); if (locked) return; const r = checkAnswer(cur.item, cur.ans, inp.value); inp.disabled = true; answered(r.ok, r); };
      $("#dunno").onclick = () => { if (locked) return; inp.disabled = true; answered(false, { q:"wrong", sol:txt(cur.item, cur.ans) }); };
    }
    $("#quit").onclick = () => confirmBox("Runde beenden? Bisherige Antworten sind gespeichert.", "Beenden", renderLearn);
  }
  function showFeedback(ok, res){
    const sol = txt(cur.item, cur.ans), py = cur.ans === "zh" ? pinyin(cur.item) : "";
    const cls = ok ? (res.q === "exact" ? "ok" : "mid") : "bad";
    const area = $("#fbArea");
    const needsCopy = !ok && (typeFor(cur, mode).t === "input");
    area.innerHTML = `<div class="fb ${cls}" role="status"><span class="ic">${ok ? "✓" : "✗"}</span><div style="flex:1">
      <div>${esc(qualityText(res.q))}</div>${(!ok || res.q !== "exact") ? `<div class="sol">${wordHTML(sol, cur.ans, py)}</div>` : ""}
      ${needsCopy ? `<div class="small" style="margin-top:6px">Schreib es einmal richtig ab:</div><form class="ansrow" id="copyForm" style="margin-top:6px" autocomplete="off"><input type="text" id="copy" autocapitalize="off" autocorrect="off" spellcheck="false" lang="${cur.ans}"><button class="btn" type="submit">OK</button></form>` : ""}
    </div></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary big" id="nextBtn" ${needsCopy ? "disabled" : ""}>Weiter →</button></div>`;
    const nb = $("#nextBtn"); nb.onclick = next;
    if (needsCopy) {
      const c = $("#copy"); setTimeout(() => c.focus(), 50);
      $("#copyForm").onsubmit = e => {
        e.preventDefault();
        const r = checkAnswer(cur.item, cur.ans, c.value, { typoOk:false, strictArticle:false });
        if (r.q === "exact" || r.q === "article" || r.q === "translit") { nb.disabled = false; c.disabled = true; nb.focus(); toast("Gut – gleich kommt es nochmal."); }
        else { c.select(); toast("Noch nicht ganz – schau genau hin."); }
      };
    } else setTimeout(() => nb.focus(), 30);
    if (ok && S.tts && cur.ans !== "la") { /* kein Auto-Vorlesen, nur auf Wunsch */ }
  }
  next();
}

/* ---------- Einstufungstest ---------- */
function startPlacement(){
  const tasks = [];
  LEVELS.forEach(L => {
    const items = shuffle(BASE.filter(it => it.lvl === L && itemHas(it, S.from, S.to))).slice(0, 6);
    items.forEach(it => tasks.push({ item:it, ask:S.from, ans:S.to, force:{ t:"choice", d:"medium" }, lvl:L }));
  });
  if (!tasks.length) return toast("Für dieses Sprachpaar gibt es keine Wörter.");
  const res = {};
  view.innerHTML = `<div class="session"><section class="card"><h2>🧭 Einstufungstest</h2><p>18 Wörter aus A1, A2 und B1. Danach weiß die App, auf welchem Niveau du startest. Rate ruhig – falsche Antworten schaden nicht.</p>
    <button class="btn primary big" id="pgo">Starten</button> <button class="btn ghost" id="pback">Zurück</button></section></div>`;
  $("#pback").onclick = renderLearn;
  $("#pgo").onclick = () => runSession(tasks, "choice", {
    noRecord:false, title:"Einstufung fertig",
    onDone(firstOk){
      LEVELS.forEach(L => { res[L] = tasks.filter(t => t.lvl === L && firstOk.has(t.ask + ">" + t.ans + "|" + t.item.id)).length; });
      let start = "A1";
      if (res.A1 >= 4) { start = "A2"; if (res.A2 >= 4) start = "B1"; }
      PLACEMENT[pairKeyPlacement()] = start; store.set("placement", PLACEMENT);
      const box = document.createElement("div");
      box.innerHTML = `<div class="card" style="margin-top:14px;text-align:left"><b>Ergebnis:</b> A1 ${res.A1}/6 · A2 ${res.A2}/6 · B1 ${res.B1}/6<br>Freigeschaltet bis <b>${start}</b>. Mit „Niveau: Automatisch“ lernst du ab jetzt passend weiter.</div>`;
      $(".session .card").appendChild(box);
      S.levels = ["auto"]; saveSettings();
    }
  });
}

  $("#iTarget", m.el).onchange = e => $("#iNameWrap", m.el).classList.toggle("hidden", e.target.value !== "new");

    $("#iText", m.el).value = await f.text();
    if (!$("#iName", m.el).value) $("#iName", m.el).value = f.name.replace(/\.[^.]+$/, "");
    preview();
  };
  const parse = () => {
    const raw = $("#iText", m.el).value.trim(); if (!raw) return null;
    if (raw[0] === "{" || raw[0] === "[") {
      try {
        const d = JSON.parse(raw);
        const lists = Array.isArray(d) ? (d[0] && d[0].entries ? d : [{ name:"Import", entries:d }]) : (d.entries ? [d] : d.lists || []);
        const entries = [], langs = new Set();
        lists.forEach(l => (l.entries || []).forEach(e => { const t = e.t || e; const tt = {}; LORDER.forEach(k => { if (t[k]) { tt[k] = String(t[k]); langs.add(k); } }); if (Object.keys(tt).length >= 2) entries.push({ id:"u:" + uid(8), t:tt, py:e.py || t.py || "", lvl:e.lvl, topic:e.topic }); }));
        return { entries, langs:Array.from(langs), name:(lists[0] && lists[0].name) || "" };
      } catch(err){ return { error:"JSON fehlerhaft" }; }
    }
    const rows = parseCSV(raw); if (!rows.length) return null;
    const keys = rows[0].map(headerKey);
    let cols, data;
    if (keys.filter(k => k && LANGS[k]).length >= 2) { cols = keys; data = rows.slice(1); }
    else { cols = [S.from, S.to]; data = rows; }
    const entries = data.map(r => { const t = {}; let py = "", lvl, topic; cols.forEach((k, i) => { const v = (r[i] || "").trim(); if (!k || !v) return; if (k === "py") py = v; else if (k === "lvl") lvl = v.toUpperCase(); else if (k === "topic") topic = v; else t[k] = v; }); return { id:"u:" + uid(8), t, py, lvl: LEVELS.includes(lvl) ? lvl : undefined, topic }; })
      .filter(e => Object.keys(e.t).length >= 2);
    return { entries, langs:cols.filter(k => k && LANGS[k]), headerless: cols[0] === S.from && keys.filter(k => k && LANGS[k]).length < 2 };
  };
  const preview = () => {
    const r = parse(); const info = $("#iInfo", m.el);
    if (!r) { info.textContent = ""; return; }
    if (r.error) { info.textContent = r.error; return; }
    info.innerHTML = `Erkannt: <b>${r.entries.length}</b> Einträge · Sprachen: ${r.langs.map(l => lflag(l) + " " + lname(l)).join(", ")}${r.headerless ? " (ohne Kopfzeile – als aktuelle Sprachen gelesen)" : ""}`;
    if (r.name && !$("#iName", m.el).value) $("#iName", m.el).value = r.name;
  };
  $("#iText", m.el).oninput = preview;
  $("#iGo", m.el).onclick = () => {
    const r = parse(); if (!r || r.error || !r.entries.length) return toast("Keine gültigen Einträge gefunden.");
    const tgt = $("#iTarget", m.el).value;
    if (tgt === "new") LISTS.push({ id:"l" + uid(7), name:$("#iName", m.el).value.trim() || "Import", langs:r.langs, entries:r.entries });
    else { const L = LISTS.find(x => x.id === tgt); L.entries.push(...r.entries); r.langs.forEach(l => { if (!L.langs.includes(l)) L.langs.push(l); }); }
    saveLists(); refreshItemCache(); m.close(); toast(r.entries.length + " Einträge importiert"); renderWords();
  };
}

const DEFAULT_SCALE = [87, 73, 59, 45, 18, 0];
let TC = Object.assign({ title:"Vokabeltest", count:15, type:"mixed", diff:"medium", half:true, tend:false, scale:DEFAULT_SCALE.slice(), groups:false }, store.get("testcfg", {}));
function saveTC(){ store.set("testcfg", TC); }
function gradeFor(pct){
  const sc = TC.scale; let g = 6;
  for (let i = 0; i < 6; i++) if (pct >= sc[i]) { g = i + 1; break; }
  if (!TC.tend || g === 6) return { g:String(g), n:g };
  const lo = TC.scale[g - 1], hi = g === 1 ? 100.01 : TC.scale[g - 2];
  const pos = (pct - lo) / (hi - lo);
  const t = pos >= 2 / 3 && g !== 1 ? "+" : pos < 1 / 3 ? "−" : "";
  return { g:String(g) + t, n:g };
}
function buildTest(){
  const pool = shuffle(getPool());
  const n = Math.min(TC.count, pool.length);
  const pairs = dirPairs();
  return pool.slice(0, n).map((it, i) => {
    const [a, b] = pick(pairs);
    const type = TC.type === "mixed" ? (i % 2 ? "input" : "choice") : TC.type;
    return makeQuestion(it, a, b, type, TC.diff, pool);
  });
}

function loadScript(src){
  return new Promise((res, rej) => {
    const ex = Array.from(document.scripts).find(x => x.src === src);
    if (ex) {
      if (ex.dataset.loaded === "0") { ex.addEventListener("load", () => res()); ex.addEventListener("error", () => rej(new Error("Skript nicht ladbar"))); }
      else res();
      return;
    }
    const s = document.createElement("script"); s.src = src; s.dataset.loaded = "0";
    s.onload = () => { s.dataset.loaded = "1"; res(); }; s.onerror = () => rej(new Error("Skript nicht ladbar: " + src));
    document.head.appendChild(s);
  });
}
function waitFor(fn, ms){
  return new Promise((res, rej) => { const t0 = Date.now(); (function tick(){ if (fn()) return res(); if (Date.now() - t0 > ms) return rej(new Error("Bibliothek lädt nicht")); setTimeout(tick, 80); })(); });
}
function withTimeout(p, ms, msg){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg || "Zeitüberschreitung")), ms))]); }
function myPid(){

}
async function fbInit(){

  await waitFor(() => window.firebase && firebase.initializeApp, 9000);
  if (!firebase.firestore) await loadScript(FB_BASE + "firebase-firestore-compat.js");
  if (!firebase.auth) await loadScript(FB_BASE + "firebase-auth-compat.js");
  await waitFor(() => firebase.firestore && firebase.auth, 9000);
  fbApp = firebase.apps.find(a => a.name === "vokabelarena") || firebase.initializeApp(FB_CFG, "vokabelarena");
  const auth = fbApp.auth();
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e){}
  if (!auth.currentUser) await auth.signInAnonymously();
  return fbApp;
}
function genCode(p2p){
  const c = "ABCDEFGHJKLMNQRSTUVWXYZ23456789";

}

/* ---- Firestore ---- */
async function fsHost(code, onMsg){
  const app = await withTimeout(fbInit(), 9000, "Firebase lädt nicht");
  const ref = app.firestore().collection(NET_COLL).doc(code);
  await withTimeout(ref.set({ host: app.auth().currentUser.uid, created: Date.now(), state: "", v: 0 }), 9000, "Raum anlegen fehlgeschlagen");
  await withTimeout(ref.collection("m").add({ from:"host", type:"ping", ts:Date.now() }), 9000, "Nachrichtenkanal fehlt");
  const seen = new Set();
  const unsub = ref.collection("m").onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== "added" || seen.has(ch.doc.id)) return; seen.add(ch.doc.id);
      const d = ch.doc.data(); if (d.type !== "ping") onMsg(d);
    });
  }, err => console.warn("vokabelArena msgs", err));
  let pending = null, timer = null, v = 0, last = 0;
  const flush = () => { timer = null; v++; last = Date.now(); ref.update({ state: pending, v }).catch(e => console.warn(e)); };
  return {
    mode:"fs", code,
    setState(st){ pending = JSON.stringify(st); if (!timer) timer = setTimeout(flush, Math.max(0, 140 - (Date.now() - last))); },
    close(){ try { unsub(); } catch(e){} clearTimeout(timer); ref.delete().catch(() => {}); }
  };
}
async function fsJoin(code, onState, onClose){
  const app = await withTimeout(fbInit(), 9000, "Firebase lädt nicht");
  const ref = app.firestore().collection(NET_COLL).doc(code);
  const snap = await withTimeout(ref.get(), 9000, "Raum nicht erreichbar");
  if (!snap.exists) throw new Error("Diesen Raum gibt es nicht (mehr).");
  const unsub = ref.onSnapshot(s => {
    if (!s.exists) { if (onClose) onClose(); return; }
    const d = s.data(); if (d.state) { try { onState(JSON.parse(d.state)); } catch(e){} }
  }, () => { if (onClose) onClose(); });
  return { mode:"fs", send(msg){ return ref.collection("m").add(Object.assign({ ts:Date.now(), from:myPid() }, msg)).catch(e => console.warn(e)); }, close(){ try { unsub(); } catch(e){} } };
}

/* ---- PeerJS (Rückfall) ---- */
async function p2pHost(code, onMsg){
  await loadScript(PEERJS_SRC); await waitFor(() => window.Peer, 9000);
  return withTimeout(new Promise((res, rej) => {
    const peer = new Peer("vokabelarena-" + code.toLowerCase());
    const conns = new Set(); let state = null, timer = null;
    const flush = () => { timer = null; conns.forEach(c => { if (c.open) try { c.send(state); } catch(e){} }); };
    peer.on("open", () => res({ mode:"p2p", code,
      setState(st){ state = JSON.stringify(st); if (!timer) timer = setTimeout(flush, 60); },
      close(){ try { peer.destroy(); } catch(e){} } }));
    peer.on("connection", c => {
      conns.add(c);
      c.on("open", () => { if (state) c.send(state); });
      c.on("data", d => { try { onMsg(typeof d === "string" ? JSON.parse(d) : d); } catch(e){} });
      c.on("close", () => conns.delete(c));
    });
    peer.on("error", e => rej(e));
  }), 12000, "PeerJS-Server nicht erreichbar");
}
async function p2pJoin(code, onState, onClose){
  await loadScript(PEERJS_SRC); await waitFor(() => window.Peer, 9000);
  return withTimeout(new Promise((res, rej) => {
    const peer = new Peer();
    peer.on("open", () => {
      const c = peer.connect("vokabelarena-" + code.toLowerCase(), { reliable:true });
      c.on("open", () => res({ mode:"p2p", send(m){ try { c.send(JSON.stringify(Object.assign({ ts:Date.now(), from:myPid() }, m))); } catch(e){} }, close(){ try { peer.destroy(); } catch(e){} } }));
      c.on("data", d => { try { onState(typeof d === "string" ? JSON.parse(d) : d); } catch(e){} });
      c.on("close", () => { if (onClose) onClose(); });
    });
    peer.on("error", e => rej(e.type === "peer-unavailable" ? new Error("Diesen Raum gibt es nicht (mehr).") : e));
  }), 12000, "Raum nicht erreichbar");
}

async function netHost(onMsg){
  const forceP2p = new URLSearchParams(location.search).has("p2p");

}
function netJoin(code, onState, onClose){
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  return code[0] === "P" ? p2pJoin(code, onState, onClose) : fsJoin(code, onState, onClose);

    ${g === "race" ? `<div class="lbl">Streckenlänge</div><div class="seg" id="gsGoal">${[8, 12, 16, 20].map(n => `<button data-v="${n}" aria-pressed="${GS.goal === n}">${n} Schritte</button>`).join("")}</div>` : ""}
    ${g === "soccer" ? `<div class="lbl">Spiel bis</div><div class="seg" id="gsGoals">${[2, 3, 5].map(n => `<button data-v="${n}" aria-pressed="${GS.goals === n}">${n} Tore</button>`).join("")}</div>` : ""}
    ${g === "memory" ? `<div class="lbl">Paare</div><div class="seg" id="gsPairs">${[6, 8, 10, 12].map(n => `<button data-v="${n}" aria-pressed="${GS.pairs === n}">${n}</button>`).join("")}</div>` : ""}
    ${g !== "memory" ? `<label class="row" style="margin-top:14px" id="gsFaceWrap"><input type="checkbox" id="gsFace" ${GS.facing ? "checked" : ""} style="width:24px;height:24px"> Gegenüber sitzen (obere Hälfte steht auf dem Kopf)</label>` : ""}
    <div class="row" style="margin-top:20px"><button class="btn primary big" id="gsGo">Spiel starten</button></div></section>`;
  const dh = { easy:"Antworten aus anderen Themen – gut zum Einstieg.", medium:"Ähnliche Wörter aus demselben Thema.", hard:"Auch falsche Schreibweisen – und der Computer ist schneller." };

    $("#gsPl").innerHTML = GS.players.slice(0, GS.n).map((p, i) => `<div class="pl" style="border-color:${PCOLORS[i]}"><button class="avbtn" data-av="${i}" aria-label="Figur wählen">${p.av}</button><input type="text" data-pn="${i}" value="${esc(p.name)}" maxlength="16" aria-label="Name Spieler ${i + 1}"></div>`).join("")
      + (g === "soccer" && GS.n > 1 ? `<p class="small muted" style="grid-column:1/-1;margin:0">Teams: 🔵 ${GS.players.filter((_, i) => i < GS.n && i % 2 === 0).map(p => esc(p.name)).join(" & ")} gegen 🟠 ${GS.players.filter((_, i) => i < GS.n && i % 2 === 1).map(p => esc(p.name)).join(" & ")}</p>` : "");
    $("#gsDh").textContent = dh[GS.diff];
  };
  drawPl();
  const segs = { gsN:"n", gsD:"diff", gsGoal:"goal", gsGoals:"goals", gsPairs:"pairs" };
  Object.entries(segs).forEach(([id, k]) => { const el = $("#" + id); if (!el) return; el.onclick = e => { const b = e.target.closest("button"); if (!b) return; GS[k] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; saveGS(); $$("button", el).forEach(x => x.setAttribute("aria-pressed", x === b)); drawPl(); }; });
  $("#gsPl").oninput = e => { const i = e.target.dataset.pn; if (i != null) { GS.players[+i].name = e.target.value || "Spieler " + (+i + 1); saveGS(); } };
  $("#gsPl").onclick = e => { const b = e.target.closest("[data-av]"); if (b) avatarPicker(GS.players[+b.dataset.av].av, a => { GS.players[+b.dataset.av].av = a; saveGS(); drawPl(); }); };
  const fc = $("#gsFace"); if (fc) fc.onchange = () => { GS.facing = fc.checked; saveGS(); };
  $("#gsBack").onclick = renderGames;
  $("#gsGo").onclick = () => ({ race:playRace, soccer:playSoccer, memory:playMemory })[g]();
}

/* ---------- Gemeinsame Arena ---------- */
function gamePool(){ return getPool(); }
function randomQuestion(pool, diff, avoidIds){
  const pairs = dirPairs();
  let it = pick(pool);
  for (let k = 0; k < 6 && avoidIds && avoidIds.includes(it.id); k++) it = pick(pool);
  const [a, b] = pick(pairs);
  return makeQuestion(it, a, b, "choice", diff, pool);
}
function openArena(cls, title){
  const el = document.createElement("div"); el.className = "arena " + (cls || "");
  el.innerHTML = `<div class="arena-bar"><span class="ttl">${esc(title)}</span><button data-a="quit">Beenden</button></div>
    <div class="pans top"></div><div class="field-wrap"></div><div class="pans bottom"></div>`;
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  const timers = new Set();
  const api = {
    el, top:$(".pans.top", el), bottom:$(".pans.bottom", el), field:$(".field-wrap", el),
    later(fn, ms){ const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; },
    every(fn, ms){ const t = setInterval(fn, ms); timers.add(t); return t; },
    close(){ timers.forEach(t => { clearTimeout(t); clearInterval(t); }); el.remove(); document.body.style.overflow = ""; window.__cleanup = null; }
  };
  window.__cleanup = api.close;
  $("[data-a=quit]", el).onclick = () => { api.close(); renderGames(); };
  return api;
}
/* Antwortfeld eines Spielers */
function makePanel(color, headHTML){
  const p = document.createElement("div"); p.className = "pan"; p.style.borderColor = color;
  p.innerHTML = `<div class="who">${headHTML}</div><div class="pq"></div><div class="po"></div>`;
  return {
    el:p,
    setHead(h){ $(".who", p).innerHTML = h; },
    show(q, onPick){
      p.classList.remove("frozen");
      $(".pq", p).innerHTML = `${wordHTML(q.prompt, q.ask, q.promptPy)}<small>→ ${lname(q.ans)}</small>`;
      $(".po", p).innerHTML = q.options.map((o, i) => `<button data-i="${i}" class="${q.ans === "zh" ? "zh" : ""}">${esc(o.text)}${o.py && S.showPinyin ? `<br><span style="font-weight:400;font-size:.8em">${esc(o.py)}</span>` : ""}</button>`).join("");
      $(".po", p).onclick = e => { const b = e.target.closest("button"); if (!b || p.classList.contains("frozen")) return; onPick(+b.dataset.i, b); };
    },
    reveal(q, picked){ $$(".po button", p).forEach((b, i) => { if (i === q.correct) b.classList.add("right"); else b.classList.add("dim"); }); },
    freeze(on){ p.classList.toggle("frozen", on !== false); },
    clear(msg){ $(".pq", p).innerHTML = msg || ""; $(".po", p).innerHTML = ""; }
  };
}
function layoutPanels(ar, panels){
  const n = panels.length;
  let bottom, top;
  if (n === 1) { bottom = [panels[0]]; top = []; }
  else if (n === 2) { if (GS.facing) { bottom = [panels[0]]; top = [panels[1]]; } else { bottom = panels; top = []; } }
  else if (n === 3) { if (GS.facing) { bottom = [panels[0], panels[2]]; top = [panels[1]]; } else { bottom = panels; top = []; } }
  else { if (GS.facing) { bottom = [panels[0], panels[2]]; top = [panels[1], panels[3]]; } else { bottom = panels; top = []; } }
  ar.bottom.style.gridTemplateColumns = `repeat(${Math.min(bottom.length, window.innerWidth < 640 && bottom.length > 2 ? 2 : bottom.length)},1fr)`;
  ar.top.style.gridTemplateColumns = `repeat(${top.length || 1},1fr)`;
  bottom.forEach(p => ar.bottom.appendChild(p.el)); top.forEach(p => ar.top.appendChild(p.el));
  if (!top.length) ar.top.classList.add("hidden");
}
function overEnd(ar, html, again){
  const o = document.createElement("div"); o.className = "over";
  o.innerHTML = `<div class="card">${html}<div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary big" data-x="again">Nochmal</button><button class="btn ghost" data-x="back">Zurück</button></div></div>`;
  ar.el.appendChild(o);
  $("[data-x=again]", o).onclick = () => { ar.close(); again(); };
  $("[data-x=back]", o).onclick = () => { ar.close(); renderGames(); };
}
function rankHTML(list){ return `<div style="text-align:left;margin-top:10px">${list.map((p, i) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);font-size:19px"><b style="width:28px">${i + 1}.</b><span style="font-size:26px">${p.av}</span><b>${esc(p.name)}</b><span class="spacer"></span><span>${p.val}</span></div>`).join("")}</div>`; }

/* ---------- Wettrennen (ein Gerät) ---------- */
function playRace(){
  const pool = gamePool(), goal = GS.goal, diff = GS.diff;
  const ar = openArena("race", "🏁 Wettrennen · " + goal + " Schritte");
  const racers = GS.players.slice(0, GS.n).map((p, i) => ({ name:p.name, av:p.av, color:PCOLORS[i], pos:0, cpu:false, right:0, wrong:0 }));
  if (GS.n === 1) racers.push({ name:"Robo", av:"🤖", color:"#888", pos:0, cpu:true, right:0, wrong:0 });
  let over = false;
  ar.field.innerHTML = `<div style="width:100%;max-width:1000px">${racers.map((r, i) => `<div style="position:relative;height:${racers.length > 3 ? 40 : 52}px;margin:4px 0;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 calc(100%/${goal}),rgba(255,255,255,.12) calc(100%/${goal}) calc(200%/${goal}));border-left:6px solid ${r.color}">
      <div style="position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,#fff 0 8px,#111 8px 16px)"></div>
      <div data-r="${i}" style="position:absolute;top:50%;left:0;transform:translate(0,-50%) scaleX(-1);font-size:${racers.length > 3 ? 30 : 38}px;transition:left .35s cubic-bezier(.3,1.6,.6,1)">${r.av}</div></div>`).join("")}</div>`;
  const draw = () => racers.forEach((r, i) => { $(`[data-r="${i}"]`, ar.field).style.left = `calc(${(r.pos / goal) * 100}% - ${r.pos ? 44 : 0}px)`; });
  const finish = (w) => {
    over = true;
    const list = racers.slice().sort((a, b) => b.pos - a.pos).map(r => ({ name:r.name, av:r.av, val:`${r.pos}/${goal}` }));
    overEnd(ar, `<div style="font-size:64px">${w.av}</div><h2>${esc(w.name)} gewinnt!</h2>${rankHTML(list)}`, playRace);
  };
  const step = (r) => { if (over) return; r.pos++; draw(); if (r.pos >= goal) finish(r); };
  const panels = racers.filter(r => !r.cpu).map(r => {
    const pan = makePanel(r.color, `<span style="font-size:24px">${r.av}</span>${esc(r.name)}<span class="sc" data-sc></span>`);
    const ask = () => {
      if (over) return;
      const q = randomQuestion(pool, diff);
      pan.show(q, (i) => {
        if (over) return;
        const ok = i === q.correct; pan.reveal(q, i);
        const it = findItem(q.itemId);
        if (ok) { r.right++; step(r); ar.later(ask, 350); }
        else { r.wrong++; pan.freeze(); ar.later(ask, 1400); }
        if (it && racers.filter(x => !x.cpu).length === 1) record(q.ask, q.ans, it.id, ok, true);
      });
    };
    ask();
    return pan;
  });
  layoutPanels(ar, panels);
  racers.filter(r => r.cpu).forEach(r => {
    const iv = { easy:4200, medium:3200, hard:2300 }[diff];
    const tick = () => { if (over) return; if (Math.random() < .85) step(r); ar.later(tick, iv * (.8 + Math.random() * .4)); };
    ar.later(tick, iv + 800);
  });
  draw();
}

/* ---------- Vokabel-Fußball (ein Gerät) ---------- */
function playSoccer(){
  const pool = gamePool(), diff = GS.diff, toWin = GS.goals;
  const ar = openArena("", "⚽ Vokabel-Fußball · bis " + toWin + " Tore");
  const humans = GS.players.slice(0, GS.n);
  const teams = [
    { name:"Blau", color:"#1e6fd9", members:humans.filter((_, i) => i % 2 === 0), goals:0, cpu:false },
    { name:"Orange", color:"#ff6a3d", members:GS.n === 1 ? [{ name:"Robo", av:"🤖" }] : humans.filter((_, i) => i % 2 === 1), goals:0, cpu:GS.n === 1 }
  ];
  let ball = 0, over = false, round = 0, q = null, locked = [false, false], resolved = false;
  const LIM = 4;
  ar.field.innerHTML = `<div style="width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div class="scoreboard"><span style="color:#5ea1ff">${teams[0].members.map(m => m.av).join("")}</span><span id="scA">0</span><span>:</span><span id="scB">0</span><span style="color:#ffa07a">${teams[1].members.map(m => m.av).join("")}</span></div>
    <div id="pitch" style="position:relative;width:100%;height:clamp(90px,18vh,160px);border-radius:14px;background:repeating-linear-gradient(90deg,#2f8f4e 0 calc(100%/9),#2a8246 calc(100%/9) calc(200%/9));border:3px solid #fff;overflow:hidden">
      <div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;opacity:.8"></div>
      <div style="position:absolute;left:50%;top:50%;width:70px;height:70px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8"></div>
      <div style="position:absolute;left:0;top:25%;bottom:25%;width:14px;background:${teams[1].color}"></div>
      <div style="position:absolute;right:0;top:25%;bottom:25%;width:14px;background:${teams[0].color}"></div>
      <div id="ball" style="position:absolute;top:50%;left:50%;font-size:40px;transform:translate(-50%,-50%);transition:left .4s cubic-bezier(.3,1.5,.6,1)">⚽</div>
      <div id="goalMsg" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(40px,8vw,80px);text-shadow:0 4px 0 rgba(0,0,0,.4)">TOR!</div>
    </div><div class="small" style="opacity:.8">🔵 spielt nach rechts → · ← 🟠 spielt nach links</div></div>`;
  const drawBall = () => { $("#ball", ar.field).style.left = `${50 + (ball / LIM) * 44}%`; $("#scA", ar.field).textContent = teams[0].goals; $("#scB", ar.field).textContent = teams[1].goals; };
  const panels = teams.map((t, ti) => t.cpu ? null : makePanel(t.color, ""));
  const headFor = (ti) => { const t = teams[ti]; const m = t.members[round % t.members.length]; return `<span style="font-size:24px">${m.av}</span>${t.members.length > 1 ? "Am Ball: " : ""}${esc(m.name)}<span class="sc">${ti === 0 ? "🔵" : "🟠"}</span>`; };
  let cpuTimer = null;
  const nextQ = () => {
    if (over) return;
    round++; resolved = false; locked = [false, false];
    q = randomQuestion(pool, diff);
    panels.forEach((p, ti) => { if (!p) return; p.setHead(headFor(ti)); p.show(q, (i) => answer(ti, i)); });
    if (teams[1].cpu) { const iv = { easy:6500, medium:4600, hard:3100 }[diff]; cpuTimer = ar.later(() => answer(1, Math.random() < .8 ? q.correct : (q.correct + 1) % q.options.length), iv * (.75 + Math.random() * .5)); }
  };
  const answer = (ti, i) => {
    if (over || resolved || locked[ti]) return;
    const ok = i === q.correct;
    const it = findItem(q.itemId);
    if (ok) {
      resolved = true; clearTimeout(cpuTimer);
      panels.forEach(p => p && p.reveal(q));
      ball += ti === 0 ? 1 : -1; drawBall();
      if (Math.abs(ball) >= LIM) {
        teams[ti].goals++; const gm = $("#goalMsg", ar.field); gm.style.display = "flex"; gm.style.color = teams[ti].color; drawBall();
        ar.later(() => { gm.style.display = "none"; ball = 0; drawBall();
          if (teams[ti].goals >= toWin) return end(ti); nextQ(); }, 1600);
      } else ar.later(nextQ, 800);
    } else {
      locked[ti] = true; if (panels[ti]) panels[ti].freeze();
      if (locked[0] && locked[1]) { resolved = true; panels.forEach(p => p && p.reveal(q)); ar.later(nextQ, 1300); }
    }
    if (it && GS.n <= 1 && ti === 0) record(q.ask, q.ans, it.id, ok, true);
  };
  const end = (ti) => {
    over = true; const t = teams[ti];
    overEnd(ar, `<div style="font-size:64px">🏆</div><h2>Team ${t.name} gewinnt ${teams[ti].goals}:${teams[1 - ti].goals}!</h2><p style="font-size:22px">${t.members.map(m => m.av + " " + esc(m.name)).join(" · ")}</p>`, playSoccer);
  };
  layoutPanels(ar, panels.filter(Boolean));
  drawBall(); nextQ();
}

/* ---------- Memory (ein Gerät) ---------- */
function playMemory(){
  const pool = gamePool();
  const n = Math.min(GS.pairs, pool.length);
  const used = new Set(), items = [];
  for (const it of shuffle(pool)) {
    const a = basicNorm(txt(it, S.from)), b = basicNorm(txt(it, S.to));
    if (used.has("a" + a) || used.has("b" + b)) continue;
    used.add("a" + a); used.add("b" + b); items.push(it); if (items.length >= n) break;
  }
  const cards = shuffle(items.flatMap(it => [{ id:it.id, lang:S.from, text:txt(it, S.from), py: S.from === "zh" ? pinyin(it) : "" }, { id:it.id, lang:S.to, text:txt(it, S.to), py: S.to === "zh" ? pinyin(it) : "" }]));
  const ar = openArena("", "🧠 Vokabel-Memory");
  ar.el.style.background = "#22324a";
  const players = GS.players.slice(0, GS.n).map((p, i) => ({ name:p.name, av:p.av, color:PCOLORS[i], pts:0 }));
  let turn = 0, open = [], busy = false, moves = 0, found = 0; const t0 = Date.now();
  const cols = cards.length <= 12 ? 4 : cards.length <= 16 ? 4 : cards.length <= 20 ? 5 : 6;
  ar.top.classList.add("hidden");
  ar.bottom.style.gridTemplateColumns = `repeat(${players.length},1fr)`;
  const drawPlayers = () => ar.bottom.innerHTML = players.map((p, i) => `<div class="pan" style="border-color:${i === turn ? p.color : "transparent"};${i === turn ? "background:rgba(255,255,255,.18)" : ""}"><div class="who"><span style="font-size:26px">${p.av}</span>${esc(p.name)}<span class="sc">${p.pts}</span></div>${players.length === 1 ? `<div class="small">Züge: ${moves}</div>` : ""}</div>`).join("");
  ar.field.innerHTML = `<div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c, i) => `<button class="mcard" data-i="${i}" aria-label="Karte ${i + 1}"><span class="${c.lang === "zh" ? "zh" : ""}">${esc(c.text)}</span>${c.py && S.showPinyin ? `<br><span style="font-weight:400;font-size:.8em">${esc(c.py)}</span>` : ""}</button>`).join("")}</div>`;
  drawPlayers();
  ar.field.onclick = e => {
    const b = e.target.closest(".mcard"); if (!b || busy || b.classList.contains("open") || b.classList.contains("done")) return;
    b.classList.add("open"); open.push(+b.dataset.i);
    const c = cards[+b.dataset.i]; if (c.lang !== "la") speak(c.text, c.lang);
    if (open.length === 2) {
      moves++;
      const [x, y] = open.map(i => cards[i]);
      const btns = open.map(i => $(`.mcard[data-i="${i}"]`, ar.field));
      if (x.id === y.id && x.lang !== y.lang) {
        btns.forEach(bb => { bb.classList.remove("open"); bb.classList.add("done"); });
        players[turn].pts++; found++; open = []; drawPlayers();
        if (found === items.length) {
          const list = players.slice().sort((a, b) => b.pts - a.pts).map(p => ({ name:p.name, av:p.av, val:p.pts + " Paare" }));
          const secs = Math.round((Date.now() - t0) / 1000);
          ar.later(() => overEnd(ar, `<div style="font-size:64px">🧠</div><h2>${players.length === 1 ? `Geschafft in ${moves} Zügen (${secs} s)!` : esc(list[0].name) + " gewinnt!"}</h2>${players.length > 1 ? rankHTML(list) : ""}`, playMemory), 500);
        }
      } else {
        busy = true;
        ar.later(() => { btns.forEach(bb => bb.classList.remove("open")); open = []; busy = false; turn = (turn + 1) % players.length; drawPlayers(); }, 1300);
      }
    }
  };
}

/* =====================================================================
   Mehrere Geräte: Wettrennen & Fußball online (Host = Anzeige)
   ===================================================================== */
function compactPool(limit){
  return shuffle(getPool()).slice(0, limit || 80).map(it => ({ id:it.id, t:{ [S.from]:txt(it, S.from), [S.to]:txt(it, S.to) }, py:pinyin(it), topic:it.topic, lvl:it.lvl }));
}
async function onlineGameHost(kind){
  const host = document.createElement("div"); host.className = "live-host";
  host.style.background = kind === "soccer" ? "linear-gradient(160deg,#0f3d22,#1d6b3a)" : "linear-gradient(160deg,#20232c,#3b3f4d)";
  host.innerHTML = `<div class="lh-top"><b style="font-size:20px">${kind === "soccer" ? "⚽ Fußball online" : "🏁 Wettrennen online"}</b><span class="spacer"></span><button data-a="quit">Beenden</button></div><div id="ogBody"><p style="text-align:center;margin-top:20vh;font-size:20px">Raum wird eingerichtet …</p></div>`;
  document.body.appendChild(host); document.body.style.overflow = "hidden";
  const G = { kind, phase:"lobby", players:{}, goal:GS.goal, goals:GS.goals, diff:GS.diff, ball:0, score:[0, 0], winner:null,
    pool:compactPool(80), pairs:dirPairs(), kicked:[] };
  let net = null, timer = null;
  const close = () => { clearInterval(timer); if (net) net.close(); host.remove(); document.body.style.overflow = ""; window.__cleanup = null; };
  window.__cleanup = close;
  $("[data-a=quit]", host).onclick = () => { close(); renderGames(); };
  const body = () => $("#ogBody", host);
  const push = () => { if (net) net.setState(G); };
  const teamSize = t => Object.values(G.players).filter(p => p.team === t).length || 1;
  const onMsg = (m) => {
    if (!m || !m.from) return;
    if (m.type === "join") {
      if (G.kicked.includes(m.from)) return;
      if (!G.players[m.from]) {
        const nA = Object.values(G.players).filter(p => p.team === 0).length, nB = Object.values(G.players).filter(p => p.team === 1).length;
        G.players[m.from] = { name:String(m.name || "Gast").slice(0, 16), av:m.av || "🦊", pos:0, team: nA <= nB ? 0 : 1, right:0 };
      }
      push(); draw(); return;
    }
    const p = G.players[m.from]; if (!p || G.phase !== "play") return;
    if (m.type === "hit") {
      p.right++;
      if (kind === "race") { p.pos++; if (p.pos >= G.goal) { G.phase = "end"; G.winner = m.from; } }
      else {
        G.ball += (p.team === 0 ? 1 : -1) / teamSize(p.team) * Math.max(1, Math.min(teamSize(0), teamSize(1)));
        if (Math.abs(G.ball) >= 6) { G.score[p.team]++; G.ball = 0; G.lastGoal = { team:p.team, by:p.name, at:Date.now() }; if (G.score[p.team] >= G.goals) { G.phase = "end"; G.winner = p.team; } }
      }
      push(); draw();
    }
  };
  try { net = await netHost(onMsg); }
