<!DOCTYPE html>
<html lang="de">
<head>
<link rel="icon" href="/assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden – buildspace</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#03040A">
<style>
:root{--ink:#f4f6fb;--soft:#aeb0b8;--line:rgba(255,255,255,.22)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5;display:flex;flex-direction:column;align-items:center;padding:40px 16px 60px;overflow-x:hidden;
background:radial-gradient(900px 380px at 50% 125%,#343744 0,#12131a 48%,transparent 72%),radial-gradient(500px 300px at 90% -5%,rgba(255,255,255,.1),transparent 70%),#03040a}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 8% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 12%,#fff,transparent),radial-gradient(1px 1px at 78% 70%,#fff,transparent),radial-gradient(1px 1px at 95% 40%,#fff,transparent),radial-gradient(1px 1px at 45% 50%,#fff,transparent),radial-gradient(1px 1px at 15% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 90%,#fff,transparent);opacity:.8;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.55}to{opacity:.95}}
main{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}
.ship{width:150px;height:auto;margin:6px auto 0;display:block;animation:drift 6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(-14px,0) rotate(-6deg)}50%{transform:translate(14px,-12px) rotate(4deg)}}
.flame{transform-origin:50% 0;animation:fl .18s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
h1{font-size:clamp(2.6rem,12vw,4.2rem);margin:6px 0 0;letter-spacing:-.02em}
h2{font-size:1.3rem;margin:0 0 8px}
p{color:var(--soft);margin:0 0 18px}
.card{margin-top:22px;text-align:left;padding:20px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input{width:100%;min-height:50px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:inherit;font:inherit}
ul{list-style:none;margin:12px 0 0;padding:0}
li a{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 12px;border-radius:16px;color:var(--ink);text-decoration:none}
li a:hover,li a:focus-visible{background:rgba(255,255,255,.1)}
li .e{font-size:1.4rem}li small{display:block;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.1));color:var(--ink);font-weight:700;text-decoration:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <svg class="ship" viewBox="0 0 120 150" role="img" aria-label="Kleines Raumschiff, das ins Leere fliegt">
    <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8d909c"/></linearGradient></defs>
    <g class="flame"><path d="M48 104 Q60 148 72 104Z" fill="#ffd9a0" opacity=".9"/><path d="M54 104 Q60 130 66 104Z" fill="#fff"/></g>
    <path d="M60 8 C84 30 88 66 84 104 L36 104 C32 66 36 30 60 8Z" fill="url(#b)" stroke="#fff" stroke-opacity=".6"/>
    <path d="M36 80 L14 108 L38 104Z M84 80 L106 108 L82 104Z" fill="#c4c7d2"/>
    <circle cx="60" cy="52" r="12" fill="#10131a" stroke="#fff" stroke-width="3"/><circle cx="56" cy="48" r="3.5" fill="#fff" opacity=".7"/>
  </svg>
  <h1>404</h1>
  <p>Hier ist nur leerer Raum. Diese Seite gibt es nicht (mehr) – vielleicht ist der Link alt oder ein QR-Code veraltet.</p>
  <a class="btn" href="/">Zur Startseite</a>
  <section class="card" aria-labelledby="sh">
    <h2 id="sh">Stattdessen suchen</h2>
    <label class="sr-only" for="q" style="position:absolute;left:-9999px">Beiträge durchsuchen</label>
    <input id="q" type="search" placeholder="Spiel oder Tool suchen …" autocomplete="off" spellcheck="false">
    <ul id="res" aria-live="polite"></ul>
  </section>
</main>
<script src="/posts-data.js"></script>
<script>
(function(){
  var q=document.getElementById('q'),res=document.getElementById('res');
  var list=(typeof posts!=='undefined'?posts:[]);
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function href(u){return /^https?:/.test(u)?u:'/'+u}
  function show(items,note){res.innerHTML=(note?'<li class="soft" style="color:var(--soft);padding:6px 12px">'+note+'</li>':'')+items.map(function(p){return '<li><a href="'+esc(href(p.url))+'"><span class="e" aria-hidden="true">'+(p.emoji||'')+'</span><span>'+esc(p.title)+'<small>'+esc(p.excerpt.length>80?p.excerpt.slice(0,80)+'…':p.excerpt)+'</small></span></a></li>'}).join('')}
  /* Vorschlag aus dem Pfad: Wörter der kaputten Adresse als erste Suche */
  var guess=decodeURIComponent(location.pathname).replace(/\.html?$/,'').split(/[\/\-_ ]+/).filter(function(w){return w.length>2});
  function find(t){t=t.toLowerCase().trim();if(!t)return [];var words=t.split(/\s+/);return list.filter(function(p){var h=(p.title+' '+p.excerpt+' '+(p.titleEn||'')).toLowerCase();return words.every(function(w){return h.indexOf(w)>=0})}).slice(0,6)}
  function init(){
    if(!guess.length)return;
    var any=guess.map(function(w){return find(w)}).reduce(function(a,b){return a.concat(b.filter(function(x){return a.indexOf(x)<0}))},[]).slice(0,5);
    if(any.length)show(any,'Meintest du vielleicht:');
  }
  q.addEventListener('input',function(){var r=find(q.value);if(!q.value.trim()){init();return}show(r,r.length?'':'Nichts gefunden – versuch es mit einem anderen Wort.')});
  init();
})();
</script>
</body>
</html>
