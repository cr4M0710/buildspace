<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blattwerk</title>
<meta name="description" content="Blattwerk – Arbeitsblätter gestalten, mit Lösungen und Niveaus, Export als PDF, Word und Bild.">
<meta name="theme-color" content="#2E6099">
<link rel="stylesheet" href="assets/fonts/nunito.css">
<link rel="stylesheet" href="assets/fonts/fredoka.css">
<link rel="stylesheet" href="assets/fonts/andika.css">
<link rel="stylesheet" href="assets/fonts/lexend.css">
<link rel="stylesheet" href="assets/fonts/atkinson-hyperlegible.css">
<link rel="stylesheet" href="assets/fonts/comic-neue.css">
<link rel="stylesheet" href="assets/fonts/source-serif-4.css">
<link rel="stylesheet" href="assets/fonts/roboto-mono.css">
<link rel="stylesheet" href="assets/fonts/patrick-hand.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='20' height='26' rx='3' fill='%232E6099'/%3E%3Cpath d='M10 11h10M10 16h10M10 21h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M20 20c5-1.5 8 1.5 8 6-4.5 1-8-1-8-6z' fill='%23F2B640'/%3E%3C/svg%3E">
<style>/* Layout: Werktisch-Prinzip – links Bausteine, Mitte Papier auf dem Tisch, rechts Eigenschaften */
:root{
  --desk:#E6ECF3; --desk-dot:#D3DCE7; --panel:#FFFFFF; --panel2:#F3F6FA; --line:#D5DEE9; --line2:#E7EDF4;
  --ink:#1B2F4A; --ink2:#5A6A7F; --ink3:#8A98AB; --accent:#2E6099; --accent-h:#1E4472; --accent-ink:#FFFFFF;
  --accent-soft:#E6EEF8; --warm:#FFF1D6; --warm-ink:#8A4B00; --danger:#B4232A; --ok:#2F7A4F;
  --shadow:0 1px 2px rgba(27,47,74,.08),0 8px 24px rgba(27,47,74,.10);
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --f-brand:'Fredoka','Nunito',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E141B; --desk-dot:#1A2430; --panel:#151E28; --panel2:#1B2632; --line:#2A3746; --line2:#223040;
  --ink:#E3EBF4; --ink2:#9AAABD; --ink3:#6E7F93; --accent:#78A9E0; --accent-h:#A1C4EC; --accent-ink:#0C1520;
  --accent-soft:#1E3149; --warm:#3A2D15; --warm-ink:#F2C27A; --danger:#F08A8F; --ok:#7CCB9C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E141B; --desk-dot:#1A2430; --panel:#151E28; --panel2:#1B2632; --line:#2A3746; --line2:#223040;
  --ink:#E3EBF4; --ink2:#9AAABD; --ink3:#6E7F93; --accent:#78A9E0; --accent-h:#A1C4EC; --accent-ink:#0C1520;
  --accent-soft:#1E3149; --warm:#3A2D15; --warm-ink:#F2C27A; --danger:#F08A8F; --ok:#7CCB9C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.4 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{display:grid;height:100%;grid-template-columns:268px minmax(0,1fr) 312px;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "left main right"}

/* ---------- Kopfleiste ---------- */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:8px;font:600 19px/1 var(--f-brand);color:var(--ink);letter-spacing:.2px;flex:none}
.brand svg{width:28px;height:28px}
#doc-title{flex:1 1 140px;min-width:80px;max-width:340px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:700;color:var(--ink)}
#doc-title:hover{border-color:var(--line)}#doc-title:focus{border-color:var(--accent);background:var(--panel2);outline:none}
.save-state{font-size:12px;color:var(--ink3);white-space:nowrap}
.tb-sp{flex:1}
.tb-group{display:flex;align-items:center;gap:2px;flex:none}
.ib{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink2);gap:6px}
.ib:hover:not(:disabled){background:var(--panel2);color:var(--ink);border-color:var(--line)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.txt{display:inline-flex;font-weight:700;font-size:13px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.sol button.on[data-v="sol"]{color:#C7352E}
.zoomv{min-width:46px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.only-narrow{display:none}

/* ---------- Formatleiste ---------- */
#fmtbar{grid-area:main;align-self:start;z-index:30;margin:8px 12px 0;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--panel)}
#fmtbar .ib{height:30px;min-width:30px;color:var(--ink)}
#fmtbar .ib b,#fmtbar .ib i,#fmtbar .ib u,#fmtbar .ib s{font-size:15px}
#fmtbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#fmtbar select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 6px;font-size:13px}
.sw-row{display:flex;gap:3px;align-items:center}
.sw{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.18);padding:0;cursor:pointer}
.sw.none{background:linear-gradient(135deg,#fff 45%,#d33 45% 55%,#fff 55%)}
.fmt-lbl{font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:0 2px 0 4px}

/* ---------- Seitenleisten ---------- */
aside{background:var(--panel);min-height:0;overflow:hidden;display:flex;flex-direction:column}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:none;padding:8px 4px 9px;font-weight:800;font-size:12px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:12px;min-height:0;-webkit-overflow-scrolling:touch}
.grp-t{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin:14px 2px 7px}
.grp-t:first-child{margin-top:2px}
.pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pal-it{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 7px;border:1px solid var(--line2);background:var(--panel2);border-radius:9px;font-size:11.5px;font-weight:700;color:var(--ink);text-align:center;line-height:1.15;touch-action:none;min-width:0;overflow-wrap:anywhere;hyphens:auto;user-select:none;-webkit-user-select:none}
.pal-it:hover{border-color:var(--accent);background:var(--accent-soft)}
.pal-it svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--ink2);line-height:1.45}
.hint code{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:11.5px}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;padding:8px 12px;background:var(--accent);color:var(--accent-ink);border-radius:8px;font-weight:800;font-size:12px;box-shadow:var(--shadow);transform:translate(-50%,-120%)}

/* Seitenübersicht */
.thumbs{display:flex;flex-direction:column;gap:12px}
.thumb{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:6px;border-radius:10px;border:1px solid transparent}
.thumb.on{border-color:var(--accent);background:var(--accent-soft)}
.thumb-img{position:relative;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);border-radius:2px;cursor:pointer}
.thumb-img>.page{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;box-shadow:none}
.thumb-act{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb-act .lbl{font-weight:800;font-size:13px}
.thumb-act .row{display:flex;gap:2px;flex-wrap:wrap}
.thumb-act .ib{min-width:28px;height:28px;padding:0 4px}
.thumb-act .ib svg{width:15px;height:15px}

/* Vorlagen + Ablage */
.cards{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--panel)}
.card h4{margin:0 0 3px;font:600 15px/1.2 var(--f-brand);color:var(--ink)}
.card p{margin:0 0 8px;font-size:12px;color:var(--ink2)}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.card .meta{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:6px}

/* ---------- Arbeitsfläche ---------- */
main#canvas{grid-area:main;overflow:auto;position:relative;min-width:0;background-color:var(--desk);background-image:radial-gradient(var(--desk-dot) 1px,transparent 1.2px);background-size:22px 22px;-webkit-overflow-scrolling:touch}
#stage{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 30px 120px;min-width:max-content}
.page-wrap{display:flex;flex-direction:column;gap:6px}
.page-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink2)}
.page-head .pnum{margin-right:auto;letter-spacing:.04em}
.page-head .ib{min-width:26px;height:26px;padding:0 3px}
.page-head .ib svg{width:14px;height:14px}
.page-hold{position:relative;box-shadow:var(--shadow);border-radius:1px}
.page-wrap.cur .page-hold{outline:2px solid var(--accent);outline-offset:3px}
.page-hold>.page{position:absolute;left:0;top:0;transform-origin:0 0}
.sel-layer{position:absolute;inset:0;pointer-events:none;z-index:5000}
.margin-guide{position:absolute;border:1px dashed rgba(46,96,153,.28);pointer-events:none;z-index:1}
.grid-ov{position:absolute;inset:0;pointer-events:none;z-index:2}
.sel-box{position:absolute;border:1.5px solid #2E7BE6;pointer-events:none;transform-origin:center}
.sel-box.multi{border-style:dashed}
.sel-box.lock{border-color:#C7352E;border-style:dashed}
.sel-box.edit{border-color:#E39A1B}
.h{position:absolute;background:#fff;border:1.5px solid #2E7BE6;border-radius:3px;pointer-events:auto;touch-action:none}
.h.rot{border-radius:50%;background:#2E7BE6}
.h.rot::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:var(--stem);background:#2E7BE6;transform:translateX(-50%)}
.guide{position:absolute;background:#E0457B;pointer-events:none}
.marquee{position:absolute;border:1px solid #2E7BE6;background:rgba(46,123,230,.10);pointer-events:none}
.size-tip{position:absolute;background:#1B2F4A;color:#fff;font:700 11px/1 var(--f-ui);padding:4px 6px;border-radius:5px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.add-page{align-self:center}

/* ---------- Eigenschaften ---------- */
#props{flex:1;overflow:auto;padding:0 0 30px;-webkit-overflow-scrolling:touch}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.ph h3{margin:0;font:600 16px/1.2 var(--f-brand);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph svg.ti{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sec{border-bottom:1px solid var(--line2)}
.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:11.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(225deg)}
.sec-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.l{font-size:12px;font-weight:700;color:var(--ink2)}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:7px 9px;font-size:13px;min-width:0}
.f textarea{min-height:84px;resize:vertical;line-height:1.45;font-family:var(--f-ui)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.f .sub{font-size:11.5px;color:var(--ink3);line-height:1.4}
.f .warn{font-size:12px;color:var(--danger);font-weight:700}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.inl{display:flex;gap:6px;align-items:center}
.inl>input{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.rng{display:flex;align-items:center;gap:8px}
.rng input[type=range]{flex:1;accent-color:var(--accent)}
.rng output{min-width:40px;text-align:right;font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.colf{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.colf input[type=color]{width:28px;height:24px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.colf .sw.on{outline:2px solid var(--accent);outline-offset:1px}
.segf{display:flex;flex-wrap:wrap;gap:4px}
.segf button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--ink2)}
.segf button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.icgrid button{display:grid;place-items:center;aspect-ratio:1;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:4px}
.icgrid button.on{background:var(--accent-soft);border-color:var(--accent)}
.icgrid svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.align-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.align-grid .ib{border:1px solid var(--line2);background:var(--panel2);width:100%}
.lvl-pick{display:flex;gap:6px}
.lvl-pick label{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px;font-weight:800;cursor:pointer;background:var(--panel2)}
.lvl-pick input{accent-color:var(--accent)}
.empty-props{padding:14px;color:var(--ink2);font-size:13px}

/* ---------- Kontextmenü, Toast, Dialoge ---------- */
#ctxmenu{position:fixed;z-index:3000;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
#ctxmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;text-align:left}
#ctxmenu button:hover{background:var(--accent-soft)}
#ctxmenu button kbd{font:600 11px var(--f-ui);color:var(--ink3)}
#ctxmenu hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#1B2F4A;color:#fff;padding:9px 14px;border-radius:9px;font-weight:700;font-size:13px;box-shadow:var(--shadow);animation:tin .2s ease}
.toast.err{background:#B4232A}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;z-index:3500;background:rgba(14,24,36,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font:600 20px/1.2 var(--f-brand);flex:1}
.modal-b{padding:16px 18px;overflow:auto;display:grid;gap:16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.modal-f .prog{margin-right:auto;font-size:12.5px;font-weight:700;color:var(--ink2)}
.fmt-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fmt-card{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 11px}
.fmt-card b{font-size:14px}
.fmt-card span{font-size:11.5px;color:var(--ink2);line-height:1.35}
.fmt-card.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px}
.opt-grid .f.wide{grid-column:1/-1}

/* ---------- Schmale Bildschirme (iPad hochkant, Handy) ---------- */
@media (max-width:1100px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .only-narrow{display:inline-grid}
  #left,#right{position:fixed;top:0;bottom:0;z-index:2500;width:min(320px,88vw);box-shadow:var(--shadow);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  #left{left:0;transform:translateX(-105%)}
  #right{right:0;transform:translateX(105%)}
  #app.show-left #left,#app.show-right #right{transform:none}
  .scrim{position:fixed;inset:0;z-index:2400;background:rgba(10,20,30,.3)}
  .hide-narrow{display:none}
  .brand span{display:none}
  #doc-title{min-width:60px}
}
@media (max-width:900px){#b-export span{display:none}#b-export{padding:7px 10px}}
@media (max-width:860px){.zoom-grp{display:none}}
@media (max-width:640px){
  .save-state{display:none}
  #top{gap:6px;flex-wrap:wrap}
  #doc-title{order:5;flex-basis:100%;max-width:none}
  .fmt-cards{grid-template-columns:1fr 1fr}
  .opt-grid{grid-template-columns:1fr}
  #stage{padding:16px 16px 120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ======================================================================
   ARBEITSBLATT (Papier) – bleibt in beiden Themes Papier
   ====================================================================== */
.page{position:relative;background:var(--ws-paper);color:var(--ws-body);font-family:var(--ws-fbody),'Nunito',system-ui,sans-serif;font-size:var(--ws-base);line-height:1.45;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-scheme:light}
.page *{box-sizing:border-box}
.pg-bg{position:absolute;pointer-events:none}
.el{position:absolute;transform-origin:center center;touch-action:none}
.el-in{width:100%;height:100%;position:relative}
.el.ghost{opacity:.18}
.el.locked{}
.el-err{color:#B4232A;font-size:12px;padding:6px;border:1px dashed #B4232A}
.lvl-b{position:absolute;right:100%;top:0;margin-right:5px;font:800 10.5px/1 var(--ws-fbody),sans-serif;color:var(--ws-accent);border:1.5px solid var(--ws-accent);border-radius:5px;padding:3px 4px;white-space:nowrap;background:var(--ws-paper)}
.lvl-b.stars{border:0;padding:2px 0;font-size:11px;letter-spacing:-1px;background:none}
.rt{outline:none;min-height:1em;overflow-wrap:break-word}
.rt p,.rt div{margin:0}
.rt ul,.rt ol{margin:.15em 0;padding-left:1.4em}
.rt[contenteditable="true"]{cursor:text;-webkit-user-select:text;user-select:text}
.rt[contenteditable="true"]:empty::before,.page.ed .t-text .rt:empty::before,.page.ed .t-heading .rt:empty::before{content:"Text eingeben …";color:#9aa6b3}
.sol{color:var(--ws-sol);font-family:var(--ws-fsol),'Patrick Hand',cursive;font-size:1.12em;line-height:1}
.ws-h{font-family:var(--ws-fhead),'Fredoka',sans-serif;color:var(--ws-head);font-weight:600;line-height:1.15}

/* Überschrift */
.hd{font-family:var(--ws-fhead),'Fredoka',sans-serif;color:var(--ws-head);font-weight:600;line-height:1.15}
.hd-line{border-bottom:2.5px solid var(--ws-accent);padding-bottom:.18em}
.hd-band{background:var(--ws-surface);padding:.3em .55em;border-radius:6px}
.hd-bar{border-left:6px solid var(--ws-accent);padding-left:.45em}
.hd-under .hu{background:linear-gradient(transparent 62%,var(--ws-surface2) 62%)}

/* Kopfzeile */
.kz{display:flex;flex-direction:column;gap:9px}
.kz-top{display:flex;align-items:center;gap:12px}
.kz-sub{flex:none;background:var(--ws-accent);color:#fff;font:600 13px/1 var(--ws-fhead),sans-serif;padding:7px 11px;border-radius:7px;letter-spacing:.02em}
.kz-title{flex:1;min-width:0;font:600 25px/1.1 var(--ws-fhead),sans-serif;color:var(--ws-head)}
.kz-no{flex:none;font:600 13px/1 var(--ws-fhead),sans-serif;color:var(--ws-accent);border:1.5px solid var(--ws-accent);border-radius:7px;padding:6px 9px}
.kz-fields{display:flex;gap:14px}
.kz-f{display:flex;align-items:flex-end;gap:6px;min-width:0}
.kz-f span{font-size:12.5px;font-weight:700;color:var(--ws-dark);white-space:nowrap}
.kz-f i{flex:1;border-bottom:1.3px solid #8592a3;height:1.1em;min-width:20px}
.kz.band{background:var(--ws-surface);border-radius:10px;padding:12px 14px}
.kz.box{border:1.5px solid var(--ws-accent);border-radius:10px;padding:12px 14px}
.kz.clean .kz-top{border-bottom:2.5px solid var(--ws-accent);padding-bottom:8px}
.kz-logo{height:38px;width:auto;flex:none}

/* Aufgabe */
.tk{display:flex;gap:10px;align-items:flex-start}
.tk-n{flex:none;display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;background:var(--ws-accent);color:#fff;font:600 1em/1 var(--ws-fhead),sans-serif;margin-top:-.1em}
.tk-n.sq{border-radius:6px}
.tk-n.ol{background:none;border:2px solid var(--ws-accent);color:var(--ws-accent)}
.tk-lbl{font:600 1em/1.45 var(--ws-fhead),sans-serif;color:var(--ws-accent);margin-right:.35em;white-space:nowrap}
.tk-b{flex:1;min-width:0}
.tk-b .rt{display:block}
.tk-ic{flex:none;display:flex;gap:4px;margin-top:-.05em}
.tk-ic svg{width:1.45em;height:1.45em;stroke:var(--ws-accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tk-pt{flex:none;display:inline-flex;align-items:baseline;gap:.3em;font-size:.85em;font-weight:700;color:var(--ws-dark);border:1.3px solid #a8b4c2;border-radius:6px;padding:.1em .45em;white-space:nowrap}
.tk-pt.box{border:1.3px solid #6b7886;padding:.25em .5em .2em}
.tk-pt.box i{display:inline-block;width:2.2em;border-bottom:1.3px solid #6b7886;height:1em}
.tk-pt.plain{border:0;padding:0;font-weight:600;color:#5a6676}
.tk-zp{font-size:.82em;text-transform:uppercase;letter-spacing:.05em;color:var(--ws-text2)}
/* Arbeitskopf */
.ex{display:flex;flex-direction:column;border:1.5px solid #333;font-size:15px}
.ex-row{display:flex;align-items:flex-end;gap:28px;padding:14px 14px 10px;border-top:1.3px solid #333;min-width:0}
.ex-row:first-child{border-top:0}
.ex-title{font:600 18px/1.2 var(--ws-fhead),sans-serif;color:var(--ws-head);padding:10px 14px}
.ex-f{display:flex;align-items:flex-end;gap:8px;min-width:0}
.ex-f>span,.ex-lbl{font-weight:700;white-space:nowrap;color:#1a1a1a}
.ex-f>i{flex:1;border-bottom:1.3px solid #333;height:1.1em;min-width:16px}
.ex-tot{font-weight:700;white-space:nowrap;padding:0 .2em}
.ex-tab{align-items:center;padding:10px 14px}
.ex-lbl{min-width:9.5em}
.ex-t{border-collapse:collapse;table-layout:fixed}
.ex-t th,.ex-t td{border:1.3px solid #333;width:3.1em;height:2.15em;text-align:center;padding:0 .2em;font-weight:700}
.ex-t th{background:#DFDCC9}
.ex-key{table-layout:auto}.ex-key th,.ex-key td{width:auto;min-width:3.1em;white-space:nowrap;padding:0 .55em}.ex-key td{font-weight:600;font-size:.9em;font-variant-numeric:tabular-nums}
.ex-rem{flex-direction:column;align-items:stretch;gap:12px}.ex-rem i{border-bottom:1.3px solid #333;height:1.2em}
.ex-theme{border-color:var(--ws-accent);border-radius:10px;overflow:hidden}
.ex-theme .ex-row{border-top-color:color-mix(in srgb,var(--ws-accent) 45%,#fff)}
.ex-theme .ex-t th{background:var(--ws-surface);color:var(--ws-head);border-color:var(--ws-accent)}
.ex-theme .ex-t td{border-color:var(--ws-accent)}
.ex-theme .ex-title{background:var(--ws-surface)}
.ex-theme .ex-f>span,.ex-theme .ex-lbl{color:var(--ws-dark)}
.ex-light{border:0}.ex-light .ex-row{border-top:0;padding:10px 0 6px}.ex-light .ex-t th{background:#f1f3f6}
/* Sticker */
.st{position:relative;width:100%;height:100%}
.st-c{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;text-align:center;min-width:0}
.st-t{font:600 1em/1.05 var(--ws-fhead),'Fredoka',sans-serif;max-width:100%}
.st-s{font-weight:700;line-height:1.15;opacity:.9;max-width:100%}

/* Merkkasten */
.ib-box{border-radius:10px;padding:10px 13px;display:flex;flex-direction:column;gap:5px}
.ib-box.accent{background:var(--ws-surface);border:1.5px solid var(--ws-accent)}
.ib-box.warm{background:var(--ws-surface2);border:1.5px solid var(--ws-text2)}
.ib-box.plain{border:1.5px solid #9aa6b3}
.ib-box.dashed{border:2px dashed var(--ws-accent)}
.ib-box.fill{background:var(--ws-accent);color:#fff}
.ib-t{display:flex;align-items:center;gap:7px;font:600 1.08em/1.2 var(--ws-fhead),sans-serif;color:var(--ws-dark)}
.ib-box.warm .ib-t{color:var(--ws-text2)}
.ib-box.fill .ib-t{color:#fff}
.ib-t svg{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Tabelle */
.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb td,.tb th{border:1.2px solid var(--ws-line);padding:.35em .5em;vertical-align:middle;overflow-wrap:break-word;text-align:inherit;font-weight:400}
.tb th{background:var(--ws-surface);font-family:var(--ws-fhead),sans-serif;font-weight:600;color:var(--ws-head)}
.tb.zebra tr:nth-child(even) td{background:#f4f6f9}
.tb .rt{min-height:1.2em}

/* Lücken */
.blank{display:inline-block;border-bottom:1.4px solid #4b5866;min-width:3em;height:1.25em;vertical-align:baseline;text-align:center;line-height:1.25em;margin:0 .12em}
.blank.box{border:1.3px solid #4b5866;border-radius:4px;height:1.45em;line-height:1.45em;vertical-align:-.3em}
.gap-t{white-space:normal}
.bank{margin-top:.7em;border:1.5px dashed var(--ws-accent);border-radius:8px;padding:.45em .7em;display:flex;flex-wrap:wrap;gap:.35em 1.1em;background:var(--ws-paper)}
.bank span{font-weight:700;color:var(--ws-dark)}

/* Multiple Choice */
.mc-q{font-weight:700;margin-bottom:.45em}
.mc-o{display:grid;gap:.4em 1.2em}
.mc-i{display:flex;align-items:flex-start;gap:.5em}
.mc-m{flex:none;width:1.1em;height:1.1em;border:1.5px solid #4b5866;border-radius:3px;margin-top:.17em;position:relative;display:grid;place-items:center;font-size:.8em;font-weight:800}
.mc-m.circle{border-radius:50%}
.mc-m.letter{width:auto;height:auto;border:0;font-size:1em;margin-top:0;color:var(--ws-accent)}
.mc-m svg{position:absolute;width:150%;height:150%;left:-15%;top:-35%;stroke:var(--ws-sol);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* Zuordnen */
.mt{display:grid;position:relative}
.mt-row{display:flex;align-items:center}
.mt-c{border:1.3px solid #a8b4c2;border-radius:7px;padding:.25em .55em;flex:1;min-width:0;display:flex;align-items:center;gap:.4em;background:var(--ws-paper);min-height:100%}
.mt-dot{width:.6em;height:.6em;border-radius:50%;background:var(--ws-dark);flex:none}
.mt-box{flex:none;width:1.6em;height:1.6em;border:1.3px solid #4b5866;border-radius:5px;display:grid;place-items:center}
.mt-n{font-weight:800;color:var(--ws-accent)}

/* Suchsel */
.ws-grid{border-collapse:collapse;font-family:var(--ws-fbody),sans-serif;font-weight:700;color:var(--ws-head);margin:0 auto}
.ws-grid td{border:1px solid #c9d2dd;text-align:center;padding:0}
.ws-grid td.hit{background:color-mix(in srgb,var(--ws-sol) 22%,transparent);color:var(--ws-sol)}
.ws-list{display:flex;flex-wrap:wrap;gap:.25em 1.1em;margin-top:.6em;justify-content:center;font-weight:700;color:var(--ws-dark)}

/* Selbsteinschätzung */
.sc{width:100%;border-collapse:collapse}
.sc th,.sc td{border:1.2px solid var(--ws-line);padding:.35em .5em}
.sc th{background:var(--ws-surface);font-family:var(--ws-fhead),sans-serif;font-weight:600;color:var(--ws-head);text-align:left}
.sc td.c,.sc th.c{text-align:center;width:3.2em}
.sc th.c svg{width:1.6em;height:1.6em;vertical-align:middle}
.sc .ring{display:inline-block;width:1.05em;height:1.05em;border:1.5px solid #6b7886;border-radius:50%;vertical-align:middle}

/* Rechenpäckchen */
.ar{display:grid;gap:.55em 1.2em}
.ar-i{display:flex;align-items:baseline;gap:.25em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ar-i .blank{min-width:2.8em}
.ar-col{display:flex;flex-wrap:wrap;gap:14px 18px}
.ar-cg{display:grid;font-variant-numeric:tabular-nums;font-weight:600;background-image:linear-gradient(#cdd6e1 1px,transparent 1px),linear-gradient(90deg,#cdd6e1 1px,transparent 1px);border-right:1px solid #cdd6e1;border-bottom:1px solid #cdd6e1}
.ar-cg>span{display:grid;place-items:center}
.ar-cg>span.ln{border-top:2px solid #333}

/* Lösungsstempel */
.sol-stamp{position:absolute;top:18px;right:22px;z-index:6000;font:800 13px/1 var(--ws-fbody),sans-serif;color:var(--ws-sol);border:2px solid var(--ws-sol);border-radius:6px;padding:5px 9px;letter-spacing:.12em;transform:rotate(3deg);background:var(--ws-paper)}
.pg-foot{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:#7a8696;pointer-events:none}
.pg-foot>span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-foot>span:nth-child(2){text-align:center}.pg-foot>span:nth-child(3){text-align:right}
.ph-img{width:100%;height:100%;display:grid;place-items:center;border:2px dashed #9aa6b3;border-radius:8px;color:#6b7886;font-size:12px;text-align:center;background:#f5f7fa;padding:6px}
.shape-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%}
.shape-t .rt{width:100%}
.svgfill{display:block;width:100%;height:100%;overflow:visible}

/* ---------- Druck ---------- */
#export-root{position:fixed;left:-20000px;top:0;pointer-events:none}
#print-root{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#ctxmenu,#toast,.modal-bg,#export-root{display:none!important}
  #print-root{display:block}
  #print-root .page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  #print-root .page:last-child{break-after:auto;page-break-after:auto}
}

/* buildspace: Platz für den Zurück-Link oben links */
body:has(#protect-back-link) #top{padding-left:148px}
@media (max-width:480px){body:has(#protect-back-link) #top{padding-left:66px}}

/* Checkliste zur Arbeit */
.lz-wrap{display:flex;flex-direction:column;gap:6px}
.lz-head{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ws-accent);padding-bottom:5px}
.lz-title{flex:1;min-width:0;font:600 1.4em/1.15 var(--ws-fhead),sans-serif;color:var(--ws-head)}
.lz-meta{font-weight:800;color:var(--ws-accent);white-space:nowrap}
.lz-date{display:flex;align-items:flex-end;gap:8px;font-weight:700;color:var(--ws-dark);margin:2px 0 4px}
.lz-date i{flex:1;border-bottom:1.3px solid #8592a3;height:1.1em}
.lz-date span+i{margin-right:18px}
.lz{width:100%;border-collapse:collapse;table-layout:fixed}
.lz th{background:var(--ws-accent);color:#fff;font-weight:800;font-size:.9em;line-height:1.2;padding:.5em .45em;border:1px solid #999;text-align:center;hyphens:manual}
.lz td{border:1px solid #999;padding:.42em .55em;vertical-align:top;overflow-wrap:break-word}
.lz tr.alt td{background:#F7F9FC}
.lz tr.lz-sec td{background:var(--ws-surface);color:var(--ws-head);font:600 1.02em/1.2 var(--ws-fhead),sans-serif;padding:.38em .6em}
.lz tr.lz-sec b{color:var(--ws-accent);margin-right:.2em}
.lz-no{text-align:center;font-weight:800;font-size:1.05em;color:var(--ws-dark)}
.lz-th{font-weight:800;color:var(--ws-accent);margin-bottom:.2em}
.lz-can{font-style:italic;font-size:.93em}
.lz-ex{font-size:.95em}
.lz-sol{margin-top:.3em;font-size:1.05em;line-height:1.15}
.lz-book{font-size:.9em;color:#5a6676}
td.lz-book>span{display:inline-block;width:2em}td.lz-book>i{display:inline-block;width:calc(100% - 2.3em);border-bottom:1.2px solid #9aa6b3;height:1em;margin-bottom:.8em}
.lz-vid{text-align:center}
.lz-vt{font-size:.72em;line-height:1.2;color:#1f5fa8;text-decoration:underline;margin-bottom:.25em;overflow-wrap:normal;word-break:normal}
.lz-vid svg{display:inline-block}
.lz-self{display:flex;flex-direction:column;gap:.32em;align-items:flex-start;padding-left:.2em}
.lz-self>span{display:flex;align-items:center;gap:.4em;font-size:.86em}
.lz-self svg{width:1.45em;height:1.45em}
.lz-box{display:inline-block;width:.95em;height:.95em;border:1.4px solid #555;border-radius:2px;flex:none}
.lz-amp{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.lz-self em{font-style:normal;font-weight:600}
.lz-hint{font-size:.8em;color:#6b7886;font-style:italic}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.05;margin:0 .08em}
.fr>span:first-child{border-bottom:1.1px solid currentColor;padding:0 .12em}
/* Zeilen-Editor im Eigenschaftenfenster */
.clr{display:flex;flex-direction:column;gap:8px}
.clr-card{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.clr-card.sec{background:var(--accent-soft);border-color:var(--accent)}
.clr-top{display:flex;align-items:center;gap:4px}
.clr-top b{flex:1;font-size:12px;color:var(--ink2)}
.clr-top .ib{min-width:26px;height:26px;padding:0 3px}.clr-top .ib svg{width:14px;height:14px}
.clr-card input,.clr-card textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:6px 8px;font-size:12.5px;font-family:var(--f-ui);color:var(--ink)}
.clr-card textarea{min-height:44px;resize:vertical}
.clr-card label{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:-3px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib only-narrow" id="b-left" title="Bausteine, Seiten, Vorlagen" aria-label="Bausteine öffnen"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="20" height="26" rx="3" fill="var(--accent)"/><path d="M10 11h10M10 16h10M10 21h6" stroke="var(--panel)" stroke-width="2" stroke-linecap="round"/><path d="M20 20c5-1.5 8 1.5 8 6-4.5 1-8-1-8-6z" fill="#F2B640"/></svg><span>Blattwerk</span></div>
    <input id="doc-title" type="text" aria-label="Titel des Arbeitsblatts" spellcheck="false">
    <span class="save-state hide-narrow" id="save-state">Automatisch gesichert</span>
    <span class="tb-sp"></span>
    <div class="tb-group">
      <button class="ib" id="b-undo" title="Rückgängig (⌘/Strg+Z)" aria-label="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="b-redo" title="Wiederholen (⌘/Strg+Umschalt+Z)" aria-label="Wiederholen"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="seg" id="seg-mode" role="group" aria-label="Ansicht"><button data-v="work" class="on">Arbeitsblatt</button><button data-v="sol">Lösung</button></div>
    <div class="seg" id="seg-level" role="group" aria-label="Niveau"><button data-v="all" class="on"><span class="lbl-all">Alle</span><span class="only-narrow" style="display:none">∗</span></button><button data-v="A">A</button><button data-v="B">B</button><button data-v="C">C</button></div>
    <div class="tb-group zoom-grp">
      <button class="ib" id="b-zout" title="Verkleinern" aria-label="Verkleinern"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="zoomv" id="zoomv" title="An Fensterbreite anpassen">100 %</button>
      <button class="ib" id="b-zin" title="Vergrößern" aria-label="Vergrößern"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="ib only-narrow" id="b-right" title="Eigenschaften" aria-label="Eigenschaften öffnen"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    <button class="btn primary" id="b-export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M4 20h16"/></svg><span>Exportieren</span></button>
  </header>
  <div id="fmtbar" hidden></div>
  <aside id="left" aria-label="Bausteine">
    <div class="tabs" role="tablist"><button data-tab="add" class="on">Bausteine</button><button data-tab="pages">Seiten</button><button data-tab="tpl">Vorlagen</button><button data-tab="lib">Ablage</button></div>
    <div class="pane"></div>
  </aside>
  <main id="canvas"><div id="stage"></div></main>
  <aside id="right" aria-label="Eigenschaften"><div id="props"></div></aside>
</div>
<div id="ctxmenu" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="export-root" aria-hidden="true"></div>

/* ---------- HTML-Bereinigung (für Rich Text & importierte Dateien) ---------- */
const SAFE_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'SPAN', 'BR', 'DIV', 'P', 'UL', 'OL', 'LI', 'SUB', 'SUP', 'FONT', 'MARK']);
const SAFE_CSS = ['color', 'background-color', 'font-size', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line', 'text-align'];
const _sanCache = new Map();
function sanitize(html) {
  html = String(html ?? '');
  if (_sanCache.has(html)) return _sanCache.get(html);
  const t = document.createElement('template'); t.innerHTML = html;
  const walk = node => {
    for (const c of [...node.childNodes]) {
      if (c.nodeType === 3) continue;
      if (c.nodeType !== 1) { c.remove(); continue; }
      walk(c);
      if (!SAFE_TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); continue; }
      const style = c.getAttribute('style') || '';
      const col = c.tagName === 'FONT' ? c.getAttribute('color') : null;
      for (const a of [...c.attributes]) c.removeAttribute(a.name);
      const keep = style.split(';').map(x => x.trim()).filter(x => {
        const k = x.split(':')[0].trim().toLowerCase();
        return SAFE_CSS.includes(k) && !/url\(|expression|javascript/i.test(x);
      });
      if (col && /^#?[\w]+$/.test(col)) keep.push('color:' + col);
      if (keep.length) c.setAttribute('style', keep.join(';'));
      if (c.tagName === 'FONT') { const s = document.createElement('span'); if (keep.length) s.setAttribute('style', keep.join(';')); s.append(...c.childNodes); c.replaceWith(s); }
    }
  };
  walk(t.content);
  const out = t.innerHTML;
  if (_sanCache.size > 800) _sanCache.clear();
  _sanCache.set(html, out);
  return out;
}

function newDoc(title = 'Neues Arbeitsblatt') {
  return {
    v: 1, id: uid(), title, orient: 'p', margin: 15, grid: 5, snap: true, guides: true, showGrid: false,
    theme: { ...THEMES.schulblau }, themeName: 'schulblau', sol: '#D3302F',
    fontHead: 'Fredoka', fontBody: 'Nunito', fontSol: 'Patrick Hand', base: 15,
    footer: { show: true, left: '{titel}', center: '', right: 'Seite {n} / {N}' },
    levelStyle: 'letters', numbering: 'continuous', stamp: true, lineColor: '#9AA7B5',
    pages: [newPage()], updated: Date.now(),
  };
}
const newPage = () => ({ id: uid(), bg: 'none', els: [] });
function pageSize(doc) { return doc.orient === 'l' ? { w: A4.h, h: A4.w } : { w: A4.w, h: A4.h }; }

/* Fehlende Felder ergänzen (ältere/importierte Dateien) */
function normalizeDoc(d) {
  const base = newDoc();
  d = Object.assign(base, d);
  d.theme = Object.assign({ ...THEMES.schulblau }, d.theme || {});
  d.footer = Object.assign(newDoc().footer, d.footer || {});
  if (!Array.isArray(d.pages) || !d.pages.length) d.pages = [newPage()];
  d.pages.forEach(p => { p.id = p.id || uid(); p.bg = p.bg || 'none'; p.els = (p.els || []).filter(e => TYPES[e.type]).map(e => normalizeEl(e)); });
  return d;
}
function normalizeEl(e) {
  const def = TYPES[e.type].def();
  e.id = e.id || uid();
  e.p = Object.assign({}, def.p || {}, e.p || {});
  e.s = Object.assign({}, def.s || {}, e.s || {});
  for (const k of ['x', 'y', 'w', 'h', 'rot']) e[k] = +e[k] || (k === 'w' ? def.w : k === 'h' ? def.h : 0);
  e.lvl = Array.isArray(e.lvl) ? e.lvl : [];
  e.vis = e.vis || 'all';
  if (e.autoH === undefined) e.autoH = !!def.autoH;
  return e;
}

const findEl = id => { for (let pi = 0; pi < S.doc.pages.length; pi++) { const el = S.doc.pages[pi].els.find(e => e.id === id); if (el) return { el, pi, page: S.doc.pages[pi] }; } return null; };

/* ---------- Verlauf (Rückgängig/Wiederholen) ---------- */
function snapshot() { const u = S.doc.updated; S.doc.updated = 0; const s = JSON.stringify(S.doc); S.doc.updated = u; return s; }
function histReset() { S.hist = [snapshot()]; S.hpos = 0; updUndo(); }
function commit() {
  const snap = snapshot();
  if (S.hist[S.hpos] === snap) return;
  S.hist = S.hist.slice(0, S.hpos + 1); S.hist.push(snap);
  if (S.hist.length > 120) S.hist.shift();
  S.hpos = S.hist.length - 1;
  S.doc.updated = Date.now();
  autosave(); updUndo();
}
const commitSoon = debounce(commit, 450);
function undo() { if (S.editing) stopEdit(); commit(); if (S.hpos <= 0) return; S.hpos--; restore(); }
function redo() { if (S.hpos >= S.hist.length - 1) return; S.hpos++; restore(); }
function restore() {
  S.doc = JSON.parse(S.hist[S.hpos]); S.doc.updated = Date.now();
  S.sel = S.sel.filter(id => findEl(id));
  S.page = clamp(S.page, 0, S.doc.pages.length - 1);
  renderAll(); autosave(); updUndo();
}
function updUndo() { const u = $('#b-undo'), r = $('#b-redo'); if (u) u.disabled = S.hpos <= 0; if (r) r.disabled = S.hpos >= S.hist.length - 1; }

/* ---------- Automatisch sichern ---------- */
let _saveT;
function autosave() {
  clearTimeout(_saveT);
  const st = $('#save-state'); if (st) st.textContent = 'Speichert …';
  _saveT = setTimeout(() => {
    const ok = lsSet(LS.cur, S.doc);
    if (st) st.textContent = ok ? 'Automatisch gesichert' : 'Nicht gesichert – Speicher voll';
    if (!ok) toast('Browser-Speicher ist voll. Sichere das Blatt als Projektdatei (Exportieren).', true);
  }, 350);
}

/* ---------- Toast ---------- */
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toast').append(t); setTimeout(() => t.remove(), err ? 5200 : 2600);
}

function fracSVG(x, y, num, den, fs, fill, anchor = 'middle') {

}

function fracParts(v, den) { const n = Math.round(v * den); const g = gcd(n, den); return [n / g, den / g]; }

/* ---------- Generatoren (deterministisch über Startwert) ---------- */
const _genCache = new Map();
function cached(key, fn) { if (_genCache.has(key)) return _genCache.get(key); const v = fn(); if (_genCache.size > 200) _genCache.clear(); _genCache.set(key, v); return v; }

function wsGen(p) {
  return cached('ws' + JSON.stringify([p.words, p.rows, p.cols, p.diff, p.seed, p.uml, p.upper]), () => {
    const r = rng(p.seed);
    const norm = w => {
      if (p.uml === 'replace') w = w.replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
      w = p.upper ? w.toUpperCase() : w.toLowerCase();
      return w.replace(/[^\p{L}\p{N}]/gu, '');
    };
    const words = lines(p.words).map(o => ({ orig: o, w: norm(o) })).filter(x => x.w).sort((a, b) => b.w.length - a.w.length);
    const R = clamp(p.rows | 0, 4, 30), C = clamp(p.cols | 0, 4, 30);
    let dirs = [[0, 1], [1, 0]];
    if (p.diff !== 'leicht') dirs = dirs.concat([[1, 1], [-1, 1]]);
    if (p.diff === 'schwer') dirs = dirs.concat([[0, -1], [-1, 0], [-1, -1], [1, -1]]);
    const g = Array.from({ length: R }, () => Array(C).fill(null));
    const placed = [], missing = [];
    for (const { orig, w } of words) {
      let ok = false;
      for (let t = 0; t < 400 && !ok; t++) {
        const [dr, dc] = dirs[Math.floor(r() * dirs.length)];
        const r0 = randInt(r, 0, R - 1), c0 = randInt(r, 0, C - 1);
        const cells = [];
        for (let i = 0; i < w.length; i++) {
          const rr = r0 + dr * i, cc = c0 + dc * i;
          if (rr < 0 || cc < 0 || rr >= R || cc >= C) { cells.length = 0; break; }
          if (g[rr][cc] !== null && g[rr][cc] !== w[i]) { cells.length = 0; break; }
          cells.push([rr, cc]);
        }
        if (cells.length === w.length) { cells.forEach(([rr, cc], i) => g[rr][cc] = w[i]); placed.push({ orig, cells }); ok = true; }
      }
      if (!ok) missing.push(orig);
    }
    let abc = 'ABCDEFGHIJKLMNOPRSTUVWZ' + (p.uml === 'replace' ? '' : 'ÄÖÜ');
    if (!p.upper) abc = abc.toLowerCase();
    for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) if (g[i][j] === null) g[i][j] = abc[Math.floor(r() * abc.length)];
    return { g, placed, missing };
  });
}

const OPS = { '+': '+', '-': '−', '*': '·', '/': ':' };
function arGen(p) {
  return cached('ar' + JSON.stringify([p.ops, p.min, p.max, p.count, p.seed, p.noNeg, p.noRest, p.unknown, p.mode, p.dec, p.fmax]), () => {
    const r = rng(p.seed);
    let ops = [...(p.ops || '+')].filter(o => OPS[o]);
    if (p.mode === 'column') ops = ops.filter(o => o === '+' || o === '-');
    if (!ops.length) ops = ['+'];
    const f = 10 ** clamp(p.dec | 0, 0, 3);
    const lo = Math.min(p.min, p.max), hi = Math.max(p.min, p.max);
    const rv = () => randInt(r, Math.round(lo * f), Math.round(hi * f)) / f;
    const fix = v => Math.round(v * 1e6) / 1e6;
    const items = [];
    for (let i = 0; i < clamp(p.count | 0, 1, 80); i++) {
      const op = ops[Math.floor(r() * ops.length)];
      let a, b, res, rem = 0;
      if (op === '+') { a = rv(); b = rv(); res = fix(a + b); }
      else if (op === '-') { a = rv(); b = rv(); if (p.noNeg && b > a) [a, b] = [b, a]; res = fix(a - b); }
      else if (op === '*') { a = rv(); b = randInt(r, 2, Math.max(2, p.fmax | 0)); res = fix(a * b); }
      else { b = randInt(r, 2, Math.max(2, p.fmax | 0)); if (p.noRest || f > 1) { const q = rv(); a = fix(q * b); res = q; } else { a = rv(); res = Math.floor(a / b); rem = a - res * b; } }
      let u = 2;
      if (p.mode !== 'column' && !rem) { if (p.unknown === 'mixed') u = randInt(r, 0, 2); else if (p.unknown === 'operand') u = randInt(r, 0, 1); }
      items.push({ a, b, op, res, rem, u });
    }
    return items;
  });
}

/* Sichere Auswertung von Funktionstermen (Koordinatensystem) */
const _fnCache = new Map();
function compileFn(src) {
  if (_fnCache.has(src)) return _fnCache.get(src);
  let ex = String(src).replace(/^\s*[a-zA-Z]\s*(\(\s*x\s*\))?\s*=/, '').trim().replace(/,/g, '.').replace(/·|×/g, '*').replace(/:/g, '/').replace(/−/g, '-').replace(/\^/g, '**').replace(/²/g, '**2').replace(/³/g, '**3');
  ex = ex.replace(/(\d)\s*(x|\(|sin|cos|tan|sqrt|abs|pi)/g, '$1*$2').replace(/\)\s*(\(|x|\d)/g, ')*$1').replace(/x\s*(\(|\d)/g, 'x*$1').replace(/\bpi\b/g, 'PI');
  const test = ex.replace(/\b(sin|cos|tan|sqrt|abs|PI|log|exp|x)\b/g, '');
  let fn = null;
  if (/^[\d.+\-*/()\s]*$/.test(test) && ex) {
    try { fn = new Function('x', 'const {sin,cos,tan,sqrt,abs,PI,log,exp}=Math; return (' + ex + ');'); fn(1); } catch { fn = null; }
  }
  _fnCache.set(src, fn); return fn;
}

function buildTemplate(t) {
  const d = newDoc(t.doc.title);
  Object.assign(d, clone({ ...t.doc, theme: t.doc.theme || d.theme }));
  const { w } = pageSize(d), m = d.margin * MM, cw = w - 2 * m;
  d.pages = t.pages.map(list => ({ id: uid(), bg: 'none', els: list.map(src => { const e = clone(src); e.id = uid(); e.x = m + (e._x || 0) * MM; e.w = e._w ? e._w * MM : cw - (e._x || 0) * MM; e.y = m; e._flow = 1; return e; }) }));
  d.pages.forEach(p => p.els.forEach(e => { if (e.type === 'header') e.p.title = e.p.title || d.title; if (e.type === 'lines' && e.p.kind === 'lines') e.h = e.p.count * e.p.gap * MM; }));
  return d;
}
/* Nach dem ersten Messen der Höhen: Zeilen untereinander setzen.
   Aufgabe + zugehöriges Material bleiben zusammen; passt eine Gruppe nicht mehr, kommt sie auf eine neue Seite. */
function flowPending() {
  let did = false; const { h: PH } = pageSize(S.doc); const m = S.doc.margin * MM, limit = PH - m - 4 * MM;
  for (let pi = 0; pi < S.doc.pages.length; pi++) {
    const pg = S.doc.pages[pi];
    const fl = pg.els.filter(e => e._flow); if (!fl.length) continue; did = true;
    const rows = [...new Set(fl.map(e => e._row))].sort((a, b) => a - b).map(r => fl.filter(e => e._row === r));
    const groups = []; let open = false; for (const r of rows) { const isT = r.every(e => e.type === 'task'); if (open) { groups.at(-1).push(r); open = false; } else { groups.push([r]); open = isT; } }
    let y = m, first = true, target = pg, moved = [];
    const place = (grp, y0) => { let y = y0, gi = 0; for (const es of grp) { const isTask = es.every(e => e.type === 'task'); const top = y + (gi === 0 && first ? 0 : (isTask ? 6 * MM : 3 * MM)); let bottom = top; for (const e of es) { e.y = top + (e._dy || 0) * MM; bottom = Math.max(bottom, e.y + e.h); } y = bottom + (isTask ? MM : 0); gi++; first = false; } return y; };
    for (const grp of groups) {
      const save = first; const yEnd = place(grp, y);
      if (yEnd > limit && !save && target === pg) {
        // neue Seite anlegen und Rest dorthin verschieben
        const np = newPage(); S.doc.pages.splice(pi + 1, 0, np); target = np; first = true; y = place(grp, m);
        const rest = groups.slice(groups.indexOf(grp)).flat(2);
        pg.els = pg.els.filter(e => !rest.includes(e)); np.els.push(...rest);
        rest.forEach(e => { e._flow = 1; }); // auf neuer Seite weiter fließen
        break;
      }
      y = yEnd;
    }
    pg.els.forEach(e => { delete e._flow; delete e._row; delete e._x; delete e._w; delete e._dy; delete e._gap; });
  }
  if (did) renderStage();
}

  if (mod && k === 'y') { ev.preventDefault(); redo(); return; }
  if (mod && k === 'a') { ev.preventDefault(); setSel(S.doc.pages[S.page].els.map(e => e.id), true); return; }

/* =========================================================
   Export: Drucken/PDF, PDF-Datei, PNG, JPG, Word, Projekt
   ========================================================= */
const FORMATS = [
  ['print', 'Drucken / PDF', 'Druckdialog des Browsers. Beste Qualität, Text bleibt scharf. Dort „Als PDF sichern“ wählen.'],
  ['pdf', 'PDF-Datei', 'Lädt direkt eine PDF herunter – gut für iPad, Moodle, Mail.'],
  ['docx', 'Word (.docx)', 'Jede Seite als Bild in einem Word-Dokument, Layout bleibt exakt erhalten.'],
  ['png', 'PNG-Bild', 'Verlustfrei, ideal für Präsentationen und Whiteboard. Mehrere Seiten als ZIP.'],
  ['jpg', 'JPG-Bild', 'Kleine Dateien zum Teilen. Mehrere Seiten als ZIP.'],
  ['blatt', 'Projektdatei', 'Zum späteren Weiterbearbeiten auf einem anderen Gerät (.blatt).'],
];
let EX = Object.assign({ fmt: 'print', content: 'work', level: 'all', pages: 'all', range: '', dpi: 200, jq: .9, gray: false, stamp: true, name: '' }, lsGet('blattwerk.export', {}));

function parseRange(s, n) {
  const out = new Set();
  for (const part of String(s).split(/[,; ]+/)) {
    const m = part.match(/^(\d+)(?:\s*-\s*(\d+))?$/); if (!m) continue;
    let a = +m[1], b = m[2] ? +m[2] : a; if (a > b) [a, b] = [b, a];
    for (let i = a; i <= b; i++) if (i >= 1 && i <= n) out.add(i - 1);
  }
  return [...out].sort((a, b) => a - b);
}
/* Welche Seiten in welcher Fassung? */
function renditions() {
  const n = S.doc.pages.length;
  const pages = EX.pages === 'cur' ? [S.page] : EX.pages === 'range' ? parseRange(EX.range, n) : [...Array(n).keys()];
  const levels = EX.level === 'each' ? ['A', 'B', 'C'] : [EX.level];
  const contents = EX.content === 'both' ? [false, true] : [EX.content === 'sol'];
  const out = [];
  for (const level of levels) for (const sol of contents) out.push({ level, sol, pages });
  return out;
}
const variantLabel = r => [r.level !== 'all' ? 'Niveau ' + r.level : '', r.sol ? 'Lösung' : (EX.content === 'both' ? 'Arbeitsblatt' : '')].filter(Boolean).join(' – ');

function exportPageNode(pi, r) {
  const c = { doc: S.doc, sol: r.sol, level: r.level, edit: false, num: computeNumbers(S.doc, { sol: r.sol, level: r.level }), cl: clNumbers(S.doc), stamp: r.sol && EX.stamp, pageCount: r.pages.length, pageOffset: r.pages.indexOf(pi) - pi };
  return buildPage(S.doc.pages[pi], pi, c);
}

/* ---------- Schriften für Bild-Export einbetten ---------- */
const _fontCache = {};
async function fontEmbedCSS() {
  const used = new Set([S.doc.fontHead, S.doc.fontBody, S.doc.fontSol, 'Nunito', 'Fredoka']);
  S.doc.pages.forEach(p => p.els.forEach(e => e.s?.ff && used.add(e.s.ff)));
  const list = [...used].filter(f => FONT_CSS[f]).sort(); const key = list.join('|');
  if (_fontCache[key] !== undefined) return _fontCache[key];
  const toData = async url => { const buf = await (await fetch(url)).arrayBuffer(); let bin = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return 'data:font/woff2;base64,' + btoa(bin); };
  try {
    // Schriften liegen lokal in assets/fonts (keine Verbindung zu Google)
    const parts = await Promise.all(list.map(async f => {
      const cssUrl = new URL('assets/fonts/' + FONT_CSS[f], location.href).href;
      const css = await (await fetch(cssUrl)).text();
      const blocks = css.match(/@font-face\s*\{[^}]*\}/g) || [];
      return (await Promise.all(blocks.map(async bl => {
        const m = bl.match(/url\(([^)]+\.woff2)\)/); if (!m) return '';
        return bl.replace(m[0], `url(${await toData(new URL(m[1].replace(/['"]/g, ''), cssUrl).href)})`);
      }))).join('\n');
    }));
    return (_fontCache[key] = parts.join('\n'));
  } catch (e) { console.warn('Schriften konnten nicht eingebettet werden', e); return (_fontCache[key] = null); }
}

async function rasterize(node, scale, type, gray) {
  const root = $('#export-root'); root.innerHTML = ''; root.append(node);
  await document.fonts.ready;
  const { w, h } = pageSize(S.doc); const fc = await fontEmbedCSS();
  const opt = { pixelRatio: scale, width: w, height: h, backgroundColor: '#ffffff', cacheBust: false, style: { transform: 'none' } };
  if (fc) opt.fontEmbedCSS = fc; else opt.skipFonts = true;
  // Safari lädt Schriften/Bilder im ersten Durchlauf oft nicht – daher dort zweimal rendern
  if (/^((?!chrome|android).)*safari/i.test(navigator.userAgent)) { try { await htmlToImage.toCanvas(node, opt); } catch { } }
  let cv = await htmlToImage.toCanvas(node, opt);
  if (gray) { const g = document.createElement('canvas'); g.width = cv.width; g.height = cv.height; const x = g.getContext('2d'); x.filter = 'grayscale(1)'; x.drawImage(cv, 0, 0); cv = g; }
  root.innerHTML = '';
  return cv;
}
const canvasBlob = (cv, type, q) => new Promise(res => cv.toBlob(res, type, q));

async function runExport() {
  if (S.editing) stopEdit();
  const R = renditions(); const total = R.reduce((a, r) => a + r.pages.length, 0);
  const needZip = EX.fmt === 'docx' || ((EX.fmt === 'png' || EX.fmt === 'jpg') && total > 1);
  if (['pdf', 'png', 'jpg', 'docx'].includes(EX.fmt) && (!window.htmlToImage || (EX.fmt === 'pdf' && !window.jspdf) || (needZip && !window.JSZip)))
    return toast('Export-Bausteine konnten nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden – oder „Drucken / PDF“ nutzen.', true);
  if (EX.fmt !== 'blatt' && !total) return toast('Keine Seiten ausgewählt – Seitenbereich prüfen, z. B. 1-2', true);
  const base = safeName(EX.name || S.doc.title);
  const nameFor = r => safeName([base, variantLabel(r)].filter(Boolean).join(' – '));
  const prog = $('#ex-prog'), go = $('#ex-go');
  const setP = t => { if (prog) prog.textContent = t; };
  go.disabled = true;
  try {
    if (EX.fmt === 'blatt') { download(new Blob([JSON.stringify(S.doc)], { type: 'application/json' }), base + '.blatt'); toast('Projektdatei gesichert'); closeModal(); return; }
    if (EX.fmt === 'print') return doPrint(R);
    const scale = EX.dpi / 96; const imgs = []; let k = 0;
    for (const r of R) for (const pi of r.pages) {
      setP(`Seite ${++k} von ${total} wird gerendert …`);
      const cv = await rasterize(exportPageNode(pi, r), scale, EX.fmt, EX.gray);
      imgs.push({ r, pi, cv });
    }
    setP('Datei wird erstellt …');
    const landscape = S.doc.orient === 'l';
    if (EX.fmt === 'pdf') {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4', compress: true });
      pdf.setProperties({ title: S.doc.title, creator: 'Blattwerk' });
      imgs.forEach((im, i) => { if (i) pdf.addPage('a4', landscape ? 'landscape' : 'portrait'); pdf.addImage(im.cv.toDataURL('image/jpeg', .93), 'JPEG', 0, 0, landscape ? 297 : 210, landscape ? 210 : 297, undefined, 'FAST'); });
      download(pdf.output('blob'), (R.length === 1 ? nameFor(R[0]) : base) + '.pdf');
    } else if (EX.fmt === 'docx') {
      download(await buildDocx(imgs.map(i => i.cv), landscape), (R.length === 1 ? nameFor(R[0]) : base) + '.docx');
    } else {
      const type = EX.fmt === 'png' ? 'image/png' : 'image/jpeg', ext = EX.fmt === 'png' ? 'png' : 'jpg';
      if (imgs.length === 1) download(await canvasBlob(imgs[0].cv, type, EX.jq), `${nameFor(imgs[0].r)} – Seite ${imgs[0].pi + 1}.${ext}`);
      else {
        const zip = new JSZip();
        for (const im of imgs) zip.file(`${nameFor(im.r)} – Seite ${String(im.pi + 1).padStart(2, '0')}.${ext}`, await canvasBlob(im.cv, type, EX.jq));
        download(await zip.generateAsync({ type: 'blob' }), base + ` (${ext.toUpperCase()}).zip`);
      }
    }
    toast('Export fertig – die Datei liegt in deinen Downloads');
    closeModal();
  } catch (err) { console.error(err); toast('Export fehlgeschlagen: ' + (err?.message || err), true); setP(''); }
  finally { if (go) go.disabled = false; }
}

function doPrint(R) {
  const root = $('#print-root'); root.innerHTML = '';
  for (const r of R) for (const pi of r.pages) root.append(exportPageNode(pi, r));
  let st = $('#print-page-style'); if (!st) { st = document.createElement('style'); st.id = 'print-page-style'; document.head.append(st); }
  st.textContent = `@page{size:A4 ${S.doc.orient === 'l' ? 'landscape' : 'portrait'};margin:0}` + (EX.gray ? '#print-root{filter:grayscale(1)}' : '');
  closeModal();
  const clean = () => { root.innerHTML = ''; window.removeEventListener('afterprint', clean); };
  window.addEventListener('afterprint', clean);
  document.fonts.ready.then(() => setTimeout(() => { window.print(); }, 80));
  return R;
}

/* Word-Datei mit einer Seite pro Bild */
async function buildDocx(canvases, landscape) {
  const zip = new JSZip();
  const W = landscape ? 297 : 210, H = landscape ? 210 : 297, EMU = 36000;
  const cx = Math.round(W * EMU * .995), cy = Math.round(H * EMU * .995);
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`);
  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`);
  zip.file('docProps/core.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${esc(S.doc.title)}</dc:title><dc:creator>Blattwerk</dc:creator></cp:coreProperties>`);
  let rels = '', body = '';
  for (let i = 0; i < canvases.length; i++) {
    const b = await canvasBlob(canvases[i], 'image/jpeg', .92);
    zip.file(`word/media/seite${i + 1}.jpeg`, b);
    rels += `<Relationship Id="rIdImg${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/seite${i + 1}.jpeg"/>`;
    body += `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>${i ? '<w:r><w:br w:type="page"/></w:r>' : ''}<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${i + 1}" name="Seite ${i + 1}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${i + 1}" name="seite${i + 1}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${i + 1}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  }
  const tw = v => Math.round(v / 25.4 * 1440);
  zip.file('word/_rels/document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`);
  zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="${tw(W)}" w:h="${tw(H)}"${landscape ? ' w:orient="landscape"' : ''}/><w:pgMar w:top="0" w:right="0" w:bottom="0" w:left="0" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

  ${proj ? `<div class="hint">Die Projektdatei enthält alles – auch Bilder, Lösungen und alle Niveaus. Öffnen über Ablage → „Projektdatei öffnen“.</div>` : `<div class="opt-grid">
    <div class="f"><span class="l">Inhalt</span>${seg('content', [['work', 'Arbeitsblatt'], ['sol', 'Lösung'], ['both', 'beides']])}</div>
    <div class="f"><span class="l">Niveau</span>${seg('level', [['all', 'alle Elemente'], ['A', 'A'], ['B', 'B'], ['C', 'C'], ['each', 'A, B, C getrennt']])}${anyLvl ? '' : '<div class="sub">Noch keine Elemente mit Niveau markiert.</div>'}</div>
    <div class="f"><span class="l">Seiten</span>${seg('pages', [['all', `alle (${S.doc.pages.length})`], ['cur', `aktuelle (${S.page + 1})`], ['range', 'Bereich']])}${EX.pages === 'range' ? `<input type="text" id="ex-range" placeholder="z. B. 1-2, 4" value="${esc(EX.range)}" style="margin-top:6px">` : ''}</div>
    ${raster ? `<div class="f"><span class="l">Auflösung</span>${seg('dpi', [[150, 'Standard 150 dpi'], [200, 'Hoch 200 dpi'], [300, 'Druckerei 300 dpi']])}</div>` : '<div class="f"><span class="l">Hinweis</span><div class="sub">Im Druckdialog Ränder auf „Keine“ und Skalierung 100 % lassen.</div></div>'}
    ${EX.fmt === 'jpg' ? `<div class="f"><span class="l">JPG-Qualität</span><div class="rng"><input type="range" id="ex-jq" min=".5" max="1" step=".05" value="${EX.jq}"><output>${Math.round(EX.jq * 100)} %</output></div></div>` : ''}
    <div class="f"><label class="chk"><input type="checkbox" id="ex-gray"${EX.gray ? ' checked' : ''}>In Graustufen (Toner sparen)</label><label class="chk" style="margin-top:6px"><input type="checkbox" id="ex-stamp"${EX.stamp ? ' checked' : ''}>Lösungsseiten mit „LÖSUNG“ stempeln</label></div>
    ${EX.fmt !== 'print' ? `<div class="f wide"><label for="ex-name">Dateiname</label><input type="text" id="ex-name" value="${esc(EX.name)}"></div>` : ''}
  </div>
  <div class="hint">Es entstehen <b>${total} Seite${total === 1 ? '' : 'n'}</b>${R.length > 1 ? ': ' + R.map(r => `${variantLabel(r)} (${r.pages.length})`).join(', ') : ''}.</div>`}`;
  b.onclick = ev => {
    const c = ev.target.closest('[data-fmt]'); if (c) { EX.fmt = c.dataset.fmt; return renderExportBody(); }
    const s = ev.target.closest('[data-ex] button'); if (s) { const k = s.parentElement.dataset.ex; EX[k] = k === 'dpi' ? +s.dataset.v : s.dataset.v; return renderExportBody(); }
  };
  b.oninput = ev => {
    const t = ev.target;
    if (t.id === 'ex-range') { EX.range = t.value; const R2 = renditions(); const tot = R2.reduce((a, r) => a + r.pages.length, 0); const h = b.querySelector('.hint:last-child b'); if (h) h.textContent = `${tot} Seite${tot === 1 ? '' : 'n'}`; }
    if (t.id === 'ex-jq') { EX.jq = +t.value; t.nextElementSibling.textContent = Math.round(EX.jq * 100) + ' %'; }
    if (t.id === 'ex-name') EX.name = t.value;
  };
  b.onchange = ev => { const t = ev.target; if (t.id === 'ex-gray') EX.gray = t.checked; if (t.id === 'ex-stamp') EX.stamp = t.checked; };
}

'use strict';
/* =========================================================
   Start & Verdrahtung
   ========================================================= */
function init() {
  $('#fmtbar').innerHTML = fmtbarHtml();
  bindFmt(); bindProps(); bindLeft();
  const stage = $('#stage'), canvas = $('#canvas');

  stage.addEventListener('pointerdown', ev => {
    onStageDown(ev);
    // Langes Drücken (iPad) öffnet das Kontextmenü
    if (ev.pointerType === 'touch' && ev.target.closest('.page')) {
      const x = ev.clientX, y = ev.clientY, tgt = ev.target;
      const t = setTimeout(() => { if (drag && drag.moved) return; if (drag) { window.removeEventListener('pointermove', onDragMove); drag.box?.remove(); drag = null; } onContext({ target: tgt, clientX: x, clientY: y, preventDefault() { } }); }, 600);
      const stop = e => { if (e.type !== 'pointermove' || Math.hypot(e.clientX - x, e.clientY - y) > 8) { clearTimeout(t); window.removeEventListener('pointermove', stop); window.removeEventListener('pointerup', stop); } };
      window.addEventListener('pointermove', stop); window.addEventListener('pointerup', stop);
    }
  });
  stage.addEventListener('click', ev => { const b = ev.target.closest('[data-pa]'); if (b) { const pi = +b.closest('.page-wrap').dataset.pi; pageAction(pi, b.dataset.pa); } });
  stage.addEventListener('dblclick', ev => {
    const en = ev.target.closest('.el'); if (!en || S.editing) return;
    const el = findEl(en.dataset.id)?.el; if (!el || el.locked) return;
    setSel([el.id]);
    const ed = ev.target.closest('[data-edit]') || (el.type !== 'table' && elNode(el.id)?.querySelector('[data-edit]'));
    if (ed) return startEdit(el.id, ed, ev);
    if (el.type === 'image') return pickImage(el);
    if (innerWidth <= 1100) openDrawer('right');
    const first = $('#props .sec[open] textarea, #props .sec[open] input[type=text]'); first?.focus();
  });
  stage.addEventListener('contextmenu', onContext);
  canvas.addEventListener('dragover', ev => { if ([...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; } });
  canvas.addEventListener('drop', async ev => {
    const files = [...(ev.dataTransfer?.files || [])]; if (!files.length) return; ev.preventDefault();
    const pn = ev.target.closest('.page'); if (pn) S.page = +pn.dataset.pi;
    const at = pn ? pagePoint(ev, S.page) : null;
    for (const f of files) {
      if (/\.(blatt|json)$/i.test(f.name)) { await openProjectFile(f); return; }
      const en = ev.target.closest('.el'); const tgt = en && findEl(en.dataset.id)?.el;
      if (tgt && tgt.type === 'image') { await setImage(tgt, 'src', f); continue; }
      await addImageFile(f, at);
    }
  });
  canvas.addEventListener('pointerdown', ev => { if (ev.target === canvas || ev.target === stage) { if (S.editing) stopEdit(); setSel([]); } });
  // iPad: Zwei-Finger-Zoom
  let gz = 1, gRaf = 0;
  canvas.addEventListener('gesturestart', ev => { ev.preventDefault(); gz = S.zoom; });
  canvas.addEventListener('gesturechange', ev => { ev.preventDefault(); cancelAnimationFrame(gRaf); const z = gz * ev.scale; gRaf = requestAnimationFrame(() => setZoom(z)); });
  canvas.addEventListener('wheel', ev => { if (ev.ctrlKey) { ev.preventDefault(); setZoom(S.zoom * (ev.deltaY < 0 ? 1.08 : 1 / 1.08)); } }, { passive: false });

  document.addEventListener('keydown', onKey);
  document.addEventListener('paste', onPaste);
  document.addEventListener('pointerdown', ev => { if (!ev.target.closest('#ctxmenu')) hideCtx(); });
  $('#file-img').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f || !_imgTarget) return; const fe = findEl(_imgTarget.id); if (fe) setImage(fe.el, _imgTarget.key, f); });
  $('#file-proj').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) openProjectFile(f); });

  $('#b-undo').onclick = undo; $('#b-redo').onclick = redo;
  $('#b-export').onclick = openExport;
  $('#b-zin').onclick = () => setZoom(S.zoom + .1); $('#b-zout').onclick = () => setZoom(S.zoom - .1); $('#zoomv').onclick = zoomFit;
  $('#b-left').onclick = () => openDrawer('left'); $('#b-right').onclick = () => openDrawer('right');
  $('#seg-mode').onclick = ev => { const b = ev.target.closest('button'); if (b) setMode(b.dataset.v); };
  $('#seg-level').onclick = ev => { const b = ev.target.closest('button'); if (b) setLevel(b.dataset.v); };
  const ti = $('#doc-title');
  ti.addEventListener('input', () => { S.doc.title = ti.value; stageSoon(); commitSoon(); if (curTarget === 'doc') { const f = $('#props input[type=text]'); if (f && f !== document.activeElement) f.value = ti.value; } });
  ti.addEventListener('keydown', ev => { if (ev.key === 'Enter') ti.blur(); });
  window.addEventListener('beforeunload', () => lsSet(LS.cur, S.doc));
  let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (innerWidth > 1100) closeDrawers(); }, 150); });

  // Dokument laden: zuletzt bearbeitet oder Beispielblatt
  const saved = lsGet(LS.cur, null);
  let doc;
  try { doc = saved && saved.pages ? normalizeDoc(saved) : null; } catch { doc = null; }
  S.doc = doc || normalizeDoc(buildTemplate(TEMPLATES[0]));
  $('#doc-title').value = S.doc.title;
  const ui = lsGet(LS.ui, {});
  S.zoom = ui.zoom || 1;
  renderAll();
  document.fonts.ready.then(() => { renderStage(); flowPending(); histReset(); if (!ui.zoom) zoomFit(); autosave(); });
  setTimeout(() => { if (!S.hist.length) { flowPending(); histReset(); } }, 1500);
}
document.addEventListener('DOMContentLoaded', init);

</script>

  { sel: "#left", title: "Bausteine", text: "<p>Antippen fügt einen Baustein unten auf der Seite ein, Ziehen legt ihn genau an die richtige Stelle.</p><p>Unter <b>Vorlagen</b> findest du fertige Blätter, unter <b>Ablage</b> deine gespeicherten.</p>" },
