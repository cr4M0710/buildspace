<link rel="apple-touch-icon" href="assets/icon-v3-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
:root{--a:#ffc857;--b:#ff6b9d;--ok:#3ddc84;--warn:#ffd23f;--bad:#ff5d5d;--txt:#f6f4ee;--mut:#b9b4cf;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--bs:min(94vw,64vh,600px)}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--txt);background:#120c26;overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 10% 6%,rgba(255,200,87,.22),transparent 70%),radial-gradient(55% 45% at 92% 16%,rgba(255,107,157,.22),transparent 70%),radial-gradient(70% 55% at 50% 100%,rgba(90,70,200,.35),transparent 70%),#120c26}
input{-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.mut{color:var(--mut)}
.c{text-align:center}
.hint{color:var(--mut);font-size:.88rem;margin:.6rem 0 0}
.hint.c{text-align:center}
.okc{color:var(--ok)}.warnc{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.c{justify-content:center}

/* Bildschirme */
.scr{display:none;max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 62px) 14px calc(env(safe-area-inset-bottom,0px) + 96px)}
.scr.on{display:block}
.title{text-align:center;margin:0 0 4px;font-size:clamp(1.9rem,6vw,2.7rem);letter-spacing:.01em}
.title span{background:linear-gradient(90deg,#ffc857,#ff6b9d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:0 0 18px}

/* Karten & Buttons */
.card{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lbl{display:block;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;font-weight:800}
.lbl:first-child{margin-top:0}
.btn{appearance:none;border:1px solid rgba(255,255,255,.24);background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));color:#fff;font:inherit;font-weight:800;padding:12px 18px;border-radius:16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(160deg,#ffd77a,#ff9f45 55%,#ff6b9d);color:#2a1330;border-color:rgba(255,255,255,.5)}
.btn.big{font-size:1.08rem;min-height:58px;border-radius:18px}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:12px}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(8,6,24,.55);color:#fff;font:inherit;font-size:1.05rem;font-weight:700;padding:10px 14px;outline:none}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(255,200,87,.25)}
.inp.code{letter-spacing:.35em;text-transform:uppercase;text-align:center;font-size:1.25rem}
.seg{display:inline-flex;gap:4px;background:rgba(8,6,24,.45);padding:4px;border-radius:14px;border:1px solid var(--line);flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:800;padding:8px 14px;border-radius:10px;min-height:42px;cursor:pointer}
.seg button.on{background:linear-gradient(160deg,#ffd77a,#ff9f45);color:#2a1330}
.seg.sm button{padding:4px 9px;min-height:36px;font-size:.95rem}

/* Menü */
.profile{display:flex;gap:10px;align-items:center}
.avbtn{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:1.9rem;cursor:pointer;flex:none}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.note{background:rgba(255,200,87,.14);border:1px solid rgba(255,200,87,.45);padding:10px 12px;border-radius:14px;margin:0 0 10px;font-size:.95rem}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:6px}
.gcard{appearance:none;text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));cursor:pointer;min-height:158px}
.gcard:active{transform:scale(.97)}
.gcard .ge{font-size:2.3rem;line-height:1}
.gcard b{font-size:1.06rem}
.gcard small{color:var(--a);font-weight:800}
.gcard .gb{color:var(--mut);font-size:.82rem;line-height:1.3}
.gcard .gs{margin-top:auto;font-size:.76rem;color:var(--mut)}

/* Modal, Toast */
.modal{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:rgba(5,3,18,.7);padding:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.mbox{width:min(520px,100%);max-height:88vh;overflow:auto;background:#1c1438;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h2{margin-bottom:4px}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.rules h4{margin:14px 0 4px;color:var(--a)}
.rules p{margin:0;line-height:1.5}
.rulesbox .btn{width:100%;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,30px);background:#2a1f55;border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:100001;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;font-weight:700}
.toast.on{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;z-index:100002;display:none;align-items:center;justify-content:center;background:rgba(5,3,18,.75);flex-direction:column;gap:14px;font-weight:800}
.busy.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--a);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Lobby */
.lhead{display:flex;align-items:center;gap:12px}
.lhead .ge{font-size:2.4rem}
.lhead>div{flex:1}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(8,6,24,.4);border:1px solid transparent}
.seat.me{border-color:rgba(255,200,87,.6)}
.seat .sn{font-weight:800;min-width:64px}
.seat .who{min-width:0;overflow:hidden;text-overflow:ellipsis}
.seat .ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.14);margin-left:4px}
.tag.me{background:var(--a);color:#2a1330}
.inv h3{margin-bottom:8px}
.invrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:8px;border-radius:14px;min-width:164px;min-height:164px}
.qr img,.qr canvas{display:block}
.bigcode{font-size:2.3rem;font-weight:900;letter-spacing:.22em;margin:2px 0 10px;color:var(--a)}
@media(max-width:480px){.seat{grid-template-columns:auto 1fr auto}.seat .sn{display:none}}

/* Spielbildschirm */
.gtop{display:flex;align-items:center;gap:8px}
.gtop h2{flex:1;font-size:1.25rem}
.ibtn{appearance:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:1.2rem;cursor:pointer}
.ibtn.off{opacity:.45}
.players{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.pl{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.08)}
.pl .dot{background:var(--c)}
.pl .pa{font-size:1.5rem}
.pl .pnm{display:flex;flex-direction:column;line-height:1.15}
.pl small{color:var(--mut);font-size:.72rem}
.pl.act{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);background:rgba(255,255,255,.16)}
.pl.me .pnm b::after{content:" ★";color:var(--a)}
.status{text-align:center;font-weight:900;font-size:1.1rem;min-height:1.6em;margin:8px 0 6px}
.status.mine{color:var(--a)}
.ginfo{text-align:center;color:var(--mut);font-weight:700;font-size:.92rem;margin:6px 0}
.board{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px}
.gprompt{text-align:center;color:var(--a);font-weight:800;min-height:1.4em;font-size:.95rem}
.gresult{display:none;margin-top:14px;padding:16px;border-radius:20px;text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.1)}
.gresult.on{display:block}
.gresult h3{font-size:1.5rem;margin-bottom:6px}
.gresult.win{background:linear-gradient(160deg,rgba(61,220,132,.3),rgba(255,200,87,.2));border-color:rgba(61,220,132,.7)}
.gresult.lose{background:rgba(255,93,93,.18);border-color:rgba(255,93,93,.5)}
.gresult .row{margin-top:10px}

/* ---- Tic Tac Toe ---- */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(var(--bs),420px)}
.tcell{aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:calc(min(var(--bs),420px)/3*.6);font-weight:900;display:flex;align-items:center;justify-content:center;cursor:default;padding:0}
.tcell[data-ok]{cursor:pointer;background:rgba(255,255,255,.17)}
.tcell[data-ok]:active{transform:scale(.95)}
.mk1{color:#ff6b9d}.mk2{color:#5ad7ff}
.tcell.win{background:rgba(61,220,132,.3);border-color:var(--ok)}
.tcell.last .mk{animation:pop .3s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---- Vier gewinnt ---- */
.c4{display:flex;gap:calc(var(--bs)*.012);padding:calc(var(--bs)*.02);background:linear-gradient(160deg,#2f5bd8,#1d3aa0);border-radius:20px;width:var(--bs);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.c4col{flex:1;display:flex;flex-direction:column;gap:calc(var(--bs)*.012);appearance:none;border:0;background:transparent;padding:0;cursor:default;border-radius:12px}
.c4col[data-ok]{cursor:pointer}
.c4col[data-ok]:hover,.c4col[data-ok]:focus-visible{background:rgba(255,255,255,.14)}
.c4cell{aspect-ratio:1;border-radius:50%;background:rgba(8,6,40,.75);position:relative;display:block;box-shadow:inset 0 3px 6px rgba(0,0,0,.5);overflow:visible}
.disc{position:absolute;inset:6%;border-radius:50%;display:block}
.disc.d1{background:radial-gradient(circle at 35% 30%,#ff8a8a,#e5232d 70%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
.disc.d2{background:radial-gradient(circle at 35% 30%,#fff2a0,#f5b800 70%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
.disc.d2::after{content:"";position:absolute;inset:28%;border-radius:50%;border:3px solid rgba(120,70,0,.45)}
.disc.d1::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(120,0,0,.3)}
.disc.drop{animation:drop .45s cubic-bezier(.45,0,.9,.6)}
@keyframes drop{from{transform:translateY(calc(var(--fall)*-110%))}to{transform:none}}
.disc.win{animation:winp .8s ease-in-out infinite alternate;box-shadow:0 0 0 4px #fff,0 0 18px #fff}
@keyframes winp{to{transform:scale(1.08)}}

/* ---- Reversi ---- */
.rv{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:var(--bs);background:#0d4a2c;padding:6px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rcell{aspect-ratio:1;background:#16895a;border:0;position:relative;padding:0;cursor:default;border-radius:4px;display:flex;align-items:center;justify-content:center}
.rcell[data-ok]{cursor:pointer}
.rcell.last{outline:3px solid var(--a);outline-offset:-3px}
.stone{display:block;width:80%;height:80%;border-radius:50%;box-shadow:0 3px 6px rgba(0,0,0,.45)}
.stone.s1{background:radial-gradient(circle at 35% 30%,#555,#050505 70%)}
.stone.s2{background:radial-gradient(circle at 35% 30%,#fff,#cfd3d8 75%)}
.stone.flip{animation:flip .45s}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(1.1)}100%{transform:rotateY(0) scale(1)}}

.hdot{display:block;width:26%;height:26%;border-radius:50%;background:rgba(255,255,255,.55)}

/* ---- Mühle ---- */
.mu{width:var(--bs);height:var(--bs);background:linear-gradient(160deg,#c89a62,#a6743f);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:manipulation}
.mu-l{fill:none;stroke:#4a2f14;stroke-width:.08;stroke-linecap:round}
.mp .pt{fill:#4a2f14}
.mp .hit{fill:transparent;cursor:pointer}
.ms{stroke-width:.06}
.ms1{fill:#f6f1e6;stroke:#6b5b43}
.ms2{fill:#241a14;stroke:#000}
.ring{fill:none;stroke:#fff;stroke-width:.07;stroke-dasharray:.14 .1}
.ring.x{stroke:#ff3b3b;stroke-width:.1;stroke-dasharray:none}
.mp.tgt .pt{fill:#fff}
.mp.sel .ms{stroke:#ffc857;stroke-width:.14}
.mp.mov .ms{stroke:#ffc857;stroke-width:.1}
.mp.lastm .ms{stroke:#3ddc84;stroke-width:.1}

/* ---- Dame ---- */
.dg{display:grid;grid-template-columns:repeat(8,1fr);width:var(--bs);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:6px solid #6b3f1d}
.dsq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.dsq.lt{background:#f0d9b5}.dsq.dk{background:#a9733c;cursor:pointer}
.dsq.tgt{background:#7fae4d}
.dsq.lastm{box-shadow:inset 0 0 0 3px rgba(255,200,87,.9)}
.dp{display:flex;align-items:center;justify-content:center;width:80%;height:80%;border-radius:50%;font-style:normal;font-size:calc(var(--bs)/8*.5);line-height:1;box-shadow:0 3px 5px rgba(0,0,0,.5)}
.dpw{background:radial-gradient(circle at 35% 30%,#fff,#d4cdbc 75%);color:#8a5a00;border:3px solid #b9ae93}
.dpb{background:radial-gradient(circle at 35% 30%,#555,#111 75%);color:#ffc857;border:3px solid #000}
.dp.sel{outline:4px solid #ffc857;outline-offset:1px}
.dp.mov{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 4px rgba(255,200,87,.8)}}
.dg.flip{}

/* ---- Schach ---- */
.ch{display:grid;grid-template-columns:repeat(8,1fr);width:var(--bs);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:5px solid #3a2a1c;position:relative}
.csq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.csq.lt{background:#ecd9b4}.csq.dk{background:#b0804f}
.csq.lastm{background:#d9d75a}
.csq.dk.lastm{background:#b8b032}
.csq.sel{background:#7fcf6d!important}
.csq.chk{background:radial-gradient(circle,#ff4d4d 20%,transparent 75%),var(--bgc,#d9a66a)}
.csq.tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,80,20,.45)}
.csq.capt::after{content:"";position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(200,30,30,.65)}
.cp{font-size:calc(var(--bs)/8*.82);line-height:1;font-style:normal;position:relative;z-index:1;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",system-ui,sans-serif}
.cp.w{color:#fff;-webkit-text-stroke:1.2px #222;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.cp.b{color:#1a1a1a;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.cp.mov{animation:glow2 1.4s ease-in-out infinite alternate}
@keyframes glow2{to{filter:drop-shadow(0 0 5px #ffc857)}}
.co{position:absolute;font-size:calc(var(--bs)/8*.2);opacity:.7;font-weight:800;pointer-events:none;color:#3a2a1c}
.co.r{top:2px;left:3px}.co.f{bottom:1px;right:3px}
.promo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:#1c1438;border:2px solid var(--a);padding:12px;border-radius:18px;z-index:5;box-shadow:0 10px 40px rgba(0,0,0,.6);width:min(86%,360px)}
.promo div{width:100%;text-align:center;font-weight:800}
.promo button{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);background:#e7d4ac;cursor:pointer;padding:0}
.promo .cp{font-size:42px}
#board{position:relative}

/* ---- Mensch ärgere dich nicht ---- */
.md{width:var(--bs);height:var(--bs);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:manipulation}
.md-bg{fill:#f1e3c0}
.md-base{fill:color-mix(in srgb,var(--c) 38%,#f1e3c0);stroke:var(--c);stroke-width:.07}
.md-cell{fill:#fff;stroke:#7a6a4a;stroke-width:.05}
.md-cell.lane{fill:color-mix(in srgb,var(--c) 55%,#fff)}
.md-cell.start{fill:color-mix(in srgb,var(--c) 55%,#fff);stroke:var(--c);stroke-width:.1}
.pc{cursor:default}
.pc .hit{fill:transparent}
.pc-b{fill:var(--c);stroke:#fff;stroke-width:.06}
.pc-n{font-size:.38px;font-weight:900;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:.04px}
.pc.mv{cursor:pointer}
.pc.mv .pc-b{animation:pulse 1s ease-in-out infinite alternate}
.pc-ring{fill:none;stroke:#222;stroke-width:.07;stroke-dasharray:.12 .1}
@keyframes pulse{to{transform:scale(1.18)}}
.pc.lastp .pc-b{stroke:#222;stroke-width:.1}
.mdice{display:flex;align-items:center;justify-content:center;gap:14px;min-height:78px;flex-wrap:wrap}
.rollbtn{appearance:none;border:0;font:inherit;font-weight:900;font-size:1.25rem;padding:14px 26px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);cursor:pointer;min-height:64px;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pulse2 1s ease-in-out infinite alternate}
@keyframes pulse2{to{transform:scale(1.05)}}
.dface{font-size:4rem;line-height:1;color:var(--c);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));background:#fff;border-radius:14px;padding:0 6px;appearance:none;border:0}
.dface.big{font-size:4.6rem;padding:2px 10px}
.dface.ok{cursor:pointer;box-shadow:0 0 0 4px var(--a)}
.dface.no{opacity:.4}
.dnote{color:var(--mut);font-weight:800}

/* ---- Karten ---- */

<script>
(function () {
'use strict';
/* ===== Kern: Registry, Zufall, Helfer ===== */
const GAMES = {};
const GAME_ORDER = [];
const LV_NAMES = ['', 'Leicht', 'Mittel', 'Schwer'];
const LV_ICONS = ['', '🌱', '⚙️', '🔥'];
function regGame(g) { GAMES[g.id] = g; GAME_ORDER.push(g.id); }

/* geseedeter Zufall im Zustand (mulberry32) – deterministisch und testbar */
function rnd(s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = Math.imul(s.rng ^ (s.rng >>> 15), 1 | s.rng);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(s, n) { return Math.floor(rnd(s) * n); }
function shuffle(s, a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rint(s, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
const clone = (o) => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const rpick = (a) => a[Math.floor(Math.random() * a.length)];
const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Zufällige Auswahl unter (nahezu) gleich guten Zügen */
function bestOf(scored, tol) {
  let best = -Infinity;
  for (const x of scored) if (x.s > best) best = x.s;
  const top = scored.filter((x) => x.s >= best - (tol || 0));
  return rpick(top).m;
}

/* Allgemeine Negamax-Suche mit Alpha-Beta für 2-Personen-Brettspiele.
   ops: { moves(pos) -> Move[], make(pos,m) -> undo, unmake(pos,undo), eval(pos) -> Zahl aus Sicht des Spielers am Zug,
          over(pos) -> null | Zahl (Wert aus Sicht des Spielers am Zug, z. B. -100000 bei verloren), order?(pos,moves) } */
function negamaxRoot(pos, ops, depth, opts) {
  opts = opts || {};
  const t0 = now(), limit = opts.ms || 1e9;
  let timeUp = false, nodes = 0;
  function search(d, a, b, ply) {
    nodes++;
    if ((nodes & 255) === 0 && now() - t0 > limit) timeUp = true;
    const ov = ops.over(pos, ply);
    if (ov !== null) return ov;
    if (d <= 0) return ops.eval(pos);
    let ms = ops.moves(pos);
    if (!ms.length) return ops.stuck ? ops.stuck(pos, ply) : ops.eval(pos);
    if (ops.order) ms = ops.order(pos, ms);
    let best = -Infinity;
    for (const m of ms) {
      const u = ops.make(pos, m);
      const v = -search(d - 1, -b, -a, ply + 1);
      ops.unmake(pos, u);
      if (timeUp) return best === -Infinity ? 0 : best;
      if (v > best) best = v;
      if (best > a) a = best;
      if (a >= b) break;
    }
    return best;
  }
  let rootMoves = ops.moves(pos);
  if (ops.order) rootMoves = ops.order(pos, rootMoves);
  let bestMove = rootMoves[0], scores = null;
  const maxD = depth;
  for (let d = (opts.iter ? 1 : maxD); d <= maxD; d++) {
    const cur = [];
    let a = -Infinity;
    for (const m of rootMoves) {
      const u = ops.make(pos, m);
      const v = -search(d - 1, -Infinity, -a + (opts.tol || 0), 1);
      ops.unmake(pos, u);
      if (timeUp) break;
      cur.push({ m, s: v });
      if (v > a) a = v;
    }
    if (timeUp && cur.length < rootMoves.length) {
      if (cur.length && !scores) scores = cur;
      break;
    }
    scores = cur;
    // beste Züge zuerst für die nächste Tiefe
    rootMoves = cur.slice().sort((x, y) => y.s - x.s).map((x) => x.m);
    if (timeUp) break;
  }
  if (!scores || !scores.length) return { m: bestMove, scores: [{ m: bestMove, s: 0 }] };
  return { m: bestOf(scores, opts.tol || 0), scores };
}

/* ===== Würfel-Icons ===== */
const DIE_FACE = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

/* ===== Tic Tac Toe ===== */
(function () {
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  function winner(b) {
    for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return l;
    return null;
  }
  function empties(b) { const r = []; for (let i = 0; i < 9; i++) if (!b[i]) r.push(i); return r; }
  // Minimax: Wert aus Sicht von Spieler p (1/2), Tiefe bevorzugt schnelle Siege
  function mm(b, turn, me, d) {
    const w = winner(b);
    if (w) return b[w[0]] === me ? 10 - d : d - 10;
    const e = empties(b);
    if (!e.length) return 0;
    let best = turn === me ? -99 : 99;
    for (const i of e) {
      b[i] = turn;
      const v = mm(b, 3 - turn, me, d + 1);
      b[i] = 0;
      best = turn === me ? Math.max(best, v) : Math.min(best, v);
    }
    return best;
  }
  function winningMove(b, p) {
    for (const i of empties(b)) { b[i] = p; const w = winner(b); b[i] = 0; if (w) return i; }
    return -1;
  }
  regGame({
    id: 'tictactoe', name: 'Tic Tac Toe', emoji: '❌', min: 2, max: 2,
    blurb: 'Drei in einer Reihe gewinnt – der Klassiker für zwischendurch.',
    seatLabels: ['✕', '◯'],
    seatColor(seat) { return ['#ff6b9d', '#5ad7ff'][seat]; },
    rules: `<h4>Ziel</h4><p>Bringe als Erste/r <b>drei deiner Zeichen in eine Reihe</b> – waagerecht, senkrecht oder diagonal.</p>
<h4>Ablauf</h4><p>Ihr setzt abwechselnd ein Zeichen (✕ oder ◯) in ein freies Feld. ✕ beginnt.</p>
<h4>Ende</h4><p>Gewonnen hat, wer eine Dreierreihe hat. Ist das Brett voll und niemand hat gewonnen, ist es <b>unentschieden</b>.</p>
<h4>Tipp</h4><p>Die Mitte und die Ecken sind stark. Mit perfektem Spiel endet jede Partie unentschieden – der schwere Bot spielt perfekt!</p>`,
    init(n, o, seed) {
      return { b: [0, 0, 0, 0, 0, 0, 0, 0, 0], t: (o && o.start) ? 1 : 0, last: -1, win: null, over: false, draw: false, rng: seed | 0 };
    },
    turn(s) { return s.over ? -1 : s.t; },
    legal(s, seat) { return s.over || s.t !== seat ? [] : empties(s.b); },
    apply(s, seat, m) {
      s.b[m] = seat + 1; s.last = m;
      const w = winner(s.b);
      if (w) { s.win = w; s.over = true; }
      else if (!empties(s.b).length) { s.over = true; s.draw = true; }
      else s.t = 1 - s.t;
    },
    view(s) { return s; },
    result(s) {
      if (!s.over) return null;
      if (s.draw) return { winners: [], draw: true };
      return { winners: [s.b[s.win[0]] - 1] };
    },
    bot(s, seat, lv) {
      const b = s.b.slice(), me = seat + 1, e = empties(b);
      if (lv === 1) return rpick(e);
      const w = winningMove(b, me); if (w >= 0) return w;
      const bl = winningMove(b, 3 - me); if (bl >= 0) return bl;
      if (lv === 2) {
        if (Math.random() < 0.3) return rpick(e);
        if (b[4] === 0) return 4;
        return rpick(e);
      }
      const sc = e.map((i) => { b[i] = me; const v = mm(b, 3 - me, me, 1); b[i] = 0; return { m: i, s: v }; });
      return bestOf(sc, 0);
    },
    render(root, v, c) {
      const w = v.win || [];
      root.innerHTML = '<div class="ttt">' + v.b.map((x, i) =>
        '<button class="tcell' + (w.includes(i) ? ' win' : '') + (v.last === i ? ' last' : '') + '" data-i="' + i + '"' +
        ((c.my && c.legal.includes(i)) ? ' data-ok="1"' : ' tabindex="-1"') + ' aria-label="Feld ' + (i + 1) + '">' +
        (x ? '<span class="mk mk' + x + '">' + (x === 1 ? '✕' : '◯') + '</span>' : '') + '</button>').join('') + '</div>';
      root.querySelectorAll('.tcell[data-ok]').forEach((b) => { b.onclick = () => c.send(+b.dataset.i); });
    },
  });
})();

/* ===== Vier gewinnt ===== */
(function () {
  const W = 7, H = 6;
  const WINDOWS = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    [[0, 1], [1, 0], [1, 1], [1, -1]].forEach(([dr, dc]) => {
      const er = r + 3 * dr, ec = c + 3 * dc;
      if (er < 0 || er >= H || ec < 0 || ec >= W) return;
      WINDOWS.push([0, 1, 2, 3].map((k) => (r + k * dr) * W + (c + k * dc)));
    });
  }
  function lineAt(b, r, c, p) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [r * W + c];
      for (const sg of [1, -1]) {
        let rr = r + sg * dr, cc = c + sg * dc;
        while (rr >= 0 && rr < H && cc >= 0 && cc < W && b[rr * W + cc] === p) { cells.push(rr * W + cc); rr += sg * dr; cc += sg * dc; }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }
  function evalPos(b, t) {
    let s = 0;
    for (const w of WINDOWS) {
      let m = 0, o = 0;
      for (const i of w) { const x = b[i]; if (x === t) m++; else if (x) o++; }
      if (m && o) continue;
      if (m) s += [0, 1, 5, 30, 0][m]; else if (o) s -= [0, 1, 6, 40, 0][o];
    }
    for (let r = 0; r < H; r++) { if (b[r * W + 3] === t) s += 4; else if (b[r * W + 3]) s -= 4; }
    return s;
  }
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  const ops = {
    moves(p) { return ORDER.filter((c) => p.h[c] < H); },
    make(p, c) {
      const r = H - 1 - p.h[c], idx = r * W + c;
      p.b[idx] = p.t; p.h[c]++;
      const u = { c, idx, pt: p.t, pw: p.won };
      p.won = !!lineAt(p.b, r, c, p.t);
      p.t = 3 - p.t; p.n++;
      return u;
    },
    unmake(p, u) { p.b[u.idx] = 0; p.h[u.c]--; p.t = u.pt; p.won = u.pw; p.n--; },
    over(p, ply) { if (p.won) return -100000 + ply; if (p.n === W * H) return 0; return null; },
    eval(p) { return evalPos(p.b, p.t); },
  };
  regGame({
    id: 'connect4', name: 'Vier gewinnt', emoji: '🔴', min: 2, max: 2,
    blurb: 'Lass deine Scheiben fallen und verbinde vier in einer Reihe.',
    seatLabels: ['Rot', 'Gelb'],
    seatColor(seat) { return ['#e5484d', '#f5b800'][seat]; },
    rules: `<h4>Ziel</h4><p>Bringe als Erste/r <b>vier deiner Scheiben in eine Reihe</b> – waagerecht, senkrecht oder diagonal.</p>
<h4>Ablauf</h4><p>Ihr werft abwechselnd eine Scheibe in eine der sieben Spalten. Sie fällt bis ganz nach unten oder bis auf die oberste Scheibe in dieser Spalte.</p>
<h4>Ende</h4><p>Wer zuerst vier in einer Reihe hat, gewinnt. Ist das Brett voll, ist es unentschieden.</p>
<h4>Tipps</h4><p>Die mittlere Spalte ist besonders wertvoll. Achte auf Doppel-Drohungen: Wenn du zwei Gewinnmöglichkeiten gleichzeitig schaffst, kann dein Gegenüber nur eine verhindern.</p>`,
    init(n, o, seed) {
      return { b: new Array(W * H).fill(0), t: (o && o.start) ? 1 : 0, last: null, win: null, over: false, draw: false, rng: seed | 0 };
    },
    turn(s) { return s.over ? -1 : s.t; },
    legal(s, seat) {
      if (s.over || s.t !== seat) return [];
      const r = []; for (let c = 0; c < W; c++) if (!s.b[c]) r.push(c); return r;
    },
    apply(s, seat, c) {
      let r = H - 1; while (s.b[r * W + c]) r--;
      s.b[r * W + c] = seat + 1; s.last = { r, c };
      const w = lineAt(s.b, r, c, seat + 1);
      if (w) { s.win = w; s.over = true; }
      else if (s.b.every((x) => x)) { s.over = true; s.draw = true; }
      else s.t = 1 - s.t;
    },
    view(s) { return s; },
    result(s) {
      if (!s.over) return null;
      if (s.draw) return { winners: [], draw: true };
      return { winners: [s.b[s.win[0]] - 1] };
    },
    bot(s, seat, lv) {
      const p = { b: Int8Array.from(s.b), t: seat + 1, won: false, n: s.b.filter((x) => x).length, h: new Array(W).fill(0) };
      for (let c = 0; c < W; c++) { let k = 0; for (let r = H - 1; r >= 0 && s.b[r * W + c]; r--) k++; p.h[c] = k; }
      const mv = ops.moves(p);
      if (lv === 1 && Math.random() < 0.4) return rpick(mv);
      const depth = lv === 1 ? 2 : lv === 2 ? 4 : 9;
      const res = negamaxRoot(p, ops, depth, { ms: lv === 3 ? 1100 : 400, iter: lv === 3, tol: lv === 3 ? 0 : 3 });
      return res.m;
    },
    render(root, v, c) {
      const win = new Set(v.win || []);
      let h = '<div class="c4">';
      for (let col = 0; col < W; col++) {
        const ok = c.my && c.legal.includes(col);
        h += '<button class="c4col" data-c="' + col + '"' + (ok ? ' data-ok="1"' : ' tabindex="-1"') + ' aria-label="Spalte ' + (col + 1) + '">';
        for (let r = 0; r < H; r++) {
          const x = v.b[r * W + col];

        }
      }
      g += '</svg>';
      // Würfel

      let dice = '<div class="mdice">';
      const turnCol = col(S.t);
      if (c.my && S.die == null && !S.over) dice += '<button class="rollbtn" style="--c:' + turnCol + '">🎲 Würfeln</button>' + (S.rolls > 1 ? '<span class="dnote">noch ' + S.rolls + ' Versuche</span>' : '');

      else dice += '<span class="dnote">&nbsp;</span>';
      dice += '</div>';
      root.innerHTML = g + dice;
      const rb = root.querySelector('.rollbtn'); if (rb) rb.onclick = () => c.send({ k: 'roll' });
      root.querySelectorAll('.pc.mv').forEach((el) => { el.addEventListener('click', () => c.send({ k: 'mv', piece: +el.dataset.p })); });
    },
  });
})();

/* ===== Mau-Mau ===== */
(function () {
  const SUITS = ['c', 's', 'h', 'd'];
  const SYM = { c: '♣', s: '♠', h: '♥', d: '♦' };
  const SNAME = { c: 'Kreuz', s: 'Pik', h: 'Herz', d: 'Karo' };
  const RANKS = ['7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
  const RLAB = { T: '10', J: 'B', Q: 'D', K: 'K', A: 'A' };
  const suit = (c) => c[0], rank = (c) => c[1];
  const ORD = (c) => SUITS.indexOf(suit(c)) * 10 + RANKS.indexOf(rank(c));

  function newDeck(S) { const d = []; for (const s of SUITS) for (const r of RANKS) d.push(s + r); return shuffle(S, d); }
  function refill(S) {
    if (S.draw.length) return;
    const top = S.disc.pop();
    S.draw = shuffle(S, S.disc); S.disc = [top];
  }
  function take(S, k) {
    const out = [];
    for (let i = 0; i < k; i++) { refill(S); if (!S.draw.length) break; out.push(S.draw.pop()); }
    return out;
  }
  const top = (S) => S.disc[S.disc.length - 1];
  const effSuit = (S) => S.wish || suit(top(S));
  function playable(S, hand, card) {
    if (S.pend > 0) return rank(card) === '7';
    if (hand.length === 1 && rank(card) === 'J') return false;
    if (rank(card) === 'J') return rank(top(S)) !== 'J';
    return suit(card) === effSuit(S) || rank(card) === rank(top(S));
  }
  function playMoves(S, hand, only) {
    const out = [];
    for (const card of hand) {
      if (only && card !== only) continue;
      if (!playable(S, hand, card)) continue;
      const wishes = rank(card) === 'J' ? SUITS : [null];
      for (const w of wishes) {
        const base = w ? { k: 'play', card, wish: w } : { k: 'play', card };
        if (hand.length === 2) { out.push(Object.assign({}, base, { mau: false }), Object.assign({}, base, { mau: true })); } else out.push(base);

  const nextSeat = (S, s) => (s + 1) % S.n;
  function endTurn(S, seat, skip) {
    S.drew = false; S.drawn = null;
    let t = nextSeat(S, seat);
    if (skip) t = nextSeat(S, t);
    S.t = t;
  }

  regGame({
    id: 'maumau', name: 'Mau-Mau', emoji: '🃏', min: 2, max: 4,
    blurb: 'Werde alle Karten los – aber vergiss nicht „Mau“ zu sagen!',
    seatLabels: ['Spieler 1', 'Spieler 2', 'Spieler 3', 'Spieler 4'],
    rules: `<h4>Ziel</h4><p>Werde als Erste/r <b>alle deine Handkarten los</b>.</p>
<h4>Ablauf</h4><p>Jede/r bekommt 5 Karten (zu zweit 6). Du darfst eine Karte ablegen, die in <b>Farbe</b> (♣ ♠ ♥ ♦) <b>oder Wert</b> zur obersten Karte passt. Kannst oder willst du nicht, ziehst du eine Karte; passt sie, darfst du sie sofort ablegen.</p>
<h4>Sonderkarten</h4><p><b>7</b>: Der nächste Spieler muss <b>2 Karten ziehen</b> – oder er legt selbst eine 7 dagegen, dann wird die Strafe weitergegeben (+2 mehr).<br><b>8</b>: Der nächste Spieler muss <b>aussetzen</b>.<br><b>Bube (B)</b>: Lege ihn auf jede Karte (außer auf einen Buben) und <b>wünsche dir eine Farbe</b>. Mit einem Buben darfst du nicht gewinnen.</p>
<h4>Mau!</h4><p>Hast du nach dem Ablegen nur noch <b>eine Karte</b>, musst du vorher <b>„Mau!“</b> ansagen (Knopf antippen, dann die Karte legen). Vergisst du es, bekommst du <b>2 Strafkarten</b>.</p>
<h4>Tipp</h4><p>Bewahre den Buben für schwierige Situationen auf und wünsche dir die Farbe, die du am meisten auf der Hand hast.</p>`,
    init(n, o, seed) {
      const S = { n, hands: [], draw: [], disc: [], t: (o && o.start) ? (o.start % n) : 0, pend: 0, wish: null, drew: false, drawn: null, last: null, over: false, win: null, rng: seed | 0 };
      S.draw = newDeck(S);
      const k = n === 2 ? 6 : 5;

      for (let r = 0; r < k; r++) for (let i = 0; i < n; i++) S.hands[i].push(S.draw.pop());
      // Startkarte: kein Bube
      let c = S.draw.pop();
      while (rank(c) === 'J' || rank(c) === '7' || rank(c) === '8') { S.draw.unshift(c); c = S.draw.pop(); }
      S.disc.push(c);

    },
    turn(S) { return S.over ? -1 : S.t; },
    legal(S, seat) {

      const hand = S.hands[seat];
      if (S.drew) return playMoves(S, hand, S.drawn).concat([{ k: 'pass' }]);
      return playMoves(S, hand).concat([{ k: 'draw' }]);
    },
    apply(S, seat, m) {
      const hand = S.hands[seat];
      S.last = { seat, k: m.k, card: m.card || null, wish: m.wish || null, n: 0 };
      if (m.k === 'pass') { endTurn(S, seat, false); return; }
      if (m.k === 'draw') {
        if (S.pend > 0) { const got = take(S, S.pend); hand.push(...got); S.last.n = got.length; S.pend = 0; endTurn(S, seat, false); return; }
        const got = take(S, 1); hand.push(...got); S.last.n = got.length;
        if (got.length && playable(S, hand, got[0])) { S.drew = true; S.drawn = got[0]; } else endTurn(S, seat, false);
        return;
      }
      // play
      hand.splice(hand.indexOf(m.card), 1);
      S.disc.push(m.card);
      S.wish = rank(m.card) === 'J' ? m.wish : null;
      if (!hand.length) { S.over = true; S.win = seat; return; }
      if (hand.length === 1 && !m.mau) { const got = take(S, 2); hand.push(...got); S.last.pen = got.length; }
      const r = rank(m.card);

    bot(S, seat, lv) {
      const hand = S.hands[seat];
      const plays = (S.drew ? playMoves(S, hand, S.drawn) : playMoves(S, hand));
      const canPass = S.drew;
      const nextN = S.hands[nextSeat(S, seat)].length;
      const announce = lv === 1 ? Math.random() < 0.6 : lv === 2 ? Math.random() < 0.9 : true;
      if (!plays.length) return canPass ? { k: 'pass' } : { k: 'draw' };
      const fixMau = (m) => (m.mau === undefined ? m : Object.assign({}, m, { mau: announce }));
      const uniq = (arr) => arr.filter((m) => m.mau === undefined || m.mau === announce);
      const cand = uniq(plays);
      if (lv === 1) {
        if (!S.drew && S.pend === 0 && Math.random() < 0.12) return { k: 'draw' };
        return rpick(cand);
      }
      const counts = {}; hand.forEach((c) => { counts[suit(c)] = (counts[suit(c)] || 0) + 1; });
      const scored = cand.map((m) => {
        let sc = Math.random() * (lv === 2 ? 6 : 1);
        const r = rank(m.card);
        const rest = hand.filter((c) => c !== m.card);
        if (r === 'J') {
          sc -= lv === 3 ? 28 : 15;
          if (rest.length <= 3 || nextN <= 2) sc += 20;
          // beste Wunschfarbe: häufigste Farbe der Restkarten
          const rc = {}; rest.forEach((c) => { rc[suit(c)] = (rc[suit(c)] || 0) + 1; });
          const score = (s) => (rc[s] || 0) * 3 + Math.random();
          const best = SUITS.slice().sort((a, b) => score(b) - score(a))[0];
          if (m.wish !== best) sc -= 100;
        } else {
          sc += (counts[suit(m.card)] || 0) * 2;
          if (r === '7') sc += nextN <= 3 ? 14 : 5;
          if (r === '8') sc += nextN <= 2 ? 14 : 4;
          if (S.pend > 0 && r === '7') sc += 30;
          // passende Zweitkarte bevorzugen: Karte, nach der noch etwas passt
          if (lv === 3) { const sameSuit = rest.filter((c) => suit(c) === suit(m.card)).length; sc += sameSuit; }
        }
        return { m, s: sc };
      });
      return bestOf(scored, 0);

      h += '</div>';

      // Wunschfarbe
      if (ui.wishFor && c.my) {
        h += '<div class="wishpick"><span>Wunschfarbe:</span>' + SUITS.map((s) => '<button class="wb' + (s === 'h' || s === 'd' ? ' red' : '') + '" data-w="' + s + '">' + SYM[s] + '</button>').join('') + '<button class="wc" data-w="">✕</button></div>';

      h += '<div class="acts">' + (c.my && needMau ? '<button class="maub' + (ui.mau ? ' on' : '') + '">📣 Mau!' + (ui.mau ? ' ✔' : '') + '</button>' : '') + (c.my && canPass ? '<button class="passb">Passen</button>' : '') + '</div></div>';
      root.innerHTML = h;

        let m = L.find((x) => x.k === 'play' && x.card === card && (x.wish || null) === (wish || null) && (x.mau === undefined || x.mau === (needMau ? ui.mau : false)));
        if (!m) m = L.find((x) => x.k === 'play' && x.card === card && (x.wish || null) === (wish || null));

        b.onclick = () => {

      const pb = root.querySelector('.passb'); if (pb) pb.onclick = () => c.send({ k: 'pass' });

    },
  });
})();

/* ===== Farbduell (Kartenspiel in UNO-Art) ===== */
(function () {
  const COLS = ['r', 'y', 'g', 'b'];
  const CNAME = { r: 'Rot', y: 'Gelb', g: 'Grün', b: 'Blau', w: 'Joker' };
  const CSYM = { r: '●', y: '▲', g: '■', b: '◆' };
  const VLAB = { S: '⛔', R: '⇄', D: '+2', W: '🌈', F: '+4' };
  const col = (c) => c[0], val = (c) => c[1];
  const isWild = (c) => c[0] === 'w';

  function newDeck(S) {
    const d = [];
    for (const c of COLS) {
      d.push(c + '0');
      for (let v = 1; v <= 9; v++) d.push(c + v, c + v);
      for (const a of ['S', 'R', 'D']) d.push(c + a, c + a);
    }
    for (let i = 0; i < 4; i++) d.push('wW', 'wF');
    return shuffle(S, d);
  }
  function refill(S) {
    if (S.draw.length) return;
    const top = S.disc.pop();
    S.draw = shuffle(S, S.disc.map((x) => x)); S.disc = [top];
  }
  function take(S, k) { const o = []; for (let i = 0; i < k; i++) { refill(S); if (!S.draw.length) break; o.push(S.draw.pop()); } return o; }
  const top = (S) => S.disc[S.disc.length - 1];
  function playable(S, hand, card) {
    if (card === 'wW') return true;
    if (card === 'wF') return !hand.some((c) => !isWild(c) && col(c) === S.color);
    return col(card) === S.color || (!isWild(top(S)) && val(card) === val(top(S)));
  }
  function playMoves(S, hand, only) {
    const out = [], seen = new Set();
    for (const card of hand) {
      if (only && card !== only) continue;
      if (seen.has(card)) continue; seen.add(card);
      if (!playable(S, hand, card)) continue;
      const cols = isWild(card) ? COLS : [null];
      for (const cc of cols) {
        const base = cc ? { k: 'play', card, color: cc } : { k: 'play', card };
        if (hand.length === 2) out.push(Object.assign({}, base, { uno: false }), Object.assign({}, base, { uno: true })); else out.push(base);
      }
    }
    return out;
  }
  const step = (S, from, k) => ((from + S.dir * k) % S.n + S.n) % S.n;
  const ORD = (c) => (isWild(c) ? 900 + (val(c) === 'W' ? 0 : 1) : COLS.indexOf(col(c)) * 100 + (isNaN(+val(c)) ? 50 + 'SRD'.indexOf(val(c)) : +val(c)));

  regGame({
    id: 'farbduell', name: 'Farbduell (UNO-Art)', emoji: '🎴', min: 2, max: 4,
    blurb: 'Farbe oder Zahl bedienen, Aktionskarten nutzen – und „Uno!“ rufen.',
    seatLabels: ['Spieler 1', 'Spieler 2', 'Spieler 3', 'Spieler 4'],
    rules: `<h4>Ziel</h4><p>Werde als Erste/r <b>alle Handkarten los</b>. Jede/r startet mit 7 Karten.</p>
<h4>Ablauf</h4><p>Lege eine Karte, die in <b>Farbe</b> oder <b>Zahl/Symbol</b> zur obersten Karte passt. Hast du nichts Passendes (oder willst du nicht), ziehst du eine Karte. Passt sie, darfst du sie sofort legen – sonst bist du fertig.</p>
<h4>Aktionskarten</h4><p><b>⛔ Aussetzen</b>: Der nächste Spieler wird übersprungen.<br><b>⇄ Richtungswechsel</b>: Die Spielrichtung dreht sich um (zu zweit wie „Aussetzen“).<br><b>+2</b>: Der nächste Spieler zieht 2 Karten und setzt aus.<br><b>🌈 Farbwahl</b>: Passt immer. Du wählst die neue Farbe.<br><b>+4</b>: Du wählst die Farbe, der nächste Spieler zieht <b>4</b> Karten und setzt aus. Erlaubt nur, wenn du <b>keine Karte der aktuellen Farbe</b> auf der Hand hast!</p>
<h4>Uno!</h4><p>Hast du nach dem Ablegen nur noch <b>eine Karte</b>, musst du vorher <b>„Uno!“</b> ansagen (Knopf antippen, dann die Karte legen). Vergisst du es, bekommst du <b>2 Strafkarten</b>.</p>
<h4>Hinweis</h4><p>Das ist ein eigenes Spiel nach dem bekannten Prinzip der Ablegespiele – ohne Markenkarten. Die Startkarte hat keine Wirkung.</p>`,
    init(n, o, seed) {
      const S = { n, hands: [], draw: [], disc: [], t: (o && o.start) ? (o.start % n) : 0, dir: 1, color: 'r', drew: false, drawn: null, last: null, over: false, win: null, rng: seed | 0 };
      S.draw = newDeck(S);
      for (let i = 0; i < n; i++) S.hands.push([]);
      for (let r = 0; r < 7; r++) for (let i = 0; i < n; i++) S.hands[i].push(S.draw.pop());
      let c = S.draw.pop();
      while (isWild(c) || isNaN(+val(c))) { S.draw.unshift(c); c = S.draw.pop(); }
      S.disc.push(c); S.color = col(c);
      return S;
    },
    turn(S) { return S.over ? -1 : S.t; },
    legal(S, seat) {

      if (S.drew) return playMoves(S, hand, S.drawn).concat([{ k: 'pass' }]);
      return playMoves(S, hand).concat([{ k: 'draw' }]);
    },
    apply(S, seat, m) {
      const hand = S.hands[seat];
      S.last = { seat, k: m.k, card: m.card || null, color: m.color || null, n: 0 };
      if (m.k === 'pass') { S.drew = false; S.drawn = null; S.t = step(S, seat, 1); return; }
      if (m.k === 'draw') {
        const got = take(S, 1); hand.push(...got); S.last.n = got.length;
        if (got.length && playable(S, hand, got[0])) { S.drew = true; S.drawn = got[0]; } else { S.drew = false; S.drawn = null; S.t = step(S, seat, 1); }
        return;
      }
      hand.splice(hand.indexOf(m.card), 1);
      S.disc.push(m.card);
      S.drew = false; S.drawn = null;
      S.color = isWild(m.card) ? m.color : col(m.card);

      if (hand.length === 1 && !m.uno) { const got = take(S, 2); hand.push(...got); S.last.pen = got.length; }

      else if (v === 'R') { if (S.n === 2) skip = 1; else S.dir = -S.dir; }

    bot(S, seat, lv) {

/* ===== Schlangen & Leitern (mit zwei Würfeln zur Wahl) ===== */
(function () {
  const COLORS = ['#e5484d', '#3e8ef7', '#f5b800', '#30a46c'];
  const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
  const SNAKES = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
  const land = (p) => (LADDERS[p] != null ? LADDERS[p] : SNAKES[p] != null ? SNAKES[p] : p);
  function xy(n) {
    if (n <= 0) return [5, 105];
    const row = Math.floor((n - 1) / 10), ci = (n - 1) % 10, colx = row % 2 === 0 ? ci : 9 - ci;
    return [colx * 10 + 5, (9 - row) * 10 + 5];
  }
  const uses = (S, seat) => [0, 1].filter((d) => S.pos[seat] + S.dice[d] <= 100);

  regGame({
    id: 'schlangen', name: 'Schlangen & Leitern', emoji: '🐍', min: 2, max: 4,
    blurb: 'Klettere Leitern hinauf, weiche Schlangen aus – du wählst einen von zwei Würfeln!',
    seatLabels: ['Rot', 'Blau', 'Gelb', 'Grün'],
    seatColor(seat) { return COLORS[seat]; },
    seatName(seat) { return ['Rot', 'Blau', 'Gelb', 'Grün'][seat]; },
    rules: `<h4>Ziel</h4><p>Erreiche als Erste/r das Feld <b>100</b>.</p>
<h4>Ablauf</h4><p>Du würfelst mit <b>zwei Würfeln</b> und suchst dir <b>einen</b> der beiden aus. Mit diesem ziehst du deine Figur vorwärts. Der andere Würfel verfällt.</p>
<h4>Leitern 🪜</h4><p>Landest du am Fuß einer Leiter, kletterst du bis nach oben.</p>
<h4>Schlangen 🐍</h4><p>Landest du auf dem Kopf einer Schlange, rutschst du bis zum Schwanz hinunter.</p>
<h4>Ziel</h4><p>Du musst <b>genau</b> auf die 100 kommen. Ist ein Würfel zu groß, kannst du ihn nicht nehmen. Kannst du keinen der beiden benutzen, setzt du aus.</p>
<h4>Tipp</h4><p>Schau dir beide Würfel an: Führt einer auf eine Leiter oder – noch wichtiger – auf eine Schlange? Denke auch daran, wo du nach dem Zug stehst.</p>`,
    init(n, o, seed) {
      return { n, pos: new Array(n).fill(0), t: (o && o.start) ? (o.start % n) : 0, dice: null, last: null, lastRoll: null, over: false, win: null, rng: seed | 0 };
    },
    turn(S) { return S.over ? -1 : S.t; },
    legal(S, seat) {
      if (S.over || S.t !== seat) return [];
      if (!S.dice) return [{ k: 'roll' }];
      return uses(S, seat).map((d) => ({ k: 'use', d }));
    },
    apply(S, seat, m) {
      const next = (seat + 1) % S.n;
      if (m.k === 'roll') {
        S.dice = [1 + rint(S, 6), 1 + rint(S, 6)];
        S.lastRoll = { seat, dice: S.dice.slice(), none: false };
        if (!uses(S, seat).length) { S.lastRoll.none = true; S.dice = null; S.t = next; }
        return;
      }
      const from = S.pos[seat], v = S.dice[m.d];
      let to = from + v; const raw = to;
      to = land(to);
      S.pos[seat] = to;
      S.last = { seat, from, raw, to, die: v, via: to > raw ? 'ladder' : to < raw ? 'snake' : null };
      S.dice = null;
      if (to === 100) { S.over = true; S.win = seat; return; }
      S.t = next;
    },
    view(S) { return S; },
    result(S) { return S.over ? { winners: [S.win] } : null; },
    bot(S, seat, lv) {
      if (!S.dice) return { k: 'roll' };
      const us = uses(S, seat);
      const p = S.pos[seat];
      if (lv === 1) return { k: 'use', d: rpick(us) };
      const fin = (d) => land(p + S.dice[d]);
      if (lv === 2) return { k: 'use', d: bestOf(us.map((d) => ({ m: d, s: fin(d) + Math.random() })), 0) };
      // Stufe 3: Ein-Schritt-Erwartung über alle 36 Würfelpaare
      const sc = us.map((d) => {
        const f = fin(d);
        if (f === 100) return { m: d, s: 1e6 };
        let sum = 0;
        for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) {
          let best = f;
          for (const x of [a, b]) if (f + x <= 100) { const g = land(f + x); if (g > best) best = g; }
          sum += best;
        }
        return { m: d, s: f * 0.3 + sum / 36 };
      });
      return { k: 'use', d: bestOf(sc, 0.0001) };
    },
    info(v) { return v.pos.map((p, i) => ['🔴', '🔵', '🟡', '🟢'][i] + ' ' + p).join('  ·  '); },
    render(root, S, c) {
      const L = c.my ? c.legal : [];
      let g = '<svg class="sl" viewBox="0 0 100 112" role="img" aria-label="Spielbrett">';
      for (let n = 1; n <= 100; n++) {
        const [x, y] = xy(n);
        const alt = (Math.floor((n - 1) / 10) + (n - 1)) % 2;
        g += '<rect class="sl-c' + (alt ? ' a' : '') + (n === 100 ? ' goal' : '') + '" x="' + (x - 5) + '" y="' + (y - 5) + '" width="10" height="10"/><text class="sl-n" x="' + (x - 4.2) + '" y="' + (y - 2.6) + '">' + n + '</text>';
      }
      for (const a in LADDERS) {
        const [x1, y1] = xy(+a), [x2, y2] = xy(LADDERS[a]);
        const dx = y2 - y1, dy = x1 - x2, len = Math.hypot(dx, dy) || 1, ox = (dx / len) * 1.3, oy = (dy / len) * 1.3;
        g += '<g class="sl-lad"><line x1="' + (x1 + ox) + '" y1="' + (y1 + oy) + '" x2="' + (x2 + ox) + '" y2="' + (y2 + oy) + '"/><line x1="' + (x1 - ox) + '" y1="' + (y1 - oy) + '" x2="' + (x2 - ox) + '" y2="' + (y2 - oy) + '"/>';
        const steps = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 5));
        for (let k = 1; k < steps; k++) { const f = k / steps; g += '<line class="rung" x1="' + (x1 + ox + (x2 - x1) * f) + '" y1="' + (y1 + oy + (y2 - y1) * f) + '" x2="' + (x1 - ox + (x2 - x1) * f) + '" y2="' + (y1 - oy + (y2 - y1) * f) + '"/>'; }
        g += '</g>';
      }
      for (const a in SNAKES) {
        const [x1, y1] = xy(+a), [x2, y2] = xy(SNAKES[a]);
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = y2 - y1, dy = x1 - x2, len = Math.hypot(dx, dy) || 1;
        const bend = ((+a) % 2 ? 1 : -1) * 7;
        const cx = mx + (dx / len) * bend, cy = my + (dy / len) * bend;
        g += '<g class="sl-snk"><path d="M' + x1 + ' ' + y1 + ' Q' + cx + ' ' + cy + ' ' + x2 + ' ' + y2 + '"/><circle class="head" cx="' + x1 + '" cy="' + y1 + '" r="2.2"/><circle class="eye" cx="' + (x1 - 0.7) + '" cy="' + (y1 - 0.6) + '" r="0.4"/><circle class="eye" cx="' + (x1 + 0.7) + '" cy="' + (y1 - 0.6) + '" r="0.4"/></g>';
      }
      const slots = {};
      S.pos.forEach((p, i) => {
        const k = p; slots[k] = (slots[k] || 0) + 1;
        const [x, y] = xy(p);
        const idx = slots[k] - 1, ox = ((idx % 2) ? 2.2 : -2.2) * (S.pos.filter((q) => q === p).length > 1 ? 1 : 0), oy = (idx > 1 ? 2.2 : 0) + (idx > 1 ? 0 : 0);
        const px = p === 0 ? 14 + i * 24 : x + ox + 0.8, py = p === 0 ? 105 : y + 2.2 + oy;
        g += '<g class="tok' + (S.last && S.last.seat === i ? ' lastp' : '') + '" transform="translate(' + px + ' ' + py + ')" style="--c:' + COLORS[i] + '"><circle r="3"/><text y="1.1">' + (i + 1) + '</text></g>';
      });
      g += '</svg>';
      let d = '<div class="mdice">';
      const col = COLORS[S.t];
      if (c.my && !S.dice && !S.over) d += '<button class="rollbtn" style="--c:' + col + '">🎲 Würfeln</button>';
      else if (S.dice) {
        d += S.dice.map((v, i) => '<button class="dface big' + (L.some((m) => m.d === i) ? ' ok' : ' no') + '" data-d="' + i + '" style="--c:' + col + '">' + DIE_FACE[v] + '</button>').join('');
        d += '<span class="dnote">' + (c.my ? 'Tippe einen Würfel an' : '') + '</span>';
      } else if (S.lastRoll) {
        d += S.lastRoll.dice.map((v) => '<span class="dface" style="--c:' + COLORS[S.lastRoll.seat] + '">' + DIE_FACE[v] + '</span>').join('') + '<span class="dnote">' + (S.lastRoll.none ? 'kein Zug möglich' : '') + '</span>';
      }
      d += '</div>';
      root.innerHTML = g + d;
      const rb = root.querySelector('.rollbtn'); if (rb) rb.onclick = () => c.send({ k: 'roll' });
      root.querySelectorAll('.dface.ok').forEach((b) => { b.onclick = () => c.send({ k: 'use', d: +b.dataset.d }); });
    },
  });
})();

    const peer = new Peer({ debug: 0 }); App.peer = peer;
    peer.on('open', () => {

/* ---------- Spielstart & Zugfluss (Host) ---------- */

  App.phase = 'play'; App.ver = 0; App.resVer = -1;

}

    v: g.view(App.st, seat), lg: t === seat ? g.legal(App.st, seat) : [], res: g.result(App.st),

}

  onState(JSON.parse(JSON.stringify(makeMsg(0))), first);

}

  const g = GAMES[App.gid];
  if (g.turn(App.st) !== seat) return false;
  if (!g.legal(App.st, seat).some((x) => same(x, m))) return false;
  g.apply(App.st, seat, m);
  afterChange();
  return true;
}

  clearTimeout(App.botTimer); App.thinking = -1;
  if (App.phase !== 'play' || !App.st) return;
  const g = GAMES[App.gid], t = g.turn(App.st);
  if (t < 0 || App.seats[t].kind !== 'bot') return;
  App.thinking = t;
  const ver = App.ver;
  const delay = window.__salonFast ? 4 : 650 + Math.random() * 350;
  App.botTimer = setTimeout(() => {
    if (App.phase !== 'play' || App.ver !== ver) return;
    setTimeout(() => {
      if (App.phase !== 'play' || App.ver !== ver) return;
      let m;
      try { m = g.bot(clone(App.st), t, App.seats[t].level || 2); } catch (e) { console.error(e); m = null; }
      const lg = g.legal(App.st, t);

  el.innerHTML = '<h3>' + title + '</h3>' + (r.text ? '<p class="mut">' + esc(r.text) + '</p>' : '') +
    (host ? '<div class="row wrap c"><button class="btn pri" id="rAgain">🔁 Nochmal spielen</button>' + (App.peer ? '<button class="btn" id="rLobby">👥 Zur Lobby</button>' : '') + '<button class="btn ghost" id="rMenu">⌂ Spielauswahl</button></div>'
      : '<p class="hint">Der Host kann eine neue Runde starten …</p><div class="row wrap c"><button class="btn ghost" id="rMenu">⌂ Raum verlassen</button></div>');
  const a = $('rAgain'); if (a) a.onclick = hostRematch;
  const l = $('rLobby'); if (l) l.onclick = hostToLobby;
  $('rMenu').onclick = () => leaveAll();
  if (!el.dataset.shown || el.dataset.shown !== String(m.ver)) { el.dataset.shown = String(m.ver); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}
function hideResult() { const el = $('gResult'); el.className = 'gresult'; el.innerHTML = ''; delete el.dataset.shown; }

/* ---------- Verlassen / Aufräumen ---------- */
function leaveAll(remote) {
  const was = App.role;
  clearTimeout(App.botTimer);
  if (was === 'host') { App.seats.forEach((s) => { if (s.kind === 'peer' && s.conn) { try { s.conn.send({ t: 'end' }); } catch (e) { /* weg */ } } }); }
  else if (App.conn && !remote) { try { App.conn.send({ t: 'bye' }); } catch (e) { /* weg */ } }
  const oldPeer = App.peer;
  setTimeout(() => { try { if (oldPeer) oldPeer.destroy(); } catch (e) { /* weg */ } }, 200);
  App.role = null; App.phase = 'menu'; App.st = null; App.msg = null; App.seats = []; App.conn = null; App.peer = null; App.net = 'off'; App.code = ''; App.thinking = -1; App.sentVer = -1;
  hideResult(); closeModal();
  $('busy').classList.remove('on');
  show('sMenu'); buildMenu();
}

/* ---------- Start ---------- */
function boot() {
  me.name = store.get('name', ''); me.av = store.get('av', AVATARS[Math.floor(Math.random() * AVATARS.length)]);
  prefs.hints = store.get('hints', true); prefs.snd = store.get('snd', true); prefs.lvl = store.get('lvl', 2);
  $('inName').value = me.name;
  $('inName').addEventListener('change', () => { me.name = cleanName($('inName').value); if ($('inName').value.trim()) store.set('name', me.name); });
  $('avBtn').onclick = () => { me.av = AVATARS[(AVATARS.indexOf(me.av) + 1) % AVATARS.length]; store.set('av', me.av); $('avBtn').textContent = me.av; };
  buildMenu();
  const jc = (new URLSearchParams(location.search).get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  if (jc) { $('inCode').value = jc; const n = $('joinNote'); n.hidden = false; n.innerHTML = '🎟️ Du wurdest in Raum <b>' + esc(jc) + '</b> eingeladen. Wähle Namen und Figur und tippe auf <b>Beitreten</b>.'; }
  document.addEventListener('pointerdown', () => Snd.init(), { passive: true });
  $('btnJoin').onclick = () => joinRoom($('inCode').value);
  $('inCode').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  $('inCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom($('inCode').value); });
  $('btnRules').onclick = () => { if (App.msg) showRules(App.msg.g); };
  $('btnHint').onclick = () => { prefs.hints = !prefs.hints; store.set('hints', prefs.hints); renderGame(); };
  $('btnSnd').onclick = () => { prefs.snd = !prefs.snd; store.set('snd', prefs.snd); $('btnSnd').textContent = prefs.snd ? '🔊' : '🔇'; Snd.init(); };
  $('btnQuit').onclick = () => {
    if (App.msg && !App.msg.res && !confirm('Spiel wirklich verlassen?')) return;
    if (App.role === 'host' && App.seats.some((s) => s.kind === 'peer') && App.msg && App.msg.res) { hostToLobby(); return; }
    leaveAll();
  };
  window.addEventListener('beforeunload', () => { try { if (App.role === 'host') App.seats.forEach((s) => { if (s.conn) s.conn.send({ t: 'end' }); }); else if (App.conn) App.conn.send({ t: 'bye' }); } catch (e) { /* weg */ } });
}
document.addEventListener('DOMContentLoaded', boot);

window.__salon = { App, GAMES, prefs, me, hostMove, startSolo, openLobby, joinRoom, leaveAll, startGame, setSeat, hostRematch };
})();
</script>
<script defer data-category="schule" src="protect.js"></script>
</body>
