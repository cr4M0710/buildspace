<style>

.mod.done{border-color:var(--ok)}.mod.done::after{content:"✅";position:absolute;right:14px;top:12px;font-size:1.3rem}

  a{color:#000;text-decoration:none}
}

<script>
/* ===== Kern: Mathe-Helfer, Zufall, SVG-Skizzen ===== */
const D2R = Math.PI / 180;
const sinD = x => Math.sin(x * D2R), cosD = x => Math.cos(x * D2R), tanD = x => Math.tan(x * D2R);
const asinD = x => Math.asin(x) / D2R, acosD = x => Math.acos(x) / D2R, atanD = x => Math.atan(x) / D2R;
const round = (x, d = 2) => { const f = 10 ** d; return Math.round((x + Number.EPSILON * Math.sign(x)) * f) / f; };
const fmt = (x, d = 2) => { let r = round(x, d); if (Object.is(r, -0)) r = 0; return String(r).replace('.', ','); };
const deg = (x, d = 2) => fmt(x, d) + '°';
const fr = (z, n) => `<span class="fr"><span>${z}</span><span>${n}</span></span>`;
const RADMSG = 'Dein Ergebnis passt zum Bogenmaß-Modus (RAD). Stelle den Taschenrechner auf <b>DEG</b> (Gradmaß)!';
const SINCOS = 'Du hast vermutlich Sinus und Kosinus vertauscht. Prüfe: Liegt die gesuchte Seite <b>an</b> oder <b>gegenüber</b> vom Winkel?';
const FLIP = 'Du hast den Bruch umgedreht. Beim Umstellen: Was steht im Zähler, was im Nenner?';

function hashStr(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let s = (typeof seed === 'number' ? seed : hashStr(seed)) >>> 0;
  const f = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const r = {
    f, int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: a => a[Math.floor(f() * a.length)],
    real: (a, b, d = 1) => round(a + f() * (b - a), d),
    bool: () => f() < .5,
    shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
  };
  return r;
}

/* ---- Bausteine für Aufgabenteile ---- */
function tolFor(kind, ans) {

  g += `<polygon points="${Q.map(p => p.join(',')).join(' ')}" fill="${COL.fill}" stroke="none"/>`;

      g += `<polyline points="${p1.join(',')} ${pc.join(',')} ${p2.join(',')}" fill="none" stroke="${COL.ink}" stroke-width="1.4"/>`;
      g += `<circle cx="${V[0] + (e1[0] + e2[0]) * r * .5}" cy="${V[1] + (e1[1] + e2[1]) * r * .5}" r="1.6" fill="${COL.ink}"/>`;
    } else if (o.angles && o.angles[i]) {

    }
    if (o.names && o.names[i]) { const p = out(V, 14); g += `<text x="${p[0]}" y="${p[1]}" fill="${COL.ink}" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">${esc(o.names[i])}</text>`; }

function makeSet(m, lvl, variant, classSeed) {
  return GEN[m][lvl].map((g, i) => { const t = g(rng(`${classSeed}|${m}|${lvl}|${variant}|${i}`)); t.parts = t.parts.filter(Boolean); t.steps = t.steps.filter(Boolean); return t; });
}
function makeOne(m, lvl, seed) {
  const r = rng(seed), list = GEN[m][lvl], i = Math.floor(r.f() * list.length);
  const t = list[i](rng(seed + '|t')); t.parts = t.parts.filter(Boolean); t.steps = t.steps.filter(Boolean); t.gi = i; return t;
}

  <div class="row" style="margin-top:8px"><button class="btn sec small" data-act="pracLvl" data-l="1">★</button><button class="btn sec small" data-act="pracLvl" data-l="2">★★</button><button class="btn sec small" data-act="pracLvl" data-l="3">★★★</button><button class="btn sec small" data-act="printPractice">🖨️ Übungsblatt + Lösungen (PDF)</button>${st.passed && m < 6 ? `<button class="btn small" data-act="nextMod">Nächstes Modul ▶</button>` : ''}</div></div>`;
  h += taskHTML(t, 0, P.cur, 'prac', { num: false });

/* ---------- Abschlussauswertung ---------- */
function topicScores() {
  return MODULES.map(x => {
    const st = S.mods[x.id];
    let mod = null, prac = null, game = null;
    if (st && st.history.length) { const best = st.history.reduce((b, h) => { const v = Math.min(100, h.pct * { 1: .85, 2: 1, 3: 1.1 }[h.lvl]); return Math.max(b, v); }, 0); mod = best; }
    if (st && st.prac.log && st.prac.log.length >= 3) { const L = st.prac.log.slice(-10); prac = L.reduce((a, b) => a + b, 0) / L.length * 100; }
    const tw = S.game.towers[x.id]; if (tw && tw.length) game = tw.reduce((a, b) => a + b.c / b.n, 0) / tw.length * 100;
    const parts = [[mod, .5], [prac, .2], [game, .3]].filter(p => p[0] !== null);
    const w = parts.reduce((a, p) => a + p[1], 0);
    const score = w ? parts.reduce((a, p) => a + p[0] * p[1], 0) / w : 0;
    const cls = score >= 75 ? 'g' : score >= 50 ? 'y' : 'r';
    const lvl = st && st.history.length ? st.history[st.history.length - 1].lvl : null;
    return { m: x.id, mod, prac, game, score, cls: parts.length ? cls : 'n', lvl };
  });
}

function compareTxt(v, c) {

}

function calcInit() {
  const keys = [['sin', 'f'], ['cos', 'f'], ['tan', 'f'], ['π', 'f'], ['⌫', 'f'], ['sin⁻¹', 'f'], ['cos⁻¹', 'f'], ['tan⁻¹', 'f'], ['√', 'f'], ['x²', 'f'], ['7'], ['8'], ['9'], ['('], [')'], ['4'], ['5'], ['6'], ['×'], ['÷'], ['1'], ['2'], ['3'], ['+'], ['−'], ['0'], [','], ['C', 'f'], ['Ans', 'f'], ['=', 'eq']];
  $('#calc').innerHTML = `<div class="hd"><span>🧮 Rechner</span><span><button class="btn small sec" id="cMode" style="min-height:30px;padding:3px 9px">DEG</button> <button class="btn small sec" data-act="calc" style="min-height:30px;padding:3px 9px">×</button></span></div><div class="disp"><small id="cLast"></small><span id="cExpr">0</span></div><div class="keys">${keys.map(([k, c]) => `<button class="${c || ''}" data-ck="${k}">${k}</button>`).join('')}</div>`;
  $('#cMode').onclick = () => { CALC.mode = CALC.mode === 'DEG' ? 'RAD' : 'DEG'; $('#cMode').textContent = CALC.mode; };
  $('#calc').addEventListener('click', e => { const b = e.target.closest('[data-ck]'); if (b) calcKey(b.dataset.ck); });
}
function calcKey(k) {
  const map = { 'sin': 'sin(', 'cos': 'cos(', 'tan': 'tan(', 'sin⁻¹': 'asin(', 'cos⁻¹': 'acos(', 'tan⁻¹': 'atan(', '√': '√(', 'x²': '²', '×': '×', '÷': '÷', ',': ',', 'π': 'π' };
  if (k === 'C') CALC.expr = ''; else if (k === '⌫') CALC.expr = CALC.expr.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|√\(|.)$/, '');
  else if (k === 'Ans') CALC.expr += CALC.last ? '(' + CALC.last + ')' : '';
  else if (k === '=') {
    const D = CALC.mode === 'DEG';
    let s = CALC.expr.replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/²/g, '**2').replace(/π/g, '(Math.PI)').replace(/√\(/g, 'Math.sqrt(');
    s = s.replace(/(\d|\))(\(|Math|a?sin|a?cos|a?tan)/g, '$1*$2');
    const F = `const sin=x=>Math.sin(x${D ? '*Math.PI/180' : ''}),cos=x=>Math.cos(x${D ? '*Math.PI/180' : ''}),tan=x=>Math.tan(x${D ? '*Math.PI/180' : ''}),asin=x=>Math.asin(x)${D ? '*180/Math.PI' : ''},acos=x=>Math.acos(x)${D ? '*180/Math.PI' : ''},atan=x=>Math.atan(x)${D ? '*180/Math.PI' : ''};`;
    try { if (!/^[0-9.+\-*/()a-zMP\s]*$/.test(s)) throw 0; let open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length; s += ')'.repeat(Math.max(0, open)); const v = Function(F + 'return (' + s + ')')(); if (!isFinite(v)) throw 0; const r = String(round(v, 8)).replace('.', ','); $('#cLast').textContent = CALC.expr + ' ='; CALC.last = String(round(v, 10)).replace('.', ','); CALC.expr = r; } catch (e) { $('#cLast').textContent = 'Fehler – Eingabe prüfen'; }
  } else CALC.expr += map[k] || k;
  $('#cExpr').textContent = CALC.expr || '0';
}

/* ---------- Widgets der Einführungen ---------- */
function slider(id, label, min, max, step, val, unit = '') { return `<label>${label} <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span id="${id}v" style="min-width:70px;text-align:right">${fmt(val, 1)}${unit}</span></label>`; }
function mountWidget() {
  const el = $('#widget'); if (!el) return;
  const w = INTRO[view.m].widget;
  const bind = (ids, fn) => { const up = () => { ids.forEach(([id, u]) => { $('#' + id + 'v').textContent = fmt(+$('#' + id).value, 1) + u; }); fn(...ids.map(([id]) => +$('#' + id).value)); }; ids.forEach(([id]) => $('#' + id).addEventListener('input', up)); up(); };
  if (w === 'ratio') {
    el.innerHTML = `<p>Verändere den Winkel und die Größe der Rampe. Was passiert mit den Verhältnissen?</p><div class="wid">${slider('wa', 'Winkel α', 10, 80, 1, 37, '°')}${slider('wk', 'Größe', 1, 3, 0.1, 1.5, '×')}<div id="wsv"></div><div class="out" id="wo"></div></div>`;
    bind([['wa', '°'], ['wk', '×']], (a, k) => {
      const c = 2 * k, A = c * sinD(a), B = c * cosD(a), s = 52;
      const x0 = 30, y0 = 230; let g = `<svg class="sk" viewBox="0 0 360 250"><polygon points="${x0},${y0} ${x0 + B * s},${y0} ${x0 + B * s},${y0 - A * s}" fill="rgba(46,96,153,.1)" stroke="none"/><line x1="${x0}" y1="${y0}" x2="${x0 + B * s}" y2="${y0}" stroke="#1d70b8" stroke-width="4"/><line x1="${x0 + B * s}" y1="${y0}" x2="${x0 + B * s}" y2="${y0 - A * s}" stroke="#d62839" stroke-width="4"/><line x1="${x0}" y1="${y0}" x2="${x0 + B * s}" y2="${y0 - A * s}" stroke="#2a9d4b" stroke-width="4"/><path d="M${x0 + 30},${y0} A30,30 0 0 0 ${x0 + 30 * cosD(a)},${y0 - 30 * sinD(a)}" fill="none" stroke="#e08a00" stroke-width="2.5"/><text x="${x0 + 36}" y="${y0 - 8}" font-size="13" fill="#b36b00" font-weight="700">α</text></svg>`;
      $('#wsv').innerHTML = g;
      $('#wo').innerHTML = `<span class="ca">GK = ${fmt(A)}</span><span class="cb">AK = ${fmt(B)}</span><span class="cc">H = ${fmt(c)}</span><span>sin α = ${fmt(A / c, 3)}</span><span>cos α = ${fmt(B / c, 3)}</span><span>tan α = ${fmt(A / B, 3)}</span>`;
    });
  } else if (w === 'tree') {
    el.innerHTML = `<p>Verändere den Abstand und den gemessenen Winkel.</p><div class="wid">${slider('wd', 'Abstand d', 4, 30, 1, 12, ' m')}${slider('wa', 'Winkel', 10, 70, 1, 38, '°')}<div id="wsv"></div><div class="out" id="wo"></div></div>`;
    bind([['wd', ' m'], ['wa', '°']], (d, a) => {
      const x = d * tanD(a), H = x + 1.6, sc = Math.min(260 / d, 190 / H), x0 = 40, y0 = 225, tx = x0 + d * sc;
      $('#wsv').innerHTML = `<svg class="sk" viewBox="0 0 360 240"><line x1="10" y1="${y0}" x2="350" y2="${y0}" stroke="#6b8f3a" stroke-width="3"/><rect x="${tx - 5}" y="${y0 - H * sc * .45}" width="10" height="${H * sc * .45}" fill="#7a5230"/><ellipse cx="${tx}" cy="${y0 - H * sc * .62}" rx="${Math.max(14, H * sc * .28)}" ry="${H * sc * .38}" fill="#3f9b4f"/><circle cx="${x0}" cy="${y0 - 1.6 * sc - 4}" r="5" fill="#1b2a3a"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 - 1.6 * sc}" stroke="#1b2a3a" stroke-width="3"/><line x1="${x0}" y1="${y0 - 1.6 * sc}" x2="${tx}" y2="${y0 - 1.6 * sc}" stroke="#1d70b8" stroke-width="2.5" stroke-dasharray="5 3"/><line x1="${x0}" y1="${y0 - 1.6 * sc}" x2="${tx}" y2="${y0 - H * sc}" stroke="#e08a00" stroke-width="2.5"/><line x1="${tx}" y1="${y0 - 1.6 * sc}" x2="${tx}" y2="${y0 - H * sc}" stroke="#d62839" stroke-width="3"/><text x="${(x0 + tx) / 2}" y="${y0 - 1.6 * sc + 16}" font-size="12" text-anchor="middle" fill="#1d70b8">${fmt(d)} m</text><text x="${tx + 8}" y="${y0 - (1.6 + x / 2) * sc}" font-size="12" fill="#d62839" font-weight="700">x</text></svg>`;
      $('#wo').innerHTML = `<span>x = ${fmt(d)} · tan ${fmt(a, 0)}° ≈ ${fmt(x)} m</span><span>Baumhöhe ≈ ${fmt(H)} m</span>`;
    });
  } else if (w === 'island') {
    el.innerHTML = `<div class="wid">${slider('wd', 'Strecke AB', 100, 400, 10, 200, ' m')}${slider('wa', 'Winkel bei A', 30, 85, 1, 62, '°')}${slider('wb', 'Winkel bei B', 30, 85, 1, 71, '°')}<div id="wsv"></div><div class="out" id="wo"></div></div>`;
    bind([['wd', ' m'], ['wa', '°'], ['wb', '°']], (d, a, b) => {
      const g = 180 - a - b, ai = d * sinD(b) / sinD(g), bi = d * sinD(a) / sinD(g);
      $('#wsv').innerHTML = svgTri([[0, 0], [d, 0], [ai * cosD(a), ai * sinD(a)]], { names: ['A', 'B', 'I'], sides: [`${fmt(bi, 0)} m`, `${fmt(ai, 0)} m`, `${fmt(d, 0)} m`], angles: [`${a}°`, `${b}°`, `${g}°`] });
      $('#wo').innerHTML = `<span>γ = ${g}°</span><span>AI = ${fr(`${fmt(d, 0)} · sin ${b}°`, `sin ${g}°`)} ≈ ${fmt(ai)} m</span><span>BI ≈ ${fmt(bi)} m</span>`;
    });
  } else if (w === 'bike') {
    el.innerHTML = `<div class="wid">${slider('wa', 'Strecke 1', 1, 8, 0.1, 4.2, ' km')}${slider('wb', 'Strecke 2', 1, 8, 0.1, 3.5, ' km')}${slider('wg', 'Winkel dazwischen', 20, 170, 1, 105, '°')}<div id="wsv"></div><div class="out" id="wo"></div></div>`;
    bind([['wa', ' km'], ['wb', ' km'], ['wg', '°']], (s1, s2, g) => {
      const d = cside(s1, s2, g);
      $('#wsv').innerHTML = svgGen(s2, d, s1, { names: ['S', 'B', 'E'], sides: [`${fmt(s2, 1)} km`, `${fmt(d)} km`, `${fmt(s1, 1)} km`], angles: ['', `${g}°`, ''] });
      $('#wo').innerHTML = `<span>d² = ${fmt(s1, 1)}² + ${fmt(s2, 1)}² − 2 · ${fmt(s1, 1)} · ${fmt(s2, 1)} · cos ${g}°</span><span>d ≈ ${fmt(d)} km</span><span>cos ${g}° ≈ ${fmt(cosD(g), 3)}</span><span>Pythagoras (nur bei 90° richtig): ${fmt(Math.hypot(s1, s2))} km</span>`;
    });
  } else if (w === 'circle') {
    el.innerHTML = `<div class="wid">${slider('wa', 'Drehwinkel α', 0, 360, 1, 35, '°')}<div id="wsv"></div><div class="out" id="wo"></div></div>`;
    bind([['wa', '°']], a => {
      $('#wsv').innerHTML = svgCircle(a, { quad: true, alabel: a + '°' });
      $('#wo').innerHTML = `<span>Quadrant ${a % 90 === 0 ? '– (Achse)' : QUAD(a)}</span><span class="cb">cos α = ${fmt(cosD(a), 3)}</span><span class="ca">sin α = ${fmt(sinD(a), 3)}</span><span>tan α = ${Math.abs(cosD(a)) < 1e-9 ? 'nicht definiert' : fmt(tanD(a), 3)}</span><span>Riesenrad (r = 20 m, Achse 22 m): Höhe ${fmt(22 + 20 * sinD(a), 1)} m</span>`;
    });
  } else if (w === 'func') {
    el.innerHTML = `<div class="wid">${slider('wa', 'a (Amplitude)', -3, 3, 0.5, 1)}${slider('wb', 'b (Periode)', 0.5, 4, 0.5, 1)}${slider('wc', 'c (nach rechts)', -3, 3, 0.25, 0)}${slider('wd', 'd (nach oben)', -2, 2, 0.5, 0)}<div id="wo" class="out"></div><div id="wsv"></div><div class="leg"><span style="color:#d62839">━ sin x</span> <span style="color:#1d70b8">━ f(x)</span></div></div>`;
    bind([['wa', ''], ['wb', ''], ['wc', ''], ['wd', '']], (a, b, c, d) => {
      $('#wsv').innerHTML = svgGraph([Math.sin, x => a * Math.sin(b * (x - c)) + d], { xmin: -Math.PI, xmax: 2 * Math.PI, ymin: -5, ymax: 5, ystep: 1 });
      $('#wo').innerHTML = `<span>f(x) = ${fmt(a, 2)} · sin(${fmt(b, 2)} · (x − ${fmt(c, 2)})) + ${fmt(d, 2)}</span><span>Periode ≈ ${fmt(2 * Math.PI / b)}</span><span>Max ${fmt(d + Math.abs(a))} · Min ${fmt(d - Math.abs(a))}</span>`;
    });
  }
}
