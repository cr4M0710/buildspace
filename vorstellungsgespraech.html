<style>
:root{--bg:#eef1f4;--card:#ffffff;--ink:#1d2733;--mute:#5b6876;--line:#d3dae2;--acc:#2a5d9f;--accink:#ffffff;--good:#1b8a5a;--mid:#b86f0c;--bad:#c4364a;--mark:#ffe27a;--markink:#3a2f00;--soft:#e4ebf3;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a21;--card:#1e2731;--ink:#e8edf2;--mute:#9aa8b6;--line:#303c49;--acc:#6aa6ff;--accink:#0b1a2d;--good:#4fd098;--mid:#f0b25a;--bad:#ff7a8c;--mark:#5a4a10;--markink:#fff1b8;--soft:#263341}}
:root[data-theme="dark"]{--bg:#141a21;--card:#1e2731;--ink:#e8edf2;--mute:#9aa8b6;--line:#303c49;--acc:#6aa6ff;--accink:#0b1a2d;--good:#4fd098;--mid:#f0b25a;--bad:#ff7a8c;--mark:#5a4a10;--markink:#fff1b8;--soft:#263341}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;overflow:hidden}
.app{display:grid;grid-template-rows:minmax(190px,37%) 1fr;height:100%}
@media (min-width:900px){.app{grid-template-rows:none;grid-template-columns:1.25fr 1fr}}
#stage{position:relative;overflow:hidden;background:#cdd6df;touch-action:pan-y}
#stage canvas{display:block;width:100%;height:100%}
#nameTag{position:absolute;left:10px;bottom:10px;background:rgba(20,26,33,.72);color:#fff;padding:5px 10px;border-radius:8px;font-size:13px;max-width:70%}
#voiceBtn{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(20,26,33,.65);color:#fff;font-size:18px;cursor:pointer}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:64px;text-align:center}
#fallback span{font-size:14px;color:#33414f;max-width:80%}
#panel{overflow-y:auto;padding:14px 14px 28px;-webkit-overflow-scrolling:touch}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:26px;line-height:1.15;margin:2px 0 6px}
h2{font-size:18px;margin:20px 0 8px}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 8px}
.mute{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--accink);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.job{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.job[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.job .ic{font-size:28px;line-height:1}
.job b{display:block}
.tagc{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin-top:4px}
.lvls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lvl{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.lvl[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.lvl b{display:block}
input[type=text],textarea,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.topbar .grow{flex:1}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .4s}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft)}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:10px}
.meter .prog{flex:1;height:6px}
.meter .prog i{background:var(--good)}
.bubble{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:4px 14px 14px 14px;padding:10px 14px;margin:0 0 10px}
.bubble .who{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:2px}
.bubble.react{border-left-color:var(--mid)}
.scene{font-style:italic;color:var(--mute);margin:0 0 8px}
.task{background:var(--mark);color:var(--markink);border-radius:10px;padding:10px 14px;font-weight:700;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin:0 0 8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--acc);background:var(--soft)}
.opt.best{border-color:var(--good)}
.opt.wrong{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font:inherit;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:99px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--soft)}
.tipbox{background:var(--mark);color:var(--markink);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.pill{display:inline-block;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff}
.pill.g{background:var(--good)}.pill.m{background:var(--mid)}.pill.b{background:var(--bad)}
.notes{list-style:none;margin:6px 0 0;padding:0}
.notes li{padding-left:22px;position:relative;margin:2px 0;font-size:15px}
.notes li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700}
.notes li.no::before{content:"✗";color:var(--bad)}
.timer{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:0 0 10px}
.timer i{display:block;height:100%;background:var(--bad);width:100%}
.big{display:flex;align-items:center;gap:16px;margin:8px 0 12px}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:78px;height:78px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:700}
.cat{display:grid;grid-template-columns:90px 1fr 42px;gap:8px;align-items:center;margin:5px 0}
.cat .prog{height:10px}
details.card summary{cursor:pointer;font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;min-height:70px}
.msg{font-size:14px;margin:6px 0}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.sticky{position:sticky;bottom:-28px;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

 const formal=/^[A-ZÄÖÜ]/.test(t)&&/[.!?]$/.test(t);
 let st=15;
 if(slang){st=-10;notes.push({ok:0,msg:"Vermeide Umgangssprache und Floskeln wie „keine Ahnung“."})}
 else if(!formal){st=8;notes.push({ok:0,msg:"Beginne mit einem Großbuchstaben und schließe mit einem Satzzeichen ab."})}
 else notes.push({ok:1,msg:"Höflich und sauber formuliert."});
 s+=st;
 if(t.length<25){s=Math.min(s,15);notes.unshift({ok:0,msg:"Die Antwort ist viel zu kurz."})}
 return{s:clamp(Math.round(s),0,100),notes}}
