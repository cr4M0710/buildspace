<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kanban-Board</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #eef0f3;
    --border: #dfe2e6;
    --text: #172b4d;
    --text-dim: #5e6c84;
    --accent: #0052cc;
    --accent-2: #0747a6;
    --danger: #de350b;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(9,30,66,.15), 0 1px 4px rgba(9,30,66,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d21;
      --panel: #24282d;
      --panel-2: #2c3137;
      --border: #3a3f45;
      --text: #e6e8ec;
      --text-dim: #9aa3ad;
      --accent: #4c9aff;
      --accent-2: #85b8ff;
      --danger: #ff6b57;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    touch-action: manipulation;
  }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
  }
  button.danger { background: var(--danger); }
  button:active { filter: brightness(0.92); }
  input, textarea, select {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* ---------- Login ---------- */
  #loginScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #loginBox {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
  }
  #loginBox h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  #loginBox p.sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 20px;
  }
  #loginBox label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  #loginError {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }
  #loginBox button[type="submit"] { width: 100%; margin-top: 20px; padding: 12px; font-size: 16px; }
  #forgotLink {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }

  /* ---------- App shell ---------- */
  #appScreen { display: flex; flex-direction: column; height: 100dvh; }
  header#topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header#topbar h1 {
    font-size: 17px;
    margin: 0 8px 0 0;
    white-space: nowrap;
  }
  #boardSelect { max-width: 220px; flex: 1 1 140px; }
  #topbar .spacer { flex: 1; }
  #userLabel { font-size: 13px; color: var(--text-dim); margin-right: 4px; white-space: nowrap; }

  #boardArea {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  #emptyState {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
  }
  #emptyState button { margin-top: 14px; }

  .column {
    background: var(--panel-2);
    border-radius: var(--radius);
    width: 270px;
    min-width: 270px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 12px 6px;
    font-weight: 600;
    font-size: 14px;
  }
  .column-count {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 12px;
  }
  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }
  .column-body.drag-over { background: rgba(76,154,255,0.12); border-radius: 8px; }
  .column-footer { padding: 8px 10px 12px; }
  .column-footer button { width: 100%; }

  .card {
    background: var(--panel);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    cursor: grab;
    touch-action: none;
    user-select: none;
    position: relative;
  }
  .card.dragging { opacity: 0.35; }
  .card-title { font-size: 14px; line-height: 1.35; white-space: pre-wrap; }
  .card-desc {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
    white-space: pre-wrap;
  }
  .card-ghost {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    background: var(--panel);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    width: 246px;
    font-size: 14px;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(9,30,66,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 500;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius);
    width: 100%; max-width: 380px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .modal h2 { font-size: 16px; margin: 0 0 14px; }
  .modal label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 0 6px; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-actions .left { margin-right: auto; }

  [hidden] { display: none !important; }

  .top-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--text-dim); text-decoration:none; font-size:13.5px; font-weight:600;
    margin:10px 0 0 14px;
  }
  .top-link:hover{ color:var(--accent); }
</style>
<script defer data-category="schule" src="protect.js"></script>
<script defer src="cursor.js"></script>
</head>
<body>

<a class="top-link" href="index.html#/schule">← Zurück zu Schule</a>

<div id="loginScreen">
  <div id="loginBox">
    <h1>Kanban-Board</h1>
    <p class="sub">Bitte anmelden.</p>
    <form id="loginForm">
      <label for="email">E-Mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
      <div id="loginError"></div>
    </form>
    <a id="forgotLink">Passwort vergessen?</a>
  </div>
</div>

<div id="appScreen" hidden>
  <header id="topbar">
    <h1>Kanban-Board</h1>
    <select id="boardSelect"></select>
    <button id="newBoardBtn" class="secondary">+ Board</button>
    <button id="deleteBoardBtn" class="secondary" title="Board löschen">🗑</button>
    <div class="spacer"></div>
    <span id="userLabel"></span>
    <button id="logoutBtn" class="secondary">Abmelden</button>
  </header>
  <div id="boardArea">
    <div id="emptyState" hidden>
      <p>Noch kein Board vorhanden.</p>
      <button id="emptyCreateBtn">Erstes Board erstellen</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getDatabase, ref, get, set, update, push, onValue, off, remove, child
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAt35KpU63iGk8UAX5X4T5Vj18zPf_JUus",
  authDomain: "kanban-board-281da.firebaseapp.com",
  databaseURL: "https://kanban-board-281da-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kanban-board-281da",
  storageBucket: "kanban-board-281da.firebasestorage.app",
  messagingSenderId: "210909884248",
  appId: "1:210909884248:web:10ffacb3a74f7b3c887f2d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// ---------- DOM refs ----------
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('appScreen');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const forgotLink = document.getElementById('forgotLink');
const boardSelect = document.getElementById('boardSelect');
const newBoardBtn = document.getElementById('newBoardBtn');
const deleteBoardBtn = document.getElementById('deleteBoardBtn');
const userLabel = document.getElementById('userLabel');
const logoutBtn = document.getElementById('logoutBtn');
const boardArea = document.getElementById('boardArea');
const emptyState = document.getElementById('emptyState');
const emptyCreateBtn = document.getElementById('emptyCreateBtn');
const modalRoot = document.getElementById('modalRoot');

let currentUid = null;
let boardsListUnsub = null;
let currentBoardId = null;
let currentBoardUnsub = null;
let currentBoardData = null; // {title, ownerId, columns:{}, tasks:{}}

// ---------- Auth ----------
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    loginError.textContent = 'Anmeldung fehlgeschlagen: ' + friendlyAuthError(err);
  }
});

forgotLink.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) { loginError.textContent = 'Bitte zuerst E-Mail-Adresse eingeben.'; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    loginError.style.color = 'var(--text-dim)';
    loginError.textContent = 'E-Mail zum Zurücksetzen wurde gesendet.';
  } catch (err) {
    loginError.style.color = 'var(--danger)';
    loginError.textContent = friendlyAuthError(err);
  }
});

logoutBtn.addEventListener('click', () => signOut(auth));

function friendlyAuthError(err) {
  const code = err && err.code || '';
  if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) {
    return 'E-Mail oder Passwort ist falsch.';
  }
  if (code.includes('too-many-requests')) return 'Zu viele Versuche. Bitte später erneut versuchen.';
  return err.message || 'Unbekannter Fehler.';
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUid = user.uid;
    userLabel.textContent = user.email || '';
    loginScreen.hidden = true;
    appScreen.hidden = false;
    subscribeBoardsList(user.uid);
  } else {
    currentUid = null;
    loginScreen.hidden = false;
    appScreen.hidden = true;
    if (boardsListUnsub) { boardsListUnsub(); boardsListUnsub = null; }
    unsubscribeCurrentBoard();
    boardSelect.innerHTML = '';
    boardArea.innerHTML = '';
    boardArea.appendChild(emptyState);
  }
});

// ---------- Boards list ----------
function subscribeBoardsList(uid) {
  const listRef = ref(db, `users/${uid}/boards`);
  boardsListUnsub = onValue(listRef, async (snap) => {
    const ids = snap.exists() ? Object.keys(snap.val()) : [];
    if (ids.length === 0) {
      boardSelect.innerHTML = '';
      showEmptyState(true);
      unsubscribeCurrentBoard();
      return;
    }
    showEmptyState(false);
    // fetch titles
    const entries = await Promise.all(ids.map(async (id) => {
      const t = await get(ref(db, `boards/${id}/title`));
      return { id, title: t.exists() ? t.val() : '(ohne Titel)' };
    }));
    const previousSelection = currentBoardId;
    boardSelect.innerHTML = '';
    entries.forEach(({ id, title }) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = title;
      boardSelect.appendChild(opt);
    });
    const stillExists = entries.some(e => e.id === previousSelection);
    const toSelect = stillExists ? previousSelection : entries[0].id;
    boardSelect.value = toSelect;
    selectBoard(toSelect);
  });
}

function showEmptyState(show) {
  emptyState.hidden = !show;
  if (show) {
    boardArea.innerHTML = '';
    boardArea.appendChild(emptyState);
  }
}

boardSelect.addEventListener('change', () => selectBoard(boardSelect.value));

function selectBoard(boardId) {
  if (boardId === currentBoardId) return;
  currentBoardId = boardId;
  unsubscribeCurrentBoard();
  const bRef = ref(db, `boards/${boardId}`);
  currentBoardUnsub = onValue(bRef, (snap) => {
    currentBoardData = snap.val();
    if (currentBoardData) renderBoard();
  });
}

function unsubscribeCurrentBoard() {
  if (currentBoardUnsub) { currentBoardUnsub(); currentBoardUnsub = null; }
  currentBoardData = null;
}

// ---------- Create / delete board ----------
async function createBoard() {
  const title = await promptModal({ title: 'Neues Board', label: 'Name des Boards', placeholder: 'z.B. Mathe 8a' });
  if (!title) return;
  const newRef = push(ref(db, 'boards'));
  const boardId = newRef.key;
  const now = Date.now();
  await set(newRef, {
    title,
    ownerId: currentUid,
    createdAt: now,
    columns: {
      col_todo: { title: 'To Do', order: 0 },
      col_progress: { title: 'In Bearbeitung', order: 1 },
      col_done: { title: 'Erledigt', order: 2 }
    },
    tasks: {}
  });
  await set(ref(db, `users/${currentUid}/boards/${boardId}`), true);
  currentBoardId = boardId;
}

newBoardBtn.addEventListener('click', createBoard);
emptyCreateBtn.addEventListener('click', createBoard);

deleteBoardBtn.addEventListener('click', async () => {
  if (!currentBoardId || !currentBoardData) return;
  const ok = await confirmModal(`Board "${currentBoardData.title}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`);
  if (!ok) return;
  const idToDelete = currentBoardId;
  await remove(ref(db, `users/${currentUid}/boards/${idToDelete}`));
  await remove(ref(db, `boards/${idToDelete}`));
  currentBoardId = null;
});

// ---------- Rendering ----------
function renderBoard() {
  boardArea.innerHTML = '';
  const columns = currentBoardData.columns || {};
  const tasks = currentBoardData.tasks || {};

  const colIds = Object.keys(columns).sort((a, b) => (columns[a].order ?? 0) - (columns[b].order ?? 0));

  colIds.forEach((colId) => {
    const col = columns[colId];
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.columnId = colId;

    const taskIds = Object.keys(tasks)
      .filter(tid => tasks[tid].columnId === colId)
      .sort((a, b) => (tasks[a].order ?? 0) - (tasks[b].order ?? 0));

    colEl.innerHTML = `
      <div class="column-header">
        <span>${escapeHtml(col.title)}</span>
        <span class="column-count">${taskIds.length}</span>
      </div>
      <div class="column-body" data-column-id="${colId}"></div>
      <div class="column-footer"><button class="secondary add-card-btn">+ Karte</button></div>
    `;

    const body = colEl.querySelector('.column-body');
    taskIds.forEach(tid => body.appendChild(renderCard(tid, tasks[tid])));

    colEl.querySelector('.add-card-btn').addEventListener('click', () => addCard(colId, taskIds.length));

    boardArea.appendChild(colEl);
  });
}

function renderCard(taskId, task) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.taskId = taskId;
  el.innerHTML = `
    <div class="card-title">${escapeHtml(task.title || '')}</div>
    ${task.description ? `<div class="card-desc">${escapeHtml(task.description)}</div>` : ''}
  `;
  attachDrag(el, taskId);
  el.addEventListener('click', (e) => {
    if (el.dataset.justDragged === '1') { el.dataset.justDragged = '0'; return; }
    openEditCard(taskId, task);
  });
  return el;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Add / edit card ----------
async function addCard(colId, countInColumn) {
  const result = await formModal({
    title: 'Neue Karte',
    fields: [
      { name: 'title', label: 'Titel', type: 'text', required: true },
      { name: 'description', label: 'Beschreibung', type: 'textarea' }
    ]
  });
  if (!result) return;
  const newRef = push(ref(db, `boards/${currentBoardId}/tasks`));
  await set(newRef, {
    title: result.title,
    description: result.description || '',
    columnId: colId,
    order: countInColumn,
    createdAt: Date.now()
  });
}

async function openEditCard(taskId, task) {
  const result = await formModal({
    title: 'Karte bearbeiten',
    fields: [
      { name: 'title', label: 'Titel', type: 'text', required: true, value: task.title },
      { name: 'description', label: 'Beschreibung', type: 'textarea', value: task.description || '' }
    ],
    showDelete: true
  });
  if (result === 'delete') {
    await remove(ref(db, `boards/${currentBoardId}/tasks/${taskId}`));
    return;
  }
  if (!result) return;
  await update(ref(db, `boards/${currentBoardId}/tasks/${taskId}`), {
    title: result.title,
    description: result.description || ''
  });
}

// ---------- Drag & drop (pointer events, works with mouse + touch) ----------
let dragState = null;

function attachDrag(cardEl, taskId) {
  cardEl.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const rect = cardEl.getBoundingClientRect();
    dragState = {
      taskId,
      startX: e.clientX,
      startY: e.clientY,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      moved: false,
      ghost: null,
      sourceColumnId: cardEl.closest('.column-body').dataset.columnId,
      width: rect.width
    };
    cardEl.setPointerCapture(e.pointerId);
    cardEl.addEventListener('pointermove', onPointerMove);
    cardEl.addEventListener('pointerup', onPointerUp);
    cardEl.addEventListener('pointercancel', onPointerUp);
  });
}

function onPointerMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (!dragState.moved && Math.hypot(dx, dy) < 6) return;

  if (!dragState.moved) {
    dragState.moved = true;
    const cardEl = e.target.closest('.card');
    cardEl.classList.add('dragging');
    const ghost = document.createElement('div');
    ghost.className = 'card-ghost';
    ghost.textContent = cardEl.querySelector('.card-title').textContent;
    ghost.style.width = dragState.width + 'px';
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    dragState.cardEl = cardEl;
  }

  dragState.ghost.style.left = (e.clientX - dragState.offsetX) + 'px';
  dragState.ghost.style.top = (e.clientY - dragState.offsetY) + 'px';

  document.querySelectorAll('.column-body.drag-over').forEach(el => el.classList.remove('drag-over'));
  const target = document.elementFromPoint(e.clientX, e.clientY);
  const columnBody = target && target.closest('.column-body');
  if (columnBody) columnBody.classList.add('drag-over');
}

async function onPointerUp(e) {
  if (!dragState) return;
  const ds = dragState;
  dragState = null;
  const cardEl = ds.cardEl;
  if (cardEl) {
    cardEl.removeEventListener('pointermove', onPointerMove);
    cardEl.removeEventListener('pointerup', onPointerUp);
    cardEl.removeEventListener('pointercancel', onPointerUp);
  }
  if (ds.ghost) ds.ghost.remove();
  document.querySelectorAll('.column-body.drag-over').forEach(el => el.classList.remove('drag-over'));

  if (!ds.moved) return;
  if (cardEl) {
    cardEl.classList.remove('dragging');
    cardEl.dataset.justDragged = '1';
  }

  const target = document.elementFromPoint(e.clientX, e.clientY);
  const columnBody = target && target.closest('.column-body');
  if (!columnBody) return;
  const targetColumnId = columnBody.dataset.columnId;

  // Determine insertion index based on Y position among existing cards (excluding the dragged one)
  const siblings = Array.from(columnBody.querySelectorAll('.card')).filter(el => el.dataset.taskId !== ds.taskId);
  let insertIndex = siblings.length;
  for (let i = 0; i < siblings.length; i++) {
    const r = siblings[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { insertIndex = i; break; }
  }

  await moveTask(ds.taskId, ds.sourceColumnId, targetColumnId, insertIndex);
}

async function moveTask(taskId, sourceColId, targetColId, insertIndex) {
  const tasks = currentBoardData.tasks || {};

  const targetIds = Object.keys(tasks)
    .filter(tid => tasks[tid].columnId === targetColId && tid !== taskId)
    .sort((a, b) => (tasks[a].order ?? 0) - (tasks[b].order ?? 0));
  targetIds.splice(insertIndex, 0, taskId);

  const updates = {};
  targetIds.forEach((tid, idx) => {
    updates[`boards/${currentBoardId}/tasks/${tid}/order`] = idx;
    updates[`boards/${currentBoardId}/tasks/${tid}/columnId`] = targetColId;
  });

  if (sourceColId !== targetColId) {
    const sourceIds = Object.keys(tasks)
      .filter(tid => tasks[tid].columnId === sourceColId && tid !== taskId)
      .sort((a, b) => (tasks[a].order ?? 0) - (tasks[b].order ?? 0));
    sourceIds.forEach((tid, idx) => {
      updates[`boards/${currentBoardId}/tasks/${tid}/order`] = idx;
    });
  }

  await update(ref(db), updates);
}

// ---------- Generic modals ----------
function promptModal({ title, label, placeholder }) {
  return new Promise((resolve) => {
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal">
          <h2>${escapeHtml(title)}</h2>
          <label>${escapeHtml(label)}</label>
          <input id="mInput" type="text" placeholder="${placeholder ? escapeHtml(placeholder) : ''}">
          <div class="modal-actions">
            <button class="secondary" id="mCancel">Abbrechen</button>
            <button id="mOk">Erstellen</button>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('mInput');
    input.focus();
    const close = (val) => { modalRoot.innerHTML = ''; resolve(val); };
    document.getElementById('mCancel').addEventListener('click', () => close(null));
    document.getElementById('mOk').addEventListener('click', () => close(input.value.trim() || null));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') close(input.value.trim() || null); });
  });
}

function confirmModal(message) {
  return new Promise((resolve) => {
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal">
          <h2>Bestätigen</h2>
          <p>${escapeHtml(message)}</p>
          <div class="modal-actions">
            <button class="secondary" id="mCancel">Abbrechen</button>
            <button class="danger" id="mOk">Löschen</button>
          </div>
        </div>
      </div>`;
    const close = (val) => { modalRoot.innerHTML = ''; resolve(val); };
    document.getElementById('mCancel').addEventListener('click', () => close(false));
    document.getElementById('mOk').addEventListener('click', () => close(true));
  });
}

function formModal({ title, fields, showDelete }) {
  return new Promise((resolve) => {
    const fieldsHtml = fields.map(f => `
      <label for="f_${f.name}">${escapeHtml(f.label)}</label>
      ${f.type === 'textarea'
        ? `<textarea id="f_${f.name}">${escapeHtml(f.value || '')}</textarea>`
        : `<input id="f_${f.name}" type="text" value="${escapeHtml(f.value || '')}">`}
    `).join('');

    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal">
          <h2>${escapeHtml(title)}</h2>
          ${fieldsHtml}
          <div class="modal-actions">
            ${showDelete ? '<button class="danger left" id="mDelete">Löschen</button>' : ''}
            <button class="secondary" id="mCancel">Abbrechen</button>
            <button id="mOk">Speichern</button>
          </div>
        </div>
      </div>`;

    const close = (val) => { modalRoot.innerHTML = ''; resolve(val); };
    document.getElementById('mCancel').addEventListener('click', () => close(null));
    if (showDelete) {
      document.getElementById('mDelete').addEventListener('click', () => close('delete'));
    }
    document.getElementById('mOk').addEventListener('click', () => {
      const result = {};
      for (const f of fields) {
        const el = document.getElementById('f_' + f.name);
        result[f.name] = el.value.trim();
      }
      if (fields.some(f => f.required) && !result[fields.find(f => f.required).name]) return;
      close(result);
    });
    const first = document.getElementById('f_' + fields[0].name);
    if (first) first.focus();
  });
}
</script>
</body>
</html>
